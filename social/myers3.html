}

  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"brain",title:"הטרמה",blocks:[
  {h:"יואב, והמציאות שאנחנו בונים",html:`${def("על מה הנושא",`איך גירויים שאנחנו לא שמים לב אליהם משפיעים על הפירוש ועל ההתנהגות.<br><b>מה נלמד כאן:</b> יואב · הטרמה · זקנה והליכה · ריח ניקוי · גירויים תת־סיפיים`)}${ex("<b>יואב</b> (דמות בדויה להמחשה) סטודנט שנה ב׳, תומך נלהב של מפלגה מסוימת ומתכונן למבחן בסטטיסטיקה. נלווה אותו לאורך הלומדה ונראה איך האמונות, הזיכרון והאינטואיציה שלו מטעים אותו, ולפעמים עוזרים לו.")}<p>הפרק נפתח במקיין ובאובמה: כל אחד שינה עמדה, ותומכי הצד השני ראו בזה <b>צביעות</b>, בעוד שבצד שלהם ראו <b>גמישות</b>. הנקודה: איננו מגיבים למציאות כפי שהיא, אלא למציאות כפי שאנו <b>מבנים</b> אותה.</p>${def("הטרמה",`${E("Priming")} הפעלה של אסוציאציות מסוימות בזיכרון, שמשפיעה על מחשבה או פעולה אחרת, <b>גם בלי שנהיה מודעים</b> לכך.`)}`,q:"q1"},
  {h:"הטרמה בניסויים ובחיים",html:`${tiles([["clock","זקנה","מי שהשלים משפטים עם ״זקן״, ״חכם״, ״גמלאי״ הלך למעלית <b>לאט יותר</b>, בלי לשים לב (בארג׳)","זה ניסוי הטרמה: מילים שקשורות לזקנה ״הפעילו״ במוח את המושג זקנה, וזה השפיע על ההתנהגות עצמה, בלי שהמשתתפים היו מודעים לכך.","יואב קורא כתבה על בית אבות, ואחר כך, בלי לשים לב, הולך לתחנה קצת יותר לאט מהרגיל."],["check","ריח ניקוי","סטודנטים שהריחו חומר ניקוי השאירו את השולחן <b>נקי יותר</b> מפירורים"],["moon","סרט מפחיד","לבד בבית, רעש מהמקרר נשמע כמו פורץ"]])}<p>הטרמה עובדת גם עם גירויים <b>תת־סיפיים</b>, שמוצגים קצר מכדי לתפוס במודע: ״לחם״ מזרז זיהוי של ״חמאה״.</p>${rem("הלקח: חלק נכבד מעיבוד המידע החברתי שלנו הוא <b>אוטומטי</b>: לא מכוון, לא גלוי, ומחוץ למודעות.")}${ex("יואב קרא לפני השינה על הפרעות חרדה. למחרת, כשהלב שלו דופק לפני המבחן, הוא בטוח שיש לו ״התקף״. הקריאה <b>הטרימה</b> את הפירוש.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"scales",title:"תפיסה ופירוש של אירועים",blocks:[
  {h:"התקשורת ״נגדנו״",html:`${def("על מה הנושא",`איך האמונות המוקדמות שלנו משנות את מה שאנחנו רואים.<br><b>מה נלמד כאן:</b> הטיית תקשורת נתפסת · עונש מוות · הפנים של ״הנאצי״ · אפקט קולשוב`)}<p>ברוב המקרים אנחנו <b>מדייקים</b> בתפיסת אחרים. אבל כשהמידע <b>דו־משמעי</b>, התפיסות המוקדמות מכריעות.</p><p><b>ואלון ועמיתיו</b> (1985): סטודנטים <b>פרו־ישראלים ופרו־ערבים</b> צפו באותם דיווחי חדשות על הטבח בסברה ושתילה (1982). <b>שתי הקבוצות</b> חשבו שהדיווח מוטה <b>נגדן</b>.</p>${ex("יואב צופה בעימות טלוויזיוני ובטוח שהמועמד שלו ניצח. גם תומכי הצד השני בטוחים בכך. תומכים ראו את המועמד שלהם כמנצח ביחס של כ־<b>10:1</b>.")}`,q:"q5"},
  {h:"אותן ראיות, שני כיוונים",html:`<p><b>לורד ועמיתיו</b> (1979): תומכים ומתנגדים לעונש מוות קראו <b>אותם</b> שני מחקרים, אחד בעד ואחד נגד. כל צד קיבל את המחקר שתומך בו ופסל את השני. החשיפה לאותו מידע <b>הגבירה</b> את המחלוקת.</p><div class="tw"><table><tr><th>מחקר</th><th>מה נמצא</th></tr><tr><td><b>הפנים של האיש</b> (רותברט ובירל)</td><td>מי ששמע שהוא היה בגסטפו ראה הבעה <b>אכזרית</b>; מי ששמע שהציל יהודים ראה הבעה <b>חמה</b></td></tr><tr><td><b>אפקט קולשוב</b></td><td>אותן פנים ניטרליות נראו עצובות, מהורהרות או שמחות לפי הסצנה שלפניהן</td></tr><tr><td><b>העברת תכונה ספונטנית</b></td><td>מי שמכנה אחרים ״רכלנים״ נתפס בעצמו כרכלן</td></tr></table></div>${rem("״אִמרו לי היכן אתם רואים הטיה, ואומר לכם מהן עמדותיכם״.")}`,q:"q7"}
 ]},
 {id:"t3",icon:"lock",title:"השתמרות אמונה וזיכרון",blocks:[
  {h:"אמונה ששורדת את ההפרכה",html:`${def("על מה הנושא",`למה אמונות שורדות גם אחרי שהבסיס שלהן קרס, ואיך הזיכרון נבנה מחדש.<br><b>מה נלמד כאן:</b> השתמרות האמונה · הכבאים · לשקול את ההפך · בניית זיכרונות · עמדות והתנהגות בעבר`)}${def("השתמרות האמונה",`${E("Belief perseverance")} דבקות באמונה גם כשהבסיס שלה הופרך, כי <b>ההסבר</b> שבנינו לה שורד.`)}<p>רוס ועמיתיו שתלו אמונה, ביקשו להסביר <b>למה</b> היא נכונה, ואז גילו שהיא הומצאה. האמונה השתמרה ב־<b>75%</b>. בניסוי <b>הכבאים</b> (אנדרסון), מי שהסביר למה אנשים שמסתכנים הם כבאים טובים (״אמיצים״) המשיך להאמין בכך גם אחרי שנאמר לו שהמקרים בדויים.</p>${def("התרופה: להסביר את ההפך",`הוראה ״להיות אובייקטיבי״ <b>לא עזרה</b>. מה שעזר: לשאול ״מה הייתי חושב אם התוצאה הייתה <b>הפוכה</b>?״, או להסביר למה <b>התאוריה ההפוכה</b> נכונה.`)}`,q:"q9"},
  {h:"הזיכרון נבנה בזמן השליפה",html:`<p>כ־<b>85%</b> מהסטודנטים חשבו שהזיכרון הוא ״תיבת אחסון״. בפועל אנחנו <b>בונים</b> את הזיכרון בזמן השליפה, כמו חוקר מאובנים שמשחזר דינוזאור משברי עצמות.</p>${def("אפקט המידע המטעה",`${E("Misinformation effect")} עד ראייה שקיבל מידע שגוי אחרי האירוע <b>מטמיע</b> אותו בזיכרון: תמרור ״תן זכות קדימה״ נזכר כ״עצור״ (לופטוס). כ<b>רבע</b> מהאנשים ״נזכרו״ בחוויית ילדות בדויה שדמיינו.`)}${ex("סטודנטים ששמעו שבן שיחם <b>חיבב</b> אותם זכרו אותו רגוע ושמח; מי ששמע שלא חיבב, זכר אותו עצבני.")}`,q:"q11"},
  {h:"משכתבים את העבר",html:`<div class="tw"><table><tr><th>מה משוכתב</th><th>דוגמה</th></tr><tr><td><b>עמדות</b></td><td>סטודנטים שכתבו חיבור ושינו עמדה ״זכרו״ שתמיד חשבו כך (בם ומקונל)</td></tr><tr><td><b>חוויות</b></td><td>טיולים נזכרים כ<b>נעימים יותר</b> ממה שהיו (משקפיים ורודים)</td></tr><tr><td><b>מערכות יחסים</b></td><td>מי שהתאהב יותר ״זוכר״ אהבה ממבט ראשון; מי שנפרד ״זוכר״ שתמיד היה אנוכי</td></tr><tr><td><b>התנהגות</b></td><td>אחרי מסר על צחצוח שיניים, סטודנטים ״זכרו״ שצחצחו יותר</td></tr></table></div><p>מי שהשקיע בטיפול או בדיאטה זוכר את העבר <b>גרוע</b> ממה שהיה, ולכן מרגיש שהשתפר הרבה. גרינוולד: לכולנו יש <b>״אגו טוטליטרי״</b>.</p>`,q:"q13"}
 ]},
 {id:"t4",icon:"bulb",title:"שיפוטים אינטואיטיביים",blocks:[
  {h:"שתי מערכות",html:`${def("על מה הנושא",`מה האינטואיציה יודעת, ואיפה היא נכשלת.<br><b>מה נלמד כאן:</b> עיבוד מבוקר ואוטומטי · סכמות · רגש · מומחיות · זיכרון חבוי · גבולות`)}<div class="tw"><table><tr><th>עיבוד מבוקר</th><th>עיבוד אוטומטי</th></tr><tr><td>גלוי (explicit): מחושב, רפלקטיבי, <b>מודע</b></td><td>חבוי (implicit): נטול מאמץ, <b>לא מודע</b>, ״אינטואיציה״</td></tr></table></div><p>החלק האוטומטי <b>גדול</b> יותר ממה שחשבו. דוגמאות: <b>סכמות</b> (״לשנן״ או ״לשמן״), <b>תגובות רגשיות</b> (מסלול מהיר לאמיגדלה, לפני הקורטקס), ו<b>מומחיות</b> (רב־אמן בשחמט ״רואה״ את המהלך).</p>`,q:"q15"},
  {h:"כוחה וגבולותיה",html:`${tiles([["hand","זיכרון חבוי","מטופלת שלא זכרה את הרופא סירבה ללחוץ את ידו אחרי שדקר אותה בנעץ","אפשר ״לזכור״ משהו בלי לדעת שזוכרים אותו. הזיכרון לא נגיש לתודעה, אבל עדיין משפיע על ההתנהגות.","המטופלת לא זכרה שפגשה את הרופא, אבל משהו בה ״ידע״ שהוא מכאיב, ולכן נמנעה מללחוץ את ידו."],["id","ראייה עיוורת","״לא רואים כלום״, אבל מנחשים נכון את כיוון המקלות","אחרי פגיעה במוח, אדם אומר שהוא לא רואה כלום, אבל מצליח לנחש נכון מה מוצג לו. המוח מעבד את המידע גם בלי מודעות.","הנבדק בטוח שהוא סתם מנחש אם המקל אנכי או אופקי, אבל צודק הרבה יותר ממה שניחוש היה מאפשר."],["data","החלטה עם הסחה","בבחירת דירה, מי שדעתו הוסחה בחר הכי טוב (דייקסטרהאוס; שנוי במחלוקת)"]])}${rem("יש גם גבולות: אין ראיות שקלטות ״תת־סיפיות״ ״מתכנתות מחדש״ את התודעה. חולי ״מוח מפוצל״ <b>ממציאים</b> הסברים להתנהגות שלהם.")}${ex("יואב מתלבט בין שתי דירות. אחרי שהוא ״ישן על זה״, הבחירה ברורה לו. ייתכן שהעיבוד האוטומטי עשה כאן עבודה טובה.")}`,q:"q17"}
 ]},
 {id:"t5",icon:"target",title:"ביטחון יתר והטיית האישוש",blocks:[
  {h:"בטוחים מדי",html:`${def("על מה הנושא",`למה אנחנו בטוחים יותר ממה שאנחנו צודקים, ואיך מצמצמים את זה.<br><b>מה נלמד כאן:</b> ביטחון יתר · דאנינג־קרוגר · כשל התכנון · מומחים · הטיית האישוש · תרופות`)}${def("ביטחון יתר בהיסק",`${E("Overconfidence phenomenon")} הנטייה להפריז בדיוק של השיפוטים שלנו. אצל כהנמן וטברסקי, תשובות ש״בטוחים בהן ב־98%״ היו שגויות ב־<b>30%</b>.`)}<div class="tw"><table><tr><th>מצב</th><th>צדקו</th><th>היו בטוחים</th></tr><tr><td>ניבוי תשובות של זר</td><td>63%</td><td>75%</td></tr><tr><td>ניבוי תשובות של שותף לדירה</td><td>68%</td><td>78%</td></tr><tr><td>מומחים פוליטיים (טטלוק)</td><td>פחות מ־40%</td><td>יותר מ־80%</td></tr></table></div>`,q:"q19"},
  {h:"בורות על הבורות, וכשל התכנון",html:`${def("קרוגר ודאנינג",`דווקא מי שקיבל את הציונים <b>הנמוכים</b> ביותר בדקדוק, הומור והיגיון <b>מפריז</b> ביכולתו. צריך יכולת כדי לזהות חוסר יכולת. במשימות <b>קשות מאוד</b> החלשים כן מבינים שהם חלשים.`)}${def("כשל התכנון",`מעריכים בחסר כמה זמן ייקח לסיים. אצטדיון מונטריאול: הגג לבדו עלה 120 מיליון דולר, כמו האומדן לכל האצטדיון. ה״Big Dig״ בבוסטון: 2.6 מיליארד הפכו ל־14.6.`)}${ex("יואב בטוח ב־90% שיסיים את העבודה תוך יומיים. זה לוקח לו שבוע. סטודנטים שהיו בטוחים ב־100% בניבוי על עצמם טעו ב־15%.")}<p>מומחים שטעו אמרו ״<b>כמעט</b> צדקתי״, וכך שמרו על הביטחון.</p>`,q:"q21"},
  {h:"הטיית האישוש, ומה עוזר",html:`${def("הטיית האישוש",`${E("Confirmation bias")} הנטייה לחפש מידע ש<b>מאשש</b> את מה שאנחנו כבר מאמינים. <b>ווסון</b>: הכלל ל־2,4,6 היה ״מספרים עולים״. רוב המשתתפים בדקו רק סדרות שמאשרות את הניחוש שלהם (8,10,12), ו־<b>23 מתוך 29</b> שכנעו את עצמם בכלל שגוי.`)}<p><b>אימות עצמי</b>: אנחנו מחפשים חברים ומשוב שמאשרים את התפיסה העצמית שלנו, גם כשהיא לא חיובית.</p>${tiles([["chart","משוב מיידי","חזאים ומהמרים בסוסים מקבלים משוב יומי, ומעריכים טוב את הסיכוי שלהם"],["split","לפרק משימה","הערכת זמן לכל חלק נותנת הערכה מציאותית יותר"],["question","למה אני טועה?","לחשוב על סיבה טובה אחת שבגללה השיפוט שגוי"]])}`,q:"q23"}
 ]},
 {id:"t6",icon:"gear",title:"היריסטיקות ומחשבות ״אילו״",blocks:[
  {h:"יציגות",html:`${def("על מה הנושא",`קיצורי דרך מנטליים: מהירים, לרוב טובים, ולפעמים מטעים.<br><b>מה נלמד כאן:</b> היריסטיקה · יציגות · שיעור בסיס · זמינות · מחשבות ״אילו״`)}${def("היריסטיקה",`${E("Heuristic")} אסטרטגיית חשיבה פשוטה שמאפשרת שיפוט <b>מהיר ויעיל</b>.`)}${def("היריסטיקת היציגות",`שיפוט לפי <b>הדמיון</b> לחבר טיפוסי בקטגוריה, תוך התעלמות מההסתברות.`)}<p><b>פלג</b> תואר כגרוש שאוהב לריב: יותר מ־80% אמרו ״עורך דין״. גם כשנאמר ש־<b>70%</b> מהמדגם מהנדסים, ההערכה <b>לא השתנתה</b>: התעלמו מ<b>שיעור הבסיס</b>.</p><p><b>ליאת</b> (פילוסופיה, אפליה, הפגנות): רוב האנשים אמרו שסביר יותר שהיא ״כספרית <b>ופמיניסטית</b>״ מאשר ״כספרית״. אבל הסיכוי לשני דברים יחד <b>לא יכול</b> להיות גדול מהסיכוי לאחד מהם.</p>`,q:"q25"},
  {h:"זמינות",html:`${def("היריסטיקת הזמינות",`${E("Availability heuristic")} שיפוט שכיחות לפי כמה <b>קל להיזכר</b> בדוגמאות.`)}<div class="tw"><table><tr><th>דוגמה</th><th>מה קרה</th></tr><tr><td>עירק או טנזניה?</td><td>רוב האנשים אמרו עירק (28 מיליון), אבל בטנזניה 40 מיליון</td></tr><tr><td>רשימת שמות</td><td>שמות <b>מפורסמים</b> מאחד המינים גרמו להעריך שהמין הזה היה רוב</td></tr><tr><td>טיסה מול נהיגה</td><td>נהיגה מסוכנת פי <b>230</b>; אחרי 11 בספטמבר, כ־<b>350</b> הרוגים נוספים בכבישים</td></tr></table></div>${rem("אנחנו ממהרים להסיק ממקרה <b>אחד ברור</b> על כלל, ולא מכלל על מקרה. התוצאה: ״<b>הזנחת ההסתברות</b>״, פחד מהדברים הלא נכונים.")}`,q:"q27"},
  {h:"מחשבות ״אילו״",html:`${def("מחשבות ״אילו״",`${E("Counterfactual thinking")} דמיון של תוצאה חלופית שהייתה יכולה לקרות. ככל שקל יותר לדמיין אותה, הרגש חזק יותר.`)}${fig("podium44","זוכי <b>ארד</b> (״כמעט בלי מדליה״) שמחים יותר מזוכי <b>כסף</b> (״כמעט זהב״).")}${ex("יואב קיבל <b>89</b> וחבר שלו קיבל 81. יואב מרגיש <b>גרוע</b> יותר: חסרה לו נקודה אחת ל־90.")}<p>שינוי תשובה במבחן מ<b>שגויה לנכונה</b> שכיח יותר מההפך, למרות התחושה. בטווח הארוך מתחרטים יותר על מה ש<b>לא</b> עשינו.</p>`,q:"q29"}
 ]},
 {id:"t7",icon:"cycle",title:"מתאם מדומה, שליטה ומצב רוח",blocks:[
  {h:"קשרים שאינם קיימים",html:`${def("על מה הנושא",`איך אנחנו ״מוצאים״ סדר באקראיות, ואיך מצב הרוח צובע את השיפוט.<br><b>מה נלמד כאן:</b> מתאם מדומה · אשליית השליטה · רגרסיה לממוצע · מצב רוח`)}${def("מתאם מדומה",`${E("Illusory correlation")} תפיסת קשר שאינו קיים. מי שהאמין בזריעת עננים ״ראה״ קשר לגשם בנתונים <b>אקראיים</b>. חבר מתקשר כשחשבנו עליו, ואנחנו לא זוכרים את כל הפעמים שזה לא קרה.`)}${def("אשליית השליטה",`${E("Illusion of control")} תחושה שאירועים מקריים נתונים לשליטתנו. מי ש<b>בחר בעצמו</b> כרטיס הגרלה דרש עליו מחיר גבוה פי <b>4</b> (לנגר). מהמרים זורקים קובייה בעדינות למספר נמוך ובכוח לגבוה.`)}`,q:"q31"},
  {h:"רגרסיה לממוצע",html:`${def("רגרסיה אל הממוצע",`${E("Regression toward the average")} תוצאות קיצוניות נוטות לחזור לכיוון הממוצע. אחרי ציון מצוין, הציון הבא צפוי להיות נמוך יותר; אחרי ציון גרוע, גבוה יותר.`)}<p><b>שפנר</b> (1985): סטודנטים ״חינכו״ את תום (דמיוני) להגיע עד 8:30. זמני ההגעה היו <b>אקראיים</b> בין 8:20 ל־8:40, ובכל זאת אחרי נזיפה הוא ״השתפר״. רוב הסטודנטים סיימו בתחושה שהנזיפות <b>עבדו</b>.</p>${ex("יואב נכשל בבוחן, נרשם לשיעור יוגה, ובבוחן הבא קיבל ציון טוב יותר. ייתכן שהיוגה לא עשתה דבר: אחרי שפל, כמעט כל דבר ״עוזר״.")}`,q:"q33"},
  {h:"מצב רוח ושיפוט",html:`<p>במצב רוח <b>טוב</b> העולם נראה ידידותי: מי שקיבל מתנה קטנה דירג את המכונית והטלוויזיה שלו גבוה יותר; אוהדי הקבוצה המנצחת העריכו שמלחמה פחות סבירה. במצב רוח <b>רע</b> נזכרים באירועים שליליים.</p>${def("פורגס ועמיתיו (1984)",`אנשים צפו בווידאו של עצמם משוחחים. במצב רוח טוב (בהיפנוזה) ראו את עצמם נינוחים וחברותיים; במצב רוח רע, <b>נוקשים ועצבניים</b>. ואנחנו מייחסים את השינוי <b>לעולם</b>, לא למצב הרוח.`)}${rem("בעוררות רגשית (כעס, או אפילו שמחה גדולה) נוטים לשפוט מהר ולפי <b>סטראוטיפים</b>.")}`,q:"q35"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מהי הטרמה?","a":"הפעלת אסוציאציות שמשפיעה על מחשבה או פעולה","w":["חזרה מכוונת על חומר כדי לזכור אותו טוב יותר","שיפוט מוקדם של אדם לפני שמכירים אותו לעומק","מצב שבו מידע חדש מוחק זיכרון ישן"],"e":"הטרמה מפעילה אסוציאציות, לפעמים בלי שנהיה מודעים לכך, ומשפיעה על פירוש ועל התנהגות."},{"q":"מה הלקח הכללי ממחקרי ההטרמה, לפי הפרק?","a":"חלק גדול מעיבוד המידע שלנו הוא אוטומטי","w":["אנחנו מודעים כמעט לכל מה שמשפיע עלינו","הטרמה פועלת רק כשהגירוי מוצג זמן רב","רק אנשים עם זיכרון חלש מושפעים מהטרמה"],"e":"העיבוד לא מכוון, לא גלוי, ומחוץ למודעות."}]},"q2":{"t":"t1","v":[{"q":"מה מצא בארג׳ אצל מי שהשלים משפטים עם מילים כמו ״זקן״ ו״גמלאי״?","a":"הם הלכו לאט יותר בלי לשים לב","w":["הם נזכרו ביותר מילים הקשורות לזקנה","הם דיווחו שהם מרגישים עייפים","הם הלכו מהר יותר כדי להרגיש צעירים"],"e":"המילים הטרימו ״זקנה״, וזה השפיע על קצב ההליכה. המשתתפים לא היו מודעים לכך."}]},"q3":{"t":"t1","v":[{"q":"מה קרה לסטודנטים שנחשפו לריח של חומר ניקוי?","a":"השאירו את השולחן נקי יותר","w":["התלוננו על הריח החזק בחדר","לא הושפעו מהריח בשום צורה","אכלו פחות עוגיות מהרגיל"],"e":"הם גם זיהו מהר יותר מילים של ניקיון, בלי להיות מודעים לריח."},{"q":"מהו גירוי תת־סיפי?","a":"גירוי שמוצג קצר מכדי לתפוס במודע","w":["גירוי חזק במיוחד שקשה להתעלם ממנו","גירוי שמוצג רק לאוזן אחת","גירוי שאדם בוחר להתעלם ממנו"],"e":"גם גירויים כאלה יכולים להטרים: ״לחם״ תת־סיפי מזרז זיהוי של ״חמאה״."}]},"q4":{"t":"t1","v":[{"q":"יואב קרא על הפרעות חרדה, ולמחרת פירש דפיקות לב כהתקף. מה זה מדגים?","a":"הטרמה של פירוש","w":["הטיית האישוש","השתמרות אמונה","אפקט המידע המטעה"],"e":"הקריאה הפעילה אסוציאציות שהשפיעו על הפירוש של התחושה, כמו אצל סטודנטים לרפואה."}]},"q5":{"t":"t2","v":[{"q":"מה מצאו ואלון ועמיתיו אצל סטודנטים פרו־ישראלים ופרו־ערבים?","a":"שתי הקבוצות ראו בדיווח הטיה נגדן","w":["רק הפרו־ערבים ראו הטיה בדיווח","שתי הקבוצות ראו בדיווח הטיה בעדן","שתי הקבוצות חשבו שהדיווח ניטרלי"],"e":"אותו דיווח נתפס כעוין על ידי שני הצדדים. זו הטיית התקשורת הנתפסת."},{"q":"מתי התפיסות המוקדמות משפיעות הכי הרבה?","a":"כשהמידע דו־משמעי","w":["כשהמידע ברור וחד־משמעי","כשאין שום מידע מוקדם","כשהמידע מגיע ממומחה"],"e":"כשאפשר לפרש מידע בכמה דרכים, האמונות שלנו קובעות את הפירוש."}]},"q6":{"t":"t2","v":[{"q":"מה קורה בדרך כלל לתומכים אחרי עימות טלוויזיוני?","a":"כל צד חושב שהמועמד שלו ניצח","w":["רוב הצופים משנים את עמדתם","שני הצדדים מסכימים מי ניצח","התמיכה במועמדים נחלשת"],"e":"היחס היה בערך 10:1 לטובת ״המועמד שלי״, והאהדה עשויה אף להתחזק."}]},"q7":{"t":"t2","v":[{"q":"מה מצא לורד (1979) על תומכים ומתנגדים לעונש מוות?","a":"אותו מידע מעורב הגביר את המחלוקת","w":["אותו מידע מעורב קירב את העמדות","שני הצדדים קיבלו את שני המחקרים","רק המתנגדים היו ביקורתיים"],"e":"כל צד קיבל את המחקר שתומך בו ופסל את השני."},{"q":"מה הראה המחקר על הפנים של האיש שתואר כאיש גסטפו או כמציל יהודים?","a":"נראו אכזריות או חמות לפי מה שנאמר","w":["כולם ראו את אותה הבעה בדיוק","אנשים זיהו נכון את האיש לפי פניו","ההבעה נשפטה רק לפי השפם"],"e":"המידע המוקדם שינה את תפיסת ההבעה (רותברט ובירל)."}]},"q8":{"t":"t2","v":[{"q":"מהו אפקט קולשוב?","a":"פנים ניטרליות נתפסות לפי הסצנה שלפניהן","w":["שחקנים מתאימים את ההבעה לסצנה שלפניה","צופים זוכרים פנים טוב יותר מאשר סצנות","פנים מוכרות נראות לנו מושכות יותר"],"e":"אותן פנים נראו עצובות אחרי אישה מתה, ושמחות אחרי ילדה משחקת."},{"q":"מהי העברת תכונה ספונטנית?","a":"מה שאנחנו אומרים על אחרים נקשר אלינו","w":["תכונות עוברות מההורים לילדים שלהם","אנחנו מעתיקים בלי לשים לב תכונות של חברים","תכונה של קבוצה מיוחסת לכל אחד מחבריה"],"e":"מי שקורא לאחרים ״רכלנים״ עשוי להיתפס בעצמו כרכלן."}]},"q9":{"t":"t3","v":[{"q":"מהי השתמרות האמונה?","a":"דבקות באמונה גם אחרי שהבסיס שלה הופרך","w":["שינוי מהיר של אמונה אחרי ראיה חדשה","שמירה על אמונות שקיבלנו מההורים","הנטייה לזכור רק אמונות חיוביות"],"e":"ההסבר שבנינו לאמונה שורד גם כשהמידע המקורי מוכחש."},{"q":"למה האמונה השתמרה אצל 75% אחרי שנאמר שהמידע הומצא?","a":"כי ההסברים שבנו לה המשיכו להתקיים","w":["כי לא האמינו לחוקרים שהמידע בדוי","כי שכחו שהמידע הוכחש","כי האמונה הייתה נכונה בפועל"],"e":"ברגע שהסברנו למה משהו נכון, ההסבר מקבל חיים משלו."}]},"q10":{"t":"t3","v":[{"q":"מה עזר לצמצם השתמרות אמונה?","a":"לחשוב למה ההפך עשוי להיות נכון","w":["להנחות אותם להיות אובייקטיביים","לחזור שוב ושוב על המידע המקורי","לתת להם יותר זמן לחשוב על זה"],"e":"ההוראה ״היו אובייקטיביים״ לא עזרה. לשקול את ההפך הפחית את ההטיה מאוד."}]},"q11":{"t":"t3","v":[{"q":"איך הזיכרון עובד, לפי המחקר?","a":"אנחנו בונים את הזיכרון מחדש בזמן השליפה","w":["הזיכרון הוא תיבת אחסון של העתקים מדויקים","הזיכרון נמחק אחרי כמה שנים בדיוק","כל מה שחווינו נשמר בשלמותו"],"e":"כ־85% מהסטודנטים חשבו שהזיכרון הוא תיבת אחסון. המחקר הראה שזה לא נכון."},{"q":"מהו אפקט המידע המטעה?","a":"הטמעת מידע שגוי שהתקבל אחרי האירוע","w":["שכחת אירוע בגלל מידע שקדם לו","הנטייה לשקר לגבי אירועים מביכים","בלבול בין שני אירועים דומים"],"e":"לופטוס: ״תן זכות קדימה״ נזכר כ״עצור״ אחרי מידע מטעה."}]},"q12":{"t":"t3","v":[{"q":"כמה מהאנשים ״נזכרו״ בחוויית ילדות בדויה שדמיינו?","a":"כרבע","w":["כמעט כולם","אף אחד","כ־90%"],"e":"לופטוס וברנשטיין: כרבע זכרו את האירוע הבדוי כאילו קרה."}]},"q13":{"t":"t3","v":[{"q":"סטודנטים כתבו חיבור ושינו עמדה. מה הם ״זכרו״ על העמדה הקודמת?","a":"שתמיד חשבו כמו עכשיו","w":["שהעמדה הקודמת הייתה הפוכה לגמרי","שלא הייתה להם עמדה בכלל","שהחיבור לא השפיע עליהם"],"e":"בם ומקונל: הם בנו מחדש את העמדה הקודמת לפי העמדה הנוכחית."},{"q":"מה ״זוכרים״ זוגות שנפרדו על בן הזוג לשעבר?","a":"שתמיד היו בו סימני אנוכיות","w":["שהיה מושלם עד הרגע האחרון","שלא היה ביניהם שום קשר","שהם אשמים בכל מה שקרה"],"e":"הרגשות הנוכחיים מכוונים את השליפה מהזיכרון."}]},"q14":{"t":"t3","v":[{"q":"למה אנשים בתכניות לשיפור עצמי מדווחים על תועלת רבה מהשיפור הקטן?","a":"הם זוכרים את העבר גרוע ממה שהיה","w":["הם באמת השתפרו מאוד בזכות התכנית","הם מנסים לרצות את המטפל או המדריך","הם לא זוכרים את התכנית עצמה"],"e":"אחרי השקעה גדולה, ״קודם הייתי במצב גרוע יותר״."},{"q":"מה טען גרינוולד על ״האגו הטוטליטרי״?","a":"אנחנו משכתבים את העבר לפי ההווה","w":["אנחנו שולטים באחרים כדי להרגיש טוב","אנחנו זוכרים רק כישלונות מהעבר","אנחנו מעדיפים מנהיגים סמכותיים"],"e":"כמ יות יותר","ממוצעים משתנים לאורך זמן","חזרה להרגל ישן אחרי שינוי"],"e":"אחרי ציון מצוין, הבא צפוי להיות נמוך יותר, ולהפך."},{"q":"למה סטודנטים בניסוי של שפנר חשבו שהנזיפות לתום עבדו?","a":"אחרי איחור קיצוני, הבא מוקדם יותר","w":["תום באמת שיפר את זמן ההגעה שלו","הנזיפות הפחידו את תום","המחשב תוכנת להגיב לנזיפות"],"e":"הזמנים היו אקראיים. זו רגרסיה לממוצע, שיצרה אשליית שליטה."}]},"q34":{"t":"t7","v":[{"q":"יואב נכשל, התחיל יוגה, והשתפר. מה ההסבר האפשרי לפי הפרק?","a":"רגרסיה לממוצע","w":["מתאם מדומה","היריסטיקת יציגות","הטיית האישוש"],"e":"אחרי שפל, כמעט כל ניסיון ״עוזר״ כי הציון נוטה לחזור לממוצע."}]},"q35":{"t":"t7","v":[{"q":"מה מצאו פורגס ועמיתיו כשאנשים צפו בווידאו של עצמם?","a":"במצב רוח רע ראו את עצמם עצבניים","w":["מצב הרוח לא השפיע על השיפוט","במצב רוח טוב ראו את עצמם עצבניים","כולם ראו את עצמם באופן חיובי"],"e":"ואנחנו מייחסים את השינוי לעולם, לא למצב הרוח שלנו."},{"q":"איך מצב רוח טוב משפיע על השיפוט?","a":"העולם נראה ידידותי יותר","w":["אנחנו ביקורתיים יותר","אנחנו נזכרים באירועים שליליים","אין לו השפעה על השיפוט"],"e":"מי שקיבל מתנה קטנה דירג את המכונית והטלוויזיה שלו גבוה יותר."}]},"q36":{"t":"t7","v":[{"q":"מה קורה לשיפוט בעוררות רגשית חזקה?","a":"שופטים מהר ולפי סטראוטיפים","w":["שופטים לאט ובזהירות רבה","נמנעים לחלוטין מכל שיפוט","שופטים בדיוק רב יותר מהרגיל"],"e":"גם בכעס וגם בשמחה גדולה, מחשבות של מצב הרוח מסיחות מחשיבה מורכבת."}]}};
const H={"h1":{"t":"t1","v":[{"q":"נועה צפתה לבד בסרט אימה, ואחר כך כל רעש מהמטבח נשמע לה כמו פורץ. מה מסביר את זה?","a":"הטרמה: הסרט הפעיל אסוציאציות של סכנה, בלי שהיא מודעת","w":["השתמרות אמונה: היא האמינה שיש פורץ גם אחרי שבדקה","אשליית שליטה: היא חשבה שתוכל למנוע פריצה","היריסטיקת זמינות: היא זכרה הרבה פריצות מהחדשות"],"e":"הסרט ״הדליק״ רעיונות של סכנה, והם השפיעו על הפירוש של רעשים עמומים. זו הטרמה, והיא פועלת בלי מודעות."},{"q":"סטודנט לרפואה לומד על תסמינים של מחלת לב, ומאותו ערב כל דקירה בחזה מדאיגה אותו. איך מסביר זאת הספר?","a":"הקריאה הטרימה אותו לפרש תחושות רגילות כתסמינים","w":["הוא באמת חולה, והלימוד רק עזר לו לזהות זאת","זו הטיית אישוש, כי הוא מחפש מידע שמפריך את החשש","זו רגרסיה לממוצע, כי הדקירות היו קיצוניות במיוחד"],"e":"הספר מביא דוגמה כזו: קריאה על מחלות מטרימה סטודנטים לרפואה לפרש עצירות, חום או כאב ראש כמחלה."}]},"h2":{"t":"t1","v":[{"q":"מקרינים מילה במהירות שאי אפשר לראות במודע, ובכל זאת היא מזרזת זיהוי של מילה קשורה. מה זה מראה?","a":"הטרמה פועלת גם כשהגירוי תת־סיפי, מתחת למודעות","w":["גירויים תת־סיפיים משנים התנהגות לאורך זמן, כמו בקלטות","המשתתפים ראו את המילה במודע אבל שכחו שראו אותה","זיהוי מהיר נובע מביטחון יתר ולא מהגירוי עצמו"],"e":"״לחם״ שהבזיק תת־סיפית זירז את זיהוי ״חמאה״. אבל הספר מזהיר: אין ראיות שקלטות תת־סיפיות משנות התנהגות בחיים."}]},"h3":{"t":"t2","v":[{"q":"אוהדים של שתי קבוצות צופים באותו שיפוט שנוי במחלוקת. כל צד בטוח שהשופט הטה את המשחק נגדו. לאיזה מחקר זה דומה?","a":"לואלון: שני הצדדים ראו הטיה נגדם באותו סיקור","w":["ללורד: שני הצדדים התקרבו בעמדות אחרי אותו מידע","לרותברט ובירל: שני הצדדים ראו אותן פנים באותו אופן","ללופטוס: שני הצדדים שכחו את מה שראו במשחק"],"e":"כמו פרו־ישראלים ופרו־ערבים שראו את אותו סיקור של סברה ושתילה, וכל צד מצא בו הטיה נגדו."}]},"h4":{"t":"t2","v":[{"q":"משרד ממשלתי שולח לשני צדדים בוויכוח דוח עם ממצאים לכאן ולכאן, בתקווה לקרב ביניהם. לפי הספר, מה כנראה יקרה?","a":"המחלוקת תגבר, כי כל צד יקבל את מה שתומך בו","w":["הצדדים יתקרבו, כי שניהם קיבלו מידע מאוזן","הצדדים יתעלמו מהדוח, כי הוא לא חד־משמעי","הצד החלש יותר ישנה דעה, כי הוא פחות בטוח"],"e":"כמו בניסוי של לורד על עונש מוות: אותו מידע מעורב גרם לכל צד להיות בטוח יותר בעמדתו."}]},"h5":{"t":"t2","v":[{"q":"מראים לשתי קבוצות את אותה תמונה של איש. לאחת אומרים שהוא היה מפקד גסטפו, ולשנייה שהוא הציל יהודים. מה יקרה?","a":"הראשונה תראה אכזריות, והשנייה חום, לפי המידע","w":["שתי הקבוצות יראו בפנים אותו דבר, כי הפנים לא השתנו","הראשונה תראה בפנים חום, כדי לאזן את המידע השלילי","שתי הקבוצות יתקשו לשפוט, כי המידע סותר את הפנים"],"e":"זה הניסוי של רותברט ובירל: מה שאנחנו כבר יודעים על אדם משנה את מה שאנחנו ״רואים״ בפנים שלו."}]},"h6":{"t":"t3","v":[{"q":"אמרו לשירה שהקולגה החדשה ״מתנשאת״, ואחר כך התברר שזה בכלל היה מישהי אחרת. שירה עדיין מרגישה שהקולגה מתנשאת. למה?","a":"השתמרות אמונה: ההסבר שבנתה לעצמה שרד גם בלי הבסיס","w":["אישור התנהגותי: הקולגה באמת התחילה להתנשא בעקבותיה","זיכרון חבוי: שירה לא זוכרת שהשמועה הופרכה","הטיית זמינות: שירה זוכרת הרבה אנשים מתנשאים"],"e":"כמו בניסוי הכבאים: מי שבנה הסבר לאמונה ממשיך להאמין בה גם אחרי שמגלים לו שהבסיס היה שגוי."},{"q":"לפי הספר, מה הדרך הכי יעילה לגרום לאדם לוותר על אמונה שהבסיס שלה הופרך?","a":"לבקש ממנו להסביר למה ייתכן שהמסקנה ההפוכה נכונה","w":["לבקש ממנו להיות אובייקטיבי ולשקול את הראיות שוב","להראות לו שוב ושוב שהראיות המקוריות היו מומצאות","לתת לו זמן, כי אמונה שגויה נעלמת מעצמה עם הזמן"],"e":"״היו אובייקטיביים״ לא עוזר. מה שעוזר הוא לבנות הסבר להפך, כי האמונה נשענת על ההסבר ולא על הראיות."}]},"h7":{"t":"t3","v":[{"q":"עדה ראתה תאונה. אחר כך שוטר שאל אותה ״באיזו מהירות נסע הרכב כשהתנגש ונופץ?״. כעבור שבוע היא ״זוכרת״ זכוכיות מנופצות שלא היו. איך נקרא זה?","a":"אפקט המידע המטעה: מידע שבא אחרי האירוע שינה את הזיכרון","w":["השתמרות אמונה: האמונה הקודמת שלה שרדה גם אחרי האירוע","הטרמה: המילה הפעילה אסוציאציות בזמן התאונה עצמה","זיכרון חבוי: הזכוכיות היו שם, אבל היא לא שמה לב"],"e":"כמו בניסויים של לופטוס: הזיכרון נבנה מחדש בכל שליפה, ומידע שמגיע אחרי האירוע ״נכנס״ לתוכו."},{"q":"אדם שינה את דעתו בנושא פוליטי, ועכשיו הוא בטוח ש״תמיד חשב ככה״. מה זה מדגים?","a":"בנייה מחדש של עמדות העבר כך שיתאימו להווה","w":["השתמרות אמונה, כי הדעה הישנה שרדה את השינוי","אפקט המידע המטעה, כי מישהו הטעה אותו בכוונה","הטרמה, כי הוא נחשף לדעה החדשה בלי לשים לב"],"e":"הזיכרון של עמדות קודמות נבנה מחדש לפי מה שאנחנו חושבים היום. גרינוולד קרא לזה ״אגו טוטליטרי״."}]},"h8":{"t":"t4","v":[{"q":"רב־אמן בשחמט מעיף מבט בלוח ומבצע מהלך מצוין בתוך שנייה, בלי לחשב. איזה סוג חשיבה זה?","a":"עיבוד אוטומטי שמבוסס על מומחיות ודפוסים שמורים","w":["עיבוד מבוקר, כי מהלך טוב דורש חישוב מודע","היריסטיקת יציגות, כי הלוח דומה ללוח טיפוסי","ביטחון יתר, כי הוא לא בדק את המהלך לפני שעשה"],"e":"אצל מומחים, הדפוסים שמורים בזיכרון והאינטואיציה מזהה אותם מיד. זו אחת הדוגמאות לכוח של העיבוד האוטומטי."}]},"h9":{"t":"t4","v":[{"q":"מטופלת עם פגיעה בזיכרון לא זוכרת את הרופא שלה, אבל מסרבת ללחוץ את ידו, כי פעם דקר אותה בנעץ. מה זה מראה?","a":"זיכרון חבוי: ידע שמשפיע על התנהגות בלי זיכרון מודע","w":["ראייה עיוורת: היא ראתה את הנעץ בלי לשים לב אליו","השתמרות אמונה: היא האמינה שהרופא רע עוד לפני כן","הטרמה: הרופא הזכיר לה דקירה בלי שהיא שמה לב"],"e":"הזיכרון של הדקירה לא היה מודע, ובכל זאת השפיע על ההתנהגות. זו דוגמה לכוח של העיבוד האוטומטי."}]},"h10":{"t":"t5","v":[{"q":"במבחן בסטטיסטיקה אורי היה בטוח ב־95% שענה נכון, וקיבל 60. מה המחקרים בפרק מנבאים על אנשים כמוהו?","a":"ביטחון יתר נפוץ, ובמיוחד אצל החלשים במשימה","w":["ביטחון יתר נדיר, ולכן אורי הוא כנראה מקרה חריג","ביטחון יתר נפוץ רק אצל מומחים, שבטוחים בניסיונם","ביטחון יתר קורה רק במשימות קשות מאוד, לא במבחנים"],"e":"לפי קרוגר ודאנינג, החלשים ביותר מפריזים הכי הרבה, כי חסר להם בדיוק הידע שהיה מראה להם שהם טועים."}]},"h11":{"t":"t5","v":[{"q":"סטודנטית בטוחה שהיא תסיים עבודה סמינריונית בשבוע. לוקח לה שלושה. איך נקרא זה, ומה יעזור לה בפעם הבאה?","a":"כשל התכנון; לפרק את העבודה לחלקים קטנים","w":["הטיית אישוש; לחפש מידע שמאשר את התכנון שלה","רגרסיה לממוצע; לחכות שהקצב יחזור לרגיל","אשליית שליטה; לבחור בעצמה את מועד ההגשה"],"e":"אנחנו מעריכים בחסר כמה זמן ייקח לנו. פירוק משימה וחשיבה על מה עלול להשתבש מפחיתים את הטעות."}]},"h12":{"t":"t5","v":[{"q":"מנהל בטוח שעובד חדש עצלן, ולכן בודק רק את הימים שבהם העובד איחר. איזו הטיה זו?","a":"הטיית אישוש: מחפש רק מידע שמאשר את דעתו","w":["היריסטיקת יציגות: העובד דומה לעובד עצלן טיפוסי","מתאם מדומה: הוא רואה קשר בין איחור לבין עצלות","השתמרות אמונה: הוא ממשיך להאמין אחרי הפרכה"],"e":"כמו במשימת 2, 4, 6 של ווסון: בודקים רק מה שמתאים להשערה, ולא מנסים להפריך אותה."}]},"h13":{"t":"t6","v":[{"q":"מתארים את דנה: שקטה, מסודרת, אוהבת ספרים. אומרים שהיא נבחרה מקבוצה של 90 אחיות ו־10 ספרניות. רוב האנשים אומרים ״ספרנית״. מה הטעות?","a":"יציגות: שופטים לפי דמיון ומתעלמים משיעור הבסיס","w":["היריסטיקת זמינות: קל יותר להיזכר בספרניות מבאחיות","ביטחון יתר: הם בטוחים מדי בתיאור שקיבלו","מתאם מדומה: הם רואים קשר בין ספרים לשקט"],"e":"דנה ״נשמעת״ כמו ספרנית, אבל 90% מהקבוצה אחיות. כמו פלג בספר: הדמיון לטיפוסי גובר על שיעור הבסיס."}]},"h14":{"t":"t6","v":[{"q":"אחרי כמה ידיעות על נפילת מעליות, נועם נמנע ממעליות ועולה 12 קומות ברגל. איזו היריסטיקה פועלת?","a":"זמינות: מקרים שקל להיזכר בהם נראים שכיחים","w":["יציגות: המעלית דומה למעלית טיפוסית שנופלת","אשליית שליטה: במדרגות הוא שולט במה שקורה","רגרסיה לממוצע: אחרי שנפלו מעליות, יפלו פחות"],"e":"כמו פחד מטיסה: מקרים דרמטיים מקבלים הרבה סיקור, ולכן נראים שכיחים יותר ממה שהם."},{"q":"שואלים אנשים מה גורם ליותר מוות, כרישים או מכות של סוסים. רובם אומרים כרישים, למרות שזה לא נכון. למה?","a":"התקפות כרישים זמינות יותר בזיכרון, בגלל סיקור דרמטי","w":["כרישים דומים יותר לסכנה טיפוסית, ולכן נראים מסוכנים","אנשים בטוחים בעצמם מדי, ולכן לא בודקים את הנתונים","אנשים מרגישים שליטה בסוסים, אבל לא בכרישים בים"],"e":"היריסטיקת הזמינות: מה שקל להיזכר בו נראה שכיח, גם כשהנתונים אומרים אחרת."}]},"h15":{"t":"t6","v":[{"q":"רץ אחד סיים שני במרתון, ורץ אחר שלישי. מי צפוי להיות מרוצה יותר, לפי הפרק?","a":"השלישי, כי קל לו לדמיין שכמעט נשאר בחוץ","w":["השני, כי המקום שלו גבוה יותר ושווה יותר","שניהם באותה מידה, כי שניהם עלו לפודיום","השני, כי קל לו לדמיין שכמעט היה שלישי"],"e":"מחשבות ״אילו״: הכסף חושב ״כמעט זהב״, והארד חושב ״כמעט כלום״. לכן ארד שמח יותר מכסף."}]},"h16":{"t":"t7","v":[{"q":"מהמר בקזינו בוחר בעצמו את המספרים בלוטו, ומרגיש שהסיכוי שלו לזכות גדול יותר. איך נקרא זה?","a":"אשליית שליטה: תחושה שיש השפעה על אירוע מקרי","w":["מתאם מדומה: קשר בין בחירה לבין זכייה שקיים באמת","היריסטיקת זמינות: הוא זוכר הרבה זוכים שבחרו מספרים","ביטחון יתר: הוא מעריך נכון את הסיכוי לזכות"],"e":"כמו בניסוי של לנגר: כרטיס שבחרתי בעצמי נראה שווה יותר, למרות שהסיכוי לזכות זהה."}]},"h17":{"t":"t7","v":[{"q":"אחרי חודש שבו המכירות צנחו בחדות, המנהלת החליפה את מנהל הצוות. בחודש הבא המכירות חזרו לרמה הרגילה. מה צריך לחשוד?","a":"אולי זו רגרסיה לממוצע, והמכירות היו עולות גם בלי ההחלפה","w":["ההחלפה בהכרח גרמה לשיפור, כי השיפור בא מיד אחריה","זו אשליית שליטה, כי המנהלת לא באמת החליפה את המנהל","זו הטיית אישוש, כי המכירות לא השתפרו באמת"],"e":"אחרי תוצאה קיצונית, התוצאה הבאה נוטה לחזור לממוצע מעצמה. כמו הנזיפות לתום בספר, שנראה ש״עבדו״."}]},"h18":{"t":"t7","v":[{"q":"אחרי יום מעולה, יעל מסתכלת על תמונות מהעבודה ורואה צוות נחמד. אחרי יום גרוע, אותן תמונות נראות לה כמו צוות קר. מה מסביר את זה, ומה היא תחשוב?","a":"מצב הרוח צובע את השיפוט, והיא תחשוב שהצוות השתנה","w":["מצב הרוח לא משפיע, והצוות באמת השתנה בין הימים","מצב הרוח צובע את השיפוט, והיא תבין שזה מצב הרוח שלה","זו רגרסיה לממוצע, כי יום מעולה הוא תוצאה קיצונית"],"e":"כמו בניסוי של פורגס: מצב רוח משנה את איך שאנחנו רואים, ואנחנו מייחסים את השינוי לעולם ולא לעצמנו."}]}};
const SUM=`<h2>סיכום: מאיירס פרק 3 (חלק א׳) - לתפוס ולשפוט את העולם החברתי</h2>
<div class="key"><b>למה הפרק הזה חשוב בפסיכולוגיה חברתית?</b> פרק 3 נקרא ״אמונות חברתיות ושיפוטים חברתיים״. הנקודה המרכזית שלו, במילים של הספר: <b>״איננו מגיבים למציאות כפי שהיא, אלא למציאות כפי שאנו מַבנים אותה״.</b> הספר פותח בדוגמה: בעימות טלוויזיוני בין מקיין לאובמה, התומכים של כל צד ראו את אותו עימות בדיוק, וכל צד היה בטוח שהמועמד שלו הרשים יותר.<br><br>
<b>השאלה של החלק הזה במשפט אחד:</b> איך האמונות שלנו משנות את מה שאנחנו רואים וזוכרים, ואיך האינטואיציה שלנו מובילה אותנו לשיפוטים מהירים, שלפעמים שגויים?<br><br>
<b>החלק בנוי משני חלקים (בספר: ״לתפוס״ ו״לשפוט״):</b><br>
① <b>לתפוס את העולם החברתי</b> (סעיפים 1–3): איך מחשבות שמופעלות בלי שנשים לב, ואמונות שכבר יש לנו, צובעות את מה שאנחנו רואים, מפרשים וזוכרים.<br>
② <b>לשפוט את העולם החברתי</b> (סעיפים 4–7): החשיבה האינטואיטיבית יעילה ובדרך כלל טובה, אבל יש לה ״מחיר״: ביטחון יתר, קיצורי דרך מטעים, קשרים שלא קיימים, ומצב רוח שמשנה את השיפוט.<br>
<b>איזון חשוב שהספר מדגיש:</b> למרות כל ההטיות, <b>ברוב המקרים אנחנו מדייקים</b>. הרושם הראשוני שלנו נכון במקרים רבים. לומדים את הטעויות כדי לזהות אותן, לא כדי להסיק שאנחנו טיפשים.<br>
<b>בשיעור:</b> מפגשים 5–6, יחד עם המאמר של Davidai & Gilovich.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>אסוציאציה</b></td><td>קשר בזיכרון בין שני דברים. ״לחם״ מזכיר ״חמאה״.</td></tr>
<tr><td><b>תפיסה מוקדמת</b></td><td>אמונה או דעה שיש לנו <b>לפני</b> שאנחנו פוגשים את המידע החדש.</td></tr>
<tr><td><b>אינטואיציה</b></td><td>ידיעה מהירה ״מהבטן״, בלי לחשוב צעד אחרי צעד.</td></tr>
<tr><td><b>היריסטיקה</b></td><td>קיצור דרך מחשבתי: כלל אצבע מהיר שבדרך כלל עובד, אבל לפעמים מטעה.</td></tr>
<tr><td><b>שיעור בסיס</b></td><td>כמה משהו נפוץ באוכלוסייה. למשל, כמה אחוזים מהאנשים הם מהנדסים.</td></tr></table></div>

<h3>הדוגמה שתלווה אותנו: יואב</h3>
<p><b>יואב</b> (דמות בדויה להמחשה) סטודנט שנה ב׳, תומך נלהב של מפלגה מסוימת, ומתכונן למבחן בסטטיסטיקה. נראה איך האמונות, הזיכרון והאינטואיציה שלו מטעים אותו, ומתי הם דווקא עובדים טוב.</p>

<h3>1. הטרמה: מחשבות שמופעלות בלי שנשים לב</h3>
<p><b>הרעיון:</b> הזיכרון שלנו הוא רשת של אסוציאציות. כשמשהו ״מדליק״ רעיון אחד, הוא מדליק גם רעיונות שקשורים אליו. זה נקרא <b>הטרמה</b>, וזה משפיע על מה שנחשוב או נעשה אחר כך, <b>בלי שנהיה מודעים לזה</b>.</p>
<div class="ex"><b>ניסויים מהספר:</b><br>
• אנשים השלימו משפטים עם מילים כמו ״זקן״, ״חכם״ ו״גמלאי״. אחר כך הם <b>הלכו לאט יותר</b> למעלית, ולא שמו לב לזה בכלל (בארג׳).<br>
• סטודנטים שנחשפו לריח של חומר ניקוי השאירו את השולחן <b>נקי יותר</b> מפירורים כשאכלו עוגייה, בלי לשים לב לריח.<br>
• הטרמה עובדת גם כשהגירוי <b>תת־סיפי</b>: הוצג מהר מכדי שנראה אותו במודע. המילה ״לחם״ שהבזיקה גרמה לזהות מהר יותר את המילה ״חמאה״.<br><br>
<b>מהיומיום:</b> צפית לבד בסרט אימה, ופתאום כל רעש של המקרר נשמע כמו פורץ.<br>
<b>אצל יואב:</b> הוא קרא על הפרעות חרדה לקורס, ולמחרת פירש דפיקות לב מהירות כ״התקף חרדה״. כך גם סטודנטים לרפואה שלומדים על מחלה ״מגלים״ את התסמינים אצל עצמם.<br><br>
<b>הלקח של הספר:</b> חלק גדול מעיבוד המידע החברתי שלנו <b>אוטומטי</b>: לא מכוון, לא גלוי, ומחוץ למודעות.</div>

<h3>2. תפיסה ופירוש: האמונות שלנו צובעות את מה שאנחנו רואים</h3>
<p>מההטרמה עוברים לצעד הבא: גם האמונות שכבר יש לנו משפיעות על <b>הפירוש</b>. זה בולט במיוחד כשהמידע <b>דו־משמעי</b>, כלומר אפשר לקרוא אותו בכמה דרכים. אז האמונה המוקדמת היא שמכריעה.</p>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">ההרצאה על סברה ושתילה (ואלון ועמיתיו)</b><br>
<b>מה עשו:</b> הראו לסטודנטים פרו־ישראלים ופרו־ערבים את אותם קטעי חדשות על הטבח בסברה ושתילה.<br>
<b>מה יצא:</b> <b>שתי הקבוצות</b> טענו שהסיקור מוטה <b>נגדן</b>.<br>
<b>מה זה מלמד:</b> אותו מידע נראה אחרת לפי הצד שאתה בו.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">עונש המוות (לורד ועמיתיו)</b><br>
<b>מה עשו:</b> נתנו לתומכים ולמתנגדים של עונש מוות לקרוא אותם שני מחקרים: אחד בעד ואחד נגד.<br>
<b>מה יצא:</b> כל צד מצא את המחקר שתומך בו משכנע, ואת השני פגום. בסוף המחלוקת <b>גדלה</b>.<br>
<b>מה זה מלמד:</b> חשיפה למידע מעורב <b>לא</b> מקרבת עמדות. היא מחזקת את מה שכל אחד כבר חשב.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">הפנים של האיש (רותברט ובירל)</b><br>
<b>מה עשו:</b> הראו לאנשים תמונה של אותו גבר. לחלק אמרו שהוא היה מפקד גסטפו, ולחלק שהוא הציל יהודים.<br>
<b>מה יצא:</b> הראשונים ראו בפנים אכזריות, והשניים ראו חום וטוב לב.<br>
<b>מה זה מלמד:</b> אנחנו ״רואים״ בפנים את מה שאנחנו כבר יודעים על האדם.</div>
<ul>
<li><b>עימותים פוליטיים:</b> אחרי עימות בטלוויזיה, בערך 10 תומכים יגידו ״המועמד שלי ניצח״ על כל אחד שיגיד ״היריב ניצח״. <b>אצל יואב:</b> הוא בטוח שהמועמד שלו ״ריסק״ את היריב.</li>
<li><b>אפקט קולשוב:</b> אותן פנים ניטרליות של שחקן נראות עצובות, שמחות או רעבות, לפי הסצנה שמוצגת לפניהן.</li>
<li><b>העברת תכונה ספונטנית:</b> מי שמספר שאחרים ״רכלנים״ נתפס בעצמו כרכלן. המאפיין ״נדבק״ למי שמדבר עליו.</li>
</ul>

<h3>3. השתמרות האמונה וזיכרון שנבנה מחדש</h3>
<p>האמונות לא רק צובעות את מה שאנחנו רואים עכשיו. הן גם <b>שורדות</b> כשמוכיחים שהן שגויות, ו<b>משנות</b> את מה שאנחנו זוכרים.</p>
<h4>השתמרות האמונה</h4>
<div class="ex"><b>הרעיון:</b> אמונה ממשיכה להתקיים גם אחרי שהבסיס שלה הופרך.<br>
<b>ניסוי הכבאים (רוס ועמיתיו):</b> הראו לאנשים ״ראיות״ שכבאים שאוהבים סיכונים מצליחים יותר (או פחות), וביקשו מהם <b>להסביר למה</b>. אחר כך גילו להם שהראיות הומצאו. רובם (בערך 75%) <b>המשיכו להאמין</b> במסקנה.<br>
<b>למה?</b> כי ההסבר שהם בנו לעצמם נשאר, גם כשהראיות נעלמו. ״הגיוני שמי שלוקח סיכונים יהיה כבאי טוב״.<br>
<b>מה עוזר:</b> לבקש מאנשים ״להיות אובייקטיביים״ <b>לא</b> עוזר. מה שעוזר הוא לבקש מהם <b>להסביר את ההפך</b>: למה ייתכן שהמסקנה ההפוכה נכונה.<br>
<b>מהיומיום:</b> שמעת שמועה שחבר ״דיבר עלייך מאחורי הגב״. גם אחרי שהתברר שזה לא נכון, נשארת אצלך תחושה לא נעימה כלפיו.</div>
<h4>הזיכרון נבנה מחדש בכל פעם</h4>
<div class="ex"><b>הרעיון:</b> רוב האנשים (85%) חושבים שהזיכרון הוא כמו ״תיבה״ שבה המידע נשמר כמו שהוא. בפועל, <b>בכל פעם שנזכרים, בונים את הזיכרון מחדש</b>, ומה שקרה אחרי האירוע יכול לשנות אותו.<br>
<b>אפקט המידע המטעה (לופטוס):</b> אנשים ראו סרטון של תאונה בצומת עם שלט ״תן זכות קדימה״. אחר כך שאלו אותם שאלה שהזכירה שלט ״עצור״. רבים ״נזכרו״ ששלט ״עצור״ היה שם. במחקרים אחרים בערך רבע מהאנשים ״נזכרו״ באירוע מהילדות שלא קרה בכלל.</div>
<p><b>אנחנו משכתבים את העבר כדי שיתאים להווה:</b></p>
<ul>
<li><b>עמדות:</b> מי ששינה דעה נוטה לחשוב ״תמיד חשבתי כך״.</li>
<li><b>חוויות:</b> טיולים זכורים כוורודים יותר ממה שהם היו בזמן אמת.</li>
<li><b>מערכות יחסים:</b> מי שנפרד ״זוכר״ שבן הזוג תמיד היה אנוכי.</li>
<li><b>התנהגות:</b> סטודנטים ששמעו הרצאה על חשיבות צחצוח שיניים ״נזכרו״ שצחצחו יותר בשבועיים שלפני.</li>
<li><b>״אגו טוטליטרי״</b> (גרינוולד): כמו בספר 1984, לכל אחד מאיתנו יש ״משרד״ פנימי שמשכתב את העבר לפי ההשקפות של היום.</li>
</ul>

<h3>4. אינטואיציה: הכוח שלה והגבולות שלה</h3>
<p>עכשיו עוברים מ״לתפוס״ ל״לשפוט״. הספר מסביר שיש לנו שני סוגי חשיבה, שעובדים במקביל:</p>
<div class="tw"><table><tr><th></th><th>עיבוד מבוקר</th><th>עיבוד אוטומטי</th></tr>
<tr><td><b>איך הוא</b></td><td>גלוי, מחושב, מודע, איטי</td><td>חבוי, נטול מאמץ, לא מודע, מהיר. זו ״האינטואיציה״</td></tr>
<tr><td><b>דוגמה</b></td><td>לפתור תרגיל בסטטיסטיקה צעד אחרי צעד</td><td>לזהות חבר בטלפון אחרי מילה אחת</td></tr></table></div>
<p><b>הכוח של האינטואיציה:</b> הספר מביא כמה דוגמאות לעיבוד אוטומטי שעובד טוב:</p>
<ul>
<li><b>סכמות:</b> תבניות במוח שמכוונות את הפירוש. אם מישהו אמר ״לשנן״ או ״לשמן״, נבין לפי ההקשר בלי לחשוב.</li>
<li><b>תגובות רגשיות:</b> מסלול מהיר מעביר מידע מהעין או מהאוזן ישר לאמיגדלה, מרכז הרגש, עוד לפני שהקורטקס ״החושב״ מתערב. אבות אבותינו שברחו מכל רחש בשיחים שרדו יותר.</li>
<li><b>מומחיות:</b> רב־אמן בשחמט מזהה בבת אחת את המהלך הנכון, כי הדפוסים כבר שמורים אצלו.</li>
<li><b>זיכרון חבוי:</b> מטופלת עם פגיעה בזיכרון לא זכרה את הרופא, אבל סירבה ללחוץ את ידו, כי פעם הוא דקר אותה בנעץ שהסתיר ביד.</li>
<li><b>ראייה עיוורת:</b> אנשים עם פגיעה במוח שאומרים שהם לא רואים, ״מנחשים״ נכון איפה נמצא חפץ.</li>
</ul>
<p><b>הגבולות:</b> האינטואיציה לא קסם. למשל, <b>אין ראיות</b> שקלטות ״תת־סיפיות״ (שמשמיעות מסרים מוסתרים) עוזרות לרזות או לשפר זיכרון. וכפי שנראה בסעיפים הבאים, היא גם מובילה לטעויות קבועות.</p>

<h3>5. ביטחון יתר והטיית האישוש</h3>
<p><b>הרעיון:</b> אנחנו נוטים להיות בטוחים בעצמנו יותר ממה שמגיע לנו. לפי הספר, חלק מהסיבה הוא ש<b>קל לנו הרבה יותר לדמיין למה אנחנו צודקים מאשר למה אנחנו טועים</b>.</p>
<div class="tw"><table><tr><th>מחקר</th><th>כמה צדקו</th><th>כמה היו בטוחים</th></tr>
<tr><td>כהנמן וטברסקי: שאלות ידע</td><td>70%</td><td>98%</td></tr>
<tr><td>ניבוי התשובות של אדם זר</td><td>63%</td><td>75%</td></tr>
<tr><td>מומחים פוליטיים (טטלוק)</td><td>פחות מ־40%</td><td>יותר מ־80%</td></tr></table></div>
<div class="ex"><b>איך לקרוא את הטבלה:</b> בכל שורה, המספר בעמודה השלישית גבוה מהמספר בשנייה. זה בדיוק ביטחון יתר: הפער בין כמה <b>חשבנו</b> שאנחנו צודקים לכמה <b>באמת</b> צדקנו.<br>
<b>קרוגר ודאנינג:</b> דווקא האנשים ה<b>חלשים</b> ביותר במשימה מפריזים הכי הרבה ביכולת שלהם. הסיבה: הם חסרים בדיוק את הידע שהיה מראה להם שהם טועים.<br>
<b>כשל התכנון:</b> אנחנו מעריכים בחסר כמה זמן ייקח לנו משהו. <b>אצל יואב:</b> ״אסיים לעבור על כל החומר בערב אחד״. גם פרויקטים ענקיים, כמו בניית האצטדיון במונטריאול ופרויקט ה־Big Dig בבוסטון, לקחו הרבה יותר זמן וכסף מהמתוכנן.</div>
<h4>הטיית האישוש</h4>
<div class="ex"><b>הרעיון:</b> אנחנו מחפשים מידע ש<b>מאשר</b> את מה שאנחנו כבר חושבים, ולא מידע שעלול להפריך אותו.<br>
<b>המשימה של ווסון (2, 4, 6):</b> אמרו לאנשים שהרצף 2, 4, 6 מקיים כלל מסוים, וביקשו מהם לגלות אותו בעזרת רצפים משלהם. רובם ניסו רק רצפים שמתאימים לניחוש שלהם (כמו 6, 8, 10), ולא ניסו רצף שעלול להפריך אותו. 23 מתוך 29 טעו. הכלל היה פשוט: ״מספרים בסדר עולה״.<br>
<b>מהיומיום:</b> מי שבטוח שתרופה מסוימת עוזרת, זוכר את הפעמים שהרגיש טוב אחריה ושוכח את הפעמים שלא.<br>
<b>אימות עצמי:</b> אנחנו אפילו בוחרים חברים ובני זוג שרואים אותנו כמו שאנחנו רואים את עצמנו.</div>
<p><b>מה מפחית ביטחון יתר:</b> משוב מיידי (כמו לחזאים, שמקבלים כל יום תשובה אם צדקו), פירוק משימה גדולה לחלקים, ובעיקר <b>לחשוב על סיבה אחת לפחות למה אני עלול לטעות</b>.</p>

<h3>6. היריסטיקות: קיצורי דרך מחשבתיים</h3>
<p><b>הרעיון:</b> אין לנו זמן לחשב כל דבר עד הסוף, ולכן המוח משתמש בקיצורי דרך. הם מהירים וחוסכים מאמץ, ובדרך כלל עובדים, אבל לפעמים מובילים לטעויות קבועות. הספר מתאר שתיים:</p>
<div class="ex"><b>היריסטיקת היציגות = ״כמה זה דומה לטיפוסי?״</b><br>
שופטים אם משהו שייך לקטגוריה לפי <b>כמה הוא דומה</b> לדוגמה הטיפוסית שלה, ומתעלמים מ<b>שיעור הבסיס</b>.<br>
<b>הדוגמה מהספר:</b> מתארים אדם בשם פלג כשמרן, מסודר ואוהב ויכוחים, ומספרים שהוא נבחר מקבוצה שבה 70% מהנדסים ו־30% עורכי דין. רוב האנשים אומרים ״עורך דין״, כי הוא ״נשמע״ כמו עורך דין, ושוכחים שרוב הקבוצה מהנדסים.<br>
<b>הדוגמה של ליאת:</b> מתארים אישה רגישה לצדק חברתי. אנשים אומרים שיותר סביר שהיא ״ספרנית ופמיניסטית״ מאשר ״ספרנית״. זה בלתי אפשרי: <b>שני תנאים ביחד לא יכולים להיות סבירים יותר מאחד מהם לבד</b>.<br>
<b>מהיומיום:</b> בחור עם קעקועים ותספורת מיוחדת ״נראה כמו מתופף״, אז מנחשים שהוא מוזיקאי, למרות שמוזיקאים הם אחוז קטן מהאוכלוסייה.</div>
<div class="ex"><b>היריסטיקת הזמינות = ״כמה קל לי להיזכר?״</b><br>
שופטים כמה משהו <b>שכיח</b> לפי כמה <b>קל להיזכר</b> בדוגמאות שלו. מה שעולה בקלות לראש נראה נפוץ.<br>
<b>הדוגמה מהספר:</b> ״באיזו מדינה יש יותר תושבים, עירק או טנזניה?״ רוב האנשים עונים עירק, כי שומעים עליה הרבה בחדשות. בפועל, בטנזניה הרבה יותר.<br>
<b>פחד מטיסה:</b> התרסקות מטוס מקבלת סיקור ענק, ולכן נראית שכיחה. בפועל נהיגה מסוכנת פי 230 לקילומטר. אחרי 11 בספטמבר אנשים נסעו ברכב במקום לטוס, ובערך 350 אנשים נוספים נהרגו בכבישים.<br>
<b>מהיומיום:</b> אחרי ששמעת על שני מקרי פריצה בשכונה, נדמה לך שפורצים שם כל הזמן.</div>
<h4>מחשבות ״אילו״</h4>
<div class="ex"><b>הרעיון:</b> כשקל לנו לדמיין איך הדברים יכלו להיות אחרת, הרגש חזק יותר. ככל שהחלופה ״קרובה״ יותר, אכזבה או הקלה גדולות יותר.<br>
<b>הדוגמה מהספר:</b> במדליות באולימפיאדה, <b>זוכי הארד שמחים יותר מזוכי הכסף</b>. הכסף חושב ״כמעט זכיתי בזהב״, והארד חושב ״כמעט לא קיבלתי מדליה בכלל״.<br>
<b>אצל יואב:</b> ציון 89, כשחסרה נקודה לציון שהוא רצה, מרגיש לו גרוע יותר מ־81.<br>
<b>עוד ממצא:</b> בטווח הארוך אנחנו מתחרטים יותר על מה ש<b>לא</b> עשינו מאשר על מה שעשינו.</div>

<h3>7. מתאם מדומה, אשליית שליטה ומצב רוח</h3>
<h4>מתאם מדומה</h4>
<div class="ex"><b>הרעיון:</b> אנחנו ״רואים״ קשר בין דברים, גם כשאין ביניהם שום קשר.<br>
<b>דוגמאות:</b> ״בכל פעם שחשבתי על חבר, הוא התקשר״: זוכרים את הפעמים שזה קרה, ושוכחים את מאות הפעמים שחשבנו עליו והוא לא התקשר. או ״זריעת עננים מביאה גשם״, גם כשהגשם היה יורד בכל מקרה.</div>
<h4>אשליית השליטה</h4>
<div class="ex"><b>הרעיון:</b> אנחנו מרגישים שיש לנו השפעה על דברים שהם מקריים לגמרי.<br>
<b>הניסוי של לנגר:</b> מי שבחר בעצמו כרטיס הגרלה דרש <b>פי 4</b> יותר כסף כדי למכור אותו, ממי שקיבל כרטיס שמישהו אחר בחר. הסיכוי לזכות זהה, אבל ״הכרטיס שלי״ מרגיש מיוחד.<br>
<b>מהיומיום:</b> מהמרים מטילים קובייה בעדינות כשהם רוצים מספר נמוך, ובכוח כשהם רוצים מספר גבוה.</div>
<h4>רגרסיה לממוצע</h4>
<div class="ex"><b>הרעיון:</b> אחרי תוצאה קיצונית מאוד, טובה או רעה, התוצאה הבאה תהיה בדרך כלל קרובה יותר לממוצע. זה קורה <b>מעצמו</b>, בגלל מקריות. אבל אנחנו מייחסים את השינוי למה שעשינו בינתיים.<br>
<b>הדוגמה מהספר (שפנר):</b> מורים ״נזפו״ בתלמיד בכל פעם שהיה לו יום רע, וראו שאחרי הנזיפה הוא השתפר. בפועל הנזיפות לא השפיעו בכלל: אחרי יום רע במיוחד, יום ממוצע יותר היה מגיע בכל מקרה.<br>
<b>אצל יואב:</b> אחרי שבוע גרוע במיוחד הוא התחיל לעשות יוגה, והרגיש טוב יותר. הוא בטוח שזו היוגה, אבל ייתכן שהוא פשוט חזר למצב הרגיל שלו.</div>
<h4>מצב רוח</h4>
<div class="ex"><b>הרעיון:</b> מצב הרוח ״מחלחל״ לחשיבה. במצב רוח טוב העולם נראה ידידותי ועולים זיכרונות טובים. במצב רוח רע עולים זיכרונות רעים, ואנשים אחרים נראים מרושעים יותר.<br>
<b>הניסוי של פורגס:</b> אנשים צפו בווידאו של עצמם מתראיינים. מי שהשרו עליו קודם מצב רוח טוב ראה את עצמו בטוח ורהוט. מי שהשרו עליו מצב רוח רע ראה את עצמו נוקשה ועצבני. ו<b>כולם חשבו שהשינוי הוא בעולם, לא במצב הרוח שלהם</b>.<br>
<b>עוד ממצא:</b> כשאנחנו נסערים, כועסים או אפילו שמחים מאוד, אנחנו שופטים אנשים מהר יותר ויותר לפי <b>סטראוטיפים</b>.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הסיפור של החלק בחמישה משפטים:</b><br>
1. אנחנו לא מגיבים למציאות כמו שהיא, אלא כמו שאנחנו <b>בונים</b> אותה: <b>הטרמה</b> ואמונות מוקדמות משנות את מה שאנחנו רואים ומפרשים.<br>
2. אמונות <b>שורדות</b> גם כשהבסיס שלהן מופרך, ו<b>הזיכרון נבנה מחדש</b> כך שיתאים למה שאנחנו חושבים היום.<br>
3. רוב החשיבה שלנו <b>אוטומטית ואינטואיטיבית</b>. היא מהירה ובדרך כלל טובה, אבל יש לה מחיר.<br>
4. המחיר: <b>ביטחון יתר</b>, <b>הטיית אישוש</b>, קיצורי דרך מטעים (<b>יציגות, זמינות</b>), <b>מתאמים מדומים</b>, <b>אשליית שליטה</b> ופספוס של <b>רגרסיה לממוצע</b>.<br>
5. גם <b>מצב הרוח</b> צובע את השיפוט, ואנחנו בטוחים שהשתנה העולם ולא אנחנו. ובכל זאת, ברוב המקרים אנחנו מדייקים.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לזהות הטרמה בתיאור מקרה, ולהסביר למה היא אוטומטית.<br>
• להסביר איך אמונה מוקדמת משנה פירוש של מידע דו־משמעי, עם מחקר מתאים.<br>
• להסביר השתמרות אמונה ומה עוזר נגדה, ולתאר איך הזיכרון נבנה מחדש.<br>
• להבחין בין עיבוד מבוקר לאוטומטי, ולתת דוגמאות לכוח ולגבולות של האינטואיציה.<br>
• לזהות ביטחון יתר, הטיית אישוש, יציגות וזמינות במקרה, ולהבחין ביניהם.<br>
• להסביר מחשבות ״אילו״, מתאם מדומה, אשליית שליטה, רגרסיה לממוצע והשפעת מצב רוח.</div>

<div class="tw"><table><tr><th>חוקר</th><th>על מה לזכור אותו</th></tr>
<tr><td>בארג׳</td><td>הטרמה: מילים של זקנה ← הליכה איטית</td></tr>

<tr><td>רותברט ובירל</td><td>אותן פנים: ״גסטפו״ אכזרי, ״מציל יהודים״ חם</td></tr>
<tr><td>רוס</td><td>השתמרות האמונה: ניסוי הכבאים</td></tr>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>הטרמה פועלת גם בלי מודעות</b>, ואפילו כשהגירוי תת־סיפי.</li>
<li>חשיפה למידע מעורב <b>מגבירה</b> מחלוקת, לא ממתנת אותה.</li>
<li>״היו אובייקטיביים״ <b>לא עוזר</b> נגד השתמרות אמונה; ״הסבירו את ההפך״ עוזר.</li>
<li>הזיכרון <b>נבנה מחדש</b> בכל שליפה; הוא לא העתק של מה שקרה.</li>
<li><b>החלשים</b> מפריזים ביכולתם, לא החזקים.</li>
<li><b>יציגות = דמיון לטיפוסי</b>; <b>זמינות = קלות ההיזכרות</b>. לא להחליף.</li>
<li>צירוף של שני תנאים (״ספרנית ופמיניסטית״) <b>לא יכול</b> להיות סביר יותר מתנאי אחד.</li>
<li><b>זוכי הארד שמחים יותר מזוכי הכסף.</b></li>
<li>ברגרסיה לממוצע השיפור קורה <b>מעצמו</b>, לא בגלל מה שעשינו.</li>
<li>במצב רוח רע אנחנו חושבים ש<b>העולם</b> השתנה, לא אנחנו.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
</html>
