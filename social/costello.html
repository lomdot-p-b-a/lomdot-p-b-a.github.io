:root[data-theme="dark"]{

 {id:"t5",icon:"people",title:"עמידות ההשפעה",blocks:[
  {h:"בכל סוגי הקונספירציות",html:`${def("על מה הנושא",`האם ההשפעה עובדת על כולם ועל כל סוגי הקונספירציות?<br><b>מה נלמד כאן:</b> סוגי קונספירציות · מאמינים מושבעים · מי מושפע יותר`)}<p>החוקרים סיווגו את הקונספירציות בעזרת עיבוד שפה טבעית. ההשפעה <b>לא נבדלה</b> באופן מובהק בין הסוגים, והאמונה ירדה בכל <b>12 הסוגים</b> שהופיעו אצל יותר מ-1% מהמדגם.</p>${tiles([["target","גם פוליטיות","עבד גם בקונספירציות בולטות ומושרשות: הונאה בבחירות 2020 בארה\"ב (d=0.78) ומגפת הקורונה (d=0.69)"],["leaf","קלאסיות","רצח קנדי, חייזרים, האילומינטי"]])}`,q:"q21"},
  {h:"גם אצל מאמינים מושבעים",html:`${tiles([["chart","עוצמת האמונה","השפיעה על גודל האפקט בצורת U, אבל לא ביטלה אותו"],["target","חשיבות האמונה","ככל שהקונספירציה חשובה יותר לתפיסת העולם, האפקט קטן יותר, אבל עדיין מובהק גם ברמת החשיבות הגבוהה ביותר (d=0.67)"],["brain","חשיבה קונספירטיבית כללית","לא מיתנה באופן מובהק. גם מי שבאחוזון ה-90 ומעלה (מאמינים כמעט בכל 15 הקונספירציות) הראו אפקט גדול (d=0.80)"]])}`,q:"q23"},
  {h:"מי מושפע יותר",html:`<p>נבדקו גיל, גזע, מגדר, השכלה, עמדה פוליטית, קיצוניות פוליטית, דתיות, היכרות ושימוש ב-AI, אמון ב-AI ואמון במוסדות. רק שני משתנים מיתנו באופן עקבי:</p>${tiles([["check","אמון ב-AI גנרטיבי","יותר אמון → אפקט גדול יותר"],["building","אמון במוסדות","יותר אמון → אפקט גדול יותר"]])}${rem("ניתוח נוסף מצא שבכל תת־הקבוצות האפקט הממוצע נע בין ירידה של 8.14 ל-18.89 נקודות. כלומר <b>הטיפול הוריד אמונה בכל הקבוצות</b>, גם אצל מי שכמעט לא סומך על AI.")}`,q:"q25"}
 ]},
 {id:"t6",icon:"chart",title:"השפעות נוספות ודיוק ה-AI",blocks:[
  {h:"זליגה לקונספירציות אחרות",html:`${def("על מה הנושא",`השפעות נוספות: האם זה זולג לאמונות אחרות, משנה התנהגות, והאם ה-AI בכלל צדק?<br><b>מה נלמד כאן:</b> זליגה · כוונות התנהגות · דיוק ה-AI`)}<p>השיחה עסקה בקונספירציה <b>אחת</b>. האם היא השפיעה גם על אחרות? בדקו את 15 הקונספירציות של BCTI במחקר 1:</p>${tiles([["chart","כל הקונספירציות","ירידה של 2.98 נקודות (7.94%) בטיפול, לעומת עלייה של 1.04 בביקורת. אחרי חודשיים עדיין ירידה של 2.23"],["target","רק אלה שהאמינו בהן","ירידה של 9.34 נקודות (12.49%), לעומת 2.82 בביקורת. ההבדל נשמר גם אחרי חודשיים"]])}${rem("כלומר הייתה ירידה כללית ב<b>תפיסת עולם קונספירטיבית</b>, לא רק באמונה הספציפית.")}`,q:"q27"},
  {h:"כוונות התנהגות (מחקר 2)",html:`${yn(["יותר כוונה להתעלם או להפסיק לעקוב אחרי חשבונות שמפיצים את הקונספירציה","יותר נכונות להתעלם או להתווכח עם מי שמאמין בה"],["ירידה לא מובהקת בכוונה להצטרף להפגנות בעד הקונספירציה"])}${def("למה ההפגנות לא מובהקות",`הכוונות האלה היו <b>נמוכות כבר בהתחלה</b>, ואולי היה <mark>אפקט רצפה</mark> ${E("Floor effect")}: אין הרבה מקום לרדת.`)}`,q:"q29"},
  {h:"עד כמה ה-AI מדויק",html:`<p>בודק עובדות מקצועי בדק <b>128 טענות</b> של ה-AI מתוך שיחות מייצגות:</p>${tiles([["check","99.2%","נכונות (127 טענות)"],["question","0.8%","מטעה (טענה אחת)"],["x","0","שגויות. וגם בלי הטיה ליברלית או שמרנית"]])}${def("קונספירציות אמיתיות",`ב-0.72% מהמקרים המשתתף בחר קונספירציה <b>שהייתה אמיתית</b> (למשל MK Ultra). שם הטיפול <b>לא</b> הוריד את האמונה. כלומר ה-AI לא \"מכבה\" כל אמונה בקונספירציה.`)}`,q:"q31"}
 ]},
 {id:"t7",icon:"bulb",title:"דיון ומשמעויות",blocks:[
  {h:"המשמעות התיאורטית",html:`${def("על מה הנושא",`מה זה אומר על האופן שבו אנשים חושבים, ומה הסכנות והמגבלות?<br><b>מה נלמד כאן:</b> משמעות תיאורטית · משמעות מעשית · הבטחה וסכנה · מגבלות`)}<p>הממצאים מערערים על הדעה שראיות כמעט חסרות תועלת אחרי שמישהו "נפל למחילת הארנב", ועל תיאוריות שמציבות <b>צרכים ומניעים</b> במרכז.</p>${def("החשיבה האנליטית",`הממצאים מתאימים יותר לגישה שנותנת תפקיד מרכזי ל<b>חשיבה אנליטית</b> בהגנה מפני אמונות מפוקפקות (אמונות טפלות, מידע כוזב). לפיה, החשיבה לא כבולה בצורכי זהות: אנשים <b>מוכנים לעדכן</b> אמונות מול ראיות משכנעות.`)}${tiles([["doc","ראיות ולא צרכים","ה-AI נתן בעיקר הסברים חלופיים וראיות ועודד חשיבה ביקורתית, ולא ניסה לספק צרכים"],["clock","הדרך המרכזית","העמידות לאורך חודשיים וההשפעה על קונספירציות אחרות מתאימות ל<b>דרך המרכזית</b> לשכנוע, שמובילה לשינוי יציב, בניגוד ל<b>דרך ההיקפית</b> (רגש, סימני זהות) שמובילה לשינוי חולף"]])}${rem("החוקרים לא שוללים לגמרי תפקיד לצרכים ולמניעים. וחשוב: המטרה כאן, להפריך אמונה <b>קיימת</b>, שונה ממחקרים קודמים (חיסון מראש, הפרכה לקהל כללי), שהצליחו בצורה מתונה (מטא־אנליזה: g=0.16).")}`,q:"q33"},
  {h:"משמעות מעשית",html:`<p>בניגוד לרעיון של עולם \"פוסט־אמת\" שבו עובדות לא חשובות, <b>אין לוותר על טיעונים וראיות</b>. מודלי AI הם כלים חזקים וגמישים להפחתת אמונות מפוקפקות, וגם בהיקף גדול.</p>${tiles([["question","חיפוש באינטרנט","חיפושים על קונספירציות יכולים לקבל סיכום מדויק ומותאם שמזמין תגובה"],["people","רשתות חברתיות","חשבונות AI יכולים להגיב למי שמשתף תוכן קונספירטיבי לא מדויק"]])}${def("האתגר",`לא סביר שרוב המאמינים המושבעים יבחרו לשוחח עם צ'טבוט. כיווני מחקר: <b>משחוק</b>, שקיפות (חשיפת ההנחיות, מקורות), תמריצים, אנונימיות ותרגילי חשיבה ביקורתית בבתי ספר.`)}`,q:"q35"},
  {h:"הבטחה וסכנה",html:`<p>בלי מגבלות מתאימות, אותם מודלים יכולים גם <b>לשכנע</b> אנשים לאמץ אמונות מפוקפקות, או לשמש לשכנוע המוני. לכן חשוב לצמצם הזדמנויות לשימוש לא אחראי. שאלה פתוחה: האם השכנוע של AI יעיל באותה מידה לתוכן <b>נכון</b> ולתוכן <b>כוזב</b>?</p>${def("תרומה מתודולוגית",`ניסויי סקר רגילים משתמשים בגירויים <b>קבועים</b>. כאן מודל שפה בזמן אמת מאפשר לקבל אמונות בניסוח פתוח, להפוך אותן למדדים כמותיים, ולנהל דיאלוג <b>מותאם</b> לכל אדם. השיחות גם יוצרות נתוני טקסט עשירים לניתוח.`)}`,q:"q37"},
  {h:"מגבלות ומסקנה",html:`${tiles([["people","הכללה","משיבים אמריקאים בסקרים מקוונים בתשלום. צריך לבדוק מי שלא משתתף בסקרים, ותרבויות אחרות"],["target","מאמינים קיצוניים","לא ידוע אם זה יעבוד אצל חברים פעילים בקבוצות קונספירציה"],["lock","מודל סגור","GPT-4 Turbo סגור, וזה מקשה על פרשנות ושכפול. לא ידוע אם מודלים אחרים יעבדו כך"],["question","מנגנון","כל שיחה ייחודית ומשלבת טיעונים ורמזים חברתיים. הניתוח מצביע על טיעונים עובדתיים, אבל צריך עוד מחקר"]])}${def("המסקנה",`שיחה קצרה יחסית עם AI יכולה ליצור ירידה <b>גדולה ומתמשכת</b> באמונות קונספירטיביות, גם אצל מאמינים מושבעים. אולי פשוט לא קיבלו עד עכשיו ראיות טובות מספיק. <mark>"גם למחילת הארנב העמוקה ביותר יש יציאה"</mark>.`)}`,q:"q39"}
 ]}
];
const Q={
q1:{t:"t1",v:[
 {q:"איזו טענה עונה על ההגדרה של ״תיאוריית קונספירציה״ במאמר?",a:"״חברות התרופות מסתירות בכוונה תרופה למחלה כדי להרוויח״",w:["״התרופה החדשה לא נבדקה מספיק לפני שאושרה״","״יש בעיות בטיחות בתרופה שהחברה לא פרסמה מהר מספיק״","״הרגולטור עובד לאט מדי ומאשר תרופות באיחור״"],e:"קונספירציה: מזימה סודית וזדונית של קושרים חזקים. השאר הם ביקורת שאין בה מזימה."},
 {q:"למה אמונה בקונספירציה מאתגרת תיאוריות שמדגישות חשיבה והיגיון?",a:"כי היא נשארת גם מול ראיות סותרות",w:["כי רוב האנשים לא מאמינים בקונספירציות","כי קונספירציות תמיד מבוססות על עובדות","כי אנשים חכמים לא מאמינים בהן"],e:"היא נחשבת דוגמה קלאסית לעמידות לראיות."}]},
q2:{t:"t1",v:[
 {q:"לפי ההסבר המקובל, למה הפרכה עובדתית אמורה להיכשל מול מאמין בקונספירציה?",a:"כי האמונה משמשת לאיזון נפשי וקשורה לזהות, ולא רק לעובדות",w:["כי למאמינים אין גישה למידע אמין ומדויק","כי מאמינים לא מבינים טיעונים מורכבים ומדעיים","כי אין ראיות אמיתיות שסותרות את רוב הקונספירציות"],e:"אם האמונה עונה על צרכים, היא יותר מדעה."},
 {q:"מאמין בקונספירציה קורא כתבה שמפריכה אותה, ומסיק ש״הכתבה עצמה היא חלק מהטיוח״. איזה מושג מהמאמר זה ממחיש?",a:"חשיבה מונעת",w:["הדרך המרכזית לשכנוע","אפקט רצפה","הפרכה מן המדף"],e:"עיבוד מידע מוטה שבו מתעלמים מראיות סותרות."}]},
q3:{t:"t1",v:[
 {q:"אדם שמרגיש שהעולם כאוטי מאמץ קונספירציה שמסבירה ״מי באמת שולט״. איזה צורך היא מספקת לפי ההסבר המקובל?",a:"שליטה וודאות",w:["ייחודיות","שייכות לקבוצה","הישגיות"],e:"הסבר שמראה ״יד מכוונת״ מספק תחושת שליטה וצפיות."},
 {q:"איזה מהבאים אינו צורך שקונספירציות מספקות לפי ההסבר המקובל?",a:"שייכות לארגון עבודה",w:["ייחודיות ובולטות","ביטחון ויציבות","ודאות וצפיות"],e:"הצרכים: שליטה, ודאות, ביטחון וייחודיות."}]},
q4:{t:"t1",v:[
 {q:"מה המסקנה ״העגומה״ שנובעת מגישת הצרכים?",a:"שקשה מאוד לשכנע בעובדות בלי לשנות את הפסיכולוגיה והזהות",w:["שאפשר לשכנע כל אחד בעזרת מספיק עובדות ונתונים","שקונספירציות נעלמות מעצמן עם הזמן ובלי התערבות","שרק מומחים בתחום יכולים לשכנע מאמינים מושבעים"],e:"זה מה שהמחקר מנסה לערער."},
 {q:"אילו שני מנגנונים נוספים, מעבר לצרכים, מסבירים לפי ההסבר המקובל את העמידות של קונספירציות?",a:"זהות ושייכות לקבוצה, וחשיבה מונעת",w:["חוסר השכלה ומחסור במידע אמין","גיל מבוגר ודתיות גבוהה","אפקט רצפה ואפקט תקרה במדידה"],e:"קונספירציות קשורות לזהות, ומאמינים מתעלמים מראיות סותרות."}]},
q5:{t:"t2",v:[
 {q:"לפי החוקרים, למה התערבויות עובדתיות קודמות כנראה נכשלו?",a:"כי הן לא היו עמוקות ומותאמות אישית לראיות של כל מאמין",w:["כי עובדות לא משפיעות על אמונות בכלל, בשום מצב","כי הן לא הועברו על ידי מומחים מוכרים בתחום","כי המאמינים לא קראו אותן עד הסוף"],e:"זו ההשערה החלופית של המאמר."},
 {q:"מאמין בקונספירציה מקבל דף מידע כללי שמפריך אותה, ולא משתכנע. מה החוקרים היו אומרים?",a:"ההפרכה ״מן המדף״ לא ענתה על הראיות הספציפיות שלו",w:["הוא לא השתכנע כי האמונה מספקת לו צורך נפשי","הוא לא השתכנע כי לא היה AI מעורב בתהליך","הוא לא השתכנע כי הדף היה ארוך ומסובך מדי"],e:"הפרכה כללית לא עונה על מה שהמאמין עצמו מביא."}]},
q6:{t:"t2",v:[
 {q:"למה הבקיאות של מאמינים מושבעים היא בעיה להפרכה רגילה?",a:"כי יש להם ״ראיות״ רבות שספקנים לא יודעים להפריך",w:["כי הם תמיד צודקים בעובדות שהם מביאים לדיון","כי הם מסרבים לדבר עם מי שלא מאמין כמוהם","כי הם לא מבינים מה זו ראיה במובן המדעי"],e:"גם ראיות שגויות קשות להפרכה כשאין מספיק ידע."},
 {q:"מה הכוונה ב״הטרוגניות״ של מאמינים?",a:"כל מאמין מחזיק בקונספירציות וראיות שונות",w:["המאמינים באים מקבוצות דמוגרפיות שונות","המאמינים משנים את דעתם כל הזמן","יש מאמינים קיצוניים ויש מתונים"],e:"לכן הפרכה אחידה לא עובדת לכולם."}]},
q7:{t:"t2",v:[
 {q:"למה דווקא מודל שפה מתאים לבדוק את ההשערה של החוקרים?",a:"כי יש לו ידע רחב, והוא מתאים את הטיעון לכל אדם",w:["כי אנשים סומכים על מחשבים יותר מעל בני אדם","כי הוא זול יותר מהעסקת מומחים","כי הוא לא יכול לטעות בעובדות"],e:"שתי היכולות עונות בדיוק על ״עומק״ ו״התאמה אישית״."},
 {q:"איזו הוראה קיבל ה-AI בניסוי?",a:"לשכנע ביעילות רבה נגד הקונספירציה",w:["להציג את שני הצדדים באופן מאוזן","לספק למשתתף תחושת שליטה וביטחון","לשאול את המשתתף על הזהות שלו"],e:"המטרה הייתה שכנוע מבוסס ראיות."}]},
q8:{t:"t2",v:[
 {q:"למה ה-AI קיבל את התיאור של המשתתף ואת רמת האמונה שלו כבר בתחילת השיחה?",a:"כדי להתאים את הטיעון לראיות הספציפיות של אותו אדם",w:["כדי לבדוק אם המשתתף משקר לגבי האמונה שלו","כדי להחליט לאיזו קבוצה לשבץ את המשתתף","כדי לחשב את גודל האפקט הצפוי עוד לפני השיחה"],e:"זה בדיוק מה שמאפשר התאמה אישית."},
 {q:"למה חשוב שהמשתתפים ידעו שהם מדברים עם AI?",a:"כדי למנוע הטעיה",w:["כדי להגביר את האמון בתשובות","כדי שהשיחה תהיה קצרה יותר","כדי שהמשתתפים יכתבו יותר"],e:"החוקרים נמנעו מהטעיה במכוון."}]},
q9:{t:"t3",v:[
 {q:"למה ביקשו מהמשתתפים לתאר את הקונספירציה במילים שלהם, ולא רק לדרג פריטים בשאלון?",a:"כי שאלון קבוע לא מייצג את כל הקונספירציות",w:["כי שאלון לוקח יותר מדי זמן למילוי","כי המשתתפים לא הבינו את השאלון","כי שאלון לא מאפשר לחשב גודל אפקט"],e:"זו ביקורת ותיקה על שאלונים כמו BCTI."},
 {q:"משתתף דירג את הסיכום של הקונספירציה שלו ב-40. מה קרה לו?",a:"הוא לא נכלל בניתוח, כי דירג מתחת לאמצע",w:["הוא שובץ לקבוצת הביקורת במקום לטיפול","הוא נכלל בניתוח כמאמין בינוני","הוא קיבל שיחה ארוכה יותר עם ה-AI"],e:"נכללו רק מי שהביעו אמונה, כלומר מעל 50."}]},
q10:{t:"t3",v:[
 {q:"מה היה התפקיד של הסיכום במשפט אחד שה-AI כתב?",a:"ליצור מדד כמותי לאמונה שתוארה בניסוח פתוח",w:["לשכנע את המשתתף כבר בשלב הראשון","לבדוק אם המשתתף קשוב לאורך הניסוי","להחליט לאיזו קבוצה לשבץ את המשתתף"],e:"המשתתף דירג את האמונה בסיכום, לפני ואחרי."},
 {q:"מה מילאו המשתתפים במחקר 1 לפני התיאור האישי?",a:"שאלון של 15 קונספירציות מוכרות ומטלה מסיחה",w:["שאלון על אמון ב-AI ועל שימוש בו","ראיון אישי עם אחד מהחוקרים","שאלון על צרכים פסיכולוגיים כמו שליטה"],e:"השאלון (BCTI) שימש גם לבדיקת זליגה."}]},
q11:{t:"t3",v:[
 {q:"למה השתמשו בכמה נושאי שיחה שונים בקבוצת הביקורת, ואז איחדו אותם?",a:"כי לא נמצאו הבדלים ביניהם",w:["כי המשתתפים ביקשו לשנות נושא","כי כל נושא התאים לסוג אחר של קונספירציה","כי רק אחד מהם היה ניטרלי באמת"],e:"שיחות על בריאות, כלבים מול חתולים או כבאים נתנו תוצאות דומות."},
 {q:"מה התפקיד של קבוצת הביקורת בניסוי?",a:"לוודא שהשיחה על הקונספירציה היא שהורידה אמונה",w:["לבדוק אם המשתתפים מאמינים בקונספירציה","לבדוק את הדיוק של ה-AI","לבדוק אם השאלון מהימן"],e:"הביקורת שוחחה עם AI על נושא ניטרלי."}]},
q12:{t:"t3",v:[
 {q:"במחקר 1, 73.5% מהמשתתפים הביעו אמונה בקונספירציה. למה החוקרים חשדו בנתון הזה?",a:"הוא גבוה מההערכות, ואולי השאלון הבליט קונספירציות",w:["הוא היה נמוך מדי ביחס להערכות","המשתתפים לא היו מייצגים מבחינה דמוגרפית","הוא חושב לפני הוצאת המשתתפים הלא קשובים"],e:"זו אחת הסיבות למחקר 2."},
 {q:"מה היה מאפיין המדגם במחקר 1?",a:"אמריקאים, במדגם מותאם למפקד האוכלוסין",w:["סטודנטים לפסיכולוגיה מאוניברסיטה אחת","חברים פעילים בקבוצות קונספירציה","אנשים מכמה מדינות ותרבויות שונות"],e:"מותאם בגיל, מגדר, גזע ומוצא."}]},
q13:{t:"t3",v:[
 {q:"במחקר 1, כרבע מקבוצת הטיפול עברו ל״לא בטוח״ אחרי השיחה. מה המשמעות?",a:"חלק ניכר הפסיקו להאמין, לא רק האמינו פחות",w:["רוב המשתתפים לא הושפעו בכלל","האמונה עלתה אצל רוב המשתתפים","הירידה הייתה זהה בטיפול ובביקורת"],e:"27.3% בטיפול, לעומת 2.3% בביקורת."},
 {q:"מה מראה ההשוואה בין ירידה של כ-22% בטיפול לכ-1% בביקורת?",a:"שהנושא, ולא עצם השיחה עם AI, הוריד אמונה",w:["שכל שיחה עם AI מורידה אמונה באותה מידה","שקבוצת הביקורת לא הייתה ניטרלית באמת","שהמדידה לא הייתה מהימנה לאורך הניסוי"],e:"זו הלוגיקה של קבוצת ביקורת."}]},
q14:{t:"t3",v:[
 {q:"למה בדקו את 330 המשתתפים שהקונספירציה שלהם דמתה לפריט בשאלון?",a:"כדי לוודא שהתוצאה לא תלויה רק בשיטת המדידה החדשה",w:["כדי לבדוק אם הם קשובים יותר משאר המשתתפים","כדי להשוות אותם לקבוצת הביקורת בלבד","כדי לבחון זליגה לקונספירציות אחרות שלא נדונו"],e:"גם בפריט הקבוע נמצאה ירידה."},
 {q:"מה גודל האפקט (d) במחקר 1, וכמה הוא נחשב?",a:"1.15, אפקט גדול מאוד",w:["0.16, אפקט קטן","0.53, אפקט בינוני","0.82, אפקט בינוני"],e:"בהשוואה למטא־אנליזה של התערבויות קודמות (0.16), זה הבדל עצום."}]},
q15:{t:"t3",v:[
 {q:"15.8% מהמשתתפים לא חזרו למעקב. איך החוקרים הראו שזה לא מסביר את התוצאה?",a:"הניחו שחזרו לאמונה, והאפקט נשאר מובהק",w:["הוציאו אותם מהניתוח בלי בדיקה נוספת","הניחו שגם הם השתכנעו כמו האחרים","השוו אותם לקבוצת הביקורת בלבד"],e:"ניתוח שמרני שמחזק את המסקנה."},
 {q:"מה נמצא במעקב אחרי 10 ימים ואחרי חודשיים?",a:"האמונה נשארה נמוכה, בלי שינוי מובהק",w:["האמונה חזרה בהדרגה לרמה המקורית","האמונה המשיכה לרדת עוד","האמונה חזרה רק אצל מאמינים מושבעים"],e:"ההשפעה יציבה מאוד."}]},
q17:{t:"t4",v:[
 {q:"למה במחקר 2 ויתרו על שאלון 15 הקונספירציות לפני התיאור האישי?",a:"כי ייתכן שהשאלון הבליט קונספירציות",w:["כי השאלון לא היה מהימן במחקר הקודם","כי לא היה צורך לבדוק זליגה במחקר הזה","כי המשתתפים התלוננו על האורך שלו"],e:"שיעור המאמינים אכן ירד ל-58.9%."},
 {q:"למה חסמו העתק־הדבק במחקר 2?",a:"כדי שהמשתתפים לא ישתמשו בעצמם במודלי שפה",w:["כדי שהמשתתפים יכתבו תשובות קצרות יותר","כדי למנוע העתקה מהשאלון של מחקר 1","כדי לשמור על האנונימיות של המשתתפים"],e:"כך התשובות הן של המשתתפים עצמם."}]},
q18:{t:"t4",v:[
 {q:"במחקר 2 שאלו ״האם אחת מהתיאוריות האלה משכנעת אותך?״ במקום ״במה אתה מאמין?״. מה המטרה?",a:"להקטין את ההבלטה ואת הלחץ לדווח",w:["להגדיל את מספר המאמינים במדגם החדש","לבדוק את ההגדרה של ״תיאוריה״ בציבור","לחסוך זמן בשלבים הראשונים של הניסוי"],e:"שינוי ניסוח כדי לבדוק אם התוצאות של מחקר 1 נובעות מההליך."},
 {q:"כמה מהמשתתפים במחקר 2 עמדו בתנאים, ולמה זה פחות ממחקר 1?",a:"58.9%, כי ההליך לא הבליט קונספירציות",w:["73.5%, בדיוק כמו במחקר הקודם","90%, כי המדגם היה גדול יותר","30%, כי רבים לא היו קשובים"],e:"בלי השאלון המקדים, פחות דיווחו על אמונה."}]},
q19:{t:"t4",v:[
 {q:"השכפול עם מדגם Lucid נתן אפקט קטן יותר (d=0.53). למה זה בכל זאת מחזק את המסקנה?",a:"כי גם משיבים לא קשובים הושפעו",w:["כי אפקט קטן יותר אמין יותר","כי Lucid מייצג רק מאמינים מושבעים","כי זה מראה שהאפקט תלוי בקשב"],e:"ההשפעה לא מוגבלת למשתתפים מעורבים."},
 {q:"מה הייתה הירידה באחוזים בקבוצת הטיפול במחקר 2?",a:"כ-20%, לעומת כ-3% בביקורת",w:["כ-50%, לעומת כ-10% בביקורת","כ-5%, לעומת כ-1% בביקורת","כ-20%, וגם בביקורת כ-20%"],e:"19.67% לעומת 3.27%."}]},
q20:{t:"t4",v:[
 {q:"מחקר 2 שינה את ההליך וקיבל אפקט קטן יותר, אבל עדיין גדול. מה המסקנה?",a:"התוצאה שוכפלה, ואינה תוצר של ההליך של מחקר 1",w:["התוצאה של מחקר 1 הייתה כנראה שגויה","ההליך של מחקר 2 היה פחות תקין מהראשון","אי אפשר להשוות בין המחקרים בגלל השינויים"],e:"זו מטרת השכפול."},
 {q:"איזה מחקר הראה אפקט גדול יותר?",a:"מחקר 1 (d=1.15), לעומת מחקר 2 (d=0.82)",w:["מחקר 2 (d=1.15), לעומת מחקר 1 (d=0.82)","שניהם הראו אפקט זהה","מחקר Lucid הראה את האפקט הגדול ביותר"],e:"שניהם גדולים, אבל מחקר 1 גדול יותר."}]},
q21:{t:"t5",v:[
 {q:"מישהו טוען: ״זה עובד רק על קונספירציות שוליות, לא על אמונות פוליטיות עמוקות.״ מה מראה המחקר?",a:"זה עבד גם על הונאה בבחירות 2020 ועל הקורונה",w:["הוא צודק, האפקט נעלם בקונספירציות פוליטיות","האפקט עבד רק על קונספירציות קלאסיות כמו חייזרים","המחקר לא בדק קונספירציות פוליטיות"],e:"גם בקונספירציות בולטות ומושרשות."},
 {q:"איך סיווגו החוקרים את סוגי הקונספירציות?",a:"בעזרת עיבוד שפה טבעית",w:["לפי שאלון שהמשתתפים מילאו","לפי שיפוט של שלושה חוקרים","לפי רשימה קבועה מראש של 15 סוגים"],e:"והאמונה ירדה בכל 12 הסוגים הנפוצים."}]},
q23:{t:"t5",v:[
 {q:"משתתף אמר שהקונספירציה מאוד חשובה לתפיסת העולם שלו. מה צפוי לפי הממצאים?",a:"אפקט קטן יותר, אבל עדיין מובהק",w:["אפקט גדול יותר, כי הוא מעורב","אין אפקט בכלל","האמונה דווקא תתחזק"],e:"גם ברמת החשיבות הגבוהה ביותר d=0.67."},
 {q:"מה נמצא אצל מי שמאמינים כמעט בכל 15 הקונספירציות בשאלון?",a:"גם אצלם נמצא אפקט גדול",w:["אצלם האפקט נעלם","אצלם האמונה התחזקה","הם לא נכללו במחקר"],e:"d=0.80 באחוזון ה-90 ומעלה."}]},
q24:{t:"t5",v:[
 {q:"הקשר בין עוצמת האמונה המקורית לגודל האפקט היה בצורת U. מה המשמעות העיקרית?",a:"עוצמת האמונה שינתה את גודל האפקט, בלי לבטל אותו",w:["ככל שהאמונה חזקה יותר, האפקט גדול יותר","רק אצל המאמינים החלשים היה אפקט","לא היה קשר בין עוצמת האמונה לאפקט"],e:"האפקט היה קיים בכל הרמות."},
 {q:"האם חשיבה קונספירטיבית כללית מיתנה את האפקט באופן מובהק?",a:"לא",w:["כן, היא ביטלה אותו","כן, היא הגבירה אותו מאוד","כן, אבל רק במחקר 2"],e:"גם מי שמאמין כמעט בהכול הושפע."}]},
q25:{t:"t5",v:[
 {q:"אילו שני משתנים מיתנו את האפקט באופן עקבי?",a:"אמון ב-AI ואמון במוסדות",w:["עמדה פוליטית ודתיות","גיל והשכלה פורמלית","מגדר וקיצוניות פוליטית"],e:"יותר אמון ← אפקט גדול יותר."},
 {q:"מה מראה הטווח של האפקט בתת־הקבוצות (ירידה של 8 עד 19 נקודות)?",a:"שהטיפול הוריד אמונה בכל תת־הקבוצות",w:["שבחלק מהקבוצות האמונה עלתה","שהאפקט היה זהה בכל הקבוצות","שהאפקט היה רק בקבוצות עם אמון ב-AI"],e:"גם מי שכמעט לא סומך על AI הושפע."}]},
q26:{t:"t5",v:[
 {q:"מישהו טוען שהשיטה עובדת רק על ליברלים. מה מראים הממצאים?",a:"עמדה פוליטית לא מיתנה באופן עקבי",w:["השיטה עבדה רק על ליברלים","השיטה עבדה רק על שמרנים","המחקר לא בדק עמדות פוליטיות כלל"],e:"רק אמון ב-AI ואמון במוסדות מיתנו באופן עקבי."},
 {q:"מה נמצא אצל אנשים עם אמון מינימלי ב-AI?",a:"גם אצלם האמונה ירדה",w:["אצלם האמונה התחזקה","אצלם לא היה שינוי בכלל","הם סירבו לשוחח עם ה-AI"],e:"האפקט קטן יותר, אבל קיים."}]},
q27:{t:"t6",v:[
 {q:"השיחה עסקה רק בקונספירציה אחת, אבל האמונה ירדה גם בקונספירציות אחרות. מה זה מרמז?",a:"ירידה כללית בתפיסת עולם קונספירטיבית",w:["שהמדידה לא הייתה מדויקת","שהמשתתפים ניסו לרצות את החוקרים","שכל הקונספירציות זהות בתוכנן"],e:"זליגה מעידה על שינוי רחב יותר."},
 {q:"באילו קונספירציות אחרות הירידה הייתה הגדולה ביותר?",a:"באלה שהמשתתף האמין בהן לפני הטיפול",w:["באלה שהמשתתף לא הכיר בכלל","באלה שדומות לנושא שיחת הביקורת","באלה שהיו פחות פופולריות בציבור"],e:"ירידה של 9.34 נקודות, שנשמרה גם אחרי חודשיים."}]},

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{

    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;

    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
