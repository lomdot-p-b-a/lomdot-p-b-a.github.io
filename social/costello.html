<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת קריאה: Durably reducing conspiracy beliefs through dialogues with AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"הרקע: למה קשה לשכנע",blocks:[
  {h:"קונספירציות ועמידות לראיות",html:`${def("על מה הנושא",`למה כל כך קשה לשכנע מישהו שמאמין בקונספירציה? הנושא מציג את ההסבר המקובל: האמונה עונה על צרכים פסיכולוגיים.<br><b>מה נלמד כאן:</b> תיאוריית קונספירציה · צרכים פסיכולוגיים · עמידות לראיות`)}${def("מושג מפתח",`<mark>תיאוריית קונספירציה</mark> ${E("Conspiracy theory")}: הסבר שלפיו אירועים נגרמים בגלל <b>מזימות סודיות וזדוניות</b> של קושרים חזקים.`)}<p>תיאוריות כאלה לרוב לא סבירות, ובכל זאת חלק גדול מהעולם מאמין בהן, לפי הערכות קודמות <b>עד 50% מהאוכלוסייה בארה"ב</b>. אמונה בקונספירציה נחשבת <b>דוגמה קלאסית לעמידות לראיות</b>: כמעט אין עדויות להתערבויות שהצליחו להפריך קונספירציה אצל מי שכבר מאמין בה.</p>${rem("העמידות הזו מאתגרת תיאוריות שמדגישות את התפקיד של <b>חשיבה והיגיון</b> ביצירת אמונות ובשינוי שלהן.")}${ex(`<b>קונספירציה</b>: "הנחיתה על הירח צולמה באולפן, והממשלה מסתירה את זה". ההסבר הוא שקבוצה חזקה פועלת בסתר, ולא אירוע רגיל.`)}`,q:"q1"},
  {h:"ההסבר המקובל: צרכים פסיכולוגיים",html:`<p>ההסברים המקובלים מתמקדים בתהליכים חברתיים־פסיכולוגיים שמקהים חשיבה רציונלית. לפיהם, אנשים מאמצים קונספירציות כדי לספק <b>"צרכים"</b> או מניעים פסיכולוגיים:</p>${tiles([["target","שליטה","רצון לשליטה בסביבה ובחוויות","אחד הצרכים שקונספירציות ממלאות: הרגשה שאנחנו מבינים מה ״באמת״ קורה, ולכן שולטים במצב.","לאבי נעים להרגיש שהוא ״יודע את האמת״ על הנחיתה, בזמן שאחרים ״מאמינים לכל מה שאומרים להם״."],["check","ודאות","ודאות וצפיות","העולם מבלבל ומלא מקריות. קונספירציה נותנת הסבר ברור וצפוי: ״זה לא קרה סתם, מישהו תכנן את זה״.","במקום להתמודד עם שאלות מסובכות על חלל וטכנולוגיה, אבי מקבל תשובה פשוטה: ״הכול צולם באולפן״."],["lock","ביטחון","ביטחון ויציבות","אמונה בקונספירציה יכולה לתת תחושת יציבות וביטחון מול עולם מאיים: יש ״אשמים״ ברורים.","כשאבי מרגיש שהמוסדות לא מגינים עליו, ההסבר ״הם שיקרו לנו״ נותן לו תחושה שהוא לפחות לא תמים."],["id","ייחודיות","תחושה של ייחודיות","להאמין בקונספירציה נותן תחושה של להיות שונה ומיוחד, ״מהמעטים שיודעים״.","אבי נהנה להרגיש שהוא חלק מקבוצה קטנה שרואה מה שהרוב לא רואה."]])}${def("למה זה אמור להיות עמיד",`אם האמונה מספקת צרכים, היא יותר מדעה: היא מנגנון של <b>איזון נפשי</b>, ולכן אמורה להיות עמידה מאוד לראיות. בנוסף, קונספירציות קשורות ל<b>זהות</b> ולשייכות לקבוצה, ואנשים עשויים להשתמש ב<mark>חשיבה מונעת</mark> ${E("Motivated reasoning")} ולהתעלם מראיות סותרות.`)}${rem("התמונה העגומה: אם המאמינים \"רוצים\" להאמין, כמעט בלתי אפשרי לשכנע אותם בעובדות, בלי לשנות לעומק את הפסיכולוגיה והזהות שלהם.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"brain",title:"ההשערה: לא מספיק עמוק ולא מספיק אישי",blocks:[
  {h:"ההשערה של החוקרים",html:`${def("על מה הנושא",`החוקרים הציעו הסבר אחר: אולי פשוט אף אחד לא הביא ראיות טובות ומותאמות אישית. הנושא מציג את ההשערה, ולמה בחרו בצ'טבוט.<br><b>מה נלמד כאן:</b> ההשערה · למה מודל שפה · הצינור המחקרי`)}<p>החוקרים מערערים על התפיסה המקובלת ושואלים: אולי אפשר להוציא אנשים מ<b>"מחילת הארנב"</b> הקונספירטיבית בעזרת ראיות משכנעות מספיק?</p>${def("ההשערה",`התערבויות שמבוססות על עובדות נראות לא יעילות, כי חסרים להן <b>עומק</b> ו<b>התאמה אישית</b>.`)}${tiles([["doc","מאמינים בקיאים","מאמינים מושבעים מכירים היטב את הנושא, עם רשימות ארוכות של \"ראיות\" (גם אם שגויות) שמשאירות ספקנים בלי תשובה","מאמינים בקונספירציה מכירים הרבה ״ראיות״, ולכן קשה להתווכח איתם בשיחה רגילה. בשביל זה צריך מישהו שמכיר את הטיעונים לעומק.","אבי מביא עשרה ״פרטים חשודים״ על הנחיתה על הירח, וחבר שלו לא יודע מה לענות על אף אחד."],["people","כל אחד והראיות שלו","אנשים מאמינים בהרבה קונספירציות, והראיות של כל מאמין שונות"],["x","הפרכה \"מן המדף\"","הפרכה כללית של קונספירציה לא עונה על הראיות הספציפיות של המאמין, ולכן לא משכנעת"]])}${ex(`נניח שמישהו בטוח שהנחיתה על הירח זויפה כי "הדגל מתנופף". דף עובדות כללי לא יענה לו. אבל מישהו שיסביר לו בדיוק למה הדגל נראה כך, יענה על הטענה <b>שלו</b>.`)}`,q:"q5"},
  {h:"למה דווקא מודל שפה",html:`<p>מודלי שפה גדולים ${E("LLMs")} פותרים את הבעיות האלה בזכות שתי יכולות:</p>${tiles([["data","ידע עצום","גישה לכמות עצומה של מידע בתחומים רבים"],["target","התאמה אישית","יכולת להתאים טיעונים נגדיים לקונספירציה, להיגיון ולראיות של כל מאמין","המחקר הניח שהבעיה בשכנוע מאמינים היא שלא מגיבים לראיות המסוימות שלהם. בינה מלאכותית יכולה להתאים את הטיעונים בדיוק למה שכל אדם מאמין ולמה שהוא מביא.","אבי טוען ״הדגל זז ברוח, ואין רוח בירח״, והמודל עונה בדיוק על זה, ולא על טענות שאבי בכלל לא העלה."]])}${def("הצינור המחקרי",`פיתחו שיטה לניסוי התנהגותי עם אינטראקציה <b>בזמן אמת</b> בין משתתפים לבינה מלאכותית (GPT-4 Turbo). ה-AI קיבל הוראה <b>"לשכנע ביעילות רבה"</b> נגד הקונספירציה, וקיבל את מה שהמשתתף כתב ואת רמת האמונה שלו כפתיחה לשיחה.`)}${rem("השיחה נמשכה בממוצע <b>8.4 דקות</b>, בשלושה סבבים הלוך ושוב. המשתתפים ידעו שהם מדברים עם AI, בלי הטעיה.")}`,q:"q7"}
 ]},
 {id:"t3",icon:"flask",title:"מחקר 1: האם אפשר להפריך?",blocks:[
  {h:"מהלך הניסוי",html:`${def("על מה הנושא",`מחקר 1: אנשים שוחחו עם AI על הקונספירציה שלהם. האם האמונה ירדה, והאם הירידה נשארה?<br><b>מה נלמד כאן:</b> מהלך הניסוי · תנאי הביקורת · התוצאה · מעקב`)}${fig("flow","מהלך הניסוי")}<p>קודם המשתתפים דירגו 15 קונספירציות מוכרות בשאלון ${E("BCTI")}, ואז ביצעו מטלה מסיחה. אחר כך תיארו קונספירציה שהם מאמינים בה <b>במילים שלהם</b>, עם הראיות שלה. ה-AI סיכם אותה במשפט, והמשתתף דירג את האמונה בסיכום (0 = "בוודאות לא נכון", 50 = "לא בטוח", 100 = "בוודאות נכון").</p>${rem("למה שאלה פתוחה? כך נמנעת ביקורת ותיקה על שאלונים קבועים כמו BCTI: הם לא מייצגים את כל הקונספירציות האפשריות.")}`,q:"q9"},
  {h:"המדגם והחלוקה",html:`${tiles([["people","1017 אמריקאים","מדגם מותאם למפקד האוכלוסין בגיל, מגדר, גזע ומוצא"],["check","73.5%","הביעו אמונה בקונספירציה ונכללו בניתוח","כשלושה רבעים מהמשתתפים הביעו אמונה בקונספירציה, ורק הם נכללו בניתוח. כך המחקר בדק אנשים שבאמת מאמינים.","מי שמלכתחילה לא האמין בקונספירציה לא נכלל, כי אין אצלו אמונה שאפשר להחליש."],["split","60% / 40%","שיבוץ אקראי: שיחה על הקונספירציה (טיפול) או על נושא ניטרלי (ביקורת)"]])}<p>שאר המשתתפים: 16.1% לא האמינו בקונספירציה או תיארו משהו לא קונספירטיבי, 5.3% דירגו מתחת לאמצע, 3.7% קיבלו סיכום לא מדויק, ו-1.3% מילאו את השאלון מהר מדי.</p>${def("תנאי הביקורת",`שיחה על <b>מערכת הבריאות האמריקאית</b>, ויכוח על <b>כלבים או חתולים</b>, או חוויות עם <b>כבאים</b>. לא נמצאו הבדלים ביניהם, ולכן אוחדו.`)}`,q:"q11"},
  {h:"התוצאה",html:`${def("ירידה גדולה",`השיחה הורידה את האמונה ב<b>16.55 נקודות</b> יותר מהביקורת (d=1.15). זו <mark>ירידה של 21.88%</mark> בקבוצת הטיפול, לעומת 1.31% בביקורת.`)}${tiles([["chart","27.3%","מקבוצת הטיפול עברו אחרי השיחה ל\"לא בטוח\" (מתחת לאמצע הסולם), לעומת 2.3% בביקורת","כרבע ממשתתפי קבוצת הטיפול כבר לא היו בטוחים בקונספירציה אחרי השיחה. בקבוצת הביקורת זה כמעט לא קרה.","אבי, שהיה בטוח לגמרי, אומר אחרי השיחה ״אני כבר לא יודע״."],["check","גם ב-BCTI","בקרב 330 שהקונספירציה שלהם דמתה לפריט ב-BCTI, נמצאה ירידה גם בפריט עצמו (d=0.68)"]])}`,q:"q13"},
  {h:"האם זה נשאר?",html:`${fig("results","האמונה ירדה ונשארה נמוכה")}<p>חזרו למשתתפים אחרי <b>10 ימים</b> ואחרי <b>חודשיים</b>. לא היה שינוי מובהק באמונה מאז הרגע שאחרי השיחה. ההשפעה <mark>יציבה מאוד</mark>.</p>${rem("גם בהנחה שמרנית ש-15.8% שלא חזרו למעקב חזרו לאמונה המקורית, השפעת הטיפול נשארה מובהקת.")}`,q:"q15"}
 ]},
 {id:"t4",icon:"copies",title:"מחקר 2: שכפול",blocks:[
  {h:"למה עוד מחקר",html:`${def("על מה הנושא",`מחקר 2 בדק אם התוצאה חוזרת שוב.<br><b>מה נלמד כאן:</b> שכפול · התוצאות`)}<p>במחקר 1 שיעור המאמינים היה גבוה מההערכות לגבי הציבור האמריקאי. ייתכן ש<b>שאלון ה-BCTI</b> שמילאו לפני כן הבליט קונספירציות מסוימות והגדיל את הדיווח.</p>${tiles([["x","בלי BCTI","הם עברו ישר לתיאור האישי","בקבוצת הביקורת, המשתתפים לא דיברו עם הבינה המלאכותית על הקונספירציה, אלא על נושא אישי. כך אפשר להשוות.","אבי בקבוצת הביקורת מדבר עם המערכת על התחביבים שלו, ולא על הקונספירציה."],["doc","ניסוח חדש","הוצגה הגדרה של תיאוריות כאלה, ושאלו אם מישהי מהן משכנעת, בלי לשאול ישירות \"במה אתה מאמין\""],["lock","בלי העתק־הדבק","כדי שהמשתתפים לא ישתמשו בעצמם במודלי שפה"]])}`,q:"q17"},
  {h:"התוצאות",html:`${studyTable}<p>במחקר 2 הגיעו לשלב הטיפול 2286 אמריקאים, ו-58.9% עמדו בתנאים. התוצאות של מחקר 1 <b>שוכפלו</b>.</p>${def("גם מדגם אחר",`שכפול נוסף נעשה עם מדגם מ-<b>Lucid</b>, שמספק משיבים יחסית <b>לא קשובים</b> שבעיקר ממלאים סקרים לא אקדמיים (d=0.53). כלומר ההשפעה לא מוגבלת למשתתפים קשובים ומעורבים.`)}`,q:"q19"}
 ]},
 {id:"t5",icon:"people",title:"עמידות ההשפעה",blocks:[
  {h:"בכל סוגי הקונספירציות",html:`${def("על מה הנושא",`האם ההשפעה עובדת על כולם ועל כל סוגי הקונספירציות?<br><b>מה נלמד כאן:</b> סוגי קונספירציות · מאמינים מושבעים · מי מושפע יותר`)}<p>החוקרים סיווגו את הקונספירציות בעזרת עיבוד שפה טבעית. ההשפעה <b>לא נבדלה</b> באופן מובהק בין הסוגים, והאמונה ירדה בכל <b>12 הסוגים</b> שהופיעו אצל יותר מ-1% מהמדגם.</p>${tiles([["target","גם פוליטיות","עבד גם בקונספירציות בולטות ומושרשות: הונאה בבחירות 2020 בארה\"ב (d=0.78) ומגפת הקורונה (d=0.69)"],["leaf","קלאסיות","רצח קנדי, חייזרים, האילומינטי","האפקט נמצא גם בקונספירציות ״ותיקות״ ומוכרות, ולא רק בחדשות.","גם מאמינים בקונספירציות על רצח קנדי או על חייזרים הפחיתו את האמונה אחרי השיחה."]])}`,q:"q21"},
  {h:"גם אצל מאמינים מושבעים",html:`${tiles([["chart","עוצמת האמונה","השפיעה על גודל האפקט בצורת U, אבל לא ביטלה אותו","האפקט היה בגדלים שונים לפי כמה חזקה הייתה האמונה, אבל הוא הופיע גם אצל מאמינים חזקים מאוד. כלומר, אמונה חזקה לא ״מחסנת״ מפני שכנוע.","גם אבי, שבטוח מאוד בקונספירציה, הוריד קצת את הביטחון שלו אחרי השיחה."],["target","חשיבות האמונה","ככל שהקונספירציה חשובה יותר לתפיסת העולם, האפקט קטן יותר, אבל עדיין מובהק גם ברמת החשיבות הגבוהה ביותר (d=0.67)"],["brain","חשיבה קונספירטיבית כללית","לא מיתנה באופן מובהק. גם מי שבאחוזון ה-90 ומעלה (מאמינים כמעט בכל 15 הקונספירציות) הראו אפקט גדול (d=0.80)","גם מי שמאמין בהרבה קונספירציות השתנה. כלומר, השיחה עבדה גם אצל המאמינים הכי חזקים.","גם אבי, שמאמין כמעט בכל קונספירציה שמציגים לו, הפחית את האמונה."]])}`,q:"q23"},
  {h:"מי מושפע יותר",html:`<p>נבדקו גיל, גזע, מגדר, השכלה, עמדה פוליטית, קיצוניות פוליטית, דתיות, היכרות ושימוש ב-AI, אמון ב-AI ואמון במוסדות. רק שני משתנים מיתנו באופן עקבי:</p>${tiles([["check","אמון ב-AI גנרטיבי","יותר אמון → אפקט גדול יותר"],["building","אמון במוסדות","יותר אמון → אפקט גדול יותר","מי שסמך יותר על מוסדות (מדע, ממשלה) השתכנע יותר מהשיחה.","חבר של אבי, שבדרך כלל סומך על נאס״א, השתכנע מהר יותר מאבי."]])}${rem("ניתוח נוסף מצא שבכל תת־הקבוצות האפקט הממוצע נע בין ירידה של 8.14 ל-18.89 נקודות. כלומר <b>הטיפול הוריד אמונה בכל הקבוצות</b>, גם אצל מי שכמעט לא סומך על AI.")}`,q:"q25"}
 ]},
 {id:"t6",icon:"chart",title:"השפעות נוספות ודיוק ה-AI",blocks:[
  {h:"זליגה לקונספירציות אחרות",html:`${def("על מה הנושא",`השפעות נוספות: האם זה זולג לאמונות אחרות, משנה התנהגות, והאם ה-AI בכלל צדק?<br><b>מה נלמד כאן:</b> זליגה · כוונות התנהגות · דיוק ה-AI`)}<p>השיחה עסקה בקונספירציה <b>אחת</b>. האם היא השפיעה גם על אחרות? בדקו את 15 הקונספירציות של BCTI במחקר 1:</p>${tiles([["chart","כל הקונספירציות","ירידה של 2.98 נקודות (7.94%) בטיפול, לעומת עלייה של 1.04 בביקורת. אחרי חודשיים עדיין ירידה של 2.23","ההשפעה לא הייתה רק על הקונספירציה שדיברו עליה. האמונה בקונספירציות בכלל ירדה, וגם אחרי חודשיים רוב הירידה נשמרה.","אחרי השיחה על הנחיתה, אבי גם פחות בטוח בקונספירציות אחרות שהאמין בהן."],["target","רק אלה שהאמינו בהן","ירידה של 9.34 נקודות (12.49%), לעומת 2.82 בביקורת. ההבדל נשמר גם אחרי חודשיים"]])}${rem("כלומר הייתה ירידה כללית ב<b>תפיסת עולם קונספירטיבית</b>, לא רק באמונה הספציפית.")}`,q:"q27"},
  {h:"כוונות התנהגות (מחקר 2)",html:`${yn(["יותר כוונה להתעלם או להפסיק לעקוב אחרי חשבונות שמפיצים את הקונספירציה","יותר נכונות להתעלם או להתווכח עם מי שמאמין בה"],["ירידה לא מובהקת בכוונה להצטרף להפגנות בעד הקונספירציה"])}${def("למה ההפגנות לא מובהקות",`הכוונות האלה היו <b>נמוכות כבר בהתחלה</b>, ואולי היה <mark>אפקט רצפה</mark> ${E("Floor effect")}: אין הרבה מקום לרדת.`)}`,q:"q29"},
  {h:"עד כמה ה-AI מדויק",html:`<p>בודק עובדות מקצועי בדק <b>128 טענות</b> של ה-AI מתוך שיחות מייצגות:</p>${tiles([["check","99.2%","נכונות (127 טענות)"],["question","0.8%","מטעה (טענה אחת)"],["x","0","שגויות. וגם בלי הטיה ליברלית או שמרנית"]])}${def("קונספירציות אמיתיות",`ב-0.72% מהמקרים המשתתף בחר קונספירציה <b>שהייתה אמיתית</b> (למשל MK Ultra). שם הטיפול <b>לא</b> הוריד את האמונה. כלומר ה-AI לא \"מכבה\" כל אמונה בקונספירציה.`)}`,q:"q31"}
 ]},
 {id:"t7",icon:"bulb",title:"דיון ומשמעויות",blocks:[
  {h:"המשמעות התיאורטית",html:`${def("על מה הנושא",`מה זה אומר על האופן שבו אנשים חושבים, ומה הסכנות והמגבלות?<br><b>מה נלמד כאן:</b> משמעות תיאורטית · משמעות מעשית · הבטחה וסכנה · מגבלות`)}<p>הממצאים מערערים על הדעה שראיות כמעט חסרות תועלת אחרי שמישהו "נפל למחילת הארנב", ועל תיאוריות שמציבות <b>צרכים ומניעים</b> במרכז.</p>${def("החשיבה האנליטית",`הממצאים מתאימים יותר לגישה שנותנת תפקיד מרכזי ל<b>חשיבה אנליטית</b> בהגנה מפני אמונות מפוקפקות (אמונות טפלות, מידע כוזב). לפיה, החשיבה לא כבולה בצורכי זהות: אנשים <b>מוכנים לעדכן</b> אמונות מול ראיות משכנעות.`)}${tiles([["doc","ראיות ולא צרכים","ה-AI נתן בעיקר הסברים חלופיים וראיות ועודד חשיבה ביקורתית, ולא ניסה לספק צרכים"],["clock","הדרך המרכזית","העמידות לאורך חודשיים וההשפעה על קונספירציות אחרות מתאימות ל<b>דרך המרכזית</b> לשכנוע, שמובילה לשינוי יציב, בניגוד ל<b>דרך ההיקפית</b> (רגש, סימני זהות) שמובילה לשינוי חולף","השינוי נשמר לאורך זמן והתפשט לקונספירציות אחרות. זה מתאים לשכנוע דרך חשיבה על הטיעונים (הדרך המרכזית), שמוביל לשינוי יציב, ולא לשכנוע דרך רגש או רמזים, שמוביל לשינוי זמני.","אבי לא השתכנע כי המודל ״נשמע נחמד״, אלא כי חשב על הראיות, ולכן השינוי החזיק."]])}${rem("החוקרים לא שוללים לגמרי תפקיד לצרכים ולמניעים. וחשוב: המטרה כאן, להפריך אמונה <b>קיימת</b>, שונה ממחקרים קודמים (חיסון מראש, הפרכה לקהל כללי), שהצליחו בצורה מתונה (מטא־אנליזה: g=0.16).")}`,q:"q33"},
  {h:"משמעות מעשית",html:`<p>בניגוד לרעיון של עולם \"פוסט־אמת\" שבו עובדות לא חשובות, <b>אין לוותר על טיעונים וראיות</b>. מודלי AI הם כלים חזקים וגמישים להפחתת אמונות מפוקפקות, וגם בהיקף גדול.</p>${tiles([["question","חיפוש באינטרנט","חיפושים על קונספירציות יכולים לקבל סיכום מדויק ומותאם שמזמין תגובה"],["people","רשתות חברתיות","חשבונות AI יכולים להגיב למי שמשתף תוכן קונספירטיבי לא מדויק"]])}${def("האתגר",`לא סביר שרוב המאמינים המושבעים יבחרו לשוחח עם צ'טבוט. כיווני מחקר: <b>משחוק</b>, שקיפות (חשיפת ההנחיות, מקורות), תמריצים, אנונימיות ותרגילי חשיבה ביקורתית בבתי ספר.`)}`,q:"q35"},
  {h:"הבטחה וסכנה",html:`<p>בלי מגבלות מתאימות, אותם מודלים יכולים גם <b>לשכנע</b> אנשים לאמץ אמונות מפוקפקות, או לשמש לשכנוע המוני. לכן חשוב לצמצם הזדמנויות לשימוש לא אחראי. שאלה פתוחה: האם השכנוע של AI יעיל באותה מידה לתוכן <b>נכון</b> ולתוכן <b>כוזב</b>?</p>${def("תרומה מתודולוגית",`ניסויי סקר רגילים משתמשים בגירויים <b>קבועים</b>. כאן מודל שפה בזמן אמת מאפשר לקבל אמונות בניסוח פתוח, להפוך אותן למדדים כמותיים, ולנהל דיאלוג <b>מותאם</b> לכל אדם. השיחות גם יוצרות נתוני טקסט עשירים לניתוח.`)}`,q:"q37"},
  {h:"מגבלות ומסקנה",html:`${tiles([["people","הכללה","משיבים אמריקאים בסקרים מקוונים בתשלום. צריך לבדוק מי שלא משתתף בסקרים, ותרבויות אחרות"],["target","מאמינים קיצוניים","לא ידוע אם זה יעבוד אצל חברים פעילים בקבוצות קונספירציה","אחת המגבלות: המשתתפים היו אנשים רגילים מהאינטרנט. לא ידוע אם השיחה תעבוד על חברים פעילים בקבוצות קונספירציה.","מי שמבלה כל יום בקבוצה סגורה של מאמינים אולי לא ישתכנע באותה קלות כמו אבי."],["lock","מודל סגור","GPT-4 Turbo סגור, וזה מקשה על פרשנות ושכפול. לא ידוע אם מודלים אחרים יעבדו כך","המחקר השתמש במודל של חברה מסחרית שאי אפשר לראות איך הוא בנוי. זה מקשה להבין מה בדיוק עבד, ולשחזר את המחקר עם מודלים אחרים.","חוקר אחר שינסה לחזור על המחקר עם מודל אחר לא יכול להיות בטוח שיקבל אותן תוצאות."],["question","מנגנון","כל שיחה ייחודית ומשלבת טיעונים ורמזים חברתיים. הניתוח מצביע על טיעונים עובדתיים, אבל צריך עוד מחקר","עוד לא ברור בדיוק למה השיחה עובדת. הניתוח מצביע על הטיעונים העובדתיים, אבל צריך עוד מחקר כדי לדעת בוודאות.","ייתכן שאבי השתכנע מהעובדות, אבל ייתכן שגם הנימוס של המערכת עזר."]])}${def("המסקנה",`שיחה קצרה יחסית עם AI יכולה ליצור ירידה <b>גדולה ומתמשכת</b> באמונות קונספירטיביות, גם אצל מאמינים מושבעים. אולי פשוט לא קיבלו עד עכשיו ראיות טובות מספיק. <mark>"גם למחילת הארנב העמוקה ביותר יש יציאה"</mark>.`)}`,q:"q39"}

"q7":{"t":"t2","v":[{"q":"למה דווקא מודל שפה מתאים לבדוק את ההשערה של החוקרים?","a":"כי יש לו ידע רחב, והוא מתאים את הטיעון לכל אדם","w":["כי אנשים סומכים על מחשבים יותר מעל בני אדם","כי הוא זול יותר מהעסקת מומחים","כי הוא לא יכול לטעות בעובדות"],"e":"למודל שפה יש ידע רחב, והוא יכול להתאים את הטיעון לכל אדם. שתי היכולות האלה עונות בדיוק על ״עומק״ ו״התאמה אישית״. ההנחה לא הייתה שאנשים סומכים יותר על מחשבים."},{"q":"איזו הוראה קיבל ה-AI בניסוי?","a":"לשכנע ביעילות רבה נגד הקונספירציה","w":["להציג את שני הצדדים באופן מאוזן","לספק למשתתף תחושת שליטה וביטחון","לשאול את המשתתף על הזהות שלו"],"e":"ה-AI קיבל הוראה לשכנע ביעילות רבה נגד הקונספירציה, בעזרת ראיות. הוא לא התבקש להציג את שני הצדדים, וגם לא לספק צרכים נפשיים."}]},

"q9":{"t":"t3","v":[{"q":"למה ביקשו מהמשתתפים לתאר את הקונספירציה במילים שלהם, ולא רק לדרג פריטים בשאלון?","a":"כי שאלון קבוע לא מייצג את כל הקונספירציות","w":["כי שאלון לוקח יותר מדי זמן למילוי","כי המשתתפים לא הבינו את השאלון","כי שאלון לא מאפשר לחשב גודל אפקט"],"e":"שאלון קבוע לא מייצג את כל הקונספירציות שאנשים מאמינים בהן. זו ביקורת ותיקה על שאלונים כמו BCTI. לכן ביקשו מכל משתתף לתאר את הקונספירציה שלו במילים שלו."},{"q":"משתתף דירג את הסיכום של הקונספירציה שלו ב-40. מה קרה לו?","a":"הוא לא נכלל בניתוח, כי דירג מתחת לאמצע","w":["הוא שובץ לקבוצת הביקורת במקום לטיפול","הוא נכלל בניתוח כמאמין בינוני","הוא קיבל שיחה ארוכה יותר עם ה-AI"],"e":"נכללו בניתוח רק משתתפים שדירגו את הסיכום של הקונספירציה שלהם מעל 50, כלומר הביעו אמונה. מי שדירג 40 לא נכלל."}]},
"q10":{"t":"t3","v":[{"q":"מה היה התפקיד של הסיכום במשפט אחד שה-AI כתב?","a":"ליצור מדד כמותי לאמונה שתוארה בניסוח פתוח","w":["לשכנע את המשתתף כבר בשלב הראשון","לבדוק אם המשתתף קשוב לאורך הניסוי","להחליט לאיזו קבוצה לשבץ את המשתתף"],"e":"הסיכום במשפט אחד שה-AI כתב שימש מדד כמותי לאמונה שתוארה בניסוח פתוח. המשתתף דירג אותו לפני השיחה ואחריה. הסיכום לא נועד לשכנע."},{"q":"מה מילאו המשתתפים במחקר 1 לפני התיאור האישי?","a":"שאלון של 15 קונספירציות מוכרות ומטלה מסיחה","w":["שאלון על אמון ב-AI ועל שימוש בו","ראיון אישי עם אחד מהחוקרים","שאלון על צרכים פסיכולוגיים כמו שליטה"],"e":"במחקר 1, לפני התיאור האישי, המשתתפים מילאו שאלון של 15 קונספירציות מוכרות (BCTI) ומטלה מסיחה. השאלון שימש גם לבדיקת זליגה לאמונות אחרות."}]},
"q11":{"t":"t3","v":[{"q":"למה השתמשו בכמה נושאי שיחה שונים בקבוצת הביקורת, ואז איחדו אותם?","a":"כי לא נמצאו הבדלים ביניהם","w":["כי המשתתפים ביקשו לשנות נושא","כי כל נושא התאים לסוג אחר של קונספירציה","כי רק אחד מהם היה ניטרלי באמת"],"e":"שיחות על בריאות, כלבים מול חתולים או כבאים נתנו תוצאות דומות."},{"q":"מה התפקיד של קבוצת הביקורת בניסוי?","a":"לוודא שהשיחה על הקונספירציה היא שהורידה אמונה","w":["לבדוק אם המשתתפים מאמינים בקונספירציה","לבדוק את הדיוק של ה-AI","לבדוק אם השאלון מהימן"],"e":"קבוצת הביקורת שוחחה עם AI על נושא ניטרלי, וכך אפשר לוודא שהשיחה על הקונספירציה עצמה, ולא עצם השיחה עם AI, היא שהורידה את האמונה."}]},
"q12":{"t":"t3","v":[{"q":"במחקר 1, 73.5% מהמשתתפים הביעו אמונה בקונספירציה. למה החוקרים חשדו בנתון הזה?","a":"הוא גבוה מההערכות, ואולי השאלון הבליט קונספירציות","w":["הוא היה נמוך מדי ביחס להערכות","המשתתפים לא היו מייצגים מבחינה דמוגרפית","הוא חושב לפני הוצאת המשתתפים הלא קשובים"],"e":"73.5% מאמינים גבוה מההערכות המקובלות. ייתכן שהשאלון המקדים הבליט קונספירציות והגדיל את הדיווח. זו אחת הסיבות למחקר 2."},{"q":"מה היה מאפיין המדגם במחקר 1?","a":"אמריקאים, במדגם מותאם למפקד האוכלוסין","w":["סטודנטים לפסיכולוגיה מאוניברסיטה אחת","חברים פעילים בקבוצות קונספירציה","אנשים מכמה מדינות ותרבויות שונות"],"e":"במחקר 1 השתתפו אמריקאים, במדגם שהותאם למפקד האוכלוסין בגיל, מגדר, גזע ומוצא. הם לא היו סטודנטים מאוניברסיטה אחת."}]},
"q13":{"t":"t3","v":[{"q":"במחקר 1, כרבע מקבוצת הטיפול עברו ל״לא בטוח״ אחרי השיחה. מה המשמעות?","a":"חלק ניכר הפסיקו להאמין, לא רק האמינו פחות","w":["רוב המשתתפים לא הושפעו בכלל","האמונה עלתה אצל רוב המשתתפים","הירידה הייתה זהה בטיפול ובביקורת"],"e":"כרבע (27.3%) מקבוצת הטיפול עברו ל״לא בטוח״ אחרי השיחה, לעומת 2.3% בביקורת. כלומר, חלק ניכר הפסיקו להאמין, ולא רק האמינו פחות."},{"q":"מה מראה ההשוואה בין ירידה של כ-22% בטיפול לכ-1% בביקורת?","a":"שהנושא, ולא עצם השיחה עם AI, הוריד אמונה","w":["שכל שיחה עם AI מורידה אמונה באותה מידה","שקבוצת הביקורת לא הייתה ניטרלית באמת","שהמדידה לא הייתה מהימנה לאורך הניסוי"],"e":"ירידה של כ-22% בטיפול, לעומת כ-1% בביקורת, מראה שהנושא של השיחה, ולא עצם השיחה עם AI, הוריד את האמונה. זו הלוגיקה של קבוצת ביקורת."}]},
"q14":{"t":"t3","v":[{"q":"למה בדקו את 330 המשתתפים שהקונספירציה שלהם דמתה לפריט בשאלון?","a":"כדי לוודא שהתוצאה לא תלויה רק בשיטת המדידה החדשה","w":["כדי לבדוק אם הם קשובים יותר משאר המשתתפים","כדי להשוות אותם לקבוצת הביקורת בלבד","כדי לבחון זליגה לקונספירציות אחרות שלא נדונו"],"e":"גם אצל 330 המשתתפים שהקונספירציה שלהם דמתה לפריט בשאלון נמצאה ירידה בפריט הקבוע. כך הוכח שהתוצאה לא תלויה רק בשיטת המדידה החדשה. זליגה נבדקה בנפרד."},{"q":"מה גודל האפקט (d) במחקר 1, וכמה הוא נחשב?","a":"1.15, אפקט גדול מאוד","w":["0.16, אפקט קטן","0.53, אפקט בינוני","0.82, אפקט בינוני"],"e":"בהשוואה למטא־אנליזה של התערבויות קודמות (0.16), זה הבדל עצום."}]},
"q15":{"t":"t3","v":[{"q":"15.8% מהמשתתפים לא חזרו למעקב. איך החוקרים הראו שזה לא מסביר את התוצאה?","a":"הניחו שחזרו לאמונה, והאפקט נשאר מובהק","w":["הוציאו אותם מהניתוח בלי בדיקה נוספת","הניחו שגם הם השתכנעו כמו האחרים","השוו אותם לקבוצת הביקורת בלבד"],"e":"החוקרים הניחו שמי שלא חזר למעקב חזר לאמונה המקורית, וגם אז האפקט נשאר מובהק. זה ניתוח שמרני שמחזק את המסקנה. הם לא הוציאו אותם בלי בדיקה."},{"q":"מה נמצא במעקב אחרי 10 ימים ואחרי חודשיים?","a":"האמונה נשארה נמוכה, בלי שינוי מובהק","w":["האמונה חזרה בהדרגה לרמה המקורית","האמונה המשיכה לרדת עוד","האמונה חזרה רק אצל מאמינים מושבעים"],"e":"במעקב אחרי 10 ימים ואחרי חודשיים, האמונה נשארה נמוכה, בלי שינוי מובהק. ההשפעה יציבה, ולא חזרה בהדרגה."}]},
"q17":{"t":"t4","v":[{"q":"למה במחקר 2 ויתרו על שאלון 15 הקונספירציות לפני התיאור האישי?","a":"כי ייתכן שהשאלון הבליט קונספירציות","w":["כי השאלון לא היה מהימן במחקר הקודם","כי לא היה צורך לבדוק זליגה במחקר הזה","כי המשתתפים התלוננו על האורך שלו"],"e":"השאלון המקדים אולי הבליט קונספירציות והגדיל את הדיווח על אמונה, ולכן ויתרו עליו במחקר 2. ואכן, שיעור המאמינים ירד ל-58.9%."},{"q":"למה חסמו העתק־הדבק במחקר 2?","a":"כדי שהמשתתפים לא ישתמשו בעצמם במודלי שפה","w":["כדי שהמשתתפים יכתבו תשובות קצרות יותר","כדי למנוע העתקה מהשאלון של מחקר 1","כדי לשמור על האנונימיות של המשתתפים"],"e":"חסמו העתק־הדבק כדי שהמשתתפים לא ישתמשו בעצמם במודלי שפה, וכך התשובות הן שלהם. זה לא נועד לקצר את התשובות."}]},
"q18":{"t":"t4","v":[{"q":"במחקר 2 שאלו ״האם אחת מהתיאוריות האלה משכנעת אותך?״ במקום ״במה אתה מאמין?״. מה המטרה?","a":"להקטין את ההבלטה ואת הלחץ לדווח","w":["להגדיל את מספר המאמינים במדגם החדש","לבדוק את ההגדרה של ״תיאוריה״ בציבור","לחסוך זמן בשלבים הראשונים של הניסוי"],"e":"השאלה ״האם אחת מהתיאוריות האלה משכנעת אותך?״ מבליטה פחות את הקונספירציות ומפעילה פחות לחץ לדווח על אמונה. כך בדקו אם התוצאות של מחקר 1 נובעות מההליך."},{"q":"כמה מהמשתתפים במחקר 2 עמדו בתנאים, ולמה זה פחות ממחקר 1?","a":"58.9%, כי ההליך לא הבליט קונספירציות","w":["73.5%, בדיוק כמו במחקר הקודם","90%, כי המדגם היה גדול יותר","30%, כי רבים לא היו קשובים"],"e":"במחקר 2, 58.9% מהמשתתפים עמדו בתנאים, פחות מ-73.5% במחקר 1, כי בלי השאלון המקדים ההליך לא הבליט קונספירציות."}]},
"q19":{"t":"t4","v":[{"q":"השכפול עם מדגם Lucid נתן אפקט קטן יותר (d=0.53). למה זה בכל זאת מחזק את המסקנה?","a":"כי גם משיבים לא קשובים הושפעו","w":["כי אפקט קטן יותר אמין יותר","כי Lucid מייצג רק מאמינים מושבעים","כי זה מראה שהאפקט תלוי בקשב"],"e":"השכפול עם Lucid, שבו משיבים פחות קשובים, נתן אפקט קטן יותר אבל עדיין משמעותי. זה מראה שההשפעה לא מוגבלת למשתתפים מעורבים וקשובים."},{"q":"מה הייתה הירידה באחוזים בקבוצת הטיפול במחקר 2?","a":"כ-20%, לעומת כ-3% בביקורת","w":["כ-50%, לעומת כ-10% בביקורת","כ-5%, לעומת כ-1% בביקורת","כ-20%, וגם בביקורת כ-20%"],"e":"במחקר 2 האמונה ירדה בכ-20% בקבוצת הטיפול (19.67%), לעומת כ-3% בביקורת (3.27%)."}]},
"q20":{"t":"t4","v":[{"q":"מחקר 2 שינה את ההליך וקיבל אפקט קטן יותר, אבל עדיין גדול. מה המסקנה?","a":"התוצאה שוכפלה, ואינה תוצר של ההליך של מחקר 1","w":["התוצאה של מחקר 1 הייתה כנראה שגויה","ההליך של מחקר 2 היה פחות תקין מהראשון","אי אפשר להשוות בין המחקרים בגלל השינויים"],"e":"מחקר 2 שינה את ההליך ועדיין מצא אפקט גדול, ולכן התוצאה שוכפלה ואינה תוצר של ההליך של מחקר 1. זו מטרת השכפול."},{"q":"איזה מחקר הראה אפקט גדול יותר?","a":"מחקר 1 (d=1.15), לעומת מחקר 2 (d=0.82)","w":["מחקר 2 (d=1.15), לעומת מחקר 1 (d=0.82)","שניהם הראו אפקט זהה","מחקר Lucid הראה את האפקט הגדול ביותר"],"e":"מחקר 1 הראה אפקט גדול יותר (d=1.15) ממחקר 2 (d=0.82), אבל שניהם אפקטים גדולים."}]},
"q21":{"t":"t5","v":[{"q":"מישהו טוען: ״זה עובד רק על קונספירציות שוליות, לא על אמונות פוליטיות עמוקות.״ מה מראה המחקר?","a":"זה עבד גם על הונאה בבחירות 2020 ועל הקורונה","w":["הוא צודק, האפקט נעלם בקונספירציות פוליטיות","האפקט עבד רק על קונספירציות קלאסיות כמו חייזרים","המחקר לא בדק קונספירציות פוליטיות"],"e":"המחקר מצא ירידה גם בקונספירציות בולטות ומושרשות, כמו הונאה בבחירות 2020 ונושאי הקורונה. לכן הטענה שזה עובד רק על קונספירציות שוליות אינה נכונה."},{"q":"איך סיווגו החוקרים את סוגי הקונספירציות?","a":"בעזרת עיבוד שפה טבעית","w":["לפי שאלון שהמשתתפים מילאו","לפי שיפוט של שלושה חוקרים","לפי רשימה קבועה מראש של 15 סוגים"],"e":"החוקרים סיווגו את סוגי הקונספירציות בעזרת עיבוד שפה טבעית, והאמונה ירדה בכל 12 הסוגים הנפוצים."}]},
"q23":{"t":"t5","v":[{"q":"משתתף אמר שהקונספירציה מאוד חשובה לתפיסת העולם שלו. מה צפוי לפי הממצאים?","a":"אפקט קטן יותר, אבל עדיין מובהק","w":["אפקט גדול יותר, כי הוא מעורב","אין אפקט בכלל","האמונה דווקא תתחזק"],"e":"גם כשהקונספירציה מאוד חשובה לתפיסת העולם של המשתתף, נמצא אפקט, קטן יותר אבל מובהק (d=0.67 ברמת החשיבות הגבוהה ביותר). האמונה לא התחזקה."},{"q":"מה נמצא אצל מי שמאמינים כמעט בכל 15 הקונספירציות בשאלון?","a":"גם אצלם נמצא אפקט גדול","w":["אצלם האפקט נעלם","אצלם האמונה התחזקה","הם לא נכללו במחקר"],"e":"גם אצל מי שמאמינים כמעט בכל 15 הקונספירציות בשאלון (באחוזון ה-90 ומעלה) נמצא אפקט גדול, d=0.80. האפקט לא נעלם אצלם."}]},
"q24":{"t":"t5","v":[{"q":"הקשר בין עוצמת האמונה המקורית לגודל האפקט היה בצורת U. מה המשמעות העיקרית?","a":"עוצמת האמונה שינתה את גודל האפקט, בלי לבטל אותו","w":["ככל שהאמונה חזקה יותר, האפקט גדול יותר","רק אצל המאמינים החלשים היה אפקט","לא היה קשר בין עוצמת האמונה לאפקט"],"e":"הקשר בצורת U מראה שעוצמת האמונה המקורית שינתה את גודל האפקט, אבל האפקט היה קיים בכל הרמות. הוא לא היה ״רק אצל המאמינים החלשים״."},{"q":"האם חשיבה קונספירטיבית כללית מיתנה את האפקט באופן מובהק?","a":"לא","w":["כן, היא ביטלה אותו","כן, היא הגבירה אותו מאוד","כן, אבל רק במחקר 2"],"e":"חשיבה קונספירטיבית כללית לא מיתנה את האפקט באופן מובהק: גם מי שמאמין כמעט בהכל הושפע."}]},
"q25":{"t":"t5","v":[{"q":"אילו שני משתנים מיתנו את האפקט באופן עקבי?","a":"אמון ב-AI ואמון במוסדות","w":["עמדה פוליטית ודתיות","גיל והשכלה פורמלית","מגדר וקיצוניות פוליטית"],"e":"אמון ב-AI ואמון במוסדות מיתנו את האפקט באופן עקבי: יותר אמון, אפקט גדול יותר. עמדה פוליטית ודתיות לא מיתנו אותו באופן עקבי."},{"q":"מה מראה הטווח של האפקט בתת־הקבוצות (ירידה של 8 עד 19 נקודות)?","a":"שהטיפול הוריד אמונה בכל תת־הקבוצות","w":["שבחלק מהקבוצות האמונה עלתה","שהאפקט היה זהה בכל הקבוצות","שהאפקט היה רק בקבוצות עם אמון ב-AI"],"e":"ירידה של 8 עד 19 נקודות בכל תת־הקבוצות מראה שהטיפול הוריד אמונה בכולן, כולל אצל מי שכמעט לא סומך על AI. בשום קבוצה האמונה לא עלתה."}]},
"q26":{"t":"t5","v":[{"q":"מישהו טוען שהשיטה עובדת רק על ליברלים. מה מראים הממצאים?","a":"עמדה פוליטית לא מיתנה באופן עקבי","w":["השיטה עבדה רק על ליברלים","השיטה עבדה רק על שמרנים","המחקר לא בדק עמדות פוליטיות כלל"],"e":"עמדה פוליטית לא מיתנה את האפקט באופן עקבי. רק אמון ב-AI ואמון במוסדות מיתנו אותו. לכן השיטה לא עובדת רק על ליברלים."},{"q":"מה נמצא אצל אנשים עם אמון מינימלי ב-AI?","a":"גם אצלם האמונה ירדה","w":["אצלם האמונה התחזקה","אצלם לא היה שינוי בכלל","הם סירבו לשוחח עם ה-AI"],"e":"גם אצל אנשים עם אמון מינימלי ב-AI האמונה בקונספירציה ירדה. האפקט היה קטן יותר, אבל קיים."}]},
"q27":{"t":"t6","v":[{"q":"השיחה עסקה רק בקונספירציה אחת, אבל האמונה ירדה גם בקונספירציות אחרות. מה זה מרמז?","a":"ירידה כללית בתפיסת עולם קונספירטיבית","w":["שהמדידה לא הייתה מדויקת","שהמשתתפים ניסו לרצות את החוקרים","שכל הקונספירציות זהות בתוכנן"],"e":"השיחה עסקה בקונספירציה אחת, אבל האמונה ירדה גם בקונספירציות אחרות. זליגה כזו מרמזת על ירידה כללית בתפיסת עולם קונספירטיבית, ולא רק בטענה אחת."},{"q":"באילו קונספירציות אחרות הירידה הייתה הגדולה ביותר?","a":"באלה שהמשתתף האמין בהן לפני הטיפול","w":["באלה שהמשתתף לא הכיר בכלל","באלה שדומות לנושא שיחת הביקורת","באלה שהיו פחות פופולריות בציבור"],"e":"הירידה הגדולה ביותר בקונספירציות אחרות הייתה באלה שהמשתתף האמין בהן לפני הטיפול: 9.34 נקודות, שנשמרו גם אחרי חודשיים."}]},
"q28":{"t":"t6","v":[{"q":"בקבוצת הביקורת האמונה הכללית בקונספירציות עלתה מעט. למה זה חשוב לפרשנות?","a":"כי זה שולל שהירידה בטיפול נבעה מזמן או ממילוי חוזר","w":["כי זה מראה שהביקורת לא הייתה ניטרלית","כי זה מוכיח שהשיחה עם AI מגבירה אמונה","כי זה מבטל את האפקט של הטיפול"],"e":"בביקורת האמונה הכללית עלתה מעט, ולכן אי אפשר לייחס את הירידה בטיפול לזמן או למילוי חוזר של השאלון. ההבדל בין הקבוצות הוא מה שחשוב."},{"q":"מה הייתה הירידה הכללית בכל 15 הקונספירציות אחרי חודשיים?","a":"כ-2 נקודות, עדיין ירידה","w":["חזרה מלאה לרמה המקורית","ירידה של כ-20 נקודות","עלייה של כ-2 נקודות"],"e":"אחרי חודשיים, האמונה הכללית בכל 15 הקונספירציות ירדה בכ-2 נקודות (2.23) לעומת המדידה שלפני הטיפול. זו עדיין ירידה, ולא חזרה לרמה המקורית."}]},
"q29":{"t":"t6","v":[{"q":"הכוונה להשתתף בהפגנות בעד הקונספירציה לא ירדה באופן מובהק. מה ההסבר הסביר?","a":"אפקט רצפה: הכוונה הייתה נמוכה כבר בהתחלה","w":["הטיפול לא השפיע על התנהגות בשום צורה","המשתתפים שיקרו לגבי הכוונות שלהם","הפגנות הן פעילות שקשה מאוד למדוד"],"e":"הכוונה להשתתף בהפגנות בעד הקונספירציה הייתה נמוכה כבר בהתחלה, ולכן לא היה לה הרבה מקום לרדת. זה אפקט רצפה, ולא היעדר השפעה."},{"q":"איזו כוונת התנהגות כן גדלה בעקבות הטיפול?","a":"להפסיק לעקוב אחרי מפיצי הקונספירציה","w":["להצטרף להפגנות בעד הקונספירציה","לשתף את הקונספירציה ברשתות החברתיות","להימנע משיחות עם AI גם בעתיד"],"e":"בעקבות הטיפול גדלה הכוונה להפסיק לעקוב אחרי מפיצי הקונספירציה, וגם הנכונות להתווכח עם מאמינים. הכוונה לשתף את הקונספירציה לא גדלה."}]},
"q31":{"t":"t6","v":[{"q":"משתתף בחר בקונספירציה שהתבררה כאמיתית (MK Ultra), והאמונה שלו לא ירדה. למה זה ממצא חשוב?","a":"כי זה מראה שה-AI לא ״מכבה״ כל אמונה, אלא מגיב לראיות","w":["כי זה מוכיח שהטיפול נכשל אצל רוב המשתתפים","כי זה מראה שה-AI מוטה לטובת קונספירציות מסוימות","כי זה מראה שהמשתתף לא היה קשוב לשיחה"],"e":"כשהמשתתף בחר בקונספירציה אמיתית (MK Ultra), האמונה שלו לא ירדה. זה מראה שה-AI לא ״מכבה״ כל אמונה, אלא מגיב לראיות. הוא לא שכנע נגד האמת."},{"q":"מה מצא בודק העובדות המקצועי לגבי הטענות של ה-AI?","a":"כמעט כולן נכונות, ואחת מטעה","w":["כרבע מהן היו שגויות","רובן היו מטעות","הוא לא הצליח לבדוק אותן"],"e":"בודק העובדות המקצועי מצא ש-127 מתוך 128 הטענות של ה-AI היו נכונות, אחת מטעה, ואף אחת לא שגויה."}]},
"q32":{"t":"t6","v":[{"q":"למה חשוב שבודק העובדות לא מצא הטיה ליברלית או שמרנית?","a":"כי זה שולל שהשכנוע נבע מהטיה פוליטית של המודל","w":["כי זה מוכיח שה-AI תמיד צודק בכל נושא","כי זה מראה שהמשתתפים היו מאוזנים פוליטית","כי זה מסביר את אפקט הרצפה בכוונות"],"e":"בודק העובדות לא מצא הטיה ליברלית או שמרנית, ולכן אפשר לשלול שהשכנוע נבע מהטיה פוליטית של המודל. השכנוע התבסס על עובדות."},{"q":"באיזה שיעור מהמקרים בחרו משתתפים קונספירציה אמיתית?","a":"פחות מאחוז אחד","w":["כ-10%","כרבע מהמקרים","כמחצית מהמקרים"],"e":"משתתפים בחרו קונספירציה אמיתית בפחות מאחוז אחד מהמקרים (0.72%)."}]},
"q33":{"t":"t7","v":[{"q":"למה הממצאים מערערים על גישת ״הצרכים הפסיכולוגיים״?","a":"כי ראיות בלבד, בלי לספק צרכים, הורידו אמונה","w":["כי המשתתפים לא דיווחו על צרכים","כי הצרכים נמדדו ונמצאו נמוכים","כי ה-AI סיפק למשתתפים את הצרכים שלהם"],"e":"ה-AI נתן בעיקר ראיות והסברים, ולא ניסה לספק צרכים פסיכולוגיים, ובכל זאת האמונה ירדה. זה מערער על הטענה שרק סיפוק צרכים יכול לשנות אמונה."},{"q":"מה מעיד על כך שהשכנוע עבר ב״דרך המרכזית״?","a":"השינוי נשמר חודשיים וזלג לאמונות אחרות","w":["השינוי היה מהיר ונעלם אחרי יום","השינוי היה רק אצל משתתפים רגשיים","השינוי התבסס על סימני זהות"],"e":"השינוי נשמר חודשיים וזלג לאמונות אחרות, וזה מעיד על שכנוע ב״דרך המרכזית״: עיבוד מעמיק של טיעונים, שמוביל לשינוי יציב. שינוי שנעלם אחרי יום היה מעיד על הדרך ההיקפית."}]},
"q34":{"t":"t7","v":[{"q":"מה מבדיל את המטרה של המחקר הזה ממחקרים קודמים שהצליחו בצורה מתונה (g=0.16)?","a":"כאן הפריכו אמונה קיימת, ולא חיסנו מראש","w":["כאן לא השתמשו בקבוצת ביקורת","כאן בדקו רק קונספירציות פוליטיות","כאן השתמשו בדף מידע קבוע"],"e":"מחקרים קודמים חיסנו אנשים מראש, לפני שנחשפו לקונספירציה. כאן הפריכו אמונה שכבר קיימת, משימה קשה יותר, ובכל זאת האפקט היה גדול."},{"q":"האם החוקרים שוללים לגמרי את התפקיד של צרכים ומניעים?","a":"לא, הם לא שוללים אותו לגמרי","w":["כן, הם מראים שצרכים לא קיימים","כן, הם מוכיחים שרק ראיות חשובות","כן, כי ה-AI לא התייחס לצרכים"],"e":"החוקרים לא שוללים לגמרי את התפקיד של צרכים ומניעים. הם מדגישים את תפקיד הראיות, בלי לבטל את הצרכים."}]},
"q35":{"t":"t7","v":[{"q":"איזה שימוש מעשי מציעים החוקרים?","a":"חשבונות AI שעונים לפוסטים קונספירטיביים","w":["חובה חוקית לשוחח עם AI לפני פרסום","חסימה אוטומטית של כל תוכן קונספירטיבי","החלפת מורים בבתי ספר במודלי שפה"],"e":"החוקרים מציעים חשבונות AI שעונים לפוסטים קונספירטיביים ברשתות, וסיכומי AI בחיפושים באינטרנט. הם לא מציעים חסימה של תוכן."},{"q":"מה האתגר המעשי העיקרי לפי המאמר?","a":"רוב המאמינים המושבעים לא יבחרו לשוחח עם צ׳טבוט","w":["ה-AI לא מדויק מספיק בעובדות","השיחה ארוכה מדי עבור רוב האנשים","ה-AI לא מבין קונספירציות מורכבות"],"e":"האתגר המעשי העיקרי הוא שרוב המאמינים המושבעים לא יבחרו לשוחח עם צ׳טבוט. לכן החוקרים מציעים משחוק, תמריצים ושקיפות. הדיוק של ה-AI אינו הבעיה."}]},
"q36":{"t":"t7","v":[{"q":"מה עמדת המאמר לגבי הטענה שאנחנו חיים בעולם ״פוסט־אמת״?","a":"אין לוותר על ראיות, כי עובדות כן משנות אמונות","w":["הטענה נכונה, ועובדות כבר לא משנות כלום","הטענה נכונה, אבל רק לגבי קונספירציות","המאמר לא מתייחס בכלל לטענה הזו"],"e":"המאמר טוען שאין לוותר על ראיות, כי עובדות כן משנות אמונות. זה ההפך מהטענה שאנחנו חיים בעולם ״פוסט־אמת״."},{"q":"איזה מהבאים לא מוצע במאמר כדרך לעודד שיחות עם AI?","a":"חובה חוקית לשוחח עם AI","w":["משחוק","שקיפות לגבי ההנחיות והמקורות","תרגילי חשיבה ביקורתית בבתי ספר"],"e":"המאמר מציע משחוק, שקיפות לגבי ההנחיות והמקורות, תמריצים, אנונימיות וחינוך לחשיבה ביקורתית. חובה חוקית לשוחח עם AI לא מוצעת."}]},
"q37":{"t":"t7","v":[{"q":"ממה המאמר מזהיר?","a":"שמודלים כאלה יכולים גם לשכנע בשקר","w":["שה-AI יחליף בעתיד את החוקרים","שהמשתתפים יתמכרו לשיחות עם AI","שהמחקר יגביר את האמון בקונספירציות"],"e":"המאמר מזהיר שמודלים כאלה יכולים לשכנע גם בשקר, ולכן חשוב לצמצם שימוש לא אחראי בהם."},{"q":"מה התרומה המתודולוגית של המחקר?","a":"דיאלוג בזמן אמת שמותאם לכל משתתף, בתוך סקר","w":["שאלון חדש ומהימן למדידת קונספירציות","מדגם גדול יותר מכל מחקר קודם בתחום","שימוש ראשון בקבוצת ביקורת בתחום הזה"],"e":"התרומה המתודולוגית היא דיאלוג בזמן אמת, שמותאם לכל משתתף, בתוך סקר, במקום גירויים קבועים. זה לא שאלון חדש."}]},
"q38":{"t":"t7","v":[{"q":"איזו שאלה פתוחה המאמר מעלה לגבי שכנוע של AI?","a":"האם הוא יעיל באותה מידה לאמת ולשקר","w":["האם AI יכול לנהל שיחה בכל שפה","האם AI זול יותר ממומחה אנושי","האם אנשים מעדיפים AI על פני רופאים"],"e":"שאלה מרכזית שנשארה פתוחה היא אם שכנוע של AI יעיל באותה מידה לאמת ולשקר. זה נוגע ישירות לסכנה שבשימוש בו."},{"q":"מה מאפשר מודל שפה בתוך סקר?","a":"להמיר אמונות בניסוח פתוח למדדים כמותיים","w":["לוותר על קבוצת ביקורת בניסוי","לבחור משתתפים לפי האמונות שלהם מראש","לשאול רק שאלות סגורות עם תשובות קבועות"],"e":"מודל שפה בתוך סקר מאפשר להמיר אמונות בניסוח פתוח למדדים כמותיים, ולאסוף נתוני טקסט עשירים. הוא לא מבטל את הצורך בקבוצת ביקורת."}]},
"q39":{"t":"t7","v":[{"q":"למה השימוש ב-GPT-4 Turbo נחשב מגבלה?","a":"כי המודל סגור, וקשה לפרש ולשכפל","w":["כי הוא לא מדויק מספיק בעובדות","כי הוא יקר מדי לשימוש במחקר","כי הוא מוטה פוליטית לצד אחד"],"e":"GPT-4 Turbo הוא מודל סגור, ולכן קשה לפרש איך הוא שכנע, ולשכפל את המחקר. גם לא ידוע אם מודלים אחרים יעבדו באותו אופן. הוא לא נמצא לא מדויק."},{"q":"מה המסקנה המרכזית של המאמר?","a":"שיחה קצרה עם AI יכולה להוריד אמונה לאורך זמן","w":["אי אפשר לשנות אמונה בקונספירציה","רק מומחים אנושיים יכולים לשכנע","השינוי חולף אחרי כמה ימים"],"e":"המסקנה המרכזית היא ששיחה קצרה עם AI יכולה להוריד אמונה בקונספירציה לאורך זמן: ״גם למחילת הארנב העמוקה ביותר יש יציאה״. השינוי לא חלף אחרי כמה ימים."}]},
"q40":{"t":"t7","v":[{"q":"איזו קבוצה לא נבדקה, ולכן לא ידוע אם הטיפול יעבוד עליה?","a":"חברים פעילים בקבוצות קונספירציה","w":["אנשים עם אמון נמוך ב-AI","מאמינים בקונספירציות פוליטיות","אנשים שמאמינים כמעט בהכול"],"e":"חברים פעילים בקבוצות קונספירציה לא נבדקו, ולכן לא ידוע אם הטיפול יעבוד עליהם. אנשים עם אמון נמוך ב-AI ואנשים שמאמינים כמעט בהכל כן נבדקו."},{"q":"למה קשה לדעת בדיוק מה גרם לשינוי באמונה?","a":"כי כל שיחה ייחודית ומשלבת טיעונים ורמזים","w":["כי לא נשמרו התמלילים של השיחות","כי לא הייתה קבוצת ביקורת מתאימה","כי המשתתפים לא דיווחו על אמונתם"],"e":"כל שיחה ייחודית ומשלבת טיעונים, טון ורמזים שונים, ולכן קשה לבודד מה בדיוק גרם לשינוי. הניתוח מצביע על הטיעונים העובדתיים, אבל צריך עוד מחקר."}]},
"h1":{"t":"t1","v":[{"q":"לפי ההסבר המקובל, למה אמונה בקונספירציה אמורה להיות עמידה לראיות?","a":"היא מספקת צרכים כמו שליטה וודאות, וקשורה לזהות","w":["מאמינים לא נחשפים כלל לראיות נגדיות","קונספירציות מבוססות בדרך כלל על עובדות אמיתיות ומוכחות","מאמינים חסרי יכולת לחשיבה אנליטית"],"e":"אם האמונה היא מנגנון איזון נפשי וזהות, חשיבה מונעת תגרום להתעלם מראיות."}]},
"h2":{"t":"t2","v":[{"q":"מה ההשערה החלופית של החוקרים להסבר כישלון ההפרכות?","a":"הן לא היו עמוקות ומותאמות לטענות האישיות של המאמין","w":["הן הוצגו על ידי מקורות שהמאמינים לא סומכים עליהם בכלל","הן היו ארוכות מדי ולכן לא נקראו","הן תקפו את זהות המאמין ולכן נדחו"],"e":"מאמינים בקיאים, כל אחד עם ״ראיות״ משלו. הפרכה ״מן המדף״ לא עונה עליהן; מודל שפה יכול."}]},
"h3":{"t":"t3","v":[{"q":"למה המשתתפים תיארו את הקונספירציה במילים שלהם ולא בחרו מרשימה?","a":"כדי שה־AI יענה לטענות הספציפיות שלהם","w":["כדי למנוע מהם להשתמש במודלי שפה בעצמם","כדי לבדוק את יכולת הכתיבה וההבעה שלהם","כדי להקטין את מספר המאמינים שנכללו במדגם"],"e":"שאלונים קבועים כמו BCTI לא מייצגים את כל הקונספירציות, ולא את הראיות האישיות של כל מאמין."}]},
"h4":{"t":"t3","v":[{"q":"איך החוקרים הראו שהאפקט לא נעלם, גם אם מי שלא חזר למעקב חזר לאמונה?","a":"בניתוח שמרני שהניח זאת, האפקט עדיין היה מובהק","w":["כל המשתתפים חזרו למעקב אחרי חודשיים","מי שלא חזר הוצא מראש מהמדגם","הם השוו רק את המשתתפים שחזרו לשני המעקבים, בלי האחרים"],"e":"15.8% לא חזרו. גם בהנחה שהם חזרו לאמונה המקורית, ההשפעה נשארה מובהקת."}]},
"h5":{"t":"t4","v":[{"q":"מה השתנה במחקר 2 כדי לטפל בבעיה שעלתה במחקר 1?","a":"ויתרו על שאלון BCTI, שאולי הגדיל את דיווחי האמונה","w":["הוסיפו קבוצת ביקורת חדשה עם שיחה על נושא ניטרלי לגמרי","החליפו את המודל ב־GPT-3.5 שהוא זמין יותר","הקטינו את המדגם כדי לשפר את איכות הנתונים"],"e":"ב־1 האמינו 73.5%, יותר מההערכות. ב־2 בלי BCTI האמינו 58.9%, והתוצאות שוכפלו."}]},
"h6":{"t":"t5","v":[{"q":"מה נכון לגבי מאמינים שהקונספירציה חשובה מאוד לתפיסת עולמם?","a":"האפקט אצלם קטן יותר, אבל עדיין מובהק","w":["אצלם לא נמצא אפקט בכלל","אצלם האפקט היה הגדול ביותר","אצלם האמונה דווקא התחזקה בעקבות השיחה"],"e":"ככל שהאמונה חשובה יותר, האפקט קטן יותר (d=0.67 ברמה הגבוהה), אבל לא נעלם."}]},
"h7":{"t":"t6","v":[{"q":"כשמשתתף בחר קונספירציה שהייתה אמיתית (MK Ultra), מה קרה?","a":"האמונה לא ירדה, כלומר ה־AI לא ״מכבה״ כל אמונה","w":["האמונה ירדה בדיוק כמו בכל הקונספירציות האחרות במחקר","ה־AI סירב לשוחח על הנושא ועצר את השיחה","האמונה התחזקה, כי ה־AI אישר את הטענות"],"e":"זה תומך בכך שה־AI הגיב לראיות ולא סתם הוריד אמונות. גם הדיוק היה 99.2%."}]},

<h3>1. השאלה: למה כל כך קשה לשכנע?</h3>
<p><b>תיאוריית קונספירציה</b> = הסבר שלפיו אירועים נגרמים בגלל מזימה סודית של גורמים חזקים. הן לרוב לא סבירות, ובכל זאת הערכות קודמות דיברו על עד <b>50%</b> מהאמריקאים שמאמינים לפחות באחת. ואמונה כזו נחשבת דוגמה קלאסית ל<b>עמידות לראיות</b>: כמעט אין מחקר שהצליח לשכנע מאמינים לוותר עליה.</p>
<p><b>ההסבר המקובל: צרכים.</b> לפיו, אבי מאמין כי האמונה נותנת לו משהו נפשי: <b>שליטה</b> (״אני מבין מה באמת קורה״), <b>ודאות</b>, <b>ביטחון</b>, ו<b>ייחודיות</b> (״אני יודע משהו שאחרים לא יודעים״). אם כך, האמונה היא לא סתם דעה אלא <b>מנגנון איזון נפשי</b>. בנוסף היא קשורה ל<b>זהות</b> ולשייכות לקבוצה, ולכן אבי ישתמש ב<b>חשיבה מונעת</b>: יחפש סיבות לדחות כל ראיה נגדית. המסקנה העגומה: אי אפשר לשכנע אותו בעובדות, אלא רק בשינוי עמוק בזהות שלו.</p>

<h3>2. ההשערה החלופית: ראיות שלא היו מספיק טובות</h3>
<p>החוקרים טוענים שהפרכות קודמות נכשלו לא בגלל צרכים, אלא כי חסרו להן שני דברים:</p>

<li><b>התאמה אישית:</b> כל מאמין מחזיק ראיות שונות. דף הפרכה כללי (״הנחיתה הייתה אמיתית, הנה הוכחות״) לא עונה לטענה הספציפית של אבי על הדגל.</li>

<p><b>למה דווקא בינה מלאכותית?</b> מודל שפה גדול פותר את שתי הבעיות: יש לו <b>ידע עצום</b> בכל תחום, והוא יכול <b>להתאים</b> את התשובה בדיוק לטענות של כל אדם. למשל, להסביר לאבי שהדגל נראה ״מתנופף״ כי היה בו מוט אופקי שהחזיק אותו פרוש, והקמטים נשארו כי אין אוויר שיעצור את התנועה.</p>

<p>עכשיו נבין למה הממצאים חשובים, אחד אחד:</p>
<ul>
<li><b>זה נשאר:</b> אחרי 10 ימים ואחרי <b>חודשיים</b> האמונה לא חזרה לעלות. גם בהנחה הכי פסימית (שכל מי שלא חזר למעקב חזר להאמין), ההבדל נשאר מובהק.</li>
<li><b>זה עובד על כל סוגי הקונספירציות:</b> גם על קונספירציות פוליטיות ״חמות״ כמו הונאה בבחירות 2020 בארה״ב וקורונה, וגם על קלאסיות (קנדי, חייזרים, האילומינטי).</li>
<li><b>זה עובד גם על מאמינים מושבעים:</b> ככל שהקונספירציה חשובה יותר לתפיסת העולם של האדם, האפקט <b>קטן יותר, אבל עדיין מובהק</b>. גם מי שמאמין כמעט בכל הקונספירציות ירד בצורה ניכרת.</li>
<li><b>מי מושפע יותר?</b> מבין הרבה משתנים (גיל, השכלה, עמדה פוליטית, דתיות), רק שניים שינו את גודל האפקט: <b>אמון ב־AI</b> ו<b>אמון במוסדות</b>. ובכל זאת, האמונה ירדה בכל הקבוצות.</li>
<li><b>זה זולג:</b> השיחה עסקה רק בנחיתה על הירח, אבל אבי האמין פחות <b>גם בקונספירציות אחרות</b>, גם אחרי חודשיים. כלומר השתנתה ״תפיסת העולם הקונספירטיבית״ שלו.</li>
<li><b>זה משפיע על כוונות:</b> יותר נכונות להפסיק לעקוב אחרי חשבונות שמפיצים את הקונספירציה ולהתווכח עם מאמינים. הכוונה להצטרף להפגנות לא ירדה מובהק, כי היא הייתה נמוכה מלכתחילה (<b>אפקט רצפה</b>: אין לאן לרדת).</li>
<li><b>ה־AI דייק:</b> בודק עובדות מקצועי בדק 128 טענות: 127 נכונות, אחת מטעה, אפס שגויות, ובלי הטיה פוליטית.</li>
<li><b>ה־AI לא ״מכבה כל אמונה״:</b> כשמשתתפים בחרו קונספירציה <b>אמיתית</b> (כמו MK Ultra, ניסויי ה־CIA), האמונה <b>לא ירדה</b>. כלומר הוא הגיב לראיות, לא סתם הוריד אמונות.</li>
</ul>

<h3>5. מה זה אומר</h3>
<p><b>תיאורטית:</b> הממצאים <b>מחלישים</b> את הסבר הצרכים. ה־AI לא ניסה לספק לאבי שליטה או ביטחון; הוא נתן <b>ראיות והסברים</b>, ואבי שינה דעה. זה מתאים לגישה ש<b>חשיבה אנליטית</b> מגינה מפני אמונות מפוקפקות, ושאנשים מוכנים לעדכן אמונות מול ראיות משכנעות. העובדה שהשינוי <b>יציב</b> ו<b>מתרחב</b> מתאימה ל<b>״דרך המרכזית״ לשכנוע</b> (שכנוע בטיעונים, שיוצר שינוי עמיד), בניגוד ל״דרך ההיקפית״ (רגש, סימני זהות, שיוצרים שינוי חולף). החוקרים לא טוענים שצרכים לא משחקים שום תפקיד. וחשוב: כאן מפריכים אמונה <b>שכבר קיימת</b>, משימה קשה יותר מ״חיסון מראש״, שבמחקרים קודמים השיג אפקט קטן בלבד.</p>
<p><b>מעשית:</b> בניגוד לרעיון של עולם ״פוסט־אמת״ שבו עובדות לא חשובות, לא כדאי לוותר על ראיות. אפשר לשלב AI בחיפוש באינטרנט וברשתות כדי להגיב למי שמשתף קונספירציות. האתגר: מאמינים מושבעים כנראה לא יבחרו לשוחח עם צ׳טבוט.</p>
<p><b>הסכנה:</b> אותו כלי יכול גם לשכנע אנשים <b>בשקרים</b>. שאלה פתוחה: האם AI משכנע באותה מידה גם כשהוא טוען משהו לא נכון?</p>
<p><b>מגבלות:</b> המשתתפים היו אמריקאים שממלאים סקרים בתשלום (אולי לא דומים לחברים פעילים בקבוצות קונספירציה), המודל סגור וקשה לשחזר, ולא בודד בדיוק מה בשיחה עבד.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. ההסבר המקובל: מאמינים בקונספירציות כי האמונה עונה על <b>צרכים</b> נפשיים, ולכן עובדות לא עוזרות.<br>
2. ההשערה החלופית: ההפרכות הקודמות לא היו <b>עמוקות</b> מספיק ולא <b>מותאמות אישית</b>, ומודל שפה יכול לפתור את שתי הבעיות.<br>
3. בשני מחקרים (כ־1,000 וכ־2,300 משתתפים), שיחה של כ־8 דקות עם GPT-4 הורידה את האמונה בכ־<b>20%</b>, לעומת כמעט אפס בקבוצת הביקורת.<br>
4. האפקט <b>נשמר</b> אחרי חודשיים, עבד על כל סוגי הקונספירציות, <b>זלג</b> לקונספירציות אחרות, וה־AI היה מדויק ולא הוריד אמונה בקונספירציות <b>אמיתיות</b>.<br>
5. המשמעות: הממצא <b>מחליש</b> את הסבר הצרכים ומתאים לשכנוע בדרך המרכזית. אבל אותו כלי יכול גם לשכנע בשקרים.<br><br>
<b>מה צריך לדעת לעשות:</b><br>
• להשוות בין הסבר הצרכים להשערת הראיות.<br>
• לתאר את הניסוי: הגרלה, קבוצת ביקורת, שלושה סבבים, מדידות חוזרות.<br>
• לקרוא את טבלת התוצאות ולהסביר למה עשו מחקר שני.<br>
• להסביר אפקט רצפה, ולמה חשוב שהאמונה בקונספירציות אמיתיות לא ירדה.<br>
• לציין את המגבלות והסכנות שהחוקרים מזכירים.</div>

<li><b>האפקט לא נעלם אחרי חודשיים.</b></li>
<li><b>הממצא מחליש את הסבר הצרכים</b>, לא מחזק אותו.</li>
<li><b>בקונספירציות אמיתיות האמונה לא ירדה</b>, וזה מראה שה־AI הגיב לראיות.</li>

<li><b>האפקט קטן יותר אצל מאמינים מושבעים, אבל לא נעלם.</b></li>
<li><b>רק אמון ב־AI ואמון במוסדות</b> שינו את גודל האפקט.</li>
</ul></div>`;
