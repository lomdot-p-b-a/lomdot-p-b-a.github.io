.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}

 {id:"t1",icon:"cycle",title:"רוח נגדית ורוח גבית",blocks:[
  {h:"תקציר",html:`${def("על מה הנושא",`כשרוכבים נגד הרוח מרגישים כל משב, אבל כשהרוח בגב כמעט לא שמים לב. המאמר טוען שכך גם בחיים: אנחנו רואים את המכשולים שלנו ולא את היתרונות.<br><b>מה נלמד כאן:</b> רוח נגדית ורוח גבית · המטפורה · Ross & Sicoly`)}<p>שבעה מחקרים מראים <mark>הטיית זמינות</mark> ${E("Availability bias")} בהערכה של הברכות שנהנינו מהן ושל המכשולים שעמדו בפנינו. <b>מכשולים</b> מושכים תשומת לב כי צריך להתגבר עליהם. <b>ברכות ומשאבים</b> אפשר פשוט ליהנות מהם ולהתעלם מהם.</p>${tiles([["building","פוליטיקה (1)","דמוקרטים ורפובליקנים טוענים שהמפה הפוליטית נגדם"],["target","ספורט (2)","אוהדי פוטבול שמים לב במיוחד למשחקים הקשים בלוח של הקבוצה"],["people","משפחה (3)","אנשים חושבים שההורים היו קשוחים איתם יותר ממה שהאחים מוכנים להודות"],["grad","אקדמיה (7)","אנשי אקדמיה חושבים שלתחום שלהם קשה יותר מול שופטים, ועדות מענקים וקביעות"]])}${def("מה המחקרים מראים",`האפקט נובע מ<b>זמינות</b> גבוהה יותר של הקשיים (מחקרים 4 ו-5), ולא רק מ<b>ניהול ייחוס</b> לטובת העצמי (6 ו-7). הבלטת הרוחות הנגדיות גורמת לתחושה של יחס <b>לא הוגן</b>, ולנכונות גדולה יותר לקבל התנהגות לא אתית (מחקר 7).`)}`,q:"q1"},

  {h:"הקבלה לרוס וסיקולי",html:`${def("Ross & Sicoly (1979)",`אנשים <b>מעריכים יתר על המידה</b> את התרומה שלהם למאמץ משותף, כי התרומה שלהם <b>בולטת</b> להם יותר מהתרומה של בן הזוג או העמיתים.`)}<p>התחושה שהתרומה שלי גדולה יותר נראית כמו <b>עובדה</b> ולא כמו דעה, כי מה שעשיתי עולה לראש הרבה יותר בקלות. באותו אופן, הבולטות השונה של רוחות נגדיות וגבית גורמת לתחושה שזו \"עובדה\" שהדברים <b>לא הוגנים</b>, ושעברנו דרך קשה יותר מאחרים.</p>${ex(`שני שותפים לדירה נשאלים כמה אחוז מהכלים כל אחד שוטף. אחד אומר 70%, השני אומר 60%. ביחד יוצא 130%, כי כל אחד זוכר בעיקר את הפעמים שהוא שטף.`)}`,q:"q5"}

 {id:"t2",icon:"brain",title:"למה המכשולים זמינים יותר",blocks:[
  {h:"שלוש סיבות",html:`${def("על מה הנושא",`למה המכשולים קופצים לראש יותר בקלות? הנושא מציג את הסיבות, ומה המחיר של ההטיה.<br><b>מה נלמד כאן:</b> שלוש סיבות · זמינות מול מוטיבציה · טינה וזכאות · הכרת תודה`)}<p>רוס וסיקולי הציעו ארבע סיבות לבולטות של התרומה העצמית. לפחות שלוש מהן מתאימות גם כאן:</p>${tiles([["brain","קידוד עמוק","מכשולים דורשים תשומת לב כי צריך להתגבר עליהם, ולכן הם מקודדים ונשמרים עמוק יותר. כותב צריך להתייחס לביקורת בתיקון המאמר, לא לשבחים"],["clock","פער מידע","אותיות טובות נעלמות מהר, רעות נשארות. מטיילים מבלים יותר זמן בעלייה מאשר בירידה, ולכן חושבים שבמסלול יש יותר עליות"],["target","מוטיבציה","ניהול ייחוס לטובת העצמי: רוח נגדית חזקה היא תירוץ לכישלון ומגדילה את ההצלחה"]])}${rem("הסיבה הרביעית של רוס וסיקולי, <b>שליפה דיפרנציאלית</b> (מתחילים לחשוב מ\"מה אני עשיתי\"), כנראה פחות מתאימה, כי לא ברור שאנשים מתחילים מ\"על מה התגברתי\" אם המכשולים לא קודדו עמוק קודם.")}${ex(`סטודנטית שזוכרת היטב את הלילה שבו נשארה ערה ללמוד, אבל לא שמה לב שיש לה חדר שקט משלה ומחשב חדש. הקושי מורגש, היתרון פשוט "שם".`)}`,q:"q7"},
  {h:"לא רק מוטיבציה",html:`<p>החוקרים <b>לא</b> טוענים שמניעים של שיפור העצמי לא משחקים תפקיד. אבל טענות אסטרטגיות כאלה יכולות ליצור את אותו דפוס, ולכן הם תכננו מחקרים שמפרידים בין ההסברים.</p>${def("חיזוי הפוך",`גישה מוטיבציונית יכולה לנבא גם <b>את ההפך</b>: אנשים רוצים לראות את הסיכויים שלהם באור חיובי. יש ספרות ענפה על <b>ביטחון יתר</b>, <b>אופטימיות לא מציאותית</b> והערכה עצמית מנופחת. כל אלה פועלים <b>נגד</b> התחזית של החוקרים, ולכן הופעת ההטיה השלילית היא עדות לעוצמה שלה.`)}${rem("ההסבר כאן הוא <b>זמינות</b> שונה, ולא <b>השפעה</b> שונה. כלומר החוקרים הראו שהמכשולים בולטים יותר בזיכרון ובקשב, לא רק שהם משפיעים יותר (כמו ב\"הרע חזק מהטוב\").")}`,q:"q9"},
  {h:"טינה, קנאה וזכאות",html:`<p>ניטשה כתב שאין דבר שמכלה אדם מהר יותר מ<b>טינה</b>. כשאנשים חושבים (בטעות) שהדרך שלהם הייתה קשה במיוחד, קל להם לחוש טינה כלפי מי שלכאורה היה לו קל.</p>${tiles([["sprout","קנאה מיטיבה","מאמץ להשיג מה שלאחרים יש"],["x","קנאה ממאירה","אם נראה שהאחרים הרוויחו בדרך קלה לא הוגנת: לקחת או להרוס את ההישגים שלהם"],["scales","זכאות","תחושה שמגיע לי יותר, ופיתוי \"לקצר דרך\" או לנהוג באופן לא אתי"]])}${def("הצד השני: הכרת תודה",`הכרת תודה הופכת אנשים <b>מאושרים</b> יותר, <b>בריאים</b> יותר, מעריכים יותר את בני הזוג ו<b>טובים</b> יותר לאחרים. ההטיה עוזרת להסביר למה קשה כל כך להרגיש אותה באופן קבוע, ולמה חסרה לנו חמלה כלפי הקשיים של אחרים.`)}`,q:"q11"}

  {h:"מחקר 1: לא הוגן ולא מאוזן",html:`${def("על מה הנושא",`שני המחקרים הראשונים: דמוקרטים ורפובליקנים, ואוהדי פוטבול. כל צד חושב שקשה לו יותר.<br><b>מה נלמד כאן:</b> מחקר 1: פוליטיקה · מעורבות פוליטית · מחקר 2: פוטבול`)}<p>100 משתתפים ענו על שלוש שאלות: למי יש יתרון ב<b>מכללת הבוחרים</b>, למי קשה יותר <b>לגייס כסף</b> לקמפיין, ולמי קשה יותר להשיג שיתוף פעולה מה<b>קונגרס</b>. הסולם: 1 = קשה יותר לרפובליקנים, 7 = קשה יותר לדמוקרטים.</p>${fig("study1","כל צד חושב שהמערכת נגדו")}${tiles([["check","דמוקרטים","4.75: המערכת מעדיפה את הרפובליקנים"],["check","רפובליקנים","3.42: המערכת מעדיפה את הדמוקרטים"],["split","מתונים","4.04: שווה לשני הצדדים"]])}`,q:"q13"},
  {h:"מעורבות פוליטית",html:`${def("תחזית של זמינות",`מי שמתעניין יותר בפוליטיקה נחשף ליותר דוגמאות למכשולים של המפלגה שלו ולברכות של היריבה. לכן אצלו ההטיה אמורה להיות <b>חזקה יותר</b>.`)}${yn(["בעלי ידע גבוה: ליברלים 5.05 מול שמרנים 3.44, הבדל גדול ומובהק"],["בעלי ידע נמוך: ליברלים 4.24 מול שמרנים 3.94, אין הבדל מובהק"])}${rem("ככל שאנשים חשבו שהם יודעים יותר, כך הרוחות הנגדיות של המפלגה שלהם והרוחות הגביות של היריבים היו <b>בולטות</b> יותר.")}`,q:"q15"},
  {h:"מחקר 2: הם ראו לוח משחקים",html:`<p>במחקר 1 ביקשו מהמשתתפים <b>להשוות</b> במפורש. האם ההטיה מופיעה גם בלי בקשה כזו? אחרי פרסום לוח המשחקים של ליגת הפוטבול (NFL) לעונת 2014, נאספו <b>124 פוסטים</b> של אוהדים בפורום, ושלושה מקודדים שלא ידעו את ההשערה דירגו אותם.</p>${tiles([["x","41%","מהפוסטים התמקדו בעיקר בקשיים שבדרך"],["check","21%","התמקדו בעיקר בדברים המעודדים"]])}${def("לא רק קבוצות חלשות",`אולי רק אוהדי קבוצות חלשות מתלוננים? לא: לא היה קשר למאזן העונה הקודמת. גם אוהדי קבוצות מצליחות (9 ניצחונות ומעלה) וגם של קבוצות לא מצליחות התמקדו יותר בחסרונות.`)}`,q:"q17"}
 ]},
 {id:"t4",icon:"people",title:"מחקרים 3 ו-4: אמא תמיד אהבה אותך יותר",blocks:[
  {h:"מחקר 3",html:`${def("על מה הנושא",`גם בתוך המשפחה: כל אח בטוח שההורים היו קשוחים יותר דווקא איתו.<br><b>מה נלמד כאן:</b> מחקר 3: אחים · מחקר 4: מה עולה לראש`)}<p>96 משתתפים עם <b>אח אחד בלבד</b> (51 בכורים, 45 צעירים) ענו על שבע שאלות על משפחות עם שני ילדים: את מי ההורים <b>מענישים</b>, <b>מטיפים</b> לו, מחזיקים ב<b>סטנדרט גבוה</b> או <b>מתעלמים</b> ממנו יותר (רוחות נגדיות), ועם מי הם <b>מקלים</b>, ומי מקבל יותר <b>עידוד</b> ו<b>שבחים</b> (רוחות גביות).</p>${sibTable}${rem("כולם הסכימו שההורים קשוחים יותר עם הבכור ומקלים עם הצעיר. אבל <b>הבכורים</b> חשבו שההבדל הרבה יותר גדול ממה שהצעירים מוכנים להודות. (בשאלה מי מקבל יותר התעלמות לא היה הבדל.)")}`,q:"q19"},
  {h:"מחקר 4: מה עולה לראש",html:`<p>83 משתתפים עם אח אחד התבקשו <b>לכתוב אירועים</b> שבהם ההורים התייחסו אליהם ואל האח באופן שונה, לטובתם או לרעתם. אחר כך ענו על 8 שאלות על <b>המשפחה שלהם</b> (1 = אני, 9 = האח).</p>${tiles([["x","1.36 אירועים","שבהם התייחסו אליהם בחומרה רבה יותר"],["check","0.44 אירועים","שבהם התייחסו אליהם בקלות רבה יותר"],["target","79% מול 21%","האירוע הראשון שנכתב היה על רוח נגדית ב-79% מהמקרים"]])}${def("הקשר לשיפוט",`המשתתפים חשבו שההורים <b>החמירו איתם</b> והקלו עם האח. וככל שהרוחות הנגדיות היו <b>זמינות יותר</b> (יותר אירועים קשים מקלים), כך הם חשבו יותר שההורים היו קשים איתם וקלים עם האח.`)}`,q:"q21"}
 ]},
 {id:"t5",icon:"doc",title:"מחקר 5: עבודה קשה זוכרים",blocks:[
  {h:"השראה: טברסקי וכהנמן",html:`${def("על מה הנושא",`מחקר 5 בודק ישירות את הזיכרון: האם משימות קשות נזכרות יותר?<br><b>מה נלמד כאן:</b> טברסקי וכהנמן · הניסוי`)}${def("Tversky & Kahneman (1973)",`השמיעו רשימת שמות של גברים ונשים. כשהגברים ברשימה היו <b>מפורסמים יותר</b>, המשתתפים העריכו (בטעות) שהיו בה יותר גברים, ולהפך. השמות המפורסמים נזכרו בקלות, ו<b>הזמינות</b> שלהם עיוותה את ההערכה.`)}<p>באותו היגיון, החוקרים יצרו משימה שבה חלק מהסבבים <b>קשים</b> וחלק <b>קלים</b>, ושאלו כמה סבבים היו מכל סוג.</p>`,q:"q23"},
  {h:"הניסוי והתוצאה",html:`<p>100 משתתפים שיחקו מתמחים במגזין ועברו על <b>24 משפטים</b>, בכחול או בירוק. בצבע אחד רק לוחצים "המשך" (קל), ובצבע השני <b>סופרים את התנועות</b> במשפט (קשה). מספר המשפטים מכל צבע היה <b>שווה</b>.</p>${fig("study5","הם העריכו שהיו יותר משפטים בצבע של המשימה הקשה")}${rem("המשימה הקשה (הרוח הנגדית) דרשה יותר מאמץ וקשב, ולכן עיוותה את ההערכה. ואין כאן סיבה מוטיבציונית לעוות: הדרך הכי טובה להיראות טוב הייתה פשוט להעריך נכון.")}`,q:"q25"}
 ]},
 {id:"t6",icon:"question",title:"מחקר 6: חכם יותר מסטודנט בליגת הקיסוס?",blocks:[
  {h:"למה עוד מחקר",html:`${def("על מה הנושא",`מחקר 6 מראה שזוכרים במיוחד את מה שקשה <b>לנו</b>, ולא את מה שקשה ליריב.<br><b>מה נלמד כאן:</b> תחרות טריוויה · טעויות וזיהוי`)}<p>האם בכורים <b>באמת</b> מאמינים שהיה להם קשה יותר, או שהטענה רק גורמת להם להרגיש טוב? שני ההסברים לא סותרים, אבל חשוב להראות את ההטיה גם במקום שבו <mark>ניהול ייחוס</mark> ${E("Attribution management")} או <b>הכשלה עצמית</b> ${E("Self-handicapping")} כמעט לא רלוונטיים.</p>${rem("גם במחקר 2 זה פחות מתאים: אוהדים מגזימים בחסרונות בדרך כלל לקראת משחק, ולא בפוסטים אנונימיים חודשים לפני העונה. ובמחקר 5 לא היה בכלל \"ביצוע\" שמישהו מדרג.")}`,q:"q27"},
  {h:"תחרות טריוויה",html:`<p>52 סטודנטים מקורנל הגיעו בזוגות לתחרות טריוויה. כל אחד ראה <b>שתי רשימות</b>: 10 קטגוריות שלו ו-10 של היריב. בכל רשימה 5 <b>קלות</b> (ידוענים, סיטקומים) ו-5 <b>קשות</b> (מוזיקה בארוקית, ספרות רוסית). אחרי מטלה מסיחה נבדק <b>הזיכרון</b>: שליפה חופשית (עם פרס למי שזוכר הכי הרבה) ואז זיהוי.</p>${fig("study6","מהרשימה של היריב נזכרו בעיקר הקטגוריות הקלות")}${def("התוצאה",`מהרשימה <b>שלהם</b> נזכרו בערך באותה מידה קלות וקשות. מהרשימה של <b>היריב</b> נזכרו הרבה יותר <b>קלות</b>. 70% זכרו יותר קטגוריות קשות מהרשימה שלהם מאשר מזו של היריב, לעומת 53% בלבד שזכרו יותר קלות.`)}`,q:"q29"},
  {h:"טעויות וזיהוי",html:`<p>גם ה<b>טעויות</b> הטו לטובת הרוחות הנגדיות: יותר "לזכור" קטגוריה קשה של היריב כשלי, או קלה שלי כשל היריב (0.43 טעויות), מאשר טעויות לטובתם (0.15). 36% עשו לפחות טעות אחת לרעתם, לעומת 15% שעשו טעות לטובתם.</p>${tiles([["check","זיהוי","גם במבחן הזיהוי: אותו מספר קלות וקשות מהרשימה שלי, ויותר קלות מזו של היריב"],["brain","המסקנה","המשתתפים לא רק <b>טענו</b> שהתחרות לא הוגנת, הם <b>זכרו</b> אותה כקשה יותר ממה שהייתה"]])}${rem("הערה: קטגוריות קלות קל יותר לזכור באופן כללי (נבדק במדגם נפרד). אז העובדה שזכרו את הקשות שלהם באותה מידה כמו הקלות מראה כמה תשומת לב נתנו להן.")}`,q:"q31"}
 ]},
 {id:"t7",icon:"scales",title:"מחקר 7: לרואי חשבון יש פרצות",blocks:[
  {h:"השאלה והמדגם",html:`${def("על מה הנושא",`מחקר 7: האם ההרגשה שקשה לי מצדיקה בעיניי לרמות?<br><b>מה נלמד כאן:</b> רואי חשבון · מי חושב שקשה לו · גמישות מוסרית`)}<p>בחשבונאות יש סגל <b>ניסויי</b> וסגל <b>לא ניסויי</b>. האם כל קבוצה חושבת שלה קשה יותר? והאם ההרגשה הזו מובילה ל<b>קבלה של התנהגות לא אתית</b> כדי "לאזן את המאזניים"?</p>${rem("למה זה חשוב? (1) זה מראה <b>מחיר</b> של ההטיה. (2) הסבר של הכשלה עצמית מנבא מה אנשים <b>יגידו</b> על המכשולים, אבל לא מנבא נכונות לקבל התנהגות לא אתית. כך זה מפריד בין ההסברים.")}<p>נשלח סקר ל-800 אנשי סגל מחמש מדינות בארה"ב. השתתפו <b>101</b>, ונותחו 100: 21 ניסויים ו-79 לא ניסויים.</p>`,q:"q33"},
  {h:"מי חושב שקשה לו",html:`${accTable}<p>באופן כללי כולם חשבו שלניסויים קשה יותר (תחום צעיר). אבל <b>הניסויים</b> חשבו שקשה להם יותר <b>באופן מובהק</b> (4.64), ו<b>הלא ניסויים</b> חשבו שזה <b>שווה</b> (4.10). ההבדל ביניהם מובהק.</p>`,q:"q35"},
  {h:"גמישות מוסרית",html:`<p>נמדדה <mark>גמישות מוסרית</mark>: הסכמה עם 9 משפטים על <b>פרקטיקות מחקר מפוקפקות</b>, למשל "מותר לפרסם את אותה עבודה פעמיים אם כתבי העת שונים מספיק" או "אין בעיה בגניבה עצמית כי היא לא מזיקה".</p>${def("התוצאה",`לא היה הבדל כללי בין הקבוצות, וגם לא השפעה ישירה של תחושת הקושי. אבל ה<b>אינטראקציה</b> הייתה מובהקת: אנשים קיבלו פרקטיקות מפוקפקות <b>בדיוק ביחס</b> למידה שבה חשבו שהרוחות הנגדיות שלהם חזקות משל אחרים.`)}${rem("אצל הלא ניסויים: ככל שחשבו שלהם קשה יותר, קיבלו יותר (קרוב למובהקות). אצל הניסויים: אותו כיוון, לא מובהק.")}`,q:"q37"}
 ]},
 {id:"t8",icon:"bulb",title:"דיון: מה ההטיה עושה לנו",blocks:[
  {h:"\"הרע זמין יותר מהטוב\"",html:`${def("על מה הנושא",`מה ההטיה עושה לנו, ומתי בכל זאת אנחנו רואים את הרוח בגב?<br><b>מה נלמד כאן:</b> הרע זמין יותר · הכרת תודה וטינה · מדיניות · סיכום`)}<p>ההטיה קשורה ל<b>הטיית השליליות</b> ("הרע חזק מהטוב"), אבל שונה ממנה. סקירות קודמות מצאו עדויות <b>חלשות</b> להטיה שלילית בזיכרון, ואפילו הטיה <b>חיובית</b> בזיכרון.</p>${def("החידוש",`החוקרים מזהים <b>סוג מסוים</b> של מידע שלילי, המכשולים, שבולט במיוחד, נשאר זמין ומשפיע על השיפוט. במקום \"הרע חזק מהטוב\": <mark>"הרע זמין יותר מהטוב"</mark>.`)}<p>הרבה דיונים בהטיית השליליות מבוססים על הסברים <b>אבולוציוניים</b> רחוקים (עם סכנה צריך להתמודד מיד). לפי החוקרים, צריך להשלים אותם בהסברים <b>קרובים</b> שמתארים את התהליכים הנפשיים המדויקים.</p>${rem("ההסבר כאן לא תלוי ב<b>אבחנתיות</b> של המידע (כמה הוא מלמד על משהו). עונש מההורים לא מלמד על הילדות יותר משבח. אבל עונש וקושי הם מכשולים שצריך להתגבר עליהם, ולכן הם בולטים.")}`,q:"q39"},
  {h:"הכרת תודה וטינה",html:`<p>ההטיה מצטרפת ל"אויבים" מוכרים של הכרת תודה: הסתגלות, חמדנות, יוהרה, והתחושה שהעול של כולם כבד במיוחד עליי.</p>${ex("פיט טאונסנד מלהקת The Who מאמין שהיה מצליח באותה מידה גם בלי הלהקה. אולי, אבל זה מתעלם מהיתרון של מתופף פופולרי, זמר ייחודי ומנהלים שאפתניים.")}${def("הון חברתי",`DiTomaso (2013): כשאנשים סיפרו את סיפור חייהם, רק אחרי שאלות ממוקדות התברר מי עזר להם. גם מי שקיבל עבודה בזכות קשרים חשב שעשה הכול לבד, והזכיר את העבודה הקשה בקולג' ולא את שכר הלימוד ששילמו ההורים.`)}`,q:"q41"},
  {h:"מדיניות יהירה",html:`<p>גם קובעי מדיניות מתעלמים מהרוחות הגביות של המדינות שלהם, ומנסים \"לייצא\" שיטות למקומות שבהם הן פחות יצליחו.</p>${tiles([["chart","\"טיפול בהלם\" ברוסיה","הפרטה וליברליזציה אחרי פירוק ברית המועצות, בלי המוסדות שמאפשרים לקפיטליזם לעבוד (בתי משפט, רגולציה, חברה אזרחית)"],["building","עיראק 2003","הניסיון ליצור \"דמוקרטיה לדוגמה\" התעלם מהיתרונות של היסטוריה, מנהגים וגאוגרפיה"],["factory","\"We Built It\"","סיסמת רומני ב-2012. הרוחות הגביות של עסקים (ביטחון, תשתיות, כוח עבודה משכיל) קשות לראות, והרוחות הנגדיות (מסים, רגולציה) בולטות"]])}${rem("הטיה זו עלולה גם להחריף את השיח הציבורי על מסים, רגולציה ורשת ביטחון סוציאלית, כי קל להתעלם מהמכשולים הנסתרים של העניים.")}`,q:"q43"},

 {q:"מה החולשה של מחקר 1 שמחקר 2 נועד לפתור?",a:"במחקר 1 ביקשו במפורש להשוות, וזה עלול להשפיע",w:["במחקר 1 המדגם היה קטן מדי ולא מייצג","במחקר 1 לא הייתה קבוצת ביקורת מתאימה","במחקר 1 נבדקו רק דמוקרטים ולא רפובליקנים"],e:"מחקר 2 בדק אם ההטיה מופיעה בלי בקשה כזו."},
 {q:"מה היחס בין פוסטים על קשיים לפוסטים מעודדים במחקר 2?",a:"בערך פי שניים יותר פוסטים על קשיים",w:["בערך אותו מספר מכל סוג","פי שניים יותר פוסטים מעודדים","כמעט כל הפוסטים היו מעודדים"],e:"41% על קשיים, 21% על דברים מעודדים."}]},
q18:{t:"t3",v:[
 {q:"מישהו טוען: ״רק אוהדים של קבוצות גרועות מתלוננים על הלוח.״ מה מחקר 2 מראה?",a:"גם אוהדי קבוצות מצליחות התמקדו בחסרונות",w:["הוא צודק, רק הם התמקדו בקשיים","אוהדי קבוצות מצליחות לא כתבו בכלל","המחקר לא בדק את הנושא הזה"],e:"לא היה קשר למאזן העונה הקודמת."},
 {q:"למה חשוב שהמקודדים במחקר 2 לא ידעו את ההשערה?",a:"כדי שהציפיות שלהם לא ישפיעו על הדירוג",w:["כדי שיעבדו מהר יותר על הפוסטים","כדי שלא יכירו את הקבוצות והשחקנים","כדי שיוכלו לכתוב פוסטים בעצמם בפורום"],e:"זה מונע הטיה של החוקרים בקידוד."}]},
q19:{t:"t4",v:[
 {q:"גם הבכורים וגם הצעירים הסכימו שההורים קשוחים יותר עם הבכור. איפה בכל זאת הופיעה ההטיה?",a:"בגודל ההבדל: הבכורים ראו אותו גדול יותר",w:["בכיוון: הצעירים חשבו שקשה להם יותר","בכלל לא, כי הייתה הסכמה מלאה","רק בשאלה על התעלמות"],e:"80% מהבכורים לעומת 47% מהצעירים."},
 {q:"92% מהבכורים ו-71% מהצעירים הסכימו שההורים מקלים עם הצעיר. מה זה מראה?",a:"הצעירים פחות מוכנים להודות ברוח הגבית שלהם",w:["הבכורים לא זוכרים טוב את הילדות שלהם","הצעירים חושבים שדווקא להם קשה יותר","אין הבדל משמעותי בין שתי הקבוצות"],e:"הרוח הגבית שלי בולטת לי פחות."}]},
q20:{t:"t4",v:[
 {q:"באיזו שאלה על ״רוח נגדית״ לא נמצא הבדל בין בכורים לצעירים?",a:"את מי ההורים נוטים להתעלם יותר",w:["את מי ההורים מענישים יותר","ממי ההורים מצפים לסטנדרט גבוה","למי ההורים מטיפים יותר"],e:"בשאר השאלות הופיעה ההטיה."},
 {q:"למה המשתתפים במחקרים 3 ו-4 היו רק אנשים עם אח אחד?",a:"כדי שההשוואה תהיה ברורה בין שני ילדים בלבד",w:["כדי שהמדגם יהיה קטן וקל יותר לניהול","כי לאנשים עם כמה אחים אין הטיה כזו","כדי לבדוק רק בכורים ולא ילדים צעירים"],e:"משפחה עם שני ילדים מאפשרת השוואה ישירה."}]},
q21:{t:"t4",v:[
 {q:"במחקר 4, המשתתפים כתבו בממוצע 1.36 אירועים מחמירים ו-0.44 מקלים. מה זה מראה?",a:"אירועים קשים עולים לראש הרבה יותר בקלות",w:["ההורים באמת היו קשוחים יותר איתם","המשתתפים שיקרו לגבי הילדות שלהם","אירועים מקלים כמעט לא קרו במשפחות"],e:"זה בדיקה ישירה של הזמינות."},
 {q:"ב-79% מהמקרים, האירוע הראשון שנכתב היה על רוח נגדית. למה זה חשוב?",a:"כי מה שעולה ראשון מעיד על מה שהכי זמין",w:["כי זה מוכיח שההורים היו לא הוגנים","כי זה מראה שהמשתתפים לא קראו את ההוראות","כי זה מראה שאירועים קשים ארוכים יותר"],e:"סדר השליפה משקף זמינות."}]},
q22:{t:"t4",v:[
 {q:"מה הקשר שנמצא במחקר 4 בין זמינות לשיפוט?",a:"ככל שהקשיים זמינים יותר, ההורים נשפטו כקשים יותר",w:["לא נמצא קשר בין זמינות לשיפוט","ככל שהקשיים זמינים יותר, השיפוט מאוזן יותר","השיפוט היה תלוי רק בסדר הלידה"],e:"הזמינות ניבאה את השיפוט."},
 {q:"מה מוסיף מחקר 4 על מחקר 3?",a:"שאל על המשפחה של המשתתף, ובדק מה עולה לראש",w:["השתמש במדגם גדול הרבה יותר מהקודם","בדק משפחות עם שלושה ילדים ויותר","השווה בין משתתפים מתרבויות שונות"],e:"במחקר 3 השאלות היו על משפחות באופן כללי."}]},
q23:{t:"t5",v:[
 {q:"בניסוי של טברסקי וכהנמן, השמות של הגברים ברשימה היו מפורסמים יותר. מה העריכו המשתתפים?",a:"שהיו ברשימה יותר גברים",w:["שהיו יותר נשים","שהמספר היה שווה","שהרשימה הייתה ארוכה מהרגיל"],e:"מה שזמין בזיכרון נראה שכיח יותר."},
 {q:"מה הקשר בין מחקר 5 לניסוי של טברסקי וכהנמן?",a:"בשניהם מה שזמין בזיכרון נראה שכיח יותר",w:["בשניהם נבדקה נכונות להתנהגות לא אתית","בשניהם המשתתפים התחרו זה מול זה","בשניהם נבדקו יחסים בתוך המשפחה"],e:"מחקר 5 מיישם את אותו היגיון על משימות קשות."}]},
q24:{t:"t5",v:[
 {q:"למה מחקר 5 משתמש במשימה מלאכותית (ספירת תנועות) ולא בחיים האמיתיים?",a:"כדי שכמות הקל והקשה תהיה שווה באמת",w:["כי חיים אמיתיים לא מעניינים את המשתתפים","כדי שהמשתתפים יתחרו זה בזה","כדי לבדוק את הזיכרון לטווח ארוך"],e:"במעבדה אפשר לדעת בוודאות שהיו 50% מכל סוג."},
 {q:"איזה מהבאים מתאר את התנאי ״הקשה״ במחקר 5?",a:"ספירת התנועות במשפט",w:["לחיצה על ״המשך״","כתיבת המשפט מחדש","תרגום המשפט לשפה אחרת"],e:"בצבע השני רק לחצו ״המשך״."}]},
q25:{t:"t5",v:[
 {q:"במחקר 5 היו 50% משפטים מכל צבע. המשתתפים העריכו כ-56% בצבע הקשה. מה ההסבר?",a:"המשימה הקשה דרשה תשומת לב, ולכן נזכרה יותר",w:["המשתתפים רצו להיראות חרוצים מול החוקרים","המשפטים בצבע הקשה היו ארוכים יותר מהאחרים","המשתתפים לא הבחינו היטב בין שני הצבעים"],e:"מאמץ = זמינות = הערכת יתר."},
 {q:"למה קשה להסביר את מחקר 5 בניהול ייחוס לטובת העצמי?",a:"כי לא דורג ביצוע, והדרך להיראות טוב הייתה לדייק",w:["כי המשתתפים לא ידעו שהם נבדקים","כי המשימה הייתה קלה מדי לכולם","כי המשתתפים היו בתחרות זה מול זה"],e:"אין כאן מניע לעוות."}]},
q26:{t:"t5",v:[
 {q:"למה חשוב שבמחקר 5 מספר המשפטים מכל צבע היה שווה?",a:"כדי שכל סטייה בהערכה תנבע מהזיכרון, לא מהמציאות",w:["כדי שהמשימה תהיה הוגנת לכל המשתתפים","כדי שהמשתתפים יצליחו לנחש נכון","כדי לבדוק את ההבדל בין שני הצבעים עצמם"],e:"כך ההטיה מבודדת."},
 {q:"מה הייתה המשימה הקשה במחקר 5?",a:"לספור את התנועות במשפט",w:["לזכור את המשפט בעל פה","לתקן שגיאות כתיב במשפט","לסכם את המשפט במילה אחת"],e:"בצבע השני רק לחצו ״המשך״."}]},
q27:{t:"t6",v:[
 {q:"למה היה צורך במחקר 6 אחרי מחקר 3 על אחים?",a:"להראות את ההטיה כשניהול ייחוס לא מסביר אותה",w:["כי במחקר 3 לא היה מספיק משתתפים","כי מחקר 3 לא בדק זיכרון בכלל","כי מחקר 3 לא מצא הטיה"],e:"בכורים אולי טוענים שקשה להם כי זה מרגיש טוב."},
 {q:"סטודנט נשאר ער כל הלילה לפני מבחן, כדי שאם ייכשל יהיה לו תירוץ. מה זה?",a:"הכשלה עצמית",w:["קידוד עמוק","פער מידע","קנאה מיטיבה"],e:"יצירה של מכשול שמספק תירוץ לכישלון."}]},
q29:{t:"t6",v:[
 {q:"במחקר 6, מהרשימה של היריב נזכרו הרבה יותר קטגוריות קלות. מה זה מראה?",a:"היתרונות של היריב זמינים לנו יותר מקשייו",w:["קטגוריות קלות תמיד נזכרות יותר","המשתתפים לא קראו את הרשימה של היריב","היריב באמת קיבל קטגוריות קלות יותר"],e:"הרוח הגבית של היריב היא הרוח הנגדית שלי."},
 {q:"כמה מהמשתתפים זכרו יותר קטגוריות קשות מהרשימה שלהם מאשר מזו של היריב?",a:"70%",w:["53%","36%","15%"],e:"לעומת 53% שזכרו יותר קטגוריות קלות שלהם."}]},
q30:{t:"t6",v:[
 {q:"למה נתנו פרס למי שזוכר הכי הרבה במחקר 6?",a:"כדי שינסו לזכור בדייקנות, בלי סיבה לעוות",w:["כדי להגביר את התחרות בין הזוגות","כדי לבדוק את המוטיבציה שלהם","כדי שיזכרו רק קטגוריות קשות"],e:"זה מצמצם הסבר של ניהול ייחוס."},
 {q:"מה מבדיל את ממצאי מחקר 6 מסתם טענה ש״התחרות לא הוגנת״?",a:"ההטיה הופיעה בזיכרון עצמו",w:["המשתתפים ניצחו בתחרות","הקטגוריות היו באמת לא הוגנות","המשתתפים דיווחו על תחושת עוול"],e:"הם זכרו אותה כקשה יותר ממה שהייתה."}]},
q31:{t:"t6",v:[
 {q:"משתתף ״זוכר״ שקטגוריה קשה של היריב הייתה שלו. איזה סוג טעות זו?",a:"טעות לרעתו (לטובת הרוח הנגדית)",w:["טעות לטובתו, נגד היריב","טעות אקראית בלי כיוון מסוים","טעות בזיהוי בלבד, לא בשליפה"],e:"טעויות כאלה היו נפוצות פי שלושה בערך."},
 {q:"למה זה משמעותי שהמשתתפים זכרו את הקטגוריות הקשות שלהם כמו את הקלות?",a:"כי קטגוריות קלות בדרך כלל נזכרות יותר",w:["כי הקטגוריות הקשות היו מעניינות יותר","כי המשתתפים קיבלו עליהן פרס","כי הן הופיעו ראשונות ברשימה"],e:"זה מראה כמה תשומת לב נתנו לקשות."}]},
q32:{t:"t6",v:[
 {q:"36% עשו לפחות טעות אחת לרעתם, ו-15% טעות לטובתם. מה המסקנה?",a:"גם הטעויות בזיכרון הוטו לטובת הרוחות הנגדיות",w:["הטעויות היו אקראיות לגמרי, בלי כיוון","רוב המשתתפים זכרו את הרשימות בלי טעויות","המשתתפים העדיפו לזכור דברים טובים על עצמם"],e:"הזיכרון עצמו מעוות לכיוון הקשיים."},
 {q:"מה מצא מבחן הזיהוי במחקר 6?",a:"מהרשימה של היריב זוהו יותר קלות",w:["מהרשימה שלי זוהו יותר קלות","לא היה הבדל בכלל","זוהו רק קטגוריות קשות"],e:"מהרשימה שלי: אותו מספר קלות וקשות."}]},
q33:{t:"t7",v:[
 {q:"איך מחקר 7 מפריד בין הסבר הזמינות לבין הכשלה עצמית?",a:"הכשלה עצמית לא מנבאת נכונות לקבל התנהגות לא אתית",w:["הכשלה עצמית מנבאת שאנשים יעבדו פחות","הכשלה עצמית קיימת בעיקר אצל סטודנטים","הכשלה עצמית מנבאת בדיוק את אותה תוצאה"],e:"רק תחושת יחס לא הוגן מנבאת ״איזון המאזניים״."},
 {q:"כמה אנשי סגל נותחו במחקר 7, ואיך הם התחלקו?",a:"100: מיעוט ניסויים ורוב לא ניסויים",w:["800: חצי ניסויים וחצי לא ניסויים","52: כולם ניסויים","100: רוב ניסויים ומיעוט לא ניסויים"],e:"21 ניסויים ו-79 לא ניסויים."}]},
q35:{t:"t7",v:[
 {q:"הניסויים חשבו שקשה להם יותר (4.64), והלא ניסויים חשבו שזה שווה (4.10). מה זה מראה?",a:"כל קבוצה מגזימה בקשיים שלה",w:["הניסויים צודקים, והלא ניסויים מכחישים","שתי הקבוצות מסכימות לגמרי","אין קשר בין הקבוצה לשיפוט"],e:"ההבדל בין הקבוצות מובהק."},
 {q:"באיזה תחום כמעט לא היה הבדל בין הקבוצות?",a:"קבלה למשרה",w:["פרסום מאמרים","קביעות","מענקי מחקר"],e:"4.50 מול 4.51."}]},
q36:{t:"t7",v:[
 {q:"למה הגיוני שבאופן כללי חשבו שלניסויים קשה יותר?",a:"כי חשבונאות ניסויית היא תחום צעיר",w:["כי הניסויים משכנעים יותר","כי יש יותר ניסויים בתחום","כי הניסויים עונים יותר לסקרים"],e:"לכן החשוב הוא ההבדל בין הקבוצות."},
 {q:"מה המשמעות של ציון 7 בסולם של מחקר 7?",a:"לניסויים קשה יותר",w:["ללא ניסויים קשה יותר","קשה לשתי הקבוצות באותה מידה","אין לי דעה על השאלה"],e:"7 = לניסויים קשה יותר."}]},
q37:{t:"t7",v:[
 {q:"מה נמצא לגבי הקשר בין תחושת קושי לגמישות מוסרית?",a:"אינטראקציה: ככל שחשבו שלהם קשה יותר, קיבלו יותר",w:["השפעה ישירה וחזקה בכל הקבוצות","אין שום קשר בין המשתנים","הניסויים תמיד גמישים יותר מוסרית"],e:"לא היה הבדל כללי ולא השפעה ישירה, רק אינטראקציה."},
 {q:"איזו מהבאות היא דוגמה לפרקטיקה מפוקפקת מהמחקר?",a:"לפרסם את אותה עבודה פעמיים בכתבי עת שונים",w:["לשתף נתונים גולמיים עם חוקרים אחרים","לבקש הארכה מכתב העת לפני ההגשה","לצטט מחקרים של עמיתים מהמחלקה"],e:"וגם ״גניבה עצמית לא מזיקה״."}]},
q38:{t:"t7",v:[
 {q:"האם נמצא הבדל כללי בגמישות המוסרית בין ניסויים ללא ניסויים?",a:"לא, ההשפעה הופיעה רק כאינטראקציה",w:["כן, הניסויים גמישים יותר","כן, הלא ניסויים גמישים יותר","לא, כי לא מדדו גמישות מוסרית"],e:"מה שקובע הוא כמה אדם חושב שלו קשה יותר."},
 {q:"מה ההיגיון שהחוקרים הציעו לקבלת פרקטיקות מפוקפקות?",a:"״לאזן את המאזניים״",w:["לחסוך זמן ומאמץ בעבודה","לקבל קידום מהר יותר מאחרים","להרשים את הסטודנטים בכיתה"],e:"אם קשה לי יותר, ״מגיע לי״ לקצר דרך."}]},
q39:{t:"t8",v:[

};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);

  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">

     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">

      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>

      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
