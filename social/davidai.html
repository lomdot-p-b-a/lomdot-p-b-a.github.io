<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>

 {id:"t1",icon:"cycle",title:"רוח נגדית ורוח גבית",blocks:[
  {h:"תקציר",html:`<p>שבעה מחקרים מראים <mark>הטיית זמינות</mark> ${E("Availability bias")} בהערכה של הברכות שנהנינו מהן ושל המכשולים שעמדו בפנינו. <b>מכשולים</b> מושכים תשומת לב כי צריך להתגבר עליהם. <b>ברכות ומשאבים</b> אפשר פשוט ליהנות מהם ולהתעלם מהם.</p>${tiles([["building","פוליטיקה (1)","דמוקרטים ורפובליקנים טוענים שהמפה הפוליטית נגדם"],["target","ספורט (2)","אוהדי פוטבול שמים לב במיוחד למשחקים הקשים בלוח של הקבוצה"],["people","משפחה (3)","אנשים חושבים שההורים היו קשוחים איתם יותר ממה שהאחים מוכנים להודות"],["grad","אקדמיה (7)","אנשי אקדמיה חושבים שלתחום שלהם קשה יותר מול שופטים, ועדות מענקים וקביעות"]])}${def("מה המחקרים מראים",`האפקט נובע מ<b>זמינות</b> גבוהה יותר של הקשיים (מחקרים 4 ו-5), ולא רק מ<b>ניהול ייחוס</b> לטובת העצמי (6 ו-7). הבלטת הרוחות הנגדיות גורמת לתחושה של יחס <b>לא הוגן</b>, ולנכונות גדולה יותר לקבל התנהגות לא אתית (מחקר 7).`)}`,q:"q1"},

  {h:"מחקר 4: מה עולה לראש",html:`<p>83 משתתפים עם אח אחד התבקשו <b>לכתוב אירועים</b> שבהם ההורים התייחסו אליהם ואל האח באופן שונה, לטובתם או לרעתם. אחר כך ענו על 8 שאלות על <b>המשפחה שלהם</b> (1 = אני, 9 = האח).</p>${tiles([["x","1.36 אירועים","שבהם התייחסו אליהם בחומרה רבה יותר"],["check","0.44 אירועים","שבהם התייחסו אליהם בקלות רבה יותר"],["target","79% מול 21%","האירוע הראשון שנכתב היה על רוח נגדית ב-79% מהמקרים"]])}${def("הקשר לשיפוט",`המשתתפים חשבו שההורים <b>החמירו איתם</b> והקלו עם האח. וככל שהרוחות הנגדיות היו <b>זמינות יותר</b> (יותר אירועים קשים מקלים), כך הם חשבו יותר שההורים היו קשים איתם וקלים עם האח.`)}`,q:"q21"}
 ]},
 {id:"t5",icon:"doc",title:"מחקר 5: עבודה קשה זוכרים",blocks:[
  {h:"השראה: טברסקי וכהנמן",html:`${def("Tversky & Kahneman (1973)",`השמיעו רשימת שמות של גברים ונשים. כשהגברים ברשימה היו <b>מפורסמים יותר</b>, המשתתפים העריכו (בטעות) שהיו בה יותר גברים, ולהפך. השמות המפורסמים נזכרו בקלות, ו<b>הזמינות</b> שלהם עיוותה את ההערכה.`)}<p>באותו היגיון, החוקרים יצרו משימה שבה חלק מהסבבים <b>קשים</b> וחלק <b>קלים</b>, ושאלו כמה סבבים היו מכל סוג.</p>`,q:"q23"},
  {h:"הניסוי והתוצאה",html:`<p>100 משתתפים שיחקו מתמחים במגזין ועברו על <b>24 משפטים</b>, בכחול או בירוק. בצבע אחד רק לוחצים "המשך" (קל), ובצבע השני <b>סופרים את התנועות</b> במשפט (קשה). מספר המשפטים מכל צבע היה <b>שווה</b>.</p>${fig("study5","הם העריכו שהיו יותר משפטים בצבע של המשימה הקשה")}${rem("המשימה הקשה (הרוח הנגדית) דרשה יותר מאמץ וקשב, ולכן עיוותה את ההערכה. ואין כאן סיבה מוטיבציונית לעוות: הדרך הכי טובה להיראות טוב הייתה פשוט להעריך נכון.")}`,q:"q25"}
 ]},
 {id:"t6",icon:"question",title:"מחקר 6: חכם יותר מסטודנט בליגת הקיסוס?",blocks:[
  {h:"למה עוד מחקר",html:`<p>האם בכורים <b>באמת</b> מאמינים שהיה להם קשה יותר, או שהטענה רק גורמת להם להרגיש טוב? שני ההסברים לא סותרים, אבל חשוב להראות את ההטיה גם במקום שבו <mark>ניהול ייחוס</mark> ${E("Attribution management")} או <b>הכשלה עצמית</b> ${E("Self-handicapping")} כמעט לא רלוונטיים.</p>${rem("גם במחקר 2 זה פחות מתאים: אוהדים מגזימים בחסרונות בדרך כלל לקראת משחק, ולא בפוסטים אנונימיים חודשים לפני העונה. ובמחקר 5 לא היה בכלל \"ביצוע\" שמישהו מדרג.")}`,q:"q27"},
  {h:"תחרות טריוויה",html:`<p>52 סטודנטים מקורנל הגיעו בזוגות לתחרות טריוויה. כל אחד ראה <b>שתי רשימות</b>: 10 קטגוריות שלו ו-10 של היריב. בכל רשימה 5 <b>קלות</b> (ידוענים, סיטקומים) ו-5 <b>קשות</b> (מוזיקה בארוקית, ספרות רוסית). אחרי מטלה מסיחה נבדק <b>הזיכרון</b>: שליפה חופשית (עם פרס למי שזוכר הכי הרבה) ואז זיהוי.</p>${fig("study6","מהרשימה של היריב נזכרו בעיקר הקטגוריות הקלות")}${def("התוצאה",`מהרשימה <b>שלהם</b> נזכרו בערך באותה מידה קלות וקשות. מהרשימה של <b>היריב</b> נזכרו הרבה יותר <b>קלות</b>. 70% זכרו יותר קטגוריות קשות מהרשימה שלהם מאשר מזו של היריב, לעומת 53% בלבד שזכרו יותר קלות.`)}`,q:"q29"},
  {h:"טעויות וזיהוי",html:`<p>גם ה<b>טעויות</b> הטו לטובת הרוחות הנגדיות: יותר "לזכור" קטגוריה קשה של היריב כשלי, או קלה שלי כשל היריב (0.43 טעויות), מאשר טעויות לטובתם (0.15). 36% עשו לפחות טעות אחת לרעתם, לעומת 15% שעשו טעות לטובתם.</p>${tiles([["check","זיהוי","גם במבחן הזיהוי: אותו מספר קלות וקשות מהרשימה שלי, ויותר קלות מזו של היריב"],["brain","המסקנה","המשתתפים לא רק <b>טענו</b> שהתחרות לא הוגנת, הם <b>זכרו</b> אותה כקשה יותר ממה שהייתה"]])}${rem("הערה: קטגוריות קלות קל יותר לזכור באופן כללי (נבדק במדגם נפרד). אז העובדה שזכרו את הקשות שלהם באותה מידה כמו הקלות מראה כמה תשומת לב נתנו להן.")}`,q:"q31"}
 ]},
 {id:"t7",icon:"scales",title:"מחקר 7: לרואי חשבון יש פרצות",blocks:[
  {h:"השאלה והמדגם",html:`<p>בחשבונאות יש סגל <b>ניסויי</b> וסגל <b>לא ניסויי</b>. האם כל קבוצה חושבת שלה קשה יותר? והאם ההרגשה הזו מובילה ל<b>קבלה של התנהגות לא אתית</b> כדי "לאזן את המאזניים"?</p>${rem("למה זה חשוב? (1) זה מראה <b>מחיר</b> של ההטיה. (2) הסבר של הכשלה עצמית מנבא מה אנשים <b>יגידו</b> על המכשולים, אבל לא מנבא נכונות לקבל התנהגות לא אתית. כך זה מפריד בין ההסברים.")}<p>נשלח סקר ל-800 אנשי סגל מחמש מדינות בארה"ב. השתתפו <b>101</b>, ונותחו 100: 21 ניסויים ו-79 לא ניסויים.</p>`,q:"q33"},
  {h:"מי חושב שקשה לו",html:`${accTable}<p>באופן כללי כולם חשבו שלניסויים קשה יותר (תחום צעיר). אבל <b>הניסויים</b> חשבו שקשה להם יותר <b>באופן מובהק</b> (4.64), ו<b>הלא ניסויים</b> חשבו שזה <b>שווה</b> (4.10). ההבדל ביניהם מובהק.</p>`,q:"q35"},
  {h:"גמישות מוסרית",html:`<p>נמדדה <mark>גמישות מוסרית</mark>: הסכמה עם 9 משפטים על <b>פרקטיקות מחקר מפוקפקות</b>, למשל "מותר לפרסם את אותה עבודה פעמיים אם כתבי העת שונים מספיק" או "אין בעיה בגניבה עצמית כי היא לא מזיקה".</p>${def("התוצאה",`לא היה הבדל כללי בין הקבוצות, וגם לא השפעה ישירה של תחושת הקושי. אבל ה<b>אינטראקציה</b> הייתה מובהקת: אנשים קיבלו פרקטיקות מפוקפקות <b>בדיוק ביחס</b> למידה שבה חשבו שהרוחות הנגדיות שלהם חזקות משל אחרים.`)}${rem("אצל הלא ניסויים: ככל שחשבו שלהם קשה יותר, קיבלו יותר (קרוב למובהקות). אצל הניסויים: אותו כיוון, לא מובהק.")}`,q:"q37"}
 ]},
 {id:"t8",icon:"bulb",title:"דיון: מה ההטיה עושה לנו",blocks:[
  {h:"\"הרע זמין יותר מהטוב\"",html:`<p>ההטיה קשורה ל<b>הטיית השליליות</b> ("הרע חזק מהטוב"), אבל שונה ממנה. סקירות קודמות מצאו עדויות <b>חלשות</b> להטיה שלילית בזיכרון, ואפילו הטיה <b>חיובית</b> בזיכרון.</p>${def("החידוש",`החוקרים מזהים <b>סוג מסוים</b> של מידע שלילי, המכשולים, שבולט במיוחד, נשאר זמין ומשפיע על השיפוט. במקום \"הרע חזק מהטוב\": <mark>"הרע זמין יותר מהטוב"</mark>.`)}<p>הרבה דיונים בהטיית השליליות מבוססים על הסברים <b>אבולוציוניים</b> רחוקים (עם סכנה צריך להתמודד מיד). לפי החוקרים, צריך להשלים אותם בהסברים <b>קרובים</b> שמתארים את התהליכים הנפשיים המדויקים.</p>${rem("ההסבר כאן לא תלוי ב<b>אבחנתיות</b> של המידע (כמה הוא מלמד על משהו). עונש מההורים לא מלמד על הילדות יותר משבח. אבל עונש וקושי הם מכשולים שצריך להתגבר עליהם, ולכן הם בולטים.")}`,q:"q39"},
  {h:"הכרת תודה וטינה",html:`<p>ההטיה מצטרפת ל"אויבים" מוכרים של הכרת תודה: הסתגלות, חמדנות, יוהרה, והתחושה שהעול של כולם כבד במיוחד עליי.</p>${ex("פיט טאונסנד מלהקת The Who מאמין שהיה מצליח באותה מידה גם בלי הלהקה. אולי, אבל זה מתעלם מהיתרון של מתופף פופולרי, זמר ייחודי ומנהלים שאפתניים.")}${def("הון חברתי",`DiTomaso (2013): כשאנשים סיפרו את סיפור חייהם, רק אחרי שאלות ממוקדות התברר מי עזר להם. גם מי שקיבל עבודה בזכות קשרים חשב שעשה הכול לבד, והזכיר את העבודה הקשה בקולג' ולא את שכר הלימוד ששילמו ההורים.`)}`,q:"q41"},
  {h:"מדיניות יהירה",html:`<p>גם קובעי מדיניות מתעלמים מהרוחות הגביות של המדינות שלהם, ומנסים \"לייצא\" שיטות למקומות שבהם הן פחות יצליחו.</p>${tiles([["chart","\"טיפול בהלם\" ברוסיה","הפרטה וליברליזציה אחרי פירוק ברית המועצות, בלי המוסדות שמאפשרים לקפיטליזם לעבוד (בתי משפט, רגולציה, חברה אזרחית)"],["building","עיראק 2003","הניסיון ליצור \"דמוקרטיה לדוגמה\" התעלם מהיתרונות של היסטוריה, מנהגים וגאוגרפיה"],["factory","\"We Built It\"","סיסמת רומני ב-2012. הרוחות הגביות של עסקים (ביטחון, תשתיות, כוח עבודה משכיל) קשות לראות, והרוחות הנגדיות (מסים, רגולציה) בולטות"]])}${rem("הטיה זו עלולה גם להחריף את השיח הציבורי על מסים, רגולציה ורשת ביטחון סוציאלית, כי קל להתעלם מהמכשולים הנסתרים של העניים.")}`,q:"q43"},
  {h:"מתי כן רואים רוח גבית",html:`<p>יש רוחות גביות שכן שמים לב אליהן, ובעיקר <b>אנשים</b>: מנטורים, חברים שעודדו, קרובים שעזרו כלכלית. אנשים מזכירים אנשים כרוח גבית הרבה יותר מאשר כרוח נגדית.</p>${tiles([["people","שומרי חשבון חברתיים","אנשים עוקבים בקפידה אחרי איך מתייחסים אליהם. מי שלא מכיר תודה מסתכן במוניטין של כפוי טובה"],["lock","פער מידע הפוך","מי שמכשיל אחרים מסתיר את עקבותיו, אבל מי שעוזר לא מסתיר. לכן עזרה חברתית בולטת יותר"]])}${def("סוג אחר",`רוחות גביות חברתיות הן בדרך כלל דברים ש<b>הכניסו אותי למסלול</b> ("בלי הקורס שלה לא הייתי בתחום"). רוחות נגדיות הן דברים ש<b>מעכבים התקדמות</b> במסלול ("אם החברה לא הייתה מעדיפה אחרים...").`)}`,q:"q45"},
  {h:"סיכום",html:`${ex("השחקן רוב לואו התלונן על \"הטיה ודעה קדומה\" נגד אנשים נאים בהוליווד. נראה שהוא לא מעריך עד כמה המראה עזר לקריירה שלו.")}${def("המסקנה",`זה לא יוהרה יוצאת דופן: <b>לכולנו</b> קל להיות עיוורים לברכות ולזכור את העול. ההטיה נובעת מתהליכים קוגניטיביים בסיסיים. ברכות אפשר ליהנות מהן בלי לשים לב. מכשולים צריך לעבור, ולכן הם תמיד, מילולית ובהשאלה, <mark>"בפרצוף שלנו"</mark>.`)}`,q:"q47"}
 ]}
];

 {q:"למה התחושה שהיה לי קשה יותר נראית כמו \"עובדה\"?",a:"כי הקשיים שלי עולים לראש הרבה יותר בקלות",w:["כי זו באמת עובדה תמיד","כי אחרים מסכימים איתי","כי אני זוכר הכול בדיוק"],e:"זו ההקבלה לרוס וסיקולי."}]},
q7:{t:"t2",v:[
 {q:"מהי סיבת \"הקידוד העמוק\" לזמינות המכשולים?",a:"מכשולים דורשים תשומת לב כדי להתגבר עליהם, ולכן נשמרים עמוק יותר בזיכרון",w:["מכשולים חוזרים כל יום","מכשולים מצחיקים","אחרים מספרים לנו עליהם"],e:"כמו כותב שחייב להתייחס לביקורת בתיקון."},
 {q:"מה מדגים המטייל שחושב שבמסלול יש יותר עליות מירידות?",a:"פער מידע: מבלים יותר זמן בעלייה מאשר בירידה",w:["מוטיבציה לשיפור העצמי","הטיית אישור","טעות בחישוב המרחק"],e:"גם אם האורך של העליות והירידות שווה."}]},
q8:{t:"t2",v:[
 {q:"איך מוטיבציה יכולה להגביר את ההתמקדות במכשולים?",a:"רוח נגדית חזקה היא תירוץ לכישלון ומגדילה את ההצלחה",w:["היא תמיד מקטינה את ההתמקדות","היא גורמת לשכוח מכשולים","אין קשר"],e:"זה ניהול ייחוס לטובת העצמי."},
 {q:"איזו מסיבות רוס וסיקולי כנראה פחות מתאימה כאן?",a:"שליפה דיפרנציאלית",w:["קידוד עמוק","פער מידע","מוטיבציה"],e:"לא ברור שאנשים מתחילים מ\"על מה התגברתי\"."}]},
q9:{t:"t2",v:[
 {q:"למה נטיות כמו ביטחון יתר ואופטימיות מחזקות דווקא את הממצאים?",a:"כי הן פועלות נגד התחזית, ולכן הופעת ההטיה השלילית מעידה על עוצמתה",w:["כי הן זהות להטיה","כי הן מסבירות את כל הממצאים","כי הן לא קיימות"],e:"גישה מוטיבציונית יכולה לנבא גם את ההפך."},
 {q:"מה ההבדל בין ההסבר של המאמר להטיית השליליות?",a:"המאמר עוסק בזמינות שונה של מכשולים, ולא רק בהשפעה חזקה יותר שלהם",w:["אין הבדל","המאמר טוען שהטוב חזק מהרע","הטיית השליליות עוסקת רק בזיכרון"],e:"\"הרע זמין יותר מהטוב\"."}]},
q10:{t:"t2",v:[
 {q:"האם החוקרים טוענים שמניעים של שיפור העצמי לא משפיעים כלל?",a:"לא, אבל הם תכננו מחקרים שמפרידים בין ההסברים",w:["כן, אין להם שום השפעה","כן, הם הוכיחו זאת","הם לא דנו בזה"],e:"בדומה לרוס וסיקולי."},
 {q:"איזה מהבאים לא מוזכר כנטייה שפועלת נגד התחזית של החוקרים?",a:"הטיית הזמינות",w:["ביטחון יתר","אופטימיות לא מציאותית","הערכה עצמית מנופחת"],e:"הטיית הזמינות היא ההסבר של החוקרים."}]},
q11:{t:"t2",v:[
 {q:"מה ההבדל בין קנאה מיטיבה לקנאה ממאירה?",a:"מיטיבה: לשאוף להשיג; ממאירה: לקחת או להרוס את ההישגים של האחר",w:["אין הבדל","מיטיבה: להרוס; ממאירה: לשאוף","שתיהן מובילות להכרת תודה"],e:"ממאירה סבירה יותר כשנראה שהאחר הרוויח בדרך לא הוגנת."},
 {q:"מה הקשר בין ההטיה להכרת תודה?",a:"קל לזכור את הקשיים וקשה להעריך את הברכות, ולכן קשה להרגיש תודה באופן קבוע",w:["ההטיה מגבירה הכרת תודה","אין קשר","הכרת תודה גורמת להטיה"],e:"וגם לחסר בחמלה כלפי אחרים."}]},
q12:{t:"t2",v:[
 {q:"איזו השפעה של הכרת תודה לא מוזכרת במאמר?",a:"שיפור בזיכרון לטווח קצר",w:["אושר","בריאות","טוב לב כלפי אחרים"],e:"וגם הערכה גדולה יותר של בני הזוג."},
 {q:"מה עלולה ליצור התחושה שהתמודדתי עם רוחות נגדיות חזקות?",a:"תחושת זכאות ופיתוי לקצר דרך או לנהוג באופן לא אתי",w:["ענווה","שיתוף פעולה","הכרת תודה"],e:"(Tamborski et al., 2012)."}]},
q13:{t:"t3",v:[
 {q:"מה מצא מחקר 1 לגבי דמוקרטים ורפובליקנים?",a:"כל צד חשב שהמערכת הפוליטית פועלת נגדו",w:["שניהם חשבו שהמערכת הוגנת","שניהם חשבו שהמערכת נגד הדמוקרטים","רק הדמוקרטים חשבו שזה לא הוגן"],e:"4.75 לדמוקרטים, 3.42 לרפובליקנים."},
 {q:"מה חשבו המשתתפים המתונים במחקר 1?",a:"שהמערכת שווה לשני הצדדים",w:["שהיא נגד הדמוקרטים","שהיא נגד הרפובליקנים","הם לא נשאלו"],e:"ממוצע 4.04."}]},
q14:{t:"t3",v:[
 {q:"על אילו שלושה נושאים נשאלו המשתתפים במחקר 1?",a:"מכללת הבוחרים, גיוס כספים לקמפיין ושיתוף פעולה מהקונגרס",w:["מסים, חינוך ובריאות","מלחמה, שלום וכלכלה","תקשורת, רשתות וסקרים"],e:"בסולם 1 עד 7."},
 {q:"במחקר 1, מה משמעות ציון 7?",a:"קשה יותר לדמוקרטים",w:["קשה יותר לרפובליקנים","שווה לשניהם","אין דעה"],e:"1 = קשה יותר לרפובליקנים, 4 = שווה."}]},
q15:{t:"t3",v:[
 {q:"מה מנבא הסבר של זמינות לגבי מעורבות פוליטית?",a:"מי שמתעניין יותר יראה הטיה חזקה יותר",w:["מי שמתעניין יותר יראה פחות הטיה","אין קשר","רק מי שלא מתעניין מוטה"],e:"כי הוא נחשף ליותר דוגמאות."},
 {q:"מה נמצא אצל משתתפים עם ידע פוליטי נמוך?",a:"לא היה הבדל מובהק בין ליברלים לשמרנים",w:["הבדל גדול מאוד","כולם חשבו שהמערכת נגדם","הם לא השתתפו"],e:"ההבדל הופיע אצל בעלי ידע גבוה (5.05 מול 3.44)."}]},
q17:{t:"t3",v:[
 {q:"למה נערך מחקר 2 על אוהדי פוטבול?",a:"כדי לבדוק אם ההטיה מופיעה גם בלי בקשה מפורשת להשוות",w:["כדי לבדוק אהדה לספורט","כי מחקר 1 נכשל","כדי לבדוק נאמנות לקבוצה"],e:"במחקר 1 ביקשו מפורשות להשוות."},
 {q:"כמה מהפוסטים של האוהדים התמקדו בעיקר בקשיים, וכמה בדברים המעודדים?",a:"41% בקשיים ו-21% בדברים המעודדים",w:["21% בקשיים ו-41% במעודדים","50% ו-50%","90% בקשיים"],e:"כמעט פי שניים."}]},
q18:{t:"t3",v:[
 {q:"האם רק אוהדי קבוצות חלשות התלוננו על הלוח?",a:"לא, גם אוהדי קבוצות מצליחות התמקדו יותר בחסרונות",w:["כן, רק הם","כן, רק אוהדי האלופה","לא נבדק"],e:"לא היה קשר למאזן העונה הקודמת."},
 {q:"איך נאספו הנתונים במחקר 2?",a:"פוסטים של אוהדים בפורום אחרי פרסום לוח המשחקים, שקודדו על ידי מקודדים שלא ידעו את ההשערה",w:["ניסוי במעבדה","ראיונות עם שחקנים","שאלון לאוהדים באצטדיון"],e:"124 פוסטים מקוריים."}]},
q19:{t:"t4",v:[
 {q:"מה מצא מחקר 3 לגבי בכורים וצעירים?",a:"הבכורים חשבו שההורים קשוחים איתם הרבה יותר ממה שהצעירים מוכנים להודות",w:["הצעירים חשבו שקשה להם יותר","אין הבדל בין הקבוצות","כולם חשבו שההורים שוויוניים"],e:"80% מהבכורים לעומת 47% מהצעירים."},
 {q:"כמה מהבכורים וכמה מהצעירים חשבו שההורים מקלים יותר עם הצעיר?",a:"92% מהבכורים ו-71% מהצעירים",w:["50% ו-50%","71% מהבכורים ו-92% מהצעירים","100% מכולם"],e:"שתי הקבוצות הסכימו, אבל במידה שונה."}]},
q20:{t:"t4",v:[
 {q:"באיזו שאלת \"רוח נגדית\" לא נמצא הבדל במחקר 3?",a:"את מי ההורים נוטים להתעלם יותר",w:["את מי מענישים","למי מטיפים","ממי מצפים לסטנדרט גבוה"],e:"בשלוש האחרות נמצא הבדל."},
 {q:"איזה קריטריון השתתפות היה במחקרים 3 ו-4?",a:"שיש למשתתף אח אחד בלבד",w:["שהוא בן יחיד","שיש לו לפחות שלושה אחים","שהוא הורה"],e:"כדי להשוות בכור וצעיר."}]},
q21:{t:"t4",v:[
 {q:"כמה אירועים של יחס מחמיר ושל יחס מקל כתבו המשתתפים בממוצע במחקר 4?",a:"1.36 מחמיר מול 0.44 מקל",w:["0.44 מחמיר מול 1.36 מקל","שווה","3 מכל סוג"],e:"הרוחות הנגדיות זמינות יותר."},
 {q:"על מה היה האירוע הראשון שהמשתתפים כתבו ב-79% מהמקרים?",a:"על מקרה שבו היה להם קשה יותר מהאח",w:["על מקרה שבו היה להם קל יותר","על מקרה ניטרלי","על ההורים בלבד"],e:"רק 21% כתבו קודם על רוח גבית."}]},
q22:{t:"t4",v:[
 {q:"מה הקשר שנמצא במחקר 4 בין זמינות האירועים לשיפוט?",a:"ככל שהרוחות הנגדיות זמינות יותר, כך חשבו יותר שההורים קשים איתם וקלים עם האח",w:["אין קשר","ככל שזמינות יותר, חשבו שההורים שוויוניים","קשר רק אצל בכורים"],e:"זו עדות ישירה להסבר הזמינות."},
 {q:"מה החידוש של מחקר 4 לעומת מחקר 3?",a:"שאלו על המשפחה של המשתתף עצמו, ובדקו ישירות מה עולה לראש",w:["שאלו על משפחות אחרות","בדקו רק הורים","לא שאלו שאלות"],e:"שתי מטרות: לבדוק זמינות ולשאול על החוויה האישית."}]},
q23:{t:"t5",v:[
 {q:"מה מצאו טברסקי וכהנמן (1973) ברשימת השמות?",a:"כשהגברים היו מפורסמים יותר, העריכו שהיו יותר גברים, ולהפך",w:["אנשים זוכרים רק שמות של נשים","אנשים מעריכים נכון תמיד","מפורסמים נשכחים מהר"],e:"הזמינות עיוותה את ההערכה."},
 {q:"מה הקשר בין מחקר 5 למחקר של טברסקי וכהנמן?",a:"בשניהם מה שזמין יותר בזיכרון מוביל להערכת יתר של השכיחות שלו",w:["שניהם עוסקים בפוליטיקה","שניהם עוסקים באחים","אין קשר"],e:"היוריסטיקת הזמינות."}]},
q25:{t:"t5",v:[
 {q:"מה העריכו המשתתפים במחקר 5?",a:"שהיו יותר משפטים בצבע של המשימה הקשה (כ-56%), למרות שבפועל היו 50%",w:["שהיו פחות משפטים בצבע הקשה","הערכה מדויקת של 50%","שכל המשפטים היו בצבע אחד"],e:"בשני התנאים, כחול וירוק."},
 {q:"למה קשה להסביר את מחקר 5 בניהול ייחוס?",a:"כי לא היה \"ביצוע\" שמדורג, והדרך הכי טובה להיראות טוב הייתה להעריך נכון",w:["כי המשתתפים קיבלו פרס","כי היו רק 10 משתתפים","כי המשימה הייתה קלה מדי"],e:"אין סיבה מוטיבציונית לעוות."}]},
q26:{t:"t5",v:[
 {q:"מה הייתה המשימה הקשה במחקר 5?",a:"לספור את התנועות במשפט",w:["לתרגם את המשפט","לזכור את המשפט","לכתוב משפט חדש"],e:"המשימה הקלה: ללחוץ \"המשך\"."},
 {q:"כמה משפטים היו בכל צבע במחקר 5?",a:"מספר שווה, כלומר 50% מכל צבע",w:["יותר משפטים קשים","יותר משפטים קלים","רק משפטים קשים"],e:"ובכל זאת העריכו יותר משפטים קשים."}]},
q27:{t:"t6",v:[
 {q:"מה המטרה של מחקר 6?",a:"להראות את ההטיה במצב שבו ניהול ייחוס או הכשלה עצמית כמעט לא רלוונטיים",w:["לבדוק ידע כללי של סטודנטים","לבדוק אחים","לבדוק פוליטיקה"],e:"להפריד בין ההסברים."},
 {q:"מהי \"הכשלה עצמית\"?",a:"יצירה או הדגשה של מכשולים שמספקים תירוץ לכישלון ומגדילים הצלחה",w:["כישלון מכוון בכל משימה","הכרת תודה","הערכה עצמית מדויקת"],e:"זה ההסבר החלופי שהחוקרים רצו לשלול."}]},
q29:{t:"t6",v:[
 {q:"מה נמצא במחקר 6 לגבי הקטגוריות שנזכרו מהרשימה של היריב?",a:"נזכרו הרבה יותר קטגוריות קלות מקשות",w:["נזכרו יותר קשות","נזכרו באותה מידה","לא נזכר כלום"],e:"1.68 קלות מול 1.13 קשות."},
 {q:"כמה מהמשתתפים זכרו יותר קטגוריות קשות מהרשימה שלהם מאשר מהרשימה של היריב?",a:"70%",w:["53%","15%","100%"],e:"לעומת 53% בלבד שזכרו יותר קלות משלהם."}]},
q30:{t:"t6",v:[
 {q:"איך נבדק הזיכרון במחקר 6?",a:"שליפה חופשית עם פרס למי שזוכר הכי הרבה, ואחר כך מבחן זיהוי",w:["שאלון על התחושות","רק מבחן זיהוי","שאלו את היריב"],e:"התמריץ עודד דיווח מדויק."},
 {q:"מה מבדיל את מחקר 6 מסתם טענה שהתחרות לא הוגנת?",a:"ההטיה הופיעה בזיכרון עצמו, לא רק במה שאנשים אמרו",w:["המשתתפים לא דיברו","המשתתפים ניצחו","התחרות הייתה הוגנת"],e:"זה קשה להסביר בניהול ייחוס פשוט."}]},
q31:{t:"t6",v:[
 {q:"איזו טעות זיכרון עשו המשתתפים יותר?",a:"לייחס לעצמם קטגוריה קשה של היריב, או ליריב קטגוריה קלה שלהם",w:["לייחס לעצמם קטגוריה קלה של היריב","לא היו טעויות","לשכוח את כל הקטגוריות"],e:"0.43 טעויות לרעתם מול 0.15 לטובתם."},
 {q:"למה העובדה שזכרו את הקטגוריות הקשות שלהם כמו את הקלות משמעותית?",a:"כי קטגוריות קלות בדרך כלל קל יותר לזכור, ולכן זה מראה כמה תשומת לב נתנו לקשות",w:["כי הקשות קלות יותר לזכירה","כי זה מקרי","כי הם בחרו אותן"],e:"נבדק במדגם נפרד."}]},
q32:{t:"t6",v:[
 {q:"כמה מהמשתתפים עשו לפחות טעות אחת לרעתם?",a:"36%, לעומת 15% שעשו טעות לטובתם",w:["15%, לעומת 36%","100%","אף אחד"],e:"הטעויות הטו לטובת הרוחות הנגדיות."},
 {q:"מה מצא מבחן הזיהוי במחקר 6?",a:"אותו מספר קלות וקשות מהרשימה שלי, ויותר קלות מהרשימה של היריב",w:["יותר קשות מהרשימה של היריב","לא היה הבדל בכלל","הזיהוי לא נבדק"],e:"דפוס דומה לשליפה."}]},
q33:{t:"t7",v:[
 {q:"למה מחקר 7 עוזר להפריד בין הסבר הזמינות להכשלה עצמית?",a:"כי הכשלה עצמית לא מנבאת נכונות לקבל התנהגות לא אתית",w:["כי הוא נעשה על סטודנטים","כי הוא ניסוי במעבדה","כי אין בו שאלון"],e:"והוא גם מראה מחיר של ההטיה."},

for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  if(blk.q)slot.appendChild(qCard(blk.q,next,"בדיקה קצרה"));
  else{const b=document.createElement("button");b.className="primary";b.textContent="המשך";b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
