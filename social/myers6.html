const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

  {h:"תמר והקמפיין",html:`${def("על מה הנושא",`מהו שכנוע, ובאילו שני מסלולים הוא פועל.<br><b>מה נלמד כאן:</b> תמר · שכנוע · חינוך או תעמולה · אבני הנגף · מסלול מרכזי והיקפי`)}${ex("<b>תמר</b> (דמות בדויה להמחשה) סטודנטית שמובילה קמפיין נגד עישון בקמפוס. נלווה אותה בכל שלב: מי יעביר את המסר, מה הוא יגיד, באיזה ערוץ, ולמי.")}${def("שכנוע",`${E("Persuasion")} התהליך שבו מסר מחולל שינוי באמונות, בעמדות או בהתנהגות.`)}<p>שכנוע אינו טוב או רע מיסודו. גבלס ושטרייכר הפיצו תעמולה נאצית; קמפיינים לבריאות הורידו עישון בארה״ב ל־21%. אנחנו נוטים לקרוא לשכנוע ״<b>חינוך</b>״ כשאנחנו מסכימים איתו ו״<b>תעמולה</b>״ כשלא.</p><p><b>הובלנד</b> חקר במלחמת העולם השנייה ואחריה ארבעה מרכיבים: <b>מקור, מסר, ערוץ, קהל</b>. <b>מגווייר</b>: מסר צריך לעבור משוכות: קשב, הבנה, אמונה, זכירה ופעולה.</p>`,q:"q1"},
  {h:"מרכזי והיקפי",html:`${fig("elm47","פטי וקסיופו (וגם איגלי וצ׳ייקן): הבחירה במסלול תלויה במוטיבציה וביכולת לחשוב.")}${def("מסלול מרכזי",`${E("Central route")} כשיש <b>עניין</b> ויכולת, מתמקדים ב<b>טיעונים</b>. טיעון חזק משכנע; טיעון חלש מעורר טיעוני נגד.`)}${def("מסלול היקפי",`${E("Peripheral route")} כשאין עניין או שהדעת מוסחת, מגיבים ל<b>רמזים</b>: מקור מושך, מומחה, מסר מוכר. מוזיקה גרמנית ברקע מוכרת יין גרמני.`)}${rem("המסלול המרכזי יוצר שינוי <b>עמיד</b> יותר שמשפיע על <b>התנהגות</b>. מה שמשכנע הוא לא הטיעון עצמו אלא <b>המחשבות</b> שהוא מעורר.")}`,q:"q3"},
  {h:"התאמת המסלול",html:`<p>פרסומות למחשבים בכתבי עת מציגות מפרט ומחיר (מרכזי). פרסומות למשקאות מציגות זוהר ודובי קוטב (היקפי). מאיירס הצביע במשאל מקומי לפי מי שתומך, כי לא היה לו זמן לעיין: ״על חברים ומומחים אפשר לסמוך״.</p>${ex("לסטודנטים לרפואה שמעוניינים בנושא, תמר תציג נתונים ומחקרים. לסטודנטים שעוברים במסדרון בדרך לשיעור, היא תשתמש בשלט קצר עם דמות אהודה.")}`,q:"q5"}
 ]},
 {id:"t2",icon:"id",title:"מי אומר: המקור",blocks:[
  {h:"אמינות והשפעה רדומה",html:`${def("על מה הנושא",`אילו תכונות של המקור הופכות מסר למשכנע.<br><b>מה נלמד כאן:</b> אמינות · השפעה רדומה · מומחיות · מהימנות · אטרקטיביות · דמיון`)}<p>אותו טיעון בפרלמנט ההולנדי שכנע יותר את חברי מפלגת הדובר. המקור משנה.</p>${def("אמינות",`${E("Credibility")} מקור שנתפס <b>מומחה</b> ו<b>ראוי לאמון</b>.`)}${def("השפעה רדומה",`${E("Sleeper effect")} מסר ממקור לא אמין נדחה בהתחלה, אבל משפיע <b>מאוחר יותר</b>, כי זוכרים את המסר ושוכחים את המקור. בדומה, השפעת מקור אמין דועכת אחרי כחודש.`)}`,q:"q7"},
  {h:"מומחיות ומהימנות",html:`<div class="tw"><table><tr><th>מה מגביר</th><th>דוגמה</th></tr><tr><td><b>מומחיות</b></td><td>״ד״ר ג׳יימס ראנדל מהאגודה לרפואת שיניים״ שכנע יותר מ״ג׳ים, תלמיד תיכון״</td></tr><tr><td><b>דיבור בטוח וישיר</b></td><td>עד ש״אמר ישר ׳עשרים דקות׳״ נתפס אמין יותר מעד מהסס</td></tr><tr><td><b>מבט ישיר</b></td><td>עדים שמישירים מבט נתפסים אמינים יותר</td></tr><tr><td><b>לא מנסה לשכנע</b></td><td>שיחה ״שנשמעה במקרה״ השפיעה יותר</td></tr><tr><td><b>נגד האינטרס שלו</b></td><td>פוליטיקאי עם רקע עסקי שתוקף חברה מזהמת</td></tr><tr><td><b>דיבור מהיר</b></td><td>190 מילים בדקה נתפסו אמינים יותר מ־110</td></tr></table></div>`,q:"q9"},
  {h:"אטרקטיביות ודמיון",html:`${def("אטרקטיביות",`${E("Attractiveness")} מקור שמוצא חן משכנע במיוחד ב<b>העדפות אישיות</b>. כולל משיכה פיזית, ו<b>דמיון</b> אלינו. אנשי מכירות מלמדים ״לחקות ולשקף״; דמות וירטואלית שחיקתה את הצופה שכנעה יותר.`)}<p>תלמידים שחורים צחצחו שיניים טוב יותר אחרי מסר מ<b>רופא שיניים שחור</b>.</p><div class="tw"><table><tr><th>נושא</th><th>מי משכנע יותר</th></tr><tr><td><b>סובייקטיבי</b> (טעם, ערכים: איזה קפה)</td><td>מקור <b>דומה</b> לנו</td></tr><tr><td><b>אובייקטיבי</b> (עובדות: איזה מחשב)</td><td>מקור <b>מומחה</b></td></tr></table></div>${ex("לסטודנטים, תמר תביא סטודנטית אהודה שהפסיקה לעשן. לשאלה ״כמה זה באמת מזיק״, היא תביא רופאה.")}`,q:"q11"}
 ]},
 {id:"t3",icon:"bulb",title:"מה נאמר: היגיון, הרגשה טובה ופחד",blocks:[
  {h:"היגיון או רגש",html:`${def("על מה הנושא",`איך תוכן המסר משפיע: פנייה להיגיון, לרגש, להרגשה טובה ולפחד.<br><b>מה נלמד כאן:</b> קהל אנליטי · מקור העמדה · בוטנים ומוזיקה · מסרים מאיימים`)}<p>התשובה: <b>תלוי בקהל</b>. משכילים ואנליטיים מגיבים יותר ל<b>היגיון</b>; חסרי עניין, לרגש. ב־2004 רבים הסכימו יותר עם קרי אבל <b>חיבבו</b> יותר את בוש, והצביעו לו.</p>${rem("עמדה שנוצרה מ<b>רגש</b> משתנה ממסר רגשי; עמדה שנוצרה מ<b>היגיון</b> משתנה מטיעונים.")}`,q:"q13"},
  {h:"הרגשה טובה",html:`<p><b>ג׳ניס</b>: סטודנטים שאכלו <b>בוטנים ושתו משקה</b> בזמן הקריאה השתכנעו יותר. שירים עם נגינת גיטרה שכנעו יותר ממילים בלבד.</p><p>במצב רוח <b>טוב</b> מחליטים מהר ונשענים על רמזים היקפיים. במצב רוח <b>רע</b> חושבים יותר, ולכן קשה לשכנע בטיעונים חלשים.</p>${rem("אם אין לכם טיעונים חזקים, כדאי לשפר את מצב הרוח של הקהל.")}`,q:"q15"},
  {h:"מסרים מאיימים",html:`<p>ככל שאנשים חשים <b>מפוחדים ופגיעים</b> יותר, הם נענים יותר. תמונות על חפיסות סיגריות בקנדה עבדו. פרסומת ״1,200 שקי גוויות״ הפחיתה עישון; ״חשוב, אל תעשן״ לא.</p><div class="tw"><table><tr><th>ממוגרפיה</th><th>נבדקו בתוך שנה</th></tr><tr><td>מסר חיובי (״יכולה להציל את חייך״)</td><td>כמחצית</td></tr><tr><td>מסר מאיים (״את עלולה למות״)</td><td>כשני שלישים</td></tr></table></div>${rem("אבל פחד בלי <b>דרך התמודדות</b> מוביל ל<b>הכחשה</b>. מסר מאיים יעיל כשאנשים מבינים גם <b>מה לעשות</b> וחושבים שהם <b>מסוגלים</b>.")}${ex("השלט של תמר יראה ריאות של מעשן, ומתחת: ״רוצה להפסיק? המרכז לבריאות בקמפוס, חדר 12, ללא תשלום״.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"scales",title:"פער, צדדים וסדר",blocks:[
  {h:"פער עמדות",html:`${def("על מה הנושא",`כמה רחוק מהקהל לעמוד, האם להציג את הצד השני, ומי צריך לדבר ראשון.<br><b>מה נלמד כאן:</b> פער ומהימנות · חד־צדדי ודו־צדדי · ראשונות ואחרונות`)}<p>פער גדול יוצר דיסוננס (שמניע שינוי), אבל גם גורם למקור להיראות לא אמין.</p>${def("ארונסון, טרנר וקרלסמית׳ (1963)",`כשהמשורר הנערץ <b>ת״ס אליוט</b> שיבח שיר שהנבדקים לא אהבו, פער גדול שינה דעה <b>יותר</b>. כשזו הייתה ״<b>אגנס סטרנס</b>״, סטודנטית, לא היה הבדל.`)}${rem("מקור <b>מהימן מאוד</b>: אפשר לעמוד בעמדה רחוקה. קהל <b>מעורב</b> בנושא מקבל רק טווח צר, ולכן פער מתון עדיף.")}`,q:"q19"},
  {h:"חד־צדדי או דו־צדדי",html:`<div class="tw"><table><tr><th>מסר</th><th>יעיל כשהקהל...</th></tr><tr><td><b>חד־צדדי</b></td><td>כבר <b>מסכים</b>, לא מכיר את טיעוני הנגד</td></tr><tr><td><b>דו־צדדי</b></td><td><b>מתנגד</b>, מכיר או ייחשף לטיעוני הנגד</td></tr></table></div><p><b>הובלנד</b>: חיילים שחשבו שהמלחמה ביפן תהיה קלה השתכנעו יותר ממסר <b>דו־צדדי</b>. בשלטי מחזור ביוטה, תוספת ״זה אולי לא נוח, אבל זה חשוב״ העלתה את המחזור ל־<b>80%</b>.</p>`,q:"q21"},
  {h:"ראשונות ואחרונות",html:`${fig("prim47","בדרך כלל המסר הראשון גובר. אם יש זמן בין המסרים וההחלטה סמוכה לשני, השני גובר.")}${def("אפקט הראשונות",`${E("Primacy effect")} המידע הראשון משפיע יותר. ״אינטליגנטי, חרוץ... קנאי״ נשפט חיובי יותר מאותו רצף הפוך (אש). מועמדים ראשונים בקלפי מקבלים יתרון. 62% בחרו את המסטיק הראשון.`)}${def("אפקט האחרונות",`${E("Recency effect")} פחות שכיח: קורה כשיש <b>מרווח זמן</b> בין המסרים, <b>וגם</b> מחליטים סמוך למסר השני (השכחה פועלת על הראשון).`)}`,q:"q23"}
 ]},
 {id:"t5",icon:"phone",title:"איך: הערוץ",blocks:[
  {h:"פעיל או סביל",html:`${def("על מה הנושא",`איך אופן העברת המסר משנה את השפעתו.<br><b>מה נלמד כאן:</b> קליטה סבילה · חזרה ושטף · השפעה אישית · זרימה דו־שלבית · כתב מול וידאו`)}${tiles([["x","דרשות בכנסייה","רק 10% נזכרו בדרשה נגד גזענות, ולא חל שינוי בעמדות"],["x","קמפיין ניקיון","לפני: 0 מ־180 הרימו אשפה. אחרי שבוע של שלטים: 2 מ־180"]])}<p>שני הניסיונות כשלו כי הקהל היה <b>סביל</b>. התנסות <b>פעילה</b> יוצרת עמדות עמידות: תכניות למניעת איידס שכוללות <b>תרגול</b> סירוב הן היעילות ביותר.</p>`,q:"q25"},
  {h:"חזרה, ומה שקל להגיד",html:`<p>ובכל זאת, מסרים סבילים כן עובדים לפעמים: אספירין מפורסם נמכר פי 3 ביוקר. עצם <b>החזרה</b> גורמת להאמין: עובדות טריוויה שנקראו שבוע קודם נשפטו נכונות יותר. שמועות כוזבות ב־2008 שרדו ניסיונות הפרכה, כי ההפרכה חזרה עליהן.</p><p>גם <b>חריזה</b> מעלה אמינות: ״חיפזון מוליד אסון״ נשמע נכון יותר מ״מהירות גורמת לתאונות״.</p>${rem("הכלל: השכנוע <b>פוחת</b> ככל שהנושא <b>חשוב ומוכר</b> יותר. קל להשפיע על בחירת אספירין; קשה על עמדה כלפי מלחמה.")}`,q:"q27"},
  {h:"אישי, תקשורתי, כתוב",html:`<div class="tw"><table><tr><th>מחקר</th><th>תקשורת בלבד</th><th>דואר</th><th>אישי</th></tr><tr><td>אן ארבור: הצבעה בעד תיקון</td><td>19%</td><td>45%</td><td><b>75%</b></td></tr></table></div><p>במחקר הלב בקליפורניה: טרייסי (ביקורת) הפחיתה סיכון ב־8%, גילרוי (תקשורת) ב־20%, ווטסונוויל (תקשורת + מפגשים אישיים) בכ־<b>30%</b>.</p>${def("זרימה דו־שלבית",`${E("Two-step flow")} <b>כ״ץ</b>: מתקשורת ההמונים ל<b>מנהיגי דעה</b>, ומהם לשאר. רופאים בוחרים תרופות לפי עמיתים מומחים.`)}<p><b>כתב או וידאו?</b> מסר <b>פשוט</b> משכנע ביותר בווידאו; מסר <b>מורכב</b>, בכתב, כי אפשר לקרוא בקצב שלך.</p>`,q:"q29"}
 ]},
 {id:"t6",icon:"people",title:"למי: הקהל",blocks:[
  {h:"גיל",html:`${def("על מה הנושא",`מאפייני הקהל: גיל, אזהרה מראש, הסחה וצורך בקוגניציה.<br><b>מה נלמד כאן:</b> הסבר בין־דורי · שנים מעצבות · בנינגטון · אזהרה · הסחה · צורך בקוגניציה`)}<p>הבדלי עמדות בין גילים: <b>מחזור חיים</b> (נעשים שמרנים) או <b>בין־דורי</b> (נשארים עם העמדות מהצעירות)? רוב הראיות: <b>בין־דורי</b>.</p>${def("השנים המעצבות",`גיל ההתבגרות ותחילת שנות ה־20. עמדות שמתגבשות אז נוטות להישאר. בוגרות <b>מכללת בנינגטון</b> שנעשו ליברליות בשנות ה־30 הצביעו דמוקרטים <b>3:1</b> גם כעבור 50 שנה, כשבנות גילן הצביעו רפובליקנים 3:1.`)}${rem("עם זאת, גם מבוגרים משתנים: עמדות כלפי מין וגזע נעשו ליברליות יותר בשנות ה־50 וה־60 לחייהם.")}`,q:"q31"},
  {h:"מה הקהל חושב",html:`<div class="tw"><table><tr><th>גורם</th><th>השפעה</th></tr><tr><td><b>אזהרה מראש</b></td><td>מאפשרת להכין טיעוני נגד, ומפחיתה שכנוע (״למה לא לתת לבני נוער לנהוג״)</td></tr><tr><td><b>הסחה</b></td><td>מונעת טיעוני נגד, ומגבירה שכנוע במסרים פשוטים; הסחה חזקה מדי (אלימות, מין) מונעת עיבוד בכלל</td></tr><tr><td><b>צורך בקוגניציה</b></td><td>גבוה: מושפעים מאיכות הטיעון; נמוך: מרמזים היקפיים</td></tr></table></div><p>דרכים לגרות חשיבה: <b>שאלות רטוריות</b> (רייגן: ״האם מצבכם טוב יותר מלפני ארבע שנים?״), כמה דוברים, אחריות, חזרה ותשומת לב. חשיבה מחזקת מסרים <b>חזקים</b> ומחלישה <b>חלשים</b>.</p>`,q:"q33"}
 ]},
 {id:"t7",icon:"lock",title:"שכנוע קיצוני: כתות",blocks:[
  {h:"מעשים, ורגל בדלת",html:`${def("על מה הנושא",`איך עקרונות השכנוע מסבירים את כוחן של כתות.<br><b>מה נלמד כאן:</b> כת · היענות ומחויבות · רגל בדלת · מקור, מסר, קהל · בידוד`)}${def("כת",`${E("Cult")} נקראת גם ״תנועה דתית חדשה״: טקסים ואמונות ייחודיים, ניתוק מהתרבות הסובבת, ומנהיג כריזמטי. דוגמאות: ג׳ים ג׳ונס (914 מתו), דייוויד כורש, ״שער גן העדן״.`)}${rem("להסביר <b>למה</b> אנשים מאמינים אינו אומר אם האמונה <b>נכונה</b>.")}<p><b>היענות מובילה לקבלה</b>: חברים חדשים נעשים פעילים, מגייסים וממשיכים, וזה מחזק את הזהות. <b>רגל בדלת</b>: ארוחת ערב, סוף שבוע, הכשרה, גיוס. ג׳ונס: מעשרה אחוזים, ל־25%, לכל הרכוש. ״לאט לאט ויתרת על דברים״.</p>`,q:"q35"},
  {h:"מקור, מסר, קהל וקבוצה",html:`<div class="tw"><table><tr><th>מרכיב</th><th>בכתות</th></tr><tr><td><b>מקור</b></td><td>מנהיג כריזמטי ואמין; ג׳ונס ״קרא מחשבות״ בעזרת שיחות טלפון מוקדמות. גיוס דרך חברים ומשפחה</td></tr><tr><td><b>מסר</b></td><td>חי, רגשי, חם, ״הדרך האחת״</td></tr><tr><td><b>קהל</b></td><td>צעירים מתחת ל־25, לרוב ממעמד הביניים, בנקודת מפנה או משבר</td></tr><tr><td><b>קבוצה</b></td><td>בידוד ממערכות תמיכה, ״קריסה פנימה״, מראית עין של קונצנזוס</td></tr></table></div>${rem("אותם עקרונות פועלים גם בקבוצות חיוביות: אחוות סטודנטים, קבוצות עזרה עצמית ופסיכותרפיה. הגבול בין חינוך לשטיפת מוח <b>מטושטש</b>.")}`,q:"q37"}
 ]},
 {id:"t8",icon:"check",title:"להתנגד לשכנוע",blocks:[
  {h:"מחויבות וחיסון עמדות",html:`${def("על מה הנושא",`איך עוזרים לאנשים להתנגד לשכנוע לא רצוי.<br><b>מה נלמד כאן:</b> מחויבות פומבית · התקפה מתונה · חיסון עמדות · טפיל רעיל · יישומים`)}<p>קל יותר לקבל מסר מאשר לפקפק בו. הדרכים להתנגד: הצהרה <b>פומבית</b> על עמדה, ו<b>התקפה מתונה</b> על העמדה, שמעוררת התבצרות.</p>${def("חיסון עמדות",`${E("Attitude inoculation")} <b>מגווייר</b>: חשיפה למתקפה <b>חלשה</b> שמכינה טיעוני נגד למתקפה חזקה. ״לצחצח אחרי כל ארוחה״ קרס מול מתקפה חזקה, אלא אם חוסנו קודם בטיעון נגד מתון והפריכו אותו.`)}${rem("החיסון צריך <b>לגרות</b> את ההגנות, לא <b>להכריע</b> אותן: התנגדות שנכשלה מחלישה את העמדה. גם עייפות ושליטה עצמית מרוקנת מחלישות התנגדות.")}${def("טפיל רעיל",`צ׳לדיני: טיעון נגד חזק על העתק של פרסומת מתחרה (״איש המרלבורו״ משתעל). אחר כך הפרסומת המקורית מזכירה את טיעון הנגד.`)}`,q:"q39"},
  {h:"יישומים",html:`${tiles([["leaf","מניעת עישון","תלמידי תיכון ״חיסנו״ תלמידי ז׳ (״הייתי פחדן אם הייתי מעשן כדי להרשים אתכם״): שיעור המעשנים החדשים כמחצית"],["people","משחקי תפקידים","31% התחילו לעשן אחרי סרטים, לעומת 19% אחרי תרגול סירוב"],["phone","פרסומות לילדים","ילדים שבדקו אם הצעצוע באמת עובד כמו בפרסומת פיתחו הבנה מציאותית"]])}<p><b>השלכות</b>: הורים ומחנכים צריכים להימנע מ״סביבה סטרילית״ ולחשוף לטיעונים. ומבחינת המשכנע, <b>שכנוע כושל גרוע מכלום</b>: מי שדחה מסר מחוסן מפני הבא.</p>${ex("תמר מכינה מראש את חברי הקבוצה שלה: ״יגידו לכם שזה רק סיגריה אחת במסיבה. מה תענו?״. זה חיסון עמדות.")}`,q:"q41"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מהו שכנוע?","a":"מסר שמשנה עמדות או התנהגות","w":["הפעלת לחץ כדי לקבל ציות מיידי","העברת מידע בלי כוונה לשנות","שינוי עמדה שקורה בלי שום מסר"],"e":"שכנוע אינו טוב או רע מיסודו; זה תלוי במטרה ובתוכן."},{"q":"מתי נוטים לכנות שכנוע ״חינוך״?","a":"כשמסכימים עם המסר","w":["כשהמסר מגיע מבית ספר","כשהמסר ארוך ומפורט","כשהמסר מבוסס על פחד"],"e":"וכשלא מסכימים, קוראים לו ״תעמולה״."}]},"q2":{"t":"t1","v":[{"q":"מהם ארבעת המרכיבים שחקר הובלנד?","a":"מקור, מסר, ערוץ וקהל","w":["קשב, הבנה, זכירה ופעולה","היגיון, רגש, פחד והנאה","עמדה, כוונה, נורמה ושליטה"],"e":"מי אומר, מה, באיזה ערוץ, למי."},{"q":"מה מתאר המודל של מגווייר?","a":"משוכות שמסר צריך לעבור עד לפעולה","w":["שני מסלולי השכנוע: המרכזי וההיקפי","שלבי השינוי בטיפול פסיכולוגי ארוך","סדר ההצגה הנכון של טיעונים בוויכוח"],"e":"כל גורם שמסיר משוכה מגביר את הסיכוי לשכנוע."}]},"q3":{"t":"t1","v":[{"q":"מתי סביר שקהל יבחר במסלול המרכזי?","a":"כשיש מוטיבציה ויכולת לחשוב","w":["כשדעתו מוסחת או שהוא עסוק","כשהמקור מושך במיוחד","כשהנושא לא רלוונטי לו"],"e":"אז הוא מתמקד בטיעונים עצמם."},{"q":"מה מאפיין את המסלול ההיקפי?","a":"תגובה לרמזים כמו מקור מושך","w":["בחינה מעמיקה של איכות הטיעונים","העלאת טיעוני נגד לכל טענה","שינוי עמדה עמיד לאורך זמן"],"e":"למשל, מוזיקה גרמנית ברקע מגבירה קניית יין גרמני."}]},"q4":{"t":"t1","v":[{"q":"איזה מסלול מוביל לשינוי עמיד יותר?","a":"המרכזי","w":["ההיקפי","שניהם באותה מידה","אף אחד מהם"],"e":"חשיבה מעמיקה יוצרת שינוי שעומד בפני מתקפה ומשפיע על התנהגות."},{"q":"לפי גישת התגובה הקוגניטיבית, מה משכנע בפועל?","a":"המחשבות שהמסר מעורר","w":["מספר הטיעונים במסר","אורך המסר","עוצמת הקול של הדובר"],"e":"טיעון חזק מעורר מחשבות תומכות; חלש מעורר טיעוני נגד."}]},"q5":{"t":"t1","v":[{"q":"למה פרסומות למשקאות קלים מציגות זוהר ודובי קוטב?","a":"הן פונות למסלול ההיקפי","w":["הן פונות למסלול המרכזי","הן מציגות מידע על המוצר","הן מנסות לעורר טיעוני נגד"],"e":"פרסומות למחשבים בכתבי עת מציגות מפרט ומחיר, כי הקורא מעוניין."}]},"q6":{"t":"t1","v":[{"q":"מאיירס הצביע לפי מי שתומך בהצע רה לעמדה כשמתקיפים אותה במתינות?","a":"המחויבות אליה מתחזקת","w":["היא קורסת מיד","היא נשכחת","היא הופכת לקיצונית בכיוון ההפוך"],"e":"כמו בוויכוח שבו כל צד מתבצר יותר."}]},"q41":{"t":"t8","v":[{"q":"מה היה שיעור המעשנים החדשים בקרב תלמידים ״מחוסנים״?","a":"כמחצית משיעורם בקבוצת הביקורת","w":["כפול משיעורם בקבוצת הביקורת","זהה לשיעור בקבוצת הביקורת","אפס, אף אחד לא התחיל לעשן"],"e":"מקליסטר: תלמידי תיכון לימדו תלמידי ז׳ להשיב ללחץ לעשן."},{"q":"מה עבד טוב יותר למניעת עישון?","a":"משחקי תפקידים של סירוב","w":["צפייה בסרטים נגד עישון","הרצאה על נזקי עישון","עונשים על עישון"],"e":"19% התחילו לעשן לעומת 31% אחרי סרטים."}]},"q42":{"t":"t8","v":[{"q":"למה שכנוע כושל עלול להיות גרוע מכלום?","a":"מי שדחה מסר מחוסן מפני הבא","w":["הקהל נעלב ומתנתק לגמרי","המקור מאבד את המוניטין","המסר הבא נשמע זהה לראשון"],"e":"הוא מפעיל את ההגנות ומקשה את הלב מול מסרים נוספים."}]}};
const SUM=`<h2>סיכום: מאיירס פרק 7 - שכנוע</h2>
<div class="key"><b>על מה מדובר?</b> שכנוע הוא תהליך שבו מסר משנה אמונות, עמדות או התנהגות. הוא פועל ב<b>שני מסלולים</b>: <b>מרכזי</b> (חשיבה על הטיעונים, שינוי עמיד) ו<b>היקפי</b> (רמזים כמו מקור מושך, שינוי שטחי). הפרק בוחן ארבעה מרכיבים: <b>מי</b> אומר (אמינות, אטרקטיביות), <b>מה</b> (היגיון או רגש, פחד, פער, צדדים, סדר), <b>איך</b> (ערוץ פעיל או סביל, אישי או המוני) ו<b>למי</b> (גיל, צורך בקוגניציה). בסוף: כתות כשכנוע קיצוני, ואיך להתנגד לשכנוע (<b>חיסון עמדות</b>).</div>

<h3>הדוגמה שתלווה אותנו: תמר</h3>
<p><b>תמר</b> (דמות בדויה להמחשה) מובילה קמפיין נגד עישון בקמפוס, וצריכה להחליט מי יעביר את המסר, מה יגיד, באיזה ערוץ ולמי.</p>

<h3>1. שני מסלולים</h3>
<div class="tw"><table><tr><th></th><th>מסלול מרכזי</th><th>מסלול היקפי</th></tr>
<tr><td>מתי</td><td>יש <b>מוטיבציה ויכולת</b> לחשוב</td><td>אין עניין, הסחה, עומס</td></tr>
<tr><td>מה משפיע</td><td><b>איכות הטיעונים</b> והמחשבות שהם מעוררים</td><td><b>רמזים</b>: מקור מושך, מומחה, מסר מוכר</td></tr>
<tr><td>התוצאה</td><td>שינוי <b>עמיד</b>, משפיע על התנהגות</td><td>שינוי שטחי וקצר</td></tr>
<tr><td>דוגמה</td><td>פרסומת למחשב עם מפרט</td><td>פרסומת למשקה עם דובי קוטב</td></tr></table></div>
<p><b>הובלנד</b> הגדיר את ארבעת המרכיבים; <b>מגווייר</b>: משוכות של קשב, הבנה, אמונה, זכירה ופעולה. שכנוע נקרא ״חינוך״ כשמסכימים ו״תעמולה״ כשלא.</p>

<h3>2. מי אומר: המקור</h3>
<ul>
<li><b>אמינות</b> = מומחיות + מהימנות. דועכת אחרי כחודש. <b>השפעה רדומה</b>: מסר ממקור לא אמין משפיע <b>מאוחר יותר</b>, כששוכחים את המקור.</li>
<li><b>מהימנות</b> עולה עם: דיבור ישיר ובטוח, מבט ישיר, כשהדובר <b>לא מנסה לשכנע</b>, כשהוא טוען <b>נגד האינטרס שלו</b>, ודיבור <b>מהיר</b>.</li>
<li><b>אטרקטיביות ודמיון</b>: חיקוי מגביר שכנוע; רופא שיניים שחור שכנע תלמידים שחורים. בנושא <b>סובייקטיבי</b> משכנע מי ש<b>דומה</b>; ב<b>אובייקטיבי</b>, ה<b>מומחה</b>.</li>
</ul>

<h3>3. מה נאמר: התוכן</h3>
<div class="tw"><table><tr><th>שאלה</th><th>התשובה</th></tr>
<tr><td><b>היגיון או רגש?</b></td><td>תלוי בקהל: אנליטיים להיגיון. עמדה רגשית משתנה מרגש</td></tr>
<tr><td><b>הרגשה טובה</b></td><td>בוטנים ומשקה הגבירו שכנוע (ג׳ניס); במצב רוח טוב נשענים על רמזים</td></tr>
<tr><td><b>פחד</b></td><td>מגביר שכנוע (ממוגרפיה: 2/3 מול 1/2), <b>אם</b> יש דרך התמודדות; בלעדיה, הכחשה</td></tr>
<tr><td><b>פער עמדות</b></td><td>מקור <b>מהימן מאוד</b> (ת״ס אליוט) משכנע יותר בעמדה רחוקה; קהל מעורב מקבל טווח צר</td></tr>
<tr><td><b>חד או דו־צדדי</b></td><td>חד־צדדי לקהל <b>מסכים</b>; דו־צדדי לקהל <b>מתנגד</b> או שייחשף לטיעוני נגד (מחזור: 80%)</td></tr>
<tr><td><b>ראשונות או אחרונות</b></td><td>בדרך כלל <b>ראשונות</b>; אחרונות רק עם <b>מרווח זמן</b> והחלטה סמוך למסר השני</td></tr></table></div>

<h3>4. איך: הערוץ</h3>
<ul>
<li>קליטה <b>סבילה</b> לא עובדת בנושאים חשובים (דרשות: 10% נזכרו; ניקיון: 2 מ־180). התנסות <b>פעילה</b> כן.</li>
<li><b>חזרה</b> וחריזה מגבירות אמונה. השכנוע פוחת ככל שהנושא <b>חשוב ומוכר</b> יותר.</li>
<li><b>השפעה אישית</b> חזקה מתקשורת: אן ארבור 19%, 45%, 75%; מחקר הלב: 8%, 20%, 30%.</li>
<li><b>זרימה דו־שלבית</b> (כ״ץ): תקשורת, מנהיגי דעה, כולם.</li>
<li>מסר <b>פשוט</b>: וידאו; מסר <b>מורכב</b>: כתב.</li>
</ul>

<h3>5. למי: הקהל</h3>
<ul>
<li><b>גיל</b>: הסבר <b>בין־דורי</b>, לא מחזור חיים. <b>השנים המעצבות</b> (התבגרות ותחילת ה־20). בנינגטון: ליברליות גם אחרי 50 שנה.</li>
<li><b>אזהרה מראש</b> מפחיתה שכנוע; <b>הסחה</b> קלה מגבירה (פחות טיעוני נגד).</li>
<li><b>צורך בקוגניציה</b>: גבוה, איכות הטיעון; נמוך, רמזים. גירוי חשיבה (שאלות רטוריות) מחזק טיעונים חזקים ומחליש חלשים.</li>
</ul>

<h3>6. כתות</h3>
<ul>
<li><b>מעשים</b>: היענות מובילה לקבלה; <b>רגל בדלת</b> (ג׳ונס: 10%, 25%, הכל).</li>
<li><b>מקור</b> כריזמטי ואמין; <b>מסר</b> רגשי וחם; <b>קהל</b> צעיר בנקודת מפנה; <b>בידוד</b> וקונצנזוס מדומה.</li>
<li>אותם עקרונות בקבוצות חיוביות; הגבול בין חינוך לשטיפת מוח מטושטש.</li>
</ul>

<h3>7. להתנגד לשכנוע</h3>
<ul>
<li><b>מחויבות פומבית</b> ו<b>התקפה מתונה</b> מחזקות עמדה.</li>
<li><b>חיסון עמדות</b> (מגווייר): מתקפה חלשה מכינה טיעוני נגד. אבל התנגדות שנכשלה <b>מחלישה</b>.</li>
<li><b>טפיל רעיל</b> (צ׳לדיני): טיעון נגד על העתק הפרסומת.</li>
<li>תלמידים ״מחוסנים״: כמחצית מעשנים חדשים; משחקי תפקידים: 19% מול 31%.</li>
<li><b>שכנוע כושל גרוע מכלום</b>: מחסן מפני הבא.</li>
</ul>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>השפעה רדומה</b> = מקור <b>לא</b> אמין שמשפיע <b>מאוחר</b>.</li>
<li><b>ראשונות</b> הוא השכיח; <b>אחרונות</b> דורש מרווח זמן <b>וגם</b> החלטה מיד אחרי השני.</li>
<li>דו־צדדי לקהל <b>מתנגד</b>; חד־צדדי לקהל <b>מסכים</b>.</li>
<li>פחד עובד רק עם <b>דרך פעולה</b>.</li>
<li>הסבר <b>בין־דורי</b>, לא מחזור חיים.</li>
<li>אזהרה מראש <b>מפחיתה</b>; הסחה קלה <b>מגבירה</b>.</li>
<li>מסר <b>מורכב</b> = כתב; <b>פשוט</b> = וידאו.</li>
<li>מקור <b>דומה</b> לטעם; <b>מומחה</b> לעובדות.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
