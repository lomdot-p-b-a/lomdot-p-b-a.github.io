const tiles=a=>{const s=a.filter(x=>x.length<4),c=a.filter(x=>x.length>=4);return (s.length?`<div class="tiles">${s.map(([i,t,d])=>`<div class="tile">${ic(i)}<b>${t}</b><span>${d}</span></div>`).join("")}</div>`:"")+c.map(([i,t,d,x,e])=>`<div class="cpt"><div class="cpt-h">${ic(i)}<b>${t}</b></div><p class="cpt-d">${_dot(d)}</p>${x?`<p>${x}</p>`:""}${e?`<div class="cpt-ex"><b>דוגמה:</b> ${e}</div>`:""}</div>`).join("")};

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"people",title:"מהי פסיכולוגיה חברתית",blocks:[
  {h:"סינדרלה וכוחה של הסיטואציה",html:`${def("על מה הנושא",`מה חוקרת הפסיכולוגיה החברתית, ובמה היא שונה מתחומים קרובים.<br><b>מה נלמד כאן:</b> סינדרלה · הגדרה · פסיכולוגיה חברתית מול סוציולוגיה ואישיות`)}${ex("הפרק נפתח בסינדרלה: בבית, ליד האם החורגת, היא כנועה ולא מושכת. בנשף היא מרגישה יפה, ומתהלכת, מדברת ומחייכת בהתאם. הנסיך שפגש אותה בנשף לא זיהה אותה בביתה העלוב. המסר: <b>הסיטואציה</b> מעצבת אותנו. כפי שכתב סארטר, אי אפשר להבין אותנו במנותק מהסיטואציות שבהן אנו פועלים. נחזור לסינדרלה לאורך הלומדה.")}${def("פסיכולוגיה חברתית",`${E("Social psychology")} החקירה המדעית של האופן שבו בני אדם <b>חושבים</b> על הזולת, <b>משפיעים</b> זה על זה, ו<b>מתייחסים</b> זה לזה.`)}`,q:"q1"},
  {h:"בין סוציולוגיה לאישיות",html:`<div class="tw"><table><tr><th>בהשוואה ל...</th><th>הפסיכולוגיה החברתית...</th></tr><tr><td><b>סוציולוגיה</b> (קבוצות וחברות)</td><td>מתמקדת יותר ב<b>יחידים</b> ועורכת יותר <b>ניסויים</b></td></tr><tr><td><b>פסיכולוגיה של האישיות</b></td><td>מתמקדת פחות ב<b>הבדלים</b> בין אנשים, ויותר באופן שבו אנשים <b>באופן כללי</b> תופסים ומשפיעים זה על זה</td></tr></table></div><p>זה מדע צעיר: הניסוי הראשון דווח ב־<b>1898</b>, בשנות ה־30 קיבל את צורתו, ובמלחמת העולם השנייה הפך לתחום תוסס.</p>${tiles([["brain","באיזו מידה העולם החברתי בראש שלנו?","נשואים מאושרים מייחסים הערה עוקצנית ל״יום קשה״; לא מאושרים, לעוינות"],["scales","האם יתנהגו באכזריות אם יורו להם?","בניסוי של מילגרם כמעט שני שלישים צייתו עד הסוף"],["cart","לעזור לזולת או לעצמי?","ממשאית נפלו 2 מיליון דולר, ורק 100,000 הוחזרו"]])}`,q:"q3"}
 ]},
 {id:"t2",icon:"bulb",title:"הרעיונות המרכזיים",blocks:[
  {h:"אנחנו בונים את המציאות, ואינטואיציה",html:`${def("על מה הנושא",`שישה רעיונות שכדאי לזכור גם אחרי שהפרטים נשכחים.<br><b>מה נלמד כאן:</b> הבניית מציאות · אינטואיציה · השפעה חברתית · עמדות ונטיות · ביולוגיה · יישום`)}${def("1. אנו מַבנים את המציאות החברתית",`יש לנו דחף להסביר התנהגות ולייחס לה סיבה. במשחק פוטבול אלים ב־1951 בין <b>פרינסטון לדרטמות</b>, סטודנטים מפרינסטון ״ראו״ פי 2 עברות של דרטמות ממה שראו הסטודנטים בדרטמות. יש מציאות אובייקטיבית, אבל אנו רואים אותה דרך <b>האמונות והערכים</b> שלנו.`)}${def("2. האינטואיציות שלנו מועילות, ולפעמים מסוכנות",`חשיבה, זיכרון ועמדות פועלים בשתי רמות: מודעת ושקולה, ולא מודעת ואוטומטית. זה נקרא <b>עיבוד דואלי</b>. אבל אינטואיציה טועה: אחרי 11 בספטמבר אמריקנים פחדו לטוס יותר מלנהוג, אף שטיסה בטוחה יותר <b>פי 230</b> לכל קילומטר.`)}${ex("גם סינדרלה ״בנתה מציאות״: בבית היא פירשה את עצמה כנחותה, ובנשף כראויה. אותה בחורה, פירוש אחר.")}`,q:"q5"},
  {h:"השפעות חברתיות, עמדות וביולוגיה",html:`${def("3. השפעות חברתיות מעצבות התנהגות",`אנחנו יצורים חברתיים: סטודנטים בטקסס שנשאו מיקרופון בילו כ־<b>30%</b> מזמנם בשיחה. לפעמים הסיטואציה גוברת על העמדות המוצהרות שלנו (בשואה; או להפך, בנדיבות אחרי 11 בספטמבר). <b>התרבות</b> מגדירה את הסיטואציה. הייזל מרקוס: ״אנשים הם כחומר ביד היוצר״.`)}${def("4. גם עמדות ונטיות אישיות מעצבות התנהגות",`איננו ״כמוץ אשר תדפנו רוח״. עמדות פוליטיות משפיעות על ההצבעה, ואנשים שונים מגיבים אחרת לאותה סיטואציה: אחרי שנים בכלא אחד מבקש נקמה, ו<b>נלסון מנדלה</b> קרא לפיוס.`)}${def("5. להתנהגות חברתית יש שורשים ביולוגיים",`תורשה וסביבה קובעות אותנו יחד, כמו אורך ורוחב קובעים שטח. <b>מדעי העצב החברתיים</b> חוקרים את הבסיס העצבי של התנהגות חברתית. אנחנו אורגניזמים <b>ביו־פסיכו־חברתיים</b>: נידוי מעלה לחץ דם, ותמיכה מחזקת את החיסון.`)}${def("6. העקרונות ניתנים ליישום בחיי היומיום",`בבריאות, במשפט ובשמירה על הסביבה.`)}`,q:"q7"}
 ]},
 {id:"t3",icon:"scales",title:"פסיכולוגיה חברתית וערכים",blocks:[
  {h:"השפעה גלויה של ערכים",html:`${def("על מה הנושא",`גם מדענים הם בני אדם, והערכים שלהם נכנסים לעבודה.<br><b>מה נלמד כאן:</b> השפעה גלויה · השפעה סמויה · ייצוגים חברתיים · תוויות`)}<p>ערכים נכנסים כבר ב<b>בחירת נושא המחקר</b>. הפסיכולוגיה החברתית משקפת את ההיסטוריה החברתית:</p><div class="tw"><table><tr><th>עשור</th><th>נושא בולט</th><th>הרקע</th></tr><tr><td>שנות ה־40</td><td>דעות קדומות</td><td>הפשיזם באירופה</td></tr><tr><td>שנות ה־50</td><td>קונפורמיות</td><td>אחידות וחוסר סובלנות</td></tr><tr><td>שנות ה־60</td><td>תוקפנות</td><td>מהומות ופשיעה</td></tr><tr><td>שנות ה־70</td><td>מגדר וסקסיזם</td><td>התנועה הפמיניסטית</td></tr></table></div><p>ערכים גם שונים בין תרבויות: באירופה פותחה תאוריית ״<b>הזהות החברתית</b>״, ובארה״ב, האינדיבידואליסטית, התמקדו יותר ביחיד. וערכים משפיעים על <b>מי</b> נמשך לכל תחום.</p>`,q:"q9"},
  {h:"השפעה סמויה של ערכים",html:`<ul><li><b>המדע אינו אובייקטיבי לגמרי.</b> אנחנו מפרשים דרך הציפיות שלנו: מי שלא יודע שבתמונה יש כלב דלמטי לא רואה אותו, ומי שיודע לא יכול שלא לראות. כשכל החוקרים שותפים לאותה תרבות, אף אחד לא מערער על <b>ייצוגים חברתיים</b>, האמונות המשותפות שנראות מובנות מאליהן.</li><li><b>תאוריות כוללות ערכים חבויים.</b> מסלאו תיאר אנשים ״שמימשו את עצמם״ לפי הדמויות שהוא בחר, כלומר לפי הערכים שלו.</li><li><b>עצות</b> של אנשי מקצוע משקפות את ערכיהם (במערב: מה טוב ״לי״).</li><li><b>הגדרות ותוויות.</b> אותו דפוס תשובות יכול להיקרא ״הערכה עצמית גבוהה״ או ״נטייה להתגונן״. ״מחבל״ או ״לוחם חופש״, ״לאומנות״ או ״פטריוטיות״.</li></ul>${rem("זו לא סיבה לפסול את המדע. להפך: בגלל שחשיבה אנושית כרוכה בפרשנות, צריך <b>תצפיות וניסויים שיטתיים</b> כדי לבדוק את הרעיונות מול המציאות.")}${ex("״סינדרלה המסכנה״ או ״סינדרלה הכנועה״? התווית שנבחר כבר מעבירה שיפוט.")}`,q:"q11"}
 ]},
 {id:"t4",icon:"clock",title:"״ידעתי זאת מזמן״",blocks:[
  {h:"האם זה רק שכל ישר?",html:`${def("על מה הנושא",`הטענה ש״כל זה מובן מאליו״, ולמה היא שגויה.<br><b>מה נלמד כאן:</b> לזרספלד · הטיית החכמה בדיעבד · פתגמים סותרים · מחיר ההטיה`)}<p>יש ביקורת שהפסיכולוגיה החברתית רק מתעדת את המובן מאליו. <b>לזרספלד</b> (1949) הציג ממצאים ״ברורים״ על חיילים במלחמת העולם השנייה, למשל שחיילים משכילים התקשו יותר להסתגל. נשמע הגיוני? ואז הוא גילה: <b>כל אחד מהם הוא ההפך הגמור מהממצא האמיתי</b>. גם את הממצאים האמיתיים היו הקוראים מכנים ״מובנים מאליהם״.</p>${def("הטיית החכמה בדיעבד",`${E("Hindsight bias")} הנטייה <b>להגזים ביכולת לחזות</b> תוצאה, אחרי שכבר יודעים אותה. נקראת גם ״ידעתי זאת מזמן״. מי ששמע על התוצאה (הסכם שלום) אומד את סיכוייה גבוה יותר ממי שלא שמע (<b>פישהוף</b>).`)}${ex("״סטודנטים שמתאהבים בוחרים מישהו <b>שונה</b> מהם: ׳ניגודים נמשכים׳״. ״סטודנטים שמתאהבים בוחרים מישהו <b>דומה</b> להם: ׳מצא מין את מינו׳״. כל קבוצה תמצא הסבר משכנע לתוצאה שלה, ותגיד ש״זה לא מפתיע״.")}`,q:"q13"},
  {h:"פתגמים סותרים ומחיר ההטיה",html:`<p><b>טייגן</b> ביקש מסטודנטים לדרג פתגמים: גם ״פחד גובר על אהבה״ וגם ההפך ״אהבה גוברת על פחד״ דורגו כנכונים. כמעט לכל תוצאה יש פתגם שתומך בה, ולכן צריך <b>מחקר</b> כדי להכריע.</p><ul><li><b>במבחן:</b> החומר נראה מובן מאליו בקריאה, ובשאלה אמריקאית מתברר שלא. ״חשבתי שאני יודע את החומר״.</li><li><b>יהירות:</b> הערכת יתר של היכולות שלנו.</li><li><b>האשמה לא הוגנת:</b> אחרי 11 בספטמבר כולם ראו את ״הכתובת על הקיר״, אבל ל־FBI הגיעו 68,000 רמזים שלא נחקרו. בדיעבד הרמזים המעטים נראים ברורים.</li><li><b>אשמה עצמית:</b> ״הייתי צריכה להתחיל את העבודה קודם״.</li></ul>${rem("השכל הישר לא תמיד טועה. הוא בדרך כלל צודק <b>בדיעבד</b>, ולכן אנחנו חושבים שאנחנו יודעים יותר ממה שאנחנו יודעים.")}`,q:"q15"}
 ]},
 {id:"t5",icon:"chart",title:"תאוריה ומחקר מתאמי",blocks:[
  {h:"תאוריה והשערה",html:`${def("על מה הנושא",`איך פסיכולוגים חברתיים בונים ובודקים רעיונות.<br><b>מה נלמד כאן:</b> תאוריה · השערה · תאוריה טובה · מחקר מתאמי · מתאם וסיבתיות`)}${def("תאוריה",`${E("Theory")} מערך משולב של עקרונות ש<b>מסבירים</b> ו<b>מנבאים</b> אירועים. עובדות הן מה שרואים; תאוריות מסכמות ומסבירות אותן. ״ערמת לבנים איננה בית״ (פואנקרה).`)}${def("השערה",`${E("Hypothesis")} ניבוי שאפשר לבדוק. השערות מאפשרות <b>להפריך</b> תאוריה, נותנות כיוון למחקר, והופכות תאוריה ל<b>יישומית</b>. קורט לוין: ״אין דבר מעשי יותר מתאוריה טובה״.`)}${ex("תאוריה: השתייכות להמון יוצרת אנונימיות ומפחיתה עכבות. השערה: אנשים עם מסכות ייתנו הלם חזק יותר. יישום: תגי שם ומצלמות לשוטרים.")}<p><b>תאוריה טובה</b> מסכמת הרבה תצפיות, ונותנת ניבויים ברורים שמאפשרים לאשש אותה, להניב מחקר ולהציע יישומים. רוב התאוריות לא מופרכות, אלא <b>מוחלפות</b> בטובות יותר.</p>`,q:"q17"},
  {h:"מחקר מתאמי: המצבות בגלזגו",html:`${tiles([["flask","מחקר שדה","בסביבה טבעית, מחוץ למעבדה"],["chart","מחקר מתאמי","בודק אם יש <b>קשר טבעי</b> בין משתנים","החוקר לא משנה כלום, רק מודד ובודק אם שני משתנים ״הולכים יחד״. הוא לא יכול לקבוע מה גורם למה.","מוצאים שאנשים עם הערכה עצמית גבוהה מצליחים יותר בלימודים, אבל לא ברור מה גרם למה, או אם משהו שלישי גרם לשניהם."],["target","מחקר ניסויי","מתפעל משתנה כדי לראות את <b>השפעתו</b>"]])}${ex("חוקרים בגלזגו העתיקו ממצבות את אורך החיים של 843 אנשים, ומדדו את <b>גובה המצבה</b> כמדד למעמד. מי שהמצבה שלו גבוהה יותר חי יותר. גם בבריטניה: לפועלים היה סיכוי גדול פי 2.7 למות לעומת מנהלים בכירים.")}${def("מתאם אינו סיבתיות",`אולי מעמד שומר על הבריאות. אבל אולי ההפך: בריאות טובה מביאה להצלחה; ואולי גורם שלישי כמו תזונה. דוגמה משעשעת: בעלי כלבים העדיפו את מקיין (שהיו לו כלבים), אבל ייתכן שזה כי לבנים ונשואים מחזיקים יותר כלבים, ונוטים יותר להצביע רפובליקני.`)}`,q:"q19"},
  {h:"הערכה עצמית והישגים",html:`<p>ילדים עם הערכה עצמית גבוהה מגיעים להישגים גבוהים. בארה״ב חוקקו מעל 170 תקנות לקידום הערכה עצמית. אבל יש שלוש אפשרויות:</p>${fig("corr42")}<ul><li><b>הישגים ← הערכה עצמית:</b> בנורווגיה, כוכבי זהב על הישגים העלו את ההערכה העצמית.</li><li><b>דו־סטרי:</b> מחקר על 6,000 תלמידים בגרמניה.</li><li><b>גורם שלישי:</b> כשנוטרלו <b>משכל</b> ו<b>מעמד משפחתי</b>, הקשר <b>נעלם לגמרי</b>.</li></ul>${def("מקדם המתאם",`r נע בין 1.0− ל־1.0+. הערכה עצמית ודיכאון: כ־0.6− (שלילי). משכל של תאומים זהים: מעל 0.8+. <b>יתרון</b>: נערך בעולם האמיתי, ובודק משתנים שאי אפשר לתפעל (גזע, מגדר, מעמד). <b>חיסרון</b>: לא חד־משמעי לגבי סיבתיות.`)}${rem("טכניקות מתקדמות (<b>מתאמים מושהים</b> שמראים מה קודם למה, וניכוי סטטיסטי של משתנים מתערבים) יכולות <b>לרמוז</b> על סיבתיות, אבל לא להוכיח.")}`,q:"q21"}
 ]},
 {id:"t6",icon:"data",title:"סקרים",blocks:[
  {h:"מדגם אקראי",html:`${def("על מה הנושא",`איך עושים סקר שמייצג, ומה יכול להטות אותו.<br><b>מה נלמד כאן:</b> מדגם אקראי · מדגמים לא מייצגים · סדר · תשובות · ניסוח · אופן הצגה`)}${def("מדגם אקראי",`${E("Random sample")} לכל אדם באוכלוסייה יש סיכוי <b>שווה</b> להיכלל. בארה״ב <b>1,200</b> משתתפים נותנים ודאות של 95% עם טעות של 3% או פחות, בין שמדובר בעיר או במדינה. (בישראל, מדגם מייצג נפוץ הוא כ־500.) כמו טיפות דם שמייצגות את כל הגוף.`)}<div class="tw"><table><tr><th>מקרה</th><th>מה השתבש</th></tr><tr><td><b>אן לנדרס</b> (1984)</td><td>מעל 100,000 נשים ענו, 72% העדיפו חיבה על פני מין. אבל רק מי שטרחה לענות: לא מייצג</td></tr><tr><td><b>Literary Digest</b> (1936)</td><td>2 מיליון גלויות ניבאו ניצחון ללנדון. רוזוולט ניצח בגדול: נשלחו רק לבעלי טלפון ורכב</td></tr></table></div>`,q:"q23"},
  {h:"סדר, תשובות, ניסוח ואופן הצגה",html:`${tiles([["copies","סדר השאלות","תמיכה בהסכמים אזרחיים לזוגות חד־מיניים עלתה כששאלו קודם על נישואים","השאלה הקודמת משפיעה על התשובה לשאלה הבאה, כי היא משנה את ההקשר שבו האדם חושב.","אם שואלים קודם ״מה דעתך על הכנסת מכוניות למרכז העיר?״ ואחר כך ״האם להרחיב את התחבורה הציבורית?״, התמיכה בתחבורה ציבורית עשויה לעלות."],["split","אפשרויות התשובה","כמה אנרגיה מכור גרעיני? 41% בשאלה פתוחה, 21% כשהוצגו גם פחם ומקורות אחרים","התשובות שמציעים לבחור מהן משנות את התוצאה. כשמופיעות אפשרויות נוספות, אנשים בוחרים בהן.","דמיינו סקר שבו שואלים ״מה הכי חשוב לך בעבודה?״. בשאלה פתוחה התשובות יתפזרו, אבל אם תופיע רשימה עם ״שכר״ בראשה, הרבה יותר אנשים עשויים לבחור בו."],["doc","ניסוח","23% אמרו שהממשלה מוציאה יותר מדי על ״סיוע לעניים״, 53% על ״רווחה״. ״לאסור״ 54% מול ״לא להרשות״ 75%","מילה אחת בשאלה יכולה לשנות את התשובה, כי מילים שונות מעוררות רגשות שונים, גם כשהן מתארות את אותו דבר.","״האם לאסור עישון בפארקים?״ מקבל פחות תמיכה מ״האם לא להרשות עישון בפארקים?״, אף שזה אותו דבר."]])}${def("אופן הצגה",`${E("Framing")} הדרך שבה מוצגת שאלה או סוגיה משפיעה על ההחלטה. קונדום עם ״95% הצלחה״ נראה יעיל ל־9 מכל 10 סטודנטים; עם ״5% כישלון״, ל־4 בלבד.`)}<ul><li><b>תרומת איברים:</b> כשבררת המחדל היא ״כן״, כמעט כולם תורמים; כשהיא ״לא״, רק אחד מארבעה.</li><li><b>חיסכון לפנסיה:</b> כשההצטרפות היא בררת המחדל, השיעור קפץ מ־49% ל־86%.</li></ul>${ex("הסולטן ומפרשי החלומות: ״כל בני משפחתך ימותו לפניך״ גרם למלקות; ״תאריך ימים יותר מכל משפחתך״ זיכה בזהב. אותו תוכן, הצגה שונה.")}`,q:"q25"}
 ]},
 {id:"t7",icon:"flask",title:"ניסוי, אתיקה והכללה",blocks:[
  {h:"בקרה והקצאה אקראית",html:`${def("על מה הנושא",`הניסוי מאפשר לבדוק סיבה ותוצאה. איך הוא בנוי, ומה המגבלות.<br><b>מה נלמד כאן:</b> משתנים · אפקט סינדרלה · הקצאה אקראית · ממשיות · הטעיה · אתיקה · הכללה`)}<p>כמו מהנדסים שבונים <b>מנהרת רוח</b>, חוקרים יוצרים במעבדה מציאות מוקטנת. כשלושה רבעים מהמחקרים בתחום הם ניסויים.</p>${def("משתנים",`<b>בלתי תלוי</b>: הגורם שהחוקר מתפעל. <b>תלוי</b>: מה שמודדים, ש״תלוי״ במניפולציה.`)}${ex("<b>אפקט סינדרלה:</b> 76 סטודנטים דיברו בטלפון עם סטודנטית, ולפני השיחה ראו תמונה. לחצי הראו אישה כבדת משקל, ולחצי אישה במשקל ממוצע (המשתנה הבלתי תלוי). הנשים שהגברים <b>חשבו</b> שהן כבדות משקל דיברו בצורה קרירה ופחות עליזה. הציפייה של הגבר יצרה את ההתנהגות, כמו האם החורגת עם סינדרלה.")}${ex("<b>פאוור ריינג׳רס:</b> ילדים שצפו בפרק ביצעו מיד אחר כך פי 7 מעשי אלימות מילדים שלא צפו. מעשי האלימות הם המשתנה התלוי.")}${def("הקצאה אקראית",`${E("Random assignment")} לכל משתתף סיכוי שווה להגיע לכל תנאי. כך הקבוצות שוות בממוצע בכל דבר, וכל הבדל נובע מהמשתנה הבלתי תלוי. <b>שימו לב:</b> הקצאה אקראית עוזרת להסיק <b>סיבתיות</b>; דגימה אקראית עוזרת <b>להכליל</b>.`)}`,q:"q27"},
  {h:"ממשיות, הטעיה ואתיקה",html:`<div class="tw"><table><tr><th>ממשיות יומיומית</th><th>ממשיות ניסויית</th></tr><tr><td>דמיון שטחי לחיי היומיום</td><td>כמה הניסוי <b>מעורר מעורבות</b> אמיתית</td></tr><tr><td>לא חובה</td><td><b>חובה</b>: אסור שהמשתתפים ישתעממו או יעמידו פנים</td></tr></table></div>${def("הטעיה",`${E("Deception")} מסירת מידע כוזב על השיטה או המטרה. כשליש מהמחקרים (ויורד). נועדה לשמור על ממשיות ניסויית ולהסתיר את ההשערה.`)}${def("מאפייני מצב הניסוי",`${E("Demand characteristics")} רמזים שמגלים למשתתפים מה מצופה מהם. לכן מתקננים הוראות או משתמשים במחשב.`)}<p><b>כללי האתיקה:</b> <b>הסכמה מדעת</b>; יושר, והטעיה רק כשהיא מוצדקת; הגנה מפגיעה; סודיות; ו<b>שיחת הבהרה</b> אחרי הניסוי, שמסבירה הכל (חוץ ממצבים שבהם המידע יגרום מצוקה).</p>`,q:"q29"},
  {h:"מהמעבדה לחיים",html:`<p>מחקר המעבדה והחיים מזינים זה את זה: תצפיות מעוררות מחקר מתאמי, שמוביל לניסוי. ממצאי מעבדה רבים נמצאו גם בשדה. אבל צריך זהירות: המעבדה מבוקרת ופשוטה, והמשתתפים הם לרוב סטודנטים.</p>${def("תוכן מול תהליך",`תרבויות נבדלות יותר ב<b>תוכן</b> (מה חושבים) מאשר ב<b>תהליך</b> (איך מגבשים את המחשבות). סטודנטים בפורטו ריקו בודדים יותר, אבל מרכיבי הבדידות זהים: ביישנות, היעדר מטרה, הערכה עצמית נמוכה.`)}${rem("״מתחת למעטה השונות, הדמיון בינינו רב מן השוני״.")}`,q:"q31"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מה מלמד סיפור סינדרלה, לפי הפרק?","a":"הסיטואציה מעצבת את ההתנהגות שלנו","w":["האישיות קובעת את ההתנהגות בכל מצב","יופי חיצוני הוא שקובע איך מתייחסים אלינו","מי שכנוע בבית יהיה כנוע בכל מקום"],"e":"אותה סינדרלה הייתה כנועה ליד האם החורגת ושובת לב בנשף. הסיטואציה שינתה אותה."},{"q":"מהי פסיכולוגיה חברתית?","a":"חקר מדעי של חשיבה, השפעה ויחסים בין אנשים","w":["חקר של קבוצות גדולות וחברות שלמות, בעיקר בתצפית מבחוץ","חקר ההבדלים בין אנשים בתכונות אישיות קבועות ויציבות","חקר המבנה של המוח ושל מערכת העצבים"],"e":"חשיבה על אחרים, השפעה על אחרים, ויחסים עם אחרים: אלה שלושת התחומים."}]},"q2":{"t":"t1","v":[{"q":"במה פסיכולוגיה חברתית שונה מסוציולוגיה?","a":"מתמקדת יותר ביחידים ועורכת יותר ניסויים","w":["מתמקדת יותר בקבוצות גדולות ובחברות שלמות","לא משתמשת בניסויים בכלל, רק בסקרים","חוקרת רק התנהגות של חיות"],"e":"סוציולוגיה חוקרת קבוצות וחברות. הפסיכולוגיה החברתית מתמקדת ביחיד בהקשר חברתי, ועורכת יותר ניסויים."}]},"q3":{"t":"t1","v":[{"q":"במה פסיכולוגיה חברתית שונה מפסיכולוגיה של האישיות?","a":"פחות בהבדלים בין אנשים, יותר במה שמשותף לכולם","w":["יותר בהבדלים בין אנשים, ופחות במה שמשותף לכולם","רק בילדים ובני נוער, ולא במבוגרים","רק במחשבות ולא בהתנהגות"],"e":"פסיכולוגיית האישיות שואלת במה אנשים שונים. החברתית שואלת איך אנשים באופן כללי תופסים ומשפיעים זה על זה."},{"q":"מה מלמד המקרה של 2 מיליון הדולרים שנפלו ממשאית?","a":"רוב האנשים לקחו לעצמם, ורק מעט הוחזר","w":["כמעט כל הכסף הוחזר לבעליו בתוך יומיים","אף אחד מהנהגים לא נעצר לאסוף את הכסף","המשטרה אספה את כל הכסף"],"e":"רק 100,000 דולר הוחזרו. השאלה: אילו סיטואציות גורמות לעזור ואילו לחמוד."}]},"q4":{"t":"t1","v":[{"q":"מתי הפסיכולוגיה החברתית הפכה לתחום תוסס?","a":"במלחמת העולם השנייה","w":["במאה ה־17, עם דקארט","בשנות ה־90 של המאה העשרים","עם המצאת המחשב"],"e":"הניסוי הראשון דווח ב־1898, בשנות ה־30 התגבשה צורתה, ובמלחמת העולם השנייה התחום פרח."}]},"q5":{"t":"t2","v":[{"q":"מה הראה משחק הפוטבול בין פרינסטון לדרטמות?","a":"אנחנו רואים את המציאות דרך האמונות שלנו","w":["סטודנטים מדווחים י תלוי?","a":"התמונה שהגברים ראו","w":["כמה עליזה וחמה הייתה השיחה של האישה","המשקל האמיתי של הסטודנטית בטלפון","אורך שיחת הטלפון"],"e":"החוקרים תפעלו את התמונה. ההתנהגות של הנשים בשיחה הייתה המשתנה התלוי."},{"q":"מה מבדיל בין הקצאה אקראית לדגימה אקראית?","a":"הקצאה עוזרת להסיק סיבתיות; דגימה עוזרת להכליל","w":["דגימה עוזרת להסיק סיבתיות; הקצאה עוזרת להכליל","אין הבדל, אלה שני שמות לאותו דבר","הקצאה רלוונטית רק לסקרים"],"e":"הקצאה אקראית יוצרת קבוצות שוות בניסוי. דגימה אקראית יוצרת מדגם שמייצג אוכלוסייה."}]},"q28":{"t":"t7","v":[{"q":"מה מצא הניסוי עם ״פאוור ריינג׳רס״?","a":"ילדים שצפו ביצעו פי 7 מעשי אלימות","w":["לא נמצא שום הבדל בין שתי הקבוצות","ילדים שצפו היו רגועים יותר אחר כך","רק בנים הושפעו מהצפייה"],"e":"הניסוי מראה שצפייה באלימות יכולה להיות אחת הסיבות להתנהגות אלימה."},{"q":"מה נקרא ״אפקט סינדרלה״ בפרק?","a":"הציפייה של האחר יצרה את ההתנהגות שציפה לה","w":["מי שמשנה סביבה משנה גם את ההתנהגות שלו","נשים מעדיפות נסיכים","קשה לזהות אדם מחוץ להקשר"],"e":"הנשים ש״נחשבו״ כבדות משקל דיברו בקרירות, בגלל האופן שבו הגברים דיברו איתן."}]},"q29":{"t":"t7","v":[{"q":"מהי ממשיות ניסויית?","a":"כמה הניסוי מעורר מעורבות אמיתית אצל המשתתפים","w":["כמה הניסוי דומה במראה החיצוני לחיי היומיום","כמה משתתפים יש בניסוי","כמה זמן נמשך הניסוי"],"e":"ממשיות ניסויית היא חובה. ממשיות יומיומית (דמיון שטחי) היא לא חובה."},{"q":"מהם מאפייני מצב הניסוי?","a":"רמזים למה שמצופה מהם","w":["המשתנים שהחוקר מתפעל בכל תנאי","התנאים הפיזיים של המעבדה","ההסבר שניתן בסוף הניסוי"],"e":"כדי למזער אותם מתקננים את ההוראות או משתמשים במחשב."}]},"q30":{"t":"t7","v":[{"q":"מה חובה לעשות בשיחת ההבהרה?","a":"להסביר הכל, כולל ההטעיה","w":["לבקש מהמשתתפים לחתום שוב על הסכמה","למחוק את כל הנתונים של המשתתפים","לשלם למשתתפים על הזמן"],"e":"אפשר להסתיר רק אם המידע יגרום מצוקה. המשתתפים צריכים לצאת בהרגשה טובה."},{"q":"מה מבין אלה אינו כלל אתי במחקר?","a":"להטעות תמיד, כדי לשמור על הממשיות","w":["לקבל הסכמה מדעת לפני תחילת המחקר","לשמור על סודיות המשתתפים","להגן מפגיעה ומאי־נוחות"],"e":"הטעיה מותרת רק כשהמטרה מצדיקה זאת, ולא בהיבטים שמשפיעים על ההסכמה להשתתף."}]},"q31":{"t":"t7","v":[{"q":"במה תרבויות נבדלות יותר, לפי הפרק?","a":"בתוכן, יותר מאשר בתהליך","w":["בתהליך, יותר מאשר בתוכן","הן לא נבדלות בכלל","רק בשפה"],"e":"אנשים מתרבויות שונות מחזיקים בדעות שונות, אבל מגבשים אותן באופן דומה."},{"q":"למה צריך זהירות בהכללה מהמעבדה?","a":"המעבדה פשוטה, והמשתתפים לרוב סטודנטים","w":["כי ממצאי מעבדה אף פעם לא נמצאים גם בשדה","כי אסור לחקור בני אדם במעבדה","כי במעבדה אין משתנים"],"e":"הממצאים מראים מה קורה כשכל השאר שווה, מצב שלא קיים במציאות. ובכל זאת, רבים מהם נמצאו גם בשדה."}]},"q32":{"t":"t7","v":[{"q":"מה מצא המחקר על בדידות בפורטו ריקו ובארה״ב?","a":"המרכיבים זהים, אף שרמת הבדידות שונה","w":["אין בדידות בפורטו ריקו בכלל, רק בארה״ב","המרכיבים שונים לגמרי","רמת הבדידות זהה בשתי התרבויות"],"e":"ביישנות, היעדר מטרה והערכה עצמית נמוכה בשתיהן. התהליך משותף, התוכן שונה."}]}};
const H={"h1":{"t":"t1","v":[{"q":"שלושה חוקרים בודקים אלימות. אחד שואל ״למה בעיר מסוימת יש יותר אלימות?״, השני ״איזה טיפוס נוטה לאלימות?״, והשלישי ״מה במצב גורם לאדם רגיל להתנהג באלימות?״. מי מהם פסיכולוג חברתי?","a":"השלישי, כי הוא בודק איך המצב משפיע על כל אדם","w":["הראשון, כי הוא בודק את ההשפעה של החברה על האלימות","השני, כי הוא בודק את ההבדלים בין אנשים שונים","כולם, כי כולם חוקרים התנהגות שקשורה לאנשים אחרים"],"e":"הראשון הוא סוציולוג (קבוצות וחברות), השני פסיכולוג של האישיות (הבדלים בין אנשים). פסיכולוג חברתי שואל מה במצב משפיע על כל אחד מאיתנו."},{"q":"מה המסר של סיפור סינדרלה בפתיחת הפרק?","a":"הסיטואציה מעצבת אותנו ואת מה שאחרים רואים בנו","w":["האישיות של אדם נשארת קבועה בכל מצב שבו הוא נמצא","אנשים טובים מצליחים בסוף, גם כשהסביבה קשה להם","המשפחה היא הגורם היחיד שמעצב את האישיות שלנו"],"e":"בבית סינדרלה כנועה, ובנשף היא בטוחה בעצמה. הנסיך לא מזהה אותה בבית. המצב שינה גם אותה וגם את מה שראו בה."}]},"h2":{"t":"t1","v":[{"q":"במה הפסיכולוגיה החברתית שונה מהפסיכולוגיה של האישיות?","a":"היא חוקרת מה משותף לכולנו, פחות במה אנשים שונים","w":["היא חוקרת קבוצות וחברות שלמות, ולא את האדם היחיד","היא לא משתמשת בניסויים, אלא רק בשאלונים וראיונות","היא חוקרת רק אנשים עם קשיים נפשיים ובעיות התנהגות"],"e":"פסיכולוגיית האישיות שואלת במה אנשים שונים. הפסיכולוגיה החברתית שואלת איך כל אחד מאיתנו מושפע מאחרים ומהמצב."}]},"h3":{"t":"t2","v":[{"q":"אוהדים של שתי קבוצות צופים באותו סרטון של משחק, וכל צד ״רואה״ יותר עבירות של היריב. איזה רעיון מרכזי זה מדגים?","a":"אנחנו בונים את המציאות החברתית לפי הפרשנות שלנו","w":["לאינטואיציה יש כוח, והיא תמיד מובילה לטעות","להתנהגות החברתית יש שורשים ביולוגיים במוח","הנטיות האישיות שלנו חזקות יותר מכל סיטואציה"],"e":"זה מחקר פרינסטון מול דרטמות: אותו סרטון, שתי ״מציאויות״. אנחנו לא רואים את העולם כמו שהוא אלא כמו שאנחנו מפרשים אותו."},{"q":"שני אנשים צופים באותו ויכוח פוליטי בטלוויזיה, וכל אחד בטוח שהמועמד שלו ניצח. איזה רעיון מרכזי מתאים?","a":"אנחנו בונים את המציאות לפי מה שכבר מאמינים בו","w":["השפעות חברתיות מעצבות את ההתנהגות שלנו מול אחרים","העמדות שלנו לא משפיעות על מה שאנחנו רואים בפועל","אפשר ליישם את הידע הפסיכולוגי בפוליטיקה ובבחירות"],"e":"כל אחד מפרש את אותו אירוע לפי מה שהוא כבר מאמין בו."}]},"h4":{"t":"t2","v":[{"q":"אחרי פיגוע באוטובוס, אישה מפסיקה לנסוע באוטובוסים ונוסעת רק ברכב פרטי, למרות שתאונות דרכים מסוכנות יותר. איזה רעיון מרכזי זה מדגים?","a":"האינטואיציה מהירה ומועילה, אבל לפעמים מטעה אותנו","w":["הסיטואציה מעצבת את ההתנהגות, ולכן הבחירה שלה נכונה","להתנהגות יש שורשים ביולוגיים, ולכן הפחד הוא תורשתי","הנטיות האישיות שלה חזקות יותר מכל השפעה חברתית"],"e":"זה כמו הפחד מטיסות אחרי 11 בספטמבר: תחושה אוטומטית ומהירה גוברת על החישוב של הסיכון האמיתי."}]},"h5":{"t":"t2","v":[{"q":"נלסון מנדלה יצא אחרי 27 שנות כלא ובחר בפיוס ולא בנקמה. איזה רעיון מרכזי זה מדגים?","a":"גם העמדות והאישיות מעצבות התנהגות, לא רק המצב","w":["הסיטואציה קובעת לגמרי את ההתנהגות של כל אדם","אנחנו בונים את המציאות, ולכן הכלא לא השפיע עליו","האינטואיציה מטעה, ולכן הוא טעה כשבחר בפיוס"],"e":"המצב (כלא) היה עשוי להוביל לנקמה, אבל הערכים שלו הובילו להתנהגות אחרת. הסיטואציה חזקה, אבל לא הכול."}]},"h6":{"t":"t2","v":[{"q":"מה הכוונה במשפט ״אנחנו יצורים ביו־פסיכו־חברתיים״?","a":"ההתנהגות נובעת מביולוגיה, מנפש ומחברה שפועלות יחד","w":["הביולוגיה קובעת את ההתנהגות, והחברה רק מגבירה אותה","הנפש והחברה חשובות, והגוף משפיע רק במחלה","יש אנשים ביולוגיים ויש אנשים חברתיים, לפי האישיות"],"e":"זה הרעיון המרכזי החמישי: המוח והגוף משתתפים בכל התנהגות חברתית, יחד עם המחשבות ועם הסביבה."}]},"h7":{"t":"t3","v":[{"q":"בשנות ה־40, כשהפשיזם השתולל באירופה, הרבה פסיכולוגים חברתיים חקרו דעות קדומות. איך הערכים השפיעו כאן?","a":"בגלוי: הם קבעו אילו נושאים נבחרו למחקר","w":["בסמוי: הם שינו את התוצאות של המחקרים","בגלוי: הם קבעו איך מגדירים בריאות נפשית","בסמוי: הם קבעו את התוויות שנתנו לנבדקים"],"e":"בחירת נושאים לפי מה שמטריד את החברה היא השפעה גלויה של ערכים. ההשפעות הסמויות הן בתוויות, בהגדרות ובציפיות."}]},"h8":{"t":"t3","v":[{"q":"עיתון אחד כותב ״מחבלים״ ועיתון אחר כותב ״לוחמי חופש״ על אותם אנשים. מה זה מדגים לפי הפרק?","a":"השפעה סמויה של ערכים דרך תוויות שכבר כוללות שיפוט","w":["השפעה גלויה של ערכים דרך בחירת נושא המחקר","הטיית החכמה בדיעבד, כי כל צד ידע מראש מה יקרה","כשל במדגם, כי כל עיתון שאל קוראים אחרים"],"e":"המילה עצמה מכילה עמדה. כך גם ״ביישן״ מול ״זהיר״, או ״רווחה״ מול ״סיוע לנזקקים״."},{"q":"מי שמסתכל על תמונה מטושטשת לא רואה בה כלום, עד שאומרים לו שיש בה כלב, ואז הוא לא יכול להפסיק לראות אותו. מה הלקח למדע?","a":"הציפיות של החוקר משפיעות על מה שהוא רואה בנתונים","w":["המדע לא יכול להגיע לאמת, ולכן אין טעם במחקר","צריך לתת לנבדקים הסבר מלא לפני כל ניסוי","התמונות במחקרים צריכות להיות ברורות וחדות יותר"],"e":"זו השפעה סמויה של ערכים ומושגים מוקדמים: מה שאנחנו מצפים לראות קובע את מה שאנחנו רואים. לכן צריך בדיקה שיטתית וחוקרים שונים."}]},"h9":{"t":"t3","v":[{"q":"לפי הספר, אם ערכים נכנסים למחקר, מה צריך לעשות?","a":"לבדוק רעיונות בשיטתיות, עם חוקרים בעלי עמדות שונות","w":["להפסיק לחקור נושאים שקשורים לערכים או לפוליטיקה","לסמוך על השכל הישר, כי הוא פחות מוטה מהמדע","לפרסם רק מחקרים שהתוצאות שלהם ברורות מאליהן"],"e":"הערכים לא פוסלים את המדע. להפך: בגלל שכולנו מפרשים, צריך שיטה שבודקת את הרעיונות."}]},"h10":{"t":"t4","v":[{"q":"אחרי שהקבוצה שלו הפסידה, אוהד אומר: ״היה ברור מההתחלה שהמאמן בחר הרכב גרוע״. אבל לפני המשחק הוא לא אמר כלום. מה ההטיה?","a":"הטיית החכמה בדיעבד: אחרי שיודעים, התוצאה נראית צפויה","w":["אפקט הזרקור: הוא חושב שכולם שמו לב לטעות","הטיה לטובת העצמי: הוא לוקח קרדיט על מה שקרה","מאפייני מצב הניסוי: הוא ניחש מה רוצים לשמוע ממנו"],"e":"לפני המשחק ההרכב לא נראה ״גרוע ברור״. רק הידיעה של התוצאה גורמת לו להיראות ככה."},{"q":"סטודנטית קוראת סיכום ומרגישה ״זה ברור, אני יודעת את זה״, ואז במבחן לא מצליחה לענות. מה ההסבר לפי הפרק?","a":"חכמה בדיעבד: עם התשובה מולך היא נראית ברורה","w":["חוסר בממשיות ניסויית, כי המבחן לא דומה לחיים","מתאם שלילי בין זמן הקריאה לבין הציון במבחן","השפעה סמויה של ערכים על האופן שבו נכתב הסיכום"],"e":"כשהתשובה לפנייך היא נראית מובנת. במבחן, בלי התשובה, מגלים שלא באמת ידעת לנבא אותה."}]},"h11":{"t":"t4","v":[{"q":"לזרספלד הציג לאנשים ממצא על חיילים, ואז את הממצא ההפוך, וגם הוא נשמע להם ״ברור״. מה הוא הראה?","a":"שהשכל הישר יכול להסביר כל תוצאה אחרי שהיא ידועה","w":["שחיילים משכילים מסתגלים לצבא טוב יותר מאחרים","שהשכל הישר תמיד טועה, ולכן אסור לסמוך עליו","שאנשים לא מבינים ממצאים מדעיים בכלל"],"e":"אם גם ממצא וגם ההפך שלו נשמעים מובנים, אז התחושה ״ברור״ לא אומרת שהממצא היה צפוי. בשביל זה צריך מחקר."}]},"h12":{"t":"t4","v":[{"q":"אחרי טעות באבחנה, רופאים שיודעים מה הייתה סיבת המוות תוהים איך הרופא המטפל פספס. מה המחיר של ההטיה כאן?","a":"האשמה לא הוגנת של מי שהחליט בלי לדעת את התוצאה","w":["יהירות של הרופא המטפל, שחשב שהוא יודע יותר מדי","ניסוח מוטה של שאלות האבחון שנשאלו בבית החולים","בחירת מדגם לא מייצג של מטופלים לבדיקה"],"e":"מה שברור אחרי שיודעים לא היה ברור אז. ההטיה גורמת להאשים אחרים (וגם את עצמנו) בצורה לא הוגנת."}]},"h13":{"t":"t5","v":[{"q":"חבר אומר: ״אבולוציה זו רק תאוריה, היא לא עובדה״. מה הטעות שלו לפי הפרק?","a":"תאוריה לא ״פחות מעובדה״: היא מסבירה עובדות","w":["אין טעות, כי תאוריה היא ניחוש שעוד לא נבדק","תאוריה היא השערה אחת שאפשר לבדוק בניסוי","תאוריה היא עובדה, ולכן אי אפשר להפריך אותה"],"e":"עובדות הן מה שנצפה. תאוריה מארגנת אותן, מסבירה אותן ומנבאת. מהתאוריה נגזרות השערות שאפשר להפריך."}]},"h14":{"t":"t5","v":[{"q":"מחקר מצא שאנשים שאוכלים ארוחת בוקר מצליחים יותר בעבודה. מה מותר להסיק?","a":"שיש קשר, אבל לא ידוע מה גורם למה","w":["שארוחת בוקר משפרת את ההצלחה בעבודה","שהצלחה בעבודה גורמת לאנשים לאכול בבוקר","שאין קשר אמיתי, כי זה מחקר מתאמי"],"e":"מתאם לא מוכיח סיבתיות. אפשר ש־X גורם ל־Y, ש־Y גורם ל־X, או שמשהו שלישי (סדר יום מסודר) גורם לשניהם."},{"q":"חוקרים בגלזגו מצאו שמי שהמצבה שלו גבוהה יותר חי בממוצע יותר שנים. מה ההסבר הסביר?","a":"משתנה שלישי: עושר גרם למצבה גבוהה ולחיים ארוכים","w":["מצבה גבוהה גרמה למשפחה לדאוג לבריאות של המת","חיים ארוכים גרמו לאנשים לבקש מצבה גבוהה יותר","הקשר מקרי לגמרי, ואין לו שום הסבר אפשרי"],"e":"זו הדוגמה הקלאסית לכך שמתאם לא מוכיח סיבתיות. מי שהיה עשיר יכול היה לקנות מצבה גבוהה וגם חי בתנאים טובים."}]},"h15":{"t":"t5","v":[{"q":"נמצא קשר בין הערכה עצמית להישגים. כשניכו את המשכל ואת המעמד של המשפחה, הקשר נעלם. מה זה מרמז?","a":"ייתכן שמשתנה שלישי גרם לשני המשתנים יחד","w":["הערכה עצמית גבוהה גורמת להישגים טובים יותר","הישגים טובים גורמים להערכה עצמית גבוהה יותר","הקשר היה חזק במיוחד, ולכן הוא סיבתי"],"e":"כשקשר נעלם אחרי ניכוי משתנה, זה רומז שהמשתנה הזה (Z) הסביר את הקשר. זו האפשרות השלישית מתוך השלוש."}]},"h16":{"t":"t5","v":[{"q":"מקדם המתאם בין הערכה עצמית לדיכאון הוא בערך <span dir=\"ltr\">r = −0.6</span>. מה זה אומר?","a":"קשר חזק והפוך: יותר הערכה עצמית, פחות דיכאון","w":["אין קשר, כי המספר שלילי ונמוך מאפס","קשר חלש, כי המספר רחוק מ־1.0+","הערכה עצמית נמוכה גורמת לדיכאון אצל כולם"],"e":"הסימן מראה כיוון (שלילי = הפוך), והמספר עוצמה. 0.6 הוא קשר חזק. וזה עדיין מתאם, לא סיבתיות."}]},"h17":{"t":"t6","v":[{"q":"בלוג אופנה שואל את הקוראים שלו ״כמה כסף אתם מוציאים על בגדים בחודש?״, ומפרסם שזה הממוצע בישראל. מה הבעיה?","a":"המדגם לא מייצג: ענו רק קוראי הבלוג שבחרו לענות","w":["הניסוח של השאלה מוטה ומכוון לתשובה מסוימת","המדגם קטן מדי, ולכן אי אפשר ללמוד ממנו כלום","סדר השאלות בסקר השפיע על התשובות"],"e":"זה כמו הסקר של אן לנדרס: מי שבוחר לענות שונה ממי שלא. המדגם לא אקראי, ולכן לא מייצג את כל האוכלוסייה."}]},"h18":{"t":"t6","v":[{"q":"סקר אחד שואל על ״סיוע לנזקקים״ וסקר אחר על ״רווחה״, ומתקבלות תוצאות שונות מאוד. מה זה מדגים?","a":"הניסוח של השאלה משפיע על התשובה","w":["המדגם בסקר הראשון לא היה מייצג","סדר השאלות היה שונה בשני הסקרים","אנשים לא עונים בכנות על שאלות פוליטיות"],"e":"23% אמרו שמוציאים יותר מדי על ״סיוע לעניים״, ו־53% על ״רווחה״. אותו דבר, מילה אחרת."},{"q":"חברת ביטוח מציגה תוכנית כ״95% מהלקוחות מרוצים״ ולא כ״5% לא מרוצים״. מה העיקרון?","a":"מסגור: אופן ההצגה משנה את ההתרשמות","w":["ברירת מחדל: אנשים נשארים עם מה שהוצע להם","מדגם אקראי: כל לקוח היה יכול להיבחר","אפשרויות תשובה: הרשימה מכוונת את הבחירה"],"e":"אותו נתון נשמע אחרת לפי המסגרת. ״95% הצלחה״ נשמע טוב יותר מ״5% כישלון״."}]},"h19":{"t":"t6","v":[{"q":"מקום עבודה הפך את ההצטרפות לחיסכון פנסיוני לאוטומטית (מי שלא רוצה צריך לבטל), ושיעור החוסכים ז const SUM=`<h2>סיכום: מאיירס פרק 1 - מבוא לפסיכולוגיה חברתית</h2>
<div class="key"><b>למה הפרק הזה חשוב?</b> זה פרק המבוא של הקורס, והוא נותן את ״המשקפיים״ לכל השאר. הספר פותח בסיפור סינדרלה: בבית, ליד האם החורגת, היא כנועה ולא מושכת. בנשף היא מרגישה יפה, מתנהגת בהתאם, והנסיך שפגש אותה שם לא מזהה אותה כשהוא רואה אותה בבית. המסר: <b>הסיטואציה מעצבת אותנו</b>. או, במילים של הפילוסוף סארטר שהספר מצטט: אי אפשר להבין בני אדם בנפרד מהמצבים שבהם הם נמצאים.<br><br>
<b>השאלה של הפרק במשפט אחד:</b> מה חוקרת הפסיכולוגיה החברתית, ואיך היא בודקת את הרעיונות שלה כך שלא יהיו ״סתם שכל ישר״?<br><br>
<b>הפרק בנוי מארבעה חלקים:</b><br>
① <b>מה התחום ומה הרעיונות המרכזיים שלו</b> (סעיפים 1–2).<br>
② <b>ערכים</b> (סעיף 3): גם מדענים הם בני אדם, והערכים שלהם נכנסים למחקר.<br>
③ <b>״ידעתי את זה מזמן״</b> (סעיף 4): למה ממצאים נראים מובנים מאליהם, ולמה בכל זאת צריך מחקר.<br>
④ <b>שיטות המחקר</b> (סעיפים 5–7): מחקר מתאמי, סקר וניסוי, ומה מותר להסיק מכל אחד.<br>
<b>בשיעור:</b> מפגשים 1–2.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>סיטואציה</b></td><td>המצב שבו אדם נמצא: מי נמצא סביבו, איפה הוא, מה קורה.</td></tr>
<tr><td><b>תאוריה</b></td><td>רעיון מסודר שמסביר הרבה עובדות ומנבא מה יקרה.</td></tr>
<tr><td><b>השערה</b></td><td>ניבוי שנגזר מתאוריה ושאפשר לבדוק: ״אם X, אז Y״.</td></tr>
<tr><td><b>משתנה</b></td><td>כל דבר שאפשר למדוד ושיכול להשתנות: הערכה עצמית, ציון, תוקפנות.</td></tr>
<tr><td><b>מתאם</b></td><td>קשר בין שני משתנים: כשאחד עולה, השני עולה (או יורד).</td></tr>
<tr><td><b>סיבתיות</b></td><td>שדבר אחד <b>גורם</b> לדבר אחר, ולא רק מופיע איתו.</td></tr></table></div>

<h3>1. מהי פסיכולוגיה חברתית</h3>
<p><b>ההגדרה:</b> החקירה ה<b>מדעית</b> של האופן שבו אנשים <b>חושבים</b> על אחרים, <b>משפיעים</b> זה על זה, ו<b>מתייחסים</b> זה לזה.</p>
<div class="ex"><b>במה היא שונה מתחומים קרובים:</b><br>
<b>לעומת סוציולוגיה</b>, שחוקרת קבוצות וחברות שלמות: הפסיכולוגיה החברתית מתמקדת יותר ב<b>אדם היחיד</b> ומשתמשת יותר ב<b>ניסויים</b>.<br>
<b>לעומת פסיכולוגיה של האישיות</b>, שחוקרת במה אנשים שונים זה מזה: הפסיכולוגיה החברתית מתעניינת פחות בהבדלים, ויותר במה ש<b>משותף</b> לכולנו, למשל איך <b>כל</b> אדם מושפע מקבוצה.<br>
<b>דוגמה:</b> סוציולוג ישאל ״למה בעיר מסוימת יש יותר אלימות?״. פסיכולוג של האישיות ישאל ״איזה טיפוס נוטה לאלימות?״. פסיכולוג חברתי ישאל ״מה במצב גורם לאדם רגיל להתנהג באלימות?״.</div>
<p>זה מדע צעיר: הניסוי הראשון פורסם ב־1898, והתחום התפתח בעיקר ממלחמת העולם השנייה.</p>

<h3>2. ששת הרעיונות המרכזיים</h3>
<p>הספר מציג שישה רעיונות שחוזרים לאורך כל הקורס. כדאי להכיר אותם כבר עכשיו, כי כמעט כל פרק הוא פירוט של אחד מהם. לפי הסיכום של הספר, הם מתחלקים לשלוש שאלות: איך אנחנו <b>מבינים</b> את העולם החברתי, מה <b>מעצב</b> את ההתנהגות שלנו, ואיך <b>מיישמים</b> את הידע.</p>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">1. אנחנו ״בונים״ את המציאות החברתית</b><br>
<b>הרעיון:</b> אנחנו לא רואים את העולם כמו שהוא, אלא כמו שאנחנו מפרשים אותו.<br>
<b>דוגמה מהספר:</b> אחרי משחק פוטבול קשוח בין פרינסטון לדרטמות, הסטודנטים של כל צד ״ראו״ בסרטון יותר עבירות של הצד השני. אותו סרטון, שני משחקים שונים.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">2. האינטואיציה מועילה, ולפעמים מסוכנת</b><br>
<b>הרעיון:</b> חלק גדול מהחשיבה שלנו אוטומטי ומהיר, וחלק מודע ואיטי (״עיבוד דואלי״). האינטואיציה בדרך כלל עוזרת, אבל לפעמים מטעה.<br>
<b>דוגמה מהספר:</b> אחרי 11 בספטמבר אנשים פחדו לטוס ונסעו ברכב, למרות שטיסה בטוחה בהרבה מנהיגה.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">3. השפעות חברתיות מעצבות את ההתנהגות</b><br>
<b>הרעיון:</b> אנחנו יצורים חברתיים, ומושפעים מאוד מאנשים אחרים ומהתרבות.<br>
<b>דוגמה:</b> סטודנטים מבלים קרוב ל־30% מזמנם בשיחה עם אחרים. והתרבות מגדירה בשבילנו את המצבים: מה נחשב מנומס, מה נחשב יפה.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">4. גם העמדות והאישיות שלנו מעצבות את ההתנהגות</b><br>
<b>הרעיון:</b> הסיטואציה חזקה, אבל לא הכול. אנשים שונים מגיבים אחרת לאותו מצב.<br>
<b>דוגמה מהספר:</b> נלסון מנדלה ישב בכלא 27 שנה, ובכל זאת כשיצא בחר בפיוס ולא בנקמה.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">5. להתנהגות החברתית יש שורשים ביולוגיים</b><br>
<b>הרעיון:</b> המוח והגוף משתתפים בכל מה שאנחנו מרגישים ועושים כלפי אחרים. ״מדעי העצב החברתיים״ חוקרים את זה. לכן אנחנו יצורים <b>ביו־פסיכו־חברתיים</b>: ביולוגיה, נפש וחברה ביחד.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">6. אפשר ליישם את הידע בחיי היומיום</b><br>
<b>הרעיון:</b> הממצאים עוזרים בבריאות, במשפט, באיכות הסביבה ועוד.</div>
<div class="ex"><b>סינדרלה מדגימה כמה רעיונות יחד:</b> הסיטואציה (בית מול נשף) שינתה אותה (רעיון 3). אבל גם האופן שבו <b>היא עצמה</b> פירשה את המצב, כשהרגישה יפה (רעיון 1), והאופן שבו הנסיך ״ראה״ אותה בכל מקום.</div>

<h3>3. ערכים: גם המדע הוא עבודה של בני אדם</h3>
<p>מדע אמור להיות אובייקטיבי: הראיות מחליטות, לא הדעות. אבל פסיכולוגים חברתיים הם בני אדם, ויש להם <b>ערכים</b>, כלומר אמונות על מה רצוי ואיך צריך להתנהג. הספר מראה שהערכים נכנסים למחקר בשתי דרכים:</p>
<div class="ex"><b>1. בגלוי: בבחירת הנושאים</b><br>
חוקרים בוחרים לחקור מה שמטריד את החברה בזמנם. בשנות ה־40, כשהפשיזם השתולל באירופה, חקרו דעות קדומות. בשנות ה־60, עם המהומות והפשיעה, חקרו תוקפנות. בשנות ה־70, עם התנועה הפמיניסטית, חקרו מגדר. גם <b>מי</b> נמשך לכל תחום תלוי בערכים. ובאירופה, שם הקבוצה חשובה יותר, פותחה תאוריית הזהות החברתית, בעוד שבארצות הברית התמקדו ביחיד.</div>
<div class="ex"><b>2. בסמוי: בהנחות שלא שמים לב אליהן</b><br>
• <b>במה שאנחנו ״רואים״:</b> מי שמסתכל על תמונה מטושטשת של כתמים לא רואה כלום, עד שאומרים לו ״יש כאן כלב דלמטי״, ואז הוא לא יכול להפסיק לראות אותו. כך גם מדענים: מה שהם מצפים לראות משפיע על מה שהם רואים.<br>
• <b>במילים ובתוויות:</b> אותו אדם הוא ״מחבל״ או ״לוחם חופש״, לפי נקודת המבט. ילד שקט הוא ״ביישן״ או ״זהיר״. סיוע לעניים נקרא ״רווחה״ או ״סיוע לנזקקים״. המילה כבר מכילה שיפוט.<br>
• <b>בעצות ובהגדרות:</b> גם הגדרה של ״אדם בריא בנפשו״ או עצה של פסיכולוג על איך לחיות משקפות ערכים.</div>
<p><b>אז מה עושים?</b> לפי הספר, זו לא סיבה לפסול את המדע. להפך: <b>דווקא בגלל</b> שכולנו מפרשים, צריך לבדוק את הרעיונות בצורה שיטתית מול העובדות, ושיהיו חוקרים עם נקודות מבט שונות, שיבדקו זה את זה.</p>

<h3>4. ״ידעתי את זה מזמן״: הטיית החכמה בדיעבד</h3>
<p>אחרי שקוראים ממצא בפסיכולוגיה, הרבה פעמים חושבים ״נו, זה ברור״. הספר מסביר למה התחושה הזו מטעה.</p>
<div class="ex"><b>הניסוי של לזרספלד:</b> הוא הציג לאנשים ממצאים ״ברורים״ על חיילים במלחמת העולם השנייה, למשל ״חיילים משכילים התקשו יותר להסתגל לצבא״. כולם אמרו ״כמובן, אנשים משכילים פחות רגילים לתנאים קשים״. ואז הוא גילה שהממצאים האמיתיים היו <b>הפוכים</b>, ושגם הם נשמעים ״ברורים״ באותה מידה.</div>
<div class="ex"><b>הטיית החכמה בדיעבד</b> (פישהוף) = אחרי שיודעים מה קרה, זה נראה כאילו היה צפוי מראש.<br>
<b>עוד דוגמה:</b> ״הפכים נמשכים״ נשמע נכון, וגם ״מצא מין את מינו״ נשמע נכון. החוקר טייגן הראה שאנשים מדרגים גם פתגם וגם את ההפך שלו כנכונים. כלומר השכל הישר יכול ״להסביר״ כל תוצאה, אחרי שהיא כבר ידועה.<br>
<b>אצל סטודנטים:</b> קוראים את הסיכום ומרגישים ״הבנתי, זה ברור״, ואז במבחן מגלים שלא באמת ידעו.</div>
<p><b>המחיר של ההטיה:</b></p>
<ul>
<li><b>יהירות:</b> אנחנו חושבים שאנחנו יודעים יותר ממה שאנחנו יודעים.</li>
<li><b>האשמה לא הוגנת של אחרים:</b> אחרי המשבר הכלכלי של 2008 ״היה ברור״ שהיה צריך לפקח על הבנקים, אבל אף אחד לא חזה את זה מראש. רופאים שיודעים מה הייתה סיבת המוות תוהים איך הרופא המטפל טעה באבחנה, אבל רופאים שמקבלים רק את התסמינים לא חושבים שהאבחנה הייתה ברורה כל כך.</li>
<li><b>האשמה עצמית:</b> ״הייתי צריכה לדעת שאהיה עמוסה, הייתי צריכה להתחיל את העבודה קודם״. אבל מה שברור עכשיו לא היה ברור אז.</li>
</ul>
<p><b>המסקנה של הספר:</b> השכל הישר לא תמיד טועה. לרוב הוא אפילו צודק. אבל בגלל שהוא נשמע נכון <b>אחרי</b> שיודעים, קל לנו להטעות את עצמנו. בשביל זה צריך <b>מדע</b>: כדי לבדוק <b>לפני</b> שיודעים מה התשובה.</p>

<h3>5. תאוריה ומחקר מתאמי</h3>
<p>עכשיו לשאלה איך בודקים. הספר מתחיל במושגי יסוד:</p>
<ul>
<li><b>תאוריה</b> מסכמת הרבה עובדות לכמה רעיונות, מסבירה אותן ומנבאת. היא לא ״פחות מעובדה״, כמו שאומרים ״זו רק תאוריה״. היא מה שנותן משמעות לעובדות. החוקר קורט לוין אמר: ״אין דבר מעשי יותר מתאוריה טובה״.</li>
<li><b>השערה</b> היא ניבוי שנגזר מהתאוריה, ושאפשר לבדוק ו<b>להפריך</b>.</li>
</ul>
<h4>מחקר מתאמי</h4>
<p><b>הרעיון:</b> מודדים שני משתנים כמו שהם בטבע, בלי לשנות כלום, ובודקים אם הם קשורים.</p>
<div class="ex"><b>הדוגמה מהספר: המצבות בגלזגו.</b> חוקרים מדדו את הגובה של מצבות בבית קברות, וגילו שמי שהמצבה שלו גבוהה יותר חי בממוצע יותר שנים. האם מצבה גבוהה מאריכה חיים? ברור שלא. ההסבר: מי שהיה עשיר יותר יכול היה לקנות מצבה גבוהה, וגם חי בתנאים טובים יותר. <b>מתאם לא מוכיח סיבתיות.</b></div>
<p>כשמוצאים קשר בין X ל־Y, יש <b>שלוש אפשרויות</b>. הספר מדגים אותן על הקשר בין הערכה עצמית להישגים בבית הספר:</p>
<div class="ex">① <b>X גורם ל־Y:</b> הערכה עצמית גבוהה משפרת הישגים. על בסיס האמונה הזו נחקקו בארצות הברית 170 חוקים לחיזוק הערכה עצמית של תלמידים.<br>
② <b>Y גורם ל־X:</b> הישגים טובים מעלים את ההערכה העצמית. במחקר בנורווגיה, ציונים טובים הובילו להערכה עצמית גבוהה יותר.<br>
③ <b>משהו שלישי (Z) גורם לשניהם:</b> כשהחוקרים ניכו את המשכל ואת המעמד של המשפחה, הקשר בין הערכה עצמית להישגים <b>נעלם</b>. כלומר, ייתכן שאינטליגנציה ומעמד גורמים גם להערכה עצמית וגם להישגים.</div>
<div class="ex"><b>מקדם המתאם (r)</b> נע בין 1.0− ל־1.0+. הסימן אומר כיוון, והמספר אומר עוצמה. למשל, הקשר בין הערכה עצמית לדיכאון הוא בערך <span dir="ltr">r = −0.6</span>: קשר חזק, בכיוון הפוך. יותר הערכה עצמית, פחות דיכאון.<br>
<b>כלים שעוזרים, אבל לא מוכיחים:</b> מדידה של אותם אנשים בשני זמנים (מתאם מושהה), ו״ניכוי״ סטטיסטי של משתנים אחרים, יכולים <b>לרמוז</b> על סיבתיות, אבל לא להוכיח אותה.</div>

<h3>6. סקרים</h3>
<p>סקר הוא דרך נפוצה לאסוף מידע מתאמי. כדי שסקר יהיה שווה משהו, צריך לשים לב לשני דברים: <b>את מי</b> שואלים, ו<b>איך</b> שואלים.</p>
<h4>את מי שואלים: מדגם מייצג</h4>
<div class="ex"><b>מדגם אקראי</b> = לכל אדם באוכלוסייה יש סיכוי שווה להיבחר. כך המדגם ״נראה כמו״ כל האוכלוסייה. מספיקים 1,200 אנשים כדי לקבל תוצאה מדויקת בטווח של 3% על כל המדינה.<br>
<b>שני כשלים מפורסמים:</b><br>
• <b>אן לנדרס</b>, כותבת טור עצות, שאלה קוראות אם היו מתחתנות שוב עם בעליהן, ורובן כתבו שלא. אבל ענו רק מי שבחרו לכתוב, ומי שכועסת על בעלה נוטה יותר לכתוב.<br>
• <b>Literary Digest</b> ניבא ב־1936 את המועמד הלא נכון לנשיאות, למרות שענו לו מיליוני אנשים. הוא שאל רק בעלי טלפון ורכב, כלומר בעיקר עשירים.<br>
<b>הלקח:</b> מדגם ענק שלא מייצג גרוע ממדגם קטן שמייצג.</div>
<h4>איך שואלים: הניסוח משנה את התשובה</h4>
<div class="ex">• <b>סדר השאלות:</b> שאלה אחת ״מכינה״ את התשובה לבאה אחריה.<br>
• <b>אפשרויות התשובה:</b> כשנתנו לאנשים רשימה, 41% בחרו ״גרעין״ כבעיה חשובה. כששאלו שאלה פתוחה, רק 21% חשבו על זה.<br>
• <b>ניסוח:</b> רק 23% חשבו שמוציאים יותר מדי על ״סיוע לעניים״, אבל 53% חשבו שמוציאים יותר מדי על ״רווחה״. אותו דבר, מילה אחרת.<br>
• <b>אופן ההצגה:</b> ״95% הצלחה״ נשמע הרבה יותר טוב מ״5% כישלון״.<br>
• <b>ברירת מחדל:</b> כשהצטרפות לתוכנית פנסיה הייתה אוטומטית (ומי שלא רוצה צריך לבטל), שיעור החוסכים קפץ מ־49% ל־86%. כך גם בתרומת איברים.</div>

<h3>7. ניסוי, אתיקה והכללה</h3>
<p>מחקר מתאמי לא מוכיח מה גורם למה. בשביל זה פסיכולוגים חברתיים מעדיפים <b>ניסויים</b>: יוצרים ״מציאות קטנה״ שבה הם שולטים, משנים דבר אחד, ובודקים מה קורה.</p>
<div class="ex"><b>שני מונחים:</b><br>
<b>משתנה בלתי תלוי</b> = מה שהחוקר <b>משנה</b> בעצמו.<br>
<b>משתנה תלוי</b> = מה שהחוקר <b>מודד</b> אחרי זה.<br><br>
<b>״אפקט סינדרלה״, ניסוי מהספר:</b> גברים שוחחו בטלפון עם אישה. לחלקם אמרו שהיא שמנה (משתנה בלתי תלוי). הם דיברו איתה בקרירות, וכתוצאה מזה <b>היא</b> נעשתה קרירה (משתנה תלוי). הציפייה שלהם יצרה את ההתנהגות שלה, בדיוק כמו האם החורגת של סינדרלה.<br>
<b>ניסוי נוסף:</b> ילדים שצפו בתוכנית ״פאוור ריינג׳רס״ התנהגו מיד אחרי זה באלימות <b>פי 7</b> יותר מילדים שלא צפו.</div>
<div class="tw"><table><tr><th></th><th>הקצאה אקראית</th><th>דגימה אקראית</th></tr>
<tr><td><b>מה עושים</b></td><td>מחלקים את המשתתפים לקבוצות בהגרלה</td><td>בוחרים בהגרלה מי ישתתף במחקר</td></tr>
<tr><td><b>מה זה מאפשר</b></td><td>להסיק <b>סיבתיות</b>, כי הקבוצות דומות</td><td>להכליל לכל <b>האוכלוסייה</b></td></tr>
<tr><td><b>איפה</b></td><td>בניסוי</td><td>בעיקר בסקר</td></tr></table></div>
<div class="ex"><b>שני סוגי ״ממשיות״ (עד כמה הניסוי דומה לחיים):</b><br>
<b>ממשיות יומיומית</b> = הניסוי <b>נראה</b> כמו החיים (למשל בחדר שנראה כמו סלון). זה <b>לא</b> הכרחי.<br>
<b>ממשיות ניסויית</b> = המשתתפים <b>באמת מעורבים</b> ומתייחסים לניסוי ברצינות. זה <b>הכרחי</b>.<br>
<b>מאפייני מצב הניסוי:</b> רמזים שגורמים למשתתפים לנחש מה החוקר ״רוצה״, ולהתנהג בהתאם. כדי למנוע את זה, בערך שליש מהמחקרים משתמשים ב<b>הטעיה</b>.</div>
<p><b>אתיקה:</b> הסכמה מדעת (המשתתף יודע מספיק כדי להחליט), יושר, הגנה מפגיעה, סודיות, ו<b>שיחת הבהרה</b> בסוף, שבה מסבירים מה נבדק באמת.</p>
<div class="ex"><b>הכללה בין תרבויות:</b> תרבויות שונות זו מזו בעיקר ב<b>תוכן</b> (מה אנשים חושבים), פחות ב<b>תהליך</b> (איך הם חושבים).<br>
<b>דוגמה מהספר:</b> סטודנטים בפורטו ריקו מדווחים על יותר בדידות מסטודנטים בארצות הברית. אבל בשתי התרבויות, מה שגורם לבדידות דומה מאוד: ביישנות, חוסר משמעות בחיים, והערכה עצמית נמוכה.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. פסיכולוגיה חברתית חוקרת באופן <b>מדעי</b> איך אנחנו חושבים על אחרים, משפיעים עליהם ומתייחסים אליהם, והרעיון המרכזי שלה הוא <b>כוחה של הסיטואציה</b>.<br>
2. היא נשענת על <b>שישה רעיונות</b>: אנחנו בונים את המציאות, האינטואיציה עוזרת ומטעה, השפעות חברתיות, נטיות אישיות, שורשים ביולוגיים ויישום.<br>
3. <b>ערכים</b> נכנסים למחקר בגלוי (בחירת נושאים) ובסמוי (תוויות והגדרות), ולכן צריך בדיקה שיטתית.<br>
4. ממצאים נראים ״מובנים מאליהם״ רק <b>אחרי</b> שיודעים אותם (<b>הטיית החכמה בדיעבד</b>), ולכן צריך מדע.<br>
5. מחקר <b>מתאמי</b> וסקר מראים קשרים, אבל רק <b>ניסוי</b> עם הקצאה אקראית מראה סיבתיות. דגימה אקראית מאפשרת הכללה.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להגדיר פסיכולוגיה חברתית ולהבדיל אותה מסוציולוגיה ומפסיכולוגיה של האישיות.<br>
• לשייך דוגמה לאחד מששת הרעיונות המרכזיים.<br>
• לזהות השפעה גלויה או סמויה של ערכים.<br>
• להסביר את הטיית החכמה בדיעבד ואת המחיר שלה.<br>
• להציע שלושה הסברים למתאם (X←Y, Y←X, Z), ולזהות מתאם שלילי וחיובי.<br>
• לזהות כשל במדגם או בניסוח של סקר.<br>
• לזהות משתנה בלתי תלוי ותלוי, ולהבחין בין הקצאה אקראית לדגימה אקראית ובין שני סוגי הממשיות.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>תאוריה היא לא ״פחות מעובדה״</b>; היא מסבירה עובדות.</li>
<li><b>מתאם אינו סיבתיות</b>, גם כשהוא חזק ועקבי.</li>
<li><b>הקצאה אקראית ≠ דגימה אקראית.</b> הראשונה לסיבתיות, השנייה להכללה.</li>
<li><b>ממשיות ניסויית היא ההכרחית</b>, לא היומיומית.</li>
<li><b>הטיית החכמה בדיעבד</b> גורמת לממצאים להיראות מובנים מאליהם רק <b>אחרי</b> שיודעים אותם.</li>
<li><b>מדגם גדול שלא מייצג</b> לא עדיף על מדגם קטן שמייצג.</li>
<li><b>״אפקט סינדרלה״</b> הוא ציפייה שמגשימה את עצמה, לא ״שינוי סביבה״.</li>
<li><b>תרבויות נבדלות בתוכן</b>, לא בתהליך.</li>
<li><b>מתאם שלילי חזק</b> (r = −0.6) הוא קשר חזק, לא ״אין קשר״.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
</html>
