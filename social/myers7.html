function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);

  {h:"עדי, וההגדרות",html:`${def("על מה הנושא",`ההבדל בין דעה קדומה, סטראוטיפ ואפליה, והאם סטראוטיפים תמיד שגויים.<br><b>מה נלמד כאן:</b> עדי · דעה קדומה · סטראוטיפ · אפליה · גזענות וסקסיזם`)}${ex("<b>עדי</b> (דמות בדויה להמחשה) סטודנטית שעובדת כעוזרת גיוס בחברת הייטק. היא ממיינת קורות חיים, יושבת בראיונות, ומשתדלת להיות הוגנת. נלווה אותה ונראה איך דעות קדומות נכנסות גם כשאף אחד לא מתכוון.")}<div class="tw"><table><tr><th>מושג</th><th>מה הוא</th><th>מרכיב</th></tr><tr><td><b>דעה קדומה</b></td><td>שיפוט <b>שלילי</b> מלכתחילה של קבוצה וחבריה</td><td><b>עמדה</b> (ABC)</td></tr><tr><td><b>סטראוטיפ</b></td><td><b>אמונה</b> על התכונות של קבוצה</td><td>הרכיב <b>הקוגניטיבי</b></td></tr><tr><td><b>אפליה</b></td><td><b>התנהגות</b> שלילית בלתי מוצדקת כלפי קבוצה</td><td>הרכיב <b>ההתנהגותי</b></td></tr><tr><td><b>גזענות / סקסיזם</b></td><td>כל אלה כלפי <b>גזע</b> / <b>מגדר</b></td><td></td></tr></table></div>`,q:"q1"},
  {h:"האם סטראוטיפים שגויים?",html:`<p>לא תמיד. סטראוטיפים יכולים להיות <b>חיוביים או שליליים, מדויקים או לא</b>. סטראוטיפים של מורים על הבדלי הישגים משקפים לרוב את המציאות. סטראוטיפ מדויק נקרא ״רגישות לשונות״.</p>${rem("הבעיה מתחילה ב<b>הכללת יתר</b> או בסטראוטיפ <b>שגוי</b>. השונות <b>בתוך</b> הקבוצה גדולה מהצפוי.")}<p>דוגמאות לדעות קדומות: נגד <b>מוסלמים</b> (4 מכל 10 אמריקנים), נגד <b>שמנים</b> (אפליה רווחת יותר מגזעית או מגדרית), נגד <b>הומוסקסואלים</b>, <b>זקנים</b> (מדברים אליהם ״בשפת תינוקות״) ו<b>מהגרים</b>.</p>`,q:"q3"},
  {h:"אפליה בפועל",html:`<p>מיילים זהים לבעלי דירות בלוס אנג׳לס קיבלו תשובה מעודדת:</p><div class="tw"><table><tr><th>חתום בשם</th><th>תשובה חיובית</th></tr><tr><td>״פטריק מקדוגל״ (לבן)</td><td>89%</td></tr><tr><td>״סעיד אל־רחמן״ (ערבי)</td><td>66%</td></tr><tr><td>״טיירל ג׳קסון״ (שחור)</td><td>56%</td></tr></table></div>${ex("כשעדי מקבלת שני קורות חיים זהים, אחד של ״דניאל״ ואחד של ״מוחמד״, היא בטוחה שהיא מתייחסת לשניהם אותו דבר. המחקרים מראים שזה לא מובטח.")}`,q:"q5"}
 ]},
 {id:"t2",icon:"id",title:"גזע ומגדר: גלוי וחבוי",blocks:[
  {h:"גזענות גלויה וחבויה",html:`${def("על מה הנושא",`דעות קדומות גלויות ירדו מאוד, אבל חבויות עדיין קיימות.<br><b>מה נלמד כאן:</b> ירידה בגזענות גלויה · גזענות מודרנית · אפליה במחקרי שטח · הטיית ירי`)}<p>ב־1942 רוב האמריקנים תמכו בהפרדה באוטובוסים; ב־1980, 90% תמכו בבתי ספר משולבים. אבל אנשים מבחינים בדעות קדומות של <b>אחרים</b>: העריכו ש־44% מהלבנים בעלי דעות קדומות, ורק 14% דירגו כך את עצמם.</p>${def("גזענות מודרנית",`דעות קדומות <b>חבויות</b> שמתבטאות באופן סמוי, או במסווה של מניע אחר: העדפה למוכר, הכחשת אפליה, או <b>יחס פטרוני</b> (חיבור גרוע של ״כותב שחור״ קיבל ציון גבוה יותר וביקורת רכה).`)}<p><b>הלם חשמלי</b>: לתלמיד שחור שיכול להתנקם נתנו הלם <b>חלש</b> יותר אבל <b>ארוך</b> יותר: תוקפנות ישירה ירדה, סמויה עלתה.</p>`,q:"q7"},
  {h:"האפליה במספרים",html:`<div class="tw"><table><tr><th>מחקר</th><th>ממצא</th></tr><tr><td>קניית מכונית בשיקגו</td><td>נשים שחורות קיבלו מחיר גבוה בכ־8% מגברים לבנים</td></tr><tr><td>5,000 קורות חיים</td><td>שם ״לבן״: תשובה אחת לכל 10. שם ״שחור״: אחת לכל 15</td></tr><tr><td>מנהלי משאבי אנוש בשוודיה</td><td>הטיה חבויה נגד ערבים ניבאה מי יוזמן לריאיון</td></tr><tr><td>287 רופאים</td><td>הטיה חבויה גבוהה = פחות המלצה על טיפול למטופל שחור</td></tr><tr><td>הטיית ירי</td><td>״יורים״ בטעות יותר בגבר שחור לא חמוש</td></tr></table></div>${ex("עדי עושה מבחן IAT ומגלה הטיה שלא ידעה עליה. זה לא אומר שהיא ״גזענית״, אבל זה אומר שכדאי לה להסתיר שמות בשלב המיון הראשון.")}`,q:"q9"},
  {h:"דעות קדומות מגדריות",html:`<p>סטראוטיפים מגדריים <b>חזקים</b> יותר מגזעיים, ומקובלים גם על הנשים. אבל לא תמיד שגויים (נשים נעימות יותר, גברים פתוחים יותר, ב־27 מדינות).</p>${def("אפקט ״הנשים הן נפלאות״",`רוב האנשים <b>מחבבים</b> נשים יותר מגברים ומייחסים להן תכונות חיוביות. אבל לא בהכרח כמתאימות לתפקידים תחרותיים.`)}<div class="tw"><table><tr><th>סקסיזם נדיב</th><th>סקסיזם עוין</th></tr><tr><td>הגנה ואידאליזציה: ״לנשים רגישות מוסרית גבוהה״</td><td>עליונות ועוינות: ״נשים לא יודעות לנהוג״</td></tr></table></div><p>שניהם מניחים שנשים <b>חלשות</b>, ושניהם יכולים לדור יחד. <b>גולדברג</b> (1968) מצא שמאמר של ״ג׳ואן״ דורג נמוך מ״ג׳ון״, אבל ב־104 מחקרים לא נמצאה הטיה כללית. בסין נולדים <b>118</b> בנים לכל 100 בנות.</p>`,q:"q11"}
 ]},
 {id:"t3",icon:"building",title:"מקורות חברתיים",blocks:[
  {h:"סטטוס ושליטה חברתית",html:`${def("על מה הנושא",`אילו תנאים חברתיים יוצרים ומשמרים דעות קדומות.<br><b>מה נלמד כאן:</b> סטטוס · חום מול יכולת · מכוונות לשליטה חברתית · חיברות · אישיות סמכותנית · דת · קונפורמיות · מוסדות`)}${rem("<b>הבדלי סטטוס מצמיחים דעות קדומות</b>: הן מצדיקות את מעמד החזקים. בעיני אדונים, עבדים ״עצלנים״.")}<div class="tw"><table><tr><th>תפיסה</th><th>כלפי מי</th></tr><tr><td><b>מוכשרים</b> אבל לא חביבים</td><td>בעלי סטטוס גבוה (״הגרמנים״ בעיני האיטלקים)</td></tr><tr><td><b>חביבים</b> אבל לא מוכשרים</td><td>מי שמקבל סטטוס נמוך (״האיטלקים״ בעיני הגרמנים)</td></tr></table></div>${def("מכוונות לשליטה חברתית",`${E("Social dominance orientation")} שאיפה שהקבוצה שלי תשלוט בקבוצות אחרות. מובילה לדעות קדומות ולתמיכה במדיניות שמשמרת היררכיה.`)}`,q:"q13"},
  {h:"חיברות, אישיות ודת",html:`<p>דעות קדומות של ילדים משקפות לרוב את אלה של <b>אמהותיהם</b>.</p>${def("אישיות סמכותנית",`${E("Authoritarian personality")} <b>אדורנו</b>: ציות לסמכות, חוסר סובלנות כלפי חולשה, תמיכה בענישה, וחשיבה נוקשה בשחור־לבן. נוטה לדעות קדומות כלפי <b>כל</b> הקבוצות. גוברת בזמני משבר.`)}<div class="tw"><table><tr><th>דת</th><th>דעות קדומות</th></tr><tr><td>חברות שטחית בקהילה, דת כ<b>אמצעי</b></td><td>יותר</td></tr><tr><td>דת כ<b>מטרה</b> (מחויבות עמוקה)</td><td>פחות</td></tr></table></div><p>אולפורט: ״הדת ממלאת תפקיד <b>פרדוקסלי</b>״: גם מקור לדעות קדומות וגם יוצאת נגדן.</p>`,q:"q15"},
  {h:"קונפורמיות ומוסדות",html:`<p><b>קונפורמיות</b>: דעות קדומות נשמרות מכוח ההתמד. כורים בווירג׳יניה המערבית היו משולבים במכרה ונפרדים בשכונה. בדיחה סקסיסטית מפחיתה תמיכה בנשים.</p>${rem("אם הדעות הקדומות אינן מושרשות באישיות אלא בנורמה, הן יכולות <b>להשתנות</b> כשהנורמה משתנה.")}<p><b>מוסדות</b> תומכים בדעות קדומות, לפעמים בלי כוונה: מקראות ילדים (״היא מתנהגת כמו ילדה, היא מוותרת״); בתקשורת מצלמים <b>פנים</b> של גברים ו<b>גוף</b> של נשים, ומי שפניו מודגשות נתפס אינטליגנטי יותר.</p>`,q:"q17"}
 ]},
 {id:"t4",icon:"people",title:"מקורות מוטיבציוניים",blocks:[
  {h:"תסכול וקונפליקט",html:`${def("על מה הנושא",`איך צרכים ורגשות מזינים דעות קדומות, ואיך אפשר גם להימנע מהן.<br><b>מה נלמד כאן:</b> התקת תוקפנות · קונפליקט ממשי · זהות חברתית · העדפת קבוצת פנים · ניהול אימה · מוטיבציה להימנע`)}${def("התקת תוקפנות",`תסכול מוביל לעוינות שמופנית ל<b>שעיר לעזאזל</b>. בין 1882 ל־1930 היו יותר לינצ׳ים כשמחירי הכותנה היו <b>נמוכים</b>. ״לולא היו יהודים, האנטישמים היו צריכים להמציא אותם״.`)}${def("תאוריית הקונפליקט הממשי",`${E("Realistic group conflict theory")} דעות קדומות נוצרות מ<b>תחרות</b> על משאבים מוגבלים: עבודה, דיור, יוקרה. ההתנגדות להגירה בקנדה עולה עם האבטלה; הלבנים הקרובים ביותר לשחורים בסולם הכלכלי הם בעלי הדעות הקדומות החזקות ביותר.`)}`,q:"q19"},
  {h:"תאוריית הזהות החברתית",html:`${def("זהות חברתית",`${E("Social identity")} ה״אנחנו״ במושג העצמי. <b>טג׳פל וטרנר</b>.`)}${fig("sid48","אנחנו ממיינים, מזדהים עם קבוצת הפנים, ומשווים אותה לקבוצות החוץ.")}${def("העדפת קבוצת הפנים",`${E("Ingroup bias")} אפילו בקבוצות <b>מקריות</b> (״מעדיפי קליי״ מול ״מעדיפי קנדינסקי״) מחלקים לקבוצה שלנו 9–10 נקודות מתוך 15. חזקה יותר כשהקבוצה <b>קטנה</b> ובעלת <b>סטטוס נמוך</b>.`)}${rem("העדפת קבוצת הפנים נובעת לא פחות מ<b>אהדה ל״אנחנו״</b> מאשר משנאה ל״הם״.")}`,q:"q21"},
  {h:"סטטוס, מוות, והרצון להימנע",html:`<ul><li>מי שמעמדו או הדימוי העצמי שלו <b>מאוים</b> מחזיק יותר בדעות קדומות (אחוות בסטטוס נמוך זלזלו יותר).</li><li><b>ניהול אימה</b>: תזכורת למוות מגבירה העדפת קבוצת פנים ודעות קדומות.</li><li>כשהצורך ב<b>שייכות</b> מסופק, ההטיה יורדת: סטודנטים יהודים שהוטרמו במילים כמו ״חיבוק״ לא העדיפו מאמר יהודי על ערבי.</li></ul>${def("מוטיבציה להימנע מדעות קדומות",`<b>דיוויין</b>: גם אנשים בלי דעות קדומות חווים תגובות סטראוטיפיות <b>אוטומטיות</b>. ההבדל הוא מה עושים עם זה. מי שמונע מ<b>מוטיבציה פנימית</b> מפחית גם דעות קדומות אוטומטיות. ״הרגל הדעות הקדומות״ אפשר לשבור.`)}`,q:"q23"}
 ]},
 {id:"t5",icon:"brain",title:"מקורות קוגניטיביים",blocks:[
  {h:"קטגוריות ודמיון",html:`${def("על מה הנושא",`איך דרכי החשיבה הרגילות שלנו יוצרות סטראוטיפים.<br><b>מה נלמד כאן:</b> קטגוריזציה · הומוגניות קבוצת החוץ · הטיית הגזע שלנו · בולטות · מתאם מדומה · הטיה לטובת הקבוצה · עולם צודק`)}<p>סטראוטיפים הם גם <b>תוצר לוואי</b> של חשיבה רגילה שמפשטת את העולם. נשענים עליהם יותר כשלחוצים בזמן, עסוקים, עייפים או נסערים. ממיינים אנשים <b>ספונטנית</b> לפי גזע ומגדר.</p>${def("הומוגניות קבוצת החוץ",`${E("Outgroup homogeneity effect")} ״<b>הם</b> כולם אותו דבר; <b>אנחנו</b> שונים זה מזה״. השווייצרים רואים הבדלים בינם; מבחוץ הם נראים אחידים.`)}${def("הטיית הגזע שלנו",`${E("Own-race bias")} מזהים טוב יותר פנים של בני הגזע שלנו. נמצא כבר אצל תינוקות בני 9 חודשים, ויש גם הטיית <b>גיל</b> מקבילה.`)}`,q:"q25"},
  {h:"בולטות",html:`<p>מי שחריג בקבוצה (אישה יחידה, שחור יחיד) <b>בולט</b> ונתפס כגורם לכל מה שקורה.</p>${def("ניסוי הצלקת (קלק וסטרנטה)",`נשים שחשבו שיש על פניהן צלקת (שבפועל נמחקה) דירגו את בנות שיחן כמתוחות ומתנשאות יותר. צופים לא ראו שום הבדל. המודעות העצמית לחריגות שינתה את הפירוש.`)}${def("מודעות לסטיגמה",`${E("Stigma consciousness")} עד כמה אדם מצפה שיתייגו אותו בסטראוטיפ. פוגעת ברווחה, אבל גם מגינה על הערך העצמי (״זה לא נגדי אישית״).`)}<p><b>מקרים בולטים</b> מעוותים שכיחות: אמריקנים העריכו שחורים ב־30% (בפועל 12%), והטרוסקסואלים מעריכים בהרבה יתר את שיעור ההומוסקסואלים.</p>`,q:"q27"},
  {h:"מתאם מדומה",html:`${def("המילטון וגיפורד (1976)",`בקבוצה A היו פי 2 אנשים מבקבוצה B, ובשתיהן אותו יחס של 9 מעשים טובים ל־4 רעים. ובכל זאת, המשתתפים <b>הפריזו</b> בשכיחות המעשים הרעים של קבוצת ה<b>מיעוט</b> B. שני דברים נדירים יחד בולטים.`)}<p>התקשורת מחזקת: כשאדם עם עבר פסיכיאטרי רוצח, מדווחים על המחלה; כשאדם אחר רוצח, לא. גם סטראוטיפים קיימים ״מייצרים״ מתאמים: ״רואי חשבון ביישנים״ נזכרו יותר אף שהופיעו באותה תדירות.</p>${ex("עדי זוכרת מועמד אחד מקבוצה מסוימת שאיחר לריאיון, ובלי לשים לב היא מצפה שגם הבא יאחר. מקרה בולט אחד הפך ל״כלל״.")}`,q:"q29"},
  {h:"ייחוס ועולם צודק",html:`${def("הטיה לטובת הקבוצה",`${E("Group-serving bias")} התנהגות <b>טובה</b> של קבוצת הפנים = אופי, של קבוצת החוץ = מזל או ״יוצא מן הכלל״. התנהגות <b>רעה</b> של קבוצת החוץ = אופי, של קבוצת הפנים = נסיבות. אותה דחיפה נתפסה ״שובבות״ אצל לבן ו״אלימה״ אצל שחור.`)}${def("האמונה בעולם צודק",`${E("Just-world phenomenon")} <b>לרנר</b>: ״כל אחד מקבל מה שמגיע לו״. צופים שלא יכלו לעזור לקורבן של הלם חשמלי <b>זלזלו</b> בה. מי שקרא סיפור שנגמר באונס האשים את האישה בהתנהגות שבסיפור אחר נשפטה כתמימה.`)}${rem("״האשמת הקורבן״ מאפשרת למצליחים להרגיש שמגיע להם, ולא לשאת באחריות למוכי הגורל.")}`,q:"q31"}
 ]},
 {id:"t6",icon:"target",title:"השלכות, ואיך מפחיתים",blocks:[
  {h:"סטראוטיפים שמנציחים את עצמם",html:`${def("על מה הנושא",`מה דעות קדומות עושות: לנו, למושאים שלהן, ולשיפוט של יחידים.<br><b>מה נלמד כאן:</b> הנצחה · מיון מחדש ותת־הקבצה · נבואה המגשימה · איום הסטראוטיפ · שיפוט יחידים · הפחתה`)}<p>סטראוטיפים מכוונים קשב וזיכרון, ומידע שלא מתאים מוסבר כחריג. מי שציפה לבן זוג ״לא ידידותי״ ראה עוינות מתחת לחיוכים.</p><div class="tw"><table><tr><th>מיון מחדש</th><th>תת־הקבצה</th></tr><tr><td>${E("Subtyping")} מי שחורג נתפס כ״יוצא מן הכלל״ <b>מחוץ</b> לקבוצה. הסטראוטיפ <b>לא</b> משתנה (שוטר בית הספר הנחמד)</td><td>${E("Subgrouping")} יוצרים <b>תת־קבוצה</b> בתוך הקבוצה (״שחורים מהמעמד הבינוני״). הסטראוטיפ משתנה <b>מעט</b> ונעשה מובחן</td></tr></table></div>`,q:"q33"},
  {h:"נבואה ואיום הסטראוטיפ",html:`<p><b>וורד ועמיתיו</b>: מראיינים לבנים ישבו רחוק יותר ממועמד שחור, קיצרו את הריאיון ב־25% ועשו יותר שגיאות דיבור. כשמראיינים התייחסו כך למועמדים <b>לבנים</b>, גם הם נראו עצבניים ופחות מוצלחים.</p>${def("איום הסטראוטיפ",`${E("Stereotype threat")} <b>סטיל</b>: החשש שיעריכו אותי לפי סטראוטיפ שלילי, שפוגע בביצוע <b>מיד</b>.`)}${fig("threat48","איום הסטראוטיפ פוגע בביצוע, ולאורך זמן מוביל לאי־הזדהות עם התחום.")}<ul><li>נשים: כשנאמר שיש הבדלי מגדר במבחן, ביצעו גרוע; כשנאמר שאין, <b>כמו הגברים</b>.</li><li>שחורים: ביצעו גרוע רק כשהמבחן הוצג כ<b>מאבחן יכולת</b>.</li><li>גולף: שחורים ירדו ב״משכל ספורטיבי״, לבנים ב״יכולת טבעית״.</li><li>המנגנונים: <b>עקה</b>, ויסות עצמי והדחקת מחשבות. סטראוטיפ <b>חיובי</b> (אסיינית ״טובה במתמטיקה״) שיפר ביצוע.</li></ul>`,q:"q35"},
  {h:"שיפוט יחידים, והפחתה",html:`<p>החדשה הטובה: כשיש מידע <b>אישי</b>, סטראוטיפים משפיעים מעט. ״לילי״ ו״ביל״ האסרטיביים נשפטו אותו דבר. ״הפוליטיקאים מושחתים, אבל הנציג שלנו ישר״.</p><p>אבל סטראוטיפים <b>חזקים</b> עדיין משפיעים: גברים נשפטו גבוהים יותר מנשים באותו גובה. כשהמידע <b>עמום</b>, ״שרה״ מהשכונה המבוססת ״ענתה נכון״ יותר מאותה שרה מהשכונה הענייה. <b>אן הופקינס</b> לא קודמה כי לא הייתה ״נשית״ מספיק, ובית המשפט העליון קבע שזו אפליה (״מלכוד 22״).</p>${rem("להפחתה: <b>סטטוס שוויוני ושיתוף פעולה</b>, אכיפת אי־אפליה, שינוי מוסדות, ראיית חברי קבוצות החוץ <b>כיחידים</b>, ושימוש באשמה כדי לשבור את ״הרגל הדעות הקדומות״.")}${ex("עדי מציעה לחברה: שמות מוסתרים במיון, שאלות ריאיון זהות לכולם, וצוות מראיינים מגוון. כך הסטראוטיפים מקבלים פחות מקום.")}`,q:"q37"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מהי דעה קדומה?","a":"שיפוט שלילי מראש של קבוצה","w":["אמונה על התכונות של קבוצה","התנהגות שלילית כלפי חברי קבוצה","הכללה מדויקת על קבוצה"],"e":"דעה קדומה היא עמדה; סטראוטיפ הוא אמונה; אפליה היא התנהגות."},{"q":"מהו סטראוטיפ?","a":"אמונה על התכונות של קבוצת אנשים","w":["שיפוט שלילי מלכתחילה של קבוצה","התנהגות בלתי מוצדקת כלפי קבוצה","רגש עוין כלפי קבוצה"],"e":"זהו הרכיב הקוגניטיבי של הדעה הקדומה."}]},"q2":{"t":"t1","v":[{"q":"מהי אפליה?","a":"התנהגות שלילית לא מוצדקת","w":["אמונה שגויה על קבוצה מסוימת","רגש שלילי ועוין כלפי קבוצה","הכללת יתר על חברי קבוצה"],"e":"לעתים קרובות היא ביטוי התנהגותי של דעה קדומה."}]},"q3":{"t":"t1","v":[{"q":"האם סטראוטיפים תמיד שגויים?","a":"לא, הם יכולים להיות מדויקים","w":["כן, כל סטראוטיפ שגוי בהגדרה","כן, אבל רק סטראוטיפים חיוביים","לא, הם תמיד מדויקים לגמרי"],"e":"למשל, סטראוטיפים של מורים על הבדלי הישגים משקפים לרוב את המציאות."},{"q":"איזו אפליה נמצאה רווחת יותר מאפליה גזעית או מגדרית?","a":"אפליה על רקע משקל","w":["אפליה על רקע גיל","אפליה על רקע דת","אפליה על רקע מוצא"],"e":"היא מתרחשת בכל שלבי ההעסקה."}]},"q4":{"t":"t1","v":[{"q":"איך מתייחסים לזקנים לפי הסטראוטיפ?","a":"בהתנשאות, כמו אל תינוקות","w":["בכבוד רב, כאל חכמי השבט","בעוינות גלויה ובוטה","באדישות מוחלטת לצורכיהם"],"e":"הזקנים מגיבים בהרגשת חוסר תועלת ומתנהגים בהתאם."}]},"q5":{"t":"t1","v":[{"q":"כמה תשובות חיוביות קיבל ״פטריק מקדוגל״ על בקשה לשכור דירה?","a":"89%","w":["56%","66%","100%"],"e":"״סעיד אל־רחמן״ קיבל 66%, ו״טיירל ג׳קסון״ 56%."}]},"q6":{"t":"t1","v":[{"q":"מה מלמד ניסוי המיילים לבעלי הדירות?","a":"אפליה קיימת גם בבקשות זהות","w":["בעלי דירות לא מפלים בכלל","רק שמות ערביים הופלו","ההבדלים נבעו מאיכות הכתיבה"],"e":"רק השם השתנה, והתשובות השתנו."}]},"q7":{"t":"t2","v":[{"q":"מה קרה לגזענות הגלויה בארה״ב מאז שנות ה־40?","a":"ירדה מאוד","w":["נשארה כפי שהייתה","עלתה מאוד","נעלמה לגמרי, כולל החבויה"],"e":"התמיכה בבתי ספר משולבים עלתה לכ־90%, אבל דעות חבויות עדיין קיימות."},{"q":"מהי ״גזענות מודרנית״?","a":"דעות קדומות חבויות ומוסוות","w":["גזענות גלויה בטכנולוגיה חדשה","התנגדות גלויה לשילוב","גזענות של צעירים בלבד"],"e":"היא מתבטאת בהעדפת המוכר, הכחשת אפליה או יחס פטרוני."}]},"q8":{"t":"t2","v":[{"q":"מה קרה בניסוי ההלם כשתלמיד שחור יכול היה להתנקם?","a":"הלם חלש יותר אבל ארוך יותר","w":["ההלם היה חזק יותר וארוך יותר","ההלם היה זהה לתלמיד לבן","לא ניתן הלם בכלל"],"e":"תוקפנות ישירה ירדה, וסמויה עלתה."},{"q":"איך ביטאו סטודנטים יחס פטרוני לחיבור גרוע של ״כותב שחור״?","a":"נתנו ציון גבוה יותר וביקורת רכה","w":["נתנו ציון נמוך יותר מהרגיל","סירבו לבדוק את החיבור בכלל","נתנו בדיוק אותו ציון כמו לכולם"],"e":"שבח מוגזם והיעדר ביקורת עלולים לפגוע בהישגים."}]},"q9":{"t":"t2","v":[{"q":"מה מצא המחקר על 5,000 קורות חיים?","a":"שמות ״שחורים״ קיבלו פחות תשובות","w":["שמות ״שחורים״ קיבלו יותר תשובות","לא היה הבדל בתשובות","רק נשים הופלו"],"e":"אחת לכל 10 בשם ״לבן״, אחת לכל 15 בשם ״שחור״."},{"q":"מהי ״הטיית הירי״?","a":"יורים בטעות יותר בגבר שחור לא חמוש","w":["יורים בטעות יותר בגבר לבן לא חמוש","שוטרים יורים פחות בשחורים","אין הבדל לפי גזע"],"e":"זה נמצא גם אצל משתתפים שחורים."}]},"q10":{"t":"t2","v":[{"q":"מה ניבאה הטיה חבויה אצל מנהלי משאבי אנוש בשוודיה?","a":"מי מהמועמדים הערבים יוזמן","w":["את גובה השכר שיוצע לבסוף","את מספר הקידומים בהמשך","שום דבר, ההטיה לא ניבאה כלום"],"e":"עמדות חבויות יכולות לחלחל להתנהגות מפלה."}]},"q11":{"t":"t2","v":[{"q":"מהו אפקט ״הנשים הן נפלאות״?","a":"מחבבים נשים יותר מגברים","w":["נשים נתפסות כמוכשרות יותר בעבודה","גברים מחבבים נשים פחות מנשים","נשים מעריכות את עצמן יותר"],"e":"אבל לא בהכרח רואים אותן מתאימות לתפקידים תחרותיים."},{"q":"מהו סקסיזם נדיב?","a":"הגנה ואידאליזציה של נשים מסורתיות","w":["עמדות של עוינות ועליונות כלפי נשים","תמיכה מלאה בשוויון","העדפת נשים בגיוס"],"e":"גם הוא, כמו הסקסיזם העוין, מניח שנשים חלשות."}]},"q12":{"t":"t2","v":[{"q":"מה נמצא ב־104 מחקרים על הערכת עבודות של גברים ונשים?","a":"בדרך כלל לא הייתה הטיה מגדרית","w":["עבודות נשים דורגו תמיד נמוך יותר","עבודות גברים דורגו נמוך יותר","נשים דירגו נשים גבוה יותר"],"e":"גולדברג (1968) מצא הטיה, אבל רוב המחקרים לא."},{"q":"מה מלמד היחס 118 בנים ל־100 בנות בסין?","a":"העדפת בנים מובילה להפלות","w":["באופן טבעי נולדים יותר בנים","בנות מהגרות יותר מבנים","סטייה מקרית בלבד"],"e":"התוצאה: עשרות מיליוני ״נשים חסרות״."}]},"q13":{"t":"t3","v":[{"q":"מה העיקרון לגבי סטטוס ודעות קדומות?","a":"הבדלי סטטוס מצמיחים דעות קדומות","w":["דעות קדומות קיימות רק בין קבוצות שוות","סטטוס גבוה מונע דעות קדומות","אין קשר בין סטטוס לדעות קדומות"],"e":"בעיני אדונים, עבדים ״עצלנים״, וזה מצדיק את העבדות."},{"q":"איך תופסים בדרך כלל קבוצות בעלות סטטוס גבוה?","a":"מוכשרות אבל לא חביבות","w":["חביבות אבל לא מוכשרות","מוכשרות וחביבות","לא מוכשרות ולא חביבות"],"e":"ומי שמקבל סטטוס נמוך נתפס חביב אבל פחות מוכשר."}]},"q14":{"t":"t3","v":[{"q":"מהי מכוונות לשליטה חברתית?","a":"שאיפה שקבוצתי תשלוט באחרות","w":["רצון אישי חזק לשלוט באחרים","התנגדות עקבית לכל סוג של היררכיה","צורך גבוה בשליטה עצמית ובסדר"],"e":"היא מובילה לדעות קדומות ולתמיכה במדיניות שמשמרת היררכיה."}]},"q15":{"t":"t3","v":[{"q":"מה מאפיין אישיות סמכותנית?","a":"ציות לסמכות ואי־סובלנות לחולשה","w":["התנגדות עקבית לכל סמכות שהיא","פתיחות רבה לקבוצות שונות ממנו","חשיבה גמישה, מורכבת ופתוחה"],"e":"אדורנו: דעות קדומות כלפי כל הקבוצות, וחשיבה בשחור־לבן."},{"q":"מי מביע פחות דעות קדומות?","a":"מי שהדת היא מטרה בשבילו","w":["מי שהדת היא אמצעי חברתי בשבילו","מבקרים מזדמנים בכנסייה","מי שרק חבר בקהילה"],"e":"מחויבות דתית עמוקה קשורה לפחות דעות קדומות."}]},"q16":{"t":"t3","v":[{"q":"מה מלמד הקשר בין דת לדעות קדומות?","a":"הדת ממלאת תפקיד פרדוקסלי","w":["הדת תמיד מגבירה דעות קדומות","הדת תמיד מפחיתה דעות קדומות","אין שום קשר"],"e":"היא גם מקור לדעות קדומות וגם יוצאת נגדן."}]},"q17":{"t":"t3","v":[{"q":"מה מלמד המקרה של הכורים בווירג׳יניה המערבית?","a":"דעות קדומות משקפות נורמה, לא אישיות","w":["כורים הם גזענים יותר מאחרים","שילוב בעבודה הוביל לשילוב בשכונה","אין קשר בין עבודה לשכונה"],"e":"משולבים במכרה ונפרדים בשכונה: כל מקום לפי הנורמה שלו."},{"q":"איך מוסדות תומכים בדעות קדומות לעתים קרובות?","a":"בלי כוונה, בהנצחת הסטטוס קוו","w":[ ","שינוי מלא של הסטראוטיפ","מיון אנשים לפי גזע"],"e":"הסטראוטיפ נשאר על כנו (השוטר הנחמד של בית הספר)."},{"q":"מהי תת־הקבצה?","a":"יצירת תת־קבוצה עם סטראוטיפ משלה","w":["הוצאת יוצא הדופן אל מחוץ לקבוצה","חלוקה אקראית של אנשים לקבוצות","התעלמות עקבית ממידע סותר"],"e":"היא משנה את הסטראוטיפ מעט ומחדדת אותו."}]},"q34":{"t":"t6","v":[{"q":"מה מצאו וורד ועמיתיו בראיונות עבודה?","a":"יחס מרוחק פגע גם במועמדים לבנים","w":["מועמדים שחורים היו פחות מוכשרים","מראיינים התייחסו לכולם אותו דבר","מועמדים לבנים נראו טובים בכל מצב"],"e":"חלק מ״הבעיה״ טמון באינטראקציה עצמה: נבואה המגשימה את עצמה."}]},"q35":{"t":"t6","v":[{"q":"מהו איום הסטראוטיפ?","a":"חשש מסטראוטיפ שפוגע בביצוע","w":["איום גלוי מצד בעלי דעות קדומות","אמונה שהסטראוטיפ נכון לגבי","התנגדות פעילה לסטראוטיפ"],"e":"סטיל. ההשפעה מיידית, בשונה מנבואה מגשימה שפועלת בהדרגה."},{"q":"מה קרה לנשים כשנאמר שאין הבדלי מגדר במבחן?","a":"ביצעו כמו הגברים","w":["ביצעו גרוע מהגברים","ביצעו טוב בהרבה מהגברים","סירבו להיבחן"],"e":"כשנאמר שיש הבדל, ביצעו גרוע יותר."}]},"q36":{"t":"t6","v":[{"q":"מתי ביצעו סטודנטים שחורים גרוע מלבנים במבחן מילולי?","a":"כשהמבחן הוצג כמאבחן יכולת","w":["בכל מצב","כשהמבחן הוצג כמטלת מעבדה","אף פעם"],"e":"בלי האיום, לא היה הבדל."},{"q":"מה קורה עם סטראוטיפ חיובי, כמו ״אסיינים טובים במתמטיקה״?","a":"הוא עשוי לשפר ביצוע","w":["הוא תמיד פוגע בביצוע","אין לו שום השפעה","הוא פוגע רק בגברים"],"e":"נשים אסייניות שהוזכרה להן זהותן האסיינית שיפרו ביצוע."}]},"q37":{"t":"t6","v":[{"q":"מה קורה לסטראוטיפים כשיש מידע אישי על האדם?","a":"הם משפיעים מעט","w":["הם משפיעים יותר","הם משפיעים באותה מידה","הם הופכים לחיוביים"],"e":"״לילי״ ו״ביל״ נשפטו אותו דבר לפי המידע עליהם."},{"q":"מתי סטראוטיפים מטים את השיפוט של יחיד?","a":"כשהם חזקים והמידע עמום","w":["כשהמידע ברור ומפורט","רק אצל אנשים עם דעות קדומות","אף פעם"],"e":"״שרה״ מהשכונה המבוססת ״ענתה נכון״ יותר, באותו סרט בדיוק."}]},"q38":{"t":"t6","v":[{"q":"מה קבע בית המשפט העליון במקרה של אן הופקינס?","a":"דרישה ל״נשיות״ היא אפליה מגדרית","w":["החברה פעלה כחוק","היא לא הייתה מוכשרת מספיק","התוקפנות שלה הצדיקה את הדחייה"],"e":"״מלכוד 22״: לא מקדמים אותה אם תוקפנית ולא אם לא."},{"q":"איזו דרך מוזכרת בפרק להפחתת דעות קדומות?","a":"סטטוס שוויוני ושיתוף פעולה","w":["הפרדה מוחלטת בין הקבוצות","התעלמות מכל ההבדלים ביניהן","הטפה כללית בלבד, בלי מגע"],"e":"גם אכיפת אי־אפליה, שינוי מוסדות וראיית אנשים כיחידים."}]}};
const H={"h1":{"t":"t1","v":[{"q":"מנהל מאמין ש״עובדים מבוגרים לא מסתדרים עם טכנולוגיה״, ולכן לא מזמין אותם לראיון. מה מכל זה הוא האפליה?","a":"ההחלטה לא להזמין אותם לראיון","w":["האמונה שהם לא מסתדרים עם טכנולוגיה","התחושה השלילית שלו כלפי עובדים מבוגרים","הגיל של העובדים, שמגדיר אותם כקבוצה"],"e":"סטראוטיפ = אמונה. דעה קדומה = עמדה שלילית. אפליה = התנהגות."},{"q":"״אנשים מהעיר ההיא קמצנים״. מה זה?","a":"סטראוטיפ: אמונה על התכונות של קבוצה","w":["אפליה: התנהגות שלילית כלפי הקבוצה","דעה קדומה: התנהגות עוינת כלפי הקבוצה","הומוגניות: אמונה שהקבוצה שלי מגוונת"],"e":"סטראוטיפ הוא אמונה. הוא עלול להיות הכללת יתר, וכשהוא מלווה בעמדה שלילית יש גם דעה קדומה."}]},"h2":{"t":"t1","v":[{"q":"חוקרים שלחו מיילים זהים לבעלי דירות, וההבדל היחיד היה השם החתום. מה הממצא מלמד?","a":"שקיימת אפליה בשטח, גם כשהמידע זהה לגמרי","w":["שבעלי דירות מעדיפים שוכרים עם השכלה גבוהה","שאין אפליה, כי כל הפניות קיבלו תשובה","שאנשים מעדיפים שמות קצרים על שמות ארוכים"],"e":"״פטריק מקדוגל״ קיבל 89% תשובות מעודדות, ״סעיד אל־רחמן״ 66%, ו״טיירל ג׳קסון״ 56%."}]},"h3":{"t":"t2","v":[{"q":"אדם אומר בכנות שכל הקבוצות שוות, אבל כשהוא צריך להחליט מהר, הוא מגיב אחרת לחברי קבוצה מסוימת. מה זה מדגים?","a":"דעה קדומה חבויה, לצד עמדה גלויה שוויונית","w":["דעה קדומה גלויה, כי הוא אומר אותה בקול","סטראוטיפ מדויק, כי הוא מבוסס על ניסיון","התקת תוקפנות, כי הוא מתוסכל מהלחץ"],"e":"דעות קדומות גלויות ירדו מאוד, אבל שיטות רגישות עדיין מוצאות הטיות חבויות."}]},"h4":{"t":"t2","v":[{"q":"חוקרים שלחו 5,000 קורות חיים עם שמות שונים. מה נמצא?","a":"שמות ״לבנים״ קיבלו יותר תשובות (1:10 מול 1:15)","w":["לא נמצא הבדל בין השמות בתשובות שהתקבלו","שמות ״שחורים״ קיבלו יותר תשובות, בגלל העדפה מתקנת","ההבדל נמצא רק במשרות בכירות ולא בפשוטות"],"e":"זו אחת הראיות לכך שאפליה חבויה קיימת בשוק העבודה."}]},"h5":{"t":"t2","v":[{"q":"לפי סקירה של 104 מחקרים, מה נמצא לגבי הערכת עבודות של גברים לעומת נשים?","a":"ברוב ההשוואות לא נמצאה הטיה","w":["עבודות של נשים הוערכו נמוך יותר בעקביות","עבודות של גברים הוערכו נמוך יותר בעקביות","ההטיה הייתה תלויה בגיל של המעריכים"],"e":"כשהתגלו הטיות, הן היו נגד גברים ונגד נשים באותה מידה."}]},"h6":{"t":"t3","v":[{"q":"אדם שרואה את העולם כהיררכיה ורוצה שהקבוצה שלו תהיה ״בפסגה״, נוטה ליותר דעות קדומות. איך קוראים לנטייה הזו?","a":"מכוונות לשליטה חברתית","w":["אישיות סמכותנית מובהקת","זהות חברתית חזקה","אמונה בעולם צודק"],"e":"אישיות סמכותנית (אדורנו) מתאפיינת בציות ובעוינות לכל מיעוט. מכוונות לשליטה חברתית היא שאיפה שהקבוצה שלי תשלוט."}]},"h7":{"t":"t3","v":[{"q":"שני אנשים דתיים. לאחד הדת היא התשתית לכל החיים, ולשני היא בעיקר מקום לפעילות חברתית. מי צפוי להביע פחות דעות קדומות?","a":"מי שהדת היא מטרה לשמה עבורו","w":["מי שהדת היא אמצעי לפעילות חברתית","שניהם באותה מידה, כי שניהם דתיים","אף אחד, כי דת תמיד מגבירה דעות קדומות"],"e":"לכן הספר מתאר ״תפקיד פרדוקסלי״: חברות בקהילה דתית קשורה ליותר דעות קדומות, אבל מחויבות עמוקה לפחות."}]},"h8":{"t":"t3","v":[{"q":"כורים בווירג׳יניה המערבית עבדו יחד בלי הפרדה גזעית במכרה, אבל בשכונות שמרו על הפרדה נוקשה. מה זה מראה?","a":"שהדעות הקדומות שיקפו נורמה מקומית","w":["שלכורים הייתה אישיות סמכותנית חולה","שהתחרות על עבודה במכרה יצרה עוינות","שהכורים לא שמו לב להבדלים בעבודה"],"e":"אם דעה קדומה הייתה תכונת אישיות, היא הייתה מופיעה בכל מקום. כאן היא השתנתה לפי הנורמה."}]},"h9":{"t":"t3","v":[{"q":"אנשים ששמעו בדיחה סקסיסטית תמכו אחר כך פחות בנשים. איזה מקור חברתי זה מדגים?","a":"קונפורמיות: אנשים מתאימים את עצמם למה שנראה מקובל","w":["התקת תוקפנות: תסכול מתפרק על קבוצה חלשה","אמונה בעולם צודק: נשים ״מקבלות מה שמגיע להן״","מכוונות לשליטה חברתית: רצון שהקבוצה שלי תשלוט"],"e":"המניע לקונפורמיות הוא לא שנאה אלא צורך בקבלה."}]},"h10":{"t":"t4","v":[{"q":"בשנים שבהן מחירי הכותנה ירדו, מספר מקרי הלינץ׳ בדרום ארה״ב עלה. איזה מקור זה מדגים?","a":"התקת תוקפנות: תסכול מתפרק על שעיר לעזאזל","w":["קונפליקט ממשי: תחרות על משאבים מוגבלים","קטגוריזציה: מיון אנשים לקבוצות","קונפורמיות: הסתגלות לנורמה החברתית"],"e":"מי שגרם לתסכול (המצב הכלכלי) לא היה ״מטרה״ זמינה, אז התוקפנות הופנתה לקבוצה חלשה."}]},"h11":{"t":"t4","v":[{"q":"חילקו תלמידים לשתי קבוצות לפי "],"e":"הניסוי של המילטון וגיפורד. מיעוט + מעשה שלילי = שני מקרים חריגים שמושכים תשומת לב."}]},"h17":{"t":"t5","v":[{"q":"כשאדם מהקבוצה שלנו עושה מעשה טוב, אומרים ״הוא אדם טוב״. כשמישהו מקבוצת החוץ עושה אותו מעשה, אומרים ״המצב הכריח אותו״. מה זה?","a":"הטיה לטובת הקבוצה","w":["אמונה בעולם צודק","הומוגניות קבוצת החוץ","מיון מחדש"],"e":"מעשה רע שלהם מיוחס לאופי, ומעשה טוב שלהם לנסיבות. אצלנו להפך."}]},"h18":{"t":"t5","v":[{"q":"אחרי ששמעו על אדם שפוטר, אנשים אומרים ״כנראה הוא לא התאמץ מספיק״, בלי לדעת שום פרט. איזה תהליך זה?","a":"אמונה בעולם צודק: כל אחד מקבל מה שמגיע לו","w":["מתאם מדומה: שני אירועים נדירים יחד","הטיה לטובת הקבוצה: ייחוס לאופי של קבוצת החוץ","קטגוריזציה: מיון לפי קבוצה"],"e":"לפי לרנר, האמונה הזו מובילה להאשמת הקורבן."}]},"h19":{"t":"t5","v":[{"q":"סטודנטיות שהיו בטוחות שיש להן צלקת על הפנים (אף שהיא נמחקה בלי ידיעתן) הרגישו שבן השיחה מתנהג אליהן אחרת. מה הלקח?","a":"מי שמרגיש חריג מייחס לכך את יחס האחרים","w":["אנשים באמת מתנהגים אחרת כלפי מי שיש לו צלקת","הצלקת יצרה נבואה המגשימה את עצמה","צלקות מעוררות דעות קדומות חבויות אצל כולם"],"e":"לא הייתה צלקת. ההבדל היה בפרשנות של המשתתפות, שהרגישו ״בולטות״."}]},"h20":{"t":"t6","v":[{"q":"אדם עם סטראוטיפ שלילי על שוטרים פוגש שוטר נחמד ואומר: ״הוא יוצא מן הכלל״. מה קורה לסטראוטיפ?","a":"הוא לא משתנה: זה מיון מחדש","w":["הוא משתנה מעט: זו תת־הקבצה","הוא נעלם: זה מידע אישי","הוא מתחזק: זה איום הסטראוטיפ"],"e":"מיון מחדש מוציא את האדם מהקבוצה כחריג. תת־הקבצה יוצרת תת־קבוצה חדשה, והסטראוטיפ משתנה מעט."}]},"h21":{"t":"t6","v":[{"q":"מראיינים שישבו רחוק וקיצרו את הראיון גרמו גם למועמדים לבנים להיראות פחות טוב. מה זה מדגים?","a":"נבואה המגשימה את עצמה","w":["איום הסטראוטיפ השלילי","מתאם מדומה בזיכרון","הטיה לטובת הקבוצה"],"e":"הציפייה של המראיין שינתה את התנהגות המועמד, וזו ״אישרה״ את הציפייה."}]},"h22":{"t":"t6","v":[{"q":"לפני מבחן קשה במתמטיקה, נאמר לחלק מהנשים שבמבחן יש הבדלים לטובת גברים. הן הצליחו פחות מנשים שנאמר להן שאין הבדלים. מה זה?","a":"איום הסטראוטיפ: החשש לאשר סטראוטיפ פוגע בביצוע","w":["נבואה המגשימה את עצמה: הבוחנים התנהגו אחרת","מתאם מדומה: הנשים זכרו רק כישלונות","הומוגניות: כל הנשים נתפסו כדומות"],"e":"באיום הסטראוטיפ, החשש של האדם עצמו פוגע בביצוע ברגע, בלי שאחרים משנים התנהגות."}]},"h23":{"t":"t6","v":[{"q":"מה ההבדל בין איום הסטראוטיפ לנבואה המגשימה את עצמה?","a":"באיום החשש שלי פוגע; בנבואה, יחס האחרים","w":["באיום, אחרים מתנהגים אחרת; בנבואה, החשש שלי פוגע","אין הבדל, אלה שני שמות לאותה תופעה","איום פועל לאורך שנים; נבואה פועלת רק במבחן"],"e":"לאורך זמן, איום חוזר יכול להוביל לחוסר הזדהות עם התחום."}]},"h24":{"t":"t6","v":[{"q":"סטודנטים קראו איך ״לילי״ או ״ביל״ הגיבו בצורה אסרטיבית. האם המגדר השפיע על הניבוי שלהם?","a":"לא: הניבוי הושפע רק מההתנהגות שתוארה","w":["כן: לביל ניבאו יותר אסרטיביות בכל המצבים","כן: ללילי ניבאו יותר אסרטיביות כדי להיות הוגנים","חלקית: רק סטודנטים גברים הושפעו מהמגדר"],"e":"מידע אישי מנטרל סטראוטיפים. אבל סטראוטיפ חזק (כמו גובה) משפיע גם כשאומרים שהוא לא רלוונטי."}]},"h25":{"t":"t6","v":[{"q":"אנשים העריכו גברים בתמונות כגבוהים יותר מנשים בגובה זהה, גם כשהובטח להם כסף על דיוק. מה זה מראה?","a":"סטראוטיפ חזק משפיע גם אז","w":["מידע אישי תמיד מבטל סטראוטיפים","אנשים לא מבחינים בגובה בתמונות","כסף מגביר את הדיוק של השיפוט"],"e":"הסטראוטיפ ״גברים גבוהים יותר״ חזק ומדויק בממוצע, ולכן קשה לנטרל אותו."}]},"h26":{"t":"t6","v":[{"q":"חברה לא העמידה מועמדת דרגה ראשונה לשותפות, והתנהלה לפי סטראוטיפים מגדריים. פסיכולוגית העידה בבית המשפט. על איזה מקרה מדובר?","a":"אן הופקינס, שסוזן פיסק העידה לטובתה","w":["לילי וביל, בניסוי על אסרטיביות","הסטודנטיות עם הצלקת, בניסוי על חריגות","המראיינים בפרינסטון, בניסוי על נבואה מגשימה"],"e":"המחקר על סטראוטיפים הגיע לבית המשפט העליון, ותרם להצלחה."}]},"h27":{"t":"t6","v":[{"q":"לפי הספר, אם דעות קדומות נובעות מסטטוס לא שוויוני, מה הדרך להפחית אותן?","a":"סטטוס שוויוני ושיתוף פעולה","w":["לאכוף איסור אפליה בחוק בלבד","לשכנע את התקשורת להראות הרמוניה","לשבור את ההרגל בעזרת אשמה"],"e":"כל מקור מרמז על פתרון: סטטוס ← שוויון ושיתוף. הצדקת אפליה ← אכיפה. מוסדות ← שינוי מוסדות. תגובות אוטומטיות ← אשמה."}] const SUM=`<h2>סיכום: מאיירס פרק 9 - דעות קדומות: יחס עוין לזולת</h2>
<div class="key"><b>למה הפרק הזה חשוב?</b> הספר פותח בהגדרה מצחיקה מ״מילון השטן״: דעה קדומה היא ״עוברת אורח, תועה ונטולת שורשים״. ואז דוגמאות קשות: אחרי 11 בספטמבר, ארבעה מכל עשרה אמריקנים הודו שיש להם דעה קדומה כלשהי נגד מוסלמים, ומוסלמים במדינות רבות תפסו את אנשי המערב כ״תאבי בצע״. אנשים כבדי משקל מתקשים למצוא עבודה ובן זוג, ולפי הספר אפליה על רקע משקל רווחת אפילו יותר מאפליה גזעית או מגדרית. דעות קדומות נמצאות בכל מקום, וכלפי כל קבוצה.<br><br>
<b>השאלה של הפרק במשפט אחד:</b> מה הן דעות קדומות, מאיפה הן באות, מה הן עושות, ואפשר להפחית אותן?<br><br>
<b>הפרק בנוי מחמש שאלות, כמו בספר:</b><br>
① <b>מה טבען וכוחן?</b> (סעיפים 1–2): מושגים, ודעות קדומות גלויות מול חבויות.<br>
② <b>מה המקורות החברתיים?</b> (סעיף 3): סטטוס, חיברות, קונפורמיות ומוסדות.<br>
③ <b>מה המקורות המוטיבציוניים?</b> (סעיף 4): תסכול, תחרות, זהות חברתית.<br>
④ <b>מה המקורות הקוגניטיביים?</b> (סעיף 5): איך דרך החשיבה שלנו יוצרת סטראוטיפים.<br>
⑤ <b>מה ההשלכות, ואיך מפחיתים?</b> (סעיפים 6–7).<br>
<b>בשיעור:</b> מפגשים 9–10. לקריאה: עמ׳ 372–426.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>קבוצת פנים</b></td><td>״אנחנו״: הקבוצה שאני שייך אליה.</td></tr>
<tr><td><b>קבוצת חוץ</b></td><td>״הם״: קבוצה שאני לא שייך אליה.</td></tr>
<tr><td><b>חבוי / גלוי</b></td><td>גלוי = מודע ונאמר. חבוי = אוטומטי, לפעמים בלי שנדע.</td></tr>
<tr><td><b>קטגוריזציה</b></td><td>מיון אנשים לקבוצות (לפי מין, גזע, גיל).</td></tr>
<tr><td><b>שעיר לעזאזל</b></td><td>מי שמאשימים אותו בבעיה שהוא לא גרם לה.</td></tr></table></div>

<div class="ex"><b>הדוגמה שתלווה אותנו: עדי</b> (דמות בדויה להמחשה). עוזרת גיוס בחברת הייטק, שמשתדלת להיות הוגנת, ומגלה שגם היא לא חסינה.</div>

<h3>1. מושגים: דעה קדומה, סטראוטיפ ואפליה</h3>
<p>לפני שמבינים מאיפה באות דעות קדומות, צריך להבחין בין שלושה מושגים שהולכים יחד, אבל הם לא אותו דבר. המפתח: <b>עמדה, אמונה, התנהגות</b>.</p>
<div class="tw"><table><tr><th>מושג</th><th>מה הוא</th><th>אצל עדי</th></tr>
<tr><td><b>דעה קדומה</b></td><td><b>עמדה</b>: שיפוט שלילי מראש של קבוצה ושל החברים בה</td><td>היא מרגישה חשדנות כלפי מועמדים מקבוצה מסוימת</td></tr>
<tr><td><b>סטראוטיפ</b></td><td><b>אמונה</b> על התכונות של קבוצה</td><td>״אנשים מהקבוצה הזו פחות חרוצים״</td></tr>
<tr><td><b>אפליה</b></td><td><b>התנהגות</b> שלילית לא מוצדקת כלפי קבוצה או חבריה</td><td>היא מזמינה פחות מועמדים מהקבוצה לראיון</td></tr></table></div>
<div class="ex"><b>האם סטראוטיפ תמיד שגוי?</b> לא. לפי הספר, סטראוטיפים יכולים להיות נכונים, לא נכונים, או <b>הכללת יתר</b> שמבוססת על ״גרעין של אמת״. הבעיה היא כשמחילים את האמונה על <b>כל</b> אחד מהקבוצה.<br>
<b>דעות קדומות מורכבות:</b> לפעמים יש בהן גם <b>חיבה פטרונית</b>, שמשאירה את הקבוצה בעמדה נחותה. <b>דוגמה מהספר:</b> זקנים נתפסים כטובי לב, אבל גם כחסרי יכולת, ולכן מדברים אליהם בהתנשאות.<br>
<b>שמות:</b> כלפי גזע = <b>גזענות</b>. כלפי מגדר = <b>סקסיזם</b>.</div>
<div class="ex"><b>אפליה בשטח, דוגמה מהספר:</b> חוקרים שלחו 1,115 מיילים זהים לבעלי דירות בלוס אנג׳לס. קיבלו תשובה מעודדת: 89% מהפניות בשם ״פטריק מקדוגל״, 66% בשם ״סעיד אל־רחמן״, ו־56% בשם ״טיירל ג׳קסון״. <b>אותו מכתב, שם אחר, יחס אחר.</b></div>

<h3>2. דעות קדומות גלויות וחבויות</h3>
<p>אם כולם יודעים שדעות קדומות הן רעות, אפשר היה לצפות שהן ייעלמו. הספר מראה שהן בעיקר <b>שינו צורה</b>.</p>
<div class="ex"><b>מה ירד:</b> דעות קדומות <b>גלויות</b> נגד שחורים ונגד נשים שכיחות הרבה פחות היום מאמצע המאה ה־20.<br>
<b>מה נשאר:</b> שיטות שמודדות דעות קדומות <b>חבויות</b> עדיין מוצאות הטיות נפוצות. אנשים יכולים להחזיק בעמדה גלויה שוויונית, ובכל זאת להגיב אוטומטית אחרת.<br>
<b>ראיות מהשטח:</b><br>
• <b>קורות חיים:</b> 5,000 קורות חיים נשלחו ל־1,300 משרות. מועמדים עם שם ״לבן״ (אמילי, גרג) קיבלו תשובה אחת לכל <b>10</b> פניות. מועמדים עם שם ״שחור״ (לקישה, ג׳מל) קיבלו תשובה אחת לכל <b>15</b>.<br>
• <b>קניית רכב:</b> נשים שחורות קיבלו הצעת מחיר גבוהה בכ־8% מגברים לבנים.<br>
• <b>רופאים:</b> רופאים עם הטיה גזענית חבויה חזקה יותר נטו פחות לתת תרופה מתאימה למטופל שחור עם כאבים בחזה.<br>
• <b>הטיית ירי:</b> בניסויים שבהם צריך להחליט מהר אם אדם על המסך אוחז אקדח או חפץ תמים, הגזע השפיע על התפיסה ועל התגובה.<br>
<b>אצל עדי:</b> היא בטוחה שהיא הוגנת, אבל כשהיא עוברת מהר על קורות חיים, שמות מסוימים ״נשמעים לה״ פחות מתאימים.</div>
<div class="ex"><b>מגדר:</b><br>
• <b>אפקט ״הנשים הן נפלאות״</b>: העמדה כלפי נשים היא לרוב <b>אוהדת</b>, כלומר סטראוטיפ <b>חיובי</b>.<br>
• <b>אבל</b> לפי סקירה של 15,000 איש ב־19 מדינות, עמדות מגדריות הן לא פעם <b>דו־משמעיות</b>: הן כוללות גם <b>סקסיזם נדיב</b> (יחס ״מגונן״) וגם <b>סקסיזם עוין</b>.<br>
• <b>הפתעה:</b> ב־104 מחקרים עם כ־20,000 משתתפים, הממצא הנפוץ היה ש<b>אין הטיה</b> בהערכת עבודה של גבר לעומת אישה.<br>
<b>לסיכום, לפי הספר:</b> הדעות הגלויות ירדו מאוד, אבל החבויות עדיין קיימות, ולכן צריך להבין את השורשים שלהן.</div>

<h3>3. מקורות חברתיים</h3>
<p>השאלה הראשונה על מקורות: מה ב<b>מצב החברתי</b> מצמיח דעות קדומות ומשמר אותן?</p>
<div class="ex"><b>הבדלי סטטוס:</b> קבוצה בעלת יתרון נעזרת בדעות קדומות כדי <b>להצדיק</b> את המעמד שלה. ״אם הם במצב נחות, כנראה זה מגיע להם״.<br>
<b>מכוונות לשליטה חברתית</b> = נטייה לראות את העולם כהיררכיה, ולשאוף שהקבוצה שלי תהיה למעלה. מי שגבוה בה מחזיק ביותר דעות קדומות.</div>
<div class="ex"><b>חיברות</b> (מה שלומדים בבית ובסביבה):<br>
• <b>אישיות סמכותנית</b> (אדורנו ועמיתיו): אנשים שהיו עוינים ליהודים נטו להיות עוינים גם לכל מיעוט אחר. היו להם ציות לסמכות, חשיבה נוקשה, ודעות קדומות כלפי ״כל מי ששונה״.<br>
• <b>דת:</b> הספר קורא לזה ״<b>תפקיד פרדוקסלי</b>״. חברי קהילות דתיות מבטאים יותר דעות קדומות. <b>אבל</b> מי ש<b>הדת היא מטרה לשמה</b> עבורו מביע <b>פחות</b> דעות קדומות ממי שהדת היא <b>אמצעי</b> למטרות אחרות (למשל פעילות חברתית). ומבקרים מזדמנים בכנסייה היו בעלי יותר דעות קדומות ממבקרים קבועים.<br>
<b>השאלה שעוזרת:</b> ״האם הדת היא העיקר בחיי האדם, או כלי לדבר אחר?״ עיקר = פחות דעות קדומות.</div>
<div class="ex"><b>קונפורמיות:</b> מרגע שדעה קדומה מקובלת, רבים מתאימים את עצמם אליה, לא מתוך שנאה אלא מתוך <b>צורך בקבלה</b>.<br>
<b>הדוגמה מהספר:</b> פועלי פלדה באינדיאנה וכורים בווירג׳יניה המערבית עבדו יחד בלי הפרדה גזעית, אבל בשכונות שלטה הפרדה נוקשה. כלומר, הדעה הקדומה לא ביטאה ״אישיות חולה״, אלא את הנורמה של כל מקום.<br>
<b>עוד ממצא:</b> אנשים ששמעו בדיחה סקסיסטית תמכו אחר כך פחות בנשים.<br>
<b>מוסדות:</b> בתי ספר, תקשורת וממשל יכולים לתמוך בדעות קדומות, לפעמים בלי כוונה. <b>דוגמה מהספר:</b> בתצלומים בעיתונות מתמקדים יותר ב<b>פנים</b> של גברים וב<b>גוף</b> של נשים.</div>

<h3>4. מקורות מוטיבציוניים</h3>
<p>המצב החברתי מצמיח דעות קדומות, אבל לפי הספר <b>המוטיבציה</b> קובעת אם הן יובילו לעוינות, או דווקא לרצון להשתחרר מהן.</p>
<div class="ex"><b>התקת תוקפנות</b> = תסכול מתפרק על מי שלא גרם לו, <b>שעיר לעזאזל</b>.<br>
<b>הדוגמה מהספר:</b> בין 1882 ל־1930, בדרום ארצות הברית היו יותר מקרי לינץ׳ בשחורים בשנים שבהן מחירי הכותנה היו נמוכים והתסכול הכלכלי גבוה.<br>
<b>תאוריית הקונפליקט הממשי</b> = כשקבוצות <b>מתחרות על משאבים מוגבלים</b> (עבודה, דיור), נוצרות ביניהן דעות קדומות.</div>
<div class="ex"><b>תאוריית הזהות החברתית</b> (טג׳פל וטרנר): חלק מהערך העצמי שלנו בא מהקבוצות שלנו. לכן אנחנו <b>ממיינים</b>, <b>מזדהים</b> ו<b>משווים</b>, ורוצים שהקבוצה שלנו תהיה עדיפה.<br>
<b>הניסוי המפתיע:</b> חילקו אנשים לקבוצות לפי משהו שרירותי, למשל אם העדיפו ציורים של פאול קליי או של קנדינסקי, ואפילו לפי הטלת מטבע. ובכל זאת, כשחילקו כסף, הם העדיפו את <b>הקבוצה שלהם</b>.<br>
<b>מה מגביר את ההעדפה?</b> <b>איום על הדימוי העצמי</b> (סטודנטים באחווה בעלת סטטוס נמוך זלזלו יותר באחרות), ו<b>מחשבה על המוות</b>: כשאנשים כתבו על מותם, הם העדיפו יותר את קבוצת הפנים.<br>
<b>אצל עדי:</b> ביום שבו הבוס מבקר את העבודה שלה, היא מוצאת את עצמה מעדיפה מועמדים ״שדומים לה״.</div>
<div class="ex"><b>החדשות הטובות: אפשר לשבור את ההרגל (דיוויין).</b> לכל אחד יש תגובות אוטומטיות. אבל כשהמוטיבציה להימנע מדעות קדומות היא <b>פנימית</b> (״אני מאמין שזה שגוי״), ולא <b>חיצונית</b> (״שלא יחשבו עליי רע״), אפילו הדעות הקדומות האוטומטיות פוחתות.<br>
<b>העצה:</b> כשתופסים את עצמנו מגיבים אוטומטית, לא להתייאש, אלא להשתמש באשמה כדי לשנות.</div>

<h3>5. מקורות קוגניטיביים</h3>
<p>עכשיו הצד שהכי מפתיע: חלק מהדעות הקדומות נובע פשוט מ<b>הדרך שבה המוח מפשט את העולם</b>, גם בלי שנאה ובלי מוטיבציה.</p>
<div class="tw"><table><tr><th>תהליך</th><th>מה קורה</th><th>דוגמה</th></tr>
<tr><td><b>קטגוריזציה</b></td><td>ממיינים אנשים לקבוצות, ואז מגזימים בדמיון בתוך הקבוצה ובהבדלים בין קבוצות</td><td>״כל הנדסאים כאלה״</td></tr>
<tr><td><b>הומוגניות קבוצת החוץ</b></td><td>״<b>הם</b> כולם אותו דבר, <b>אנחנו</b> שונים זה מזה״</td><td>אוהדי קבוצה יריבה נראים ״אותו טיפוס״</td></tr>
<tr><td><b>בולטות</b></td><td>אדם יוצא דופן מושך תשומת לב, ונראה כגורם</td><td>המיעוט היחיד בחדר</td></tr>
<tr><td><b>מתאם מדומה</b></td><td>שני דברים נדירים שקורים יחד (מיעוט + מעשה שלילי) נחרטים בזיכרון</td><td>ניסוי המילטון וגיפורד</td></tr>
<tr><td><b>הטיה לטובת הקבוצה</b></td><td>מעשה רע שלהם = ״זה האופי שלהם״. מעשה טוב שלהם = ״זה המצב״</td><td>דחיפה קלה של לבן = ״שובבות״, של שחור = ״אלימות״</td></tr>
<tr><td><b>אמונה בעולם צודק</b> (לרנר)</td><td>״כל אחד מקבל מה שמגיע לו״, ולכן מאשימים את הקורבן</td><td>״אם הוא עני, כנראה לא עבד מספיק״</td></tr></table></div>
<div class="ex"><b>שני ניסויים מרכזיים:</b><br>
<b>הצלקת:</b> חוקרים ציירו לסטודנטיות צלקת על הלחי באיפור תאטרון, ואמרו שהניסוי בודק איך יגיבו לצלקת. רגע לפני השיחה ״תיקנו את האיפור״, ובפועל מחקו את הצלקת. המשתתפות היו בטוחות שבן השיחה מתנהג אליהן אחרת בגלל הצלקת. <b>הלקח:</b> מי שמרגיש ״חריג״ רגיש יותר לכל התנהגות, ומייחס אותה לחריגות שלו.<br>
<b>המילטון וגיפורד (מתאם מדומה):</b> סטודנטים קראו על מעשים של חברי קבוצה גדולה (A) וקבוצה קטנה (B). היחס בין מעשים טובים לרעים היה <b>זהה</b> בשתי הקבוצות. ובכל זאת, הם הגזימו בהערכת המעשים הרעים של הקבוצה הקטנה, ושפטו אותה בחומרה. <b>למה?</b> מיעוט + מעשה רע = שני דברים נדירים, ולכן בולטים בזיכרון.</div>

<h3>6. ההשלכות של דעות קדומות</h3>
<p>אחרי שהבנו מאיפה הן באות, השאלה היא מה הן <b>עושות</b>. לפי הספר, סטראוטיפים משמרים את עצמם, יוצרים מציאות, ופוגעים בביצוע.</p>
<div class="ex"><b>סטראוטיפים מנציחים את עצמם.</b> כשפוגשים מישהו שלא מתאים לסטראוטיפ, יש שתי דרכים ״להסתדר״:<br>
• <b>מיון מחדש</b> = ״הוא יוצא מן הכלל״. הסטראוטיפ הכללי <b>לא משתנה</b>. <b>דוגמה מהספר:</b> ילדים בריטים חושבים ששוטר בית הספר נחמד, אבל ששוטרים בכלל מסוכנים.<br>
• <b>תת־הקבצה</b> = יוצרים תת־קבוצה חדשה (״שחורים מהמעמד הבינוני בעלי מקצועות חופשיים״). הסטראוטיפ <b>משתנה מעט</b>.<br>
<b>השאלה שעוזרת:</b> ״האם האדם הוצא מהקבוצה כחריג יחיד, או שנוצרה תת־קבוצה?״</div>
<div class="ex"><b>נבואה המגשימה את עצמה.</b> הניסוי מהספר: סטודנטים לבנים בפרינסטון ראיינו מועמדים לבנים ושחורים (שחקנים). כשהמועמד היה שחור, המראיינים ישבו רחוק יותר וקיצרו את הראיון ב־25%. בניסוי השני, מראיינים שהתנהגו באותה צורה ״מרוחקת״ גרמו גם למועמדים <b>לבנים</b> להיראות פחות טובים.<br>
<b>הלקח:</b> הציפייה יצרה את ההתנהגות שאישרה אותה.</div>
<div class="ex"><b>איום הסטראוטיפ (סטיל)</b> = החשש ״שישפטו אותי לפי הסטראוטיפ״ פוגע בביצוע, <b>מיד</b>.<br>
• <b>נשים ומתמטיקה:</b> במבחן קשה במתמטיקה, נשים שנאמר להן שאין הבדלים מגדריים במבחן הצליחו כמו גברים. נשים שנאמר להן שיש הבדל לטובת גברים הצליחו פחות.<br>
• <b>סטודנטים שחורים:</b> כשהמבחן הוצג כמבחן ש״מאבחן יכולת מילולית״, הם הצליחו פחות. כשהוצג כמשימת מעבדה, לא היה הבדל.<br>
<b>לאורך זמן:</b> איום חוזר עלול להוביל ל<b>חוסר הזדהות</b> עם התחום (״מתמטיקה זה לא בשבילי״).<br>
<b>מה עוזר, לפי סטיל:</b> לאתגר תלמידים ולהביע אמון ביכולת שלהם.<br>
<b>ההבדל מנבואה מגשימה:</b> בנבואה, ההתנהגות של <b>אחרים</b> כלפיי משנה אותי לאורך זמן. באיום, <b>החשש שלי</b> פוגע בביצוע ברגע.</div>
<div class="ex"><b>האם סטראוטיפים מטים את השיפוט של יחידים?</b><br>
<b>החדשות הטובות:</b> כשמכירים אדם, הסטראוטיפ נחלש מאוד. <b>הניסוי:</b> סטודנטים קראו איך ״לילי״ או ״ביל״ הגיבו למצבים, בצורה אסרטיבית או פסיבית. הניבויים שלהם הושפעו <b>רק</b> מההתנהגות, ולא מהמגדר.<br>
<b>אבל:</b> כשהסטראוטיפ חזק, הוא משפיע גם כשאומרים שהוא לא רלוונטי. אנשים העריכו גברים בתמונות כגבוהים יותר מנשים בגובה זהה, גם כשנאמר להם שבמדגם המין לא מנבא גובה, וגם כשהבטיחו להם כסף על דיוק.<br>
<b>וסטראוטיפים מטים פרשנות:</b> ״פוליטיקאי אמר דברים לא נכונים״ = הוא שיקר. ״פיזיקאי אמר דברים לא נכונים״ = הוא טעה.<br>
<b>מקרה אמיתי:</b> אן הופקינס הייתה האישה היחידה בין 88 מועמדים לשותפות בחברת רואי חשבון, ודורגה ראשונה במספר העסקאות, ובכל זאת לא קודמה. הפסיכולוגית סוזן פיסק העידה לטובתה על השפעת הסטראוטיפים, וההעדות תרמה להצלחה בבית המשפט העליון.</div>

<h3>7. האם אפשר להפחית דעות קדומות?</h3>
<div class="ex"><b>לפי הספר,</b> פסיכולוגים הצליחו יותר <b>להסביר</b> דעות קדומות מאשר <b>להפחית</b> אותן, כי יש להן הרבה מקורות. אבל כל מקור מרמז על פתרון:<br>
• סטטוס לא שוויוני ← יחסים על בסיס <b>סטטוס שוויוני ושיתוף פעולה</b>.<br>
• דעות קדומות שמצדיקות אפליה ← <b>אכיפת</b> איסור אפליה.<br>
• מוסדות שתומכים בהן ← <b>שינוי המוסדות</b> (למשל תקשורת שמראה הרמוניה).<br>
• ״הם כולם אותו דבר״ ← לראות את חברי הקבוצה <b>כיחידים</b>.<br>
• תגובות אוטומטיות ← להשתמש ב<b>אשמה</b> כדי לשבור את ההרגל.<br>
<b>אצל עדי:</b> היא מבקשת להסתיר שמות בקורות החיים בשלב הראשון (שינוי מוסדי), ומתחילה לשים לב לתגובות האוטומטיות שלה.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. <b>דעה קדומה</b> = עמדה, <b>סטראוטיפ</b> = אמונה, <b>אפליה</b> = התנהגות. דעות קדומות גלויות ירדו, אבל <b>חבויות</b> עדיין נפוצות.<br>
2. <b>מקורות חברתיים:</b> הצדקת סטטוס, מכוונות לשליטה חברתית, אישיות סמכותנית, דת (פרדוקס), קונפורמיות ומוסדות.<br>
3. <b>מקורות מוטיבציוניים:</b> תסכול (שעיר לעזאזל), תחרות על משאבים, ו<b>זהות חברתית</b>, שמעדיפה את קבוצת הפנים אפילו בקבוצות שרירותיות. מוטיבציה פנימית יכולה לשבור את ההרגל.<br>
4. <b>מקורות קוגניטיביים:</b> קטגוריזציה, הומוגניות קבוצת החוץ, בולטות, מתאם מדומה, הטיה לטובת הקבוצה, ועולם צודק.<br>
5. <b>השלכות:</b> סטראוטיפים מנציחים את עצמם, יוצרים נבואות מגשימות, ופוגעים בביצוע דרך <b>איום הסטראוטיפ</b>. מידע אישי מחליש אותם, אבל סטראוטיפ חזק משפיע גם כשהוא לא רלוונטי.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להבחין בין דעה קדומה, סטראוטיפ ואפליה בדוגמה.<br>
• לתת דוגמאות לדעות קדומות חבויות.<br>
• לשייך מקרה למקור חברתי, מוטיבציוני או קוגניטיבי.<br>
• להסביר את ניסויי הקבוצות השרירותיות, הצלקת והמתאם המדומה.<br>
• להבחין בין מיון מחדש לתת־הקבצה, ובין נבואה מגשימה לאיום הסטראוטיפ.<br>
• להציע דרכים להפחתת דעות קדומות לפי המקור.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>דעה קדומה = עמדה</b>; <b>סטראוטיפ = אמונה</b>; <b>אפליה = התנהגות</b>.</li>
<li><b>סטראוטיפ לא תמיד שגוי</b>; הבעיה היא הכללת יתר.</li>
<li><b>מיון מחדש</b> משמר את הסטראוטיפ; <b>תת־הקבצה</b> משנה אותו מעט.</li>
<li><b>העדפת קבוצת פנים</b> מופיעה גם בקבוצות שרירותיות לגמרי.</li>
<li><b>איום הסטראוטיפ פועל מיד</b>, בשונה מנבואה מגשימה.</li>
<li><b>דת כמטרה לשמה</b> = פחות דעות קדומות. <b>דת כאמצעי</b> = יותר.</li>
<li><b>הומוגניות</b> מיוחסת לקבוצת <b>החוץ</b>, לא לשלנו.</li>
<li><b>מידע אישי</b> מחליש סטראוטיפים; סטראוטיפ <b>חזק</b> משפיע גם כשאומרים שהוא לא רלוונטי.</li>
<li><b>בהערכת עבודות</b> של גברים ונשים, ברוב המחקרים לא נמצאה הטיה.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
