:root[data-theme="dark"]{

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

  {h:"עידו, והקשר בין חשיבה לעשייה",html:`${def("על מה הנושא",`מה זו עמדה, ולמה החוקרים הופתעו לגלות שהיא מנבאת התנהגות רק מעט.<br><b>מה נלמד כאן:</b> עידו · הגדרת עמדה · ABC · ויקר · צביעות מוסרית`)}${ex("<b>עידו</b> (דמות בדויה להמחשה) סטודנט שנה ב׳. הוא בעד איכות הסביבה אבל לא ממחזר, ובשבוע הבא יתחיל להתנדב במוקד סיוע ״רק לשעה״. נראה איך העמדות שלו משפיעות על המעשים, ואיך המעשים משנים את העמדות.")}${def("עמדה",`${E("Attitude")} הערכה חיובית או שלילית של משהו או מישהו, שנטועה באמונות ובאה לידי ביטוי ברגשות ובכוונות לפעול.`)}${fig("abc46","שלושת המרכיבים: Affect (רגש), Behavior (נטייה התנהגותית), Cognition (אמונה).")}`,q:"q1"},
  {h:"הפער בין דיבור למעשה",html:`<p><b>ויקר</b> (1969) סקר עשרות מחקרים: עמדות <b>כמעט לא</b> ניבאו התנהגות. עמדות כלפי הונאה ניבאו מעט רמאות; עמדות כלפי הכנסייה ניבאו מעט נוכחות ביום ראשון.</p>${def("צביעות מוסרית",`להיראות מוסרי ולהימנע מהמחיר. <b>בטסון</b>: רק 5% חשבו שמוסרי לקחת לעצמם את המשימה עם הפרס, אבל <b>80%</b> לקחו. כשהטילו מטבע בחשאי, <b>90%</b> ״זכו״. גם עם מדבקות על המטבע: 24 מתוך 28.`)}${rem("פסטינגר (1964) הציע שהכיוון הפוך: <b>ההתנהגות</b> משפיעה על העמדות. ״קל לנו למצוא סיבות למה שכבר עשינו״.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"target",title:"מתי עמדות מנבאות התנהגות",blocks:[
  {h:"כשההשפעות האחרות מזעריות",html:`${def("על מה הנושא",`שלושה תנאים שבהם עמדות כן מנבאות התנהגות.<br><b>מה נלמד כאן:</b> מדידה בלי לחץ חברתי · IAT · צבירה · עמדה ספציפית · תאוריית ההתנהגות המתוכננת · עמדה איתנה`)}<p>מה שאנחנו <b>אומרים</b> נתון ללחץ חברתי (חברי קונגרס שהצביעו בעד מלחמה שהסתייגו ממנה). לכן מודדים גם עמדות <b>חבויות</b>.</p>${def("מבחן האסוציאציות החבויות (IAT)",`מודד <b>זמן תגובה</b> בקישור בין מושגים למילות הערכה. מתאם ממוצע עם עמדות גלויות: <b>0.24</b>. בעמדות שנוצרות בילדות (גזע, מגדר) החבויות מנבאות טוב יותר; בצרכנות ובפוליטיקה, הגלויות.`)}${rem("ביקורת: ה־IAT לא מהימן מספיק לאבחון יחידים, ומשווה תמיד בין שתי קבוצות. אולי האטה נובעת מחמלה, לא מעוינות.")}<p><b>צבירה</b>: עמדה דתית לא מנבאת אם תלך להתפלל בשבוע הבא, אבל מנבאת היטב את <b>סך</b> ההתנהגות הדתית לאורך זמן.</p>`,q:"q5"},
  {h:"עמדה ספציפית",html:`<p><b>אייזן ופישביין</b>: עמדה <b>כללית</b> מול התנהגות <b>ספציפית</b> לא מנבאת (26 מתוך 27 מחקרים). עמדה <b>רלוונטית ישירות</b> מנבאת (כל 26). עמדה כלפי ״כושר״ לא מנבאת ריצה; עמדה כלפי <b>ריצה</b> כן.</p><div class="tw"><table><tr><th>תאוריית ההתנהגות המתוכננת</th><th>דוגמה</th></tr><tr><td><b>עמדה</b> כלפי ההתנהגות</td><td>״אני בעד כושר״</td></tr><tr><td><b>נורמות</b> סובייקטיביות</td><td>״השכנים רצים״</td></tr><tr><td><b>שליטה</b> נתפסת</td><td>״אני יכול לעשות את זה״</td></tr><tr><td>= <b>כוונה</b>, ואז התנהגות</td><td>״אתחיל בשבוע הבא״</td></tr></table></div>${ex("עידו ״בעד הסביבה״ באופן כללי, וזה לא מנבא אם ימחזר. עמדה כלפי <b>מחזור</b> עצמו הייתה מנבאת. ואפילו לשאול אותו ״תמחזר השבוע?״ מעלה את הסיכוי שימחזר.")}`,q:"q7"},
  {h:"עמדה איתנה",html:`<p>רוב ההתנהגות <b>אוטומטית</b>. עמדות מנבאות כשהן <b>מודעות</b>: סטודנטים שהתבקשו קודם לחשוב על עמדתם באפליה מתקנת פסקו לפיה במשפט מדומה.</p>${tiles([["id","מראה","71% רימו כשהיו לבד; מול מראה ועם הקול שלהם, רק 7%"],["hand","התנסות","רק מי שחווה בעצמו את מחסור הדיור פעל נגדו"],["x","דעה קדומה","בושמן ובונאצ׳י: בעלי דעה קדומה נגד ערבים העבירו פחות דוא״ל עם בשורה טובה לנמען ״ערבי״, ויותר עם בשורה רעה"]])}${rem("עמדות מנבאות כש: (1) <b>ההשפעות האחרות מזעריות</b>, (2) העמדה <b>ספציפית</b> להתנהגות, (3) העמדה <b>איתנה</b>.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"copies",title:"תפקידים ודיבור",blocks:[
  {h:"משחק תפקידים",html:`${def("על מה הנושא",`הכיוון ההפוך: איך המעשים שלנו משנים את העמדות.<br><b>מה נלמד כאן:</b> הדגמות · תפקיד · ניסוי הכלא של סטנפורד · דיבור שהופך לאמונה`)}<p>מי שקיבל הוראה בהיפנוזה לחלוץ נעליים הסביר ״הרגליים שלי עייפות״. מי שראשו הופנה בגירוי חשמלי הסביר ״חיפשתי את נעל הבית״. <b>המעשה יצר את ההסבר</b>.</p>${def("תפקיד",`${E("Role")} מערכת נורמות שמגדירה איך מתנהג מי שתופס עמדה חברתית. בהתחלה מרגיש מזויף, ובהדרגה נטמע.`)}<p><b>זימברדו</b>: בכלא המדומה בסטנפורד, ״סוהרים״ שנבחרו בהטלת מטבע התחילו להשפיל את ה״אסירים״, והניסוי נעצר אחרי <b>6 ימים</b> במקום שבועיים. לא כולם נהפכו לסאדיסטים: ההתנהגות היא תוצר של <b>אדם ומצב</b> יחד.</p>${ex("בשבוע הראשון במוקד עידו מרגיש ״שחקן״. אחרי חודש הוא כבר מרגיש מתנדב אמיתי.")}`,q:"q11"},
  {h:"דיבור נהפך לאמונה",html:`<p>אנשים מתאימים את המסר לקהל, ואז <b>מאמינים</b> בו, בתנאי שלא שוחדו ולא אולצו.</p>${def("הניסוי של היגינס",`סטודנטים סיכמו תיאור של אדם בשביל מישהו שמחבב אותו או לא. מי שכתב חיובי, <b>חיבב</b> אותו יותר, וגם <b>זכר</b> את התיאור כחיובי יותר.`)}${ex("ריי היימן התחיל לקרוא בכף היד בשביל כסף, בלי להאמין. כעבור שנים <b>האמין</b>. רק כשאמר ללקוחות את <b>ההפך</b> ממה שהקווים ״מראים״ והם עדיין התרשמו, הבין שזה לא עובד.")}`,q:"q13"}
 ]},
 {id:"t4",icon:"link",title:"רגל בדלת, מוסר ואידאולוגיה",blocks:[
  {h:"רגל בדלת וכדור נמוך",html:`${def("על מה הנושא",`איך התחייבות קטנה מובילה לגדולה, ואיך מעשים משנים עמדות מוסריות וחברתיות.<br><b>מה נלמד כאן:</b> רגל בדלת · כדור נמוך · מעשים רעים וטובים · גזענות · אידאולוגיה`)}${def("רגל בדלת",`${E("Foot-in-the-door")} מי שהסכים לבקשה <b>קטנה</b> נוטה להיענות אחר כך לבקשה <b>גדולה</b>.`)}<div class="tw"><table><tr><th>מחקר</th><th>בלי בקשה קטנה</th><th>עם בקשה קטנה</th></tr><tr><td>שלט ״נהגו בזהירות״ בחצר</td><td>17%</td><td><b>76%</b> (אחרי מדבקה קטנה)</td></tr><tr><td>התרמה לאגודה למלחמה בסרטן</td><td>46%</td><td>כמעט <b>כפול</b> (אחרי סיכה)</td></tr><tr><td>התרמת דם</td><td>62%</td><td><b>81%</b> (״אנו מחכים לך, בסדר?״)</td></tr></table></div>${def("כדור נמוך",`${E("Low-ball technique")} מסכימים לעסקה, ואז המחיר עולה, ונשארים. ניסוי ב־7:00 בבוקר: 24% הגיעו; כשהסכימו לפני שידעו את השעה, <b>53%</b>.`)}${ex("עידו הסכים ״רק לשעה״ במוקד. עכשיו הוא שם שלוש משמרות בשבוע. מוסר ההשכל: לפני בקשה קטנה, לחשוב מה יבוא אחריה.")}`,q:"q15"},
  {h:"מעשים רעים ומעשים טובים",html:`<p>לא רק פוגעים במי ששונאים; גם <b>שונאים את מי שפגענו בו</b>, כדי להצדיק. בעיקר כשהמעשה נעשה <b>מבחירה</b>.</p>${tiles([["x","הריגת חרקים","מי ש״הרג״ 5 חרקים בתרגול המשיך להרוג יותר (בפועל אף חרק לא נפגע)"],["check","הרובוט של פרידמן","ילדים שאוימו <b>במתינות</b> לא לשחק בו נמנעו גם אחרי שבועות; שאוימו בחומרה, שיחקו"],["bulb","בנג׳מין פרנקלין","ביקש לשאול ספר מיריב, והיריב נעשה חברו"]])}${rem("אם רוצים לאהוב מישהו יותר, כדאי לעשות לו טובה.")}`,q:"q17"},
  {h:"גזענות ואידאולוגיה",html:`<p>אחרי ביטול ההפרדה בבתי הספר (1954) וחוק זכויות האזרח, <b>העמדות</b> השתנו בעקבות <b>ההתנהגות</b>: תמיכה במגורים בכל שכונה עלתה מ־65% ל־85%. כלומר, אפשר ״לחוקק מוסר״ ולשנות לבבות בעקיפין.</p><p>אבל זה גם מסוכן: ברכת ״הייל היטלר״ גרמה לגרמנים לשכנע את עצמם להאמין בה. שבויים אמריקנים בקוריאה עברו <b>הסלמה הדרגתית</b>: מהצהרות פשוטות ועד ביקורת עצמית והתוודות, ורבים שכנעו את עצמם.</p>`,q:"q19"}
 ]},
 {id:"t5",icon:"scales",title:"הצגה עצמית ודיסוננס",blocks:[
  {h:"שלושה הסברים",html:`${def("על מה הנושא",`למה מעשים משנים עמדות: שלוש תאוריות, ובראשן הדיסוננס.<br><b>מה נלמד כאן:</b> הצגה עצמית · דיסוננס קוגניטיבי · הצדקה לא מספקת · 1$ מול 20$ · בחירה`)}<div class="tw"><table><tr><th>תאוריה</th><th>ההסבר</th></tr><tr><td><b>הצגה עצמית</b></td><td>רוצים <b>להיראות</b> עקביים בעיני אחרים</td></tr><tr><td><b>דיסוננס קוגניטיבי</b></td><td>רוצים להפחית <b>אי־נוחות</b> פנימית, ולכן מצדיקים</td></tr><tr><td><b>תפיסה עצמית</b></td><td><b>מסיקים</b> על עצמנו מההתנהגות, כמו צופה מהצד</td></tr></table></div><p>הצגה עצמית מסבירה חלק: בגלאי שקר מדומה שינוי העמדה <b>פוחת מאוד</b>. אבל אנשים מציגים את העמדה החדשה גם לפני מי שלא ראה את ההתנהגות.</p>`,q:"q21"},
  {h:"דיסוננס והצדקה לא מספקת",html:`${def("דיסוננס קוגניטיבי",`${E("Cognitive dissonance")} מתח שמתעורר כשאנחנו מודעים לשתי קוגניציות שלא מתיישבות (״אני מעשן״ ו״עישון מסוכן״). <b>פסטינגר</b> (1957). מפחיתים אותו בשינוי החשיבה: מעשנים נוטים להכחיש את הסכנה.`)}${def("פסטינגר וקרלסמית (1959)",`אחרי שעה של סיבוב ידיות, משתתפים התבקשו לומר למשתתפת הבאה שהניסוי מעניין. מי שקיבל <b>1$</b> דירג אחר כך את המשימה כמהנה יותר ממי שקיבל <b>20$</b>.`)}${fig("dis46","מי שקיבל 20$ היה לו הסבר חיצוני. מי שקיבל דולר נאלץ להצדיק מבפנים.")}${def("הצדקה לא מספקת",`${E("Insufficient justification")} כשאין הצדקה חיצונית מספקת, מצדיקים <b>פנימית</b> ומשנים עמדה.`)}`,q:"q23"},
  {h:"בחירה, אחריות ועונשים",html:`<p>ההשפעה החזקה ביותר כש<b>בחרנו</b> בחופשיות ויכולנו לצפות את התוצאות. הקראת בדיחות על עורכי דין יצרה עמדה שלילית רק כשבחרו בכך. חיבור בעד העלאת שכר לימוד תמורת 1.5$ שינה עמדה.</p><p>ב־2003, כשלא נמצא נשק להשמדה המונית בעירק, רבים ״זכרו״ שהמלחמה נועדה לשחרר את העם, והתמיכה ״גם בלי נשק״ עלתה מ־38% ל־58%.</p>${rem("העיקרון: עמדות מתגבשות אחרי התנהגויות שאנחנו מרגישים <b>אחריות אישית</b> עליהן. לכן הורים צריכים להשתמש בדרבון <b>במידה הנחוצה בלבד</b>: ״סדר את החדר או שתחטוף״ הוא הצדקה מספקת, ולא נוצרת עמדה פנימית.")}`,q:"q25"}
 ]},
 {id:"t6",icon:"brain",title:"אחרי החלטה, ותפיסה עצמית",blocks:[
  {h:"דיסוננס אחרי החלטה",html:`${def("על מה הנושא",`מה קורה אחרי שבוחרים, ואיך אנחנו לומדים על עצמנו מההתנהגות.<br><b>מה נלמד כאן:</b> ברם · מהמרים · ילדים וקופים · תאוריית התפיסה העצמית · הבעות ועמדות`)}<p>אחרי החלטה חשובה <b>מאדירים</b> את מה שבחרנו ו<b>ממעיטים</b> בערך מה שדחינו.</p>${tiles([["gear","ברם (1956)","אחרי בחירה בין שני מוצרים דומים, נשים דירגו את הנבחר גבוה יותר ואת הנדחה נמוך יותר"],["chart","מהמרים","מי שכבר הימר היה אופטימי יותר ממי שעמד בתור להמר"],["check","ילדים בני 4","בחרו את המדבקה ״השלישית״ ב־63% במקום 50%; גם קופי קפוצ׳ין"]])}`,q:"q27"},
  {h:"תאוריית התפיסה העצמית",html:`${def("תאוריית התפיסה העצמית",`${E("Self-perception theory")} <b>בם</b> (1972): כשאנחנו <b>לא בטוחים</b> בעמדות שלנו, אנחנו מסיקים עליהן מההתנהגות שלנו, כמו צופה מהצד. בייחוד כשאין אילוץ חיצוני.`)}<p><b>ויליאם ג׳יימס</b> הציע דבר דומה לגבי רגש: רואים דוב, בורחים, ואז מרגישים פחד.</p>${ex("עידו שם לב שהוא כבר חודש מגיע למוקד גם כשאין לו כוח. ״כנראה שזה חשוב לי״, הוא מסיק. זו תפיסה עצמית.")}<p>זה גם מסביר את <b>רגל בדלת</b>: מי שנענה לבקשה קטנה רואה את עצמו כ״מישהו שעוזר״.</p>`,q:"q29"},
  {h:"הבעות ועמדות",html:`<div class="tw"><table><tr><th>מחקר</th><th>ממצא</th></tr><tr><td><b>לירד</b></td><td>מי שהתבקש לכווץ את שרירי הזעף דיווח על כעס</td></tr><tr><td><b>שטרק</b></td><td>עט בין ה<b>שיניים</b> (שרירי חיוך): הקריקטורות מצחיקות יותר מעט בין השפתיים</td></tr><tr><td><b>הנהון</b></td><td>מי שהניע את הראש למעלה ולמטה הסכים יותר עם התכנית ברדיו</td></tr><tr><td><b>אפוד ומשקולות</b></td><td>מי שהלך כמו אדם כבד משקל ייחס יותר סטראוטיפים של שמנים</td></tr><tr><td><b>ידיים שלובות</b></td><td>התמידו 55 שניות בחידה, לעומת 30</td></tr></table></div>${rem("חיקוי הבעת כאב של אחר הגביר <b>אמפתיה</b> (ולא ״שחרר״ את הרגש כפי שפרויד חשב).")}`,q:"q31"}
 ]},
 {id:"t7",icon:"sprout",title:"הצדקת יתר",blocks:[
  {h:"כשתגמול הורס הנאה",html:`${def("על מה הנושא",`למה תגמול על משהו שממילא אוהבים לעשות עלול להרוס את ההנאה.<br><b>מה נלמד כאן:</b> אפקט הצדקת היתר · מוטיבציה פנימית וחיצונית · תגמול בלתי צפוי · שבח מיידע`)}${def("אפקט הצדקת היתר",`${E("Overjustification effect")} נותנים תגמול על מה שאנשים <b>ממילא אוהבים</b>, והם מתחילים לייחס את ההתנהגות לתגמול, והמוטיבציה הפנימית יורדת.`)}${ex("זקן ששנא את רעש הילדים שילם להם 50 סנט כדי שיבואו לשחק, אחר כך 25, אחר כך 15. כשהציע 10, הם סירבו: ״לא שווה את המאמץ״. המשחק הפך לעבודה.")}<p>בנו של מאיירס קרא 6–8 ספרים בשבוע, עד שהספרייה הציעה מסיבה על 10 ספרים בשלושה חודשים. אז ירד לאחד או שניים: ״צריך רק עשרה״.</p>`,q:"q33"},
  {h:"איך לתגמל נכון",html:`<div class="tw"><table><tr><th>פוגע במוטיבציה הפנימית</th><th>לא פוגע, ואף מחזק</th></tr><tr><td>תגמול <b>צפוי מראש</b> שנועד <b>לשלוט</b></td><td>תגמול <b>בלתי צפוי</b></td></tr><tr><td>״עשיתי זאת בשביל הכסף״</td><td>שבח <b>מיידע</b>: ״אני עושה זאת היטב״</td></tr></table></div><p>ולמשימות שלא אוהבים מלכתחילה? להשתמש בתמריץ כדי להתחיל, ואז להציע <b>סיבה פנימית</b>: ״לא מפתיע שהמכירות עלו, אתה יודע לעשות רושם טוב״.</p>${ex("אם המוקד יתחיל לשלם לעידו על כל משמרת, הוא עלול להתחיל לחשוב ״אני כאן בשביל הכסף״. תודה אישית על עבודה טובה עדיפה.")}`,q:"q35"}
 ]}

const Q={"q1":{"t":"t1","v":[{"q":"מהי עמדה, לפי הפרק?","a":"הערכה חיובית או שלילית של משהו או מישהו","w":["התנהגות קבועה שחוזרת על עצמה בכל מצב","ידע עובדתי ומדויק על נושא מסוים","תכונת אישיות יציבה שקיימת מלידה"],"e":"היא נטועה באמונות ובאה לידי ביטוי ברגשות ובכוונות לפעול."},{"q":"מה מייצגות האותיות ABC בעמדה?","a":"רגש, התנהגות וקוגניציה","w":["יחס, אמונה ושכנוע עצמי","עמדה, התנהגות ותרבות סביבה","קשב, זיכרון ושיפוט חברתי"],"e":"Affect, Behavior, Cognition."}]},"q2":{"t":"t1","v":[{"q":"עידו ״בעד הסביבה״ אבל לא ממחזר. מה זה מדגים?","a":"פער בין עמדה להתנהגות","w":["דיסוננס שהופחת בהצלחה","אפקט הצדקת יתר","רגל בדלת"],"e":"עמדה כללית לא בהכרח מנבאת התנהגות ספציפית."}]},"q3":{"t":"t1","v":[{"q":"למה הגיע ויקר (1969) בסקירת המחקרים?","a":"עמדות כמעט לא מנבאות התנהגות","w":["עמדות מנבאות התנהגות כמעט תמיד","התנהגות לא משפיעה על עמדות","עמדות משתנות רק בילדות"],"e":"למשל, עמדות כלפי הונאה ניבאו מעט את הרמאות בפועל."},{"q":"מה מצא בטסון על צביעות מוסרית?","a":"רוב האנשים לקחו לעצמם את המשימה עם הפרס","w":["רוב האנשים נתנו לשותף את המשימה הטובה","הטלת מטבע הובילה לחלוקה הוגנת","רק מי שחשב שזה מוסרי לקח את הפרס"],"e":"רק 5% חשבו שזה מוסרי, אבל 80% לקחו."}]},"q4":{"t":"t1","v":[{"q":"מה קרה כשמשתתפים יכלו להטיל מטבע בחשאי?","a":"כ־90% ״זכו״ במשימה הטובה","w":["כמחצית זכו, כמו שמצופה","כולם ויתרו על המשימה הטובה","אף אחד לא הטיל את המטבע"],"e":"הם נראו הוגנים, אבל התוצאה לא תאמה הסתברות."},{"q":"מה הציע פסטינגר (1964) על הקשר בין עמדה להתנהגות?","a":"ההתנהגות משפיעה על העמדות","w":["העמדות תמיד קובעות את ההתנהגות","אין שום קשר בין השתיים","רק רגשות משפיעים על התנהגות"],"e":"״קל לנו למצוא סיבות למה שכבר עשינו״."}]},"q5":{"t":"t2","v":[{"q":"מה מודד מבחן האסוציאציות החבויות (IAT)?","a":"זמן תגובה בקישור בין מושגים למילות הערכה","w":["את העמדות שאנשים מדווחים עליהן בשאלון","את הפעילות החשמלית של שרירי הפנים","את מידת הכנות בדיווח עצמי"],"e":"קישור מהיר יותר מעיד על אסוציאציה חזקה יותר."},{"q":"מה המתאם הממוצע בין IAT לעמדות גלויות?","a":"0.24, מתון","w":["0.90, גבוה מאוד","0, ":"בין השיניים מפעיל את שרירי החיוך."},{"q":"מה קרה למי שהניע את הראש למעלה ולמטה בזמן תכנית רדיו?","a":"הסכים יותר עם הדעות בתכנית","w":["הסכים פחות עם הדעות בתכנית","שכח מהר את תוכן התכנית","לא הושפע מהתכנית בשום צורה"],"e":"מחשבות חיוביות מסתדרות עם הנהון."}]},"q32":{"t":"t6","v":[{"q":"מה קרה לצופים שחיקו הבעת כאב של מי שקיבל הלם?","a":"הרגישו יותר אמפתיה ועוררות","w":["נרגעו ו״שחררו״ את הרגש שלהם","לא הרגישו שום דבר מיוחד במהלך","הפסיקו להסתכל על מי שקיבל הלם"],"e":"בניגוד לפרויד, ההבעה לא ״שחררה״ את הרגש אלא העצימה אותו."},{"q":"מה קרה למי שעבד על חידה בידיים שלובות?","a":"התמיד כמעט פי 2","w":["ויתר מהר יותר מאחרים","פתר את החידה הבלתי פתירה","התעייף מהר מהרגיל"],"e":"55 שניות לעומת 30. תנוחה משפיעה על ביצוע."}]},"q33":{"t":"t7","v":[{"q":"מהו אפקט הצדקת היתר?","a":"תגמול על מה שאוהבים פוגע בהנאה","w":["תגמול על מה שלא אוהבים מגביר הנאה","הצדקה מוגזמת של כל התנהגות","עונש על מה שאוהבים מגביר מוטיבציה"],"e":"מתחילים לייחס את ההתנהגות לתגמול."},{"q":"למה הילדים הפסיקו לבוא לשחק ליד ביתו של הזקן?","a":"המשחק הפך לעבודה בשביל כסף","w":["הזקן ביקש מהם במפורש ללכת","הם התבגרו ושיחקו פחות","הם מצאו מקום אחר ושקט יותר"],"e":"כשהתשלום ירד ל־10 סנט, ״לא שווה את המאמץ״."}]},"q34":{"t":"t7","v":[{"q":"מה קרה לבנו של מאיירס אחרי שהספרייה הציעה מסיבה על 10 ספרים?","a":"קרא פחות ספרים","w":["קרא יותר ספרים","לא השתנה דבר","הפסיק לגמרי לקרוא"],"e":"מ־6–8 בשבוע לאחד או שניים: ״צריך רק עשרה״."}]},"q35":{"t":"t7","v":[{"q":"איזה תגמול לא פוגע במוטיבציה הפנימית?","a":"תגמול בלתי צפוי","w":["תגמול צפוי מראש","תגמול שנועד לשלוט","תגמול גדול במיוחד"],"e":"אפשר עדיין לייחס את הפעולה לרצון שלנו."},{"q":"איזה שבח מחזק מוטיבציה פנימית?","a":"שבח מיידע על ביצוע טוב","w":["שבח שנועד לשלוט בהתנהגות","שבח כללי בלי קשר לביצוע","שבח שמגיע עם כסף"],"e":"״אני עושה זאת היטב״ מגביר תחושת מסוגלות."}]},"q36":{"t":"t7","v":[{"q":"מה כדאי לעשות כשמשימה לא מהנה מלכתחילה?","a":"תמריץ בהתחלה, ואז סיבה פנימית","w":["לתת תגמול גדול לכל אורך הדרך","לא לתת שום תמריץ","להעניש על כל כישלון"],"e":"״לא מפתיע שהמכירות עלו, אתה יודע לעשות רושם טוב״."}]}};

const SUM=`<h2>סיכום: מאיירס פרק 4 - התנהגות ועמדות</h2>
<div class="key"><b>למה הפרק הזה חשוב?</b> רוב שיטות ההוראה, הייעוץ וגידול הילדים מניחות שאם רוצים לשנות התנהגות, צריך קודם לשנות את הדעה. הספר מערער על זה: ב־1964 פסטינגר סיכם את המחקרים והגיע למסקנה שכמעט אין לזה ראיות, ואולי הקשר הולך דווקא <b>בכיוון ההפוך</b>: ההתנהגות משנה את העמדות. או במילים שהספר מצטט: ״קל לנו למצוא סיבות למה שכבר עשינו, קשה לנו יותר לפעול בעקבות הסיבות״.<br><br>
<b>השאלה של הפרק במשפט אחד:</b> מה הקשר בין מה שאנחנו חושבים לבין מה שאנחנו עושים, ובאיזה כיוון הוא הולך?<br><br>
<b>הפרק בנוי משלושה חלקים, וכל אחד ממשיך את הקודם:</b><br>
① <b>האם עמדות מנבאות התנהגות?</b> (סעיפים 1–2): לרוב פחות ממה שחשבנו, אבל בתנאים מסוימים כן.<br>
② <b>האם התנהגות משנה עמדות?</b> (סעיף 3): כן, ובהרבה דרכים: תפקידים, דיבור, ״רגל בדלת״, מעשים מוסריים.<br>
③ <b>למה?</b> (סעיפים 4–5): שלוש תאוריות, ולבסוף מה קורה כשמשלמים לנו על מה שאנחנו ממילא אוהבים.<br>
<b>בשיעור:</b> מפגשים 11–13. לקריאה: עמ׳ 143–174.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>עמדה</b></td><td>הערכה חיובית או שלילית של משהו או מישהו, שמבוססת לרוב על אמונות.</td></tr>
<tr><td><b>דיסוננס</b></td><td>אי־נוחות כשיש סתירה בין שתי מחשבות, או בין מחשבה למעשה.</td></tr>
<tr><td><b>הצדקה</b></td><td>סיבה ״טובה״ שאפשר לתת להתנהגות שלנו.</td></tr>
<tr><td><b>מוטיבציה פנימית / חיצונית</b></td><td>פנימית = עושים כי נהנים. חיצונית = עושים בשביל פרס.</td></tr></table></div>

<div class="ex"><b>הדוגמה שתלווה אותנו: עידו</b> (דמות בדויה להמחשה). עידו ״בעד איכות הסביבה״, אבל לא ממחזר. הוא הסכים להתנדב במוקד ״רק לשעה״, ועכשיו הוא שם שלוש משמרות בשבוע ומרגיש שזה חשוב לו מאוד.</div>

<h3>1. מהי עמדה, והאם היא מנבאת התנהגות</h3>
<div class="ex"><b>עמדה</b> = הערכה חיובית או שלילית כלפי משהו. יש לה שלושה מרכיבים, ״ה־ABC״: <b>A</b> = רגש (״אני אוהב״), <b>B</b> = נטייה התנהגותית (״אני נוטה לפעול״), <b>C</b> = קוגניציה (״אני מאמין ש...״).</div>
<div class="ex"><b>המכה הראשונה: ויקר (1969).</b> הוא סקר עשרות מחקרים ומצא שהעמדות שאנשים <b>מדווחים</b> כמעט לא מנבאות את מה שהם <b>עושים</b>. למשל, קשר רופף בלבד בין עמדה כלפי רמאות לבין רמאות בפועל.<br>
<b>צביעות מוסרית (בטסון):</b> משתתפים היו צריכים לחלק בינם לבין שותף משימה מפתה (עם פרסים) ומשימה משעממת. רק 5% חשבו שלקחת את המפתה לעצמם זה מוסרי, אבל 80% לקחו אותה. וכשנתנו להם מטבע להגריל ״בהגינות״, בלי שאיש רואה, 90% ״זכו״ במשימה הטובה.<br>
<b>הלקח:</b> אנשים רוצים <b>להיראות</b> מוסריים, לא בהכרח <b>להיות</b>.</div>

<h3>2. מתי עמדות כן מנבאות התנהגות</h3>
<p>אחרי המכה הזו, החוקרים שאלו: אולי עמדות מנבאות, אבל רק בתנאים מסוימים? הספר מציג שלושה תנאים.</p>
<div class="ex"><b>תנאי 1: כש״ההשפעות האחרות״ קטנות.</b> גם מה שאנחנו <b>אומרים</b> וגם מה שאנחנו <b>עושים</b> מושפעים מעוד דברים (מה יחשבו עלינו, המצב).<br>
• <b>מדידה עקיפה:</b> <b>מבחן האסוציאציות החבויות (IAT)</b> מודד בזמן תגובה כמה מהר מחברים בין מושגים. המתאם בין עמדות חבויות לגלויות מתון, 0.24 בממוצע.<br>
• <b>צבירה:</b> עמדה כללית לא מנבאת פעולה בודדת, אבל מנבאת היטב את <b>סך</b> ההתנהגויות לאורך זמן. <b>אצל עידו:</b> העמדה ה״ירוקה״ שלו לא מנבאת אם ימחזר בקבוק היום, אבל כן מנבאת את התמונה הכללית.<br>
<b>דוגמה מהספר (בושמן ובונאצ׳י):</b> סטודנטים עם דעה קדומה נגד ערבים העבירו פחות בשורות טובות ויותר בשורות רעות לנמען שנראה ערבי, כשהם חשבו שזה אנונימי.</div>
<div class="ex"><b>תנאי 2: כשהעמדה ספציפית להתנהגות.</b> אייזן ופישביין: ב־26 מתוך 27 מחקרים, עמדה <b>כללית</b> לא ניבאה התנהגות <b>ספציפית</b>. אבל עמדה <b>רלוונטית</b> כן.<br>
<b>דוגמה:</b> העמדה ״אני בעד בריאות״ לא מנבאת אם תרוץ. העמדה כלפי היתרונות והחסרונות <b>של ריצה</b> כן.<br>
<b>תאוריית ההתנהגות המתוכננת:</b> עמדה ספציפית + נורמות (מה אחרים מצפים) + שליטה נתפסת (״אני מסוגל״) = <b>כוונה</b>, שמנבאת התנהגות.</div>
<div class="ex"><b>תנאי 3: כשהעמדה איתנה.</b><br>
• <b>כשמודעים לה:</b> כשסטודנטים נשארו לבד מול חידה, 71% רימו. כשעוררו אצלם מודעות לעצמם (למשל, מול מראה), רק 7% רימו.<br>
• <b>כשהיא נוצרה מהתנסות אישית:</b> עמדה שנבנתה מניסיון חזקה יותר, ומנבאת יותר.</div>

<h3>3. התנהגות משנה עמדות</h3>
<p>עכשיו לכיוון המפתיע. הספר מראה שהרבה פעמים אנחנו <b>קודם פועלים</b>, ורק אחר כך העמדה ״מדביקה את הקצב״.</p>
<div class="ex"><b>תפקידים:</b> בניסוי הכלא של <b>זימברדו</b> בסטנפורד, סטודנטים קיבלו באקראי תפקיד של סוהר או אסיר. תוך ימים ה״סוהרים״ התאכזרו, והניסוי הופסק אחרי 6 ימים. אבל לא כולם נהפכו לאכזריים: <b>גם האדם וגם המצב</b> משפיעים.<br>
<b>דיבור נהפך לאמונה:</b> מי שתיאר אדם באופן חיובי לקהל שאוהב אותו, חיבב אותו בעצמו יותר (היגינס). הפסיכולוג ריי היימן התחיל להאמין בקריאה בכף היד אחרי שעשה את זה ״בשביל הכסף״.</div>
<div class="tw"><table><tr><th>טכניקה</th><th>מה עושים</th><th>ממצא מהספר</th></tr>
<tr><td><b>רגל בדלת</b></td><td>קודם בקשה <b>קטנה</b>, ואז <b>גדולה</b></td><td>שלט ענק ״נהגו בזהירות״: 17% הסכימו מיד, 76% אחרי שהסכימו קודם למדבקה קטנה. התחייבות לתרומת דם: מ־62% ל־81%</td></tr>
<tr><td><b>כדור נמוך</b></td><td>קודם מקבלים הסכמה, ואז <b>מחמירים</b> את התנאים</td><td>ניסוי בשעה 7:00 בבוקר: 24% הגיעו כשידעו מראש, 53% כשהסכימו קודם ורק אז שמעו את השעה</td></tr></table></div>
<div class="ex"><b>השאלה שעוזרת להבחין:</b> ״האם הבקשה <b>השנייה שונה וגדולה</b> יותר (רגל בדלת), או שזו <b>אותה בקשה</b> שהתנאים שלה הוחמרו (כדור נמוך)?״<br>
<b>אצל עידו:</b> ״רק שעה אחת במוקד״, ואחר כך שלוש משמרות = רגל בדלת.</div>
<div class="ex"><b>מעשים מוסריים ולא מוסריים:</b><br>
• <b>מעשה רע</b> מוביל לזלזול בנפגע, כדי להצדיק את המעשה. ומעשה רע אחד מקל על הבא.<br>
• <b>מעשה טוב</b> מוביל לחיבה. <b>פרנקלין</b> ביקש מיריב פוליטי להשאיל לו ספר, ומאז היריב התייחס אליו בחיבה.<br>
• <b>הרובוט של פרידמן:</b> ילדים קיבלו איסור לשחק ברובוט מפתה. מי שקיבל <b>איום מתון</b> נמנע ממנו גם שבועות אחר כך, כשלא היה איום. מי שקיבל <b>איום חמור</b> שיחק בו כשהאיום נעלם. איום מתון ״הופנם״.</div>
<div class="ex"><b>גזענות ופוליטיקה:</b> אחרי ביטול ההפרדה הגזעית בארה״ב, התמיכה בזכות שחורים לגור בכל שכונה עלתה מ־65% ל־85%. בגרמניה הנאצית, החובה להצדיע ״הייל היטלר״ גרמה לרבים להרגיש פער, ואחר כך להתאים את האמונות למעשים. גם שבויי מלחמה שעשו מעשים קטנים ששיתפו פעולה, התחילו בהדרגה לשנות עמדות.</div>

<h3>4. למה התנהגות משנה עמדות? שלוש תאוריות</h3>
<p>ראינו <b>שזה</b> קורה. השאלה היא <b>למה</b>. הספר מציג שלוש תשובות.</p>
<div class="tw"><table><tr><th>תאוריה</th><th>הרעיון</th><th>ראיה מהספר</th></tr>
<tr><td><b>הצגה עצמית</b></td><td>אנחנו לא באמת משנים עמדה, רק רוצים <b>להיראות</b> עקביים</td><td>כשאנשים חושבים שמחוברים ל״גלאי שקר״, שינוי העמדה פוחת מאוד</td></tr>
<tr><td><b>דיסוננס קוגניטיבי</b> (פסטינגר)</td><td>סתירה בין מעשה לעמדה יוצרת <b>מתח</b>, ואנחנו מפחיתים אותו בשינוי העמדה</td><td>מי שקיבל <b>1$</b> כדי לומר שמשימה משעממת מהנה, דירג אותה כמהנה יותר ממי שקיבל <b>20$</b></td></tr>
<tr><td><b>תפיסה עצמית</b> (בם)</td><td>כשהעמדה חלשה, אנחנו <b>מסיקים</b> מה אנחנו חושבים מתוך ההתנהגות, כמו שמסיקים על אחרים</td><td>הבעות פנים ותנוחות גוף משפיעות על הרגש, כמו שתיאר ויליאם ג׳יימס</td></tr></table></div>
<div class="ex"><b>למה 1$ ולא 20$?</b> מי שקיבל 20$ יכול לומר לעצמו ״שיקרתי בשביל הכסף״. יש לו <b>הצדקה מספקת</b>, אין סתירה, ואין צורך לשנות עמדה. מי שקיבל רק דולר לא יכול להסביר כך, ולכן ״משכנע את עצמו״ שהמשימה הייתה בעצם מהנה. זו <b>הצדקה לא מספקת</b>.<br>
<b>המסקנה המעשית:</b> כדי שילד יפנים ערך, עדיף לדרבן <b>במידה הנחוצה בלבד</b>. איום או פרס גדול נותנים הצדקה חיצונית, ואז אין שינוי פנימי (כמו ברובוט של פרידמן).<br>
<b>דיסוננס חזק במיוחד</b> כשיש <b>בחירה</b> ו<b>אחריות</b> למעשה.</div>
<div class="ex"><b>דיסוננס אחרי החלטה:</b> אחרי שבחרנו, אנחנו <b>מאדירים</b> את מה שבחרנו ו<b>ממעיטים</b> במה שדחינו. <b>דוגמה:</b> מהמרים בטוחים יותר בסוס שלהם <b>אחרי</b> שהימרו. הספר מתאר את אותה נטייה גם בניסוי עם ילדים שבחרו בין מדבקות.<br>
<b>דוגמה פוליטית מהספר:</b> כשפרצה מלחמת עירק, רק 38% מהאמריקנים חשבו שהיא מוצדקת גם אם לא יימצא נשק להשמדה המונית. כשהנשק לא נמצא, 58% תמכו בה גם בלעדיו. ההצדקה ״עברה״ לסיבה אחרת.</div>
<div class="ex"><b>מתי דיסוננס ומתי תפיסה עצמית?</b> לפי הספר, שתיהן נכונות במצבים שונים:<br>
• <b>דיסוננס</b> מסביר מצבים שבהם המעשה <b>סותר בבירור</b> עמדה ברורה.<br>
• <b>תפיסה עצמית</b> מסבירה מצבים שבהם העמדה <b>עדיין לא ברורה</b> או חלשה, ואנחנו ״לומדים״ אותה מהמעשה.<br>
<b>השאלה שעוזרת:</b> ״האם הייתה לאדם עמדה ברורה שהמעשה סתר?״ אם כן, דיסוננס. אם לא, תפיסה עצמית.</div>

<h3>5. הצדקת יתר</h3>
<p>מתפיסה עצמית נובע ממצא מפתיע: לפעמים <b>פרס פוגע</b> במוטיבציה.</p>
<div class="ex"><b>אפקט הצדקת היתר</b> = כשמשלמים לאדם על משהו שהוא <b>ממילא</b> אהב לעשות, הוא מתחיל לייחס את המעשה לפרס, וההנאה הפנימית יורדת.<br>
<b>הסיפור מהספר:</b> ילדים הרעישו כל יום ליד ביתו של זקן. הוא שילם להם על הרעש, ואז הפחית את התשלום מיום ליום. בסוף הילדים סירבו ״לעבוד בשביל כל כך מעט״, והפסיקו להרעיש.<br>
<b>דוגמה נוספת מהספר:</b> ילד שאהב לקרוא, התחיל לקרוא פחות כשמועדון קריאה הבטיח מסיבה למי שיקרא 10 ספרים. הקריאה נהייתה ״משימה בשביל פרס״.<br>
<b>מתי פרס לא פוגע?</b> כשהוא <b>לא צפוי</b>, או כשהוא <b>מיידע</b> (״עשית את זה מצוין״) ולא שולט.<br>
<b>ובמשימה לא מהנה?</b> פרס בהתחלה יכול לעזור, ואחר כך כדאי לחזק סיבה פנימית.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. <b>עמדות</b> מנבאות התנהגות פחות ממה שחשבו (ויקר, צביעות מוסרית).<br>
2. הן <b>כן</b> מנבאות כשההשפעות האחרות קטנות (מדידה עקיפה, צבירה), כשהן <b>ספציפיות</b> (אייזן ופישביין), וכשהן <b>איתנות</b> (מודעות, התנסות).<br>
3. <b>התנהגות משנה עמדות</b>: תפקידים (זימברדו), דיבור, רגל בדלת וכדור נמוך, מעשים מוסריים, ואידאולוגיה.<br>
4. שלושה הסברים: <b>הצגה עצמית</b>, <b>דיסוננס</b> (1$ מול 20$, דיסוננס אחרי החלטה), ו<b>תפיסה עצמית</b> (בם).<br>
5. <b>הצדקת יתר</b>: פרס על מה שממילא אוהבים מוריד את ההנאה, אלא אם הוא לא צפוי או מיידע.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לזהות את שלושת התנאים שבהם עמדה מנבאת התנהגות.<br>
• להבחין בין רגל בדלת לכדור נמוך בדוגמה.<br>
• להסביר את ניסוי 1$ מול 20$ ואת הרובוט של פרידמן.<br>
• להשוות בין שלוש התאוריות, ולזהות איזו מסבירה מקרה.<br>
• לזהות הצדקת יתר, ולהציע איך לתגמל בלי לפגוע.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>ב־1$ מול 20$</b>, הדולר האחד יצר שינוי עמדה, לא ה־20.</li>

      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
</html>
