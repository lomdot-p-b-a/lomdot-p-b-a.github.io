<!doctype html>
<html lang="he" dir="rtl">
<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: מאיירס פרק 2 · העצמי בעולם החברתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"target",title:"אפקט הזרקור ואשליית השקיפות",blocks:[
  {h:"מאיה והשיער הסורר",html:`${def("על מה הנושא",`למה נדמה לנו שכולם מסתכלים עלינו ויודעים מה אנחנו מרגישים.<br><b>מה נלמד כאן:</b> מאיה · אפקט הזרקור · אשליית השקיפות · העצמי והעולם החברתי`)}${ex("<b>מאיה</b> (דמות בדויה להמחשה) סטודנטית שנה א׳. בבוקר השיער שלה מזדקר לכל הכיוונים, ואין זמן לסדר. כל הבוקר היא נבוכה, ובטוחה שכולם בכיתה מסתכלים. נלווה אותה לאורך הלומדה.")}${def("אפקט הזרקור",`${E("Spotlight effect")} האמונה שאחרים שמים לב להופעה ולהתנהגות שלנו <b>יותר</b> מכפי שהם באמת שמים לב.`)}<p>סטודנטים בקורנל לבשו חולצה מביכה עם דיוקן של <b>בארי מנילו</b>. הם העריכו שכמחצית מהכיתה תשים לב; בפועל רק <b>23%</b> שמו לב.</p>`,q:"q1"},
  {h:"שקופים פחות ממה שנדמה",html:`${def("אשליית השקיפות",`${E("Illusion of transparency")} האשליה שהרגשות שלנו (חרדה, גועל, שקר) <b>ניכרים</b> כלפי חוץ ואחרים מזהים אותם בקלות.`)}<p><b>סביצקי וגילוביץ׳</b>: נואמים דירגו את המתח שלהם <b>6.65</b>, והצופים <b>5.25</b>. מי ש<b>קיבל הסבר</b> על אשליית השקיפות נאם טוב יותר ונראה רגוע יותר, גם בעיני הצופים. הרגעה כללית (״זה טבעי״) לא עזרה.</p>${rem("הקשר בין העצמי לעולם החברתי דו־סטרי: מה שאנחנו חושבים על עצמנו משפיע על התגובות לאחרים, ואחרים מעצבים את תחושת העצמי שלנו. יש לנו גם <b>כמה עצמי</b>: עם אמא, עם חברים, עם מורים.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"id",title:"מושג העצמי",blocks:[
  {h:"מי אני?",html:`${def("על מה הנושא",`ממה מורכב מושג העצמי, ומה מעצב אותו.<br><b>מה נלמד כאן:</b> מושג העצמי · סכמות עצמי · עצמי אפשרי · תפקידים · השוואה חברתית · הצלחות · ״האני במראה״`)}${def("מושג העצמי",`${E("Self-concept")} התשובות של אדם לשאלה ״<b>מי אני?</b>״. במוח מעורבים ההמיספרה הימנית והקורטקס הקדם־מצחי המדיאלי.`)}${def("סכמת עצמי",`${E("Self-schema")} אמונה על העצמי שמארגנת מידע (״אני ספורטאית״). מי שספורט הוא סכמה אצלו שם לב לגוף של אחרים וזוכר בקלות חוויות ספורט.`)}${def("עצמי אפשרי",`${E("Possible selves")} מי שאנחנו <b>חולמים</b> להיות (העשיר, האהוב) ומי שאנחנו <b>חוששים</b> להיות (המובטל, הנכשל). שניהם מניעים אותנו (מרקוס).`)}`,q:"q5"},
  {h:"תפקידים והשוואה חברתית",html:`<p>מה שמתחיל כמשחק <b>תפקיד</b> (סטודנטית, הורה) נטמע בהדרגה בעצמי.</p>${def("השוואה חברתית",`${E("Social comparison")} הערכת היכולות והדעות שלנו בהשוואה לאחרים (<b>פסטינגר</b>, 1954).`)}${tiles([["grad","ראש לשועלים","תלמיד טוב בבית ספר ממוצע מרגיש מוכשר; באוניברסיטה סלקטיבית הוא ״זנב לאריות״","אנחנו מעריכים את עצמנו לפי מי שסביבנו. אותו תלמיד ירגיש מוכשר בין חלשים ממנו, וחלש בין חזקים ממנו.","מאיה הייתה הכי טובה בכיתה, ובאוניברסיטה, בין תלמידים מצטיינים, היא פתאום מרגישה ממוצעת."],["chart","השוואה כלפי מעלה","אחרי הצלחה משווים לאנשים שמצליחים עוד יותר, ושביעות הרצון יורדת"]])}${ex("מאיה הייתה מהטובות בתיכון. בחוג פסיכולוגיה כולם היו מצטיינים, ופתאום היא מרגישה ״ממוצעת״. היכולת שלה לא השתנתה; קבוצת ההשוואה כן.")}`,q:"q7"},
  {h:"הצלחות, ואיך אחרים רואים אותנו",html:`<p><b>הצלחה</b> במשימות מאתגרות מחזקת את תחושת היכולת. לכן מחמאות ריקות (״אין כמוך!״) לא בונות הערכה עצמית; <b>הישגים</b> כן.</p>${def("האני במראה",`${E("Looking-glass self")} <b>קולי</b>: אנחנו רואים את עצמנו כפי שאחרים רואים אותנו. <b>מיד</b> חידד: מה שחשוב הוא איך אנחנו <b>מדמיינים</b> שהם רואים אותנו. כי אנשים מחמיאים בקול ומרסנים ביקורת, אנחנו נוטים להפריז בהערכה שרוחשים לנו.`)}<p>אמריקנים החמיאו לאחרון ״אתמול״; יפנים, לפני כ<b>ארבעה ימים</b>.</p>`,q:"q9"}
 ]},
 {id:"t3",icon:"people",title:"העצמי והתרבות",blocks:[
  {h:"עצמי עצמאי ועצמי מקושר",html:`${def("על מה הנושא",`איך התרבות מעצבת את העצמי, את החשיבה ואת ההערכה העצמית.<br><b>מה נלמד כאן:</b> אינדיווידואליזם · קולקטיביזם · עצמי מקושר · חשיבה הוליסטית · הערכה עצמית ותרבות`)}<div class="tw"><table><tr><th></th><th>עצמי עצמאי</th><th>עצמי מקושר</th></tr><tr><td><b>הזהות</b></td><td>אישית: תכונות ומטרות</td><td>חברתית: קשרים עם אחרים</td></tr><tr><td><b>מה חשוב</b></td><td>אני: הישגים, זכויות</td><td>אנחנו: הקבוצה, מחויבויות</td></tr><tr><td><b>לא רואה בעין יפה</b></td><td>קונפורמיות</td><td>אגואיזם</td></tr><tr><td><b>מוטו</b></td><td>״אם אין אני לי, מי לי?״</td><td>״כשאני לעצמי, מה אני?״</td></tr><tr><td><b>תרבויות</b></td><td>המערב</td><td>אסיה, אפריקה, אמריקה הלטינית</td></tr></table></div><p>החלוקה <b>פשטנית</b>: בכל תרבות יש שונות, ותרבויות רבות נעשות <b>אינדיווידואליסטיות יותר</b> (סין, ״דור האני״; פחות שמות נפוצים לתינוקות בארה״ב: 20% ב־1990, 9% ב־2007).</p>`,q:"q11"},
  {h:"תרבות וחשיבה",html:`<p><b>ניסבט</b>: קולקטיביזם מוביל לחשיבה <b>הוליסטית</b>. מה מתאים: פנדה, קוף או בננה? אסיינים יותר: <b>קוף ובננה</b> (קשר); אמריקנים יותר: <b>קוף ופנדה</b> (קטגוריה).</p>${tiles([["data","סצנה מתחת למים","יפנים זכרו כ־60% יותר פרטי רקע; אמריקנים התמקדו בדג אחד גדול","תרבות משפיעה על מה ששמים לב אליו: בתרבות קולקטיביסטית מסתכלים על ההקשר כולו, ובתרבות אינדיבידואליסטית על הדבר הבולט.","מאיה מתארת תמונה של מסיבה: ״היה שם בחור שרקד״. חברה מתרבות אחרת מתארת את כל החדר ואת האנשים סביב."],["check","בחירת עט","77% מהאמריקנים ורק 31% מהאסיינים בחרו את הצבע החריג"],["phone","תפקיד השפה","אמריקנים: ביטוי עצמי. קוריאנים: תקשורת בין אנשים"]])}`,q:"q13"},
  {h:"תרבות והערכה עצמית",html:`<ul><li>בתרבויות קולקטיביסטיות ההערכה העצמית תלויה ב<b>מה שאחרים חושבים</b> עליי ועל הקבוצה, ומשתנה לפי ההקשר: 4 מכל 5 קנדים לעומת 1 מכל 3 סינים ויפנים אמרו שהעצמי <b>לא</b> משתנה בין מצבים.</li><li><b>יפנים</b> מתמידים דווקא אחרי <b>כישלון</b> (לא לאכזב); מערביים מתמידים אחרי <b>הצלחה</b>.</li><li>שמחה ביפן = קרבה וחברות; בארה״ב = יעילות, עליונות וגאווה.</li><li>סטודנטים יפנים אחרי 7 חודשים בקנדה: הערכה עצמית <b>עלתה</b>.</li></ul>`,q:"q15"}
 ]},
 {id:"t4",icon:"question",title:"הכרת העצמי",blocks:[
  {h:"להסביר ולנבא את עצמנו",html:`${def("על מה הנושא",`עד כמה אנחנו באמת מכירים את עצמנו.<br><b>מה נלמד כאן:</b> הסברים להתנהגות · ניבוי התנהגות · כשל התכנון · ניבוי רגשות · הטיית ההשפעה · הזנחת החיסוניות · עמדות כפולות`)}<p>כשהסיבות <b>סמויות</b>, ההסברים שלנו להתנהגות שלנו לרוב שגויים. אנשים חשבו שמצב הרוח שלהם ירוד ב<b>יום שני</b>; בפועל לא.</p><div class="tw"><table><tr><th>מה ניבאו</th><th>מי ניבא טוב יותר</th></tr><tr><td>כמה זמן הקשר הרומנטי יחזיק</td><td><b>השותפים לדירה</b></td></tr><tr><td>ביצוע מתמחים בניתוח</td><td><b>החברים ללימודים</b></td></tr><tr><td>מתי תסתיים עבודת הגמר</td><td>חברים ומרצים (הסטודנטים איחרו בשבוע אחרי ״התסריט הגרוע ביותר״)</td></tr><tr><td>האם אצביע? (90% אמרו כן, 69% הצביעו)</td><td>הניבוי לגבי <b>אחרים</b> (70%) היה מדויק</td></tr></table></div>${rem("טיפ: כדי לנבא את עצמכם, חשבו מה <b>אחרים</b> היו עושים, ושאלו את השותפה לדירה.")}`,q:"q17"},
  {h:"לנבא רגשות",html:`${def("הטיית ההשפעה",`${E("Impact bias")} הערכת יתר של <b>משך</b> ההשפעה של אירועים רגשיים. בולטת במיוחד באירועים <b>שליליים</b>.`)}<p>מרצים שלא קיבלו קביעות היו מאושרים כעבור שנים <b>כמו</b> אלה שקיבלו. סטודנטים אחרי פרידה היו מדוכדכים <b>פחות</b> מכפי שניבאו. כשמדמיינים אובדן יד, מתמקדים באירוע ושוכחים את ״<b>כל השאר</b>״.</p>${def("הזנחת החיסוניות",`${E("Immune neglect")} מזלזלים במהירות ובעוצמה של ״<b>מערכת החיסון הפסיכולוגית</b>״, שמאפשרת להחלים מאירועים קשים. באופן אירוני, טרדות קטנות (שלא מפעילות אותה) מציקות לפעמים יותר זמן.`)}${ex("מאיה בטוחה שאם לא תתקבל לפסיכולוגיה קלינית ״החיים ייגמרו״. המחקר מנבא שהיא תתאושש מהר הרבה יותר ממה שהיא חושבת.")}`,q:"q19"},
  {h:"עמדות כפולות",html:`<p><b>וילסון</b>: התהליכים ש<b>שולטים</b> בהתנהגות שונים מאלה שבעזרתם אנחנו <b>מסבירים</b> אותה. זוגות שקודם <b>פירטו סיבות</b> למה הקשר טוב או רע נתנו דירוג אושר שלא ניבא כלום; מי שרק דירג, ניבא היטב.</p>${def("מערכת עמדות כפולה",`${E("Dual attitude system")} עמדות <b>חבויות</b> (אוטומטיות) יכולות להיות שונות מעמדות <b>גלויות</b> (מודעות). הגלויות משתנות בשכנוע; החבויות <b>לאט</b>, בתרגול והרגלים חדשים.`)}${rem("השלכות: <b>דיווח עצמי</b> אינו תמיד אמין, ועדות כנה אינה ערובה לנכונות.")}`,q:"q21"}
 ]},
 {id:"t5",icon:"scales",title:"הערכה עצמית",blocks:[
  {h:"מהי, ולמה אנחנו רוצים אותה",html:`${def("על מה הנושא",`מהי הערכה עצמית, מה מניע אותה, ומה הצד האפל שלה.<br><b>מה נלמד כאן:</b> הגדרה · שבח ספציפי · טסר · מד הסוציומטר · צד אפל · נרקיסיזם · הערכה עצמית בטוחה`)}${def("הערכה עצמית",`${E("Self-esteem")} הערכה כוללת של אדם את עצמו, תחושת ערך עצמי. הסיבתיות פועלת בשני הכיוונים: גם ״מלמטה למעלה״ (מהתחומים שחשובים לי) וגם ״מלמעלה למטה״.`)}<p><b>מושג עצמי אקדמי</b> מנבא הצלחה בלימודים, הערכה עצמית כללית לא. לכן השבח הטוב: <b>ספציפי ואמיתי</b> (״השתפרת מאז המבחן הקודם״). סטודנטים חלשים שקיבלו מסרים לחיזוק הערכה עצמית <b>נכשלו</b> במבחן הסופי.</p>${tiles([["people","טסר: אחים","הצלחה של אח <b>צעיר</b> מוכשר מאיימת במיוחד; פער יכולת גדול = יחסים פחות טובים"],["gear","לירי: מד דלק","הערכה עצמית היא <b>סוציומטר</b> שמזהיר מדחייה חברתית"]])}`,q:"q23"},
  {h:"הצד האפל ונרקיסיזם",html:`<p>הקשר בין הערכה עצמית <b>נמוכה</b> לבעיות <b>נעלם</b> כשמנטרלים גורמים כמו עוני והתעללות בילדות. הערכה עצמית <b>גבוהה</b> נמצאה אצל מנהיגי כנופיות, טרוריסטים ואסירים אלימים.</p>${def("נרקיסיזם",`תחושה מוגזמת של חשיבות עצמית, בלי התחשבות בזולת. חלק מ״<b>השלישייה האפלה</b>״ (עם מקיאווליזם ופסיכופתיה).`)}<p><b>בושמן ובאומייסטר</b>: אחרי ביקורת חריפה על חיבור, נרקיסיסטים השמיעו למבקר רעש מכאיב. הכי תוקפניים: <b>גם</b> נרקיסיזם <b>וגם</b> הערכה עצמית גבוהה. ונרקיסיסטים <b>לא</b> שונאים את עצמם בפנים: הם באמת חושבים שהם נפלאים. הנרקיסיזם <b>עולה</b> (״דור האני״, טוונג׳).</p>${rem("באומייסטר: ״שליטה עצמית חשובה לאין ערוך יותר מהערכה עצמית״.")}`,q:"q25"},
  {h:"הערכה עצמית בטוחה",html:`<p>בעלי הערכה עצמית <b>נמוכה</b> פגיעים לחרדה ובדידות, וממהרים להאמין שבן הזוג דוחה אותם, ולכן מרוצים פחות מהקשר.</p>${def("הערכה עצמית בטוחה",`נטועה בתחושה <b>פנימית</b>, לא בציונים, מראה, כסף או אישור. מי שמעריך את עצמו לפי מקורות <b>חיצוניים</b> חווה יותר לחץ, כעס, בעיות ביחסים, סמים והפרעות אכילה (קרוקר).`)}${ex("מאיה מרגישה טוב רק כשהיא מקבלת 95 ולייקים. לפי קרוקר, עדיף שתשקיע בפיתוח כישרונות וביחסים, ולא ב״להרגיש טוב עם עצמה״.")}`,q:"q27"}
 ]},
 {id:"t6",icon:"hand",title:"שליטה עצמית נתפסת",blocks:[
  {h:"כוח רצון ויעילות עצמית",html:`${def("על מה הנושא",`השליטה העצמית כמשאב, והאמונה שאני יכול להשפיע.<br><b>מה נלמד כאן:</b> כוח רצון כשריר · יעילות עצמית · מקור שליטה · חוסר אונים נרכש · עודף בחירה`)}<p>שליטה עצמית <b>מתרוקנת</b>: מי שאכל צנוניות במקום שוקולד ויתר מהר יותר על חידות בלתי פתירות. היא פועלת כמו <b>שריר</b>: נחלשת במאמץ, מתחדשת במנוחה, ומתחזקת באימון (באומייסטר).</p>${def("יעילות עצמית",`${E("Self-efficacy")} האמונה שאני <b>מסוגל</b> לבצע משימה (<b>בנדורה</b>). שונה מ<b>הערכה עצמית</b>, שהיא תחושת ערך כללית. מתכנתת יכולה להרגיש יעילה ובו בזמן להעריך את עצמה נמוך.`)}<p>ילדים ששובחו על <b>מאמץ</b> המשיכו לאתגר; ששובחו על <b>פיקחות</b> חששו לנסות שוב (מולר ודווק). המקור החזק ליעילות עצמית: <b>חוויות של הצלחה</b>.</p>`,q:"q29"},
  {h:"מקור שליטה וחוסר אונים",html:`${def("מקור שליטה",`${E("Locus of control")} <b>רוטר</b>: האם מה שקורה לי תלוי ב<b>מאמציי</b> (פנימי) או ב<b>מזל</b> ובכוחות חיצוניים (חיצוני).`)}${fig("locus45","בעלי מקור שליטה פנימי מצליחים יותר בלימודים, מפסיקים לעשן, חוגרים חגורות ומרוויחים יותר.")}${def("חוסר אונים נרכש",`${E("Learned helplessness")} <b>סליגמן</b>: כלבים שלא יכלו להימלט מהלם נשארו פסיביים גם כשיכלו. דומה לאנשים בדיכאון או תחת דיכוי.`)}<p><b>לנגר ורודין</b>: בבית אבות, קבוצה שקיבלה <b>אחריות ובחירה</b> השתפרה בערנות ובשמחת חיים (93%); קבוצה שטופלה בפסיביות נעשתה תשושה יותר.</p>`,q:"q31"},
  {h:"המחיר של עודף בחירה",html:`<p>בחירה חופשית קשורה לשביעות רצון ב־73 מדינות, אבל <b>יותר מדי</b> בחירה פוגעת (שוורץ: ״רודנות החופש״).</p>${tiles([["cart","ריבה","בחירה מתוך <b>30</b> אפשרויות: פחות מרוצים מאשר מתוך <b>6</b>","הרבה אפשרויות נשמעות טוב, אבל בפועל הן מקשות להחליט ומורידות את שביעות הרצון מהבחירה, כי תמיד יש מחשבה שאולי היה טוב יותר.","מאיה מתלבטת שעה בין 30 סוגי שמפו, ואחר כך פחות מרוצה ממה שבחרה מאשר כשהיו רק 6."],["clock","עייפות","מי שבחר קורסים למד אחר כך פחות למבחן","לבחור דורש כוח רצון. אחרי הרבה החלטות, נשאר פחות כוח לשליטה עצמית, למשל ללמוד.","אחרי שמאיה בחרה את כל הקורסים לסמסטר, היא התקשתה לשבת ללמוד למבחן באותו ערב."],["lock","החלטה סופית","מרוצים יותר מבחירה ״בלי החזרות״, אבל מעדיפים לשלם על אפשרות לשנות","אנשים חושבים שהם רוצים אפשרות לחזור בהם, אבל דווקא כשאין אפשרות כזו הם מתרגלים להחלטה ומרוצים ממנה יותר.","מאיה משלמת יותר על שמלה עם החזרה, ואז ממשיכה להתלבט אם היא אוהבת אותה."]])}${ex("מאיה התלבטה שבועות בין שלוש דירות. גם אחרי שבחרה, היא ממשיכה לחשוב על האחרות. בחירה סופית הייתה כנראה משאירה אותה מרוצה יותר.")}`,q:"q33"}
 ]},
 {id:"t7",icon:"chart",title:"ההטיה לטובת העצמי",blocks:[
  {h:"הצלחה שלי, כישלון של המצב",html:`${def("על מה הנושא",`הנטייה החזקה לראות את עצמנו באור חיובי, וכל הצורות שלה.<br><b>מה נלמד כאן:</b> ייחוס לטובת העצמי · טובים מהממוצע · אופטימיות לא מציאותית · קונצנזוס וייחודיות מדומים · הסברים · מחירים`)}${def("הטיה לטובת העצמי",`${E("Self-serving bias")} הנטייה לראות את עצמנו באור חיובי. בכל 53 המדינות שנבדקו, הממוצע בהערכה עצמית היה <b>מעל האמצע</b>.`)}${def("ייחוס לטובת העצמי",`הצלחה = ליכולת ולמאמץ שלי; כישלון = למזל, לשופט, למבחן ״הלא הוגן״. ״מכונית בלתי נראית הגיחה משום מקום ופגעה בי״.`)}<p><b>״הכתם העיוור של ההטיה״</b>: אנחנו רואים הטיה אצל אחרים, אבל לא אצלנו. סטודנטים תיארו את ״העצמי הקודם״ בשווה חיובי ושלילי, ואת העצמי הנוכחי פי 3 חיובי.</p>`,q:"q35"},
  {h:"טובים מהממוצע, ואופטימיים",html:`<div class="tw"><table><tr><th>תחום</th><th>ממצא</th></tr><tr><td>עבודות בית</td><td>בעלים העריכו 42%, נשים 33%, בפועל 39%. סך התרומות בקבוצה עולה על 100%</td></tr><tr><td>״להסתדר עם אחרים״</td><td>אף תלמיד י״ב לא דירג את עצמו מתחת לממוצע; 25% במאיון העליון</td></tr><tr><td>דעות קדומות</td><td>14% דירגו את עצמם 5 ומעלה; לדעתם 44% מהאחרים</td></tr></table></div><p>ההטיה חזקה יותר בתכונות <b>סובייקטיביות</b> (״ממושמע״) מאשר נצפות (״דייקן״).</p>${def("אופטימיות לא מציאותית",`ציפייה שלנו יקרו פחות דברים רעים מאשר לאחרים. מגבירה <b>פגיעות</b>: נהגים מבוגרים ״מעל הממוצע״ נכשלו פי 4 במבחן נהיגה.`)}${def("פסימיות הגנתית",`${E("Defensive pessimism")} צפיית בעיות שמניעה להתכונן. סטודנטים בטוחים מדי נוטים פחות להתכונן.`)}`,q:"q37"},
  {h:"קונצנזוס, ייחודיות, ולמה זה קורה",html:`<div class="tw"><table><tr><th>אפקט</th><th>על מה</th><th>דוגמה</th></tr><tr><td><b>קונצנזוס מדומה</b></td><td><b>דעות וחולשות</b>: ״כולם כמוני״</td><td>שקרן חושב שכולם משקרים; ״כולם עושים בוטוקס״</td></tr><tr><td><b>ייחודיות מדומה</b></td><td><b>יכולות ומעלות</b>: ״מעטים כמוני״</td><td>חוגרי חגורה מעריכים בחסר כמה אחרים חוגרים</td></tr></table></div><p><b>למה?</b> גם עיבוד מידע (זוכרים את מה ש<b>אנחנו</b> עשינו) וגם <b>מוטיבציה</b> לחזק את ההערכה העצמית.</p>${tiles([["check","מסייעת","מגינה מדיכאון; ניצולי 11 בספטמבר עם האדרה עצמית היו עמידים יותר; מפחיתה חרדת מוות (ניהול האימה)","הערכה עצמית גבוהה יכולה להגן: היא עוזרת להתמודד עם קשיים ועם פחדים.","אחרי כישלון במבחן, מאיה אומרת לעצמה ״אני מסוגלת, אצליח בפעם הבאה״, ולא שוקעת בייאוש."],["x","מזיקה","מרעילה קבוצות (להקות רוק); 90% מהסגל ״מעל הממוצע״; <b>הטיה לטובת הקבוצה</b>","כשההערכה העצמית מנופחת, היא יכולה לפגוע: בקבוצה, בשיפוט העצמי, וביחס לאחרים.","בעבודת צוות, כל אחד בטוח שהוא תרם הכי הרבה, והצוות מתפרק בגלל זה."]])}`,q:"q39"}
 ]},
 {id:"t8",icon:"copies",title:"הצגת העצמי",blocks:[
  {h:"חבלה עצמית",html:`${def("על מה הנושא",`איך אנחנו מנהלים את הרושם שאנחנו עושים.<br><b>מה נלמד כאן:</b> חבלה עצמית · הצגת העצמי · ניטור עצמי · הצטנעות מדומה`)}${def("חבלה עצמית",`${E("Self-handicapping")} יצירת תירוץ <b>מראש</b> לכישלון, כדי להגן על הדימוי העצמי. אם נכשלתי, ״זה בגלל המסיבה״; אם הצלחתי, אני גאון.`)}<p><b>ברגלס וג׳ונס</b>: סטודנטים שקיבלו ציון גבוה על שאלות שניחשו <b>בחרו</b> בתרופה שאמורה <b>לפגוע</b> בחשיבה, כדי שיהיה להם תירוץ.</p>${ex("ערב לפני המבחן החשוב מאיה יוצאת למסיבה. אם תיכשל, ״לא הייתי ישנה״; אם תצליח, ״גם בלי שינה״. זו חבלה עצמית.")}`,q:"q41"},
  {h:"ניהול רושם וניטור עצמי",html:`${def("הצגת העצמי",`${E("Self-presentation")} הצגת דימוי רצוי לקהל <b>חיצוני</b> (אחרים) ו<b>פנימי</b> (אנחנו). איזון עדין: להיראות טוב, אבל <b>לא טוב מדי</b>. רשתות חברתיות הן ״ניהול רושם על סטרואידים״.`)}${def("ניטור עצמי",`${E("Self-monitoring")} מעקב אחר הרושם והתאמת ההתנהגות למצב. <b>גבוה</b>: ״זיקית חברתית״, פחות מחויבים ביחסים. <b>נמוך</b>: אומרים מה שחושבים, עלולים להיראות חסרי רגישות.`)}<p><b>הצטנעות מדומה</b>: מציגים את עצמנו צנועים מכפי שאנחנו מרגישים. אבל כשההצלחה ברורה, ״זה לא מי יודע מה״ נתפס כחוסר כנות.</p>${rem("סיכום הפרק (פסקל): <b>יעילות עצמית</b> ו<b>הטיה לטובת העצמי</b> הן שתי אמיתות. כל אחת לבד היא חצי אמת.")}`,q:"q43"}
 ]}
];

רב לפני מבחן חשוב. מה זה מדגים?","a":"חבלה עצמית","w":["אפקט הזרקור","ניטור עצמי","אשליית השקיפות"],"e":"אם תיכשל, יש לה תירוץ. אם תצליח, היא נראית מוכשרת במיוחד."}]},"q43":{"t":"t8","v":[{"q":"מהי הצגת העצמי?","a":"הצגת דימוי רצוי לאחרים ולעצמנו","w":["חשיפה מלאה של כל מה שאנחנו מרגישים","הצגה של העצמי האמיתי בלבד","התנהגות שמכוונת רק לקהל פנימי"],"e":"איזון עדין: להיראות טוב, אבל לא טוב מדי."},{"q":"מה מאפיין אדם עם ניטור עצמי גבוה?","a":"מתאים את עצמו למצב, כמו זיקית","w":["אומר תמיד בדיוק את מה שהוא חושב","מתעלם לגמרי ממה שאחרים חושבים","מחויב מאוד ויציב ביחסים שלו"],"e":"הוא גם פחות מחויב ביחסים ופחות מרוצה בנישואים."}]},"q44":{"t":"t8","v":[{"q":"מהי הצטנעות מדומה?","a":"הצגת הערכה עצמית נמוכה מהאמיתית","w":["הערכה עצמית נמוכה אמיתית וכנה","הגזמה בהישגים כדי להרשים","הודאה כנה וישירה בטעות"],"e":"אבל כשההצלחה ברורה, ״זה לא מי יודע מה״ נתפס כחוסר כנות."}]}};
const H={"h1":{"t":"t1","v":[{"q":"סטודנט נכנס להרצאה עם כתם קפה על החולצה, ובטוח שכל הכיתה שמה לב. בפועל כמעט אף אחד לא ראה. איך קוראים לזה?","a":"אפקט הזרקור: מפריזים בכמה אחרים שמים לב אלינו","w":["אשליית השקיפות: מפריזים בכמה הרגשות שלנו גלויים","הטיית ההשפעה: מפריזים במשך ההשפעה הרגשית","קונצנזוס מדומה: חושבים שכולם מתנהגים כמונו"],"e":"בניסוי של חולצת בארי מנילו ציפו שמחצית ישימו לב, ובפועל 23%."},{"q":"נואמת בטוחה שכל הקהל רואה כמה היא לחוצה, אבל הקהל מדרג אותה כרגועה למדי. איך קוראים לזה?","a":"אשליית השקיפות: חושבים שהרגשות שלנו גלויים","w":["אפקט הזרקור: חושבים שאחרים שמים לב למראה שלנו","חבלה עצמית: יוצרים מראש תירוץ לכישלון","הצטנעות מדומה: מציגים את עצמנו פחות טוב"],"e":"הזרקור עוסק במה שרואים עלינו, והשקיפות במה שמרגישים בפנים."}]},"h2":{"t":"t1","v":[{"q":"מה עזר לנואמים לנאום טוב יותר, לפי הספר?","a":"הסבר על אשליית השקיפות והשפעתה","w":["הרגעה כללית בנוסח ״אל תדאג, יהיה בסדר״","תרגול הנאום מול מראה שוב ושוב לפני האירוע","אזהרה שהקהל יבחין בכל סימן של לחץ"],"e":"הרגעה כללית לא עזרה. רק ההבנה של האשליה עצמה שיפרה את הביצוע."}]},"h3":{"t":"t2","v":[{"q":"סטודנטית שרואה את עצמה כ״אוהבת ספורט״ שמה לב לתוצאות משחקים וזוכרת אותן היטב. איזה מושג מסביר את זה?","a":"סכמת עצמי: אמונה על העצמי שמארגנת איך קולטים מידע","w":["עצמי אפשרי: מי שהיא חולמת להיות בעתיד","השוואה חברתית: הערכה של עצמה מול אחרים","האני במראה: איך היא מדמיינת שאחרים רואים אותה"],"e":"סכמת העצמי משפיעה על מה שאנחנו שמים לב אליו וזוכרים."}]},"h4":{"t":"t2","v":[{"q":"בתיכון יואב היה ״הכי חכם בכיתה״. באוניברסיטה, בחוג של מצטיינים, הוא מרגיש ממוצע, אף שהוא לא השתנה. מה מסביר את זה?","a":"השוואה חברתית: הוא מעריך את עצמו מול קבוצה חדשה","w":["האני במראה: הוא רואה את עצמו כפי שהמרצים רואים אותו","עצמי אפשרי: הוא חושש להיות מי שנכשל","הטיה לטובת העצמי: הוא מייחס הצלחות לעצמו"],"e":"פסטינגר: מעריכים את עצמנו בהשוואה לאחרים. ״ראש לשועלים או זנב לאריות״."}]},"h5":{"t":"t2","v":[{"q":"סטודנטית לרפואה מדמיינת את עצמה כרופאה מצליחה, וגם חוששת שתהיה סטודנטית שנשרה. איך קוראים לשתי התמונות האלה?","a":"עצמי אפשרי: מי שחולמים או חוששים להיות","w":["סכמות עצמי: אמונות על מי שאני עכשיו","מושג עצמי אקדמי: הערכה של היכולת בלימודים","ניטור עצמי: התאמת התנהגות לקהל"],"e":"מרקוס: העצמי האפשרי, החיובי וגם השלילי, מניע אותנו לפעול."}]},"h6":{"t":"t3","v":[{"q":"אישה מתארת את עצמה: ״אני בת של אמא שלי, אמא של שלושה, וחברה בקהילה״. איזה סוג עצמי זה מבטא?","a":"עצמי מקושר: הזהות מבוססת על קשרים עם אחרים","w":["עצמי עצמאי: הזהות מבוססת על תכונות אישיות","עצמי אפשרי: מי שהיא חולמת להיות","סכמת עצמי: אמונה שמארגנת מידע על ספורט"],"e":"עצמי עצמאי מתאר תכונות ומטרות (״אני שאפתנית, מצחיקה״). עצמי מקושר מתאר יחסים."}]},"h7":{"t":"t3","v":[{"q":"סטודנטית מתרבות עם עצמי מקושר נכשלה במשימה. מה צפוי לפי הספר?","a":"היא תתמיד יותר, כדי להשתפר","w":["היא תוותר מהר יותר, כדי לשמור על הערכה עצמית","היא תייחס את הכישלון לנסיבות חיצוניות","היא תעבור למשימה שבה היא כבר מצליחה"],"e":"אצל עצמי מקושר מתמידים אחרי כישלון. אצל עצמי עצמאי מתמידים יותר אחרי הצלחה."}]},"h8":{"t":"t3","v":[{"q":"מראים לאנשים תמונה עם חיה בולטת במרכז ורקע מסביב. מי מתרבות עם עצמי מקושר יתאר יותר את הרקע והקשרים בין הפרטים. איך קוראים לסגנון הזה?","a":"חשיבה הוליסטית: שמים לב לקשרים ולהקשר","w":["חשיבה קטגוריאלית: שמים לב לפריט הבולט","קונצנזוס מדומה: חושבים שכולם רואים כמונו","ניטור עצמי נמוך: לא שמים לב לסביבה"],"e":"בתרבויות עצמאיות מתמקדים בפריט הבולט (״דג אחד גדול״). בתרבויות מקושרות רואים את התמונה כשלם."}]},"h9":{"t":"t4","v":[{"q":"90% מהסטודנטים אמרו שיצביעו בבחירות, ורק 69% הצביעו. מה זה מדגים?","a":"אנחנו לא טובים בניבוי ההתנהגות של עצמנו","w":["אפקט הזרקור: חושבים שכולם שמים לב אם הצבענו","הצטנעות מדומה: מציגים את עצמנו פחות טוב","אשליית השקיפות: חושבים שהכוונות שלנו גלויות"],"e":"גם שותפים לדירה ניבאו טוב יותר מהסטודנטים עצמם אם הקשר הרומנטי שלהם יימשך."}]},"h10":{"t":"t4","v":[{"q":"סטודנט בטוח שאם לא יתקבל לתואר שני, הוא יהיה אומלל במשך שנים. בפועל, אחרי כמה חודשים הוא מרגיש טוב. מה הטעות שלו?","a":"הטיית ההשפעה: הוא הפריז במשך ההשפעה הרגשית","w":["אופטימיות לא מציאותית: הוא חשב שזה לא יקרה לו","כשל התכנון: הוא הפריז במהירות שבה יסיים","חוסר אונים נרכש: הוא הפסיק לנסות אחרי כישלון"],"e":"חושבים רק על האירוע ושוכחים את כל השאר שיקרה. וגם מזלזלים ביכולת להתאושש (הזנחת החיסוניות)."}]},"h11":{"t":"t4","v":[{"q":"אנשים שהתבקשו לכתוב בדיוק למה הם מאושרים בקשר שלהם, ניבאו פחות טוב אם הקשר יימשך. מה המסקנה?","a":"דיווח עצמי לא תמיד אמין","w":["אנשים משקרים בכוונה על הקשרים שלהם","כתיבה על קשר תמיד מחלישה אותו","אנשים מאושרים לא יודעים לנמק את האושר"],"e":"לפי וילסון, החיפוש אחר סיבות ״דרס״ את התחושה האמיתית (העמדה החבויה)."}]},"h12":{"t":"t4","v":[{"q":"אנשים מעריכים שיתאוששו מאוד לאט מפרידה, כי הם לא לוקחים בחשבון את היכולת שלהם להתמודד ולמצוא משמעות. איך קוראים לטעות הזו?","a":"הזנחת החיסוניות","w":["הטיית ההשפעה הרגשית","כשל התכנון","אפקט הזרקור"],"e":"מזלזלים ב״מערכת החיסון הפסיכולוגית״. זה אחד ההסברים להטיית ההשפעה."}]},"h13":{"t":"t5","v":[{"q":"מורה רוצה לשפר את הציונים של תלמידים חלשים, ושולחת להם כל שבוע מסר ״אתם מעולים, זקפו את הראש!״. מה צפוי לפי הספר?","a":"זה עלול לפגוע: שבח כללי לא עוזר","w":["הציונים ישתפרו, כי הערכה עצמית גבוהה גורמת להצלחה","לא תהיה השפעה בכלל, לא חיובית ולא שלילית","הציונים ישתפרו, אבל רק אצל התלמידים החזקים"],"e":"בניסוי, סטודנטים חלשים שקיבלו מסרים כאלה קיבלו ציונים נמוכים יותר."}]},"h14":{"t":"t5","v":[{"q":"גיל מצטיין בגיטרה. כשאחיו הצעיר מתחיל לנגן ומתקדם מהר ממנו, גיל מרגיש מאוים. מה מסביר את זה?","a":"טסר: הצלחה של קרוב בתחום שלנו מאיימת","w":["לירי: ההערכה העצמית מתריעה מפני דחייה","קרוקר: ההערכה העצמית שלו בטוחה ופנימית","בנדורה: היעילות העצמית שלו גבוהה"],"e":"אילו האח היה מצליח בתחום אחר, זה לא היה מאיים, ואולי אפילו מקור לגאווה."}]},"h15":{"t":"t5","v":[{"q":"לפי לירי, מה התפקיד של ההערכה העצמית?","a":"״סוציומטר״ שמתריע מפני דחייה","w":["מקור לגאווה שמניע אנשים להצליח","מנגנון שמגן על האדם מפני חרדת מוות","כלי שעוזר להשוות את עצמנו לאחרים"],"e":"כשמרגישים דחויים, ההערכה העצמית יורדת, כמו נורת אזהרה."}]},"h16":{"t":"t5","v":[{"q":"מי צפוי להגיב בתוקפנות הרבה ביותר כשמעליבים אותו?","a":"מי שגם נרקיסיסט וגם בעל הערכה גבוהה","w":["מי שיש לו הערכה עצמית נמוכה מאוד","מי שיש לו הערכה עצמית בטוחה ופנימית","מי שיש לו יעילות עצמית נמוכה"],"e":"בניגוד לדעה הרווחת, נרקיסיסטים לא שונאים את עצמם בפנים."}]},"h17":{"t":"t5","v":[{"q":"סטודנטית מרגישה שווה רק כשהיא מקבלת ציונים גבוהים ומחמאות על המראה. מה הבעיה, לפי קרוקר?","a":"הערכה עצמית שבירה, שתלויה בגורמים חיצוניים","w":["הערכה עצמית בטוחה, שנשענת על ערכים פנימיים","יעילות עצמית נמוכה, כי היא לא מאמינה ביכולתה","מקור שליטה פנימי, כי היא מאמינה שהכול תלוי בה"],"e":"הערכה עצמית בטוחה, שלא תלויה בציונים ובאישור, עדיפה. היא מאפשרת ללמוד מכישלון."}]},"h18":{"t":"t6","v":[{"q":"איזה משפט מבטא יעילות עצמית, ולא הערכה עצמית?","a":"״אני יכולה לעבור סטטיסטיקה״","w":["״אני אדם טוב וראוי לאהבה מכולם״","״אני סטודנטית ואחות גדולה בבית״","״הצלחתי במבחן כי היה לי מזל״"],"e":"יעילות עצמית = ״אני מסוגל״ במשימה מסוימת. הערכה עצמית = תחושת ערך כללית."}]},"h19":{"t":"t6","v":[{"q":"אמא רוצה לחזק את בנה אחרי שפתר חידה קשה. מה עדיף, לפי הספר?","a":"״עבדת קשה ולא ויתרת״","w":["״אתה כל כך חכם ומוכשר״","״החידה הייתה קלה בשבילך״","״אתה הכי חכם בכיתה שלך״"],"e":"שבח על מאמץ בונה יעילות עצמית. מי ששובח על פיקחות נמנע מאתגרים, כדי לא להיראות טיפש."}]},"h20":{"t":"t6","v":[{"q":"עובדת שמשוכנעת ש״אין טעם להתאמץ, הקידומים תלויים רק בקשרים ובמזל״. מה מאפיין אותה?","a":"מקור שליטה חיצוני","w":["מקור שליטה פנימי","יעילות עצמית גבוהה","ניטור עצמי גבוה"],"e":"רוטר: פנימי = ״זה תלוי בי״, חיצוני = ״זה תלוי במזל ובאחרים״. אחרי חוויות חוזרות כאלה עלול להיווצר חוסר אונים נרכש."}]},"h21":{"t":"t6","v":[{"q":"במוסד לקשישים, דיירים שקיבלו בחירה ואחריות על חייהם היו פעילים ומאושרים יותר. מה זה מראה?","a":"שתחושת שליטה משפרת את מצב האדם","w":["שעודף בחירה פוגע בשביעות הרצון","שהערכה עצמית גבוהה גורמת לבריאות","שצמחים משפרים מצב רוח בכל גיל"],"e":"זה המחקר של לנגר ורודין. ההפך הוא חוסר אונים נרכש."}]},"h22":{"t":"t6","v":[{"q":"חנות הציעה 30 סוגי ריבה, וחנות אחרת 6 סוגים. איפה הלקוחות היו מרוצים יותר מהבחירה?","a":"ב־6 הסוגים, כי עודף בחירה מעייף","w":["בחנות עם 30 הסוגים, כי יותר בחירה נותנת יותר שליטה","אין הבדל, כי שביעות הרצון תלויה רק בטעם","בחנות עם 30 הסוגים, כי אפשר למצוא בדיוק מה שרוצים"],"e":"עוד ממצא: החלטה סופית, שאי אפשר לשנות, משאירה יותר שביעות רצון."}]},"h23":{"t":"t7","v":[{"q":"אחרי מבחן, סטודנט אומר: ״קיבלתי 95 בגלל שאני חכם. בקורס השני קיבלתי 60 כי המרצה לא הוגן״. איך קוראים לזה?","a":"ייחוס לטובת העצמי: הצלחה בזכותי","w":["קונצנזוס מדומה: חושבים שכולם קיבלו ציון דומה","אופטימיות לא מציאותית: ״לי זה לא יקרה״","חבלה עצמית: יוצרים מראש תירוץ לכישלון"],"e":"זו הצורה הבסיסית של ההטיה לטובת העצמי."}]},"h24":{"t":"t7","v":[{"q":"אדם שמעתיק בהגשות אומר ״כולם מעתיקים״, ואדם שמתנדב אומר ״מעטים מתנדבים כמוני״. אילו הטיות אלה, לפי הסדר?","a":"קונצנזוס מדומה, ואז ייחודיות מדומה","w":["ייחודיות מדומה, ואז קונצנזוס מדומה","קונצנזוס מדומה בשני המקרים","ייחודיות מדומה בשני המקרים"],"e":"על חולשות אומרים ״כולם כאלה״. על מעלות אומרים ״רק אני כזה״. שתיהן שומרות על תדמית חיובית."}]},"h25":{"t":"t7","v":[{"q":"סטודנטית בטוחה ש״לי לא יקרה תאונה״, ולכן לא חוגרת חגורה במושב האחורי. מה הבעיה בהטיה שלה?","a":"אופטימיות לא מציאותית מגבירה פגיעות","w":["אופטימיות לא מציאותית מגינה עליה מדיכאון","פסימיות הגנתית גורמת לה להיות זהירה מדי","קונצנזוס מדומה גורם לה לחשוב שכולם חוגרים"],"e":"פסימיות הגנתית, לצפות לקושי ולהתכונן אליו, עוזרת יותר במצבים כאלה."}]},"h26":{"t":"t7","v":[{"q":"מה צד אחד שבו ההטיה לטובת העצמי מזיקה, לפי הספר?","a":"בצוות כל אחד חושב שתרם יותר","w":["היא גורמת לדיכאון ולחרדה מפני המוות","היא מורידה את ההערכה העצמית של רוב האנשים","היא גורמת לאנשים להעריך את עצמם נמוך מדי"],"e":"היא גם יוצרת ״כתם עיוור״ (רואים הטיות רק אצל אחרים) והטיה לטובת הקבוצה. מצד שני, היא מגינה מדיכאון."}]},"h27":{"t":"t8","v":[{"q":"יום לפני מבחן חשוב, סטודנטית יוצאת למסיבה עד הבוקר. לפי הפרק, מה אולי היא עושה?","a":"חבלה עצמית: יוצרת מראש תירוץ אם תיכשל","w":["הצטנעות מדומה: מציגה את עצמה פחות טוב","ניטור עצמי גבוה: מתאימה את עצמה לחברים","ייחוס לטובת העצמי: לוקחת קרדיט על הצלחה"],"e":"אם תיכשל, ״לא ישנתי״. אם תצליח, ״הצלחתי גם בלי לישון״. כמו בניסוי של ברגלס וג׳ונס עם ״התרופה המזיקה״."}]},"h28":{"t":"t8","v":[{"q":"אדם מתנהג אחרת לגמרי במסיבה, בעבודה ובבית, לפי מה שהסביבה מצפה ממנו. איך מתאר אותו הפרק?","a":"ניטור עצמי גבוה: ״זיקית חברתית״","w":["ניטור עצמי נמוך: אומר מה שהוא חושב","הצטנעות מדומה: מציג את עצמו פחות טוב","עצמי מקושר: מגדיר את עצמו לפי קשרים"],"e":"מי שבניטור עצמי נמוך מתנהג אותו דבר בכל מקום, לפי מה שהוא חושב ומרגיש."},{"q":"ספורטאית שניצחה בתחרות אומרת ״זה היה בעיקר מזל״, אף שהיא יודעת שהתאמנה קשה. מה היא עושה?","a":"הצטנעות מדומה: מציגה פחות ממה שמרגישה","w":["ייחוס לטובת העצמי: מייחסת את ההצלחה לעצמה","חבלה עצמית: יוצרת תירוץ מראש לכישלון","ייחודיות מדומה: חושבת שמעטים כמוה"],"e":"הצגת העצמי: להיראות טוב, אבל לא טוב מדי. הצטנעות עוזרת לא להיראות כמו התרברבות."}]}};
const SUM=`<h2>סיכום: מאיירס פרק 2 - העצמי בעולם החברתי</h2>
<div class="key"><b>למה הפרק הזה חשוב?</b> הספר פותח במשפט ישן: יש שלושה דברים קשים במיוחד, פלדה, יהלום, ו<b>לדעת את עצמך</b>. ואז דוגמה מוכרת: קמתם עם שיער פרוע, ואתם בטוחים שכולם מסתכלים. הפרק מראה שהעצמי נמצא במרכז העולם החברתי שלנו: הוא מסנן את מה שאנחנו רואים, זוכרים ומרגישים. ומצד שני, החברה מעצבת אותו.<br><br>
<b>השאלה של הפרק במשפט אחד:</b> איך אנחנו רואים את עצמנו, כמה נכונה התמונה הזו, ואיך היא משפיעה על מה שאנחנו מרגישים ועושים מול אחרים?<br><br>
<b>הפרק בנוי מחמישה חלקים, וכל אחד עונה על שאלה אחרת על העצמי:</b><br>
① <b>כמה אחרים שמים לב אלינו?</b> (סעיף 1): פחות ממה שנדמה.<br>
② <b>מי אני, ומה מעצב את זה?</b> (סעיפים 2–4): מושג העצמי, התרבות, וכמה באמת אנחנו מכירים את עצמנו.<br>
③ <b>כמה אני שווה?</b> (סעיף 5): הערכה עצמית, היתרונות והצד האפל.<br>
④ <b>כמה אני שולט בחיי?</b> (סעיף 6): יעילות עצמית ומקור שליטה.<br>
⑤ <b>איך אני רואה ומציג את עצמי?</b> (סעיפים 7–8): ההטיה לטובת העצמי והצגת העצמי.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>מושג העצמי</b></td><td>מה אני חושב על <b>מי</b> אני. ״אני סטודנטית, אחות גדולה, טובה במתמטיקה״.</td></tr>
<tr><td><b>הערכה עצמית</b></td><td>כמה אני <b>שווה</b> בעיני עצמי. ״אני אדם טוב וראוי״.</td></tr>
<tr><td><b>יעילות עצמית</b></td><td>האמונה ש<b>אני מסוגל</b> לעשות משהו מסוים.</td></tr>
<tr><td><b>הטיה</b></td><td>טעות קבועה בכיוון אחד בחשיבה שלנו.</td></tr>
<tr><td><b>ייחוס</b></td><td>ההסבר שאנחנו נותנים ל״למה זה קרה״.</td></tr></table></div>

<div class="ex"><b>הדוגמה שתלווה אותנו: מאיה</b> (דמות בדויה להמחשה). סטודנטית שנה א׳: נבוכה מהשיער הסורר, מרגישה ״ממוצעת״ בחוג של מצטיינים, ויוצאת למסיבה ערב לפני מבחן.</div>

<h3>1. אפקט הזרקור ואשליית השקיפות</h3>
<p>מתחילים בטעות הכי יומיומית: אנחנו במרכז העולם שלנו, ולכן בטוחים שאנחנו גם במרכז העולם של אחרים.</p>
<div class="ex"><b>אפקט הזרקור</b> = אנחנו חושבים שאחרים שמים לב אלינו (להופעה, לטעויות) יותר ממה שהם באמת שמים.<br>
<b>הניסוי מהספר:</b> סטודנטים לבשו חולצה מביכה (עם תמונה של הזמר בארי מנילו) ונכנסו לחדר. הם ניחשו שבערך מחצית ישימו לב. בפועל, רק <b>23%</b> שמו לב.<br>
<b>אצל מאיה:</b> היא בטוחה שכל הכיתה מדברת על השיער שלה. רוב האנשים עסוקים בעצמם.</div>
<div class="ex"><b>אשליית השקיפות</b> = אנחנו חושבים שהרגשות <b>הפנימיים</b> שלנו גלויים לכולם.<br>
<b>הניסוי:</b> נואמים דירגו כמה הם נראו לחוצים (6.65), והצופים דירגו פחות (5.25).<br>
<b>מה עוזר:</b> כשהסבירו לנואמים על האשליה, הנאום השתפר. הרגעה כללית (״אל תדאג״) לא עזרה.<br>
<b>ההבדל בין השניים:</b> הזרקור הוא על מה ש<b>רואים</b> עלינו (מראה, מעשים). השקיפות היא על מה ש<b>מרגישים</b> בפנים.</div>

<h3>2. מושג העצמי: מי אני?</h3>
<p>אחרי שראינו שהעצמי ״מנפח״ את חשיבותו, השאלה היא ממה הוא בנוי. הספר מציג כמה מושגים:</p>
<div class="ex"><b>מושג העצמי</b> = כל התשובות שלנו לשאלה ״מי אני?״.<br>
<b>סכמת עצמי</b> = אמונה ספציפית על עצמי שמארגנת איך אני קולט מידע. <b>דוגמה:</b> מי שחושבת ״אני ספורטאית״ שמה לב לגוף של אנשים ולתוצאות משחקים, וזוכרת אותם טוב יותר.<br>
<b>אפקט ההתייחסות העצמית:</b> מידע שקשור אלינו נקלט ונזכר טוב יותר.<br>
<b>עצמי אפשרי</b> (מרקוס) = מי שאנחנו <b>חולמים</b> להיות, וגם מי שאנחנו <b>חוששים</b> להיות. <b>אצל מאיה:</b> ״פסיכולוגית מצליחה״, או ״מי שנשרה מהתואר״. שניהם מניעים אותה.</div>
<div class="ex"><b>מה מעצב את מושג העצמי?</b><br>
• <b>תפקידים:</b> תפקיד חדש (חיילת, סטודנטית) מרגיש בהתחלה ״הצגה״, ואחרי זמן הוא נטמע בעצמי.<br>
• <b>השוואה חברתית</b> (פסטינגר) = מעריכים את עצמנו לפי אחרים. <b>אצל מאיה:</b> בתיכון היא הייתה ״חכמה״. בחוג של מצטיינים היא ״ממוצעת״. היא לא השתנתה, הקבוצה להשוואה השתנתה (״ראש לשועלים או זנב לאריות״).<br>
• <b>הצלחות וכישלונות:</b> הצלחה אמיתית במשימות קשות בונה ביטחון יותר ממחמאות ריקות.<br>
• <b>שיפוטים של אחרים:</b> <b>״האני במראה״</b> (קולי): אנחנו רואים את עצמנו כפי ש<b>אנחנו מדמיינים</b> שאחרים רואים אותנו.</div>

<h3>3. העצמי והתרבות</h3>
<p>מושג העצמי מעוצב גם על ידי התרבות. הספר מציג שני ״סוגים״ של עצמי:</p>
<div class="tw"><table><tr><th></th><th>עצמי עצמאי (בעיקר מערב)</th><th>עצמי מקושר (אסיה ותרבויות רבות)</th></tr>
<tr><td><b>מי אני</b></td><td>התכונות והמטרות <b>האישיות</b> שלי</td><td>ה<b>קשרים</b> שלי: בת של, חברה ב־</td></tr>
<tr><td><b>מה לא רצוי</b></td><td>קונפורמיות, ״ללכת אחרי העדר״</td><td>אגואיזם, ״לבלוט״</td></tr>
<tr><td><b>איך חושבים</b></td><td>בקטגוריות, ומתמקדים בפריט הבולט בתמונה (״דג אחד גדול״)</td><td><b>הוליסטית</b>: רואים קשרים ורקע. מבין פנדה, קוף ובננה, יחברו קוף ובננה (קוף אוכל בננה)</td></tr>
<tr><td><b>מתי מתמידים</b></td><td>אחרי <b>הצלחה</b></td><td>אחרי <b>כישלון</b> (כדי להשתפר)</td></tr></table></div>
<div class="ex"><b>דוגמה מהספר:</b> כשהציעו לאנשים לבחור עט מתוך קבוצה, 77% מהאמריקנים בחרו את העט החריג (בצבע אחר), ורק 31% מהאסיינים.<br>
<b>שני דיוקים:</b> החלוקה פשטנית, יש הבדלים בתוך כל תרבות. ותרבויות רבות נעשות <b>אינדיווידואליסטיות</b> יותר עם הזמן. אפילו בשמות רואים את זה: הורים בוחרים יותר שמות ייחודיים לילדים.</div>

<h3>4. הכרת העצמי: כמה אנחנו באמת מכירים את עצמנו?</h3>
<p>זה החלק שמסביר את משפט הפתיחה. נדמה לנו שאנחנו מכירים את עצמנו הכי טוב, אבל המחקר מראה שבכמה תחומים חשובים, לא.</p>
<div class="ex"><b>1. אנחנו טועים בהסבר של ההתנהגות שלנו.</b> כשהסיבות סמויות, אנחנו ״ממציאים״ הסבר שנשמע הגיוני. <b>דוגמה:</b> אנשים בטוחים ש״יום שני״ משפיע על מצב הרוח שלהם, אבל כשמודדים מצב רוח לאורך זמן, ההשפעה כמעט לא קיימת.<br>
<b>2. אנחנו לא טובים בניבוי ההתנהגות שלנו.</b> 90% אמרו שיצביעו בבחירות, ורק 69% הצביעו. <b>שותפים לדירה</b> ניבאו טוב יותר מהסטודנטים עצמם אם הקשר הרומנטי שלהם ימשיך. גם <b>כשל התכנון</b>: אנחנו בטוחים שנסיים עבודה מהר יותר ממה שבאמת קורה.<br>
<b>3. אנחנו לא טובים בניבוי הרגשות שלנו.</b><br>
• <b>הטיית ההשפעה</b> = מפריזים ב<b>משך</b> ההשפעה הרגשית של אירוע. <b>דוגמה:</b> ״אם אפרד ממנו, אהיה אומללה שנה״. בפועל מתאוששים מהר יותר. הסיבה: חושבים רק על האירוע, ושוכחים ״את כל השאר״ שיקרה בחיים.<br>
• <b>הזנחת החיסוניות</b> = מזלזלים ב״מערכת החיסון הפסיכולוגית״ שלנו, ביכולת להתמודד ולמצוא משמעות.</div>
<div class="ex"><b>4. יש לנו ״שתי מערכות״ (וילסון):</b> עמדות <b>חבויות</b> (אוטומטיות) ועמדות <b>גלויות</b> (מודעות), והן לא תמיד מתאימות. <b>ניסוי:</b> אנשים שהתבקשו לפרט <b>למה</b> הם מאושרים בקשר שלהם, ניבאו <b>פחות</b> טוב אם הקשר יימשך. החיפוש אחר סיבות ״דרס״ את התחושה האמיתית.<br>
<b>המסקנה החשובה של הספר:</b> <b>דיווח עצמי</b> (שאלונים, ״למה עשית את זה?״) אינו תמיד אמין.</div>

<h3>5. הערכה עצמית: כמה אני שווה?</h3>
<p>עד עכשיו דיברנו על <b>מי</b> אני. עכשיו על <b>כמה אני שווה</b> בעיני עצמי. ההנחה הנפוצה היא ״כמה שיותר, יותר טוב״. הספר מראה שזה מורכב יותר.</p>
<div class="ex"><b>האם הערכה עצמית גבוהה גורמת להצלחה?</b> לא בדיוק. הערכה עצמית <b>כללית</b> כמעט לא מנבאת הישגים. מה שמנבא הוא מושג עצמי <b>ספציפי</b> לתחום (״אני טוב במתמטיקה״ מנבא ציונים במתמטיקה).<br>
<b>איזה שבח עוזר?</b> שבח <b>ספציפי ואמיתי</b>, על משהו שבאמת נעשה. <b>ניסוי:</b> סטודנטים חלשים שקיבלו מסרים כלליים לחיזוק ההערכה העצמית (״זקפו את הראש״) קיבלו ציונים <b>נמוכים</b> יותר.</div>
<div class="ex"><b>מה מניע את הצורך בהערכה עצמית?</b><br>
• <b>טסר:</b> אנחנו מתאמצים לשמור על הערכה עצמית, ולכן הצלחה של מישהו קרוב, בתחום שחשוב לנו, מאיימת במיוחד. <b>דוגמה:</b> אח צעיר שמצליח יותר במקצוע של האח הגדול.<br>
• <b>לירי:</b> ההערכה העצמית היא <b>״סוציומטר״</b>, מד שמתריע מפני דחייה חברתית. כשמרגישים דחויים, היא יורדת, כמו נורה אדומה ברכב.</div>
<div class="ex"><b>הצד האפל:</b><br>
• הקשר בין הערכה עצמית <b>נמוכה</b> לבעיות (עישון, אלימות) נעלם כשמנטרלים גורמים מהילדות, כמו עוני או התעללות. כלומר ההערכה העצמית אולי לא ה<b>סיבה</b>.<br>
• <b>נרקיסיזם</b> = הערכה עצמית מנופחת, עם צורך בהערצה וחוסר אמפתיה. הכי <b>תוקפניים</b> הם אנשים עם נרקיסיזם <b>וגם</b> הערכה עצמית גבוהה, כשפוגעים באגו שלהם. בניגוד לדעה הרווחת, הם <b>לא</b> שונאים את עצמם בפנים. והנרקיסיזם עלה בדורות האחרונים.</div>
<div class="ex"><b>מה עדיף, לפי קרוקר:</b> הערכה עצמית <b>בטוחה</b>, שנשענת על מי שאני מבפנים, עדיפה על הערכה עצמית <b>שבירה</b>, שתלויה בציונים, מראה או אישור של אחרים. <b>אצל מאיה:</b> אם הערך שלה תלוי בציון, כל מבחן הוא איום. אם הוא נשען על ערכים פנימיים, היא יכולה ללמוד מכישלון.<br>
<b>הקשר לסוציומטר:</b> לפי הספר, אנשים עם הערכה עצמית <b>נמוכה</b> נוטים לפרש מצבים כ<b>דחייה</b>, גם כשהם לא.</div>

<h3>6. שליטה עצמית נתפסת: כמה אני שולט בחיי?</h3>
<p>מעבר ל״מי אני״ ו״כמה אני שווה״, יש עוד שאלה: האם אני <b>מסוגל</b> להשפיע על מה שקורה לי? התשובה משפיעה מאוד על ההתנהגות.</p>
<div class="ex"><b>שליטה עצמית היא כמו שריר:</b> היא <b>נחלשת</b> אחרי מאמץ, מתחדשת במנוחה, ו<b>מתחזקת</b> באימון.</div>
<div class="ex"><b>יעילות עצמית</b> (בנדורה) = ״<b>אני מסוגל</b> לעשות את זה״. היא שונה מהערכה עצמית:<br>
<b>הערכה עצמית</b> = ״אני שווה״ (כללי). <b>יעילות עצמית</b> = ״אני יכול להצליח במשימה הזו״ (ספציפי).<br>
<b>דוגמה:</b> אפשר להרגיש אדם ראוי (הערכה עצמית גבוהה) ובכל זאת להיות בטוח שלא תצליחי בסטטיסטיקה (יעילות עצמית נמוכה).<br>
<b>מה בונה יעילות עצמית?</b> בעיקר <b>הצלחות</b> אמיתיות. ולכן הספר ממליץ <b>לשבח מאמץ</b> (״עבדת קשה״), לא פיקחות (״אתה כל כך חכם״). מי ששובח על פיקחות נמנע מאתגרים, כדי לא ״להיראות טיפש״.</div>
<div class="tw"><table><tr><th>מושג</th><th>מה זה</th><th>דוגמה</th></tr>
<tr><td><b>מקור שליטה</b> (רוטר)</td><td><b>פנימי</b>: ״מה שקורה לי תלוי בי״. <b>חיצוני</b>: ״זה תלוי במזל ובאחרים״</td><td>״קיבלתי עבודה כי התכוננתי״ מול ״כי היה לי מזל״</td></tr>
<tr><td><b>חוסר אונים נרכש</b> (סליגמן)</td><td>אחרי חוויות חוזרות של חוסר שליטה, מפסיקים לנסות, גם כשכבר אפשר</td><td>כלבים שלא יכלו לברוח מהלם, לא ניסו לברוח גם כשהיה אפשר</td></tr>
<tr><td><b>לנגר ורודין</b></td><td>תחושת שליטה משפרת מצב</td><td>במוסד לקשישים, דיירים שקיבלו בחירה ואחריות על חייהם היו פעילים ומאושרים יותר</td></tr></table></div>
<div class="ex"><b>אבל: עודף בחירה.</b> שליטה טובה, אבל <b>יותר מדי</b> אפשרויות פוגעות. אנשים שבחרו ריבה מתוך 30 סוגים היו <b>פחות</b> מרוצים (וקנו פחות) מאלה שבחרו מתוך 6. בחירה מעייפת, והחלטה <b>סופית</b> (שאי אפשר להחליף) משאירה יותר שביעות רצון.</div>

<h3>7. ההטיה לטובת העצמי</h3>
<p>אחרי שראינו כמה חשוב לנו להרגיש טוב עם עצמנו, הספר מראה איך אנחנו ״דואגים״ לזה: אנחנו רואים את עצמנו באור חיובי יותר מהמציאות. זו <b>ההטיה לטובת העצמי</b>, אחד הממצאים החזקים בפסיכולוגיה החברתית.</p>
<div class="tw"><table><tr><th>צורה</th><th>מה זה</th><th>דוגמה</th></tr>
<tr><td><b>ייחוס לטובת העצמי</b></td><td>הצלחה = בזכותי. כישלון = בגלל הנסיבות</td><td>״קיבלתי 95 כי אני חכמה. קיבלתי 60 כי המבחן לא הוגן״</td></tr>
<tr><td><b>טובים מהממוצע</b></td><td>רובנו חושבים שאנחנו מעל הממוצע</td><td>בעלים העריכו שהם עושים 42% מעבודות הבית, נשים 33%; בפועל 39%. חזק במיוחד בתכונות שקשה למדוד, כמו ״מוסרי״</td></tr>
<tr><td><b>אופטימיות לא מציאותית</b></td><td>״לי זה לא יקרה״</td><td>מגבירה פגיעות (לא נזהרים). <b>פסימיות הגנתית</b>, לצפות לקושי ולהתכונן, עוזרת</td></tr>
<tr><td><b>קונצנזוס מדומה</b></td><td>על <b>חולשות ודעות</b>: ״כולם כמוני״</td><td>״כולם מעתיקים במבחנים״</td></tr>
<tr><td><b>ייחודיות מדומה</b></td><td>על <b>מעלות ויכולות</b>: ״מעטים כמוני״</td><td>״מעטים מתנדבים כמו שאני מתנדבת״</td></tr></table></div>
<div class="ex"><b>טריק לזכור:</b> על דברים <b>רעים</b> אומרים ״כולם כאלה״ (קונצנזוס), ועל דברים <b>טובים</b> אומרים ״רק אני כזה״ (ייחודיות). שתיהן משאירות אותנו טובים.<br>
<b>מאיפה ההטיה באה?</b> משני מקורות: <b>עיבוד מידע</b> (אנחנו יודעים יותר על המאמצים שלנו) ו<b>מוטיבציה</b> (רוצים להרגיש טוב).<br>
<b>האם היא טובה או רעה? שתיהן.</b><br>
• <b>מסייעת:</b> מגינה מדיכאון, ומפחיתה חרדה מפני המוות.<br>
• <b>מזיקה:</b> ״מרעילה״ עבודת צוות (כל אחד חושב שתרם יותר), יוצרת <b>״כתם עיוור״</b> (רואים הטיות אצל אחרים ולא אצלנו), ובקבוצה הופכת ל<b>הטיה לטובת הקבוצה</b> (״אנחנו הטובים״).</div>

<h3>8. הצגת העצמי</h3>
<p>החלק האחרון עובר מ״איך אני רואה את עצמי״ ל״איך אני <b>מציג</b> את עצמי לאחרים״. גם כאן המטרה היא לשמור על תדמית חיובית.</p>
<div class="ex"><b>חבלה עצמית</b> = יוצרים לעצמנו מכשול <b>מראש</b>, כדי שיהיה תירוץ אם נכשל.<br>
<b>הניסוי (ברגלס וג׳ונס):</b> משתתפים שלא היו בטוחים שיצליחו במבחן בחרו לקחת לפני המבחן ״תרופה שפוגעת בביצוע״. כך, אם ייכשלו, ״זו התרופה״.<br>
<b>אצל מאיה:</b> היא יוצאת למסיבה ערב לפני המבחן. אם תיכשל: ״לא ישנתי״. אם תצליח: ״הצלחתי גם בלי לישון!״. בכל מקרה ההערכה העצמית מוגנת, אבל הסיכוי להצליח קטן.</div>
<div class="ex"><b>הצגת העצמי</b> = הרצון להציג תדמית רצויה, גם לקהל <b>חיצוני</b> (אחרים) וגם ל<b>פנימי</b> (לעצמנו). המטרה: להיראות טוב, אבל <b>לא טוב מדי</b>, כי זה נראה כמו התרברבות.<br>
<b>הצטנעות מדומה</b> = מציגים את עצמנו פחות טוב ממה שאנחנו באמת מרגישים. ״אה, זה היה סתם מזל״.<br>
<b>ניטור עצמי:</b><br>
• <b>גבוה</b> = ״זיקית חברתית״: שם לב לסביבה ומשנה התנהגות בהתאם.<br>
• <b>נמוך</b> = אומר ועושה מה שהוא חושב, בלי קשר לקהל.</div>
<div class="ex"><b>הסיום של הספר: ״שתי אמיתות״.</b> מצד אחד, <b>יעילות עצמית</b> ותחושת שליטה עוזרות לנו להתמודד ולהצליח. מצד שני, <b>גאווה</b> וההטיה לטובת העצמי עלולות לעוור אותנו. צריך גם להאמין בעצמנו, וגם להיזהר מלהאמין יותר מדי.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. אנחנו מפריזים בכמה אחרים שמים לב אלינו (<b>אפקט הזרקור</b>) ורואים את הרגשות שלנו (<b>אשליית השקיפות</b>).<br>
2. <b>מושג העצמי</b> נבנה מסכמות, עצמי אפשרי, תפקידים, השוואה חברתית ושיפוטי אחרים, והוא תלוי ב<b>תרבות</b> (עצמאי מול מקושר).<br>
3. אנחנו מכירים את עצמנו <b>פחות</b> ממה שנדמה: טועים בהסבר ובניבוי של ההתנהגות והרגשות שלנו, ולכן <b>דיווח עצמי</b> לא תמיד אמין.<br>
4. <b>הערכה עצמית</b> בטוחה טובה, אבל יש לה צד אפל (נרקיסיזם). <b>יעילות עצמית</b> ומקור שליטה פנימי עוזרים, אבל עודף בחירה פוגע.<br>
5. <b>ההטיה לטובת העצמי</b> ו<b>הצגת העצמי</b> שומרות על תדמית חיובית, ויש להן גם מחיר.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לזהות אפקט הזרקור או אשליית השקיפות בדוגמה, ולהבחין ביניהם.<br>
• להבחין בין מושג עצמי, הערכה עצמית ויעילות עצמית.<br>
• להשוות עצמי עצמאי ומקושר.<br>
• להסביר הטיית ההשפעה, הזנחת החיסוניות, ולמה דיווח עצמי לא אמין.<br>
• להסביר את הצד האפל של הערכה עצמית, ואת ההבדל בין בטוחה לשבירה.<br>
• להסביר מקור שליטה, חוסר אונים נרכש ועודף בחירה.<br>
• לזהות כל צורה של ההטיה לטובת העצמי, ובמיוחד קונצנזוס מול ייחודיות מדומה.<br>
• לזהות חבלה עצמית, הצטנעות מדומה וניטור עצמי.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>מושג עצמי</b> (מי אני) ≠ <b>הערכה עצמית</b> (כמה אני שווה) ≠ <b>יעילות עצמית</b> (אני מסוגל).</li>
<li><b>קונצנזוס מדומה</b> = חולשות; <b>ייחודיות מדומה</b> = מעלות.</li>
<li><b>הכי תוקפניים</b>: נרקיסיזם <b>וגם</b> הערכה עצמית גבוהה.</li>
<li><b>הטיית ההשפעה</b>: מפריזים במשך ההשפעה, לא ממעיטים.</li>
<li><b>בתרבות המקושרת</b> מתמידים אחרי <b>כישלון</b>.</li>
<li><b>שותפים לדירה</b> מנבאים אותנו טוב יותר מאיתנו.</li>
<li><b>שבחו מאמץ</b>, לא פיקחות.</li>
<li><b>יותר בחירה</b> לא תמיד יותר שביעות רצון.</li>
<li><b>אפקט הזרקור</b> = מה שרואים עלינו. <b>אשליית השקיפות</b> = מה שמרגישים בפנים.</li>
</ul></div>`;

  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

/* Flashcards: front = the term and a prompt, back = the answer and an example.
   "יודע" removes the card from this round, "עוד לא" sends it to the end of the deck. */
function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");
    const card=app.querySelector("#fc"),acts=app.querySelector(".fc-actions");
    const flip=()=>{flipped=!flipped;card.classList.toggle("flipped",flipped);card.setAttribute("aria-pressed",flipped);
      if(flipped&&!acts.querySelector(".fc-btns")){acts.innerHTML=`<div class="fc-btns"><button class="fc-no" id="no">${ic("cycle")}<span>עוד לא</span></button><button class="primary fc-yes" id="yes">${ic("check")}<span>ידעתי</span></button></div>`;
        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};
        acts.querySelector("#no").onclick=()=>{missed.add(k);S.cards[k]=0;save();deck.push(deck.shift());step("fwd")};}};
    card.onclick=flip;
    document.onkeydown=e=>{if(!document.body.contains(card))return document.onkeydown=null;if(e.key===" "||e.key==="Enter"){if(document.activeElement===card||document.activeElement===document.body){e.preventDefault();flip()}}};
  };
  step("up");
}
/* Mind map: one level at a time. The current node sits in the middle, its children around it.

function mindmap(mi,onBack){
  const M=MAPSET[mi],seen=new Set();
  const tint=(n,c)=>{n._c=c;(n.c||[]).forEach(x=>tint(x,c))};
  M.root._c="var(--accent)";M.root.c.forEach((b,k)=>tint(b,`var(--t${k%8+1})`));
  const leaves=n=>n.c?n.c.flatMap(leaves):[n],total=leaves(M.root).length;
  let path=[M.root],sel=null;
  document.body.style.setProperty("--c","var(--accent)");
  show(`<div class="stack mm-view"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>${onBack?"חזרה לנושא":"כל הנושאים"}</span></button><span class="prog" id="mmc">0 מתוך ${total} מושגים</span></div></div>
   <div class="mm-head"><span class="eyebrow">מפת חשיבה</span><h2>${M.title}</h2><p class="muted">לחצו על ענף כדי לפתוח אותו, ועל מושג כדי לקרוא עליו. לחיצה על המרכז חוזרת רמה אחת אחורה.</p></div>
   <nav class="mm-crumbs" id="mmb" aria-label="מיקום במפה"></nav>
   <div class="mm" id="mm"><svg class="mm-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
   <div class="mm-detail" id="mmd" aria-live="polite"></div></div>`,"up");
  app.querySelector("#back").onclick=onBack||(()=>home("back"));
  const box=app.querySelector("#mm"),svg=box.querySelector("svg"),det=app.querySelector("#mmd"),crumbs=app.querySelector("#mmb");
  const enLine=n=>n.en?`<span class="mm-en" dir="ltr" lang="en">${n.en}</span>`:"";
  const detail=(n,isBranch)=>{
    const sib=path[path.length-1].c||[],k=sib.indexOf(n),next=!isBranch?sib.slice(k+1).find(x=>!x.c):null;
    det.style.setProperty("--c",n._c);
    det.innerHTML=`<div class="mmd-in"><div class="mmd-h"><span class="mmd-dot"></span><div><h3>${n.n}</h3>${enLine(n)}</div></div><div class="mmd-body">${n.d}</div>${n.ex?`<div class="mmd-ex"><b>דוגמה:</b> ${n.ex}</div>`:""}
     ${isBranch?`<p class="mmd-note">${n.c.some(x=>x.c)?`${n.c.length} ענפים. לחצו על ענף כדי לפתוח אותו.`:`${n.c.length} מושגים בענף הזה. לחצו על מושג כדי לקרוא עליו.`}</p>`:next?`<button class="mmd-next">${ic("arrowL")}<span>המושג הבא: ${next.n}</span></button>`:""}</div>`;
    det.classList.remove("show");void det.offsetWidth;det.classList.add("show");
    const nb=det.querySelector(".mmd-next");if(nb)nb.onclick=()=>pick(next);
  };
  const pick=n=>{if(n.c){path.push(n);sel=null;render();detail(n,true);return}
    sel=n;seen.add(n);app.querySelector("#mmc").textContent=`${seen.size} מתוך ${total} מושגים`;
    box.querySelectorAll(".mm-node.kid").forEach(b=>{const on=b._n===n;b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);if(seen.has(b._n))b.classList.add("seen")});
    detail(n,false);if(det.getBoundingClientRect().top>innerHeight-120)det.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"})};
  const render=()=>{
    const cur=path[path.length-1],kids=cur.c||[],n=kids.length;
    crumbs.innerHTML=path.map((p,k)=>k<path.length-1?`<button data-k="${k}">${p.n}</button><span aria-hidden="true">‹</span>`:`<b>${p.n}</b>`).join("");
    crumbs.querySelectorAll("button").forEach(b=>b.onclick=()=>{path=path.slice(0,+b.dataset.k+1);sel=null;render();det.innerHTML=""});
    box.querySelectorAll(".mm-node").forEach(e=>e.remove());
    const wide=box.clientWidth>620,rx=wide?36:34,ry=wide?37:39;
    const pos=kids.map((_,k)=>{const a=(-90+360*k/n)*Math.PI/180;return[50+rx*Math.cos(a),50+ry*Math.sin(a)]});
    svg.innerHTML=pos.map(([x,y],k)=>{const mx=(50+x)/2+(y-50)*.12,my=(50+y)/2-(x-50)*.12;return `<path d="M50 50Q${mx.toFixed(2)} ${my.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)}" pathLength="1" style="--c:${kids[k]._c};--i:${k}"/>`}).join("");
    const ctr=document.createElement("button");ctr.className="mm-node center";ctr.style.setProperty("--c",cur._c);
    ctr.innerHTML=`<span class="mm-n">${cur.n}</span>${enLine(cur)}${path.length>1?`<span class="mm-up">${ic("arrowR")} חזרה</span>`:""}`;
    ctr.setAttribute("aria-label",path.length>1?`${cur.n}, חזרה רמה אחת`:cur.n);
    ctr.onclick=()=>{if(path.length>1){path.pop();sel=null;render();det.innerHTML=""}else detail(cur,true)};
    box.appendChild(ctr);
    kids.forEach((k2,k)=>{const b=document.createElement("button");b._n=k2;
      b.className="mm-node kid "+(k2.c?"branch":"leaf")+(seen.has(k2)?" seen":"");b.style.cssText=`--c:${k2._c};--x:${pos[k][0]}%;--y:${pos[k][1]}%;--i:${k}`;
      b.innerHTML=`<span class="mm-n">${k2.n}</span>${k2.c?`<span class="mm-cnt">${k2.c.length} מושגים</span>`:enLine(k2)}`;
      if(!k2.c)b.setAttribute("aria-pressed","false");
      b.onclick=()=>pick(k2);box.appendChild(b)});
    box.classList.remove("mm-go");void box.offsetWidth;box.classList.add("mm-go");
  };
  render();detail(M.root,true);
}
function cardsDone(total,known,missed){
  document.onkeydown=null;
  const miss=[...missed],n=total-miss.length,pct=Math.round(100*n/total);
  show(`<div class="stack results"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>כל הנושאים</span></button></div></div>
   <article class="card score">
    <span class="eyebrow">סיום כרטיסיות</span>
    <div class="score-row">${ring(pct,`<b data-count="${pct}" data-suffix="%">${REDUCED?pct+"%":"0%"}</b>`)}<div><div class="big"><span data-count="${n}">${REDUCED?n:0}</span><small>/${total} ידעת בסיבוב הראשון</small></div>
    <p>${miss.length?"כרטיסים שסימנת ״עוד לא״ חזרו לסוף החפיסה עד שידעת אותם. אפשר לעבור עליהם שוב בנפרד.":"מצוין, ידעת את כל הכרטיסים."}</p></div></div>
    <div class="row">${miss.length?`<button class="primary" id="again-miss">${ic("cycle")}<span>שוב רק את ${miss.length} שהתקשיתי בהם</span></button>`:""}<button id="again-all">${ic("cards")}<span>כל הכרטיסים מחדש</span></button><button id="hm">לכל הנושאים</button></div>
   </article></div>`,"up");
  app.querySelector("#back").onclick=()=>home("back");app.querySelector("#hm").onclick=()=>home("back");
  app.querySelector("#again-all").onclick=()=>flashcards();
  const am=app.querySelector("#again-miss");if(am)am.onclick=()=>flashcards(miss);

}

   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`,"up");

function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  show(`<div class="stack"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>כל הנושאים</span></button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. הסיכום המלא נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>

  app.querySelector("#back").onclick=()=>home("back");app.querySelector("#hm").onclick=()=>home("back");app.querySelector("#full").onclick=()=>summary();

/* Every module gets flashcards and a mind map. A hand-written CARDS or MAPS file wins;
   otherwise both are built from the module's own definitions (tiles, long concept cards, def boxes). */
const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim()};
function deriveTerms(){
  return T.flatMap((t,ti)=>t.blocks.map((blk,bi)=>{const d=document.createElement("div");d.innerHTML=blk.html;
    const items=[...d.children].filter(isTerm).flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem).filter(x=>strip(x.name));
    return{t,ti,bi,h:blk.h,items}}).filter(b=>b.items.length));
}
function autoCards(blocks){
  const byTopic=T.map(t=>blocks.filter(b=>b.t===t).flatMap(b=>b.items.map(it=>({it,t})))
    .sort((a,b)=>strip(b.it.body).length-strip(a.it.body).length));
  const out=[],used=new Set();
  for(let r=0;out.length<12&&byTopic.some(x=>x.length>r);r++)for(const list of byTopic){if(out.length>=12)break;const x=list[r];if(!x)continue;const key=strip(x.it.name);if(used.has(key))continue;used.add(key);
    const hasEx=/cpt-ex/.test(x.it.body);out.push({t:x.t.id,f:x.it.name,q:hasEx?"מה זה? נסו גם לחשוב על דוגמה":"מה ההגדרה?",b:x.it.body,ex:""})}
  return out;
}
function autoMap(blocks){
  const chunk=(name,items)=>{const leaves=items.map(it=>({n:it.name,en:it.en,d:it.body}));if(leaves.length<=8)return[{n:name,c:leaves}];
    const parts=Math.ceil(leaves.length/7);return Array.from({length:parts},(_,k)=>({n:`${name} (${k+1}/${parts})`,c:leaves.slice(k*7,k*7+7)}))};
  const kids=T.map(t=>{const bs=blocks.filter(b=>b.t===t);if(!bs.length)return null;
    const sub=bs.flatMap(b=>chunk(b.h,b.items));
    const c=sub.length===1?sub[0].c:sub.map(s=>({n:s.n,d:`${s.c.length} מושגים מהקטע ״${s.n}״.`,c:s.c}));
    return{n:t.title,d:`נושא ${T.indexOf(t)+1} בלומדה. ${c.length} ${sub.length===1?"מושגים":"קטעים"} בענף.`,c}}).filter(Boolean);
  if(kids.length<2)return null;
  return{id:"module",title:"מפת הלומדה",sub:"כל הנושאים והמושגים במבט אחד",root:{n:CONFIG.he||CONFIG.title,d:CONFIG.about||"כל הנושאים של הלומדה. לחצו על נושא כדי לפתוח את המושגים שלו.",c:kids}};
}
const TERM_BLOCKS=deriveTerms();
const DECK=typeof CARDS!=="undefined"&&CARDS.length?CARDS:autoCards(TERM_BLOCKS);
const MAPSET=(typeof MAPS!=="undefined"?MAPS:[]).concat([autoMap(TERM_BLOCKS)].filter(Boolean));
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#cards"&&DECK.length)flashcards();else if(_h==="#map"&&MAPSET.length)mindmap(0);else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb)pb.click()}else home();
</script>
