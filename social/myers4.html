function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);

 {id:"t1",icon:"target",title:"אפקט הזרקור ואשליית השקיפות",blocks:[
  {h:"מאיה והשיער הסורר",html:`${def("על מה הנושא",`למה נדמה לנו שכולם מסתכלים עלינו ויודעים מה אנחנו מרגישים.<br><b>מה נלמד כאן:</b> מאיה · אפקט הזרקור · אשליית השקיפות · העצמי והעולם החברתי`)}${ex("<b>מאיה</b> (דמות בדויה להמחשה) סטודנטית שנה א׳. בבוקר השיער שלה מזדקר לכל הכיוונים, ואין זמן לסדר. כל הבוקר היא נבוכה, ובטוחה שכולם בכיתה מסתכלים. נלווה אותה לאורך הלומדה.")}${def("אפקט הזרקור",`${E("Spotlight effect")} האמונה שאחרים שמים לב להופעה ולהתנהגות שלנו <b>יותר</b> מכפי שהם באמת שמים לב.`)}<p>סטודנטים בקורנל לבשו חולצה מביכה עם דיוקן של <b>בארי מנילו</b>. הם העריכו שכמחצית מהכיתה תשים לב; בפועל רק <b>23%</b> שמו לב.</p>`,q:"q1"},
  {h:"שקופים פחות ממה שנדמה",html:`${def("אשליית השקיפות",`${E("Illusion of transparency")} האשליה שהרגשות שלנו (חרדה, גועל, שקר) <b>ניכרים</b> כלפי חוץ ואחרים מזהים אותם בקלות.`)}<p><b>סביצקי וגילוביץ׳</b>: נואמים דירגו את המתח שלהם <b>6.65</b>, והצופים <b>5.25</b>. מי ש<b>קיבל הסבר</b> על אשליית השקיפות נאם טוב יותר ונראה רגוע יותר, גם בעיני הצופים. הרגעה כללית (״זה טבעי״) לא עזרה.</p>${rem("הקשר בין העצמי לעולם החברתי דו־סטרי: מה שאנחנו חושבים על עצמנו משפיע על התגובות לאחרים, ואחרים מעצבים את תחושת העצמי שלנו. יש לנו גם <b>כמה עצמי</b>: עם אמא, עם חברים, עם מורים.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"id",title:"מושג העצמי",blocks:[
  {h:"מי אני?",html:`${def("על מה הנושא",`ממה מורכב מושג העצמי, ומה מעצב אותו.<br><b>מה נלמד כאן:</b> מושג העצמי · סכמות עצמי · עצמי אפשרי · תפקידים · השוואה חברתית · הצלחות · ״האני במראה״`)}${def("מושג העצמי",`${E("Self-concept")} התשובות של אדם לשאלה ״<b>מי אני?</b>״. במוח מעורבים ההמיספרה הימנית והקורטקס הקדם־מצחי המדיאלי.`)}${def("סכמת עצמי",`${E("Self-schema")} אמונה על העצמי שמארגנת מידע (״אני ספורטאית״). מי שספורט הוא סכמה אצלו שם לב לגוף של אחרים וזוכר בקלות חוויות ספורט.`)}${def("עצמי אפשרי",`${E("Possible selves")} מי שאנחנו <b>חולמים</b> להיות (העשיר, האהוב) ומי שאנחנו <b>חוששים</b> להיות (המובטל, הנכשל). שניהם מניעים אותנו (מרקוס).`)}`,q:"q5"},
  {h:"תפקידים והשוואה חברתית",html:`<p>מה שמתחיל כמשחק <b>תפקיד</b> (סטודנטית, הורה) נטמע בהדרגה בעצמי.</p>${def("השוואה חברתית",`${E("Social comparison")} הערכת היכולות והדעות שלנו בהשוואה לאחרים (<b>פסטינגר</b>, 1954).`)}${tiles([["grad","ראש לשועלים","תלמיד טוב בבית ספר ממוצע מרגיש מוכשר; באוניברסיטה סלקטיבית הוא ״זנב לאריות״"],["chart","השוואה כלפי מעלה","אחרי הצלחה משווים לאנשים שמצליחים עוד יותר, ושביעות הרצון יורדת"]])}${ex("מאיה הייתה מהטובות בתיכון. בחוג פסיכולוגיה כולם היו מצטיינים, ופתאום היא מרגישה ״ממוצעת״. היכולת שלה לא השתנתה; קבוצת ההשוואה כן.")}`,q:"q7"},
  {h:"הצלחות, ואיך אחרים רואים אותנו",html:`<p><b>הצלחה</b> במשימות מאתגרות מחזקת את תחושת היכולת. לכן מחמאות ריקות (״אין כמוך!״) לא בונות הערכה עצמית; <b>הישגים</b> כן.</p>${def("האני במראה",`${E("Looking-glass self")} <b>קולי</b>: אנחנו רואים את עצמנו כפי שאחרים רואים אותנו. <b>מיד</b> חידד: מה שחשוב הוא איך אנחנו <b>מדמיינים</b> שהם רואים אותנו. כי אנשים מחמיאים בקול ומרסנים ביקורת, אנחנו נוטים להפריז בהערכה שרוחשים לנו.`)}<p>אמריקנים החמיאו לאחרון ״אתמול״; יפנים, לפני כ<b>ארבעה ימים</b>.</p>`,q:"q9"}
 ]},
 {id:"t3",icon:"people",title:"העצמי והתרבות",blocks:[
  {h:"עצמי עצמאי ועצמי מקושר",html:`${def("על מה הנושא",`איך התרבות מעצבת את העצמי, את החשיבה ואת ההערכה העצמית.<br><b>מה נלמד כאן:</b> אינדיווידואליזם · קולקטיביזם · עצמי מקושר · חשיבה הוליסטית · הערכה עצמית ותרבות`)}<div class="tw"><table><tr><th></th><th>עצמי עצמאי</th><th>עצמי מקושר</th></tr><tr><td><b>הזהות</b></td><td>אישית: תכונות ומטרות</td><td>חברתית: קשרים עם אחרים</td></tr><tr><td><b>מה חשוב</b></td><td>אני: הישגים, זכויות</td><td>אנחנו: הקבוצה, מחויבויות</td></tr><tr><td><b>לא רואה בעין יפה</b></td><td>קונפורמיות</td><td>אגואיזם</td></tr><tr><td><b>מוטו</b></td><td>״אם אין אני לי, מי לי?״</td><td>״כשאני לעצמי, מה אני?״</td></tr><tr><td><b>תרבויות</b></td><td>המערב</td><td>אסיה, אפריקה, אמריקה הלטינית</td></tr></table></div><p>החלוקה <b>פשטנית</b>: בכל תרבות יש שונות, ותרבויות רבות נעשות <b>אינדיווידואליסטיות יותר</b> (סין, ״דור האני״; פחות שמות נפוצים לתינוקות בארה״ב: 20% ב־1990, 9% ב־2007).</p>`,q:"q11"},
  {h:"תרבות וחשיבה",html:`<p><b>ניסבט</b>: קולקטיביזם מוביל לחשיבה <b>הוליסטית</b>. מה מתאים: פנדה, קוף או בננה? אסיינים יותר: <b>קוף ובננה</b> (קשר); אמריקנים יותר: <b>קוף ופנדה</b> (קטגוריה).</p>${tiles([["data","סצנה מתחת למים","יפנים זכרו כ־60% יותר פרטי רקע; אמריקנים התמקדו בדג אחד גדול"],["check","בחירת עט","77% מהאמריקנים ורק 31% מהאסיינים בחרו את הצבע החריג"],["phone","תפקיד השפה","אמריקנים: ביטוי עצמי. קוריאנים: תקשורת בין אנשים"]])}`,q:"q13"},
  {h:"תרבות והערכה עצמית",html:`<ul><li>בתרבויות קולקטיביסטיות ההערכה העצמית תלויה ב<b>מה שאחרים חושבים</b> עליי ועל הקבוצה, ומשתנה לפי ההקשר: 4 מכל 5 קנדים לעומת 1 מכל 3 סינים ויפנים אמרו שהעצמי <b>לא</b> משתנה בין מצבים.</li><li><b>יפנים</b> מתמידים דווקא אחרי <b>כישלון</b> (לא לאכזב); מערביים מתמידים אחרי <b>הצלחה</b>.</li><li>שמחה ביפן = קרבה וחברות; בארה״ב = יעילות, עליונות וגאווה.</li><li>סטודנטים יפנים אחרי 7 חודשים בקנדה: הערכה עצמית <b>עלתה</b>.</li></ul>`,q:"q15"}
 ]},
 {id:"t4",icon:"question",title:"הכרת העצמי",blocks:[
  {h:"להסביר ולנבא את עצמנו",html:`${def("על מה הנושא",`עד כמה אנחנו באמת מכירים את עצמנו.<br><b>מה נלמד כאן:</b> הסברים להתנהגות · ניבוי התנהגות · כשל התכנון · ניבוי רגשות · הטיית ההשפעה · הזנחת החיסוניות · עמדות כפולות`)}<p>כשהסיבות <b>סמויות</b>, ההסברים שלנו להתנהגות שלנו לרוב שגויים. אנשים חשבו שמצב הרוח שלהם ירוד ב<b>יום שני</b>; בפועל לא.</p><div class="tw"><table><tr><th>מה ניבאו</th><th>מי ניבא טוב יותר</th></tr><tr><td>כמה זמן הקשר הרומנטי יחזיק</td><td><b>השותפים לדירה</b></td></tr><tr><td>ביצוע מתמחים בניתוח</td><td><b>החברים ללימודים</b></td></tr><tr><td>מתי תסתיים עבודת הגמר</td><td>חברים ומרצים (הסטודנטים איחרו בשבוע אחרי ״התסריט הגרוע ביותר״)</td></tr><tr><td>האם אצביע? (90% אמרו כן, 69% הצביעו)</td><td>הניבוי לגבי <b>אחרים</b> (70%) היה מדויק</td></tr></table></div>${rem("טיפ: כדי לנבא את עצמכם, חשבו מה <b>אחרים</b> היו עושים, ושאלו את השותפה לדירה.")}`,q:"q17"},
  {h:"לנבא רגשות",html:`${def("הטיית ההשפעה",`${E("Impact bias")} הערכת יתר של <b>משך</b> ההשפעה של אירועים רגשיים. בולטת במיוחד באירועים <b>שליליים</b>.`)}<p>מרצים שלא קיבלו קביעות היו מאושרים כעבור שנים <b>כמו</b> אלה שקיבלו. סטודנטים אחרי פרידה היו מדוכדכים <b>פחות</b> מכפי שניבאו. כשמדמיינים אובדן יד, מתמקדים באירוע ושוכחים את ״<b>כל השאר</b>״.</p>${def("הזנחת החיסוניות",`${E("Immune neglect")} מזלזלים במהירות ובעוצמה של ״<b>מערכת החיסון הפסיכולוגית</b>״, שמאפשרת להחלים מאירועים קשים. באופן אירוני, טרדות קטנות (שלא מפעילות אותה) מציקות לפעמים יותר זמן.`)}${ex("מאיה בטוחה שאם לא תתקבל לפסיכולוגיה קלינית ״החיים ייגמרו״. המחקר מנבא שהיא תתאושש מהר הרבה יותר ממה שהיא חושבת.")}`,q:"q19"},
  {h:"עמדות כפולות",html:`<p><b>וילסון</b>: התהליכים ש<b>שולטים</b> בהתנהגות שונים מאלה שבעזרתם אנחנו <b>מסבירים</b> אותה. זוגות שקודם <b>פירטו סיבות</b> למה הקשר טוב או רע נתנו דירוג אושר שלא ניבא כלום; מי שרק דירג, ניבא היטב.</p>${def("מערכת עמדות כפולה",`${E("Dual attitude system")} עמדות <b>חבויות</b> (אוטומטיות) יכולות להיות שונות מעמדות <b>גלויות</b> (מודעות). הגלויות משתנות בשכנוע; החבויות <b>לאט</b>, בתרגול והרגלים חדשים.`)}${rem("השלכות: <b>דיווח עצמי</b> אינו תמיד אמין, ועדות כנה אינה ערובה לנכונות.")}`,q:"q21"}
 ]},
 {id:"t5",icon:"scales",title:"הערכה עצמית",blocks:[
  {h:"מהי, ולמה אנחנו רוצים אותה",html:`${def("על מה הנושא",`מהי הערכה עצמית, מה מניע אותה, ומה הצד האפל שלה.<br><b>מה נלמד כאן:</b> הגדרה · שבח ספציפי · טסר · מד הסוציומטר · צד אפל · נרקיסיזם · הערכה עצמית בטוחה`)}${def("הערכה עצמית",`${E("Self-esteem")} הערכה כוללת של אדם את עצמו, תחושת ערך עצמי. הסיבתיות פועלת בשני הכיוונים: גם ״מלמטה למעלה״ (מהתחומים שחשובים לי) וגם ״מלמעלה למטה״.`)}<p><b>מושג עצמי אקדמי</b> מנבא הצלחה בלימודים, הערכה עצמית כללית לא. לכן השבח הטוב: <b>ספציפי ואמיתי</b> (״השתפרת מאז המבחן הקודם״). סטודנטים חלשים שקיבלו מסרים לחיזוק הערכה עצמית <b>נכשלו</b> במבחן הסופי.</p>${tiles([["people","טסר: אחים","הצלחה של אח <b>צעיר</b> מוכשר מאיימת במיוחד; פער יכולת גדול = יחסים פחות טובים"],["gear","לירי: מד דלק","הערכה עצמית היא <b>סוציומטר</b> שמזהיר מדחייה חברתית"]])}`,q:"q23"},
  {h:"הצד האפל ונרקיסיזם",html:`<p>הקשר בין הערכה עצמית <b>נמוכה</b> לבעיות <b>נעלם</b> כשמנטרלים גורמים כמו עוני והתעללות בילדות. הערכה עצמית <b>גבוהה</b> נמצאה אצל מנהיגי כנופיות, טרוריסטים ואסירים אלימים.</p>${def("נרקיסיזם",`תחושה מוגזמת של חשיבות עצמית, בלי התחשבות בזולת. חלק מ״<b>השלישייה האפלה</b>״ (עם מקיאווליזם ופסיכופתיה).`)}<p><b>בושמן ובאומייסטר</b>: אחרי ביקורת חריפה על חיבור, נרקיסיסטים השמיעו למבקר רעש מכאיב. הכי תוקפניים: <b>גם</b> נרקיסיזם <b>וגם</b> הערכה עצמית גבוהה. ונרקיסיסטים <b>לא</b> שונאים את עצמם בפנים: הם באמת חושבים שהם נפלאים. הנרקיסיזם <b>עולה</b> (״דור האני״, טוונג׳).</p>${rem("באומייסטר: ״שליטה עצמית חשובה לאין ערוך יותר מהערכה עצמית״.")}`,q:"q25"},
  {h:"הערכה עצמית בטוחה",html:`<p>בעלי הערכה עצמית <b>נמוכה</b> פגיעים לחרדה ובדידות, וממהרים להאמין שבן הזוג דוחה אותם, ולכן מרוצים פחות מהקשר.</p>${def("הערכה עצמית בטוחה",`נטועה בתחושה <b>פנימית</b>, לא בציונים, מראה, כסף או אישור. מי שמעריך את עצמו לפי מקורות <b>חיצוניים</b> חווה יותר לחץ, כעס, בעיות ביחסים, סמים והפרעות אכילה (קרוקר).`)}${ex("מאיה מרגישה טוב רק כשהיא מקבלת 95 ולייקים. לפי קרוקר, עדיף שתשקיע בפיתוח כישרונות וביחסים, ולא ב״להרגיש טוב עם עצמה״.")}`,q:"q27"}
 ]},
 {id:"t6",icon:"hand",title:"שליטה עצמית נתפסת",blocks:[
  {h:"כוח רצון ויעילות עצמית",html:`${def("על מה הנושא",`השליטה העצמית כמשאב, והאמונה שאני יכול להשפיע.<br><b>מה נלמד כאן:</b> כוח רצון כשריר · יעילות עצמית · מקור שליטה · חוסר אונים נרכש · עודף בחירה`)}<p>שליטה עצמית <b>מתרוקנת</b>: מי שאכל צנוניות במקום שוקולד ויתר מהר יותר על חידות בלתי פתירות. היא פועלת כמו <b>שריר</b>: נחלשת במאמץ, מתחדשת במנוחה, ומתחזקת באימון (באומייסטר).</p>${def("יעילות עצמית",`${E("Self-efficacy")} האמונה שאני <b>מסוגל</b> לבצע משימה (<b>בנדורה</b>). שונה מ<b>הערכה עצמית</b>, שהיא תחושת ערך כללית. מתכנתת יכולה להרגיש יעילה ובו בזמן להעריך את עצמה נמוך.`)}<p>ילדים ששובחו על <b>מאמץ</b> המשיכו לאתגר; ששובחו על <b>פיקחות</b> חששו לנסות שוב (מולר ודווק). המקור החזק ליעילות עצמית: <b>חוויות של הצלחה</b>.</p>`,q:"q29"},
  {h:"מקור שליטה וחוסר אונים",html:`${def("מקור שליטה",`${E("Locus of control")} <b>רוטר</b>: האם מה שקורה לי תלוי ב<b>מאמציי</b> (פנימי) או ב<b>מזל</b> ובכוחות חיצוניים (חיצוני).`)}${fig("locus45","בעלי מקור שליטה פנימי מצליחים יותר בלימודים, מפסיקים לעשן, חוגרים חגורות ומרוויחים יותר.")}${def("חוסר אונים נרכש",`${E("Learned helplessness")} <b>סליגמן</b>: כלבים שלא יכלו להימלט מהלם נשארו פסיביים גם כשיכלו. דומה לאנשים בדיכאון או תחת דיכוי.`)}<p><b>לנגר ורודין</b>: בבית אבות, קבוצה שקיבלה <b>אחריות ובחירה</b> השתפרה בערנות ובשמחת חיים (93%); קבוצה שטופלה בפסיביות נעשתה תשושה יותר.</p>`,q:"q31"},
  {h:"המחיר של עודף בחירה",html:`<p>בחירה חופשית קשורה לשביעות רצון ב־73 מדינות, אבל <b>יותר מדי</b> בחירה פוגעת (שוורץ: ״רודנות החופש״).</p>${tiles([["cart","ריבה","בחירה מתוך <b>30</b> אפשרויות: פחות מרוצים מאשר מתוך <b>6</b>"],["clock","עייפות","מי שבחר קורסים למד אחר כך פחות למבחן"],["lock","החלטה סופית","מרוצים יותר מבחירה ״בלי החזרות״, אבל מעדיפים לשלם על אפשרות לשנות"]])}${ex("מאיה התלבטה שבועות בין שלוש דירות. גם אחרי שבחרה, היא ממשיכה לחשוב על האחרות. בחירה סופית הייתה כנראה משאירה אותה מרוצה יותר.")}`,q:"q33"}
 ]},
 {id:"t7",icon:"chart",title:"ההטיה לטובת העצמי",blocks:[
  {h:"הצלחה שלי, כישלון של המצב",html:`${def("על מה הנושא",`הנטייה החזקה לראות את עצמנו באור חיובי, וכל הצורות שלה.<br><b>מה נלמד כאן:</b> ייחוס לטובת העצמי · טובים מהממוצע · אופטימיות לא מציאותית · קונצנזוס וייחודיות מדומים · הסברים · מחירים`)}${def("הטיה לטובת העצמי",`${E("Self-serving bias")} הנטייה לראות את עצמנו באור חיובי. בכל 53 המדינות שנבדקו, הממוצע בהערכה עצמית היה <b>מעל האמצע</b>.`)}${def("ייחוס לטובת העצמי",`הצלחה = ליכולת ולמאמץ שלי; כישלון = למזל, לשופט, למבחן ״הלא הוגן״. ״מכונית בלתי נראית הגיחה משום מקום ופגעה בי״.`)}<p><b>״הכתם העיוור של ההטיה״</b>: אנחנו רואים הטיה אצל אחרים, אבל לא אצלנו. סטודנטים תיארו את ״העצמי הקודם״ בשווה חיובי ושלילי, ואת העצמי הנוכחי פי 3 חיובי.</p>`,q:"q35"},
  {h:"טובים מהממוצע, ואופטימיים",html:`<div class="tw"><table><tr><th>תחום</th><th>ממצא</th></tr><tr><td>עבודות בית</td><td>בעלים העריכו 42%, נשים 33%, בפועל 39%. סך התרומות בקבוצה עולה על 100%</td></tr><tr><td>״להסתדר עם אחרים״</td><td>אף תלמיד י״ב לא דירג את עצמו מתחת לממוצע; 25% במאיון העליון</td></tr><tr><td>דעות קדומות</td><td>14% דירגו את עצמם 5 ומעלה; לדעתם 44% מהאחרים</td></tr></table></div><p>ההטיה חזקה יותר בתכונות <b>סובייקטיביות</b> (״ממושמע״) מאשר נצפות (״דייקן״).</p>${def("אופטימיות לא מציאותית",`ציפייה שלנו יקרו פחות דברים רעים מאשר לאחרים. מגבירה <b>פגיעות</b>: נהגים מבוגרים ״מעל הממוצע״ נכשלו פי 4 במבחן נהיגה.`)}${def("פסימיות הגנתית",`${E("Defensive pessimism")} צפיית בעיות שמניעה להתכונן. סטודנטים בטוחים מדי נוטים פחות להתכונן.`)}`,q:"q37"},
  {h:"קונצנזוס, ייחודיות, ולמה זה קורה",html:`<div class="tw"><table><tr><th>אפקט</th><th>על מה</th><th>דוגמה</th></tr><tr><td><b>קונצנזוס מדומה</b></td><td><b>דעות וחולשות</b>: ״כולם כמוני״</td><td>שקרן חושב שכולם משקרים; ״כולם עושים בוטוקס״</td></tr><tr><td><b>ייחודיות מדומה</b></td><td><b>יכולות ומעלות</b>: ״מעטים כמוני״</td><td>חוגרי חגורה מעריכים בחסר כמה אחרים חוגרים</td></tr></table></div><p><b>למה?</b> גם עיבוד מידע (זוכרים את מה ש<b>אנחנו</b> עשינו) וגם <b>מוטיבציה</b> לחזק את ההערכה העצמית.</p>${tiles([["check","מסייעת","מגינה מדיכאון; ניצולי 11 בספטמבר עם האדרה עצמית היו עמידים יותר; מפחיתה חרדת מוות (ניהול האימה)"],["x","מזיקה","מרעילה קבוצות (להקות רוק); 90% מהסגל ״מעל הממוצע״; <b>הטיה לטובת הקבוצה</b>"]])}`,q:"q39"}
 ]},
 {id:"t8",icon:"copies",title:"הצגת העצמי",blocks:[
  {h:"חבלה עצמית",html:`${def("על מה הנושא",`איך אנחנו מנהלים את הרושם שאנחנו עושים.<br><b>מה נלמד כאן:</b> חבלה עצמית · הצגת העצמי · ניטור עצמי · הצטנעות מדומה`)}${def("חבלה עצמית",`${E("Self-handicapping")} יצירת תירוץ <b>מראש</b> לכישלון, כדי להגן על הדימוי העצמי. אם נכשלתי, ״זה בגלל המסיבה״; אם הצלחתי, אני גאון.`)}<p><b>ברגלס וג׳ונס</b>: סטודנטים שקיבלו ציון גבוה על שאלות שניחשו <b>בחרו</b> בתרופה שאמורה <b>לפגוע</b> בחשיבה, כדי שיהיה להם תירוץ.</p>${ex("ערב לפני המבחן החשוב מאיה יוצאת למסיבה. אם תיכשל, ״לא הייתי ישנה״; אם תצליח, ״גם בלי שינה״. זו חבלה עצמית.")}`,q:"q41"},
  {h:"ניהול רושם וניטור עצמי",html:`${def("הצגת העצמי",`${E("Self-presentation")} הצגת דימוי רצוי לקהל <b>חיצוני</b> (אחרים) ו<b>פנימי</b> (אנחנו). איזון עדין: להיראות טוב, אבל <b>לא טוב מדי</b>. רשתות חברתיות הן ״ניהול רושם על סטרואידים״.`)}${def("ניטור עצמי",`${E("Self-monitoring")} מעקב אחר הרושם והתאמת ההתנהגות למצב. <b>גבוה</b>: ״זיקית חברתית״, פחות מחויבים ביחסים. <b>נמוך</b>: אומרים מה שחושבים, עלולים להיראות חסרי רגישות.`)}<p><b>הצטנעות מדומה</b>: מציגים את עצמנו צנועים מכפי שאנחנו מרגישים. אבל כשההצלחה ברורה, ״זה לא מי יודע מה״ נתפס כחוסר כנות.</p>${rem("סיכום הפרק (פסקל): <b>יעילות עצמית</b> ו<b>הטיה לטובת העצמי</b> הן שתי אמיתות. כל אחת לבד היא חצי אמת.")}`,q:"q43"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מהו אפקט הזרקור?","a":"אמונה שאחרים שמים לב אלינו יותר מהמציאות","w":["האמונה שאחרים לא שמים לב אלינו בכלל","הנטייה לחפש תשומת לב במקומות ציבוריים","הנטייה לשים לב רק לאנשים בולטים"],"e":"אנחנו רואים את עצמנו במרכז הבמה, ולכן מפריזים בתשומת הלב שמקדישים לנו."},{"q":"כמה מהכיתה שמו לב לחולצה עם בארי מנילו?","a":"23%","w":["כמחצית","כמעט כולם","אף אחד"],"e":"לובשי החולצה העריכו שכמחצית ישימו לב."}]},"q2":{"t":"t1","v":[{"q":"מאיה בטוחה שכולם רואים את השיער הסורר שלה. מה זה מדגים?","a":"אפקט הזרקור","w":["אשליית השקיפות","קונצנזוס מדומה","ניטור עצמי"],"e":"היא מפריזה בתשומת הלב שאחרים מקדישים להופעה שלה."}]},"q3":{"t":"t1","v":[{"q":"מהי אשליית השקיפות?","a":"האשליה שהרגשות שלנו ניכרים לאחרים בקלות","w":["האשליה שאנחנו מבינים את רגשות האחרים","הנטייה להסתיר רגשות מאחרים","היכולת לזהות שקרים של אחרים"],"e":"נואמים חושבים שהמתח שלהם גלוי, אבל הצופים רואים פחות ממה שנדמה."},{"q":"מה עזר לנואמים בניסוי של סביצקי וגילוביץ׳?","a":"הסבר על אשליית השקיפות","w":["הרגעה כללית שמתח הוא טבעי","זמן הכנה ארוך יותר","נאום מול קהל קטן יותר"],"e":"מי שקיבל הסבר נאם טוב יותר ונראה רגוע יותר, גם בעיני הצופים."}]},"q4":{"t":"t1","v":[{"q":"איך דירגו נואמים את המתח שלהם לעומת הצופים?","a":"הנואמים דירגו גבוה יותר מהצופים","w":["הצופים דירגו גבוה יותר מהנואמים","שני הצדדים דירגו אותו דבר","הנואמים לא הרגישו מתח בכלל"],"e":"6.65 אצל הנואמים לעומת 5.25 אצל הצופים."}]},"q5":{"t":"t2","v":[{"q":"מהו מושג העצמי?","a":"התשובות של אדם לשאלה ״מי אני?״","w":["הערכה כוללת של הערך העצמי שלנו","האופן שבו אחרים רואים אותנו מבחוץ","הדימוי שאנחנו מציגים לאחרים בכוונה"],"e":"הערכה כוללת של ערך היא הערכה עצמית. מושג העצמי הוא מה שאני חושב שאני."},{"q":"מהי סכמת עצמי?","a":"אמונה על העצמי שמארגנת מידע","w":["תוכנית לשיפור העצמי","רשימה של יעדים לעתיד","דימוי שאחרים יוצרים עלינו"],"e":"מי שרואה את עצמו כספורטאי שם לב לגוף של אחרים ולחוויות ספורט."}]},"q6":{"t":"t2","v":[{"q":"מהם ״סוגי עצמי אפשריים״?","a":"מי שאנחנו חולמים או חוששים להיות","w":["התפקידים השונים שאנחנו ממלאים בחיים","העצמי שאנחנו מציגים בכל מצב חברתי","העצמי שהיה לנו בעבר הרחוק"],"e":"מרקוס: גם העצמי הרצוי וגם המאיים מניעים אותנו לפעול."}]},"q7":{"t":"t2","v":[{"q":"מהי השוואה חברתית?","a":"הערכת יכולות ודעות מול אחרים","w":["התאמת הדעות שלנו לדעת הרוב","תחרות גלויה וישירה בין אנשים","חיפוש אישור ותמיכה מאחרים"],"e":"פסטינגר, 1954. כך אנחנו קובעים אם אנחנו עשירים, חכמים או נמוכים."},{"q":"למה תלמיד מצטיין מרגיש פחות מוכשר באוניברסיטה סלקטיבית?","a":"קבוצת ההשוואה השתנתה","w":["היכולת שלו באמת ירדה","המרצים קשוחים יותר שם","החומר קשה יותר מבתיכון"],"e":"״ראש לשועלים״ הופך ל״זנב לאריות״."}]},"q8":{"t":"t2","v":[{"q":"מה קורה לרוב אחרי הצלחה, לפי ההשוואה החברתית?","a":"משווים כלפי מעלה ומרוצים פחות","w":["משווים כלפי מטה, ומרגישים טוב","מפסיקים להשוות את עצמנו לאחרים","משווים רק לעצמנו בעבר"],"e":"במעלה סולם ההצלחה מביטים למעלה, לא למטה."}]},"q9":{"t":"t2","v":[{"q":"מהו ״האני במראה״ של קולי?","a":"אנחנו רואים את עצמנו כפי שאחרים רואים אותנו","w":["אנחנו מעריכים את עצמנו לפי המראה החיצוני","אנחנו מחקים את מי שמולנו","אנחנו מתעלמים ממה שאחרים חושבים"],"e":"מיד הוסיף: מה שחשוב הוא איך אנחנו מדמיינים שהם רואים אותנו."},{"q":"למה אנחנו נוטים להפריז בהערכה שאחרים רוחשים לנו?","a":"אנשים מחמיאים בקול ומרסנים ביקורת","w":["אנשים אחרים באמת מעריכים אותנו מאוד","אנחנו לא שמים לב למחמאות","אנחנו זוכרים רק ביקורת"],"e":"לכן הדימוי שאנחנו מדמיינים חיובי יותר מהמציאות."}]},"q10":{"t":"t2","v":[{"q":"למה מחמאות כלליות (״אין כמוך!״) לא בונות הערכה עצמית?","a":"הערכה עצמית נבנית מהישגים אמיתיים","w":["ילדים לא מבינים מחמאות כלליות","מחמאות תמיד פוגעות בהערכה העצמית","הערכה עצמית נקבעת רק בגנטיקה"],"e":"הרגשות הן תולדה של המציאות. צריך להגיע להישגים בעבודה קשה."}]},"q11":{"t":"t3","v":[{"q":"מה מאפיין עצמי מקושר?","a":"זהות שמוגדרת דרך קשרים עם אחרים","w":["זהות שמוגדרת דרך תכונות אישיות","זהות יציבה שלא משתנה בין מצבים","זהות שמתנגדת לקונפורמיות"],"e":"״כשאני לעצמי, מה אני?״. נפוץ בתרבויות קולקטיביסטיות."},{"q":"מה לא רואים בעין יפה בתרבות של עצמי עצמאי?","a":"קונפורמיות","w":["אגואיזם"," רב לפני מבחן חשוב. מה זה מדגים?","a":"חבלה עצמית","w":["אפקט הזרקור","ניטור עצמי","אשליית השקיפות"],"e":"אם תיכשל, יש לה תירוץ. אם תצליח, היא נראית מוכשרת במיוחד."}]},"q43":{"t":"t8","v":[{"q":"מהי הצגת העצמי?","a":"הצגת דימוי רצוי לאחרים ולעצמנו","w":["חשיפה מלאה של כל מה שאנחנו מרגישים","הצגה של העצמי האמיתי בלבד","התנהגות שמכוונת רק לקהל פנימי"],"e":"איזון עדין: להיראות טוב, אבל לא טוב מדי."},{"q":"מה מאפיין אדם עם ניטור עצמי גבוה?","a":"מתאים את עצמו למצב, כמו זיקית","w":["אומר תמיד בדיוק את מה שהוא חושב","מתעלם לגמרי ממה שאחרים חושבים","מחויב מאוד ויציב ביחסים שלו"],"e":"הוא גם פחות מחויב ביחסים ופחות מרוצה בנישואים."}]},"q44":{"t":"t8","v":[{"q":"מהי הצטנעות מדומה?","a":"הצגת הערכה עצמית נמוכה מהאמיתית","w":["הערכה עצמית נמוכה אמיתית וכנה","הגזמה בהישגים כדי להרשים","הודאה כנה וישירה בטעות"],"e":"אבל כשההצלחה ברורה, ״זה לא מי יודע מה״ נתפס כחוסר כנות."}]}};
const H={"h1":{"t":"t1","v":[{"q":"סטודנט נכנס להרצאה עם כתם קפה על החולצה, ובטוח שכל הכיתה שמה לב. בפועל כמעט אף אחד לא ראה. איך קוראים לזה?","a":"אפקט הזרקור: מפריזים בכמה אחרים שמים לב אלינו","w":["אשליית השקיפות: מפריזים בכמה הרגשות שלנו גלויים","הטיית ההשפעה: מפריזים במשך ההשפעה הרגשית","קונצנזוס מדומה: חושבים שכולם מתנהגים כמונו"],"e":"בניסוי של חולצת בארי מנילו ציפו שמחצית ישימו לב, ובפועל 23%."},{"q":"נואמת בטוחה שכל הקהל רואה כמה היא לחוצה, אבל הקהל מדרג אותה כרגועה למדי. איך קוראים לזה?","a":"אשליית השקיפות: חושבים שהרגשות שלנו גלויים","w":["אפקט הזרקור: חושבים שאחרים שמים לב למראה שלנו","חבלה עצמית: יוצרים מראש תירוץ לכישלון","הצטנעות מדומה: מציגים את עצמנו פחות טוב"],"e":"הזרקור עוסק במה שרואים עלינו, והשקיפות במה שמרגישים בפנים."}]},"h2":{"t":"t1","v":[{"q":"מה עזר לנואמים לנאום טוב יותר, לפי הספר?","a":"הסבר על אשליית השקיפות והשפעתה","w":["הרגעה כללית בנוסח ״אל תדאג, יהיה בסדר״","תרגול הנאום מול מראה שוב ושוב לפני האירוע","אזהרה שהקהל יבחין בכל סימן של לחץ"],"e":"הרגעה כללית לא עזרה. רק ההבנה של האשליה עצמה שיפרה את הביצוע."}]},"h3":{"t":"t2","v":[{"q":"סטודנטית שרואה את עצמה כ״אוהבת ספורט״ שמה לב לתוצאות משחקים וזוכרת אותן היטב. איזה מושג מסביר את זה?","a":"סכמת עצמי: אמונה על העצמי שמארגנת איך קולטים מידע","w":["עצמי אפשרי: מי שהיא חולמת להיות בעתיד","השוואה חברתית: הערכה של עצמה מול אחרים","האני במראה: איך היא מדמיינת שאחרים רואים אותה"],"e":"סכמת העצמי משפיעה על מה שאנחנו שמים לב אליו וזוכרים."}]},"h4":{"t":"t2","v":[{"q":"בתיכון יואב היה ״הכי חכם בכיתה״. באוניברסיטה, בחוג של מצטיינים, הוא מרגיש ממוצע, אף שהוא לא השתנה. מה מסביר את זה?","a":"השוואה חברתית: הוא מעריך את עצמו מול קבוצה חדשה","w":["האני במראה: הוא רואה את עצמו כפי שהמרצים רואים אותו","עצמי אפשרי: הוא חושש להיות מי שנכשל","הטיה לטובת העצמי: הוא מייחס הצלחות לעצמו"],"e":"פסטינגר: מעריכים את עצמנו בהשוואה לאחרים. ״ראש לשועלים או זנב לאריות״."}]},"h5":{"t":"t2","v":[{"q":"סטודנטית לרפואה מדמיינת את עצמה כרופאה מצליחה, וגם חוששת שתהיה סטודנטית שנשרה. איך קוראים לשתי התמונות האלה?","a":"עצמי אפשרי: מי שחולמים או חוששים להיות","w":["סכמות עצמי: אמונות על מי שאני עכשיו","מושג עצמי אקדמי: הערכה של היכולת בלימודים","ניטור עצמי: התאמת התנהגות לקהל"],"e":"מרקוס: העצמי האפשרי, החיובי וגם השלילי, מניע אותנו לפעול."}]},"h6":{"t":"t3","v":[{"q":"אישה מתארת את עצמה: ״אני בת של אמא שלי, אמא של שלושה, וחברה בקהילה״. איזה סוג עצמי זה מבטא?","a":"עצמי מקושר: הזהות מבוססת על קשרים עם אחרים","w":["עצמי עצמאי: הזהות מבוססת על תכונות אישיות","עצמי אפשרי: מי שהיא חולמת להיות","סכמת עצמי: אמונה שמארגנת מידע על ספורט"],"e":"עצמי עצמאי מתאר תכונות ומטרות (״אני שאפתנית, מצחיקה״). עצמי מקושר מתאר יחסים."}]},"h7":{"t":"t3","v":[{"q":"סטודנטית מתרבות עם עצמי מקושר נכשלה במשימה. מה צפוי לפי הספר?","a":"היא תתמיד יותר, כדי להשתפר","w":["היא תוותר מהר יותר, כדי לשמור על הערכה עצמית","היא תייחס את הכישלון לנסיבות חיצוניות","היא תעבור למשימה שבה היא כבר מצליחה"],"e":"אצל עצמי מקושר מתמידים אחרי כישלון. אצל עצמי עצמאי מתמידים יותר אחרי הצלחה."}]},"h8":{"t":"t3","v":[{"q":"מראים לאנשים תמונת אקווריום. מי מתרבות עם עצמי מקושר יתאר יותר את הרקע והקשרים בין הפרטים. איך קוראים לסגנון הזה?","a":"חשיבה הוליסטית: שמים לב לקשרים ולהקשר","w":["חשיבה קטגוריאלית: שמים לב לפריט הבולט","קונצנזוס מדומה: חושבים שכולם רואים כמונו","ניטור עצמי נמוך: לא שמים לב לסביבה"],"e":"בתרבויות עצמאיות רואים קודם את ״הדג הגדול״. בתרבויות מקושרות רואים את התמונה כשלם."}]},"h9":{"t":"t4","v":[{"q":"90% מהסטודנטים אמרו שיצביעו בבחירות, ורק 69% הצביעו. מה זה מדגים?","a":"אנחנו לא טובים בניבוי ההתנהגות של עצמנו","w":["אפקט הזרקור: חושבים שכולם שמים לב אם הצבענו","הצטנעות מדומה: מציגים את עצמנו פחות טוב","אשליית השקיפות: חושבים שהכוונות שלנו גלויות"],"e":"גם שותפים לדירה ניבאו טוב יותר מהסטודנטים עצמם אם הקשר הרומנטי שלהם יימשך."}]},"h10":{"t":"t4","v":[{"q":"סטודנט בטוח שאם לא יתקבל לתואר שני, הוא יהיה אומלל במשך שנים. בפועל, אחרי כמה חודשים הוא מרגיש טוב. מה הטעות שלו?","a":"הטיית ההשפעה: הוא הפריז במשך ההשפעה הרגשית","w":["אופטימיות לא מציאותית: הוא חשב שזה לא יקרה לו","כשל התכנון: הוא הפריז במהירות שבה יסיים","חוסר אונים נרכש: הוא הפסיק לנסות אחרי כישלון"],"e":"חושבים רק על האירוע ושוכחים את כל השאר שיקרה. וגם מזלזלים ביכולת להתאושש (הזנחת החיסוניות)."}]},"h11":{"t":"t4","v":[{"q":"אנשים שהתבקשו לכתוב בדיוק למה הם מאושרים בקשר שלהם, ניבאו פחות טוב אם הקשר יימשך. מה המסקנה?","a":"דיווח עצמי לא תמיד אמין","w":["אנשים משקרים בכוונה על הקשרים שלהם","כתיבה על קשר תמיד מחלישה אותו","אנשים מאושרים לא יודעים לנמק את האושר"],"e":"לפי וילסון, החיפוש אחר סיבות ״דרס״ את התחושה האמיתית (העמדה החבויה)."}]},"h12":{"t":"t4","v":[{"q":"אנשים מעריכים שיתאוששו מאוד לאט מפרידה, כי הם לא לוקחים בחשבון את היכולת שלהם להתמודד ולמצוא משמעות. איך קוראים לטעות הזו?","a":"הזנחת החיסוניות","w":["הטיית ההשפעה הרגשית","כשל התכנון","אפקט הזרקור"],"e":"מזלזלים ב״מערכת החיסון הפסיכולוגית״. זה אחד ההסברים להטיית ההשפעה."}]},"h13":{"t":"t5","v":[{"q":"מורה רוצה לשפר את הציונים של תלמידים חלשים, ושולחת להם כל שבוע מסר ״אתם מעולים, זקפו את הראש!״. מה צפוי לפי הספר?","a":"זה עלול לפגוע: שבח כללי לא עוזר","w":["הציונים ישתפרו, כי הערכה עצמית גבוהה גורמת להצלחה","לא תהיה השפעה בכלל, לא חיובית ולא שלילית","הציונים ישתפרו, אבל רק אצל התלמידים החזקים"],"e":"בניסוי, סטודנטים חלשים שקיבלו מסרים כאלה קיבלו ציונים נמוכים יותר."}]},"h14":{"t":"t5","v":[{"q":"גיל מצטיין בגיטרה. כשאחיו הצעיר מתחיל לנגן ומתקדם מהר ממנו, גיל מרגיש מאוים. מה מסביר את זה?","a":"טסר: הצלחה של קרוב בתחום שלנו מאיימת","w":["לירי: ההערכה העצמית מתריעה מפני דחייה","קרוקר: ההערכה העצמית שלו בטוחה ופנימית","בנדורה: היעילות העצמית שלו גבוהה"],"e":"אילו האח היה מצליח בתחום אחר, זה לא היה מאיים, ואולי אפילו מקור לגאווה."}]},"h15":{"t":"t5","v":[{"q":"לפי לירי, מה התפקיד של ההערכה העצמית?","a":"״סוציומטר״ שמתריע מפני דחייה","w":["מקור לגאווה שמניע אנשים להצליח","מנגנון שמגן על האדם מפני חרדת מוות","כלי שעוזר להשוות את עצמנו לאחרים"],"e":"כשמרגישים דחויים, ההערכה העצמית יורדת, כמו נורת אזהרה."}]},"h16":{"t":"t5","v":[{"q":"מי צפוי להגיב בתוקפנות הרבה ביותר כשמעליבים אותו?","a":"מי שגם נרקיסיסט וגם בעל הערכה גבוהה","w":["מי שיש לו הערכה עצמית נמוכה מאוד","מי שיש לו הערכה עצמית בטוחה ופנימית","מי שיש לו יעילות עצמית נמוכה"],"e":"בניגוד לדעה הרווחת, נרקיסיסטים לא שונאים את עצמם בפנים."}]},"h17":{"t":"t5","v":[{"q":"סטודנטית מרגישה שווה רק כשהיא מקבלת ציונים גבוהים ומחמאות על המראה. מה הבעיה, לפי קרוקר?","a":"הערכה עצמית שבירה, שתלויה בגורמים חיצוניים","w":["הערכה עצמית בטוחה, שנשענת על ערכים פנימיים","יעילות עצמית נמוכה, כי היא לא מאמינה ביכולתה","מקור שליטה פנימי, כי היא מאמינה שהכול תלוי בה"],"e":"הערכה עצמית בטוחה, שלא תלויה בציונים ובאישור, עדיפה. היא מאפשרת ללמוד מכישלון."}]},"h18":{"t":"t6","v":[{"q":"איזה משפט מבטא יעילות עצמית, ולא הערכה עצמית?","a":"״אני יכולה לעבור סטטיסטיקה״","w":["״אני אדם טוב וראוי לאהבה מכולם״","״אני סטודנטית ואחות גדולה בבית״","״הצלחתי במבחן כי היה לי מזל״"],"e":"יעילות עצמית = ״אני מסוגל״ במשימה מסוימת. הערכה עצמית = תחושת ערך כללית."}]},"h19":{"t":"t6","v":[{"q":"אמא רוצה לחזק את בנה אחרי שפתר חידה קשה. מה עדיף, לפי הספר?","a":"״עבדת קשה ולא ויתרת״","w":["״אתה כל כך חכם ומוכשר״","״החידה הייתה קלה בשבילך״","״אתה הכי חכם בכיתה שלך״"],"e":"שבח על מאמץ בונה יעילות עצמית. מי ששובח על פיקחות נמנע מאתגרים, כדי לא להיראות טיפש."}]},"h20":{"t":"t6","v":[{"q":"עובדת שמשוכנעת ש״אין טעם להתאמץ, הקידומים תלויים רק בקשרים ובמזל״. מה מאפיין אותה?","a":"מקור שליטה חיצוני","w":["מקור שליטה פנימי","יעילות עצמית גבוהה","ניטור עצמי גבוה"],"e":"רוטר: פנימי = ״זה תלוי בי״, חיצוני = ״זה תלוי במזל ובאחרים״. אחרי חוויות חוזרות כאלה עלול להיווצר חוסר אונים נרכש."}]},"h21":{"t":"t6","v":[{"q":"בבית אבות, דיירים שקיבלו בחירה ואחריות (למשל צמח לטפל בו) היו פעילים ומאושרים יותר. מה זה מראה?","a":"שתחושת שליטה משפרת את מצב האדם","w":["שעודף בחירה פוגע בשביעות הרצון","שהערכה עצמית גבוהה גורמת לבריאות","שצמחים משפרים מצב רוח בכל גיל"],"e":"זה המחקר של לנגר ורודין. ההפך הוא חוסר אונים נרכש."}]},"h22":{"t":"t6","v":[{"q":"חנות הציעה 30 סוגי ריבה, וחנות אחרת 6 סוגים. איפה הלקוחות היו מרוצים יותר מהבחירה?","a":"ב־6 הסוגים, כי עודף בחירה מעייף","w":["בחנות עם 30 הסוגים, כי יותר בחירה נותנת יותר שליטה","אין הבדל, כי שביעות הרצון תלויה רק בטעם","בחנות עם 30 הסוגים, כי אפשר למצוא בדיוק מה שרוצים"],"e":"עוד ממצא: החלטה סופית, שאי אפשר לשנות, משאירה יותר שביעות רצון."}]},"h23":{"t":"t7","v":[{"q":"אחרי מבחן, סטודנט אומר: ״קיבלתי 95 בגלל שאני חכם. בקורס השני קיבלתי 60 כי המרצה לא הוגן״. איך קוראים לזה?","a":"ייחוס לטובת העצמי: הצלחה בזכותי","w":["קונצנזוס מדומה: חושבים שכולם קיבלו ציון דומה","אופטימיות לא מציאותית: ״לי זה לא יקרה״","חבלה עצמית: יוצרים מראש תירוץ לכישלון"],"e":"זו הצורה הבסיסית של ההטיה לטובת העצמי."}]},"h24":{"t":"t7","v":[{"q":"אדם שמעתיק בהגשות אומר ״כולם מעתיקים״, ואדם שמתנדב אומר ״מעטים מתנדבים כמוני״. אילו הטיות אלה, לפי הסדר?","a":"קונצנזוס מדומה, ואז ייחודיות מדומה","w":["ייחודיות מדומה, ואז קונצנזוס מדומה","קונצנזוס מדומה בשני המקרים","ייחודיות מדומה בשני המקרים"],"e":"על חולשות אומרים ״כולם כאלה״. על מעלות אומרים ״רק אני כזה״. שתיהן שומרות על תדמית חיובית."}]},"h25":{"t":"t7","v":[{"q":"סטודנטית בטוחה ש״לי לא יקרה תאונה״, ולכן לא חוגרת חגורה במושב האחורי. מה הבעיה בהטיה שלה?","a":"אופטימיות לא מציאותית מגבירה פגיעות","w":["אופטימיות לא מציאותית מגינה עליה מדיכאון","פסימיות הגנתית גורמת לה להיות זהירה מדי","קונצנזוס מדומה גורם לה לחשוב שכולם חוגרים"],"e":"פסימיות הגנתית, לצפות לקושי ולהתכונן אליו, עוזרת יותר במצבים כאלה."}]},"h26":{"t":"t7","v":[{"q":"מה צד אחד שבו ההטיה לטובת העצמי מזיקה, לפי הספר?","a":"בצוות כל אחד חושב שתרם יותר","w":["היא גורמת לדיכאון ולחרדה מפני המוות","היא מורידה את ההערכה העצמית של רוב האנשים","היא גורמת לאנשים להעריך את עצמם נמוך מדי"],"e":"היא גם יוצרת ״כתם עיוור״ (רואים הטיות רק אצל אחרים) והטיה לטובת הקבוצה. מצד שני, היא מגינה מדיכאון."}]},"h27":{"t":"t8","v":[{"q":"יום לפני מבחן חשוב, סטודנטית יוצאת למסיבה עד הבוקר. לפי הפרק, מה אולי היא עושה?","a":"חבלה עצמית: יוצרת מראש תירוץ אם תיכשל","w":["הצטנעות מדומה: מציגה את עצמה פחות טוב","ניטור עצמי גבוה: מתאימה את עצמה לחברים","ייחוס לטובת העצמי: לוקחת קרדיט על הצלחה"],"e":"אם תיכשל, ״לא ישנתי״. אם תצליח, ״הצלחתי גם בלי לישון״. כמו בניסוי של ברגלס וג׳ונס עם ״התרופה המזיקה״."}]},"h28":{"t":"t8","v":[{"q":"אדם מתנהג אחרת לגמרי במסיבה, בעבודה ובבית, לפי מה שהסביבה מצפה ממנו. איך מתאר אותו הפרק?","a":"ניטור עצמי גבוה: ״זיקית חברתית״","w":["ניטור עצמי נמוך: אומר מה שהוא חושב","הצטנעות מדומה: מציג את עצמו פחות טוב","עצמי מקושר: מגדיר את עצמו לפי קשרים"],"e":"מי שבניטור עצמי נמוך מתנהג אותו דבר בכל מקום, לפי מה שהוא חושב ומרגיש."},{"q":"ספורטאית שניצחה בתחרות אומרת ״זה היה בעיקר מזל״, אף שהיא יודעת שהתאמנה קשה. מה היא עושה?","a":"הצטנעות מדומה: מציגה פחות ממה שמרגישה","w":["ייחוס לטובת העצמי: מייחסת את ההצלחה לעצמה","חבלה עצמית: יוצרת תירוץ מראש לכישלון","ייחודיות מדומה: חושבת שמעטים כמוה"],"e":"הצגת העצמי: להיראות טוב, אבל לא טוב מדי. הצטנעות עוזרת לא להיראות כמו התרברבות."}]}};
const SUM=`<h2>סיכום: מאיירס פרק 2 - העצמי בעולם החברתי</h2>
<div class="key"><b>למה הפרק הזה חשוב?</b> הספר פותח במשפט ישן: יש שלושה דברים קשים במיוחד, פלדה, יהלום, ו<b>לדעת את עצמך</b>. ואז דוגמה מוכרת: קמתם עם שיער פרוע, ואתם בטוחים שכולם מסתכלים. הפרק מראה שהעצמי נמצא במרכז העולם החברתי שלנו: הוא מסנן את מה שאנחנו רואים, זוכרים ומרגישים. ומצד שני, החברה מעצבת אותו.<br><br>
<b>השאלה של הפרק במשפט אחד:</b> איך אנחנו רואים את עצמנו, כמה נכונה התמונה הזו, ואיך היא משפיעה על מה שאנחנו מרגישים ועושים מול אחרים?<br><br>
<b>הפרק בנוי מחמישה חלקים, וכל אחד עונה על שאלה אחרת על העצמי:</b><br>
① <b>כמה אחרים שמים לב אלינו?</b> (סעיף 1): פחות ממה שנדמה.<br>
② <b>מי אני, ומה מעצב את זה?</b> (סעיפים 2–4): מושג העצמי, התרבות, וכמה באמת אנחנו מכירים את עצמנו.<br>
③ <b>כמה אני שווה?</b> (סעיף 5): הערכה עצמית, היתרונות והצד האפל.<br>
④ <b>כמה אני שולט בחיי?</b> (סעיף 6): יעילות עצמית ומקור שליטה.<br>
⑤ <b>איך אני רואה ומציג את עצמי?</b> (סעיפים 7–8): ההטיה לטובת העצמי והצגת העצמי.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>מושג העצמי</b></td><td>מה אני חושב על <b>מי</b> אני. ״אני סטודנטית, אחות גדולה, טובה במתמטיקה״.</td></tr>
<tr><td><b>הערכה עצמית</b></td><td>כמה אני <b>שווה</b> בעיני עצמי. ״אני אדם טוב וראוי״.</td></tr>
<tr><td><b>יעילות עצמית</b></td><td>האמונה ש<b>אני מסוגל</b> לעשות משהו מסוים.</td></tr>
<tr><td><b>הטיה</b></td><td>טעות קבועה בכיוון אחד בחשיבה שלנו.</td></tr>
<tr><td><b>ייחוס</b></td><td>ההסבר שאנחנו נותנים ל״למה זה קרה״.</td></tr></table></div>

<div class="ex"><b>הדוגמה שתלווה אותנו: מאיה</b> (דמות בדויה להמחשה). סטודנטית שנה א׳: נבוכה מהשיער הסורר, מרגישה ״ממוצעת״ בחוג של מצטיינים, ויוצאת למסיבה ערב לפני מבחן.</div>

<h3>1. אפקט הזרקור ואשליית השקיפות</h3>
<p>מתחילים בטעות הכי יומיומית: אנחנו במרכז העולם שלנו, ולכן בטוחים שאנחנו גם במרכז העולם של אחרים.</p>
<div class="ex"><b>אפקט הזרקור</b> = אנחנו חושבים שאחרים שמים לב אלינו (להופעה, לטעויות) יותר ממה שהם באמת שמים.<br>
<b>הניסוי מהספר:</b> סטודנטים לבשו חולצה מביכה (עם תמונה של הזמר בארי מנילו) ונכנסו לחדר. הם ניחשו שבערך מחצית ישימו לב. בפועל, רק <b>23%</b> שמו לב.<br>
<b>אצל מאיה:</b> היא בטוחה שכל הכיתה מדברת על השיער שלה. רוב האנשים עסוקים בעצמם.</div>
<div class="ex"><b>אשליית השקיפות</b> = אנחנו חושבים שהרגשות <b>הפנימיים</b> שלנו גלויים לכולם.<br>
<b>הניסוי:</b> נואמים דירגו כמה הם נראו לחוצים (6.65), והצופים דירגו פחות (5.25).<br>
<b>מה עוזר:</b> כשהסבירו לנואמים על האשליה, הנאום השתפר. הרגעה כללית (״אל תדאג״) לא עזרה.<br>
<b>ההבדל בין השניים:</b> הזרקור הוא על מה ש<b>רואים</b> עלינו (מראה, מעשים). השקיפות היא על מה ש<b>מרגישים</b> בפנים.</div>

<h3>2. מושג העצמי: מי אני?</h3>
<p>אחרי שראינו שהעצמי ״מנפח״ את חשיבותו, השאלה היא ממה הוא בנוי. הספר מציג כמה מושגים:</p>
<div class="ex"><b>מושג העצמי</b> = כל התשובות שלנו לשאלה ״מי אני?״.<br>
<b>סכמת עצמי</b> = אמונה ספציפית על עצמי שמארגנת איך אני קולט מידע. <b>דוגמה:</b> מי שחושבת ״אני ספורטאית״ שמה לב לגוף של אנשים ולתוצאות משחקים, וזוכרת אותם טוב יותר.<br>
<b>אפקט ההתייחסות העצמית:</b> מידע שקשור אלינו נקלט ונזכר טוב יותר.<br>
<b>עצמי אפשרי</b> (מרקוס) = מי שאנחנו <b>חולמים</b> להיות, וגם מי שאנחנו <b>חוששים</b> להיות. <b>אצל מאיה:</b> ״פסיכולוגית מצליחה״, או ״מי שנשרה מהתואר״. שניהם מניעים אותה.</div>
<div class="ex"><b>מה מעצב את מושג העצמי?</b><br>
• <b>תפקידים:</b> תפקיד חדש (חיילת, סטודנטית) מרגיש בהתחלה ״הצגה״, ואחרי זמן הוא נטמע בעצמי.<br>
• <b>השוואה חברתית</b> (פסטינגר) = מעריכים את עצמנו לפי אחרים. <b>אצל מאיה:</b> בתיכון היא הייתה ״חכמה״. בחוג של מצטיינים היא ״ממוצעת״. היא לא השתנתה, הקבוצה להשוואה השתנתה (״ראש לשועלים או זנב לאריות״).<br>
• <b>הצלחות וכישלונות:</b> הצלחה אמיתית במשימות קשות בונה ביטחון יותר ממחמאות ריקות.<br>
• <b>שיפוטים של אחרים:</b> <b>״האני במראה״</b> (קולי): אנחנו רואים את עצמנו כפי ש<b>אנחנו מדמיינים</b> שאחרים רואים אותנו.</div>

<h3>3. העצמי והתרבות</h3>
<p>מושג העצמי מעוצב גם על ידי התרבות. הספר מציג שני ״סוגים״ של עצמי:</p>
<div class="tw"><table><tr><th></th><th>עצמי עצמאי (בעיקר מערב)</th><th>עצמי מקושר (אסיה ותרבויות רבות)</th></tr>
<tr><td><b>מי אני</b></td><td>התכונות והמטרות <b>האישיות</b> שלי</td><td>ה<b>קשרים</b> שלי: בת של, חברה ב־</td></tr>
<tr><td><b>מה לא רצוי</b></td><td>קונפורמיות, ״ללכת אחרי העדר״</td><td>אגואיזם, ״לבלוט״</td></tr>
<tr><td><b>איך חושבים</b></td><td>בקטגוריות. בתמונת אקווריום רואים קודם את הדג הגדול</td><td><b>הוליסטית</b>: רואים קשרים ורקע (קוף שייך לבננה)</td></tr>
<tr><td><b>מתי מתמידים</b></td><td>אחרי <b>הצלחה</b></td><td>אחרי <b>כישלון</b> (כדי להשתפר)</td></tr></table></div>
<div class="ex"><b>דוגמה מהספר:</b> כשהציעו לאנשים לבחור עט מתוך קבוצה, 77% מהאמריקנים בחרו את העט החריג (בצבע אחר), ורק 31% מהאסיינים.<br>
<b>שני דיוקים:</b> החלוקה פשטנית, יש הבדלים בתוך כל תרבות. ותרבויות רבות נעשות <b>אינדיווידואליסטיות</b> יותר עם הזמן. למשל, בארה״ב שיעור התינוקות שקיבלו שם נפוץ ירד מכ־20% לכ־9%: הורים רוצים שהילד יהיה ״ייחודי״.</div>

<h3>4. הכרת העצמי: כמה אנחנו באמת מכירים את עצמנו?</h3>
<p>זה החלק שמסביר את משפט הפתיחה. נדמה לנו שאנחנו מכירים את עצמנו הכי טוב, אבל המחקר מראה שבכמה תחומים חשובים, לא.</p>
<div class="ex"><b>1. אנחנו טועים בהסבר של ההתנהגות שלנו.</b> כשהסיבות סמויות, אנחנו ״ממציאים״ הסבר שנשמע הגיוני. <b>דוגמה:</b> אנשים בטוחים ש״יום שני״ משפיע על מצב הרוח שלהם, אבל כשמודדים מצב רוח לאורך זמן, ההשפעה כמעט לא קיימת.<br>
<b>2. אנחנו לא טובים בניבוי ההתנהגות שלנו.</b> 90% אמרו שיצביעו בבחירות, ורק 69% הצביעו. <b>שותפים לדירה</b> ניבאו טוב יותר מהסטודנטים עצמם אם הקשר הרומנטי שלהם ימשיך. גם <b>כשל התכנון</b>: אנחנו בטוחים שנסיים עבודה מהר יותר ממה שבאמת קורה.<br>
<b>3. אנחנו לא טובים בניבוי הרגשות שלנו.</b><br>
• <b>הטיית ההשפעה</b> = מפריזים ב<b>משך</b> ההשפעה הרגשית של אירוע. <b>דוגמה:</b> ״אם אפרד ממנו, אהיה אומללה שנה״. בפועל מתאוששים מהר יותר. הסיבה: חושבים רק על האירוע, ושוכחים ״את כל השאר״ שיקרה בחיים.<br>
• <b>הזנחת החיסוניות</b> = מזלזלים ב״מערכת החיסון הפסיכולוגית״ שלנו, ביכולת להתמודד ולמצוא משמעות.</div>
<div class="ex"><b>4. יש לנו ״שתי מערכות״ (וילסון):</b> עמדות <b>חבויות</b> (אוטומטיות) ועמדות <b>גלויות</b> (מודעות), והן לא תמיד מתאימות. <b>ניסוי:</b> אנשים שהתבקשו לפרט <b>למה</b> הם מאושרים בקשר שלהם, ניבאו <b>פחות</b> טוב אם הקשר יימשך. החיפוש אחר סיבות ״דרס״ את התחושה האמיתית.<br>
<b>המסקנה החשובה של הספר:</b> <b>דיווח עצמי</b> (שאלונים, ״למה עשית את זה?״) אינו תמיד אמין.</div>

<h3>5. הערכה עצמית: כמה אני שווה?</h3>
<p>עד עכשיו דיברנו על <b>מי</b> אני. עכשיו על <b>כמה אני שווה</b> בעיני עצמי. ההנחה הנפוצה היא ״כמה שיותר, יותר טוב״. הספר מראה שזה מורכב יותר.</p>
<div class="ex"><b>האם הערכה עצמית גבוהה גורמת להצלחה?</b> לא בדיוק. הערכה עצמית <b>כללית</b> כמעט לא מנבאת הישגים. מה שמנבא הוא מושג עצמי <b>ספציפי</b> לתחום (״אני טוב במתמטיקה״ מנבא ציונים במתמטיקה).<br>
<b>איזה שבח עוזר?</b> שבח <b>ספציפי ואמיתי</b>, על משהו שבאמת נעשה. <b>ניסוי:</b> סטודנטים חלשים שקיבלו מסרים כלליים לחיזוק ההערכה העצמית (״זקפו את הראש״) קיבלו ציונים <b>נמוכים</b> יותר.</div>
<div class="ex"><b>מה מניע את הצורך בהערכה עצמית?</b><br>
• <b>טסר:</b> אנחנו מתאמצים לשמור על הערכה עצמית, ולכן הצלחה של מישהו קרוב, בתחום שחשוב לנו, מאיימת במיוחד. <b>דוגמה:</b> אח צעיר שמצליח יותר במקצוע של האח הגדול.<br>
• <b>לירי:</b> ההערכה העצמית היא <b>״סוציומטר״</b>, מד שמתריע מפני דחייה חברתית. כשמרגישים דחויים, היא יורדת, כמו נורה אדומה ברכב.</div>
<div class="ex"><b>הצד האפל:</b><br>
• הקשר בין הערכה עצמית <b>נמוכה</b> לבעיות (עישון, אלימות) נעלם כשמנטרלים גורמים מהילדות, כמו עוני או התעללות. כלומר ההערכה העצמית אולי לא ה<b>סיבה</b>.<br>
• <b>נרקיסיזם</b> = הערכה עצמית מנופחת, עם צורך בהערצה וחוסר אמפתיה. הכי <b>תוקפניים</b> הם אנשים עם נרקיסיזם <b>וגם</b> הערכה עצמית גבוהה, כשפוגעים באגו שלהם. בניגוד לדעה הרווחת, הם <b>לא</b> שונאים את עצמם בפנים. והנרקיסיזם עלה בדורות האחרונים.</div>
<div class="ex"><b>מה עדיף, לפי קרוקר:</b> הערכה עצמית <b>בטוחה</b>, שנשענת על מי שאני מבפנים, עדיפה על הערכה עצמית <b>שבירה</b>, שתלויה בציונים, מראה או אישור של אחרים. <b>אצל מאיה:</b> אם הערך שלה תלוי בציון, כל מבחן הוא איום. אם הוא נשען על ערכים פנימיים, היא יכולה ללמוד מכישלון.<br>
<b>הקשר לסוציומטר:</b> לפי הספר, אנשים עם הערכה עצמית <b>נמוכה</b> נוטים לפרש מצבים כ<b>דחייה</b>, גם כשהם לא.</div>

<h3>6. שליטה עצמית נתפסת: כמה אני שולט בחיי?</h3>
<p>מעבר ל״מי אני״ ו״כמה אני שווה״, יש עוד שאלה: האם אני <b>מסוגל</b> להשפיע על מה שקורה לי? התשובה משפיעה מאוד על ההתנהגות.</p>
<div class="ex"><b>שליטה עצמית היא כמו שריר:</b> היא <b>מתרוקנת</b> אחרי שימוש (אחרי שהתאפקנו מעוגיות, מוותרים מהר יותר על חידה), מתחדשת במנוחה, ו<b>מתחזקת</b> באימון.</div>
<div class="ex"><b>יעילות עצמית</b> (בנדורה) = ״<b>אני מסוגל</b> לעשות את זה״. היא שונה מהערכה עצמית:<br>
<b>הערכה עצמית</b> = ״אני שווה״ (כללי). <b>יעילות עצמית</b> = ״אני יכול להצליח במשימה הזו״ (ספציפי).<br>
<b>דוגמה:</b> אפשר להרגיש אדם ראוי (הערכה עצמית גבוהה) ובכל זאת להיות בטוח שלא תצליחי בסטטיסטיקה (יעילות עצמית נמוכה).<br>
<b>מה בונה יעילות עצמית?</b> בעיקר <b>הצלחות</b> אמיתיות. ולכן הספר ממליץ <b>לשבח מאמץ</b> (״עבדת קשה״), לא פיקחות (״אתה כל כך חכם״). מי ששובח על פיקחות נמנע מאתגרים, כדי לא ״להיראות טיפש״.</div>
<div class="tw"><table><tr><th>מושג</th><th>מה זה</th><th>דוגמה</th></tr>
<tr><td><b>מקור שליטה</b> (רוטר)</td><td><b>פנימי</b>: ״מה שקורה לי תלוי בי״. <b>חיצוני</b>: ״זה תלוי במזל ובאחרים״</td><td>״קיבלתי עבודה כי התכוננתי״ מול ״כי היה לי מזל״</td></tr>
<tr><td><b>חוסר אונים נרכש</b> (סליגמן)</td><td>אחרי חוויות חוזרות של חוסר שליטה, מפסיקים לנסות, גם כשכבר אפשר</td><td>כלבים שלא יכלו לברוח מהלם, לא ניסו לברוח גם כשהיה אפשר</td></tr>
<tr><td><b>לנגר ורודין</b></td><td>תחושת שליטה משפרת מצב</td><td>בבית אבות, דיירים שקיבלו בחירה ואחריות (צמח לטפל בו) היו פעילים ומאושרים יותר</td></tr></table></div>
<div class="ex"><b>אבל: עודף בחירה.</b> שליטה טובה, אבל <b>יותר מדי</b> אפשרויות פוגעות. אנשים שבחרו ריבה מתוך 30 סוגים היו <b>פחות</b> מרוצים (וקנו פחות) מאלה שבחרו מתוך 6. בחירה מעייפת, והחלטה <b>סופית</b> (שאי אפשר להחליף) משאירה יותר שביעות רצון.</div>

<h3>7. ההטיה לטובת העצמי</h3>
<p>אחרי שראינו כמה חשוב לנו להרגיש טוב עם עצמנו, הספר מראה איך אנחנו ״דואגים״ לזה: אנחנו רואים את עצמנו באור חיובי יותר מהמציאות. זו <b>ההטיה לטובת העצמי</b>, אחד הממצאים החזקים בפסיכולוגיה החברתית.</p>
<div class="tw"><table><tr><th>צורה</th><th>מה זה</th><th>דוגמה</th></tr>
<tr><td><b>ייחוס לטובת העצמי</b></td><td>הצלחה = בזכותי. כישלון = בגלל הנסיבות</td><td>״קיבלתי 95 כי אני חכמה. קיבלתי 60 כי המבחן לא הוגן״</td></tr>
<tr><td><b>טובים מהממוצע</b></td><td>רובנו חושבים שאנחנו מעל הממוצע</td><td>בעלים העריכו שהם עושים 42% מעבודות הבית, נשים 33%; בפועל 39%. חזק במיוחד בתכונות שקשה למדוד, כמו ״מוסרי״</td></tr>
<tr><td><b>אופטימיות לא מציאותית</b></td><td>״לי זה לא יקרה״</td><td>מגבירה פגיעות (לא נזהרים). <b>פסימיות הגנתית</b>, לצפות לקושי ולהתכונן, עוזרת</td></tr>
<tr><td><b>קונצנזוס מדומה</b></td><td>על <b>חולשות ודעות</b>: ״כולם כמוני״</td><td>״כולם מעתיקים במבחנים״</td></tr>
<tr><td><b>ייחודיות מדומה</b></td><td>על <b>מעלות ויכולות</b>: ״מעטים כמוני״</td><td>״מעטים מתנדבים כמו שאני מתנדבת״</td></tr></table></div>
<div class="ex"><b>טריק לזכור:</b> על דברים <b>רעים</b> אומרים ״כולם כאלה״ (קונצנזוס), ועל דברים <b>טובים</b> אומרים ״רק אני כזה״ (ייחודיות). שתיהן משאירות אותנו טובים.<br>
<b>מאיפה ההטיה באה?</b> משני מקורות: <b>עיבוד מידע</b> (אנחנו יודעים יותר על המאמצים שלנו) ו<b>מוטיבציה</b> (רוצים להרגיש טוב).<br>
<b>האם היא טובה או רעה? שתיהן.</b><br>
• <b>מסייעת:</b> מגינה מדיכאון, ומפחיתה חרדה מפני המוות.<br>
• <b>מזיקה:</b> ״מרעילה״ עבודת צוות (כל אחד חושב שתרם יותר), יוצרת <b>״כתם עיוור״</b> (רואים הטיות אצל אחרים ולא אצלנו), ובקבוצה הופכת ל<b>הטיה לטובת הקבוצה</b> (״אנחנו הטובים״).</div>

<h3>8. הצגת העצמי</h3>
<p>החלק האחרון עובר מ״איך אני רואה את עצמי״ ל״איך אני <b>מציג</b> את עצמי לאחרים״. גם כאן המטרה היא לשמור על תדמית חיובית.</p>
<div class="ex"><b>חבלה עצמית</b> = יוצרים לעצמנו מכשול <b>מראש</b>, כדי שיהיה תירוץ אם נכשל.<br>
<b>הניסוי (ברגלס וג׳ונס):</b> משתתפים שלא היו בטוחים שיצליחו במבחן בחרו לקחת לפני המבחן ״תרופה שפוגעת בביצוע״. כך, אם ייכשלו, ״זו התרופה״.<br>
<b>אצל מאיה:</b> היא יוצאת למסיבה ערב לפני המבחן. אם תיכשל: ״לא ישנתי״. אם תצליח: ״הצלחתי גם בלי לישון!״. בכל מקרה ההערכה העצמית מוגנת, אבל הסיכוי להצליח קטן.</div>
<div class="ex"><b>הצגת העצמי</b> = הרצון להציג תדמית רצויה, גם לקהל <b>חיצוני</b> (אחרים) וגם ל<b>פנימי</b> (לעצמנו). המטרה: להיראות טוב, אבל <b>לא טוב מדי</b>, כי זה נראה כמו התרברבות.<br>
<b>הצטנעות מדומה</b> = מציגים את עצמנו פחות טוב ממה שאנחנו באמת מרגישים. ״אה, זה היה סתם מזל״.<br>
<b>ניטור עצמי:</b><br>
• <b>גבוה</b> = ״זיקית חברתית״: שם לב לסביבה ומשנה התנהגות בהתאם.<br>
• <b>נמוך</b> = אומר ועושה מה שהוא חושב, בלי קשר לקהל.</div>
<div class="ex"><b>הסיום של הספר: ״שתי אמיתות״.</b> מצד אחד, <b>יעילות עצמית</b> ותחושת שליטה עוזרות לנו להתמודד ולהצליח. מצד שני, <b>גאווה</b> וההטיה לטובת העצמי עלולות לעוור אותנו. צריך גם להאמין בעצמנו, וגם להיזהר מלהאמין יותר מדי.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. אנחנו מפריזים בכמה אחרים שמים לב אלינו (<b>אפקט הזרקור</b>) ורואים את הרגשות שלנו (<b>אשליית השקיפות</b>).<br>
2. <b>מושג העצמי</b> נבנה מסכמות, עצמי אפשרי, תפקידים, השוואה חברתית ושיפוטי אחרים, והוא תלוי ב<b>תרבות</b> (עצמאי מול מקושר).<br>
3. אנחנו מכירים את עצמנו <b>פחות</b> ממה שנדמה: טועים בהסבר ובניבוי של ההתנהגות והרגשות שלנו, ולכן <b>דיווח עצמי</b> לא תמיד אמין.<br>
4. <b>הערכה עצמית</b> בטוחה טובה, אבל יש לה צד אפל (נרקיסיזם). <b>יעילות עצמית</b> ומקור שליטה פנימי עוזרים, אבל עודף בחירה פוגע.<br>
5. <b>ההטיה לטובת העצמי</b> ו<b>הצגת העצמי</b> שומרות על תדמית חיובית, ויש להן גם מחיר.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לזהות אפקט הזרקור או אשליית השקיפות בדוגמה, ולהבחין ביניהם.<br>
• להבחין בין מושג עצמי, הערכה עצמית ויעילות עצמית.<br>
• להשוות עצמי עצמאי ומקושר.<br>
• להסביר הטיית ההשפעה, הזנחת החיסוניות, ולמה דיווח עצמי לא אמין.<br>
• להסביר את הצד האפל של הערכה עצמית, ואת ההבדל בין בטוחה לשבירה.<br>
• להסביר מקור שליטה, חוסר אונים נרכש ועודף בחירה.<br>
• לזהות כל צורה של ההטיה לטובת העצמי, ובמיוחד קונצנזוס מול ייחודיות מדומה.<br>
• לזהות חבלה עצמית, הצטנעות מדומה וניטור עצמי.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>מושג עצמי</b> (מי אני) ≠ <b>הערכה עצמית</b> (כמה אני שווה) ≠ <b>יעילות עצמית</b> (אני מסוגל).</li>
<li><b>קונצנזוס מדומה</b> = חולשות; <b>ייחודיות מדומה</b> = מעלות.</li>
<li><b>הכי תוקפניים</b>: נרקיסיזם <b>וגם</b> הערכה עצמית גבוהה.</li>
<li><b>הטיית ההשפעה</b>: מפריזים במשך ההשפעה, לא ממעיטים.</li>
<li><b>בתרבות המקושרת</b> מתמידים אחרי <b>כישלון</b>.</li>
<li><b>שותפים לדירה</b> מנבאים אותנו טוב יותר מאיתנו.</li>
<li><b>שבחו מאמץ</b>, לא פיקחות.</li>
<li><b>יותר בחירה</b> לא תמיד יותר שביעות רצון.</li>
<li><b>אפקט הזרקור</b> = מה שרואים עלינו. <b>אשליית השקיפות</b> = מה שמרגישים בפנים.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
