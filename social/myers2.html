const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"למה אנחנו מסבירים התנהגות",blocks:[
  {h:"נועה בשבוע הראשון, ותאוריית הייחוס",html:`${def("על מה הנושא",`למה אנחנו כל הזמן מחפשים סיבות להתנהגות של אחרים, ואיך ההסבר משנה את השיפוט.<br><b>מה נלמד כאן:</b> נועה · תאוריית הייחוס · ייחוס פנימי וחיצוני · הסברים בזוגיות`)}${ex("<b>נועה</b> (דמות בדויה להמחשה) מתחילה שנה א׳. בשבוע הראשון שותפה לדירה לא אומר לה שלום, מרצה אחד נראה לה ״נוקשה ומוזר״, ובמסיבת הפתיחה כולם נראים לה רגועים חוץ ממנה. בכל מצב נועה שואלת את עצמה <b>למה</b>. נלווה אותה לאורך הלומדה.")}${def("תאוריית הייחוס",`${E("Attribution theory")} מתארת איך אנשים מסבירים את התנהגות הזולת: האם הסיבה <b>בתוך</b> האדם או <b>מחוצה לו</b>. חלוץ התחום: <b>פריץ היידר</b> (1958).`)}<div class="tw"><table><tr><th>סוג</th><th>הסיבה נמצאת ב...</th><th>אצל נועה</th></tr><tr><td><b>ייחוס פנימי</b></td><td>תכונות, מזג, עמדות</td><td>״השותף פשוט לא נחמד״</td></tr><tr><td><b>ייחוס חיצוני</b></td><td>המצב, הנסיבות</td><td>״הוא מיהר למבחן״</td></tr></table></div>`,q:"q1"},
  {h:"ההסבר קובע את השיפוט",html:`<p>ההסבר יקבע אם שפיכות דמים היא רצח או הגנה עצמית, ואם חסר בית ״חסר יזמה״ או ״קרבן פיטורים״. אנחנו מחפשים הסברים בעיקר כשקורה משהו <b>שלילי או לא צפוי</b>.</p>${tiles([["people","זוגות מאושרים","מייחסים מעשה שלילי ל<b>מצב</b>: ״איחרה כי היו פקקים״","בזוגות מאושרים, כשבן הזוג עושה משהו שלילי, מסבירים את זה בנסיבות. כך הקשר נשמר.","נועה מחכה לבן הזוג שאיחר, ואומרת לעצמה ״בטח היו פקקים״."],["x","זוגות לא מאושרים","מייחסים אותו ל<b>אופי</b>: ״איחרה כי לא אכפת לה ממני״","בזוגות לא מאושרים, את אותו מעשה מסבירים באופי של בן הזוג. ההסבר הזה מחמיר את הכעס ופוגע בקשר.","בזוגיות במשבר, אותו איחור מתפרש כ״לא אכפת לו ממני״."]])}${def("ייחוס מוטעה",`${E("Misattribution")} ייחוס התנהגות לסיבה הלא נכונה. מחקרים חוזרים: גברים נוטים יותר מנשים לפרש ידידותיות של אישה כ<b>עניין מיני</b>. זה בולט במיוחד כשלגבר יש <b>עמדת כוח</b>, ועלול לתרום להטרדה מינית.`)}`,q:"q3"}
 ]},
 {id:"t2",icon:"id",title:"הסקת תכונות",blocks:[
  {h:"התנהגות יוצאת דופן מלמדת יותר",html:`${def("על מה הנושא",`איך ומתי אנחנו מסיקים מהתנהגות של מישהו על האופי שלו.<br><b>מה נלמד כאן:</b> הסקת התכונה המתאימה · התנהגות צפויה מול חריגה · הסקה ספונטנית`)}${def("תאוריית הסקת התכונה המתאימה",`<b>ג׳ונס ודייוויס</b> (1965) פירטו מתי אנחנו מסיקים מהתנהגות על תכונה. אחד התנאים: התנהגות <b>צפויה או נורמטיבית</b> מלמדת מעט על האדם; התנהגות <b>יוצאת דופן</b> מלמדת הרבה.`)}${ex("אם סימה סרקסטית ב<b>ריאיון עבודה</b>, שבו כולם משתדלים להיות נחמדים, נסיק עליה הרבה. אם היא סרקסטית עם <b>אחיה</b>, נסיק פחות, כי זה נפוץ. כך גם אצל נועה: מרצה שמחייך בשיעור הראשון לא מלמד אותה הרבה; מרצה שצועק על סטודנט כן.")}`,q:"q5"},
  {h:"הסקה ספונטנית",html:`${def("הסקת תכונה באופן ספונטני",`${E("Spontaneous trait inference")} אנחנו מסיקים על תכונות <b>אוטומטית, בלי כוונה ובלי מאמץ</b>.`)}<p>סטודנטים שזכרו את המשפט ״הספרנית נשאה את מצרכיה של הזקנה אל מעבר לכביש״ נזכרו בו הכי טוב עם הרמז <b>״מסייעת״</b>, לא ״ספרים״ ולא ״סלים״. הם הסיקו את התכונה בלי לשים לב. די לראות פנים של אדם <b>עשירית שנייה</b> כדי להסיק על אישיותו.</p>${rem("הסקה ספונטנית היא חלק מהחשיבה האוטומטית: מהירה, אבל לא תמיד נכונה.")}`,q:"q7"}
 ]},
 {id:"t3",icon:"split",title:"המודל של קלי",blocks:[
  {h:"שלושה קריטריונים",html:`${def("על מה הנושא",`איך אנחנו מחליטים בין ייחוס פנימי לחיצוני, לפי הרולד קלי (1973).<br><b>מה נלמד כאן:</b> עקביות · ייחודיות · קונצנזוס`)}<div class="tw"><table><tr><th>קריטריון</th><th>השאלה</th></tr><tr><td><b>עקביות</b></td><td>האם האדם מתנהג כך <b>לעתים קרובות</b> במצב הזה?</td></tr><tr><td><b>ייחודיות</b></td><td>האם הוא מתנהג כך <b>רק</b> במצב הזה, ולא באחרים?</td></tr><tr><td><b>קונצנזוס</b></td><td>האם <b>גם אחרים</b> מתנהגים כך במצב הזה?</td></tr></table></div>${fig("kelley43","אנחנו מחפשים סיבה רק כשהעקביות גבוהה. אז הייחודיות והקונצנזוס מכריעים.")}`,q:"q9"},
  {h:"איך זה עובד בפועל",html:`${ex("מרים מבקרת את יורם <b>שוב ושוב</b> (עקביות גבוהה). אם <b>גם אחרים</b> מבקרים אותו (קונצנזוס גבוה) ומרים מבקרת <b>רק אותו</b> (ייחודיות גבוהה): ייחוס <b>חיצוני</b>, משהו ביורם או במצב. אם <b>רק מרים</b> מבקרת אותו (קונצנזוס נמוך) והיא מבקרת <b>את כולם</b> (ייחודיות נמוכה): ייחוס <b>פנימי</b>, זו מרים.")}${ex("נועה רואה סטודנטית נרדמת בשיעור סטטיסטיקה. אם היא נרדמת <b>בכל השיעורים</b> (ייחודיות נמוכה) ורק היא נרדמת (קונצנזוס נמוך), נועה תסיק ״היא עייפה תמיד״. אם <b>כל הכיתה</b> נרדמת רק <b>בשיעור הזה</b>, הסיבה היא השיעור.")}${rem("ייחודיות וקונצנזוס <b>גבוהים</b> = ייחוס <b>חיצוני</b>. נמוכים = <b>פנימי</b>.")}`,q:"q11"}
 ]},
 {id:"t4",icon:"target",title:"טעות הייחוס הבסיסית",blocks:[
  {h:"ממעיטים בכוח המצב",html:`${def("על מה הנושא",`ההטיה המרכזית בהסברים שלנו להתנהגות של אחרים.<br><b>מה נלמד כאן:</b> הגדרה · ג׳ונס והריס · ניסוי החידון של רוס · דוגמאות`)}${def("טעות הייחוס הבסיסית",`${E("Fundamental attribution error")} הנטייה של צופים <b>להמעיט</b> בהשפעת הסיטואציה על התנהגות של אחרים, ו<b>להפריז</b> בהשפעת התכונות והעמדות שלהם (רוס, 1977). נקראת גם <b>הטיית ההתאמה</b>.`)}<p>מאיירס לימד אותו נושא ב־8:30 בבוקר וב־19:00 בערב: בבוקר שתיקה, בערב חגיגה. ההבדל בין המצבים היה גדול מההבדלים בין האנשים, ובכל זאת התפתה לחשוב שבערב פשוט באו ״טיפוסים מוחצנים״.</p>${ex("סינדרלה מהפרק הראשון: מי שרואה אותה בבית מסיק ״נערה כנועה״, ומתעלם מהאם החורגת.")}`,q:"q13"},
  {h:"הנאומים על קסטרו",html:`<p><b>ג׳ונס והריס</b> (1967) נתנו לסטודנטים לקרוא נאומים בעד או נגד פידל קסטרו. כשנאמר להם שהנואם <b>בחר</b> בעמדה, הם הסיקו שזו עמדתו. אבל גם כשנאמר להם ש<b>המנחה הכתיב</b> את העמדה, הם <b>עדיין</b> הסיקו שהנואם באמת מאמין בה.</p>${rem("גם כשאנחנו <b>יודעים</b> שהמצב קבע את ההתנהגות, אנחנו עדיין מייחסים אותה לאדם.")}<p>זה קורה אפילו כשאנחנו עצמנו יוצרים את המצב: מי שהתבקש להצטנע בשיחה גרם לבן זוגו להצטנע גם, ואז הסיק שלבן הזוג יש ״הערכה עצמית נמוכה״.</p>`,q:"q15"},
  {h:"ניסוי החידון",html:`<p><b>רוס ועמיתיו</b> (1977) חילקו סטודנטים <b>באקראי</b> לשואלים, מתחרים וצופים. השואלים חיברו שאלות קשות מתחום ההתמחות שלהם. כולם ידעו שלשואלים יש יתרון, ובכל זאת <b>המתחרים והצופים</b> (לא השואלים) דירגו את השואלים כידענים הרבה יותר.</p>${tiles([["grad","בחיים","סטודנטים מפריזים בידע של מרצים, ורופאים נתפסים כמומחים גם בנושאים שאינם רפואה"],["brain","מי טועה יותר?","דווקא אנשים <b>אינטליגנטיים</b> ובעלי כישורים חברתיים נוטים יותר לטעות הזו"]])}${ex("במסיבת הפתיחה נועה בטוחה שכולם רגועים ורק היא מתוחה. בפועל כולם מתוחים, וכל אחד עושה אותה טעות לגבי האחרים.")}`,q:"q17"}
 ]},
 {id:"t5",icon:"bulb",title:"למה אנחנו טועים",blocks:[
  {h:"נקודת מבט: מבצע מול צופה",html:`${def("על מה הנושא",`חמישה גורמים שמסבירים את טעות הייחוס, ומה היא גורמת.<br><b>מה נלמד כאן:</b> מבצע וצופה · מצלמה · זמן · מודעות עצמית · תרבות · השלכות`)}${def("אפקט הצופה",`כשאנחנו <b>פועלים</b>, הקשב שלנו מופנה ל<b>סביבה</b>. כשאנחנו <b>צופים</b> במישהו, הקשב מופנה <b>אליו</b>, והסביבה ״נעלמת״ ברקע (ג׳ונס וניסבט).`)}<p>אבל ניתוח של <b>173 מחקרים</b> (מאלה, 2006) הראה שההבדל לא תמיד גדול: על מעשים <b>טובים</b> שלנו אנחנו עושים ייחוס פנימי בדיוק כמו צופה. רק על התנהגות <b>שלילית</b> שלנו אנחנו מייחסים למצב.</p>${ex("בתחנת דלק נראה לנו שהאישה שחוסמת את המשאבה ״חסרת התחשבות״. היא עצמה יודעת שהגיעה כשהמשאבה הראשונה הייתה תפוסה.")}`,q:"q19"},
  {h:"מצלמה, זמן ומודעות עצמית",html:`<div class="tw"><table><tr><th>גורם</th><th>הממצא</th></tr><tr><td><b>זווית המצלמה</b></td><td>הודאה בחקירה שצולמה כשהמצלמה על <b>החשוד</b> נתפסה כנה; כשהמצלמה על <b>החוקר</b>, כפויה (לסיטר). ניו זילנד מחייבת לצלם את שניהם מהצד</td></tr><tr><td><b>הזמן</b></td><td>אחרי <b>שבוע</b> צופים נותנים יותר משקל למצב. יום אחרי בחירות ייחסו את התוצאה למועמדים; שנה אחרי, רק שליש</td></tr><tr><td><b>״האני הקודם״</b></td><td>על עצמנו לפני 5 שנים אנחנו עושים ייחוס פנימי, כאילו זה אדם אחר</td></tr><tr><td><b>מודעות עצמית</b></td><td>מראה, הקלטה או ״שמיעת פעימות הלב״ מפנים את הקשב פנימה, ואז מייחסים <b>לעצמנו</b> יותר אחריות</td></tr></table></div>${rem("אנחנו מוצאים סיבות <b>במקום שבו אנחנו מחפשים אותן</b>. לכן אנחנו רואים את עצמנו ״תלויי מצב״ ואת האחרים ״כאלה וכאלה״.")}`,q:"q21"},
  {h:"תרבות, והשלכות",html:`${def("תרבות",`התרבות ה<b>מערבית</b> מעדיפה הסברים פנימיים (״אתה יכול!״). בתרבויות <b>מזרח אסיה</b> וקולקטיביסטיות רגישים יותר למצב. הודים־הינדים הציעו יותר הסברים מצביים, אמריקנים יותר הסברים של תכונות (מילר, 1984).`)}${ex("בנו של מאיירס כתב ״The gate caught Tom on his sleeve״ (השער תפס את טום), והמורה סימנה ״טעות״. התשובה ה״נכונה״ שמה את הסיבה אצל טום.")}<p><b>השלכות:</b> מי שמייחס עוני ואבטלה ל<b>תכונות</b> (״הם עצלנים״) תומך פחות בעזרה לעניים. מי שמייחס ל<b>מצב</b> תומך יותר.</p>${rem("למה ללמוד טעויות? כי רובן תוצר לוואי של קיצורי דרך מועילים, כי לא תמיד צריך להאשים אנשים בבעיותיהם, וכי מודעות עוזרת: סטודנטים לפסיכולוגיה מסבירים התנהגות פחות פשטני.")}`,q:"q23"}
 ]},
 {id:"t6",icon:"cycle",title:"נבואה המגשימה את עצמה",blocks:[
  {h:"אמונה שיוצרת מציאות",html:`${def("על מה הנושא",`איך הציפיות שלנו משנות את ההתנהגות של אחרים.<br><b>מה נלמד כאן:</b> מרטון · הבורסה · הטיית הנסיין · ציפיות מורים · ציפיות תלמידים`)}${def("נבואה המגשימה את עצמה",`${E("Self-fulfilling prophecy")} אמונה שגורמת לנו להתנהג כך שהיא מתממשת (הסוציולוג <b>רוברט מרטון</b>, 1948).`)}${tiles([["building","בנק","לקוחות שחושבים שהבנק יתמוטט מושכים את כספם, והבנק באמת מתמוטט","זו נבואה שמגשימה את עצמה: האמונה עצמה גורמת להתנהגות שמביאה בדיוק את התוצאה שחששו ממנה. הבנק לא היה בבעיה עד שכולם האמינו שהוא בבעיה.","שמועה בווטסאפ שסניף ״עומד לקרוס״ גורמת לעשרות לקוחות למשוך כסף באותו יום, ואז הסניף באמת לא יכול לשלם לכולם."],["chart","בורסה","גרנוויל כתב ״מכרו מחר״ (1981), ו־7 בינואר היה יום המסחר העמוס ביותר עד אז"]])}${fig("sfp43","הציפייה משנה את ההתנהגות שלי, וההתנהגות שלי משנה את שלה.")}`,q:"q25"},
  {h:"הטיית הנסיין וציפיות מורים",html:`<p><b>רוזנטל</b>: נסיינים שציפו שמשתתפים ידרגו פנים בתמונות כ״מצליחים״ קיבלו דירוגים גבוהים יותר, עם אותן הוראות ואותן תמונות.</p>${def("רוזנטל וג׳ייקובסון (1968)",`בבית ספר יסודי בסן פרנסיסקו נבחרו ילדים <b>באקראי</b>, ולמורים נאמר שהם ״על סף פריצה אינטלקטואלית״. ציוני המשכל שלהם עלו.`)}${rem("אבל האפקט פחות חזק ממה שחשבו: רק כ־<b>40%</b> מכ־500 הניסויים מצאו אותו. ברוב המקרים ציפיות המורים פשוט <b>מדויקות</b> (ג׳סים). מחקר על 4,300 תלמידים מצא השפעה בשני הכיוונים.")}<p><b>איך מועברות ציפיות?</b> המורה מביטה יותר, מחייכת, מהנהנת, מלמדת יותר חומר, מציבה יעדים קשים, ונותנת יותר זמן לענות. די ב<b>10 שניות</b> של וידאו כדי לזהות על איזה תלמיד המורה מדברת.</p>`,q:"q27"},
  {h:"גם התלמידים משפיעים",html:`<p>סטודנטים שנאמר להם שהמרצה <b>מצוין</b> תפסו אותו כמעניין יותר, ו<b>למדו יותר</b>. מורים שתלמידים העבירו להם ציפיות חיוביות לימדו טוב יותר לפי צופים בלתי תלויים. בתיכון באונטריו, כיתות ששמעו שהמורה החדשה מצוינת הקשיבו יותר וקיבלו ציונים טובים יותר.</p>${ex("נועה שמעה ש״ד״ר לוי משעמם״. אם תיכנס לשיעור עם הציפייה הזו, היא תקשיב פחות, תשאל פחות, וייתכן שגם ד״ר לוי ילמד בפחות התלהבות.")}`,q:"q29"}
 ]},
 {id:"t7",icon:"link",title:"אישור התנהגותי, ומסקנות",blocks:[
  {h:"אנחנו מקבלים מה שציפינו",html:`${def("על מה הנושא",`איך ציפיות פועלות ביחסים יומיומיים, ומה הלקח הכללי של הפרק.<br><b>מה נלמד כאן:</b> אישור התנהגותי · סניידר · זוגיות · ילדים · מסקנות`)}${def("אישור התנהגותי",`${E("Behavioral confirmation")} סוג של נבואה המגשימה את עצמה: הציפיות שלנו גורמות לאחר להתנהג כך שהוא <b>מאשר</b> אותן (סניידר).`)}<p><b>הניסוי הקלסי</b>: גברים שוחחו בטלפון עם אישה שלדעתם הייתה <b>מושכת</b> או לא, לפי תמונה. ה״מושכות״ דיברו בחום רב יותר, כי הגברים דיברו אליהן אחרת.</p>${tiles([["x","עוינות","במשחקים, מי שחושב שהיריב לא ישתף פעולה גורם לו לא לשתף פעולה","כשאני בטוח שהצד השני לא ישתף פעולה, אני מתנהג בחשדנות, וזה בדיוק גורם לו לא לשתף פעולה. זו נבואה שמגשימה את עצמה.","נועה בטוחה ששותפה לעבודה ״יעבוד לבד״, ולכן לא משתפת אותו במידע. בתגובה הוא באמת מתחיל לעבוד לבד."],["people","זוגיות","אידאליזציה של בן הזוג מפחיתה קונפליקטים; מי שחושש שלא אוהבים אותו מתרחק"]])}`,q:"q31"},
  {h:"ילדים, ומה לומדים מכל זה",html:`${ex("בכיתה אחת <b>שכנעו</b> את הילדים לשמור על ניקיון: השלכת אשפה לפח עלתה מ־15% ל־45%, <b>זמנית</b>. בכיתה אחרת אמרו לילדים שוב ושוב שהם <b>נקיים ומסודרים</b>: עלייה ל־<b>80%</b>. תגידו לילדים שהם חרוצים, והם עשויים להתנהג בהתאם.")}<ul><li>אין מתאם בין <b>מנת משכל</b> לבין הנטייה להטיות חשיבה.</li><li><b>הרברט סיימון</b>: אנחנו מפשטים את המציאות בעזרת <b>היריסטיקות</b>. הן מכשילות לפעמים, אבל מאפשרות שיפוט מהיר.</li><li><b>ניסבט ורוס</b>: אפשר ללמד אנשים לטעות פחות, בעזרת תרגול, סטטיסטיקה ליומיום ודוגמאות חיות.</li></ul>${rem("פסיכולוגיה חברתית מאוזנת מעריכה גם את <b>הכוחות</b> וגם את <b>החולשות</b> של החשיבה החברתית: ״ביקורתיים אך לא ציניים״.")}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"במה עוסקת תאוריית הייחוס?","a":"איך אנחנו מסבירים את ההתנהגות של אחרים","w":["איך אנחנו זוכרים פרטים על אנשים שפגשנו","איך אנחנו משכנעים אחרים לשנות את דעתם","איך קבוצות מקבלות החלטות משותפות"],"e":"תאוריית הייחוס שואלת אם אנחנו מסבירים התנהגות בסיבה פנימית (האדם) או חיצונית (המצב)."},{"q":"מי נחשב לחלוץ תאוריית הייחוס?","a":"פריץ היידר","w":["רוברט מרטון","הרולד קלי","מרק סניידר"],"e":"היידר (1958) ניתח איך אנשים מסבירים אירועים יומיומיים. קלי פיתח אחריו מודל מפורט."}]},"q2":{"t":"t1","v":[{"q":"השותף של נועה לא אמר לה שלום, והיא חושבת ״הוא פשוט לא נחמד״. איזה ייחוס זה?","a":"ייחוס פנימי","w":["ייחוס חיצוני","ייחוס מוטעה למצב","קונצנזוס גבוה"],"e":"נועה מייחסת את ההתנהגות לתכונה של השותף, כלומר לסיבה שבתוכו."},{"q":"״הוא לא אמר שלום כי מיהר למבחן״. איזה ייחוס זה?","a":"ייחוס חיצוני","w":["ייחוס פנימי","הסקת תכונה ספונטנית","טעות הייחוס הבסיסית"],"e":"הסיבה נמצאת במצב (המבחן), לא באופי."}]},"q3":{"t":"t1","v":[{"q":"איך זוגות מאושרים מסבירים בדרך כלל מעשה שלילי של בן הזוג?","a":"מייחסים אותו למצב","w":["מייחסים אותו לאופי של בן הזוג","מתעלמים ממנו לגמרי ולא מסבירים","מייחסים אותו לעצמם בלבד"],"e":"״היא איחרה כי היו פקקים״. זוגות לא מאושרים מייחסים לאופי: ״לא אכפת לה ממני״."},{"q":"מתי אנחנו מחפשים הסברים להתנהגות במיוחד?","a":"כשקורה משהו שלילי או לא צפוי","w":["כשקורה משהו חיובי וצפוי מראש","רק כשמבקשים מאיתנו להסביר","כשההתנהגות זהה להתנהגות של כולם"],"e":"אירוע שלילי או מפתיע מעורר את השאלה ״למה?״. לכן זוגות מנתחים עוינות יותר מחיבוק."}]},"q4":{"t":"t1","v":[{"q":"מהו ייחוס מוטעה?","a":"ייחוס התנהגות לסיבה הלא נכונה","w":["ייחוס התנהגות למצב במקום לאדם","שכחה של הסיבה האמיתית להתנהגות","ייחוס של התנהגות טובה לעצמנו"],"e":"דוגמה בפרק: פירוש של ידידותיות כהזמנה מינית."},{"q":"מתי ייחוס מוטעה של ידידותיות כעניין מיני סביר במיוחד?","a":"כשלגבר יש עמדת כוח","w":["כשהאישה מבוגרת ממנו בהרבה","כשהשניים מכירים זמן רב","כשהשיחה מתקיימת בכתב"],"e":"מנהל עשוי לפרש התנהגות ידידותית או כנועה של עובדת כמינית. זה עלול לתרום להטרדה."}]},"q5":{"t":"t2","v":[{"q":"לפי ג׳ונס ודייוויס, איזו התנהגות מלמדת הכי הרבה על האופי?","a":"התנהגות יוצאת דופן במצב","w":["התנהגות צפויה ונורמטיבית במצב","התנהגות שכולם עושים באותו מצב","התנהגות שחוזרת אצל כל בני המשפחה"],"e":"התנהגות צפויה לא מבדילה את האדם מאחרים. התנהגות חריגה כן."},{"q":"סימה סרקסטית בריאיון עבודה. למה זה מלמד עליה יותר מסרקזם כלפי אחיה?","a":"כי בריאיון כולם משתדלים להיות נחמדים","w":["בריאיון אנשים תמיד אומרים את האמת","אחים לא מבינים סרקזם כמו זרים","המראיין מכיר אותה טוב יותר מאחיה"],"e":"סרקזם בין אחים נפוץ. בריאיון הוא יוצא דופן, ולכן מעיד יותר על התכונה."}]},"q6":{"t":"t2","v":[{"q":"מה שם התאוריה של ג׳ונס ודייוויס?","a":"תאוריית הסקת התכונה המתאימה","w":["תאוריית הזהות החברתית של טאג׳פל","תאוריית הנבואה המגשימה את עצמה","תאוריית העיבוד הדואלי של המחשבה"],"e":"היא מפרטת באילו תנאים אנשים מסיקים על תכונות מהתנהגות."}]},"q7":{"t":"t2","v":[{"q":"מהי הסקת תכונה באופן ספונטני?","a":"הסקה אוטומטית, בלי כוונה ובלי מאמץ","w":["הסקה שנעשית רק אחרי היכרות ארוכה","הסקה מכוונת שדורשת מאמץ וריכוז","הסקה שנעשית רק על אנשים קרובים"],"e":"אנחנו מסיקים תכונות מיד, גם בלי לשים לב שעשינו זאת."},{"q":"איזה רמז עזר הכי הרבה לזכור את המשפט על הספרנית שעזרה לזקנה?","a":"״מסייעת״","w":["״ספרים״ (רמז לספרנית)","״סלים״ (רמז למצרכים)","״כביש״ (רמז למקום)"],"e":"הסטודנטים הסיקו את התכונה ״מסייעת״ באופן אוטומטי, ולכן היא שימשה רמז טוב."}]},"q8":{"t":"t2","v":[{"q":"כמה זמן צריך לראות פנים כדי להסיק ספונטנית על אישיות?","a":"עשירית שנייה","w":["דקה שלמה","עשר דקות","שיחה של שעה"],"e":"וויליס וטודורוב: עשירית שנייה מספיקה להסקה ספונטנית."}]},"q9":{"t":"t3","v":[{"q":"מהם שלושת הקריטריונים במודל של קלי?","a":"עקביות, ייחודיות וקונצנזוס","w":["עקביות, אמינות ותוקף פנימי","כוונה, יכולת ומאמץ אישי","פנימי, חיצוני ויציב לאורך זמן"],"e":"שלושתם עוזרים להחליט אם לייחס התנהגות לאדם או למצב."},{"q":"מה בודק הקריטריון ״קונצנזוס״?","a":"אם גם אחרים מתנהגים כך במצב הזה","w":["אם האדם מתנהג כך לעתים קרובות","אם האדם מתנהג כך רק במצב הזה","אם ההתנהגות מתאימה לנורמות"],"e":"קונצנזוס = מה אחרים עושים. עקביות = האם זה חוזר. ייחודיות = רק כאן?"}]},"q10":{"t":"t3","v":[{"q":"מה בודק הקריטריון ״ייחודיות״?","a":"אם האדם מתנהג כך רק במצב הזה ולא באחרים","w":["אם גם אנשים אחרים מתנהגים באותו אופן","אם האדם מתנהג כך שוב ושוב באותו מצב","אם ההתנהגות שונה מהציפיות של הצופים"],"e":"ייחודיות גבוהה = ההתנהגות מופיעה רק במצב הזה."}]},"q11":{"t":"t3","v":[{"q":"מרים מבקרת את יורם שוב ושוב, גם אחרים מבקרים אותו, והיא לא מבקרת אף אחד אחר. מה נסיק?","a":"ייחוס חיצוני: הסיבה אינה במרים","w":["ייחוס פנימי: מרים ביקורתית מטבעה","אי אפשר להסיק כלום בלי עוד מידע","ייחוס פנימי: יורם ביקורתי"],"e":"עקביות גבוהה, קונצנזוס גבוה וייחודיות גבוהה = ייחוס חיצוני."},{"q":"רק מרים מבקרת את יורם, והיא מבקרת גם את כולם. מה נסיק?","a":"ייחוס פנימי: זה האופי של מרים","w":["ייחוס חיצוני: משהו ביורם עצמו","ייחוס חיצוני: המצב ביניהם לחוץ","אין מספיק מידע כדי לבצע ייחוס"],"e":"קונצנזוס נמוך וייחודיות נמוכה = הסיבה במרים."}]},"q12":{"t":"t3","v":[{"q":"סטודנטית נרדמת בכל השיעורים, ורק היא. לאן נייחס את העייפות?","a":"לסיבה פנימית","w":["לסיבה חיצונית","לשיעור המסוים","למרצה"],"e":"ייחודיות נמוכה (בכל השיעורים) וקונצנזוס נמוך (רק היא) = ייחוס פנימי."},{"q":"לפי קלי, מתי אנחנו בכלל מחפשים סיבה להתנהגות?","a":"כשהעקביות גבוהה","w":["כשהקונצנזוס נמוך","כשהייחודיות גבוהה","כשההתנהגות חיובית"],"e":"רק כשההתנהגות חוזרת יש מה להסביר. אז הייחודיות והקונצנזוס מכריעים."}]},"q13":{"t":"t4","v":[{"q":"מהי טעות הייחוס הבסיסית?","a":"המעטה בכוח המצב והפרזה בכוח התכונות","w":["הפרזה בכוח המצב והמעטה בכוח התכונות","ייחוס הצלחות לעצמנו וכישלונות למצב","הנטייה לחשוב שאחרים מסכימים איתנו"],"e":"כשאנחנו מסבירים התנהגות של אחרים, אנחנו מזלזלים בהשפעת הסיטואציה."},{"q":"מה שם נוסף לטעות הייחוס הבסיסית?","a":"הטיית ההתאמה","w":["הטיית האישוש","הטיה בשירות העצמי","אפקט הקונצנזוס המדומה"],"e":"הספר מציין שהיא מכונה גם הטיית ההתאמה."}]},"q14":{"t":"t4","v":[{"q":"מאיירס לימד בבוקר ובערב. מה הייתה הטעות שהתפתה לעשות?","a":"לחשוב שבערב באו אנשים מוחצנים יותר","w":["לחשוב שבבוקר הוא לימד טוב יותר","לחשוב שבערב החומר היה קל יותר","לחשוב ששעת השיעור משפיעה על הדיון"],"e":"הוא ידע ששעת השיעור משפיעה, ובכל זאת נטה לייחס את ההבדל לאנשים."}]},"q15":{"t":"t4","v":[{"q":"מה מצאו ג׳ונס והריס בניסוי הנאומים על קסטרו?","a":"גם כשהעמדה הוכתבה, ייחסו אותה לנואם","w":["כשהעמדה הוכתבה, הבינו שזו לא דעת הנואם","רק נאומים בעד קסטרו ייחסו לנואם","הנבדקים לא האמינו לאף נאום"],"e":"גם כשידעו שהמנחה קבע את העמדה, הסיקו שהנואם באמת מאמין בה."},{"q":"מה הניסוי של ג׳ונס והריס מראה על טעות הייחוס?","a":"היא קורית גם כשיודעים שהמצב קבע","w":["היא קורית רק כשאין מידע על המצב","היא נעלמת כשמסבירים לנבדקים את המצב","היא קורית רק בנושאים פוליטיים"],"e":"הידיעה על אילוץ המצב לא ביטלה את הייחוס לנואם."}]},"q16":{"t":"t4","v":[{"q":"נבדק שהתבקש להצטנע גרם לבן זוגו להצטנע. מה הוא הסיק על בן הזוג?","a":"שיש לו הערכה עצמית נמוכה","w":["שגם הוא קיבל הוראה להצטנע","שהוא מחקה אותו בכוונה","שהוא מתנהג כך בגלל המצב"],"e":"גם כשאנחנו עצמנו יוצרים את המצב, אנחנו מייחסים את התגובה לאופי של האחר."}]},"q17":{"t":"t4","v":[{"q":"בניסוי החידון של רוס, מי דירג את השואלים כידענים יותר?","a":"המתחרים והצופים","w":["רק השואלים עצמם","רק הצופים","אף אחד, כולם הבינו את היתרון"],"e":"השואלים עצמם לא טעו. המתחרים והצופים התעלמו מהיתרון של תפקיד השואל."},{"q":"למה לשואלים בניסוי החידון היה יתרון?","a":"הם בחרו שאלות מתחום ההתמחות שלהם","w":["הם נבחרו לתפקיד כי היו חכמים יותר","הם קיבלו את כל התשובות מראש","הם היו סטודנטים ותיקים ומנוסים יותר"],"e":"התפקידים חולקו באקראי. היתרון נבע מהמצב, לא מהידע."}]},"q18":{"t":"t4","v":[{"q":"מי נוטה יותר לטעות הייחוס הבסיסית?","a":"אנשים אינטליגנטיים ומיומנים חברתית","w":["אנשים בעלי אינטליגנציה חברתית נמוכה","רק ילדים צעירים","אנשים שלמדו פסיכולוגיה"],"e":"מחקר מעקב: ההפך מהצפוי. דווקא הם נוטים יותר לטעות."},{"q":"נועה בטוחה שכולם במסיבה רגועים ורק היא מתוחה. מה קורה באמת?","a":"כולם מתוחים, וכולם עושים אותה טעות","w":["היא היחידה שמתוחה במסיבה","כולם רגועים כי הם מכירים זה את זה","היא צודקת כי היא רואה את כולם"],"e":"כל אחד מייחס לאחרים את הרוגע שהם מציגים, ומתעלם מהמצב."}]},"q19":{"t":"t5","v":[{"q":"לפי אפקט הצופה, לאן מופנה הקשב כשאנחנו צופים במישהו?","a":"אל האדם, והמצב נעלם ברקע","w":["אל המצב, והאדם נעלם ברקע","אל עצמנו ואל הרגשות שלנו","באופן שווה לאדם ולמצב"],"e":"כשאנחנו פועלים, הקשב מופנה לסביבה. כשאנחנו צופים, לאדם."},{"q":"מה הראה הניתוח של 173 מחקרים (מאלה, 2006)?","a":"ההבדל קטן, חוץ מבהתנהגות שלילית","w":["ההבדל בין מבצע לצופה ענק בכל מצב","צופים תמיד עושים ייחוס חיצוני","מבצעים תמיד מייחסים התנהגות לעצמם"],"e":"על מעשים טובים שלנו אנחנו עושים ייחוס פנימי כמו צופה. רק על רעים מייחסים למצב."}]},"q20":{"t":"t5","v":[{"q":"האישה בתחנת הדלק חוסמת משאבה. למה היא ותצפית מבחוץ מסבירות זאת אחרת?","a":"היא רואה את המצב, והצופה רואה רק אותה","w":["היא משקרת כדי להצדיק את עצמה","הצופה יודע עליה יותר ממה שהיא יודעת","שניהם רואים את אותו הדבר בדיוק"],"e":"היא הגיעה כשהמשאבה הראשונה הייתה תפוסה. הצופה לא רואה את זה."}]},"q21":{"t":"t5","v":[{"q":"מה מצא לסיטר על הודאות מצולמות?","a":"כשהמצלמה על החשוד, ההודאה נראית כנה יותר","w":["כשהמצלמה על החוקר, ההודאה נראית כנה יותר","זווית המצלמה לא משנה את השיפוט","הוראות השופט ביטלו את ההשפעה"],"e":"מה שבמוקד הקשב נראה כסיבה. לכן ניו זילנד מחייבת לצלם את שניהם מהצד."},{"q":"מה קורה לייחוס עם הזמן?","a":"נותנים יותר משקל למצב","w":["נותנים יותר משקל לתכונות","הייחוס לא משתנה בכלל","שוכחים את ההתנהגות לגמרי"],"e":"אחרי שבוע צופים נתנו יותר משקל לאילוצים. שנה אחרי בחירות, רק שליש ייחסו את התוצאה למועמדים."}]},"q22":{"t":"t5","v":[{"q":"מה קורה כשמגבירים מודעות עצמית (למשל עם מראה)?","a":"מייחסים לעצמנו יותר אחריות","w":["מייחסים יותר למצב החיצוני","שוכחים את התכונות שלנו","מתנהגים כמו כל האחרים"],"e":"הקשב מופנה פנימה, ורואים את עצמנו כמו שצופה רואה אחרים."},{"q":"למה אנחנו רואים את עצמנו ״רבגוניים״ יותר מאחרים?","a":"אנחנו רואים את עצמנו בהרבה מצבים","w":["אנחנו באמת רבגוניים יותר מאחרים","אחרים מסתירים מאיתנו את הרגשות שלהם","אנחנו מכירים את עצמנו פחות טוב"],"e":"את המרצה רואים רק בכיתה. היא רואה את עצמה בכיתה, בבית ובכנסים."}]},"q23":{"t":"t5","v":[{"q":"באילו תרבויות טעות הייחוס הבסיסית חלשה יותר?","a":"בתרבויות מזרח אסיה וקולקטיביסטיות","w":["בתרבויות מערביות ואינדיבידואליסטיות","בכל התרבויות היא באותה עוצמה","רק בארצות הברית"],"e":"שם רגישים יותר למצב. הודים־הינדים הציעו יותר הסברים מצביים מאמריקנים."},{"q":"מה מלמד הסיפור על ״The gate caught Tom״?","a":"התרבות המערבית מלמדת לשים את הסיבה באדם","w":["ילדים לא מבינים דקדוק עד גיל מאוחר יחסית","המורה טעתה בהבנת המשפט שהילד חיבר","בכל השפות מנסחים סיבתיות באותו אופן בדיוק"],"e":"המורה סימנה טעות כי הסיבה הושמה בשער ולא בטום."}]},"q24":{"t":"t5","v":[{"q":"מה הקשר בין ייחוס לעמדות כלפי עניים?","a":"ייחוס לתכונות = פחות תמיכה בעזרה","w":["ייחוס לתכונות קשור ליותר תמיכה בעזרה","אין קשר בין ייחוס לעמדות פוליטיות","ייחוס למצב קשור לפחות תמיכה בעזרה"],"e":"״הם עצלנים״ מוביל להתנגדות. ״גם אני הייתי מתקשה בתנאים האלה״ מוביל לתמיכה."},{"q":"למה הפרק מתמקד בטעויות חשיבה?","a":"כי לרוב איננו ערים להן","w":["כדי להראות שבני אדם טיפשים","כי אין לחשיבה שלנו שום יתרונות","כדי שנפסיק לסמוך על האינטואיציה"],"e":"הטעויות הן לרוב תוצר לוואי של קיצורי דרך מועילים. מודעות מפחיתה אותן."}]},"q25":{"t":"t6","v":[{"q":"מהי נבואה המגשימה את עצמה?","a":"אמונה שגורמת לנו להתנהג כך שהיא מתממשת","w":["תחזית שמתממשת בלי קשר להתנהגות שלנו","אמונה שמתבררת כשגויה לאורך זמן","ניבוי מדויק שמבוסס על ניסיון קודם"],"e":"את המונח טבע הסוציולוג רוברט מרטון (1948)."},{"q":"מה קורה כשלקוחות חושבים שהבנק עומד להתמוטט?","a":"הם מושכים את כספם, והבנק באמת מתמוטט","w":["הם מפקידים עוד כסף כדי לעזור לו","הבנק מוכיח להם שהם טועים","שום דבר, כי אמונות לא משנות מציאות"],"e":"האמונה המוטעית יצרה את המציאות שהיא ניבאה."}]},"q26":{"t":"t6","v":[{"q":"מי טבע את המונח ״נבואה המגשימה את עצמה״?","a":"רוברט מרטון","w":["רוברט רוזנטל","הרולד קלי","לי ג׳סים"],"e":"מרטון, סוציולוג, ב־1948. רוזנטל חקר את התופעה אצל נסיינים ומורים."}]},"q27":{"t":"t6","v":[{"q":"מה עשו רוזנטל וג׳ייקובסון (1968)?","a":"אמרו למורים שילדים אקראיים עומדים לפרוח","w":["בחרו את הילדים החכמים ביותר ועקבו אחריהם","שאלו מורים מי התלמידים המוכשרים","נתנו לילדים חלשים שיעורי עזר"],"e":"ציוני המשכל של הילדים ״המיוחדים״ עלו, אף שנבחרו באקראי."},{"q":"כמה מהניסויים על ציפיות מורים מצאו השפעה מובהקת, לפי רוזנטל עצמו?","a":"כ־40%","w":["כמעט כולם","כ־10%","אף אחד"],"e":"האפקט קיים אבל פחות חזק ומהימן ממה שחשבו בעקבות המחקר הראשון."}]},"q28":{"t":"t6","v":[{"q":"למה יש בדרך כלל מתאם בין ציפיות מורים להישגי תלמידים?","a":"כי מורים מעריכים את התלמידים בדייקנות","w":["כי הציפיות תמיד יוצרות את ההישגים","כי מורים מעתיקים ציונים משנים קודמות","כי תלמידים בוחרים מורים שמעריכים אותם"],"e":"ג׳סים: ברוב המקרים הציפיות משקפות את המציאות, ולא יוצרות אותה."},{"q":"איך מורים מעבירים ציפיות גבוהות לתלמיד?","a":"מחייכים, מלמדים יותר ומחכים יותר","w":["אומרים לתלמיד במפורש שהוא מוכשר","נותנים לו ציונים גבוהים יותר בלי קשר","מושיבים אותו בשורה הראשונה"],"e":"זה עובר בעיקר בהתנהגות לא מילולית. צופים זיהו זאת אחרי 10 שניות."}]},"q29":{"t":"t6","v":[{"q":"מה קרה לסטודנטים שנאמר להם שהמרצה מצוין?","a":"תפסו אותו כמעניין יותר וגם למדו יותר","w":["התאכזבו ממנו בהמשך ולמדו פחות","לא הייתה שום השפעה על הלמידה שלהם","המרצה לימד אותם בלי לשנות שום דבר"],"e":"גם ציפיות התלמידים משפיעות, וגם משנות את התנהגות המורה."},{"q":"נועה שמעה שד״ר לוי משעמם. מה עלול לקרות לפי הפרק?","a":"היא תקשיב פחות, וגם הוא ילמד פחות טוב","w":["היא תגלה שבעצם הוא דווקא מעניין","לא יקרה כלום, כי המרצה לא יודע זאת","הוא ינסה בכוח להוכיח לה שהיא טועה"],"e":"ציפיות תלמידים משפיעות על הלמידה שלהם ועל איכות ההוראה."}]},"q30":{"t":"t6","v":[{"q":"מה מצא הניסוי בתיכון באונטריו?","a":"כיתות שציפו למורה טובה הצליחו יותר","w":["המורות שינו את שיטת ההוראה לפי הכיתה","לא נמצא הבדל בין הכיתות","כיתות הביקורת הצליחו יותר"],"e":"לעמדות התלמידים כלפי המורה יש חשיבות לא פחותה מעמדת המורה כלפיהם."}]},"q31":{"t":"t7","v":[{"q":"מהו אישור התנהגותי?","a":"ציפיות שגורמות לאחר לאשר אותן","w":["אישור שהאחר נותן לנו על התנהגות טובה","התנהגות שחוזרת על עצמה במצבים שונים","הסכמה של קבוצה על התנהגות מסוימת"],"e":"סוג של נבואה המגשימה את עצמה ביחסים בין אנשים (סניידר)."},{"q":"מה מצאו סניידר ועמיתיו בניסוי שיחות הטלפון?","a":"נשים שנחשבו מושכות דיברו בחום רב יותר","w":["גברים לא הושפעו מהתמונה בכלל","נשים שנחשבו מושכות היו קרירות יותר","הנשים ידעו איזו תמונה הוצגה"],"e":"הגברים דיברו אחרת לפי הציפייה, והנשים הגיבו בהתאם."}]},"q32":{"t":"t7","v":[{"q":"מה קורה כשאנשים חושבים שהיריב במשחק לא ישתף פעולה?","a":"הם גורמים לו לא לשתף פעולה","w":["הם משתפים פעולה יותר כדי לשכנע אותו","הם מפסיקים לשחק","אין לזה השפעה על המשחק"],"e":"עוינות גוררת עוינות, ונוצר מעגל קסמים שלילי."},{"q":"איך אידאליזציה של בן הזוג משפיעה על הקשר?","a":"מפחיתה קונפליקטים ומגבירה שביעות רצון","w":["יוצרת ציפיות גבוהות שמובילות לאכזבה","גורמת לבן הזוג להתרחק עם הזמן","לא משפיעה על הקשר בשום צורה"],"e":"מוריי ועמיתיו: כשאוהבים ומעריכים אותנו, קל לנו להפוך לאדם שרואים בנו."}]},"q33":{"t":"t7","v":[{"q":"מה עבד טוב יותר לשמירה על ניקיון בכיתה?","a":"לומר לילדים שוב ושוב שהם נקיים ומסודרים","w":["לשכנע את הילדים שצריך לשמור על ניקיון","להעניש ילדים שזורקים אשפה","לתת פרס על כל פריט שנזרק לפח"],"e":"שכנוע העלה ל־45% זמנית. ״אתם נקיים״ העלה ל־80%."}]},"q34":{"t":"t7","v":[{"q":"מה הקשר בין מנת משכל לנטייה להטיות חשיבה?","a":"אין מתאם ביניהן","w":["אנשים חכמים כמעט לא טועים","אנשים חכמים טועים הרבה יותר","רק אנשים עם משכל נמוך טועים"],"e":"אדם יכול להיות פיקח מאוד ועדיין לשפוט באופן לקוי."},{"q":"מה טען הרברט סיימון על החשיבה?","a":"אנחנו מפשטים את המציאות בהיריסטיקות","w":["אנחנו מעבדים את כל המידע בצורה מלאה","היריסטיקות תמיד מובילות לטעויות","החשיבה האנושית היא אשליה אחת גדולה"],"e":"היריסטיקות מכשילות לפעמים, אבל מאפשרות שיפוט מהיר ויעיל."}]}};
const H={"h1":{"t":"t1","v":[{"q":"רונית מאחרת לפגישה. דן חושב: ״היא פשוט לא מכבדת את הזמן של אנשים״. איזה הסבר נתן דן?","a":"ייחוס פנימי, כי הוא תלה את האיחור בתכונה שלה","w":["ייחוס חיצוני, כי האיחור עצמו הוא אירוע במצב","אישור התנהגותי, כי הציפייה שלו גרמה לאיחור","הסקה ספונטנית של סיבה מצבית, בלי כוונה"],"e":"״לא מכבדת״ מתאר את מי שהיא, כלומר תכונה. אילו דן היה חושב ״אולי היה פקק״, זה היה ייחוס חיצוני."},{"q":"עובד לא ענה למייל. המנהלת חושבת: ״כנראה הוא קבור השבוע בפרויקט הגדול״. איזה הסבר זה?","a":"ייחוס חיצוני, כי הסיבה היא העומס במצב שלו","w":["ייחוס פנימי, כי מדובר בהתנהגות של העובד עצמו","טעות הייחוס הבסיסית, כי היא מתעלמת מהאופי","נבואה המגשימה את עצמה, כי היא מצפה לעומס"],"e":"הסיבה שהמנהלת בחרה נמצאת מחוץ לעובד: העומס. זה ייחוס חיצוני (מצבי), ההפך מטעות הייחוס הבסיסית."}]},"h2":{"t":"t1","v":[{"q":"יואב שכח את יום ההולדת של מיכל, אשתו. מיכל אומרת: ״היה לו שבוע מטורף בעבודה״. מה זה מרמז, לפי הספר?","a":"כנראה שהקשר ביניהם מאושר, כי מעשה שלילי מוסבר במצב","w":["כנראה שהקשר לא מאושר, כי היא מתרצת את ההתנהגות שלו","זו טעות הייחוס הבסיסית, כי היא ממעיטה באופי שלו","זה אישור התנהגותי, כי היא מאשרת את מה שציפתה"],"e":"זוגות מאושרים מייחסים מעשה שלילי של בן הזוג למצב. זוגות לא מאושרים מייחסים אותו לאופי: ״לא אכפת לו ממני״."},{"q":"נעם שכח לאסוף את בת הזוג שלו מהעבודה. היא אומרת לחברה: ״זה כי פשוט לא אכפת לו ממני״. מה זה מרמז על הקשר, לפי הספר?","a":"כנראה שהקשר לא מאושר, כי מעשה שלילי מוסבר באופי","w":["כנראה שהקשר מאושר, כי היא מדברת עליו בכנות","זה ייחוס חיצוני, כי השכחה היא אירוע חד־פעמי","זו נבואה המגשימה את עצמה, כי היא מצפה לזה"],"e":"אצל זוגות לא מאושרים אותו מעשה מוסבר בתכונה של בן הזוג. אצל זוגות מאושרים הוא מוסבר בנסיבות."}]},"h3":{"t":"t1","v":[{"q":"מנהל מפרש חיוך ידידותי של עובדת חדשה כהתעניינות רומנטית, אבל היא רק מנומסת. מה מתאר המקרה, ולמה הספר רואה בו בעיה?","a":"ייחוס מוטעה; עם עמדת כוח הוא עלול לתרום להטרדה","w":["אישור התנהגותי; החיוך שלה נגרם מהציפייה שלו","טעות הייחוס הבסיסית; הוא מתעלם מהתכונות שלה","הסקה ספונטנית מדויקת; כך נוצרים קשרים במקום עבודה"],"e":"ייחוס מוטעה = הסבר עם סיבה לא נכונה. הספר מציין שגברים נוטים לפרש ידידותיות כעניין מיני, במיוחד כשיש להם כוח."}]},"h4":{"t":"t2","v":[{"q":"בחתונה כל האורחים מברכים את הזוג בחום. אורח אחד אומר להם משפט עוקצני. לפי ג׳ונס ודייוויס, על מי נלמד יותר על האופי?","a":"על האורח העוקצני, כי התנהגותו חורגת מהצפוי","w":["על האורחים החמים, כי יש הרבה מהם ולכן המידע חזק","על כולם באותה מידה, כי כולם התנהגו מרצונם","על אף אחד, כי בחתונה כולם מתנהגים לפי נורמות"],"e":"התנהגות צפויה (ברכה בחתונה) מלמדת מעט על האדם. התנהגות חריגה מלמדת הרבה, כי המצב לא ״דחף״ אליה."},{"q":"בריאיון עבודה כל המועמדים נחמדים ומחייכים. מועמד אחד עונה למראיינת בגסות. על מי המראיינת תסיק יותר על האישיות, ולמה?","a":"על המועמד הגס, כי בריאיון ההתנהגות הצפויה היא להיות נחמד","w":["על המועמדים הנחמדים, כי הם מראים את האישיות האמיתית","על כולם באותה מידה, כי כולם בחרו איך להתנהג","על אף אחד, כי ריאיון הוא מצב מלאכותי מדי"],"e":"בריאיון כולם משתדלים להיות נחמדים, ולכן נחמדות לא מלמדת הרבה. גסות חורגת מהנורמה ולכן מלמדת הרבה."}]},"h5":{"t":"t2","v":[{"q":"צופים לשנייה אחת בסרטון של אדם שעוזר לילד לקום מהרצפה. אחר כך המילה שהכי עוזרת להיזכר בסרטון היא ״אכפתי״. מה זה מדגים?","a":"הסקת תכונה ספונטנית: הסקנו תכונה אוטומטית, בלי כוונה","w":["חוק ההתאמה: התנהגות צפויה מלמדת על התכונה של האדם","ייחוס חיצוני: הסקנו שהמצב הוא שגרם לאדם לעזור","נבואה המגשימה את עצמה: הציפייה שלנו יצרה את הזיכרון"],"e":"כמו בניסוי ״הספרנית והזקנה״: המוח הסיק תכונה (״מסייעת״) בלי שהתבקשנו, ולכן המילה של התכונה עוזרת להיזכר."}]},"h6":{"t":"t3","v":[{"q":"שירה צוחקת בכל פעם שהיא רואה קומיקאי מסוים. מקומיקאים אחרים היא כמעט לא צוחקת, וגם כל החברים שלה צוחקים ממנו. לפי קלי, מה הסיבה?","a":"הקומיקאי: ייחודיות וקונצנזוס גבוהים מובילים לייחוס חיצוני","w":["שירה צוחקת בקלות: ייחודיות וקונצנזוס גבוהים מובילים לייחוס פנימי","אין מספיק מידע, כי צריך עקביות נמוכה כדי להחליט","שילוב של שניהם, כי הקונצנזוס גבוה והייחודיות נמוכה"],"e":"״רק מהקומיקאי הזה״ = ייחודיות גבוהה. ״כולם צוחקים״ = קונצנזוס גבוה. כשההתנהגות קורית רק כאן ואצל כולם, הסיבה במצב, כלומר בקומיקאי."},{"q":"עידו מתלונן על האוכל בכל פעם שהוא אוכל במסעדה. הוא מתלונן גם במסעדות אחרות, ורק הוא מתלונן. לפי קלי, מה הסיבה?","a":"עידו עצמו: ייחודיות וקונצנזוס נמוכים מובילים לייחוס פנימי","w":["המסעדה: ייחודיות וקונצנזוס נמוכים מובילים לייחוס חיצוני","אין מספיק מידע, כי העקביות גבוהה מדי","האוכל במסעדות באזור, כי הוא מתלונן בכולן"],"e":"״גם במסעדות אחרות״ = ייחודיות נמוכה. ״רק הוא״ = קונצנזוס נמוך. ההתנהגות ״הולכת איתו״, ולכן הסיבה בו."}]},"h7":{"t":"t3","v":[{"q":"דנה, שתמיד מגיעה בזמן, איחרה פעם אחת לשיעור. לפי קלי, מה כנראה יסיקו האחרים?","a":"שזה מקרה חד־פעמי, ולא יחפשו לו סיבה קבועה","w":["שהיא אדם לא אחראי, כי איחור הוא התנהגות חריגה","שהשיעור לא חשוב לה, כי הקונצנזוס נמוך","שהשיעור משעמם, כי הייחודיות גבוהה"],"e":"לפי קלי מתחילים מהעקביות. כשההתנהגות קרתה פעם אחת (עקביות נמוכה), לא מחפשים הסבר קבוע."},{"q":"איזה מידע חסר לנו כדי להפעיל את המודל של קלי על התנהגות שראינו פעם אחת בלבד?","a":"עקביות: צריך לדעת אם ההתנהגות חוזרת במצב הזה","w":["קונצנזוס: צריך לדעת אם האדם מכיר את המצב","ייחודיות: צריך לדעת אם ההתנהגות הייתה בכוונה","אין חסר: פעם אחת מספיקה להחלטה פנימית"],"e":"רק כשההתנהגות חוזרת (עקביות גבוהה) משתמשים בייחודיות ובקונצנזוס כדי להחליט בין פנימי לחיצוני."}]},"h8":{"t":"t3","v":[{"q":"״גם שאר הנוסעים באוטובוס צעקו על הנהג״. איזה מידע זה לפי המודל של קלי?","a":"קונצנזוס גבוה: גם אחרים מתנהגים כך במצב הזה","w":["ייחודיות גבוהה: הצעקות קורות רק באוטובוס","עקביות גבוהה: הצעקות חוזרות בכל נסיעה","קונצנזוס נמוך: רק חלק מהנוסעים צעקו"],"e":"קונצנזוס שואל ״האם גם אחרים עושים את זה?״. כשהתשובה כן, הקונצנזוס גבוה."},{"q":"״אבי צועק רק על הנהג הזה. על נהגים אחרים הוא אף פעם לא צועק״. איזה מידע זה לפי המודל של קלי?","a":"ייחודיות גבוהה: ההתנהגות קורית רק במצב הזה","w":["קונצנזוס גבוה: גם אחרים צועקים על הנהג הזה","עקביות נמוכה: הוא לא צועק על כל נהג שפוגש","ייחודיות נמוכה: הוא צועק על הנהג רק לפעמים"],"e":"ייחודיות שואלת ״האם רק כאן?״. כשהתשובה כן, הייחודיות גבוהה, וזה מצביע על המצב."}]},"h9":{"t":"t4","v":[{"q":"סטודנטית רואה מרצה מסביר בביטחון חומר מסובך, ומסיקה שהוא ״גאון בכל תחום״. איזו טעות היא עושה, ולאיזה ניסוי זה דומה?","a":"טעות הייחוס הבסיסית; כמו בחידון, שוכחת את יתרון התפקיד","w":["ייחוס מוטעה; כמו בנאומים על קסטרו, היא מפרשת את הנאום","אישור התנהגותי; כמו בניסוי של סניידר, היא משנה אותו","נבואה המגשימה את עצמה; כמו אצל רוזנטל, היא מצפה ממנו"],"e":"המרצה בוחר מה ללמד, בתחום שהוא מכיר. כמו השואלים בניסוי החידון, היתרון נובע מהתפקיד, אבל אנחנו מייחסים אותו לחוכמה."},{"q":"מגיש של שעשועון טלוויזיה יודע את כל התשובות, והצופים בטוחים שהוא ״הכי חכם בתוכנית״. מה הם שוכחים?","a":"שהתשובות אצלו מראש בגלל התפקיד, כמו השואלים בחידון","w":["שהמתחרים לחוצים, ולכן אינטליגנציה לא נמדדת בזמן אמת","שמגישים נבחרים לפי אינטליגנציה, ולכן אין כאן טעות","שחוכמה היא תכונה יציבה, ולכן ההסקה שלהם נכונה"],"e":"זו טעות הייחוס הבסיסית: היתרון נובע מהמצב (התפקיד), והצופים מייחסים אותו לאופי (חוכמה)."}]},"h10":{"t":"t4","v":[{"q":"בדיבייט בבית הספר המורה קבע בהגרלה מי יטען בעד ומי נגד. אחרי הוויכוח הקהל בטוח שכל מתווכח באמת מאמין בעמדה שלו. מה זה מדגים?","a":"טעות הייחוס הבסיסית, גם כשידוע שהמצב קבע את העמדה","w":["ייחוס מוטעה, כי הקהל לא ידע על ההגרלה","אפקט הצופה, כי הקהל צופה מבחוץ","הסקה ספונטנית מדויקת, כי טיעון טוב מעיד על אמונה"],"e":"בדיוק כמו בנאומים על קסטרו (ג׳ונס והריס): גם כשיודעים שהעמדה הוכתבה, מייחסים אותה לאדם."}]},"h11":{"t":"t4","v":[{"q":"לפי הספר, מי נוטה יותר לטעות הייחוס הבסיסית: אדם אינטליגנטי עם כישורים חברתיים טובים, או אדם עם פחות כישורים?","a":"דווקא האדם האינטליגנטי ובעל הכישורים החברתיים","w":["האדם עם פחות כישורים, כי הוא מבין מצבים פחות טוב","שניהם באותה מידה, כי זו טעות של כל בני האדם","אף אחד מהם, כי אינטליגנציה מבטלת את הטעות"],"e":"זה ממצא מפתיע בספר: אינטליגנציה וכישורים חברתיים לא מגינים מהטעות, ואף קשורים אליה יותר."},{"q":"במסיבת פתיחה כל אחד מרגיש לחוץ, ובטוח שכל האחרים רגועים. איך מסבירים את זה לפי הפרק?","a":"כל אחד רואה אצל אחרים רק התנהגות ומייחס אותה לאופי","w":["כולם באמת רגועים חוץ מאחד, וזה הבדל אמיתי באופי","זו נבואה המגשימה את עצמה, כי הם גורמים זה לזה להירגע","זה אישור התנהגותי, כי הם מאשרים את הציפייה להירגע"],"e":"את הלחץ שלנו אנחנו מרגישים מבפנים. אצל אחרים אנחנו רואים רק את ההתנהגות, ומסיקים ״הם טיפוסים רגועים״."}]},"h12":{"t":"t5","v":[{"q":"בבית משפט מקרינים הודאה מצולמת של נאשם. הסנגור מבקש לצלם גם את החוקר. למה זה עשוי לעזור לנאשם?","a":"כשגם החוקר בתמונה, הצופים רואים את הלחץ של המצב","w":["כי הודאה מצולמת לא קבילה בלי תיעוד של החוקר","כי צופים מאמינים יותר להודאות שמצולמות מקרוב","כי החוקר במרכז התמונה נתפס כאמין פחות מהנאשם"],"e":"לפי ניסוי לסיטר, מה שבמרכז התמונה נתפס כגורם. מצלמה על החשוד = ״הודה כי עשה״. מצלמה על החוקר = ״לחצו עליו״."}]},"h13":{"t":"t5","v":[{"q":"אסף נכשל במבחן ואומר ״השאלות היו לא הוגנות״. כשחבר שלו נכשל, אסף חושב ״הוא פשוט לא למד״. לפי מאלה, מתי ההבדל הזה בולט?","a":"בעיקר כשההתנהגות של המבצע עצמו שלילית, כמו כישלון","w":["בעיקר כשההתנהגות של המבצע חיובית, כמו הצלחה","בכל מצב באותה מידה, כי זה הבדל קבוע בין אנשים","רק בתרבויות מערביות, שבהן מדגישים הישגים אישיים"],"e":"ניתוח של 173 מחקרים מצא שעל הצלחות שלנו אנחנו עושים ייחוס פנימי כמו צופים. רק על כישלונות שלנו אנחנו מאשימים את המצב."}]},"h14":{"t":"t5","v":[{"q":"שאלו סטודנטים מהודו ומארצות הברית למה נהג עבר ברמזור אדום. לפי מילר, מי יציע יותר הסברים של מצב?","a":"הסטודנטים מהודו, כי בתרבויות קולקטיביסטיות רגישים יותר למצב","w":["הסטודנטים מארצות הברית, כי הם חושבים יותר על חוקי תנועה","שתי הקבוצות באותה מידה, כי זו טעות אוניברסלית","אף אחת, כי כולם מסבירים עבירות באופי"],"e":"מילר (1984) מצא שהודים־הינדים הציעו יותר הסברים מצביים, ואמריקנים יותר הסברים של תכונות."},{"q":"יום אחרי בחירות שאלו אנשים למה המועמד ניצח, ושוב שנה אחרי. מה צפוי, לפי הספר?","a":"שנה אחרי פחות יסבירו בתכונות המועמד, ויותר במצב","w":["שנה אחרי יותר אנשים יסבירו בתכונות המועמד","התשובות יישארו זהות, כי הזיכרון של בחירות יציב","שנה אחרי כמעט כולם יסבירו את התוצאה רק בכלכלה"],"e":"עם הזמן האדם ״מתרחק״ ומקבלים יותר משקל לנסיבות. יום אחרי ייחסו את התוצאה למועמדים; שנה אחרי רק שליש עשו זאת."}]},"h15":{"t":"t6","v":[{"q":"מאמן בטוח ששחקן חדש ״לא רציני״, ולכן נותן לו פחות דקות ופחות הדרכה. בסוף העונה השחקן באמת חלש. איך מסבירים את זה לפי הפרק?","a":"נבואה המגשימה את עצמה: הציפייה שינתה את המאמן, והוא את השחקן","w":["ציפייה מדויקת: המאמן פשוט זיהה נכון מראש שהשחקן חלש","טעות הייחוס הבסיסית: המאמן התעלם מהמצב שבו השחקן נמצא","הסקה ספונטנית: המאמן הסיק תכונה מהר מדי ובלי שהתכוון"],"e":"הציפייה (״לא רציני״) גרמה להתנהגות (פחות הדרכה), וזו יצרה את התוצאה שאישרה את הציפייה."},{"q":"מנהלת משוכנעת שעובד חדש ״מוכשר מאוד״, ולכן נותנת לו משימות מאתגרות ומעודדת אותו. אחרי שנה הוא באמת בולט. מה צריך לבדוק כדי לדעת אם זו נבואה המגשימה את עצמה?","a":"האם הוא היה מוכשר כבר בהתחלה, או שהיחס שלה הוא שיצר את ההבדל","w":["האם המנהלת אמרה לו מראש שהיא מאמינה ביכולות שלו ושהוא יצליח","האם שאר העובדים קינאו בו בגלל היחס המיוחד שקיבל מהמנהלת","האם הוא זה שבחר בעצמו את המשימות המאתגרות ביותר בצוות"],"e":"לפי ג׳סים, לרוב ציפיות פשוט מדויקות. רק אם הציפייה עצמה גרמה לשיפור, זו נבואה המגשימה את עצמה."}]},"h16":{"t":"t6","v":[{"q":"מורה צופה שתלמידה מצטיינת תקבל ציון גבוה, והיא אכן מקבלת. היא הייתה מצטיינת עוד לפני שהמורה פגשה אותה. מה הכי סביר, לפי ג׳סים?","a":"הציפייה פשוט הייתה מדויקת, היא לא יצרה את ההצלחה","w":["זו נבואה המגשימה את עצמה, כי הציפייה התממשה","זו הטיית הנסיין, כי המורה מעריכה את המבחן","זה אישור התנהגותי, כי התלמידה אישרה את הציפייה"],"e":"התממשות של ציפייה לא מוכיחה שהיא גרמה לתוצאה. כשהתלמידה הייתה חזקה מראש, הציפייה רק חזתה נכון."}]},"h17":{"t":"t6","v":[{"q":"שמועה ברשת אומרת שנייר טואלט ייגמר בסופר. כולם קונים כמויות, והמדפים באמת מתרוקנים. למה זה דומה בפרק?","a":"לבנק של מרטון: האמונה גרמה להתנהגות שהגשימה אותה","w":["לניסוי של רוזנטל: הנסיין העביר ציפייה למשתתפים","לניסוי החידון: היתרון של התפקיד נראה כמו תכונה","לניסוי של סניידר: הציפייה מבן שיח שינתה אותו"],"e":"כמו לקוחות שמושכים כסף מבנק ״שעומד לקרוס״ וגורמים לו לקרוס, הקונים יצרו את המחסור שפחדו ממנו."}]},"h18":{"t":"t6","v":[{"q":"לפי המחקרים, איך מורה מעביר לתלמיד ציפייה גבוהה, גם בלי להגיד אותה?","a":"במעשים קטנים: חיוכים, יותר חומר ויותר זמן לענות","w":["בעיקר בציונים: נותן לו ציון גבוה כדי לעודד אותו","בעיקר במילים: אומר לו שוב ושוב שהוא מאמין בו","בעיקר בעונשים: מחמיר איתו כדי שיתאמץ יותר"],"e":"הציפייה עוברת דרך התנהגות לא מילולית ודרך כמות ההשקעה. צופים זיהו על איזה תלמיד המורה מדבר אחרי 10 שניות של וידאו."}]},"h19":{"t":"t7","v":[{"q":"יעל בטוחה שהשכנה החדשה ״מתנשאת״, ולכן מדברת איתה בקרירות. השכנה עונה בקיצור ומתרחקת. איך נקרא התהליך?","a":"אישור התנהגותי: הציפייה של יעל גרמה לשכנה לאשר אותה","w":["ייחוס מוטעה: יעל פירשה לא נכון את ההתנהגות של השכנה","טעות הייחוס הבסיסית: יעל התעלמה מהמצב של השכנה","הסקה ספונטנית: יעל הסיקה תכונה בלי לשים לב"],"e":"כמו בניסוי של סניידר, ההתנהגות של יעל (קרירות) גרמה לשכנה להגיב בקרירות, ויעל רואה בזה הוכחה."},{"q":"גבר משוחח בטלפון עם אישה שהוא חושב שהיא מושכת. אחר כך שופטים ששומעים רק אותה מתארים אותה כחמה ונעימה. מה גרם לזה, לפי סניידר?","a":"הוא דיבר אליה בחום, והיא החזירה לו חום","w":["נשים מושכות באמת חמות יותר בשיחה טלפונית","השופטים ראו את התמונה שלה לפני ששמעו אותה","היא ידעה מראש שהוא חושב שהיא מושכת מאוד"],"e":"זה אישור התנהגותי: הציפייה שלו שינתה את איך שהוא דיבר, וזה שינה את איך שהיא ענתה."}]},"h20":{"t":"t7","v":[{"q":"גננת רוצה שהילדים יסדרו את הצעצועים. לפי המחקר בפרק, מה יעבוד הכי טוב לאורך זמן?","a":"לומר להם שוב ושוב שהם ילדים מסודרים","w":["להסביר להם בהיגיון למה חשוב לסדר","לתת פרס לכל ילד שמסדר בסוף היום","להעיר לכל ילד שלא מסדר את הצעצועים"],"e":"במחקר, שכנוע העלה את השלכת האשפה ל־45% באופן זמני. תווית חיובית (״אתם נקיים״) העלתה ל־80%."}]},"h21":{"t":"t7","v":[{"q":"חבר אומר: ״הטיות חשיבה זה עניין של אנשים לא חכמים״. מה עונה על זה הפרק?","a":"אין קשר בין משכל לנטייה להטיות; כולם משתמשים בקיצורי דרך","w":["הוא צודק, כי אנשים חכמים מזהים את ההטיות שלהם","הוא צודק חלקית, כי ההטיות פוחתות עם השכלה","הוא טועה, כי דווקא אנשים חכמים לא משתמשים בהיריסטיקות"],"e":"הספר מדגיש שאין מתאם בין מנת משכל להטיות. לפי סיימון, כולנו מפשטים את המציאות בעזרת היריסטיקות."}]}};
const SUM=`<h2>סיכום: מאיירס פרק 3 (חלק ב׳) - ייחוס וציפיות</h2>
<div class="key"><b>השאלה של הפרק במשפט אחד:</b> כשאנחנו רואים מישהו עושה משהו, איך אנחנו מסבירים לעצמנו <b>למה</b> הוא עשה את זה, איפה אנחנו טועים בהסבר, ואיך הדעה שלנו עליו יכולה בסוף לשנות את ההתנהגות שלו.<br><br>
<b>הפרק בנוי משלושה חלקים, וכל אחד ממשיך את הקודם:</b><br>
① <b>איך מסבירים התנהגות</b> (סעיפים 1–3): האם הסיבה היא באדם עצמו או במצב שהוא נמצא בו.<br>
② <b>איפה טועים</b> (סעיפים 4–5): הטעות הכי נפוצה היא להאשים את האדם ולשכוח את המצב.<br>
③ <b>מה קורה אחרי שהחלטנו</b> (סעיפים 6–7): הציפייה שלנו ממישהו גורמת לנו להתנהג אליו אחרת, וזה גורם לו להתנהג בדיוק כמו שציפינו.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>ייחוס</b></td><td>ההסבר שאנחנו נותנים לעצמנו ל״למה הוא עשה את זה?״. ״לייחס״ = לשייך את הסיבה למשהו.</td></tr>
<tr><td><b>תכונה / נטייה</b></td><td>משהו קבוע באדם: אופי, מזג, עמדות. ״הוא עצבני״, ״היא עצלנית״.</td></tr>
<tr><td><b>מצב / סיטואציה</b></td><td>מה שקורה מסביב לאדם באותו רגע: לחץ, עייפות, פקקים, מישהו שהורה לו לעשות משהו.</td></tr>
<tr><td><b>הטיה</b></td><td>טעות חשיבה קבועה. לא טעות מקרית, אלא טעות שכולנו עושים שוב ושוב באותו כיוון.</td></tr>
<tr><td><b>היריסטיקה</b></td><td>קיצור דרך מחשבתי: כלל אצבע שחוסך מאמץ ונותן תשובה מהר, אבל לפעמים מטעה.</td></tr></table></div>

<h3>הדוגמה שתלווה אותנו: נועה</h3>
<p><b>נועה</b> (דמות בדויה להמחשה) בשבוע הראשון של שנה א׳. השותף לדירה לא אמר לה שלום. מרצה אחד נראה לה ״נוקשה״. במסיבת הפתיחה נראה לה שכולם רגועים חוץ ממנה. בכל אחד מהמצבים האלה היא שואלת את עצמה ״למה?״, וזה בדיוק מה שהפרק חוקר.</p>

<h3>1. תאוריית הייחוס: פנימי או חיצוני?</h3>
<p>הפסיכולוג <b>פריץ היידר</b> (1958) שם לב שכולנו מתנהגים כמו ״בלשים חובבים״: אנחנו כל הזמן מנסים להבין למה אנשים עושים מה שהם עושים. לפי <b>תאוריית הייחוס</b>, יש בעצם שתי תשובות אפשריות:</p>
<div class="tw"><table><tr><th>סוג ההסבר</th><th>איפה הסיבה</th><th>מה נועה תגיד על השותף</th></tr>
<tr><td><b>ייחוס פנימי</b></td><td><b>בתוך האדם</b>: האופי, המזג, העמדות שלו</td><td>״הוא פשוט לא נחמד״</td></tr>
<tr><td><b>ייחוס חיצוני</b> (מצבי)</td><td><b>מחוץ לאדם</b>: הנסיבות, הלחץ, מה שקרה לו באותו רגע</td><td>״הוא מיהר למבחן ולא שם לב אליי״</td></tr></table></div>
<div class="ex"><b>איך לזהות במבחן:</b> שואלים את עצמנו ״האם ההסבר אומר משהו על <b>מי שהאדם הוא</b>, או על <b>מה שקרה לו</b>?״. ״הוא איחר כי הוא לא אחראי״ = פנימי. ״הוא איחר כי היה פקק״ = חיצוני.</div>
<p><b>למה זה חשוב?</b> כי ההסבר קובע את השיפוט שלנו. אותו מעשה בדיוק יכול להיחשב רצח או הגנה עצמית, ואותו אדם יכול להיחשב ״עצלן״ או ״מישהו שפוטר״, הכול לפי ההסבר שבחרנו.</p>
<ul>
<li><b>מתי אנחנו בכלל מחפשים הסבר?</b> בעיקר כשקורה משהו <b>שלילי או לא צפוי</b>. כשהשותף אומר שלום, נועה לא שואלת למה. כשהוא לא אומר, היא כן.</li>
<li><b>בזוגיות:</b> בן זוג שאיחר. זוגות <b>מאושרים</b> מסבירים את זה במצב (״היו פקקים״). זוגות <b>לא מאושרים</b> מסבירים את זה באופי (״לא אכפת לו ממני״). כלומר, ההסבר משקף את מצב הקשר.</li>
<li><b>ייחוס מוטעה</b> = בחרנו סיבה לא נכונה. הדוגמה בספר: גברים מפרשים ידידותיות של אישה כהתעניינות מינית יותר ממה שנשים מתכוונות. זה בולט במיוחד כשלגבר יש <b>עמדת כוח</b> (למשל מנהל), ועלול לתרום להטרדה.</li>
</ul>

<h3>2. מתי מהתנהגות מסיקים על אופי?</h3>
<p>אם החלטנו שהסיבה <b>פנימית</b>, השלב הבא הוא להסיק תכונה: ״הוא עשה X, אז הוא כנראה אדם כזה״. הסעיף הזה מסביר מתי ההסקה הזו חזקה.</p>
<p><b>ג׳ונס ודייוויס</b> (תאוריית ״הסקת התכונה המתאימה״): התנהגות <b>צפויה</b>, שכולם עושים במצב הזה, לא מלמדת כמעט כלום על האדם. התנהגות <b>יוצאת דופן</b>, שמעט אנשים היו עושים, מלמדת הרבה.</p>
<div class="ex"><b>דוגמה:</b> בריאיון עבודה כולם משתדלים להיות נחמדים. אם מישהי עונה שם בעקיצות, זה חריג, ולכן נסיק ״היא סרקסטית״. אם היא עוקצת את אחיה בבית, זה נפוץ, ולכן נסיק פחות. אצל נועה: מרצה שמחייך בשיעור הראשון לא אומר לה הרבה, כי כולם מחייכים בשיעור הראשון. מרצה שצועק על סטודנט כן.</div>
<p><b>הסקה ספונטנית:</b> את ההסקות האלה אנחנו עושים <b>אוטומטית</b>, בלי להתכוון ובלי לשים לב. בניסוי, סטודנטים קראו ״הספרנית נשאה את המצרכים של הזקנה אל מעבר לכביש״. אחר כך המילה שהכי עזרה להם להיזכר במשפט הייתה ״<b>מסייעת</b>״, כלומר תכונה שלא הופיעה במשפט בכלל. המוח שלהם הסיק אותה לבד. מספיק לראות פנים של אדם <b>עשירית שנייה</b> כדי לגבש דעה על האישיות שלו.</p>

<h3>3. המודל של קלי: איך מחליטים בין פנימי לחיצוני</h3>
<p>עד עכשיו ראינו <b>שאנחנו</b> מסבירים התנהגות. <b>הרולד קלי</b> (1973) הציע <b>איך</b> מחליטים איזה הסבר נכון: פנימי או חיצוני. לפי קלי, אנחנו מתנהגים קצת כמו בלש שאוסף שלוש עדויות. כל עדות היא שאלה:</p>
<div class="tw"><table><tr><th>השם במבחן</th><th>השאלה שבודקים</th><th>מה אומרת תשובה ״כן״</th></tr>
<tr><td><b>עקביות</b></td><td>האם הוא עושה את זה <b>כל פעם</b> במצב הזה?</td><td>כן = עקביות <b>גבוהה</b>. זה לא מקרה חד־פעמי</td></tr>
<tr><td><b>ייחודיות</b></td><td>האם הוא עושה את זה <b>רק במצב הזה</b>, ולא במקומות אחרים?</td><td>כן = ייחודיות <b>גבוהה</b>. ההתנהגות ״מיוחדת״ למצב הזה</td></tr>
<tr><td><b>קונצנזוס</b></td><td>האם <b>גם אחרים</b> עושים את זה במצב הזה?</td><td>כן = קונצנזוס <b>גבוה</b>. ״קונצנזוס״ = הסכמה, כולם מתנהגים אותו דבר</td></tr></table></div>
<div class="ex"><b>הטריק להבנה:</b> ״גבוה״ ו״נמוך״ הם פשוט <b>״כן״</b> ו<b>״לא״</b> לשאלה. החלק המבלבל הוא <b>ייחודיות</b>: ייחודיות <b>נמוכה</b> לא אומרת שמשהו ״לא מיוחד באדם״, אלא שההתנהגות <b>לא מיוחדת למצב הזה</b>, כי היא קורית גם בכל מקום אחר.</div>
<p><b>שלב 1: עקביות.</b> אם זה קרה פעם אחת בלבד (עקביות נמוכה), כנראה זה מקרי ולא מחפשים הסבר. רק אם זה חוזר (עקביות גבוהה) עוברים לשתי השאלות האחרות.</p>
<p><b>שלב 2: ייחודיות וקונצנזוס מכריעים.</b> נבדוק את זה על מקרה יומיומי. החבר שלך, דני, צועק על המלצר בכל פעם שאתם יושבים במסעדה (עקביות גבוהה). למה?</p>
<div class="ex"><b>גרסה א׳: הבעיה בדני (ייחוס פנימי)</b><br>
<b>האם דני צועק רק במסעדה הזו?</b> לא. הוא צועק גם על הקופאית בסופר ועל הנהג באוטובוס. ההתנהגות לא מיוחדת למקום הזה ← <b>ייחודיות נמוכה</b>.<br>
<b>האם גם אחרים צועקים על המלצר הזה?</b> לא, רק דני ← <b>קונצנזוס נמוך</b>.<br>
<b>המסקנה:</b> ההתנהגות ״הולכת עם דני״ לכל מקום, ואף אחד אחר לא מתנהג כך. הסיבה בדני: ״הוא אדם עצבני״.</div>
<div class="ex"><b>גרסה ב׳: הבעיה במסעדה (ייחוס חיצוני)</b><br>
<b>האם דני צועק רק במסעדה הזו?</b> כן. בכל מקום אחר הוא רגוע ← <b>ייחודיות גבוהה</b>.<br>
<b>האם גם אחרים צועקים על המלצר הזה?</b> כן, גם שולחנות אחרים מתלוננים ← <b>קונצנזוס גבוה</b>.<br>
<b>המסקנה:</b> ההתנהגות ״שייכת למקום״: רק כאן, ואצל כולם. הסיבה במסעדה: ״השירות שם נוראי״.</div>
<div class="ex"><b>הכלל לזכור:</b><br>
• קורה <b>בכל מקום</b> ו<b>רק אצלו</b> (ייחודיות וקונצנזוס <b>נמוכים</b>) ← הסיבה <b>באדם</b> (פנימי).<br>
• קורה <b>רק כאן</b> ו<b>אצל כולם</b> (ייחודיות וקונצנזוס <b>גבוהים</b>) ← הסיבה <b>במצב</b> (חיצוני).<br>
<b>אותו כלל, בדוגמה מהכיתה:</b> סטודנטית שנרדמת בכל השיעורים ורק היא נרדמת ← ״היא עייפה תמיד״. כל הכיתה נרדמת רק בשיעור סטטיסטיקה ← ״השיעור מרדים״.</div>

<h3>4. טעות הייחוס הבסיסית: הטעות הכי נפוצה</h3>
<p>המודל של קלי מתאר איך <b>היינו צריכים</b> לחשוב. בפועל אנחנו טועים, ותמיד <b>לאותו כיוון</b>: כשאנחנו מסבירים התנהגות של <b>אחרים</b>, אנחנו <b>ממעיטים</b> בהשפעת המצב ו<b>מפריזים</b> בהשפעת האופי. זו <b>טעות הייחוס הבסיסית</b> (לי רוס, 1977), שנקראת גם <b>הטיית ההתאמה</b>. במילים פשוטות: ״הוא עשה את זה כי הוא כזה״, גם כשהמצב הוא שגרם לזה.</p>
<div class="ex"><b>דוגמה של מאיירס עצמו:</b> הוא לימד את אותו שיעור ב־8:30 בבוקר וב־19:00 בערב. בבוקר הסטודנטים שתקו, בערב הם היו פעילים ושמחים. ההבדל נבע מהשעה (מצב), אבל גם הוא התפתה לחשוב ש״בערב פשוט מגיעים אנשים מוחצנים יותר״ (אופי).</div>
<p>שלושה מחקרים מראים כמה הטעות הזו חזקה. בכל אחד שימו לב: <b>האנשים ידעו</b> שהמצב השפיע, ועדיין האשימו את האדם.</p>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>הנאומים על קסטרו</b><br>(ג׳ונס והריס, 1967)</b><br><b>מה עשו:</b> סטודנטים קראו נאום בעד או נגד פידל קסטרו. לחלק אמרו שהכותב <b>בחר</b> את העמדה, ולחלק שהמנחה <b>הכתיב</b> לו אותה<br><b>מה יצא:</b> גם מי ששמע שהעמדה הוכתבה חשב שהכותב באמת מאמין בה<br><b>מה זה מלמד:</b> גם כשיודעים שהמצב קבע את ההתנהגות, מייחסים אותה לאדם</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>ניסוי החידון</b><br>(רוס, 1977)</b><br><b>מה עשו:</b> חילקו סטודנטים <b>בהגרלה</b> לשואלים, מתחרים וצופים. השואלים כתבו שאלות קשות מתחום שהם מכירים<br><b>מה יצא:</b> המתחרים והצופים דירגו את השואלים כחכמים הרבה יותר. השואלים עצמם לא טעו<br><b>מה זה מלמד:</b> שכחו שלשואל יש יתרון של התפקיד, וייחסו את היתרון לחוכמה</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>ההצטנעות</b></b><br><b>מה עשו:</b> ביקשו ממשתתף להתנהג בצניעות בשיחה. בן השיח שלו הגיב באותו אופן<br><b>מה יצא:</b> המשתתף הסיק שלבן השיח יש הערכה עצמית נמוכה<br><b>מה זה מלמד:</b> טועים גם כשאנחנו בעצמנו יצרנו את המצב</div>
<p><b>בחיים:</b> סטודנטים מפריזים בידע של המרצים שלהם, כי הם רואים אותם רק בתפקיד ״מי שיודע את התשובות״. ומי טועה יותר? באופן מפתיע, דווקא אנשים <b>אינטליגנטיים</b> ובעלי כישורים חברתיים.</p>
<div class="ex"><b>אצל נועה:</b> במסיבה היא בטוחה שכולם רגועים ורק היא לחוצה. בפועל כולם לחוצים. כל אחד רואה את האחרים מבחוץ, לא רואה את הלחץ שלהם, ומסיק ״הם פשוט טיפוסים רגועים״.</div>

<h3>5. למה אנחנו עושים את הטעות הזו?</h3>
<p>בסעיף הקודם ראינו <b>שאנחנו</b> מאשימים את האדם ושוכחים את המצב. עכשיו השאלה היא <b>למה</b>. התשובה של הפרק מתחילה ברעיון אחד פשוט, ואז מראה חמש דרכים שבהן הוא בא לידי ביטוי.</p>
<div class="key"><b>הרעיון המרכזי: אנחנו מחפשים את הסיבה במה שאנחנו מסתכלים עליו.</b><br>
כשאנחנו מסתכלים על מישהו, <b>הוא</b> במרכז התמונה. את המצב שלו (העייפות, הלחץ, מה שקרה לו לפני רגע) אנחנו לא רואים. מה שלא רואים קל לשכוח, ולכן ההסבר ״נדבק״ לאדם.</div>

<h4>א. נקודת מבט: מי שעושה מול מי שמסתכל</h4>
<p><b>מה הרעיון:</b> כשאני עושה משהו, העיניים שלי מסתכלות החוצה, על הסביבה. לכן אני רואה מה הוביל אותי לפעול, ומסביר את עצמי במצב. כשאני מסתכל על מישהו אחר, אני רואה <b>אותו</b> ולא את מה שקורה לו, ולכן מסביר אותו באופי (ג׳ונס וניסבט).</p>
<div class="ex"><b>דוגמה מהיומיום:</b> נהג חותך אותך בכביש. אתה חושב: ״איזה חוצפן״. כשאתה חותך מישהו, אתה יודע שזה כי פספסת את היציאה ואתה ממהר לעבודה. אותו מעשה, אבל על עצמך אתה מכיר את הנסיבות ועל הנהג השני לא.<br>
<b>הדוגמה מהספר:</b> אישה עומדת עם הרכב ליד משאבה בתחנת דלק. מי שמחכה מאחוריה חושב שהיא ״חסרת התחשבות״. היא עצמה יודעת שהמשאבה השנייה הייתה תפוסה כשהגיעה.</div>
<p><b>הסתייגות שחשוב לדעת:</b> ניתוח של 173 מחקרים (<b>מאלה</b>, 2006) מצא שההבדל הזה בין ״מי שעושה״ ל״מי שמסתכל״ לא תמיד גדול. הוא בולט בעיקר כשמדובר ב<b>משהו רע שעשינו</b>. כשהצלחנו, גם אנחנו מסבירים את עצמנו באופי.</p>
<div class="ex"><b>דוגמה:</b> קיבלת 95 במבחן? ״אני חכם ולמדתי״ (פנימי). קיבלת 50? ״המבחן היה לא הוגן״ (חיצוני). על הטוב לוקחים קרדיט, על הרע מאשימים את המצב.</div>

<h4>ב. זווית המצלמה: מה שבמרכז התמונה נראה כגורם</h4>
<p><b>מה הרעיון:</b> אותו רעיון של נקודת מבט, הפעם בניסוי. כשמראים לאנשים סרטון, מי שמופיע במרכז התמונה נתפס כמי ש״אחראי״ למה שקורה.</p>
<div class="ex"><b>הניסוי (לסיטר):</b> צילמו הודאה של חשוד בחקירה משתי זוויות. כשהמצלמה הייתה על <b>החשוד</b>, הצופים חשבו שההודאה כנה (״הוא באמת עשה את זה״). כשהמצלמה הייתה על <b>החוקר</b>, הם חשבו שההודאה כפויה (״לחצו עליו״). אותה הודאה בדיוק.<br>
<b>למה זה חשוב:</b> בניו זילנד מחייבים לצלם חקירות מהצד, כך שרואים את שניהם, כדי שהזווית לא תשפיע על השופטים.</div>

<h4>ג. זמן: עם הזמן רואים את המצב</h4>
<p><b>מה הרעיון:</b> ברגע שמשהו קורה, האדם בולט ומרכזי. עם הזמן הזיכרון של האדם מתעמעם, ומתחילים לחשוב יותר על הנסיבות.</p>
<div class="ex"><b>הדוגמה מהספר:</b> יום אחרי בחירות, רוב האנשים הסבירו את התוצאה במועמדים עצמם (״הוא מנהיג חזק״). שנה אחרי, רק שליש הסבירו כך. השאר כבר דיברו על המצב: הכלכלה, האירועים באותה תקופה.<br>
<b>מהיומיום:</b> ביום של הריב עם חבר אתה בטוח ש״הוא פשוט אדם לא נעים״. אחרי חודש אתה נזכר שהוא היה אז בלחץ בעבודה.</div>
<p>זה קורה גם כלפי עצמנו: על <b>״האני של לפני 5 שנים״</b> אנחנו מדברים כאילו זה אדם אחר, ומסבירים אותו באופי (״הייתי אז ילד לא אחראי״).</p>

<h4>ד. מודעות עצמית: כשמסתכלים על עצמנו מבחוץ</h4>
<p><b>מה הרעיון:</b> בדרך כלל אנחנו לא רואים את עצמנו, אנחנו רואים את העולם. אבל כשמשהו גורם לנו להסתכל על עצמנו מבחוץ, אנחנו פתאום רואים את עצמנו כמו שאחרים רואים אותנו, ומתחילים להסביר גם את עצמנו באופי.</p>
<div class="ex"><b>מה גורם לזה:</b> מראה, שמיעה של ההקלטה של הקול שלך, או מצלמה שמכוונת אליך.<br>
<b>דוגמה:</b> אתה צופה בסרטון של עצמך מתווכח עם מישהו, ופתאום חושב ״וואו, אני באמת נשמע תוקפני״. בזמן הוויכוח עצמו הרגשת שאתה רק מגיב למה שהוא אמר.</div>

<h4>ה. תרבות: איפה גדלנו משנה איך אנחנו מסבירים</h4>
<p><b>מה הרעיון:</b> בתרבות המערבית מלמדים מגיל צעיר ש״הכול תלוי בך״ (״אם תרצה, תצליח״). לכן מערביים מסבירים התנהגות בעיקר באופי. בתרבויות של מזרח אסיה ובתרבויות קולקטיביסטיות, שבהן הקבוצה חשובה יותר מהיחיד, שמים לב יותר למצב ולהקשר.</p>
<div class="ex"><b>הדוגמה מהספר:</b> הבן של מאיירס כתב בבית הספר ״השער תפס את טום בשרוול״. המורה סימנה טעות, כי ״נכון״ לכתוב ״טום נתפס בשער״. אפילו בדקדוק, התרבות מלמדת לשים את האדם כגורם.<br>
<b>ממצא נוסף:</b> כשביקשו להסביר אותם אירועים, הודים הציעו יותר הסברים של מצב, ואמריקנים יותר הסברים של אופי (מילר, 1984).</div>

<h4>למה כל זה משנה בחיים?</h4>
<p>ההסבר שאנחנו בוחרים משפיע על איך שנתייחס לאנשים. מי שמסביר עוני באופי (״הם עצלנים״) חושב שלא צריך לעזור, כי ״זו אשמתם״. מי שמסביר אותו במצב (״אין עבודה באזור, לא קיבלו הזדמנות״) תומך יותר בעזרה. כלומר, טעות הייחוס היא לא רק טעות בראש: היא משפיעה על החלטות אמיתיות.</p>

<h3>6. נבואה המגשימה את עצמה: הציפייה יוצרת את המציאות</h3>
<p>עד כאן ראינו איך אנחנו <b>מפרשים</b> אנשים אחרים. עכשיו הפרק עושה צעד נוסף ומראה שהפירוש שלנו לא נשאר רק בראש: הוא <b>משנה את איך שאנחנו מתנהגים</b> כלפי האדם, וזה משנה גם אותו.</p>
<div class="key"><b>ההגדרה:</b> <b>נבואה המגשימה את עצמה</b> היא אמונה שגורמת לנו להתנהג כך שהיא מתממשת. את המושג טבע הסוציולוג <b>רוברט מרטון</b> (1948).<br>
<b>במילים פשוטות:</b> חשבתי שמשהו יקרה, ובגלל שחשבתי ככה, התנהגתי באופן שגרם לזה לקרות.</div>
<p><b>איך זה עובד, ארבעה שלבים:</b></p>
<div class="ex">① <b>אני מאמין</b> משהו על מישהו.<br>② לכן <b>אני מתנהג</b> אליו בהתאם, לפעמים בלי לשים לב.<br>③ הוא <b>מגיב</b> להתנהגות שלי.<br>④ התגובה שלו <b>נראית לי כהוכחה</b> שצדקתי מההתחלה.</div>
<div class="ex"><b>דוגמה מהיומיום:</b> אתה מתחיל עבודה חדשה ושומע ש״העובד הוותיק במשמרת לא סובל חדשים״.<br>
① אתה מאמין שהוא לא אוהב אותך.<br>② אתה מתרחק, לא שואל אותו שאלות, ועונה לו קצר.<br>③ הוא רואה מישהו מרוחק ולא ידידותי, ומתייחס אליך בקרירות.<br>④ אתה אומר לעצמך: ״ידעתי, הוא באמת לא סובל חדשים״.<br>
בפועל ייתכן שהוא היה בסדר גמור. <b>הציפייה שלך יצרה</b> את הקרירות שלו.</div>
<div class="ex"><b>הדוגמה של מרטון, הבנק:</b> מתפשטת שמועה שבנק עומד לקרוס. הלקוחות נבהלים ומושכים את כל הכסף שלהם. בגלל שכולם מושכים בבת אחת, לבנק באמת לא נשאר כסף, והוא קורס. הבנק היה בסדר לפני השמועה. <b>האמונה עצמה</b> הפילה אותו.<br>
<b>דוגמה דומה מהבורסה:</b> יועץ השקעות בשם גרנוויל כתב ללקוחות ״מכרו מחר״, וכולם מכרו. המחירים צנחו, כאילו הוא צדק.</div>

<h4>הניסויים</h4>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">הטיית הנסיין (רוזנטל)</b><br>
<b>מה עשו:</b> נתנו לנסיינים להעביר ניסוי פשוט: להראות למשתתפים תמונות של פרצופים ולבקש לדרג כמה כל אחד נראה ״מצליח״. לחלק מהנסיינים אמרו שהמשתתפים שלהם צפויים לתת דירוגים גבוהים.<br>
<b>מה יצא:</b> הנסיינים האלה באמת קיבלו דירוגים גבוהים יותר, למרות שקראו אותן הוראות והראו אותן תמונות.<br>
<b>מה זה מלמד:</b> הנסיין העביר את הציפייה שלו בלי לשים לב, בטון, בחיוך, בהדגשה. גם מדען זהיר מושפע מהציפיות שלו.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">ה״פורחים״ בבית הספר (רוזנטל וג׳ייקובסון, 1968)</b><br>
<b>מה עשו:</b> בבית ספר יסודי אמרו למורים שמבחן מיוחד גילה שילדים מסוימים ״עומדים לפרוח״ השנה. בפועל הילדים נבחרו <b>בהגרלה</b>, ולא היה בהם שום דבר מיוחד.<br>
<b>מה יצא:</b> בסוף השנה ציוני המשכל של הילדים האלה עלו יותר מאשר אצל שאר הכיתה.<br>
<b>מה זה מלמד:</b> המורים האמינו בילדים האלה, התייחסו אליהם אחרת, והילדים התקדמו. הציפייה של המורה הפכה למציאות.</div>

<h4>הסתייגות חשובה למבחן: האפקט קיים, אבל חלש</h4>
<p>אחרי הניסוי של רוזנטל וג׳ייקובסון חשבו שציפיות של מורים משנות הכול. בדיקה של כ־500 ניסויים הראתה שרק בכ־<b>40%</b> מהם האפקט הופיע. רוב הזמן קורה משהו פשוט יותר: מורה מצפה שתלמיד יצליח <b>כי הוא מכיר אותו</b> ויודע שהוא חזק. כלומר, הציפייה לא <b>יצרה</b> את ההצלחה, היא פשוט <b>חזתה</b> אותה נכון (<b>ג׳סים</b>).</p>
<div class="ex"><b>איך להבדיל במבחן:</b> אם הציפייה <b>גרמה</b> להתנהגות (המורה לימד אותו יותר, ולכן הוא השתפר), זו נבואה המגשימה את עצמה. אם הציפייה רק <b>זיהתה</b> משהו שכבר היה (התלמיד היה חזק מההתחלה), זו ציפייה מדויקת.</div>

<h4>איך מורה מעביר ציפייה בלי להגיד אותה?</h4>
<p>המורה לא אומר ״אני מאמין בך״. הוא מראה את זה במעשים קטנים: מסתכל על התלמיד יותר, מחייך ומהנהן, מלמד אותו יותר חומר, נותן לו משימות קשות יותר, ומחכה לו יותר זמן כשהוא עונה. כל אחד מהדברים האלה קטן, אבל ביחד הם משנים את התלמיד. וזה בולט: צופים זיהו על איזה תלמיד המורה מדבר אחרי <b>10 שניות</b> בלבד של וידאו.</p>

<h4>זה עובד גם בכיוון ההפוך: מהתלמידים למרצה</h4>
<p>לא רק מורים משפיעים על תלמידים. סטודנטים ששמעו שהמרצה ״מצוין״ הקשיבו יותר, השתתפו יותר ולמדו יותר. ו<b>גם המרצה לימד טוב יותר</b>, כי כיתה קשובה ומתעניינת נותנת לו אנרגיה.</p>
<div class="ex"><b>אצל נועה:</b> היא שמעה מסטודנטים בשנה ב׳ ש״המרצה לסטטיסטיקה משעמם״. אם היא נכנסת לשיעור עם הציפייה הזו, היא יושבת מאחורה ובודקת את הטלפון. המרצה רואה כיתה אדישה ומלמד בפחות התלהבות. נועה יוצאת מהשיעור ואומרת ״צדקו, משעמם״. אבל ייתכן שהיא עצמה עזרה ליצור את השעמום.</div>

<h3>7. אישור התנהגותי, ומה לומדים מכל הפרק</h3>
<p><b>אישור התנהגותי</b> (סניידר) הוא אותו רעיון של נבואה המגשימה את עצמה, אבל ב<b>יחסים בין שני אנשים</b>: הציפייה שלי ממך גורמת לך להתנהג כך שתאשר אותה.</p>
<div class="ex"><b>הניסוי של סניידר:</b> גברים דיברו בטלפון עם אישה שהם לא ראו. לחלק הראו תמונה של אישה מושכת ולחלק של אישה לא מושכת (התמונה לא הייתה שלה). הגברים שחשבו שהיא מושכת דיברו אליה בחום, והיא <b>החזירה</b> חום. כלומר, היא נשמעה ״מושכת ונעימה״ בגלל איך שדיברו אליה, לא בגלל מי שהיא.</div>
<ul>
<li><b>עוינות:</b> מי שבטוח שהצד השני לא ישתף פעולה מתנהג בחשדנות, וגורם לו באמת לא לשתף פעולה.</li>
<li><b>זוגיות:</b> מי שרואה את בן הזוג באור חיובי (״אידאליזציה״) חווה פחות ריבים.</li>
<li><b>ילדים:</b> בכיתה אחת <b>שכנעו</b> ילדים לשמור על ניקיון, והשלכת אשפה לפח עלתה מ־15% ל־45%, ואז ירדה. בכיתה אחרת <b>אמרו</b> לילדים שוב ושוב ״אתם ילדים נקיים״, והשלכה לפח עלתה ל־<b>80%</b>. כשמתייחסים לילד כאילו כבר יש לו תכונה, הוא מתחיל להתנהג לפיה.</li>
</ul>
<p><b>המסקנה של הפרק כולו:</b></p>
<ul>
<li>ההטיות האלה לא קשורות לטיפשות: <b>אין קשר בין מנת משכל לנטייה להטיות</b>.</li>
<li><b>הרברט סיימון</b>: המוח שלנו מפשט את המציאות בעזרת היריסטיקות (קיצורי דרך). הם מכשילים לפעמים, אבל בלעדיהם לא היינו מסוגלים להחליט כלום מהר.</li>
<li><b>ניסבט ורוס</b>: אפשר ללמד אנשים לטעות פחות, בעזרת תרגול, חשיבה סטטיסטית ודוגמאות מוחשיות.</li>
<li>הגישה הנכונה לחשיבה שלנו: <b>ביקורתיים, אבל לא ציניים</b>. היא עובדת טוב רוב הזמן, וכדאי להכיר את הנקודות שבהן היא נכשלת.</li>
</ul>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הסיפור של הפרק בחמישה משפטים:</b><br>
1. כשמישהו עושה משהו, אנחנו מסבירים את זה באופי שלו (<b>פנימי</b>) או במצב (<b>חיצוני</b>).<br>
2. לפי <b>קלי</b>, הדרך הנכונה להחליט היא לבדוק עקביות, ייחודיות וקונצנזוס.<br>
3. בפועל אנחנו נוטים להאשים את האופי ולשכוח את המצב. זו <b>טעות הייחוס הבסיסית</b>, וקסטרו והחידון מוכיחים שהיא קורית גם כשאנחנו יודעים על המצב.<br>
4. היא קורית כי <b>אנחנו מסבירים במה שאנחנו מסתכלים עליו</b>, וכשמסתכלים על אדם, המצב נעלם.<br>
5. אחרי שגיבשנו דעה, <b>אנחנו מתנהגים לפיה</b>, וזה יכול לגרום לאדם השני להתנהג בדיוק כמו שציפינו (נבואה המגשימה את עצמה, אישור התנהגותי). אבל לרוב הציפיות שלנו פשוט מדויקות.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לקבל תיאור של מקרה ולזהות אם ההסבר בו פנימי או חיצוני.<br>
• לקבל נתונים של עקביות, ייחודיות וקונצנזוס ולהגיד לאיזה ייחוס יגיעו לפי קלי.<br>
• לזהות טעות ייחוס בסיסית בסיפור, ולהסביר אותה בעזרת ניסוי קסטרו או ניסוי החידון.<br>
• להסביר למה הטעות קורית (נקודת מבט, מצלמה, זמן, מודעות עצמית, תרבות).<br>
• להבחין בין נבואה המגשימה את עצמה לבין ציפייה שפשוט הייתה נכונה.<br>
• להתאים שם של חוקר למחקר שלו (הטבלה למטה).</div>
