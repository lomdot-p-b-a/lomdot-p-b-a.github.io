}

  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"למה אנחנו מסבירים התנהגות",blocks:[
  {h:"נועה בשבוע הראשון, ותאוריית הייחוס",html:`${def("על מה הנושא",`למה אנחנו כל הזמן מחפשים סיבות להתנהגות של אחרים, ואיך ההסבר משנה את השיפוט.<br><b>מה נלמד כאן:</b> נועה · תאוריית הייחוס · ייחוס פנימי וחיצוני · הסברים בזוגיות`)}${ex("<b>נועה</b> (דמות בדויה להמחשה) מתחילה שנה א׳. בשבוע הראשון שותפה לדירה לא אומר לה שלום, מרצה אחד נראה לה ״נוקשה ומוזר״, ובמסיבת הפתיחה כולם נראים לה רגועים חוץ ממנה. בכל מצב נועה שואלת את עצמה <b>למה</b>. נלווה אותה לאורך הלומדה.")}${def("תאוריית הייחוס",`${E("Attribution theory")} מתארת איך אנשים מסבירים את התנהגות הזולת: האם הסיבה <b>בתוך</b> האדם או <b>מחוצה לו</b>. חלוץ התחום: <b>פריץ היידר</b> (1958).`)}<div class="tw"><table><tr><th>סוג</th><th>הסיבה נמצאת ב...</th><th>אצל נועה</th></tr><tr><td><b>ייחוס פנימי</b></td><td>תכונות, מזג, עמדות</td><td>״השותף פשוט לא נחמד״</td></tr><tr><td><b>ייחוס חיצוני</b></td><td>המצב, הנסיבות</td><td>״הוא מיהר למבחן״</td></tr></table></div>`,q:"q1"},
  {h:"ההסבר קובע את השיפוט",html:`<p>ההסבר יקבע אם שפיכות דמים היא רצח או הגנה עצמית, ואם חסר בית ״חסר יזמה״ או ״קרבן פיטורים״. אנחנו מחפשים הסברים בעיקר כשקורה משהו <b>שלילי או לא צפוי</b>.</p>${tiles([["people","זוגות מאושרים","מייחסים מעשה שלילי ל<b>מצב</b>: ״איחרה כי היו פקקים״"],["x","זוגות לא מאושרים","מייחסים אותו ל<b>אופי</b>: ״איחרה כי לא אכפת לה ממני״"]])}${def("ייחוס מוטעה",`${E("Misattribution")} ייחוס התנהגות לסיבה הלא נכונה. מחקרים חוזרים: גברים נוטים יותר מנשים לפרש ידידותיות של אישה כ<b>עניין מיני</b>. זה בולט במיוחד כשלגבר יש <b>עמדת כוח</b>, ועלול לתרום להטרדה מינית.`)}`,q:"q3"}
 ]},
 {id:"t2",icon:"id",title:"הסקת תכונות",blocks:[
  {h:"התנהגות יוצאת דופן מלמדת יותר",html:`${def("על מה הנושא",`איך ומתי אנחנו מסיקים מהתנהגות של מישהו על האופי שלו.<br><b>מה נלמד כאן:</b> הסקת התכונה המתאימה · התנהגות צפויה מול חריגה · הסקה ספונטנית`)}${def("תאוריית הסקת התכונה המתאימה",`<b>ג׳ונס ודייוויס</b> (1965) פירטו מתי אנחנו מסיקים מהתנהגות על תכונה. אחד התנאים: התנהגות <b>צפויה או נורמטיבית</b> מלמדת מעט על האדם; התנהגות <b>יוצאת דופן</b> מלמדת הרבה.`)}${ex("אם סימה סרקסטית ב<b>ריאיון עבודה</b>, שבו כולם משתדלים להיות נחמדים, נסיק עליה הרבה. אם היא סרקסטית עם <b>אחיה</b>, נסיק פחות, כי זה נפוץ. כך גם אצל נועה: מרצה שמחייך בשיעור הראשון לא מלמד אותה הרבה; מרצה שצועק על סטודנט כן.")}`,q:"q5"},
  {h:"הסקה ספונטנית",html:`${def("הסקת תכונה באופן ספונטני",`${E("Spontaneous trait inference")} אנחנו מסיקים על תכונות <b>אוטומטית, בלי כוונה ובלי מאמץ</b>.`)}<p>סטודנטים שזכרו את המשפט ״הספרנית נשאה את מצרכיה של הזקנה אל מעבר לכביש״ נזכרו בו הכי טוב עם הרמז <b>״מסייעת״</b>, לא ״ספרים״ ולא ״סלים״. הם הסיקו את התכונה בלי לשים לב. די לראות פנים של אדם <b>עשירית שנייה</b> כדי להסיק על אישיותו.</p>${rem("הסקה ספונטנית היא חלק מהחשיבה האוטומטית: מהירה, אבל לא תמיד נכונה.")}`,q:"q7"}
 ]},
 {id:"t3",icon:"split",title:"המודל של קלי",blocks:[
  {h:"שלושה קריטריונים",html:`${def("על מה הנושא",`איך אנחנו מחליטים בין ייחוס פנימי לחיצוני, לפי הרולד קלי (1973).<br><b>מה נלמד כאן:</b> עקביות · ייחודיות · קונצנזוס`)}<div class="tw"><table><tr><th>קריטריון</th><th>השאלה</th></tr><tr><td><b>עקביות</b></td><td>האם האדם מתנהג כך <b>לעתים קרובות</b> במצב הזה?</td></tr><tr><td><b>ייחודיות</b></td><td>האם הוא מתנהג כך <b>רק</b> במצב הזה, ולא באחרים?</td></tr><tr><td><b>קונצנזוס</b></td><td>האם <b>גם אחרים</b> מתנהגים כך במצב הזה?</td></tr></table></div>${fig("kelley43","אנחנו מחפשים סיבה רק כשהעקביות גבוהה. אז הייחודיות והקונצנזוס מכריעים.")}`,q:"q9"},
  {h:"איך זה עובד בפועל",html:`${ex("מרים מבקרת את יורם <b>שוב ושוב</b> (עקביות גבוהה). אם <b>גם אחרים</b> מבקרים אותו (קונצנזוס גבוה) ומרים מבקרת <b>רק אותו</b> (ייחודיות גבוהה): ייחוס <b>חיצוני</b>, משהו ביורם או במצב. אם <b>רק מרים</b> מבקרת אותו (קונצנזוס נמוך) והיא מבקרת <b>את כולם</b> (ייחודיות נמוכה): ייחוס <b>פנימי</b>, זו מרים.")}${ex("נועה רואה סטודנטית נרדמת בשיעור סטטיסטיקה. אם היא נרדמת <b>בכל השיעורים</b> (ייחודיות נמוכה) ורק היא נרדמת (קונצנזוס נמוך), נועה תסיק ״היא עייפה תמיד״. אם <b>כל הכיתה</b> נרדמת רק <b>בשיעור הזה</b>, הסיבה היא השיעור.")}${rem("ייחודיות וקונצנזוס <b>גבוהים</b> = ייחוס <b>חיצוני</b>. נמוכים = <b>פנימי</b>.")}`,q:"q11"}
 ]},
 {id:"t4",icon:"target",title:"טעות הייחוס הבסיסית",blocks:[
  {h:"ממעיטים בכוח המצב",html:`${def("על מה הנושא",`ההטיה המרכזית בהסברים שלנו להתנהגות של אחרים.<br><b>מה נלמד כאן:</b> הגדרה · ג׳ונס והריס · ניסוי החידון של רוס · דוגמאות`)}${def("טעות הייחוס הבסיסית",`${E("Fundamental attribution error")} הנטייה של צופים <b>להמעיט</b> בהשפעת הסיטואציה על התנהגות של אחרים, ו<b>להפריז</b> בהשפעת התכונות והעמדות שלהם (רוס, 1977). נקראת גם <b>הטיית ההתאמה</b>.`)}<p>מאיירס לימד אותו נושא ב־8:30 בבוקר וב־19:00 בערב: בבוקר שתיקה, בערב חגיגה. ההבדל בין המצבים היה גדול מההבדלים בין האנשים, ובכל זאת התפתה לחשוב שבערב פשוט באו ״טיפוסים מוחצנים״.</p>${ex("סינדרלה מהפרק הראשון: מי שרואה אותה בבית מסיק ״נערה כנועה״, ומתעלם מהאם החורגת.")}`,q:"q13"},
  {h:"הנאומים על קסטרו",html:`<p><b>ג׳ונס והריס</b> (1967) נתנו לסטודנטים לקרוא נאומים בעד או נגד פידל קסטרו. כשנאמר להם שהנואם <b>בחר</b> בעמדה, הם הסיקו שזו עמדתו. אבל גם כשנאמר להם ש<b>המנחה הכתיב</b> את העמדה, הם <b>עדיין</b> הסיקו שהנואם באמת מאמין בה.</p>${rem("גם כשאנחנו <b>יודעים</b> שהמצב קבע את ההתנהגות, אנחנו עדיין מייחסים אותה לאדם.")}<p>זה קורה אפילו כשאנחנו עצמנו יוצרים את המצב: מי שהתבקש להצטנע בשיחה גרם לבן זוגו להצטנע גם, ואז הסיק שלבן הזוג יש ״הערכה עצמית נמוכה״.</p>`,q:"q15"},
  {h:"ניסוי החידון",html:`<p><b>רוס ועמיתיו</b> (1977) חילקו סטודנטים <b>באקראי</b> לשואלים, מתחרים וצופים. השואלים חיברו שאלות קשות מתחום ההתמחות שלהם. כולם ידעו שלשואלים יש יתרון, ובכל זאת <b>המתחרים והצופים</b> (לא השואלים) דירגו את השואלים כידענים הרבה יותר.</p>${tiles([["grad","בחיים","סטודנטים מפריזים בידע של מרצים, ורופאים נתפסים כמומחים גם בנושאים שאינם רפואה"],["brain","מי טועה יותר?","דווקא אנשים <b>אינטליגנטיים</b> ובעלי כישורים חברתיים נוטים יותר לטעות הזו"]])}${ex("במסיבת הפתיחה נועה בטוחה שכולם רגועים ורק היא מתוחה. בפועל כולם מתוחים, וכל אחד עושה אותה טעות לגבי האחרים.")}`,q:"q17"}
 ]},
 {id:"t5",icon:"bulb",title:"למה אנחנו טועים",blocks:[
  {h:"נקודת מבט: מבצע מול צופה",html:`${def("על מה הנושא",`חמישה גורמים שמסבירים את טעות הייחוס, ומה היא גורמת.<br><b>מה נלמד כאן:</b> מבצע וצופה · מצלמה · זמן · מודעות עצמית · תרבות · השלכות`)}${def("אפקט הצופה",`כשאנחנו <b>פועלים</b>, הקשב שלנו מופנה ל<b>סביבה</b>. כשאנחנו <b>צופים</b> במישהו, הקשב מופנה <b>אליו</b>, והסביבה ״נעלמת״ ברקע (ג׳ונס וניסבט).`)}<p>אבל ניתוח של <b>173 מחקרים</b> (מאלה, 2006) הראה שההבדל לא תמיד גדול: על מעשים <b>טובים</b> שלנו אנחנו עושים ייחוס פנימי בדיוק כמו צופה. רק על התנהגות <b>שלילית</b> שלנו אנחנו מייחסים למצב.</p>${ex("בתחנת דלק נראה לנו שהאישה שחוסמת את המשאבה ״חסרת התחשבות״. היא עצמה יודעת שהגיעה כשהמשאבה הראשונה הייתה תפוסה.")}`,q:"q19"},
  {h:"מצלמה, זמן ומודעות עצמית",html:`<div class="tw"><table><tr><th>גורם</th><th>הממצא</th></tr><tr><td><b>זווית המצלמה</b></td><td>הודאה בחקירה שצולמה כשהמצלמה על <b>החשוד</b> נתפסה כנה; כשהמצלמה על <b>החוקר</b>, כפויה (לסיטר). ניו זילנד מחייבת לצלם את שניהם מהצד</td></tr><tr><td><b>הזמן</b></td><td>אחרי <b>שבוע</b> צופים נותנים יותר משקל למצב. יום אחרי בחירות ייחסו את התוצאה למועמדים; שנה אחרי, רק שליש</td></tr><tr><td><b>״האני הקודם״</b></td><td>על עצמנו לפני 5 שנים אנחנו עושים ייחוס פנימי, כאילו זה אדם אחר</td></tr><tr><td><b>מודעות עצמית</b></td><td>מראה, הקלטה או ״שמיעת פעימות הלב״ מפנים את הקשב פנימה, ואז מייחסים <b>לעצמנו</b> יותר אחריות</td></tr></table></div>${rem("אנחנו מוצאים סיבות <b>במקום שבו אנחנו מחפשים אותן</b>. לכן אנחנו רואים את עצמנו ״תלויי מצב״ ואת האחרים ״כאלה וכאלה״.")}`,q:"q21"},
  {h:"תרבות, והשלכות",html:`${def("תרבות",`התרבות ה<b>מערבית</b> מעדיפה הסברים פנימיים (״אתה יכול!״). בתרבויות <b>מזרח אסיה</b> וקולקטיביסטיות רגישים יותר למצב. הודים־הינדים הציעו יותר הסברים מצביים, אמריקנים יותר הסברים של תכונות (מילר, 1984).`)}${ex("בנו של מאיירס כתב ״The gate caught Tom on his sleeve״ (השער תפס את טום), והמורה סימנה ״טעות״. התשובה ה״נכונה״ שמה את הסיבה אצל טום.")}<p><b>השלכות:</b> מי שמייחס עוני ואבטלה ל<b>תכונות</b> (״הם עצלנים״) תומך פחות בעזרה לעניים. מי שמייחס ל<b>מצב</b> תומך יותר.</p>${rem("למה ללמוד טעויות? כי רובן תוצר לוואי של קיצורי דרך מועילים, כי לא תמיד צריך להאשים אנשים בבעיותיהם, וכי מודעות עוזרת: סטודנטים לפסיכולוגיה מסבירים התנהגות פחות פשטני.")}`,q:"q23"}
 ]},
 {id:"t6",icon:"cycle",title:"נבואה המגשימה את עצמה",blocks:[
  {h:"אמונה שיוצרת מציאות",html:`${def("על מה הנושא",`איך הציפיות שלנו משנות את ההתנהגות של אחרים.<br><b>מה נלמד כאן:</b> מרטון · הבורסה · הטיית הנסיין · ציפיות מורים · ציפיות תלמידים`)}${def("נבואה המגשימה את עצמה",`${E("Self-fulfilling prophecy")} אמונה שגורמת לנו להתנהג כך שהיא מתממשת (הסוציולוג <b>רוברט מרטון</b>, 1948).`)}${tiles([["building","בנק","לקוחות שחושבים שהבנק יתמוטט מושכים את כספם, והבנק באמת מתמוטט"],["chart","בורסה","גרנוויל כתב ״מכרו מחר״ (1981), ו־7 בינואר היה יום המסחר העמוס ביותר עד אז"]])}${fig("sfp43","הציפייה משנה את ההתנהגות שלי, וההתנהגות שלי משנה את שלה.")}`,q:"q25"},
  {h:"הטיית הנסיין וציפיות מורים",html:`<p><b>רוזנטל</b>: נסיינים שציפו שמשתתפים ידרגו פנים בתמונות כ״מצליחים״ קיבלו דירוגים גבוהים יותר, עם אותן הוראות ואותן תמונות.</p>${def("רוזנטל וג׳ייקובסון (1968)",`בבית ספר יסודי בסן פרנסיסקו נבחרו ילדים <b>באקראי</b>, ולמורים נאמר שהם ״על סף פריצה אינטלקטואלית״. ציוני המשכל שלהם עלו.`)}${rem("אבל האפקט פחות חזק ממה שחשבו: רק כ־<b>40%</b> מכ־500 הניסויים מצאו אותו. ברוב המקרים ציפיות המורים פשוט <b>מדויקות</b> (ג׳סים). מחקר על 4,300 תלמידים מצא השפעה בשני הכיוונים.")}<p><b>איך מועברות ציפיות?</b> המורה מביטה יותר, מחייכת, מהנהנת, מלמדת יותר חומר, מציבה יעדים קשים, ונותנת יותר זמן לענות. די ב<b>10 שניות</b> של וידאו כדי לזהות על איזה תלמיד המורה מדברת.</p>`,q:"q27"},
  {h:"גם התלמידים משפיעים",html:`<p>סטודנטים שנאמר להם שהמרצה <b>מצוין</b> תפסו אותו כמעניין יותר, ו<b>למדו יותר</b>. מורים שתלמידים העבירו להם ציפיות חיוביות לימדו טוב יותר לפי צופים בלתי תלויים. בתיכון באונטריו, כיתות ששמעו שהמורה החדשה מצוינת הקשיבו יותר וקיבלו ציונים טובים יותר.</p>${ex("נועה שמעה ש״ד״ר לוי משעמם״. אם תיכנס לשיעור עם הציפייה הזו, היא תקשיב פחות, תשאל פחות, וייתכן שגם ד״ר לוי ילמד בפחות התלהבות.")}`,q:"q29"}
 ]},
 {id:"t7",icon:"link",title:"אישור התנהגותי, ומסקנות",blocks:[
  {h:"אנחנו מקבלים מה שציפינו",html:`${def("על מה הנושא",`איך ציפיות פועלות ביחסים יומיומיים, ומה הלקח הכללי של הפרק.<br><b>מה נלמד כאן:</b> אישור התנהגותי · סניידר · זוגיות · ילדים · מסקנות`)}${def("אישור התנהגותי",`${E("Behavioral confirmation")} סוג של נבואה המגשימה את עצמה: הציפיות שלנו גורמות לאחר להתנהג כך שהוא <b>מאשר</b> אותן (סניידר).`)}<p><b>הניסוי הקלסי</b>: גברים שוחחו בטלפון עם אישה שלדעתם הייתה <b>מושכת</b> או לא, לפי תמונה. ה״מושכות״ דיברו בחום רב יותר, כי הגברים דיברו אליהן אחרת.</p>${tiles([["x","עוינות","במשחקים, מי שחושב שהיריב לא ישתף פעולה גורם לו לא לשתף פעולה"],["people","זוגיות","אידאליזציה של בן הזוג מפחיתה קונפליקטים; מי שחושש שלא אוהבים אותו מתרחק"]])}`,q:"q31"},
  {h:"ילדים, ומה לומדים מכל זה",html:`${ex("בכיתה אחת <b>שכנעו</b> את הילדים לשמור על ניקיון: השלכת אשפה לפח עלתה מ־15% ל־45%, <b>זמנית</b>. בכיתה אחרת אמרו לילדים שוב ושוב שהם <b>נקיים ומסודרים</b>: עלייה ל־<b>80%</b>. תגידו לילדים שהם חרוצים, והם עשויים להתנהג בהתאם.")}<ul><li>אין מתאם בין <b>מנת משכל</b> לבין הנטייה להטיות חשיבה.</li><li><b>הרברט סיימון</b>: אנחנו מפשטים את המציאות בעזרת <b>היריסטיקות</b>. הן מכשילות לפעמים, אבל מאפשרות שיפוט מהיר.</li><li><b>ניסבט ורוס</b>: אפשר ללמד אנשים לטעות פחות, בעזרת תרגול, סטטיסטיקה ליומיום ודוגמאות חיות.</li></ul>${rem("פסיכולוגיה חברתית מאוזנת מעריכה גם את <b>הכוחות</b> וגם את <b>החולשות</b> של החשיבה החברתית: ״ביקורתיים אך לא ציניים״.")}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"במה עוסקת תאוריית הייחוס?","a":"איך אנחנו מסבירים את ההתנהגות של אחרים","w":["איך אנחנו זוכרים פרטים על אנשים שפגשנו","איך אנחנו משכנעים אחרים לשנות את דעתם","איך קבוצות מקבלות החלטות משותפות"],"e":"תאוריית הייחוס שואלת אם אנחנו מסבירים התנהגות בסיבה פנימית (האדם) או חיצונית (המצב)."},{"q":"מי נחשב לחלוץ תאוריית הייחוס?","a":"פריץ היידר","w":["רוברט מרטון","הרולד קלי","מרק סניידר"],"e":"היידר (1958) ניתח איך אנשים מסבירים אירועים יומיומיים. קלי פיתח אחריו מודל מפורט."}]},"q2":{"t":"t1","v":[{"q":"השותף של נועה לא אמר לה שלום, והיא חושבת ״הוא פשוט לא נחמד״. איזה ייחוס זה?","a":"ייחוס פנימי","w":["ייחוס חיצוני","ייחוס מוטעה למצב","קונצנזוס גבוה"],"e":"נועה מייחסת את ההתנהגות לתכונה של השותף, כלומר לסיבה שבתוכו."},{"q":"״הוא לא אמר שלום כי מיהר למבחן״. איזה ייחוס זה?","a":"ייחוס חיצוני","w":["ייחוס פנימי","הסקת תכונה ספונטנית","טעות הייחוס הבסיסית"],"e":"הסיבה נמצאת במצב (המבחן), לא באופי."}]},"q3":{"t":"t1","v":[{"q":"איך זוגות מאושרים מסבירים בדרך כלל מעשה שלילי של בן הזוג?","a":"מייחסים אותו למצב","w":["מייחסים אותו לאופי של בן הזוג","מתעלמים ממנו לגמרי ולא מסבירים","מייחסים אותו לעצמם בלבד"],"e":"״היא איחרה כי היו פקקים״. זוגות לא מאושרים מייחסים לאופי: ״לא אכפת לה ממני״."},{"q":"מתי אנחנו מחפשים הסברים להתנהגות במיוחד?","a":"כשקורה משהו שלילי או לא צפוי","w":["כשקורה משהו חיובי וצפוי מראש","רק כשמבקשים מאיתנו להסביר","כשההתנהגות זהה להתנהגות של כולם"],"e":"אירוע שלילי או מפתיע מעורר את השאלה ״למה?״. לכן זוגות מנתחים עוינות יותר מחיבוק."}]},"q4":{"t":"t1","v":[{"q":"מהו ייחוס מוטעה?","a":"ייחוס התנהגות לסיבה הלא נכונה","w":["ייחוס התנהגות למצב במקום לאדם","שכחה של הסיבה האמיתית להתנהגות","ייחוס של התנהגות טובה לעצמנו"],"e":"דוגמה בפרק: פירוש של ידידותיות כהזמנה מינית."},{"q":"מתי ייחוס מוטעה של ידידותיות כעניין מיני סביר במיוחד?","a":"כשלגבר יש עמדת כוח","w":["כשהאישה מבוגרת ממנו בהרבה","כשהשניים מכירים זמן רב","כשהשיחה מתקיימת בכתב"],"e":"מנהל עשוי לפרש התנהגות ידידותית או כנועה של עובדת כמינית. זה עלול לתרום להטרדה."}]},"q5":{"t":"t2","v":[{"q":"לפי ג׳ונס ודייוויס, איזו התנהגות מלמדת הכי הרבה על האופי?","a":"התנהגות יוצאת דופן במצב","w":["התנהגות צפויה ונורמטיבית במצב","התנהגות שכולם עושים באותו מצב","התנהגות שחוזרת אצל כל בני המשפחה"],"e":"התנהגות צפויה לא מבדילה את האדם מאחרים. התנהגות חריגה כן."},{"q":"סימה סרקסטית בריאיון עבודה. למה זה מלמד עליה יותר מסרקזם כלפי אחיה?","a":"כי בריאיון כולם משתדלים להיות נחמדים","w":["בריאיון אנשים תמיד אומרים את האמת","אחים לא מבינים סרקזם כמו זרים","המראיין מכיר אותה טוב יותר מאחיה"],"e":"סרקזם בין אחים נפוץ. בריאיון הוא יוצא דופן, ולכן מעיד יותר על התכונה."}]},"q6":{"t":"t2","v":[{"q":"מה שם התאוריה של ג׳ונס ודייוויס?","a":"תאוריית הסקת התכונה המתאימה","w":["תאוריית הזהות החברתית של טאג׳פל","תאוריית הנבואה המגשימה את עצמה","תאוריית העיבוד הדואלי של המחשבה"],"e":"היא מפרטת באילו תנאים אנשים מסיקים על תכונות מהתנהגות."}]},"q7":{"t":"t2","v":[{"q":"מהי הסקת תכונה באופן ספונטני?","a":"הסקה אוטומטית, בלי כוונה ובלי מאמץ","w":["הסקה שנעשית רק אחרי היכרות ארוכה","הסקה מכוונת שדורשת מאמץ וריכוז","הסקה שנעשית רק על אנשים קרובים"],"e":"אנחנו מסיקים תכונות מיד, גם בלי לשים לב שעשינו זאת."},{"q":"איזה רמז עזר הכי הרבה לזכור את המשפט על הספרנית שעזרה לזקנה?","a":"״מסייעת״","w":["״ספרים״ (רמז לספרנית)","״סלים״ (רמז למצרכים)","״כביש״ (רמז למקום)"],"e":"הסטודנטים הסיקו את התכונה ״מסייעת״ באופן אוטומטי, ולכן היא שימשה רמז טוב."}]},"q8":{"t":"t2","v":[{"q":"כמה זמן צריך לראות פנים כדי להסיק ספונטנית על אישיות?","a":"עשירית שנייה","w":["דקה שלמה","עשר דקות","שיחה של שעה"],"e":"וויליס וטודורוב: עשירית שנייה מספיקה להסקה ספונטנית."}]},"q9":{"t":"t3","v":[{"q":"מהם שלושת הקריטריונים במודל של קלי?","a":"עקביות, ייחודיות וקונצנזוס","w":["עקביות, אמינות ותוקף פנימי","כוונה, יכולת ומאמץ אישי","פנימי, חיצוני ויציב לאורך זמן"],"e":"שלושתם עוזרים להחליט אם לייחס התנהגות לאדם או למצב."},{"q":"מה בודק הקריטריון ״קונצנזוס״?","a":"אם גם אחרים מתנהגים כך במצב הזה","w":["אם האדם מתנהג כך לעתים קרובות","אם האדם מתנהג כך רק במצב הזה","אם ההתנהגות מתאימה לנורמות"],"e":"קונצנזוס = מה אחרים עושים. עקביות = האם זה חוזר. ייחודיות = רק כאן?"}]},"q10":{"t":"t3","v":[{"q":"מה בודק הקריטריון ״ייחודיות״?","a":"אם האדם מתנהג כך רק במצב הזה ולא באחרים","w":["אם גם אנשים אחרים מתנהגים באותו אופן","אם האדם מתנהג כך שוב ושוב באותו מצב","אם ההתנהגות שונה מהציפיות של הצופים"],"e":"ייחודיות גבוהה = ההתנהגות מופיעה רק במצב הזה."}]},"q11":{"t":"t3","v":[{"q":"מרים מבקרת את יורם שוב ושוב, גם אחרים מבקרים אותו, והיא לא מבקרת אף אחד אחר. מה נסיק?","a":"ייחוס חיצוני: הסיבה אינה במרים","w":["ייחוס פנימי: מרים ביקורתית מטבעה","אי אפשר להסיק כלום בלי עוד מידע","ייחוס פנימי: יורם ביקורתי"],"e":"עקביות גבוהה, קונצנזוס גבוה וייחודיות גבוהה = ייחוס חיצוני."},{"q":"רק מרים מבקרת את יורם, והיא מבקרת גם את כולם. מה נסיק?","a":"ייחוס פנימי: זה האופי של מרים","w":["ייחוס חיצוני: משהו ביורם עצמו","ייחוס חיצוני: המצב ביניהם לחוץ","אין מספיק מידע כדי לבצע ייחוס"],"e":"קונצנזוס נמוך וייחודיות נמוכה = הסיבה במרים."}]},"q12":{"t":"t3","v":[{"q":"סטודנטית נרדמת בכל השיעורים, ורק היא. לאן נייחס את העייפות?","a":"לסיבה פנימית","w":["לסיבה חיצונית","לשיעור המסוים","למרצה"],"e":"ייחודיות נמוכה (בכל השיעורים) וקונצנזוס נמוך (רק היא) = ייחוס פנימי."},{"q":"לפי קלי, מתי אנחנו בכלל מחפשים סיבה להתנהגות?","a":"כשהעקביות גבוהה","w":["כשהקונצנזוס נמוך","כשהייחודיות גבוהה","כשההתנהגות חיובית"],"e":"רק כשההתנהגות חוזרת יש מה להסביר. אז הייחודיות והקונצנזוס מכריעים."}]},"q13":{"t":"t4","v":[{"q":"מהי טעות הייחוס הבסיסית?","a":"המעטה בכוח המצב והפרזה בכוח התכונות","w":["הפרזה בכוח המצב והמעטה בכוח התכונות","ייחוס הצלחות לעצמנו וכישלונות למצב","הנטייה לחשוב שאחרים מסכימים איתנו"],"e":"כשאנחנו מסבירים התנהגות של אחרים, אנחנו מזלזלים בהשפעת הסיטואציה."},{"q":"מה שם נוסף לטעות הייחוס הבסיסית?","a":"הטיית ההתאמה","w":["הטיית האישוש","הטיה בשירות העצמי","אפקט הקונצנזוס המדומה"],"e":"הספר מציין שהיא מכונה גם הטיית ההתאמה."}]},"q14":{"t":"t4","v":[{"q":"מאיירס לימד בבוקר ובערב. מה הייתה הטעות שהתפתה לעשות?","a":"לחשוב שבערב באו אנשים מוחצנים יותר","w":["לחשוב שבבוקר הוא לימד טוב יותר","לחשוב שבערב החומר היה קל יותר","לחשוב ששעת השיעור משפיעה על הדיון"],"e":"הוא ידע ששעת השיעור משפיעה, ובכל זאת נטה לייחס את ההבדל לאנשים."}]},"q15":{"t":"t4","v":[{"q":"מה מצאו ג׳ונס והריס בניסוי הנאומים על קסטרו?","a":"גם כשהעמדה הוכתבה, ייחסו אותה לנואם","w":["כשהעמדה הוכתבה, הבינו שזו לא דעת הנואם","רק נאומים בעד קסטרו ייחסו לנואם","הנבדקים לא האמינו לאף נאום"],"e":"גם כשידעו שהמנחה קבע את העמדה, הסיקו שהנואם באמת מאמין בה."},{"q":"מה הניסוי של ג׳ונס והריס מראה על טעות הייחוס?","a":"היא קורית גם כשיודעים שהמצב קבע","w":["היא קורית רק כשאין מידע על המצב","היא נעלמת כשמסבירים לנבדקים את המצב","היא קורית רק בנושאים פוליטיים"],"e":"הידיעה על אילוץ המצב לא ביטלה את הייחוס לנואם."}]},"q16":{"t":"t4","v":[{"q":"נבדק שהתבקש להצטנע גרם לבן זוגו להצטנע. מה הוא הסיק על בן הזוג?","a":"שיש לו הערכה עצמית נמוכה","w":["שגם הוא קיבל הוראה להצטנע","שהוא מחקה אותו בכוונה","שהוא מתנהג כך בגלל המצב"],"e":"גם כשאנחנו עצמנו יוצרים את המצב, אנחנו מייחסים את התגובה לאופי של האחר."}]},"q17":{"t":"t4","v":[{"q":"בניסוי החידון של רוס, מי דירג את השואלים כידענים יותר?","a":"המתחרים והצופים","w":["רק השואלים עצמם","רק הצופים","אף אחד, כולם הבינו את היתרון"],"e":"השואלים עצמם לא טעו. המתחרים והצופים התעלמו מהיתרון של תפקיד השואל."},{"q":"למה לשואלים בניסוי החידון היה יתרון?","a":"הם בחרו שאלות מתחום ההתמחות שלהם","w":["הם נבחרו לתפקיד כי היו חכמים יותר","הם קיבלו את כל התשובות מראש","הם היו סטודנטים ותיקים ומנוסים יותר"],"e":"התפקידים חולקו באקראי. היתרון נבע מהמצב, לא מהידע."}]},"q18":{"t":"t4","v":[{"q":"מי נוטה יותר לטעות הייחוס הבסיסית?","a":"אנשים אינטליגנטיים ומיומנים חברתית","w":["אנשים בעלי אינטליגנציה חברתית נמוכה","רק ילדים צעירים","אנשים שלמדו פסיכולוגיה"],"e":"מחקר מעקב: ההפך מהצפוי. דווקא הם נוטים יותר לטעות."},{"q":"נועה בטוחה שכולם במסיבה רגועים ורק היא מתוחה. מה קורה באמת?","a":"כולם מתוחים, וכולם עושים אותה טעות","w":["היא היחידה שמתוחה במסיבה","כולם רגועים כי הם מכירים זה את זה","היא צודקת כי היא רואה את כולם"],"e":"כל אחד מייחס לאחרים את הרוגע שהם מציגים, ומתעלם מהמצב."}]},"q19":{"t":"t5","v":[{"q":" ["גברים לא הושפעו מהתמונה בכלל","נשים שנחשבו מושכות היו קרירות יותר","הנשים ידעו איזו תמונה הוצגה"],"e":"הגברים דיברו אחרת לפי הציפייה, והנשים הגיבו בהתאם."}]},"q32":{"t":"t7","v":[{"q":"מה קורה כשאנשים חושבים שהיריב במשחק לא ישתף פעולה?","a":"הם גורמים לו לא לשתף פעולה","w":["הם משתפים פעולה יותר כדי לשכנע אותו","הם מפסיקים לשחק","אין לזה השפעה על המשחק"],"e":"עוינות גוררת עוינות, ונוצר מעגל קסמים שלילי."},{"q":"איך אידאליזציה של בן הזוג משפיעה על הקשר?","a":"מפחיתה קונפליקטים ומגבירה שביעות רצון","w":["יוצרת ציפיות גבוהות שמובילות לאכזבה","גורמת לבן הזוג להתרחק עם הזמן","לא משפיעה על הקשר בשום צורה"],"e":"מוריי ועמיתיו: כשאוהבים ומעריכים אותנו, קל לנו להפוך לאדם שרואים בנו."}]},"q33":{"t":"t7","v":[{"q":"מה עבד טוב יותר לשמירה על ניקיון בכיתה?","a":"לומר לילדים שוב ושוב שהם נקיים ומסודרים","w":["לשכנע את הילדים שצריך לשמור על ניקיון","להעניש ילדים שזורקים אשפה","לתת פרס על כל פריט שנזרק לפח"],"e":"שכנוע העלה ל־45% זמנית. ״אתם נקיים״ העלה ל־80%."}]},"q34":{"t":"t7","v":[{"q":"מה הקשר בין מנת משכל לנטייה להטיות חשיבה?","a":"אין מתאם ביניהן","w":["אנשים חכמים כמעט לא טועים","אנשים חכמים טועים הרבה יותר","רק אנשים עם משכל נמוך טועים"],"e":"אדם יכול להיות פיקח מאוד ועדיין לשפוט באופן לקוי."},{"q":"מה טען הרברט סיימון על החשיבה?","a":"אנחנו מפשטים את המציאות בהיריסטיקות","w":["אנחנו מעבדים את כל המידע בצורה מלאה","היריסטיקות תמיד מובילות לטעויות","החשיבה האנושית היא אשליה אחת גדולה"],"e":"היריסטיקות מכשילות לפעמים, אבל מאפשרות שיפוט מהיר ויעיל."}]}};
const SUM=`<h2>סיכום: מאיירס פרק 3 (חלק ב׳) - ייחוס וציפיות</h2>
<div class="key"><b>על מה מדובר?</b> כשאנחנו רואים מישהו מתנהג, אנחנו שואלים <b>למה</b>: בגלל מי שהוא (ייחוס <b>פנימי</b>) או בגלל המצב (ייחוס <b>חיצוני</b>)? החלק הזה מציג איך מחליטים (קלי), את הטעות המרכזית שלנו (<b>טעות הייחוס הבסיסית</b>: ממעיטים בכוח המצב), ולמה היא קורית. בסוף הוא מראה שהאמונות שלנו על אחרים לא רק מתארות אותם אלא גם <b>משנות</b> אותם: <b>נבואה המגשימה את עצמה</b> ו<b>אישור התנהגותי</b>.</div>

<h3>הדוגמה שתלווה אותנו: נועה</h3>
<p><b>נועה</b> (דמות בדויה להמחשה) בשבוע הראשון של שנה א׳. השותף לא אמר לה שלום, מרצה אחד נראה לה ״נוקשה״, ובמסיבת הפתיחה כולם נראים לה רגועים חוץ ממנה. בכל מצב היא שואלת ״למה?״.</p>

<h3>1. תאוריית הייחוס</h3>
<p>תאוריית הייחוס (חלוץ: <b>היידר</b>, 1958) עוסקת באופן שבו אנחנו מסבירים התנהגות של אחרים:</p>
<div class="tw"><table><tr><th>ייחוס</th><th>הסיבה ב...</th><th>אצל נועה</th></tr>
<tr><td><b>פנימי</b></td><td>תכונות, מזג, עמדות</td><td>״השותף לא נחמד״</td></tr>
<tr><td><b>חיצוני</b></td><td>המצב</td><td>״הוא מיהר למבחן״</td></tr></table></div>
<ul>
<li>מחפשים הסבר בעיקר כשקורה משהו <b>שלילי או לא צפוי</b>.</li>
<li>זוגות <b>מאושרים</b> מייחסים מעשה שלילי למצב; <b>לא מאושרים</b>, לאופי.</li>
<li><b>ייחוס מוטעה</b>: סיבה לא נכונה. גברים מפרשים ידידותיות כעניין מיני יותר מנשים, במיוחד כשיש להם <b>עמדת כוח</b>.</li>
</ul>

<h3>2. הסקת תכונות</h3>
<ul>
<li><b>ג׳ונס ודייוויס</b> (הסקת התכונה המתאימה): התנהגות <b>יוצאת דופן</b> מלמדת יותר מהתנהגות צפויה. סרקזם בריאיון עבודה מלמד יותר מסרקזם עם אח.</li>
<li><b>הסקה ספונטנית</b>: אוטומטית ובלי מאמץ. הספרנית שעזרה לזקנה נזכרה עם הרמז ״<b>מסייעת</b>״. די ב<b>עשירית שנייה</b> של פנים.</li>
</ul>

<h3>3. המודל של קלי</h3>
<p>שלושה קריטריונים קובעים אם הייחוס יהיה פנימי או חיצוני:</p>
<div class="tw"><table><tr><th>קריטריון</th><th>השאלה</th></tr>
<tr><td><b>עקביות</b></td><td>האם הוא מתנהג כך <b>תמיד</b> במצב הזה?</td></tr>
<tr><td><b>ייחודיות</b></td><td>האם <b>רק</b> במצב הזה?</td></tr>
<tr><td><b>קונצנזוס</b></td><td>האם <b>גם אחרים</b> מתנהגים כך?</td></tr></table></div>
<p>מחפשים סיבה רק כשה<b>עקביות גבוהה</b>. אז: ייחודיות וקונצנזוס <b>גבוהים</b> = <b>חיצוני</b>; <b>נמוכים</b> = <b>פנימי</b>. סטודנטית שנרדמת בכל השיעורים, ורק היא: פנימי. כל הכיתה נרדמת רק בשיעור הזה: חיצוני.</p>

<h3>4. טעות הייחוס הבסיסית</h3>
<p>הנטייה <b>להמעיט</b> בכוח המצב ו<b>להפריז</b> בכוח התכונות כשמסבירים התנהגות של אחרים (רוס, 1977). שם נוסף: <b>הטיית ההתאמה</b>.</p>
<div class="tw"><table><tr><th>מחקר</th><th>מה נמצא</th></tr>
<tr><td><b>ג׳ונס והריס</b> (1967)</td><td>גם כשידעו ש<b>המנחה הכתיב</b> את העמדה בנאום על קסטרו, ייחסו אותה לנואם</td></tr>
<tr><td><b>ניסוי החידון</b> (רוס, 1977)</td><td>תפקידים חולקו באקראי, ובכל זאת <b>מתחרים וצופים</b> דירגו את השואלים כידענים יותר</td></tr>
<tr><td><b>הצטנעות</b> (באומייסטר)</td><td>מי שגרם לבן זוגו להצטנע הסיק שיש לו הערכה עצמית נמוכה</td></tr></table></div>
<p>דווקא אנשים <b>אינטליגנטיים</b> ובעלי כישורים חברתיים טועים יותר. נועה בטוחה שכולם במסיבה רגועים; בפועל כולם מתוחים, וכולם עושים אותה טעות.</p>

<h3>5. למה אנחנו טועים</h3>
<div class="tw"><table><tr><th>גורם</th><th>הסבר</th></tr>
<tr><td><b>נקודת מבט</b></td><td>כצופים הקשב על <b>האדם</b>; כמבצעים, על <b>המצב</b>. אבל לפי 173 מחקרים (מאלה), ההבדל בולט רק בהתנהגות <b>שלילית</b> שלנו</td></tr>
<tr><td><b>מצלמה</b></td><td>הודאה כשהמצלמה על החשוד נראית כנה; על החוקר, כפויה</td></tr>
<tr><td><b>זמן</b></td><td>עם הזמן נותנים יותר משקל ל<b>מצב</b></td></tr>
<tr><td><b>מודעות עצמית</b></td><td>מראה או הקלטה מפנים קשב פנימה, ואז מייחסים <b>לעצמנו</b> יותר</td></tr>
<tr><td><b>תרבות</b></td><td>מערב מעדיף הסברים פנימיים; מזרח אסיה וקולקטיביסטים רגישים יותר למצב (״The gate caught Tom״)</td></tr></table></div>
<p><b>השלכה:</b> מי שמייחס עוני ל<b>תכונות</b> תומך פחות בעזרה לעניים. אנחנו מוצאים סיבות <b>במקום שבו אנחנו מחפשים</b>.</p>

<h3>6. נבואה המגשימה את עצמה</h3>
<ul>
<li><b>מרטון</b> (1948): אמונה שגורמת להתנהגות שמממשת אותה. בנק שמתמוטט כי כולם מושכים, ״מכרו מחר״ של גרנוויל.</li>
<li><b>רוזנטל</b>: <b>הטיית הנסיין</b>. <b>רוזנטל וג׳ייקובסון</b> (1968): ילדים שנבחרו <b>באקראי</b> כ״פורחים״ השתפרו.</li>
<li>אבל רק כ־<b>40%</b> מכ־500 ניסויים מצאו את האפקט. לרוב ציפיות המורים פשוט <b>מדויקות</b> (ג׳סים).</li>
<li>ציפיות עוברות ב<b>חיוך, יותר חומר ויותר זמן לענות</b>; צופים זיהו זאת תוך <b>10 שניות</b>.</li>
<li>גם <b>תלמידים</b> משפיעים: מי ששמע שהמרצה מצוין למד יותר, והמרצה גם לימד טוב יותר.</li>
</ul>

<h3>7. אישור התנהגותי, ומסקנות</h3>
<ul>
<li><b>סניידר</b>: גברים שחשבו שהם מדברים עם אישה <b>מושכת</b> גרמו לה לדבר בחום רב יותר.</li>
<li>עוינות גוררת עוינות; <b>אידאליזציה</b> של בן הזוג מפחיתה קונפליקטים.</li>
<li>ילדים: שכנוע לשמור על ניקיון העלה ל־45% <b>זמנית</b>; ״אתם נקיים״ העלה ל־<b>80%</b>.</li>
<li>אין מתאם בין <b>משכל</b> להטיות. <b>סיימון</b>: היריסטיקות מפשטות את המציאות. <b>ניסבט ורוס</b>: אפשר ללמד לטעות פחות.</li>
</ul>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>ייחודיות וקונצנזוס גבוהים = ייחוס חיצוני</b>, לא פנימי.</li>
<li><b>טעות הייחוס הבסיסית = המעטה במצב</b>, לא בתכונות.</li>
<li>היא קורית <b>גם כשיודעים</b> על אילוץ המצב (קסטרו).</li>
<li>בניסוי החידון <b>השואלים עצמם לא טעו</b>; המתחרים והצופים כן.</li>
<li><b>אנשים חכמים יותר</b> נוטים יותר לטעות הזו, לא פחות.</li>
<li><b>התנהגות צפויה</b> מלמדת מעט על האדם; <b>חריגה</b> מלמדת הרבה.</li>
<li>אפקט ציפיות המורה <b>קיים אבל חלש</b>; לרוב הציפיות פשוט מדויקות.</li>
<li><b>מרטון</b> טבע את ״נבואה המגשימה״; <b>רוזנטל</b> חקר נסיינים ומורים.</li>
</ul></div>`;
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#social" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){S.done[T[ti].id]={r,n};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#sum"&&typeof SUM!=="undefined")summary();else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
