<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: פרק 3 - מבנה מערכת העצבים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

@keyframes fill{from{transform:scaleX(0)}to{transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

 {id:"t1",icon:"target",title:"מבוא: כיוונים וחתכים",blocks:[
  {h:"ראיין: ניתוח בהכרה",html:`${def("על מה הנושא",`כדי להבין מחקר על המוח צריך להכיר את המבנה שלו ואת השפה שבה מתארים מיקום. הנושא פותח בסיפור ובמושגי הכיוון.<br><b>מה נלמד כאן:</b> CNS ו־PNS · מונחי כיוון · מישורי חתך`)}${def("תיאור מקרה",`ראיין, סטודנט שנה א', סבל מהתקפים אפילפטיים <b>ממוקדים</b> מאז ילדותו, שנגרמו מ<b>רקמת צלקת</b> (כנראה מנזק בלידה) ב<b>אונת הרקה המדיאלית</b> השמאלית. התרופה הפסיקה לעזור, ומינון גבוה פגע בריכוז. הוא נותח <b>בהכרה</b>, בהרדמה מקומית בלבד.`)}${def("למה בהכרה",`המנתח גירה אזורים בזרם חלש כדי לשבש אותם זמנית. גירוי בחלקים מסוימים של אונת הרקה שיבש את היכולת של ראיין <b>להבין דיבור</b>, והמנתח נזהר שלא לפגוע בהם. אחרי הניתוח ההתקפים נעלמו.`)}${tiles([["brain","CNS","מוח ומוח השדרה, מוגנים בעצם ובנוזל המוח והשדרה (CSF)","מערכת העצבים המרכזית: המוח ומוח השדרה. היא מוגנת בעצם (גולגולת וחוליות) ובנוזל שעוטף אותה ובולם זעזועים.","כשנותנים מכה קלה בראש, הנוזל שמסביב למוח בולם חלק מהזעזוע."],["link","PNS","עצבי הגולגולת, עצבי השדרה וגנגליונים היקפיים","מערכת העצבים ההיקפית: כל העצבים שיוצאים מהמוח ומוח השדרה אל הגוף, ומקבצי תאים מחוץ למוח. היא ״מחברת״ את המוח לגוף.","העצב שמעביר את תחושת המגע מכף היד אל מוח השדרה הוא חלק מה־PNS."]])}${rem("המוח מקבל כ־<b>20%</b> מהדם שהלב מזרים, תמיד. הוא לא יכול לאגור גלוקוז ולא לפעול בלי חמצן. <b>גנגליון</b> הוא גוש של גופי תאים מחוץ למוח; בתוך המוח קוראים לזה <b>גרעין</b>.")}`,q:"q1"},
  {h:"מונחי כיוון ומישורי חתך",html:`${def("נויראקסיס",`<mark>נויראקסיס</mark> ${E("neuraxis")}: קו דמיוני לאורך מערכת העצבים המרכזית, מתחתית מוח השדרה עד קדמת המוח. אצל האדם, שעומד זקוף, הוא מתכופף בגזע המוח.`)}${tiles([["target","קדמי / אחורי","קרוב לראש / קרוב לזנב (זנבי, caudal)"],["chart","גבי / גחוני","כלפי הגב או הקודקוד / כלפי הבטן או תחתית הגולגולת"],["split","צידי / מדיאלי","כלפי הצד / כלפי קו האמצע"],["copies","איפסילטרלי / קונטרלטרלי","באותו צד / בצד הנגדי"]])}${tiles([["doc","חתך רוחב (חזיתי)","ניצב לנויראקסיס, כמו פרוסות לחם","חותכים את המוח לרוחב, בניצב לציר הארוך שלו, כמו פרוסות של כיכר לחם.","תמונה שבה רואים את המוח ״מהפנים״, כמו כשמסתכלים על מישהו ישר בעיניים."],["leaf","חתך אופקי","מקביל לקרקע","חותכים את המוח במקביל לקרקע, כאילו מורידים ״מכסה״ מלמעלה.","תמונה שבה רואים את המוח מלמעלה, כמו מבט על ראש מהתקרה."],["id","חתך סגיטלי","מקביל לנויראקסיס וניצב לקרקע. מיד־סגיטלי עובר בדיוק באמצע","חותכים את המוח מקדימה לאחור, בניצב לקרקע. החתך שעובר בדיוק באמצע, בין שני חצאי המוח, נקרא מיד־סגיטלי.","תמונה שבה רואים את המוח מהצד, כמו פרופיל של פנים."]])}${ex(`במוח האדם ״גבי״ הוא <b>למעלה</b>, לכיוון הקודקוד. התלילים העליונים נמצאים <b>מעל</b> התלילים התחתונים, וההמיספרה השמאלית <b>איפסילטרלית</b> ליד שמאל וקונטרלטרלית ליד ימין.`)}`,q:"q3"}

 {id:"t2",icon:"cycle",title:"קרומי המוח וחדרי המוח",blocks:[
  {h:"שלושה קרומים",html:`${tiles([["lock","קרום קשה (dura mater)","החיצוני: קשה, גמיש ואינו נמתח","השכבה החיצונית מבין שלוש שכבות הקרומים שעוטפות את המוח. היא חזקה, ומגינה על המוח כמו מעטפת.","כמו כיסוי עור עבה שעוטף את כל המוח מבחוץ."],["data","קרום הקורים (arachnoid)","האמצעי: רך וספוגי","השכבה האמצעית. היא רכה, ומתחתיה זורם נוזל שמרפד את המוח.","כמו ספוג דק בין המעטפת הקשה למוח עצמו."],["leaf","קרום עדין (pia mater)","הפנימי: דק וצמוד לפני המוח","השכבה הפנימית. היא דקה מאוד, ונצמדת לכל הקפלים של פני המוח.","כמו ניילון נצמד שעוטף כל פינה בפני המוח."]])}${def("החלל התת־קורי",`<mark>החלל התת־קורי</mark> ${E("subarachnoid space")} נמצא בין קרום הקורים לקרום העדין, והוא מלא ב<b>נוזל המוח והשדרה</b> (CSF) שמרפד את המוח.`)}${rem("המוח <b>צף</b> ב־CSF, ולכן משקלו האפקטיבי נמוך בהרבה והוא מוגן מחבטות. ב־PNS יש רק שני קרומים, שמתמזגים לעטיפת העצב.")}`,q:"q5"},
  {h:"החדרים וזרימת ה־CSF",html:`<p>ה־CSF מיוצר ב<b>מקלעת הכורואידית</b> ${E("choroid plexus")}, רקמה עשירה בכלי דם בתוך החדרים, ומתחלף כמה פעמים ביום.</p><ol><li><b>שני חדרים צידיים</b> ${E("lateral ventricles")} בטלאנצפלון</li><li><b>חדר שלישי</b> במרכז הדיאנצפלון</li><li><b>תעלת המוח</b> ${E("cerebral aqueduct")}, צינור צר במוח האמצעי</li><li><b>חדר רביעי</b>, בין המוחון לגשר</li><li>יציאה ל<b>חלל התת־קורי</b></li><li>ספיגה דרך <b>גבשושי קרום הקורים</b> אל <b>הגת הסגיטלית העילית</b>, וריד גדול בקו האמצע</li></ol>${def("הידרוצפלוס חסימתי",`כשמשהו חוסם את הזרימה, למשל גידול שלוחץ על תעלת המוח, ה־CSF ממשיך להיווצר והחדרים מתנפחים. זה <mark>הידרוצפלוס חסימתי</mark> ${E("obstructive hydrocephalus")} (״מים בראש״). אצל תינוקות הראש גדל. הטיפול: צינור ניקוז מחדר צידי לחלל הבטן, עם שסתום לחץ.`)}${ex(`גידול שחוסם את <b>תעלת המוח</b> יגרום להתרחבות החדרים הצידיים והשלישי, שנמצאים <b>לפני</b> החסימה, אבל לא של החדר הרביעי שאחריה.`)}`,q:"q7"}

 {id:"t3",icon:"sprout",title:"התפתחות מערכת העצבים",blocks:[
  {h:"מצינור עצבים לחלוקות המוח",html:`${def("צינור העצבים",`בעובר נוצר מהאקטודרם <b>לוח עצבי</b> שמתקפל ל<mark>צינור עצבים</mark> ${E("neural tube")}, חלול וסגור בקדמתו. החלל שבתוכו יהפוך לחדרי המוח ולתעלה המרכזית של מוח השדרה.`)}${fig("divs")}${rem("בהתחלה יש <b>שלושה</b> חללים: מוח קדמי, אמצעי ואחורי. אחר כך הקדמי מתחלק לטלאנצפלון ולדיאנצפלון, והאחורי למטאנצפלון ולמיילאנצפלון.")}`,q:"q9"},
  {h:"איך נבנה הקורטקס",html:`${def("האזור החדרי",`<mark>האזור החדרי</mark> ${E("ventricular zone, VZ")} הוא שכבת תאים שמרפדת את צינור העצבים מבפנים. יש בה <b>תאי אב</b> שמתחלקים ויוצרים את תאי ה־CNS. מתחתיו <b>האזור התת־חדרי</b> (SVZ).`)}${tiles([["copies","חלוקה סימטרית","תא אב יוצר שני תאי אב. מגדילה את האזור החדרי ולכן את המוח","בתחילת ההתפתחות, כל תא אב מתחלק לשני תאי אב. כך מספרם מוכפל שוב ושוב, והאזור שממנו נוצר המוח גדל. זה אחד ההסברים למוח הגדול של האדם.","כמה סבבים נוספים של חלוקה כזו מספיקים כדי ליצור הרבה יותר תאים, ולכן מוח גדול בהרבה."],["split","חלוקה אסימטרית","תא אב יוצר תא אב ונוירון, שנודד ליעדו"]])}${def("למה למוח שלנו יש קורטקס גדול",`ההבדל בין מינים נובע בעיקר מ<b>משך שלב החלוקות הסימטריות</b>: באדם הוא נמשך שבועות, בעכבר ימים. כל מחזור נוסף מכפיל את מספר תאי האב. שינוי קטן בגנים שקובעים את התזמון מוביל להבדל עצום.`)}${def("נדידה",`<mark>תאי גלייה רדיאליים</mark> ${E("radial glia")} שולחים סיבים מהאזור החדרי עד פני הקורטקס, והנוירונים ״מטפסים״ לאורכם. כל גל חדש <b>חולף על פני הקודם</b>, ולכן השכבות נבנות <b>מבפנים החוצה</b>: האחרונים שנוצרו נמצאים בשכבה החיצונית.`)}`,q:"q11"},
  {h:"אפופטוזה, גיזום ונוירוגנזה בבוגר",html:`${def("אפופטוזה",`<mark>אפופטוזה</mark> ${E("apoptosis")} היא מוות תאי מתוכנת: אות כימי מפעיל מנגנון גנטי שגורם לתא להשמיד את עצמו בלי לפגוע בשכניו. המוח מייצר נוירונים <b>בעודף</b>, ונוירונים שלא יצרו קשר עם תא מטרה לא מקבלים ממנו <b>גורם גדילה</b> (״אות חיים״) ומתים. זה <mark>גיזום</mark> ${E("pruning")}.`)}${def("אחרי הלידה",`ההתפתחות ממשיכה שנים. החוויה מעצבת את המוח: קודם ייצור בעודף, ואחר כך אפופטוזה וגיזום סינפסות לפי למידה וחשיפה לגירויים. הקורטקס הקדם־מצחי מבשיל אחרון.`)}${def("נוירוגנזה במוח הבוגר",`במשך שנים חשבו שבמוח בוגר לא נוצרים נוירונים. היום ידוע שהם נוצרים ב<b>בולבוסי ההרחה</b> וב<b>היפוקמפוס</b>.`)}${rem("״השתמש או אבד״: קשרים שפעילים נשמרים, וקשרים שלא בשימוש נגזמים. לכן הסביבה בילדות משפיעה כל כך על מבנה המוח.")}`,q:"q13"}
 ]},
 {id:"t4",icon:"brain",title:"הקורטקס המוחי",blocks:[
  {h:"אונות, חריצים ורכסים",html:`${def("המיספרות וקורטקס",`המוח הקדמי כולל שתי <b>המיספרות</b> מכוסות ב<mark>קורטקס מוחי</mark> ${E("cerebral cortex")}, שכבה של <b>חומר אפור</b> (גופי תאים) בעובי כ־3 מ״מ. מתחתיו <b>חומר לבן</b>: אקסונים עם מיילין. האזורים שבפנים נקראים <b>תת־קורטיקליים</b>.`)}${def("פיתולים",`<b>מעניות</b> ${E("sulci")} הן קפלים, <b>חריצים</b> ${E("fissures")} הם קפלים עמוקים, ו<b>רכסים</b> ${E("gyri")} הם הבליטות שביניהם. הפיתולים מגדילים מאוד את שטח הקורטקס, ורובו חבוי בתוך הקפלים.`)}${fig("lobes")}${tiles([["hand","אונת המצח","תכנון תנועות וביצוען","האונה הקדמית של המוח. היא אחראית על תכנון תנועות וביצוען.","כשמתכננים להושיט יד לכוס ואז מבצעים את התנועה, אונת המצח פעילה."],["target","אונת הקודקוד","מידע חושי מהגוף ותפיסה מרחבית","האונה שבחלק העליון־אחורי. היא מקבלת מידע חושי מהגוף (מגע, מיקום) ועוסקת בתפיסת המרחב.","היכולת לדעת איפה היד נמצאת ביחס לכוס, בלי להסתכל, קשורה לאונת הקודקוד."],["bulb","אונת הרקה","בעיקר שמיעה","האונה שבצד הראש, ליד האוזניים. היא עוסקת בעיקר בשמיעה.","כששומעים מנגינה ומזהים אותה, אונת הרקה פעילה."],["id","אונת העורף","בעיקר ראייה","האונה שבחלק האחורי של הראש. היא עוסקת בעיקר בראייה.","מכה חזקה בחלק האחורי של הראש יכולה לגרום ״לראות כוכבים״, כי שם נמצאים אזורי הראייה."]])}`,q:"q15"},
  {h:"אזורים ראשוניים ואסוציאטיביים",html:`${tiles([["id","ראייה ראשוני","באונת העורף, לאורך החריץ הדורבני"],["bulb","שמע ראשוני","באונת הרקה, בגדה התחתונה של החריץ הצידי"],["hand","סומטי־סנסורי ראשוני","ברכס שמאחורי המענית המרכזית"],["target","מוטורי ראשוני","ברכס שלפני המענית המרכזית"]])}${rem("גם התחושה וגם התנועה מאורגנות <b>קונטרלטרלית</b>: ההמיספרה השמאלית מקבלת מהצד הימני של הגוף ושולטת בו.")}${def("קורטקס אסוציאטיבי",`סביב כל אזור ראשוני יש <b>קורטקס אסוציאטיבי סנסורי</b> שמעבד את המידע ברמה גבוהה יותר. נזק בו לא גורם לעיוורון, אבל פוגע ב<b>זיהוי</b> (רואים ולא מזהים). לפני הקורטקס המוטורי נמצא ה<b>קורטקס האסוציאטיבי המוטורי</b> שמתכנן תנועות, ולפניו <mark>הקורטקס הקדם־מצחי</mark> ${E("prefrontal cortex")} שעוסק בתכנון ובאסטרטגיה.`)}${ex(`המחצית <b>האחורית</b> של הקורטקס עוסקת בעיקר בתפיסה ובלמידה, והמחצית <b>הקדמית</b> בתכנון ובפעולה. <b>האינסולה</b> היא קורטקס שקוע שמוסתר מתחת לחריץ הצידי.`)}`,q:"q17"},
  {h:"לטרליזציה וכפיס המוח",html:`${tiles([["doc","המיספרה שמאלית","שפה, ניתוח רצפים של אירועים"],["chart","המיספרה ימנית","סינתזה, תפיסה מרחבית, ציור, זיהוי פנים ורגש בקול"]])}${def("כפיס המוח",`<mark>כפיס המוח</mark> ${E("corpus callosum")} הוא אלומה רחבה של אקסונים שמחברת אזורים מקבילים בשתי ההמיספרות. בהדמיית <b>DTI</b> אפשר לראות את האלומות שלו.`)}${def("נאוקורטקס וקורטקס לימבי",`<mark>נאוקורטקס</mark> הוא הקורטקס החדש מבחינה אבולוציונית, ובו האזורים הראשוניים והאסוציאטיביים. <b>הקורטקס הלימבי</b> עתיק יותר ונמצא בשוליים המדיאליים של ההמיספרות.`)}${rem("ההמיספרות לא עובדות לבד: בעזרת כפיס המוח הן משלבות את היכולות שלהן, וזה מה שהניתוח של המוח החצוי מנתק.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"people",title:"מערכת לימבית, גנגליונים בסיסיים ודיאנצפלון",blocks:[
  {h:"המערכת הלימבית",html:`${def("מה היא כוללת",`<mark>המערכת הלימבית</mark> ${E("limbic system")} כוללת את הקורטקס הלימבי (במיוחד <b>רכס החגורה</b> ${E("cingulate gyrus")} מעל כפיס המוח), <b>ההיפוקמפוס</b>, <b>האמיגדלה</b>, הגרעינים הקדמיים של התלמוס, חלקים מההיפותלמוס (<b>הגופים הדדיים</b>) ו<b>הפורניקס</b>, אלומה שמחברת את ההיפוקמפוס לגופים הדדיים.`)}${tiles([["doc","היפוקמפוס","באונת הרקה המדיאלית: למידה וזיכרון","מבנה בחלק הפנימי של אונת הרקה, שחשוב ללמידה וליצירת זיכרונות חדשים.","פגיעה בהיפוקמפוס יכולה לגרום לאדם לזכור את העבר, אבל לא להצליח לזכור דברים חדשים."],["x","אמיגדלה","גרעינים קדמית להיפוקמפוס: רגש, במיוחד פחד","קבוצת גרעינים לפני ההיפוקמפוס, שקשורה לרגשות, ובמיוחד לפחד.","כשרואים פתאום נחש על השביל ונבהלים עוד לפני שחושבים, האמיגדלה מעורבת."],["cycle","רכס החגורה","קורטקס לימבי מעל כפיס המוח","חלק מהקורטקס הלימבי, שנמצא מעל ״הגשר״ שמחבר בין שני חצאי המוח. הוא חלק מהמערכת שקשורה לרגש.","הוא נקרא ״חגורה״ כי הוא מקיף את כפיס המוח כמו חגורה."]])}${rem("פאפז ואחר כך מקלין הציעו שהמערכת הזאת קשורה ל<b>רגשות</b>, ומקלין קשר את האבולוציה שלה להתפתחות הרגש. היום ידוע שההיפוקמפוס חשוב בעיקר ל<b>זיכרון</b>.")}`,q:"q21"},
  {h:"הגנגליונים הבסיסיים",html:`${def("המבנים",`<mark>הגנגליונים הבסיסיים</mark> ${E("basal ganglia")} הם גרעינים תת־קורטיקליים בטלאנצפלון: <b>הגרעין הזנבי</b> ${E("caudate")}, <b>הפוטמן</b> ו<b>הגלובוס פלידוס</b>. הם חלק חשוב מהמערכת <b>המוטורית</b>.`)}${def("מחלת פרקינסון",`רעד, קשיחות, חולשה, שיווי משקל לקוי ו<b>קושי ליזום תנועה</b>. הסיבה: ניוון של נוירונים ש<b>גופי התאים שלהם בחומר השחור</b> במוח האמצעי, ושהאקסונים שלהם מגיעים לגרעין הזנבי ולפוטמן ופולטים שם <b>דופמין</b>.`)}${ex(`זה מסביר את מקרה ה־MPTP (פרק 5): רעלן שהרס את הנוירונים הדופמינרגיים יצר אצל צעירים תסמינים של פרקינסון, והשתלה של נוירונים פולטי דופמין בגרעין הזנבי ובפוטמן שיפרה אותם.`)}`,q:"q23"},
  {h:"תלמוס, היפותלמוס והיפופיזה",html:`${def("הדיאנצפלון",`<mark>הדיאנצפלון</mark> ${E("diencephalon")} מקיף את החדר השלישי וכולל את התלמוס וההיפותלמוס.`)}${def("תלמוס",`גרעינים שמעבירים מידע לקורטקס דרך <b>סיבי השלכה</b> (אקסונים מאזור אחד לאזור אחר). <b>גרעין הברך הצידי</b>: מהרשתית לקורטקס הראייה. <b>גרעין הברך המדיאלי</b>: מהשמיעה לקורטקס השמע. <b>הגרעין הגחוני־צידי</b>: מהמוחון לקורטקס המוטורי.`)}${def("היפותלמוס",`קטן, מתחת לתלמוס, אבל שולט ב<b>מערכת העצבים האוטונומית</b> וב<b>מערכת האנדוקרינית</b>, ובהתנהגויות של הישרדות: לחימה, אכילה, בריחה והזדווגות. תחתיו נמצאת <b>תצלובת הראייה</b>.`)}${tiles([["gear","היפופיזה קדמית","בלוטה אנדוקרינית. ההיפותלמוס שולט בה בהורמונים משחררים שמגיעים בכלי דם"],["link","היפופיזה אחורית","אקסונים של נוירונים מההיפותלמוס פולטים לדם אוקסיטוצין ווזופרסין"]])}${ex(`<b>הורמון משחרר גונדוטרופין</b> מההיפותלמוס גורם להיפופיזה הקדמית להפריש הורמונים שמפעילים את בלוטות המין. ההורמונים של ההיפופיזה האחורית מיוצרים בגופי התאים בהיפותלמוס ומגיעים אליה בתובלה אקסופלזמית.`)}`,q:"q25"}
 ]},
 {id:"t6",icon:"pyramid",title:"המוח האמצעי והמוח האחורי",blocks:[
  {h:"המוח האמצעי",html:`${def("טקטום",`<b>הטקטום</b> (״גג״) הוא החלק הגבי. <b>התלילים העליונים</b> ${E("superior colliculi")} שייכים למערכת הראייה, ו<b>התלילים התחתונים</b> ${E("inferior colliculi")} למערכת השמע ומסובבים את הראש לעבר מקור צליל.`)}${def("טגמנטום",`החלק הגחוני. בו נמצאים:`)}${tiles([["data","תצורת הרשת","רשת של יותר מ־90 גרעינים בליבת גזע המוח: שינה וערות, קשב, טונוס שרירים ותנועה","רשת של עשרות גרעינים במרכז גזע המוח. היא משתתפת בשינה וערות, בקשב, במתח השרירים ובתנועה.","כשרעש פתאומי מעיר אותנו משינה ואנחנו נעשים דרוכים, תצורת הרשת מעורבת."],["cycle","חומר אפור מרכזי (PAG)","סביב תעלת המוח: התנהגויות טיפוסיות למין, כמו לחימה והזדווגות"],["target","הגרעין האדום","קלט מהמוחון והקורטקס המוטורי, ופלט לנוירונים מוטוריים בשדרה","גרעין בגזע המוח שמקבל מידע מהמוחון ומהקורטקס המוטורי, ושולח פקודות לנוירונים מוטוריים במוח השדרה. הוא חלק ממערכת השליטה בתנועה.","הוא עוזר לתרגם ״תוכנית תנועה״ לפעולה של השרירים."],["x","החומר השחור","נוירונים שמייצרים דופמין ומגיעים לגרעין הזנבי ולפוטמן","אזור עם נוירונים שמייצרים דופמין ושולחים אותו לגרעינים שקשורים לתנועה.","כשהנוירונים האלה נהרסים, כמו במחלת פרקינסון, התנועה נעשית איטית ונוקשה."]])}${rem("<b>גזע המוח</b> כולל את המוח האמצעי, הגשר והמוח המוארך, אבל <b>לא</b> את המוחון. באזור הטגמנטום הגחוני יש נוירוני דופמין שקשורים לקשב, להנאה ולהנעה.")}`,q:"q27"},
  {h:"המוחון, הגשר והמוח המוארך",html:`${def("המוחון",`<mark>המוחון</mark> ${E("cerebellum")} נמצא גבית לגשר. יש לו שתי המיספרות מכוסות ב<b>קורטקס מוחוני</b>, ובעומקן <b>גרעינים מוחוניים עמוקים</b> ששולחים את הפלט החוצה. <b>רגליות המוחון</b> (עליונות, אמצעיות ותחתונות) מחברות אותו לגזע המוח.`)}${rem("המוחון מקבל מידע חושי ומידע מהקורטקס המוטורי ו<b>מתאם</b> תנועות. נזק בו פוגע ביכולת לעמוד, ללכת ולבצע תנועות מתואמות. פסנתרן מיומן חב הרבה למוחון שלו.")}${tiles([["link","הגשר (pons)","בליטה בגזע המוח, גחונית למוחון. חלק מתצורת הרשת: שינה ועירור","חלק מגזע המוח, מתחת למוחון. הוא שייך למערכת שמשפיעה על שינה ועל ערנות.","פגיעה באזור הזה יכולה להשפיע על מחזור השינה והערות."],["bulb","המוח המוארך","החלק האחורי ביותר, לפני מוח השדרה. מווסת נשימה, לב וכלי דם וטונוס שרירים","החלק האחורי ביותר של המוח, ממש לפני מוח השדרה. הוא מווסת פעולות חיוניות: נשימה, לב וכלי דם, ומתח שרירים.","פגיעה במוח המוארך מסוכנת מאוד, כי היא יכולה לשבש את הנשימה ואת פעולת הלב."]])}${ex(`פגיעה במוח המוארך מסוכנת במיוחד, כי הוא שולט בתפקודים חיוניים כמו נשימה ופעולת הלב.`)}`,q:"q29"}
 ]},
 {id:"t7",icon:"split",title:"מוח השדרה ומערכת העצבים ההיקפית",blocks:[
  {h:"מוח השדרה",html:`${def("המבנה",`<mark>מוח השדרה</mark> ${E("spinal cord")} עובר בתוך עמוד השדרה, אבל רק עד בערך <b>חוליה L1</b>. מתחת לזה יש צרור של שורשים: <b>זנב הסוס</b> ${E("cauda equina")}. הרדמה בחלל שמעל זנב הסוס, <b>חסימה זנבית</b>, משמשת למשל בלידה.`)}${tiles([["bulb","שורש גבי","סיבים <b>מביאים</b> (סנסוריים). גופי התאים בגנגליון השורש הגבי","דרך השורש הגבי נכנס למוח השדרה מידע מהחושים. גופי התאים של הנוירונים האלה יושבים בגנגליון שליד מוח השדרה.","כשנוגעים בקוץ, המידע על הכאב נכנס למוח השדרה דרך השורש הגבי."],["hand","שורש גחוני","סיבים <b>מוציאים</b> (מוטוריים)","החלק של עצב השדרה שיוצא מהצד הקדמי של מוח השדרה. דרכו יוצאות פקודות מוטוריות אל השרירים.","כשמחליטים להזיז את הרגל, הפקודה יוצאת ממוח השדרה דרך השורש הגחוני אל שרירי הרגל."]])}${def("חתך רוחב",`במוח השדרה <b>החומר האפור בפנים</b> (בצורת פרפר), והחומר הלבן בחוץ: מסילות עולות (סנסוריות) ויורדות (מוטוריות). במוח זה הפוך: הקורטקס האפור בחוץ.`)}${rem("השורשים הגבי והגחוני מתמזגים ל־<b>31 זוגות</b> של עצבי שדרה שיוצאים בין החוליות.")}`,q:"q31"},
  {h:"עצבי הגולגולת ועצבי השדרה",html:`${def("עצבי הגולגולת",`12 זוגות של <mark>עצבי גולגולת</mark> ${E("cranial nerves")} מחוברים ישירות למוח. רובם משרתים את הראש והצוואר. יש סנסוריים, מוטוריים ומעורבים. עצב ההרחה מסתיים ב<b>בולבוס ההרחה</b>.`)}${def("עצב התועה",`<mark>עצב התועה</mark> ${E("vagus")} הוא הגדול שבהם. הוא מגיע לאיברי החזה והבטן ומעביר סיבים של הענף <b>הפרסימפתי</b>.`)}${tiles([["target","אקסון מביא (afferent)","פונה אל ה־CNS ומעביר מידע סנסורי","אקסון שמביא מידע אל מערכת העצבים המרכזית. ״מביא״ אל המרכז.","אקסון שמעביר מהעין למוח את מה שרואים."],["link","אקסון מוציא (efferent)","יוצא מה־CNS ומעביר פקודות לשרירים ולבלוטות","אקסון שמוציא פקודות ממערכת העצבים המרכזית אל הגוף. ״מוציא״ מהמרכז.","אקסון שמעביר מהמוח לשריר את הפקודה להזיז את היד."]])}${ex(`טריק לזיכרון: מביא = <b>A</b>fferent = <b>A</b>rrive, מגיע אל ה־CNS. מוציא = <b>E</b>fferent = <b>E</b>xit, יוצא ממנו.`)}`,q:"q33"},
  {h:"מערכת העצבים האוטונומית",html:`${def("סומטית ואוטונומית",`<b>המערכת הסומטית</b> (הרצונית) מקבלת מידע מאיברי החוש ושולטת בשרירי השלד. <b>המערכת האוטונומית</b> שולטת בשריר חלק, בשריר הלב ובבלוטות.`)}${def("שני נוירונים בדרך",`בדרך לאיבר יש <b>נוירון פרה־גנגליוני</b> (גוף התא ב־CNS) שיוצר סינפסה בגנגליון עם <b>נוירון פוסט־גנגליוני</b>, וזה מגיע לאיבר המטרה.`)}${fig("ans")}${rem("<b>ליבת האדרנל</b>, מעל הכליה, מקבלת סיבים סימפתיים ומפרישה לדם <b>אפינפרין ונוראפינפרין</b>. בשני הענפים, הנוירון הפרה־גנגליוני משתמש באצטילכולין.")}${ex(`דוב מופיע בשביל: הענף <b>הסימפתי</b> מאיץ את הלב ומרחיב אישונים. אחרי ארוחה טובה על הספה: הענף <b>הפרסימפתי</b> מגביר רוק ועיכול ומאט את הלב.`)}`,q:"q35"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"למה ראיין היה ער בזמן הניתוח?","a":"כדי שהמנתח יזהה אזורים חיוניים לדיבור ולא יפגע בהם","w":["כי הרדמה כללית מעוררת התקפים אפילפטיים","כי הניתוח היה קצר מכדי להצדיק הרדמה","כי המנתח רצה לבדוק את הזיכרון שלו בזמן אמת"],"e":"המנתח גירה אזורים בזרם חלש, וכשגירוי שיבש את הבנת הדיבור ידע שהאזור חיוני. כך אפשר להסיר את מוקד ההתקפים ולהשאיר את מה שחשוב."},{"q":"מה גרם להתקפים של ראיין?","a":"רקמת צלקת באונת הרקה המדיאלית השמאלית","w":["גידול שחסם את זרימת נוזל המוח והשדרה","ניוון של נוירונים בחומר השחור","דלקת בקרומי המוח שהתפשטה לקורטקס"],"e":"רקמת הצלקת, כנראה מנזק בלידה, גירתה מדי פעם את האזורים השכנים ועוררה התקף. התקף כזה הוא ירי בלתי נשלט וממושך של נוירונים."}]},
"q2":{"t":"t1","v":[{"q":"איזה חלק מהדם שהלב מזרים מגיע למוח?","a":"כ־20%, וברציפות","w":["כ־5%, ורק בזמן מאמץ מחשבתי","כ־50%, בעיקר בזמן שינה","כמות משתנה, לפי הצורך כמו בשרירים"],"e":"המוח לא יכול לאגור גלוקוז ולא לפעול בלי חמצן, ולכן מקבל כחמישית מהדם בלי הפסקה. שרירים ומערכת העיכול מקבלים כמות משתנה לפי הצורך."},{"q":"מה ההבדל בין גנגליון לגרעין?","a":"שניהם גושי גופי תאים; גנגליון מחוץ למוח, גרעין בתוכו","w":["גנגליון הוא אלומת אקסונים; גרעין הוא גוש גופי תאים","גנגליון נמצא בתוך המוח; גרעין נמצא מחוץ לו","אין הבדל, אלה שני שמות לאותו מבנה בדיוק"],"e":"שניהם קבוצות של גופי תאים, וההבדל הוא במיקום. אלומת אקסונים נקראת עצב, מסילה או שליבה."}]},
"q3":{"t":"t1","v":[{"q":"מה המשמעות של ״גחוני״ במערכת העצבים?","a":"כלפי הבטן או תחתית הגולגולת","w":["כלפי הגב או הקודקוד","כלפי קו האמצע של הגוף","באותו צד של הגוף"],"e":"גחוני הוא ההפך מגבי, שפירושו כלפי הגב או הקודקוד. כלפי קו האמצע נקרא מדיאלי, ובאותו צד איפסילטרלי."},{"q":"ההמיספרה השמאלית שולטת ביד ימין. איך מתארים את הקשר?","a":"קונטרלטרלי","w":["איפסילטרלי","מדיאלי","גבי"],"e":"קונטרלטרלי פירושו בצד הנגדי, ואיפסילטרלי באותו צד. מדיאלי וגבי הם מונחי מיקום, ולא מתארים יחס בין צדדים."}]},
"q4":{"t":"t1","v":[{"q":"איזה חתך מחלק את המוח לשתי מחציות סימטריות?","a":"חתך מיד־סגיטלי","w":["חתך אופקי","חתך רוחב (חזיתי)","חתך אלכסוני"],"e":"חתך סגיטלי מקביל לנויראקסיס וניצב לקרקע, והמיד־סגיטלי עובר בדיוק באמצע. חתך אופקי מקביל לקרקע, וחתך רוחב ניצב לנויראקסיס."},{"q":"איזה חתך מקביל לקרקע?","a":"חתך אופקי","w":["חתך סגיטלי","חתך רוחב","חתך מיד־סגיטלי"],"e":"החתך האופקי עובר במקביל לקרקע. חתך רוחב חותך את המוח כמו פרוסות לחם, וחתך סגיטלי ניצב לקרקע."}]},
"q5":{"t":"t2","v":[{"q":"מה סדר קרומי המוח מבחוץ פנימה?","a":"קרום קשה, קרום הקורים, קרום עדין","w":["קרום עדין, קרום הקורים, קרום קשה","קרום הקורים, קרום קשה, קרום עדין","קרום קשה, קרום עדין, קרום הקורים"],"e":"הקרום הקשה (dura) הוא החיצוני, קרום הקורים באמצע, והקרום העדין (pia) צמוד למוח. בין שני האחרונים נמצא החלל התת־קורי."},{"q":"איפה נמצא החלל התת־קורי?","a":"בין קרום הקורים לקרום העדין","w":["בין הגולגולת לקרום הקשה","בין הקרום הקשה לקרום הקורים","בתוך החדר השלישי"],"e":"החלל התת־קורי נמצא מתחת לקרום הקורים, מעל הקרום העדין, והוא מלא בנוזל המוח והשדרה שמרפד את המוח."}]},
"q6":{"t":"t2","v":[{"q":"מה התפקיד של נוזל המוח והשדרה סביב המוח?","a":"לרפד את המוח ולהגן עליו מחבטות","w":["לספק למוח את רוב הגלוקוז והחמצן","להעביר אותות חשמליים בין ההמיספרות","לייצר את מעטפת המיילין במוח"],"e":"המוח צף ב־CSF, ולכן משקלו האפקטיבי קטן מאוד והוא מוגן ממכות. את החמצן והגלוקוז הוא מקבל מהדם."},{"q":"כמה קרומים עוטפים את העצבים ב־PNS?","a":"שניים, שמתמזגים לעטיפת העצב","w":["שלושה, כמו במוח","אחד בלבד, הקרום הקשה","אין קרומים כלל ב־PNS"],"e":"ב־PNS יש רק את הקרום הקשה ואת הקרום העדין, והם מתמזגים לעטיפה של העצב. קרום הקורים קיים רק סביב ה־CNS."}]},
"q7":{"t":"t2","v":[{"q":"איפה מיוצר נוזל המוח והשדרה?","a":"במקלעת הכורואידית שבחדרי המוח","w":["בגבשושי קרום הקורים","בגת הסגיטלית העילית","בבלוטת ההיפופיזה"],"e":"המקלעת הכורואידית היא רקמה עשירה בכלי דם בתוך החדרים. גבשושי קרום הקורים הם דווקא המקום שבו הנוזל נספג חזרה לדם."},{"q":"מה הסדר הנכון של זרימת ה־CSF?","a":"חדרים צידיים, חדר שלישי, תעלת המוח, חדר רביעי","w":["חדר רביעי, תעלת המוח, חדר שלישי, חדרים צידיים","חדר שלישי, חדרים צידיים, חדר רביעי, תעלת המוח","חדרים צידיים, חדר רביעי, תעלת המוח, חדר שלישי"],"e":"הנוזל זורם מהחדרים הצידיים לשלישי, דרך תעלת המוח לרביעי, ומשם לחלל התת־קורי. הוא נספג בגבשושי קרום הקורים לגת הסגיטלית."}]},
"q8":{"t":"t2","v":[{"q":"גידול חוסם את תעלת המוח. אילו חדרים יתרחבו?","a":"החדרים הצידיים והחדר השלישי","w":["רק החדר הרביעי","כל ארבעת החדרים באותה מידה","אף חדר, כי הנוזל יפסיק להיווצר"],"e":"הנוזל ממשיך להיווצר ונתקע לפני החסימה, ולכן החדרים שלפני תעלת המוח מתרחבים. החדר הרביעי נמצא אחרי החסימה."},{"q":"מה הטיפול בהידרוצפלוס חסימתי אצל תינוק?","a":"צינור ניקוז מחדר צידי לחלל הבטן, עם שסתום לחץ","w":["תרופה שמגבירה את ייצור נוזל המוח","הסרה של המקלעת הכורואידית מכל החדרים","פתיחת הגולגולת כדי לאפשר למוח לגדול"],"e":"הצינור מאפשר לנוזל לצאת ולהיספג בגוף, והשסתום מווסת את הזרימה. הגברת הייצור הייתה מחמירה את המצב."}]},
"q9":{"t":"t3","v":[{"q":"מה מתפתח מהחלל שבתוך צינור העצבים?","a":"חדרי המוח והתעלה המרכזית","w":["הקורטקס המוחי והחומר האפור","קרומי המוח ונוזל המוח והשדרה","כלי הדם שמזינים את המוח"],"e":"צינור העצבים חלול, והחלל שלו הופך למערכת החדרים ולתעלה המרכזית. הדפנות הן שהופכות לרקמת המוח."},{"q":"מאילו חלוקות מורכב המוח הקדמי?","a":"טלאנצפלון ודיאנצפלון","w":["מטאנצפלון ומיילאנצפלון","טקטום וטגמנטום","מזאנצפלון ודיאנצפלון"],"e":"המוח הקדמי מתחלק לטלאנצפלון (קורטקס, גנגליונים בסיסיים, מערכת לימבית) ולדיאנצפלון (תלמוס והיפותלמוס). המוח האחורי מתחלק למטאנצפלון ולמיילאנצפלון."}]},
"q10":{"t":"t3","v":[{"q":"איזה חדר נמצא במרכז הדיאנצפלון?","a":"החדר השלישי","w":["החדר הרביעי","החדרים הצידיים","תעלת המוח"],"e":"החדר השלישי מוקף בתלמוס ובהיפותלמוס. החדרים הצידיים בטלאנצפלון, תעלת המוח במזאנצפלון, והחדר הרביעי במוח האחורי."},{"q":"לאיזו חלוקה שייכים המוחון והגשר?","a":"מטאנצפלון","w":["מיילאנצפלון","מזאנצפלון","דיאנצפלון"],"e":"המטאנצפלון כולל את המוחון ואת הגשר, והמיילאנצפלון את המוח המוארך. המזאנצפלון הוא המוח האמצעי."}]},
"q11":{"t":"t3","v":[{"q":"מה ההבדל בין חלוקה סימטרית לאסימטרית של תאי אב?","a":"סימטרית יוצרת שני תאי אב; אסימטרית יוצרת תא אב ונוירון","w":["סימטרית יוצרת שני נוירונים; אסימטרית שני תאי אב","סימטרית יוצרת תאי גלייה; אסימטרית יוצרת נוירונים","סימטרית מתרחשת אחרי הלידה; אסימטרית לפניה"],"e":"חלוקה סימטרית מגדילה את מאגר תאי האב, ואסימטרית מייצרת נוירונים שנודדים ליעדם. לכן משך השלב הסימטרי קובע כמה גדול יהיה המוח."},{"q":"למה לבני אדם יש קורטקס גדול בהרבה מלעכבר?","a":"כי שלב החלוקות הסימטריות אצלנו נמשך זמן רב יותר","w":["כי הנוירונים שלנו גדולים יותר מאלה של העכבר","כי אצלנו כמעט לא מתרחשת אפופטוזה","כי אצלנו הנוירונים נוצרים גם אחרי הלידה"],"e":"כל מחזור נוסף של חלוקה סימטרית מכפיל את תאי האב, ולכן שבועות לעומת ימים יוצרים הבדל עצום. אפופטוזה מתרחשת גם אצלנו."}]},
"q12":{"t":"t3","v":[{"q":"מה תפקידם של תאי הגלייה הרדיאליים?","a":"מסלול לנדידת נוירונים לקורטקס","w":["לייצר מיילין סביב אקסונים חדשים","לפרק נוירונים עודפים בתהליך הגיזום","לייצר את נוזל המוח והשדרה"],"e":"הסיבים שלהם נמתחים מהאזור החדרי עד פני הקורטקס, והנוירונים ״מטפסים״ עליהם. מיילין מייצרים האוליגו־דנדרוציטים."},{"q":"באיזה סדר נבנות שכבות הקורטקס?","a":"מבפנים החוצה: הנוירונים האחרונים בשכבה החיצונית","w":["מבחוץ פנימה: הנוירונים הראשונים בשכבה החיצונית","כל השכבות נבנות באותו זמן","בסדר אקראי שנקבע לפי הניסיון"],"e":"כל גל חדש של נוירונים חולף על פני הגל הקודם, ולכן הנוירונים שנוצרו אחרונים נמצאים קרוב לפני הקורטקס."}]},
"q13":{"t":"t3","v":[{"q":"מהי אפופטוזה?","a":"מוות תאי מתוכנת שמופעל באות כימי","w":["מוות של תאים בגלל פציעה או דלקת","יצירה של נוירונים חדשים במוח הבוגר","נדידה של נוירונים לאורך גלייה רדיאלית"],"e":"באפופטוזה אות כימי מפעיל מנגנון גנטי והתא משמיד את עצמו בלי לפגוע בשכניו. יצירת נוירונים חדשים היא נוירוגנזה."},{"q":"למה נוירונים מסוימים מתים במהלך ההתפתחות?","a":"לא יצרו קשר עם תא מטרה ולא קיבלו אות חיים","w":["הם נדדו מהר מדי ועקפו את היעד שלהם","הם נוצרו בחלוקה סימטרית ולא אסימטרית","הם קיבלו יותר מדי גורם גדילה מתאי המטרה"],"e":"המוח מייצר נוירונים בעודף, ורק אלה שמצאו מקום ליצור סינפסות מקבלים את ״אות החיים״. השאר מתים בגיזום."}]},
"q14":{"t":"t3","v":[{"q":"איפה מתרחשת נוירוגנזה במוח הבוגר?","a":"בבולבוסי ההרחה ובהיפוקמפוס","w":["בקורטקס המוטורי ובמוחון","בתלמוס ובהיפותלמוס","בכל אזורי המוח באותה מידה"],"e":"מחקרים הראו שנוירונים חדשים נוצרים במוח הבוגר בבולבוסי ההרחה ובהיפוקמפוס, בניגוד לדעה הישנה שזה לא קורה בכלל."},{"q":"מה מעצב את המוח אחרי הלידה, לפי הפרק?","a":"ייצור בעודף ואחריו גיזום לפי הניסיון","w":["רק הגנים, בלי השפעה של הסביבה","רק נוירוגנזה מהירה בכל אזורי המוח","שום דבר, המוח מוכן כבר בלידה"],"e":"הניסיון משפיע על אילו סינפסות יישמרו: קשרים פעילים נשמרים ואחרים נגזמים. ההתפתחות ממשיכה שנים, והקורטקס הקדם־מצחי מבשיל אחרון."}]},
"q15":{"t":"t4","v":[{"q":"ממה מורכב החומר האפור של הקורטקס?","a":"בעיקר מגופי תאים","w":["בעיקר מאקסונים עם מיילין","בעיקר מתאי שוואן","בעיקר מנוזל המוח והשדרה"],"e":"החומר האפור הוא בעיקר גופי תאים, והחומר הלבן שמתחתיו הוא אקסונים עם מיילין, שצבעו לבן בגלל השומן."},{"q":"מה התפקיד של הפיתולים בקורטקס?","a":"להגדיל את שטח הפנים של הקורטקס","w":["להפריד בין שתי ההמיספרות","לייצר נוזל מוח ושדרה","להגן על המוח מפני חבטות"],"e":"המעניות, החריצים והרכסים מאפשרים להכניס הרבה קורטקס לגולגולת, ורובו חבוי בתוך הקפלים. ההגנה מחבטות היא תפקיד ה־CSF."}]},
"q16":{"t":"t4","v":[{"q":"איזו אונה עוסקת בעיקר במידע חושי מהגוף ובתפיסה מרחבית?","a":"אונת הקודקוד","w":["אונת המצח","אונת הרקה","אונת העורף"],"e":"אונת הקודקוד נמצאת מאחורי המענית המרכזית. אונת המצח עוסקת בתכנון ובתנועה, הרקה בשמיעה, והעורף בראייה."},{"q":"מה מפריד בין אונת המצח לאונת הקודקוד?","a":"המענית המרכזית","w":["החריץ הצידי","החריץ הדורבני","כפיס המוח"],"e":"המענית המרכזית מפרידה בין המצח לקודקוד: לפניה הקורטקס המוטורי ואחריה הסומטי־סנסורי. החריץ הצידי מפריד את אונת הרקה."}]},
"q17":{"t":"t4","v":[{"q":"איפה נמצא הקורטקס המוטורי הראשוני?","a":"ברכס שלפני המענית המרכזית, באונת המצח","w":["ברכס שמאחורי המענית המרכזית, באונת הקודקוד","לאורך החריץ הדורבני, באונת העורף","בגדה התחתונה של החריץ הצידי"],"e":"הקורטקס המוטורי נמצא מלפני המענית המרכזית, והסומטי־סנסורי מאחוריה. החריץ הדורבני שייך לראייה, והחריץ הצידי לשמיעה."},{"q":"איפה נמצא קורטקס הראייה הראשוני?","a":"באונת העורף, לאורך החריץ הדורבני","w":["באונת הרקה, ליד החריץ הצידי","באונת הקודקוד, מאחורי המענית המרכזית","באונת המצח, לפני הקורטקס המוטורי"],"e":"רוב קורטקס הראייה הראשוני נמצא בגדות החריץ הדורבני באונת העורף. קורטקס השמע נמצא באונת הרקה."}]},
"q18":{"t":"t4","v":[{"q":"אדם רואה חפץ היטב אבל לא מזהה מה הוא. איפה הנזק הסביר?","a":"בקורטקס האסוציאטיבי החזותי","w":["בקורטקס הראייה הראשוני","בעצב הראייה","בקורטקס המוטורי"],"e":"נזק לאזור הראשוני גורם לעיוורון בחלק משדה הראייה, ונזק לאסוציאטיבי פוגע בזיהוי. אם הוא רואה ולא מזהה, הקלט מגיע אבל העיבוד הגבוה נפגע."},{"q":"מה תפקיד הקורטקס הקדם־מצחי?","a":"תכנון ואסטרטגיה","w":["שליטה ישירה בשרירי השלד","עיבוד ראשוני של מידע שמיעתי","זיהוי של מגע וכאב בעור"],"e":"הקורטקס הקדם־מצחי נמצא בקדמת אונת המצח ועוסק בתכנון. שליטה ישירה בשרירים היא תפקיד הקורטקס המוטורי הראשוני."}]},
"q19":{"t":"t4","v":[{"q":"איזו יכולת קשורה בעיקר להמיספרה הימנית?","a":"תפיסה מרחבית וזיהוי פנים","w":["הפקת דיבור","ניתוח רצפים של אירועים","קריאה וכתיבה"],"e":"ההמיספרה הימנית מתמחה בסינתזה, בתפיסה מרחבית, בזיהוי פנים ובזיהוי רגש בקול. השפה וניתוח רצפים קשורים בעיקר לשמאלית."},{"q":"מה מראה הדמיית DTI של כפיס המוח?","a":"אלומות אקסונים בין שתי ההמיספרות","w":["את רמת הפעילות של כל המיספרה בזמן משימה","את גופי התאים בקורטקס","את זרימת הדם בכלי הדם במוח"],"e":"DTI מראה אלומות של אקסונים עטופים במיילין לפי כיוון התנועה של מים. הוא לא מודד פעילות, כמו fMRI, ולא זרימת דם."}]},
"q20":{"t":"t4","v":[{"q":"מה ההבדל בין נאוקורטקס לקורטקס לימבי?","a":"נאוקורטקס חדש; הלימבי עתיק ומדיאלי","w":["הנאוקורטקס נמצא רק בהמיספרה השמאלית","הלימבי מכיל את האזורים הסנסוריים הראשוניים","אין הבדל, אלה שמות לאותו קורטקס"],"e":"הנאוקורטקס כולל את האזורים הראשוניים והאסוציאטיביים. הקורטקס הלימבי עתיק יותר ושייך למערכת הלימבית, כמו רכס החגורה."},{"q":"מהי האינסולה?","a":"קורטקס שקוע שמוסתר מתחת לחריץ הצידי","w":["החלק האחורי ביותר של אונת העורף","אלומת אקסונים שמחברת בין ההמיספרות","גרעין בתוך התלמוס"],"e":"האינסולה מכוסה בחלקים של אונות המצח והרקה, ולכן לא נראית מבחוץ. אלומה שמחברת בין ההמיספרות היא כפיס המוח."}]},
"q21":{"t":"t5","v":[{"q":"איזה מבנה במערכת הלימבית קשור בעיקר ללמידה ולזיכרון?","a":"ההיפוקמפוס","w":["האמיגדלה","רכס החגורה","הגופים הדדיים"],"e":"ההיפוקמפוס, באונת הרקה המדיאלית, חשוב ללמידה ולזיכרון. האמיגדלה קשורה לרגש, ובמיוחד לפחד."},{"q":"מה מחבר את ההיפוקמפוס לגופים הדדיים?","a":"הפורניקס","w":["כפיס המוח","רגליות המוחון","תעלת המוח"],"e":"הפורניקס הוא אלומת אקסונים שיוצאת מההיפוקמפוס אל הגופים הדדיים שבהיפותלמוס. כפיס המוח מחבר בין ההמיספרות."}]},
"q22":{"t":"t5","v":[{"q":"איפה נמצא רכס החגורה?","a":"מעל כפיס המוח, לאורך הדופן המדיאלית","w":["בתוך אונת הרקה, ליד האמיגדלה","בגזע המוח, סביב תעלת המוח","בבסיס המוח, מאחורי ההיפותלמוס"],"e":"רכס החגורה הוא קורטקס לימבי שעוטף את כפיס המוח מלמעלה. ההיפוקמפוס והאמיגדלה נמצאים באונת הרקה."},{"q":"מה הציע מקלין לגבי המערכת הלימבית?","a":"שהאבולוציה שלה קשורה להתפתחות הרגשות","w":["שהיא אחראית בעיקר לתנועה רצונית","שהיא קיימת רק אצל בני אדם","שהיא מעבדת בעיקר מידע חזותי"],"e":"פאפז ומקלין קשרו את המערכת לרגש. היום ידוע שחלק מהמבנים, כמו ההיפוקמפוס, חשובים בעיקר לזיכרון."}]},
"q23":{"t":"t5","v":[{"q":"אילו מבנים שייכים לגנגליונים הבסיסיים?","a":"הגרעין הזנבי, הפוטמן והגלובוס פלידוס","w":["ההיפוקמפוס, האמיגדלה ורכס החגורה","התלמוס, ההיפותלמוס וההיפופיזה","התלילים העליונים והתחתונים"],"e":"שלושת הגרעינים התת־קורטיקליים האלה בטלאנצפלון הם חלק חשוב מהמערכת המוטורית. ההיפוקמפוס והאמיגדלה שייכים למערכת הלימבית."},{"q":"מה תפקידם העיקרי של הגנגליונים הבסיסיים?","a":"שליטה בתנועה","w":["עיבוד מידע שמיעתי","יצירת זיכרונות חדשים","ויסות של הטמפרטורה והרעב"],"e":"הגנגליונים הבסיסיים הם רכיב מוטורי, ולכן נזק בהם גורם להפרעות תנועה כמו פרקינסון. ויסות טמפרטורה ורעב הוא תפקיד ההיפותלמוס."}]},
"q24":{"t":"t5","v":[{"q":"מה גורם למחלת פרקינסון?","a":"ניוון של נוירוני דופמין בחומר השחור","w":["ניוון של נוירונים בהיפוקמפוס","נזק לקורטקס המוטורי הראשוני","חסימה של זרימת נוזל המוח והשדרה"],"e":"הנוירונים בחומר השחור שולחים אקסונים לגרעין הזנבי ולפוטמן ופולטים שם דופמין. כשהם מתנוונים, השליטה בתנועה נפגעת."},{"q":"איפה נמצאים גופי התאים שמתנוונים בפרקינסון?","a":"בחומר השחור, במוח האמצעי","w":["בגרעין הזנבי, בטלאנצפלון","בתלמוס, בדיאנצפלון","במוחון, במוח האחורי"],"e":"גופי התאים בחומר השחור, והאקסונים שלהם מגיעים לגנגליונים הבסיסיים. לכן המחלה פוגעת בתפקוד הגנגליונים אף שהם עצמם לא מתנוונים."}]},
"q25":{"t":"t5","v":[{"q":"מה תפקיד גרעין הברך הצידי בתלמוס?","a":"להעביר מידע מהרשתית לקורטקס הראייה","w":["להעביר מידע שמיעתי לקורטקס השמע","להעביר מידע מהמוחון לקורטקס המוטורי","לווסת את ההפרשה של ההיפופיזה"],"e":"גרעין הברך הצידי הוא תחנת הממסר של הראייה. השמיעה עוברת דרך גרעין הברך המדיאלי, והמידע מהמוחון דרך הגרעין הגחוני־צידי."},{"q":"איזה גרעין בתלמוס מעביר מידע מהמוחון לקורטקס המוטורי?","a":"הגרעין הגחוני־צידי","w":["גרעין הברך הצידי","גרעין הברך המדיאלי","הגרעין האדום"],"e":"הגרעין הגחוני־צידי מקבל קלט מהמוחון ושולח אקסונים לקורטקס המוטורי הראשוני. הגרעין האדום נמצא במוח האמצעי."}]},
"q26":{"t":"t5","v":[{"q":"איך שולט ההיפותלמוס בהיפופיזה הקדמית?","a":"באמצעות הורמונים משחררים שמגיעים אליה בכלי דם","w":["באמצעות אקסונים שמסתיימים בתוכה ופולטים הורמונים","באמצעות עצב התועה","באמצעות נוזל המוח והשדרה"],"e":"ההיפופיזה הקדמית היא בלוטה, וההיפותלמוס שולט בה בהורמונים שמגיעים בכלי דם. אקסונים שמסתיימים בבלוטה מאפיינים את ההיפופיזה האחורית."},{"q":"מה נכון לגבי ההיפופיזה האחורית?","a":"אקסונים מההיפותלמוס פולטים בה הורמונים לדם","w":["היא מייצרת בעצמה את רוב ההורמונים שלה","היא נשלטת על ידי הורמונים משחררים בדם","היא חלק מהגנגליונים הבסיסיים"],"e":"ההורמונים, כמו אוקסיטוצין ווזופרסין, מיוצרים בגופי תאים בהיפותלמוס ומובלים באקסונים להיפופיזה האחורית, ושם נפלטים לדם."}]},
"q27":{"t":"t6","v":[{"q":"מה תפקיד התלילים התחתונים?","a":"חלק ממערכת השמע; מסובבים את הראש לעבר צליל","w":["חלק ממערכת הראייה; מגיבים לגירויים נעים","ויסות של שינה וערות","תיאום של תנועות עדינות"],"e":"התלילים התחתונים שייכים לשמיעה, והעליונים לראייה. שינה וערות קשורים לתצורת הרשת, ותיאום תנועות למוחון."},{"q":"איזה מבנה במוח האמצעי קשור לשינה, לערות ולקשב?","a":"תצורת הרשת","w":["הגרעין האדום","התלילים העליונים","החומר השחור"],"e":"תצורת הרשת היא רשת של יותר מ־90 גרעינים בליבת גזע המוח, ויש לה תפקיד בשינה וערות, קשב, טונוס שרירים ותנועה."}]},
"q28":{"t":"t6","v":[{"q":"מה כולל גזע המוח?","a":"את המוח האמצעי, הגשר והמוח המוארך","w":["את המוחון, הגשר והמוח המוארך","את התלמוס, ההיפותלמוס והמוח האמצעי","את מוח השדרה והמוח המוארך בלבד"],"e":"גזע המוח מתחיל במוח האמצעי ונמשך עד המוח המוארך. המוחון לא נכלל בו, אף שהוא מחובר אליו ברגליות."},{"q":"איפה נמצא החומר האפור המרכזי (PAG)?","a":"בטגמנטום, סביב תעלת המוח","w":["בטקטום, מעל התלילים העליונים","בקורטקס, סביב החריץ הצידי","במוח השדרה, סביב התעלה המרכזית"],"e":"ה־PAG מקיף את תעלת המוח במוח האמצעי, ויש בו מעגלים להתנהגויות טיפוסיות למין, כמו לחימה והזדווגות."}]},
"q29":{"t":"t6","v":[{"q":"מה יקרה בעקבות נזק למוחון?","a":"קושי בעמידה, בהליכה ובתנועות מתואמות","w":["אובדן של הזיכרון לטווח ארוך","עיוורון בחצי משדה הראייה","הפסקה של הנשימה ופעולת הלב"],"e":"המוחון מתאם תנועות בעזרת מידע חושי ומוטורי. אובדן זיכרון קשור להיפוקמפוס, והפסקת נשימה לנזק במוח המוארך."},{"q":"איך יוצא הפלט מהמוחון לחלקים אחרים של המוח?","a":"דרך הגרעינים המוחוניים העמוקים","w":["ישירות מהקורטקס המוחוני לשרירים","דרך כפיס המוח","דרך החדר הרביעי"],"e":"הקורטקס המוחוני שולח השלכות לגרעינים העמוקים, ואלה שולחים את הפלט החוצה דרך רגליות המוחון."}]},
"q30":{"t":"t6","v":[{"q":"למה נזק למוח המוארך מסכן חיים?","a":"כי הוא מווסת נשימה, פעולת לב וכלי דם","w":["כי הוא מייצר את רוב נוזל המוח והשדרה","כי הוא מכיל את כל הזיכרונות לטווח ארוך","כי הוא מחבר בין שתי ההמיספרות"],"e":"המוח המוארך הוא החלק האחורי ביותר של המוח, ושולט בתפקודים חיוניים. את ה־CSF מייצרת המקלעת הכורואידית."},{"q":"איפה נמצא הגשר ביחס למוחון?","a":"גחונית למוחון","w":["גבית למוחון","בתוך המוחון","קדמית לטלאנצפלון"],"e":"המוחון נמצא גבית לגשר, כלומר הגשר מתחתיו בצד הבטן. רגליות המוחון מחברות ביניהם."}]},
"q31":{"t":"t7","v":[{"q":"איזה שורש של עצב השדרה מכיל סיבים סנסוריים?","a":"השורש הגבי","w":["השורש הגחוני","שני השורשים באותה מידה","אף אחד מהם, הם מוטוריים בלבד"],"e":"השורש הגבי מביא מידע סנסורי, וגופי התאים שלו נמצאים בגנגליון השורש הגבי. השורש הגחוני מכיל סיבים מוטוריים."},{"q":"חתכו את השורש הגחוני של עצב שדרה. מה צפוי?","a":"שיתוק השרירים שלו, עם תחושה תקינה","w":["אובדן תחושה, אבל תנועה תקינה","אובדן של תחושה ושל תנועה","אין השפעה, כי השורש הגבי מפצה"],"e":"השורש הגחוני נושא את הפקודות המוטוריות, ולכן השרירים יפסיקו לזוז. המידע הסנסורי עובר בשורש הגבי ולא ייפגע."}]},
"q32":{"t":"t7","v":[{"q":"עד איפה מגיע מוח השדרה בתוך עמוד השדרה?","a":"עד בערך חוליה L1, ומתחת לזה זנב הסוס","w":["עד עצם הזנב, לכל אורך עמוד השדרה","עד אמצע הצוואר בלבד","עד החוליה הראשונה של אזור החזה"],"e":"מוח השדרה קצר מעמוד השדרה ומסתיים ב־L1. מתחת יש צרור שורשים, וזה מאפשר הרדמה בחסימה זנבית בלי לפגוע במוח השדרה."},{"q":"איך מסודר החומר האפור במוח השדרה?","a":"בפנים, בצורת פרפר, והחומר הלבן מסביבו","w":["בחוץ, כמו בקורטקס, והחומר הלבן בפנים","מפוזר באופן אחיד בכל החתך","רק בצד הגבי של מוח השדרה"],"e":"במוח השדרה הסידור הפוך לקורטקס: החומר האפור בפנים, והמסילות העולות והיורדות בחומר הלבן שמסביב."}]},
"q33":{"t":"t7","v":[{"q":"מה מאפיין את עצב התועה (vagus)?","a":"הגדול בעצבי הגולגולת; סיבים פרסימפתיים לגוף","w":["עצב השדרה הגדול; מעביר מידע מהרגליים","עצב הגולגולת הקטן; שולט בתנועות העיניים","עצב שדרה שמעביר סיבים סימפתיים ללב"],"e":"עצב התועה מחובר למוח ומגיע עד איברי החזה והבטן. הוא נושא סיבים של הענף הפרסימפתי, ולא של הסימפתי."},{"q":"מה מגדיר אקסון מוציא (efferent)?","a":"יוצא מה־CNS עם פקודות לשרירים ולבלוטות","w":["נכנס למערכת העצבים המרכזית ומעביר מידע סנסורי","מחבר בין שני אזורים בתוך המוח","נמצא רק בשורש הגבי של עצבי השדרה"],"e":"מוציא = Exit, יוצא מה־CNS. אקסון מביא (Afferent = Arrive) מגיע אל ה־CNS עם מידע סנסורי."}]},
"q34":{"t":"t7","v":[{"q":"כמה זוגות של עצבי גולגולת יש?","a":"12","w":["31","8","24"],"e":"יש 12 זוגות של עצבי גולגולת שמחוברים ישירות למוח. 31 הוא מספר הזוגות של עצבי השדרה."},{"q":"כמה זוגות של עצבי שדרה יש?","a":"31","w":["12","24","50"],"e":"השורש הגבי והגחוני מתמזגים ל־31 זוגות של עצבי שדרה שיוצאים בין החוליות. 12 הוא מספר עצבי הגולגולת."}]},
"q35":{"t":"t7","v":[{"q":"איזה ענף פעיל כשאדם רואה פתאום דוב?","a":"הסימפתי: מאיץ את הלב ומרחיב אישונים","w":["הפרסימפתי: מאט את הלב ומגביר עיכול","הסומטי: מרפה את שרירי השלד","שני הענפים האוטונומיים פעילים באותה מידה"],"e":"הענף הסימפתי מכין את הגוף לעירור ולהוצאת אנרגיה. הפרסימפתי פועל ברגיעה, ומגביר עיכול ושימור אנרגיה."},{"q":"איפה נמצאים הגנגליונים של הענף הפרסימפתי?","a":"קרוב לאיברי המטרה","w":["בשרשרת לאורך עמוד השדרה","בתוך מוח השדרה","בתוך ליבת האדרנל"],"e":"הגנגליונים הפרסימפתיים נמצאים ליד האיברים, ולכן הנוירון הפרה־גנגליוני ארוך. הגנגליונים הסימפתיים יוצרים שרשרת ליד עמוד השדרה."}]},
"q36":{"t":"t7","v":[{"q":"מה תפקיד ליבת האדרנל?","a":"מפרישה לדם אפינפרין ונוראפינפרין בפקודה סימפתית","w":["מקבלת סיבים פרסימפתיים ומפרישה אצטילכולין","מייצרת את נוזל המוח והשדרה","שולטת בהיפופיזה הקדמית"],"e":"ליבת האדרנל, מעל הכליה, פועלת כמו גנגליון סימפתי ששולח את התוצר שלו בדם. אצטילכולין משמש את הענף הפרסימפתי באיברי המטרה."},{"q":"מה ההבדל בטרנסמיטר שמגיע לאיבר המטרה בשני הענפים?","a":"בסימפתי נוראפינפרין; בפרסימפתי אצטילכולין","w":["בסימפתי אצטילכולין; בפרסימפתי נוראפינפרין","בשניהם נוראפינפרין","בשניהם דופמין"],"e":"הנוירון הפרה־גנגליוני משתמש באצטילכולין בשני הענפים. ההבדל בנוירון הפוסט־גנגליוני: נוראפינפרין בסימפתי ואצטילכולין בפרסימפתי."}]},
"h1":{"t":"t1","v":[{"q":"חתך שמקביל לנויראקסיס ועובר בדיוק באמצע המוח נקרא...","a":"מיד־סגיטלי","w":["רוחבי","אופקי","קורונלי צידי"],"e":"סגיטלי מקביל לנויראקסיס; מיד־סגיטלי באמצע. רוחב = ניצב לנויראקסיס; אופקי = מקביל לקרקע."}]},
"h2":{"t":"t2","v":[{"q":"גידול חוסם את תעלת המוח. אילו חדרים יתרחבו?","a":"החדרים הצידיים והחדר השלישי","w":["רק החדר הרביעי","כל החדרים במוח, וגם תעלת השדרה","רק החדרים הצידיים"],"e":"בהידרוצפלוס חסימתי מתרחבים רק החדרים שלפני החסימה. התעלה נמצאת בין השלישי לרביעי."}]},

const H={"h1":{"t":"t1","v":[{"q":"אצל אדם עומד, המוחון נמצא מתחת לאונת העורף ומאחורי הגשר. איך מתארים את המיקום של המוחון ביחס לגשר?","a":"גבי לגשר","w":["גחוני לגשר","צידי לגשר","קדמי לגשר"],"e":"לפי הספר, המוחון גבי לגשר. במוח, ״גבי״ הוא לכיוון הקודקוד והגב, ו״גחוני״ לכיוון תחתית הגולגולת."}]},"h2":{"t":"t1","v":[{"q":"שבץ בהמיספרה השמאלית גרם לשיתוק ביד ימין. איך מתארים את הקשר בין מיקום הפגיעה לצד המשותק?","a":"קונטרלטרלי: הצד הנגדי","w":["איפסילטרלי: אותו צד","מדיאלי: לכיוון קו האמצע","גחוני: לכיוון הבטן"],"e":"האזור המוטורי הראשוני שולט בצד הנגדי של הגוף."}]},"h3":{"t":"t1","v":[{"q":"חוקרת חותכת מוח בדיוק בקו האמצע, ומקבלת שני חצאים סימטריים. איזה חתך זה?","a":"חתך מיד־סגיטלי","w":["חתך רוחב (חזיתי)","חתך אופקי","חתך צידי"],"e":"חתך סגיטלי מקביל לנויראקסיס ומפריד בין ימין לשמאל. מיד־סגיטלי עובר בדיוק באמצע."},{"q":"חתך שעובר במוח במקביל לרצפה, כאילו מורידים את ״המכסה״ של הראש. איזה חתך זה?","a":"חתך אופקי","w":["חתך רוחב (חזיתי)","חתך סגיטלי","חתך מיד־סגיטלי"],"e":"חתך רוחב ניצב לנויראקסיס, כמו פרוסת לחם. סגיטלי מפריד בין ימין לשמאל."}]},"h4":{"t":"t2","v":[{"q":"באיזה מקום בין קרומי המוח נמצא ה־CSF?","a":"בחלל התת־קורי, מתחת לקרום הקורים","w":["בין הגולגולת לבין הקרום הקשה","בין הקרום הקשה לבין קרום הקורים","בתוך הקרום העדין עצמו, שצמוד למוח"],"e":"הסדר מבחוץ: קרום קשה, קרום הקורים, חלל תת־קורי (CSF), קרום עדין."}]},"h5":{"t":"t2","v":[{"q":"גידול חוסם את תעלת המוח. באילו חדרים צפויה הרחבה?","a":"בחדרים הצידיים ובחדר השלישי","w":["רק בחדר הרביעי, שנמצא אחרי החסימה","בכל ארבעת החדרים באותה מידה","באף חדר, כי הנוזל ייספג מיד לדם"],"e":"ה־CSF ממשיך להיווצר ולא יכול לעבור. זה הידרוצפלוס חסימתי. הטיפול: צינור ניקוז עם שסתום."}]},"h6":{"t":"t2","v":[{"q":"מה התפקיד העיקרי של ה־CSF לפי הספר?","a":"ריפוד: המוח צף בו, ולכן ״שוקל״ פחות ומוגן מחבטות","w":["הזנה: הוא מספק למוח את כל הגלוקוז והחמצן","הולכה: הוא מעביר אותות חשמליים בין הנוירונים","ניקוי: הוא מסנן חומרים מזיקים מהדם"],"e":"המוח שוקל כ־1,400 גרם, אבל בתוך הנוזל ״משקלו״ כ־80 גרם בלבד."}]},"h7":{"t":"t3","v":[{"q":"למה לאדם יש קורטקס גדול בהרבה משל עכבר, לפי הספר?","a":"החלוקות הסימטריות נמשכות אצלנו יותר זמן","w":["הנוירונים של האדם גדולים יותר משל העכבר","אצל האדם לא מתים נוירונים באפופטוזה","הנוירונים של האדם נודדים מבחוץ פנימה"],"e":"כ־7 שבועות אצל האדם לעומת יומיים אצל עכבר. שינוי קטן בגנים של תזמון יוצר הבדל גדול."}]},"h8":{"t":"t3","v":[{"q":"נוירון שלא יצר קשר עם תאים אחרים לא מקבל ״אות חיים״ ומת. איך קוראים לתהליך?","a":"אפופטוזה: מוות תאי מתוכנת","w":["נוירוגנזה: יצירת נוירונים חדשים","חלוקה סימטרית: תא אב יוצר שני תאי אב","נדידה: הנוירון זז לאורך גלייה רדיאלית"],"e":"האות הוא גורם נוירוטרופי. כ־50% מהנוירונים מתים כך."}]},"h9":{"t":"t3","v":[{"q":"לאיזו חלוקה עוברית שייכים התלמוס וההיפותלמוס?","a":"דיאנצפלון, חלק מהמוח הקדמי","w":["טלאנצפלון, חלק מהמוח הקדמי","מזאנצפלון, המוח האמצעי","מטאנצפלון, חלק מהמוח האחורי"],"e":"הטלאנצפלון כולל קורטקס, גנגליונים בסיסיים ומערכת לימבית. הדיאנצפלון מקיף את החדר השלישי."}]},"h10":{"t":"t4","v":[{"q":"אדם אחרי שבץ רואה היטב מפתח, יכול לתאר את הצורה שלו, אבל לא מזהה שזה מפתח. איזה אזור כנראה נפגע?","a":"הקורטקס האסוציאטיבי החזותי","w":["קורטקס הראייה הראשוני באונת העורף","הקורטקס המוטורי הראשוני באונת המצח","הקורטקס הסומטו־סנסורי באונת הקודקוד"],"e":"פגיעה בראשוני הייתה פוגעת בראייה עצמה. כאן הראייה תקינה, אבל ה״הבנה״ של מה שרואים נפגעה."}]},"h11":{"t":"t4","v":[{"q":"גירוי חשמלי ברכס שנמצא ממש לפני המענית המרכזית גורם לתזוזה של יד. באיזה אזור מדובר?","a":"הקורטקס המוטורי הראשוני, באונת המצח","w":["הקורטקס הסומטו־סנסורי, באונת הקודקוד","קורטקס השמע הראשוני, באונת הרקה","הקורטקס הקדם־מצחי, בחלק הקדמי של המצח"],"e":"לפני המענית = תנועה. אחריה = תחושה מהגוף."}]},"h12":{"t":"t4","v":[{"q":"לפי הספר, באיזו המיספרה נמצאים אצל רוב האנשים שפה, חשבון וניתוח רצפים?","a":"בשמאלית","w":["בימנית","בשתיהן באותה מידה","בכפיס המוח"],"e":"הימנית עוסקת יותר בחיבור לשלם, מרחב, פנים ורגש בקול."}]},"h13":{"t":"t5","v":[{"q":"אדם עם פגיעה בהיפוקמפוס משני הצדדים. מה התפקיד שהכי צפוי להיפגע?","a":"למידה וזיכרון","w":["הבעת פחד ותגובות רגשיות","תיאום תנועות חלקות","ויסות חום הגוף ושתייה"],"e":"האמיגדלה קשורה לפחד, המוחון לתיאום, וההיפותלמוס לוויסות הגוף."}]},"h14":{"t":"t5","v":[{"q":"מטופל רועד, נוקשה ומתקשה להתחיל ללכת. הנוירונים שנפגעו נמצאים בחומר השחור. איך הם גורמים לבעיה?","a":"הם מפסיקים לספק דופמין לגנגליונים","w":["הם מפסיקים לספק אצטילכולין לשרירים","הם פוגעים בהעברת מידע מהתלמוס לקורטקס","הם פוגעים בייצור CSF בחדרים"],"e":"זו מחלת פרקינסון. החומר השחור במוח האמצעי, וההשפעה על הגרעין הזנבי והפוטמן."}]},"h15":{"t":"t5","v":[{"q":"מידע מהרשתית מגיע לגרעין בתלמוס ומשם לקורטקס הראייה. איזה גרעין?","a":"גרעין הברך הצידי","w":["גרעין הברך המדיאלי","הגרעין הגחוני־צידי","הגופים הדדיים"],"e":"המדיאלי לשמיעה, והגחוני־צידי מעביר מהמוחון לקורטקס המוטורי. כל החושים, חוץ מריח, עוברים בתלמוס."}]},"h16":{"t":"t5","v":[{"q":"הורמון מיוצר בהיפותלמוס, עובר באקסון להיפופיזה האחורית, ומשם לדם. איזה הורמון זה יכול להיות?","a":"אוקסיטוצין או ואזופרסין","w":["הורמונים משחררים שעוברים בכלי דם","הורמוני מין שמופרשים מהבלוטה הקדמית","אפינפרין שמופרש מליבת האדרנל"],"e":"לבלוטה הקדמית ההיפותלמוס שולח הורמונים משחררים בכלי דם. לאחורית הוא שולח הורמונים באקסונים."}]},"h17":{"t":"t6","v":[{"q":"אדם עם פגיעה במבנה מסוים מתקשה לעמוד וללכת, והתנועות שלו לא מתואמות, אבל הוא לא משותק. איזה מבנה נפגע?","a":"המוחון","w":["המוח המוארך","הגשר","התלילים העליונים"],"e":"המוחון מתאם תנועות חלקות ומדויקות. פגיעה במוח המוארך עלולה לגרום למוות."}]},"h18":{"t":"t6","v":[{"q":"פגיעה באיזה מבנה צפויה להיות מסוכנת לחיים, כי הוא שולט בנשימה ובלב?","a":"המוח המוארך","w":["המוחון","התלילים התחתונים","הגרעין האדום"],"e":"המוח המוארך הוא החלק התחתון של גזע המוח, וממשיך אל מוח השדרה."}]},"h19":{"t":"t6","v":[{"q":"חתול מסובב את הראש מיד לכיוון רעש פתאומי. איזה מבנה במוח האמצעי מעורב בזה?","a":"התלילים התחתונים","w":["התלילים העליונים","החומר השחור","החומר האפור המרכזי"],"e":"התלילים העליונים קשורים לראייה (תגובה לגירוי נע), והתחתונים לשמיעה."}]},"h20":{"t":"t6","v":[{"q":"אילו מבנים כוללים ״גזע המוח״?","a":"מוח אמצעי, גשר ומוח מוארך","w":["מוח אמצעי, גשר
