const T=[
 {id:"t1",icon:"target",title:"מבוא: כיוונים וחתכים",blocks:[
  {h:"ראיין: ניתוח בהכרה",html:`${def("על מה הנושא",`כדי להבין מחקר על המוח צריך להכיר את המבנה שלו ואת השפה שבה מתארים מיקום. הנושא פותח בסיפור ובמושגי הכיוון.<br><b>מה נלמד כאן:</b> CNS ו־PNS · מונחי כיוון · מישורי חתך`)}${def("תיאור מקרה",`ראיין, סטודנט שנה א', סבל מהתקפים אפילפטיים <b>ממוקדים</b> מאז ילדותו, שנגרמו מ<b>רקמת צלקת</b> (כנראה מנזק בלידה) ב<b>אונת הרקה המדיאלית</b> השמאלית. התרופה הפסיקה לעזור, ומינון גבוה פגע בריכוז. הוא נותח <b>בהכרה</b>, בהרדמה מקומית בלבד.`)}${def("למה בהכרה",`המנתח גירה אזורים בזרם חלש כדי לשבש אותם זמנית. גירוי בחלקים מסוימים של אונת הרקה שיבש את היכולת של ראיין <b>להבין דיבור</b>, והמנתח נזהר שלא לפגוע בהם. אחרי הניתוח ההתקפים נעלמו.`)}${tiles([["brain","CNS","מוח ומוח השדרה, מוגנים בעצם ובנוזל המוח והשדרה (CSF)"],["link","PNS","עצבי הגולגולת, עצבי השדרה וגנגליונים היקפיים"]])}${rem("המוח מקבל כ־<b>20%</b> מהדם שהלב מזרים, תמיד. הוא לא יכול לאגור גלוקוז ולא לפעול בלי חמצן. <b>גנגליון</b> הוא גוש של גופי תאים מחוץ למוח; בתוך המוח קוראים לזה <b>גרעין</b>.")}`,q:"q1"},

 {id:"t2",icon:"cycle",title:"קרומי המוח וחדרי המוח",blocks:[
  {h:"שלושה קרומים",html:`${tiles([["lock","קרום קשה (dura mater)","החיצוני: קשה, גמיש ואינו נמתח"],["data","קרום הקורים (arachnoid)","האמצעי: רך וספוגי"],["leaf","קרום עדין (pia mater)","הפנימי: דק וצמוד לפני המוח"]])}${def("החלל התת־קורי",`<mark>החלל התת־קורי</mark> ${E("subarachnoid space")} נמצא בין קרום הקורים לקרום העדין, והוא מלא ב<b>נוזל המוח והשדרה</b> (CSF) שמרפד את המוח.`)}${rem("המוח <b>צף</b> ב־CSF, ולכן משקלו האפקטיבי נמוך בהרבה והוא מוגן מחבטות. ב־PNS יש רק שני קרומים, שמתמזגים לעטיפת העצב.")}`,q:"q5"},
  {h:"החדרים וזרימת ה־CSF",html:`<p>ה־CSF מיוצר ב<b>מקלעת הכורואידית</b> ${E("choroid plexus")}, רקמה עשירה בכלי דם בתוך החדרים, ומתחלף כמה פעמים ביום.</p><ol><li><b>שני חדרים צידיים</b> ${E("lateral ventricles")} בטלאנצפלון</li><li><b>חדר שלישי</b> במרכז הדיאנצפלון</li><li><b>תעלת המוח</b> ${E("cerebral aqueduct")}, צינור צר במוח האמצעי</li><li><b>חדר רביעי</b>, בין המוחון לגשר</li><li>יציאה ל<b>חלל התת־קורי</b></li><li>ספיגה דרך <b>גבשושי קרום הקורים</b> אל <b>הגת הסגיטלית העילית</b>, וריד גדול בקו האמצע</li></ol>${def("הידרוצפלוס חסימתי",`כשמשהו חוסם את הזרימה, למשל גידול שלוחץ על תעלת המוח, ה־CSF ממשיך להיווצר והחדרים מתנפחים. זה <mark>הידרוצפלוס חסימתי</mark> ${E("obstructive hydrocephalus")} (״מים בראש״). אצל תינוקות הראש גדל. הטיפול: צינור ניקוז מחדר צידי לחלל הבטן, עם שסתום לחץ.`)}${ex(`גידול שחוסם את <b>תעלת המוח</b> יגרום להתרחבות החדרים הצידיים והשלישי, שנמצאים <b>לפני</b> החסימה, אבל לא של החדר הרביעי שאחריה.`)}`,q:"q7"}
 ]},
 {id:"t3",icon:"sprout",title:"התפתחות מערכת העצבים",blocks:[
  {h:"מצינור עצבים לחלוקות המוח",html:`${def("צינור העצבים",`בעובר נוצר מהאקטודרם <b>לוח עצבי</b> שמתקפל ל<mark>צינור עצבים</mark> ${E("neural tube")}, חלול וסגור בקדמתו. החלל שבתוכו יהפוך לחדרי המוח ולתעלה המרכזית של מוח השדרה.`)}${fig("divs")}${rem("בהתחלה יש <b>שלושה</b> חללים: מוח קדמי, אמצעי ואחורי. אחר כך הקדמי מתחלק לטלאנצפלון ולדיאנצפלון, והאחורי למטאנצפלון ולמיילאנצפלון.")}`,q:"q9"},
  {h:"איך נבנה הקורטקס",html:`${def("האזור החדרי",`<mark>האזור החדרי</mark> ${E("ventricular zone, VZ")} הוא שכבת תאים שמרפדת את צינור העצבים מבפנים. יש בה <b>תאי אב</b> שמתחלקים ויוצרים את תאי ה־CNS. מתחתיו <b>האזור התת־חדרי</b> (SVZ).`)}${tiles([["copies","חלוקה סימטרית","תא אב יוצר שני תאי אב. מגדילה את האזור החדרי ולכן את המוח"],["split","חלוקה אסימטרית","תא אב יוצר תא אב ונוירון, שנודד ליעדו"]])}${def("למה למוח שלנו יש קורטקס גדול",`ההבדל בין מינים נובע בעיקר מ<b>משך שלב החלוקות הסימטריות</b>: באדם הוא נמשך שבועות, בעכבר ימים. כל מחזור נוסף מכפיל את מספר תאי האב. שינוי קטן בגנים שקובעים את התזמון מוביל להבדל עצום.`)}${def("נדידה",`<mark>תאי גלייה רדיאליים</mark> ${E("radial glia")} שולחים סיבים מהאזור החדרי עד פני הקורטקס, והנוירונים ״מטפסים״ לאורכם. כל גל חדש <b>חולף על פני הקודם</b>, ולכן השכבות נבנות <b>מבפנים החוצה</b>: האחרונים שנוצרו נמצאים בשכבה החיצונית.`)}`,q:"q11"},
  {h:"אפופטוזה, גיזום ונוירוגנזה בבוגר",html:`${def("אפופטוזה",`<mark>אפופטוזה</mark> ${E("apoptosis")} היא מוות תאי מתוכנת: אות כימי מפעיל מנגנון גנטי שגורם לתא להשמיד את עצמו בלי לפגוע בשכניו. המוח מייצר נוירונים <b>בעודף</b>, ונוירונים שלא יצרו קשר עם תא מטרה לא מקבלים ממנו <b>גורם גדילה</b> (״אות חיים״) ומתים. זה <mark>גיזום</mark> ${E("pruning")}.`)}${def("אחרי הלידה",`ההתפתחות ממשיכה שנים. החוויה מעצבת את המוח: קודם ייצור בעודף, ואחר כך אפופטוזה וגיזום סינפסות לפי למידה וחשיפה לגירויים. הקורטקס הקדם־מצחי מבשיל אחרון.`)}${def("נוירוגנזה במוח הבוגר",`במשך שנים חשבו שבמוח בוגר לא נוצרים נוירונים. היום ידוע שהם נוצרים ב<b>בולבוסי ההרחה</b> וב<b>היפוקמפוס</b>.`)}${rem("״השתמש או אבד״: קשרים שפעילים נשמרים, וקשרים שלא בשימוש נגזמים. לכן הסביבה בילדות משפיעה כל כך על מבנה המוח.")}`,q:"q13"}
 ]},
 {id:"t4",icon:"brain",title:"הקורטקס המוחי",blocks:[
  {h:"אונות, חריצים ורכסים",html:`${def("המיספרות וקורטקס",`המוח הקדמי כולל שתי <b>המיספרות</b> מכוסות ב<mark>קורטקס מוחי</mark> ${E("cerebral cortex")}, שכבה של <b>חומר אפור</b> (גופי תאים) בעובי כ־3 מ״מ. מתחתיו <b>חומר לבן</b>: אקסונים עם מיילין. האזורים שבפנים נקראים <b>תת־קורטיקליים</b>.`)}${def("פיתולים",`<b>מעניות</b> ${E("sulci")} הן קפלים, <b>חריצים</b> ${E("fissures")} הם קפלים עמוקים, ו<b>רכסים</b> ${E("gyri")} הם הבליטות שביניהם. הפיתולים מגדילים מאוד את שטח הקורטקס, ורובו חבוי בתוך הקפלים.`)}${fig("lobes")}${tiles([["hand","אונת המצח","תכנון תנועות וביצוען"],["target","אונת הקודקוד","מידע חושי מהגוף ותפיסה מרחבית"],["bulb","אונת הרקה","בעיקר שמיעה"],["id","אונת העורף","בעיקר ראייה"]])}`,q:"q15"},
  {h:"אזורים ראשוניים ואסוציאטיביים",html:`${tiles([["id","ראייה ראשוני","באונת העורף, לאורך החריץ הדורבני"],["bulb","שמע ראשוני","באונת הרקה, בגדה התחתונה של החריץ הצידי"],["hand","סומטי־סנסורי ראשוני","ברכס שמאחורי המענית המרכזית"],["target","מוטורי ראשוני","ברכס שלפני המענית המרכזית"]])}${rem("גם התחושה וגם התנועה מאורגנות <b>קונטרלטרלית</b>: ההמיספרה השמאלית מקבלת מהצד הימני של הגוף ושולטת בו.")}${def("קורטקס אסוציאטיבי",`סביב כל אזור ראשוני יש <b>קורטקס אסוציאטיבי סנסורי</b> שמעבד את המידע ברמה גבוהה יותר. נזק בו לא גורם לעיוורון, אבל פוגע ב<b>זיהוי</b> (רואים ולא מזהים). לפני הקורטקס המוטורי נמצא ה<b>קורטקס האסוציאטיבי המוטורי</b> שמתכנן תנועות, ולפניו <mark>הקורטקס הקדם־מצחי</mark> ${E("prefrontal cortex")} שעוסק בתכנון ובאסטרטגיה.`)}${ex(`המחצית <b>האחורית</b> של הקורטקס עוסקת בעיקר בתפיסה ובלמידה, והמחצית <b>הקדמית</b> בתכנון ובפעולה. <b>האינסולה</b> היא קורטקס שקוע שמוסתר מתחת לחריץ הצידי.`)}`,q:"q17"},
  {h:"לטרליזציה וכפיס המוח",html:`${tiles([["doc","המיספרה שמאלית","שפה, ניתוח רצפים של אירועים"],["chart","המיספרה ימנית","סינתזה, תפיסה מרחבית, ציור, זיהוי פנים ורגש בקול"]])}${def("כפיס המוח",`<mark>כפיס המוח</mark> ${E("corpus callosum")} הוא אלומה רחבה של אקסונים שמחברת אזורים מקבילים בשתי ההמיספרות. בהדמיית <b>DTI</b> אפשר לראות את האלומות שלו.`)}${def("נאוקורטקס וקורטקס לימבי",`<mark>נאוקורטקס</mark> הוא הקורטקס החדש מבחינה אבולוציונית, ובו האזורים הראשוניים והאסוציאטיביים. <b>הקורטקס הלימבי</b> עתיק יותר ונמצא בשוליים המדיאליים של ההמיספרות.`)}${rem("ההמיספרות לא עובדות לבד: בעזרת כפיס המוח הן משלבות את היכולות שלהן, וזה מה שהניתוח של המוח החצוי מנתק.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"people",title:"מערכת לימבית, גנגליונים בסיסיים ודיאנצפלון",blocks:[
  {h:"המערכת הלימבית",html:`${def("מה היא כוללת",`<mark>המערכת הלימבית</mark> ${E("limbic system")} כוללת את הקורטקס הלימבי (במיוחד <b>רכס החגורה</b> ${E("cingulate gyrus")} מעל כפיס המוח), <b>ההיפוקמפוס</b>, <b>האמיגדלה</b>, הגרעינים הקדמיים של התלמוס, חלקים מההיפותלמוס (<b>הגופים הדדיים</b>) ו<b>הפורניקס</b>, אלומה שמחברת את ההיפוקמפוס לגופים הדדיים.`)}${tiles([["doc","היפוקמפוס","באונת הרקה המדיאלית: למידה וזיכרון"],["x","אמיגדלה","גרעינים קדמית להיפוקמפוס: רגש, במיוחד פחד"],["cycle","רכס החגורה","קורטקס לימבי מעל כפיס המוח"]])}${rem("פאפז ואחר כך מקלין הציעו שהמערכת הזאת קשורה ל<b>רגשות</b>, ומקלין קשר את האבולוציה שלה להתפתחות הרגש. היום ידוע שההיפוקמפוס חשוב בעיקר ל<b>זיכרון</b>.")}`,q:"q21"},
  {h:"הגנגליונים הבסיסיים",html:`${def("המבנים",`<mark>הגנגליונים הבסיסיים</mark> ${E("basal ganglia")} הם גרעינים תת־קורטיקליים בטלאנצפלון: <b>הגרעין הזנבי</b> ${E("caudate")}, <b>הפוטמן</b> ו<b>הגלובוס פלידוס</b>. הם חלק חשוב מהמערכת <b>המוטורית</b>.`)}${def("מחלת פרקינסון",`רעד, קשיחות, חולשה, שיווי משקל לקוי ו<b>קושי ליזום תנועה</b>. הסיבה: ניוון של נוירונים ש<b>גופי התאים שלהם בחומר השחור</b> במוח האמצעי, ושהאקסונים שלהם מגיעים לגרעין הזנבי ולפוטמן ופולטים שם <b>דופמין</b>.`)}${ex(`זה מסביר את מקרה ה־MPTP (פרק 5): רעלן שהרס את הנוירונים הדופמינרגיים יצר אצל צעירים תסמינים של פרקינסון, והשתלה של נוירונים פולטי דופמין בגרעין הזנבי ובפוטמן שיפרה אותם.`)}`,q:"q23"},
  {h:"תלמוס, היפותלמוס והיפופיזה",html:`${def("הדיאנצפלון",`<mark>הדיאנצפלון</mark> ${E("diencephalon")} מקיף את החדר השלישי וכולל את התלמוס וההיפותלמוס.`)}${def("תלמוס",`גרעינים שמעבירים מידע לקורטקס דרך <b>סיבי השלכה</b> (אקסונים מאזור אחד לאזור אחר). <b>גרעין הברך הצידי</b>: מהרשתית לקורטקס הראייה. <b>גרעין הברך המדיאלי</b>: מהשמיעה לקורטקס השמע. <b>הגרעין הגחוני־צידי</b>: מהמוחון לקורטקס המוטורי.`)}${def("היפותלמוס",`קטן, מתחת לתלמוס, אבל שולט ב<b>מערכת העצבים האוטונומית</b> וב<b>מערכת האנדוקרינית</b>, ובהתנהגויות של הישרדות: לחימה, אכילה, בריחה והזדווגות. תחתיו נמצאת <b>תצלובת הראייה</b>.`)}${tiles([["gear","היפופיזה קדמית","בלוטה אנדוקרינית. ההיפותלמוס שולט בה בהורמונים משחררים שמגיעים בכלי דם"],["link","היפופיזה אחורית","אקסונים של נוירונים מההיפותלמוס פולטים לדם אוקסיטוצין ווזופרסין"]])}${ex(`<b>הורמון משחרר גונדוטרופין</b> מההיפותלמוס גורם להיפופיזה הקדמית להפריש הורמונים שמפעילים את בלוטות המין. ההורמונים של ההיפופיזה האחורית מיוצרים בגופי התאים בהיפותלמוס ומגיעים אליה בתובלה אקסופלזמית.`)}`,q:"q25"}
 ]},
 {id:"t6",icon:"pyramid",title:"המוח האמצעי והמוח האחורי",blocks:[
  {h:"המוח האמצעי",html:`${def("טקטום",`<b>הטקטום</b> (״גג״) הוא החלק הגבי. <b>התלילים העליונים</b> ${E("superior colliculi")} שייכים למערכת הראייה, ו<b>התלילים התחתונים</b> ${E("inferior colliculi")} למערכת השמע ומסובבים את הראש לעבר מקור צליל.`)}${def("טגמנטום",`החלק הגחוני. בו נמצאים:`)}${tiles([["data","תצורת הרשת","רשת של יותר מ־90 גרעינים בליבת גזע המוח: שינה וערות, קשב, טונוס שרירים ותנועה"],["cycle","חומר אפור מרכזי (PAG)","סביב תעלת המוח: התנהגויות טיפוסיות למין, כמו לחימה והזדווגות"],["target","הגרעין האדום","קלט מהמוחון והקורטקס המוטורי, ופלט לנוירונים מוטוריים בשדרה"],["x","החומר השחור","נוירונים שמייצרים דופמין ומגיעים לגרעין הזנבי ולפוטמן"]])}${rem("<b>גזע המוח</b> כולל את המוח האמצעי, הגשר והמוח המוארך, אבל <b>לא</b> את המוחון. באזור הטגמנטום הגחוני יש נוירוני דופמין שקשורים לקשב, להנאה ולהנעה.")}`,q:"q27"},
  {h:"המוחון, הגשר והמוח המוארך",html:`${def("המוחון",`<mark>המוחון</mark> ${E("cerebellum")} נמצא גבית לגשר. יש לו שתי המיספרות מכוסות ב<b>קורטקס מוחוני</b>, ובעומקן <b>גרעינים מוחוניים עמוקים</b> ששולחים את הפלט החוצה. <b>רגליות המוחון</b> (עליונות, אמצעיות ותחתונות) מחברות אותו לגזע המוח.`)}${rem("המוחון מקבל מידע חושי ומידע מהקורטקס המוטורי ו<b>מתאם</b> תנועות. נזק בו פוגע ביכולת לעמוד, ללכת ולבצע תנועות מתואמות. פסנתרן מיומן חב הרבה למוחון שלו.")}${tiles([["link","הגשר (pons)","בליטה בגזע המוח, גחונית למוחון. חלק מתצורת הרשת: שינה ועירור"],["bulb","המוח המוארך","החלק האחורי ביותר, לפני מוח השדרה. מווסת נשימה, לב וכלי דם וטונוס שרירים"]])}${ex(`פגיעה במוח המוארך מסוכנת במיוחד, כי הוא שולט בתפקודים חיוניים כמו נשימה ופעולת הלב.`)}`,q:"q29"}
 ]},
 {id:"t7",icon:"split",title:"מוח השדרה ומערכת העצבים ההיקפית",blocks:[
  {h:"מוח השדרה",html:`${def("המבנה",`<mark>מוח השדרה</mark> ${E("spinal cord")} עובר בתוך עמוד השדרה, אבל רק עד בערך <b>חוליה L1</b>. מתחת לזה יש צרור של שורשים: <b>זנב הסוס</b> ${E("cauda equina")}. הרדמה בחלל שמעל זנב הסוס, <b>חסימה זנבית</b>, משמשת למשל בלידה.`)}${tiles([["bulb","שורש גבי","סיבים <b>מביאים</b> (סנסוריים). גופי התאים בגנגליון השורש הגבי"],["hand","שורש גחוני","סיבים <b>מוציאים</b> (מוטוריים)"]])}${def("חתך רוחב",`במוח השדרה <b>החומר האפור בפנים</b> (בצורת פרפר), והחומר הלבן בחוץ: מסילות עולות (סנסוריות) ויורדות (מוטוריות). במוח זה הפוך: הקורטקס האפור בחוץ.`)}${rem("השורשים הגבי והגחוני מתמזגים ל־<b>31 זוגות</b> של עצבי שדרה שיוצאים בין החוליות.")}`,q:"q31"},
  {h:"עצבי הגולגולת ועצבי השדרה",html:`${def("עצבי הגולגולת",`12 זוגות של <mark>עצבי גולגולת</mark> ${E("cranial nerves")} מחוברים ישירות למוח. רובם משרתים את הראש והצוואר. יש סנסוריים, מוטוריים ומעורבים. עצב ההרחה מסתיים ב<b>בולבוס ההרחה</b>.`)}${def("עצב התועה",`<mark>עצב התועה</mark> ${E("vagus")} הוא הגדול שבהם. הוא מגיע לאיברי החזה והבטן ומעביר סיבים של הענף <b>הפרסימפתי</b>.`)}${tiles([["target","אקסון מביא (afferent)","פונה אל ה־CNS ומעביר מידע סנסורי"],["link","אקסון מוציא (efferent)","יוצא מה־CNS ומעביר פקודות לשרירים ולבלוטות"]])}${ex(`טריק לזיכרון: מביא = <b>A</b>fferent = <b>A</b>rrive, מגיע אל ה־CNS. מוציא = <b>E</b>fferent = <b>E</b>xit, יוצא ממנו.`)}`,q:"q33"},
  {h:"מערכת העצבים האוטונומית",html:`${def("סומטית ואוטונומית",`<b>המערכת הסומטית</b> (הרצונית) מקבלת מידע מאיברי החוש ושולטת בשרירי השלד. <b>המערכת האוטונומית</b> שולטת בשריר חלק, בשריר הלב ובבלוטות.`)}${def("שני נוירונים בדרך",`בדרך לאיבר יש <b>נוירון פרה־גנגליוני</b> (גוף התא ב־CNS) שיוצר סינפסה בגנגליון עם <b>נוירון פוסט־גנגליוני</b>, וזה מגיע לאיבר המטרה.`)}${fig("ans")}${rem("<b>ליבת האדרנל</b>, מעל הכליה, מקבלת סיבים סימפתיים ומפרישה לדם <b>אפינפרין ונוראפינפרין</b>. בשני הענפים, הנוירון הפרה־גנגליוני משתמש באצטילכולין.")}${ex(`דוב מופיע בשביל: הענף <b>הסימפתי</b> מאיץ את הלב ומרחיב אישונים. אחרי ארוחה טובה על הספה: הענף <b>הפרסימפתי</b> מגביר רוק ועיכול ומאט את הלב.`)}`,q:"q35"}
 ]}
];
const Q={
q1:{t:"t1",v:[
 {q:"למה ראיין היה ער בזמן הניתוח?",a:"כדי שהמנתח יזהה אזורים חיוניים לדיבור ולא יפגע בהם",w:["כי הרדמה כללית מעוררת התקפים אפילפטיים","כי הניתוח היה קצר מכדי להצדיק הרדמה","כי המנתח רצה לבדוק את הזיכרון שלו בזמן אמת"],e:"המנתח גירה אזורים בזרם חלש, וכשגירוי שיבש את הבנת הדיבור ידע שהאזור חיוני. כך אפשר להסיר את מוקד ההתקפים ולהשאיר את מה שחשוב."},
 {q:"מה גרם להתקפים של ראיין?",a:"רקמת צלקת באונת הרקה המדיאלית השמאלית",w:["גידול שחסם את זרימת נוזל המוח והשדרה","ניוון של נוירונים בחומר השחור","דלקת בקרומי המוח שהתפשטה לקורטקס"],e:"רקמת הצלקת, כנראה מנזק בלידה, גירתה מדי פעם את האזורים השכנים ועוררה התקף. התקף כזה הוא ירי בלתי נשלט וממושך של נוירונים."}]},
q2:{t:"t1",v:[
 {q:"איזה חלק מהדם שהלב מזרים מגיע למוח?",a:"כ־20%, וברציפות",w:["כ־5%, ורק בזמן מאמץ מחשבתי","כ־50%, בעיקר בזמן שינה","כמות משתנה, לפי הצורך כמו בשרירים"],e:"המוח לא יכול לאגור גלוקוז ולא לפעול בלי חמצן, ולכן מקבל כחמישית מהדם בלי הפסקה. שרירים ומערכת העיכול מקבלים כמות משתנה לפי הצורך."},
 {q:"מה ההבדל בין גנגליון לגרעין?",a:"שניהם גושי גופי תאים; גנגליון מחוץ למוח, גרעין בתוכו",w:["גנגליון הוא אלומת אקסונים; גרעין הוא גוש גופי תאים","גנגליון נמצא בתוך המוח; גרעין נמצא מחוץ לו","אין הבדל, אלה שני שמות לאותו מבנה בדיוק"],e:"שניהם קבוצות של גופי תאים, וההבדל הוא במיקום. אלומת אקסונים נקראת עצב, מסילה או שליבה."}]},
q3:{t:"t1",v:[
 {q:"מה המשמעות של ״גחוני״ במערכת העצבים?",a:"כלפי הבטן או תחתית הגולגולת",w:["כלפי הגב או הקודקוד","כלפי קו האמצע של הגוף","באותו צד של הגוף"],e:"גחוני הוא ההפך מגבי, שפירושו כלפי הגב או הקודקוד. כלפי קו האמצע נקרא מדיאלי, ובאותו צד איפסילטרלי."},
 {q:"ההמיספרה השמאלית שולטת ביד ימין. איך מתארים את הקשר?",a:"קונטרלטרלי",w:["איפסילטרלי","מדיאלי","גבי"],e:"קונטרלטרלי פירושו בצד הנגדי, ואיפסילטרלי באותו צד. מדיאלי וגבי הם מונחי מיקום, ולא מתארים יחס בין צדדים."}]},
q4:{t:"t1",v:[
 {q:"איזה חתך מחלק את המוח לשתי מחציות סימטריות?",a:"חתך מיד־סגיטלי",w:["חתך אופקי","חתך רוחב (חזיתי)","חתך אלכסוני"],e:"חתך סגיטלי מקביל לנויראקסיס וניצב לקרקע, והמיד־סגיטלי עובר בדיוק באמצע. חתך אופקי מקביל לקרקע, וחתך רוחב ניצב לנויראקסיס."},
 {q:"איזה חתך מקביל לקרקע?",a:"חתך אופקי",w:["חתך סגיטלי","חתך רוחב","חתך מיד־סגיטלי"],e:"החתך האופקי עובר במקביל לקרקע. חתך רוחב חותך את המוח כמו פרוסות לחם, וחתך סגיטלי ניצב לקרקע."}]},
q5:{t:"t2",v:[
 {q:"מה סדר קרומי המוח מבחוץ פנימה?",a:"קרום קשה, קרום הקורים, קרום עדין",w:["קרום עדין, קרום הקורים, קרום קשה","קרום הקורים, קרום קשה, קרום עדין","קרום קשה, קרום עדין, קרום הקורים"],e:"הקרום הקשה (dura) הוא החיצוני, קרום הקורים באמצע, והקרום העדין (pia) צמוד למוח. בין שני האחרונים נמצא החלל התת־קורי."},
 {q:"איפה נמצא החלל התת־קורי?",a:"בין קרום הקורים לקרום העדין",w:["בין הגולגולת לקרום הקשה","בין הקרום הקשה לקרום הקורים","בתוך החדר השלישי"],e:"החלל התת־קורי נמצא מתחת לקרום הקורים, מעל הקרום העדין, והוא מלא בנוזל המוח והשדרה שמרפד את המוח."}]},
q6:{t:"t2",v:[
 {q:"מה התפקיד של נוזל המוח והשדרה סביב המוח?",a:"לרפד את המוח ולהגן עליו מחבטות",w:["לספק למוח את רוב הגלוקוז והחמצן","להעביר אותות חשמליים בין ההמיספרות","לייצר את מעטפת המיילין במוח"],e:"המוח צף ב־CSF, ולכן משקלו האפקטיבי קטן מאוד והוא מוגן ממכות. את החמצן והגלוקוז הוא מקבל מהדם."},
 {q:"כמה קרומים עוטפים את העצבים ב־PNS?",a:"שניים, שמתמזגים לעטיפת העצב",w:["שלושה, כמו במוח","אחד בלבד, הקרום הקשה","אין קרומים כלל ב־PNS"],e:"ב־PNS יש רק את הקרום הקשה ואת הקרום העדין, והם מתמזגים לעטיפה של העצב. קרום הקורים קיים רק סביב ה־CNS."}]},
q7:{t:"t2",v:[
 {q:"איפה מיוצר נוזל המוח והשדרה?",a:"במקלעת הכורואידית שבחדרי המוח",w:["בגבשושי קרום הקורים","בגת הסגיטלית העילית","בבלוטת ההיפופיזה"],e:"המקלעת הכורואידית היא רקמה עשירה בכלי דם בתוך החדרים. גבשושי קרום הקורים הם דווקא המקום שבו הנוזל נספג חזרה לדם."},
 {q:"מה הסדר הנכון של זרימת ה־CSF?",a:"חדרים צידיים, חדר שלישי, תעלת המוח, חדר רביעי",w:["חדר רביעי, תעלת המוח, חדר שלישי, חדרים צידיים","חדר שלישי, חדרים צידיים, חדר רביעי, תעלת המוח","חדרים צידיים, חדר רביעי, תעלת המוח, חדר שלישי"],e:"הנוזל זורם מהחדרים הצידיים לשלישי, דרך תעלת המוח לרביעי, ומשם לחלל התת־קורי. הוא נספג בגבשושי קרום הקורים לגת הסגיטלית."}]},
q8:{t:"t2",v:[
 {q:"גידול חוסם את תעלת המוח. אילו חדרים יתרחבו?",a:"החדרים הצידיים והחדר השלישי",w:["רק החדר הרביעי","כל ארבעת החדרים באותה מידה","אף חדר, כי הנוזל יפסיק להיווצר"],e:"הנוזל ממשיך להיווצר ונתקע לפני החסימה, ולכן החדרים שלפני תעלת המוח מתרחבים. החדר הרביעי נמצא אחרי החסימה."},
 {q:"מה הטיפול בהידרוצפלוס חסימתי אצל תינוק?",a:"צינור ניקוז מחדר צידי לחלל הבטן, עם שסתום לחץ",w:["תרופה שמגבירה את ייצור נוזל המוח","הסרה של המקלעת הכורואידית מכל החדרים","פתיחת הגולגולת כדי לאפשר למוח לגדול"],e:"הצינור מאפשר לנוזל לצאת ולהיספג בגוף, והשסתום מווסת את הזרימה. הגברת הייצור הייתה מחמירה את המצב."}]},
q9:{t:"t3",v:[
 {q:"מה מתפתח מהחלל שבתוך צינור העצבים?",a:"חדרי המוח והתעלה המרכזית",w:["הקורטקס המוחי והחומר האפור","קרומי המוח ונוזל המוח והשדרה","כלי הדם שמזינים את המוח"],e:"צינור העצבים חלול, והחלל שלו הופך למערכת החדרים ולתעלה המרכזית. הדפנות הן שהופכות לרקמת המוח."},
 {q:"מאילו חלוקות מורכב המוח הקדמי?",a:"טלאנצפלון ודיאנצפלון",w:["מטאנצפלון ומיילאנצפלון","טקטום וטגמנטום","מזאנצפלון ודיאנצפלון"],e:"המוח הקדמי מתחלק לטלאנצפלון (קורטקס, גנגליונים בסיסיים, מערכת לימבית) ולדיאנצפלון (תלמוס והיפותלמוס). המוח האחורי מתחלק למטאנצפלון ולמיילאנצפלון."}]},
q10:{t:"t3",v:[
 {q:"איזה חדר נמצא במרכז הדיאנצפלון?",a:"החדר השלישי",w:["החדר הרביעי","החדרים הצידיים","תעלת המוח"],e:"החדר השלישי מוקף בתלמוס ובהיפותלמוס. החדרים הצידיים בטלאנצפלון, תעלת המוח במזאנצפלון, והחדר הרביעי במוח האחורי."},
 {q:"לאיזו חלוקה שייכים המוחון והגשר?",a:"מטאנצפלון",w:["מיילאנצפלון","מזאנצפלון","דיאנצפלון"],e:"המטאנצפלון כולל את המוחון ואת הגשר, והמיילאנצפלון את המוח המוארך. המזאנצפלון הוא המוח האמצעי."}]},
q11:{t:"t3",v:[
 {q:"מה ההבדל בין חלוקה סימטרית לאסימטרית של תאי אב?",a:"סימטרית יוצרת שני תאי אב; אסימטרית יוצרת תא אב ונוירון",w:["סימטרית יוצרת שני נוירונים; אסימטרית שני תאי אב","סימטרית יוצרת תאי גלייה; אסימטרית יוצרת נוירונים","סימטרית מתרחשת אחרי הלידה; אסימטרית לפניה"],e:"חלוקה סימטרית מגדילה את מאגר תאי האב, ואסימטרית מייצרת נוירונים שנודדים ליעדם. לכן משך השלב הסימטרי קובע כמה גדול יהיה המוח."},
 {q:"למה לבני אדם יש קורטקס גדול בהרבה מלעכבר?",a:"כי שלב החלוקות הסימטריות אצלנו נמשך זמן רב יותר",w:["כי הנוירונים שלנו גדולים יותר מאלה של העכבר","כי אצלנו כמעט לא מתרחשת אפופטוזה","כי אצלנו הנוירונים נוצרים גם אחרי הלידה"],e:"כל מחזור נוסף של חלוקה סימטרית מכפיל את תאי האב, ולכן שבועות לעומת ימים יוצרים הבדל עצום. אפופטוזה מתרחשת גם אצלנו."}]},
q12:{t:"t3",v:[
 {q:"מה תפקידם של תאי הגלייה הרדיאליים?",a:"מסלול לנדידת נוירונים לקורטקס",w:["לייצר מיילין סביב אקסונים חדשים","לפרק נוירונים עודפים בתהליך הגיזום","לייצר את נוזל המוח והשדרה"],e:"הסיבים שלהם נמתחים מהאזור החדרי עד פני הקורטקס, והנוירונים ״מטפסים״ עליהם. מיילין מייצרים האוליגו־דנדרוציטים."},
 {q:"באיזה סדר נבנות שכבות הקורטקס?",a:"מבפנים החוצה: הנוירונים האחרונים בשכבה החיצונית",w:["מבחוץ פנימה: הנוירונים הראשונים בשכבה החיצונית","כל השכבות נבנות באותו זמן","בסדר אקראי שנקבע לפי הניסיון"],e:"כל גל חדש של נוירונים חולף על פני הגל הקודם, ולכן הנוירונים שנוצרו אחרונים נמצאים קרוב לפני הקורטקס."}]},
q13:{t:"t3",v:[
 {q:"מהי אפופטוזה?",a:"מוות תאי מתוכנת שמופעל באות כימי",w:["מוות של תאים בגלל פציעה או דלקת","יצירה של נוירונים חדשים במוח הבוגר","נדידה של נוירונים לאורך גלייה רדיאלית"],e:"באפופטוזה אות כימי מפעיל מנגנון גנטי והתא משמיד את עצמו בלי לפגוע בשכניו. יצירת נוירונים חדשים היא נוירוגנזה."},
 {q:"למה נוירונים מסוימים מתים במהלך ההתפתחות?",a:"לא יצרו קשר עם תא מטרה ולא קיבלו אות חיים",w:["הם נדדו מהר מדי ועקפו את היעד שלהם","הם נוצרו בחלוקה סימטרית ולא אסימטרית","הם קיבלו יותר מדי גורם גדילה מתאי המטרה"],e:"המוח מייצר נוירונים בעודף, ורק אלה שמצאו מקום ליצור סינפסות מקבלים את ״אות החיים״. השאר מתים בגיזום."}]},
q14:{t:"t3",v:[
 {q:"איפה מתרחשת נוירוגנזה במוח הבוגר?",a:"בבולבוסי ההרחה ובהיפוקמפוס",w:["בקורטקס המוטורי ובמוחון","בתלמוס ובהיפותלמוס","בכל אזורי המוח באותה מידה"],e:"מחקרים הראו שנוירונים חדשים נוצרים במוח הבוגר בבולבוסי ההרחה ובהיפוקמפוס, בניגוד לדעה הישנה שזה לא קורה בכלל."},
 {q:"מה מעצב את המוח אחרי הלידה, לפי הפרק?",a:"ייצור בעודף ואחריו גיזום לפי הניסיון",w:["רק הגנים, בלי השפעה של הסביבה","רק נוירוגנזה מהירה בכל אזורי המוח","שום דבר, המוח מוכן כבר בלידה"],e:"הניסיון משפיע על אילו סינפסות יישמרו: קשרים פעילים נשמרים ואחרים נגזמים. ההתפתחות ממשיכה שנים, והקורטקס הקדם־מצחי מבשיל אחרון."}]},
q15:{t:"t4",v:[
 {q:"ממה מורכב החומר האפור של הקורטקס?",a:"בעיקר מגופי תאים",w:["בעיקר מאקסונים עם מיילין","בעיקר מתאי שוואן","בעיקר מנוזל המוח והשדרה"],e:"החומר האפור הוא בעיקר גופי תאים, והחומר הלבן שמתחתיו הוא אקסונים עם מיילין, שצבעו לבן בגלל השומן."},
 {q:"מה התפקיד של הפיתולים בקורטקס?",a:"להגדיל את שטח הפנים של הקורטקס",w:["להפריד בין שתי ההמיספרות","לייצר נוזל מוח ושדרה","להגן על המוח מפני חבטות"],e:"המעניות, החריצים והרכסים מאפשרים להכניס הרבה קורטקס לגולגולת, ורובו חבוי בתוך הקפלים. ההגנה מחבטות היא תפקיד ה־CSF."}]},
q16:{t:"t4",v:[
 {q:"איזו אונה עוסקת בעיקר במידע חושי מהגוף ובתפיסה מרחבית?",a:"אונת הקודקוד",w:["אונת המצח","אונת הרקה","אונת העורף"],e:"אונת הקודקוד נמצאת מאחורי המענית המרכזית. אונת המצח עוסקת בתכנון ובתנועה, הרקה בשמיעה, והעורף בראייה."},
 {q:"מה מפריד בין אונת המצח לאונת הקודקוד?",a:"המענית המרכזית",w:["החריץ הצידי","החריץ הדורבני","כפיס המוח"],e:"המענית המרכזית מפרידה בין המצח לקודקוד: לפניה הקורטקס המוטורי ואחריה הסומטי־סנסורי. החריץ הצידי מפריד את אונת הרקה."}]},
q17:{t:"t4",v:[
 {q:"איפה נמצא הקורטקס המוטורי הראשוני?",a:"ברכס שלפני המענית המרכזית, באונת המצח",w:["ברכס שמאחורי המענית המרכזית, באונת הקודקוד","לאורך החריץ הדורבני, באונת העורף","בגדה התחתונה של החריץ הצידי"],e:"הקורטקס המוטורי נמצא מלפני המענית המרכזית, והסומטי־סנסורי מאחוריה. החריץ הדורבני שייך לראייה, והחריץ הצידי לשמיעה."},
 {q:"איפה נמצא קורטקס הראייה הראשוני?",a:"באונת העורף, לאורך החריץ הדורבני",w:["באונת הרקה, ליד החריץ הצידי","באונת הקודקוד, מאחורי המענית המרכזית","באונת המצח, לפני הקורטקס המוטורי"],e:"רוב קורטקס הראייה הראשוני נמצא בגדות החריץ הדורבני באונת העורף. קורטקס השמע נמצא באונת הרקה."}]},
q18:{t:"t4",v:[
 {q:"אדם רואה חפץ היטב אבל לא מזהה מה הוא. איפה הנזק הסביר?",a:"בקורטקס האסוציאטיבי החזותי",w:["בקורטקס הראייה הראשוני","בעצב הראייה","בקורטקס המוטורי"],e:"נזק לאזור הראשוני גורם לעיוורון בחלק משדה הראייה, ונזק לאסוציאטיבי פוגע בזיהוי. אם הוא רואה ולא מזהה, הקלט מגיע אבל העיבוד הגבוה נפגע."},
 {q:"מה תפקיד הקורטקס הקדם־מצחי?",a:"תכנון ואסטרטגיה",w:["שליטה ישירה בשרירי השלד","עיבוד ראשוני של מידע שמיעתי","זיהוי של מגע וכאב בעור"],e:"הקורטקס הקדם־מצחי נמצא בקדמת אונת המצח ועוסק בתכנון. שליטה ישירה בשרירים היא תפקיד הקורטקס המוטורי הראשוני."}]},
q19:{t:"t4",v:[
 {q:"איזו יכולת קשורה בעיקר להמיספרה הימנית?",a:"תפיסה מרחבית וזיהוי פנים",w:["הפקת דיבור","ניתוח רצפים של אירועים","קריאה וכתיבה"],e:"ההמיספרה הימנית מתמחה בסינתזה, בתפיסה מרחבית, בזיהוי פנים ובזיהוי רגש בקול. השפה וניתוח רצפים קשורים בעיקר לשמאלית."},
 {q:"מה מראה הדמיית DTI של כפיס המוח?",a:"אלומות אקסונים בין שתי ההמיספרות",w:["את רמת הפעילות של כל המיספרה בזמן משימה","את גופי התאים בקורטקס","את זרימת הדם בכלי הדם במוח"],e:"DTI מראה אלומות של אקסונים עטופים במיילין לפי כיוון התנועה של מים. הוא לא מודד פעילות, כמו fMRI, ולא זרימת דם."}]},
q20:{t:"t4",v:[
 {q:"מה ההבדל בין נאוקורטקס לקורטקס לימבי?",a:"נאוקורטקס חדש; הלימבי עתיק ומדיאלי",w:["הנאוקורטקס נמצא רק בהמיספרה השמאלית","הלימבי מכיל את האזורים הסנסוריים הראשוניים","אין הבדל, אלה שמות לאותו קורטקס"],e:"הנאוקורטקס כולל את האזורים הראשוניים והאסוציאטיביים. הקורטקס הלימבי עתיק יותר ושייך למערכת הלימבית, כמו רכס החגורה."},
 {q:"מהי האינסולה?",a:"קורטקס שקוע שמוסתר מתחת לחריץ הצידי",w:["החלק האחורי ביותר של אונת העורף","אלומת אקסונים שמחברת בין ההמיספרות","גרעין בתוך התלמוס"],e:"האינסולה מכוסה בחלקים של אונות המצח והרקה, ולכן לא נראית מבחוץ. אלומה שמחברת בין ההמיספרות היא כפיס המוח."}]},
q21:{t:"t5",v:[
 {q:"איזה מבנה במערכת הלימבית קשור בעיקר ללמידה ולזיכרון?",a:"ההיפוקמפוס",w:["האמיגדלה","רכס החגורה","הגופים הדדיים"],e:"ההיפוקמפוס, באונת הרקה המדיאלית, חשוב ללמידה ולזיכרון. האמיגדלה קשורה לרגש, ובמיוחד לפחד."},
 {q:"מה מחבר את ההיפוקמפוס לגופים הדדיים?",a:"הפורניקס",w:["כפיס המוח","רגליות המוחון","תעלת המוח"],e:"הפורניקס הוא אלומת אקסונים שיוצאת מההיפוקמפוס אל הגופים הדדיים שבהיפותלמוס. כפיס המוח מחבר בין ההמיספרות."}]},
q22:{t:"t5",v:[
 {q:"איפה נמצא רכס החגורה?",a:"מעל כפיס המוח, לאורך הדופן המדיאלית",w:["בתוך אונת הרקה, ליד האמיגדלה","בגזע המוח, סביב תעלת המוח","בבסיס המוח, מאחורי ההיפותלמוס"],e:"רכס החגורה הוא קורטקס לימבי שעוטף את כפיס המוח מלמעלה. ההיפוקמפוס והאמיגדלה נמצאים באונת הרקה."},
 {q:"מה הציע מקלין לגבי המערכת הלימבית?",a:"שהאבולוציה שלה קשורה להתפתחות הרגשות",w:["שהיא אחראית בעיקר לתנועה רצונית","שהיא קיימת רק אצל בני אדם","שהיא מעבדת בעיקר מידע חזותי"],e:"פאפז ומקלין קשרו את המערכת לרגש. היום ידוע שחלק מהמבנים, כמו ההיפוקמפוס, חשובים בעיקר לזיכרון."}]},
q23:{t:"t5",v:[
 {q:"אילו מבנים שייכים לגנגליונים הבסיסיים?",a:"הגרעין הזנבי, הפוטמן והגלובוס פלידוס",w:["ההיפוקמפוס, האמיגדלה ורכס החגורה","התלמוס, ההיפותלמוס וההיפופיזה","התלילים העליונים והתחתונים"],e:"שלושת הגרעינים התת־קורטיקליים האלה בטלאנצפלון הם חלק חשוב מהמערכת המוטורית. ההיפוקמפוס והאמיגדלה שייכים למערכת הלימבית."},
 {q:"מה תפקידם העיקרי של הגנגליונים הבסיסיים?",a:"שליטה בתנועה",w:["עיבוד מידע שמיעתי","יצירת זיכרונות חדשים","ויסות של הטמפרטורה והרעב"],e:"הגנגליונים הבסיסיים הם רכיב מוטורי, ולכן נזק בהם גורם להפרעות תנועה כמו פרקינסון. ויסות טמפרטורה ורעב הוא תפקיד ההיפותלמוס."}]},
q24:{t:"t5",v:[
 {q:"מה גורם למחלת פרקינסון?",a:"ניוון של נוירוני דופמין בחומר השחור",w:["ניוון של נוירונים בהיפוקמפוס","נזק לקורטקס המוטורי הראשוני","חסימה של זרימת נוזל המוח והשדרה"],e:"הנוירונים בחומר השחור שולחים אקסונים לגרעין הזנבי ולפוטמן ופולטים שם דופמין. כשהם מתנוונים, השליטה בתנועה נפגעת."},
 {q:"איפה נמצאים גופי התאים שמתנוונים בפרקינסון?",a:"בחומר השחור, במוח האמצעי",w:["בגרעין הזנבי, בטלאנצפלון","בתלמוס, בדיאנצפלון","במוחון, במוח האחורי"],e:"גופי התאים בחומר השחור, והאקסונים שלהם מגיעים לגנגליונים הבסיסיים. לכן המחלה פוגעת בתפקוד הגנגליונים אף שהם עצמם לא מתנוונים."}]},
q25:{t:"t5",v:[
 {q:"מה תפקיד גרעין הברך הצידי בתלמוס?",a:"להעביר מידע מהרשתית לקורטקס הראייה",w:["להעביר מידע שמיעתי לקורטקס השמע","להעביר מידע מהמוחון לקורטקס המוטורי","לווסת את ההפרשה של ההיפופיזה"],e:"גרעין הברך הצידי הוא תחנת הממסר של הראייה. השמיעה עוברת דרך גרעין הברך המדיאלי, והמידע מהמוחון דרך הגרעין הגחוני־צידי."},
 {q:"איזה גרעין בתלמוס מעביר מידע מהמוחון לקורטקס המוטורי?",a:"הגרעין הגחוני־צידי",w:["גרעין הברך הצידי","גרעין הברך המדיאלי","הגרעין האדום"],e:"הגרעין הגחוני־צידי מקבל קלט מהמוחון ושולח אקסונים לקורטקס המוטורי הראשוני. הגרעין האדום נמצא במוח האמצעי."}]},
q26:{t:"t5",v:[
 {q:"איך שולט ההיפותלמוס בהיפופיזה הקדמית?",a:"באמצעות הורמונים משחררים שמגיעים אליה בכלי דם",w:["באמצעות אקסונים שמסתיימים בתוכה ופולטים הורמונים","באמצעות עצב התועה","באמצעות נוזל המוח והשדרה"],e:"ההיפופיזה הקדמית היא בלוטה, וההיפותלמוס שולט בה בהורמונים שמגיעים בכלי דם. אקסונים שמסתיימים בבלוטה מאפיינים את ההיפופיזה האחורית."},
 {q:"מה נכון לגבי ההיפופיזה האחורית?",a:"אקסונים מההיפותלמוס פולטים בה הורמונים לדם",w:["היא מייצרת בעצמה את רוב ההורמונים שלה","היא נשלטת על ידי הורמונים משחררים בדם","היא חלק מהגנגליונים הבסיסיים"],e:"ההורמונים, כמו אוקסיטוצין ווזופרסין, מיוצרים בגופי תאים בהיפותלמוס ומובלים באקסונים להיפופיזה האחורית, ושם נפלטים לדם."}]},
q27:{t:"t6",v:[
 {q:"מה תפקיד התלילים התחתונים?",a:"חלק ממערכת השמע; מסובבים את הראש לעבר צליל",w:["חלק ממערכת הראייה; מגיבים לגירויים נעים","ויסות של שינה וערות","תיאום של תנועות עדינות"],e:"התלילים התחתונים שייכים לשמיעה, והעליונים לראייה. שינה וערות קשורים לתצורת הרשת, ותיאום תנועות למוחון."},
 {q:"איזה מבנה במוח האמצעי קשור לשינה, לערות ולקשב?",a:"תצורת הרשת",w:["הגרעין האדום","התלילים העליונים","החומר השחור"],e:"תצורת הרשת היא רשת של יותר מ־90 גרעינים בליבת גזע המוח, ויש לה תפקיד בשינה וערות, קשב, טונוס שרירים ותנועה."}]},
q28:{t:"t6",v:[
 {q:"מה כולל גזע המוח?",a:"את המוח האמצעי, הגשר והמוח המוארך",w:["את המוחון, הגשר והמוח המוארך","את התלמוס, ההיפותלמוס והמוח האמצעי","את מוח השדרה והמוח המוארך בלבד"],e:"גזע המוח מתחיל במוח האמצעי ונמשך עד המוח המוארך. המוחון לא נכלל בו, אף שהוא מחובר אליו ברגליות."},
 {q:"איפה נמצא החומר האפור המרכזי (PAG)?",a:"בטגמנטום, סביב תעלת המוח",w:["בטקטום, מעל התלילים העליונים","בקורטקס, סביב החריץ הצידי","במוח השדרה, סביב התעלה המרכזית"],e:"ה־PAG מקיף את תעלת המוח במוח האמצעי, ויש בו מעגלים להתנהגויות טיפוסיות למין, כמו לחימה והזדווגות."}]},
q29:{t:"t6",v:[
 {q:"מה יקרה בעקבות נזק למוחון?",a:"קושי בעמידה, בהליכה ובתנועות מתואמות",w:["אובדן של הזיכרון לטווח ארוך","עיוורון בחצי משדה הראייה","הפסקה של הנשימה ופעולת הלב"],e:"המוחון מתאם תנועות בעזרת מידע חושי ומוטורי. אובדן זיכרון קשור להיפוקמפוס, והפסקת נשימה לנזק במוח המוארך."},
 {q:"איך יוצא הפלט מהמוחון לחלקים אחרים של המוח?",a:"דרך הגרעינים המוחוניים העמוקים",w:["ישירות מהקורטקס המוחוני לשרירים","דרך כפיס המוח","דרך החדר הרביעי"],e:"הקורטקס המוחוני שולח השלכות לגרעינים העמוקים, ואלה שולחים את הפלט החוצה דרך רגליות המוחון."}]},
q30:{t:"t6",v:[
 {q:"למה נזק למוח המוארך מסכן חיים?",a:"כי הוא מווסת נשימה, פעולת לב וכלי דם",w:["כי הוא מייצר את רוב נוזל המוח והשדרה","כי הוא מכיל את כל הזיכרונות לטווח ארוך","כי הוא מחבר בין שתי ההמיספרות"],e:"המוח המוארך הוא החלק האחורי ביותר של המוח, ושולט בתפקודים חיוניים. את ה־CSF מייצרת המקלעת הכורואידית."},
 {q:"איפה נמצא הגשר ביחס למוחון?",a:"גחונית למוחון",w:["גבית למוחון","בתוך המוחון","קדמית לטלאנצפלון"],e:"המוחון נמצא גבית לגשר, כלומר הגשר מתחתיו בצד הבטן. רגליות המוחון מחברות ביניהם."}]},
q31:{t:"t7",v:[
 {q:"איזה שורש של עצב השדרה מכיל סיבים סנסוריים?",a:"השורש הגבי",w:["השורש הגחוני","שני השורשים באותה מידה","אף אחד מהם, הם מוטוריים בלבד"],e:"השורש הגבי מביא מידע סנסורי, וגופי התאים שלו נמצאים בגנגליון השורש הגבי. השורש הגחוני מכיל סיבים מוטוריים."},
 {q:"חתכו את השורש הגחוני של עצב שדרה. מה צפוי?",a:"שיתוק השרירים שלו, עם תחושה תקינה",w:["אובדן תחושה, אבל תנועה תקינה","אובדן של תחושה ושל תנועה","אין השפעה, כי השורש הגבי מפצה"],e:"השורש הגחוני נושא את הפקודות המוטוריות, ולכן השרירים יפסיקו לזוז. המידע הסנסורי עובר בשורש הגבי ולא ייפגע."}]},
q32:{t:"t7",v:[
 {q:"עד איפה מגיע מוח השדרה בתוך עמוד השדרה?",a:"עד בערך חוליה L1, ומתחת לזה זנב הסוס",w:["עד עצם הזנב, לכל אורך עמוד השדרה","עד אמצע הצוואר בלבד","עד החוליה הראשונה של אזור החזה"],e:"מוח השדרה קצר מעמוד השדרה ומסתיים ב־L1. מתחת יש צרור שורשים, וזה מאפשר הרדמה בחסימה זנבית בלי לפגוע במוח השדרה."},
 {q:"איך מסודר החומר האפור במוח השדרה?",a:"בפנים, בצורת פרפר, והחומר הלבן מסביבו",w:["בחוץ, כמו בקורטקס, והחומר הלבן בפנים","מפוזר באופן אחיד בכל החתך","רק בצד הגבי של מוח השדרה"],e:"במוח השדרה הסידור הפוך לקורטקס: החומר האפור בפנים, והמסילות העולות והיורדות בחומר הלבן שמסביב."}]},
q33:{t:"t7",v:[
 {q:"מה מאפיין את עצב התועה (vagus)?",a:"הגדול בעצבי הגולגולת; סיבים פרסימפתיים לגוף",w:["עצב השדרה הגדול; מעביר מידע מהרגליים","עצב הגולגולת הקטן; שולט בתנועות העיניים","עצב שדרה שמעביר סיבים סימפתיים ללב"],e:"עצב התועה מחובר למוח ומגיע עד איברי החזה והבטן. הוא נושא סיבים של הענף הפרסימפתי, ולא של הסימפתי."},
 {q:"מה מגדיר אקסון מוציא (efferent)?",a:"יוצא מה־CNS עם פקודות לשרירים ולבלוטות",w:["נכנס למערכת העצבים המרכזית ומעביר מידע סנסורי","מחבר בין שני אזורים בתוך המוח","נמצא רק בשורש הגבי של עצבי השדרה"],e:"מוציא = Exit, יוצא מה־CNS. אקסון מביא (Afferent = Arrive) מגיע אל ה־CNS עם מידע סנסורי."}]},
q34:{t:"t7",v:[
 {q:"כמה זוגות של עצבי גולגולת יש?",a:"12",w:["31","8","24"],e:"יש 12 זוגות של עצבי גולגולת שמחוברים ישירות למוח. 31 הוא מספר הזוגות של עצבי השדרה."},
 {q:"כמה זוגות של עצבי שדרה יש?",a:"31",w:["12","24","50"],e:"השורש הגבי והגחוני מתמזגים ל־31 זוגות של עצבי שדרה שיוצאים בין החוליות. 12 הוא מספר עצבי הגולגולת."}]},
q35:{t:"t7",v:[
 {q:"איזה ענף פעיל כשאדם רואה פתאום דוב?",a:"הסימפתי: מאיץ את הלב ומרחיב אישונים",w:["הפרסימפתי: מאט את הלב ומגביר עיכול","הסומטי: מרפה את שרירי השלד","שני הענפים האוטונומיים פעילים באותה מידה"],e:"הענף הסימפתי מכין את הגוף לעירור ולהוצאת אנרגיה. הפרסימפתי פועל ברגיעה, ומגביר עיכול ושימור אנרגיה."},
 {q:"איפה נמצאים הגנגליונים של הענף הפרסימפתי?",a:"קרוב לאיברי המטרה",w:["בשרשרת לאורך עמוד השדרה","בתוך מוח השדרה","בתוך ליבת האדרנל"],e:"הגנגליונים הפרסימפתיים נמצאים ליד האיברים, ולכן הנוירון הפרה־גנגליוני ארוך. הגנגליונים הסימפתיים יוצרים שרשרת ליד עמוד השדרה."}]},
q36:{t:"t7",v:[
 {q:"מה תפקיד ליבת האדרנל?",a:"מפרישה לדם אפינפרין ונוראפינפרין בפקודה סימפתית",w:["מקבלת סיבים פרסימפתיים ומפרישה אצטילכולין","מייצרת את נוזל המוח והשדרה","שולטת בהיפופיזה הקדמית"],e:"ליבת האדרנל, מעל הכליה, פועלת כמו גנגליון סימפתי ששולח את התוצר שלו בדם. אצטילכולין משמש את הענף הפרסימפתי באיברי המטרה."},
 {q:"מה ההבדל בטרנסמיטר שמגיע לאיבר המטרה בשני הענפים?",a:"בסימפתי נוראפינפרין; בפרסימפתי אצטילכולין",w:["בסימפתי אצטילכולין; בפרסימפתי נוראפינפרין","בשניהם נוראפינפרין","בשניהם דופמין"],e:"הנוירון הפרה־גנגליוני משתמש באצטילכולין בשני הענפים. ההבדל בנוירון הפוסט־גנגליוני: נוראפינפרין בסימפתי ואצטילכולין בפרסימפתי."}]},
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#phys" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
