<div class="key"><b>למה הפרק הזה חשוב?</b> בפרק 2 למדנו איך תא עצב אחד עובד. כדי להבין איך המוח יוצר התנהגות, צריך גם <b>מפה</b>: איפה נמצא כל חלק, ומה התפקיד שלו. הפרק פותח בראיין, סטודנט שנה א׳ עם התקפים אפילפטיים שהתרופות כבר לא עצרו. המקור היה רקמת צלקת באונת הרקה השמאלית. הוא נותח <b>בהכרה</b>, והמנתח גירה בחשמל אזורים במוח כדי למצוא את האזורים של הבנת הדיבור, ולא לפגוע בהם. הניתוח הצליח, ההתקפים נעלמו. <b>המסר:</b> כדי לטפל במוח, צריך לדעת בדיוק מה נמצא איפה.<br><br>
<b>השאלה של הפרק במשפט אחד:</b> איך בנויה מערכת העצבים, מהמוח ועד העצבים בגוף, ואיזה תפקיד יש לכל חלק?<br><br>
<b>הפרק בנוי כמו מסע ״מבחוץ פנימה ומלמעלה למטה״:</b><br>
① <b>איך מתמצאים</b> (סעיף 1): כיוונים וחתכים.<br>
② <b>איך המוח מוגן</b> (סעיף 2): קרומים, חדרים ונוזל.<br>
③ <b>איך המוח נבנה</b> (סעיף 3): ההתפתחות.<br>
④ <b>מערכת העצבים המרכזית</b> (סעיפים 4–6): מהקורטקס, דרך מבנים פנימיים, ועד גזע המוח.<br>
⑤ <b>מוח השדרה והמערכת ההיקפית</b> (סעיף 7).<br>
<b>בשיעור:</b> שבועות 9–10. בשבוע 9 בעיקר כיוונים, חתכים, קרומים ו־CSF.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>מערכת העצבים המרכזית (CNS)</b></td><td>המוח ומוח השדרה. מוגנים בעצם.</td></tr>
<tr><td><b>מערכת העצבים ההיקפית (PNS)</b></td><td>כל העצבים שמחוץ למוח ולמוח השדרה.</td></tr>
<tr><td><b>גרעין / גנגליון</b></td><td>גוש של גופי תאי עצב. <b>בתוך</b> המוח = גרעין. <b>מחוצה לו</b> = גנגליון.</td></tr>
<tr><td><b>חומר אפור / לבן</b></td><td>אפור = גופי תאים. לבן = אקסונים עטופי מיאלין.</td></tr>
<tr><td><b>CSF</b></td><td>נוזל המוח והשדרה: נוזל צלול שהמוח צף בו.</td></tr>
<tr><td><b>מביא / מוציא</b></td><td>מביא = מידע <b>אל</b> מערכת העצבים המרכזית. מוציא = פקודות <b>ממנה</b> החוצה.</td></tr></table></div>

<h3>1. איך מתמצאים: כיוונים וחתכים</h3>
<p>לפני שמתחילים לטייל במוח, צריך ״שפה״ כדי לתאר איפה דברים נמצאים. כמו צפון ודרום במפה.</p>
<div class="ex"><b>הנויראקסיס</b> = קו דמיוני שעובר לאורך מערכת העצבים המרכזית, מהאף ועד ״הזנב״. כל הכיוונים מוגדרים ביחס אליו.</div>
<div class="tw"><table><tr><th>זוג כיוונים</th><th>מה זה אומר</th><th>דוגמה</th></tr>
<tr><td><b>קדמי (רוסטרלי) / אחורי (זנבי)</b></td><td>לכיוון האף / לכיוון הזנב</td><td>אונת המצח קדמית לאונת העורף</td></tr>
<tr><td><b>גבי / גחוני</b></td><td>לכיוון הגב (במוח: למעלה) / לכיוון הבטן (במוח: למטה)</td><td>המוחון גבי לגשר</td></tr>
<tr><td><b>צידי / מדיאלי</b></td><td>החוצה, לצדדים / פנימה, לקו האמצע</td><td>ההיפוקמפוס בחלק המדיאלי של אונת הרקה</td></tr>
<tr><td><b>איפסילטרלי / קונטרלטרלי</b></td><td>באותו צד / בצד הנגדי</td><td>יד ימין נשלטת מהמיספרה שמאל = קונטרלטרלי</td></tr></table></div>
<div class="ex"><b>למה ״גבי״ במוח זה ״למעלה״?</b> אצל חיה על ארבע, הגב והקודקוד באותו כיוון. אצל האדם, שעומד זקוף, הנויראקסיס <b>מתכופף</b> בגובה הצוואר. לכן במוח, גבי = לכיוון הקודקוד, ובמוח השדרה גבי = לכיוון הגב.<br>
<b>טריק:</b> ״גבי״ כמו סנפיר הגב של כריש, שבולט למעלה.</div>
<div class="ex"><b>שלושה חתכים</b> (איך ״פורסים״ מוח כדי להסתכל בתוכו):<br>
• <b>חתך רוחב (חזיתי)</b> = ניצב לנויראקסיס. כמו לפרוס לחם לפרוסות.<br>
• <b>חתך אופקי</b> = מקביל לקרקע. כמו להוריד את ״המכסה״ של הראש.<br>
• <b>חתך סגיטלי</b> = מקביל לנויראקסיס וניצב לקרקע, כלומר חותך בין ימין לשמאל. <b>מיד־סגיטלי</b> = בדיוק בקו האמצע, ומקבלים שני חצאים סימטריים.</div>

<h3>2. איך המוח מוגן: קרומים, חדרים ו־CSF</h3>
<p>עכשיו, כשאפשר לתאר מיקום, מתחילים מבחוץ: מה עוטף את המוח ושומר עליו. המוח רגיש מאוד: הוא מקבל כ־20% מהדם שהלב מזרים, ברציפות, כי הוא לא יכול לאגור גלוקוז ולא לפעול בלי חמצן.</p>
<div class="tw"><table><tr><th>קרום (מבחוץ פנימה)</th><th>איך הוא</th></tr>
<tr><td><b>1. קרום קשה</b> (דורה)</td><td>חיצוני, עבה, גמיש אבל לא נמתח</td></tr>
<tr><td><b>2. קרום הקורים</b> (ארכנואיד)</td><td>אמצעי, רך וספוגי</td></tr>
<tr><td><b>חלל תת־קורי</b></td><td>הרווח בין הקורים לקרום העדין, <b>מלא CSF</b></td></tr>
<tr><td><b>3. קרום עדין</b> (פיה)</td><td>פנימי, צמוד למוח, עם כלי דם קטנים</td></tr></table></div>
<div class="ex"><b>במערכת ההיקפית</b> יש רק קרום קשה וקרום עדין, והם מתמזגים לעטיפה של העצב.</div>
<div class="ex"><b>חדרי המוח ומסלול ה־CSF:</b><br>
<b>איפה נוצר?</b> ב<b>מקלעת הכורואידית</b>, רקמה עשירה בכלי דם בתוך החדרים.<br>
<b>המסלול:</b> 2 <b>חדרים צידיים</b> ← <b>חדר שלישי</b> (במרכז) ← <b>תעלת המוח</b> (צינור צר) ← <b>חדר רביעי</b> (בין המוחון לגשר) ← החוצה לחלל התת־קורי ← נספג לדם בגת הסגיטלית העילית.<br>
<b>כמויות:</b> כ־125 מ״ל בכל רגע, מתחלף כ־3 פעמים ביום.<br>
<b>התפקיד:</b> <b>ריפוד</b>. המוח צף בנוזל, ולכן ״שוקל״ בפועל כ־80 גרם במקום 1,400, ומוגן מפני חבטות. <b>דימוי:</b> כמו ביצה בתוך צנצנת מלאה מים.</div>
<div class="ex"><b>הידרוצפלוס חסימתי</b> = משהו חוסם את זרימת ה־CSF, למשל גידול בתעלת המוח. הנוזל ממשיך להיווצר ולא יוצא, החדרים מתרחבים ולוחצים על המוח. אצל תינוקות הראש עצמו גדל. <b>הטיפול:</b> צינור ניקוז מהחדר הצידי לחלל הבטן, עם שסתום לחץ.</div>

<h3>3. איך המוח נבנה: התפתחות מערכת העצבים</h3>
<p>לפני שמסתכלים על החלקים של המוח הבוגר, כדאי להבין מאיפה הם באו. השמות של חלקי המוח מגיעים מהשלבים הראשונים בעובר.</p>
<div class="ex"><b>מצינור לשלושה חלקים:</b> בערך ביום 21–28 נוצר <b>צינור העצבים</b>. הוא מתחלק לשלושה חללים: <b>מוח קדמי</b>, <b>מוח אמצעי</b> ו<b>מוח אחורי</b>. אחר כך הקדמי והאחורי מתחלקים שוב.</div>
<div class="tw"><table><tr><th>חלוקה</th><th>חלק</th><th>חדר</th><th>מבנים עיקריים</th></tr>
<tr><td rowspan="2"><b>מוח קדמי</b></td><td>טלאנצפלון</td><td>צידיים</td><td>קורטקס, גנגליונים בסיסיים, מערכת לימבית</td></tr>
<tr><td>דיאנצפלון</td><td>שלישי</td><td>תלמוס, היפותלמוס</td></tr>
<tr><td><b>מוח אמצעי</b></td><td>מזאנצפלון</td><td>תעלת המוח</td><td>טקטום, טגמנטום</td></tr>
<tr><td rowspan="2"><b>מוח אחורי</b></td><td>מטאנצפלון</td><td>רביעי</td><td>מוחון, גשר</td></tr>
<tr><td>מיילאנצפלון</td><td>-</td><td>מוח מוארך</td></tr></table></div>
<div class="ex"><b>איך נוצר קורטקס גדול:</b> בשכבה הפנימית של הצינור (<b>האזור החדרי</b>) יש <b>תאי אב</b> שמתחלקים בשני שלבים:<br>
① <b>חלוקה סימטרית:</b> תא אב ← שני תאי אב. כך האזור גדל. אצל האדם השלב הזה נמשך <b>כ־7 שבועות</b>, ואצל עכבר <b>יומיים</b>. <b>לכן</b> יש לנו קורטקס גדול: שינוי קטן בגנים שקובעים <b>תזמון</b> יוצר הבדל גדול.<br>
② <b>חלוקה אסימטרית:</b> תא אב ← תא אב + נוירון שנודד החוצה.</div>
<div class="ex"><b>נדידה:</b> הנוירונים ״מטפסים״ לאורך <b>תאי גלייה רדיאליים</b>, כמו על חבל. הם נודדים <b>מבפנים החוצה</b>: הנוירונים האחרונים חולפים על פני הקודמים ובונים את השכבות החיצוניות.<br>
<b>ואז, מוות מתוכנן:</b> נוצרים יותר נוירונים ממה שצריך. נוירון שלא יצר קשרים לא מקבל <b>גורם נוירוטרופי</b> (״אות חיים״), ועובר <b>אפופטוזה</b>, מוות תאי מתוכנת. כ־50% מהנוירונים מתים.<br>
<b>אחרי הלידה</b> הניסיון ממשיך לעצב: קשרים שבשימוש נשמרים, ואחרים ״נגזמים״. הקורטקס הקדם־מצחי מבשיל אחרון, בשנות ה־20. <b>נוירוגנזה</b> במוח הבוגר קורית בבולבוס ההרחה ובהיפוקמפוס. סביבה מועשרת מגבירה אותה, ולחץ מפחית.</div>

<h3>4. המוח הקדמי: הקורטקס</h3>
<p>מתחילים את הסיור במוח הבוגר מבחוץ: הקורטקס, השכבה המקומטת שמכסה את ההמיספרות.</p>
<div class="ex"><b>למה הקורטקס מקומט?</b> הקמטים מגדילים את שטח הפנים. בערך שני שלישים ממנו חבויים בתוך הקפלים. <b>דימוי:</b> כמו לקמט דף גדול כדי להכניס אותו לכוס.<br>
<b>שמות:</b> <b>מענית</b> = חריץ רגיל. <b>חריץ</b> = עמוק. <b>רכס</b> = הבליטה שבין החריצים.</div>
<div class="tw"><table><tr><th>אונה</th><th>תפקיד מרכזי</th><th>אזור ראשוני</th></tr>
<tr><td><b>מצח</b></td><td>תכנון וביצוע תנועות</td><td>מוטורי ראשוני: הרכס <b>לפני</b> המענית המרכזית</td></tr>
<tr><td><b>קודקוד</b></td><td>תחושה מהגוף, תפיסת מרחב</td><td>סומטו־סנסורי: הרכס <b>אחרי</b> המענית המרכזית</td></tr>
<tr><td><b>רקה</b></td><td>שמיעה, וגם זיהוי חזותי של עצמים</td><td>שמע: בגדה התחתונה של החריץ הצידי</td></tr>
<tr><td><b>עורף</b></td><td>ראייה</td><td>ראייה: לאורך החריץ הדורבני</td></tr></table></div>
<div class="ex"><b>שלושה ״קווי גבול״:</b> <b>המענית המרכזית</b> מפרידה בין המצח לקודקוד. <b>החריץ הצידי</b> מפריד בין הרקה למצח ולקודקוד. <b>האינסולה</b> היא קורטקס שקוע מתחת לחריץ הצידי (טעם, מודעות לגוף).<br>
<b>טריק לזכור:</b> לפני המענית המרכזית = <b>עושים</b> (תנועה). אחריה = <b>מרגישים</b> (תחושה).</div>
<div class="ex"><b>שלושה סוגי קורטקס:</b><br>
• <b>ראשוני</b> = מקבל מידע ישירות מהחושים, או שולח פקודות ישירות לשרירים. המוטורי הראשוני מייצג את הגוף <b>הפוך</b> ו<b>בצד הנגדי</b>.<br>
• <b>אסוציאטיבי חושי</b> = סביב האזורים הראשוניים, ״מבין״ את המידע. <b>פגיעה</b> בקורטקס האסוציאטיבי החזותי גורמת ל<b>אגנוזיה חזותית</b>: האדם רואה, אבל לא מזהה מה הוא רואה.<br>
• <b>אסוציאטיבי מוטורי</b> = לפני המוטורי הראשוני, מתכנן תנועות. לפניו ה<b>קדם־מצחי</b>: תכנון, אסטרטגיה ותפקודים ניהוליים.<br>
<b>הכלל הכללי:</b> החצי ה<b>אחורי</b> של הקורטקס עוסק בתפיסה ולמידה, החצי ה<b>קדמי</b> בתכנון ובתנועה.</div>
<div class="ex"><b>לטרליזציה</b> = חלוקת תפקידים בין ההמיספרות. <b>שמאל:</b> שפה, ניתוח רצפים, חשבון. <b>ימין:</b> חיבור לשלם, מרחב, ציור, זיהוי פנים, רגש בקול. <b>כפיס המוח</b> מחבר ביניהן.</div>

<h3>5. בתוך המוח הקדמי: מערכת לימבית, גנגליונים בסיסיים ודיאנצפלון</h3>
<p>מתחת לקורטקס יש מבנים עמוקים יותר. כל קבוצה קשורה לסוג אחר של התנהגות: רגש וזיכרון, תנועה, וויסות הגוף.</p>
<div class="ex"><b>המערכת הלימבית</b> (קשורה לרגש ולזיכרון):<br>
• <b>רכס החגורה</b>: קורטקס לימבי מעל כפיס המוח.<br>
• <b>היפוקמפוס</b>: בחלק המדיאלי של אונת הרקה. למידה וזיכרון.<br>
• <b>אמיגדלה</b>: באונת הרקה, לפני ההיפוקמפוס. רגש ופחד.<br>
• <b>פורניקס</b>: ״כבל״ של אקסונים מההיפוקמפוס אל <b>הגופים הדדיים</b> שבהיפותלמוס.</div>
<div class="ex"><b>הגנגליונים הבסיסיים</b> (קשורים לתנועה): גרעין זנבי, פוטמן וגלובוס פלידוס.<br>
<b>פרקינסון:</b> רעד, נוקשות וקושי <b>להתחיל</b> תנועה. הסיבה: ניוון של נוירוני דופמין ב<b>חומר השחור</b> (במוח האמצעי), שהאקסונים שלהם מגיעים לגרעין הזנבי ולפוטמן.<br>
<b>הנטינגטון:</b> ניוון בגרעין הזנבי ובפוטמן, ותנועות לא רצוניות.</div>
<div class="tw"><table><tr><th>דיאנצפלון</th><th>מה הוא עושה</th><th>דוגמה</th></tr>
<tr><td><b>תלמוס</b></td><td>תחנת ממסר: מעביר מידע לקורטקס. כל החושים חוץ מריח עוברים בו</td><td>גרעין הברך הצידי: ראייה. המדיאלי: שמיעה</td></tr>
<tr><td><b>היפותלמוס</b></td><td>שולט במערכת האוטונומית ובהורמונים. התנהגויות הישרדות: לחימה, אכילה, בריחה, הזדווגות</td><td>ויסות חום ושתייה</td></tr></table></div>
<div class="ex"><b>ההיפותלמוס ובלוטת ההיפופיזה:</b><br>
• <b>היפופיזה קדמית</b> = בלוטה. ההיפותלמוס שולט בה ב<b>הורמונים משחררים</b> שעוברים בכלי דם קטנים.<br>
• <b>היפופיזה אחורית</b> = רקמה עצבית. אקסונים מההיפותלמוס מובילים אליה <b>אוקסיטוצין</b> (הנקה, לידה, קשר) ו<b>ואזופרסין</b> (שמירת מים בכליות), ומשחררים אותם לדם.</div>

<h3>6. המוח האמצעי והמוח האחורי</h3>
<p>יורדים עוד למטה, אל גזע המוח והמוחון. כאן נמצאים מבנים שמפעילים תגובות אוטומטיות ותפקודים חיוניים.</p>
<div class="ex"><b>המוח האמצעי</b> (מסביב לתעלת המוח):<br>
<b>טקטום</b> (״גג״, גבי): <b>תלילים עליונים</b> לראייה (תגובה לגירוי נע), <b>תלילים תחתונים</b> לשמיעה (סיבוב הראש לעבר צליל).<br>
<b>טגמנטום</b> (גחוני):<br>
• <b>חומר אפור מרכזי</b>: התנהגויות טיפוסיות למין, ודיכוי כאב על ידי אופיאטים.<br>
• <b>תצורת הרשת</b>: ליבת גזע המוח. שינה ועירור, קשב, טונוס שרירים.<br>
• <b>הגרעין האדום</b>: מעביר פקודות תנועה למוח השדרה.<br>
• <b>החומר השחור</b>: דופמין לגנגליונים הבסיסיים (פרקינסון).<br>
• <b>האזור הטגמנטלי הגחוני</b>: דופמין לקורטקס ולמערכת הלימבית. קשב, הנאה, הנעה, התמכרות.</div>
<div class="ex"><b>המוח האחורי:</b><br>
• <b>מוחון</b> (גבי לגשר): מקבל מידע מהחושים ומהקורטקס המוטורי, ו<b>מתאם</b> תנועות חלקות ומדויקות, למידה מוטורית ותזמון. <b>דוגמה:</b> פסנתרן שמנגן מהר בלי לחשוב על כל אצבע. <b>נזק</b> גורם לקושי לעמוד וללכת, ולתנועות לא מתואמות.<br>
• <b>גשר</b>: חלק מתצורת הרשת (שינה ועירור), וממסר מהקורטקס למוחון.<br>
• <b>מוח מוארך</b>: החלק התחתון ביותר. שולט ב<b>תפקודים חיוניים</b>: לב, כלי דם, נשימה. <b>נזק בו גורם למוות.</b><br>
<b>גזע המוח</b> = מוח אמצעי + גשר + מוח מוארך. <b>המוחון לא כלול.</b></div>

<h3>7. מוח השדרה והמערכת ההיקפית</h3>
<p>לסיום, יוצאים מהגולגולת: איך המוח ״מדבר״ עם הגוף.</p>
<div class="ex"><b>מוח השדרה:</b> מעביר מידע מהגוף למוח, ופקודות מהמוח לשרירים, ואחראי על רפלקסים. הוא <b>קצר</b> מעמוד השדרה: נגמר בערך בחוליה המותנית הראשונה. מתחתיו יש צרור שורשים בשם <b>זנב הסוס</b>. לשם מזריקים הרדמה בלידה.<br>
<b>שני שורשים:</b> <b>גבי</b> = סיבים <b>מביאים</b> (תחושה). <b>גחוני</b> = סיבים <b>מוציאים</b> (תנועה). הם מתאחדים ל־31 זוגות עצבי שדרה.<br>
<b>טריק:</b> מביא = Approach (מתקרב), מוציא = Exit (יוצא).<br>
<b>חתך רוחב:</b> החומר ה<b>אפור</b> במרכז (בצורת פרפר), והחומר ה<b>לבן</b> מסביב. <b>הפוך מהמוח</b>, שבו האפור בחוץ.</div>
<div class="ex"><b>עצבי גולגולת:</b> 12 זוגות שיוצאים ישירות מהמוח, ומשרתים בעיקר את הראש והצוואר. חלקם תחושתיים, חלקם תנועתיים, וחלקם שניהם. <b>עצב התועה</b> (מספר 10) הוא הארוך ביותר, ומגיע לאיברי החזה והבטן.<br>
<b>מערכת סומטית</b> = החלק ה״רצוני״: מביאה מידע מהחושים ומפעילה את שרירי השלד.</div>
<div class="tw"><table><tr><th></th><th>ענף סימפתי</th><th>ענף פרסימפתי</th></tr>
<tr><td><b>התפקיד</b></td><td>עירור והוצאת אנרגיה: ״הילחם או ברח״</td><td>רגיעה ושמירת אנרגיה: ״מנוחה ועיכול״</td></tr>
<tr><td><b>דוגמאות</b></td><td>דופק עולה, אישונים מתרחבים, זיעה, עיכול נעצר</td><td>רוק, תנועת מעיים, דופק יורד</td></tr>
<tr><td><b>מאיפה יוצא</b></td><td>אזור החזה והמותן במוח השדרה</td><td>עצבי גולגולת (בעיקר התועה) ואזור העצה</td></tr>
<tr><td><b>איפה הגנגליונים</b></td><td>בשרשרת ליד עמוד השדרה</td><td>ליד האיברים עצמם</td></tr>
<tr><td><b>נוירוטרנסמיטר אחרון</b></td><td>נוראפינפרין (חוץ מבלוטות זיעה)</td><td>אצטילכולין</td></tr></table></div>
<div class="ex"><b>המערכת האוטונומית</b> שולטת בשריר חלק, בלב ובבלוטות, דרך <b>שני נוירונים</b>: אחד מתוך מערכת העצבים המרכזית אל גנגליון, ושני מהגנגליון אל האיבר.<br>
<b>דוגמה:</b> כשמשהו מבהיל אותך בלילה, הלב דופק והידיים מזיעות (סימפתי). אחרי ארוחה טובה על הספה, הגוף ״מתפנה״ לעיכול (פרסימפתי).<br>
<b>ליבת האדרנל</b> (מעל הכליה) מקבלת סיבים סימפתיים ומשחררת אפינפרין ונוראפינפרין לדם.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. כדי לקשר בין מבנה להתנהגות צריך מפה: <b>כיוונים</b> (קדמי־אחורי, גבי־גחוני, צידי־מדיאלי) ו<b>חתכים</b> (רוחב, אופקי, סגיטלי).<br>
2. המוח מוגן ב<b>שלושה קרומים</b> וצף ב־<b>CSF</b>, שנוצר בחדרים וזורם במסלול קבוע. חסימה גורמת להידרוצפלוס.<br>
3. המוח מתפתח מ<b>צינור העצבים</b> לשלושה חלקים, ומשך החלוקות הסימטריות קובע את גודל הקורטקס. נוירונים מיותרים מתים באפופטוזה.<br>
4. ב<b>קורטקס</b> ארבע אונות עם אזורים ראשוניים ואסוציאטיביים. מתחתיו: <b>לימבית</b> (רגש וזיכרון), <b>גנגליונים בסיסיים</b> (תנועה), <b>תלמוס</b> (ממסר) ו<b>היפותלמוס</b> (הורמונים והישרדות). למטה: המוח האמצעי, המוחון והמוח המוארך.<br>
5. <b>מוח השדרה</b> ועצבי הגולגולת מחברים את המוח לגוף, וה<b>מערכת האוטונומית</b> מווסתת את הגוף בשני ענפים מנוגדים.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לתאר מיקום בעזרת מונחי כיוון, ולזהות סוג חתך.<br>
• למנות את הקרומים לפי הסדר, ואת מסלול ה־CSF.<br>
• להסביר הידרוצפלוס.<br>
• לשייך מבנה לחלוקה העוברית שלו (טבלת חלוקות המוח).<br>
• לשייך כל אונה ואזור ראשוני לתפקיד, ולתאר את אזורי האסוציאציה.<br>
• לשייך מבנים עמוקים לתפקידים ולמחלות (פרקינסון, הנטינגטון).<br>
• להבחין בין מביא למוציא, ובין סימפתי לפרסימפתי.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>גבי במוח = למעלה</b> (בגלל הכיפוף של הנויראקסיס).</li>
<li><b>גרעין</b> = בתוך המוח. <b>גנגליון</b> = מחוץ לו. (החריג בשם: ״גנגליונים בסיסיים״ נמצאים בתוך המוח.)</li>
<li><b>ה־CSF בחלל התת־קורי</b>, בין קרום הקורים לקרום העדין.</li>
<li><b>מוטורי ראשוני לפני</b> המענית המרכזית, <b>סומטו־סנסורי אחריה</b>.</li>
<li><b>גזע המוח לא כולל את המוחון.</b></li>
<li><b>פרקינסון</b>: הנוירונים שמתים בחומר השחור, אבל ההשפעה בגנגליונים הבסיסיים.</li>
<li><b>במוח השדרה האפור במרכז</b>, הפוך מהמוח.</li>
<li><b>שורש גבי = תחושה (מביא)</b>, <b>שורש גחוני = תנועה (מוציא)</b>.</li>
<li><b>ריח לא עובר בתלמוס.</b></li>
</ul></div>`;

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function checkBox(t,bi){

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=(dir)=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1,answered=items.filter(x=>x.pick!=null).length;
    show(`<div class="stack quiz exam">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length} · נענו ${answered}`,"יציאה מהמבחן")}
     <div class="q"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div></div>
     <div class="pager">${i?`<button class="ghost" id="pv">${ic("arrowR")}<span>הקודמת</span></button>`:"<span></span>"}<button class="primary" id="nx" ${it.pick==null?"disabled":""}><span>${last?"הגשה ובדיקה":"השאלה הבאה"}</span>${ic("arrowL")}</button></div></div>`,dir);
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home("back");else{bk.dataset.sure=1;bk.querySelector("span").textContent="לחצו שוב ליציאה (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");b.style.setProperty("--i",k);
      b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
