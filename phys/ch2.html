② <b>גוף התא</b>: המרכז, עם הגרעין ורוב ״מכונות״ התא. שומר על התא בחיים.<br>
③ <b>אקסון</b>: שלוחה ארוכה ודקה שמעבירה את המסר החשמלי לקצה. ארוך = אפשר להעביר מסר רחוק, למשל ממוח השדרה עד כף הרגל. כמו <b>כבל</b>.<br>
④ <b>כפתורים סופיים</b>: הקצוות של האקסון. כאן המסר <b>החשמלי</b> הופך ל<b>כימי</b>: הם משחררים נוירוטרנסמיטר לתא הבא. כמו <b>משדרים</b>.</div>
<h4>שלושה סוגים לפי תפקיד: רפלקס הרתיעה</h4>
<div class="ex"><b>נוגעים במגהץ חם, ושלושה נוירונים עובדים לפי הסדר:</b><br>
① <b>נוירון סנסורי</b> (תחושתי): הדנדריטים שלו בעור מרגישים את החום, והוא שולח מסר עד מוח השדרה.<br>
② <b>אינטרנוירון</b>: נמצא כולו בתוך ה־CNS. הוא מקבל את המסר ומעביר אותו לנוירון המוטורי. ה״מתווך״.<br>
③ <b>נוירון מוטורי</b>: גוף התא שלו במוח השדרה, והאקסון שלו מגיע עד השריר. הוא משחרר נ״ט, השריר מתכווץ, והיד נרתעת.<br>
<b>שימו לב:</b> כל זה קורה במוח השדרה, בלי שהמוח ״מחליט״. לכן הרתיעה כל כך מהירה.</div>
<div class="tw"><table><tr><th>צורה</th><th>איך הוא נראה</th><th>איפה נמצא</th></tr>
<tr><td><b>רב־קוטבי</b></td><td>אקסון אחד והרבה דנדריטים</td><td>הכי נפוץ ב־CNS</td></tr>
<tr><td><b>דו־קוטבי</b></td><td>שלוחה אחת בכל צד של גוף התא</td><td>חושים: ראייה ושמיעה</td></tr>
<tr><td><b>חד־קוטבי</b></td><td>שלוחה אחת שמתפצלת לשניים</td><td>מגע, כאב, טמפרטורה</td></tr></table></div>
<h4>האברונים: ״המפעל״ בתוך התא</h4>
<p>המרצה מבקשת לעמוד על התפקיד של ארבעה חלקים:</p>
<div class="tw"><table><tr><th>חלק</th><th>מה הוא עושה</th><th>דימוי</th></tr>
<tr><td><b>ממברנת התא</b></td><td>קובעת מה נכנס לתא ומה יוצא, דרך תעלות ומשאבות. בלעדיה לא היה מתח חשמלי</td><td>הקיר עם הדלתות</td></tr>
<tr><td><b>גרעין</b></td><td>מכיל את ה־DNA. קטע ממנו מועתק ל־<b>mRNA</b>, שיוצא לריבוזום, ושם מייצרים לפיו חלבון</td><td>ספר ההוראות</td></tr>
<tr><td><b>מיטוכונדריה</b></td><td>מייצרת אנרגיה בצורת <b>ATP</b>. למשל לתנועת חומרים באקסון ולמשאבת הנתרן־אשלגן</td><td>תחנת הכוח</td></tr>
<tr><td><b>מנגנון גולג׳י</b></td><td>אורז חומרים ב״שקיות״ (שלפוחיות), למשל את הנוירוטרנסמיטרים שישוחררו בכפתורים</td><td>מחלקת האריזה</td></tr></table></div>
<div class="ex"><b>תובלה באקסון:</b> האקסון ארוך, וחומרים צריכים לנסוע לאורכו על ״מסילות״ (מיקרוטובולים), באנרגיה של ATP. <b>קדימה</b>, מגוף התא לכפתורים: החלבון <b>קינזין</b>, עד 500 מ״מ ביום. <b>אחורה</b>, מהכפתורים לגוף התא: <b>דינאין</b>, בערך בחצי מהמהירות. <b>טריק לזכירה:</b> <b>ק</b>ינזין = <b>ק</b>דימה.</div>

<h3>3. תאי התמך: הצוות שדואג לנוירונים</h3>
<p>כמו שהשם אומר, הם <b>תומכים</b> בנוירונים ועוזרים להם לתפקד בצורה מסודרת: מזינים, מבודדים, מנקים ומתקנים.</p>
<div class="tw"><table><tr><th>תא</th><th>איפה</th><th>מה הוא עושה</th></tr>
<tr><td><b>אסטרוציט</b> (״תא כוכב״)</td><td>CNS</td><td>מחזיק את הנוירונים במקום, מנקה פסולת, ומזין: הופך סוכר מהדם ל<b>לקטט</b> ומעביר לנוירונים. כשתאים מתים, הוא מפנה אותם ויוצר <b>צלקת</b></td></tr>
<tr><td><b>אוליגודנדרוציט</b></td><td>CNS</td><td>עוטף אקסונים ב<b>מיילין</b>, שכבה שומנית מבודדת. תא אחד עוטף <b>כמה</b> אקסונים (עד 50 מקטעים)</td></tr>
<tr><td><b>מיקרוגלייה</b></td><td>CNS</td><td>מערכת החיסון של המוח: דלקת ופינוי</td></tr>
<tr><td><b>תא שוואן</b></td><td>PNS</td><td>עוטף במיילין <b>אקסון אחד</b> בלבד, ועוזר לעצב פגוע לצמוח מחדש</td></tr></table></div>
<div class="ex"><b>השוואה שהמרצה מבקשת: אוליגודנדרוציט מול תא שוואן.</b><br>
<b>מה משותף:</b> שניהם מייצרים מיילין.<br>
<b>הבדל 1, מיקום:</b> אוליגודנדרוציט ב־CNS, תא שוואן ב־PNS.<br>
<b>הבדל 2, כמות:</b> אוליגודנדרוציט עוטף כמה אקסונים, תא שוואן רק אחד.<br>
<b>הבדל 3, תיקון:</b> אם חותכים עצב באצבע (PNS), תאי שוואן יוצרים ״צינור״ והאקסון צומח בתוכו מחדש, 3–4 מ״מ ביום. במוח (CNS) האסטרוציטים יוצרים צלקת והאקסון לא צומח. כלומר ההבדל ביכולת להחלים הוא בגלל <b>תאי התמך</b>, לא בגלל הנוירונים.<br>
<b>דוגמה:</b> בטרשת נפוצה מערכת החיסון תוקפת את המיילין של <b>האוליגודנדרוציטים</b>, ולכן המחלה פוגעת רק במוח ובמוח השדרה.</div>
<div class="ex"><b>מחסום הדם־מוח:</b> בכלי דם רגילים יש ״חריצים״ בדופן, וחומרים עוברים מהדם לגוף בקלות. בכלי הדם של <b>המוח</b> התאים צמודים, ורק חומרים מסוימים עוברים. זה מגן על המוח מגורמי מחלה ושומר על הנוזל סביב הנוירונים יציב, כדי שההעברה העצבית תעבוד. החיסרון: קשה להכניס תרופות, למשל לאלצהיימר ופרקינסון.<br>
<b>יוצא דופן:</b> ב<b>אזור הפוסט־רמה</b> המחסום חלש בכוונה. הנוירונים שם מזהים רעלים בדם וגורמים להקאה.</div>

<h3>4. מתח חשמלי ופוטנציאל המנוחה: למה התא ״טעון״</h3>
<p>עכשיו עוברים לחלק השני: איך המסר עובר <b>בתוך</b> הנוירון. התשובה היא חשמל. אבל כדי להבין את ה״ירייה״, צריך קודם להבין את מצב <b>המנוחה</b>. כשהנוירון לא מקבל שום מסר, הוא כמו <b>סוללה טעונה</b>: הפנים שלו שלילי בערך ב־<b>70− מ״ו</b> ביחס לחוץ. לזה קוראים <b>פוטנציאל המנוחה</b>. חוקרים מודדים אותו בעזרת <b>מיקרו־אלקטרודה</b>, מחט חשמלית דקה מאוד שמחדירים לתוך האקסון.</p>
<h4>שני כוחות שמזיזים יונים</h4>
<div class="ex"><b>כוח הדיפוזיה = מהצפוף לפנוי.</b> חלקיקים מתפזרים ממקום שיש בו הרבה מהם למקום שיש בו מעט, עד שהם מפוזרים שווה. כמו טיפת דיו שמתפזרת בכוס מים.<br><br>
<b>לחץ אלקטרוסטטי = מנוגדים נמשכים, זהים נדחים.</b> כמו מגנטים. הפנים של התא שלילי, ולכן הוא <b>מושך</b> יונים חיוביים פנימה ו<b>דוחה</b> יונים שליליים החוצה.</div>
<div class="tw"><table><tr><th>יון</th><th>איפה יש ממנו יותר, ומה הכוחות עושים</th><th>התוצאה</th></tr>
<tr><td><b>אשלגן K⁺</b></td><td>יותר <b>בפנים</b>. הדיפוזיה דוחפת החוצה, המינוס שבפנים מושך פנימה</td><td>כמעט מאוזן</td></tr>
<tr><td><b>כלור Cl⁻</b></td><td>יותר <b>בחוץ</b>. הדיפוזיה דוחפת פנימה, אבל המינוס שבפנים דוחה אותו החוצה</td><td>מאוזן</td></tr>
<tr><td><b>נתרן Na⁺</b></td><td>יותר <b>בחוץ</b>. הדיפוזיה דוחפת פנימה, <b>וגם</b> המינוס שבפנים מושך פנימה</td><td><b>שני הכוחות דוחפים פנימה!</b></td></tr>
<tr><td><b>חלבונים A⁻</b></td><td>רק בפנים, גדולים מדי לצאת</td><td>תורמים למינוס שבפנים</td></tr></table></div>
<div class="ex"><b>אז למה הנתרן לא נכנס? זו השאלה המרכזית של הסעיף.</b><br>
① במנוחה הממברנה כמעט <b>לא נותנת לו לעבור</b>. החדירות לאשלגן גבוהה פי כ־100.<br>
② <b>משאבת נתרן־אשלגן</b> מוציאה כל הזמן את מעט הנתרן שמצליח להיכנס: בכל סבב <b>3 נתרן החוצה</b> ו<b>2 אשלגן פנימה</b>, באנרגיה של ATP. היא צורכת עד 40% מהאנרגיה של התא.<br><br>
<b>דימוי:</b> הנתרן הוא קהל שעומד מחוץ להופעה ורוצה מאוד להיכנס. השער (הממברנה) כמעט סגור, והסדרנים (המשאבה) מוציאים כל מי שמתגנב. ברגע שהשער ייפתח, כולם יזנקו פנימה. זה בדיוק פוטנציאל הפעולה.</div>

<h3>5. פוטנציאל הפעולה: הנוירון ״יורה״</h3>
<p>כשהנוירון מקבל מספיק מסרים מעוררים, הפנים שלו נהיה פחות שלילי (<b>דפולריזציה</b>). אם הוא מגיע ל<b>סף העירור</b>, בערך <b>55− מ״ו</b>, מתרחש <b>פוטנציאל פעולה</b>: שינוי חשמלי מהיר שנמשך כאלפית שנייה. בשפה יומיומית, ״הנוירון יורה״. המרצה מבקשת לדעת לגבי כל שלב <b>לאיזה יון הממברנה חדירה</b>, ומה <b>המתח</b>:</p>
<div class="tw"><table><tr><th>שלב</th><th>מה נפתח ומה זז</th><th>המתח</th></tr>
<tr><td><b>מנוחה</b></td><td>תעלות הנתרן סגורות; המשאבה עובדת</td><td>70− מ״ו</td></tr>
<tr><td><b>1. הגעה לסף</b></td><td>נפתחות <b>תעלות נתרן</b> תלויות מתח</td><td>55− מ״ו</td></tr>
<tr><td><b>2. דפולריזציה</b></td><td>הממברנה חדירה ל<b>נתרן</b>, שמסתער פנימה בשני הכוחות. הפנים הופך לחיובי</td><td>עד 40+ מ״ו</td></tr>
<tr><td><b>3. שיא</b></td><td>תעלות הנתרן <b>נחסמות</b>. נפתחות <b>תעלות אשלגן</b>, ועכשיו כשהפנים חיובי, שני הכוחות דוחפים את האשלגן החוצה</td><td>מתחיל לרדת</td></tr>
<tr><td><b>4. היפר־פולריזציה</b></td><td>האשלגן ממשיך לצאת, והפנים נהיה שלילי <b>יותר</b> ממנוחה</td><td>מתחת ל־70−</td></tr>
<tr><td><b>5. חזרה למנוחה</b></td><td>תעלות האשלגן נסגרות, המשאבה מחזירה את הסדר</td><td>70− מ״ו</td></tr></table></div>
<div class="ex"><b>מושגים לזכור:</b><br>
<b>דפולריזציה</b> = הפנים נהיה <b>פחות שלילי</b>, קרוב יותר לסף.<br>
<b>היפר־פולריזציה</b> = הפנים נהיה <b>יותר שלילי</b>, רחוק יותר מהסף.<br>
<b>תקופה רפרקטורית</b> = הזמן שבו תעלות הנתרן נחסמות והנוירון לא יכול לירות שוב.</div>

<h3>6. איך פוטנציאל הפעולה עובר לאורך האקסון</h3>
<h4>חוק הכול או לא־כלום</h4>
<p>אם המתח מגיע לסף, פוטנציאל הפעולה מתרחש <b>במלואו</b>. אם לא, הוא לא מתרחש <b>בכלל</b>. ומרגע שהוא התחיל, הוא עובר עד קצה האקסון <b>בלי להיחלש</b>. כמו לחיצה על הדק: אם לוחצים חלש מדי, לא יוצא כדור; אם לוחצים מספיק, יוצא כדור, ותמיד באותה עוצמה.</p>
<div class="ex"><b>למה המסר מתקדם רק קדימה?</b> כי בקטע שהאות עבר בו עכשיו, תעלות הנתרן עדיין בתקופה רפרקטורית ולא יכולות להיפתח. לכן האות יכול להתקדם רק לכיוון הכפתורים הסופיים.</div>
<h4>חוק התדר: איך מעבירים ״חזק״ ו״חלש״</h4>
<p>אם כל ירייה זהה בגודלה, איך המוח יודע אם האור חזק או חלש, או אם צריך לכווץ שריר חזק או חלש? התשובה: לפי <b>קצב הירי</b>. גירוי חזק = הרבה יריות בשנייה. גירוי חלש = מעט יריות.</p>
<div class="ex"><b>הדוגמה מהספר:</b> אקסון בעין יכול להגיב לאור נר חלש ב־10 יריות ביחידת זמן, ולאור חזק ב־100 יריות. כל ירייה בדיוק באותו גודל.<br>
<b>הדימוי של הספר: מחיאות כפיים.</b> כל מחיאה תמיד באותה עוצמה. אם ההופעה הייתה מעולה, מוחאים מהר מאוד. אם היא הייתה בינונית, מוחאים לאט ומעט. אותה ״שפה״, אבל הקצב מעביר מסר אחר.</div>
<h4>הולכה פסיבית ודועכת מול הולכה אקטיבית ובקפיצות</h4>
<p>כמעט כל האקסונים בגוף עטופים במיילין, ויש בו מרווחים חשופים שנקראים <b>מרווחי ראנווייה</b>. רק במרווחים האקסון נוגע בנוזל שבחוץ, ולכן רק שם הנתרן יכול להיכנס.</p>
<div class="ex"><b>מתחת למיילין: הולכה פסיבית ודועכת.</b> מתחת למיילין אין נתרן מבחוץ, ולכן אין ״ירייה״ חדשה. השינוי החשמלי פשוט ״זורם״ לאורך האקסון, כמו זרם בכבל חשמל מבודד. זו הולכה <b>פסיבית</b>, כי התא לא עושה שום פעולה. היא גם <b>דועכת</b>: האות נחלש בדרך, אבל נשאר חזק מספיק כדי להגיע לסף במרווח הבא.<br><br>
<b>במרווח ראנווייה: הולכה אקטיבית.</b> כאן תעלות הנתרן נפתחות, ופוטנציאל הפעולה <b>נוצר מחדש</b> בעוצמה מלאה. זו הולכה <b>אקטיבית</b>, כי התא ״מייצר״ את האות מחדש.<br><br>
<b>יחד: הולכה בקפיצות.</b> האות ״קופץ״ ממרווח למרווח: דועך מתחת למיילין, ומתחדש בכל מרווח. השם בא מהמילה הלטינית ״לרקוד״.</div>
<div class="ex"><b>שני היתרונות של הולכה בקפיצות:</b><br>
① <b>חיסכון:</b> נתרן נכנס רק במרווחים, ולכן יש הרבה פחות נתרן שהמשאבה צריכה להוציא אחר כך. פחות אנרגיה.<br>
② <b>מהירות:</b> המעבר מתחת למיילין מהיר מאוד. אקסון של חתול עם מיילין, בקוטר 6 מיקרומטר בלבד, מגיע לאותה מהירות כמו אקסון ענק של דיונון בלי מיילין, בקוטר 500 מיקרומטר: כ־35 מטר לשנייה. האקסונים המהירים ביותר מגיעים ל־120 מטר לשנייה, יותר מ־400 קמ״ש.<br>
<b>מה זה אומר על התנהגות:</b> הולכה מהירה מאפשרת <b>להגיב מהר</b>, למשל להרחיק את היד מהמגהץ לפני שנכווים קשה, וגם לחשוב מהר יותר.</div>

<h3>7. רפלקס הרתיעה, עם עיכוב ובלי עיכוב</h3>
<p>זו נקודה שהספר מדגיש במיוחד, כי היא מראה איך כל מה שלמדנו הופך להתנהגות.</p>
<div class="ex"><b>בלי עיכוב, המגהץ:</b> נוירון סנסורי ← אינטרנוירון ← נוירון מוטורי. כל הסינפסות <b>מעוררות</b>, השריר מתכווץ, והיד נרתעת.<br><br>
<b>עם עיכוב, הספל החם:</b> הכאב מפעיל את אותו מסלול, והיד ״רוצה״ לזרוק את הספל. אבל במוח יש מעגלים ש״יודעים״ שזריקת הספל תגרום נזק גדול יותר. נוירון במוח שולח אקסון למוח השדרה ומפעיל שם <b>אינטרנוירון מעכב</b>. האינטרנוירון הזה משחרר נ״ט מעכב על הנוירון המוטורי, והרתיעה נבלמת. אנחנו ממשיכים להחזיק את הספל עד השולחן.<br><br>
<b>הלקח:</b> התנהגות היא תוצאה של <b>תחרות</b> בין מסרים מעוררים למסרים מעכבים. במקרה הזה: ״לזרוק״ מול ״להחזיק״. ובפועל לא מדובר ב־5 נוירונים אלא באלפים, אבל העיקרון זהה.</div>

<h3>8. הסינפסה: איך המסר עובר לתא הבא</h3>
<p>עכשיו החלק השלישי. בין הכפתור הסופי לתא הבא יש רווח זעיר, <b>המרווח הסינפטי</b>, והאות החשמלי לא יכול לעבור אותו. לכן כאן המסר הופך ל<b>כימי</b>. התא ששולח נקרא <b>פרה־סינפטי</b> (״לפני הסינפסה״), והתא שמקבל נקרא <b>פוסט־סינפטי</b> (״אחרי הסינפסה״).</p>
<h4>איך הנוירוטרנסמיטר משתחרר</h4>
<div class="ex">① פוטנציאל הפעולה מגיע לכפתור הסופי, ונפתחות <b>תעלות סידן</b> (Ca²⁺). הסידן נכנס.<br>
② הסידן גורם ל<b>שלפוחיות</b>, ״שקיות״ מלאות בנוירוטרנסמיטר, להתמזג עם הממברנה ולשפוך את התוכן למרווח הסינפטי.<br>
③ הנוירוטרנסמיטר נקשר ל<b>קולטנים</b> על התא הפוסט־סינפטי, כמו מפתח שנכנס למנעול.<br>
④ בתא הפוסט־סינפטי נוצר שינוי חשמלי קטן: <b>פוטנציאל פוסט־סינפטי</b>.<br>
⑤ הנוירוטרנסמיטר מסולק, והמסר נגמר.<br>
<b>בין עצב לשריר</b> (כמו אצל קתרין) הנוירוטרנסמיטר הוא <b>אצטילכולין (ACh)</b>.</div>
<h4>קולטן יונוטרופי מול קולטן מטבוטרופי</h4>
<div class="ex"><b>יונוטרופי = הקולטן הוא בעצמו תעלה.</b> הנ״ט נקשר, והקולטן עצמו נפתח ומכניס יונים. <b>מהיר וקצר.</b> כמו דלת אוטומטית שנפתחת מיד.<br>
<b>מטבוטרופי = הקולטן מפעיל שרשרת בתוך התא.</b> הנ״ט נקשר, הקולטן מפעיל <b>חלבון G</b>, ולפעמים <b>שליח שניוני</b> שמעביר את המסר הלאה בתוך התא ופותח תעלות או משנה תהליכים. <b>איטי יותר, אבל רחב וארוך יותר.</b> כמו לצלצל בפעמון ולחכות שמישהו יבוא לפתוח.</div>
<h4>EPSP מול IPSP</h4>
<div class="ex"><b>EPSP = פוטנציאל פוסט־סינפטי מעורר. ״גז״.</b> בדרך כלל נתרן נכנס, יש דפולריזציה, והתא <b>מתקרב</b> לסף. הסיכוי שהוא יירה עולה.<br>
<b>IPSP = פוטנציאל פוסט־סינפטי מעכב. ״בלם״.</b> אשלגן יוצא (או כלור נכנס), יש היפר־פולריזציה, והתא <b>מתרחק</b> מהסף. הסיכוי שהוא יירה יורד.<br>
<b>בדוגמה שלנו:</b> המסר מהנוירון הסנסורי יוצר EPSP בנוירון המוטורי. המסר מהאינטרנוירון המעכב יוצר IPSP באותו נוירון מוטורי.</div>
<h4>סיום המסר</h4>
<div class="ex">אם הנ״ט יישאר במרווח, המסר לא ייגמר לעולם. יש שתי דרכים לסלק אותו:<br>
<b>קליטה חוזרת:</b> התא הפרה־סינפטי ״שואב״ את הנ״ט בחזרה אליו, כמו שואב אבק. זו הדרך הנפוצה.<br>
<b>פירוק אנזימטי:</b> אנזים מפרק את הנ״ט במקום. כך זה עובד באצטילכולין: האנזים <b>אצטילכולין־אסטראז (AChE)</b> מפרק אותו, ומולקולה אחת שלו מפרקת יותר מ־5,000 מולקולות של ACh בשנייה.</div>

<h3>9. אינטגרציה עצבית: הנוירון ״סופר קולות״</h3>
<p>נוירון אחד מקבל מסרים מאלפי סינפסות בבת אחת, חלקם EPSP וחלקם IPSP. <b>אינטגרציה עצבית</b> היא החיבור של כולם יחד. האינטגרציה קורית ב<b>תלולית האקסון</b>, המקום שבו האקסון יוצא מגוף התא. אם הסכום מגיע לסף, האקסון יורה, וככל שיש יותר ״גז״, הוא יורה בקצב מהיר יותר. אם ה״בלמים״ חזקים, קצב הירי יכול לרדת עד אפס.</p>
<div class="ex"><b>שני סוגי סכימה (המרצה מבקשת להבדיל ביניהם):</b><br>
<b>סכימה בזמן:</b> המסרים מגיעים מ<b>תא אחד</b>, שיורה הרבה פעמים ברצף מהיר. כל EPSP מגיע לפני שהקודם נעלם, והם מצטברים. כמו חבר אחד שדופק בדלת שוב ושוב עד שפותחים לו.<br>
<b>סכימה במרחב:</b> המסרים מגיעים מ<b>כמה תאים שונים בו־זמנית</b>, מנקודות שונות על הדנדריטים, ומצטברים. כמו כמה חברים שדופקים בדלת ביחד.<br>
לפי שני הסיכומים האלה, התא הפוסט־סינפטי ״מחליט״ אם לירות.</div>
<h4>עיכוב עצבי הוא לא תמיד עיכוב התנהגותי</h4>
<p>חשוב להבחין: IPSP מעכב <b>נוירון</b>, לא בהכרח <b>התנהגות</b>. אם נוירון מסוים בדרך כלל עוצר התנהגות, ומעכבים <b>אותו</b>, ההתנהגות דווקא <b>משתחררת</b>. וההפך: עירור של נוירון מעכב <b>מדכא</b> התנהגות.</p>
<div class="ex"><b>הדוגמה מהספר: חלומות.</b> כשאנחנו חולמים, קבוצת נוירונים מעכבים במוח פעילה ועוצרת אותנו מלקום ולעשות את מה שאנחנו חולמים. אצל אנשים שהנוירונים האלה נהרסו, הם באמת ״מבצעים״ את החלומות שלהם (פרק 9). כלומר, כדי לדעת איך עירור או עיכוב ישפיעו על ההתנהגות, צריך להכיר את כל המעגל העצבי.</div>

<h3>10. אוטורצפטורים וסינפסות מיוחדות</h3>
<ul>
<li><b>קולטן פוסט־סינפטי מול אוטורצפטור:</b> קולטן פוסט־סינפטי נמצא על התא <b>המקבל</b> ויוצר EPSP או IPSP. <b>אוטורצפטור</b> נמצא על התא <b>השולח</b> עצמו, ומגיב לנ״ט שהוא עצמו שחרר. הוא <b>מטבוטרופי</b> ולא משנה את המתח. בדרך כלל הוא <b>מפחית</b> ייצור ושחרור: אם השתחרר יותר מדי, הוא אומר ״מספיק״. כמו מכונת שתייה שעוצרת כשהכוס מלאה.</li>
<li><b>סינפסה אקסו־אקסונית:</b> כפתור סופי שמתחבר לכפתור סופי של נוירון אחר. היא <b>לא משתתפת</b> באינטגרציה, אלא משנה <b>כמה</b> נ״ט הנוירון השני ישחרר: <b>עיכוב פרה־סינפטי</b> (פחות) או <b>זירוז פרה־סינפטי</b> (יותר). המרכיב הפעיל במריחואנה פועל דרך קולטנים כאלה (פרק 4).</li>
<li><b>סינפסות דנדרו־דנדריטיות:</b> בין דנדריטים לדנדריטים, אצל נוירונים קטנים בלי אקסון ארוך. כנראה עוזרות לווסת ולארגן קבוצות נוירונים.</li>
<li><b>צומת מעבר:</b> סינפסה <b>חשמלית</b>: שני התאים מחוברים ישירות, בלי נ״ט באמצע.</li>
</ul>

<h3>11. תקשורת כימית שאינה סינפטית</h3>
<ul>
<li><b>נוירומודולטורים:</b> חומרים שלא נשלחים לתא אחד אלא <b>מתפזרים</b> לאזור רחב ומשפיעים על הרבה נוירונים יחד. כמו כריזה ברמקול במקום שיחת טלפון.</li>
<li><b>הורמונים:</b> עוברים <b>בדם</b> לכל הגוף. <b>הורמונים פפטידיים</b> נקשרים לקולטן <b>על הממברנה</b>. <b>הורמונים סטרואידים</b> (עשויים מכולסטרול, למשל הורמוני המין) מסיסים בשומן, <b>חודרים לתוך התא</b>, ונקשרים לקולטן ב<b>גרעין</b>, ושם משנים אילו חלבונים ייוצרו. כמו אורח שנכנס הביתה, לעומת אורח שרק מצלצל בפעמון.</li>
</ul>
<div class="ex"><b>תוספת מהשיעור (מפרק 4): אגוניסט ואנטגוניסט.</b><br>
<b>אגוניסט</b> = חומר ש<b>מגביר</b> או מחקה את הפעולה של נוירוטרנסמיטר.<br>
<b>אנטגוניסט</b> = חומר ש<b>חוסם</b> או מחליש את הפעולה שלו.<br>
<b>דוגמה מהפרק:</b> התרופה של קתרין עוצרת את הפירוק של ACh, ולכן היא <b>מגבירה</b> את השפעתו. כלומר היא פועלת כ<b>אגוניסט</b> של אצטילכולין.</div>

<h3>12. מה קרה לקתרין</h3>
<p>עכשיו אפשר לפתור את התעלומה. לקתרין יש <b>חולשת שרירים חמורה (מיאסתניה גרביס)</b>, מחלה אוטואימונית: מערכת החיסון שלה הורסת את <b>הקולטנים לאצטילכולין</b> בשרירים.</p>
<div class="ex"><b>איפה בדיוק המסר נתקע, לפי השלבים:</b><br>
• המוח שולח מסר, הנוירון המוטורי יורה, והאות מגיע לכפתור. <b>תקין.</b><br>
• הסידן נכנס, וה־ACh משתחרר למרווח. <b>תקין.</b><br>
• אבל בשריר יש <b>פחות קולטנים</b> שיקלטו אותו. <b>כאן המסר נחלש</b>, והשריר מגיב חלש, במיוחד אחרי מאמץ.<br><br>
<b>איך הזריקה עזרה:</b> הנוירולוגית הזריקה חומר ש<b>חוסם את AChE</b>. האנזים כבר לא מפרק את ה־ACh, אז יש ממנו הרבה יותר במרווח, והוא ״מציף״ את הקולטנים המעטים שנשארו. המסר לשריר התחזק, והכוח חזר.<br><br>
<b>הלקח של הספר:</b> רק מי שמבין את המבנה והתפקוד של התאים יכול לאבחן ולטפל. הרופא הראשון חשב שזה לחץ. הנוירולוגית זיהתה בעיה בסינפסה.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הסיפור של הפרק בחמישה משפטים:</b><br>
1. כל התנהגות נובעת מפעילות של <b>נוירונים</b>, שהמבנה שלהם מתאים לקבל, להחליט ולהעביר מסרים, ושל <b>תאי תמך</b>, שמזינים, מבודדים ומתקנים.<br>
2. במנוחה הנוירון ״טעון״ (70−). דיפוזיה, לחץ אלקטרוסטטי ומשאבת נתרן־אשלגן שומרים על זה.<br>
3. בסף (55−) הנתרן נכנס והנוירון <b>יורה</b>, תמיד באותו גודל. עוצמה מועברת דרך <b>קצב הירי</b>, ומיילין מאפשר הולכה מהירה וחסכונית בקפיצות.<br>
4. בקצה האקסון המסר הופך ל<b>כימי</b>: סידן ← שחרור נ״ט ← קולטן ← EPSP או IPSP ← סילוק.<br>
5. כל נוירון <b>סוכם</b> את ה״גז״ וה״בלם״ (בזמן ובמרחב) ומחליט אם לירות. מהתחרות הזו נוצרת ההתנהגות: לזרוק את הספל או להחזיק אותו.<br><br>
<b>מה צריך לדעת לעשות במבחן (לפי יעדי הלמידה של הספר והשאלות של המרצה):</b><br>
• להשוות CNS ו־PNS, ולתאר את חלקי הנוירון ואת האברונים.<br>
• להשוות אוליגודנדרוציטים ותאי שוואן, ולהסביר את מחסום הדם־מוח.<br>
• להסביר את רפלקס הרתיעה, עם עיכוב ובלי עיכוב.<br>
• להגדיר דיפוזיה, לחץ אלקטרוסטטי, יונים ופוטנציאל, ולהסביר איך נשמר פוטנציאל המנוחה.<br>
• לתאר כל שלב בפוטנציאל הפעולה: איזו תעלה פתוחה ומה המתח.<br>
• להבחין בין הולכה דועכת להולכה בקפיצות, ובין הולכה פסיבית לאקטיבית.<br>
• לתאר שחרור נ״ט, להשוות יונוטרופי ומטבוטרופי, EPSP ו־IPSP, וסכימה בזמן ובמרחב.<br>
• להבדיל בין אוטורצפטור לקולטן פוסט־סינפטי, ולהכיר סינפסות שלא משתתפות באינטגרציה.<br>
• להגדיר אגוניסט ואנטגוניסט, ולנתח מקרה כמו של קתרין.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>הנתרן נשאר בחוץ בגלל המשאבה והממברנה</b>, לא בגלל הלחץ האלקטרוסטטי. הלחץ דווקא <b>מושך</b> אותו פנימה.</li>
<li><b>עוצמה מקודדת בקצב הירי</b>, לא בגודל פוטנציאל הפעולה, שתמיד זהה.</li>
<li><b>שחרור הנ״ט מופעל על ידי סידן</b>, לא נתרן.</li>
<li><b>הולכה דועכת</b> קורית <b>מתחת למיילין</b> (פסיבית). במרווחי ראנווייה פוטנציאל הפעולה <b>מתחדש</b> (אקטיבית).</li>
<li><b>סכימה בזמן = תא אחד שיורה מהר. סכימה במרחב = כמה תאים בבת אחת.</b></li>
<li><b>עיכוב של נוירון מעכב = שחרור התנהגות</b>, לא עיכוב שלה.</li>
<li><b>אוליגודנדרוציט: CNS, כמה אקסונים. תא שוואן: PNS, אקסון אחד.</b></li>
<li>המשאבה מוציאה <b>3 נתרן</b> ומכניסה <b>2 אשלגן</b>.</li>
<li><b>אוטורצפטור נמצא על התא השולח</b>, מטבוטרופי, ובדרך כלל מפחית שחרור.</li>
<li><b>סינפסה אקסו־אקסונית לא משתתפת באינטגרציה</b>; היא משנה כמה נ״ט ישתחרר.</li>
<li><b>אצל קתרין נפגעו הקולטנים</b>, לא הנוירון ולא כמות ה־ACh. הזריקה חוסמת את <b>הפירוק</b>.</li>
<li><b>סטרואידים פועלים בגרעין</b>, פפטידים על הממברנה.</li>
</ul></div>

<h3>קשרים לפרקים הבאים</h3>
<p>סמים ותרופות פועלים בדיוק על שלבי הסינפסה שלמדנו, כאגוניסטים או אנטגוניסטים (פרק 4). רישום הפעילות החשמלית של נוירונים, למשל במיקרו־אלקטרודות (פרק 5).</p>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

  const started=T.filter(topicStarted);

  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
      ${CONFIG.podcast?`<button class="review-btn" id="pod"><span aria-hidden="true">🎧</span><span>פודקאסט${CONFIG.podcast.min?` · ${CONFIG.podcast.min} דק׳`:""}</span></button>`:""}
     </div>
     ${CONFIG.podcast?`<div id="podbox" class="podbox" hidden><p class="muted">פודקאסט שנוצר ב־Gemini Notebook מקריאת החובה. כמו כל סיכום אוטומטי, הוא עלול לטעות, והקריאה עצמה קובעת.</p><div class="podframe"></div></div>`:""}
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#phys" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}{const pb=app.querySelector("#pod");if(pb)pb.onclick=()=>{const bx=app.querySelector("#podbox");bx.hidden=!bx.hidden;const f=bx.querySelector(".podframe");if(!bx.hidden&&!f.firstChild)f.innerHTML=`<iframe src="https://drive.google.com/file/d/${CONFIG.podcast.id}/preview" allow="autoplay" title="פודקאסט" loading="lazy"></iframe>`}}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="ck"></div><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  checkBox(t,bi);
  scrollTo(0,0);
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;
  const show=i=>{const v=list[i],opts=shuffle([v.a,...v.w]);
    host.innerHTML=`<div class="q ckq fade"><span class="eyebrow">בדיקת הבנה · שאלה ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="muted cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? עלו לטקסט וקראו שוב לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");
        const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
        fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}${ok?"":" <b>כדאי לחזור לטקסט למעלה ולקרוא שוב.</b>"}</div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.textContent=`לשאלה ${i+2} ←`;nx.style.alignSelf="flex-start";
          nx.onclick=()=>{const y=scrollY;show(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="muted";d.style.margin="0";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע (${r} מתוך ${list.length} נכון).`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };show(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb){pb.click();const bx=document.querySelector("#podbox");if(bx)bx.scrollIntoView({block:"center"})}}else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
