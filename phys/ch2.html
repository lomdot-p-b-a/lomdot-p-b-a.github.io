const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"brain",title:"הנוירון וחלקיו",blocks:[
  {h:"קתרין ומערכות העצבים",html:`${def("על מה הנושא",`כל מה שאנחנו עושים, לתפוס, לחשוב, לזכור ולפעול, נשען על התאים של מערכת העצבים. הנושא מציג את החלוקה הגדולה ואת סוגי הנוירונים.<br><b>מה נלמד כאן:</b> CNS ו־PNS · נוירונים סנסוריים, מוטוריים ואינטרנוירונים · חלקי הנוירון`)}${def("תיאור מקרה",`קתרין, ספורטיבית ובריאה, החלה להתעייף בסוף שיעורי אירובי. היא התקשתה להרים ידיים בשחייה, העפעפיים נעצמו והנשימה דרשה מאמץ. הרופא ייחס זאת ללחץ. נוירולוגית הזריקה לה חומר, ותוך דקות הכוח חזר. האבחנה: <mark>חולשת שרירים חמורה</mark> ${E("myasthenia gravis")}, מחלה <b>אוטואימונית</b> שבה מערכת החיסון תוקפת חלבונים שמאפשרים לתאים <b>לקבל מסרים</b>.`)}${tiles([["brain","מערכת העצבים המרכזית (CNS)","המוח ומוח השדרה, בתוך הגולגולת ועמוד השדרה","המוח ומוח השדרה, שמוגנים בתוך הגולגולת ועמוד השדרה. כאן מעובד המידע ומתקבלות ההחלטות.","כשנוגעים בסיר חם, ההחלטה למשוך את היד מתקבלת במוח השדרה, חלק ממערכת העצבים המרכזית."],["link","מערכת העצבים ההיקפית (PNS)","העצבים ורוב איברי החוש, מחוץ לעצמות","כל העצבים ורוב איברי החוש שמחוץ לגולגולת ולעמוד השדרה. הם מעבירים מידע בין הגוף למערכת העצבים המרכזית.","העצב שמעביר את תחושת החום מהאצבע אל מוח השדרה שייך למערכת ההיקפית."]])}${def("עצבים",`<b>עצב</b> ${E("nerve")} הוא אלומה של אלפי אקסונים העטופים בקרום הגנה קשיח, כמו כבל טלפון. הוא מעביר מסרים מאיברי החוש למוח, או מהמוח לשרירים ולבלוטות.`)}`,q:"q1"},
  {h:"שלושה סוגי נוירונים",html:`${tiles([["bulb","נוירון סנסורי (חישתי)","מגלה שינויים בסביבה החיצונית או הפנימית ומדווח ל־CNS","נוירון שקולט שינוי בסביבה או בגוף, ומדווח עליו למערכת העצבים המרכזית.","נוירון בעור מרגיש שהסיר חם, ושולח את המסר למוח השדרה."],["hand","נוירון מוטורי (תנועתי)","נמצא ב־CNS ושולט בהתכווצות שריר או בהפרשה מבלוטה","נוירון שיושב במערכת העצבים המרכזית ושולח פקודה לשריר להתכווץ, או לבלוטה להפריש.","נוירון במוח השדרה שולח פקודה לשריר הזרוע, והיד נמשכת מהסיר."],["link","אינטרנוירון","נמצא כולו בתוך ה־CNS, בין הסנסורי למוטורי","נוירון ״מתווך״: הוא לא קולט מידע מהגוף ולא מפעיל שריר, אלא מחבר בין נוירונים בתוך המוח ומוח השדרה, ומעבד את המידע ביניהם.","כשנוגעים בסיר חם, נוירון סנסורי מעביר את המידע למוח השדרה. שם אינטרנוירון מעביר אותו לנוירון מוטורי, שמושך את היד."]])}${def("שני סוגי אינטרנוירונים",`<b>אינטרנוירונים מקומיים</b> ${E("local interneurons")} יוצרים מעגלים עם נוירונים סמוכים ומעבדים פיסות מידע קטנות. <b>אינטרנוירונים של ממסר</b> ${E("relay interneurons")} מקשרים בין מעגלים באזורי מוח שונים. כך מתאפשרים תפיסה, למידה, זיכרון וקבלת החלטות.`)}${ex(`אדם רואה כוס מים: נוירונים סנסוריים מעבירים את המידע ל־CNS, אינטרנוירונים מעבדים אותו, והפלט המוטורי מאפשר להרים את הכוס ולשתות.`)}`,q:"q3"},
  {h:"ארבעת חלקי הנוירון",html:`${fig("parts")}${tiles([["target","גוף התא (סומה)","מכיל את הגרעין ואת רוב המנגנונים של התא","החלק המרכזי של הנוירון. יש בו את הגרעין ואת רוב ״המכונות״ שמחזיקות את התא בחיים.","גוף התא מקבל את המסרים מהדנדריטים, ושם ״מחליטים״ אם להעביר מסר הלאה."],["leaf","דנדריטים","מבנה מסועף כמו עץ (dendron). ״אנטנות״ שקולטות מסרים","הענפים של הנוירון שקולטים מסרים מנוירונים אחרים, דרך סינפסות. ככל שיש יותר ענפים, הנוירון יכול לקבל מידע מיותר תאים.","כמו אנטנות רבות על גג: כל אחת קולטת שידור אחר, והכול מתנקז לבית אחד, גוף התא."],["link","אקסון (סיב)","צינור ארוך ודק, לרוב במעטפת מיילין, שמעביר את פוטנציאל הפעולה","צינור ארוך ודק שיוצא מגוף התא ומוביל את פוטנציאל הפעולה אל הקצה. בדרך כלל הוא עטוף במיילין, שמאיץ את ההולכה.","אקסון של נוירון מוטורי יכול להגיע ממוח השדרה עד כף הרגל."],["bulb","כפתורים סופיים","בקצות האקסון. פולטים נוירוטרנסמיטר","הקצוות של ענפי האקסון. כשפוטנציאל פעולה מגיע אליהם, הם פולטים נוירוטרנסמיטר לסינפסה, וכך ״מעבירים את המסר״ לתא הבא.","זה הרגע שבו האות החשמלי שעבר לאורך האקסון הופך לאות כימי: הכפתור משחרר חומר שעובר לתא הבא."]])}${def("סינפסה ופוטנציאל פעולה",`<mark>סינפסה</mark> ${E("synapse")} היא הצומת בין כפתור סופי לממברנה של תא אחר. התקשורת בה <b>חד־כיוונית</b>, מהכפתור לתא המקבל (עם יוצאים מן הכלל). <mark>פוטנציאל הפעולה</mark> הוא אירוע חשמלי מהיר שמתחיל ליד גוף התא ומתקדם עד הכפתורים. <b>גודלו קבוע</b>, וכשהאקסון מתפצל הוא מופיע בעוצמה מלאה בכל ענף.`)}${tiles([["split","רב־קוטבי","אקסון אחד ודנדריטים רבים. השכיח ב־CNS","לנוירון יש אקסון אחד ודנדריטים רבים שיוצאים מגוף התא. זה הסוג הנפוץ ביותר במוח ובמוח השדרה.","נוירון מוטורי שמפעיל שריר ברגל מקבל מסרים מהרבה תאים דרך הדנדריטים, ושולח אות אחד דרך האקסון."],["copies","דו־קוטבי","אקסון ודנדריט בקצוות נגדיים. לרוב סנסורי: ראייה ושמיעה","יש לו שני ״קצוות״: דנדריט אחד בצד אחד ואקסון בצד השני. לרוב הוא נמצא במערכות חושיות.","בעין, נוירונים דו־קוטביים מעבירים את המידע מהתאים שקולטים אור הלאה, בדרך למוח."],["hand","חד־קוטבי","גבעול אחד שמתפצל. מגע, טמפרטורה, כאב, מפרקים ושרירים","מגוף התא יוצא גבעול אחד, שמתפצל לשני ענפים: אחד מגיע לעור או לשריר, והשני נכנס למוח השדרה. הוא מעביר מידע של מגע, טמפרטורה וכאב.","כשדורכים על אבן חדה, נוירון חד־קוטבי מעביר את תחושת הכאב מכף הרגל אל מוח השדרה."]])}${rem("נוירון אחד יכול לקבל מידע מעשרות או מאות נוירונים, והסינפסות שלהם נמצאות על <b>הדנדריטים או על גוף התא</b>.")}`,q:"q5"}

 {id:"t2",icon:"gear",title:"המבנה הפנימי ותובלה בתא",blocks:[
  {h:"תובלה אקסופלזמית",html:`${def("למה צריך תובלה",`האקסון יכול להיות ארוך מאוד: הארוך ביותר נמשך מכף הרגל עד בסיס מוח השדרה. הכפתורים צריכים חומרים שמיוצרים רק בגוף התא, ולכן יש ״רכבת תחתית״ בתוך האקסון.`)}${def("תובלה אקסופלזמית",`<mark>תובלה אקסופלזמית</mark> ${E("axoplasmic transport")} היא תהליך <b>אקטיבי</b> שבו חומרים נעים לאורך <b>מיקרוטובולים</b>. זה תהליך נפרד מהתקדמות פוטנציאל הפעולה על פני האקסון.`)}${tiles([["target","קדומנית (anterograde)","מגוף התא לכפתורים. החלבון קינזין ״צועד״ עם המטען. עד 500 מ״מ ביום","הובלה של חומרים מגוף התא אל הכפתורים שבקצה האקסון. חלבון מיוחד ״צועד״ לאורך האקסון וסוחב את המטען.","חומרים שנוצרו בגוף התא נשלחים לקצה האקסון, שם הם נחוצים כדי להעביר את המסר."],["cycle","אחורנית (retrograde)","מהכפתורים לגוף התא. החלבון דינאין. בערך חצי מהמהירות","הובלה בכיוון ההפוך: מהכפתורים בחזרה לגוף התא, בערך בחצי מהמהירות. כך התא מקבל ״דיווח״ ממה שקורה בקצה.","חומרים משומשים מהקצה חוזרים לגוף התא כדי להתפרק או להתמחזר."]])}${rem("האנרגיה לתובלה מגיעה מ־<b>ATP</b> שמיוצר במיטוכונדריה.")}`,q:"q7"},
  {h:"ממברנה, גרעין וייצור חלבונים",html:`${def("הממברנה",`הממברנה בנויה <b>שכבה כפולה של פוספוליפידים</b>: ראש שנמשך למים וזנב שדוחה מים. לכן חומרים שמתמוססים בשומן עוברים בקלות, וחומרים שמתמוססים במים נחסמים. בממברנה משובצים חלבונים: חלקם מזהים חומרים, חלקם שולטים בכניסה, וחלקם נשאים שמעבירים חומרים תוך השקעת אנרגיה.`)}${def("שלד התא והציטופלזמה",`<b>ציטוסקלטון</b> הוא שלד של סיבי חלבון שנותן לתא את צורתו. העבים שבהם הם <b>מיקרוטובולים</b>: 13 חוטי חלבון סביב ליבה חלולה. <b>ציטופלזמה</b> היא החומר הצמיג שממלא את התא, ובה האברונים.`)}${def("מ־DNA לחלבון",`בגרעין נמצאים הכרומוזומים (23 זוגות באדם), ובהם <b>גנים</b>. <b>תעתוק</b> ${E("transcription")}: המידע מה־DNA מועתק ל־<b>mRNA</b>. <b>תרגום</b> ${E("translation")}: ה־mRNA יוצא אל ה<b>ריבוזומים</b> ושם נבנה החלבון. ה<b>גרעינון</b> מייצר את הריבוזומים.`)}${ex(`ספר מתכונים נדיר שאסור להוציא מהספרייה (DNA). מצלמים את המתכון בטלפון (mRNA, תעתוק), ואופים לפיו את העוגה במטבח (תרגום בריבוזום).`)}${tiles([["gear","אנזימים","חלבונים שמזרזים תגובות כימיות ובונים או מפרקים מולקולות","חלבונים שמזרזים תגובות כימיות בתא, ובונים או מפרקים מולקולות. בלעדיהם, תהליכים בתא היו איטיים מדי.","יש אנזים שמפרק נוירוטרנסמיטר בסינפסה מהר, כדי שהמסר ייגמר בזמן."],["copies","רשתית תוך־פלזמית","מגורגרת: חלבונים ליצוא. חלקה: ליפידים ותעלות"],["doc","אברון גולג'י","אורז תוצרים בממברנה, ומייצר ליזוזומים שמפרקים פסולת","״מחלקת האריזה והמשלוחים״ של התא: הוא אורז חומרים שהתא ייצר בתוך עטיפת ממברנה, כדי לשלוח אותם למקום הנכון. הוא גם מייצר ליזוזומים, שמפרקים פסולת.","נוירוטרנסמיטרים שהתא מייצר נארזים ב״שקיות״ קטנות, כדי שיגיעו לכפתורים הסופיים ויישמרו שם עד שצריך."],["bulb","מיטוכונדריה","מפיקות אנרגיה מהמזון ומייצרות ATP. ״תחנות הכוח״","האברונים שהופכים את האנרגיה שבמזון לאנרגיה שהתא יכול להשתמש בה (ATP). לנוירונים יש צורך גדול באנרגיה, ולכן הם תלויים בהן.","כמו תחנת כוח שמספקת חשמל לעיר: בלי מיטוכונדריה, המשאבות והפעילות החשמלית של הנוירון היו נעצרות."]])}${rem("<b>אקסוציטוזה</b>: שלפוחית מתמזגת עם הממברנה ומרוקנת את תוכנה החוצה. כך נפלטים נוירוטרנסמיטרים.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"people",title:"תאי תמך ומחסום הדם-מוח",blocks:[
  {h:"תאי הגלייה ב־CNS",html:`<p>הנוירונים הם רק כמחצית מנפח ה־CNS. השאר הם תאי תמך, <mark>גלייה</mark> ${E("glia")} (״דבק״). הם מחזיקים את הנוירונים, מזינים אותם, מבודדים אותם ומפנים פסולת.</p>${def("אסטרוציטים",`״תאי כוכב״. נותנים תמיכה פיזית, מסלקים פסולת ומווסתים את ההרכב הכימי של הנוזל סביב הנוירונים. שלוחותיהם עוטפות כלי דם ונוירונים. הם קולטים <b>גלוקוז</b> מהדם, מפרקים אותו ל<b>לקטט</b> ופולטים אותו לנוירונים, שמפיקים ממנו אנרגיה מהר יותר. הם גם מאחסנים <b>גליקוגן</b>, ומבודדים סינפסות. כשנוירונים מתים הם מפנים את השרידים ב<b>פגוציטוזה</b> ויוצרים <b>רקמת צלקת</b>.`)}${tiles([["link","אוליגו־דנדרוציטים","מייצרים מעטפת מיילין. תא אחד יוצר עד 50 מקטעים, לכמה אקסונים","תאי גליה במוח ובמוח השדרה שעוטפים אקסונים במעטפת מיילין, ״בידוד״ שמזרז את העברת המסר. תא אחד שולח שלוחות ועוטף מקטעים של כמה אקסונים.","כמו בידוד פלסטיק סביב כבל חשמל: תא אחד ״מבודד״ חלקים מכמה כבלים שעוברים לידו."],["x","מיקרוגלייה","הקטנים ביותר. פגוציטים ומערכת החיסון של המוח, אחראים לתגובה הדלקתית","תאי הגליה הקטנים ביותר. הם ״מערכת החיסון״ של המוח: בולעים פסולת ותאים מתים, ואחראים לתגובה הדלקתית אחרי פגיעה.","אחרי פגיעת ראש, תאי מיקרוגלייה מגיעים לאזור הפגוע ומנקים את שאריות התאים שנהרסו."]])}${def("מיילין ומרווחי ראנווייה",`<mark>מעטפת מיילין</mark> ${E("myelin sheath")} (80% שומן, 20% חלבון) מבודדת את האקסון. היא בנויה מקטעים של כמילימטר, וביניהם <mark>מרווחי ראנווייה</mark> ${E("nodes of Ranvier")} של 1 עד 2 מיקרומטר של אקסון חשוף.`)}`,q:"q11"},
  {h:"תאי שוואן ושיקום",html:`${def("תאי שוואן",`ב־PNS את המיילין מייצרים <mark>תאי שוואן</mark> ${E("Schwann cells")}. כל תא כרוך כולו סביב <b>אקסון אחד</b> ויוצר מקטע אחד, בעוד שאוליגו־דנדרוציט שולח שלוחות לכמה אקסונים.`)}${def("שיקום ב־PNS",`כשעצב היקפי נפגע, תאי שוואן מעכלים את השרידים ומסתדרים כ<b>גלילים</b>. הנצר של האקסון שנכנס לגליל צומח בקצב של 3 עד 4 מ״מ ביום, וכך אפשר לחדש קשר עם השרירים ואיברי החוש.`)}${def("למה ה־CNS לא מתאושש",`ב־CNS הנצרים נתקלים ב<b>רקמת צלקת</b> של אסטרוציטים. וגם בלי צלקת, אסטרוציטים פולטים אות שאומר לאקסון להפסיק להתארך ולהצמיח כפתורים. לכן ההבדל בשיקום נובע מ<b>תאי התמך</b>, לא מהנוירונים עצמם.`)}${ex(`<b>טרשת נפוצה</b> (ד״ר ס'): מערכת החיסון תוקפת את חלבון המיילין של <b>האוליגו־דנדרוציטים</b> בלבד, ולא את המיילין של ה־PNS, שהרכבו שונה. התסמינים (ראייה כפולה, חוסר יציבות, דגדוג ביד) מופיעים ושוככים לסירוגין. במוח נשארים <b>רבדים טרשתיים</b> קשים בחומר הלבן.`)}`,q:"q13"},
  {h:"מחסום הדם-מוח",html:`${def("הגילוי",`<b>פאול ארליך</b>: צבע כחול שהוזרק לדם צבע את כל הרקמות חוץ מהמוח ומוח השדרה. כשהזריקו אותו לחדרי המוח, הוא התפשט בכל ה־CNS. מכאן שיש מחסום בין הדם לנוזל שסביב תאי המוח.`)}${def("איך זה עובד",`בשאר הגוף יש מרווחים בין התאים בדופן נימי הדם. בנימים של המוח התאים <b>צמודים</b>, ולכן <mark>מחסום הדם-מוח</mark> ${E("blood-brain barrier")} חדיר <b>באופן בררני</b>: נשאים מיוחדים מכניסים גלוקוז ומוציאים פסולת.`)}${tiles([["scales","שמירה על איזון","העברת אותות תלויה בהרכב עדין של הנוזל החוץ־תאי"],["lock","הגנה","חומרים במזון שעלולים לשבש את העברת המידע לא מגיעים למוח","מחסום הדם־מוח מסנן את מה שעובר מהדם למוח. כך חומרים שעלולים לשבש את העברת המידע בין נוירונים לא מגיעים אליו.","חומר מסוים במזון היה יכול לפעול על המוח כמו נוירוטרנסמיטר ולשבש אותו, אבל המחסום לא נותן לו לעבור."]])}${def("אזור הפוסט־רמה",`ב<mark>אזור הפוסט־רמה</mark> ${E("area postrema")} שבמוח המוארך המחסום חלש. הנוירונים שם מזהים <b>רעלים</b> בדם ומעוררים <b>הקאה</b>.`)}${rem("המחסום מקשה גם על <b>תרופות</b> להגיע למוח, וזה מכשול בפיתוח טיפולים לאלצהיימר ולפרקינסון.")}`,q:"q15"}
 ]},
 {id:"t4",icon:"scales",title:"פוטנציאל המנוחה",blocks:[
  {h:"רפלקס הרתיעה והעכבה",html:`${def("מעגל של שלושה נוירונים",`נוגעים במגהץ חם: <b>נוירון סנסורי</b> של כאב מעביר מסר למוח השדרה, <b>אינטרנוירון</b> מעורר את ה<b>נוירון המוטורי</b>, והשריר מושך את היד.`)}${def("עכבה",`מרימים ספל חם מהמיקרוגל וממשיכים להחזיק אותו עד השולחן. נוירון ב<b>מוח</b> שולח אקסון למוח השדרה, מפעיל <b>אינטרנוירון מעכב</b>, וזה פולט טרנסמיטר מעכב שמפחית את פעילות הנוירון המוטורי.`)}${rem("המעגל מדגים <b>תחרות</b> בין נטיות מנוגדות: לעזוב את הספל או להחזיק אותו. במציאות מעורבים אלפי נוירונים, אבל העיקרון זהה.")}`,q:"q17"},
  {h:"מדידת פוטנציאל הממברנה",html:`<p>בעזרת <b>מיקרו־אלקטרודה</b> בתוך האקסון מודדים את <mark>פוטנציאל הממברנה</mark> ${E("membrane potential")}: ההפרש במתח בין פנים התא לחוץ.</p>${tiles([["target","פוטנציאל מנוחה","בערך –70 מ״ו: הפנים שלילי ביחס לחוץ","כשהנוירון לא שולח מסר, הצד הפנימי שלו טעון בערך במינוס 70 מיליוולט ביחס לחוץ. זה ״מצב ההמתנה״ שממנו מתחיל כל שינוי.","כמו סוללה טעונה שמחכה לשימוש: המתח קיים, גם כשלא קורה כלום."],["chart","היפר־פולריזציה","שלילי יותר, למשל –80 מ״ו","הפנים של התא נעשה שלילי עוד יותר (רחוק יותר מאפס). זה מקשה על הנוירון ״לירות״, ולכן זה מצב מעכב.","מעבר ממינוס 70 למינוס 80 מיליוולט מרחיק את התא מהסף, וכך הסיכוי שישלח מסר יורד."],["bulb","דפולריזציה","פחות שלילי, למשל –50 מ״ו","הפנים של התא נעשה פחות שלילי (קרוב יותר לאפס). זה מקרב את הנוירון לסף, ולכן זה מצב מעורר.","מעבר ממינוס 70 למינוס 50 מיליוולט מקרב את התא לנקודה שבה הוא שולח פוטנציאל פעולה."]])}${def("סף העירור",`כשהדפולריזציה מגיעה ל<mark>סף העירור</mark> ${E("threshold of excitation")}, בערך <b>–55 מ״ו</b>, מתחיל <mark>פוטנציאל פעולה</mark> ${E("action potential")}: דפולריזציה מהירה ואחריה היפר־פולריזציה.`)}${ex(`הרבה ממה שיודעים נלמד מה<b>אקסון הענק של הדיונון</b>: קוטרו כחצי מילימטר, מאות פעמים יותר מאקסון של יונק, ולכן קל להחדיר אליו אלקטרודות.`)}`,q:"q19"},
  {h:"הכוחות והיונים",html:`${tiles([["data","דיפוזיה","מולקולות נעות מריכוז גבוה לנמוך, כי הן בתנועה אקראית מתמדת","חלקיקים זזים כל הזמן באקראי, ולכן מתפזרים מאזור צפוף לאזור דליל, עד שהריכוז שווה. זה אחד הכוחות שמניעים יונים פנימה והחוצה מהתא.","טיפה של צבע מאכל בכוס מים מתפשטת לאט, עד שכל המים צבועים, בלי שמישהו ערבב."],["scales","לחץ אלקטרוסטטי","מטענים זהים נדחים, מנוגדים נמשכים"]])}${fig("ions")}${rem("הנוזל החוץ־תאי דומה ל<b>מי ים</b> (NaCl): אבות התאים חיו באוקיינוס. A⁻ הם חלבונים טעונים שלא עוברים את הממברנה.")}${def("משאבת נתרן־אשלגן",`Na⁺ נדחף פנימה גם בדיפוזיה וגם בלחץ האלקטרוסטטי, ובכל זאת נשאר בחוץ. הסיבה היא <mark>משאבת נתרן־אשלגן</mark> ${E("sodium-potassium pump")}: חלבונים בממברנה שמוציאים <b>3 Na⁺</b> ומכניסים <b>2 K⁺</b> בכל מחזור, בעזרת ATP. הם צורכים עד <b>40%</b> מהאנרגיה של הנוירון.`)}${rem("הממברנה חדירה ל־K⁺ בערך <b>פי 100</b> יותר מאשר ל־Na⁺. לכן מעט Na⁺ דולף פנימה, והמשאבה מספיקה כדי לשמור על הפער.")}`,q:"q21"}
 ]},
 {id:"t5",icon:"bulb",title:"פוטנציאל הפעולה והולכתו",blocks:[
  {h:"השלבים של פוטנציאל הפעולה",html:`${fig("ap","מהלך סכמטי של פוטנציאל הפעולה")}${def("תעלות יונים תלויות מתח",`<mark>תעלת יונים</mark> ${E("ion channel")} היא חלבון שנפתח ומאפשר ליון מסוים לעבור. בפוטנציאל הפעולה התעלות נפתחות לפי <b>המתח</b>.`)}<ol><li>בסף (–55 מ״ו) נפתחות <b>תעלות Na⁺</b>, ו־Na⁺ נכנס במהירות, נדחף בדיפוזיה ובלחץ האלקטרוסטטי.</li><li><b>תעלות K⁺</b> נפתחות קצת אחר כך, ו־K⁺ מתחיל לצאת.</li><li>בשיא (כ־+40 מ״ו) תעלות ה־Na⁺ <b>נחסמות</b> (מצב רפרקטורי) ולא ייפתחו שוב עד שהממברנה תחזור למנוחה.</li><li>K⁺ ממשיך לצאת, המתח חוזר ואף עובר את ערך המנוחה: <b>היפר־פולריזציה</b>.</li><li>תעלות ה־K⁺ נסגרות, והמשאבות מחזירות לאט את הריכוזים.</li></ol>${rem("בכל פוטנציאל פעולה עוברים <b>מעט מאוד</b> יונים, ולכן הריכוזים כמעט לא משתנים. המשאבות מתקנות את השינוי לאורך זמן.")}`,q:"q23"},
  {h:"הכול או לא־כלום וחוק התדר",html:`${def("חוק הכול או לא־כלום",`<mark>חוק הכול או לא־כלום</mark> ${E("all-or-none law")}: אם המתח מגיע לסף, פוטנציאל הפעולה מתרחש <b>במלואו</b>; אם לא, הוא לא מתרחש בכלל. אחרי שהתחיל הוא מתפשט <b>בלי לדעוך</b> עד קצה האקסון.`)}${def("חוק התדר",`אם הגודל תמיד קבוע, איך מעבירים מידע על עוצמה? <mark>חוק התדר</mark> ${E("rate law")}: עוצמת הגירוי מיוצגת ב<b>קצב הירי</b> של האקסון. גירוי חלש מייצר מעט פוטנציאלים, גירוי חזק מייצר הרבה.`)}${ex(`התכווצות חלשה או חזקה של שריר לא נובעת מפוטנציאלים ״גדולים״ יותר, אלא מ<b>יותר</b> פוטנציאלי פעולה בשנייה (וגם ממספר הנוירונים שיורים).`)}`,q:"q25"},
  {h:"הולכה בקפיצות",html:`${def("בלי מיילין",`באקסון בלי מיילין פוטנציאל הפעולה מתחדש בכל נקודה לאורך הממברנה, וההולכה איטית.`)}${def("עם מיילין",`ב<mark>הולכה בקפיצות</mark> ${E("saltatory conduction")} פוטנציאל הפעולה ״קופץ״ ממרווח ראנווייה אחד לבא. מתחת למיילין הזרם מתפשט <b>באופן סביל ומהיר</b>, ובמרווח הוא מתחדש בעוצמה מלאה, כי שם נמצאות תעלות הנתרן.`)}${tiles([["clock","מהירות","הולכה מהירה בהרבה באקסונים עם מיילין","במיילין, האות ״קופץ״ מרווח לרווח במקום לעבור בכל נקודה לאורך האקסון, ולכן ההולכה מהירה הרבה יותר.","כמו רכבת מהירה שעוצרת רק בתחנות מרכזיות במקום בכל תחנה: היא מגיעה ליעד הרבה יותר מהר."],["bulb","חיסכון באנרגיה","יונים נכנסים רק במרווחים, ולכן המשאבות עובדות פחות","כשיונים נכנסים רק ברווחים שבין קטעי המיילין, המשאבות שמחזירות אותם למקום עובדות פחות, והתא חוסך אנרגיה.","כמו לנקות רק כמה חדרים בבית במקום את כל הבית: אותה מטרה, פחות עבודה."]])}${rem("לכן הנזק למיילין בטרשת נפוצה משבש את ההולכה, גם כשהאקסונים עצמם שלמים.")}`,q:"q27"}
 ]},
 {id:"t6",icon:"link",title:"הסינפסה ופליטת הנוירוטרנסמיטר",blocks:[
  {h:"מבנה הסינפסה והפליטה",html:`${tiles([["target","ממברנה פרה־סינפטית","ממברנת הכפתור הסופי, ממנה נפלט הנוירוטרנסמיטר"],["split","מרווח סינפטי","החלל הצר בין שתי הממברנות"],["id","ממברנה פוסט־סינפטית","ממברנת התא המקבל, ובה הקולטנים"]])}${def("סוגי סינפסות",`<b>אקסו־דנדריטיות</b> (על דנדריט חלק או על <b>עוקץ דנדריטי</b>), <b>אקסו־סומטיות</b> (על גוף התא) ו<b>אקסו־אקסוניות</b> (כפתור על כפתור).`)}${def("השלפוחיות",`<mark>שלפוחיות סינפטיות</mark> ${E("synaptic vesicles")} מכילות את הנוירוטרנסמיטר. הקטנות מיוצרות בכפתור, והגדולות (פפטידים) בגוף התא. הן נצמדות ל<b>אזור הפליטה</b> ${E("release zone")}.`)}<ol><li>פוטנציאל הפעולה מגיע לכפתור ופותח <b>תעלות סידן</b>.</li><li>Ca²⁺, שריכוזו גבוה בחוץ, נכנס ונקשר לחלבונים על השלפוחיות.</li><li>נפתח <b>נקב איחוי</b> והנוירוטרנסמיטר נפלט למרווח (אקסוציטוזה).</li></ol>${rem("אחרי הפליטה ממברנת השלפוחית ממוחזרת. ב״<b>מגע ובריחה</b>״ השלפוחית נסגרת, עוזבת ומתמלאת מחדש.")}`,q:"q29"},
  {h:"קולטנים יונוטרופיים ומטבוטרופיים",html:`${def("קולטן ואתר קשירה",`<mark>קולטן פוסט־סינפטי</mark> הוא חלבון עם <mark>אתר קשירה</mark> ${E("binding site")}. חומר שנקשר אליו נקרא <b>ליגנד</b>.`)}${tiles([["bulb","יונוטרופי","אתר קשירה ותעלת יונים באותו חלבון. התעלה נפתחת ישירות: מהיר וקצר","קולטן שהוא גם התעלה עצמה: כשהנוירוטרנסמיטר נקשר, התעלה נפתחת מיד. לכן ההשפעה מהירה מאוד וקצרה.","כמו מתג חשמל: לוחצים, והאור נדלק מיד, ונכבה כשעוזבים."],["gear","מטבוטרופי","מצומד לחלבון G. התעלה נפתחת דרך שרשרת צעדים, לפעמים דרך שליח שניוני: איטי וממושך","הקולטן לא פותח תעלה בעצמו, אלא מפעיל שרשרת של צעדים בתוך התא, לפעמים דרך ״שליח שניוני״. לכן ההשפעה איטית יותר, אבל רחבה וממושכת.","כמו לשלוח הודעה למנהל שמעביר הלאה לכמה עובדים: לוקח יותר זמן, אבל הרבה דברים משתנים ולאורך זמן."]])}${def("שליח שניוני",`<mark>שליח שניוני</mark> ${E("second messenger")} הוא חומר שנוצר כשחלבון G מפעיל אנזים. הוא מעביר אות שפותח תעלות או מחולל שינויים אחרים בתא.`)}${rem("קולטן מטבוטרופי דורש יותר צעדים ואנרגיה, אבל ההשפעה שלו רחבה וממושכת יותר.")}`,q:"q31"}
 ]},
 {id:"t7",icon:"chart",title:"פוטנציאלים פוסט־סינפטיים ואינטגרציה",blocks:[
  {h:"עירור, עכבה וסיום",html:`${def("פוטנציאל פוסט־סינפטי",`<mark>פוטנציאל פוסט־סינפטי</mark> ${E("postsynaptic potential")} הוא שינוי במתח הממברנה של התא המקבל. <b>מעורר</b> (EPSP) הוא דפולריזציה, <b>מעכב</b> (IPSP) הוא היפר־פולריזציה.`)}${tiles([["bulb","Na⁺ נכנס","דפולריזציה: פוטנציאל מעורר","כשיוני נתרן חיוביים נכנסים לתא, הפנים נעשה פחות שלילי (דפולריזציה). זה מעורר את התא ומקרב אותו לשליחת מסר.","נוירוטרנסמיטר שפותח תעלות נתרן ״דוחף״ את התא לכיוון הסף."],["chart","K⁺ יוצא","היפר־פולריזציה: פוטנציאל מעכב","כשיוני אשלגן חיוביים יוצאים מהתא, הפנים נעשה שלילי יותר (היפר־פולריזציה). זה מעכב את התא ומרחיק אותו מהסף.","נוירוטרנסמיטר שפותח תעלות אשלגן ״מרגיע״ את התא."],["scales","Cl⁻","במנוחה כמעט לא זז. בדפולריזציה נכנס ומחזיר את המתח למנוחה","יון הכלור כמעט לא זז כשהתא במנוחה. כשהתא עובר דפולריזציה, הכלור נכנס ומחזיר את המתח לכיוון המנוחה, וכך הוא ״מרסן״ עירור.","תעלות כלור שנפתחות בזמן דפולריזציה פועלות כמו בלם: הן מקשות על הנוירון להגיע לסף."],["target","Ca²⁺ נכנס","דפולריזציה, וגם מפעיל אנזימים"]])}${def("איך הפוטנציאל מסתיים",`<mark>קליטה חוזרת</mark> ${E("reuptake")}: נשאים מחזירים את הנוירוטרנסמיטר לכפתור (הדרך הנפוצה). <mark>דאקטיבציה אנזימטית</mark> ${E("enzymatic deactivation")}: אנזים מפרק אותו. למשל <b>אצטילכולין־אסטראז</b> (AChE) מפרק אצטילכולין.`)}${ex(`אצל <b>קתרין</b> מערכת החיסון פגעה בקולטני האצטילכולין שבשרירים. הזריקה עיכבה את AChE, ולכן האצטילכולין נשאר יותר זמן בסינפסה והפעיל את הקולטנים שנותרו.`)}`,q:"q33"},
  {h:"אינטגרציה עצבית",html:`${def("אינטגרציה",`<mark>אינטגרציה עצבית</mark> ${E("neural integration")}: הפוטנציאלים המעוררים והמעכבים <b>מסתכמים</b> וקובעים את קצב הירי של הנוירון. כשכמה סינפסות מעוררות פועלות יחד, הסכום מגיע לסף והאקסון יורה. סינפסות מעכבות מורידות את הסיכוי.`)}${rem("עכבה של נוירון היא <b>לא</b> תמיד עכבה של התנהגות. אם הנוירון שמעוכב הוא בעצמו מעכב, התוצאה היא <b>שחרור</b> של התנהגות.")}${ex(`בחשבון בנק: הפקדות (EPSP) ומשיכות (IPSP) נצברות, וההוצאה (ירי) מתרחשת רק כשהיתרה עוברת סכום מסוים (הסף).`)}`,q:"q35"},
  {h:"אוטורצפטורים וסינפסות מיוחדות",html:`${def("אוטורצפטור",`<mark>אוטורצפטור</mark> ${E("autoreceptor")} הוא קולטן על הנוירון <b>הפרה־סינפטי</b> שמגיב לנוירוטרנסמיטר שהנוירון עצמו פולט. בדרך כלל הוא מטבוטרופי ו<b>מפחית</b> את הפליטה (משוב).`)}${def("סינפסה אקסו־אקסונית",`כפתור א' יוצר סינפסה עם כפתור ב'. <mark>עיכוב פרה־סינפטי</mark> מקטין את כמות הנוירוטרנסמיטר שכפתור ב' פולט, ו<mark>זירוז פרה־סינפטי</mark> מגדיל אותה. היא לא משתתפת באינטגרציה של התא המקבל, אלא <b>מכווננת</b> פליטה.`)}${tiles([["copies","סינפסות דנדרו־דנדריטיות","מעבירות מידע בשני הכיוונים","סינפסות בין דנדריטים של שני תאים. בשונה מרוב הסינפסות, הן יכולות להעביר מידע בשני הכיוונים.","כמו שיחה בין שני אנשים, ולא הודעה שעוברת רק לכיוון אחד."],["link","צומת מעבר (gap junction)","סינפסה חשמלית: צימוד ישיר בין תאים, בלי נוירוטרנסמיטר","סינפסה חשמלית: שני תאים מחוברים ישירות, והאות עובר ביניהם בלי נוירוטרנסמיטר. זה מהיר מאוד.","קבוצת תאים שצריכים לפעול בדיוק באותו רגע מחוברים כך, ו״יורים״ יחד."]])}`,q:"q37"}
 ]},
 {id:"t8",icon:"cycle",title:"תקשורת כימית מחוץ לסינפסה",blocks:[
  {h:"נוירומודולטורים והורמונים",html:`${def("נוירומודולטור",`<mark>נוירומודולטור</mark> ${E("neuromodulator")} נפלט כמו נוירוטרנסמיטר, אבל <b>לא מוגבל למרווח הסינפטי</b>: הוא מתפזר בנוזל החוץ־תאי ומשפיע על נוירונים רבים, לפעמים רחוקים. רובם <b>פפטידים</b>, שרשראות של חומצות אמיניות.`)}${def("הורמון",`<mark>הורמון</mark> ${E("hormone")} מופרש מ<b>בלוטה אנדוקרינית</b> לנוזל החוץ־תאי ומשם לדם, ומשפיע על <b>תאי מטרה</b> שיש להם קולטנים מתאימים. חלק מהנוירונים מפרישים הורמונים, וחלק מהאיברים (למשל הקיבה) מפרישים הורמונים שפועלים על המוח.`)}${rem("הורמונים פפטידיים פועלים על קולטנים <b>מטבוטרופיים</b> בממברנה, כמו נוירוטרנסמיטרים.")}`,q:"q39"},
  {h:"הורמונים סטרואידיים",html:`${def("סטרואידים",`<mark>סטרואיד</mark> ${E("steroid")} הוא חומר קטן שנגזר מ<b>כולסטרול</b> (למשל הורמוני מין). הוא מסיס בשומן, ולכן <b>חודר דרך הממברנה</b> ונקשר לקולטנים <b>בתוך הגרעין</b>. הקולטן גורם למנגנון הגנטי לייצר חלבון.`)}${tiles([["clock","איטי","ההשפעה דורשת ייצור חלבונים חדשים","הורמון סטרואידי חודר לגרעין התא וגורם לו לייצר חלבונים חדשים. התהליך הזה לוקח זמן, ולכן ההשפעה לא מיידית.","לעומת נוירוטרנסמיטר שפועל תוך אלפית שנייה, להורמון כזה לוקח שעות עד שרואים שינוי."],["chart","ממושך","השינויים בתא נשארים לאורך זמן","החלבונים החדשים שהתא ייצר נשארים בו, ולכן השינוי מחזיק לאורך זמן, ולא נעלם ברגע שההורמון עוזב.","שינויים שהורמוני מין גורמים בתאים נשארים לאורך זמן רב."]])}${ex(`בניגוד לנוירוטרנסמיטר שפותח תעלה בתוך אלפית שנייה, הורמון סטרואידי משנה אילו חלבונים התא מייצר. כך הורמוני מין משפיעים על התפתחות ועל התנהגות לאורך זמן.`)}`,q:"q41"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מה הבעיה של קתרין, שאובחנה בחולשת שרירים חמורה?","a":"מערכת החיסון תוקפת חלבונים שמאפשרים לתאים לקבל מסרים","w":["מערכת החיסון תוקפת את מעטפת המיילין במוח ובמוח השדרה","הנוירונים המוטוריים שלה מתים בהדרגה בגלל לחץ נפשי","השרירים שלה לא מייצרים מספיק ATP בזמן מאמץ"],"e":"זו מחלה אוטואימונית שבה הגוף תוקף את החלבונים שקולטים את המסר העצבי בשריר. התקפה על המיילין מאפיינת טרשת נפוצה, מחלה אחרת שמופיעה בפרק."},{"q":"מה מעידה התגובה המהירה של קתרין לזריקה של הנוירולוגית?","a":"שהבעיה בהעברת המסר אל השריר, ולא בשריר עצמו","w":["שהבעיה הייתה לחץ נפשי, כפי שחשב הרופא הראשון","שהשרירים שלה נפגעו באופן קבוע מהאימונים","שהמחלה נרפאה לגמרי בזריקה אחת בלבד"],"e":"הכוח חזר תוך דקות, ולכן השרירים עצמם תקינים והבעיה בתקשורת בין העצב לשריר. המחלה לא נרפאה: יש טיפולים, אבל היא עדיין חשוכת מרפא."}]},
"q2":{"t":"t1","v":[{"q":"מה כוללת מערכת העצבים המרכזית?","a":"את המוח ואת מוח השדרה","w":["את המוח ואת עצבי הגולגולת","את מוח השדרה ואת עצבי השדרה","את כל העצבים שבתוך הגוף"],"e":"ה־CNS כולל את מה שנמצא בתוך הגולגולת ועמוד השדרה: המוח ומוח השדרה. העצבים, גם של הגולגולת וגם של השדרה, שייכים למערכת ההיקפית."},{"q":"מהו עצב?","a":"אלומה של אלפי אקסונים העטופים בקרום הגנה","w":["נוירון יחיד וארוך במיוחד שיוצא ממוח השדרה","קבוצה של גופי תאים מחוץ למוח ולמוח השדרה","תא תמך שעוטף את האקסונים במערכת ההיקפית"],"e":"עצב דומה לכבל טלפון עם חוטים רבים בתוכו, וכל חוט הוא אקסון. קבוצת גופי תאים מחוץ למוח נקראת גנגליון, לא עצב."}]},
"q3":{"t":"t1","v":[{"q":"איפה נמצא נוירון מוטורי, ומה תפקידו?","a":"ב־CNS, ושולט בהתכווצות שריר או בהפרשה מבלוטה","w":["ב־PNS, וקולט מידע על הסביבה החיצונית","ב־CNS, ומקשר רק בין נוירונים סמוכים","ב־PNS, ומעביר מידע מהשרירים למוח"],"e":"גוף התא של הנוירון המוטורי נמצא ב־CNS, והאקסון שלו יוצא אל השריר או הבלוטה. קליטת מידע מהסביבה היא תפקיד הנוירון הסנסורי."},{"q":"מה מאפיין אינטרנוירון?","a":"הוא נמצא כולו בתוך מערכת העצבים המרכזית","w":["הוא מגלה שינויים בסביבה ומדווח למוח","הוא שולט ישירות בהתכווצות של שריר","הוא נמצא כולו במערכת העצבים ההיקפית"],"e":"אינטרנוירונים נמצאים בין הנוירונים הסנסוריים למוטוריים, כולם בתוך ה־CNS. גילוי שינויים בסביבה הוא תפקיד הנוירון הסנסורי."}]},
"q4":{"t":"t1","v":[{"q":"מה תפקידם של אינטרנוירונים של ממסר?","a":"לקשר בין מעגלים עצביים באזורי מוח שונים","w":["ליצור מעגלים קטנים עם נוירונים שכנים בלבד","להעביר מידע מאיברי החוש אל מוח השדרה","להפעיל ישירות את השרירים בצד הנגדי"],"e":"אינטרנוירונים מקומיים מעבדים מידע עם נוירונים סמוכים, ואינטרנוירונים של ממסר מחברים בין מעגלים רחוקים. העברת מידע מאיברי החוש היא תפקיד סנסורי."},{"q":"אדם רואה כוס ומרים אותה. מה הסדר הנכון של סוגי הנוירונים?","a":"סנסורי, אחר כך אינטרנוירונים, ואז מוטורי","w":["מוטורי, אחר כך אינטרנוירונים, ואז סנסורי","אינטרנוירונים, אחר כך סנסורי, ואז מוטורי","סנסורי ישירות למוטורי, בלי שלב ביניים"],"e":"המידע החושי נכנס ל־CNS דרך נוירונים סנסוריים, מעובד באינטרנוירונים, ורק אז יוצאת פקודה מוטורית. בפעולה כמו הרמת כוס יש עיבוד רב בין הקלט לפלט."}]},
"q5":{"t":"t1","v":[{"q":"מה תפקיד הדנדריטים?","a":"לקלוט מסרים מהכפתורים הסופיים של נוירונים אחרים","w":["להעביר את פוטנציאל הפעולה אל הכפתורים הסופיים","לפלוט נוירוטרנסמיטר אל המרווח הסינפטי","לייצר את החלבונים שהתא צריך לתפקודו"],"e":"הדנדריטים פועלים כמו אנטנות שקולטות את המסרים. את פוטנציאל הפעולה מוביל האקסון, ואת הנוירוטרנסמיטר פולטים הכפתורים הסופיים."},{"q":"אקסון מתפצל לשני ענפים. מה קורה לפוטנציאל הפעולה?","a":"הוא מופיע בעוצמה מלאה בכל אחד מהענפים","w":["הוא מתחלק, וכל ענף מקבל מחצית מהעוצמה","הוא ממשיך רק בענף העבה מבין השניים","הוא נעצר בנקודת הפיצול ומתחיל מחדש בגוף התא"],"e":"פוטנציאל הפעולה לא מתחלק כמו זרם מים. בכל ענף הוא נוצר מחדש בגודלו המלא, כי הגודל שלו קבוע באקסון נתון."}]},
"q6":{"t":"t1","v":[{"q":"איזה סוג נוירון שכיח במיוחד במערכות החוש של הראייה והשמיעה?","a":"נוירון דו־קוטבי","w":["נוירון רב־קוטבי","נוירון חד־קוטבי","נוירון מוטורי"],"e":"לנוירון דו־קוטבי יש אקסון אחד ודנדריט אחד בקצוות נגדיים, והוא שכיח בחושים כמו ראייה ושמיעה. החד־קוטבי שכיח במגע, בכאב ובטמפרטורה."},{"q":"מה מאפיין נוירון חד־קוטבי?","a":"גבעול אחד שמתפצל לענף קולט ולענף אל ה־CNS","w":["אקסון אחד ודנדריטים רבים שיוצאים מגוף התא","אקסון ודנדריט אחד שיוצאים מקצוות נגדיים","אין לו אקסון, ויש לו רק דנדריטים קצרים"],"e":"בנוירון החד־קוטבי יוצא גבעול אחד ומתפצל: הענף הרחוק קולט, למשל מגע או טמפרטורה, והענף השני נכנס ל־CNS. אקסון ודנדריטים רבים מתארים נוירון רב־קוטבי."}]},
"q7":{"t":"t2","v":[{"q":"מה מאפיין תובלה אקסופלזמית קדומנית?","a":"היא נעה מגוף התא לכפתורים, באמצעות החלבון קינזין","w":["היא נעה מהכפתורים לגוף התא, באמצעות קינזין","היא נעה מגוף התא לכפתורים, באמצעות דינאין","היא תהליך סביל שלא צורך אנרגיה בכלל"],"e":"קדומנית פירושה ״אל הצד הקדמי״: מגוף התא לכפתורים, וקינזין נושא את המטען. דינאין אחראי לכיוון ההפוך, ושני התהליכים צורכים ATP."},{"q":"מה ההבדל בין תובלה קדומנית לאחורנית?","a":"קדומנית מגוף התא לכפתורים ומהירה יותר; אחורנית בכיוון ההפוך ואיטית יותר","w":["קדומנית מהכפתורים לגוף התא; אחורנית מגוף התא לכפתורים","קדומנית צורכת אנרגיה; אחורנית מתרחשת בלי אנרגיה בכלל","קדומנית קורית רק באקסונים עם מיילין; אחורנית רק בלי מיילין"],"e":"הקדומנית מגיעה ל־500 מ״מ ביום, והאחורנית לבערך מחצית מזה. שתיהן תהליכים אקטיביים לאורך המיקרוטובולים, בלי קשר למיילין."}]},
"q8":{"t":"t2","v":[{"q":"למה הנוירון זקוק לתובלה אקסופלזמית?","a":"כי הכפתורים צריכים חומרים שמיוצרים רק בגוף התא","w":["כי פוטנציאל הפעולה לא יכול להתקדם בלעדיה","כי הכפתורים מייצרים את כל החלבונים בעצמם","כי הדנדריטים צריכים לקבל נוירוטרנסמיטר"],"e":"החלבונים מיוצרים בגוף התא, והאקסון יכול להיות ארוך מאוד, ולכן צריך מערכת הובלה. התובלה נפרדת לגמרי מהתקדמות פוטנציאל הפעולה."},{"q":"לאורך מה נעים החומרים בתובלה האקסופלזמית?","a":"לאורך המיקרוטובולים של שלד התא","w":["לאורך מעטפת המיילין שעוטפת את האקסון","בתוך הנוזל החוץ־תאי שמסביב לאקסון","דרך תעלות היונים שבממברנת האקסון"],"e":"המיקרוטובולים הם ״המסילות״ שעליהן צועדים קינזין ודינאין. המיילין עוטף את האקסון מבחוץ ולא משמש להובלה."}]},
"q9":{"t":"t2","v":[{"q":"מה מתרחש בשלב התרגום בייצור חלבון?","a":"הריבוזום משתמש במידע שב־mRNA ובונה את החלבון","w":["המידע שב־DNA מועתק למולקולת mRNA בגרעין","ה־DNA יוצא מהגרעין אל הציטופלזמה","הגרעינון מייצר את מולקולות ה־DNA"],"e":"בתעתוק המידע מה־DNA מועתק ל־mRNA, ובתרגום הריבוזום הופך אותו לחלבון. ה־DNA לא יוצא מהגרעין, וזו בדיוק הסיבה שצריך את ה־mRNA."},{"q":"באנלוגיית ספר המתכונים, מה מייצג צילום המתכון בטלפון?","a":"תעתוק המידע מה־DNA ל־mRNA","w":["תרגום ה־mRNA לחלבון בריבוזום","פירוק החלבון בליזוזום","הוצאת ה־DNA מהגרעין"],"e":"הספר שאסור להוציא מהספרייה הוא ה־DNA, והצילום הנייד הוא ה־mRNA שנוצר בתעתוק. האפייה במטבח מייצגת את התרגום."}]},
"q10":{"t":"t2","v":[{"q":"איזה אברון מייצר את ה־ATP שמשמש מקור אנרגיה לתא?","a":"המיטוכונדריה","w":["אברון גולג'י","הרשתית התוך־פלזמית החלקה","הליזוזום"],"e":"המיטוכונדריה מפיקות אנרגיה מפירוק המזון ומייצרות ATP, ולכן מכונות ״תחנות הכוח״. אברון גולג'י אורז תוצרים, והליזוזום מפרק פסולת."},{"q":"מה תפקידו של אברון גולג'י?","a":"לבנות מולקולות ולארוז תוצרים בממברנה","w":["לייצר ATP מפירוק של מזון","לייצר את הריבוזומים בתוך הגרעין","להעביר חומרים לאורך האקסון"],"e":"אברון גולג'י אורז תוצרים בממברנה לקראת הפרשה, ומייצר גם ליזוזומים. את הריבוזומים מייצר הגרעינון, ואת ה־ATP המיטוכונדריה."}]},
"q11":{"t":"t3","v":[{"q":"לפי ממצאי המאה ה־21, איך אסטרוציטים מספקים אנרגיה לנוירונים?","a":"קולטים גלוקוז מהדם, מפרקים אותו ללקטט ופולטים אותו לנוירונים","w":["מעבירים חמצן ישירות מהדם אל תוך הנוירונים","מייצרים ATP ומעבירים אותו לנוירונים דרך הסינפסות","פולטים גלוקוז שלם שהנוירונים צורכים כמו שהוא"],"e":"האסטרוציטים הופכים גלוקוז ללקטט, והנוירונים מפיקים ממנו אנרגיה מהר יותר מאשר מגלוקוז. זה מאשש את ההשערה הישנה של גולג'י."},{"q":"איזה תא גלייה הוא הקטן ביותר ומשמש כמערכת החיסון של המוח?","a":"מיקרוגלייה","w":["אסטרוציט","אוליגו־דנדרוציט","תא שוואן"],"e":"המיקרוגלייה מגינים מפני מיקרואורגניזמים ואחראים לתגובה הדלקתית לנזק. אסטרוציטים מזינים ותומכים, ואוליגו־דנדרוציטים מייצרים מיילין."}]},
"q12":{"t":"t3","v":[{"q":"מהם מרווחי ראנווייה?","a":"קטעים קצרים של אקסון חשוף בין מקטעי המיילין","w":["המרווחים בין כפתור סופי לממברנה של תא אחר","החללים שבין שתי שכבות הממברנה של התא","הנקבים בדופן נימי הדם שבשאר הגוף"],"e":"המיילין בנוי מקטעים של כמילימטר, וביניהם 1 עד 2 מיקרומטר של אקסון חשוף. המרווח בין כפתור לתא אחר הוא המרווח הסינפטי."},{"q":"מה ההבדל בין אוליגו־דנדרוציט לתא שוואן?","a":"אוליגו־דנדרוציט מספק מיילין לכמה אקסונים; תא שוואן לאקסון אחד","w":["אוליגו־דנדרוציט נמצא ב־PNS; תא שוואן נמצא ב־CNS","אוליגו־דנדרוציט מזין נוירונים; תא שוואן מפנה פסולת","אוליגו־דנדרוציט עוטף אקסון אחד; תא שוואן כמה אקסונים"],"e":"אוליגו־דנדרוציט ב־CNS שולח שלוחות ויוצר עד 50 מקטעים לכמה אקסונים. תא שוואן ב־PNS כרוך כולו סביב אקסון אחד ויוצר מקטע אחד."}]},
"q13":{"t":"t3","v":[{"q":"למה אקסון שנחתך ב־PNS יכול לצמוח מחדש, וב־CNS בדרך כלל לא?","a":"תאי שוואן מנחים צמיחה; אסטרוציטים חוסמים אותה","w":["הנוירונים ב־PNS צעירים יותר מהנוירונים ב־CNS","ב־CNS אין מיילין, ולכן אין מה שינחה את האקסון","ב־PNS האקסונים קצרים מאוד, ולכן קל להם להתחבר"],"e":"ההבדל נובע מתאי התמך: תאי שוואן יוצרים גלילים מורי דרך, ואסטרוציטים יוצרים צלקת ופולטים אות לעצירת ההתארכות. לא מדובר בהבדל בנוירונים עצמם."},{"q":"מה קורה לנצר של אקסון ב־PNS שנכנס לגליל של תאי שוואן?","a":"הוא צומח לאורכו בקצב של כ־3 עד 4 מ״מ ביום","w":["הוא נעצר ומתחיל להצמיח כפתורים סופיים מיד","הוא נבלע על ידי תאי שוואן ומתפרק","הוא יוצר רקמת צלקת שמגנה על העצב"],"e":"הגליל מנחה את הנצר, והאקסון יכול לחדש קשר עם השריר או איבר החוש. הנצרים שלא נכנסו לגליל מתנוונים."}]},
"q14":{"t":"t3","v":[{"q":"למה טרשת נפוצה פוגעת ב־CNS אבל לא ב־PNS?","a":"החיסון תוקף רק את המיילין של האוליגו־דנדרוציטים","w":["תאי שוואן מתחלקים מהר מדי בשביל שהמחלה תפגע בהם","ב־PNS אין מיילין כלל, ולכן אין מה לתקוף","מחסום הדם-מוח מכניס את התאים התוקפים רק למוח"],"e":"ההרכב הכימי של חלבון המיילין שונה בין האוליגו־דנדרוציטים לתאי שוואן, והמחלה מכוונת רק לסוג הראשון. ב־PNS רוב האקסונים דווקא עטופים במיילין."},{"q":"מה הקריטריון העיקרי לאבחון טרשת נפוצה לפי הפרק?","a":"תסמינים מכמה אזורים שבאים והולכים לסירוגין","w":["תסמין אחד חמור שמופיע פתאום ונשאר קבוע","נקודות לבנות ב־MRI שלא משתנות לאורך זמן","חולשה שחולפת תוך דקות אחרי זריקה"],"e":"תסמינים מכמה אזורים שבאים והולכים לא מתאימים לשבץ. הנקודות ב־MRI דווקא נעלמות בסריקות מאוחרות, אף שהנזק נשאר. חולשה שחולפת בזריקה מתאימה לקתרין."}]},
"q15":{"t":"t3","v":[{"q":"מה יוצר את מחסום הדם-מוח?","a":"דופן נימי הדם במוח, שתאיה צמודים זה לזה","w":["שכבה של אסטרוציטים שעוטפת את המוח מבחוץ","קרומי המוח שמפרידים בין הגולגולת למוח","מעטפת המיילין שעוטפת את האקסונים במוח"],"e":"בשאר הגוף יש מרווחים בין התאים בדופן הנימים, ובמוח הם צמודים, ולכן רוב החומרים לא יוצאים מהדם. החומרים הנחוצים עוברים בעזרת נשאים."},{"q":"מה הראה הניסוי של ארליך עם הצבע הכחול?","a":"צבע בדם לא הגיע למוח; צבע בחדרים התפשט בכולו","w":["צבע בדם צבע את המוח מהר יותר משאר הרקמות","צבע בחדרי המוח לא התפשט בכלל, ונשאר במקומו","צבע בדם צבע רק את מוח השדרה ולא את המוח"],"e":"הצבע עבר בחופשיות בתוך ה־CNS אבל לא מהדם אליו, ולכן המחסום הוא בין הדם לנוזל שסביב תאי המוח."}]},
"q16":{"t":"t3","v":[{"q":"למה המחסום חלש דווקא באזור הפוסט־רמה?","a":"כדי שהנוירונים שם יזהו רעלים בדם ויעוררו הקאה","w":["כדי לאפשר לגלוקוז להגיע למוח במהירות","כי באזור הזה אין נימי דם בכלל","כדי שתרופות יוכלו להגיע בקלות לשאר המוח"],"e":"אזור הפוסט־רמה במוח המוארך מנטר את הדם ומפעיל הקאה כדי להוציא את הרעל מהקיבה. מחסום נוסף סביבו מונע מהחומרים להתפשט לשאר המוח."},{"q":"מה היתרון של מחסום הדם-מוח, ומה החיסרון שלו?","a":"שומר על איזון ומגן, אבל חוסם גם תרופות","w":["מאיץ את הגעת הגלוקוז, אבל מאפשר לרעלים לחדור","מגן מפני חיידקים, אבל מונע לגמרי מעבר של גלוקוז","מגדיל את זרימת הדם, אבל גורם להקאות"],"e":"העברת אותות תלויה בהרכב עדין של הנוזל, והמחסום שומר עליו. אותו מנגנון מקשה על פיתוח תרופות למחלות כמו אלצהיימר ופרקינסון."}]},
"q17":{"t":"t4","v":[{"q":"מחזיקים ספל חם ולא שומטים אותו. איזה מנגנון מאפשר זאת?","a":"המוח מפעיל אינטרנוירון מעכב במוח השדרה","w":["הנוירון הסנסורי מפסיק לשדר מידע על הכאב","הנוירון המוטורי מתעייף ומפסיק לירות","האינטרנוירון המעורר פולט יותר נוירוטרנסמיטר"],"e":"המוח שולח עכבה למוח השדרה דרך אינטרנוירון מעכב, וזו מתחרה בעירור שמגיע מהכאב. הכאב עדיין מורגש, אבל הרפלקס נבלם."},{"q":"מה מדגים המעגל של הספל החם?","a":"תחרות בין עירור לעכבה שקובעת את ההתנהגות","w":["שרפלקסים לא מושפעים מהמוח בכלל","שכאב לא מעורר פעילות במוח השדרה","שנוירונים מוטוריים פועלים בלי קלט מאינטרנוירונים"],"e":"מצד אחד הכאב מעורר את הנוירון המוטורי, ומצד שני המוח מעכב אותו. ההתנהגות נקבעת לפי הצד שגובר, וזה מראה שהמוח כן משפיע על רפלקסים."}]},
"q18":{"t":"t4","v":[{"q":"מה ההגדרה של פוטנציאל הממברנה?","a":"ההפרש במתח החשמלי בין פנים התא לחוץ","w":["כמות היונים שעוברים בכל שנייה דרך הממברנה","עוצמת הזרם שעובר לאורך האקסון","מספר תעלות הנתרן הפתוחות בממברנה"],"e":"פוטנציאל הממברנה הוא ההבדל במטען בין שני צידי הממברנה, כ־70 מ״ו שלילי במנוחה. הוא לא כמות יונים ולא מספר תעלות."},{"q":"למה האקסון הענק של הדיונון חשוב במחקר?","a":"קוטרו גדול, ולכן קל להחדיר אליו אלקטרודות","w":["הוא היחיד שיש בו פוטנציאל פעולה","הוא מוליך מהר יותר מכל אקסון של יונק","אין בו משאבות, ולכן הוא פשוט יותר"],"e":"הקוטר שלו כחצי מילימטר, פי מאות מאקסון של יונק, ולכן הוא מודל נוח. העקרונות שנלמדו בו תקפים גם לאקסונים של יונקים."}]},
"q19":{"t":"t4","v":[{"q":"מתח הממברנה משתנה מ־70– ל־50– מ״ו. איך קוראים לשינוי?","a":"דפולריזציה","w":["היפר־פולריזציה","ריפולריזציה","פוטנציאל מנוחה"],"e":"מעבר לערך פחות שלילי, כלומר קרוב יותר לאפס, הוא דפולריזציה. מעבר ל־80– מ״ו, שלילי יותר, היה היפר־פולריזציה."},{"q":"מה יקרה אם הדפולריזציה תגיע לכ־55– מ״ו?","a":"יתחיל פוטנציאל פעולה, כי זה סף העירור","w":["התא ייכנס להיפר־פולריזציה ולא יירה","משאבת הנתרן־אשלגן תיעצר","התא יחזור מיד לפוטנציאל המנוחה"],"e":"סף העירור הוא בערך 55– מ״ו, ומעליו מתחיל פוטנציאל פעולה. מתחת לסף, השינוי לא מספיק כדי לפתוח את תעלות הנתרן."}]},
"q20":{"t":"t4","v":[{"q":"איפה נמצא בעיקר יון האשלגן, K⁺?","a":"בתוך התא","w":["מחוץ לתא, בנוזל החוץ־תאי","בשני הצדדים בריכוז שווה","רק בתוך השלפוחיות הסינפטיות"],"e":"K⁺ מרוכז בתוך התא, ו־Na⁺ ו־Cl⁻ בעיקר בחוץ. הנוזל החוץ־תאי דומה למי ים, שעיקרם נתרן כלורי."},{"q":"מה נכון לגבי האניונים האורגניים (A⁻)?","a":"הם רק בפנים, כי אינם עוברים את הממברנה","w":["הם נמצאים רק מחוץ לתא ונדחפים פנימה","הם נשאבים החוצה על ידי משאבת הנתרן־אשלגן","הם נכנסים לתא בזמן פוטנציאל הפעולה"],"e":"אלה חלבונים ותוצרי חילוף חומרים טעונים שהממברנה לא חדירה להם. הם משפיעים על המטען השלילי בפנים, אבל מיקומם נובע מכך שאינם עוברים."}]},
"q21":{"t":"t4","v":[{"q":"למה Na⁺ נשאר מחוץ לתא במנוחה, אף ששני הכוחות דוחפים אותו פנימה?","a":"המשאבה מוציאה אותו, והממברנה כמעט לא חדירה לו","w":["הלחץ האלקטרוסטטי דוחף אותו החוצה ומאזן את הדיפוזיה","הוא קשור לחלבונים גדולים שלא עוברים את הממברנה","הריכוז שלו בפנים גבוה, ולכן הדיפוזיה מוציאה אותו"],"e":"גם הדיפוזיה וגם הלחץ האלקטרוסטטי מושכים את Na⁺ פנימה. מה שמחזיק אותו בחוץ הוא המשאבה, יחד עם החדירות הנמוכה מאוד של הממברנה לנתרן."},{"q":"מה עושה משאבת הנתרן־אשלגן בכל מחזור?","a":"מוציאה 3 יוני נתרן ומכניסה 2 יוני אשלגן","w":["מכניסה 3 יוני נתרן ומוציאה 2 יוני אשלגן","מוציאה 2 יוני נתרן ומכניסה 3 יוני אשלגן","מחליפה יון נתרן אחד ביון כלוריד אחד"],"e":"המשאבה מוציאה שלושה Na⁺ כנגד כל שני K⁺ שהיא מכניסה, תוך שימוש ב־ATP. היא צורכת עד 40% מהאנרגיה של הנוירון."}]},
"q22":{"t":"t4","v":[{"q":"מה המצב של יון הכלוריד, Cl⁻, במנוחה?","a":"דיפוזיה פנימה ולחץ חשמלי החוצה: הם מתאזנים","w":["שני הכוחות דוחפים אותו פנימה, והמשאבה מוציאה אותו","שני הכוחות דוחפים אותו החוצה, ולכן הוא בעיקר בחוץ","הוא לא יכול לעבור את הממברנה, ולכן הוא נשאר בפנים"],"e":"Cl⁻ מרוכז בחוץ, אז הדיפוזיה מושכת אותו פנימה, אבל הפנים השלילי דוחה אותו. לכן הוא בשיווי משקל, בלי צורך במשאבה."},{"q":"מה מתאר את מצב יון האשלגן במנוחה?","a":"דיפוזיה החוצה ולחץ חשמלי פנימה: כמעט איזון","w":["שני הכוחות דוחפים אותו פנימה בעוצמה רבה","שני הכוחות דוחפים אותו החוצה, והמשאבה מחזירה","אין עליו כוחות כלל, כי הממברנה לא חדירה לו"],"e":"K⁺ מרוכז בפנים ולכן נוטה לצאת, אבל החוץ החיובי דוחף אותו פנימה. הכוחות כמעט מאזנים זה את זה, והממברנה חדירה לו יחסית."}]},
"q23":{"t":"t5","v":[{"q":"מה גורם לדפולריזציה המהירה בתחילת פוטנציאל הפעולה?","a":"פתיחת תעלות נתרן וכניסה מהירה של Na⁺","w":["פתיחה של תעלות אשלגן ויציאה של K⁺ מהתא","הפעלה מוגברת של משאבת הנתרן־אשלגן","כניסה של יוני כלוריד דרך תעלות פתוחות"],"e":"בסף נפתחות תעלות הנתרן, ו־Na⁺ נכנס בגלל הדיפוזיה והלחץ האלקטרוסטטי. יציאת K⁺ מתרחשת אחר כך ומחזירה את המתח."},{"q":"מה קורה לתעלות הנתרן בשיא פוטנציאל הפעולה?","a":"הן נחסמות עד שהממברנה חוזרת למנוחה","w":["הן נשארות פתוחות עד סוף ההיפר־פולריזציה","הן נפתחות עוד יותר ומגבירות את השיא","הן הופכות לתעלות שמעבירות אשלגן"],"e":"בשיא התעלות נכנסות למצב רפרקטורי. זה מסביר למה פוטנציאל הפעולה לא חוזר אחורה ולמה יש הגבלה על קצב הירי."}]},
"q24":{"t":"t5","v":[{"q":"מה גורם להיפר־פולריזציה בסוף פוטנציאל הפעולה?","a":"K⁺ ממשיך לצאת דרך תעלות שעוד פתוחות","w":["יוני נתרן ממשיכים להיכנס אחרי השיא","משאבת הנתרן־אשלגן מכניסה נתרן לתא","תעלות הכלוריד נסגרות בפתאומיות"],"e":"תעלות האשלגן נסגרות לאט, ולכן K⁺ ממשיך לצאת והמתח עובר לרגע את ערך המנוחה. תעלות הנתרן כבר חסומות בשלב הזה."},{"q":"למה ריכוזי היונים כמעט לא משתנים אחרי פוטנציאל פעולה אחד?","a":"כי בכל פוטנציאל פעולה עוברים מעט מאוד יונים","w":["כי המשאבה מחזירה את כל היונים באותו רגע","כי יוני הנתרן יוצאים בדיוק כמו שנכנסו","כי היונים לא עוברים את הממברנה אלא רק נעים לאורכה"],"e":"מספר היונים שעוברים קטן לעומת הכמות הכוללת, ולכן הריכוזים כמעט לא משתנים. המשאבות מחזירות את המצב לאורך זמן, לא באותו רגע."}]},
"q25":{"t":"t5","v":[{"q":"גירוי חזק יותר מופעל על נוירון סנסורי. מה ישתנה באקסון?","a":"קצב הירי של פוטנציאלי הפעולה יעלה","w":["הגודל של כל פוטנציאל פעולה יגדל","המהירות של כל פוטנציאל פעולה תגדל","הסף של האקסון יעלה ויקשה על הירי"],"e":"לפי חוק התדר, העוצמה מיוצגת בקצב הירי. הגודל של כל פוטנציאל קבוע, לפי חוק הכול או לא־כלום, ולכן לא יכול לשאת את המידע."},{"q":"מה קובע חוק הכול או לא־כלום?","a":"מעל הסף פוטנציאל הפעולה מתרחש במלואו, ומתחת לו לא בכלל","w":["כל גירוי יוצר פוטנציאל פעולה בגודל שמתאים לו","פוטנציאל הפעולה נחלש בהדרגה לאורך האקסון","נוירון יורה רק אם כל הסינפסות שלו פעילות"],"e":"הגודל של פוטנציאל הפעולה לא תלוי בעוצמת הגירוי, והוא מתפשט בלי לדעוך. העוצמה מקודדת דרך חוק התדר."}]},
"q26":{"t":"t5","v":[{"q":"מה ההבדל בין חוק הכול או לא־כלום לחוק התדר?","a":"הראשון: הגודל קבוע; השני: העוצמה בקצב","w":["הראשון חל על דנדריטים; השני על אקסונים","הראשון מסביר את העוצמה; השני את הסף","אין הבדל, אלה שני ניסוחים לאותו חוק"],"e":"שני החוקים משלימים: בגלל שהגודל קבוע, המידע על עוצמה חייב לעבור בקצב הירי. שניהם חלים על האקסון."},{"q":"מה, לפי הפרק, יכול לגרום להתכווצות חזקה יותר של שריר?","a":"יותר פוטנציאלים בשנייה ויותר נוירונים יורים","w":["פוטנציאלי פעולה גדולים יותר בכל אקסון","פוטנציאלי פעולה איטיים וארוכים יותר","סף עירור נמוך יותר בשרירים עצמם"],"e":"עוצמת ההתכווצות תלויה בקצב הירי ובמספר הנוירונים הפעילים. הגודל של כל פוטנציאל פעולה קבוע ולא יכול לגדול."}]},
"q27":{"t":"t5","v":[{"q":"מה קורה בהולכה בקפיצות?","a":"מתחדש במרווחים; מתחת למיילין הזרם סביל","w":["פוטנציאל הפעולה מתחדש בכל נקודה לאורך האקסון","פוטנציאל הפעולה קופץ ישירות מגוף התא לכפתורים","פוטנציאל הפעולה עובר בתוך המיילין עצמו"],"e":"במרווחים יש תעלות נתרן ושם הפוטנציאל נוצר מחדש, ובין המרווחים הזרם מתפשט מהר באופן סביל. התחדשות בכל נקודה מאפיינת אקסון בלי מיילין."},{"q":"מהם שני היתרונות של מיילין?","a":"הולכה מהירה יותר וחיסכון באנרגיה","w":["פוטנציאל פעולה גדול יותר וסף נמוך יותר","הגנה מפני רעלים וייצור של ATP","תובלה מהירה יותר של חלבונים בתוך האקסון"],"e":"ההולכה בקפיצות מהירה, ויונים עוברים רק במרווחים, ולכן המשאבות צריכות לעבוד פחות. המיילין לא משנה את גודל פוטנציאל הפעולה."}]},
"q28":{"t":"t5","v":[{"q":"למה נזק למיילין בטרשת נפוצה משבש את התפקוד, גם כשהאקסון שלם?","a":"בלי מיילין ההולכה בקפיצות נפגעת, והאותות לא עוברים כראוי","w":["בלי מיילין לא נוצרים נוירוטרנסמיטרים בכפתורים","בלי מיילין התאים מאבדים את פוטנציאל המנוחה שלהם","בלי מיילין הדנדריטים לא קולטים מסרים"],"e":"המיילין מאפשר את ההולכה בקפיצות. כשהוא נהרס, האות נחלש ומתעכב בדרך, גם כשהאקסון עצמו לא נקטע."},{"q":"איפה נמצאות תעלות הנתרן התלויות במתח באקסון עם מיילין?","a":"בעיקר במרווחי ראנווייה","w":["בעיקר מתחת למעטפת המיילין","רק בגוף התא, לא באקסון","רק בכפתורים הסופיים"],"e":"התעלות מרוכזות במרווחים החשופים, ושם פוטנציאל הפעולה מתחדש. מתחת למיילין הזרם מתפשט באופן סביל."}]},
"q29":{"t":"t6","v":[{"q":"איזה יון נכנס לכפתור הסופי וגורם לפליטת הנוירוטרנסמיטר?","a":"סידן (Ca²⁺)","w":["נתרן (Na⁺)","אשלגן (K⁺)","כלוריד (Cl⁻)"],"e":"פוטנציאל הפעולה פותח בכפתור תעלות סידן, וה־Ca²⁺ שנכנס נקשר לחלבונים על השלפוחיות וגורם לפליטה. נתרן אחראי לפוטנציאל הפעולה עצמו."},{"q":"מה הסדר הנכון של שלבי הפליטה?","a":"פוטנציאל פעולה, כניסת סידן, פתיחת נקב איחוי ופליטה","w":["כניסת סידן, פוטנציאל פעולה, פליטה וסגירת התעלות","פליטה, כניסת סידן ואז פוטנציאל פעולה","פתיחת נקב איחוי, פוטנציאל פעולה ואז כניסת נתרן"],"e":"פוטנציאל הפעולה מגיע לכפתור ופותח תעלות סידן, הסידן נקשר לחלבונים בשלפוחיות, ונקב האיחוי נפתח. זה תהליך האקסוציטוזה."}]},
"q30":{"t":"t6","v":[{"q":"מה נכון לגבי השלפוחיות הסינפטיות?","a":"קטנות נוצרות בכפתור, גדולות בגוף התא","w":["כולן מיוצרות בגוף התא ומובלות אל הכפתור","כולן מיוצרות בכפתור הסופי, ללא קשר לגודלן","הקטנות מיוצרות בגוף התא, והגדולות בכפתור"],"e":"שלפוחיות קטנות של נוירוטרנסמיטרים כמו חומצות אמיניות מיוצרות בכפתור. הגדולות, עם פפטידים, נבנות בגוף התא ומובלות בתובלה אקסופלזמית."},{"q":"מה קורה במנגנון ״מגע ובריחה״?","a":"השלפוחית פולטת את תוכנה, נסגרת, עוזבת ומתמלאת מחדש","w":["השלפוחית נצמדת לממברנה ונשארת שם לצמיתות","הנוירוטרנסמיטר נוגע בקולטן ובורח בלי להשפיע","הכפתור נוגע בדנדריט וחוזר אחורה"],"e":"זו דרך יעילה למחזר שלפוחיות: היא מתאחה לרגע עם הממברנה, פולטת את התוכן ונסגרת שוב. כך הכפתור לא מתרוקן משלפוחיות."}]},
"q31":{"t":"t6","v":[{"q":"מה מאפיין קולטן יונוטרופי?","a":"התעלה חלק מהקולטן ונפתחת ישירות","w":["הוא פועל דרך חלבון G ושליח שניוני","הוא נמצא בתוך הגרעין ומשפיע על ייצור חלבונים","הוא נמצא על הכפתור הפרה־סינפטי ומווסת פליטה"],"e":"בקולטן יונוטרופי אתר הקשירה והתעלה באותו חלבון, ולכן התגובה מהירה וקצרה. חלבון G ושליח שניוני מאפיינים קולטן מטבוטרופי."},{"q":"מה היתרון של קולטן מטבוטרופי על פני יונוטרופי?","a":"ההשפעה שלו רחבה וממושכת יותר","w":["הוא מהיר יותר ופותח תעלה ישירות","הוא לא צורך אנרגיה בכלל","הוא נמצא רק בשרירים ולא במוח"],"e":"קולטן מטבוטרופי דורש יותר צעדים ואנרגיה, ולכן הוא איטי. בתמורה הוא יכול להפעיל שינויים רבים בתא לאורך זמן."}]},
"q32":{"t":"t6","v":[{"q":"מהו שליח שניוני?","a":"חומר שנוצר בתא בעקבות הפעלת חלבון G","w":["נוירוטרנסמיטר שני שנפלט מאותו כפתור","הורמון שמגיע מהדם אל הסינפסה","יון שנכנס לתא דרך תעלה יונוטרופית"],"e":"הנוירוטרנסמיטר הוא השליח הראשון, והחומר שנוצר בתוך התא הוא השני. הוא יכול לפתוח תעלות או להפעיל תהליכים אחרים."},{"q":"מה מגדיר ליגנד?","a":"חומר שנקשר לאתר הקשירה של קולטן","w":["תעלת יונים שנפתחת לפי המתח","אנזים שמפרק נוירוטרנסמיטר","השלפוחית שמכילה את הנוירוטרנסמיטר"],"e":"כל חומר שנקשר לאתר קשירה, נוירוטרנסמיטר או סם, נקרא ליגנד. תעלות, אנזימים ושלפוחיות הם רכיבים אחרים של הסינפסה."}]},
"q33":{"t":"t7","v":[{"q":"נוירוטרנסמיטר פותח תעלות אשלגן בתא המקבל. מה תהיה ההשפעה?","a":"היפר־פולריזציה: פוטנציאל פוסט־סינפטי מעכב","w":["דפולריזציה: פוטנציאל פוסט־סינפטי מעורר","פוטנציאל פעולה מיידי בתא המקבל","אין השפעה, כי אשלגן לא עובר את הממברנה"],"e":"כש־K⁺ יוצא, הפנים נעשה שלילי יותר, וזה מרחיק את התא מהסף. כניסת Na⁺ הייתה גורמת לדפולריזציה ולפוטנציאל מעורר."},{"q":"מה ההשפעה של פתיחת תעלות כלוריד כשהממברנה כבר בדפולריזציה?","a":"Cl⁻ נכנס ומחזיר את המתח למנוחה","w":["Cl⁻ יוצא וגורם לדפולריזציה נוספת","אין שום השפעה, כי Cl⁻ תמיד בשיווי משקל","Cl⁻ נכנס וגורם מיד לפוטנציאל פעולה"],"e":"במנוחה Cl⁻ בשיווי משקל ולכן כמעט לא זז. כשהתא בדפולריזציה, הפנים פחות שלילי, Cl⁻ נכנס ומחזיר את המתח למנוחה."}]},
"q34":{"t":"t7","v":[{"q":"מהי הדרך הנפוצה לסיום פוטנציאל פוסט־סינפטי?","a":"קליטה חוזרת של הנוירוטרנסמיטר לכפתור הסופי","w":["פירוק הנוירוטרנסמיטר בתוך התא המקבל","פליטה של נוירוטרנסמיטר מעכב מאותו כפתור","הסרה של הקולטנים מהממברנה הפוסט־סינפטית"],"e":"ברוב הסינפסות נשאים מחזירים את הנוירוטרנסמיטר לכפתור. פירוק אנזימטי קיים, למשל באצטילכולין, אבל הוא מתרחש במרווח הסינפטי."},{"q":"למה הזריקה עזרה לקתרין?","a":"היא עיכבה את פירוק האצטילכולין בסינפסה","w":["היא החליפה את הקולטנים שנהרסו בשריר","היא הגבירה את מהירות ההולכה באקסונים המוטוריים","היא חסמה את מערכת החיסון באופן קבוע"],"e":"כשאצטילכולין־אסטראז מעוכב, האצטילכולין מפעיל שוב ושוב את הקולטנים שנשארו. הזריקה לא מתקנת את הקולטנים ולא מרפאת את המחלה."}]},
"q35":{"t":"t7","v":[{"q":"מה קובע אם נוירון יירה?","a":"הסכום של הפוטנציאלים המעוררים והמעכבים שהוא מקבל","w":["הסינפסה האחרונה שהופעלה לפני הירי","מספר הדנדריטים שיש לו","עוצמת הפוטנציאל המעורר הגדול ביותר בלבד"],"e":"זו האינטגרציה העצבית: העירור והעכבה מסתכמים, ורק אם הסכום מגיע לסף האקסון יורה. אף סינפסה בודדת לא קובעת לבד."},{"q":"נוירון מעכב מעכב נוירון מעכב אחר. מה תהיה התוצאה בהתנהגות?","a":"שחרור של ההתנהגות שהנוירון השני עיכב","w":["עכבה כפולה וחזקה יותר של ההתנהגות","אין השפעה, כי שתי העכבות מבטלות את המערכת","עירור ישיר של השרירים"],"e":"כשהנוירון המעכב השני נבלם, הוא מפסיק לעכב את היעד שלו, וההתנהגות משתחררת. לכן עכבה של נוירון לא תמיד פירושה עכבה של התנהגות."}]},
"q36":{"t":"t7","v":[{"q":"למה, בדוגמת החשבון בנק, ״הוצאה״ מתרחשת רק לפעמים?","a":"כי ירי קורה רק כשהסכום עובר את הסף","w":["כי כל הפקדה גורמת מיד להוצאה","כי משיכות אינן משפיעות על היתרה","כי ההוצאה תלויה רק בהפקדה הגדולה ביותר"],"e":"ההפקדות הן פוטנציאלים מעוררים והמשיכות מעכבים, והירי מתרחש רק כשהיתרה עוברת את הסף. כל הפוטנציאלים משפיעים על היתרה."},{"q":"מה קורה כשכמה סינפסות מעוררות פועלות יחד על אותו נוירון?","a":"הם מסתכמים ועשויים להגיע לסף ולירי","w":["הם מבטלים זה את זה ולכן אין השפעה","רק הראשון מהם משפיע, והשאר נחסמים","הם גורמים להיפר־פולריזציה של הנוירון"],"e":"פוטנציאלים מעוררים שמגיעים יחד מסתכמים כשהם מתקדמים אל האקסון. אם הסכום עובר את הסף, האקסון יורה."}]},
"q37":{"t":"t7","v":[{"q":"מהו אוטורצפטור?","a":"קולטן על הנוירון הפרה־סינפטי שמגיב לנוירוטרנסמיטר שהוא עצמו פולט","w":["קולטן על הנוירון הפוסט־סינפטי שמגיב לכל נוירוטרנסמיטר","קולטן בתוך הגרעין שנקשר להורמונים סטרואידיים","קולטן שמפעיל את עצמו בלי שום ליגנד"],"e":"האוטורצפטור מאפשר לנוירון לנטר את הפליטה של עצמו, ובדרך כלל להפחית אותה. קולטנים בגרעין שייכים להורמונים סטרואידיים."},{"q":"מה עושה סינפסה אקסו־אקסונית של עיכוב פרה־סינפטי?","a":"מקטינה את כמות הנוירוטרנסמיטר שהכפתור המקבל פולט","w":["מעכבת ישירות את הדנדריטים של התא הפוסט־סינפטי","מגדילה את כמות הנוירוטרנסמיטר שהכפתור פולט","גורמת להיפר־פולריזציה בגוף התא של הנוירון הפרה־סינפטי"],"e":"הסינפסה נמצאת על הכפתור עצמו ומכווננת את הפליטה שלו, בלי להשתתף באינטגרציה של התא המקבל. הגדלת הפליטה היא זירוז פרה־סינפטי."}]},
"q38":{"t":"t7","v":[{"q":"מהו צומת מעבר (gap junction)?","a":"סינפסה חשמלית של צימוד ישיר בין תאים","w":["המרווח בין שני מקטעים של מעטפת המיילין","סינפסה כימית שמעבירה מידע בשני הכיוונים","האזור שבו האקסון יוצא מגוף התא"],"e":"בצומת מעבר יש צימוד חשמלי ישיר בין תאים. המרווח בין מקטעי מיילין הוא מרווח ראנווייה, וסינפסה דו־כיוונית כימית היא דנדרו־דנדריטית."},{"q":"מה מיוחד בסינפסות דנדרו־דנדריטיות?","a":"הן יכולות להעביר מידע בשני הכיוונים","w":["הן מחברות בין שני כפתורים סופיים","הן לא משתמשות בכלל בנוירוטרנסמיטרים","הן נמצאות רק במערכת העצבים ההיקפית"],"e":"בדרך כלל התקשורת בסינפסה חד־כיוונית, והסינפסות האלה הן יוצא מן הכלל. סינפסה בין שני כפתורים היא אקסו־אקסונית."}]},
"q39":{"t":"t8","v":[{"q":"במה נבדל נוירומודולטור מנוירוטרנסמיטר?","a":"הוא מתפזר בנוזל ומשפיע על נוירונים רבים","w":["הוא מופרש מבלוטה לדם ופועל על איברים רחוקים","הוא נקשר לקולטנים בתוך הגרעין ומשנה גנים","הוא תמיד מעכב ואף פעם לא מעורר"],"e":"נוירומודולטור נפלט מנוירונים כמו נוירוטרנסמיטר, אבל לא מוגבל למרווח הסינפטי. הפרשה מבלוטה לדם מאפיינת הורמון."},{"q":"מהו הורמון?","a":"חומר מבלוטה אנדוקרינית שעובר בדם לתאי מטרה","w":["חומר שנפלט מכפתור סופי למרווח הסינפטי","חלבון שמזרז תגובות כימיות בתוך התא","חומר שמתפזר רק בנוזל שבין הנוירונים"],"e":"ההורמון עובר בדם ומשפיע רק על תאים שיש להם קולטנים מתאימים. פליטה לסינפסה מאפיינת נוירוטרנסמיטר, וזירוז תגובות הוא תפקיד של אנזים."}]},
"q40":{"t":"t8","v":[{"q":"מהם רוב הנוירומודולטורים מבחינה כימית?","a":"פפטידים, שרשראות של חומצות אמיניות","w":["סטרואידים שנגזרים מכולסטרול","יונים קטנים כמו סידן ונתרן","ליפידים שמיוצרים בממברנה"],"e":"לפי הפרק, רוב הנוירומודולטורים וחלק מההורמונים הם פפטידים. סטרואידים הם סוג אחר של הורמונים, שפועלים בתוך הגרעין."},{"q":"מהו תא מטרה?","a":"תא שיש לו קולטן מתאים להורמון","w":["תא שמפריש הורמון לזרם הדם","תא שהורס הורמונים אחרי שפעלו","כל תא בגוף שהדם מגיע אליו"],"e":"ההורמון מגיע לכל הגוף דרך הדם, אבל משפיע רק על תאים עם קולטנים מתאימים. תא שמפריש הורמון הוא חלק מבלוטה."}]},
"q41":{"t":"t8","v":[{"q":"איך פועל הורמון סטרואידי על התא?","a":"חודר לתא ונקשר לקולטן בגרעין","w":["נקשר לקולטן יונוטרופי בממברנה ופותח תעלה","נקשר לקולטן מטבוטרופי ומפעיל שליח שניוני","נכנס לשלפוחיות ונפלט שוב לסינפסה"],"e":"סטרואידים נגזרים מכולסטרול ומסיסים בשומן, ולכן עוברים את הממברנה. הקולטן בגרעין מפעיל גנים, והשפעה כזו איטית וממושכת."},{"q":"למה הורמונים סטרואידיים יכולים לעבור את ממברנת התא?","a":"כי הם נגזרים מכולסטרול ומסיסים בשומן","w":["כי יש בממברנה נשאים מיוחדים לסטרואידים","כי הם מולקולות גדולות מאוד ונדחקות פנימה","כי הם נכנסים דרך תעלות יונים פתוחות"],"e":"הממברנה בנויה משכבה שומנית, וחומרים שמסיסים בשומן עוברים בה בקלות. זו הסיבה שהקולטנים שלהם נמצאים בתוך התא."}]},
"q42":{"t":"t8","v":[{"q":"מה ההבדל העיקרי בזמן בין נוירוטרנסמיטר שפותח תעלה לבין הורמון סטרואידי?","a":"הנוירוטרנסמיטר פועל תוך אלפיות שנייה; הסטרואיד איטי וממושך","w":["הסטרואיד פועל מהר יותר, כי הוא חודר ישר לתא","שניהם פועלים באותה מהירות בדיוק","הנוירוטרנסמיטר פועל לאורך ימים, והסטרואיד לשניות"],"e":"פתיחת תעלה יונוטרופית היא כמעט מיידית. ההשפעה של סטרואיד דורשת ייצור חלבונים חדשים, ולכן היא איטית אבל נשארת זמן רב."},{"q":"איך פועלים הורמונים פפטידיים על תאי המטרה?","a":"דרך קולטנים מטבוטרופיים בממברנה","w":["דרך קולטנים בתוך הגרעין","דרך חדירה ישירה לציטופלזמה","דרך צמתי מעבר בין התאים"],"e":"פפטידים לא מסיסים בשומן ולכן לא חודרים לתא. הם נקשרים לקולטנים מטבוטרופיים על פני התא, בשונה מסטרואידים שפועלים בגרעין."}]},
"h1":{"t":"t1","v":[{"q":"נוירון שכל גופו בתוך ה־CNS ומקשר בין נוירונים אחרים הוא...","a":"אינטרנוירון","w":["נוירון מוטורי","נוירון סנסורי","נוירון דו־קוטבי"],"e":"אינטרנוירון כולו ב־CNS (מקומי או ממסר). מוטורי: גוף ב־CNS אבל אקסון יוצא לשריר."}]},
"h2":{"t":"t2","v":[{"q":"חומר שמשבש את המיקרוטובולים יפגע ראשית ב...","a":"תובלה אקסופלזמית בשני הכיוונים","w":["ייצור ATP במיטוכונדריה","תעתוק DNA ל־mRNA בגרעין","פוטנציאל המנוחה של הממברנה בדנדריטים"],"e":"קינזין (קדומנית) ודינאין (אחורנית) נעים לאורך מיקרוטובולים, בצריכת ATP."}]},
"h3":{"t":"t3","v":[{"q":"למה אקסון שנחתך ב־PNS צומח מחדש, וב־CNS לא?","a":"תאי התמך: שוואן מנחים, אסטרוציטים יוצרים צלקת","w":["נוירונים ב־PNS צעירים ועדיין מתחלקים","אקסונים ב־CNS לא עטופים במיילין בכלל","ב־CNS אין בכלל תובלה אקסופלזמית לאורך האקסון"],"e":"תאי שוואן יוצרים גליל שמנחה צמיחה (3–4 מ״מ ליום). ב־CNS אסטרוציטים יוצרים צלקת ומאותתים לעצור."}]},
"h4":{"t":"t3","v":[{"q":"טרשת נפוצה פוגעת במיילין של ה־CNS, אבל לא של ה־PNS. איזה תא מותקף?","a":"אוליגו־דנדרוציט","w":["תא שוואן","אסטרוציט פיברילרי","מיקרוגלייה"],"e":"אוליגו־דנדרוציטים מייצרים מיילין ב־CNS. תאי שוואן ב־PNS לא נפגעים."}]},
"h5":{"t":"t4","v":[{"q":"מה שומר על ריכוז נתרן נמוך בתוך התא במנוחה, למרות ששני הכוחות דוחפים אותו פנימה?","a":"משאבת נתרן־אשלגן (3 נתרן החוצה, 2 אשלגן פנימה)","w":["הלחץ האלקטרוסטטי שדוחף את הנתרן החוצה","תעלות נתרן שנשארות פתוחות כל הזמן בזמן המנוחה","הדיפוזיה שמוציאה נתרן החוצה מהתא כל הזמן"],"e":"דיפוזיה ולחץ אלקטרוסטטי שניהם דוחפים Na⁺ פנימה. הממברנה כמעט לא חדירה לו במנוחה, והמשאבה מוציאה את מה שנכנס."}]},
"h6":{"t":"t5","v":[{"q":"למה ההולכה באקסון ממוילן מהירה יותר?","a":"פוטנציאל הפעולה ״קופץ״ בין צמתי רנוויה (הולכה מדלגת)","w":["המיילין מוסיף עוד תעלות נתרן לאורך כל האקסון","המיילין מגדיל את הספיגה החוזרת של הנוירוטרנסמיטר בסינפסה","המיילין משנה את חוק הכל או לא כלום באקסון"],"e":"הולכה מדלגת: האות מתחדש רק בצמתים, וזה גם חוסך אנרגיה."}]},
"h7":{"t":"t5","v":[{"q":"איך מקודדת עוצמת גירוי חזק יותר בנוירון?","a":"בקצב ירי גבוה יותר (הגודל קבוע)","w":["בפוטנציאל פעולה גדול וחזק יותר","בפוטנציאל פעולה שנמשך זמן רב יותר","בהולכה מהירה יותר לאורך האקסון"],"e":"חוק הכל או לא כלום: העוצמה מקודדת בקצב ולא בגודל."}]},
"h8":{"t":"t6","v":[{"q":"מה מפעיל את פליטת הנוירוטרנסמיטר כשפוטנציאל הפעולה מגיע לכפתור הסופי?","a":"כניסת יוני סידן דרך תעלות תלויות מתח","w":["כניסת יוני כלוריד דרך קולטנים","יציאת אשלגן מהכפתור","פתיחת קולטנים מטבוטרופיים בכפתור הסופי"],"e":"Ca²⁺ נכנס ומפעיל היתוך של שלפוחיות עם הממברנה (אקסוציטוזה)."}]},
"h9":{"t":"t7","v":[{"q":"קולטן שפתיחתו מכניסה יוני כלוריד יוצר בדרך כלל...","a":"פוטנציאל פוסט־סינפטי מעכב (IPSP)","w":["פוטנציאל פוסט־סינפטי מעורר (EPSP)","פוטנציאל פעולה בתא הפוסט־סינפטי","דה־פולריזציה מתחת לסף"],"e":"כניסת Cl⁻ (או יציאת K⁺) מובילה להיפר־פולריזציה ומעכבת. Na⁺ נכנס = EPSP."}]},
"h10":{"t":"t7","v":[{"q":"תא מקבל EPSP מסינפסה אחת ו־IPSP בגודל דומה מסינפסה אחרת, באותו זמן. מה צפוי?","a":"ההשפעות יתקזזו, ולרוב לא יהיה ירי","w":["התא יירה, כי פוטנציאל מעורר תמיד גובר","התא יירה פעמיים","ה־IPSP יגביר את ה־EPSP"],"e":"אינטגרציה: התא מסכם מרחבית וזמנית. הירי תלוי בסכום בגבעת האקסון."}]},
"h11":{"t":"t8","v":[{"q":"מה מבדיל נוירומודולטור מנוירוטרנסמיטר רגיל?","a":"הוא מתפזר ומשפיע על אזורים רבים","w":["הוא פועל רק בסינפסה אחת מסוימת ומוגדרת","הוא תמיד מעורר ולעולם לא מעכב","הוא מופרש לדם בדיוק כמו הורמון"],"e":"נוירומודולטורים (כמו פפטידים) פועלים על מרחק ועל תאים רבים. הורמונים מופרשים לדם."}]}};
const H={"h1":{"t":"t1","v":[{"q":"נוגעים בטעות במגהץ חם, והיד נרתעת עוד לפני שמרגישים כאב במודע. איזה רצף של נוירונים פעל, ואיפה?","a":"סנסורי, אינטרנוירון ומוטורי, במוח השדרה בלי שהמוח החליט","w":["מוטורי, אינטרנוירון וסנסורי, בקליפת המוח אחרי החלטה","סנסורי ומוטורי בלבד, ישירות מהעור אל השריר","אינטרנוירון בלבד, שמחבר את העור לשריר בתוך היד"],"e":"זה רפלקס הרתיעה: הנוירון הסנסורי מדווח למוח השדרה, האינטרנוירון מעביר, והנוירון המוטורי מכווץ את השריר. המוח לא צריך להחליט."},{"q":"חולה עם פגיעה במוח השדרה בגובה המותניים. רופאה נוגעת לו ברגל בפטיש קטן, והרגל קופצת למרות שהוא לא מרגיש את המגע. איך זה אפשרי?","a":"הרפלקס עובר במוח השדרה מתחת לפגיעה, בלי צורך במוח","w":["הנוירונים המוטוריים ברגל פועלים בלי שום קשר למוח השדרה","המוח מקבל את המידע בדרך אחרת ושולח פקודה לרגל","השריר מגיב ישירות למגע בלי שום נוירון בדרך"],"e":"מעגל הרפלקס (סנסורי, אינטרנוירון, מוטורי) נסגר בתוך מוח השדרה, ולכן הוא עובד גם כשהקשר למוח מנותק."}]},"h2":{"t":"t1","v":[{"q":"מוציאים ספל רותח מהמיקרוגל. היד נכווית, אבל לא זורקים את הספל עד שמגיעים לשולחן. מה מונע את הרפלקס?","a":"המוח מפעיל אינטרנוירון מעכב שבולם את הנוירון המוטורי","w":["הנוירון הסנסורי מפסיק לשדר כאב כשהמוח מבין שהספל חשוב","הנוירון המוטורי מתעייף אחרי כמה שניות ולכן לא מגיב","השריר מקבל פחות חמצן ולכן לא מסוגל להתכווץ"],"e":"זו הדוגמה המרכזית של הספר לעיכוב: המוח שולח מסר מעכב, ובנוירון המוטורי ״התחרות״ בין העירור מהכאב לבין העיכוב מהמוח מכריעה."}]},"h3":{"t":"t1","v":[{"q":"לנוירון אחד יש עשרות אלפי ענפים קצרים שמקבלים מסרים, ושלוחה אחת ארוכה מאוד. איך המבנה הזה קשור לתפקיד שלו?","a":"הרבה דנדריטים כדי לקבל מהרבה תאים, ואקסון ארוך כדי להעביר רחוק","w":["הרבה אקסונים כדי לשלוח להרבה תאים, ודנדריט ארוך כדי לקבל","הרבה דנדריטים כדי לייצר אנרגיה, ואקסון ארוך כדי לאחסן חומרים","המבנה מקרי, ולכן אין קשר בין צורת התא לתפקיד שלו"],"e":"זה הקשר בין מבנה לתפקוד שהמרצה מבקשת: הדנדריטים קולטים, האקסון מוליך, והכפתורים הסופיים משחררים חומר לתא הבא."}]},"h4":{"t":"t2","v":[{"q":"חומר שנוצר בגוף התא צריך להגיע לכפתורים הסופיים בקצה של אקסון ארוך. מה יעביר אותו, ובאיזה כיוון?","a":"קינזין, בתובלה קדימה מגוף התא אל הכפתורים","w":["דינאין, בתובלה קדימה מגוף התא אל הכפתורים","קינזין, בתובלה אחורה מהכפתורים אל גוף התא","דינאין, בתובלה אחורה מהכפתורים אל גוף התא"],"e":"תובלה קדימה (מהגוף לקצה) נעשית בקינזין, עד 500 מ״מ ביום. דינאין עובד בכיוון ההפוך, בערך בחצי מהמהירות."},{"q":"חוקרים חוסמים את דינאין בנוירון. איזו תנועה של חומרים תיפגע?","a":"התנועה אחורה, מהכפתורים הסופיים אל גוף התא","w":["התנועה קדימה, מגוף התא אל הכפתורים הסופיים","שחרור הנוירוטרנסמיטר מהכפתורים אל הסינפסה","העתקת ה־DNA ל־mRNA בתוך גרעין התא"],"e":"דינאין אחראי לתובלה אחורה. קינזין, שאחראי לתובלה קדימה, לא נפגע."}]},"h5":{"t":"t2","v":[{"q":"חומר רעיל פוגע במיטוכונדריה של נוירון. אילו שני תהליכים צפויים להיפגע ראשונים?","a":"התובלה באקסון ומשאבת הנתרן־אשלגן, כי שתיהן צורכות ATP","w":["העתקת ה־DNA ואריזת החומרים, כי שתיהן קורות בגרעין","מחסום הדם־מוח והמיילין, כי שניהם תלויים בתאי התמך","הקליטה החוזרת והפירוק, כי שניהם נעשים בסינפסה בלבד"],"e":"המיטוכונדריה מייצרת ATP. גם התנועה על ״המסילות״ באקסון וגם המשאבה, שצורכת עד 40% מהאנרגיה, תלויות בו."}]},"h6":{"t":"t3","v":[{"q":"חולה מאבד תחושה ביד בגלל עצב שנחתך באמה. חולה אחר מאבד תפקוד בגלל פגיעה בחוט השדרה. למי יש סיכוי טוב יותר שהאקסון יצמח מחדש, ולמה?","a":"לראשון: ב־PNS תאי שוואן מנחים צמיחה, ב־CNS נוצרת צלקת","w":["לשני, כי ב־CNS יש יותר תאי תמך שמזינים את הנוירונים","לשניהם באותה מידה, כי כל נוירון יכול לצמוח מחדש","לאף אחד, כי נוירונים לא צומחים מחדש בשום מקום בגוף"],"e":"עצב באמה שייך ל־PNS: תאי שוואן יוצרים ״צינור״ והאקסון צומח 3–4 מ״מ ביום. במוח ובחוט השדרה האסטרוציטים יוצרים צלקת."}]},"h7":{"t":"t3","v":[{"q":"למטופלת יש תסמינים שמופיעים ונעלמים: ראייה מטושטשת, חולשה ברגל ובעיות שיווי משקל. מתברר שהמיילין נפגע רק במוח ובחוט השדרה. איזה תא כנראה מותקף?","a":"אוליגודנדרוציט, שמייצר מיילין ב־CNS","w":["תא שוואן, שמייצר מיילין ב־PNS בלבד","אסטרוציט, שיוצר רקמת צלקת ב־CNS","מיקרוגלייה, שמפנה פסולת ודלקת ב־CNS"],"e":"זו טרשת נפוצה: מערכת החיסון תוקפת מיילין של אוליגודנדרוציטים, ולכן הפגיעה מוגבלת למוח ולחוט השדרה."}]},"h8":{"t":"t3","v":[{"q":"חברת תרופות פיתחה תרופה טובה לפרקינסון, אבל היא לא משפיעה כשנותנים אותה בכדור. מה ההסבר הסביר ביותר?","a":"היא לא עוברת את מחסום הדם־מוח, ולכן לא מגיעה לנוירונים","w":["האסטרוציטים מפרקים אותה ללקטט לפני שהיא מגיעה לנוירונים","תאי שוואן עוטפים את הנוירונים ומונעים ממנה להגיע אליהם","המיקרוגלייה מזהה אותה כזיהום ויוצרת נגדה צלקת במוח"],"e":"הספר מציין שחציית מחסום הדם־מוח היא מכשול עיקרי בפיתוח תרופות לאלצהיימר ופרקינסון."},{"q":"אכלת אוכל מקולקל ואחרי שעה את מקיאה. איזה מבנה במוח ״זיהה״ את הרעל בדם?","a":"האזור הפוסט־רמה, שבו מחסום הדם־מוח חלש בכוונה","w":["הגומה המרכזית, שבה הנוירונים צמודים לכלי הדם","האסטרוציטים בכל המוח, שבודקים כל חומר שעובר","בולבוס הריח, שמזהה רעלים באוכל לפני הבליעה"],"e":"באזור הפוסט־רמה המחסום חדיר יותר, כך שהנוירונים שם ״דוגמים״ את הדם ומפעילים הקאה כשהם מזהים רעל."}]},"h9":{"t":"t4","v":[{"q":"בנוירון במנוחה, שני הכוחות דוחפים את הנתרן פנימה. למה בכל זאת הפנים נשאר שלילי?","a":"הממברנה כמעט לא חדירה לנתרן, והמשאבה מוציאה את מה שנכנס","w":["הלחץ האלקטרוסטטי דוחה את הנתרן החוצה מהתא כל הזמן","החלבונים בפנים קושרים את הנתרן כך שאינו משנה את המתח","האשלגן נכנס בכמות שווה ומנטרל את הנתרן שנכנס"],"e":"הנתרן ״מחכה״ בחוץ. מה שמחזיק אותו שם הוא חדירות נמוכה ומשאבת נתרן־אשלגן (3 החוצה, 2 פנימה), לא הכוח החשמלי."},{"q":"חוסמים בניסוי את משאבת הנתרן־אשלגן לזמן ארוך. מה יקרה בהדרגה לפוטנציאל המנוחה?","a":"נתרן יצטבר בפנים, והפנים יהיה פחות שלילי","w":["אשלגן יצטבר בחוץ, והפנים יהיה שלילי יותר","שום דבר, כי הכוחות הטבעיים שומרים על האיזון","הכלור ייצא מהתא, והפנים יהיה שלילי יותר"],"e":"בלי המשאבה, הנתרן שמחלחל פנימה לא מוצא החוצה. המטען החיובי מצטבר והמתח מתקרב לאפס."}]},"h10":{"t":"t4","v":[{"q":"יון הכלור נמצא בעיקר מחוץ לתא. הדיפוזיה דוחפת אותו פנימה. מה מאזן אותה?","a":"הלחץ האלקטרוסטטי: הפנים השלילי דוחה אותו החוצה","w":["משאבת הנתרן־אשלגן, שמוציאה גם כלור החוצה מהתא","הממברנה, שאינה חדירה ליוני כלור בכלל במנוחה","הלחץ האלקטרוסטטי: הפנים השלילי מושך אותו פנימה"],"e":"כלור שלילי, והפנים שלילי. מטענים זהים נדחים, ולכן הכוח החשמלי מאזן את הדיפוזיה."}]},"h11":{"t":"t5","v":[{"q":"באור נר חלש אקסון בעין יורה 10 פעמים ביחידת זמן, ובאור חזק 100 פעמים. מה נשאר זהה בשני המצבים?","a":"הגודל של כל ירייה, לפי חוק הכול או לא־כלום","w":["קצב הירי, כי עוצמת האור מקודדת בגודל הירייה","משך התקופה הרפרקטורית, שמתקצר באור חזק","מספר תעלות הנתרן שנפתחות בכל ירייה"],"e":"לפי חוק התדר העוצמה מקודדת בקצב, ולפי חוק הכול או לא־כלום כל ירייה בדיוק באותו גודל."},{"q":"הספר משווה את חוק התדר למחיאות כפיים בסוף הופעה. מה מקביל ל״פוטנציאל פעולה״ בדימוי הזה?","a":"מחיאה אחת, שתמיד באותה עוצמה","w":["העוצמה של כל מחיאה, שמשתנה לפי ההתלהבות","הקצב של המחיאות, שתמיד נשאר קבוע","הזמן הכולל של המחיאות, שמשתנה לפי הקהל"],"e":"כל מחיאה זהה, כמו כל פוטנציאל פעולה. ההתלהבות מועברת דרך הקצב, כמו עוצמת הגירוי בתדר הירי."}]},"h12":{"t":"t5","v":[{"q":"מגרים אקסון באמצע שלו. פוטנציאל הפעולה יכול להתחיל לשני הכיוונים, אבל בדרך הטבעית הוא מתקדם רק לכיוון הכפתורים. למה?","a":"תעלות הנתרן שמאחוריו בתקופה רפרקטורית ולא נפתחות שוב","w":["המיילין מאחוריו חוסם את מעבר הזרם החשמלי","תעלות האשלגן מאחוריו מוציאות את כל המטען החיובי","הכפתורים הסופיים מושכים את הזרם אליהם בכוח חשמלי"],"e":"בקטע שהאות עבר בו עכשיו, תעלות הנתרן מנוטרלות לרגע, ולכן הוא יכול להתקדם רק קדימה."}]},"h13":{"t":"t5","v":[{"q":"באקסון עם מיילין, מה קורה לאות בין מרווח ראנווייה אחד לבא?","a":"הוא עובר באופן פסיבי ונחלש מעט, ומתחדש במרווח הבא","w":["הוא נוצר מחדש בכל נקודה לאורך האקסון באופן אקטיבי","הוא עובר בלי להיחלש בכלל, כי המיילין מבודד לגמרי","הוא נעצר במיילין ומחכה לסידן שיעביר אותו הלאה"],"e":"מתחת למיילין יש הולכה פסיבית ודועכת. במרווח, שם יש תעלות נתרן, פוטנציאל הפעולה מתחדש באופן אקטיבי. ביחד: הולכה בקפיצות."},{"q":"אקסון של חתול עם מיילין בקוטר 6 מיקרומטר מוליך באותה מהירות כמו אקסון ענק של דיונון בלי מיילין, בקוטר 500 מיקרומטר. מה זה מראה?","a":"המיילין מאיץ את ההולכה בלי צורך באקסון עבה, וחוסך מקום ואנרגיה","w":["דיונונים זקוקים למהירות נמוכה יותר מיונקים ולכן אין להם מיילין","קוטר האקסון לא משפיע על המהירות בכלל, רק סוג בעל החיים","המיילין מאט את ההולכה, והקוטר הקטן מפצה על כך בחתול"],"e":"לפי הספר, הולכה בקפיצות מהירה וחסכונית. נתרן נכנס רק במרווחים, ולכן המשאבה צריכה לעבוד פחות."}]},"h14":{"t":"t6","v":[{"q":"חוסמים בניסוי את תעלות הסידן בכפתור הסופי. פוטנציאל פעולה מגיע לקצה האקסון. מה יקרה?","a":"הנוירוטרנסמיטר לא ישוחרר, והמסר לא יעבור לתא הבא","w":["פוטנציאל הפעולה לא יגיע לכפתור, כי הוא תלוי בסידן","הנוירוטרנסמיטר ישוחרר כרגיל, אבל לא ייקשר לקולטנים","התא הבא יירה בכל זאת, כי הוא מקבל את האות החשמלי"],"e":"כניסת סידן היא מה שגורם לשלפוחיות להתמזג עם הממברנה ולשפוך את הנוירוטרנסמיטר. בלי סידן אין שחרור."}]},"h15":{"t":"t6","v":[{"q":"נוירוטרנסמיטר אחד גורם לתגובה מהירה וקצרה בתא הבא, ואחר לתגובה איטית שנמשכת זמן רב. מה כנראה ההבדל בקולטנים?","a":"הראשון יונוטרופי (הקולטן הוא תעלה), השני מטבוטרופי (חלבון G)","w":["הראשון מטבוטרופי (הקולטן הוא תעלה), השני יונוטרופי (חלבון G)","הראשון אוטורצפטור על התא השולח, השני קולטן פוסט־סינפטי","הראשון מעורר (EPSP), השני מעכב (IPSP), ולכן הוא ארוך יותר"],"e":"בקולטן יונוטרופי הקולטן עצמו נפתח, ולכן התגובה מהירה. מטבוטרופי מפעיל שרשרת בתוך התא, איטית יותר אבל ארוכה ורחבה."}]},"h16":{"t":"t7","v":[{"q":"קתרין קיבלה זריקה שחוסמת את האנזים AChE, והכוח שלה חזר. איך פעלה התרופה?","a":"ה־ACh לא פורק, נשאר במרווח והפעיל את הקולטנים שנותרו","w":["התרופה בנתה מחדש את קולטני ה־ACh שמערכת החיסון הרסה","התרופה גרמה לנוירון המוטורי לשחרר יותר ACh בכל ירייה","התרופה חסמה את מערכת החיסון ועצרה את המחלה לגמרי"],"e":"הקולטנים עדיין חסרים, אבל עודף ה־ACh ״מציף״ את המעטים שנשארו. זו לא תרופה מרפאת: המחלה חשוכת מרפא."},{"q":"באיזה מובן התרופה שקיבלה קתרין היא אגוניסט של אצטילכולין?","a":"היא מגבירה את השפעת ה־ACh, כי היא מונעת את הפירוק שלו","w":["היא חוסמת את קולטני ה־ACh, ולכן מחלישה את השפעתו","היא נקשרת לקולטני ה־ACh במקומו ומפעילה אותם במקומו","היא מפחיתה את כמות ה־ACh, ולכן מאזנת את המערכת"],"e":"אגוניסט = מגביר או מחקה את פעולת הנוירוטרנסמיטר. אנטגוניסט = חוסם או מחליש. מניעת הפירוק מגבירה את ההשפעה."}]},"h17":{"t":"t7","v":[{"q":"נוירון מקבל EPSP מ־5 סינפסות שונות בו־זמנית, והוא יורה. איזה סוג של סכימה זו?","a":"סכימה במרחב: כמה תאים שונים שולחים מסרים בבת אחת","w":["סכימה בזמן: כמה תאים שונים שולחים מסרים בבת אחת","סכימה במרחב: תא אחד שולח הרבה מסרים ברצף מהיר","סכימה בזמן: תא אחד שולח מסר אחד חזק במיוחד"],"e":"במרחב = מכמה תאים בו־זמנית. בזמן = מאותו תא, שיורה כמה פעמים ברצף מהיר והמסרים מצטברים."},{"q":"נוירון פרה־סינפטי אחד יורה הרבה פעמים ברצף מהיר. כל EPSP מגיע לפני שהקודם נעלם, והתא הבא יורה. איך נקרא התהליך?","a":"סכימה בזמן: המסרים מאותו תא מצטברים לאורך זמן קצר","w":["סכימה במרחב: המסרים מאותו תא מגיעים לנקודות שונות","חוק התדר: התא הבא יורה באותו קצב כמו התא הראשון","הולכה בקפיצות: המסר קופץ ממרווח למרווח בדנדריט"],"e":"סכימה בזמן = הצטברות של מסרים מאותו תא, כשהם מגיעים מהר אחד אחרי השני."}]},"h18":{"t":"t7","v":[{"q":"בזמן חלום, נוירונים מעכבים במוח מונעים מאיתנו לקום ולבצע את החלום. מה יקרה אם נעכב את הנוירונים המעכבים האלה?","a":"התנועה תשתחרר, והאדם עלול ״לבצע״ את החלום","w":["התנועה תיעצר עוד יותר, כי עיכוב תמיד מדכא התנהגות","החלום ייפסק, כי עיכוב של המוח מעיר את האדם","לא יקרה כלום, כי עיכוב עצבי אינו משפיע על התנהגות"],"e":"עיכוב עצבי ≠ עיכוב התנהגותי. כשמעכבים נוירון שבולם התנהגות, ההתנהגות משתחררת. הספר מזכיר אנשים שהנוירונים האלה נהרסו אצלם."}]},"h19":{"t":"t7","v":[{"q":"נוירון מוטורי מקבל באותו רגע EPSP חזקים מכאב ו־IPSP חזקים מהמוח. מה יקבע אם הוא יירה?","a":"הסכום של כל המסרים בתלולית האקסון, ביחס לסף העירור","w":["המסר שהגיע ראשון, כי הוא חוסם את המסרים שאחריו","המסר המעורר, כי EPSP תמיד חזק יותר מ־IPSP","המסר המעכב, כי עיכוב תמיד גובר על עירור"],"e":"זו אינטגרציה עצבית: תלולית האקסון ״סופרת״ את כל העירור והעיכוב. אם הסכום מגיע לסף, האקסון יורה."}]},"h20":{"t":"t8","v":[{"q":"נוירון משחרר הרבה מאוד נוירוטרנסמיטר, ואחרי זמן קצר הוא מתחיל לשחרר פחות, בלי שום השפעה מתאים אחרים. איזה מנגנון פועל?","a":"אוטורצפטורים על התא עצמו, שמזהים עודף ומפחיתים","w":["קולטנים פוסט־סינפטיים, שמחזירים חומר לתא השולח","סינפסה אקסו־אקסונית, שמעכבת את השחרור מבחוץ","תאי שוואן, שסופגים את העודף ומאותתים לתא"],"e":"אוטורצפטור נמצא על התא השולח, מגיב לחומר שלו, והוא מטבוטרופי ובדרך כלל מעכב. זה מנגנון ויסות עצמי."}]},"h21":{"t":"t8","v":[{"q":"כפתור סופי של נוירון A יוצר סינפסה על הכפתור הסופי של נוירון B, ומפחית את כמות החומר ש־B משחרר. איך נקרא זה, והאם זה חלק מהאינטגרציה?","a":"עיכוב פרה־סינפטי באקסו־אקסונית; לא חלק מהאינטגרציה","w":["IPSP בסינפסה אקסו־דנדריטית, והוא חלק מרכזי מהאינטגרציה","אוטורצפטור על נוירון B, והוא חלק מהאינטגרציה של B","זירוז פרה־סינפטי בצומת מעבר, והוא חלק מהאינטגרציה"],"e":"סינפסה אקסו־אקסונית לא תורמת לסכימה של EPSP ו־IPSP. היא משנה את כמות הנוירוטרנסמיטר שהכפתור השני ישחרר."}]},"h22":{"t":"t8","v":[{"q":"הורמון מין חודר לתוך התא ומשנה אילו חלבונים התא מייצר. הורמון אחר נשאר בחוץ ומפעיל קולטן בממברנה. מה ההבדל?","a":"הראשון סטרואידי, נקשר לקולטן בגרעין; השני פפטידי","w":["הראשון פפטידי, נקשר לקולטן בגרעין; השני סטרואידי","הראשון נוירומודולטור שמתפזר; השני נוירוטרנסמיטר רגיל","הראשון מגיע בסינפסה; השני מגיע בדם לכל הגוף"],"e":"הורמונים סטרואידים (מכולסטרול, מסיסים בשומן) עוברים את הממברנה ונקשרים בגרעין. פפטידים פועלים על קולטנים בממברנה."}]}};
const K={"t1:0": [{"q": "נוגעים בסיר חם. העצב שמעביר את תחושת החום מהאצבע, ומוח השדרה שמחליט למשוך את היד: לאיזו מערכת שייך כל אחד?", "a": "העצב: היקפית (PNS). מוח השדרה: מרכזית (CNS)", "w": ["העצב: מרכזית (CNS). מוח השדרה: היקפית (PNS)", "שניהם שייכים למערכת העצבים ההיקפית (PNS)", "שניהם שייכים למערכת העצבים המרכזית (CNS)"], "e": "ה־CNS הוא המוח ומוח השדרה, בתוך הגולגולת ועמוד השדרה. העצבים ורוב איברי החוש שמחוץ להם הם ה־PNS."}, {"q": "קתרין התעייפה וכוחה חזר דקות אחרי זריקה. מה הבעיה הבסיסית במחלה שלה לפי הדף?", "a": "מערכת החיסון תוקפת חלבונים שקולטים מסרים בתאים", "w": ["מערכת החיסון תוקפת את המיילין של האוליגו־דנדרוציטים", "השרירים שלה לא מייצרים מספיק אנרגיה מהמזון", "הנוירונים המוטוריים שלה לא יוצרים פוטנציאל פעולה"], "e": "חולשת שרירים חמורה היא מחלה אוטואימונית: מערכת החיסון תוקפת חלבונים שמאפשרים לתאים לקבל מסרים."}], "t1:1": [{"q": "נוירון מסוים לא קולט מידע מהגוף ולא מפעיל שריר, אלא מחבר בין נוירונים במוח. מהו?", "a": "אינטרנוירון, שנמצא כולו בתוך ה־CNS", "w": ["נוירון סנסורי, שמדווח ל־CNS על שינויים", "נוירון מוטורי, ששולט בשרירים ובבלוטות", "נוירון חד־קוטבי, שמעביר מגע וטמפרטורה"], "e": "אינטרנוירון הוא ״מתווך״ שנמצא כולו ב־CNS, בין הסנסורי למוטורי, ומעבד את המידע ביניהם."}, {"q": "מה מאפשר תפיסה, למידה וזיכרון שמשלבים מידע מאזורי מוח שונים?", "a": "אינטרנוירונים של ממסר, שמקשרים בין אזורים", "w": ["אינטרנוירונים מקומיים, שמעבדים פיסות מידע קטנות", "נוירונים סנסוריים, שמגלים שינויים בסביבה הפנימית", "נוירונים מוטוריים, שמפעילים בלוטות ושרירים רבים"], "e": "אינטרנוירונים מקומיים יוצרים מעגלים עם נוירונים סמוכים. אינטרנוירונים של ממסר מקשרים בין מעגלים באזורי מוח שונים."}], "t1:2": [{"q": "באיזה סדר עובר מסר בתוך נוירון אחד?", "a": "דנדריטים וגוף התא, אקסון, ואז כפתורים סופיים", "w": ["כפתורים סופיים, אקסון, ואז דנדריטים וגוף התא", "אקסון, דנדריטים, גוף התא, ואז כפתורים סופיים", "גוף התא, כפתורים סופיים, ואז אקסון ודנדריטים"], "e": "הדנדריטים קולטים, גוף התא מעבד, האקסון מוביל את פוטנציאל הפעולה, והכפתורים פולטים נוירוטרנסמיטר."}, {"q": "אקסון מתפצל לשני
