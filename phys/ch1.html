<style>

}

:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}

p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}

.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}

figure{margin:0}

.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}

.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}

.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}

.opt:hover:not([disabled]){border-color:var(--c)}

.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}

.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}

.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}

.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}

.card.sum table{border-collapse:collapse;width:100%;font-size:.92rem;margin:6px 0}
.card.sum th,.card.sum td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
.card.sum th{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.card.sum .tw{overflow-x:auto}

}

  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"brain",title:"מהו מדע העצב וההתנהגות",blocks:[
  {h:"ג'רמייה: המוח הבוגר משתנה",html:`${def("על מה הנושא",`הפרק פותח בשאלה מה התחום חוקר ואיך הוא מסביר התנהגות. נתחיל בסיפור שמראה שגם מוח בוגר יכול להשתנות.<br><b>מה נלמד כאן:</b> פלסטיות · נוירוגנזה · הכללה והעמדה`)}${def("תיאור מקרה",`ג'רמייה, עורך דין בן 53, לקה ב<b>שבץ</b> ${E("stroke")} בגיל 7, כשאספקת הדם לחלק השמאלי של מוחו נפסקה. הוא איבד תחושה בצד <b>ימין</b> של הגוף, וגם ארבעים שנה אחר כך נפל בערך 150 פעמים בשנה.`)}${def("הטיפול",`<mark>תנועה מאולצת</mark> ${E("constraint-induced [CI] movement therapy")}: הרעיון הוא שהשיתוק אחרי שבץ נובע גם מ<b>היעדר שימוש</b> באיבר, ומכך שפחות תאי מוח מוקדשים להנעתו. שמו לו כפפה על היד <b>השמאלית</b> הבריאה, והוא תרגל שעות ביום עם היד הפגועה: הרים עפרונות, בנה בקוביות ותלה אטבים. אחרי שבועיים של תרגול היד ושלושה של הרגל, שיווי המשקל השתפר והוא כתב את שמו ביד ימין.`)}${def("מושגי מפתח",`<mark>פלסטיות</mark> (גמישות) היא היכולת של המוח להשתנות עם הזמן ("חיווט מחדש"). <mark>נוירוגנזה</mark> ${E("neurogenesis")} היא יצירת נוירונים חדשים מחלוקה של תאי גזע עצביים. היא מתרחשת ב<b>היפוקמפוס</b> וב<b>בולבוס ההרחה</b> וממלאת תפקיד בלמידה.`)}${rem("עד תחילת המאה ה־21 רוב החוקרים חשבו שהמוח הבוגר <b>לא משתנה</b>. החלוצים שטענו אחרת ספגו ביקורת, וההכרה הגיעה רק כשהראיות הצטברו.")}`,q:"q1"},
  {h:"תפקיד המוח: לשלוט בתנועה",html:`<p>בעבר נקרא התחום <b>פסיכולוגיה פיזיולוגית</b>. ספר הלימוד הראשון בפסיכולוגיה, של <b>וילהלם וונדט</b> בסוף המאה ה־19, נקרא ״עקרונות הפסיכולוגיה הפיזיולוגית״. התחום נוצר כשחוקרים איחדו את שיטות הניסוי של הפסיכולוגיה עם אלה של הפיזיולוגיה.</p>${def("הייעוד הראשון של מערכת העצבים",`סטודנטים עונים בדרך כלל שהמוח נועד ״לחשוב״ או ״לזכור״. הספר טוען שהייעוד הראשון הוא <b>לשלוט בתנועות</b>, וזה כולל דיבור. תפיסה נועדה לספק מידע כדי שההתנהגות תתאים לצרכים: <b>תפיסה שאין עמה יכולת פעולה אין בה תועלת</b>.`)}${rem("גם חשיבה וזיכרון התפתחו כי הם עזרו לאבותינו <b>לפעול</b> טוב יותר: לבצע התנהגויות מורכבות וללמוד מהניסיון. זה שאפשר ליהנות משקיעה בלי לעשות דבר לא סותר את זה.")}${tiles([["hand","תנועה","כולל דיבור ותקשורת"],["bulb","תפיסה","מידע על הסביבה כדי לפעול"],["brain","חשיבה וזיכרון","כלים להתנהגות מועילה"]])}`,q:"q3"},
  {h:"הכללה והעמדה",html:`${def("שני סוגי הסבר",`<mark>הכללה</mark> ${E("generalization")}: מסקנה כללית על סמך תצפיות רבות בתופעות דומות. <mark>העמדה</mark> ${E("reduction")}: הסבר של תופעה מורכבת באמצעות התהליכים הבסיסיים יותר שעומדים ביסודה. מדעני העצב מנסים בעיקר להעמיד: להסביר התנהגות במונחי מנגנונים פיזיולוגיים.`)}${ex(`<b>עכברים בונים קן</b> בשני מצבים: כשקר, וכשהעכברה הרה (גם בלי קשר לטמפרטורה). זו אותה התנהגות, ואותם מנגנונים מפעילים את התנועות. אבל מה שמפעיל אותם שונה: חלק מוח אחד מקבל מידע מחיישני טמפרטורה, וחלק אחר מושפע מהורמוני ההיריון.`)}${def("כשהפיזיולוגיה מרמזת על הפסיכולוגיה",`נזק לאזור שמנתח הגאי דיבור פוגע גם ב<b>כתיב</b>, ולכן זיהוי מילה מדוברת ואיות שלה נשענים על מנגנונים קרובים. נזק במקום אחר פוגע בקריאה בקול של מילים <b>לא מוכרות</b>, אבל לא של מילים מוכרות. מכאן שיש שני מסלולים לקריאה: דרך ההגאים, ודרך זיהוי חזותי של המילה השלמה.`)}${rem("בפועל משתמשים <b>בשתי צורות ההסבר</b>. רעיונות למחקרים באים גם מהכללות על התנהגות וגם מניתוח מנגנונים, ולכן צריך להבין גם פסיכולוגיה וגם פיזיולוגיה.")}`,q:"q5"}
 ]},
 {id:"t2",icon:"scales",title:"הגוף והנפש: מהעת העתיקה עד דקארט",blocks:[
  {h:"דואליזם ומוניזם",html:`${def("שאלת הגוף והנפש",`יש לנו גוף עם שרירים ואיברי חוש, ומערכת עצבים שמקבלת מידע ושולטת בתנועה. מה תפקיד ה<b>נפש</b>? האם היא שולטת במערכת העצבים, היא חלק ממנה, או שהיא רוח בלתי נראית?`)}${tiles([["copies","דואליזם","הגוף גשמי, הנפש לא. שתי ישויות נפרדות"],["brain","מוניזם","הכול חומר ואנרגיה. הנפש נוצרת מפעולת מערכת העצבים"]])}${rem("מדעני העצב נוקטים גישה <b>אמפירית, מעשית ומוניסטית</b>. ההנחה: אם נבין איך פועלת מערכת העצבים, נוכל להסביר תפיסה, חשיבה, זיכרון ואפילו מודעות עצמית. מחשבה לבדה לא פתרה את השאלה מאות שנים.")}${fig("timeline")}${def("העת העתיקה",`פפירוס מכ־1700 לפני הספירה מתאר ניתוח של פגועי ראש ואת המוח, נוזל המוח והשדרה והקרומים. תרבויות רבות (מצרים, הודו, סין, יוון) ראו ב<b>לב</b> את מקום המחשבות והרגשות, כי הוא חיוני לחיים ומאיץ ברגש. <b>היפוקרטס</b> ייחס את התפקיד ל<b>מוח</b>. <b>אריסטו</b> חשב שהמוח רק מרסן את ״תאוות הלב״. <b>גאלן</b> לעג לו: אילו כך היה, הטבע לא היה מציב את המוח רחוק מהלב ומחבר אליו את עצבי החישה.`)}`,q:"q7"},
  {h:"דקארט וגלוואני",html:`${who("ד","רנה דקארט","המאה ה־17",`אבי הפילוסופיה המודרנית. ראה בחיות ובגוף האדם <b>מכונות</b>. תנועות אוטומטיות כמו משיכת יד מחום קרא <mark>רפלקסים</mark> ${E("reflex")}: תנועה אוטומטית וסטריאוטיפית בתגובה ישירה לגירוי.`)}${def("החוליה המקשרת",`דקארט היה <b>דואליסט</b>, אבל הראשון שטען שיש קשר בין הנפש למוח. לדעתו המגע מתרחש ב<b>בלוטת האצטרובל</b> ${E("pineal body")}. בחדרי המוח יש נוזל בלחץ, והנפש מטה את הבלוטה כמו ידית ושולחת את הנוזל דרך העצבים, והשרירים ״מתנפחים״ וזזים.`)}${def("מודל",`ההשראה הגיעה מפסלים מתנועעים בגנים המלכותיים ליד פריז, שזזו כשמבקרים דרכו על אריחים נסתרים. <mark>מודל</mark> ${E("model")} הוא מערכת פשוטה יחסית שפועלת לפי עקרונות ידועים ומבצעת חלק ממה שהמערכת המורכבת עושה. בהמשך שימשו כמודלים לוחות מתגים ומחשבים.`)}${rem("היתרון של המודל של דקארט: אפשר היה <b>לבדוק אותו בניסוי</b>, ולכן גם להפריך אותו. <b>לואיג'י גלוואני</b> (המאה ה־18) גירה בחשמל עצב של צפרדע והשריר התכווץ, <b>גם כשהיו מנותקים מהגוף</b>. כלומר, היכולת לזוז נמצאת ברקמה עצמה, ולא בנוזל שהמוח מזרים.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"split",title:"המוח החצוי והמודעות",blocks:[
  {h:"ניתוח חציית המוח",html:`${def("כפיס המוח",`<mark>כפיס המוח</mark> ${E("corpus callosum")} הוא אלומה גדולה של סיבי עצב שמחברת חלקים מקבילים בשתי ה<b>המיספרות</b> ${E("cerebral hemispheres")}. כל המיספרה מקבלת מידע מהצד <b>הנגדי</b> של הגוף ושולטת בו.`)}${def("למה חותכים אותו",`אצל חולים עם <b>אפילפסיה</b> קשה שתרופות לא עוזרות להם, פעילות יתר בצד אחד עוברת דרך הכפיס לצד השני, ושני הצדדים מגרים זה את זה עד התקף מקיף. <mark>ניתוח חציית המוח</mark> ${E("split-brain operation")} חותך את הכפיס ומפחית מאוד את ההתקפים.`)}${def("מה מגלים",`ספרי וגזאניגה חקרו את המנותחים. ברוב האנשים רק ההמיספרה <b>השמאלית</b> שולטת בדיבור. הימנית מבינה דיבור במידה סבירה, אבל <b>לא מדברת</b>. מי שמשוחח עם המנותח מדבר בעצם רק עם ההמיספרה השמאלית.`)}${ex(`מנותחים מספרים שליד <b>שמאל</b> יש ״רצון משלה״: היא מניחה ספר מעניין שהם קוראים, כי ההמיספרה הימנית ששולטת בה לא יודעת לקרוא ומשתעממת. מתואר גם גבר שניסה להכות את אשתו ביד אחת ולהגן עליה ביד האחרת.`)}`,q:"q11"},
  {h:"ניסוי הריח ומשמעותו",html:`${def("ריח הוא יוצא דופן",`בשאר החושים המידע מוצלב, אבל בריח <b>אין הצלבה</b>: נחיר שמאל מגיע להמיספרה השמאלית, ונחיר ימין לימנית.`)}${fig("split","הריח מגיע רק להמיספרה הימנית, ולכן ההמיספרה המדברת לא יודעת עליו")}${ex(`סותמים את הנחיר השמאלי ומגישים ריח לנחיר הימני. המנותח <b>אומר שלא הריח דבר</b>. אבל כשמבקשים ממנו לבחור ביד <b>שמאל</b> חפץ מוסתר, הוא בוחר נכון: פרח פלסטיק לריח פרחים, דג צעצוע לריח דגים, עץ קטן לריח אורן. ביד ימין הוא נכשל, כי היא מחוברת להמיספרה השמאלית שלא הריחה.`)}${rem(`המסקנה: דבר מגיע ל<b>מודעות</b> ${E("consciousness")} רק אם המידע עליו מגיע לאזורי הדיבור בהמיספרה השמאלית. מחקרי המוח החצוי הם דוגמה לגישה ה<b>מוניסטית</b>: ניתוק פיזי בין חלקי מוח מנתק גם את המודעות.`)}`,q:"q13"}
 ]},
 {id:"t4",icon:"flask",title:"מהמאה ה־19 עד היום",blocks:[
  {h:"מילר, פלורנס וברוקה",html:`${who("מ","יוהאנס מילר","המאה ה־19",`תמך בניסויים במקום תצפית ומיון בלבד. ניסח את <mark>הדוקטרינה של אנרגיות עצביות ספציפיות</mark> ${E("specific nerve energies")}: כל העצבים מעבירים <b>אותו סוג</b> של שדר חשמלי, וההבדל בתחושה נקבע לפי <b>העצב שפעיל</b> ואזור המוח שמקבל ממנו. לכן שפשוף עיניים גורם ״לראות״ ניצוצות.`)}${rem("המסקנה מהדוקטרינה: המוח <b>מחולק לפי תפקידים</b>. זה פתח את הדרך לניסויים במוח עצמו.")}${who("פ","פייר פלורנס","המאה ה־19",`הסיר אזורים במוחות של חיות ובדק מה הן כבר לא יכולות לעשות. זו <mark>כריתה ניסויית</mark> ${E("experimental ablation")}. כך מצא אזורים לקצב הלב והנשימה, לתנועה רצונית ולרפלקסים חזותיים ושמיעתיים.`)}${who("ב","פול ברוקה","1861",`יישם את הרעיון באדם, בלי להסיר דבר: נתח אחרי המוות את מוחו של אדם שאיבד את הדיבור משבץ, ומצא נזק באזור בקורטקס ה<b>שמאלי</b> (אזור ברוקה). היום יודעים שהדיבור נשען על אזורים רבים.`)}`,q:"q15"},
  {h:"גירוי חשמלי, מהירות ונוירונים",html:`${tiles([["target","פריץ' והיציג (1870)","גירוי חשמלי בקורטקס של כלב הזיז שרירים בצד הנגדי: הקורטקס המוטורי הראשוני"],["clock","הלמהולץ","מדד לראשונה מהירות הולכה עצבית: כ־30 מטר בשנייה, לא מהירות האור"],["hand","פורקינייה","תאי פורקינייה במוחון, סיבי פורקינייה בלב, ייחודיות טביעות אצבע"],["link","רמון אי קחל","מערכת העצבים בנויה מנוירונים נפרדים, ולא מרשת רציפה אחת. נובל 1906"]])}${rem("הממצא של הלמהולץ חשוב: אם ההולכה איטית בהרבה מחשמל בכבל, היא <b>מורכבת יותר משדר חשמלי פשוט</b> (פרק 2). הלמהולץ גם המציא את האופתלמוסקופ וניסח את חוק שימור האנרגיה.")}${def("אזור ברוקה והקורטקס המוטורי",`האזור שברוקה מצא מקושר לחלק בקורטקס המוטורי הראשוני ששולט בשפתיים, בלשון ובגרון, כלומר בשרירי הדיבור.`)}`,q:"q17"},
  {h:"המאה ה־20 וה־21",html:`<p>במאה ה־20 פותחו מגברים רגישים לאותות חלשים, שיטות נוירוכימיות ושיטות היסטולוגיות, והתגלו המסרים החשמליים והכימיים בין נוירונים, נוירוני המראה וטיפולים לדיכאון ולסכיזופרניה.</p>${tiles([["target","נובל 2014","אוקיף ובני הזוג מוזר: מערכות האיכון המרחבי, ״ה־GPS של המוח״"],["bulb","אופטוגנטיקה","הפעלת נוירונים מסוימים באמצעות אור"],["gear","TMS","גרייה מגנטית חוצת גולגולת לדיכאון ולפרקינסון"],["people","מיזמי ענק","Human Brain Project האירופי ו־BRAIN האמריקני"]])}${def("זוכי נובל לדוגמה",`1906: גולג'י ורמון אי קחל (מבנה מערכת העצבים). 1963: אקלס, הודג'קין והאקסלי (מנגנונים יוניים של ממברנות). 1970: אקסלרוד, כץ ופון אולר (נוירוטרנסמיטרים). 1981: יובל, וייזל וספרי. 2000: קרלסון, גרינגרד וקנדל (תקשורת עצבית).`)}${rem("העמותה למדע העצב (SfN) נוסדה ב־1969 עם 500 חברים, והיום יש בה כ־40,000 חוקרים מיותר מ־90 מדינות. השורשים והעתיד של התחום הם <b>שיתוף פעולה בין־תחומי</b>.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"sprout",title:"ברירה טבעית ואבולוציה של מוחות גדולים",blocks:[
  {h:"פונקציונליזם וברירה טבעית",html:`${def("פונקציונליזם",`<mark>פונקציונליזם</mark> ${E("functionalism")}: הדרך הטובה להבין תופעה ביולוגית היא לשאול <b>איזו תועלת</b> היא מביאה לאורגניזם. למנגנונים אין ״מטרה״ (הם עוצבו ברצף אירועים מקריים, לא בידי מתכנן), אבל יש להם <b>תפקידים</b>.`)}${rem("ההתנהגות עצמה לא עוברת בתורשה. מה שעובר הוא ה־DNA שבונה את <b>המוח</b> שמחולל אותה.")}${def("ברירה טבעית",`<mark>ברירה טבעית</mark> ${E("natural selection")}: תכונות תורשתיות שמעניקות <mark>יתרון בררני</mark> ${E("selective advantage")}, כלומר מגדילות את מספר הצאצאים מעל הממוצע, נעשות שכיחות יותר באוכלוסייה. דרווין נעזר בדוגמה של מגדלים שיצרו זנים בברירה מלאכותית.`)}${def("מוטציות",`<mark>מוטציה</mark> ${E("mutation")} היא שינוי אקראי בכרומוזומים. אם היא בתא זרע או ביצה, היא עוברת לצאצאים. רוב המוטציות לא משפיעות, חלקן מזיקות ומעטות מועילות. דוגמה: מוטציה שגורמת לחיה קטנה <b>לקפוא</b> מול גירוי חדש עוזרת לה להתחמק מטורף.`)}${ex(`אצל <b>ציפורי שיר</b> לזכרים יש אזורי מוח מפותחים ללמידת שירה, שאין לציפורים שלא שרות. במינים שבהם רק הזכר שר האזורים גדולים יותר אצל הזכר, ובמינים ששרים בדואט אין הבדל.`)}`,q:"q21"},
  {h:"מהפרימטים להומו ספיינס",html:`<p><mark>אבולוציה</mark> ${E("evolution")} היא שינוי הדרגתי במבנה ובפיזיולוגיה של מינים בעקבות ברירה טבעית.</p>${tiles([["leaf","פרימטים ראשונים","קטנים, ביערות טרופיים; ידיים אוחזות ועיניים לחזית"],["bulb","ראיית צבעים","להבחין בפרי בשל מול עלווה ירוקה"],["people","הומינידים","באפריקה, ביערות יבשים ובסוואנה: כלים, אש, ביות כלבים ושפה"]])}${def("התאריכים",`הומו ארקטוס יצא מאפריקה לפני כ־<b>1.7 מיליון</b> שנה. הנאנדרתלים חיו באירופה לפני 120,000 עד 30,000 שנה. <b>הומו ספיינס</b> התפתח באפריקה המזרחית לפני כ־<b>200,000</b> שנה.`)}${rem("98.8% מה־DNA של האדם והשימפנזה זהים. זה <b>לא</b> אומר שהתפתחנו מהשימפנזה: שני המינים התפצלו מאותו ענף בזמנים שונים.")}`,q:"q23"},
  {h:"למה מוח גדול ומה קובע אינטליגנציה",html:`${def("המגבלה של הלידה",`הליכה זקופה הגבילה את <b>תעלת הלידה</b>, ולכן ראש התינוק לא יכול להיות גדול יותר. המוח ממשיך לגדול אחרי הלידה, והיונקים זקוקים ל<b>טיפול הורי</b> ממושך. כך נוצר מוח גדול עם מעגלים שמשתנים בעקבות ניסיון, כמו ״מחשב רב־תכליתי״.`)}${def("נאוטניה",`<mark>נאוטניה</mark> ${E("neoteny")}: האטה של ההתבגרות שמשאירה יותר זמן לגדילה. בלידה המוח שוקל כ־350 גרם ויש בו כמאה מיליארד נוירונים. בבגרות הוא שוקל כ־1.4 ק״ג, פי ארבעה. כמעט לא נוצרים נוירונים חדשים, אבל הקשרים צומחים ותאי התמך מתחלקים.`)}${tiles([["chart","יחס לגוף?","אדם 2.3%, פיל 0.2%, אבל חדף 3.3%. היחס לבדו לא מסביר"],["brain","מה כן קובע","מספר הנוירונים שזמינים ללמידה, זיכרון ותכנון, ולא לשרירים ולחושים"],["data","צפיפות","בפרימטים יש יותר נוירונים לכל גרם מאשר במכרסמים"]])}`,q:"q25"}
 ]},
 {id:"t6",icon:"check",title:"אתיקה, קריירה ודרכי למידה",blocks:[
  {h:"מחקר בבעלי חיים",html:`${def("למה חיות",`אנחנו משתמשים בחיות למזון, לפרוות וכחיות מחמד. הספר טוען שמחקר הוא השימוש <b>היחיד שאין לו תחליף</b>: בלעדיו לא נבין מחלות ולא נטפל בהן. גידול חיות מחמד אפילו לא דורש אישור או ביקורת, בניגוד למדענים.`)}${def("הפיקוח",`בארה״ב כל מוסד שמבקש מימון ממשלתי צריך ועדה, <b>IACUC</b> ${E("Institutional Animal Care and Use Committee")}, עם וטרינרים, מדענים, חברים שאינם מדענים וחבר מחוץ למוסד. גם מחקר תצפית לא פולשני חייב אישור. בישראל: <b>חוק צער בעלי חיים (ניסויים בבעלי חיים) תשנ״ד־1994</b> ומועצה של 23 חברים שממנה שר הבריאות. לא מאשרים ניסוי אם יש חלופה, ומגבילים את מספר החיות.`)}${ex(`מחקר בסיסי על תקשורת בין נוירונים הראה שתרופה שמעכבת סוג מסוים של תקשורת עצבית, אם ניתנת לפני חסימת כלי דם, מונעת נזק מוחי. כדי לבדוק זאת צריך לסתום כלי דם בחולדות מורדמות ולבדוק את מוחן.`)}${rem("תרביות תאים והדמיות מחשב <b>לא מחליפות</b> יצורים חיים: אי אפשר לבדוק התמכרות בתרבית, ואי אפשר לתכנת מחשב שיחקה מערכת עצבים שעוד לא מבינים.")}`,q:"q27"},
  {h:"מחקר בבני אדם",html:`${def("הפיקוח",`<b>IRB</b> ${E("Institutional Review Board")} מקביל ל־IACUC. דרישות מרכזיות: <b>הסכמה מדעת</b> (הסבר על מהלך המחקר, איסוף הנתונים ושמירתם, התרומה והנזק האפשרי) ו<b>שמירת סודיות</b>.`)}${ex(`<b>שבט ההוואסופאי נגד אריזונה</b> (הסדר ב־2010): דגימות דם שנאספו למחקר על <b>סוכרת</b> שימשו אחר כך למחקר על <b>סכיזופרניה</b> בלי הסכמה מתאימה. הדגימות הוחזרו והשבט קיבל פיצוי של 700,000 דולר.`)}${def("נוירואתיקה",`ענף שעוסק בהשלכות האתיות של מחקר המוח. דוח מ־2014 בדק: הדמיה מוחית ופרטיות, דמנציה ושינויי אישיות, העצמה קוגניטיבית והוגנות, וגרייה חוצת גולגולת. ההמלצה: לשלב אתיקה ומדע בכל רמות החינוך.`)}`,q:"q29"},
  {h:"קריירה ודרכי למידה",html:`${def("השמות והתחומים",`<b>מדעני עצב והתנהגות</b> ${E("behavioral neuroscientists")} חוקרים את הפיזיולוגיה של ההתנהגות, בעיקר בחיות מעבדה. שמות קודמים: פסיכולוגיה פיזיולוגית, פסיכוביולוגיה, ביופסיכולוגיה. <b>נוירולוגים</b> הם רופאים שמאבחנים ומטפלים. <b>מדע העצב הקוגניטיבי</b> חוקר בני אדם, לרוב בהדמיה.`)}${rem("חוקר עצמאי צריך דוקטורט (Ph.D. או M.D.), ואחריו בדרך כלל כשנתיים של <b>פוסט־דוקטורט</b>. טכנאי מחקר עם תואר ראשון או שני עושים עבודה חשובה בלי דוקטורט.")}${tiles([["doc","סיכום פעיל","לקשר לידע קודם. הדגשה וקו תחתון לא משפרים ציון"],["people","ללמד אחרים","מי שהתכונן ללמד הצליח יותר במבחן"],["id","סביבת המבחן","למידה תלוית מצב: צוללנים זכרו טוב יותר באותה סביבה"],["clock","ריווח","כמה פרקי זמן קצרים עדיפים על אחד ארוך"],["x","בלי הסחות","מי שנדרש לשים לב לטלוויזיה הצליח הכי פחות"],["bulb","עזרי זיכרון","שיטת המיקום, ראשי תיבות ואקרוסטיכון"]])}${ex(`<b>ראשוניות ואחרוניות</b>: זוכרים בעיקר את מה שבא ראשון ואחרון. לכן כדאי ללמוד את החומר הקשה בהתחלה או בסוף, ואת המוכר באמצע.`)}`,q:"q31"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"לפי ההיגיון של טיפול בתנועה מאולצת, למה ג'רמייה התקשה להזיז את ידו הימנית גם עשרות שנים אחרי השבץ?","a":"כי לא השתמש בה, ופחות תאי מוח הוקדשו להנעתה","w":["כי הנוירונים בצד ימין של מוחו מתו לגמרי","כי היד השמאלית שלו שלטה גם בצד ימין","כי מוח בוגר לא יכול ליצור קשרים חדשים"],"e":"הטיפול מבוסס על ההנחה שהשיתוק נשמר בגלל היעדר שימוש באיבר ומיעוט תאי מוח שמוקדשים לו, ולכן מאלצים שימוש. ההצלחה שלו סותרת דווקא את הטענה שמוח בוגר לא יוצר קשרים חדשים."},{"q":"למה שמו לג'רמייה כפפה על היד השמאלית?","a":"כדי לאלץ אותו להשתמש ביד הימנית הפגועה","w":["כדי להגן על היד השמאלית מפציעות בנפילות","כדי לחסום תחושה שמבלבלת את ההמיספרה השמאלית","כי השבץ פגע ביד השמאלית שלו"],"e":"השבץ פגע בצד שמאל של המוח ולכן בצד ימין של הגוף. הכפפה על היד הבריאה מאלצת שימוש ביד הפגועה, וזה מה שמעורר את השינוי במוח."}]},
"q2":{"t":"t1","v":[{"q":"איפה, לפי הפרק, מתרחשת נוירוגנזה במוח הבוגר?","a":"בהיפוקמפוס ובבולבוס ההרחה","w":["בקורטקס המוטורי ובמוחון","בכל אזורי הקורטקס באופן שווה","רק במוח השדרה אחרי פציעה"],"e":"נוירוגנזה, יצירת נוירונים חדשים מחלוקת תאי גזע עצביים, מתוארת בהיפוקמפוס ובבולבוס ההרחה, ויש לה תפקיד בלמידה. היא לא מתרחשת באופן שווה בכל הקורטקס."},{"q":"מה ההבדל בין פלסטיות לנוירוגנזה?","a":"פלסטיות היא שינוי כללי במוח; נוירוגנזה היא יצירת נוירונים חדשים","w":["פלסטיות היא יצירת נוירונים חדשים; נוירוגנזה היא יצירת קשרים","פלסטיות קורית רק בילדות; נוירוגנזה קורית רק בבגרות","אין הבדל, אלה שני שמות לאותו תהליך במוח הבוגר"],"e":"פלסטיות היא היכולת הכללית של המוח להשתנות עם הזמן, למשל ביצירת קשרים חדשים. נוירוגנזה היא מקרה מיוחד: יצירת נוירונים חדשים מחלוקה של תאי גזע."}]},
"q3":{"t":"t1","v":[{"q":"מהו לפי הספר הייעוד הראשון במעלה של מערכת העצבים?","a":"לשלוט בתנועות, כולל דיבור","w":["לחשוב ולשקול בהיגיון","לאחסן זיכרונות לאורך זמן","לקלוט ולפרש מידע חושי"],"e":"הספר טוען שתפיסה, חשיבה וזיכרון התפתחו כי הם משרתים פעולה. לכן הייעוד הראשון הוא שליטה בתנועה, וגם דיבור הוא תנועה."},{"q":"מה מסביר את המשפט ״תפיסה שאין עמה יכולת פעולה אין בה תועלת״?","a":"התפיסה התפתחה כדי לכוון התנהגות מותאמת","w":["תפיסה ותנועה מתרחשות באותם אזורים במוח","אנשים לא מסוגלים ליהנות מגירויים בלי לזוז","התפיסה היא הייעוד הראשון של המוח"],"e":"לפי הספר תפקיד התפיסה הוא לתת מידע כדי שההתנהגות תהיה מותאמת לצרכים. זה שאפשר ליהנות משקיעה בלי לפעול לא סותר את זה, כי הכושר התפתח בשביל פעולה."}]},
"q4":{"t":"t1","v":[{"q":"מי כתב את ספר הלימוד הראשון בפסיכולוגיה, ״עקרונות הפסיכולוגיה הפיזיולוגית״?","a":"וילהלם וונדט","w":["יוהאנס מילר","הרמן פון הלמהולץ","צ'ארלס דרווין"],"e":"וונדט כתב את הספר בסוף המאה ה־19, ולכן התחום נקרא בעבר פסיכולוגיה פיזיולוגית. מילר והלמהולץ היו פיזיולוגים בני אותה תקופה, אבל לא כתבו את הספר הזה."},{"q":"איך נוצר תחום מדע העצב וההתנהגות?","a":"מאיחוד שיטות הניסוי של הפסיכולוגיה עם אלה של הפיזיולוגיה","w":["מהפרדה בין הפסיכולוגיה לבין הרפואה והפיזיולוגיה","מתצפיות בהתנהגות של חיות בסביבתן הטבעית בלבד","מפיתוח מחשבים שחיקו את פעולת המוח האנושי"],"e":"התחום התפתח כשחוקרים שילבו את הניסוי הפסיכולוגי עם שיטות פיזיולוגיות ויישמו אותן לשאלות על התנהגות. תצפיות ומחשבים תרמו, אבל לא הם הגדירו את התחום."}]},
"q5":{"t":"t1","v":[{"q":"חוקר מסביר את התכווצות השריר באמצעות תנועת יונים בממברנה. איזה סוג הסבר זה?","a":"העמדה","w":["הכללה","פונקציונליזם","דואליזם"],"e":"העמדה מסבירה תופעה מורכבת באמצעות תהליכים בסיסיים שעומדים ביסודה, כמו תנועת יונים. הכללה הייתה מסקנה כללית מתצפיות רבות בהתנהגות, בלי לרדת למנגנון."},{"q":"חוקרת מסיקה מתצפיות רבות שחולדות לומדות מהר יותר כשהתגמול מיידי. איזה סוג הסבר זה?","a":"הכללה","w":["העמדה","כריתה ניסויית","מודל מכני"],"e":"הכללה היא מסקנה כללית על סמך תצפיות רבות בתופעות דומות. היא לא העמדה, כי לא מוסבר כאן איזה מנגנון פיזיולוגי עומד מאחורי הלמידה."}]},
"q6":{"t":"t1","v":[{"q":"מה מלמדת הדוגמה של עכברים שבונים קן?","a":"אותה התנהגות יכולה לנבוע ממנגנונים פיזיולוגיים שונים","w":["כל התנהגות נשלטת על ידי אזור מוח אחד בלבד","הורמונים לא משפיעים על התנהגות של עכברים בכלל","בניית קן נלמדת מהאם ולא קשורה לפיזיולוגיה"],"e":"עכברים בונים קן גם כשקר וגם בהיריון. התנועות זהות, אבל חלק מוח אחד מגיב לחיישני טמפרטורה וחלק אחר להורמונים, ולכן ההתנהגות לא מעידה על מנגנון אחד."},{"q":"נזק לאזור שמנתח הגאי דיבור פוגע גם בכתיב. מה אפשר להסיק?","a":"זיהוי מילה מדוברת ואיות נשענים על מנגנונים קרובים","w":["כתיב וקריאה בקול הם בדיוק אותו תהליך במוח","הכתיב נשלט רק על ידי אזורים מוטוריים של היד","הנזק מעיד שהחולה איבד את המודעות למילים"],"e":"זו דוגמה למקרה שבו מנגנון פיזיולוגי מרמז על הארגון הפסיכולוגי: אם נזק אחד פוגע בשתי יכולות, הן כנראה חולקות מנגנון. אין סיבה להסיק שהן זהות לגמרי."}]},
"q7":{"t":"t2","v":[{"q":"מה מאפיין את הגישה של מדעני העצב לשאלת הגוף והנפש?","a":"גישה מוניסטית: הנפש נוצרת מפעולת מערכת העצבים","w":["גישה דואליסטית: הנפש היא ישות לא גשמית","גישה פילוסופית: אפשר לפתור את השאלה בחשיבה בלבד","גישה של דקארט: המגע מתרחש באצטרובל"],"e":"מדעני העצב נוקטים גישה אמפירית ומוניסטית ומניחים שהבנת מערכת העצבים תסביר גם את הנפש. דואליזם רואה בנפש דבר נפרד מהגוף, וזו בדיוק העמדה שהם דוחים."},{"q":"מה הטענה של הדואליזם?","a":"הגוף גשמי, אבל הנפש אינה גשמית","w":["הכול חומר ואנרגיה","הנפש היא תוצר של פעילות המוח","הלב והמוח חולקים את תפקידי הנפש"],"e":"דואליזם הוא האמונה במהות כפולה: גוף חומרי ונפש לא חומרית. הטענה שהנפש היא תוצר של המוח היא מוניזם."}]},
"q8":{"t":"t2","v":[{"q":"איך הגיב גאלן לטענת אריסטו שהמוח רק מרסן את הלב?","a":"טען שאילו כך היה, הטבע לא היה מרחיק את המוח מהלב","w":["הסכים איתו והוסיף שתפקיד המוח הוא לקרר את הדם","טען שהלב והמוח חולקים את תפקידי הנפש בשווה","טען שהנפש נמצאת בבלוטת האצטרובל שבמרכז המוח"],"e":"גאלן, שהעריך את אריסטו, כינה את הטענה מגוחכת: המיקום של המוח והעובדה שעצבי החישה מגיעים אליו מעידים על תפקידו. האצטרובל הוא הרעיון של דקארט, מאות שנים אחר כך."},{"q":"מדוע תרבויות עתיקות רבות ראו בלב את מקום המחשבות והרגשות?","a":"כי פעימותיו חיוניות לחיים וקצבו עולה ברגש","w":["כי ניתוחים בעת העתיקה הראו שאין למוח עצבים","כי היפוקרטס, הרופא המפורסם, טען כך במפורש","כי הלב הוא האיבר הגדול והכבד ביותר בגוף"],"e":"הלב חיוני לחיים ומגיב לרגשות, ולכן נראה כמקום טבעי לנפש. היפוקרטס דווקא היה זה שייחס את התפקיד למוח."}]},
"q9":{"t":"t2","v":[{"q":"לפי דקארט, איך הנפש מזיזה את הגוף?","a":"היא מטה את בלוטת האצטרובל, שמזרימה נוזל בלחץ דרך העצבים לשרירים","w":["היא שולחת דחפים חשמליים דרך העצבים אל השרירים","היא מפעילה רפלקסים במוח השדרה בלבד, בלי המוח","היא משנה את קצב הלב, וזה מזיז את השרירים"],"e":"דקארט דימה את המוח למערכת הידראולית: האצטרובל פועל כמו ידית ששולחת נוזל לשרירים. הרעיון של דחפים חשמליים הגיע מאוחר יותר, מגלוואני."},{"q":"מה היה היתרון המדעי של המודל של דקארט?","a":"אפשר היה לבדוק אותו בניסוי, ולכן גם להפריך אותו","w":["הוא היה נכון ברובו ואושר בניסויים מאוחרים","הוא הסביר לראשונה איך נוצרת המודעות","הוא התבסס על ניתוחים של מוחות אדם אחרי המוות"],"e":"בניגוד לסברות פילוסופיות, המודל ניבא דברים שאפשר לבדוק, וזה מה שאפשר את הפרכתו. הוא לא היה נכון, ולא הסביר את המודעות."}]},
"q10":{"t":"t2","v":[{"q":"איזה ממצא של גלוואני הפריך את דקארט?","a":"שריר צפרדע התכווץ מגירוי חשמלי לעצב, גם במנותק מהגוף","w":["המוח מכיל חדרים מלאי נוזל שנמצא בלחץ","עצבים מעבירים מסרים במהירות של האור","הנפש מפוזרת בכל חלקי המוח ולא באצטרובל"],"e":"אם שריר ועצב מנותקים זזים מגירוי חשמלי, היכולת לזוז נמצאת ברקמה עצמה ולא בנוזל שהמוח מזרים. חדרי המוח היו דווקא חלק מהמודל של דקארט."},{"q":"מהו מודל במדע, לפי הפרק?","a":"מערכת פשוטה שמבצעת חלק ממה שהמערכת המורכבת עושה","w":["תיאור מילולי מלא ומדויק של כל חלקי המוח","תוצאה של ניסוי אחד שחוזרת בכל המעבדות","השערה פילוסופית שאי אפשר לבדוק בניסוי"],"e":"מודל כמו הפסלים המתנועעים, לוח המתגים או המחשב מחקה רק חלק מהתפקודים, ויתרונו בכך שאפשר לבדוק אותו. הוא לא תיאור מלא ולא השערה שאי אפשר לבחון."}]},
"q11":{"t":"t3","v":[{"q":"למה מבצעים ניתוח לחציית המוח?","a":"לטיפול באפילפסיה קשה שהתרופות לא עוזרות לה","w":["לטיפול בשבץ בהמיספרה השמאלית","כדי לשפר את היכולת לדבר","כדי לחקור את המודעות אצל אנשים בריאים"],"e":"בחולים כאלה פעילות יתר בצד אחד עוברת דרך כפיס המוח ומגרה את הצד השני עד התקף מקיף. חיתוך הכפיס מפחית את ההתקפים; המחקר על המודעות הוא תוצר לוואי."},{"q":"מה תפקידו של כפיס המוח?","a":"לחבר בין אזורים מקבילים בשתי ההמיספרות","w":["לחבר את המוח אל מוח השדרה ואל שאר הגוף","לשלוט בדיבור ובקריאה בהמיספרה השמאלית","להעביר מידע מהעיניים אל קורטקס הראייה"],"e":"כפיס המוח הוא אלומת סיבים שמאפשרת לשתי ההמיספרות לחלוק מידע. הוא לא שולט בדיבור בעצמו ולא מחבר למוח השדרה."}]},
"q12":{"t":"t3","v":[{"q":"מנותח חצוי מוח מניח ביד שמאל ספר שהוא קורא בעניין. למה?","a":"ההמיספרה הימנית, ששולטת ביד שמאל, לא יודעת לקרוא","w":["ההמיספרה השמאלית, ששולטת ביד שמאל, עייפה מהקריאה","היד השמאלית משותקת חלקית מאז הניתוח","ההמיספרה הימנית לא מקבלת שום מידע חזותי"],"e":"כל המיספרה שולטת בצד הנגדי, ולכן יד שמאל נשלטת בידי הימנית. הימנית רואה, אבל לא קוראת, ולכן הספר לא מעניין אותה."},{"q":"ברוב האנשים, מה נכון לגבי ההמיספרה הימנית?","a":"מבינה דיבור במידה סבירה, אבל לא מסוגלת לדבר","w":["שולטת בדיבור ובקריאה, כמו השמאלית","לא מבינה שפה בכלל, גם לא מילים בודדות","שולטת ביד ימין ובצד ימין של הגוף"],"e":"הדיבור נשלט ברוב האנשים בידי ההמיספרה השמאלית. הימנית מבינה מילים במידה סבירה, אבל לא מפיקה דיבור, ושולטת ביד שמאל."}]},
"q13":{"t":"t3","v":[{"q":"מגישים ריח לנחיר הימני של מנותח חצוי מוח. מה יקרה?","a":"יאמר שלא הריח דבר, אבל יד שמאל תבחר חפץ מתאים","w":["יזהה את הריח בקול, אבל יד שמאל תבחר באקראי","יאמר שלא הריח דבר, ויבחר נכון רק ביד ימין","יזהה את הריח בקול ויבחר נכון בשתי הידיים"],"e":"בריח אין הצלבה, ולכן הנחיר הימני מגיע להמיספרה הימנית. היא מזהה ושולטת ביד שמאל, אבל אין לה דיבור, וההמיספרה המדברת לא קיבלה את הריח."},{"q":"מה מיוחד בחוש הריח לעומת שאר החושים?","a":"אין בו הצלבה: כל נחיר מגיע להמיספרה שבאותו צד","w":["הוא מגיע לשתי ההמיספרות באותה מידה בדיוק","הוא נקלט רק בהמיספרה השמאלית, בשני הנחיריים","הוא לא עובר דרך הקורטקס אלא דרך מוח השדרה"],"e":"בשאר החושים כל צד של הגוף מיוצג בהמיספרה הנגדית. בריח הנחיר השמאלי מגיע לשמאלית והימני לימנית, וזה מה שמאפשר את הניסוי."}]},
"q14":{"t":"t3","v":[{"q":"מה המסקנה העיקרית ממחקרי המוח החצוי לגבי המודעות?","a":"מודעות דורשת שהמידע יגיע לאזורי הדיבור שבצד שמאל","w":["כל המיספרה היא אדם נפרד עם מודעות מלאה משלו","המודעות נמצאת בכפיס המוח, ולכן החיתוך מבטל אותה","הנפש לא תלויה בחיבורים הפיזיים שבין חלקי המוח"],"e":"כשמידע מגיע רק לימנית, האדם פועל לפיו אבל לא מדווח שהוא מודע לו. זו תמיכה בגישה המוניסטית, ולא בטענה שהמודעות לא תלויה בחיבורים."},{"q":"איך מחקרי המוח החצוי קשורים לשאלת הגוף והנפש?","a":"הם תומכים במוניזם, כי ניתוק פיזי במוח מנתק גם את המודעות","w":["הם תומכים בדואליזם, כי ההמיספרות פועלות בנפרד","הם מוכיחים שדקארט צדק בעניין בלוטת האצטרובל","הם לא קשורים לשאלת הגוף והנפש בשום צורה"],"e":"אם חיתוך אלומת סיבים משנה את מה שהאדם מודע לו, המודעות תלויה במבנה הפיזי של המוח. הספר מציג אותם כדוגמה לגישה המוניסטית."}]},
"q15":{"t":"t4","v":[{"q":"מה טוענת הדוקטרינה של אנרגיות עצביות ספציפיות?","a":"כל העצבים מעבירים אותו סוג שדר, וסוג התחושה נקבע לפי העצב שפעיל","w":["לכל חוש יש סוג אחר של דחף חשמלי משלו","עוצמת הגירוי היא שקובעת איזה סוג תחושה נרגיש","רק עצבי הראייה מעבירים מידע בדחפים חשמליים"],"e":"מילר הבחין שהשדר זהה בכל העצבים, ולכן ההבדל בין ראייה לשמיעה נובע מהערוץ ומאזור המוח שמקבל אותו. מכאן שגם לחץ מכני על העין יורגש כאור."},{"q":"אדם משפשף את עיניו ורואה ניצוצות. מה מסביר זאת?","a":"הדוקטרינה של אנרגיות עצביות ספציפיות","w":["הכריתה הניסויית שפיתח פייר פלורנס","תורת הברירה הטבעית של צ'ארלס דרווין","הפלסטיות של המוח והיכולת שלו להשתנות"],"e":"הגירוי המכני מפעיל את עצב הראייה, ואזור המוח שמקבל ממנו מפרש כל פעילות כאור. זה בדיוק הרעיון של מילר, ולא קשור לכריתה או לברירה טבעית."}]},
"q16":{"t":"t4","v":[{"q":"במה נבדלה העבודה של ברוקה מזו של פלורנס?","a":"ברוקה בדק מוח שניזוק משבץ, ופלורנס הסיר אזורים בחיות","w":["ברוקה הסיר אזורים במוח אדם, ופלורנס חקר אנשים פגועים","ברוקה השתמש בגירוי חשמלי, ופלורנס בכריתה ניסויית","שניהם חקרו רק חיות, אבל בשיטות שונות זו מזו"],"e":"פלורנס יצר כריתה ניסויית בחיות. ברוקה יישם את אותו היגיון באדם, בלי להסיר דבר, על ידי בדיקה של מוח שנפגע משבץ. גירוי חשמלי היה השיטה של פריץ' והיציג."},{"q":"מה מצא ברוקה ב־1861?","a":"שנזק בקורטקס השמאלי פוגע בדיבור","w":["שגירוי חשמלי בקורטקס מזיז את הצד הנגדי","שמהירות ההולכה העצבית כ־30 מטר בשנייה","שהמוח בנוי מנוירונים נפרדים ולא מרשת"],"e":"ברוקה נתח את מוחו של אדם שאיבד את הדיבור ומצא נזק בצד שמאל, באזור שנקרא היום על שמו. המהירות היא ממצא של הלמהולץ, והנוירונים הנפרדים של רמון אי קחל."}]},
"q17":{"t":"t4","v":[{"q":"מה הראה הממצא של הלמהולץ על מהירות ההולכה העצבית?","a":"שההולכה איטית מזרם בכבל, ולכן מורכבת יותר","w":["שההולכה מהירה כמו האור, כמו בכבל חשמלי","שההולכה היא בעצם זרימת נוזל בתוך העצבים","שאין שום קשר בין חשמל לבין פעילות העצבים"],"e":"הלמהולץ מדד כ־30 מטר בשנייה, בעוד שקודמיו חשבו שהמהירות קרובה למהירות האור. הפער מראה שזה לא רק זרם בכבל, אבל ההולכה עדיין חשמלית ולא זרימת נוזל."},{"q":"מה גילו פריץ' והיציג כשגירו בחשמל את הקורטקס של כלב?","a":"גירוי בנקודות מסוימות גרם להתכווצות שרירים בצד הנגדי","w":["גירוי בכל נקודה גרם להתכווצות בשני צידי הגוף","הגירוי עצר לרגע את פעימות הלב של הכלב","הגירוי גרם לכלב להשמיע קולות ולנבוח"],"e":"הם מצאו את מה שנקרא היום הקורטקס המוטורי הראשוני, ששולט בשרירים בצד הנגדי של הגוף. התוצאה לא הייתה כללית לכל נקודה ולא בשני הצדדים."}]},
"q18":{"t":"t4","v":[{"q":"מה טען רמון אי קחל על מבנה מערכת העצבים?","a":"שהיא בנויה ממיליארדי נוירונים נפרדים","w":["שהיא רשת רציפה אחת של סיבים מחוברים","שהיא בנויה מתאי תמך בלבד, בלי נוירונים","שהיא זהה לחלוטין אצל כל היונקים"],"e":"קחל השתמש בצביעת גולג'י וצייר נוירונים בודדים, וטען נגד הדעה המקובלת אז שהמערכת היא רשת רציפה. על כך קיבל את פרס נובל ב־1906."},{"q":"מה מכונה ״ה־GPS של המוח״?","a":"מערכות האיכון המרחבי (נובל 2014)","w":["הקורטקס המוטורי שגילו פריץ' והיציג","כפיס המוח שמחבר את שתי ההמיספרות","אזור ברוקה, שמתכנן את תנועות הדיבור"],"e":"ב־2014 הוענק פרס נובל על גילוי מערכות במוח שמייצגות מיקום במרחב. האזורים האחרים קשורים לתנועה, לחיבור בין ההמיספרות ולדיבור."}]},
"q19":{"t":"t4","v":[{"q":"מהי אופטוגנטיקה?","a":"שיטה להפעלת נוירונים מסוימים באמצעות אור","w":["גרייה מגנטית חוצת גולגולת","הדמיה ממוחשבת של המוח כולו","צביעה של נוירונים לצורך ראייה במיקרוסקופ"],"e":"באופטוגנטיקה בוררים נוירונים ומפעילים אותם באור כדי לבדוק את ההשפעה על ההתנהגות. גרייה מגנטית היא TMS, שיטה אחרת."},{"q":"מה מסביר את הצמיחה של העמותה למדע העצב מ־500 חברים ב־1969 לכ־40,000 היום?","a":"התחום הוא בין־תחומי ומשלב חוקרים מתחומים רבים","w":["התחום מוגבל לרופאים נוירולוגים בבתי חולים","התחום עוסק רק במחקר בבני אדם, בלי חיות","רוב החברים בעמותה הם פילוסופים של הנפש"],"e":"הספר מדגיש שהשורשים והעתיד של התחום הם בשיתוף פעולה בין ביולוגיה, כימיה, הנדסה, פסיכולוגיה ופיזיקה. התחום לא מוגבל לרופאים או לבני אדם."}]},
"q20":{"t":"t4","v":[{"q":"על מה זכו הודג'קין והאקסלי בפרס נובל ב־1963?","a":"על המנגנונים היוניים של ממברנות","w":["על גילוי הנוירוטרנסמיטרים במוח","על תיאור המבנה של מערכת העצבים","על גילוי מערכות האיכון במוח"],"e":"לפי טבלת הזוכים, ב־1963 הפרס ניתן על המנגנונים היוניים של ממברנות. הנוירוטרנסמיטרים זכו ב־1970, ומבנה מערכת העצבים ב־1906."},{"q":"מה משותף לגולג'י ולרמון אי קחל?","a":"שניהם זכו בנובל ב־1906 על מבנה מערכת העצבים","w":["שניהם טענו שמערכת העצבים היא רשת רציפה","שניהם גילו את האזור שאחראי לדיבור","שניהם מדדו את מהירות ההולכה העצבית"],"e":"שניהם זכו יחד ב־1906, אף שקחל טען נגד רעיון הרשת הרציפה. אזור הדיבור הוא של ברוקה, והמהירות של הלמהולץ."}]},
"q21":{"t":"t5","v":[{"q":"מה טוען הפונקציונליזם?","a":"תופעה ביולוגית מובנת דרך התועלת שלה לאורגניזם","w":["לכל מנגנון ביולוגי יש מטרה שתוכננה מראש","ההתנהגות עוברת בתורשה ישירות מההורים לצאצאים","תכונות מועילות נוצרות ברגע שהאורגניזם זקוק להן"],"e":"הפונקציונליזם שואל מה התפקיד של תכונה. הספר מדגיש שלמנגנונים אין מטרה מתוכננת, כי הם עוצבו ברצף מקרי, ושההתנהגות עצמה לא עוברת בתורשה."},{"q":"מה, לפי הפרק, עובר בתורשה כשמדברים על התנהגות?","a":"ה־DNA שבונה את המוח שמחולל את ההתנהגות","w":["ההתנהגות עצמה, כפי שההורה ביצע אותה","הזיכרונות של ההורים","שום דבר, ההתנהגות נלמדת תמיד"],"e":"ההתנהגות לא עוברת ישירות. מה שעובר הוא החומר התורשתי שמכוון את בניית הגוף והמוח, וההתנהגות רחוקה מהמקור הגנטי עוד יותר מהמוח."}]},
"q22":{"t":"t5","v":[{"q":"מוטציה גורמת לחיה קטנה לקפוא מול גירוי חדש. למה היא עשויה להפוך לשכיחה?","a":"היא מגדילה את הסיכוי לשרוד ולהעמיד צאצאים","w":["כי כל מוטציה מועילה לאורגניזם בדרך כלשהי","כי החיה לומדת ומעבירה את ההתנהגות לצאצאיה","כי מוטציות קורות בכוונה כשהסביבה משתנה"],"e":"מוטציה שמקטינה את הסיכוי להיתפס בידי טורף מגדילה את מספר הצאצאים, ולכן הגן מתפשט. רוב המוטציות לא מועילות, והן אקראיות ולא מכוונות."},{"q":"מה מלמדת ההשוואה בין מיני ציפורי שיר?","a":"כשרק הזכר שר, האזורים גדולים יותר אצלו","w":["לכל ציפורי השיר יש אזורי שירה זהים בגודלם","אזורי השירה תמיד גדולים יותר אצל הנקבות","גודל אזורי השירה לא קשור להתנהגות של המין"],"e":"המבנה המוחי תואם את ההתנהגות של המין: כשרק הזכר שר, לזכר יש אזורים גדולים יותר, וכשגם הנקבה שרה ההבדל נעלם. זו הדגמה לאדפטציה במבנה המוח."}]},
"q23":{"t":"t5","v":[{"q":"מה היה כנראה היתרון המקורי של ראיית צבעים בפרימטים?","a":"להבחין בפרי בשל על רקע עלווה ירוקה","w":["לזהות בני זוג פוטנציאליים גם בלילה","להבחין בין שעות היום לשעות הלילה","לראות טורפים מתקרבים בחושך"],"e":"הספר קושר את האבולוציה של עצי פרי לפרימטים אוכלי פירות: ראיית צבע עזרה למצוא פרי בשל לפני שירקב או שחיה אחרת תגיע אליו."},{"q":"מתי ואיפה התפתח הומו ספיינס, לפי הפרק?","a":"באפריקה המזרחית, לפני כ־200,000 שנה","w":["באירופה המערבית, לפני כ־120,000 שנה","באסיה, לפני כ־1.7 מיליון שנה","באפריקה המזרחית, לפני כ־1.7 מיליון שנה"],"e":"לפני 1.7 מיליון שנה יצא מאפריקה הומו ארקטוס, ובאירופה המערבית חיו הנאנדרתלים. הומו ספיינס התפתח באפריקה המזרחית לפני כ־200,000 שנה."}]},
"q24":{"t":"t5","v":[{"q":"מה נכון לגבי 98.8% ה־DNA המשותף לאדם ולשימפנזה?","a":"שני המינים התפצלו מאותו ענף","w":["האדם התפתח ישירות מהשימפנזה","השימפנזה התפתחה מאבות האדם","אין שום הבדל במוח בין שני המינים"],"e":"הספר מזהיר מהטעות הנפוצה: הדמיון מעיד על מוצא משותף, כי שני המינים התפצלו מאותו ענף בזמנים שונים. אין כאן טענה שהמוחות זהים."},{"q":"אילו הומינידים קרובים לנו ביותר ושרדו עד היום?","a":"שימפנזים, גורילות ואורנגאוטנים","w":["נאנדרתלים והומו ארקטוס","בבונים וגיבונים","קופי עכביש וקופים אחרים מאמריקה"],"e":"לפי הפרק, ההומינידים הקרובים לנו שעדיין חיים הם השימפנזה, הגורילה והאורנגאוטן. הנאנדרתלים והומו ארקטוס נכחדו."}]},
"q25":{"t":"t5","v":[{"q":"למה, לפי הפרק, מוח האדם ממשיך לגדול הרבה אחרי הלידה?","a":"כי הליכה זקופה הגבילה את תעלת הלידה","w":["כי תינוקות נולדים בלי נוירונים בכלל","כי המוח ממשיך לגדול עד הזקנה","כי ליונקים אין טיפול הורי בצאצאים"],"e":"היציבה הזקופה משפיעה על מבנה האגן ומגבילה את גודל הראש בלידה, ולכן המוח משלים את גדילתו אחר כך, בתקופה של טיפול הורי. בלידה כבר יש בו כמאה מיליארד נוירונים."},{"q":"מהי נאוטניה?","a":"האטה של ההתבגרות שמשאירה יותר זמן לגדילה","w":["יצירת נוירונים חדשים במוח של אדם בוגר","האצה של ההתבגרות כדי להגיע מהר לבגרות","הקטנה של המוח אחרי גיל ההתבגרות"],"e":"נאוטניה פירושה ״התארכות הילדות״, והיא גורם חשוב בהתפתחות מוח גדול. יצירת נוירונים חדשים נקראת נוירוגנזה, וזה מושג אחר."}]},
"q26":{"t":"t5","v":[{"q":"למה היחס בין משקל המוח למשקל הגוף לא מסביר אינטליגנציה?","a":"כי לחדף יחס גבוה משל האדם, והוא פשוט ממנו","w":["כי לפיל יש יחס גבוה בהרבה משל האדם","כי מוח האדם קטן מאוד ביחס למשקל גופו","כי לכל היונקים יש בדיוק אותו יחס"],"e":"מוח החדף הוא 3.3% ממשקלו, יותר מ־2.3% של האדם, ובכל זאת פשוט יותר. אצל הפיל היחס נמוך, 0.2%, ולכן הוא לא דוגמה נגדית."},{"q":"מה, לפי הפרק, קובע את היכולת האינטלקטואלית?","a":"מספר הנוירונים הפנויים לחשיבה וללמידה","w":["הגודל המוחלט של המוח בגרמים","מספר הנוירונים שמניעים את השרירים","היחס בין משקל המוח למשקל הגוף"],"e":"גוף גדול לא צריך יותר נוירונים כדי להניע שרירים גדולים. מה שחשוב הוא כמה נוירונים פנויים לחשיבה, ובפרימטים יש יותר נוירונים בכל גרם מאשר במכרסמים."}]},
"q27":{"t":"t6","v":[{"q":"מה הטיעון המרכזי של הספר בעד מחקר בבעלי חיים?","a":"זה השימוש היחיד בחיות שאין לו תחליף","w":["חיות לא סובלות במעבדה כי הן מורדמות","החוק מתיר כל ניסוי שמועיל לבני אדם","תרביות תאים מחליפות כבר את רוב הניסויים"],"e":"הספר טוען שאפשר לחיות בלי בשר ופרוות, אבל לא להתקדם ברפואה בלי מחקר בחיות. הוא לא טוען שחיות לא סובלות, ודוחה את הרעיון שתרביות מחליפות אותן."},{"q":"למה תרביות תאים והדמיות מחשב לא מחליפות חיות מעבדה?","a":"כי אי אפשר לבדוק בהן התנהגות או לחקות מוח","w":["כי הן יקרות יותר מגידול חיות מעבדה","כי החוק אוסר להשתמש בהן במחקר","כי הן מדויקות מדי ולא מראות שונות"],"e":"התמכרות למשל היא תופעה התנהגותית שאי אפשר לבדוק בצלחת. ואם היינו יודעים לתכנת מחשב שמחקה את מערכת העצבים, כבר היו לנו כל התשובות."}]},

<div class="key"><b>על מה מדובר?</b> הקורס שואל שאלה אחת גדולה: <b>איך המוח יוצר התנהגות?</b> ההנחה היא <b>מוניזם</b>: הנפש היא לא ״משהו נוסף״ על המוח, אלא תוצר שלו. הפרק הראשון בונה את הבסיס: המוח <b>משתנה</b> כל החיים ונועד בראש ובראשונה ל<b>תנועה</b>; יש שתי דרכים להסביר התנהגות (הכללה והעמדה); הרעיונות על המוח התפתחו מ״הנפש בלב״ ועד נוירונים נפרדים; האבולוציה יצרה מוח גדול שלומד מניסיון; ויש כללים אתיים למחקר בבני אדם ובחיות.</div>

<h3>הדוגמה שתלווה אותנו: ג׳רמייה</h3>

<ul>
<li><b>העכברים והקן:</b> אותה התנהגות, שני מנגנונים. עכבר בונה קן כשקר לו, ועכברה בונה קן בגלל הורמוני היריון. הלקח: <b>התנהגות זהה לא אומרת מנגנון זהה</b>.</li>
<li><b>הפיזיולוגיה מלמדת גם על הפסיכולוגיה:</b> אם נזק אחד פוגע גם בזיהוי מילים מדוברות וגם בכתיב, כנראה יש להם מנגנון משותף. ואם נזק פוגע רק בקריאת מילים <b>לא מוכרות</b>, כנראה יש <b>שני מסלולי קריאה</b>: אחד שמפענח לפי הגייה, ואחד שמזהה מילה שלמה במבט.</li>
</ul>

<h3>3. ההיסטוריה: איך הגענו לרעיון שהמוח מחולק לתפקידים</h3>
<p>כדי להבין למה היום ברור לנו שאזור מסוים במוח שולט ביד של ג׳רמייה, כדאי לראות איך הרעיון הזה נבנה, צעד אחרי צעד:</p>
<ol>
<li><b>העת העתיקה:</b> רוב התרבויות חשבו שהנפש ב<b>לב</b>. <b>היפוקרטס</b>: במוח. <b>אריסטו</b>: המוח רק מקרר את הלב. <b>גאלן</b>: במוח, כי עצבי החישה מגיעים אליו.</li>
<li><b>דקארט</b> (מאה 17): <b>דואליסט</b> (נפש וגוף נפרדים), אבל הראשון שקשר בין נפש למוח, דרך <b>בלוטת האצטרובל</b>. המודל שלו היה הידראולי: נוזל בלחץ מנפח את השרירים. הוא המציא את המושג <b>רפלקס</b>. היתרון של המודל: אפשר לבדוק אותו.</li>
<li><b>גלוואני</b> (מאה 18): גירוי חשמלי לעצב של צפרדע מנותקת גורם לשריר להתכווץ. זה <b>הפריך</b> את דקארט: הכוח נמצא ברקמה, לא בנוזל.</li>
<li><b>מילר:</b> ניסויים במקום רק תצפית. חוק <b>האנרגיות העצביות הספציפיות</b>: האות החשמלי בכל העצבים זהה, ומה שקובע אם נרגיש ראייה או שמיעה זה <b>איזה עצב</b> מעביר אותו. מכאן: המוח מחולק לפי תפקידים.</li>
<li><b>פלורנס:</b> <b>כריתה ניסויית</b>: מסירים חלק מהמוח בחיה ובודקים מה נפגע. <b>ברוקה</b> (1861): אותו היגיון באדם, אבל דרך מוח שנפגע משבץ. מצא אזור דיבור בקורטקס השמאלי.</li>
<li><b>פריץ׳ והיציג</b> (1870): גירוי חשמלי בקורטקס של כלב גורם לתנועה בצד <b>הנגדי</b> של הגוף. זה הקורטקס המוטורי, בדיוק האזור שנפגע אצל ג׳רמייה (בצד שמאל, ולכן יד ימין).</li>
<li><b>הלמהולץ:</b> מדד מהירות הולכה בעצב, כ־30 מטר בשנייה. הרבה <b>פחות</b> מחשמל בכבל, ולכן זה לא סתם זרם חשמלי.</li>
<li><b>רמון אי קחל:</b> הראה שהנוירונים הם <b>תאים נפרדים</b> (נובל 1906, יחד עם גולג׳י).</li>
<li><b>מאות 20–21:</b> נוירוני מראה, ״ה־GPS של המוח״ (נובל 2014), אופטוגנטיקה, TMS, ומיזמי מחקר ענקיים.</li>
</ol>

<h3>4. המוח החצוי: ניסוי שתומך במוניזם</h3>
<p>אחת ההוכחות החזקות לכך שהמודעות היא תוצר של המוח מגיעה מאנשים שהמוח שלהם ״נחצה״:</p>
<ul>
<li>כדי לטפל באפילפסיה קשה, חותכים את <b>כפיס המוח</b>, הגשר בין ההמיספרות. ברוב האנשים <b>הדיבור בהמיספרה השמאלית</b>; הימנית מבינה מעט, אבל לא מדברת.</li>
<li><b>הניסוי:</b> נותנים ריח לנחיר <b>ימין</b>. בריח, בניגוד לשאר החושים, <b>אין הצלבה</b>, ולכן המידע מגיע להמיספרה הימנית. יד <b>שמאל</b> (שנשלטת מימין) בוחרת את החפץ הנכון, אבל האדם <b>אומר</b> שלא הריח כלום.</li>
<li><b>המסקנה:</b> כדי שנוכל לדווח על משהו, המידע צריך להגיע לאזורי הדיבור. ניתוק פיזי במוח = ניתוק מהמודעות.</li>
</ul>

<h3>5. אבולוציה: למה יש לנו מוח גדול וגמיש</h3>
<p>אם המוח של ג׳רמייה מסוגל להשתנות גם אחרי 40 שנה, נשאלת השאלה למה האבולוציה בנתה מוח כזה:</p>
<ul>
<li><b>פונקציונליזם:</b> לשאול ״מה התועלת?״ של כל תכונה. למנגנונים יש תפקיד, אבל אין ״מטרה״ מתוכננת. וההתנהגות עצמה לא עוברת בתורשה, אלא רק ה־DNA שבונה את המוח.</li>
<li><b>ברירה טבעית:</b> מוטציות קורות באקראי. המעטות שנותנות <b>יתרון בררני</b> (יותר צאצאים) מתפשטות. דוגמה: בציפורי שיר, אזורי השירה במוח גדולים אצל המין ששר.</li>
<li><b>ציר זמן:</b> הומו ארקטוס יצא מאפריקה לפני כ־1.7 מיליון שנה; נאנדרטלים חיו לפני 120–30 אלף שנה; הומו ספיינס הופיע לפני כ־200 אלף שנה במזרח אפריקה. 98.8% DNA משותף עם השימפנזה פירושו <b>אב קדמון משותף</b>, לא ״באנו מהשימפנזה״.</li>
<li><b>שרשרת הסיבות:</b> הליכה זקופה ← תעלת לידה צרה ← הראש חייב להיות קטן בלידה ← רוב גדילת המוח קורית <b>אחרי</b> הלידה (מ־350 גרם ל־1.4 ק״ג) ← התינוק צריך טיפול ארוך ← נוצר מוח שלומד מניסיון. <b>נאוטניה</b> = האטה של ההתבגרות.</li>
<li><b>מה קובע אינטליגנציה?</b> לא גודל המוח ולא היחס בינו לגוף (בזה החדף מנצח את האדם!). מה שקובע הוא מספר הנוירונים ה<b>פנויים</b> לחשיבה ולמידה. בפרימטים יש יותר נוירונים בכל גרם מוח.</li>
</ul>

<h3>6. אתיקה במחקר</h3>
<p>כל הידע הזה הגיע ממחקר, וחלקו בחיות. הטבלה מסכמת את הכללים:</p>
<div class="tw"><table><tr><th></th><th>בעלי חיים</th><th>בני אדם</th></tr>
<tr><td>מי מאשר</td><td>ועדת IACUC (ארה״ב); בישראל חוק צער בעלי חיים, 1994</td><td>ועדת IRB</td></tr>
<tr><td>עקרונות</td><td>רק כשאין חלופה, כמה שפחות חיות, וגם תצפית צריכה אישור</td><td>הסכמה מדעת וסודיות</td></tr>
<tr><td>דוגמה</td><td>חסימת כלי דם בחולדות כדי לחקור שבץ (כמו של ג׳רמייה)</td><td>שבט ההוואסופאי: דגימות שנתנו לחקר סוכרת שימשו בלי רשות לחקר סכיזופרניה</td></tr></table></div>
<p>הטיעון של הספר: מחקר הוא השימוש היחיד בחיות שאין לו תחליף, כי תרבית תאים או מחשב לא יכולים להראות, למשל, התמכרות.</p>
<p><b>טיפים ללמידה מהספר:</b> מה עובד: לסכם בעצמך, ללמד אחרים, ללמוד בסביבה דומה למבחן ובלי הסחות, לפזר את הלמידה, לשים את החומר הקשה בהתחלה או בסוף, ועזרי זיכרון. מה לא עובד: רק להדגיש בטוש.</p>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>דקארט היה דואליסט</b>, אף שהוא הראשון שקשר את הנפש למוח.</li>
<li><b>ברוקה לא הסיר חלקי מוח מאנשים</b>; הוא חקר מוח שנפגע משבץ. כריתה ניסויית היא בחיות (פלורנס).</li>
<li><b>הלמהולץ מצא שההולכה איטית</b>, ולכן היא לא זרם חשמלי פשוט.</li>
<li><b>ביחס מוח־גוף החדף מנצח את האדם</b>, ולכן היחס לא מסביר אינטליגנציה. ההסבר: נוירונים פנויים.</li>
<li><b>בריח אין הצלבה</b>, ולכן ריח בנחיר ימין מגיע להמיספרה הימנית.</li>
<li><b>התנהגות זהה לא אומרת מנגנון זהה</b> (העכברים והקן).</li>
<li><b>98.8% DNA משותף = אב קדמון משותף</b>, לא ״התפתחנו מהשימפנזה״.</li>
</ul></div>

<h3>קשרים לפרקים הבאים</h3>
<p>מהירות ההולכה ופוטנציאל הפעולה ← פרק 2. הקורטקס, ההמיספרות וכפיס המוח ← פרק 3. TMS, אופטוגנטיקה וכריתה ניסויית ← פרק 5.</p>`;
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#phys" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){S.done[T[ti].id]={r,n};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);
}
if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
