<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: פרק 1 - מבוא</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"brain",title:"מהו מדע העצב וההתנהגות",blocks:[
  {h:"ג'רמייה: המוח הבוגר משתנה",html:`${def("על מה הנושא",`הפרק פותח בשאלה מה התחום חוקר ואיך הוא מסביר התנהגות. נתחיל בסיפור שמראה שגם מוח בוגר יכול להשתנות.<br><b>מה נלמד כאן:</b> פלסטיות · נוירוגנזה · הכללה והעמדה`)}${def("תיאור מקרה",`ג'רמייה, עורך דין בן 53, לקה ב<b>שבץ</b> ${E("stroke")} בגיל 7, כשאספקת הדם לחלק השמאלי של מוחו נפסקה. הוא איבד תחושה בצד <b>ימין</b> של הגוף, וגם ארבעים שנה אחר כך נפל בערך 150 פעמים בשנה.`)}${def("הטיפול",`<mark>תנועה מאולצת</mark> ${E("constraint-induced [CI] movement therapy")}: הרעיון הוא שהשיתוק אחרי שבץ נובע גם מ<b>היעדר שימוש</b> באיבר, ומכך שפחות תאי מוח מוקדשים להנעתו. שמו לו כפפה על היד <b>השמאלית</b> הבריאה, והוא תרגל שעות ביום עם היד הפגועה: הרים עפרונות, בנה בקוביות ותלה אטבים. אחרי שבועיים של תרגול היד ושלושה של הרגל, שיווי המשקל השתפר והוא כתב את שמו ביד ימין.`)}${def("מושגי מפתח",`<mark>פלסטיות</mark> (גמישות) היא היכולת של המוח להשתנות עם הזמן ("חיווט מחדש"). <mark>נוירוגנזה</mark> ${E("neurogenesis")} היא יצירת נוירונים חדשים מחלוקה של תאי גזע עצביים. היא מתרחשת ב<b>היפוקמפוס</b> וב<b>בולבוס ההרחה</b> וממלאת תפקיד בלמידה.`)}${rem("עד תחילת המאה ה־21 רוב החוקרים חשבו שהמוח הבוגר <b>לא משתנה</b>. החלוצים שטענו אחרת ספגו ביקורת, וההכרה הגיעה רק כשהראיות הצטברו.")}`,q:"q1"},
  {h:"תפקיד המוח: לשלוט בתנועה",html:`<p>בעבר נקרא התחום <b>פסיכולוגיה פיזיולוגית</b>. ספר הלימוד הראשון בפסיכולוגיה, של <b>וילהלם וונדט</b> בסוף המאה ה־19, נקרא ״עקרונות הפסיכולוגיה הפיזיולוגית״. התחום נוצר כשחוקרים איחדו את שיטות הניסוי של הפסיכולוגיה עם אלה של הפיזיולוגיה.</p>${def("הייעוד הראשון של מערכת העצבים",`סטודנטים עונים בדרך כלל שהמוח נועד ״לחשוב״ או ״לזכור״. הספר טוען שהייעוד הראשון הוא <b>לשלוט בתנועות</b>, וזה כולל דיבור. תפיסה נועדה לספק מידע כדי שההתנהגות תתאים לצרכים: <b>תפיסה שאין עמה יכולת פעולה אין בה תועלת</b>.`)}${rem("גם חשיבה וזיכרון התפתחו כי הם עזרו לאבותינו <b>לפעול</b> טוב יותר: לבצע התנהגויות מורכבות וללמוד מהניסיון. זה שאפשר ליהנות משקיעה בלי לעשות דבר לא סותר את זה.")}${tiles([["hand","תנועה","כולל דיבור ותקשורת","כל מה שהמוח עושה מגיע לבסוף לידי תנועה: הליכה, אבל גם דיבור ותקשורת, שהם תנועות של שרירי הפה והגרון.","כשג׳רמייה מדבר, המוח שלו מפעיל שרירים בשפתיים, בלשון ובגרון."],["bulb","תפיסה","מידע על הסביבה כדי לפעול","המוח אוסף מידע על הסביבה דרך החושים, כדי לדעת איך לפעול בה. בלי תפיסה, התנועה הייתה ״עיוורת״.","לפני שג׳רמייה תופס כדור, העיניים מעבירות למוח איפה הכדור ובאיזו מהירות הוא מתקרב."],["brain","חשיבה וזיכרון","כלים להתנהגות מועילה","תפיסה ותנועה לא מספיקות. החשיבה והזיכרון עוזרים לבחור איזו תנועה מתאימה למצב, לפי מה שלמדנו בעבר.","ג׳רמייה זוכר שבפעם הקודמת הכדור קפץ מהקיר, ולכן הוא מתמקם במקום אחר."]])}`,q:"q3"},
  {h:"הכללה והעמדה",html:`${def("שני סוגי הסבר",`<mark>הכללה</mark> ${E("generalization")}: מסקנה כללית על סמך תצפיות רבות בתופעות דומות. <mark>העמדה</mark> ${E("reduction")}: הסבר של תופעה מורכבת באמצעות התהליכים הבסיסיים יותר שעומדים ביסודה. מדעני העצב מנסים בעיקר להעמיד: להסביר התנהגות במונחי מנגנונים פיזיולוגיים.`)}${ex(`<b>עכברים בונים קן</b> בשני מצבים: כשקר, וכשהעכברה הרה (גם בלי קשר לטמפרטורה). זו אותה התנהגות, ואותם מנגנונים מפעילים את התנועות. אבל מה שמפעיל אותם שונה: חלק מוח אחד מקבל מידע מחיישני טמפרטורה, וחלק אחר מושפע מהורמוני ההיריון.`)}${def("כשהפיזיולוגיה מרמזת על הפסיכולוגיה",`נזק לאזור שמנתח הגאי דיבור פוגע גם ב<b>כתיב</b>, ולכן זיהוי מילה מדוברת ואיות שלה נשענים על מנגנונים קרובים. נזק במקום אחר פוגע בקריאה בקול של מילים <b>לא מוכרות</b>, אבל לא של מילים מוכרות. מכאן שיש שני מסלולים לקריאה: דרך ההגאים, ודרך זיהוי חזותי של המילה השלמה.`)}${rem("בפועל משתמשים <b>בשתי צורות ההסבר</b>. רעיונות למחקרים באים גם מהכללות על התנהגות וגם מניתוח מנגנונים, ולכן צריך להבין גם פסיכולוגיה וגם פיזיולוגיה.")}`,q:"q5"}
 ]},
 {id:"t2",icon:"scales",title:"הגוף והנפש: מהעת העתיקה עד דקארט",blocks:[
  {h:"דואליזם ומוניזם",html:`${def("שאלת הגוף והנפש",`יש לנו גוף עם שרירים ואיברי חוש, ומערכת עצבים שמקבלת מידע ושולטת בתנועה. מה תפקיד ה<b>נפש</b>? האם היא שולטת במערכת העצבים, היא חלק ממנה, או שהיא רוח בלתי נראית?`)}${tiles([["copies","דואליזם","הגוף גשמי, הנפש לא. שתי ישויות נפרדות","הרעיון שהגוף והנפש הם שני דברים נפרדים: הגוף עשוי חומר, והנפש לא. השאלה הקשה היא איך הם משפיעים זה על זה.","לפי הדואליזם, ״אני״ (הנפש) מחליט להרים יד, ואז הגוף מבצע, כאילו יש שני גורמים נפרדים."],["brain","מוניזם","הכול חומר ואנרגיה. הנפש נוצרת מפעולת מערכת העצבים","הרעיון שיש רק דבר אחד: הכול חומר ואנרגיה. הנפש היא תוצר של פעולת מערכת העצבים. זו העמדה של רוב חוקרי המוח היום.","לפי המוניזם, כשג׳רמייה ״מחליט״ להרים יד, ההחלטה עצמה היא פעילות של נוירונים במוח."]])}${rem("מדעני העצב נוקטים גישה <b>אמפירית, מעשית ומוניסטית</b>. ההנחה: אם נבין איך פועלת מערכת העצבים, נוכל להסביר תפיסה, חשיבה, זיכרון ואפילו מודעות עצמית. מחשבה לבדה לא פתרה את השאלה מאות שנים.")}${fig("timeline")}${def("העת העתיקה",`פפירוס מכ־1700 לפני הספירה מתאר ניתוח של פגועי ראש ואת המוח, נוזל המוח והשדרה והקרומים. תרבויות רבות (מצרים, הודו, סין, יוון) ראו ב<b>לב</b> את מקום המחשבות והרגשות, כי הוא חיוני לחיים ומאיץ ברגש. <b>היפוקרטס</b> ייחס את התפקיד ל<b>מוח</b>. <b>אריסטו</b> חשב שהמוח רק מרסן את ״תאוות הלב״. <b>גאלן</b> לעג לו: אילו כך היה, הטבע לא היה מציב את המוח רחוק מהלב ומחבר אליו את עצבי החישה.`)}`,q:"q7"},
  {h:"דקארט וגלוואני",html:`${who("ד","רנה דקארט","המאה ה־17",`אבי הפילוסופיה המודרנית. ראה בחיות ובגוף האדם <b>מכונות</b>. תנועות אוטומטיות כמו משיכת יד מחום קרא <mark>רפלקסים</mark> ${E("reflex")}: תנועה אוטומטית וסטריאוטיפית בתגובה ישירה לגירוי.`)}${def("החוליה המקשרת",`דקארט היה <b>דואליסט</b>, אבל הראשון שטען שיש קשר בין הנפש למוח. לדעתו המגע מתרחש ב<b>בלוטת האצטרובל</b> ${E("pineal body")}. בחדרי המוח יש נוזל בלחץ, והנפש מטה את הבלוטה כמו ידית ושולחת את הנוזל דרך העצבים, והשרירים ״מתנפחים״ וזזים.`)}${def("מודל",`ההשראה הגיעה מפסלים מתנועעים בגנים המלכותיים ליד פריז, שזזו כשמבקרים דרכו על אריחים נסתרים. <mark>מודל</mark> ${E("model")} הוא מערכת פשוטה יחסית שפועלת לפי עקרונות ידועים ומבצעת חלק ממה שהמערכת המורכבת עושה. בהמשך שימשו כמודלים לוחות מתגים ומחשבים.`)}${rem("היתרון של המודל של דקארט: אפשר היה <b>לבדוק אותו בניסוי</b>, ולכן גם להפריך אותו. <b>לואיג'י גלוואני</b> (המאה ה־18) גירה בחשמל עצב של צפרדע והשריר התכווץ, <b>גם כשהיו מנותקים מהגוף</b>. כלומר, היכולת לזוז נמצאת ברקמה עצמה, ולא בנוזל שהמוח מזרים.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"split",title:"המוח החצוי והמודעות",blocks:[
  {h:"ניתוח חציית המוח",html:`${def("כפיס המוח",`<mark>כפיס המוח</mark> ${E("corpus callosum")} הוא אלומה גדולה של סיבי עצב שמחברת חלקים מקבילים בשתי ה<b>המיספרות</b> ${E("cerebral hemispheres")}. כל המיספרה מקבלת מידע מהצד <b>הנגדי</b> של הגוף ושולטת בו.`)}${def("למה חותכים אותו",`אצל חולים עם <b>אפילפסיה</b> קשה שתרופות לא עוזרות להם, פעילות יתר בצד אחד עוברת דרך הכפיס לצד השני, ושני הצדדים מגרים זה את זה עד התקף מקיף. <mark>ניתוח חציית המוח</mark> ${E("split-brain operation")} חותך את הכפיס ומפחית מאוד את ההתקפים.`)}${def("מה מגלים",`ספרי וגזאניגה חקרו את המנותחים. ברוב האנשים רק ההמיספרה <b>השמאלית</b> שולטת בדיבור. הימנית מבינה דיבור במידה סבירה, אבל <b>לא מדברת</b>. מי שמשוחח עם המנותח מדבר בעצם רק עם ההמיספרה השמאלית.`)}${ex(`מנותחים מספרים שליד <b>שמאל</b> יש ״רצון משלה״: היא מניחה ספר מעניין שהם קוראים, כי ההמיספרה הימנית ששולטת בה לא יודעת לקרוא ומשתעממת. מתואר גם גבר שניסה להכות את אשתו ביד אחת ולהגן עליה ביד האחרת.`)}`,q:"q11"},
  {h:"ניסוי הריח ומשמעותו",html:`${def("ריח הוא יוצא דופן",`בשאר החושים המידע מוצלב, אבל בריח <b>אין הצלבה</b>: נחיר שמאל מגיע להמיספרה השמאלית, ונחיר ימין לימנית.`)}${fig("split","הריח מגיע רק להמיספרה הימנית, ולכן ההמיספרה המדברת לא יודעת עליו")}${ex(`סותמים את הנחיר השמאלי ומגישים ריח לנחיר הימני. המנותח <b>אומר שלא הריח דבר</b>. אבל כשמבקשים ממנו לבחור ביד <b>שמאל</b> חפץ מוסתר, הוא בוחר נכון: פרח פלסטיק לריח פרחים, דג צעצוע לריח דגים, עץ קטן לריח אורן. ביד ימין הוא נכשל, כי היא מחוברת להמיספרה השמאלית שלא הריחה.`)}${rem(`המסקנה: דבר מגיע ל<b>מודעות</b> ${E("consciousness")} רק אם המידע עליו מגיע לאזורי הדיבור בהמיספרה השמאלית. מחקרי המוח החצוי הם דוגמה לגישה ה<b>מוניסטית</b>: ניתוק פיזי בין חלקי מוח מנתק גם את המודעות.`)}`,q:"q13"}
 ]},
 {id:"t4",icon:"flask",title:"מהמאה ה־19 עד היום",blocks:[
  {h:"מילר, פלורנס וברוקה",html:`${who("מ","יוהאנס מילר","המאה ה־19",`תמך בניסויים במקום תצפית ומיון בלבד. ניסח את <mark>הדוקטרינה של אנרגיות עצביות ספציפיות</mark> ${E("specific nerve energies")}: כל העצבים מעבירים <b>אותו סוג</b> של שדר חשמלי, וההבדל בתחושה נקבע לפי <b>העצב שפעיל</b> ואזור המוח שמקבל ממנו. לכן שפשוף עיניים גורם ״לראות״ ניצוצות.`)}${rem("המסקנה מהדוקטרינה: המוח <b>מחולק לפי תפקידים</b>. זה פתח את הדרך לניסויים במוח עצמו.")}${who("פ","פייר פלורנס","המאה ה־19",`הסיר אזורים במוחות של חיות ובדק מה הן כבר לא יכולות לעשות. זו <mark>כריתה ניסויית</mark> ${E("experimental ablation")}. כך מצא אזורים לקצב הלב והנשימה, לתנועה רצונית ולרפלקסים חזותיים ושמיעתיים.`)}${who("ב","פול ברוקה","1861",`יישם את הרעיון באדם, בלי להסיר דבר: נתח אחרי המוות את מוחו של אדם שאיבד את הדיבור משבץ, ומצא נזק באזור בקורטקס ה<b>שמאלי</b> (אזור ברוקה). היום יודעים שהדיבור נשען על אזורים רבים.`)}`,q:"q15"},
  {h:"גירוי חשמלי, מהירות ונוירונים",html:`${tiles([["target","פריץ' והיציג (1870)","גירוי חשמלי בקורטקס של כלב הזיז שרירים בצד הנגדי: הקורטקס המוטורי הראשוני","הם גילו שלאזור מסוים בקורטקס יש תפקיד מסוים: גירוי שלו הזיז שרירים, ודווקא בצד הנגדי של הגוף.","גירוי של הקורטקס בצד שמאל של המוח הזיז את הרגל הימנית של הכלב."],["clock","הלמהולץ","מדד לראשונה מהירות הולכה עצבית: כ־30 מטר בשנייה, לא מהירות האור","הוא מדד לראשונה כמה מהר עובר מסר בעצב, וגילה שהמהירות היא כ־30 מטר בשנייה, הרבה פחות ממה שחשבו. זה הראה שעצב הוא לא ״חוט״ שמעביר משהו מיידי.","בגלל זה יש עיכוב קטן אבל מדיד בין הרגע שנוגעים במשהו חם לבין הרגע שמרגישים אותו."],["hand","פורקינייה","תאי פורקינייה במוחון, סיבי פורקינייה בלב, ייחודיות טביעות אצבע"],["link","רמון אי קחל","מערכת העצבים בנויה מנוירונים נפרדים, ולא מרשת רציפה אחת. נובל 1906","הוא הראה שמערכת העצבים בנויה מתאים נפרדים, הנוירונים. זה הבסיס לכל מה שלומדים היום על תקשורת בין תאים.","כמו בניין שבנוי מלבנים נפרדות, ולא יצוק מגוש אחד."]])}${rem("הממצא של הלמהולץ חשוב: אם ההולכה איטית בהרבה מחשמל בכבל, היא <b>מורכבת יותר משדר חשמלי פשוט</b> (פרק 2). הלמהולץ גם המציא את האופתלמוסקופ וניסח את חוק שימור האנרגיה.")}${def("אזור ברוקה והקורטקס המוטורי",`האזור שברוקה מצא מקושר לחלק בקורטקס המוטורי הראשוני ששולט בשפתיים, בלשון ובגרון, כלומר בשרירי הדיבור.`)}`,q:"q17"},
  {h:"המאה ה־20 וה־21",html:`<p>במאה ה־20 פותחו מגברים רגישים לאותות חלשים, שיטות נוירוכימיות ושיטות היסטולוגיות, והתגלו המסרים החשמליים והכימיים בין נוירונים, נוירוני המראה וטיפולים לדיכאון ולסכיזופרניה.</p>${tiles([["target","נובל 2014","אוקיף ובני הזוג מוזר: מערכות האיכון המרחבי, ״ה־GPS של המוח״","הפרס ניתן על גילוי של תאים במוח שמסמנים לנו איפה אנחנו במרחב, כמו מערכת GPS פנימית.","התאים האלה עוזרים לג׳רמייה למצוא את הדרך מהכיתה לחדר האוכל בלי לחשוב על זה."],["bulb","אופטוגנטיקה","הפעלת נוירונים מסוימים באמצעות אור","שיטה שבה גורמים לנוירונים מסוימים להגיב לאור, ואז מפעילים אותם בדיוק רב. כך בודקים מה התפקיד של כל קבוצת תאים.","חוקרים מאירים על קבוצת תאים במוח של עכבר ובודקים אם ההתנהגות שלו משתנה."],["gear","TMS","גרייה מגנטית חוצת גולגולת לדיכאון ולפרקינסון"],["people","מיזמי ענק","Human Brain Project האירופי ו־BRAIN האמריקני"]])}${def("זוכי נובל לדוגמה",`1906: גולג'י ורמון אי קחל (מבנה מערכת העצבים). 1963: אקלס, הודג'קין והאקסלי (מנגנונים יוניים של ממברנות). 1970: אקסלרוד, כץ ופון אולר (נוירוטרנסמיטרים). 1981: יובל, וייזל וספרי. 2000: קרלסון, גרינגרד וקנדל (תקשורת עצבית).`)}${rem("העמותה למדע העצב (SfN) נוסדה ב־1969 עם 500 חברים, והיום יש בה כ־40,000 חוקרים מיותר מ־90 מדינות. השורשים והעתיד של התחום הם <b>שיתוף פעולה בין־תחומי</b>.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"sprout",title:"ברירה טבעית ואבולוציה של מוחות גדולים",blocks:[
  {h:"פונקציונליזם וברירה טבעית",html:`${def("פונקציונליזם",`<mark>פונקציונליזם</mark> ${E("functionalism")}: הדרך הטובה להבין תופעה ביולוגית היא לשאול <b>איזו תועלת</b> היא מביאה לאורגניזם. למנגנונים אין ״מטרה״ (הם עוצבו ברצף אירועים מקריים, לא בידי מתכנן), אבל יש להם <b>תפקידים</b>.`)}${rem("ההתנהגות עצמה לא עוברת בתורשה. מה שעובר הוא ה־DNA שבונה את <b>המוח</b> שמחולל אותה.")}${def("ברירה טבעית",`<mark>ברירה טבעית</mark> ${E("natural selection")}: תכונות תורשתיות שמעניקות <mark>יתרון בררני</mark> ${E("selective advantage")}, כלומר מגדילות את מספר הצאצאים מעל הממוצע, נעשות שכיחות יותר באוכלוסייה. דרווין נעזר בדוגמה של מגדלים שיצרו זנים בברירה מלאכותית.`)}${def("מוטציות",`<mark>מוטציה</mark> ${E("mutation")} היא שינוי אקראי בכרומוזומים. אם היא בתא זרע או ביצה, היא עוברת לצאצאים. רוב המוטציות לא משפיעות, חלקן מזיקות ומעטות מועילות. דוגמה: מוטציה שגורמת לחיה קטנה <b>לקפוא</b> מול גירוי חדש עוזרת לה להתחמק מטורף.`)}${ex(`אצל <b>ציפורי שיר</b> לזכרים יש אזורי מוח מפותחים ללמידת שירה, שאין לציפורים שלא שרות. במינים שבהם רק הזכר שר האזורים גדולים יותר אצל הזכר, ובמינים ששרים בדואט אין הבדל.`)}`,q:"q21"},
  {h:"מהפרימטים להומו ספיינס",html:`<p><mark>אבולוציה</mark> ${E("evolution")} היא שינוי הדרגתי במבנה ובפיזיולוגיה של מינים בעקבות ברירה טבעית.</p>${tiles([["leaf","פרימטים ראשונים","קטנים, ביערות טרופיים; ידיים אוחזות ועיניים לחזית"],["bulb","ראיית צבעים","להבחין בפרי בשל מול עלווה ירוקה","דוגמה לתכונה שהתפתחה כי היא עזרה לשרוד: היכולת לראות צבעים עוזרת למצוא מזון.","קוף שמבחין בפרי אדום בין העלים יאכל יותר, ויש לו סיכוי טוב יותר לשרוד."],["people","הומינידים","באפריקה, ביערות יבשים ובסוואנה: כלים, אש, ביות כלבים ושפה","אבותינו הקדומים חיו באפריקה, ובתנאים של יערות יבשים וסוואנה פיתחו יכולות חדשות. המוח הגדל עזר להם להתמודד.","השימוש באש ובכלים עזר להם להשיג ולהכין מזון."]])}${def("התאריכים",`הומו ארקטוס יצא מאפריקה לפני כ־<b>1.7 מיליון</b> שנה. הנאנדרתלים חיו באירופה לפני 120,000 עד 30,000 שנה. <b>הומו ספיינס</b> התפתח באפריקה המזרחית לפני כ־<b>200,000</b> שנה.`)}${rem("98.8% מה־DNA של האדם והשימפנזה זהים. זה <b>לא</b> אומר שהתפתחנו מהשימפנזה: שני המינים התפצלו מאותו ענף בזמנים שונים.")}`,q:"q23"},
  {h:"למה מוח גדול ומה קובע אינטליגנציה",html:`${def("המגבלה של הלידה",`הליכה זקופה הגבילה את <b>תעלת הלידה</b>, ולכן ראש התינוק לא יכול להיות גדול יותר. המוח ממשיך לגדול אחרי הלידה, והיונקים זקוקים ל<b>טיפול הורי</b> ממושך. כך נוצר מוח גדול עם מעגלים שמשתנים בעקבות ניסיון, כמו ״מחשב רב־תכליתי״.`)}${def("נאוטניה",`<mark>נאוטניה</mark> ${E("neoteny")}: האטה של ההתבגרות שמשאירה יותר זמן לגדילה. בלידה המוח שוקל כ־350 גרם ויש בו כמאה מיליארד נוירונים. בבגרות הוא שוקל כ־1.4 ק״ג, פי ארבעה. כמעט לא נוצרים נוירונים חדשים, אבל הקשרים צומחים ותאי התמך מתחלקים.`)}${tiles([["chart","יחס לגוף?","אדם 2.3%, פיל 0.2%, אבל חדף 3.3%. היחס לבדו לא מסביר"],["brain","מה כן קובע","מספר הנוירונים שזמינים ללמידה, זיכרון ותכנון, ולא לשרירים ולחושים"],["data","צפיפות","בפרימטים יש יותר נוירונים לכל גרם מאשר במכרסמים"]])}`,q:"q25"}
 ]},
 {id:"t6",icon:"check",title:"אתיקה, קריירה ודרכי למידה",blocks:[
  {h:"מחקר בבעלי חיים",html:`${def("למה חיות",`אנחנו משתמשים בחיות למזון, לפרוות וכחיות מחמד. הספר טוען שמחקר הוא השימוש <b>היחיד שאין לו תחליף</b>: בלעדיו לא נבין מחלות ולא נטפל בהן. גידול חיות מחמד אפילו לא דורש אישור או ביקורת, בניגוד למדענים.`)}${def("הפיקוח",`בארה״ב כל מוסד שמבקש מימון ממשלתי צריך ועדה, <b>IACUC</b> ${E("Institutional Animal Care and Use Committee")}, עם וטרינרים, מדענים, חברים שאינם מדענים וחבר מחוץ למוסד. גם מחקר תצפית לא פולשני חייב אישור. בישראל: <b>חוק צער בעלי חיים (ניסויים בבעלי חיים) תשנ״ד־1994</b> ומועצה של 23 חברים שממנה שר הבריאות. לא מאשרים ניסוי אם יש חלופה, ומגבילים את מספר החיות.`)}${ex(`מחקר בסיסי על תקשורת בין נוירונים הראה שתרופה שמעכבת סוג מסוים של תקשורת עצבית, אם ניתנת לפני חסימת כלי דם, מונעת נזק מוחי. כדי לבדוק זאת צריך לסתום כלי דם בחולדות מורדמות ולבדוק את מוחן.`)}${rem("תרביות תאים והדמיות מחשב <b>לא מחליפות</b> יצורים חיים: אי אפשר לבדוק התמכרות בתרבית, ואי אפשר לתכנת מחשב שיחקה מערכת עצבים שעוד לא מבינים.")}`,q:"q27"},
  {h:"מחקר בבני אדם",html:`${def("הפיקוח",`<b>IRB</b> ${E("Institutional Review Board")} מקביל ל־IACUC. דרישות מרכזיות: <b>הסכמה מדעת</b> (הסבר על מהלך המחקר, איסוף הנתונים ושמירתם, התרומה והנזק האפשרי) ו<b>שמירת סודיות</b>.`)}${ex(`<b>שבט ההוואסופאי נגד אריזונה</b> (הסדר ב־2010): דגימות דם שנאספו למחקר על <b>סוכרת</b> שימשו אחר כך למחקר על <b>סכיזופרניה</b> בלי הסכמה מתאימה. הדגימות הוחזרו והשבט קיבל פיצוי של 700,000 דולר.`)}${def("נוירואתיקה",`ענף שעוסק בהשלכות האתיות של מחקר המוח. דוח מ־2014 בדק: הדמיה מוחית ופרטיות, דמנציה ושינויי אישיות, העצמה קוגניטיבית והוגנות, וגרייה חוצת גולגולת. ההמלצה: לשלב אתיקה ומדע בכל רמות החינוך.`)}`,q:"q29"},
  {h:"קריירה ודרכי למידה",html:`${def("השמות והתחומים",`<b>מדעני עצב והתנהגות</b> ${E("behavioral neuroscientists")} חוקרים את הפיזיולוגיה של ההתנהגות, בעיקר בחיות מעבדה. שמות קודמים: פסיכולוגיה פיזיולוגית, פסיכוביולוגיה, ביופסיכולוגיה. <b>נוירולוגים</b> הם רופאים שמאבחנים ומטפלים. <b>מדע העצב הקוגניטיבי</b> חוקר בני אדם, לרוב בהדמיה.`)}${rem("חוקר עצמאי צריך דוקטורט (Ph.D. או M.D.), ואחריו בדרך כלל כשנתיים של <b>פוסט־דוקטורט</b>. טכנאי מחקר עם תואר ראשון או שני עושים עבודה חשובה בלי דוקטורט.")}${tiles([["doc","סיכום פעיל","לקשר לידע קודם. הדגשה וקו תחתון לא משפרים ציון"],["people","ללמד אחרים","מי שהתכונן ללמד הצליח יותר במבחן","מי שמתכונן ללמד חומר לאחרים מארגן אותו טוב יותר בראש, ולכן זוכר ומבין אותו טוב יותר.","לפני המבחן, הסבירו לחבר את הפרק כאילו אתם המרצה. כך תגלו מה עוד לא ברור לכם."],["id","סביבת המבחן","למידה תלוית מצב: צוללנים זכרו טוב יותר באותה סביבה","זיכרון קשור לסביבה שבה למדנו. כשהסביבה בזמן המבחן דומה לסביבת הלמידה, קל יותר להיזכר. זו למידה תלוית מצב.","צוללנים שלמדו מילים מתחת למים זכרו אותן טוב יותר כשנבחנו מתחת למים מאשר על החוף."],["clock","ריווח","כמה פרקי זמן קצרים עדיפים על אחד ארוך","זוכרים טוב יותר כשמחלקים את הלמידה לכמה פעמים קצרות, עם הפסקות ביניהן, מאשר כשלומדים הכול בבת אחת.","ג׳רמייה לומד 20 דקות בכל יום במשך שבוע, במקום שעתיים בלילה שלפני המבחן."],["x","בלי הסחות","מי שנדרש לשים לב לטלוויזיה הצליח הכי פחות","הקשב מוגבל. כשמנסים לעשות שני דברים, הלמידה נפגעת, ולכן כדאי ללמוד בלי הסחות.","ג׳רמייה מכבה את הטלוויזיה ומניח את הטלפון בחדר אחר לפני שהוא מתחיל ללמוד."],["bulb","עזרי זיכרון","שיטת המיקום, ראשי תיבות ואקרוסטיכון","שיטות שמחברות מידע חדש למשהו שקל לזכור: מקום מוכר, ראשי תיבות או משפט.","כדי לזכור רשימה, ג׳רמייה מדמיין כל פריט בחדר אחר בבית שלו, ואז ״עובר״ בדמיון בין החדרים."]])}${ex(`<b>ראשוניות ואחרוניות</b>: זוכרים בעיקר את מה שבא ראשון ואחרון. לכן כדאי ללמוד את החומר הקשה בהתחלה או בסוף, ואת המוכר באמצע.`)}`,q:"q31"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"לפי ההיגיון של טיפול בתנועה מאולצת, למה ג'רמייה התקשה להזיז את ידו הימנית גם עשרות שנים אחרי השבץ?","a":"כי לא השתמש בה, ופחות תאי מוח הוקדשו להנעתה","w":["כי הנוירונים בצד ימין של מוחו מתו לגמרי","כי היד השמאלית שלו שלטה גם בצד ימין","כי מוח בוגר לא יכול ליצור קשרים חדשים"],"e":"הטיפול מבוסס על ההנחה שהשיתוק נשמר בגלל היעדר שימוש באיבר ומיעוט תאי מוח שמוקדשים לו, ולכן מאלצים שימוש. ההצלחה שלו סותרת דווקא את הטענה שמוח בוגר לא יוצר קשרים חדשים."},{"q":"למה שמו לג'רמייה כפפה על היד השמאלית?","a":"כדי לאלץ אותו להשתמש ביד הימנית הפגועה","w":["כדי להגן על היד השמאלית מפציעות בנפילות","כדי לחסום תחושה שמבלבלת את ההמיספרה השמאלית","כי השבץ פגע ביד השמאלית שלו"],"e":"השבץ פגע בצד שמאל של המוח ולכן בצד ימין של הגוף. הכפפה על היד הבריאה מאלצת שימוש ביד הפגועה, וזה מה שמעורר את השינוי במוח."}]},
"q2":{"t":"t1","v":[{"q":"איפה, לפי הפרק, מתרחשת נוירוגנזה במוח הבוגר?","a":"בהיפוקמפוס ובבולבוס ההרחה","w":["בקורטקס המוטורי ובמוחון","בכל אזורי הקורטקס באופן שווה","רק במוח השדרה אחרי פציעה"],"e":"נוירוגנזה, יצירת נוירונים חדשים מחלוקת תאי גזע עצביים, מתוארת בהיפוקמפוס ובבולבוס ההרחה, ויש לה תפקיד בלמידה. היא לא מתרחשת באופן שווה בכל הקורטקס."},{"q":"מה ההבדל בין פלסטיות לנוירוגנזה?","a":"פלסטיות היא שינוי כללי במוח; נוירוגנזה היא יצירת נוירונים חדשים","w":["פלסטיות היא יצירת נוירונים חדשים; נוירוגנזה היא יצירת קשרים","פלסטיות קורית רק בילדות; נוירוגנזה קורית רק בבגרות","אין הבדל, אלה שני שמות לאותו תהליך במוח הבוגר"],"e":"פלסטיות היא היכולת הכללית של המוח להשתנות עם הזמן, למשל ביצירת קשרים חדשים. נוירוגנזה היא מקרה מיוחד: יצירת נוירונים חדשים מחלוקה של תאי גזע."}]},
"q3":{"t":"t1","v":[{"q":"מהו לפי הספר הייעוד הראשון במעלה של מערכת העצבים?","a":"לשלוט בתנועות, כולל דיבור","w":["לחשוב ולשקול בהיגיון","לאחסן זיכרונות לאורך זמן","לקלוט ולפרש מידע חושי"],"e":"הספר טוען שתפיסה, חשיבה וזיכרון התפתחו כי הם משרתים פעולה. לכן הייעוד הראשון הוא שליטה בתנועה, וגם דיבור הוא תנועה."},{"q":"מה מסביר את המשפט ״תפיסה שאין עמה יכולת פעולה אין בה תועלת״?","a":"התפיסה התפתחה כדי לכוון התנהגות מותאמת","w":["תפיסה ותנועה מתרחשות באותם אזורים במוח","אנשים לא מסוגלים ליהנות מגירויים בלי לזוז","התפיסה היא הייעוד הראשון של המוח"],"e":"לפי הספר תפקיד התפיסה הוא לתת מידע כדי שההתנהגות תהיה מותאמת לצרכים. זה שאפשר ליהנות משקיעה בלי לפעול לא סותר את זה, כי הכושר התפתח בשביל פעולה."}]},
"q4":{"t":"t1","v":[{"q":"מי כתב את ספר הלימוד הראשון בפסיכולוגיה, ״עקרונות הפסיכולוגיה הפיזיולוגית״?","a":"וילהלם וונדט","w":["יוהאנס מילר","הרמן פון הלמהולץ","צ'ארלס דרווין"],"e":"וונדט כתב את הספר בסוף המאה ה־19, ולכן התחום נקרא בעבר פסיכולוגיה פיזיולוגית. מילר והלמהולץ היו פיזיולוגים בני אותה תקופה, אבל לא כתבו את הספר הזה."},{"q":"איך נוצר תחום מדע העצב וההתנהגות?","a":"מאיחוד שיטות הניסוי של הפסיכולוגיה עם אלה של הפיזיולוגיה","w":["מהפרדה בין הפסיכולוגיה לבין הרפואה והפיזיולוגיה","מתצפיות בהתנהגות של חיות בסביבתן הטבעית בלבד","מפיתוח מחשבים שחיקו את פעולת המוח האנושי"],"e":"התחום התפתח כשחוקרים שילבו את הניסוי הפסיכולוגי עם שיטות פיזיולוגיות ויישמו אותן לשאלות על התנהגות. תצפיות ומחשבים תרמו, אבל לא הם הגדירו את התחום."}]},
"q5":{"t":"t1","v":[{"q":"חוקר מסביר את התכווצות השריר באמצעות תנועת יונים בממברנה. איזה סוג הסבר זה?","a":"העמדה","w":["הכללה","פונקציונליזם","דואליזם"],"e":"העמדה מסבירה תופעה מורכבת באמצעות תהליכים בסיסיים שעומדים ביסודה, כמו תנועת יונים. הכללה הייתה מסקנה כללית מתצפיות רבות בהתנהגות, בלי לרדת למנגנון."},{"q":"חוקרת מסיקה מתצפיות רבות שחולדות לומדות מהר יותר כשהתגמול מיידי. איזה סוג הסבר זה?","a":"הכללה","w":["העמדה","כריתה ניסויית","מודל מכני"],"e":"הכללה היא מסקנה כללית על סמך תצפיות רבות בתופעות דומות. היא לא העמדה, כי לא מוסבר כאן איזה מנגנון פיזיולוגי עומד מאחורי הלמידה."}]},
"q6":{"t":"t1","v":[{"q":"מה מלמדת הדוגמה של עכברים שבונים קן?","a":"אותה התנהגות יכולה לנבוע ממנגנונים פיזיולוגיים שונים","w":["כל התנהגות נשלטת על ידי אזור מוח אחד בלבד","הורמונים לא משפיעים על התנהגות של עכברים בכלל","בניית קן נלמדת מהאם ולא קשורה לפיזיולוגיה"],"e":"עכברים בונים קן גם כשקר וגם בהיריון. התנועות זהות, אבל חלק מוח אחד מגיב לחיישני טמפרטורה וחלק אחר להורמונים, ולכן ההתנהגות לא מעידה על מנגנון אחד."},{"q":"נזק לאזור שמנתח הגאי דיבור פוגע גם בכתיב. מה אפשר להסיק?","a":"זיהוי מילה מדוברת ואיות נשענים על מנגנונים קרובים","w":["כתיב וקריאה בקול הם בדיוק אותו תהליך במוח","הכתיב נשלט רק על ידי אזורים מוטוריים של היד","הנזק מעיד שהחולה איבד את המודעות למילים"],"e":"זו דוגמה למקרה שבו מנגנון פיזיולוגי מרמז על הארגון הפסיכולוגי: אם נזק אחד פוגע בשתי יכולות, הן כנראה חולקות מנגנון. אין סיבה להסיק שהן זהות לגמרי."}]},
"q7":{"t":"t2","v":[{"q":"מה מאפיין את הגישה של מדעני העצב לשאלת הגוף והנפש?","a":"גישה מוניסטית: הנפש נוצרת מפעולת מערכת העצבים","w":["גישה דואליסטית: הנפש היא ישות לא גשמית","גישה פילוסופית: אפשר לפתור את השאלה בחשיבה בלבד","גישה של דקארט: המגע מתרחש באצטרובל"],"e":"מדעני העצב נוקטים גישה אמפירית ומוניסטית ומניחים שהבנת מערכת העצבים תסביר גם את הנפש. דואליזם רואה בנפש דבר נפרד מהגוף, וזו בדיוק העמדה שהם דוחים."},{"q":"מה הטענה של הדואליזם?","a":"הגוף גשמי, אבל הנפש אינה גשמית","w":["הכול חומר ואנרגיה","הנפש היא תוצר של פעילות המוח","הלב והמוח חולקים את תפקידי הנפש"],"e":"דואליזם הוא האמונה במהות כפולה: גוף חומרי ונפש לא חומרית. הטענה שהנפש היא תוצר של המוח היא מוניזם."}]},
"q8":{"t":"t2","v":[{"q":"איך הגיב גאלן לטענת אריסטו שהמוח רק מרסן את הלב?","a":"טען שאילו כך היה, הטבע לא היה מרחיק את המוח מהלב","w":["הסכים איתו והוסיף שתפקיד המוח הוא לקרר את הדם","טען שהלב והמוח חולקים את תפקידי הנפש בשווה","טען שהנפש נמצאת בבלוטת האצטרובל שבמרכז המוח"],"e":"גאלן, שהעריך את אריסטו, כינה את הטענה מגוחכת: המיקום של המוח והעובדה שעצבי החישה מגיעים אליו מעידים על תפקידו. האצטרובל הוא הרעיון של דקארט, מאות שנים אחר כך."},{"q":"מדוע תרבויות עתיקות רבות ראו בלב את מקום המחשבות והרגשות?","a":"כי פעימותיו חיוניות לחיים וקצבו עולה ברגש","w":["כי ניתוחים בעת העתיקה הראו שאין למוח עצבים","כי היפוקרטס, הרופא המפורסם, טען כך במפורש","כי הלב הוא האיבר הגדול והכבד ביותר בגוף"],"e":"הלב חיוני לחיים ומגיב לרגשות, ולכן נראה כמקום טבעי לנפש. היפוקרטס דווקא היה זה שייחס את התפקיד למוח."}]},
"q9":{"t":"t2","v":[{"q":"לפי דקארט, איך הנפש מזיזה את הגוף?","a":"היא מטה את בלוטת האצטרובל, שמזרימה נוזל בלחץ דרך העצבים לשרירים","w":["היא שולחת דחפים חשמליים דרך העצבים אל השרירים","היא מפעילה רפלקסים במוח השדרה בלבד, בלי המוח","היא משנה את קצב הלב, וזה מזיז את השרירים"],"e":"דקארט דימה את המוח למערכת הידראולית: האצטרובל פועל כמו ידית ששולחת נוזל לשרירים. הרעיון של דחפים חשמליים הגיע מאוחר יותר, מגלוואני."},{"q":"מה היה היתרון המדעי של המודל של דקארט?","a":"אפשר היה לבדוק אותו בניסוי, ולכן גם להפריך אותו","w":["הוא היה נכון ברובו ואושר בניסויים מאוחרים","הוא הסביר לראשונה איך נוצרת המודעות","הוא התבסס על ניתוחים של מוחות אדם אחרי המוות"],"e":"בניגוד לסברות פילוסופיות, המודל ניבא דברים שאפשר לבדוק, וזה מה שאפשר את הפרכתו. הוא לא היה נכון, ולא הסביר את המודעות."}]},
"q10":{"t":"t2","v":[{"q":"איזה ממצא של גלוואני הפריך את דקארט?","a":"שריר צפרדע התכווץ מגירוי חשמלי לעצב, גם במנותק מהגוף","w":["המוח מכיל חדרים מלאי נוזל שנמצא בלחץ","עצבים מעבירים מסרים במהירות של האור","הנפש מפוזרת בכל חלקי המוח ולא באצטרובל"],"e":"אם שריר ועצב מנותקים זזים מגירוי חשמלי, היכולת לזוז נמצאת ברקמה עצמה ולא בנוזל שהמוח מזרים. חדרי המוח היו דווקא חלק מהמודל של דקארט."},{"q":"מהו מודל במדע, לפי הפרק?","a":"מערכת פשוטה שמבצעת חלק ממה שהמערכת המורכבת עושה","w":["תיאור מילולי מלא ומדויק של כל חלקי המוח","תוצאה של ניסוי אחד שחוזרת בכל המעבדות","השערה פילוסופית שאי אפשר לבדוק בניסוי"],"e":"מודל כמו הפסלים המתנועעים, לוח המתגים או המחשב מחקה רק חלק מהתפקודים, ויתרונו בכך שאפשר לבדוק אותו. הוא לא תיאור מלא ולא השערה שאי אפשר לבחון."}]},
"q11":{"t":"t3","v":[{"q":"למה מבצעים ניתוח לחציית המוח?","a":"לטיפול באפילפסיה קשה שהתרופות לא עוזרות לה","w":["לטיפול בשבץ בהמיספרה השמאלית","כדי לשפר את היכולת לדבר","כדי לחקור את המודעות אצל אנשים בריאים"],"e":"בחולים כאלה פעילות יתר בצד אחד עוברת דרך כפיס המוח ומגרה את הצד השני עד התקף מקיף. חיתוך הכפיס מפחית את ההתקפים; המחקר על המודעות הוא תוצר לוואי."},{"q":"מה תפקידו של כפיס המוח?","a":"לחבר בין אזורים מקבילים בשתי ההמיספרות","w":["לחבר את המוח אל מוח השדרה ואל שאר הגוף","לשלוט בדיבור ובקריאה בהמיספרה השמאלית","להעביר מידע מהעיניים אל קורטקס הראייה"],"e":"כפיס המוח הוא אלומת סיבים שמאפשרת לשתי ההמיספרות לחלוק מידע. הוא לא שולט בדיבור בעצמו ולא מחבר למוח השדרה."}]},
"q12":{"t":"t3","v":[{"q":"מנותח חצוי מוח מניח ביד שמאל ספר שהוא קורא בעניין. למה?","a":"ההמיספרה הימנית, ששולטת ביד שמאל, לא יודעת לקרוא","w":["ההמיספרה השמאלית, ששולטת ביד שמאל, עייפה מהקריאה","היד השמאלית משותקת חלקית מאז הניתוח","ההמיספרה הימנית לא מקבלת שום מידע חזותי"],"e":"כל המיספרה שולטת בצד הנגדי, ולכן יד שמאל נשלטת בידי הימנית. הימנית רואה, אבל לא קוראת, ולכן הספר לא מעניין אותה."},{"q":"ברוב האנשים, מה נכון לגבי ההמיספרה הימנית?","a":"מבינה דיבור במידה סבירה, אבל לא מסוגלת לדבר","w":["שולטת בדיבור ובקריאה, כמו השמאלית","לא מבינה שפה בכלל, גם לא מילים בודדות","שולטת ביד ימין ובצד ימין של הגוף"],"e":"הדיבור נשלט ברוב האנשים בידי ההמיספרה השמאלית. הימנית מבינה מילים במידה סבירה, אבל לא מפיקה דיבור, ושולטת ביד שמאל."}]},
"q13":{"t":"t3","v":[{"q":"מגישים ריח לנחיר הימני של מנותח חצוי מוח. מה יקרה?","a":"יאמר שלא הריח דבר, אבל יד שמאל תבחר חפץ מתאים","w":["יזהה את הריח בקול, אבל יד שמאל תבחר באקראי","יאמר שלא הריח דבר, ויבחר נכון רק ביד ימין","יזהה את הריח בקול ויבחר נכון בשתי הידיים"],"e":"בריח אין הצלבה, ולכן הנחיר הימני מגיע להמיספרה הימנית. היא מזהה ושולטת ביד שמאל, אבל אין לה דיבור, וההמיספרה המדברת לא קיבלה את הריח."},{"q":"מה מיוחד בחוש הריח לעומת שאר החושים?","a":"אין בו הצלבה: כל נחיר מגיע להמיספרה שבאותו צד","w":["הוא מגיע לשתי ההמיספרות באותה מידה בדיוק","הוא נקלט רק בהמיספרה השמאלית, בשני הנחיריים","הוא לא עובר דרך הקורטקס אלא דרך מוח השדרה"],"e":"בשאר החושים כל צד של הגוף מיוצג בהמיספרה הנגדית. בריח הנחיר השמאלי מגיע לשמאלית והימני לימנית, וזה מה שמאפשר את הניסוי."}]},
"q14":{"t":"t3","v":[{"q":"מה המסקנה העיקרית ממחקרי המוח החצוי לגבי המודעות?","a":"מודעות דורשת שהמידע יגיע לאזורי הדיבור שבצד שמאל","w":["כל המיספרה היא אדם נפרד עם מודעות מלאה משלו","המודעות נמצאת בכפיס המוח, ולכן החיתוך מבטל אותה","הנפש לא תלויה בחיבורים הפיזיים שבין חלקי המוח"],"e":"כשמידע מגיע רק לימנית, האדם פועל לפיו אבל לא מדווח שהוא מודע לו. זו תמיכה בגישה המוניסטית, ולא בטענה שהמודעות לא תלויה בחיבורים."},{"q":"איך מחקרי המוח החצוי קשורים לשאלת הגוף והנפש?","a":"הם תומכים במוניזם, כי ניתוק פיזי במוח מנתק גם את המודעות","w":["הם תומכים בדואליזם, כי ההמיספרות פועלות בנפרד","הם מוכיחים שדקארט צדק בעניין בלוטת האצטרובל","הם לא קשורים לשאלת הגוף והנפש בשום צורה"],"e":"אם חיתוך אלומת סיבים משנה את מה שהאדם מודע לו, המודעות תלויה במבנה הפיזי של המוח. הספר מציג אותם כדוגמה לגישה המוניסטית."}]},
"q15":{"t":"t4","v":[{"q":"מה טוענת הדוקטרינה של אנרגיות עצביות ספציפיות?","a":"כל העצבים מעבירים אותו סוג שדר, וסוג התחושה נקבע לפי העצב שפעיל","w":["לכל חוש יש סוג אחר של דחף חשמלי משלו","עוצמת הגירוי היא שקובעת איזה סוג תחושה נרגיש","רק עצבי הראייה מעבירים מידע בדחפים חשמליים"],"e":"מילר הבחין שהשדר זהה בכל העצבים, ולכן ההבדל בין ראייה לשמיעה נובע מהערוץ ומאזור המוח שמקבל אותו. מכאן שגם לחץ מכני על העין יורגש כאור."},{"q":"אדם משפשף את עיניו ורואה ניצוצות. מה מסביר זאת?","a":"הדוקטרינה של אנרגיות עצביות ספציפיות","w":["הכריתה הניסויית שפיתח פייר פלורנס","תורת הברירה הטבעית של צ'ארלס דרווין","הפלסטיות של המוח והיכולת שלו להשתנות"],"e":"הגירוי המכני מפעיל את עצב הראייה, ואזור המוח שמקבל ממנו מפרש כל פעילות כאור. זה בדיוק הרעיון של מילר, ולא קשור לכריתה או לברירה טבעית."}]},
"q16":{"t":"t4","v":[{"q":"במה נבדלה העבודה של ברוקה מזו של פלורנס?","a":"ברוקה בדק מוח שניזוק משבץ, ופלורנס הסיר אזורים בחיות","w":["ברוקה הסיר אזורים במוח אדם, ופלורנס חקר אנשים פגועים","ברוקה השתמש בגירוי חשמלי, ופלורנס בכריתה ניסויית","שניהם חקרו רק חיות, אבל בשיטות שונות זו מזו"],"e":"פלורנס יצר כריתה ניסויית בחיות. ברוקה יישם את אותו היגיון באדם, בלי להסיר דבר, על ידי בדיקה של מוח שנפגע משבץ. גירוי חשמלי היה השיטה של פריץ' והיציג."},{"q":"מה מצא ברוקה ב־1861?","a":"שנזק בקורטקס השמאלי פוגע בדיבור","w":["שגירוי חשמלי בקורטקס מזיז את הצד הנגדי","שמהירות ההולכה העצבית כ־30 מטר בשנייה","שהמוח בנוי מנוירונים נפרדים ולא מרשת"],"e":"ברוקה נתח את מוחו של אדם שאיבד את הדיבור ומצא נזק בצד שמאל, באזור שנקרא היום על שמו. המהירות היא ממצא של הלמהולץ, והנוירונים הנפרדים של רמון אי קחל."}]},
"q17":{"t":"t4","v":[{"q":"מה הראה הממצא של הלמהולץ על מהירות ההולכה העצבית?","a":"שההולכה איטית מזרם בכבל, ולכן מורכבת יותר","w":["שההולכה מהירה כמו האור, כמו בכבל חשמלי","שההולכה היא בעצם זרימת נוזל בתוך העצבים","שאין שום קשר בין חשמל לבין פעילות העצבים"],"e":"הלמהולץ מדד כ־30 מטר בשנייה, בעוד שקודמיו חשבו שהמהירות קרובה למהירות האור. הפער מראה שזה לא רק זרם בכבל, אבל ההולכה עדיין חשמלית ולא זרימת נוזל."},{"q":"מה גילו פריץ' והיציג כשגירו בחשמל את הקורטקס של כלב?","a":"גירוי בנקודות מסוימות גרם להתכווצות שרירים בצד הנגדי","w":["גירוי בכל נקודה גרם להתכווצות בשני צידי הגוף","הגירוי עצר לרגע את פעימות הלב של הכלב","הגירוי גרם לכלב להשמיע קולות ולנבוח"],"e":"הם מצאו את מה שנקרא היום הקורטקס המוטורי הראשוני, ששולט בשרירים בצד הנגדי של הגוף. התוצאה לא הייתה כללית לכל נקודה ולא בשני הצדדים."}]},
"q18":{"t":"t4","v":[{"q":"מה טען רמון אי קחל על מבנה מערכת העצבים?","a":"שהיא בנויה ממיליארדי נוירונים נפרדים","w":["שהיא רשת רציפה אחת של סיבים מחוברים","שהיא בנויה מתאי תמך בלבד, בלי נוירונים","שהיא זהה לחלוטין אצל כל היונקים"],"e":"קחל השתמש בצביעת גולג'י וצייר נוירונים בודדים, וטען נגד הדעה המקובלת אז שהמערכת היא רשת רציפה. על כך קיבל את פרס נובל ב־1906."},{"q":"מה מכונה ״ה־GPS של המוח״?","a":"מערכות האיכון המרחבי (נובל 2014)","w":["הקורטקס המוטורי שגילו פריץ' והיציג","כפיס המוח שמחבר את שתי ההמיספרות","אזור ברוקה, שמתכנן את תנועות הדיבור"],"e":"ב־2014 הוענק פרס נובל על גילוי מערכות במוח שמייצגות מיקום במרחב. האזורים האחרים קשורים לתנועה, לחיבור בין ההמיספרות ולדיבור."}]},
"q19":{"t":"t4","v":[{"q":"מהי אופטוגנטיקה?","a":"שיטה להפעלת נוירונים מסוימים באמצעות אור","w":["גרייה מגנטית חוצת גולגולת","הדמיה ממוחשבת של המוח כולו","צביעה של נוירונים לצורך ראייה במיקרוסקופ"],"e":"באופטוגנטיקה בוררים נוירונים ומפעילים אותם באור כדי לבדוק את ההשפעה על ההתנהגות. גרייה מגנטית היא TMS, שיטה אחרת."},{"q":"מה מסביר את הצמיחה של העמותה למדע העצב מ־500 חברים ב־1969 לכ־40,000 היום?","a":"התחום הוא בין־תחומי ומשלב חוקרים מתחומים רבים","w":["התחום מוגבל לרופאים נוירולוגים בבתי חולים","התחום עוסק רק במחקר בבני אדם, בלי חיות","רוב החברים בעמותה הם פילוסופים של הנפש"],"e":"הספר מדגיש שהשורשים והעתיד של התחום הם בשיתוף פעולה בין ביולוגיה, כימיה, הנדסה, פסיכולוגיה ופיזיקה. התחום לא מוגבל לרופאים או לבני אדם."}]},
"q20":{"t":"t4","v":[{"q":"על מה זכו הודג'קין והאקסלי בפרס נובל ב־1963?","a":"על המנגנונים היוניים של ממברנות","w":["על גילוי הנוירוטרנסמיטרים במוח","על תיאור המבנה של מערכת העצבים","על גילוי מערכות האיכון במוח"],"e":"לפי טבלת הזוכים, ב־1963 הפרס ניתן על המנגנונים היוניים של ממברנות. הנוירוטרנסמיטרים זכו ב־1970, ומבנה מערכת העצבים ב־1906."},{"q":"מה משותף לגולג'י ולרמון אי קחל?","a":"שניהם זכו בנובל ב־1906 על מבנה מערכת העצבים","w":["שניהם טענו שמערכת העצבים היא רשת רציפה","שניהם גילו את האזור שאחראי לדיבור","שניהם מדדו את מהירות ההולכה העצבית"],"e":"שניהם זכו יחד ב־1906, אף שקחל טען נגד רעיון הרשת הרציפה. אזור הדיבור הוא של ברוקה, והמהירות של הלמהולץ."}]},
"q21":{"t":"t5","v":[{"q":"מה טוען הפונקציונליזם?","a":"תופעה ביולוגית מובנת דרך התועלת שלה לאורגניזם","w":["לכל מנגנון ביולוגי יש מטרה שתוכננה מראש","ההתנהגות עוברת בתורשה ישירות מההורים לצאצאים","תכונות מועילות נוצרות ברגע שהאורגניזם זקוק להן"],"e":"הפונקציונליזם שואל מה התפקיד של תכונה. הספר מדגיש שלמנגנונים אין מטרה מתוכננת, כי הם עוצבו ברצף מקרי, ושההתנהגות עצמה לא עוברת בתורשה."},{"q":"מה, לפי הפרק, עובר בתורשה כשמדברים על התנהגות?","a":"ה־DNA שבונה את המוח שמחולל את ההתנהגות","w":["ההתנהגות עצמה, כפי שההורה ביצע אותה","הזיכרונות של ההורים","שום דבר, ההתנהגות נלמדת תמיד"],"e":"ההתנהגות לא עוברת ישירות. מה שעובר הוא החומר התורשתי שמכוון את בניית הגוף והמוח, וההתנהגות רחוקה מהמקור הגנטי עוד יותר מהמוח."}]},
"q22":{"t":"t5","v":[{"q":"מוטציה גורמת לחיה קטנה לקפוא מול גירוי חדש. למה היא עשויה להפוך לשכיחה?","a":"היא מגדילה את הסיכוי לשרוד ולהעמיד צאצאים","w":["כי כל מוטציה מועילה לאורגניזם בדרך כלשהי","כי החיה לומדת ומעבירה את ההתנהגות לצאצאיה","כי מוטציות קורות בכוונה כשהסביבה משתנה"],"e":"מוטציה שמקטינה את הסיכוי להיתפס בידי טורף מגדילה את מספר הצאצאים, ולכן הגן מתפשט. רוב המוטציות לא מועילות, והן אקראיות ולא מכוונות."},{"q":"מה מלמדת ההשוואה בין מיני ציפורי שיר?","a":"כשרק הזכר שר, האזורים גדולים יותר אצלו","w":["לכל ציפורי השיר יש אזורי שירה זהים בגודלם","אזורי השירה תמיד גדולים יותר אצל הנקבות","גודל אזורי השירה לא קשור להתנהגות של המין"],"e":"המבנה המוחי תואם את ההתנהגות של המין: כשרק הזכר שר, לזכר יש אזורים גדולים יותר, וכשגם הנקבה שרה ההבדל נעלם. זו הדגמה לאדפטציה במבנה המוח."}]},
"q23":{"t":"t5","v":[{"q":"מה היה כנראה היתרון המקורי של ראיית צבעים בפרימטים?","a":"להבחין בפרי בשל על רקע עלווה ירוקה","w":["לזהות בני זוג פוטנציאליים גם בלילה","להבחין בין שעות היום לשעות הלילה","לראות טורפים מתקרבים בחושך"],"e":"הספר קושר את האבולוציה של עצי פרי לפרימטים אוכלי פירות: ראיית צבע עזרה למצוא פרי בשל לפני שירקב או שחיה אחרת תגיע אליו."},{"q":"מתי ואיפה התפתח הומו ספיינס, לפי הפרק?","a":"באפריקה המזרחית, לפני כ־200,000 שנה","w":["באירופה המערבית, לפני כ־120,000 שנה","באסיה, לפני כ־1.7 מיליון שנה","באפריקה המזרחית, לפני כ־1.7 מיליון שנה"],"e":"לפני 1.7 מיליון שנה יצא מאפריקה הומו ארקטוס, ובאירופה המערבית חיו הנאנדרתלים. הומו ספיינס התפתח באפריקה המזרחית לפני כ־200,000 שנה."}]},
"q24":{"t":"t5","v":[{"q":"מה נכון לגבי 98.8% ה־DNA המשותף לאדם ולשימפנזה?","a":"שני המינים התפצלו מאותו ענף","w":["האדם התפתח ישירות מהשימפנזה","השימפנזה התפתחה מאבות האדם","אין שום הבדל במוח בין שני המינים"],"e":"הספר מזהיר מהטעות הנפוצה: הדמיון מעיד על מוצא משותף, כי שני המינים התפצלו מאותו ענף בזמנים שונים. אין כאן טענה שהמוחות זהים."},{"q":"אילו הומינידים קרובים לנו ביותר ושרדו עד היום?","a":"שימפנזים, גורילות ואורנגאוטנים","w":["נאנדרתלים והומו ארקטוס","בבונים וגיבונים","קופי עכביש וקופים אחרים מאמריקה"],"e":"לפי הפרק, ההומינידים הקרובים לנו שעדיין חיים הם השימפנזה, הגורילה והאורנגאוטן. הנאנדרתלים והומו ארקטוס נכחדו."}]},
"q25":{"t":"t5","v":[{"q":"למה, לפי הפרק, מוח האדם ממשיך לגדול הרבה אחרי הלידה?","a":"כי הליכה זקופה הגבילה את תעלת הלידה","w":["כי תינוקות נולדים בלי נוירונים בכלל","כי המוח ממשיך לגדול עד הזקנה","כי ליונקים אין טיפול הורי בצאצאים"],"e":"היציבה הזקופה משפיעה על מבנה האגן ומגבילה את גודל הראש בלידה, ולכן המוח משלים את גדילתו אחר כך, בתקופה של טיפול הורי. בלידה כבר יש בו כמאה מיליארד נוירונים."},{"q":"מהי נאוטניה?","a":"האטה של ההתבגרות שמשאירה יותר זמן לגדילה","w":["יצירת נוירונים חדשים במוח של אדם בוגר","האצה של ההתבגרות כדי להגיע מהר לבגרות","הקטנה של המוח אחרי גיל ההתבגרות"],"e":"נאוטניה פירושה ״התארכות הילדות״, והיא גורם חשוב בהתפתחות מוח גדול. יצירת נוירונים חדשים נקראת נוירוגנזה, וזה מושג אחר."}]},
"q26":{"t":"t5","v":[{"q":"למה היחס בין משקל המוח למשקל הגוף לא מסביר אינטליגנציה?","a":"כי לחדף יחס גבוה משל האדם, והוא פשוט ממנו","w":["כי לפיל יש יחס גבוה בהרבה משל האדם","כי מוח האדם קטן מאוד ביחס למשקל גופו","כי לכל היונקים יש בדיוק אותו יחס"],"e":"מוח החדף הוא 3.3% ממשקלו, יותר מ־2.3% של האדם, ובכל זאת פשוט יותר. אצל הפיל היחס נמוך, 0.2%, ולכן הוא לא דוגמה נגדית."},{"q":"מה, לפי הפרק, קובע את היכולת האינטלקטואלית?","a":"מספר הנוירונים הפנויים לחשיבה וללמידה","w":["הגודל המוחלט של המוח בגרמים","מספר הנוירונים שמניעים את השרירים","היחס בין משקל המוח למשקל הגוף"],"e":"גוף גדול לא צריך יותר נוירונים כדי להניע שרירים גדולים. מה שחשוב הוא כמה נוירונים פנויים לחשיבה, ובפרימטים יש יותר נוירונים בכל גרם מאשר במכרסמים."}]},
"q27":{"t":"t6","v":[{"q":"מה הטיעון המרכזי של הספר בעד מחקר בבעלי חיים?","a":"זה השימוש היחיד בחיות שאין לו תחליף","w":["חיות לא סובלות במעבדה כי הן מורדמות","החוק מתיר כל ניסוי שמועיל לבני אדם","תרביות תאים מחליפות כבר את רוב הניסויים"],"e":"הספר טוען שאפשר לחיות בלי בשר ופרוות, אבל לא להתקדם ברפואה בלי מחקר בחיות. הוא לא טוען שחיות לא סובלות, ודוחה את הרעיון שתרביות מחליפות אותן."},{"q":"למה תרביות תאים והדמיות מחשב לא מחליפות חיות מעבדה?","a":"כי אי אפשר לבדוק בהן התנהגות או לחקות מוח","w":["כי הן יקרות יותר מגידול חיות מעבדה","כי החוק אוסר להשתמש בהן במחקר","כי הן מדויקות מדי ולא מראות שונות"],"e":"התמכרות למשל היא תופעה התנהגותית שאי אפשר לבדוק בצלחת. ואם היינו יודעים לתכנת מחשב שמחקה את מערכת העצבים, כבר היו לנו כל התשובות."}]},
"q28":{"t":"t6","v":[{"q":"מה נכון לגבי ועדת IACUC בארה״ב?","a":"מאשרת גם מחקר תצפית לא פולשני","w":["מורכבת רק ממדענים מאותו מוסד","מאשרת רק ניסויים פולשניים בחיות","פועלת רק במוסדות מחקר פרטיים"],"e":"בוועדה יש גם חברים שאינם מדענים וחבר מחוץ למוסד, והיא מאשרת כל מחקר בחיות, גם תצפיתי. היא נדרשת מכל מוסד שמבקש מימון ממשלתי."},{"q":"מה קובע החוק הישראלי לגבי ניסויים בבעלי חיים?","a":"אין לאשר ניסוי אם יש חלופה, ומגבילים את מספר החיות","w":["כל ניסוי מותר אם המוסד עצמו אישר אותו","ניסויים מותרים רק בחרקים ובדגים","ניסויים בחיות אסורים לגמרי מאז 1994"],"e":"חוק צער בעלי חיים מ־1994 קובע מגבלות ומועצה מפקחת, אבל לא אוסר ניסויים. העיקרון הוא חלופה כשאפשר ומספר מינימלי של חיות."}]},
"q29":{"t":"t6","v":[{"q":"מה היה הפגם בפרשת שבט ההוואסופאי?","a":"דגימות שנאספו לסוכרת שימשו למחקר אחר בלי הסכמה","w":["החוקרים חשפו את שמות המשתתפים בעיתונות","המשתתפים לא קיבלו שום תשלום על הדגימות","המחקר נערך בלי אישור של ועדה לבעלי חיים"],"e":"הבעיה הייתה בהסכמה מדעת: המשתתפים הסכימו למטרה אחת, והדגימות שימשו למטרה אחרת. בעקבות זאת הוחזרו הדגימות ושולם פיצוי של 700,000 דולר."},{"q":"מה כוללת הסכמה מדעת?","a":"הסבר על המחקר, הנתונים, התרומה והנזק האפשרי","w":["חתימה על טופס, גם בלי הסבר על המחקר","אישור של ועדת המוסד, במקום המשתתף","הבטחה שהמשתתף יקבל טיפול רפואי חינם"],"e":"המשתתף צריך לקבל מידע מלא לפני שהוא מחליט אם להשתתף. אישור הוועדה (IRB) נדרש בנוסף, ולא במקום ההסכמה שלו."}]},
"q30":{"t":"t6","v":[{"q":"במה עוסקת הנוירואתיקה?","a":"בהשלכות האתיות של מחקר המוח ובקוד אתי מתאים","w":["בטיפול רפואי באנשים עם מחלות מוח","בבדיקת תרופות חדשות על חיות מעבדה","בשאלת הגוף והנפש מנקודת מבט פילוסופית"],"e":"זה ענף בין־תחומי שבוחן נושאים כמו פרטיות בהדמיה והעצמה קוגניטיבית. הטיפול במחלות הוא עבודת הנוירולוג."},{"q":"איזה נושא לא הופיע בדוח 2014 על נוירואתיקה?","a":"תמחור תרופות פסיכיאטריות","w":["הדמיה מוחית ופרטיות","העצמה קוגניטיבית והוגנות","דמנציה ושינויים באישיות"],"e":"הדוח עסק בהדמיה ופרטיות, דמנציה ושינויי אישיות, העצמה קוגניטיבית והוגנות, וגרייה חוצת גולגולת. מחירי תרופות לא היו ברשימה."}]},
"q31":{"t":"t6","v":[{"q":"מה ההבדל בין נוירולוג למדען עצב והתנהגות?","a":"נוירולוג הוא רופא; מדען עצב והתנהגות הוא חוקר","w":["נוירולוג חוקר חיות, ומדען עצב חוקר רק בני אדם","אין הבדל, אלה שני שמות לאותו מקצוע בדיוק","מדען עצב והתנהגות הוא רופא שמנתח מוחות"],"e":"נוירולוגים הם רופאים, וחלקם גם חוקרים. מדעני עצב והתנהגות חוקרים, בעיקר בניסויים בחיות, כיצד מערכת העצבים שולטת בהתנהגות."},{"q":"מה נדרש בדרך כלל כדי להיות חוקר עצמאי בתחום?","a":"דוקטורט, ואחריו כשנתיים של פוסט־דוקטורט","w":["תואר ראשון בפסיכולוגיה, בלי לימודים נוספים","תואר שני ועבודה של כמה שנים כטכנאי","רישיון לעסוק ברפואה וניסיון בבית חולים"],"e":"חוקר עצמאי צריך Ph.D. או M.D., ונהוג להוסיף שנתיים במעבדה של חוקר בכיר. טכנאים עם תואר ראשון או שני עושים עבודה חשובה, אבל לא כחוקרים עצמאיים."}]},
"q32":{"t":"t6","v":[{"q":"סטודנטית לומדת בבית אבל תיבחן בכיתה. מה הספר ממליץ לה, לפי למידה תלוית מצב?","a":"לשלב משתנים מסביבת המבחן או לגוון סביבות","w":["ללמוד תמיד באותה פינה שקטה בבית","להדגיש בצבע את כל המשפטים החשובים","ללמוד את כל החומר בלילה שלפני המבחן"],"e":"ההקשר משמש רמז לשליפה, כמו אצל הצוללנים שזכרו טוב יותר באותה סביבה. לכן כדאי ללמוד בסביבה דומה למבחן או בסביבות משתנות. הדגשה ולמידה דחוסה לא עוזרות."},{"q":"איזו שיטת למידה מהפרק לא נמצאה יעילה?","a":"סימון בקו תחתון או הדגשה בלבד","w":["ללמד חבר את החומר","לפצל את הלמידה לכמה פרקי זמן","להשתמש בשיטת המיקום"],"e":"מחקרים הראו שהדגשה בלי קישור לידע קודם היא קריאה פסיבית, ולפעמים אף מזיקה. הוראה לאחרים, ריווח ועזרי זיכרון נמצאו מועילים."}]},
"h1":{"t":"t1","v":[{"q":"חוקר מסביר את התכווצות השריר בתנועת יונים דרך הממברנה. באיזה סוג הסבר הוא משתמש?","a":"העמדה: הסבר דרך התהליכים הבסיסיים שמתחת לתופעה","w":["הכללה: מסקנה כללית מתצפיות רבות על התנהגות של בעלי חיים","דואליזם: הפרדה מוחלטת בין הגוף לבין הנפש","ברירה טבעית: הסבר דרך יתרון הישרדותי לפרט"],"e":"העמדה (reduction) אופיינית לפיזיולוגים. הכללה אופיינית לפסיכולוגים, כמו ״חולדות לומדות מהר יותר עם תגמול מיידי״."}]},
"h2":{"t":"t1","v":[{"q":"עכברים בונים קן גם בגלל קור וגם בגלל הורמוני היריון. מה הלקח?","a":"התנהגות זהה לא מעידה על מנגנון זהה","w":["בניית קן היא התנהגות נלמדת בלבד","הורמונים משפיעים רק על נקבות בהיריון","קור והיריון מפעילים אותו מנגנון עצבי"],"e":"אותה התנהגות, שני מנגנונים שונים. לכן צריך לחקור את המנגנון ולא להסיק מההתנהגות."}]},
"h3":{"t":"t2","v":[{"q":"למה המודל של דקארט נחשב תרומה חשובה, למרות שהיה שגוי?","a":"הוא היה מודל מכני שאפשר לבדוק בניסוי","w":["הוא הוכיח שהנפש נמצאת בלב","הוא גילה שהעצבים מוליכים חשמל","הוא היה מוניסטי, וזנח לגמרי את הדואליזם"],"e":"דקארט היה דואליסט עם מודל הידראולי, אבל המודל ניתן לבדיקה. גלוואני הפריך אותו בגירוי חשמלי של עצב."}]},
"h4":{"t":"t3","v":[{"q":"מטופל אחרי חיתוך הגשר המוחי לא יכול לומר בקול מה הוצג לו בשדה הראייה השמאלי. למה?","a":"המידע מגיע להמיספרה הימנית, והדיבור בשמאלית","w":["המידע מגיע להמיספרה השמאלית, והדיבור נמצא בימנית","החיתוך פגע בעצב הראייה השמאלי","ההמיספרה הימנית לא מעבדת מידע חזותי"],"e":"שדה ראייה שמאלי ← המיספרה ימנית. בלי הגשר המוחי המידע לא עובר לשמאלית, שבה הדיבור. הוא יכול להצביע ביד שמאל."}]},
"h5":{"t":"t4","v":[{"q":"מה המשותף לברוקה ולפריטש והיציג מבחינת שיטה?","a":"קישור תפקוד לאזור מסוים במוח","w":["שימוש בהדמיה של מוח אדם חי","הפרכה של רעיון הרפלקס של דקארט","הוכחה שהמוח פועל כמכלול אחיד"],"e":"ברוקה בפגע (דיבור), פריטש והיציג בגרייה (תנועה): שניהם תמכו באיתור תפקודים (לוקליזציה)."}]},
"h6":{"t":"t5","v":[{"q":"מה ההסבר האבולוציוני המרכזי לכך שבני אדם מתבגרים לאט?","a":"התפתחות איטית מאפשרת למוח לגדול ולהתעצב לפי ניסיון","w":["התפתחות איטית חוסכת אנרגיה בגיל הבגרות","התפתחות איטית מקטינה את גודל המוח הבוגר","התפתחות איטית נובעת מהליכה על שתיים בלבד, ולא מהמוח"],"e":"ניאוטניה: שימור תכונות צעירות ותקופת גדילה ארוכה יותר, שמאפשרת מוח גדול וגמיש."}]},
"h7":{"t":"t6","v":[{"q":"מה הנימוק העיקרי להצדקת מחקר בבעלי חיים לפי הפרק?","a":"הוא מוביל להבנה וטיפול במחלות, תחת כללים נגד סבל","w":["לבעלי חיים אין מערכת עצבים שדומה לזו של האדם","החוק מתיר כל ניסוי בבעלי חיים בלי פיקוח ובלי ועדות","מחקר בבעלי חיים זול יותר ופשוט יותר ממחקר בבני אדם"],"e":"המחקר מחויב לכללים ולוועדות, ולצמצום כאב. התועלת: הבנה וטיפול במחלות (כמו פרקינסון)."}]}};
const H={"h1":{"t":"t1","v":[{"q":"אישה עברה שבץ, ומאז היא כמעט לא משתמשת ביד שמאל. פיזיותרפיסט קושר לה את יד ימין ומתרגל איתה רק בשמאל. על איזה רעיון הטיפול נשען?","a":"השיתוק נשמר גם בגלל אי־שימוש, והמוח יכול להשתנות","w":["הנזק במוח קבוע, ולכן רק השרירים של היד מתחזקים","המוח הבוגר לא משתנה, ולכן צריך ללמד את היד הבריאה","יד ימין מפריעה ליד שמאל, ולכן קושרים אותה לתמיד"],"e":"זה טיפול בתנועה מאולצת, כמו אצל ג׳רמייה. הוא מבוסס על פלסטיות: כשמשתמשים באיבר, יותר תאי מוח ״מוקדשים״ לו."},{"q":"מה הייתה ההנחה של רוב החוקרים עד תחילת המאה ה־21, שהמקרה של ג׳רמייה מפריך?","a":"שהמוח הבוגר כמעט לא משתנה ולא מייצר נוירונים","w":["שהמוח משתנה רק בגלל תרופות ולא בגלל תרגול","שיד משותקת חוזרת לתפקד מעצמה אחרי כמה שנים","ששבץ פוגע רק בגוף ולא במוח עצמו"],"e":"היום יודעים שנוצרים קשרים חדשים כל החיים, ויש נוירוגנזה בהיפוקמפוס ובבולבוס ההרחה."}]},"h2":{"t":"t1","v":[{"q":"לפי הספר, מה הייעוד הראשון של מערכת העצבים?","a":"לשלוט בתנועות, כולל דיבור","w":["לאפשר חשיבה מופשטת ותכנון","לאגור זיכרונות לאורך החיים","לקלוט מידע מהחושים ולפרש אותו"],"e":"תפיסה בלי יכולת לפעול לא מועילה. חשיבה וזיכרון התפתחו כי הם עוזרים לפעול נכון."}]},"h3":{"t":"t1","v":[{"q":"חוקר כותב: ״השיפור אחרי טיפול נובע מכך שיותר נוירונים בקורטקס המוטורי מתחילים לשלוט ביד״. איזה סוג הסבר זה?","a":"העמדה: הסבר דרך התהליכים שמתחת להתנהגות","w":["הכללה: מסקנה כללית מתצפיות רבות על חולים","פונקציונליזם: הסבר דרך התועלת של התכונה","דואליזם: הסבר דרך הקשר בין הנפש לגוף"],"e":"ההסבר ״יורד רמה״ לנוירונים. ״אנשים אחרי שבץ משתפרים כשמאלצים אותם״ היה הכללה."},{"q":"פסיכולוגית כותבת: ״ילדים לומדים מהר יותר כשהתגמול ניתן מיד אחרי ההתנהגות״. איזה סוג הסבר זה?","a":"הכללה: מסקנה כללית שמסכמת תצפיות רבות","w":["העמדה: הסבר דרך תהליכים במוח ובתאים","פונקציונליזם: הסבר דרך התועלת לשרידות","לוקליזציה: הסבר דרך אזור מסוים במוח"],"e":"ההסבר אומר מה קורה בדרך כלל, בלי להיכנס למה שקורה בגוף. לכן זו הכללה."}]},"h4":{"t":"t1","v":[{"q":"עכבר בונה קן כשקר לו, ועכברה בהיריון בונה קן גם כשחם. מה הלקח של הספר?","a":"התנהגות זהה יכולה לנבוע ממנגנונים שונים","w":["בניית קן היא תמיד תגובה לטמפרטורה נמוכה","הורמוני היריון גורמים לעכברה להרגיש קור","זכרים ונקבות בונים קן באותו מנגנון במוח"],"e":"במקרה אחד פועל חלק שמקבל מידע מחיישני חום, ובשני חלק שמושפע מהורמונים. אותה התנהגות, שני מנגנונים."}]},"h5":{"t":"t1","v":[{"q":"אדם אחרי נזק מוחי קורא מילים מוכרות, אבל לא מצליח לקרוא מילים חדשות לפי הצלילים. מה זה מלמד?","a":"שיש שני מסלולי קריאה: לפי הגייה ולפי מילה שלמה","w":["שהנזק פגע בזיכרון, ולכן הוא שוכח מילים חדשות","שקריאה היא תהליך אחד, והנזק רק האט אותו","שמילים מוכרות נקראות בהמיספרה הימנית בלבד"],"e":"זו דוגמה לכך שהפיזיולוגיה מלמדת על הפסיכולוגיה: הנזק ״פירק״ יכולת אחת לשני מנגנונים."}]},"h6":{"t":"t2","v":[{"q":"אדם עבר פגיעת ראש, ומאז האישיות שלו השתנתה לגמרי. עם איזו עמדה זה מתיישב בעיקר?","a":"מוניזם: הנפש היא תוצר של פעולת המוח","w":["דואליזם: הנפש והגוף הם שני דברים נפרדים","פונקציונליזם: כל תכונה קיימת בגלל התועלת שלה","הכללה: מסקנה כללית מתצפיות רבות"],"e":"אם שינוי במוח משנה את הנפש, הנפש לא יכולה להיות ״משהו נוסף״ שאינו חומר."},{"q":"מה ההבדל בין מוניזם לדואליזם?","a":"מוניזם: הנפש נוצרת מהמוח. דואליזם: היא נפרדת","w":["מוניזם: הנפש בלב. דואליזם: הנפש במוח","מוניזם: יש רק נפש. דואליזם: יש רק גוף","מוניזם: לכל תפקוד אזור. דואליזם: המוח פועל כשלם"],"e":"מדעני העצב מוניסטים. דקארט היה דואליסט."}]},"h7":{"t":"t2","v":[{"q":"דקארט טען שבעלי חיים הם מכונות, וגם הציע שבלוטת האצטרובל מקשרת בין נפש לגוף. מה עמדתו?","a":"דואליסט, אבל הראשון שהציע קשר בין הנפש למוח","w":["מוניסט, כי הוא טען שגם האדם הוא מכונה","מוניסט, כי הוא מיקם את הנפש בתוך המוח","דואליסט, ולכן לא האמין שלמוח יש קשר לנפש"],"e":"הוא האמין בנפש שאינה חומר (דואליזם), אבל הציע חוליה מקשרת במוח. זה החידוש שלו."}]},"h8":{"t":"t2","v":[{"q":"למה המודל ההידראולי של דקארט נחשב חשוב, אף שהתברר כשגוי?","a":"כי אפשר היה לבדוק ולהפריך אותו בניסוי","w":["כי הוא הוכיח שהנפש נמצאת בבלוטת האצטרובל","כי הוא הראשון שמדד את מהירות ההולכה בעצב","כי הוא הראה שהמוח בנוי מתאים נפרדים"],"e":"מודל פשוט שמחקה חלק ממערכת מורכבת מאפשר ניסוי. וזה בדיוק מה שגלוואני עשה."}]},"h9":{"t":"t2","v":[{"q":"גלוואני גירה בחשמל עצב של רגל צפרדע מנותקת, והשריר התכווץ. איזה רעיון זה הפריך?","a":"שהמוח מזיז שרירים בעזרת נוזל בלחץ","w":["שהנפש נמצאת בלב, ולא במוח כפי שטען גאלן","שכל העצבים מעבירים בדיוק אותו סוג של אות","שלכל תפקוד יש אזור מסוים ומוגדר במוח"],"e":"הכוח שמזיז את השריר נמצא ברקמה עצמה, גם בלי מוח. המודל של דקארט הופרך."}]},"h10":{"t":"t2","v":[{"q":"גאלן צחק על אריסטו, שחשב שהמוח רק ״מקרר״ את הלב. מה היה הנימוק של גאלן?","a":"עצבי החישה מגיעים אל המוח, ולכן הוא המרכז","w":["המוח חם יותר מהלב, ולכן לא יכול לקרר אותו","פגיעה בלב לא משנה את המחשבה של האדם","דקארט כבר הוכיח שהנפש נמצאת במוח"],"e":"גאלן גם ציין שהמוח רחוק מהלב. היפוקרטס, לפניו, כבר מיקם את הנפש במוח."}]},"h11":{"t":"t3","v":[{"q":"אדם עם מוח חצוי מריח ריח בנחיר ימין בלבד. מה צפוי לקרות?","a":"הוא יגיד שלא הריח כלום, אבל יד שמאל תבחר חפץ מתאים","w":["הוא יזהה את הריח ויגיד מה הוא, כי ריח מגיע לשמאל","הוא לא יזהה את הריח בשום דרך, כי הקשר נחתך","יד ימין תבחר חפץ מתאים, אבל הוא לא יוכל להסביר"],"e":"בריח אין הצלבה, ולכן המידע מגיע להמיספרה הימנית. היא שולטת ביד שמאל, אבל לא מדברת."}]},"h12":{"t":"t3","v":[{"q":"מה המסקנה העיקרית מהניסויים במוח החצוי?","a":"מידע נעשה מודע רק כשמגיע לאזורי הדיבור","w":["ההמיספרה הימנית לא מבינה שפה בכלל","חיתוך כפיס המוח לא משפיע על ההתנהגות","לכל אדם יש שתי נפשות נפרדות מלידה"],"e":"ניתוק פיזי במוח יצר ניתוק במודעות. זו עדות חזקה לכך שהמודעות היא פעולה של המוח (מוניזם)."},{"q":"למה חותכים לחולים את כפיס המוח?","a":"כדי להפחית התקפי אפילפסיה קשים","w":["כדי לחקור את ההבדלים בין שתי ההמיספרות","כדי לטפל בשבץ בצד אחד של המוח","כדי לשפר את היכולת לדבר אחרי פגיעה"],"e":"הניתוח טיפולי. רק אחר כך ראו שהוא מאפשר לחקור כל המיספרה לחוד."}]},"h13":{"t":"t4","v":[{"q":"אדם משפשף את העיניים בחוזקה ורואה ״ניצוצות״, למרות שאין אור. איזה עיקרון זה מדגים?","a":"חוק האנרגיות העצביות של מילר","w":["הכריתה הניסויית של פלורנס בחיות","מדידת מהירות ההולכה של הלמהולץ","הגירוי החשמלי של פריץ׳ והיציג"],"e":"כל העצבים מעבירים אותו אות. מה שקובע את התחושה הוא איזה עצב פעיל, כאן עצב הראייה."}]},"h14":{"t":"t4","v":[{"q":"במה השיטה של ברוקה שונה מהשיטה של פלורנס?","a":"ברוקה בדק מוח אדם אחרי שבץ. פלורנס הסיר אזורים בחיות","w":["ברוקה הסיר אזורים במוח של אנשים. פלורנס בדק חיות שנפגעו","ברוקה גירה את המוח בחשמל. פלורנס מדד מהירות הולכה","ברוקה חקר חיות. פלורנס חקר בני אדם אחרי המוות"],"e":"שניהם השתמשו באותו היגיון (נזק במקום מסוים ← איזה תפקוד נפגע), אבל ברוקה לא הסיר כלום מבני אדם."}]},"h15":{"t":"t4","v":[{"q":"פריץ׳ והיציג גירו בחשמל את הקורטקס של כלב, וגרמו לתנועה בצד הנגדי. מה הם גילו?","a":"את הקורטקס המוטורי, עדות ללוקליזציה","w":["את אזור ברוקה, שאחראי על הדיבור","את כפיס המוח, שמחבר בין ההמיספרות","את מהירות ההולכה בעצב, כ־30 מטר בשנייה"],"e":"אזור מסוים שולט בתנועה בצד הנגדי. זה האזור שנפגע אצל ג׳רמייה."}]},"h16":{"t":"t4","v":[{"q":"חוקר טוען: ״פגיעה בכל חלק של הקורטקס פוגעת קצת בכל היכולות, כי המוח פועל כשלם״. איזו עמדה זו?","a":"ביזור: התפקודים מפוזרים על פני המוח","w":["לוקליזציה: לכל תפקוד יש אזור מסוים במוח","דואליזם: הנפש נפרדת מהמוח ואינה חומר","העמדה: הסבר דרך התהליכים הבסיסיים בתאים"],"e":"לוקליזציה = לכל תפקוד מקום. ביזור = המוח פועל כשלם. לפי הספר, היום ידוע שתפקוד כמו דיבור דורש אזורים רבים."}]},"h17":{"t":"t4","v":[{"q":"הלמהולץ מצא שמהירות ההולכה בעצב היא כ־30 מטר בשנייה. מה המשמעות?","a":"האות בעצב אינו זרם חשמלי פשוט, כי הוא איטי מדי","w":["האות בעצב הוא נוזל בלחץ, כמו שטען דקארט","האות בעצב מהיר כמו אור, ולכן אי אפשר למדוד אותו","כל העצבים מעבירים אותות במהירויות שונות לגמרי"],"e":"זרם בכבל מהיר בהרבה. מכאן שיש מנגנון אחר, ופרק 2 מסביר אותו (פוטנציאל פעולה)."}]},"h18":{"t":"t4","v":[{"q":"מה הראה רמון אי קחל?","a":"שמערכת העצבים בנויה מנוירונים נפרדים","w":["שלכל עצב יש סוג אחר של אות חשמלי","שהקורטקס המוטורי שולט בצד הנגדי של הגוף","שאזור בקורטקס השמאלי חיוני לדיבור"],"e":"נובל 1906, יחד עם גולג׳י, שהשיטה שלו לצביעת תאים אפשרה את התגלית."}]},"h19":{"t":"t5","v":[{"q":"חוקרת שואלת: ״איך הצבע הירוק של הזחל עוזר לו לשרוד?״. באיזו גישה היא משתמשת?","a":"פונקציונליזם: הבנת תכונה דרך התועלת שלה","w" const SUM=`<h2>סיכום: פרק 1 - מבוא</h2>
<div class="key"><b>השאלה של הקורס במשפט אחד:</b> איך המוח, שהוא ״רק״ תאים, חשמל וכימיה, יוצר את כל מה שאנחנו עושים, מרגישים וחושבים?<br><br>
<b>למה הפרק הזה חשוב?</b> הוא נותן את נקודת המבט של כל הקורס. ההנחה של התחום היא <b>מוניזם</b>: הנפש היא לא ״משהו נוסף״ שיושב בתוך הגוף, אלא <b>תוצר של פעולת המוח</b>. הפרק מראה איך הגיעו לרעיון הזה, צעד אחרי צעד, ואיך חוקרים אותו היום.<br><br>
<b>הפרק בנוי מחמישה חלקים:</b><br>
① <b>מה התחום ומה המטרה שלו</b> (סעיפים 1–2): המוח משתנה ונועד לפעולה, ושתי דרכים להסביר התנהגות.<br>
② <b>שאלת הגוף והנפש</b> (סעיפים 3–4): מוניזם מול דואליזם, דקארט, והמוח החצוי.<br>
③ <b>איך גילו שלכל אזור במוח יש תפקיד</b> (סעיף 5): לוקליזציה מול ביזור.<br>
④ <b>מה תרמו הביולוגים</b> (סעיף 6): פונקציונליזם, ברירה טבעית ואבולוציה של מוח גדול.<br>
⑤ <b>אתיקה וקריירה</b> (סעיף 7).<br>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>

<tr><td><b>קורטקס</b></td><td>קליפת המוח: השכבה החיצונית, המקומטת, של המוח.</td></tr>
<tr><td><b>המיספרה</b></td><td>חצי מוח. יש שמאלית וימנית.</td></tr>
