:root[data-theme="dark"]{

      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"flask",title:"מהו סם",blocks:[
  {h:"לוקאס ומלחי האמבט",html:`${def("על מה הנושא",`פסיכופרמקולוגיה חוקרת איך סמים פועלים על מערכת העצבים ועל ההתנהגות. מתחילים בסיפור ובהגדרות.<br><b>מה נלמד כאן:</b> הגדרת סם · השפעות הסם · אתרי פעולה`)}${def("תיאור מקרה",`לוקאס שלח לרופא באמצע הלילה תמונה של חצר חשוכה. כבר שלושה שבועות ״הסניף״ <b>מלחי אמבט</b> שקנה בחנות. הם מכילים חומרים שדומים ל<b>גת</b> ${E("khat")}, וההשפעה שלהם דומה לקוקאין ולמתאמפטמין: הם מגבירים <b>דופמין וסרוטונין</b> בסינפסה. לוקאס נעשה חסר מנוחה, ירד במשקל, לא ישן, ו<b>הזה</b> אנשים מסתובבים בחצר (את זה ניסה לצלם). כ־30 שעות אחרי שהפסיק, התסמינים נעלמו.`)}${def("פסיכופרמקולוגיה",`<mark>פסיכופרמקולוגיה</mark> ${E("psychopharmacology")}: חקר ההשפעות של סמים על מערכת העצבים ועל ההתנהגות.`)}${rem("המקרה מדגים את מושגי היסוד של הפרק: <b>השפעות</b> הסם, <b>אתרי הפעולה</b> שלו, <b>אופן המתן</b> (הסנפה), ומה קורה כשמגבירים פעילות של מונואמינים.")}`,q:"q1"},
  {h:"ההגדרה של סם",html:`${def("ההגדרה",`<b>סם</b> הוא ״חומר <b>ממקור חיצוני</b> שאינו נחוץ לתפקוד התקין של התאים, והמשנה באופן ניכר את תפקודם של תאים מסוימים כשנוטלים אותו <b>במינונים קטנים יחסית</b>״. בפרק עוסקים בסמים ש<b>פסיכו־אקטיביים</b>, כלומר משנים את תפקוד מערכת העצבים.`)}${yn(["תרופה מבית המרקחת","סם אסור כמו הרואין","קפאין"],["נוירוטרנסמיטרים והורמונים מהגוף","חלבונים, שומנים ופחמימות","ויטמינים ומלחים"])}${rem("למה ״במינונים קטנים״? כי כמעט כל חומר, אפילו מלח שולחן, משנה את תפקוד התאים אם לוקחים ממנו כמות גדולה מספיק.")}${tiles([["chart","השפעות הסם (drug effects)","השינויים בתהליכים הפיזיולוגיים ובהתנהגות. מורפין: פחות כאב, האטת מעיים, אופוריה"],["target","אתרי פעולה (sites of action)","המקומות שבהם מולקולות הסם פועלות על מולקולות בתאים"]])}`,q:"q3"}
 ]},
 {id:"t2",icon:"cycle",title:"פרמקו־קינטיקה",blocks:[
  {h:"דרכי מתן",html:`${def("פרמקו־קינטיקה",`<mark>פרמקו־קינטיקה</mark> ${E("pharmacokinetics")}: התהליך שבו הסם <b>נספג, מתפזר</b> בגוף, <b>מתפרק</b> ו<b>מופרש</b>.`)}${tiles([["target","תוך־ורידי (IV)","ישר לווריד: המהיר ביותר, אבל כל המנה נכנסת בבת אחת"],["data","תוך־צפקי (IP)","לחלל הבטן; נפוץ בחיות מעבדה"],["hand","תוך־שרירי (IM)","לשריר גדול; נספג דרך הנימים"],["leaf","תת־עורי (SC)","מתחת לעור; ספיגה איטית"],["cart","דרך הפה","הנוח ביותר, אבל חלק מהסמים מתפרקים בקיבה ובכבד"],["bulb","שאיפה","דרך הריאות: מגיע מהר מאוד למוח"],["doc","מתן מקומי ותת־לשוני","על העור (מדבקה) או מתחת ללשון"],["x","רחרוח (הפחה)","״הסנפה״ דרך הקרום הרירי באף"]])}${def("ישר למוח",`<b>מתן תוך־מוחי</b> ו<b>מתן תוך־חדרי</b> (ICV) עוקפים את מחסום הדם-מוח. הם משמשים בעיקר במחקר.`)}${ex(`ריכוז הקוקאין בדם (איור 4.3): הזרקה לווריד מגיעה לשיא הגבוה והמהיר ביותר, אחריה שאיפה, ואחר כך רחרוח ובליעה, שמגיעים לריכוז נמוך ואיטי יותר.`)}`,q:"q5"},
  {h:"פיזור, מחסנים ופירוק",html:`${def("מסיסות בליפידים",`<mark>מסיסות בליפידים</mark> ${E("lipid solubility")} מאפשרת לסם לעבור ממברנות ואת מחסום הדם-מוח. לכן <b>הרואין</b>, שמסיס בשומן יותר ממורפין, מגיע למוח מהר יותר ופועל חזק יותר.`)}${def("קשירת מחסן",`ב<mark>קשירת מחסן</mark> ${E("depot binding")} הסם נקשר לרקמות (שומן, שריר, עצם) או לחלבוני דם, במיוחד <mark>אלבומין</mark>. בהתחלה רק מעט סם פנוי מגיע למוח, ולכן ההשפעה מתעכבת. כשהמחסנים מתמלאים, יותר סם חופשי, ואחר כך הוא משתחרר מהם לאט ומאריך את ההשפעה.`)}${tiles([["gear","פירוק","בעיקר אנזימים בכבד. לפעמים התוצרים פעילים בעצמם"],["data","הפרשה","בעיקר בשתן דרך הכליות, וגם בנשימה, בזיעה ובחלב אם"]])}`,q:"q7"}
 ]},
 {id:"t3",icon:"chart",title:"יעילות ושימוש חוזר",blocks:[
  {h:"מינון, תגובה ומדד ריפוי",html:`${def("עקומת מינון ותגובה",`<mark>עקומת מינון ותגובה</mark> ${E("dose-response curve")}: ככל שהמינון עולה, ההשפעה גדלה, עד <b>השפעה מרבית</b>. מעבר לנקודה הזאת עוד סם לא מוסיף השפעה, אבל מגדיל את הסכנה לתופעות לוואי.`)}${fig("dose","מרווח הבטיחות: המרחק בין עקומת ההשפעה הרצויה לעקומת הנזק")}${def("מדד ריפוי",`<mark>מדד ריפוי</mark> ${E("therapeutic index")}: היחס בין המינון שגורם לרעילות ב־50% מהנבדקים לבין המינון שמשיג את ההשפעה הרצויה ב־50%. ככל שהיחס <b>גבוה יותר</b>, הסם <b>בטוח יותר</b>.`)}${def("למה סמים שונים ביעילותם",`(1) <b>אתרי פעולה שונים</b>: מורפין ואספירין משככים כאב בדרכים שונות. (2) <mark>זיקה</mark> ${E("affinity")}: כמה בקלות הסם נקשר לאתר. זיקה גבוהה פועלת במינון נמוך. הסם האידאלי בעל זיקה גבוהה לאתר המועיל ונמוכה לאתרים שגורמים לתופעות לוואי.`)}`,q:"q9"},
  {h:"סבילות, סנסיטיזציה וגמילה",html:`${tiles([["chart","סבילות (tolerance)","הסם פחות יעיל בכל פעם; צריך מנה גדולה יותר"],["bulb","סנסיטיזציה (sensitization)","הסם יעיל יותר בכל פעם"]])}${def("מנגנונים של סבילות",`פחות קולטנים (״ויסות כלפי מטה״), צימוד פחות יעיל של קולטנים לחלבון G, או פירוק מהיר יותר בכבד. סבילות להשפעה אחת לא אומרת סבילות לכל ההשפעות: במורפין מתפתחת סבילות לשיכוך הכאב ולאופוריה יותר מאשר לעצירות.`)}${def("גמילה ותלות פיזית",`<mark>תסמיני גמילה</mark> ${E("withdrawal symptoms")} הם בדרך כלל <b>הפוכים</b> להשפעת הסם: הרואין גורם לאופוריה, והגמילה לדיספוריה, אומללות וחרדה. הם נובעים מ<mark>תלות פיזית</mark> ${E("physical dependence")}: הגוף מפתח מנגנונים <b>מפצים</b> נגד הסם, וכשהסם נעלם הם נשארים בלי התנגדות.`)}${ex(`מי ששותה הרבה קפה כל יום מפתח סבילות לעוררות שהוא נותן. כשמפסיק בבת אחת, מופיעים עייפות וכאב ראש, ההפך מההשפעה של הקפאין.`)}`,q:"q11"},
  {h:"סם דמה",html:`${def("פלצבו",`<b>סם דמה</b> (פלצבו) הוא חומר לא פעיל. ההשפעה שלו נובעת מה<b>ציפייה</b>. לכן בניסוי צריך לתת לקבוצת הביקורת פלצבו <b>באותו אופן בדיוק</b>: אם הסם ניתן בזריקה, גם הביקורת מקבלת זריקה.`)}${def("בחיות",`גם לחיות עושים זריקת דמה, בדרך כלל של <b>תמיסת מלח</b>, כי עצם הזריקה וההחזקה משפיעים על ההתנהגות.`)}${rem("אפקט הפלצבו אמיתי פיזיולוגית: במשככי כאב דמה המוח משחרר <b>אופיואידים פנימיים</b>, והאפקט נחסם כשנותנים נלוקסון.")}`,q:"q13"}
 ]},
 {id:"t4",icon:"target",title:"איפה סמים פועלים: אגוניסטים ואנטגוניסטים",blocks:[
  {h:"ייצור, אחסון ופליטה",html:`${tiles([["bulb","אגוניסט (agonist)","מגביר או מחקה את השפעת הנוירוטרנסמיטר על התא הפוסט־סינפטי"],["x","אנטגוניסט (antagonist)","מעכב או מפחית את ההשפעה"]])}${fig("steps")}${def("ייצור",`רוב הנוירוטרנסמיטרים נבנים מ<b>מולקולות־קדם</b> ${E("precursors")}. סם שהוא מולקולת־קדם (כמו L-DOPA) מגדיל את הייצור, ולכן הוא אגוניסט. סם שמעכב אנזים של הייצור הוא אנטגוניסט.`)}${def("אחסון ופליטה",`<b>נשאים לשלפוחית</b> מכניסים את הנוירוטרנסמיטר לשלפוחיות. סם שחוסם אותם (<b>רזרפין</b>) מרוקן את השלפוחיות, אנטגוניסט. סם שממריץ פליטה (ארס עכביש האלמנה השחורה) הוא אגוניסט, וסם שמונע פליטה (<b>בוטולינום</b>) הוא אנטגוניסט.`)}`,q:"q15"},
  {h:"קולטנים: ישיר ועקיף",html:`${tiles([["check","אגוניסט ישיר","נקשר לאתר הקשירה של הנוירוטרנסמיטר ומפעיל את הקולטן (ניקוטין)"],["lock","חוסם קולטנים (אנטגוניסט ישיר)","נקשר לאותו אתר ולא מפעיל; מתחרה בליגנד הטבעי (קורארה)"]])}${def("קשירה לא תחרותית",`יש סמים שנקשרים ל<b>אתר אחר</b> על הקולטן, בלי להפריע לאתר של הנוירוטרנסמיטר. זו <mark>קשירה לא תחרותית</mark> ${E("noncompetitive binding")}.`)}${tiles([["bulb","אגוניסט עקיף","מאתר אחר, מגביר את פעולת הקולטן (בנזודיאזפינים בקולטן GABA)"],["x","אנטגוניסט עקיף","מאתר אחר, משבש את פעולת הקולטן (PCP בקולטן NMDA)"]])}${ex(`<b>קורארה</b> חוסם את קולטני האצטילכולין בשרירים, כי הוא תופס את מקומו של האצטילכולין. <b>PCP</b> לא נוגע באתר של הגלוטמט, אלא נכנס לתוך התעלה וחוסם אותה.`)}`,q:"q17"},
  {h:"אוטורצפטורים וסיום הפעולה",html:`${def("אוטורצפטורים",`הפעלת אוטורצפטור <b>מפחיתה</b> את הייצור או הפליטה. לכן ההיגיון הפוך: סם ש<b>חוסם</b> אוטורצפטורים הוא <b>אגוניסט</b> (יותר פליטה), וסם ש<b>מפעיל</b> אותם הוא <b>אנטגוניסט</b>.`)}${ex(`<b>אפומורפין</b> במינון נמוך מפעיל בעיקר אוטורצפטורי דופמין ולכן מפחית פליטה: אנטגוניסט. במינון גבוה הוא מפעיל גם את הקולטנים הפוסט־סינפטיים: אגוניסט.`)}${def("סיום הפעולה",`סם ש<b>חוסם קליטה חוזרת</b> (קוקאין, ריטלין, פרוזק) משאיר את הנוירוטרנסמיטר יותר זמן בסינפסה: אגוניסט. גם סם ש<b>מעכב את האנזים המפרק</b> (נאוסטיגמין, מעכבי MAO) הוא אגוניסט.`)}${rem("<b>אמפטמין</b> ו<b>מתאמפטמין</b> עושים יותר מלחסום: הם גורמים לנשאי הדופמין והנוראפינפרין <b>לעבוד הפוך</b>, ולשאוב נוירוטרנסמיטר החוצה לסינפסה.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"split",title:"חומצות אמיניות: גלוטמט, גאבא וגליצין",blocks:[
  {h:"גלוטמט וקולטן NMDA",html:`${def("גלוטמט",`הנוירוטרנסמיטר <b>המעורר</b> העיקרי במוח. ארבעה סוגי קולטנים: <b>AMPA</b> (יונוטרופי, הנפוץ, Na⁺), <b>קאינט</b> (יונוטרופי), <b>NMDA</b> ו<b>מטבוטרופי</b>.`)}${def("קולטן NMDA",`תעלה שמעבירה <b>סידן</b> (וגם נתרן). היא נפתחת רק כשגם הגלוטמט נקשר <b>וגם</b> הממברנה כבר בדפולריזציה, כי במנוחה <b>יון מגנזיום</b> חוסם אותה. היא חשובה ללמידה.`)}${tiles([["x","PCP (״אבק מלאכים״)","אנטגוניסט עקיף: נקשר בתוך התעלה ומונע מסידן להיכנס. גורם להזיות"],["lock","AP5","אנטגוניסט ישיר: חוסם את אתר הגלוטמט ב־NMDA"]])}${def("גריית יתר רעילה",`<b>הרעלה עקב גריית יתר של גלוטמט</b> ${E("excitotoxicity")}: עודף גלוטמט, למשל בשבץ, גורם לעודף סידן בתאים ולמותם. באסטרוציטים האנזים <b>גלוטמין סינתטאז</b> הופך גלוטמט לגלוטמין, שחוזר לנוירונים כמולקולת־קדם.`)}`,q:"q21"},
  {h:"גאבא וגליצין",html:`${def("גאבא",`<mark>גאבא</mark> ${E("GABA")} הוא הנוירוטרנסמיטר <b>המעכב</b> החשוב ביותר במוח. הוא נבנה מגלוטמט בעזרת האנזים <b>GAD</b>. כשאין מספיק פעילות גאבא, הנוירונים יורים יותר מדי, ומופיעים <b>התקפים</b>.`)}${def("קולטן GABAA",`קולטן <b>יונוטרופי</b> שפותח תעלת <b>כלוריד</b>, ויש לו כמה אתרי קשירה:`)}${tiles([["check","מוסקימול","אגוניסט ישיר באתר של גאבא"],["lock","ביקוקולין","אנטגוניסט ישיר באתר של גאבא"],["bulb","בנזודיאזפינים (וליום)","אגוניסטים עקיפים; משככי חרדה. זולפידם (Ambien) לשינה"],["x","פיקרוטוקסין","אנטגוניסט עקיף; גורם להתקפים"]])}${def("סיום וגליצין",`<b>נשאי גאבא</b> מסלקים אותו מהסינפסה (<b>טיאגבין</b> חוסם אותם ומגביר גאבא, נגד אפילפסיה), והאנזים <b>גאבא אמינוטרנספראז</b> מפרק אותו. <b>גליצין</b> הוא נוירוטרנסמיטר מעכב בחלק התחתון של גזע המוח ובמוח השדרה.`)}${rem("גם <b>אלכוהול</b> וברביטורטים פועלים על קולטן GABAA. לכן שילוב שלהם עם בנזודיאזפינים מסוכן.")}`,q:"q23"}
 ]},
 {id:"t6",icon:"hand",title:"אצטילכולין",blocks:[
  {h:"איפה הוא פועל ואיך נוצר",html:`${def("תפקידים",`אצטילכולין (ACh) הוא הנוירוטרנסמיטר בכל הסינפסות בין <b>עצב לשריר שלד</b>, בגנגליונים של המערכת האוטונומית, ובאיברי המטרה של הענף הפרסימפתי. במוח: נוירונים בגשר קשורים ל<b>שנת REM</b>, ונוירונים ב<b>מסד המוח הקדמי</b> שמגיעים לקורטקס ולהיפוקמפוס קשורים ל<b>למידה וקשב</b>.`)}${def("ייצור ופירוק",`האנזים <b>כולין אצטיל־טרנספראז</b> (ChAT) מחבר אצטט לכולין. אחרי הפליטה <b>אצטילכולין־אסטראז</b> (AChE) מפרק אותו לכולין ואצטט, והכולין נקלט חזרה.`)}${tiles([["x","בוטולינום (בוטוקס)","מונע פליטה של ACh: שיתוק. אנטגוניסט"],["bulb","ארס האלמנה השחורה","מעורר פליטה מסיבית של ACh. אגוניסט"],["check","נאוסטיגמין","מעכב AChE; לא חוצה את מחסום הדם-מוח. טיפול בחולשת שרירים חמורה"]])}`,q:"q25"},
  {h:"ניקוטיני ומוסקריני",html:`${tiles([["bulb","קולטן ניקוטיני","יונוטרופי. מופעל בניקוטין, נחסם בקורארה. בשרירי השלד"],["gear","קולטן מוסקריני","מטבוטרופי. מופעל במוסקרין (פטרייה), נחסם באטרופין"]])}${def("קורארה",`רעל חצים מדרום אמריקה. הוא חוסם את הקולטנים הניקוטיניים בשרירים, והחיה משותקת, כולל שרירי הנשימה. היום משתמשים בסמים דומים כדי להרפות שרירים בניתוחים.`)}${def("אטרופין",`מצמח הבלדונה. חוסם קולטנים מוסקריניים, ולכן <b>מרחיב אישונים</b> ומפחית הפרשת <b>רוק</b>.`)}${rem("טיפ לזיכרון: <b>נ</b>יקוטיני ו<b>י</b>ונוטרופי עם <b>ק</b>ורארה; <b>מ</b>וסקריני ו<b>מ</b>טבוטרופי עם <b>א</b>טרופין.")}`,q:"q27"}
 ]},
 {id:"t7",icon:"bulb",title:"מונואמינים",blocks:[
  {h:"דופמין",html:`${def("המשפחה",`<mark>מונואמינים</mark> ${E("monoamines")}: <b>קטכול־אמינים</b> (דופמין, נוראפינפרין, אפינפרין), <b>אינדול־אמינים</b> (סרוטונין) ו<b>אתיל־אמינים</b> (היסטמין).`)}${def("ייצור",`טירוזין מהמזון → <b>L-DOPA</b> → דופמין. בנוירונים נוראדרנרגיים הדופמין הופך גם לנוראפינפרין. L-DOPA עובר את מחסום הדם-מוח, ודופמין לא, ולכן L-DOPA משמש לטיפול בפרקינסון.`)}${fig("da")}${def("סמים",`<b>כלורפרומזין</b> חוסם קולטני D2 ומפחית תסמינים של <b>סכיזופרניה</b>. <b>קוקאין</b> ו<b>מתילפנידאט</b> (ריטלין) חוסמים את <b>נשא הדופמין</b> ומונעים קליטה חוזרת. <b>MAO</b> הוא אנזים בכפתור שמפרק מונואמינים עודפים; <b>דפרניל</b> מעכב MAO-B ומשמש בפרקינסון.`)}`,q:"q29"},
  {h:"נוראפינפרין",html:`${def("איפה ולמה",`נוראפינפרין (NE) הוא נוירוטרנסמיטר במוח ובענף הסימפתי. כמעט כל אזורי המוח מקבלים אקסונים נוראדרנרגיים, וגופי התאים נמצאים בעיקר בגשר ובמוח המוארך. החשוב שבהם: <mark>האתר התכול</mark> ${E("locus coeruleus")} בגשר, שקשור ל<b>ערנות ודריכות</b>.`)}${def("דליות אקסוניות",`הרבה אקסונים נוראדרנרגיים לא יוצרים סינפסות רגילות. יש לאורכם <mark>דליות אקסוניות</mark> ${E("axonal varicosities")}, עיבויים שפולטים את החומר לנוזל שמסביב, כמו נוירומודולטור.`)}${tiles([["x","חומצה פוסרית","מעכבת את האנזים שהופך דופמין ל־NE: חוסמת ייצור"],["bulb","מוקלובמיד","חוסם MAO-A: אגוניסט נוראדרנרגי (נגד דיכאון)"]])}${rem("<b>אפינפרין</b> (אדרנלין) הוא בעיקר הורמון של ליבת האדרנל, ופועל גם כנוירוטרנסמיטר במוח במידה מועטה.")}`,q:"q31"},
  {h:"סרוטונין והיסטמין",html:`${def("סרוטונין",`סרוטונין (5-HT) קשור למצב רוח, תיאבון, שינה וחרדה. הוא נבנה מ<b>טריפטופן</b>. גופי התאים נמצאים ב<b>גרעיני התפר</b> ${E("raphe nuclei")} בגזע המוח, במיוחד הגבי והמדיאלי.`)}${tiles([["check","פלואוקסטין (פרוזק)","מעכב קליטה חוזרת של סרוטונין: דיכאון וחרדה"],["bulb","בוספירון","אגוניסט חלקי לקולטן 5-HT1A: משכך חרדה"],["x","אונדנסטרון","אנטגוניסט לקולטן 5-HT3: נגד בחילות"],["target","פנפלורמין ו־MDMA","מגבירים פליטה של סרוטונין ו־NE"]])}${def("היסטמין",`נבנה מהחומצה האמינית <b>היסטידין</b>. גופי התאים בגרעין הפקעת הדדי ${E("TMN")} בהיפותלמוס האחורי, והוא חשוב ל<b>ערנות לאורך זמן</b>.`)}${ex(`<b>דיפנהידרמין</b>, אנטי־היסטמין מהדור הישן, חוצה את מחסום הדם-מוח ולכן גורם לישנוניות, ומשמש בתרופות שינה ללא מרשם. אנטי־היסטמינים חדשים לא חוצים את המחסום ולכן לא מרדימים.`)}`,q:"q33"}
 ]},
 {id:"t8",icon:"leaf",title:"פפטידים, ליפידים ושליחים אחרים",blocks:[
  {h:"פפטידים ואופיואידים",html:`${def("איך פפטידים שונים",`פפטידים נבנים ב<b>גוף התא</b> ומובלים לכפתור בשלפוחיות גדולות. הם נפלטים מכל חלקי הכפתור, לרוב רק בירי מהיר, ולעיתים <b>יחד</b> עם נוירוטרנסמיטר קלאסי. <b>אין להם קליטה חוזרת</b>: אנזימים מפרקים אותם. רבים מהם פועלים כנוירומודולטורים.`)}${def("אופיואידים",`<mark>אופיואידים פנימיים</mark> ${E("endogenous opioids")} הם פפטידים שהמוח מייצר ופועלים כמו אופיאטים: מפחיתים כאב ומעורבים בתגמול. אופיום, מורפין, הרואין, אוקסיקודון ומתדון הם <b>אגוניסטים</b> לקולטנים האופיאטיים.`)}${def("נלוקסון",`<mark>נלוקסון</mark> ${E("naloxone")} <b>חוסם</b> קולטנים אופיאטיים. הוא מציל חיים במנת יתר של הרואין.`)}${rem("<b>מתדון</b> הוא אגוניסט שמשמש טיפול תחליפי בהתמכרות להרואין.")}`,q:"q35"},
  {h:"קנבינואידים ושליחים מיוחדים",html:`${def("אנדו־קנבינואידים",`<mark>אנדו־קנבינואידים</mark> ${E("endocannabinoids")} הם <b>ליפידים</b> שהגוף מייצר. הם נקשרים לקולטני <b>CB1</b> במוח, שאליהם נקשר גם <b>THC</b>, החומר הפעיל במריחואנה ובחשיש. הם לא נאגרים בשלפוחיות אלא נוצרים <b>לפי דרישה</b>, ופועלים <b>אחורנית</b>: מהתא המקבל אל הכפתור, ומפחיתים פליטה.`)}${tiles([["leaf","THC","שיכוך כאב, הגברת תיאבון, פחות בחילה, פגיעה בזיכרון לטווח קצר"],["lock","רימונבנט","חוסם CB1: מדכא תיאבון ועוזר בגמילה מעישון"]])}${tiles([["clock","אדנוזין","נוקלאוזיד שמשמש נוירומודולטור (שינה, פרק 9). קפאין חוסם את הקולטנים שלו"],["bulb","חנקן חד־חמצני (NO)","גז מסיס שנוצר לפי דרישה ועובר דרך ממברנות"]])}`,q:"q37"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"למה ההשפעה של מלחי האמבט על לוקאס דמתה לזו של קוקאין?","a":"כי הם מגבירים דופמין וסרוטונין בסינפסה","w":["כי הם חוסמים קולטני גאבא במוח","כי הם מפעילים קולטנים אופיאטיים","כי הם מעכבים את פליטת האצטילכולין"],"e":"מלחי האמבט דומים לגת ומגבירים את המונואמינים בסינפסה, כמו קוקאין ומתאמפטמין. חסימת גאבא או פעולה על קולטנים אופיאטיים היו גורמות לתמונה אחרת."},{"q":"מה מלמדת ההחלמה של לוקאס כ־30 שעות אחרי שהפסיק?","a":"שההזיות נבעו מהשפעה ישירה של הסם","w":["שההזיות היו סימן למחלת נפש קבועה","שהסם גרם לנזק מוחי בלתי הפיך","שהגוף פיתח סבילות מלאה לסם"],"e":"כשהסם התפנה מהגוף, המחשבות וההתנהגות חזרו לקדמותן. זה מעיד שההזיות נגרמו מפעולת הסם, ולא מנזק קבוע או ממחלה."}]},
"q2":{"t":"t1","v":[{"q":"במה עוסקת הפסיכופרמקולוגיה?","a":"בהשפעת סמים על העצבים ועל ההתנהגות","w":["בייצור ובשיווק של תרופות בתעשייה","בהשפעת הורמונים על גדילת הגוף","בטיפול פסיכולוגי באנשים מכורים"],"e":"הפסיכופרמקולוגיה חוקרת איך סמים משנים את פעילות מערכת העצבים ואת ההתנהגות. הורמונים שהגוף מייצר אינם סמים לפי ההגדרה."},{"q":"מהו אתר פעולה של סם?","a":"המקום שבו הסם פועל על מולקולות","w":["האיבר שבו הסם מתפרק בסוף","המקום בגוף שבו נותנים את הסם","ההשפעה ההתנהגותית של הסם"],"e":"אתרי הפעולה הם המקומות שבהם מולקולות הסם משנות תהליכים בתאים, למשל קולטן. ההשפעה ההתנהגותית היא ״השפעת הסם״, מושג נפרד."}]},
"q3":{"t":"t1","v":[{"q":"איזה חומר אינו סם לפי ההגדרה בספר?","a":"נוירוטרנסמיטר שהגוף מייצר","w":["תרופה נגד דיכאון מבית המרקחת","קפאין שנמצא בכוס קפה","הרואין שמוזרק לווריד"],"e":"סם הוא חומר ממקור חיצוני, ולכן נוירוטרנסמיטרים והורמונים שהגוף מייצר אינם סמים. תרופות, קפאין והרואין מגיעים מבחוץ ופועלים במינון קטן."},{"q":"למה ההגדרה של סם כוללת ״במינונים קטנים יחסית״?","a":"כי כמעט כל חומר משנה תפקוד בכמות גדולה","w":["כי סמים מסוכנים רק במינון גדול","כי מינון קטן תמיד יעיל יותר","כי חומרים פעילים קיימים רק בכמויות קטנות"],"e":"אפילו מלח שולחן משנה את תפקוד התאים בכמות גדולה. ההגבלה למינונים קטנים מבדילה סמים מחומרים רגילים."}]},
"q4":{"t":"t1","v":[{"q":"מה מתאר את ״השפעות הסם״?","a":"השינויים בגוף ובהתנהגות","w":["המקום בתא שבו הסם נקשר","הדרך שבה הסם נכנס לגוף","קצב הפירוק של הסם בכבד"],"e":"השפעות הסם הן מה שקורה לאורגניזם: פחות כאב, אופוריה או האטת מעיים במורפין. המקום שבו הסם נקשר הוא אתר הפעולה."},{"q":"מה נכון לגבי סמים פסיכו־אקטיביים?","a":"הם משנים את תפקוד מערכת העצבים","w":["הם פועלים רק על השרירים","הם תמיד אסורים על פי החוק","הם מיוצרים בגוף באופן טבעי"],"e":"פסיכו־אקטיבי פירושו משפיע על מערכת העצבים. הם יכולים להיות תרופות חוקיות, והם ממקור חיצוני ולא מיוצרים בגוף."}]},
"q5":{"t":"t2","v":[{"q":"איזו דרך מתן מביאה לריכוז הגבוה והמהיר ביותר של קוקאין בדם?","a":"הזרקה לווריד","w":["רחרוח דרך האף","בליעה דרך הפה","שאיפה לריאות"],"e":"לפי איור 4.3, הזרקה לווריד מגיעה לשיא הגבוה והמהיר ביותר, אחריה שאיפה, ואחריהן רחרוח ובליעה."},{"q":"מה החיסרון של הזרקה תוך־ורידית?","a":"כל המנה נכנסת בבת אחת ואין דרך לעצור","w":["הסם מתפרק בקיבה לפני שהוא נספג","הספיגה איטית מאוד","היא לא מגיעה למוח בכלל"],"e":"ההזרקה לווריד מהירה, ולכן גם מסוכנת: אם המינון גבוה מדי, אי אפשר להחזיר אותו. פירוק בקיבה הוא חיסרון של מתן דרך הפה."}]},
"q6":{"t":"t2","v":[{"q":"למה משתמשים במתן תוך־חדרי (ICV)?","a":"כדי לעקוף את מחסום הדם-מוח","w":["כדי להאט את ספיגת הסם","כדי שהסם יתפרק בכבד","כדי שהסם יגיע לשרירים"],"e":"מתן ישר לחדרי המוח מכניס את הסם אל ה־CNS בלי לעבור את המחסום. זה שימושי בעיקר במחקר ובחומרים שלא חוצים אותו."},{"q":"באיזו דרך מתן נלקח קוקאין ב״הסנפה״?","a":"רחרוח דרך הקרום הרירי באף","w":["שאיפה של אדים אל הריאות","מתן מתחת ללשון","מתן מקומי על העור"],"e":"בהסנפה החומר נספג דרך הקרום הרירי שבאף. שאיפה פירושה אדים או עשן שמגיעים לריאות."}]},
"q7":{"t":"t2","v":[{"q":"למה הרואין פועל מהר וחזק יותר ממורפין?","a":"כי הוא מסיס יותר בשומן ועובר מהר למוח","w":["כי הוא נקשר חזק יותר לאלבומין בדם","כי הכבד מפרק אותו לאט יותר","כי הוא לא עובר את מחסום הדם-מוח"],"e":"מסיסות בשומן מאפשרת לעבור ממברנות ואת מחסום הדם-מוח. קשירה חזקה לאלבומין הייתה דווקא מעכבת את ההגעה למוח."},{"q":"מה קורה בקשירת מחסן?","a":"הסם נקשר לרקמות ומשתחרר לאט","w":["הסם מתפרק מיד בכבד","הסם נאגר בשלפוחיות סינפטיות","הסם יוצא מיד בשתן"],"e":"כשהסם נקשר למשל לאלבומין, פחות סם חופשי מגיע למוח בהתחלה, ואחר כך הוא משתחרר בהדרגה ומאריך את ההשפעה."}]},
"q8":{"t":"t2","v":[{"q":"איך קשירת מחסן משפיעה על תחילת ההשפעה של סם?","a":"מעכבת אותה, עד שהמחסנים מתמלאים","w":["מאיצה אותה, כי הסם מגיע מהר יותר","לא משפיעה, כי הסם פעיל גם כשהוא קשור","מבטלת אותה לגמרי"],"e":"בהתחלה הסם נקשר למחסנים ורק מעט ממנו חופשי. כשהם רוויים, יותר סם מגיע למוח, ובהמשך המחסנים משחררים אותו לאט."},{"q":"איפה מתפרקים רוב הסמים?","a":"בכבד, בעזרת אנזימים","w":["בכליות, בתהליך הסינון","בריאות, בזמן הנשימה","במוח, אחרי שהשפיעו"],"e":"הכבד מפרק את רוב הסמים, ולפעמים התוצרים פעילים בעצמם. הכליות אחראיות בעיקר להפרשה בשתן."}]},
"q9":{"t":"t3","v":[{"q":"מה קורה מעבר לנקודת ההשפעה המרבית בעקומת מינון ותגובה?","a":"אין תוספת השפעה, רק יותר סיכון","w":["ההשפעה ממשיכה לגדול באופן ישר","ההשפעה הרצויה נעלמת לגמרי","תופעות הלוואי נעלמות בהדרגה"],"e":"מעבר לנקודת ההשפעה המרבית, הגדלת המינון לא מוסיפה תועלת ורק מגדילה את הסיכון. לכן מינון גבוה יותר אינו בהכרח טוב יותר."},{"q":"מהו מדד ריפוי?","a":"היחס בין מינון רעיל למינון יעיל","w":["המינון המרבי שמותר לתת לחולה","מספר הימים עד שהסם מתחיל להשפיע","אחוז החולים שהבריאו אחרי הטיפול"],"e":"מדד הריפוי משווה בין המינון שגורם לרעילות ב־50% מהנבדקים לבין המינון שמשיג את ההשפעה ב־50%. ככל שהוא גבוה יותר, הסם בטוח יותר."}]},
"q10":{"t":"t3","v":[{"q":"לסם א' מדד ריפוי 100, ולסם ב' מדד 3. מה נכון?","a":"סם א' בטוח יותר","w":["סם ב' בטוח יותר","סם א' יעיל יותר","אין קשר בין המדד לבטיחות"],"e":"מדד גבוה פירושו פער גדול בין המינון היעיל לרעיל, ולכן מרווח בטיחות גדול. המדד לא אומר כמה הסם יעיל."},{"q":"מה המשמעות של זיקה גבוהה של סם לקולטן?","a":"הסם נקשר בקלות ופועל במינון נמוך","w":["הסם מתפרק מהר מאוד בכבד","הסם רעיל יותר מסמים אחרים","הסם נקשר לכל הקולטנים בגוף"],"e":"זיקה היא מידת הקלות שבה מולקולות מתחברות. סם אידאלי הוא בעל זיקה גבוהה לאתר המועיל ונמוכה לאתרים שגורמים לנזק."}]},
"q11":{"t":"t3","v":[{"q":"אדם צריך מנה גדולה יותר של סם כדי לקבל את אותה השפעה. מה התפתח?","a":"סבילות","w":["סנסיטיזציה","תסמיני גמילה","זיקה גבוהה"],"e":"סבילות היא ירידה ביעילות הסם בשימוש חוזר. סנסיטיזציה היא ההפך: הסם נעשה יעיל יותר בכל פעם."},{"q":"מה מסביר את תסמיני הגמילה?","a":"מנגנונים מפצים שנשארים בלי הסם","w":["נזק קבוע שהסם גרם למוח","הצטברות של הסם בתוך הכבד","אלרגיה שהתפתחה לסם עצמו"],"e":"בשימוש חוזר הגוף מפתח מנגנונים נגד השפעת הסם. כשהסם נעלם, המנגנונים פועלים בלי התנגדות, ולכן התסמינים הפוכים להשפעת הסם."}]},
"q12":{"t":"t3","v":[{"q":"הרואין גורם לאופוריה. מה צפוי בגמילה ממנו?","a":"דיספוריה: אומללות וחרדה","w":["אופוריה חזקה עוד יותר","שינה עמוקה וממושכת","אין שום תסמינים"],"e":"תסמיני גמילה הם בדרך כלל הפוכים להשפעת הסם. לכן אחרי סם שמשפר מצב רוח מופיעה תחושת אומללות."},{"q":"מה נכון לגבי סבילות למורפין?","a":"היא לא מתפתחת באותה מידה לכל ההשפעות שלו","w":["היא מתפתחת לכל ההשפעות באותה מידה","היא מתפתחת רק לתופעות הלוואי","היא לא מתפתחת בכלל"],"e":"סבילות לשיכוך הכאב ולאופוריה מתפתחת יותר מאשר להשפעות אחרות, כמו עצירות. לכן משתמשים מגדילים מינון ונחשפים לתופעות לוואי."}]},
"q13":{"t":"t3","v":[{"q":"למה קבוצת הביקורת בניסוי בתרופה בזריקה צריכה לקבל זריקת דמה?","a":"כי עצם הזריקה והציפייה משפיעים על התוצאות","w":["כי כך מקבלים מינון נמוך של התרופה","כי אסור לא לתת טיפול לנבדקים","כי זריקת דמה מחזקת את התרופה"],"e":"אם רק קבוצת הניסוי מקבלת זריקה, אי אפשר לדעת אם ההבדל נובע מהסם או מהציפייה וההליך. לכן הביקורת מקבלת פלצבו באותו אופן."},{"q":"מה נותנים לחיות בקבוצת הביקורת בניסוי בסם?","a":"זריקה של תמיסת מלח","w":["חצי מהמינון של הסם","שום דבר, רק משאירים אותן בכלוב","סם אחר בעל השפעה הפוכה"],"e":"גם אצל חיות, ההחזקה והזריקה משפיעות על ההתנהגות. זריקת תמיסת מלח מאפשרת לבודד את השפעת הסם עצמו."}]},
"q14":{"t":"t3","v":[{"q":"מה מעיד שאפקט הפלצבו בשיכוך כאב הוא אמיתי פיזיולוגית?","a":"נלוקסון, שחוסם אופיואידים, מבטל אותו","w":["הוא מופיע רק אצל מי שמאמין בתרופות","הוא חזק יותר מכל משכך כאב אמיתי","הוא קיים רק כשהנבדק יודע שזה פלצבו"],"e":"אם חוסם של קולטנים אופיאטיים מבטל את ההשפעה, היא נשענת על שחרור אופיואידים במוח. כלומר הציפייה משנה את הכימיה של המוח."},{"q":"מה מקור ההשפעה של סם דמה?","a":"הציפייה של הנבדק","w":["כמות קטנה של חומר פעיל","הטעם של הכדור","השפעה ישירה על הקולטנים"],"e":"פלצבו הוא חומר לא פעיל, וההשפעה שלו נובעת מהציפייה. זה בדיוק מה שהניסוי צריך לנטרל."}]},
"q15":{"t":"t4","v":[{"q":"מה הופך את L-DOPA לאגוניסט דופמינרגי?","a":"הוא מולקולת־קדם שמגדילה את ייצור הדופמין","w":["הוא חוסם את הקליטה החוזרת של דופמין","הוא נקשר לקולטני הדופמין ומפעיל אותם","הוא מעכב את האנזים MAO"],"e":"L-DOPA הוא שלב בייצור הדופמין, ולכן נתינתו מגדילה את הכמות שנוצרת ונפלטת. זה פועל בשלב הייצור, לא בקולטן."},{"q":"רזרפין חוסם את הנשאים שמכניסים מונואמינים לשלפוחיות. מה הוא?","a":"אנטגוניסט, כי השלפוחיות מתרוקנות","w":["אגוניסט, כי יותר מונואמינים נשארים בתא","אגוניסט ישיר בקולטן הפוסט־סינפטי","מולקולת־קדם של דופמין"],"e":"כשהנוירוטרנסמיטר לא נכנס לשלפוחיות, אין מה לפלוט, והוא מתפרק בתא. לכן רזרפין מפחית את ההשפעה, כלומר אנטגוניסט."}]},
"q16":{"t":"t4","v":[{"q":"בוטולינום מונע פליטת אצטילכולין. איך מסווגים אותו?","a":"אנטגוניסט, בשלב הפליטה","w":["אגוניסט, בשלב הפליטה","אנטגוניסט ישיר בקולטן","אגוניסט עקיף בקולטן"],"e":"מניעת פליטה מפחיתה את ההשפעה של הנוירוטרנסמיטר, ולכן זה אנטגוניסט. הוא פועל בכפתור, לא בקולטן."},{"q":"ארס עכביש האלמנה השחורה מעורר פליטת אצטילכולין. איך מסווגים אותו?","a":"אגוניסט, בשלב הפליטה","w":["אנטגוניסט, בשלב הפליטה","אגוניסט ישיר בקולטן","חוסם קולטנים"],"e":"הארס גורם לפליטה מסיבית, ולכן מגביר את ההשפעה. זו פעולה בשלב הפליטה, ולא קשירה לקולטן."}]},
"q17":{"t":"t4","v":[{"q":"מה ההבדל בין אגוניסט ישיר לחוסם קולטנים?","a":"שניהם נקשרים לאתר; הראשון מפעיל והשני לא","w":["הראשון נקשר לאתר אחר; השני לאותו אתר","הראשון פועל בכפתור; השני בתא המקבל","אין הבדל, שני השמות זהים"],"e":"שניהם נקשרים לאתר הקשירה של הנוירוטרנסמיטר. האגוניסט מפעיל את הקולטן, והחוסם תופס את המקום בלי להפעיל ומונע מהליגנד להיקשר."},{"q":"מה מאפיין קשירה לא תחרותית?","a":"הסם נקשר לאתר אחר ולא מתחרה בנוירוטרנסמיטר","w":["הסם נקשר לאותו אתר ודוחק את הנוירוטרנסמיטר","הסם מתחרה בנוירוטרנסמיטר על הנשא","הסם נקשר לאוטורצפטור בלבד"],"e":"בקשירה לא תחרותית הסם יושב באתר נפרד ומשנה את פעולת הקולטן. כך פועלים האגוניסטים והאנטגוניסטים העקיפים."}]},
"q18":{"t":"t4","v":[{"q":"בנזודיאזפינים נקשרים לאתר משלהם בקולטן GABA ומגבירים את פעולתו. מה הם?","a":"אגוניסטים עקיפים","w":["אגוניסטים ישירים","אנטגוניסטים עקיפים","חוסמי קולטנים"],"e":"הם לא נקשרים לאתר של גאבא, אבל מגבירים את השפעתו, ולכן הם אגוניסטים עקיפים. ישיר היה נקשר לאתר של גאבא עצמו."},{"q":"PCP נכנס לתוך תעלת NMDA וחוסם אותה. מה הוא?","a":"אנטגוניסט עקיף","w":["אנטגוניסט ישיר","אגוניסט עקיף","אגוניסט ישיר"],"e":"PCP לא נקשר לאתר של הגלוטמט, אלא לאתר בתוך התעלה, ומשבש את פעולת הקולטן. לכן הוא אנטגוניסט עקיף."}]},
"q19":{"t":"t4","v":[{"q":"סם חוסם אוטורצפטורים של נוירון. מה צפוי?","a":"יותר פליטה: הסם פועל כאגוניסט","w":["פחות פליטה: הסם פועל כאנטגוניסט","אין שינוי, כי אוטורצפטורים לא משפיעים","הנוירון יפסיק לייצר נוירוטרנסמיטר"],"e":"אוטורצפטורים מפחיתים את הפליטה. כשהם חסומים, הבלם הזה מוסר והנוירון פולט יותר, ולכן התוצאה היא אגוניזם."},{"q":"למה אפומורפין במינון נמוך פועל כאנטגוניסט דופמינרגי?","a":"כי הוא מפעיל בעיקר אוטורצפטורים, שמפחיתים פליטה","w":["כי הוא חוסם את הקולטנים הפוסט־סינפטיים","כי הוא מעכב את ייצור הדופמין","כי הוא מפרק דופמין בסינפסה"],"e":"במינון נמוך הוא מפעיל את האוטורצפטורים הרגישים, וזה מוריד את פליטת הדופמין. במינון גבוה הוא מפעיל גם קולטנים פוסט־סינפטיים ונעשה אגוניסט."}]},
"q20":{"t":"t4","v":[{"q":"קוקאין חוסם את הקליטה החוזרת של דופמין. מה התוצאה?","a":"יותר דופמין בסינפסה: אגוניסט","w":["פחות דופמין בסינפסה: אנטגוניסט","הדופמין מתפרק מהר יותר בסינפסה","הקולטנים לדופמין נחסמים"],"e":"כשהנשא חסום, הדופמין לא מוחזר לכפתור וממשיך להפעיל את הקולטנים. זה אגוניזם, בדומה לריטלין ולפרוזק במערכות שלהם."},{"q":"מה עושה אמפטמין לנשאי הדופמין?","a":"הופך את כיוונם, והם פולטים דופמין","w":["מגביר את קצב הקליטה החוזרת","הורס אותם לגמרי ולצמיתות","חוסם אותם בלי השפעה נוספת"],"e":"אמפטמין ומתאמפטמין לא רק חוסמים את הנשאים אלא הופכים את כיוונם, ולכן פולטים דופמין ונוראפינפרין לסינפסה."}]},
"q21":{"t":"t5","v":[{"q":"מה צריך כדי שתעלת קולטן NMDA תיפתח?","a":"גלוטמט וגם דפולריזציה","w":["קשירה של גלוטמט בלבד","דפולריזציה בלבד, בלי גלוטמט","קשירה של גאבא לאתר צמוד"],"e":"במנוחה יון מגנזיום חוסם את התעלה. רק כשגם הגלוטמט נקשר וגם הממברנה בדפולריזציה, התעלה נפתחת ומכניסה סידן."},{"q":"איזה יון חשוב עובר בתעלת NMDA?","a":"סידן","w":["כלוריד","אשלגן בלבד","מגנזיום"],"e":"תעלת NMDA מעבירה בעיקר סידן, וגם נתרן. המגנזיום הוא דווקא היון שחוסם אותה במנוחה."}]},
"q22":{"t":"t5","v":[{"q":"מהי הרעלה עקב גריית יתר של גלוטמט?","a":"מוות תאים מעודף גלוטמט וסידן","w":["התקף שנגרם מחוסר בגלוטמט","הפיכה של גלוטמט לגלוטמין","הזיות שנגרמות מ־PCP"],"e":"עודף גלוטמט, למשל בשבץ, מכניס יותר מדי סידן לתאים והורג אותם. הפיכת גלוטמט לגלוטמין היא תהליך תקין באסטרוציטים."},{"q":"מה תפקיד גלוטמין סינתטאז באסטרוציטים?","a":"להפוך גלוטמט לגלוטמין לשימוש חוזר","w":["לייצר גלוטמט מגאבא בכפתור","לפרק גאבא בתוך הסינפסה","לחסום את קולטני ה־NMDA"],"e":"האסטרוציטים קולטים גלוטמט מהסינפסה והופכים אותו לגלוטמין. הגלוטמין חוזר לנוירונים ומשמש לייצור גלוטמט חדש."}]},
"q23":{"t":"t5","v":[{"q":"מה תפקיד הגאבא במוח?","a":"הנוירוטרנסמיטר המעכב העיקרי","w":["הנוירוטרנסמיטר המעורר העיקרי","נוירומודולטור של שינה בלבד","הורמון שמופרש לדם"],"e":"גאבא הוא המעכב החשוב ביותר במוח, וגלוטמט הוא המעורר העיקרי. חוסר בפעילות גאבא גורם לירי מוגזם ולהתקפים."},{"q":"איזה יון עובר דרך קולטן GABAA?","a":"כלוריד","w":["סידן","נתרן","מגנזיום"],"e":"קולטן GABAA הוא קולטן יונוטרופי שפותח תעלת כלוריד, וזה מה שמעכב את הנוירון. תעלת סידן מאפיינת את NMDA."}]},
"q24":{"t":"t5","v":[{"q":"למה טיאגבין עוזר באפילפסיה?","a":"הוא חוסם נשאי גאבא ומגביר עכבה","w":["הוא חוסם את קולטני הגאבא במוח","הוא מגביר את פליטת הגלוטמט","הוא מעכב את ייצור הגאבא בתא"],"e":"כשהגאבא לא מסולק מהסינפסה, העכבה חזקה יותר וההתקפים פוחתים. חסימת קולטני גאבא הייתה גורמת להתקפים."},{"q":"איפה גליצין משמש נוירוטרנסמיטר מעכב חשוב?","a":"בגזע המוח התחתון ובמוח השדרה","w":["בקורטקס הקדם־מצחי","בהיפוקמפוס בלבד","בגרעיני התפר שבגזע המוח"],"e":"גליצין הוא נוירוטרנסמיטר מעכב בעיקר בגזע המוח התחתון ובמוח השדרה. בשאר המוח רוב העכבה היא של גאבא."}]},
"q25":{"t":"t6","v":[{"q":"איפה אצטילכולין הוא הנוירוטרנסמיטר?","a":"בסינפסות בין עצב לשריר שלד","w":["בנוירונים של החומר השחור","בגרעיני התפר בגזע המוח","באתר התכול בגשר"],"e":"ACh פועל בכל צומתי העצב והשריר, בגנגליונים האוטונומיים ובאיברי המטרה הפרסימפתיים. החומר השחור משתמש בדופמין, גרעיני התפר בסרוטונין והאתר התכול בנוראפינפרין."},{"q":"איזה אנזים מפרק אצטילכולין?","a":"אצטילכולין־אסטראז (AChE)","w":["כולין אצטיל־טרנספראז (ChAT)","מונואמין אוקסידאז (MAO)","גלוטמין סינתטאז"],"e":"AChE מפרק את ACh לכולין ואצטט. ChAT הוא האנזים שבונה אותו, ו־MAO מפרק מונואמינים."}]},
"q26":{"t":"t6","v":[{"q":"למה נאוסטיגמין מתאים לטיפול בחולשת שרירים חמורה?","a":"מעכב פירוק ACh ולא נכנס למוח","w":["הוא מחליף את הקולטנים שנפגעו","הוא מדכא את מערכת החיסון לצמיתות","הוא מגביר את פליטת הדופמין במוח"],"e":"הוא משאיר יותר ACh בצומת העצב־שריר, ובגלל שאינו חוצה את המחסום הוא כמעט לא משפיע על המוח. הוא לא מתקן את הקולטנים."},{"q":"מה הפעולה של רעל הבוטולינום?","a":"מונע פליטה של אצטילכולין, וגורם לשיתוק","w":["מעורר פליטה מסיבית של אצטילכולין","חוסם את הקולטנים המוסקריניים","מעכב את אצטילכולין־אסטראז"],"e":"הבוטולינום חוסם את הפליטה בצומת העצב־שריר, ולכן השרירים משותקים. פליטה מסיבית היא פעולת ארס האלמנה השחורה."}]},
"q27":{"t":"t6","v":[{"q":"איזה קולטן חוסם קורארה?","a":"את הקולטן הניקוטיני (יונוטרופי)","w":["את הקולטן המוסקריני (מטבוטרופי)","את קולטן GABAA","את קולטן NMDA"],"e":"קורארה חוסם את הקולטנים הניקוטיניים בשרירים וגורם לשיתוק. אטרופין הוא החוסם של הקולטנים המוסקריניים."},{"q":"מה השפעות האטרופין?","a":"הרחבת אישונים והפחתת רוק","w":["שיתוק מלא של שרירי השלד","הגברה של קצב הנשימה","הזיות חזותיות חזקות"],"e":"אטרופין חוסם קולטנים מוסקריניים, שאחראים בין השאר להצרת אישונים ולייצור רוק. שיתוק שרירי שלד נגרם מחסימת קולטנים ניקוטיניים."}]},
"q28":{"t":"t6","v":[{"q":"איזה צירוף נכון?","a":"קולטן מוסקריני: מטבוטרופי, מופעל במוסקרין","w":["קולטן מוסקריני: יונוטרופי, מופעל בניקוטין","קולטן ניקוטיני: מטבוטרופי, נחסם באטרופין","קולטן ניקוטיני: יונוטרופי, נחסם באטרופין"],"e":"הניקוטיני הוא יונוטרופי, מופעל בניקוטין ונחסם בקורארה. המוסקריני הוא מטבוטרופי, מופעל במוסקרין ונחסם באטרופין."},{"q":"איזה אזור במוח שולח נוירונים כולינרגיים לקורטקס ולהיפוקמפוס?","a":"מסד המוח הקדמי","w":["האתר התכול בגשר","גרעיני התפר בגזע המוח","החומר השחור במוח האמצעי"],"e":"הנוירונים הכולינרגיים במסד המוח הקדמי קשורים ללמידה ולקשב. האתר התכול נוראדרנרגי, גרעיני התפר סרוטונרגיים והחומר השחור דופמינרגי."}]},
"q29":{"t":"t7","v":[{"q":"איזו מערכת דופמינרגית מתנוונת במחלת פרקינסון?","a":"הניגרו־סטריאטלית","w":["המזולימבית","המזו־קורטיקלית","הנוראדרנרגית"],"e":"המערכת הניגרו־סטריאטלית יוצאת מהחומר השחור לגרעין הזנבי ולפוטמן וקשורה לתנועה. המזולימבית קשורה לתגמול."},{"q":"איזו מערכת דופמינרגית קשורה בעיקר לחיזוק ולתגמול?","a":"המזולימבית","w":["הניגרו־סטריאטלית","המזו־קורטיקלית","הסרוטונרגית"],"e":"המערכת המזולימבית יוצאת מהטגמנטום הגחוני לגרעין האקומבנס, לאמיגדלה ולהיפוקמפוס. המזו־קורטיקלית מגיעה לקורטקס הקדם־מצחי."}]},
"q30":{"t":"t7","v":[{"q":"איך כלורפרומזין מפחית תסמינים של סכיזופרניה?","a":"הוא חוסם קולטני דופמין D2","w":["הוא מגביר פליטת דופמין","הוא חוסם קליטה חוזרת של סרוטונין","הוא מעכב את האנזים MAO"],"e":"כלורפרומזין הוא אנטגוניסט לקולטני D2. מגביר דופמין או מעכב MAO היו פועלים בכיוון ההפוך."},{"q":"למה נותנים לחולי פרקינסון L-DOPA ולא דופמין?","a":"רק L-DOPA עובר את מחסום הדם-מוח","w":["דופמין רעיל יותר מ־L-DOPA","L-DOPA פועל ישירות על הקולטנים","דופמין מתפרק מיד בקיבה"],"e":"המחסום חוסם את הדופמין, אבל L-DOPA עובר והופך לדופמין בתוך המוח. L-DOPA הוא מולקולת־קדם, ולא נקשר לקולטנים."}]},
"q31":{"t":"t7","v":[{"q":"איזה אזור מכיל את גופי התאים הנוראדרנרגיים החשובים ביותר?","a":"האתר התכול, בגשר","w":["החומר השחור, במוח האמצעי","גרעיני התפר, בגזע המוח","גרעין הפקעת הדדי, בהיפותלמוס"],"e":"האתר התכול (locus coeruleus) קשור לערנות ולדריכות. החומר השחור דופמינרגי, גרעיני התפר סרוטונרגיים והפקעת הדדי היסטמינרגית."},{"q":"מהן דליות אקסוניות?","a":"עיבויים באקסון שפולטים חומר לסביבה","w":["סינפסות רגילות בקצה האקסון","נקבים קטנים במעטפת המיילין","שלוחות קטנות על הדנדריטים"],"e":"באקסונים נוראדרנרגיים רבים יש עיבויים שפולטים את החומר לסביבה, כמו נוירומודולטור. שלוחות קטנות על הדנדריטים הן עוקצים דנדריטיים."}]},
"q32":{"t":"t7","v":[{"q":"מה תפקיד המונואמין אוקסידאז (MAO)?","a":"לפרק מונואמינים עודפים","w":["לבנות דופמין מטירוזין","להכניס מונואמינים לשלפוחיות","להחזיר מונואמינים מהסינפסה"],"e":"MAO הוא אנזים בתוך הכפתורים שמפרק מונואמינים עודפים. החזרה מהסינפסה היא תפקיד הנשאים, וההכנסה לשלפוחיות של נשאי השלפוחית."},{"q":"מוקלובמיד חוסם את MAO-A. איך הוא פועל על המערכת הנוראדרנרגית?","a":"כאגוניסט, כי פחות נוראפינפרין מתפרק","w":["כאנטגוניסט, כי הייצור נחסם","כאגוניסט ישיר בקולטנים אדרנרגיים","אין לו השפעה על נוראפינפרין"],"e":"כשהאנזים המפרק חסום, יותר נוראפינפרין זמין לפליטה, ולכן ההשפעה מוגברת. הוא לא נקשר לקולטנים עצמם."}]},
"q33":{"t":"t7","v":[{"q":"איך פועל פלואוקסטין (פרוזק)?","a":"מעכב קליטה חוזרת של סרוטונין","w":["מפרק סרוטונין בתוך הסינפסה","חוסם את קולטני הסרוטונין","מעכב את ייצור הסרוטונין בתא"],"e":"פרוזק משאיר את הסרוטונין יותר זמן בסינפסה, ולכן הוא אגוניסט. הוא משמש לטיפול בדיכאון ובחרדה."},{"q":"איפה נמצאים גופי התאים הסרוטונרגיים?","a":"בגרעיני התפר בגזע המוח","w":["באתר התכול שבגשר","בחומר השחור במוח האמצעי","במסד המוח הקדמי"],"e":"רוב הנוירונים הסרוטונרגיים נמצאים בגרעיני התפר, בעיקר הגבי והמדיאלי. האתר התכול נוראדרנרגי, והחומר השחור דופמינרגי."}]},
"q34":{"t":"t7","v":[{"q":"למה דיפנהידרמין גורם לישנוניות?","a":"הוא חוסם היסטמין בתוך המוח","w":["הוא מגביר את פעילות הגאבא במוח","הוא מפעיל קולטנים אופיאטיים","הוא מעכב את פליטת הסרוטונין"],"e":"היסטמין חשוב לערנות, ודיפנהידרמין חוסם אותו במוח. אנטי־היסטמינים חדשים לא חוצים את המחסום, ולכן לא מרדימים."},{"q":"מאיזו חומצה אמינית נבנה היסטמין?","a":"היסטידין","w":["טריפטופן","טירוזין","גלוטמט"],"e":"היסטמין נבנה מהיסטידין. סרוטונין נבנה מטריפטופן, וקטכול־אמינים מטירוזין."}]},
"q35":{"t":"t8","v":[{"q":"במה פפטידים שונים מנוירוטרנסמיטרים קלאסיים?","a":"נבנים בגוף התא ואין להם קליטה חוזרת","w":["נבנים בכפתור ונקלטים חזרה","פועלים רק על קולטנים יונוטרופיים","נפלטים רק מאזור הפליטה בכפתור"],"e":"פפטידים מיוצרים בגוף התא ומובלים לכפתור, והם מפורקים באנזימים ולא נקלטים חזרה. הם גם נפלטים מכל חלקי הכפתור."},{"q":"מה תפקיד הנלוקסון?","a":"לחסום קולטנים אופיאטיים","w":["להפעיל קולטנים אופיאטיים","לחסום קולטני קנבינואידים","לעכב קליטה חוזרת של דופמין"],"e":"נלוקסון הוא אנטגוניסט לקולטנים האופיאטיים, ולכן משמש במנת יתר של הרואין. מתדון ומורפין הם אגוניסטים."}]},
"q36":{"t":"t8","v":[{"q":"מהם אופיואידים פנימיים?","a":"פפטידים של המוח שפועלים כאופיאטים","w":["סמים סינתטיים שדומים למורפין","קולטנים במוח שנקשרים להרואין","ליפידים שנקשרים לקולטני CB1"],"e":"המוח מייצר פפטידים כמו אנדורפינים שנקשרים לקולטנים האופיאטיים ומפחיתים כאב. ליפידים שנקשרים ל־CB1 הם אנדו־קנבינואידים."},{"q":"למה מתדון משמש בטיפול בהתמכרות להרואין?","a":"הוא אגוניסט לקולטנים האופיאטיים, ומשמש תחליף","w":["הוא חוסם את הקולטנים ומונע כל השפעה","הוא מפרק את ההרואין בדם","הוא מוריד את החשק בלי לפעול על קולטנים"],"e":"מתדון נקשר לאותם קולטנים כמו הרואין, ולכן מפחית תסמיני גמילה. החוסם הוא נלוקסון."}]},

const SUM=`<h2>סיכום: פרק 4 - פסיכופרמקולוגיה</h2>
<div class="key"><b>על מה מדובר?</b> הפרק מלמד איך לנבא מה סם יעשה. לשם כך שואלים שלוש שאלות: (1) <b>איך הוא מגיע למוח, מהר כמה ובאיזו כמות</b> (פרמקוקינטיקה); (2) <b>באיזה שלב בסינפסה הוא פועל, ובאיזה כיוון</b>: מגביר את פעולת הנוירוטרנסמיטר (<b>אגוניסט</b>) או מחליש אותה (<b>אנטגוניסט</b>); (3) <b>על איזו מערכת</b> נוירוטרנסמיטר (דופמין, סרוטונין, גאבא וכו׳). מהתשובות נגזרות ההשפעות, תופעות הלוואי, הסבילות והגמילה.</div>

<h3>הדוגמה שתלווה אותנו: לוקאס ו״מלחי האמבט״</h3>
<p>לוקאס הגיע למיון אחרי שלקח ״מלחי אמבט״: חומרים סינתטיים שדומים לגת. הוא היה חסר מנוחה, לא ישן, והזה. אחרי כ־30 שעות בלי הסם הכל חלף. נשתמש בו כדי לענות על שלוש השאלות: איך הסם הגיע למוח שלו, על מה הוא פעל, ולמה ההשפעה נגמרה.</p>

<h3>1. הגדרות</h3>
<ul>
<li><b>סם</b> = חומר <b>מבחוץ</b>, שהתאים לא צריכים כדי לתפקד, ושמשנה תפקוד <b>בכמות קטנה</b>. לכן נוירוטרנסמיטרים והורמונים של הגוף, מזון וויטמינים <b>אינם</b> סמים.</li>
<li>צריך להבחין בין <b>השפעות הסם</b> (מה קורה לגוף ולהתנהגות: אצל לוקאס, חוסר מנוחה והזיות) לבין <b>אתרי הפעולה</b> (איפה המולקולה פועלת: אצל לוקאס, מערכות הדופמין והסרוטונין).</li>
</ul>

<h3>2. פרמקוקינטיקה: הדרך של הסם בגוף</h3>
<p>השאלה הראשונה היא איך הסם מגיע למוח. יש ארבעה שלבים: <b>ספיגה, פיזור, פירוק והפרשה</b>.</p>
<ul>
<li><b>דרך המתן קובעת מהירות.</b> בקוקאין: זריקה לווריד הכי מהירה, אחריה שאיפה (עישון), אחריה הסנפה, ובליעה הכי איטית. בבליעה חלק מהסם מתפרק בקיבה ובכבד לפני שמגיע למוח. זריקה ישירה למוח או לחדרים עוקפת את מחסום הדם־מוח.</li>
<li><b>מסיסות בשומן</b> = מעבר מהיר למוח. לכן הרואין מגיע מהר יותר וחזק יותר ממורפין.</li>
<li><b>קשירה ל״מחסן״</b> (שומן בגוף, חלבון אלבומין בדם): חלק מהסם ״נתקע״ שם, וזה מעכב את תחילת ההשפעה, אבל גם מאריך אותה.</li>
<li><b>פירוק</b> בעיקר בכבד (לפעמים לתוצרים שגם הם פעילים), ו<b>הפרשה</b> בעיקר בשתן. אצל לוקאס, ההשפעה חלפה אחרי שהגוף פירק והפריש את החומר.</li>
</ul>

<h3>3. יעילות ושימוש חוזר</h3>
<p>אחרי שהסם מגיע, השאלה היא כמה ממנו צריך, ומה קורה כשלוקחים אותו שוב ושוב:</p>
<ul>
<li><b>עקומת מינון־תגובה:</b> ככל שמעלים את המינון ההשפעה גדלה, עד מקסימום. מעבר לזה רק <b>הסיכון</b> עולה.</li>
<li><b>מדד ריפוי</b> = המינון שרעיל ל־50% חלקי המינון שיעיל ל־50%. מדד <b>גבוה = בטוח</b> (יש מרחק גדול בין יעיל לרעיל).</li>
<li>למה סמים שונים ביעילות? כי הם פועלים על <b>אתר</b> אחר, או כי יש להם <b>זיקה</b> אחרת לקולטן (כמה ״חזק״ הם נקשרים).</li>
<li><b>סבילות</b> = עם הזמן הסם משפיע פחות (פחות קולטנים, קולטנים פחות מגיבים, או פירוק מהיר יותר). היא לא אחידה: אפשר לפתח סבילות להשפעה אחת ולא לאחרת. <b>סנסיטיזציה</b> = ההפך, הסם משפיע יותר.</li>
<li><b>גמילה</b> = תסמינים <b>הפוכים</b> להשפעת הסם. הסיבה: הגוף בנה <b>מנגנונים שמפצים</b> על הסם, וכשהסם נעלם הם נשארים בלי מה שיאזן אותם. זו <b>תלות פיזית</b>.</li>
<li><b>פלצבו:</b> קבוצת ביקורת צריכה לעבור <b>בדיוק</b> אותו הליך (בחיות: זריקה של מי מלח). אפקט פלצבו על כאב <b>נחסם בנלוקסון</b>, וזה מראה שהוא נעשה דרך אופיואידים שהגוף מייצר.</li>
</ul>

<h3>4. המפה: איפה בסינפסה סם יכול לפעול</h3>
<p>זו השאלה השנייה, וזה הלב של הפרק. נזכור מפרק 2 את השלבים בסינפסה: ייצור החומר, אחסון בשלפוחיות, פליטה, קשירה לקולטן, וסיום. בכל שלב סם יכול להגביר (אגוניסט) או להחליש (אנטגוניסט):</p>
<div class="tw"><table><tr><th>שלב</th><th>אגוניסט (מגביר)</th><th>אנטגוניסט (מחליש)</th></tr>
<tr><td><b>ייצור</b></td><td>נותנים את חומר הגלם (L-DOPA)</td><td>מעכבים את האנזים שמייצר</td></tr>
<tr><td><b>אחסון</b></td><td>—</td><td>חוסמים את ההכנסה לשלפוחיות (רזרפין)</td></tr>
<tr><td><b>פליטה</b></td><td>מגרים פליטה (ארס אלמנה שחורה), או הופכים את כיוון הנשאים (אמפטמין)</td><td>מונעים פליטה (בוטולינום)</td></tr>
<tr><td><b>קולטן</b></td><td>מפעילים אותו ישירות (ניקוטין) או בעקיפין (בנזודיאזפינים)</td><td>חוסמים אותו ישירות (קורארה) או בעקיפין (PCP)</td></tr>
<tr><td><b>אוטורצפטור</b></td><td><b>חוסמים</b> אותו, ולכן התא פולט יותר</td><td><b>מפעילים</b> אותו, ולכן התא פולט פחות (אפומורפין במינון נמוך)</td></tr>
<tr><td><b>סיום</b></td><td>חוסמים קליטה חוזרת (קוקאין, ריטלין, פרוזק) או מעכבים את האנזים המפרק (נאוסטיגמין, מעכבי MAO)</td><td>—</td></tr></table></div>
<ul>
<li><b>ישיר מול עקיף:</b> סם <b>ישיר</b> נקשר בדיוק למקום שבו נקשר הנוירוטרנסמיטר. סם <b>עקיף</b> נקשר למקום <b>אחר</b> על הקולטן, ומגביר או משבש משם.</li>
<li><b>אצל לוקאס:</b> מלחי האמבט, כמו גת ואמפטמין, <b>מגבירים דופמין וסרוטונין</b> בסינפסה. כלומר הם אגוניסטים, ודופמין עודף מסביר את חוסר המנוחה ואת ההזיות.</li>
</ul>

<h3>5. מערכות הנוירוטרנסמיטרים</h3>
<p>השאלה השלישית היא על איזו מערכת הסם פועל. כל מערכת אחראית על דברים אחרים, ולכן סמים שפועלים עליה גורמים להשפעות שונות.</p>
<h4>חומצות אמיניות: העירור והעיכוב העיקריים</h4>
<ul>
<li><b>גלוטמט</b> = החומר <b>המעורר</b> העיקרי. לקולטן ה־<b>NMDA</b> יש תכונה מיוחדת: הוא נפתח רק אם יש <b>גם</b> גלוטמט <b>וגם</b> דפולריזציה (שמוציאה יון מגנזיום שחוסם אותו), ואז מכניס סידן. לכן הוא חשוב ללמידה. PCP חוסם אותו מבפנים התעלה. עודף גלוטמט הורג תאים, למשל בשבץ.</li>
<li><b>גאבא</b> = החומר <b>המעכב</b> העיקרי. הקולטן GABA<sub>A</sub> הוא תעלת כלור. בנזודיאזפינים, ברביטורטים ואלכוהול מגבירים אותו בעקיפין, ולכן מרגיעים. חוסר גאבא גורם להתקפים. <b>גליצין</b> מעכב בגזע המוח התחתון ובמוח השדרה.</li>
</ul>
<h4>אצטילכולין</h4>
<p>פועל בצומת עצב־שריר (זוכרים את קתרין מפרק 2), בגנגליונים של המערכת האוטונומית ובאיברים פרסימפתיים. במוח: שנת חלום (REM), למידה וקשב. יש שני סוגי קולטנים: <b>ניקוטיני</b> (יונוטרופי, קורארה חוסם אותו) ו<b>מוסקריני</b> (מטבוטרופי, אטרופין חוסם אותו). האנזים AChE מפרק אותו.</p>
<h4>מונואמינים</h4>
<p>ארבעה חומרים, שכל אחד יוצא מאזור קטן ומשפיע על כל המוח. הטבלה מסכמת מאיפה הם יוצאים, מה הם עושים, ודוגמה לסם:</p>
<div class="tw"><table><tr><th>חומר</th><th>מאיפה</th><th>תפקידים</th><th>סמים לדוגמה</th></tr>
<tr><td><b>דופמין</b></td><td>החומר השחור, VTA</td><td>תנועה, תגמול, תכנון</td><td>L-DOPA, כלורפרומזין (חוסם D2), קוקאין, ומלחי האמבט של לוקאס</td></tr>
<tr><td><b>נוראפינפרין</b></td><td>האתר הכחול (לוקוס צרולאוס)</td><td>ערנות ודריכות</td><td>מוקלובמיד (מעכב MAO-A)</td></tr>
<tr><td><b>סרוטונין</b></td><td>גרעיני התפר</td><td>מצב רוח, שינה, תיאבון</td><td>פרוזק, בוספירון, MDMA</td></tr>
<tr><td><b>היסטמין</b></td><td>גרעין בהיפותלמוס</td><td>ערנות</td><td>דיפנהידרמין (חוסם, ולכן מרדים)</td></tr></table></div>
<p>לדופמין שלוש מערכות: <b>ניגרו־סטריאטלית</b> (תנועה; נפגעת בפרקינסון), <b>מזולימבית</b> (תגמול; קשורה להתמכרות), ו<b>מזוקורטיקלית</b> (לקדם־מצחי).</p>
<h4>פפטידים, ליפידים ואחרים</h4>
<ul>
<li><b>פפטידים</b> נבנים בגוף התא, ו<b>אין להם קליטה חוזרת</b>. דוגמה: <b>אופיואידים</b> שהגוף מייצר. מורפין, הרואין ומתדון מפעילים את הקולטנים שלהם; <b>נלוקסון</b> חוסם אותם (ומציל במנת יתר).</li>
<li><b>אנדוקנבינואידים</b> הם שומנים (ליפידים) שנוצרים <b>לפי דרישה</b>, ופועלים <b>אחורה</b>: מהתא המקבל אל התא הפולט, דרך קולטני CB1. THC מפעיל אותם; רימונבנט חוסם.</li>
<li><b>אדנוזין</b> (קפאין חוסם אותו, ולכן מעורר), ו־<b>NO</b> (גז שעובר דרך ממברנות).</li>
</ul>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>מפעיל אוטורצפטורים = אנטגוניסט; חוסם אוטורצפטורים = אגוניסט.</b> כי האוטורצפטור מקטין את הפליטה.</li>
<li><b>חוסם קליטה חוזרת = אגוניסט</b>, כי החומר נשאר יותר זמן בסינפסה.</li>
<li><b>PCP הוא אנטגוניסט עקיף</b>: הוא לא נקשר במקום של הגלוטמט, אלא בתוך התעלה.</li>
<li><b>נותנים L-DOPA ולא דופמין</b>, כי דופמין לא עובר את מחסום הדם־מוח.</li>
<li><b>נאוסטיגמין לא נכנס למוח</b>, ולכן מתאים לטיפול בשרירים.</li>
<li><b>מדד ריפוי גבוה = בטוח</b>, לא ״חזק״.</li>
<li><b>לפפטידים אין קליטה חוזרת.</b></li>
<li><b>גמילה = הפוך מהסם</b>, בגלל מנגנונים מפצים.</li>
</ul></div>

<h3>קשרים לפרקים הבאים</h3>
<p>שיטות להזרקת חומרים למוח ולמדידת נוירוטרנסמיטרים (מיקרודיאליזה) ← פרק 5.</p>`;
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#phys" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){S.done[T[ti].id]={r,n};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#sum"&&typeof SUM!=="undefined")summary();else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
