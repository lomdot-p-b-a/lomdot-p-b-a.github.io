<!doctype html>
<html lang="he" dir="rtl">
<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: האם ריטלין מסייע בדיסלקסיה?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"התקציר והשאלה",blocks:[
  {h:"התקציר",html:`${def("על מה הנושא",`האם ריטלין, תרופה לקשב, יכול לעזור גם בקריאה? הנושא מציג את התקציר ואת השאלה של המחקר.<br><b>מה נלמד כאן:</b> בשורה התחתונה · שגמ · שאלת המחקר`)}<p><mark>מתילפנידאט</mark> ${E("Methylphenidate")}, הידוע בשם המסחרי <b>ריטלין</b>, הוא אחת משיטות הטיפול העיקריות בהפרעת קשב. רבים מבעלי הפרעת קשב סובלים גם מ<b>דיסלקסיה</b>, אבל רק מחקרים מעטים בדקו את השפעת התרופה על קריאה, ואף אחד לא בדק את השפעתה על <b>סוגי דיסלקסיה</b> שונים ועל <b>סוגי טעויות</b> שונים.</p>${tiles([["people","20 נבדקים","ילדים, בני נוער ומבוגרים עם הפרעת קשב ועם דיסלקסיה על בסיס קשבי־אורתוגרפי","המדגם של המחקר: אנשים עם הפרעת קשב ועם דיסלקסיה שקשורה לקשב, שנוטלים ריטלין. כך אפשר לבדוק אם התרופה משפיעה על הקריאה שלהם.","כל נבדק קרא פעם בלי ריטלין ופעם עם ריטלין, והשוו את מספר הטעויות."],["split","פעמיים","הקריאה נבדקה פעם עם ריטלין ופעם בלי","כל משתתף נבדק פעמיים: פעם אחרי שלקח ריטלין ופעם בלי. כך כל אחד ״משמש ביקורת של עצמו״, וההבדל נובע מהתרופה.","שגמ קרא את אותו סוג רשימה פעם ביום עם ריטלין ופעם ביום בלי, וספרו כמה טעויות עשה בכל פעם."],["chart","מה נמדד","שיעור הטעויות מכל סוג, קצב הקריאה, וביצוע במטלות קריאה שונות"]])}${def("בשורה התחתונה",`ריטלין שיפר תפקוד ב<b>מטלות קשב כלליות</b>, אבל <b>לא הפחית</b> טעויות קריאה בדיסלקסיית שיכול אותיות ובדיסלקסיה קשבית. לכן, מלבד המשמעות לטיפול, הממצא מלמד שהליקויים האלה <b>נפרדים</b> מקשב כללי.`)}`,q:"q1"},
  {h:"שגמ, והשאלה",html:`${ex("\"יש לי זיכרון מעולה לצורות... אני מזהה את האותיות, אני זוכרת אותן, אבל לא את המיקום שלהן\". כך תיארה שגמ, אישה עם דיסלקסיית שיכול אותיות, דיסלקסיה קשבית והפרעת קשב.")}<p>ריטלין הוא התרופה הנפוצה ביותר כיום לטיפול בהפרעות קשב, אבל השפעתו על סוגים שונים של דיסלקסיה עוד לא נבדקה. <b>מטרת המחקר:</b> לבדוק את השפעת הריטלין על דיסלקסיות שמקורן קשבי, ועל סוגי טעויות שונים בקריאה.</p>${tiles([["check","אם יש קשר לקשב כללי","ריטלין משפר קשב, ולכן <b>ישפר גם את הקריאה</b>"],["x","אם הליקוי ספציפי לאותיות","גם אם הקשב הכללי ישתפר, הקריאה <b>לא בהכרח</b> תשתפר"]])}${rem("זה ההיגיון של המחקר: התשובה לשאלה הטיפולית (האם ריטלין עוזר?) עונה גם על שאלה תיאורטית (האם הליקוי בקריאה הוא חלק מהקשב הכללי?).")}`,q:"q3"}
 ]},
 {id:"t2",icon:"doc",title:"דיסלקסיה ושלוש הדיסלקסיות הקשביות",blocks:[
  {h:"מהי דיסלקסיה",html:`${def("על מה הנושא",`יש כמה סוגי דיסלקסיה, ושלושה מהם קשורים לקשב. הנושא מסביר מה זו דיסלקסיה, ומה קורה בכל אחד מהסוגים.<br><b>מה נלמד כאן:</b> דיסלקסיה · שיכול אותיות · שלוש דיסלקסיות קשביות · איך הקשב נכשל`)}${def("מושג מפתח",`<mark>דיסלקסיה</mark> ${E("Dyslexia")}: שם כללי למגוון הפרעות קריאה, <b>מולדות או נרכשות</b>, שנגרמות מליקויים ב<b>שלבים שונים</b> של תהליך הקריאה.`)}<p>השלב הראשון בקריאה הוא <mark>הנתח הוויזואלי־אורתוגרפי</mark>. יש לו כמה פונקציות שיכולות להיפגע בנפרד, וכל פגיעה יוצרת סוג אחר של דיסלקסיה עם דפוס טעויות משלו:</p>${fig("dys")}`,q:"q5"},
  {h:"שלוש דיסלקסיות על בסיס קשבי",html:`<p>לגבי שלוש דיסלקסיות הוצע שהבסיס שלהן <b>קשבי־אורתוגרפי</b>: קושי עם מאפיינים קשביים שחל על מילים כתובות.</p>${tiles([["target","נגלקסיה (נגלקט)","קושי להפנות קשב לאחד מצדי המילה, לרוב השמאלי: השמטה, החלפה או הוספה של אותיות בצד המוזנח","סוג של דיסלקסיה שבה הקשב לא מגיע לצד אחד של המילה. לכן יש טעויות דווקא בצד הזה.","קורא עם נגלקסיה שמאלית עלול לקרוא ״שמלה״ כ״שמל״, כי לא שם לב לאות האחרונה משמאל."],["copies","דיסלקסיית מיקום אותיות (LPD)",`${E("Letter position dyslexia")} שיכול של אותיות <b>אמצעיות</b>, בעיקר במילים נדידיות. גם השמטה של אות שמופיעה פעמיים`,"הקורא מזהה נכון את האותיות, אבל מתבלבל בסדר שלהן באמצע המילה. בולט במילים שבהן שינוי הסדר יוצר מילה אחרת.","קורא את ״כלבים״ כ״כבלים״, כי שתי האותיות האמצעיות התחלפו."],["link","דיסלקסיה קשבית",`${E("Attentional dyslexia")} אותיות <b>נודדות בין מילים</b>, והמיקום היחסי שלהן נשמר. בעיקר במילים ארוכות ובאות האחרונה`,"האותיות עצמן מזוהות נכון, אבל ״נודדות״ למילה הסמוכה ונשארות באותו מקום במילה. זה קורה בעיקר כשקוראים כמה מילים יחד.","בצמד ״חלב דבש״, שגמ קורא ״חלש דבב״: האות האחרונה עברה בין המילים, ונשארה בסוף."]])}${def("מילים נדידיות",`מילים ששיכול האותיות האמצעיות בהן יוצר <b>מילה קיימת</b> אחרת, כמו תריס–תירס או מעשנת–משענת.`)}${ex(`<b>שיכול אותיות</b>: ילד שקורא "מרפק" במקום "מפרק". הקשב לא "מחזיק" את הסדר של האותיות באמצע המילה.`)}`,q:"q7"},
  {h:"איך הקשב \"נכשל\"",html:`${tiles([["copies","ב-LPD: זרקור הקשב","הקורא מפנה קשב קודם לאות הראשונה והאחרונה וממקם אותן. אחר כך הקשב מופנה לכל האותיות האמצעיות <b>יחד</b>, וקשה לו להפנות קשב לכל אחת בנפרד ולקשר אותה למיקום שלה"],["link","בדיסלקסיה קשבית: חלון הקשב","מנגנון \"חלון הקשב\" בקריאה פגוע, ולכן יחידות <b>מחוץ לחלון</b> נקלטות ומפריעות לעיבוד מילת המטרה"]])}${rem("בדיסלקסיה קשבית יש נדידות <b>אופקיות</b> (ממילה מימין או משמאל) וגם <b>אנכיות</b> (ממילה מעל או מתחת). יש גם השמטת אות כפולה שמופיעה באותו מיקום בשתי מילים, ודחיסה או דחיקה של אות ממילה למילה.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"brain",title:"קשב כללי או קשב אורתוגרפי?",blocks:[
  {h:"מילים מול מספרים",html:`${def("על מה הנושא",`האם הבעיה בקשב כללי, או בקשב שמיועד רק למילים כתובות?<br><b>מה נלמד כאן:</b> מילים מול מספרים · דיסוציאציה · שינוי הקשב`)}<p>מהו הקשר בין הליקוי הקשבי־אורתוגרפי ליכולת הקשב הכללית? כיוון ראשון לתשובה מגיע מהשוואה של <b>קריאת מילים</b> ל<b>קריאת מספרים</b>.</p>${def("דיסוציאציה",`מחקרים מצאו נבדקים שמתקשים בקריאת מילים אבל קוראים <b>מספרים</b> כרגיל: בנגלקסיה התפתחותית, בדיסלקסיה ויזואלית ובדיסלקסיית שיכול אותיות. זו עדות לכך שהנתח הוויזואלי־אורתוגרפי <b>ספציפי למילים</b>, ושהקושי <b>אינו קשבי כללי</b> אלא קשבי־אורתוגרפי.`)}${ex(`<b>דיסוציאציה</b>: אדם שמתקשה לקרוא מילים, אבל קורא מספרים בלי שום בעיה. זה מרמז שהבעיה לא בקשב הכללי, אלא בקשב שמיועד לאותיות.`)}`,q:"q11"},
  {h:"כיוון שני: לשנות את הקשב",html:`<p>כיוון נוסף: <b>לשנות</b> את יכולת הקשב הכללית ולבדוק מה קורה לקריאה. ריטלין מאפשר לעשות את זה.</p>${tiles([["check","9 מתוך 20 (45%)","השתפרו בדיוק במבחני קשב ממוחשבים עם ריטלין"],["clock","14 מתוך 20 (70%)","השתפרו בזמני התגובה: היו מהירים יותר"]])}${rem("זה ממצא ממחקר קודם של החוקרות על אותם נבדקים (קידר, פרידמן ושלו־מבורך, 2011), במבחנים של ארבע מערכות קשב: קשב מתמשך, סלקטיבי, הפניית קשב ובקרת קשב. כלומר הריטלין <b>אכן שיפר קשב</b>. השאלה כאן: האם הוא ישפר גם את הקריאה?")}`,q:"q13"}
 ]},
 {id:"t4",icon:"flask",title:"מתילפנידאט: איך הוא פועל",blocks:[
  {h:"המנגנון",html:`${def("על מה הנושא",`איך ריטלין פועל במוח.<br><b>מה נלמד כאן:</b> המנגנון · סוגי ריטלין`)}<p>הפרעת קשב נחשבת קשורה לחוסר איזון של <b>מוליכים עצביים</b>, בעיקר <mark>דופאמין</mark> ו<mark>נוראפינפרין</mark>. תרופות <b>מעוררות</b> (סטימולנטים), ובמיוחד מתילפנידאט, הן אחת הגישות העיקריות לטיפול.</p>${tiles([["brain","איפה","דופאמין מרוכז בקורטקס הפרונטלי ובגרעיני הבסיס: אזורים חשובים לקשב, ארגון, תכנון, מוטיבציה ושליטה מוטורית","הדופאמין פועל בעיקר באזורים שאחראים על קשב ותכנון. לכן כשיש בו חוסר, הקשב נפגע.","ריטלין מעלה את רמת הדופאמין באזורים האלה, וזה עוזר להתרכז."],["flask","מה הוא עושה","מעלה את רמת הדופאמין והנוראפינפרין, כנראה על ידי <b>חסימת הספיגה החוזרת</b> של דופאמין, בעיקר בסטריאטום"],["question","מה לא ידוע","למרות השימוש הנפוץ, מנגנון הפעולה עוד לא הובן עד הסוף"]])}${def("סוגים",`ריטלין רגיל הוא <b>קצר טווח</b>. יש גם סוגים <b>ארוכי טווח</b>: קונצרטה, ריטלין LA ${E("Long-acting")}, ריטלין SR ${E("Slow release")}. במאמר "ריטלין" הוא שם כולל לכל התרופות האלה.`)}`,q:"q15"}
 ]},
 {id:"t5",icon:"doc",title:"מה ידוע על ריטלין וקריאה",blocks:[
  {h:"מחקרים קודמים",html:`${def("על מה הנושא",`מה כבר היה ידוע על ריטלין וקריאה לפני המחקר הזה?<br><b>מה נלמד כאן:</b> מחקרים קודמים · לוקוב ופרידמן`)}<p>מעט מחקרים בדקו את השפעת הריטלין על קריאה, ואף אחד לא הסתכל בנפרד על דיסלקסיות שונות ועל סוגי טעויות.</p>${tiles([["chart","Keulers et al. (2007)","ילדים דוברי הולנדית: עם ריטלין קראו נכון יותר מילים ומילות תפל <b>בדקה</b>. אבל הקריאה נשארה מתחת לממוצע. אולי הריטלין שיפר רק את היכולת להתמודד עם משימה מוגבלת בזמן"],["doc","Bental & Tirosh (2008)","25 בנים בעברית: הדיוק השתפר, אבל לא ברור אילו מילים ואילו דיסלקסיות. והתוצאות לא שורדות תיקון בונפרוני להשוואות מרובות"],["people","Wright et al. (2011)","2 נבדקים: טיפול בקריאה עם ריטלין עבד טוב יותר. אבל זה כנראה כי הילד יכול לשבת בסבלנות וללמוד, לא שיפור ישיר בדיוק"]])}${rem("בכל המחקרים האלה אפשר לייחס את השיפור ל<b>תנאים שמגבילים קריאה ולמידה</b> (סבלנות, עמידה בזמן), ולא לשיפור בליקוי הקריאה עצמו.")}`,q:"q17"},
  {h:"מחקר ראשוני: לוקוב ופרידמן",html:`${def("לוקוב ופרידמן (2007)",`בדקו <b>חמישה</b> בעלי דיסלקסיית שיכול אותיות: אצל שניים הטעויות ירדו, ואצל שלושה לא היה הבדל. נבדקת אחת שלא השתפרה בקריאה בקול, <b>כן</b> השתפרה במטלת זהה–שונה שדורשת קשב מתמשך.`)}${rem("לסיכום המבוא: אין מחקרים שבדקו את השפעת הריטלין על <b>סוגי</b> דיסלקסיה ו<b>סוגי</b> טעויות. יש סימנים שהיכולת לבצע משימות לאורך זמן משתפרת, וזה יכול לשפר קריאה <b>בעקיפין</b>.")}`,q:"q19"}
 ]},
 {id:"t6",icon:"people",title:"השיטה",blocks:[
  {h:"הנבדקים",html:`${def("על מה הנושא",`איך המחקר נבנה: מי השתתפו, איך אבחנו, ומה בדקו.<br><b>מה נלמד כאן:</b> נבדקים וביקורת · אבחון · מבדקים · ניתוח`)}${tiles([["people","20 נבדקים","ממרכז הארץ, עם דיסלקסיה התפתחותית ממקור קשבי והפרעת קשב, שנוטלים ריטלין","המדגם של המחקר: אנשים עם הפרעת קשב ועם דיסלקסיה שקשורה לקשב, שנוטלים ריטלין. כך אפשר לבדוק אם התרופה משפיעה על הקריאה שלהם.","כל נבדק קרא פעם בלי ריטלין ופעם עם ריטלין, והשוו את מספר הטעויות."],["grad","14 תלמידים","כיתות ד' עד ט': 13 בכיתה רגילה ואחד בכיתת לקויי למידה","רוב המדגם היו תלמידים בגיל בית ספר, כמעט כולם בכיתות רגילות.","תלמיד בכיתה ו׳ בכיתה רגילה, שנוטל ריטלין."],["id","6 מבוגרים","4 סטודנטים, אחת עם תואר ראשון ואחת עם תואר שני","חלק קטן מהמדגם היו מבוגרים, רובם סטודנטים. כך המחקר כלל גם קוראים מנוסים.","סטודנטית לתואר ראשון עם הפרעת קשב ודיסלקסיה, שנוטלת ריטלין בזמן הלימודים."]])}<p>כולם אובחנו בעבר עם ADD או ADHD ונוטלים מתילפנידאט בסוגים ובמינונים שונים, לפי המלצת נוירולוג או פסיכיאטר. רוב הילדים נוטלים כל יום, וחלק מהמבוגרים רק כשצריך להתרכז במיוחד, למשל במבחן.</p>${def("קבוצת ביקורת",`34 ילדים בכיתות ד' עד ז', ו-359 מבוגרים מעל גיל 18, <b>בלי</b> הפרעות נוירולוגיות, קשב, שפה, קריאה או כתיבה.`)}`,q:"q21"},
  {h:"אבחון הדיסלקסיות",html:`<p>כל נבדק עבר <mark>מבדק סינון</mark> בקריאה בקול: <b>תלתן</b> (פרידמן וגביעון, 2003). הוא כולל 136 מילים, 30 צמדי מילים ו-30 מילות תפל, שנבחרו כך שיהיו רגישים לסוגי דיסלקסיה שונים. מי שלא היו לו דיסלקסיה או הפרעת קשב <b>לא נכלל</b>.</p>${tiles([["copies","LPD","שיכולי אותיות אמצעיות, בעיקר במילים נדידיות","דיסלקסיה של מיקום אותיות: מזהים את האותיות, אבל מבלבלים את הסדר שלהן בתוך המילה, בעיקר באותיות האמצעיות.","קורא ״כלב״ כ״לכב״: אותן אותיות, סדר אחר."],["link","קשבית","נדידות אותיות בין מילים, אופקית או אנכית","בדיסלקסיה קשבית האותיות עוברות ממילה למילה, לרוחב (מילה ליד מילה) או לגובה (מילה מעל מילה).","בטבלה של שתי שורות, אות מהמילה שבשורה העליונה ״יורדת״ למילה שמתחתיה."],["doc","שטח","קריאה \"לפי הכללים\" של מילים לא רגולריות","דיסלקסיה ״שטחית״: קוראים כל מילה לפי כללי ההגייה, ולכן נכשלים במילים שלא נקראות לפי הכללים.","מילה שלא נכתבת בדיוק כמו שהיא נהגית נקראת ״לפי הכללים״, ולכן יוצאת מילה אחרת או מילה שלא קיימת."],["question","קבאק","קושי באמות קריאה: טעויות באותיות תנועה","קושי באותיות שמסמנות תנועה (ו׳, י׳ ועוד): מחליפים או מוסיפים אותן בטעות.","קורא ״דובי״ במקום ״דבי״, או ״שיר״ במקום ״שור״."]])}${rem("נבדק נחשב לקוי כשהיו לו <b>במובהק יותר טעויות</b> מהסוג הרלוונטי מבני גילו בקבוצת הביקורת. לכל הנבדקים הייתה <b>LPD</b>, ולרובם גם דיסלקסיה קשבית (18 מתוך 20).")}`,q:"q23"},
  {h:"מבדקי ההמשך",html:`${testsTable}${rem("חלק מהמבדקים דורשים קריאה <b>בקול</b>, וחלק <b>לא</b> (זהה–שונה, הכרעה, תמונה, \"מה קשור\"). המבדקים בלי פלט קולי חדגוניים ונמשכים זמן, ולכן אולי יושפעו יותר מקשב כללי.")}`,q:"q25"},
  {h:"ההליך והניתוח",html:`${fig("design","מערך המחקר")}<p>המבדקים הועברו בחדר שקט. הסדר הוחלף בין נבדקים כדי למנוע <b>אפקט למידה</b> של המבחנים. הנבדקים התבקשו לקרוא מהר ומדויק, וידעו שהזמן נמדד. ארבעה מבוגרים קראו מילים בחשיפה קצרה על מסך (300 מילישניות למילה, 800 לזוג). התשובות הוקלטו, ו<b>התגובה הראשונה</b> היא שנספרה, בלי תיקונים עצמיים.</p>${def("הניתוח הסטטיסטי",`${E("χ²")} להשוואת נבדק עם ובלי ריטלין. מבחן t של Crawford & Howell להשוואת נבדק לקבוצת הביקורת. ${E("Wilcoxon")} להשוואת הקבוצה בשני התנאים. ותיקון ${E("FDR")} להשוואות מרובות.`)}`,q:"q27"}
 ]},
 {id:"t7",icon:"check",title:"מה נמצא (לפי התקציר והדיון)",blocks:[
  {h:"הממצאים",html:`${def("על מה הנושא",`מה נמצא?<br><b>מה נלמד כאן:</b> הממצאים`)}${yn(["ריטלין שיפר ביצוע במטלות קשב כלליות"],["לא הפחית שיכולי אותיות (LPD)","לא הפחית נדידות בין מילים (קשבית)","לא הפחית טעויות אחרות: קריאה דרך הממיר (שטח) וטעויות תנועה (קבאק)"])}${def("קצב",`בזמני הקריאה היו <b>הבדלים בין אנשים</b>: אצל חלק הריטלין קיצר את הזמן ואצל חלק האריך. המסקנה: ריטלין יכול לעזור לקרוא <b>מהר יותר</b> ביחס לעצמו, אבל לא בהכרח <b>מדויק יותר</b>.`)}${rem("<b>המשמעות התיאורטית:</b> הקשב השתפר והקריאה לא. לכן הליקוי הקשבי־אורתוגרפי בקריאה <b>נפרד</b> מהקשב הכללי.")}`,q:"q29"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מה היה חסר במחקר הקודם על ריטלין וקריאה, לפי התקציר?","a":"בדיקה לפי סוג הדיסלקסיה וסוג הטעות","w":["בדיקה של ילדים בגיל בית ספר","בדיקה של ריטלין בכלל על קשב","בדיקה של אנשים בלי הפרעת קשב"],"e":"מחקרים קודמים בדקו ריטלין וקריאה באופן כללי. מה שהיה חסר, והוא החידוש של המחקר, הוא בדיקה לפי סוג הדיסלקסיה ולפי סוג הטעות."},{"q":"מה השם הגנרי של ריטלין?","a":"מתילפנידאט","w":["דופאמין","נוראפינפרין","קונצרטה"],"e":"השם הגנרי של ריטלין הוא מתילפנידאט. קונצרטה היא סוג ארוך טווח של אותה תרופה, ודופאמין הוא מוליך עצבי, לא תרופה."}]},
"q2":{"t":"t1","v":[{"q":"ריטלין שיפר את הקשב של הנבדקים, אבל לא הפחית טעויות קריאה. מה המסקנה התיאורטית?","a":"הליקוי בקריאה נפרד מהקשב הכללי","w":["ריטלין לא משפיע על קשב בכלל","הליקוי בקריאה הוא חלק מהקשב הכללי","הנבדקים לא נטלו את התרופה כראוי"],"e":"אם ריטלין שיפר את הקשב, אבל טעויות הקריאה לא ירדו, הליקוי בקריאה נפרד מהקשב הכללי. הם לא אותו דבר. ריטלין כן השפיע על הקשב."},{"q":"מה מצא המחקר לפי התקציר?","a":"שיפור בקשב, בלי ירידה בטעויות הקריאה","w":["שיפור גם בקשב וגם בדיוק הקריאה","ירידה גם בקשב וגם בדיוק הקריאה","שיפור בקריאה, בלי שום שיפור בקשב"],"e":"לפי התקציר, ריטלין שיפר את הקשב, אבל לא הפחית את טעויות הקריאה בדיסלקסיות הקשביות. דיוק הקריאה לא השתפר."}]},
"q3":{"t":"t1","v":[{"q":"שגמ מזהה וזוכרת את האותיות, אבל לא את המיקום שלהן. לאיזה סוג דיסלקסיה זה מתאים?","a":"שיכול אותיות","w":["דיסלקסיית שטח","נגלקסיה","דיסלקסיה ויזואלית"],"e":"כשאדם מזהה וזוכר את האותיות, אבל לא את המיקום שלהן, זו דיסלקסיית שיכול אותיות (LPD). הבעיה היא במיקום, ולא בזיהוי האותיות."},{"q":"מה ציפו החוקרות אם הדיסלקסיה הקשבית קשורה לקשב הכללי?","a":"שריטלין ישפר גם את הקריאה","w":["שריטלין יפגע בקריאה","שריטלין לא ישפיע על הקשב","שהקריאה תשתפר רק בלי ריטלין"],"e":"אם הדיסלקסיה הקשבית קשורה לקשב הכללי, ריטלין, שמשפר קשב, צפוי לשפר גם את הקריאה. זה ההיגיון של הניסוי."}]},
"q4":{"t":"t1","v":[{"q":"למה מחקר טיפולי (״האם ריטלין עוזר?״) עונה גם על שאלה תיאורטית?","a":"כי התוצאה מגלה אם הליקוי חלק מהקשב הכללי","w":["כי כל מחקר טיפולי הוא גם תיאורטי","כי התרופה משנה את מבנה המוח לצמיתות","כי התיאוריה קובעת מה יהיה המינון"],"e":"התוצאה של המחקר הטיפולי מגלה גם אם הליקוי בקריאה הוא חלק מהקשב הכללי: אם שיפור בקשב לא משפר קריאה, הם נפרדים. כך שתי השאלות נענות בניסוי אחד."},{"q":"מה היה המערך הבסיסי של המחקר?","a":"כל נבדק נבדק פעם עם ריטלין ופעם בלי","w":["שתי קבוצות: אחת עם ריטלין ואחת בלי","בדיקה אחת בלבד, עם ריטלין","השוואה בין ריטלין לתרופה אחרת"],"e":"כל נבדק נבדק פעם עם ריטלין ופעם בלי, ומושווה לעצמו. היו 20 נבדקים. לא היו שתי קבוצות נפרדות."}]},
"q5":{"t":"t2","v":[{"q":"איך מוגדרת דיסלקסיה במאמר?","a":"שם כללי להפרעות קריאה שונות","w":["הפרעה אחת וזהה לכל מי שסובל ממנה","בעיה בראייה שמונעת קריאה","חוסר אינטליגנציה שמשפיע על קריאה"],"e":"במאמר, דיסלקסיה היא שם כללי להפרעות קריאה שונות, שכל אחת נובעת מליקוי בשלב אחר בתהליך הקריאה. זו לא הפרעה אחת וזהה."},{"q":"מהו השלב הראשון בקריאה, לפי המאמר?","a":"ניתוח חזותי","w":["הבנת המשפט","הפקת הצלילים","שליפת המשמעות"],"e":"השלב הראשון בקריאה הוא ניתוח חזותי של האותיות, ופגיעה בפונקציות שלו יוצרת דיסלקסיות שונות. הבנת המשפט מגיעה מאוחר יותר."}]},
"q6":{"t":"t2","v":[{"q":"איזו מהבאות אינה פונקציה של הנתח הוויזואלי־אורתוגרפי?","a":"הבנת משמעות המשפט","w":["זיהוי האותיות","קידוד מיקום האותיות","שיוך האותיות למילה"],"e":"הנתח הוויזואלי־אורתוגרפי מזהה אותיות, מקודד את מיקומן ומשייך אותן למילה. הבנת משמעות המשפט מגיעה מאוחר יותר בתהליך."},{"q":"פגיעה בשיוך האותיות למילה הנכונה גורמת ל:","a":"דיסלקסיה קשבית","w":["דיסלקסיית מיקום אותיות","דיסלקסיית שטח","נגלקסיה"],"e":"פגיעה בשיוך האותיות למילה הנכונה גורמת לדיסלקסיה קשבית, שבה אותיות נודדות בין מילים. בדיסלקסיית מיקום אותיות הבעיה היא בסדר בתוך המילה."}]},
"q7":{"t":"t2","v":[{"q":"תלמיד קורא ״תירס״ במקום ״תריס״. מה הסוג?","a":"שיכול אותיות","w":["דיסלקסיה קשבית","נגלקסיה","דיסלקסיית שטח"],"e":"״תירס״ במקום ״תריס״ הוא שיכול של אותיות אמצעיות בתוך מילה אחת, במילה נדידית. זו דיסלקסיית שיכול אותיות. דיסלקסיה קשבית הייתה מעבירה אותיות בין מילים."},{"q":"מהי מילה נדידית?","a":"מילה ששיכול באמצעה יוצר מילה","w":["מילה שמופיעה פעמיים במשפט","מילה שקשה מאוד לבטא נכון","מילה לועזית שנכנסה לעברית"],"e":"מילה נדידית היא מילה ששיכול של אותיות באמצעה יוצר מילה אחרת, כמו מעשנת–משענת."}]},
"q8":{"t":"t2","v":[{"q":"קורא משמיט באופן קבוע את האות בצד שמאל של כל מילה. איזה סוג זה?","a":"נגלקסיה","w":["דיסלקסיית מיקום אותיות","דיסלקסיה קשבית","דיסלקסיית שטח"],"e":"השמטה קבועה של האות בצד אחד, כאן צד שמאל, היא נגלקסיה: קושי להפנות קשב לצד אחד. בשיכול אותיות כל האותיות קיימות, רק בסדר אחר."},{"q":"בצמד ״לב חם״, קורא אומר ״חב לם״. איזה סוג זה?","a":"דיסלקסיה קשבית","w":["דיסלקסיית מיקום אותיות","נגלקסיה","דיסלקסיית שטח"],"e":"ב״חב לם״ במקום ״לב חם״, אותיות עוברות בין המילים, והמיקום בתוך המילה נשמר. זו דיסלקסיה קשבית. בשיכול אותיות הסדר משתנה בתוך מילה אחת."}]},
"q9":{"t":"t2","v":[{"q":"לפי ההסבר המוצע, למה ב-LPD האות הראשונה והאחרונה נקראות נכון?","a":"כי הקשב ממקם אותן קודם","w":["כי הן תמיד אותיות קלות לזיהוי","כי הן מודגשות בכתב הרגיל","כי הן לא נחוצות להבנת המילה"],"e":"לפי ההסבר המוצע ל-LPD, הקשב ממקם קודם את האות הראשונה והאחרונה, והקושי הוא לקשר כל אות אמצעית למיקום שלה. לכן הקצוות נקראים נכון."},{"q":"מה ההסבר הקשבי לדיסלקסיה קשבית?","a":"חלון הקשב בקריאה פגוע","w":["זרקור הקשב פונה רק ימינה","הזיכרון לאותיות פגוע","המשמעות של המילה לא מובנת"],"e":"לפי ההסבר הקשבי לדיסלקסיה קשבית, חלון הקשב בקריאה פגוע, ולכן יחידות שמחוץ לחלון, מילים אחרות, מפריעות. זרקור שפונה לצד אחד מתאים לנגלקסיה."}]},
"q10":{"t":"t2","v":[{"q":"אות נודדת ממילה שבשורה מעל למילה שבשורה מתחת. איך נקראת נדידה כזו?","a":"נדידה אנכית","w":["נדידה אופקית","שיכול אמצעי","השמטה צדדית"],"e":"נדידה של אות ממילה בשורה אחת למילה בשורה שמתחתיה היא נדידה אנכית, מאפיין של דיסלקסיה קשבית. נדידה אופקית היא בין מילים באותה שורה."},{"q":"איזו טעות נוספת מופיעה בדיסלקסיית מיקום אותיות?","a":"השמטת אות כפולה","w":["הוספת אות בצד שמאל","קריאה של מילה לועזית","החלפה של אותיות תנועה"],"e":"בדיסלקסיית מיקום אותיות מופיעה, בנוסף לשיכול, גם השמטה של אות כפולה. הוספת אות בצד אחד אינה מאפיינת אותה."}]},
"q11":{"t":"t3","v":[{"q":"אדם מתקשה לקרוא מילים, אבל קורא מספרים בלי בעיה. מה זה מרמז?","a":"שהבעיה ספציפית למילים","w":["שהבעיה היא בקשב הכללי","שהבעיה בזיכרון למספרים","שהבעיה היא בראייה עצמה"],"e":"קושי בקריאת מילים, יחד עם קריאה תקינה של מספרים, מרמז שהבעיה ספציפית למילים ולא לקשב הכללי. זו דיסוציאציה."},{"q":"באילו דיסלקסיות דווחה דיסוציאציה בין מילים למספרים?","a":"נגלקסיה, ויזואלית ו-LPD","w":["רק בדיסלקסיית שטח","רק בדיסלקסיה קשבית","באף דיסלקסיה"],"e":"דיסוציאציה בין מילים למספרים דווחה בנגלקסיה, בדיסלקסיה ויזואלית וב-LPD. זו עדות לקשב אורתוגרפי ספציפי, ולא כללי."}]},
"q12":{"t":"t3","v":[{"q":"מה הכוונה ב״קושי קשבי־אורתוגרפי״?","a":"קושי קשבי שמופיע דווקא במילים כתובות","w":["קושי קשבי שמופיע בכל משימה","קושי בזיהוי צורות האותיות","קושי בשמיעת צלילי המילים"],"e":"״קושי קשבי־אורתוגרפי״ הוא קושי קשבי שמופיע דווקא במילים כתובות, ולא בכל משימה. לכן קריאת מספרים לא נפגעת."},{"q":"איזה ממצא היה מראה שהקושי בקריאה נובע מקשב כללי?","a":"שריטלין, שמשפר קשב, היה משפר גם את הקריאה","w":["שקריאת מספרים תקינה","שהנבדקים קוראים לאט","שהטעויות מופיעות רק במילים נדידיות"],"e":"אם הקושי בקריאה היה נובע מקשב כללי, ריטלין, שמשפר קשב, היה משפר גם את הקריאה. זה לא מה שנמצא, ולכן הקושי ספציפי."}]},
"q13":{"t":"t3","v":[{"q":"למה חשוב שבמחקר קודם על אותם נבדקים ריטלין שיפר קשב?","a":"כי כך אפשר לבדוק אם קשב משופר משפר קריאה","w":["כי זה מוכיח שריטלין משפר קריאה","כי זה מראה שהנבדקים לא זקוקים לתרופה","כי זה מבטל את הצורך בקבוצת ביקורת"],"e":"כדי לבדוק אם קשב משופר משפר קריאה, צריך קודם לוודא שהקשב באמת השתפר. מחקר קודם על אותם נבדקים הראה שריטלין שיפר את הקשב שלהם."},{"q":"מה מצא המחקר הקודם על השפעת ריטלין במבחני קשב?","a":"שיפור אצל חלק ניכר","w":["שיפור אצל כל 20 הנבדקים","אין שיפור אצל אף נבדק","החמרה אצל רוב הנבדקים"],"e":"במחקר הקודם ריטלין שיפר את הקשב אצל חלק ניכר מהנבדקים: 45% בדיוק ו-70% בזמני תגובה. לא אצל כולם."}]},
"q14":{"t":"t3","v":[{"q":"מהו ״הכיוון השני״ לבדוק את הקשר בין קשב לקריאה?","a":"לשנות את הקשב בעזרת ריטלין ולבדוק את הקריאה","w":["להשוות קריאת מילים לקריאת מספרים","לבדוק ילדים בלי הפרעת קשב בכלל","לשאול את הנבדקים מה הם מרגישים"],"e":"״הכיוון השני״ הוא לשנות את הקשב בעזרת ריטלין, ולבדוק אם הקריאה משתנה. הכיוון הראשון היה הדיסוציאציה בין מילים למספרים."},{"q":"אילו מערכות קשב נבדקו במחקר הקודם?","a":"ארבע מערכות קשב שונות","w":["רק קשב חזותי","רק קשב שמיעתי","זיכרון, שפה וקריאה"],"e":"במחקר הקודם נבדקו ארבע מערכות קשב שונות. הוא לא בדק רק קשב חזותי."}]},
"q15":{"t":"t4","v":[{"q":"לאיזה חוסר איזון קשורה הפרעת קשב, לפי המאמר?","a":"דופאמין ונוראפינפרין","w":["סרוטונין ומלטונין","אינסולין וקורטיזול","אצטילכולין וגאבא"],"e":"לפי המאמר, הפרעת קשב קשורה לחוסר איזון של המוליכים העצביים דופאמין ונוראפינפרין. סרוטונין אינו אחד מהם."},{"q":"איך מתילפנידאט כנראה פועל?","a":"חוסם ספיגה חוזרת של דופאמין","w":["מוריד את רמת הדופאמין במוח","מגביר ייצור של סרוטונין","חוסם קולטנים לנוראפינפרין"],"e":"מתילפנידאט כנראה חוסם את הספיגה החוזרת של דופאמין, וכך מעלה את רמתו במוח. הוא לא מוריד את הדופאמין."}]},
"q16":{"t":"t4","v":[{"q":"איפה מרוכז הדופאמין, לפי המאמר?","a":"בפרונטלי ובגרעיני הבסיס","w":["בהיפוקמפוס ובאמיגדלה","במוח הקטן ובגזע המוח","בקליפת המוח העורפית"],"e":"לפי המאמר, הדופאמין מרוכז בעיקר באזור הפרונטלי ובגרעיני הבסיס, אזורים שקשורים לקשב, לתכנון ולשליטה מוטורית. לא בהיפוקמפוס."},{"q":"איזה מהבאים הוא סוג ארוך טווח של מתילפנידאט?","a":"קונצרטה","w":["ריטלין רגיל","דופאמין","נוראפינפרין"],"e":"קונצרטה היא סוג ארוך טווח של מתילפנידאט, וכך גם ריטלין LA ו-SR. ריטלין רגיל הוא קצר טווח."}]},
"q30":{"t":"t4","v":[{"q":"מה נכון לגבי הידע על מנגנון הפעולה של ריטלין?","a":"הוא עדיין לא הובן עד הסוף","w":["הוא ידוע לגמרי ומוסבר","הוא זהה לכל התרופות","הוא לא קשור לדופאמין"],"e":"למרות השימוש הנפוץ בריטלין, מנגנון הפעולה שלו עדיין לא הובן עד הסוף. ידוע שהוא קשור לדופאמין."},{"q":"במאמר, למה ״ריטלין״ משמש כשם כולל?","a":"לכל סוגי המתילפנידאט","w":["רק לריטלין הקצר הרגיל","לכל תרופות הפסיכיאטריה","רק לתרופות שאינן מעוררות"],"e":"במאמר, ״ריטלין״ משמש שם כולל לכל סוגי המתילפנידאט: קונצרטה, ריטלין LA ו-SR. לא רק לריטלין הקצר הרגיל."}]},
"q31":{"t":"t4","v":[{"q":"למה הפרעת קשב מטופלת דווקא בתרופה מעוררת?","a":"כי היא מעלה את רמת הדופאמין והנוראפינפרין","w":["כי היא מרדימה את המטופל בלילה","כי היא מורידה את רמת הדופאמין","כי היא משפרת את הראייה והשמיעה"],"e":"הפרעת קשב קשורה לחוסר איזון של דופאמין ונוראפינפרין, ותרופה מעוררת מעלה את רמתם. לכן מטפלים בתרופה מעוררת. היא לא מורידה את רמת הדופאמין."},{"q":"מה מבדיל ריטלין רגיל מקונצרטה?","a":"ריטלין רגיל קצר טווח, קונצרטה ארוכת טווח","w":["ריטלין רגיל ארוך טווח, קונצרטה קצרה","הם פועלים על מוליכים שונים","קונצרטה אינה מתילפנידאט"],"e":"שתיהן מתילפנידאט, אבל ריטלין רגיל קצר טווח, וקונצרטה ארוכת טווח. המסיח הראשון הופך ביניהן."}]},
"q17":{"t":"t5","v":[{"q":"ילדים עם ריטלין קראו יותר מילים נכון בדקה (Keulers). למה זה לא מוכיח שהליקוי בקריאה השתפר?","a":"אולי ריטלין שיפר רק עבודה מול שעון","w":["כי הקריאה השתפרה מעל הממוצע","כי הילדים לא נטלו ריטלין באמת","כי הם דוברי הולנדית ולא עברית"],"e":"ריטלין אולי שיפר את היכולת לעבוד מול שעון, ולא את הליקוי בקריאה. הקריאה של הילדים נשארה מתחת לממוצע, ולכן זה לא מוכיח שהליקוי השתפר."},{"q":"מה הבעיה בתוצאות של Bental & Tirosh?","a":"פירוט חסר, ואין תיקון להשוואות","w":["המדגם היה של בנות בלבד","הם לא בדקו דיוק בכלל","הם בדקו רק מבוגרים"],"e":"ב-Bental & Tirosh הפירוט חסר, ואין תיקון להשוואות מרובות. כשמתקנים (בונפרוני), התוצאות לא נשארות מובהקות."}]},
"q18":{"t":"t5","v":[{"q":"ילד עם ריטלין התקדם מהר יותר בטיפול בקריאה (Wright). מה ההסבר הסביר?","a":"הוא הצליח לשבת וללמוד","w":["הריטלין ריפא את הדיסלקסיה","הטיפול היה קצר יותר מהרגיל","המטפל היה מומחה יותר מאחרים"],"e":"ההתקדמות המהירה יותר בטיפול בקריאה נבעה כנראה מכך שהילד הצליח לשבת וללמוד, כלומר שיפור עקיף. הריטלין לא ריפא את הדיסלקסיה."},{"q":"מה המשותף לכל המחקרים הקודמים?","a":"השיפור נובע מתנאי הלמידה","w":["כולם מצאו שריטלין פוגע בקריאה","כולם בדקו דיסלקסיות לפי סוג","כולם נעשו על מבוגרים בלבד"],"e":"במחקרים הקודמים, השיפור נבע כנראה מתנאי הלמידה, כמו סבלנות ועמידה בזמן, ולא משינוי בליקוי בקריאה. הם לא בדקו דיסלקסיות לפי סוג."}]},
"q19":{"t":"t5","v":[{"q":"אצל לוקוב ופרידמן, נבדקת לא השתפרה בקריאה בקול, אבל השתפרה במטלת זהה–שונה. מה זה מרמז?","a":"שריטלין עוזר בקשב מתמשך","w":["שריטלין משפר את הקריאה בקול","שהנבדקת לא נטלה את התרופה","שמטלת זהה–שונה לא אמינה"],"e":"הנבדקת לא השתפרה בקריאה בקול, אבל השתפרה במטלת זהה–שונה, מטלה חדגונית וארוכה. זה מרמז שריטלין עוזר בעיקר בקשב מתמשך, ולא בקריאה."},{"q":"מה מצאו לוקוב ופרידמן אצל חמישה בעלי LPD?","a":"חלק השתפרו","w":["כולם השתפרו","אף אחד לא השתפר","כולם החמירו"],"e":"לוקוב ופרידמן מצאו שחלק מחמשת בעלי ה-LPD השתפרו, וחלק לא. התוצאות היו מעורבות."}]},
"q20":{"t":"t5","v":[{"q":"מה מסכם המבוא לגבי מה שידוע על ריטלין וקריאה?","a":"יש סימנים לשיפור עקיף בלבד","w":["ברור שריטלין משפר כל סוג של דיסלקסיה","ברור שריטלין פוגע בקריאה אצל כולם","אין שום מחקר קודם על ריטלין וקריאה"],"e":"המבוא מסכם שיש סימנים לשיפור עקיף בלבד בקריאה עם ריטלין, דרך תנאי הלמידה. זה הפער שהמחקר בא לסגור. לא ברור שריטלין משפר כל דיסלקסיה."},{"q":"איך היכולת לעבוד לאורך זמן יכולה לשפר קריאה?","a":"בעקיפין, בלי לשנות את הליקוי עצמו","w":["ישירות, על ידי תיקון הליקוי","רק אצל מבוגרים","רק בדיסלקסיית שטח"],"e":"היכולת לעבוד לאורך זמן, סבלנות ומשך עבודה, יכולה לשפר קריאה בעקיפין, בלי לשנות את הליקוי עצמו."}]},
"q21":{"t":"t6","v":[{"q":"למה היה צורך בקבוצת ביקורת גדולה של ילדים ומבוגרים בלי ליקויים?","a":"כדי לקבוע מה חריג","w":["כדי לתת להם ריטלין","כדי להשוות בין תרופות","כדי לבדוק את המבדקים"],"e":"קבוצת ביקורת גדולה של ילדים ומבוגרים בלי ליקויים מאפשרת לקבוע מה חריג, כלומר להשוות כל נבדק לנורמה של בני גילו. היא לא קיבלה ריטלין."},{"q":"מי היו הנבדקים?","a":"20 עם הפרעת קשב ודיסלקסיה","w":["20 בלי הפרעת קשב בכלל","20 ילדים שמעולם לא נטלו ריטלין","20 מבוגרים עם דיסלקסיית שטח"],"e":"הנבדקים היו 20 אנשים עם הפרעת קשב ודיסלקסיה: 14 תלמידים ו-6 מבוגרים. כולם נטלו ריטלין דרך קבע."}]},
"q22":{"t":"t6","v":[{"q":"מבוגרת נוטלת ריטלין רק לפני מבחנים. מה זה מראה על הנבדקים?","a":"שהשימוש לא היה אחיד","w":["שהיא לא מתאימה למחקר","שהיא לא אובחנה עם הפרעת קשב","שריטלין לא משפיע עליה"],"e":"מבוגרת שנוטלת ריטלין רק לפני מבחנים מראה שהשימוש לא היה אחיד בין הנבדקים: סוגים ומינונים שונים. זה לא אומר שהיא לא מתאימה למחקר."},{"q":"מה היה המשותף לכל הנבדקים לפני המחקר?","a":"כולם אובחנו ונוטלים ריטלין","w":["כולם היו בני אותו גיל","כולם למדו באותה כיתה","כולם היו בלי דיסלקסיה"],"e":"לפני המחקר, כל הנבדקים אובחנו עם הפרעת קשב ונטלו ריטלין, לפי המלצה של נוירולוג או פסיכיאטר. הם לא היו בני אותו גיל."}]},
"q23":{"t":"t6","v":[{"q":"מהו מבדק ״תלתן״?","a":"מבדק סינון בקריאה","w":["מבחן קשב ממוחשב","שאלון על הרגלי קריאה","מבחן הבנת הנקרא"],"e":"״תלתן״ הוא מבדק סינון בקריאה: 136 מילים, 30 צמדים ו-30 מילות תפל. הוא לא מבחן קשב."},{"q":"מתי נחשב נבדק לקוי בסוג מסוים של דיסלקסיה?","a":"כשיש לו יותר טעויות מבני גילו","w":["כשהוא טועה לפחות פעם אחת","כשהמורה מדווח על קושי בכיתה","כשהוא קורא לאט מבני גילו"],"e":"נבדק נחשב לקוי בסוג מסוים של דיסלקסיה כשיש לו יותר טעויות מבני גילו בקבוצת הביקורת. טעות אחת לא מספיקה."}]},
"q24":{"t":"t6","v":[{"q":"איזו דיסלקסיה הייתה לכל הנבדקים?","a":"LPD","w":["דיסלקסיה קשבית","נגלקסיה","דיסלקסיית שטח"],"e":"לכל הנבדקים הייתה דיסלקסיית שיכול אותיות (LPD), ולרובם (18 מתוך 20) גם דיסלקסיה קשבית."},{"q":"קורא שקורא מילים לא רגולריות ״לפי הכללים״. איזה סוג זה?","a":"דיסלקסיית שטח","w":["קבאק","LPD","דיסלקסיה קשבית"],"e":"קריאה של מילים לא רגולריות ״לפי הכללים״, כלומר דרך הממיר מאותיות לצלילים, היא דיסלקסיית שטח. ב-LPD הבעיה היא במיקום האותיות."}]},
"q25":{"t":"t6","v":[{"q":"במטלת ״מה קשור?״, משענת קשורה לכיסא או לסיגריה. מה המטלה בודקת?","a":"הבנה של מילה נדידית","w":["את מהירות הקריאה","את הקשב הכללי","את ידיעת האותיות"],"e":"מטלת ״מה קשור?״ בודקת הבנה של מילה נדידית: אם הקורא מבין ״משענת״ (קשורה לכיסא) או ״מעשנת״ (קשורה לסיגריה). היא לא מודדת מהירות."},{"q":"איך נבדקה הדיסלקסיה הקשבית במבדקי ההמשך?","a":"בזוגות מילים","w":["בקריאת מילים בודדות","במבחן קשב ממוחשב","בהכתבה של משפטים"],"e":"במבדקי ההמשך נבדקה הדיסלקסיה הקשבית בזוגות מילים, 120 זוגות, כי היא מתבטאת בנדידה בין מילים."}]},
"q26":{"t":"t6","v":[{"q":"למה נבדקו גם מטלות בלי קריאה בקול?","a":"כי אולי הן מושפעות יותר מקשב","w":["כי הן מהירות יותר לביצוע","כי הנבדקים התביישו לקרוא בקול","כי הן לא דורשות קשב בכלל"],"e":"מטלות בלי קריאה בקול אולי מושפעות יותר מקשב, ולכן נבדקו גם הן: אולי שם ריטלין יעזור יותר. זה לא בגלל שהן מהירות יותר."},{"q":"כמה מילים נדידיות הוצגו במבדק הקריאה בקול?","a":"232","w":["20","80","1,000"],"e":"במבדק הקריאה בקול הוצגו 232 מילים נדידיות, מילים שהשיכול בהן יוצר מילה אחרת."}]},
"q27":{"t":"t6","v":[{"q":"למה הוחלף סדר התנאים (עם ובלי ריטלין) בין הנבדקים?","a":"כדי למנוע אפקט למידה","w":["כדי לבלבל את הנבדקים","כדי לקצר את הניסוי","כי ההורים ביקשו זאת"],"e":"בפעם השנייה קל יותר, כי מכירים את המטלה, וזה אפקט למידה. כשמחליפים את הסדר (חלק מתחילים עם ריטלין וחלק בלי), האפקט מתקזז."},{"q":"מה נספר כטעות בקריאה?","a":"התגובה הראשונה","w":["רק הטעות האחרונה בכל מילה","רק טעויות שהנבדק לא תיקן","הממוצע של כל הניסיונות"],"e":"כטעות נספרה התגובה הראשונה של הנבדק. כך לא מסתירים את הטעות המקורית, גם אם הוא תיקן אותה אחר כך."}]},
"q28":{"t":"t6","v":[{"q":"איזה מבחן שימש להשוואת נבדק לעצמו עם ובלי ריטלין?","a":"χ²","w":["Crawford & Howell","Wilcoxon","FDR"],"e":"להשוואה של כל נבדק לעצמו, עם ובלי ריטלין, שימש מבחן χ². Crawford & Howell שימש להשוואה של נבדק לקבוצת הביקורת."},{"q":"מה מטרת תיקון FDR?","a":"להתמודד עם השוואות מרובות","w":["להשוות נבדק לביקורת","להשוות שני תנאים בקבוצה","למדוד גודל אפקט"],"e":"תיקון FDR נועד להתמודד עם השוואות מרובות, כדי לא לקבל תוצאות מובהקות במקרה. הוא לא משווה נבדק לביקורת."}]},
"q29":{"t":"t7","v":[{"q":"על אילו טעויות לא השפיע הריטלין?","a":"על אף סוג טעות שנבדק","w":["רק על שיכולי אותיות","רק על נדידות בין מילים","השפיע על כולן"],"e":"הריטלין לא הפחית אף סוג של טעות שנבדק: לא שיכולי אותיות, ולא נדידות בין מילים."},{"q":"מה המסקנה לגבי קצב הקריאה?","a":"אולי מהר יותר, לא מדויק יותר","w":["תמיד מהר יותר וגם מדויק יותר","תמיד לאט יותר מבלי ריטלין","אין שום הבדלים בין אנשים"],"e":"עם ריטלין חלק מהנבדקים קראו אולי מהר יותר, אבל לא מדויק יותר, והיו הבדלים בין־אישיים. לא כולם קראו מהר יותר."}]},
"q32":{"t":"t7","v":[{"q":"אצל חלק מהנבדקים ריטלין קיצר את זמן הקריאה, ואצל חלק האריך. מה המשמעות?","a":"שההשפעה על הקצב שונה מאדם לאדם","w":["שריטלין תמיד מאט קריאה","שהמדידה לא הייתה מדויקת","שהנבדקים לא נטלו את התרופה"],"e":"אצל חלק מהנבדקים ריטלין קיצר את זמן הקריאה, ואצל חלק האריך. כלומר, ההשפעה על הקצב שונה מאדם לאדם. זה לא בהכרח מעיד על בעיה במדידה."},{"q":"מה המשמעות התיאורטית של הממצאים?","a":"הליקוי הקשבי־אורתוגרפי נפרד מהקשב הכללי","w":["כל ליקוי קריאה נובע מקשב כללי","ריטלין לא משפר קשב בכלל","הדיסלקסיות האלה לא באמת קיימות"],"e":"המשמעות התיאורטית היא שהליקוי הקשבי־אורתוגרפי נפרד מהקשב הכללי: הקשב השתפר, והקריאה לא. ריטלין כן שיפר קשב."}]},
"q33":{"t":"t7","v":[{"q":"הורה שואל אם ריטלין יפתור את שיכולי האותיות של בנו. מה אפשר לומר לפי המחקר?","a":"שזה לא צפוי להפחית את הטעויות","w":["שזה יפתור את הבעיה לגמרי","שזה יחמיר את הבעיה","שזה תלוי רק במינון"],"e":"לפי המחקר, ריטלין שיפר את הקשב, אבל לא הפחית את טעויות הקריאה, כמו שיכולי אותיות. לכן לא צפוי שהוא יפתור את הבעיה. מינון גבוה יותר לא נבדק."},{"q":"איזה מהבאים כן השתפר עם ריטלין?","a":"ביצוע במטלות קשב כלליות","w":["מספר שיכולי האותיות","מספר הנדידות בין מילים","טעויות בתנועות"],"e":"עם ריטלין השתפר הביצוע במטלות קשב כלליות, אבל לא מספר הטעויות בקריאה. זה הפער בין קשב לקריאה שהמחקר מצא."}]},
"q34":{"t":"t7","v":[{"q":"למה הממצא חשוב גם לטיפול וגם לתיאוריה?","a":"הוא מראה גבול לתרופה ולקשר לקשב","w":["הוא מוכיח שריטלין יעיל לכל ליקוי","הוא מבטל את הצורך בטיפול בקריאה","הוא מראה שקשב ודיסלקסיה זהים"],"e":"הממצא מראה גבול לתרופה, כי היא לא מתקנת את הקריאה, ולקשר בין קשב כללי לקריאה, כי הם נפרדים. כך יש לו השלכה טיפולית ותיאורטית."},{"q":"מה ההשלכה הטיפולית של הממצאים למי שיש לו דיסלקסיה קשבית?","a":"ריטלין לבדו לא צפוי להפחית את טעויות הקריאה","w":["ריטלין במינון גבוה יפתור את הטעויות","אין צורך בשום התערבות בקריאה","שיפור בקשב הכללי יספיק לתיקון הקריאה"],"e":"למי שיש לו דיסלקסיה קשבית, ריטלין לבדו לא צפוי להפחית את טעויות הקריאה, כי הליקוי לא נפתר דרך שיפור הקשב הכללי. עדיין יש צורך בהתערבות בקריאה."}]},

שתנה אחרת אצל כל אחד."}]}};
const SUM=`<h2>סיכום: האם ריטלין משפר קריאה אצל אנשים עם דיסלקסיה קשבית?</h2>
<div class="key"><b>על מה מדובר?</b> הרבה אנשים עם הפרעת קשב סובלים גם מ<b>דיסלקסיה</b>, ויש סוגי דיסלקסיה שנראים ״קשביים״: האותיות מתחלפות או נודדות בין מילים. אז אם <b>ריטלין</b> משפר קשב, אולי הוא משפר גם את הקריאה? המחקר בדק 20 אנשים, ילדים ומבוגרים, שקראו <b>פעם עם ריטלין ופעם בלי</b>. התוצאה: הריטלין שיפר את הקשב הכללי, אבל <b>לא הפחית את טעויות הקריאה</b>. והמסקנה החשובה היא תאורטית: אם הקשב השתפר והקריאה לא, אז הליקוי בקריאה הוא <b>קשב מיוחד לאותיות</b>, נפרד מהקשב הכללי.</div>

<div class="key"><b>למה המאמר הזה בקורס?</b> זה אחד משלושת מאמרי החובה של <b>התרגול</b> במבוא לפסיכולוגיה (בוחרים אחד מתוך שלושה). המטרה בתרגול היא ללמוד <b>לקרוא מאמר מחקרי</b>: לקראת <b>תרגול 5</b> קוראים רק את <b>הכותרת והתקציר</b>, ולקראת <b>תרגול 7</b> את <b>המבוא והשיטה</b>. לכן כדאי לקרוא את הסיכום עם שאלות של חוקר: מה שאלת המחקר? מה ההשערות? מי המשתתפים? מה מדדו? ומה נמצא?<br><b>לתרגול 7 (מבוא ושיטה):</b> החלקים שתואמים את המבוא הם סעיפים 1–5. השיטה היא סעיף 6. הממצאים (סעיף 7) הם תוספת להבנה.</div>

<h3>מילון מחקר לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>תקציר</b></td><td>פסקה בתחילת המאמר שמסכמת הכול: השאלה, השיטה, הממצאים והמסקנה.</td></tr>
<tr><td><b>מבוא</b></td><td>החלק שמסביר מה כבר ידוע, מה חסר, ולמה צריך את המחקר הזה. בסופו באות ההשערות.</td></tr>
<tr><td><b>שיטה</b></td><td>מי השתתף (מדגם), באילו כלים מדדו, ואיך המחקר התבצע (הליך).</td></tr>
<tr><td><b>השערה</b></td><td>ניבוי שאפשר לבדוק: ״אם X, אז Y״.</td></tr>
<tr><td><b>משתנה</b></td><td>מה שמודדים או משנים. בתלוי מודדים את התוצאה; הבלתי תלוי הוא מה שמשנים או משווים לפיו.</td></tr>
<tr><td><b>דיסוציאציה</b></td><td>מצב שבו יכולת אחת נפגעת ויכולת אחרת לא. זה מרמז שהן נשענות על מנגנונים נפרדים.</td></tr>
<tr><td><b>מערך תוך־נבדקי</b></td><td>כל משתתף נבדק בשני התנאים (כאן: עם ריטלין ובלי), ומשווים אותו לעצמו.</td></tr>
</table></div>

<div id="abs"><h3>איך מזהים במאמר את הכותרת ואת התקציר</h3>
<div class="ex"><b>הכותרת:</b> השורה הגדולה והמודגשת בראש העמוד הראשון. זה השם של המאמר. מתחתיה מופיעים שמות החוקרים.<br>
<b>התקציר:</b> הפסקה שבאה מיד אחרי שמות החוקרים, <b>לפני</b> שהמאמר עצמו מתחיל. לרוב היא מסודרת אחרת משאר הטקסט (מוזחת, באות קטנה יותר או בתוך מסגרת), לפעמים מופיעה מעליה המילה ״תקציר״, ובסופה בדרך כלל יש שורה של <b>״מילות מפתח״</b>. מה שבא אחרי מילות המפתח הוא כבר המבוא.<br>
<b>למה זה חשוב:</b> התקציר הוא ״המאמר בקטן״. בדרך כלל יש בו, לפי הסדר: הרקע (למה זה מעניין), שאלת המחקר, השיטה (מי ומה בדקו), הממצאים העיקריים, והמסקנה. מי שמבין את התקציר יודע על מה כל המאמר.</div>
<h4>הכותרת והתקציר של המאמר הזה, במילים שלנו</h4>
<div class="ex"><b>הכותרת:</b> ״האם מתילפנידאט (ריטלין) מסייע לבעלי דיסלקסיית שיכול אותיות ודיסלקסיה קשבית?״<br>
<b>מה הכותרת כבר מגלה:</b> היא בנויה כ<b>שאלה</b>, וזו בדיוק שאלת המחקר: האם תרופה מסוימת (ריטלין) עוזרת לקבוצה מסוימת (אנשים עם שני סוגי דיסלקסיה).<br><br>
<b>מה אומר התקציר, חלק אחרי חלק:</b><br>
① <b>רקע:</b> ריטלין הוא טיפול עיקרי בהפרעת קשב. להרבה אנשים עם הפרעת קשב יש גם דיסלקסיה, אבל מעט מחקרים בדקו את השפעת התרופה על קריאה, ואף אחד לא בדק סוגי דיסלקסיה וסוגי טעויות שונים.<br>
② <b>שאלת המחקר:</b> האם ריטלין משפר קריאה אצל אנשים עם דיסלקסיה שמקורה קשבי?<br>
③ <b>שיטה:</b> 20 ילדים, בני נוער ומבוגרים עם הפרעת קשב ודיסלקסיה קשבית־אורתוגרפית. הקריאה נבדקה פעם עם ריטלין ופעם בלי. מדדו את הטעויות מכל סוג, את קצב הקריאה ואת הביצוע במטלות שונות.<br>
④ <b>ממצאים:</b> ריטלין שיפר את הביצוע במטלות קשב כלליות, אבל לא הפחית את טעויות הקריאה.<br>
⑤ <b>מסקנה:</b> מלבד המשמעות לטיפול, הליקויים האלה בקריאה <b>נפרדים</b> מהקשב הכללי.</div></div>

<h3>הדוגמה שתלווה אותנו: שגמ</h3>
<p>שגמ היא אישה עם הפרעת קשב ושני סוגי דיסלקסיה. היא מתארת: ״יש לי זיכרון מעולה לצורות... אני מזהה את האותיות, אני זוכרת אותן, אבל לא את המיקום שלהן״. השאלה של המחקר היא בעצם: האם הריטלין יעזור לשגמ גם לקרוא?</p>

<h3>1. ההיגיון של המחקר</h3>
<p>המחקר שואל שאלה <b>טיפולית</b> (האם ריטלין עוזר לקריאה?), אבל התשובה עונה גם על שאלה <b>תאורטית</b> (האם הבעיה בקריאה היא חלק מהקשב הכללי?):</p>
<div class="tw"><table><tr><th>אם...</th><th>אז צפוי ש...</th></tr>
<tr><td>הבעיה בקריאה היא חלק מהקשב הכללי</td><td>ריטלין ישפר קשב, ולכן גם קריאה</td></tr>
<tr><td>הבעיה ספציפית לאותיות</td><td>ריטלין ישפר קשב, אבל הקריאה לא תשתפר</td></tr></table></div>

<h3>2. מהי דיסלקסיה, ושלושת הסוגים הקשביים</h3>
<p><b>דיסלקסיה</b> = שם כללי להפרעות קריאה, מולדות או נרכשות, שנובעות מפגיעה בשלבים שונים של תהליך הקריאה. השלב הראשון הוא ה<b>נתח הוויזואלי־אורתוגרפי</b>: החלק שמזהה את האותיות ואת המיקום שלהן. יש לו כמה תפקידים, וכל פגיעה יוצרת סוג אחר של דיסלקסיה. לשלושה סוגים יש בסיס <b>קשבי־אורתוגרפי</b>, כלומר קושי קשבי שקורה רק במילים כתובות:</p>
<div class="tw"><table><tr><th>סוג</th><th>מה קורה</th><th>דוגמה</th></tr>
<tr><td><b>נגלקסיה</b></td><td>לא שמים לב לצד אחד של המילה (בדרך כלל השמאלי), ומשמיטים, מחליפים או מוסיפים שם אותיות</td><td>החלק האחרון של המילה ״נעלם״</td></tr>
<tr><td><b>דיסלקסיית מיקום אותיות (LPD)</b></td><td>האותיות ה<b>אמצעיות</b> מתחלפות ביניהן</td><td>״מרפק״ במקום ״מפרק״</td></tr>
<tr><td><b>דיסלקסיה קשבית</b></td><td>אותיות <b>נודדות בין מילים</b>, ושומרות על המיקום שלהן</td><td>אות ממילה אחת ״קופצת״ למילה שלידה</td></tr></table></div>
<ul>
<li><b>מילים נדידיות</b> = מילים שאם מחליפים בהן אותיות אמצעיות, מקבלים מילה אחרת אמיתית (תריס–תירס, מעשנת–משענת). שם LPD בולטת הכי הרבה, כי הטעות ״נשמעת הגיונית״.</li>
<li><b>איך הקשב נכשל ב־LPD:</b> הקורא שם קשב קודם לאות הראשונה והאחרונה. אחר כך הוא מסתכל על כל האמצעיות <b>יחד</b>, ולא מצליח לקשור כל אחת למקום שלה. בדיוק מה ששגמ מתארת.</li>
<li><b>בדיסלקסיה קשבית:</b> ״<b>חלון הקשב</b>״ פגוע, ולכן נכנסות אליו גם אותיות ממילים שכנות (מימין, משמאל, מלמעלה ומלמטה) ומפריעות.</li>
</ul>

<h3>3. קשב כללי או קשב לאותיות?</h3>
<p>יש שתי דרכים לבדוק את זה:</p>
<ul>
<li><b>דרך 1: מילים מול מספרים.</b> נמצאו אנשים שמתקשים לקרוא מילים, אבל קוראים מספרים בלי בעיה. זו <b>דיסוציאציה</b> (הפרדה בין שתי יכולות), והיא מרמזת שהבעיה לא בקשב הכללי, אלא בקשב שמיועד לאותיות.</li>
<li><b>דרך 2: לשנות את הקשב ולראות מה קורה לקריאה.</b> וזה מה שריטלין מאפשר. במחקר קודם על <b>אותם</b> נבדקים (קידר, פרידמן ושלו־מבורך, 2011), הריטלין שיפר קשב: 9 מתוך 20 (45%) השתפרו בדיוק במבחני קשב, ו־14 מתוך 20 (70%) הגיבו מהר יותר. כלומר הקשב באמת השתפר. עכשיו נשאר לבדוק את הקריאה.</li>
</ul>

<h3>4. איך ריטלין פועל</h3>
<ul>
<li><b>מתילפנידאט</b> (השם המסחרי: ריטלין) הוא תרופה <b>מעוררת</b>. הפרעת קשב קשורה לחוסר איזון של <b>דופאמין</b> ו<b>נוראפינפרין</b>.</li>
<li>הוא מעלה את רמתם, כנראה על ידי <b>חסימת הספיגה החוזרת</b> של דופאמין (כך הוא נשאר יותר זמן בין תאי העצב), בעיקר בסטריאטום. דופאמין מרוכז בקורטקס הפרונטלי ובגרעיני הבסיס, שקשורים לקשב, תכנון ומוטיבציה.</li>
<li>המנגנון עוד <b>לא מובן עד הסוף</b>. ריטלין רגיל הוא <b>קצר טווח</b>; יש גם ארוכי טווח (קונצרטה, ריטלין LA, ריטלין SR). במאמר ״ריטלין״ = כולם.</li>
</ul>

<h3>5. מה היה ידוע קודם</h3>
<p>מעט מחקרים בדקו ריטלין וקריאה, ו<b>אף אחד</b> לא הפריד בין סוגי דיסלקסיה וסוגי טעויות:</p>
<div class="tw"><table><tr><th>מחקר</th><th>מה נמצא</th><th>הבעיה</th></tr>
<tr><td><b>Keulers</b> (2007), הולנדית</td><td>יותר מילים נכונות בדקה</td><td>הקריאה נשארה מתחת לממוצע; אולי רק עמדו טוב יותר בלחץ זמן</td></tr>
<tr><td><b>Bental &amp; Tirosh</b> (2008), עברית</td><td>הדיוק השתפר</td><td>לא ברור באילו מילים; לא שורד תיקון להשוואות מרובות</td></tr>
<tr><td><b>Wright</b> (2011), 2 נבדקים</td><td>טיפול בקריאה עבד טוב יותר עם ריטלין</td><td>כנראה כי הילד ישב בסבלנות, לא כי הקריאה עצמה השתפרה</td></tr>
<tr><td><b>לוקוב ופרידמן</b> (2007), 5 עם LPD</td><td>אצל 2 ירדו טעויות, אצל 3 לא</td><td>מדגם קטן מאוד</td></tr></table></div>
<p><b>המשותף:</b> השיפור יכול לנבוע מ<b>תנאים</b> של הקריאה (סבלנות, עמידה בזמן), ולא מתיקון של הליקוי עצמו.</p>

<h3>6. השיטה</h3>
<ul>
<li><b>נבדקים:</b> 20 עם הפרעת קשב ודיסלקסיה קשבית שנוטלים ריטלין: 14 תלמידים (כיתות ד׳–ט׳) ו־6 מבוגרים. <b>קבוצת ביקורת</b>: 34 ילדים ו־359 מבוגרים בלי קשיים.</li>
<li><b>אבחון:</b> מבדק <b>תלתן</b> (קריאה בקול של מילים, צמדי מילים ומילות תפל). נבדק נחשב לקוי אם עשה יותר טעויות מבני גילו בביקורת. <b>לכולם היה LPD</b>, ול־18 מתוך 20 גם דיסלקסיה קשבית.</li>
<li><b>מבדקים:</b> חלק בקול (קריאת מילים נדידיות, זוגות מילים) וחלק <b>בלי קול</b>: זהה–שונה (חמוץ–חומץ), הכרעה לקסיקלית (״האם זו מילה?״), מילה–תמונה (שוטפת/שופטת), ו״מה קשור?״ (משענת: לכיסא או לסיגריה?). המבדקים בלי קול ארוכים ומשעממים, ולכן ציפו שהם יושפעו <b>יותר</b> מקשב כללי.</li>
<li><b>הליך:</b> כל נבדק נבחן פעם עם ריטלין ופעם בלי. סדר המבדקים הוחלף בין נבדקים כדי למנוע למידה. נספרה רק התגובה <b>הראשונה</b>, בלי תיקונים עצמיים.</li>
</ul>

<h3>7. מה נמצא</h3>
<div class="tw"><table><tr><th>מה נבדק</th><th>האם ריטלין עזר?</th></tr>
<tr><td>מטלות קשב כלליות</td><td><b>כן</b></td></tr>
<tr><td>שיכולי אותיות (LPD)</td><td><b>לא</b></td></tr>
<tr><td>נדידות בין מילים (קשבית)</td><td><b>לא</b></td></tr>
<tr><td>טעויות אחרות (שטח, טעויות תנועה)</td><td><b>לא</b></td></tr>
<tr><td>קצב הקריאה</td><td><b>תלוי באדם</b>: אצל חלק קיצר, אצל חלק האריך</td></tr></table></div>
<p><b>חזרה לשגמ:</b> הריטלין יעזור לה להתרכז במבחן, ואולי לקרוא <b>מהר</b> יותר, אבל הוא לא יעזור לה לזכור איפה כל אות נמצאת. ומכאן המסקנה התאורטית: <b>הליקוי הקשבי־אורתוגרפי נפרד מהקשב הכללי</b>.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. <b>שאלת המחקר:</b> האם ריטלין משפר קריאה אצל אנשים עם דיסלקסיה קשבית ודיסלקסיית מיקום אותיות?<br>
2. <b>למה זה מעניין גם תאורטית:</b> אם ריטלין, שמשפר קשב כללי, ישפר גם את הקריאה, הבעיה בקריאה היא חלק מהקשב הכללי. אם לא, יש ״קשב לאותיות״ נפרד.<br>
3. <b>השיטה:</b> 20 נבדקים (14 ילדים ו־6 מבוגרים) עם הפרעת קשב ודיסלקסיה קשבית, שנבחנו <b>פעם עם ריטלין ופעם בלי</b>, במבדקי קריאה עם קול ובלי קול, מול קבוצת ביקורת.<br>
4. <b>הממצאים:</b> ריטלין שיפר את <b>הקשב הכללי</b>, אבל <b>לא</b> הפחית את טעויות הקריאה: לא שיכולי אותיות, לא נדידות בין מילים ולא טעויות אחרות. קצב הקריאה השתנה אחרת אצל כל אחד.<br>
5. <b>המסקנה:</b> הליקוי הקשבי־אורתוגרפי <b>נפרד</b> מהקשב הכללי. ריטלין עוזר להתרכז, אבל לא מתקן את הקריאה עצמה.<br><br>
<b>מה צריך לדעת לעשות בתרגולים:</b><br>
• לנסח את שאלת המחקר ולהסביר את שתי האפשרויות (״אם... אז...״).<br>
• להסביר מה זה LPD ודיסלקסיה קשבית, ולמה מילים נדידיות חשובות.<br>
• לזהות את המשתנה הבלתי תלוי (עם ריטלין או בלי) ואת התלויים (טעויות קריאה, קשב, קצב).<br>
• לתאר את המדגם, את המבדקים ואת ההליך, ולהסביר למה החליפו את סדר המבדקים.<br>
• להסביר למה המחקרים הקודמים לא הספיקו, ומה המחקר הזה מוסיף.</div>

<h3>מלכודות נפוצות במבחן</h3>

<li><b>ריטלין כן שיפר קשב</b>; הוא לא שיפר את דיוק הקריאה.</li>

const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;

const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* render with a direction-aware entrance: "fwd" = next (enters from the left in RTL), "back" = previous, "up" = new screen */
function show(html,dir="up"){
  app.innerHTML=html;
  const v=app.firstElementChild;if(v)v.classList.add("enter",dir);
  scrollTo({top:0,behavior:"instant"});
}
/* animate a ring and a number from 0 to their value */
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const to=+el.dataset.count,suf=el.dataset.suffix||"",tot=el.dataset.total;
    if(REDUCED){el.textContent=to+suf;return}
    const t0=performance.now(),d=900;
    const f=now=>{const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e)+suf+(tot?"/"+tot:"");if(k<1)requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
  root.querySelectorAll(".ring[data-p]").forEach(r=>{requestAnimationFrame(()=>requestAnimationFrame(()=>r.style.setProperty("--p",r.dataset.p)))});
}
const ring=(p,label)=>`<div class="ring" data-p="${p}" style="--p:${REDUCED?p:0}"><span>${label}</span></div>`;

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.style.setProperty("--i",k);b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      box.classList.add("answered");
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a){x.classList.add("right");x.querySelector(".k").innerHTML=ic("check")}});
      if(!ok){b.classList.add("wrong");b.querySelector(".k").innerHTML=ic("x")}
      const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"no");
      fb.innerHTML=`<div class="fbi"><strong>${ok?"נכון":"לא בדיוק"}</strong><p>${esc(v.e)}</p></div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary next";nx.innerHTML=`<span>המשך</span>${ic("arrowL")}`;
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});setTimeout(()=>nx.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"}),120);
    };wrap.appendChild(b)});
  return box;
}

function resumeTarget(){

  const i=T.findIndex(t=>!S.done[t.id]);return i<0?null:{ti:i,bi:S.pos[T[i].id]||0};
}

function bar(title,n,i,label,backLabel="כל הנושאים"){
  return `<div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>${backLabel}</span></button><span class="prog">${label}</span></div><div class="steps" style="--n:${n}">${Array.from({length:n},(_,k)=>`<i class="${k<i?"on":k===i?"on now":""}"></i>`).join("")}</div></div><span class="eyebrow ctx">${title}</span>`;
}

function topic(ti,bi,dir="fwd"){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  const last=bi+1>=t.blocks.length;
  show(`<div class="stack reading">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card page"><h2 class="ph">${blk.h}</h2>${acrExpand(blk.html)}</article>${MAPSET.length&&bi===0?MAPSET.map((m,k)=>m.topic===t.id?`<button class="mm-cta" data-map="${k}"><span class="ti">${ic("map")}</span><span class="tt"><b>מפת חשיבה: ${m.title}</b><small>${m.sub}</small></span>${ic("arrowL")}</button>`:"").join(""):""}<div id="ck"></div>
   <div class="pager">${bi>0?`<button class="ghost" id="prev">${ic("arrowR")}<span>הקטע הקודם</span></button>`:"<span></span>"}<button class="primary" id="next"><span>${last?`למבחן הנושא · ${t.qids.length} שאלות`:"הקטע הבא"}</span>${ic("arrowL")}</button></div></div>`,dir);
  enhanceTerms(app.querySelector(".page"));
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=()=>home("back");
  app.querySelector("#next").onclick=()=>{if(!last)topic(ti,bi+1,"fwd");else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  const pv=app.querySelector("#prev");if(pv)pv.onclick=()=>topic(ti,bi-1,"back");
  app.querySelectorAll(".mm-cta").forEach(b=>b.onclick=()=>mindmap(+b.dataset.map,()=>topic(ti,bi,"back")));
  checkBox(t,bi);
}

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;
  const showQ=i=>{const v=list[i],opts=shuffle([v.a,...v.w]);
    host.innerHTML=`<div class="q ckq"><span class="eyebrow">בדיקת הבנה · ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? חזרו לטקסט למעלה לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.style.setProperty("--i",k);b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();box.classList.add("answered");
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a){x.classList.add("right");x.querySelector(".k").innerHTML=ic("check")}});
        if(!ok){b.classList.add("wrong");b.querySelector(".k").innerHTML=ic("x")}
        const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"no");
        fb.innerHTML=`<div class="fbi"><strong>${ok?"נכון":"לא בדיוק"}</strong><p>${esc(v.e)}${ok?"":" כדאי לחזור לטקסט ולקרוא שוב."}</p></div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.innerHTML=`<span>לשאלה ${i+2}</span>${ic("arrowL")}`;
          nx.onclick=()=>{const y=scrollY;showQ(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="cknote";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע: ${r} מתוך ${list.length} נכון.`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };showQ(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

/* Flashcards: front = the term and a prompt, back = the answer and an example.

function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");
    const card=app.querySelector("#fc"),acts=app.querySelector(".fc-actions");
    const flip=()=>{flipped=!flipped;card.classList.toggle("flipped",flipped);card.setAttribute("aria-pressed",flipped);
      if(flipped&&!acts.querySelector(".fc-btns")){acts.innerHTML=`<div class="fc-btns"><button class="fc-no" id="no">${ic("cycle")}<span>עוד לא</span></button><button class="primary fc-yes" id="yes">${ic("check")}<span>ידעתי</span></button></div>`;
        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};
        acts.querySelector("#no").onclick=()=>{missed.add(k);S.cards[k]=0;save();deck.push(deck.shift());step("fwd")};}};
    card.onclick=flip;
    document.onkeydown=e=>{if(!document.body.contains(card))return document.onkeydown=null;if(e.key===" "||e.key==="Enter"){if(document.activeElement===card||document.activeElement===document.body){e.preventDefault();flip()}}};
  };
  step("up");
}
/* Mind map: one level at a time. The current node sits in the middle, its children around it.
   A branch opens into its own ring; a leaf opens its explanation under the map. */
function mapList(){
