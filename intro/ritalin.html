"UCR":["Unconditioned Response","תגובה לא מותנית"],
"UCS":["Unconditioned Stimulus","גירוי לא מותנה"],

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"התקציר והשאלה",blocks:[
  {h:"התקציר",html:`${def("על מה הנושא",`האם ריטלין, תרופה לקשב, יכול לעזור גם בקריאה? הנושא מציג את התקציר ואת השאלה של המחקר.<br><b>מה נלמד כאן:</b> בשורה התחתונה · שגמ · שאלת המחקר`)}<p><mark>מתילפנידאט</mark> ${E("Methylphenidate")}, הידוע בשם המסחרי <b>ריטלין</b>, הוא אחת משיטות הטיפול העיקריות בהפרעת קשב. רבים מבעלי הפרעת קשב סובלים גם מ<b>דיסלקסיה</b>, אבל רק מחקרים מעטים בדקו את השפעת התרופה על קריאה, ואף אחד לא בדק את השפעתה על <b>סוגי דיסלקסיה</b> שונים ועל <b>סוגי טעויות</b> שונים.</p>${tiles([["people","20 נבדקים","ילדים, בני נוער ומבוגרים עם הפרעת קשב ועם דיסלקסיה על בסיס קשבי־אורתוגרפי"],["split","פעמיים","הקריאה נבדקה פעם עם ריטלין ופעם בלי"],["chart","מה נמדד","שיעור הטעויות מכל סוג, קצב הקריאה, וביצוע במטלות קריאה שונות"]])}${def("בשורה התחתונה",`ריטלין שיפר תפקוד ב<b>מטלות קשב כלליות</b>, אבל <b>לא הפחית</b> טעויות קריאה בדיסלקסיית שיכול אותיות ובדיסלקסיה קשבית. לכן, מלבד המשמעות לטיפול, הממצא מלמד שהליקויים האלה <b>נפרדים</b> מקשב כללי.`)}`,q:"q1"},
  {h:"שגמ, והשאלה",html:`${ex("\"יש לי זיכרון מעולה לצורות... אני מזהה את האותיות, אני זוכרת אותן, אבל לא את המיקום שלהן\". כך תיארה שגמ, אישה עם דיסלקסיית שיכול אותיות, דיסלקסיה קשבית והפרעת קשב.")}<p>ריטלין הוא התרופה הנפוצה ביותר כיום לטיפול בהפרעות קשב, אבל השפעתו על סוגים שונים של דיסלקסיה עוד לא נבדקה. <b>מטרת המחקר:</b> לבדוק את השפעת הריטלין על דיסלקסיות שמקורן קשבי, ועל סוגי טעויות שונים בקריאה.</p>${tiles([["check","אם יש קשר לקשב כללי","ריטלין משפר קשב, ולכן <b>ישפר גם את הקריאה</b>"],["x","אם הליקוי ספציפי לאותיות","גם אם הקשב הכללי ישתפר, הקריאה <b>לא בהכרח</b> תשתפר"]])}${rem("זה ההיגיון של המחקר: התשובה לשאלה הטיפולית (האם ריטלין עוזר?) עונה גם על שאלה תיאורטית (האם הליקוי בקריאה הוא חלק מהקשב הכללי?).")}`,q:"q3"}
 ]},
 {id:"t2",icon:"doc",title:"דיסלקסיה ושלוש הדיסלקסיות הקשביות",blocks:[
  {h:"מהי דיסלקסיה",html:`${def("על מה הנושא",`יש כמה סוגי דיסלקסיה, ושלושה מהם קשורים לקשב. הנושא מסביר מה זו דיסלקסיה, ומה קורה בכל אחד מהסוגים.<br><b>מה נלמד כאן:</b> דיסלקסיה · שיכול אותיות · שלוש דיסלקסיות קשביות · איך הקשב נכשל`)}${def("מושג מפתח",`<mark>דיסלקסיה</mark> ${E("Dyslexia")}: שם כללי למגוון הפרעות קריאה, <b>מולדות או נרכשות</b>, שנגרמות מליקויים ב<b>שלבים שונים</b> של תהליך הקריאה.`)}<p>השלב הראשון בקריאה הוא <mark>הנתח הוויזואלי־אורתוגרפי</mark>. יש לו כמה פונקציות שיכולות להיפגע בנפרד, וכל פגיעה יוצרת סוג אחר של דיסלקסיה עם דפוס טעויות משלו:</p>${fig("dys")}`,q:"q5"},
  {h:"שלוש דיסלקסיות על בסיס קשבי",html:`<p>לגבי שלוש דיסלקסיות הוצע שהבסיס שלהן <b>קשבי־אורתוגרפי</b>: קושי עם מאפיינים קשביים שחל על מילים כתובות.</p>${tiles([["target","נגלקסיה (נגלקט)","קושי להפנות קשב לאחד מצדי המילה, לרוב השמאלי: השמטה, החלפה או הוספה של אותיות בצד המוזנח"],["copies","דיסלקסיית מיקום אותיות (LPD)",`${E("Letter position dyslexia")} שיכול של אותיות <b>אמצעיות</b>, בעיקר במילים נדידיות. גם השמטה של אות שמופיעה פעמיים`],["link","דיסלקסיה קשבית",`${E("Attentional dyslexia")} אותיות <b>נודדות בין מילים</b>, והמיקום היחסי שלהן נשמר. בעיקר במילים ארוכות ובאות האחרונה`]])}${def("מילים נדידיות",`מילים ששיכול האותיות האמצעיות בהן יוצר <b>מילה קיימת</b> אחרת, כמו תריס–תירס או מעשנת–משענת.`)}${ex(`<b>שיכול אותיות</b>: ילד שקורא "מרפק" במקום "מפרק". הקשב לא "מחזיק" את הסדר של האותיות באמצע המילה.`)}`,q:"q7"},
  {h:"איך הקשב \"נכשל\"",html:`${tiles([["copies","ב-LPD: זרקור הקשב","הקורא מפנה קשב קודם לאות הראשונה והאחרונה וממקם אותן. אחר כך הקשב מופנה לכל האותיות האמצעיות <b>יחד</b>, וקשה לו להפנות קשב לכל אחת בנפרד ולקשר אותה למיקום שלה"],["link","בדיסלקסיה קשבית: חלון הקשב","מנגנון \"חלון הקשב\" בקריאה פגוע, ולכן יחידות <b>מחוץ לחלון</b> נקלטות ומפריעות לעיבוד מילת המטרה"]])}${rem("בדיסלקסיה קשבית יש נדידות <b>אופקיות</b> (ממילה מימין או משמאל) וגם <b>אנכיות</b> (ממילה מעל או מתחת). יש גם השמטת אות כפולה שמופיעה באותו מיקום בשתי מילים, ודחיסה או דחיקה של אות ממילה למילה.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"brain",title:"קשב כללי או קשב אורתוגרפי?",blocks:[
  {h:"מילים מול מספרים",html:`${def("על מה הנושא",`האם הבעיה בקשב כללי, או בקשב שמיועד רק למילים כתובות?<br><b>מה נלמד כאן:</b> מילים מול מספרים · דיסוציאציה · שינוי הקשב`)}<p>מהו הקשר בין הליקוי הקשבי־אורתוגרפי ליכולת הקשב הכללית? כיוון ראשון לתשובה מגיע מהשוואה של <b>קריאת מילים</b> ל<b>קריאת מספרים</b>.</p>${def("דיסוציאציה",`מחקרים מצאו נבדקים שמתקשים בקריאת מילים אבל קוראים <b>מספרים</b> כרגיל: בנגלקסיה התפתחותית, בדיסלקסיה ויזואלית ובדיסלקסיית שיכול אותיות. זו עדות לכך שהנתח הוויזואלי־אורתוגרפי <b>ספציפי למילים</b>, ושהקושי <b>אינו קשבי כללי</b> אלא קשבי־אורתוגרפי.`)}${ex(`<b>דיסוציאציה</b>: אדם שמתקשה לקרוא מילים, אבל קורא מספרים בלי שום בעיה. זה מרמז שהבעיה לא בקשב הכללי, אלא בקשב שמיועד לאותיות.`)}`,q:"q11"},
  {h:"כיוון שני: לשנות את הקשב",html:`<p>כיוון נוסף: <b>לשנות</b> את יכולת הקשב הכללית ולבדוק מה קורה לקריאה. ריטלין מאפשר לעשות את זה.</p>${tiles([["check","9 מתוך 20 (45%)","השתפרו בדיוק במבחני קשב ממוחשבים עם ריטלין"],["clock","14 מתוך 20 (70%)","השתפרו בזמני התגובה: היו מהירים יותר"]])}${rem("זה ממצא ממחקר קודם של החוקרות על אותם נבדקים (קידר, פרידמן ושלו־מבורך, 2011), במבחנים של ארבע מערכות קשב: קשב מתמשך, סלקטיבי, הפניית קשב ובקרת קשב. כלומר הריטלין <b>אכן שיפר קשב</b>. השאלה כאן: האם הוא ישפר גם את הקריאה?")}`,q:"q13"}
 ]},
 {id:"t4",icon:"flask",title:"מתילפנידאט: איך הוא פועל",blocks:[
  {h:"המנגנון",html:`${def("על מה הנושא",`איך ריטלין פועל במוח.<br><b>מה נלמד כאן:</b> המנגנון · סוגי ריטלין`)}<p>הפרעת קשב נחשבת קשורה לחוסר איזון של <b>מוליכים עצביים</b>, בעיקר <mark>דופאמין</mark> ו<mark>נוראפינפרין</mark>. תרופות <b>מעוררות</b> (סטימולנטים), ובמיוחד מתילפנידאט, הן אחת הגישות העיקריות לטיפול.</p>${tiles([["brain","איפה","דופאמין מרוכז בקורטקס הפרונטלי ובגרעיני הבסיס: אזורים חשובים לקשב, ארגון, תכנון, מוטיבציה ושליטה מוטורית"],["flask","מה הוא עושה","מעלה את רמת הדופאמין והנוראפינפרין, כנראה על ידי <b>חסימת הספיגה החוזרת</b> של דופאמין, בעיקר בסטריאטום"],["question","מה לא ידוע","למרות השימוש הנפוץ, מנגנון הפעולה עוד לא הובן עד הסוף"]])}${def("סוגים",`ריטלין רגיל הוא <b>קצר טווח</b>. יש גם סוגים <b>ארוכי טווח</b>: קונצרטה, ריטלין LA ${E("Long-acting")}, ריטלין SR ${E("Slow release")}. במאמר "ריטלין" הוא שם כולל לכל התרופות האלה.`)}`,q:"q15"}
 ]},
 {id:"t5",icon:"doc",title:"מה ידוע על ריטלין וקריאה",blocks:[
  {h:"מחקרים קודמים",html:`${def("על מה הנושא",`מה כבר היה ידוע על ריטלין וקריאה לפני המחקר הזה?<br><b>מה נלמד כאן:</b> מחקרים קודמים · לוקוב ופרידמן`)}<p>מעט מחקרים בדקו את השפעת הריטלין על קריאה, ואף אחד לא הסתכל בנפרד על דיסלקסיות שונות ועל סוגי טעויות.</p>${tiles([["chart","Keulers et al. (2007)","ילדים דוברי הולנדית: עם ריטלין קראו נכון יותר מילים ומילות תפל <b>בדקה</b>. אבל הקריאה נשארה מתחת לממוצע. אולי הריטלין שיפר רק את היכולת להתמודד עם משימה מוגבלת בזמן"],["doc","Bental & Tirosh (2008)","25 בנים בעברית: הדיוק השתפר, אבל לא ברור אילו מילים ואילו דיסלקסיות. והתוצאות לא שורדות תיקון בונפרוני להשוואות מרובות"],["people","Wright et al. (2011)","2 נבדקים: טיפול בקריאה עם ריטלין עבד טוב יותר. אבל זה כנראה כי הילד יכול לשבת בסבלנות וללמוד, לא שיפור ישיר בדיוק"]])}${rem("בכל המחקרים האלה אפשר לייחס את השיפור ל<b>תנאים שמגבילים קריאה ולמידה</b> (סבלנות, עמידה בזמן), ולא לשיפור בליקוי הקריאה עצמו.")}`,q:"q17"},
  {h:"מחקר ראשוני: לוקוב ופרידמן",html:`${def("לוקוב ופרידמן (2007)",`בדקו <b>חמישה</b> בעלי דיסלקסיית שיכול אותיות: אצל שניים הטעויות ירדו, ואצל שלושה לא היה הבדל. נבדקת אחת שלא השתפרה בקריאה בקול, <b>כן</b> השתפרה במטלת זהה–שונה שדורשת קשב מתמשך.`)}${rem("לסיכום המבוא: אין מחקרים שבדקו את השפעת הריטלין על <b>סוגי</b> דיסלקסיה ו<b>סוגי</b> טעויות. יש סימנים שהיכולת לבצע משימות לאורך זמן משתפרת, וזה יכול לשפר קריאה <b>בעקיפין</b>.")}`,q:"q19"}
 ]},
 {id:"t6",icon:"people",title:"השיטה",blocks:[
  {h:"הנבדקים",html:`${def("על מה הנושא",`איך המחקר נבנה: מי השתתפו, איך אבחנו, ומה בדקו.<br><b>מה נלמד כאן:</b> נבדקים וביקורת · אבחון · מבדקים · ניתוח`)}${tiles([["people","20 נבדקים","ממרכז הארץ, עם דיסלקסיה התפתחותית ממקור קשבי והפרעת קשב, שנוטלים ריטלין"],["grad","14 תלמידים","כיתות ד' עד ט': 13 בכיתה רגילה ואחד בכיתת לקויי למידה"],["id","6 מבוגרים","4 סטודנטים, אחת עם תואר ראשון ואחת עם תואר שני"]])}<p>כולם אובחנו בעבר עם ADD או ADHD ונוטלים מתילפנידאט בסוגים ובמינונים שונים, לפי המלצת נוירולוג או פסיכיאטר. רוב הילדים נוטלים כל יום, וחלק מהמבוגרים רק כשצריך להתרכז במיוחד, למשל במבחן.</p>${def("קבוצת ביקורת",`34 ילדים בכיתות ד' עד ז', ו-359 מבוגרים מעל גיל 18, <b>בלי</b> הפרעות נוירולוגיות, קשב, שפה, קריאה או כתיבה.`)}`,q:"q21"},

  {h:"ההליך והניתוח",html:`${fig("design","מערך המחקר")}<p>המבדקים הועברו בחדר שקט. הסדר הוחלף בין נבדקים כדי למנוע <b>אפקט למידה</b> של המבחנים. הנבדקים התבקשו לקרוא מהר ומדויק, וידעו שהזמן נמדד. ארבעה מבוגרים קראו מילים בחשיפה קצרה על מסך (300 מילישניות למילה, 800 לזוג). התשובות הוקלטו, ו<b>התגובה הראשונה</b> היא שנספרה, בלי תיקונים עצמיים.</p>${def("הניתוח הסטטיסטי",`${E("χ²")} להשוואת נבדק עם ובלי ריטלין. מבחן t של Crawford & Howell להשוואת נבדק לקבוצת הביקורת. ${E("Wilcoxon")} להשוואת הקבוצה בשני התנאים. ותיקון ${E("FDR")} להשוואות מרובות.`)}`,q:"q27"}

const Q={"q1":{"t":"t1","v":[{"q":"מה היה חסר במחקר הקודם על ריטלין וקריאה, לפי התקציר?","a":"בדיקה לפי סוג הדיסלקסיה וסוג הטעות","w":["בדיקה של ילדים בגיל בית ספר","בדיקה של ריטלין בכלל על קשב","בדיקה של אנשים בלי הפרעת קשב"],"e":"מחקרים קודמים בדקו ריטלין וקריאה באופן כללי. מה שהיה חסר, והוא החידוש של המחקר, הוא בדיקה לפי סוג הדיסלקסיה ולפי סוג הטעות."},{"q":"מה השם הגנרי של ריטלין?","a":"מתילפנידאט","w":["דופאמין","נוראפינפרין","קונצרטה"],"e":"השם הגנרי של ריטלין הוא מתילפנידאט. קונצרטה היא סוג ארוך טווח של אותה תרופה, ודופאמין הוא מוליך עצבי, לא תרופה."}]},
"q2":{"t":"t1","v":[{"q":"ריטלין שיפר את הקשב של הנבדקים, אבל לא הפחית טעויות קריאה. מה המסקנה התיאורטית?","a":"הליקוי בקריאה נפרד מהקשב הכללי","w":["ריטלין לא משפיע על קשב בכלל","הליקוי בקריאה הוא חלק מהקשב הכללי","הנבדקים לא נטלו את התרופה כראוי"],"e":"אם ריטלין שיפר את הקשב, אבל טעויות הקריאה לא ירדו, הליקוי בקריאה נפרד מהקשב הכללי. הם לא אותו דבר. ריטלין כן השפיע על הקשב."},{"q":"מה מצא המחקר לפי התקציר?","a":"שיפור בקשב, בלי ירידה בטעויות הקריאה","w":["שיפור גם בקשב וגם בדיוק הקריאה","ירידה גם בקשב וגם בדיוק הקריאה","שיפור בקריאה, בלי שום שיפור בקשב"],"e":"לפי התקציר, ריטלין שיפר את הקשב, אבל לא הפחית את טעויות הקריאה בדיסלקסיות הקשביות. דיוק הקריאה לא השתפר."}]},
"q3":{"t":"t1","v":[{"q":"שגמ מזהה וזוכרת את האותיות, אבל לא את המיקום שלהן. לאיזה סוג דיסלקסיה זה מתאים?","a":"שיכול אותיות","w":["דיסלקסיית שטח","נגלקסיה","דיסלקסיה ויזואלית"],"e":"כשאדם מזהה וזוכר את האותיות, אבל לא את המיקום שלהן, זו דיסלקסיית שיכול אותיות (LPD). הבעיה היא במיקום, ולא בזיהוי האותיות."},{"q":"מה ציפו החוקרות אם הדיסלקסיה הקשבית קשורה לקשב הכללי?","a":"שריטלין ישפר גם את הקריאה","w":["שריטלין יפגע בקריאה","שריטלין לא ישפיע על הקשב","שהקריאה תשתפר רק בלי ריטלין"],"e":"אם הדיסלקסיה הקשבית קשורה לקשב הכללי, ריטלין, שמשפר קשב, צפוי לשפר גם את הקריאה. זה ההיגיון של הניסוי."}]},
"q4":{"t":"t1","v":[{"q":"למה מחקר טיפולי (״האם ריטלין עוזר?״) עונה גם על שאלה תיאורטית?","a":"כי התוצאה מגלה אם הליקוי חלק מהקשב הכללי","w":["כי כל מחקר טיפולי הוא גם תיאורטי","כי התרופה משנה את מבנה המוח לצמיתות","כי התיאוריה קובעת מה יהיה המינון"],"e":"התוצאה של המחקר הטיפולי מגלה גם אם הליקוי בקריאה הוא חלק מהקשב הכללי: אם שיפור בקשב לא משפר קריאה, הם נפרדים. כך שתי השאלות נענות בניסוי אחד."},{"q":"מה היה המערך הבסיסי של המחקר?","a":"כל נבדק נבדק פעם עם ריטלין ופעם בלי","w":["שתי קבוצות: אחת עם ריטלין ואחת בלי","בדיקה אחת בלבד, עם ריטלין","השוואה בין ריטלין לתרופה אחרת"],"e":"כל נבדק נבדק פעם עם ריטלין ופעם בלי, ומושווה לעצמו. היו 20 נבדקים. לא היו שתי קבוצות נפרדות."}]},
"q5":{"t":"t2","v":[{"q":"איך מוגדרת דיסלקסיה במאמר?","a":"שם כללי להפרעות קריאה שונות","w":["הפרעה אחת וזהה לכל מי שסובל ממנה","בעיה בראייה שמונעת קריאה","חוסר אינטליגנציה שמשפיע על קריאה"],"e":"במאמר, דיסלקסיה היא שם כללי להפרעות קריאה שונות, שכל אחת נובעת מליקוי בשלב אחר בתהליך הקריאה. זו לא הפרעה אחת וזהה."},{"q":"מהו השלב הראשון בקריאה, לפי המאמר?","a":"ניתוח חזותי","w":["הבנת המשפט","הפקת הצלילים","שליפת המשמעות"],"e":"השלב הראשון בקריאה הוא ניתוח חזותי של האותיות, ופגיעה בפונקציות שלו יוצרת דיסלקסיות שונות. הבנת המשפט מגיעה מאוחר יותר."}]},
"q6":{"t":"t2","v":[{"q":"איזו מהבאות אינה פונקציה של הנתח הוויזואלי־אורתוגרפי?","a":"הבנת משמעות המשפט","w":["זיהוי האותיות","קידוד מיקום האותיות","שיוך האותיות למילה"],"e":"הנתח הוויזואלי־אורתוגרפי מזהה אותיות, מקודד את מיקומן ומשייך אותן למילה. הבנת משמעות המשפט מגיעה מאוחר יותר בתהליך."},{"q":"פגיעה בשיוך האותיות למילה הנכונה גורמת ל:","a":"דיסלקסיה קשבית","w":["דיסלקסיית מיקום אותיות","דיסלקסיית שטח","נגלקסיה"],"e":"פגיעה בשיוך האותיות למילה הנכונה גורמת לדיסלקסיה קשבית, שבה אותיות נודדות בין מילים. בדיסלקסיית מיקום אותיות הבעיה היא בסדר בתוך המילה."}]},
"q7":{"t":"t2","v":[{"q":"תלמיד קורא ״תירס״ במקום ״תריס״. מה הסוג?","a":"שיכול אותיות","w":["דיסלקסיה קשבית","נגלקסיה","דיסלקסיית שטח"],"e":"״תירס״ במקום ״תריס״ הוא שיכול של אותיות אמצעיות בתוך מילה אחת, במילה נדידית. זו דיסלקסיית שיכול אותיות. דיסלקסיה קשבית הייתה מעבירה אותיות בין מילים."},{"q":"מהי מילה נדידית?","a":"מילה ששיכול באמצעה יוצר מילה","w":["מילה שמופיעה פעמיים במשפט","מילה שקשה מאוד לבטא נכון","מילה לועזית שנכנסה לעברית"],"e":"מילה נדידית היא מילה ששיכול של אותיות באמצעה יוצר מילה אחרת, כמו מעשנת–משענת."}]},
"q8":{"t":"t2","v":[{"q":"קורא משמיט באופן קבוע את האות בצד שמאל של כל מילה. איזה סוג זה?","a":"נגלקסיה","w":["דיסלקסיית מיקום אותיות","דיסלקסיה קשבית","דיסלקסיית שטח"],"e":"השמטה קבועה של האות בצד אחד, כאן צד שמאל, היא נגלקסיה: קושי להפנות קשב לצד אחד. בשיכול אותיות כל האותיות קיימות, רק בסדר אחר."},{"q":"בצמד ״לב חם״, קורא אומר ״חב לם״. איזה סוג זה?","a":"דיסלקסיה קשבית","w":["דיסלקסיית מיקום אותיות","נגלקסיה","דיסלקסיית שטח"],"e":"ב״חב לם״ במקום ״לב חם״, אותיות עוברות בין המילים, והמיקום בתוך המילה נשמר. זו דיסלקסיה קשבית. בשיכול אותיות הסדר משתנה בתוך מילה אחת."}]},
"q9":{"t":"t2","v":[{"q":"לפי ההסבר המוצע, למה ב-LPD האות הראשונה והאחרונה נקראות נכון?","a":"כי הקשב ממקם אותן קודם","w":["כי הן תמיד אותיות קלות לזיהוי","כי הן מודגשות בכתב הרגיל","כי הן לא נחוצות להבנת המילה"],"e":"לפי ההסבר המוצע ל-LPD, הקשב ממקם קודם את האות הראשונה והאחרונה, והקושי הוא לקשר כל אות אמצעית למיקום שלה. לכן הקצוות נקראים נכון."},{"q":"מה ההסבר הקשבי לדיסלקסיה קשבית?","a":"חלון הקשב בקריאה פגוע","w":["זרקור הקשב פונה רק ימינה","הזיכרון לאותיות פגוע","המשמעות של המילה לא מובנת"],"e":"לפי ההסבר הקשבי לדיסלקסיה קשבית, חלון הקשב בקריאה פגוע, ולכן יחידות שמחוץ לחלון, מילים אחרות, מפריעות. זרקור שפונה לצד אחד מתאים לנגלקסיה."}]},
"q10":{"t":"t2","v":[{"q":"אות נודדת ממילה שבשורה מעל למילה שבשורה מתחת. איך נקראת נדידה כזו?","a":"נדידה אנכית","w":["נדידה אופקית","שיכול אמצעי","השמטה צדדית"],"e":"נדידה של אות ממילה בשורה אחת למילה בשורה שמתחתיה היא נדידה אנכית, מאפיין של דיסלקסיה קשבית. נדידה אופקית היא בין מילים באותה שורה."},{"q":"איזו טעות נוספת מופיעה בדיסלקסיית מיקום אותיות?","a":"השמטת אות כפולה","w":["הוספת אות בצד שמאל","קריאה של מילה לועזית","החלפה של אותיות תנועה"],"e":"בדיסלקסיית מיקום אותיות מופיעה, בנוסף לשיכול, גם השמטה של אות כפולה. הוספת אות בצד אחד אינה מאפיינת אותה."}]},
"q11":{"t":"t3","v":[{"q":"אדם מתקשה לקרוא מילים, אבל קורא מספרים בלי בעיה. מה זה מרמז?","a":"שהבעיה ספציפית למילים","w":["שהבעיה היא בקשב הכללי","שהבעיה בזיכרון למספרים","שהבעיה היא בראייה עצמה"],"e":"קושי בקריאת מילים, יחד עם קריאה תקינה של מספרים, מרמז שהבעיה ספציפית למילים ולא לקשב הכללי. זו דיסוציאציה."},{"q":"באילו דיסלקסיות דווחה דיסוציאציה בין מילים למספרים?","a":"נגלקסיה, ויזואלית ו-LPD","w":["רק בדיסלקסיית שטח","רק בדיסלקסיה קשבית","באף דיסלקסיה"],"e":"דיסוציאציה בין מילים למספרים דווחה בנגלקסיה, בדיסלקסיה ויזואלית וב-LPD. זו עדות לקשב אורתוגרפי ספציפי, ולא כללי."}]},
"q12":{"t":"t3","v":[{"q":"מה הכוונה ב״קושי קשבי־אורתוגרפי״?","a":"קושי קשבי שמופיע דווקא במילים כתובות","w":["קושי קשבי שמופיע בכל משימה","קושי בזיהוי צורות האותיות","קושי בשמיעת צלילי המילים"],"e":"״קושי קשבי־אורתוגרפי״ הוא קושי קשבי שמופיע דווקא במילים כתובות, ולא בכל משימה. לכן קריאת מספרים לא נפגעת."},{"q":"איזה ממצא היה מראה שהקושי בקריאה נובע מקשב כללי?","a":"שריטלין, שמשפר קשב, היה משפר גם את הקריאה","w":["שקריאת מספרים תקינה","שהנבדקים קוראים לאט","שהטעויות מופיעות רק במילים נדידיות"],"e":"אם הקושי בקריאה היה נובע מקשב כללי, ריטלין, שמשפר קשב, היה משפר גם את הקריאה. זה לא מה שנמצא, ולכן הקושי ספציפי."}]},
"q13":{"t":"t3","v":[{"q":"למה חשוב שבמחקר קודם על אותם נבדקים ריטלין שיפר קשב?","a":"כי כך אפשר לבדוק אם קשב משופר משפר קריאה","w":["כי זה מוכיח שריטלין משפר קריאה","כי זה מראה שהנבדקים לא זקוקים לתרופה","כי זה מבטל את הצורך בקבוצת ביקורת"],"e":"כדי לבדוק אם קשב משופר משפר קריאה, צריך קודם לוודא שהקשב באמת השתפר. מחקר קודם על אותם נבדקים הראה שריטלין שיפר את הקשב שלהם."},{"q":"מה מצא המחקר הקודם על השפעת ריטלין במבחני קשב?","a":"שיפור אצל חלק ניכר","w":["שיפור אצל כל 20 הנבדקים","אין שיפור אצל אף נבדק","החמרה אצל רוב הנבדקים"],"e":"במחקר הקודם ריטלין שיפר את הקשב אצל חלק ניכר מהנבדקים: 45% בדיוק ו-70% בזמני תגובה. לא אצל כולם."}]},
"q14":{"t":"t3","v":[{"q":"מהו ״הכיוון השני״ לבדוק את הקשר בין קשב לקריאה?","a":"לשנות את הקשב בעזרת ריטלין ולבדוק את הקריאה","w":["להשוות קריאת מילים לקריאת מספרים","לבדוק ילדים בלי הפרעת קשב בכלל","לשאול את הנבדקים מה הם מרגישים"],"e":"״הכיוון השני״ הוא לשנות את הקשב בעזרת ריטלין, ולבדוק אם הקריאה משתנה. הכיוון הראשון היה הדיסוציאציה בין מילים למספרים."},{"q":"אילו מערכות קשב נבדקו במחקר הקודם?","a":"ארבע מערכות קשב שונות","w":["רק קשב חזותי","רק קשב שמיעתי","זיכרון, שפה וקריאה"],"e":"במחקר הקודם נבדקו ארבע מערכות קשב שונות. הוא לא בדק רק קשב חזותי."}]},
"q15":{"t":"t4","v":[{"q":"לאיזה חוסר איזון קשורה הפרעת קשב, לפי המאמר?","a":"דופאמין ונוראפינפרין","w":["סרוטונין ומלטונין","אינסולין וקורטיזול","אצטילכולין וגאבא"],"e":"לפי המאמר, הפרעת קשב קשורה לחוסר איזון של המוליכים העצביים דופאמין ונוראפינפרין. סרוטונין אינו אחד מהם."},{"q":"איך מתילפנידאט כנראה פועל?","a":"חוסם ספיגה חוזרת של דופאמין","w":["מוריד את רמת הדופאמין במוח","מגביר ייצור של סרוטונין","חוסם קולטנים לנוראפינפרין"],"e":"מתילפנידאט כנראה חוסם את הספיגה החוזרת של דופאמין, וכך מעלה את רמתו במוח. הוא לא מוריד את הדופאמין."}]},
"q16":{"t":"t4","v":[{"q":"איפה מרוכז הדופאמין, לפי המאמר?","a":"בפרונטלי ובגרעיני הבסיס","w":["בהיפוקמפוס ובאמיגדלה","במוח הקטן ובגזע המוח","בקליפת המוח העורפית"],"e":"לפי המאמר, הדופאמין מרוכז בעיקר באזור הפרונטלי ובגרעיני הבסיס, אזורים שקשורים לקשב, לתכנון ולשליטה מוטורית. לא בהיפוקמפוס."},{"q":"איזה מהבאים הוא סוג ארוך טווח של מתילפנידאט?","a":"קונצרטה","w":["ריטלין רגיל","דופאמין","נוראפינפרין"],"e":"קונצרטה היא סוג ארוך טווח של מתילפנידאט, וכך גם ריטלין LA ו-SR. ריטלין רגיל הוא קצר טווח."}]},
"q30":{"t":"t4","v":[{"q":"מה נכון לגבי הידע על מנגנון הפעולה של ריטלין?","a":"הוא עדיין לא הובן עד הסוף","w":["הוא ידוע לגמרי ומוסבר","הוא זהה לכל התרופות","הוא לא קשור לדופאמין"],"e":"למרות השימוש הנפוץ בריטלין, מנגנון הפעולה שלו עדיין לא הובן עד הסוף. ידוע שהוא קשור לדופאמין."},{"q":"במאמר, למה ״ריטלין״ משמש כשם כולל?","a":"לכל סוגי המתילפנידאט","w":["רק לריטלין הקצר הרגיל","לכל תרופות הפסיכיאטריה","רק לתרופות שאינן מעוררות"],"e":"במאמר, ״ריטלין״ משמש שם כולל לכל סוגי המתילפנידאט: קונצרטה, ריטלין LA ו-SR. לא רק לריטלין הקצר הרגיל."}]},
"q31":{"t":"t4","v":[{"q":"למה הפרעת קשב מטופלת דווקא בתרופה מעוררת?","a":"כי היא מעלה את רמת הדופאמין והנוראפינפרין","w":["כי היא מרדימה את המטופל בלילה","כי היא מורידה את רמת הדופאמין","כי היא משפרת את הראייה והשמיעה"],"e":"הפרעת קשב קשורה לחוסר איזון של דופאמין ונוראפינפרין, ותרופה מעוררת מעלה את רמתם. לכן מטפלים בתרופה מעוררת. היא לא מורידה את רמת הדופאמין."},{"q":"מה מבדיל ריטלין רגיל מקונצרטה?","a":"ריטלין רגיל קצר טווח, קונצרטה ארוכת טווח","w":["ריטלין רגיל ארוך טווח, קונצרטה קצרה","הם פועלים על מוליכים שונים","קונצרטה אינה מתילפנידאט"],"e":"שתיהן מתילפנידאט, אבל ריטלין רגיל קצר טווח, וקונצרטה ארוכת טווח. המסיח הראשון הופך ביניהן."}]},
"q17":{"t":"t5","v":[{"q":"ילדים עם ריטלין קראו יותר מילים נכון בדקה (Keulers). למה זה לא מוכיח שהליקוי בקריאה השתפר?","a":"אולי ריטלין שיפר רק עבודה מול שעון","w":["כי הקריאה השתפרה מעל הממוצע","כי הילדים לא נטלו ריטלין באמת","כי הם דוברי הולנדית ולא עברית"],"e":"ריטלין אולי שיפר את היכולת לעבוד מול שעון, ולא את הליקוי בקריאה. הקריאה של הילדים נשארה מתחת לממוצע, ולכן זה לא מוכיח שהליקוי השתפר."},{"q":"מה הבעיה בתוצאות של Bental & Tirosh?","a":"פירוט חסר, ואין תיקון להשוואות","w":["המדגם היה של בנות בלבד","הם לא בדקו דיוק בכלל","הם בדקו רק מבוגרים"],"e":"ב-Bental & Tirosh הפירוט חסר, ואין תיקון להשוואות מרובות. כשמתקנים (בונפרוני), התוצאות לא נשארות מובהקות."}]},
"q18":{"t":"t5","v":[{"q":"ילד עם ריטלין התקדם מהר יותר בטיפול בקריאה (Wright). מה ההסבר הסביר?","a":"הוא הצליח לשבת וללמוד","w":["הריטלין ריפא את הדיסלקסיה","הטיפול היה קצר יותר מהרגיל","המטפל היה מומחה יותר מאחרים"],"e":"ההתקדמות המהירה יותר בטיפול בקריאה נבעה כנראה מכך שהילד הצליח לשבת וללמוד, כלומר שיפור עקיף. הריטלין לא ריפא את הדיסלקסיה."},{"q":"מה המשותף לכל המחקרים הקודמים?","a":"השיפור נובע מתנאי הלמידה","w":["כולם מצאו שריטלין פוגע בקריאה","כולם בדקו דיסלקסיות לפי סוג","כולם נעשו על מבוגרים בלבד"],"e":"במחקרים הקודמים, השיפור נבע כנראה מתנאי הלמידה, כמו סבלנות ועמידה בזמן, ולא משינוי בליקוי בקריאה. הם לא בדקו דיסלקסיות לפי סוג."}]},
"q19":{"t":"t5","v":[{"q":"אצל לוקוב ופרידמן, נבדקת לא השתפרה בקריאה בקול, אבל השתפרה במטלת זהה–שונה. מה זה מרמז?","a":"שריטלין עוזר בקשב מתמשך","w":["שריטלין משפר את הקריאה בקול","שהנבדקת לא נטלה את התרופה","שמטלת זהה–שונה לא אמינה"],"e":"הנבדקת לא השתפרה בקריאה בקול, אבל השתפרה במטלת זהה–שונה, מטלה חדגונית וארוכה. זה מרמז שריטלין עוזר בעיקר בקשב מתמשך, ולא בקריאה."},{"q":"מה מצאו לוקוב ופרידמן אצל חמישה בעלי LPD?","a":"חלק השתפרו","w":["כולם השתפרו","אף אחד לא השתפר","כולם החמירו"],"e":"לוקוב ופרידמן מצאו שחלק מחמשת בעלי ה-LPD השתפרו, וחלק לא. התוצאות היו מעורבות."}]},
"q20":{"t":"t5","v":[{"q":"מה מסכם המבוא לגבי מה שידוע על ריטלין וקריאה?","a":"יש סימנים לשיפור עקיף בלבד","w":["ברור שריטלין משפר כל סוג של דיסלקסיה","ברור שריטלין פוגע בקריאה אצל כולם","אין שום מחקר קודם על ריטלין וקריאה"],"e":"המבוא מסכם שיש סימנים לשיפור עקיף בלבד בקריאה עם ריטלין, דרך תנאי הלמידה. זה הפער שהמחקר בא לסגור. לא ברור שריטלין משפר כל דיסלקסיה."},{"q":"איך היכולת לעבוד לאורך זמן יכולה לשפר קריאה?","a":"בעקיפין, בלי לשנות את הליקוי עצמו","w":["ישירות, על ידי תיקון הליקוי","רק אצל מבוגרים","רק בדיסלקסיית שטח"],"e":"היכולת לעבוד לאורך זמן, סבלנות ומשך עבודה, יכולה לשפר קריאה בעקיפין, בלי לשנות את הליקוי עצמו."}]},
"q21":{"t":"t6","v":[{"q":"למה היה צורך בקבוצת ביקורת גדולה של ילדים ומבוגרים בלי ליקויים?","a":"כדי לקבוע מה חריג","w":["כדי לתת להם ריטלין","כדי להשוות בין תרופות","כדי לבדוק את המבדקים"],"e":"קבוצת ביקורת גדולה של ילדים ומבוגרים בלי ליקויים מאפשרת לקבוע מה חריג, כלומר להשוות כל נבדק לנורמה של בני גילו. היא לא קיבלה ריטלין."},{"q":"מי היו הנבדקים?","a":"20 עם הפרעת קשב ודיסלקסיה","w":["20 בלי הפרעת קשב בכלל","20 ילדים שמעולם לא נטלו ריטלין","20 מבוגרים עם דיסלקסיית שטח"],"e":"הנבדקים היו 20 אנשים עם הפרעת קשב ודיסלקסיה: 14 תלמידים ו-6 מבוגרים. כולם נטלו ריטלין דרך קבע."}]},
"q22":{"t":"t6","v":[{"q":"מבוגרת נוטלת ריטלין רק לפני מבחנים. מה זה מראה על הנבדקים?","a":"שהשימוש לא היה אחיד","w":["שהיא לא מתאימה למחקר","שהיא לא אובחנה עם הפרעת קשב","שריטלין לא משפיע עליה"],"e":"מבוגרת שנוטלת ריטלין רק לפני מבחנים מראה שהשימוש לא היה אחיד בין הנבדקים: סוגים ומינונים שונים. זה לא אומר שהיא לא מתאימה למחקר."},{"q":"מה היה המשותף לכל הנבדקים לפני המחקר?","a":"כולם אובחנו ונוטלים ריטלין","w":["כולם היו בני אותו גיל","כולם למדו באותה כיתה","כולם היו בלי דיסלקסיה"],"e":"לפני המחקר, כל הנבדקים אובחנו עם הפרעת קשב ונטלו ריטלין, לפי המלצה של נוירולוג או פסיכיאטר. הם לא היו בני אותו גיל."}]},
"q23":{"t":"t6","v":[{"q":"מהו מבדק ״תלתן״?","a":"מבדק סינון בקריאה","w":["מבחן קשב ממוחשב","שאלון על הרגלי קריאה","מבחן הבנת הנקרא"],"e":"״תלתן״ הוא מבדק סינון בקריאה: 136 מילים, 30 צמדים ו-30 מילות תפל. הוא לא מבחן קשב."},{"q":"מתי נחשב נבדק לקוי בסוג מסוים של דיסלקסיה?","a":"כשיש לו יותר טעויות מבני גילו","w":["כשהוא טועה לפחות פעם אחת","כשהמורה מדווח על קושי בכיתה","כשהוא קורא לאט מבני גילו"],"e":"נבדק נחשב לקוי בסוג מסוים של דיסלקסיה כשיש לו יותר טעויות מבני גילו בקבוצת הביקורת. טעות אחת לא מספיקה."}]},
"q24":{"t":"t6","v":[{"q":"איזו דיסלקסיה הייתה לכל הנבדקים?","a":"LPD","w":["דיסלקסיה קשבית","נגלקסיה","דיסלקסיית שטח"],"e":"לכל הנבדקים הייתה דיסלקסיית שיכול אותיות (LPD), ולרובם (18 מתוך 20) גם דיסלקסיה קשבית."},{"q":"קורא שקורא מילים לא רגולריות ״לפי הכללים״. איזה סוג זה?","a":"דיסלקסיית שטח","w":["קבאק","LPD","דיסלקסיה קשבית"],"e":"קריאה של מילים לא רגולריות ״לפי הכללים״, כלומר דרך הממיר מאותיות לצלילים, היא דיסלקסיית שטח. ב-LPD הבעיה היא במיקום האותיות."}]},
"q25":{"t":"t6","v":[{"q":"במטלת ״מה קשור?״, משענת קשורה לכיסא או לסיגריה. מה המטלה בודקת?","a":"הבנה של מילה נדידית","w":["את מהירות הקריאה","את הקשב הכללי","את ידיעת האותיות"],"e":"מטלת ״מה קשור?״ בודקת הבנה של מילה נדידית: אם הקורא מבין ״משענת״ (קשורה לכיסא) או ״מעשנת״ (קשורה לסיגריה). היא לא מודדת מהירות."},{"q":"איך נבדקה הדיסלקסיה הקשבית במבדקי ההמשך?","a":"בזוגות מילים","w":["בקריאת מילים בודדות","במבחן קשב ממוחשב","בהכתבה של משפטים"],"e":"במבדקי ההמשך נבדקה הדיסלקסיה הקשבית בזוגות מילים, 120 זוגות, כי היא מתבטאת בנדידה בין מילים."}]},
"q26":{"t":"t6","v":[{"q":"למה נבדקו גם מטלות בלי קריאה בקול?","a":"כי אולי הן מושפעות יותר מקשב","w":["כי הן מהירות יותר לביצוע","כי הנבדקים התביישו לקרוא בקול","כי הן לא דורשות קשב בכלל"],"e":"מטלות בלי קריאה בקול אולי מושפעות יותר מקשב, ולכן נבדקו גם הן: אולי שם ריטלין יעזור יותר. זה לא בגלל שהן מהירות יותר."},{"q":"כמה מילים נדידיות הוצגו במבדק הקריאה בקול?","a":"232","w":["20","80","1,000"],"e":"במבדק הקריאה בקול הוצגו 232 מילים נדידיות, מילים שהשיכול בהן יוצר מילה אחרת."}]},
"q27":{"t":"t6","v":[{"q":"למה הוחלף סדר התנאים (עם ובלי ריטלין) בין הנבדקים?","a":"כדי למנוע אפקט למידה","w":["כדי לבלבל את הנבדקים","כדי לקצר את הניסוי","כי ההורים ביקשו זאת"],"e":"בפעם השנייה קל יותר, כי מכירים את המטלה, וזה אפקט למידה. כשמחליפים את הסדר (חלק מתחילים עם ריטלין וחלק בלי), האפקט מתקזז."},{"q":"מה נספר כטעות בקריאה?","a":"התגובה הראשונה","w":["רק הטעות האחרונה בכל מילה","רק טעויות שהנבדק לא תיקן","הממוצע של כל הניסיונות"],"e":"כטעות נספרה התגובה הראשונה של הנבדק. כך לא מסתירים את הטעות המקורית, גם אם הוא תיקן אותה אחר כך."}]},
"q28":{"t":"t6","v":[{"q":"איזה מבחן שימש להשוואת נבדק לעצמו עם ובלי ריטלין?","a":"χ²","w":["Crawford & Howell","Wilcoxon","FDR"],"e":"להשוואה של כל נבדק לעצמו, עם ובלי ריטלין, שימש מבחן χ². Crawford & Howell שימש להשוואה של נבדק לקבוצת הביקורת."},{"q":"מה מטרת תיקון FDR?","a":"להתמודד עם השוואות מרובות","w":["להשוות נבדק לביקורת","להשוות שני תנאים בקבוצה","למדוד גודל אפקט"],"e":"תיקון FDR נועד להתמודד עם השוואות מרובות, כדי לא לקבל תוצאות מובהקות במקרה. הוא לא משווה נבדק לביקורת."}]},
"q29":{"t":"t7","v":[{"q":"על אילו טעויות לא השפיע הריטלין?","a":"על אף סוג טעות שנבדק","w":["רק על שיכולי אותיות","רק על נדידות בין מילים","השפיע על כולן"],"e":"הריטלין לא הפחית אף סוג של טעות שנבדק: לא שיכולי אותיות, ולא נדידות בין מילים."},{"q":"מה המסקנה לגבי קצב הקריאה?","a":"אולי מהר יותר, לא מדויק יותר","w":["תמיד מהר יותר וגם מדויק יותר","תמיד לאט יותר מבלי ריטלין","אין שום הבדלים בין אנשים"],"e":"עם ריטלין חלק מהנבדקים קראו אולי מהר יותר, אבל לא מדויק יותר, והיו הבדלים בין־אישיים. לא כולם קראו מהר יותר."}]},
"q32":{"t":"t7","v":[{"q":"אצל חלק מהנבדקים ריטלין קיצר את זמן הקריאה, ואצל חלק האריך. מה המשמעות?","a":"שההשפעה על הקצב שונה מאדם לאדם","w":["שריטלין תמיד מאט קריאה","שהמדידה לא הייתה מדויקת","שהנבדקים לא נטלו את התרופה"],"e":"אצל חלק מהנבדקים ריטלין קיצר את זמן הקריאה, ואצל חלק האריך. כלומר, ההשפעה על הקצב שונה מאדם לאדם. זה לא בהכרח מעיד על בעיה במדידה."},{"q":"מה המשמעות התיאורטית של הממצאים?","a":"הליקוי הקשבי־אורתוגרפי נפרד מהקשב הכללי","w":["כל ליקוי קריאה נובע מקשב כללי","ריטלין לא משפר קשב בכלל","הדיסלקסיות האלה לא באמת קיימות"],"e":"המשמעות התיאורטית היא שהליקוי הקשבי־אורתוגרפי נפרד מהקשב הכללי: הקשב השתפר, והקריאה לא. ריטלין כן שיפר קשב."}]},
"q33":{"t":"t7","v":[{"q":"הורה שואל אם ריטלין יפתור את שיכולי האותיות של בנו. מה אפשר לומר לפי המחקר?","a":"שזה לא צפוי להפחית את הטעויות","w":["שזה יפתור את הבעיה לגמרי","שזה יחמיר את הבעיה","שזה תלוי רק במינון"],"e":"לפי המחקר, ריטלין שיפר את הקשב, אבל לא הפחית את טעויות הקריאה, כמו שיכולי אותיות. לכן לא צפוי שהוא יפתור את הבעיה. מינון גבוה יותר לא נבדק."},{"q":"איזה מהבאים כן השתפר עם ריטלין?","a":"ביצוע במטלות קשב כלליות","w":["מספר שיכולי האותיות","מספר הנדידות בין מילים","טעויות בתנועות"],"e":"עם ריטלין השתפר הביצוע במטלות קשב כלליות, אבל לא מספר הטעויות בקריאה. זה הפער בין קשב לקריאה שהמחקר מצא."}]},
"q34":{"t":"t7","v":[{"q":"למה הממצא חשוב גם לטיפול וגם לתיאוריה?","a":"הוא מראה גבול לתרופה ולקשר לקשב","w":["הוא מוכיח שריטלין יעיל לכל ליקוי","הוא מבטל את הצורך בטיפול בקריאה","הוא מראה שקשב ודיסלקסיה זהים"],"e":"הממצא מראה גבול לתרופה, כי היא לא מתקנת את הקריאה, ולקשר בין קשב כללי לקריאה, כי הם נפרדים. כך יש לו השלכה טיפולית ותיאורטית."},{"q":"מה ההשלכה הטיפולית של הממצאים למי שיש לו דיסלקסיה קשבית?","a":"ריטלין לבדו לא צפוי להפחית את טעויות הקריאה","w":["ריטלין במינון גבוה יפתור את הטעויות","אין צורך בשום התערבות בקריאה","שיפור בקשב הכללי יספיק לתיקון הקריאה"],"e":"למי שיש לו דיסלקסיה קשבית, ריטלין לבדו לא צפוי להפחית את טעויות הקריאה, כי הליקוי לא נפתר דרך שיפור הקשב הכללי. עדיין יש צורך בהתערבות בקריאה."}]},
"h1":{"t":"t1","v":[{"q":"מה ההיגיון התיאורטי של המחקר?","a":"אם ריטלין משפר קשב אבל לא קריאה, הליקוי נפרד מקשב כללי","w":["אם ריטלין משפר קריאה, הדיסלקסיה נגרמת ממחסור בדופאמין במוח","אם ריטלין לא משפר קשב, האבחנה של ADHD שגויה","אם ריטלין משפר קריאה, אין צורך בטיפול בקריאה"],"e":"השאלה הטיפולית עונה גם על התיאורטית: האם הליקוי הקשבי־אורתוגרפי הוא חלק מהקשב הכללי."}]},
"h2":{"t":"t2","v":[{"q":"קורא קורא ״מרעיש ארגיל״ כ״מרגיש ארעיל״. איזו דיסלקסיה מתאימה?","a":"דיסלקסיה קשבית: אותיות נודדות בין מילים","w":["דיסלקסיית מיקום אותיות: שיכול בתוך המילה","נגלקסיה: השמטה בצד אחד של המילה","דיסלקסיית שטח: קריאה לפי כללים"],"e":"האות עברה ממילה למילה ושמרה על המיקום היחסי. ב־LPD השיכול הוא של אותיות אמצעיות בתוך מילה."}]},
"h3":{"t":"t3","v":[{"q":"נמצא אדם שמתקשה בקריאת מילים אבל קורא מספרים כרגיל. מה הממצא תומך?","a":"הנתח הוויזואלי־אורתוגרפי ספציפי למילים","w":["הקושי נובע מקשב כללי ירוד במיוחד","הקושי נובע מבעיה בחדות הראייה","הקושי ייעלם לגמרי עם טיפול בריטלין לאורך זמן"],"e":"דיסוציאציה בין מילים למספרים מצביעה על קושי קשבי־אורתוגרפי ולא קשבי כללי."}]},
"h4":{"t":"t5","v":[{"q":"מה הבעיה הפרשנית במחקרים קודמים שמצאו שריטלין משפר קריאה?","a":"השיפור אולי נבע מסבלנות, לא מתיקון הליקוי","w":["הם לא כללו נבדקים עם הפרעת קשב מאובחנת","הם בדקו רק קריאה של מספרים, ולא קריאה של מילים","הם השתמשו במינונים גבוהים מדי של התרופה"],"e":"קולרס: יותר מילים בדקה אבל עדיין מתחת לממוצע. רייט: הילד יכול לשבת וללמוד. בנטל ותירוש: לא שרד בונפרוני."}]},
"h5":{"t":"t6","v":[{"q":"למה החוקרות ציפו שהמבדקים בלי פלט קולי יושפעו יותר מקשב כללי?","a":"הם חדגוניים ונמשכים זמן, ולכן דורשים קשב מתמשך","w":["הם קצרים יותר מהמבדקים שדורשים קריאה בקול, ולכן קלים","הם כוללים רק מילות תפל ולא מילים אמיתיות","הם הועברו בחשיפה קצרה מאוד על מסך מחשב"],"e":"זהה–שונה, הכרעה לקסיקלית, מילה–תמונה ו״מה קשור״ דורשים התמדה. זו נקודה שבה ריטלין יכול היה להשפיע."}]},

const SUM=`<h2>סיכום: האם ריטלין משפר קריאה אצל אנשים עם דיסלקסיה קשבית?</h2>
<div class="key"><b>על מה מדובר?</b> הרבה אנשים עם הפרעת קשב סובלים גם מ<b>דיסלקסיה</b>, ויש סוגי דיסלקסיה שנראים ״קשביים״: האותיות מתחלפות או נודדות בין מילים. אז אם <b>ריטלין</b> משפר קשב, אולי הוא משפר גם את הקריאה? המחקר בדק 20 אנשים, ילדים ומבוגרים, שקראו <b>פעם עם ריטלין ופעם בלי</b>. התוצאה: הריטלין שיפר את הקשב הכללי, אבל <b>לא הפחית את טעויות הקריאה</b>. והמסקנה החשובה היא תאורטית: אם הקשב השתפר והקריאה לא, אז הליקוי בקריאה הוא <b>קשב מיוחד לאותיות</b>, נפרד מהקשב הכללי.</div>

<div class="key"><b>למה המאמר הזה בקורס?</b> זה אחד משלושת מאמרי החובה של <b>התרגול</b> במבוא לפסיכולוגיה (בוחרים אחד מתוך שלושה). המטרה בתרגול היא ללמוד <b>לקרוא מאמר מחקרי</b>: לקראת <b>תרגול 5</b> קוראים רק את <b>הכותרת והתקציר</b>, ולקראת <b>תרגול 7</b> את <b>המבוא והשיטה</b>. לכן כדאי לקרוא את הסיכום עם שאלות של חוקר: מה שאלת המחקר? מה ההשערות? מי המשתתפים? מה מדדו? ומה נמצא?<br><b>לתרגול 7 (מבוא ושיטה):</b> החלקים שתואמים את המבוא הם סעיפים 1–5. השיטה היא סעיף 6. הממצאים (סעיף 7) הם תוספת להבנה.</div>

<h3>מילון מחקר לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>תקציר</b></td><td>פסקה בתחילת המאמר שמסכמת הכול: השאלה, השיטה, הממצאים והמסקנה.</td></tr>
<tr><td><b>מבוא</b></td><td>החלק שמסביר מה כבר ידוע, מה חסר, ולמה צריך את המחקר הזה. בסופו באות ההשערות.</td></tr>
<tr><td><b>שיטה</b></td><td>מי השתתף (מדגם), באילו כלים מדדו, ואיך המחקר התבצע (הליך).</td></tr>
<tr><td><b>השערה</b></td><td>ניבוי שאפשר לבדוק: ״אם X, אז Y״.</td></tr>
<tr><td><b>משתנה</b></td><td>מה שמודדים או משנים. בתלוי מודדים את התוצאה; הבלתי תלוי הוא מה שמשנים או משווים לפיו.</td></tr>
<tr><td><b>דיסוציאציה</b></td><td>מצב שבו יכולת אחת נפגעת ויכולת אחרת לא. זה מרמז שהן נשענות על מנגנונים נפרדים.</td></tr>
<tr><td><b>מערך תוך־נבדקי</b></td><td>כל משתתף נבדק בשני התנאים (כאן: עם ריטלין ובלי), ומשווים אותו לעצמו.</td></tr>
</table></div>

<div id="abs"><h3>איך מזהים במאמר את הכותרת ואת התקציר</h3>
<div class="ex"><b>הכותרת:</b> השורה הגדולה והמודגשת בראש העמוד הראשון. זה השם של המאמר. מתחתיה מופיעים שמות החוקרים.<br>
<b>התקציר:</b> הפסקה שבאה מיד אחרי שמות החוקרים, <b>לפני</b> שהמאמר עצמו מתחיל. לרוב היא מסודרת אחרת משאר הטקסט (מוזחת, באות קטנה יותר או בתוך מסגרת), לפעמים מופיעה מעליה המילה ״תקציר״, ובסופה בדרך כלל יש שורה של <b>״מילות מפתח״</b>. מה שבא אחרי מילות המפתח הוא כבר המבוא.<br>
<b>למה זה חשוב:</b> התקציר הוא ״המאמר בקטן״. בדרך כלל יש בו, לפי הסדר: הרקע (למה זה מעניין), שאלת המחקר, השיטה (מי ומה בדקו), הממצאים העיקריים, והמסקנה. מי שמבין את התקציר יודע על מה כל המאמר.</div>
<h4>הכותרת והתקציר של המאמר הזה, במילים שלנו</h4>
<div class="ex"><b>הכותרת:</b> ״האם מתילפנידאט (ריטלין) מסייע לבעלי דיסלקסיית שיכול אותיות ודיסלקסיה קשבית?״<br>
<b>מה הכותרת כבר מגלה:</b> היא בנויה כ<b>שאלה</b>, וזו בדיוק שאלת המחקר: האם תרופה מסוימת (ריטלין) עוזרת לקבוצה מסוימת (אנשים עם שני סוגי דיסלקסיה).<br><br>
<b>מה אומר התקציר, חלק אחרי חלק:</b><br>
① <b>רקע:</b> ריטלין הוא טיפול עיקרי בהפרעת קשב. להרבה אנשים עם הפרעת קשב יש גם דיסלקסיה, אבל מעט מחקרים בדקו את השפעת התרופה על קריאה, ואף אחד לא בדק סוגי דיסלקסיה וסוגי טעויות שונים.<br>
② <b>שאלת המחקר:</b> האם ריטלין משפר קריאה אצל אנשים עם דיסלקסיה שמקורה קשבי?<br>
③ <b>שיטה:</b> 20 ילדים, בני נוער ומבוגרים עם הפרעת קשב ודיסלקסיה קשבית־אורתוגרפית. הקריאה נבדקה פעם עם ריטלין ופעם בלי. מדדו את הטעויות מכל סוג, את קצב הקריאה ואת הביצוע במטלות שונות.<br>
④ <b>ממצאים:</b> ריטלין שיפר את הביצוע במטלות קשב כלליות, אבל לא הפחית את טעויות הקריאה.<br>
⑤ <b>מסקנה:</b> מלבד המשמעות לטיפול, הליקויים האלה בקריאה <b>נפרדים</b> מהקשב הכללי.</div></div>

<h3>הדוגמה שתלווה אותנו: שגמ</h3>
<p>שגמ היא אישה עם הפרעת קשב ושני סוגי דיסלקסיה. היא מתארת: ״יש לי זיכרון מעולה לצורות... אני מזהה את האותיות, אני זוכרת אותן, אבל לא את המיקום שלהן״. השאלה של המחקר היא בעצם: האם הריטלין יעזור לשגמ גם לקרוא?</p>

<h3>1. ההיגיון של המחקר</h3>
<p>המחקר שואל שאלה <b>טיפולית</b> (האם ריטלין עוזר לקריאה?), אבל התשובה עונה גם על שאלה <b>תאורטית</b> (האם הבעיה בקריאה היא חלק מהקשב הכללי?):</p>
<div class="tw"><table><tr><th>אם...</th><th>אז צפוי ש...</th></tr>
<tr><td>הבעיה בקריאה היא חלק מהקשב הכללי</td><td>ריטלין ישפר קשב, ולכן גם קריאה</td></tr>
<tr><td>הבעיה ספציפית לאותיות</td><td>ריטלין ישפר קשב, אבל הקריאה לא תשתפר</td></tr></table></div>

<h3>2. מהי דיסלקסיה, ושלושת הסוגים הקשביים</h3>
<p><b>דיסלקסיה</b> = שם כללי להפרעות קריאה, מולדות או נרכשות, שנובעות מפגיעה בשלבים שונים של תהליך הקריאה. השלב הראשון הוא ה<b>נתח הוויזואלי־אורתוגרפי</b>: החלק שמזהה את האותיות ואת המיקום שלהן. יש לו כמה תפקידים, וכל פגיעה יוצרת סוג אחר של דיסלקסיה. לשלושה סוגים יש בסיס <b>קשבי־אורתוגרפי</b>, כלומר קושי קשבי שקורה רק במילים כתובות:</p>
<div class="tw"><table><tr><th>סוג</th><th>מה קורה</th><th>דוגמה</th></tr>
<tr><td><b>נגלקסיה</b></td><td>לא שמים לב לצד אחד של המילה (בדרך כלל השמאלי), ומשמיטים, מחליפים או מוסיפים שם אותיות</td><td>החלק האחרון של המילה ״נעלם״</td></tr>
<tr><td><b>דיסלקסיית מיקום אותיות (LPD)</b></td><td>האותיות ה<b>אמצעיות</b> מתחלפות ביניהן</td><td>״מרפק״ במקום ״מפרק״</td></tr>
<tr><td><b>דיסלקסיה קשבית</b></td><td>אותיות <b>נודדות בין מילים</b>, ושומרות על המיקום שלהן</td><td>אות ממילה אחת ״קופצת״ למילה שלידה</td></tr></table></div>
<ul>
<li><b>מילים נדידיות</b> = מילים שאם מחליפים בהן אותיות אמצעיות, מקבלים מילה אחרת אמיתית (תריס–תירס, מעשנת–משענת). שם LPD בולטת הכי הרבה, כי הטעות ״נשמעת הגיונית״.</li>
<li><b>איך הקשב נכשל ב־LPD:</b> הקורא שם קשב קודם לאות הראשונה והאחרונה. אחר כך הוא מסתכל על כל האמצעיות <b>יחד</b>, ולא מצליח לקשור כל אחת למקום שלה. בדיוק מה ששגמ מתארת.</li>
<li><b>בדיסלקסיה קשבית:</b> ״<b>חלון הקשב</b>״ פגוע, ולכן נכנסות אליו גם אותיות ממילים שכנות (מימין, משמאל, מלמעלה ומלמטה) ומפריעות.</li>
</ul>

<h3>3. קשב כללי או קשב לאותיות?</h3>
<p>יש שתי דרכים לבדוק את זה:</p>
<ul>
<li><b>דרך 1: מילים מול מספרים.</b> נמצאו אנשים שמתקשים לקרוא מילים, אבל קוראים מספרים בלי בעיה. זו <b>דיסוציאציה</b> (הפרדה בין שתי יכולות), והיא מרמזת שהבעיה לא בקשב הכללי, אלא בקשב שמיועד לאותיות.</li>
<li><b>דרך 2: לשנות את הקשב ולראות מה קורה לקריאה.</b> וזה מה שריטלין מאפשר. במחקר קודם על <b>אותם</b> נבדקים (קידר, פרידמן ושלו־מבורך, 2011), הריטלין שיפר קשב: 9 מתוך 20 (45%) השתפרו בדיוק במבחני קשב, ו־14 מתוך 20 (70%) הגיבו מהר יותר. כלומר הקשב באמת השתפר. עכשיו נשאר לבדוק את הקריאה.</li>
</ul>

<h3>4. איך ריטלין פועל</h3>
<ul>
<li><b>מתילפנידאט</b> (השם המסחרי: ריטלין) הוא תרופה <b>מעוררת</b>. הפרעת קשב קשורה לחוסר איזון של <b>דופאמין</b> ו<b>נוראפינפרין</b>.</li>
<li>הוא מעלה את רמתם, כנראה על ידי <b>חסימת הספיגה החוזרת</b> של דופאמין (כך הוא נשאר יותר זמן בין תאי העצב), בעיקר בסטריאטום. דופאמין מרוכז בקורטקס הפרונטלי ובגרעיני הבסיס, שקשורים לקשב, תכנון ומוטיבציה.</li>
<li>המנגנון עוד <b>לא מובן עד הסוף</b>. ריטלין רגיל הוא <b>קצר טווח</b>; יש גם ארוכי טווח (קונצרטה, ריטלין LA, ריטלין SR). במאמר ״ריטלין״ = כולם.</li>
</ul>

<h3>5. מה היה ידוע קודם</h3>
<p>מעט מחקרים בדקו ריטלין וקריאה, ו<b>אף אחד</b> לא הפריד בין סוגי דיסלקסיה וסוגי טעויות:</p>
<div class="tw"><table><tr><th>מחקר</th><th>מה נמצא</th><th>הבעיה</th></tr>
<tr><td><b>Keulers</b> (2007), הולנדית</td><td>יותר מילים נכונות בדקה</td><td>הקריאה נשארה מתחת לממוצע; אולי רק עמדו טוב יותר בלחץ זמן</td></tr>
<tr><td><b>Bental &amp; Tirosh</b> (2008), עברית</td><td>הדיוק השתפר</td><td>לא ברור באילו מילים; לא שורד תיקון להשוואות מרובות</td></tr>
<tr><td><b>Wright</b> (2011), 2 נבדקים</td><td>טיפול בקריאה עבד טוב יותר עם ריטלין</td><td>כנראה כי הילד ישב בסבלנות, לא כי הקריאה עצמה השתפרה</td></tr>
<tr><td><b>לוקוב ופרידמן</b> (2007), 5 עם LPD</td><td>אצל 2 ירדו טעויות, אצל 3 לא</td><td>מדגם קטן מאוד</td></tr></table></div>
<p><b>המשותף:</b> השיפור יכול לנבוע מ<b>תנאים</b> של הקריאה (סבלנות, עמידה בזמן), ולא מתיקון של הליקוי עצמו.</p>

<h3>6. השיטה</h3>
<ul>
<li><b>נבדקים:</b> 20 עם הפרעת קשב ודיסלקסיה קשבית שנוטלים ריטלין: 14 תלמידים (כיתות ד׳–ט׳) ו־6 מבוגרים. <b>קבוצת ביקורת</b>: 34 ילדים ו־359 מבוגרים בלי קשיים.</li>
<li><b>אבחון:</b> מבדק <b>תלתן</b> (קריאה בקול של מילים, צמדי מילים ומילות תפל). נבדק נחשב לקוי אם עשה יותר טעויות מבני גילו בביקורת. <b>לכולם היה LPD</b>, ול־18 מתוך 20 גם דיסלקסיה קשבית.</li>
<li><b>מבדקים:</b> חלק בקול (קריאת מילים נדידיות, זוגות מילים) וחלק <b>בלי קול</b>: זהה–שונה (חמוץ–חומץ), הכרעה לקסיקלית (״האם זו מילה?״), מילה–תמונה (שוטפת/שופטת), ו״מה קשור?״ (משענת: לכיסא או לסיגריה?). המבדקים בלי קול ארוכים ומשעממים, ולכן ציפו שהם יושפעו <b>יותר</b> מקשב כללי.</li>
<li><b>הליך:</b> כל נבדק נבחן פעם עם ריטלין ופעם בלי. סדר המבדקים הוחלף בין נבדקים כדי למנוע למידה. נספרה רק התגובה <b>הראשונה</b>, בלי תיקונים עצמיים.</li>
</ul>

<h3>7. מה נמצא</h3>
<div class="tw"><table><tr><th>מה נבדק</th><th>האם ריטלין עזר?</th></tr>
<tr><td>מטלות קשב כלליות</td><td><b>כן</b></td></tr>
<tr><td>שיכולי אותיות (LPD)</td><td><b>לא</b></td></tr>
<tr><td>נדידות בין מילים (קשבית)</td><td><b>לא</b></td></tr>
<tr><td>טעויות אחרות (שטח, טעויות תנועה)</td><td><b>לא</b></td></tr>
<tr><td>קצב הקריאה</td><td><b>תלוי באדם</b>: אצל חלק קיצר, אצל חלק האריך</td></tr></table></div>
<p><b>חזרה לשגמ:</b> הריטלין יעזור לה להתרכז במבחן, ואולי לקרוא <b>מהר</b> יותר, אבל הוא לא יעזור לה לזכור איפה כל אות נמצאת. ומכאן המסקנה התאורטית: <b>הליקוי הקשבי־אורתוגרפי נפרד מהקשב הכללי</b>.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. <b>שאלת המחקר:</b> האם ריטלין משפר קריאה אצל אנשים עם דיסלקסיה קשבית ודיסלקסיית מיקום אותיות?<br>
2. <b>למה זה מעניין גם תאורטית:</b> אם ריטלין, שמשפר קשב כללי, ישפר גם את הקריאה, הבעיה בקריאה היא חלק מהקשב הכללי. אם לא, יש ״קשב לאותיות״ נפרד.<br>
3. <b>השיטה:</b> 20 נבדקים (14 ילדים ו־6 מבוגרים) עם הפרעת קשב ודיסלקסיה קשבית, שנבחנו <b>פעם עם ריטלין ופעם בלי</b>, במבדקי קריאה עם קול ובלי קול, מול קבוצת ביקורת.<br>
4. <b>הממצאים:</b> ריטלין שיפר את <b>הקשב הכללי</b>, אבל <b>לא</b> הפחית את טעויות הקריאה: לא שיכולי אותיות, לא נדידות בין מילים ולא טעויות אחרות. קצב הקריאה השתנה אחרת אצל כל אחד.<br>
5. <b>המסקנה:</b> הליקוי הקשבי־אורתוגרפי <b>נפרד</b> מהקשב הכללי. ריטלין עוזר להתרכז, אבל לא מתקן את הקריאה עצמה.<br><br>
<b>מה צריך לדעת לעשות בתרגולים:</b><br>
• לנסח את שאלת המחקר ולהסביר את שתי האפשרויות (״אם... אז...״).<br>
• להסביר מה זה LPD ודיסלקסיה קשבית, ולמה מילים נדידיות חשובות.<br>
• לזהות את המשתנה הבלתי תלוי (עם ריטלין או בלי) ואת התלויים (טעויות קריאה, קשב, קצב).<br>
• לתאר את המדגם, את המבדקים ואת ההליך, ולהסביר למה החליפו את סדר המבדקים.<br>
• להסביר למה המחקרים הקודמים לא הספיקו, ומה המחקר הזה מוסיף.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>ריטלין כן שיפר קשב</b>; הוא לא שיפר את דיוק הקריאה.</li>
<li><b>המסקנה התאורטית: הליקוי בקריאה נפרד מהקשב הכללי</b>, לא חלק ממנו.</li>
<li><b>LPD = אותיות אמצעיות בתוך מילה; קשבית = אותיות בין מילים.</b></li>
<li><b>קצב הקריאה לא השתפר אצל כולם</b>: אצל חלק התקצר ואצל חלק התארך.</li>
<li><b>לכל הנבדקים היה LPD</b>, ולא לכולם הייתה דיסלקסיה קשבית (18 מתוך 20).</li>
<li><b>שיפור במחקרים קודמים אולי נבע מסבלנות ועמידה בזמן</b>, לא מתיקון הליקוי.</li>
</ul></div>`;

  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
</html>
