<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>

const T=[
 {id:"t1",icon:"bulb",title:"הרעיון: כלכלת אסימונים",blocks:[
  {h:"מה ידוע",html:`${def("על מה הנושא",`איך גורמים לתלמידים להתנהג טוב יותר בכיתה? הנושא מציג את השיטה שהמחקר בודק, ואת הבעיה שהוא מנסה לפתור.<br><b>מה נלמד כאן:</b> כלכלת אסימונים · הקושי בסביבה טבעית · מטרות המחקר`)}${def("מושג מפתח",`<mark>כלכלת אסימונים</mark> ${E("Token economy")}: שיטה לעיצוב התנהגות שבה נותנים <b>אסימונים</b> על התנהגות רצויה, ואפשר <b>לפדות</b> אותם בפרסים.`)}<p>מחקרים קודמים הוכיחו את יעילותה במסגרות טיפוליות שונות: בתי חולים לחולי נפש, מוסדות למפגרים (כך במקור), כיתות טיפוליות, מוסדות לעבריינים ובתי ספר רגילים.</p>${rem("הצלחת הטיפול ההתנהגותי תלויה ב<b>מידת ההמשכיות</b> בין התנהגות הפרט לבין תגובת הסביבה. ככל שהמסגרת מאפשרת יותר <b>פיקוח</b> על הסביבה, כך גדל הסיכוי שהשיטה תצליח.")}${ex(`<b>כלכלת אסימונים</b>: כמו כרטיסייה בבית קפה. על כל התנהגות טובה התלמיד מקבל "חותמת", ואחרי מספר חותמות הוא מחליף אותן בפרס.`)}`,q:"q1"},
  {h:"הקושי בסביבה \"טבעית\"",html:`<p>בסביבה טבעית, כמו בית ספר, פועלות על התלמיד הרבה מערכות חיזוק, והמטפל שולט רק בחלק קטן מהן. לכן הניסוי התמקד בהתנהגויות שקשורות <b>ישירות לחיי בית הספר</b>.</p>${tiles([["hand","חיזוקים חברתיים","הערכה, אהבה, דחייה, כעס. הם רוב החיזוקים שלנו ביומיום"],["cart","חיזוקים מוחשיים","חפצים ופרסים. בחשיבות משנית בחיים"]])}${def("הבעיה",`חיזוקים חברתיים טבעיים לא תמיד <b>תלויים</b> בהתנהגות, ניתנים <b>במרחק זמן</b>, ומושפעים מרגשות ועמדות של מי שנותן אותם. לכן, כדי ששינוי יחזיק, צריך <b>להתאים בהדרגה</b> את החיזוקים בניסוי לחיזוקים של חיי היום־יום.`)}`,q:"q3"},
  {h:"מטרות המחקר",html:`${tiles([["target","יעילות","להראות שכלכלת אסימונים מעצבת התנהגות של ילדים עם התנהגות חריגה"],["sprout","ממוחשי לחברתי","להדגיש את המעבר מחיזוקים מוחשיים לחברתיים, כולל מעורבות התלמידים בהתנהגות חבריהם"],["people","צוות לא מומחה","להראות שאפשר להפעיל את השיטה בעזרת צוות שלא הוכשר בטיפול התנהגותי"]])}`,q:"q5"}
 ]},
 {id:"t2",icon:"flask",title:"מערך הניסוי",blocks:[
  {h:"הנבדקים הם הביקורת של עצמם",html:`${def("על מה הנושא",`איך יודעים שהשיטה היא שגרמה לשינוי? הנושא מסביר את מערך הניסוי, שבו כל תלמיד משמש ביקורת של עצמו.<br><b>מה נלמד כאן:</b> מודל A1 B1 A2 B2 · הנבדקים · קו הבסיס`)}<p>הדרך האובייקטיבית לבדוק יעילות טיפול היא למדוד את <b>השינוי בהתנהגות</b>: בזמן הטיפול וגם <b>אחרי שמפסיקים</b> אותו (לפי סידמן). כך הנבדקים משמשים <b>קבוצת ניסוי וביקורת כאחת</b>.</p>${fig("phases")}${def("מודל A1 B1 A2 B2",`<b>A1</b>: שכיחות ההתנהגויות לפני הניסוי. <b>B1</b>: בסוף השלב הראשון (חיזוקים מוחשיים). <b>A2</b>: אחרי הפסקת הטיפול, בתחילת השלב השני. <b>B2</b>: בסוף השלב השני (חיזוקים חברתיים).`)}${ex(`כמו לבדוק אם מנורה עובדת: מדליקים (B) ורואים שיש אור, מכבים (A) ורואים שחושך, ומדליקים שוב. אם האור תמיד מופיע רק כשמדליקים, ברור שהמתג הוא הסיבה. כך גם כאן: אם ההתנהגות משתפרת רק כשהשיטה פועלת, השיטה היא הסיבה.`)}`,q:"q7"},
  {h:"הנבדקים",html:`<p>בית ספר מיוחד לילדים עם <b>קשיי הסתגלות</b>, שלא תפקדו במסגרות רגילות בגלל הפרעות התנהגות. כיתות קטנות של 6 עד 9 תלמידים עם יחס אישי. רמת הלימודים נמוכה, למרות שרמת המשכל בינונית ומעלה.</p>${tiles([["people","6 תלמידים","בגילאי 9 וחצי עד 11, בכיתה ג'–ד'"],["building","כיתת הקליטה הראשונה","בבית הספר. אחת הכיתות הבעייתיות ביותר"],["copies","3 הצטרפו אחר כך","אבל הדיווח הוא רק על 6 שהשתתפו מההתחלה עד הסוף"]])}`,q:"q9"},
  {h:"מה קרה בכיתה",html:`<p>בחודשיים הראשונים המורה לא הצליחה לפעמים לסיים שיעור. התלמידים איחרו, קמו ממקומם, הסתובבו, היכו זה את זה ודיברו בלי להצביע. לא היה אפשר לקיים שיחה עניינית יותר מכמה דקות.</p>${def("קו הבסיס (A1)",`במשך שבועיים, <b>שלושה סטודנטים</b> צפו בכיתה 4 שעות ביום ורשמו. הם הודרכו <b>להתעלם</b> מפניות התלמידים, שהתרגלו אליהם מהר. נמצא שההתנהגויות החריגות <b>עולות</b> לאורך היום: בשיעור הראשון התלמידים \"שקטים\" יחסית, ובשיעור הרביעי ההפרעות רבות.`)}${yn(["איחורים (בתחילת היום ואחרי ההפסקות)","הסתובבות בכיתה בזמן השיעור","דיבור בלי הצבעה"],[])}`,q:"q11"}
 ]},
 {id:"t3",icon:"cart",title:"שלב א': פרסים מוחשיים",blocks:[
  {h:"איך הוצגה השיטה (B1)",html:`${def("על מה הנושא",`השלב הראשון: התלמידים קיבלו אסימונים שאפשר להחליף בפרסים מוחשיים. ואז הפסיקו, כדי לבדוק מה קורה.<br><b>מה נלמד כאן:</b> הצגת השיטה · לוח הישגים ופרס שבועי · ההפסקה`)}<p>ביום הראשון המורה הציגה את השיטה <b>כמשחק</b>: אילו התנהגויות מזכות באסימונים, מה ה\"מחיר\" של כל התנהגות, ומה צריך כדי לקבל פרס בסוף היום או השבוע.</p>${tiles([["check","בחירת פרסים","כל תלמיד דירג אילו פרסים הוא מעדיף: ראשון, שני ושלישי"],["cart","פרס יומי","קרמבו, פל מצופה, סוכריות, עיפרון, מחברת"],["chart","פרס שבועי","עט, קופסת צבעים, בקבוק קוקה קולה"]])}${rem("המורה התבקשה <b>לא להשתמש בעונשים</b> ולא להשתמש באסימונים כעונש.")}`,q:"q13"},
  {h:"איך זה עבד בפועל",html:`${tiles([["link","קשר ברור ועקבי","בין התנהגות רצויה (להגיע בזמן, לשבת במקום, להצביע) לבין קבלת אסימון"],["cart","\"שוק\" בסוף היום","התלמידים המירו אסימונים בפרסים"],["cycle","החלפת פרסים","כל שבועיים, כדי שלא יגיעו ל<b>רוויה</b>"],["hand","גמול מילולי","המורה ליוותה כל פרס במילה טובה"]])}${def("לוח הישגים ופרס שבועי",`המורה רשמה את האסימונים על לוח קיר, ובסוף השבוע 2 עד 3 הילדים עם הכי הרבה נקודות קיבלו פרס מיוחד. בשלב הזה ניתן אסימון אחד <b>גם לילדים שלא הגיעו</b> לכך, כדי לעודד ולהגביר את מעורבותם. השלב נמשך <b>5 שבועות</b>.`)}`,q:"q15"},
  {h:"ההפסקה (A2)",html:`<p>כדי לבדוק מה קורה כשמפסיקים, החיזוקים הופסקו ל<b>יומיים</b>. ההסבר לתלמידים: חסר תקציב לפרסים.</p>${tiles([["x","הכל הוסר","אסימונים, פרסים ולוח ההישגים, כדי שלא ייראה שהשיטה חוזרת"],["doc","רק תזכורת","המורה המשיכה להזכיר מה ההתנהגויות הרצויות"]])}${rem("זה ההיגיון של <b>מערך היפוך</b>: אם ההתנהגות חוזרת כשמפסיקים, זה סימן שהטיפול הוא שגרם לשינוי.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"people",title:"שלב ב': פרסים חברתיים",blocks:[
  {h:"צעד ראשון: בחירה ודחייה (שבועות 9 עד 12)",html:`${def("על מה הנושא",`השלב השני: מעבר מפרסים מוחשיים לפרסים חברתיים, שקרובים יותר לחיים האמיתיים.<br><b>מה נלמד כאן:</b> בחירה ודחייה · פרסים חברתיים מופשטים · שלושה שינויים`)}${tiles([["copies","בחירה","התלמידים בחרו בין פרס מוחשי (קרמבו) לבין <b>מעמד מכובד</b>, כמו אחראי על כדורי הספורט או על פינת החי"],["clock","יותר זמן","הוגדל הזמן בין ההתנהגות לבין הפרס: צוברים אסימונים ומקבלים חיזוק כל יומיים"]])}`,q:"q19"},
  {h:"צעד שני: פרסים חברתיים מופשטים (שבועות 13 עד 16)",html:`<p>מתן האסימונים <b>הופסק</b>. במקומו, בסוף כל יום המורה ציינה את הערכתה לכל תלמיד, מ\"מעט טוב\" עד \"טוב מאוד\", על לוח מיוחד. הסיכום בסוף השבוע קבע את הפרס השבועי, <b>הפרס היחיד</b> בשלב הזה:</p>${tiles([["doc","מכתב להורים","מכתב שבח על ההתנהגות, בחתימת מנהל בית הספר ומחנכת הכיתה"],["people","ישיבת הצוות","השתתפות בפגישה השבועית של הנהלת בית הספר וצוות המחקר על הכיתה"]])}${ex("בכל ישיבה השתתפו 2 עד 3 תלמידים מצטיינים. בשבוע ה-16, האחרון, השתתפו <b>כל</b> תלמידי הכיתה.")}`,q:"q21"},
  {h:"שלושה שינויים שמקרבים לחיים",html:`${tiles([["question","הערכה סובייקטיבית","המורה העריכה בסוף היום, בלי קשר ישיר להתנהגויות ספציפיות בכל שיעור"],["clock","פער זמן","פרס אחד בשבוע. דורש הבנת הקשר ונכונות <b>לדחות סיפוק</b>"],["hand","מהות הפרס","והכי חשוב: מעמד חברתי והערכה חיובית, דרך ההשתתפות בישיבות"]])}`,q:"q23"}
 ]},
 {id:"t5",icon:"chart",title:"התוצאות",blocks:[
  {h:"מה קרה להתנהגויות",html:`${def("על מה הנושא",`מה קרה להתנהגויות לאורך כל השלבים?<br><b>מה נלמד כאן:</b> התוצאות`)}${fig("table","ממוצע ההתנהגויות החריגות לשיעור, לכל הכיתה, בסוף כל שלב")}${tiles([["check","A1 ← B1","הירידה <b>הברורה ביותר</b>, מובהקת בכל שלוש ההתנהגויות"],["x","בהפסקה (A2)","עלייה, מובהקת בהסתובבות ובדיבור בלי הצבעה. אבל <b>לא חזרה</b> לרמה שלפני הניסוי"],["chart","בשלב החברתי (B2)","ירידה <b>מתונה אך מובהקת</b> בשלושתן. הכי מתונה בדיבור בלי הצבעה"]])}`,q:"q25"}
 ]},

const Q={"q1":{"t":"t1","v":[{"q":"מורה נותנת מדבקה על כל שיעור שבו תלמיד הצביע, ואחרי עשר מדבקות התלמיד בוחר פרס. מה השיטה?","a":"כלכלת אסימונים","w":["ענישה חיובית","למידה מצפייה","חיזוק בלתי תלוי"],"e":"מדבקות שניתנות על התנהגות רצויה, ואפשר לצבור ולפדות בפרס, הן כלכלת אסימונים. בחיזוק בלתי תלוי הפרס ניתן בלי קשר להתנהגות, וכאן הוא תלוי בהצבעה."},{"q":"במה תלויה הצלחת הטיפול ההתנהגותי, לפי המאמר?","a":"בהמשכיות בין ההתנהגות לתגובת הסביבה","w":["באינטליגנציה ובגיל של המטופל","בגובה ובערך הכספי של הפרס","במספר המטפלים שמעורבים בצוות"],"e":"לפי המאמר, ההצלחה תלויה בהמשכיות: קשר עקבי בין ההתנהגות לבין התגובה של הסביבה. היא לא תלויה בערך הכספי של הפרס."}]},
"q2":{"t":"t1","v":[{"q":"למה השיטה הצליחה במיוחד בבתי חולים ובמוסדות?","a":"כי שם אפשר לפקח כמעט על כל הסביבה","w":["כי שם המטופלים חולים יותר מבבית ספר","כי שם יש יותר תקציב לפרסים ולאסימונים","כי שם המטופלים צעירים יותר מתלמידים"],"e":"בבתי חולים ובמוסדות אפשר לפקח כמעט על כל הסביבה, וככל שיש יותר פיקוח, הקשר בין התנהגות לחיזוק עקבי יותר. ההצלחה לא נבעה מתקציב."},{"q":"איפה, לפי המאמר, כבר הוכחה יעילות השיטה?","a":"במגוון רחב של מסגרות","w":["רק בבתי חולים לחולי נפש","רק בבתי ספר רגילים ובכיתות","עדיין לא הוכחה באף מסגרת"],"e":"לפי המאמר, היעילות של כלכלת אסימונים כבר הוכחה במגוון רחב של מסגרות, לא רק בבתי חולים."}]},
"q3":{"t":"t1","v":[{"q":"תלמיד מקבל אסימון מהמורה על ישיבה במקום, אבל חבריו צוחקים איתו כשהוא מסתובב. מה הבעיה שהמחקר מתאר?","a":"בבית ספר פועלים חיזוקים שהמטפל לא שולט בהם","w":["האסימון לא מספיק גדול","המורה לא עקבית בחלוקה","התלמיד לא מבין את השיטה"],"e":"בבית ספר פועלים חיזוקים שהמטפל לא שולט בהם, כמו צחוק של חברים. לכן הניסוי התמקד בהתנהגויות של בית הספר. הבעיה אינה גודל האסימון."},{"q":"איזה סוג חיזוק הוא רוב החיזוקים שלנו ביומיום?","a":"חיזוקים חברתיים","w":["חיזוקים מוחשיים","חיזוקים כספיים","חיזוקים ביולוגיים"],"e":"רוב החיזוקים שלנו ביומיום הם חברתיים: הערכה, אהבה, דחייה וכעס. חיזוקים מוחשיים, כמו פרסים, פחות שכיחים."}]},
"q4":{"t":"t1","v":[{"q":"למה חיזוקים חברתיים טבעיים פחות יעילים לעיצוב התנהגות?","a":"הם לא עקביים, מאוחרים ורגשיים","w":["הם לא חשובים לילדים בגיל הזה","הם יקרים מדי עבור בית הספר","הם תמיד שליליים ומענישים"],"e":"חיזוקים חברתיים טבעיים לא עקביים, מגיעים באיחור ומושפעים מרגש, ולכן הם פחות יעילים לעיצוב התנהגות. לכן צריך לעבור אליהם בהדרגה. הם לא תמיד שליליים."},{"q":"מה צריך לעשות כדי ששינוי בהתנהגות יחזיק גם אחרי הניסוי?","a":"להתאים בהדרגה את החיזוקים לאלה של היום־יום","w":["להגדיל את הפרסים המוחשיים בכל שבוע","להוסיף עונשים לצד הפרסים בכיתה","להפסיק את כל הפרסים בבת אחת"],"e":"כדי שהשינוי יחזיק גם אחרי הניסוי, צריך להתאים בהדרגה את החיזוקים לאלה של היום־יום, כלומר לעבור לחיזוקים חברתיים. הפסקה בבת אחת עלולה להחזיר את ההתנהגות."}]},
"q5":{"t":"t1","v":[{"q":"איזו מהבאות אינה מטרה של המחקר?","a":"להשוות בין שיטות ענישה","w":["להראות שהשיטה יעילה בבית ספר","להדגיש את המעבר לחיזוקים חברתיים","להראות שצוות לא מומחה יכול להפעיל אותה"],"e":"המחקר אסר על עונשים, ולכן לא השווה בין שיטות ענישה. מטרותיו היו להראות שהשיטה יעילה בבית ספר, לעבור לחיזוקים חברתיים, ולהראות שגם צוות לא מומחה יכול להפעיל אותה."},{"q":"למה חשוב שצוות לא מומחה יוכל להפעיל את השיטה?","a":"כי כך אפשר ליישם אותה בבתי ספר רבים","w":["כי מומחים יקרים ואינם יעילים","כי מומחים פוגעים בתוצאות","כי התלמידים מעדיפים מורים"],"e":"אם צוות לא מומחה, כמו מורים, יכול להפעיל את השיטה, אפשר ליישם אותה בבתי ספר רבים. זה הופך אותה למעשית. זה לא אומר שמומחים פוגעים בתוצאות."}]},
"q6":{"t":"t1","v":[{"q":"מורה מחמיאה לתלמיד כל פעם שהוא מצביע, והוא מצביע יותר. מה המחמאה?","a":"חיזוק","w":["עונש","אסימון","הכחדה"],"e":"המחמאה מגבירה את הסיכוי שהתלמיד יצביע שוב, ולכן היא חיזוק. אסימון הוא סוג מסוים של חיזוק שאפשר לצבור ולפדות, ומחמאה אינה כזו."},{"q":"באילו התנהגויות התמקד הניסוי?","a":"התנהגויות בבית הספר","w":["התנהגויות בבית ובמשפחה","קשיים רגשיים פנימיים של הילד","התנהגויות בשכונה ובחוגים"],"e":"הניסוי התמקד בהתנהגויות בבית הספר, כי שם המטפל שולט בחיזוקים. בבית ובשכונה פועלים חיזוקים שלא בשליטתו."}]},
"q7":{"t":"t2","v":[{"q":"למה במחקר הזה אין קבוצת ביקורת נפרדת?","a":"כי כל תלמיד מושווה לעצמו בשלבים שונים","w":["כי לא היה מספיק תלמידים בבית הספר","כי הורים לא הסכימו לקבוצת ביקורת","כי קבוצת ביקורת לא חוקית בבית ספר"],"e":"כל תלמיד מושווה לעצמו בשלבים שונים (לפני, בזמן ואחרי הטיפול), ולכן הוא גם הניסוי וגם הביקורת. זה מערך של נבדק יחיד, ולא היה צורך בקבוצת ביקורת נפרדת."},{"q":"מה מציג המדד A1?","a":"שכיחות ההתנהגויות לפני הניסוי","w":["שכיחות ההתנהגויות בסוף הניסוי","שכיחות ההתנהגויות בהפסקה","שכיחות ההתנהגויות בשלב החברתי"],"e":"A1 הוא קו הבסיס: שכיחות ההתנהגויות לפני תחילת הניסוי. A2 הוא שלב ההפסקה באמצע."}]},
"q8":{"t":"t2","v":[{"q":"אם בשלב A2 ההתנהגות החריגה חוזרת, מה זה מוכיח?","a":"שהטיפול גרם לשיפור","w":["שהטיפול נכשל לגמרי","שהתלמידים התעייפו מהשיטה","שהמורה החליפה את השיטה"],"e":"לפי היגיון מערך ההיפוך, אם ההתנהגות חוזרת כשמפסיקים את הטיפול, הטיפול הוא שגרם לשיפור. זה לא אומר שהטיפול נכשל, אלא דווקא שהוא עבד."},{"q":"מה ההבדל בין B1 ל-B2?","a":"B1: חיזוקים מוחשיים. B2: חיזוקים חברתיים","w":["B1: חברתיים. B2: מוחשיים","B1: עונשים. B2: חיזוקים","אין הבדל, אלה שתי מדידות של אותו שלב"],"e":"בשלב B1 ניתנו חיזוקים מוחשיים (אסימונים ופרסים), ובשלב B2 חיזוקים חברתיים (מעמד והערכה). B2 קרוב יותר לחיי היום־יום."}]},
"q9":{"t":"t2","v":[{"q":"למה נבחרה דווקא כיתת הקליטה הראשונה בבית הספר?","a":"כי היא אחת הכיתות הבעייתיות ביותר","w":["כי היא הכיתה הקטנה ביותר בבית הספר","כי התלמידים בה הצטיינו בלימודים","כי המורה בה הייתה מומחית בטיפול"],"e":"כיתת הקליטה הראשונה הייתה אחת הכיתות הבעייתיות ביותר, ולכן הצורך בה היה הגדול ביותר. התלמידים בה לא הצטיינו בלימודים."},{"q":"על כמה תלמידים מדווחות התוצאות?","a":"על 6 שהשתתפו לאורך כל הניסוי","w":["על כל 9 התלמידים בכיתה","על 3 התלמידים שהצטרפו מאוחר","על כל תלמידי בית הספר"],"e":"התוצאות מדווחות על 6 תלמידים שהשתתפו לאורך כל הניסוי. 3 תלמידים הצטרפו מאוחר, ולכן לא נכללו."}]},
"q10":{"t":"t2","v":[{"q":"מה מעיד על כך שהקשיים של התלמידים לא נובעים מיכולת?","a":"המשכל שלהם תקין","w":["הם לומדים בכיתות קטנות","הם בגילאי 9 עד 11","הם לומדים בבית ספר מיוחד"],"e":"המשכל של התלמידים תקין, ובכל זאת רמת הלימודים נמוכה. לכן הקשיים לא נובעים מיכולת. הגיל או גודל הכיתה לא מעידים על כך."},{"q":"מה גודל הכיתות בבית הספר?","a":"6 עד 9 תלמידים","w":["20 עד 25 תלמידים","2 עד 3 תלמידים","30 תלמידים ויותר"],"e":"בבית הספר יש 6 עד 9 תלמידים בכיתה, עם יחס אישי. כיתות של 20 ומעלה הן כיתות רגילות."}]},
"q11":{"t":"t2","v":[{"q":"למה הצופים הודרכו להתעלם מפניות התלמידים?","a":"כדי שנוכחותם לא תשפיע על ההתנהגות","w":["כדי שהתלמידים יכבדו אותם","כדי לבדוק את סבלנות התלמידים","כי אסור לדבר עם תלמידים"],"e":"הצופים התעלמו מפניות התלמידים כדי שהנוכחות שלהם לא תשפיע על ההתנהגות. כך התלמידים התרגלו אליהם מהר, והתצפית שיקפה התנהגות טבעית."},{"q":"מי ערך את התצפיות בקו הבסיס?","a":"שלושה סטודנטים","w":["המורה של הכיתה","מנהל בית הספר","ההורים של התלמידים"],"e":"את התצפיות בקו הבסיס ערכו שלושה סטודנטים, 4 שעות ביום במשך שבועיים. המורה לא ערכה אותן."}]},
"q12":{"t":"t2","v":[{"q":"בשיעור הראשון הכיתה שקטה, ובשיעור הרביעי יש הרבה הפרעות. מה זה מלמד?","a":"ההתנהגויות החריגות מצטברות לאורך היום","w":["השיעור הרביעי קשה יותר מהראשון","המורה עייפה יותר בשיעור הרביעי","התלמידים רעבים יותר בשעות הבוקר"],"e":"מספר ההפרעות עולה לאורך היום, ולכן ההתנהגויות החריגות מצטברות. זה ממצא מקו הבסיס. אין ראיה שהשיעור הרביעי קשה יותר."},{"q":"אילו שלוש התנהגויות נבחרו לעיצוב?","a":"איחורים, הסתובבות ודיבור בלי הצבעה","w":["אלימות, קללות ושקרים","העתקה, איחורים והיעדרויות","שיעורי בית, ציונים ונוכחות"],"e":"נבחרו שלוש התנהגויות שקשורות לבית הספר: איחורים, הסתובבות בכיתה ודיבור בלי הצבעה. אלימות ושקרים לא נכללו."}]},
"q13":{"t":"t3","v":[{"q":"למה השיטה הוצגה לתלמידים כמשחק?","a":"כדי שיבינו אותה ויתעניינו בה","w":["כדי להסתיר שזה מחקר","כי זה מה שההורים ביקשו","כדי שהמורה לא תצטרך להסביר"],"e":"השיטה הוצגה כמשחק, עם הסבר על ה״מחיר״ של כל התנהגות, כדי שהתלמידים יבינו אותה ויתעניינו בה. לא ניסו להסתיר שזה מחקר."},{"q":"איך נבחרו הפרסים?","a":"כל תלמיד דירג אילו פרסים הוא מעדיף","w":["המורה בחרה לפי שיקול דעתה","ההורים בחרו את כל הפרסים","החוקרים קבעו פרסים אחידים לכולם"],"e":"כל תלמיד דירג אילו פרסים הוא מעדיף (ראשון, שני ושלישי), כדי שהפרסים יהיו באמת מחזקים עבורו. החוקרים לא קבעו פרסים אחידים."}]},
"q14":{"t":"t3","v":[{"q":"למה המורה התבקשה לא לקחת אסימונים כעונש?","a":"כדי שהשיטה תתבסס רק על חיזוק חיובי","w":["כי התלמידים לא היו מבינים","כי זה לא היה מעניין את החוקרים","כי האסימונים היו יקרים"],"e":"המורה לא לקחה אסימונים כעונש, כדי שהשיטה תתבסס רק על חיזוק חיובי, בלי עונשים בכלל. הסיבה לא הייתה עלות האסימונים."},{"q":"איזה מהבאים היה פרס שבועי?","a":"צבעים","w":["קרמבו","סוכריות","עיפרון"],"e":"צבעים היו פרס שבועי, גדול יותר. קרמבו, סוכריות ועיפרון היו פרסים יומיים."}]},
"q15":{"t":"t3","v":[{"q":"למה הפרסים הוחלפו כל שבועיים?","a":"כדי למנוע רוויה","w":["כי נגמר התקציב","כי התלמידים ביקשו","כדי לבדוק אפקט היפוך"],"e":"פרס שחוזר שוב ושוב מאבד מכוחו, וזו רוויה. לכן הפרסים הוחלפו כל שבועיים. זה לא קשור לאפקט היפוך."},{"q":"למה ניתן אסימון גם לילדים שלא הגיעו לכך?","a":"כדי לעודד ולהגביר את מעורבותם","w":["כדי שלא יהיו פערים בכיתה","כי המורה טעתה בספירה","כדי להעניש את המצטיינים"],"e":"התלמידים היו ״שבעי כישלונות״, ולכן נתנו אסימון גם למי שעוד לא הגיע לקריטריון, כדי לתת הצלחה ראשונה ולהגביר מעורבות. זה לא נועד להעניש את המצטיינים."}]},
"q16":{"t":"t3","v":[{"q":"מה המורה הוסיפה לכל פרס, ולמה זה חשוב לשלב הבא?","a":"גמול מילולי, שמכין את המעבר לחיזוק חברתי","w":["עונש קטן, כדי לאזן את הפרס","מכתב קצר להורים, כדי ליידע","הסבר טכני, כדי להבהיר את הכללים"],"e":"המורה הוסיפה לכל פרס מילה טובה, שהיא חיזוק חברתי. כך היא הכינה את המעבר לשלב החברתי, כשהפרסים המוחשיים יוסרו. זה לא היה עונש קטן."},{"q":"כמה זמן נמשך שלב החיזוקים המוחשיים?","a":"5 שבועות","w":["יומיים","שבוע אחד","4 חודשים"],"e":"שלב החיזוקים המוחשיים (B1) נמשך 5 שבועות, לפני ההפסקה."}]},
"q17":{"t":"t3","v":[{"q":"למה בזמן ההפסקה הוסרו גם האסימונים וגם לוח ההישגים?","a":"כדי שלא ייראה שהשיטה עדיין פועלת","w":["כדי לחסוך מקום על קירות הכיתה","כי הם התקלקלו במהלך השבועות","כדי להעניש את התלמידים על הפרעות"],"e":"בזמן ההפסקה הוסרו גם האסימונים וגם לוח ההישגים, כדי שלא ייראה שהשיטה עדיין פועלת. כך ההפסקה ״נקייה״, ואפשר לבדוק מה קורה בלי הטיפול."},{"q":"כמה זמן נמשכה הפסקת החיזוקים?","a":"יומיים","w":["שבועיים","חודש","יום אחד"],"e":"הפסקת החיזוקים (A2) נמשכה יומיים, מספיק כדי לראות שינוי בהתנהגות."}]},
"q18":{"t":"t3","v":[{"q":"מה ההיגיון של הפסקת הטיפול באמצע הניסוי?","a":"אם ההתנהגות חוזרת, הטיפול הוא שגרם לשינוי","w":["לתת לתלמידים מנוחה מהשיטה","לחסוך כסף שהיה מיועד לפרסים","לבדוק אם המורה עקבית בחלוקה"],"e":"זה ההיגיון של מערך ההיפוך: אם ההתנהגות חוזרת כשמפסיקים את הטיפול, הטיפול הוא שגרם לשינוי. ההפסקה לא נועדה לתת לתלמידים מנוחה."},{"q":"מה המורה כן המשיכה לעשות בזמן ההפסקה?","a":"להזכיר מה ההתנהגויות הרצויות","w":["לתת אסימונים בסתר","להעניש על הפרעות","לתת פרסים מילוליים בלבד"],"e":"בזמן ההפסקה המורה המשיכה רק להזכיר מה ההתנהגויות הרצויות, בלי לתת שום חיזוק. היא לא נתנה אסימונים בסתר."}]},
"q19":{"t":"t4","v":[{"q":"בשבועות 9–12 התלמידים בחרו בין קרמבו לבין תפקיד אחראי. מה מטרת הבחירה הזו?","a":"להתחיל מעבר הדרגתי לחיזוק חברתי","w":["לבדוק מה התלמידים אוהבים לאכול","להגדיל את התקציב לפרסים","להעניש מי שבוחר בקרמבו"],"e":"הבחירה בין קרמבו (מוחשי) לתפקיד אחראי (חברתי) היא צעד ראשון במעבר ההדרגתי לחיזוק חברתי. היא לא נועדה להעניש את מי שבוחר בקרמבו."},{"q":"מה השתנה בזמן קבלת הפרס בשבועות 9 עד 12?","a":"הפרס ניתן כל יומיים במקום כל יום","w":["הפרס ניתן פעם בחודש","הפרס ניתן מיד אחרי כל התנהגות","הפרס בוטל לגמרי"],"e":"בשבועות 9 עד 12 הפרס ניתן כל יומיים במקום כל יום. זו הגדלה הדרגתית של פער הזמן בין ההתנהגות לפרס."}]},
"q20":{"t":"t4","v":[{"q":"״אחראי על פינת החי״ הוא דוגמה לחיזוק:","a":"חברתי, שמקנה מעמד","w":["מוחשי, שאפשר לאכול","שלילי, שמפחית התנהגות","בלתי תלוי בהתנהגות"],"e":"תפקיד אחראי על פינת החי מקנה מעמד מכובד בכיתה, ולכן הוא חיזוק חברתי. הוא לא מוחשי, כי אי אפשר לאכול או לקחת אותו."},{"q":"מה ההבדל בין קרמבו לאחריות על כדורי הספורט?","a":"קרמבו מוחשי, אחריות היא חיזוק חברתי","w":["שניהם חיזוקים מוחשיים מאותו סוג","קרמבו חברתי, אחריות היא חיזוק מוחשי","שניהם עונשים על התנהגות לא רצויה"],"e":"קרמבו הוא חיזוק מוחשי, ואחריות על כדורי הספורט היא חיזוק חברתי שמקנה מעמד. השלב השני מנצל את ההבדל הזה."}]},
"q21":{"t":"t4","v":[{"q":"מה החליף את האסימונים מהשבוע ה-13?","a":"הערכה יומית של המורה על לוח","w":["פרסים מוחשיים גדולים יותר","עונשים על הפרעות","מבחן שבועי בכתב"],"e":"מהשבוע ה-13 את האסימונים החליפה הערכה יומית של המורה על לוח, מ״מעט טוב״ עד ״טוב מאוד״. עונשים לא נוספו."},{"q":"מה היו הפרסים השבועיים בשלב החברתי?","a":"מכתב להורים וישיבת צוות","w":["קופסת צבעים ועט","קרמבו וסוכריות","טיול ויום חופש"],"e":"בשלב החברתי הפרסים השבועיים היו מכתב להורים וישיבת צוות, ושניהם חיזוקים חברתיים. קרמבו וסוכריות שייכים לשלב המוחשי."}]},
"q22":{"t":"t4","v":[{"q":"בשבוע ה-16 כל תלמידי הכיתה השתתפו בישיבת הצוות. מה זה מסמן?","a":"שכל הכיתה הגיעה להתנהגות שמזכה במעמד","w":["שהישיבה הפכה לעונש קבוצתי","שהמורה ויתרה על כל הקריטריונים","שהתלמידים דרשו בתוקף להשתתף"],"e":"בשבועות הקודמים רק 2 עד 3 מצטיינים השתתפו בישיבת הצוות. בשבוע ה-16 כל הכיתה השתתפה, כלומר כולם הגיעו להתנהגות שמזכה במעמד. המורה לא ויתרה על הקריטריונים."},{"q":"מי חתם על מכתב השבח להורים?","a":"המנהל והמחנכת","w":["החוקרים","ההורים עצמם","התלמידים"],"e":"המנהל והמחנכת חתמו על מכתב השבח להורים, וחתימה כזו מעניקה לו משקל. החוקרים לא חתמו עליו."}]},
"q23":{"t":"t4","v":[{"q":"מה נחשב לשינוי החשוב ביותר בשבועות 13 עד 16?","a":"מהות הפרס: מעמד והערכה דרך הישיבות","w":["הגדלת מספר הפרסים לכל תלמיד","קיצור הזמן בין התנהגות לבין פרס","הוספת עונשים לשיטה הקיימת"],"e":"השינוי החשוב ביותר היה במהות הפרס: מעמד והערכה דרך ישיבות הצוות, כלומר חיזוק חברתי במלואו. לא קיצרו את הזמן עד הפרס, אלא האריכו אותו."},{"q":"מה דורש פרס שניתן רק פעם בשבוע?","a":"יכולת לדחות סיפוק","w":["זיכרון חזק במיוחד","תקציב גדול יותר","מורה מומחית בטיפול"],"e":"פרס שניתן רק פעם בשבוע דורש יכולת לדחות סיפוק, וזה קרוב לחיי היום־יום, שבהם חיזוקים לא מגיעים מיד."}]},
"q24":{"t":"t4","v":[{"q":"למה ההערכה בשלב החברתי ״סובייקטיבית״?","a":"כי המורה העריכה בסוף היום, בלי קשר ישיר","w":["כי התלמידים העריכו את עצמם","כי ההורים העריכו","כי לא נשמר תיעוד"],"e":"בשלב החברתי המורה העריכה בסוף היום, בלי קשר ישיר לכל התנהגות, ולכן ההערכה סובייקטיבית, כמו בחיים האמיתיים. התלמידים לא העריכו את עצמם."},{"q":"מה המטרה של שלושת השינויים בשלב האחרון?","a":"לקרב את החיזוקים לחיים","w":["להגדיל את הפרסים לתלמידים","להקטין את מעורבות המורה","לחסוך כסף לבית הספר"],"e":"שלושת השינויים בשלב האחרון, הערכה סובייקטיבית, פער זמן ומעמד, נועדו לקרב את החיזוקים לחיי היום־יום. המטרה לא הייתה לחסוך כסף."}]},
"q25":{"t":"t5","v":[{"q":"בין אילו שלבים נמצאה הירידה הברורה ביותר?","a":"בין A1 ל-B1","w":["בין B1 ל-A2","בין A2 ל-B2","בין A1 ל-A2"],"e":"הירידה הברורה ביותר הייתה בין קו הבסיס (A1) לשלב החיזוקים המוחשיים (B1), והיא הייתה מובהקת בכל שלוש ההתנהגויות."},{"q":"מה קרה בזמן ההפסקה (A2)?","a":"עלייה, אבל לא חזרה לרמה שלפני הניסוי","w":["ירידה נוספת בהתנהגויות","חזרה מלאה לרמת קו הבסיס","לא היה שום שינוי בהתנהגויות"],"e":"בזמן ההפסקה הייתה עלייה בהתנהגויות, אבל הן לא חזרו לרמה שלפני הניסוי. העלייה הייתה מובהקת בשתי התנהגויות."}]},
"q26":{"t":"t5","v":[{"q":"מה קרה בשלב החיזוקים החברתיים (B2)?","a":"ירידה מתונה אך מובהקת","w":["עלייה חדה בהתנהגויות","ירידה גדולה יותר מ-B1","לא היה שינוי"],"e":"בשלב החיזוקים החברתיים הייתה ירידה מתונה אך מובהקת בשלוש ההתנהגויות. היא הייתה קטנה יותר מהירידה בשלב המוחשי."},{"q":"איזו התנהגות ירדה הכי פחות בשלב החברתי?","a":"דיבור בלי הצבעה","w":["איחורים","הסתובבות בכיתה","שתיהן ירדו באותה מידה"],"e":"דיבור בלי הצבעה ירד הכי פחות בשלב החברתי. הירידה בו הייתה המתונה ביותר מבין שלוש ההתנהגויות."}]},
"q33":{"t":"t5","v":[{"q":"ההתנהגויות עלו בהפסקה, אבל לא חזרו לגמרי לרמה ההתחלתית. מה זה מרמז?","a":"שחלק מהשינוי כבר החזיק","w":["שהשיטה לא השפיעה בכלל","שההפסקה הייתה ארוכה מדי","שהמדידה לא הייתה מהימנה"],"e":"העלייה בהפסקה מראה שהטיפול גרם לשינוי, אבל העובדה שההתנהגויות לא חזרו לגמרי לרמת ההתחלה מרמזת שחלק מהשינוי כבר החזיק גם בלי חיזוק. זה לא אומר שהשיטה לא השפיעה."},{"q":"מה המשמעות של העלייה בהתנהגויות בזמן ההפסקה?","a":"שהטיפול הוא שגרם לירידה","w":["שהתלמידים התעייפו מהשיטה","שהמורה החליפה סגנון","שהפרסים היו לא מתאימים"],"e":"לפי היגיון מערך ההיפוך, אם ההתנהגויות עולות כשמפסיקים את הטיפול, הטיפול הוא שגרם לירידה בהן. זה לא סימן לעייפות מהשיטה."}]},
"q34":{"t":"t5","v":[{"q":"למה הירידה בשלב B2 מתונה יותר מבשלב B1?","a":"כי חיזוקים חברתיים פחות ישירים ומיידיים","w":["כי התלמידים כבר לא אהבו את השיטה","כי המורה הפסיקה להזכיר","כי השלב היה קצר יותר"],"e":"חיזוקים חברתיים פחות ישירים ומיידיים מחיזוקים מוחשיים, ולכן הירידה בשלב B2 מתונה יותר. זה ״המחיר״ של חיזוק טבעי. התלמידים לא הפסיקו לאהוב את השיטה."},{"q":"מה אפשר להסיק מהשוואת השלבים B1 ו-B2?","a":"שגם חיזוק חברתי יעיל, אם כי פחות ממוחשי","w":["שחיזוק חברתי לא יעיל בכלל בבית ספר","שחיזוק חברתי יעיל יותר מחיזוק מוחשי","שאין הבדל בין שני סוגי החיזוק"],"e":"גם בשלב החברתי הייתה ירידה מובהקת, ולכן חיזוק חברתי יעיל, אבל הירידה הייתה מתונה יותר, כלומר פחות מחיזוק מוחשי. הוא לא יעיל יותר."}]},

"q28":{"t":"t6","v":[{"q":"למה ההזמנה לישיבות לא הייתה אפשרית מהיום הראשון?","a":"כי קודם היה צריך להכחיד חלק מההתנהגויות","w":["כי הנהלת בית הספר סירבה בתחילה","כי התלמידים לא רצו להשתתף בהן","כי הישיבות התחילו רק בשנה הבאה"],"e":"קודם היה צריך להכחיד חלק מההתנהגויות החריגות, ורק אחרי שיש בסיס אפשר לשתף את התלמידים בהחלטות. הסיבה לא הייתה סירוב של ההנהלה."},{"q":"איך הגיבו ההורים למכתבי ההצטיינות?","a":"בחיוב רב","w":["באדישות","בחשדנות","בכעס"],"e":"ההורים הגיבו למכתבי ההצטיינות בחיוב רב, כי המכתבים פתחו תקווה לשיפור אצל ילדיהם."}]},

"q31":{"t":"t6","v":[{"q":"חודשיים אחרי סיום התכנית, תלמידים ביקשו לחדש את הישיבות והמכתבים, ולא את הקרמבו. מה זה מלמד?","a":"החיזוקים החברתיים היו משמעותיים יותר עבורם","w":["שהם שכחו את הפרסים המוחשיים","שהקרמבו לא היה טעים מספיק","שהם רצו בעיקר לרצות את המורה"],"e":"התלמידים ביקשו לחדש את הישיבות והמכתבים, ולא את הקרמבו. כלומר, החיזוקים החברתיים היו משמעותיים יותר עבורם. זו המסקנה המרכזית בדיון."},{"q":"מה קרה חודשיים אחרי סיום התכנית?","a":"תלמידים ביקשו ביוזמתם לחדש אותה","w":["כל ההתנהגויות החריגות חזרו","ההורים ביקשו להפסיק את התכנית","בית הספר ביטל את הכיתה כולה"],"e":"חודשיים אחרי סיום התכנית, אחרי חופשת הקיץ, תלמידים ביקשו ביוזמתם לחדש אותה. ההתנהגויות החריגות לא חזרו."}]},
"q32":{"t":"t6","v":[{"q":"מה המסקנה הכללית של המאמר?","a":"השיטה יעילה, גם במעבר לחברתי","w":["השיטה יעילה רק עם פרסים מוחשיים","השיטה לא מתאימה לבית ספר רגיל","חיזוק חברתי עדיף כבר מההתחלה"],"e":"המסקנה היא שהשיטה יעילה גם כשעוברים בהדרגה מחיזוקים מוחשיים לחברתיים, שקרובים יותר לחיי היום־יום. היא לא יעילה רק עם פרסים מוחשיים."},{"q":"איך כדאי לעבור מחיזוקים מוחשיים לחברתיים?","a":"בהדרגה, בכמה צעדים","w":["בבת אחת, ביום מסוים מראש","רק אחרי שנה שלמה של מוחשי","לפי בקשת ההורים בלבד"],"e":"כדאי לעבור מחיזוקים מוחשיים לחברתיים בהדרגה, בכמה צעדים, כמו במבנה השלב השני. מעבר בבת אחת עלול להחזיר את ההתנהגות."}]}};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
