.opt.wrong .k{background:var(--bad);color:var(--surface)}

.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}

.f-mut{fill:var(--muted)}

svg text{font-family:var(--body)}

.tile b,.who b{font-weight:700}

.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}

q5:{t:"t1",v:[

q6:{t:"t1",v:[

q7:{t:"t2",v:[

q8:{t:"t2",v:[

q9:{t:"t2",v:[

q10:{t:"t2",v:[

q11:{t:"t3",v:[

 {q:"מה הליקוי ב\"תאוריה של הנפש\" אצל ילדים עם אספרגר, לפי ג'ורדן ופאואל?",a:"קושי לנבא התנהגות של אחרים, לקרוא כוונות ולהסביר רגשות",w:["קושי בזיכרון לטווח ארוך","קושי בראייה","קושי בחשבון"],e:"זה גורם לפחד ולהימנעות מחברת אנשים."}]},
q12:{t:"t3",v:[
 {q:"מה הכוונה ב\"עצמי חווה\" (Jordan & Powell)?",a:"היכולת לחוות אירועים באופן סובייקטיבי ולזכור אותם, שקשה לאוטיסטים",w:["זיכרון של מספרים","היכולת לרוץ מהר","היכולת לדבר בשתי שפות"],e:"לכן צריך מבנה ברור והדגשה בלמידה."},

q13:{t:"t3",v:[
 {q:"מה עשו עם תמונות מעיתונים?",a:"שוחחו על הבעות ורגשות, ויצרו שיחה או תסריט על מה שקרה",w:["גזרו אותן לקולאז'","מכרו אותן","לא השתמשו בהן"],e:"כדי ללמוד את שפת הגוף של הזולת."},
 {q:"למה הציעו כמה סיומים שונים לסיפור?",a:"כדי לפתח גמישות מחשבתית",w:["כדי לבלבל אותו","כי שכחו את הסוף","כדי לקצר את המפגש"],e:"לפי אטווד, יש קושי בגמישות קוגניטיבית."}]},
q14:{t:"t3",v:[

q15:{t:"t3",v:[
 {q:"מה המשימה שת' קיבל בשלב מתקדם?",a:"להביא בעצמו נושא לכל מפגש",w:["לכתוב חיבור","לפתור תרגילים","לא לדבר"],e:"משימה שהתחילה כחובה והפכה למיומנות טבעית."},
 {q:"מה שימש \"גשר לקשר\" בטיפול?",a:"הכלבה של ת'",w:["מחשב","ספר","טלפון"],e:"דרכה למד להבחין בניואנסים של יצירת קשר."}]},
q16:{t:"t3",v:[
 {q:"למה סרטים הם כלי טוב לנוער בטיפול, לפי המאמר?",a:"כי צפייה בסרטים היא ממילא בילוי של נוער, ואפשר לכוון אותה למטרות טיפוליות",w:["כי סרטים מחליפים טיפול","כי נוער לא מדבר","כי אין כלים אחרים"],e:"מנתחים דמויות ומיישמים לחיים האישיים."},
 {q:"על מה שוחחו אחרי הסרט \"בעולם טוב יותר\"?",a:"על הדרך להתמודד עם אלימות: נקמה מול סלחנות",w:["על אפקטים מיוחדים","על השחקנים","על המוזיקה"],e:"וגם על המחיר של הבעת דעה שונה מהרוב."}]},
q17:{t:"t3",v:[
 {q:"איך עבדו על שפת הגוף הנוקשה בלי לפגוע בדימוי הגוף?",a:"בעזרת מראה: ת' תיאר מה הוא אוהב וזיהה בעצמו מה לשפר",w:["צילמו אותו בכיתה","ביקשו מחברים לבקר אותו","לא עבדו על זה"],e:"כי בגיל ההתבגרות דימוי הגוף רגיש מאוד."},
 {q:"מה הכוונה שת' היה \"יס־מן\"?",a:"הוא קיבל את דעת האחר ולא הביע את רצונו האמיתי",w:["הוא תמיד צדק","הוא אהב לעזור","הוא אמר לא לכל דבר"],e:"הוא למד להגיב באסרטיביות, כולל \"לא\" שאינו פוגע."}]},
q18:{t:"t3",v:[
 {q:"מה עשתה המטפלת כשנראה שת' מסכים להמשיך טיפול בקיץ רק כדי לא לפגוע בה?",a:"המלילה את רגשותיו ואפשרה לו לצאת לחופשה, בתנאי שבעתיד יביע את רצונו",w:["הכריחה אותו להמשיך","הפסיקה את הטיפול לגמרי","פנתה להורים בלבד"],e:"זו הזדמנות לתרגל הבעת רצון."},
 {q:"מה החשש שנשאר גם אחרי ההתקדמות?",a:"שת' ניתן לניצול",w:["שהוא יהיה אלים","שהוא יעזוב את הבית","שהוא ישכח הכל"],e:"אירוע כזה קרה בעבר וטופל מיד."}]},
q19:{t:"t4",v:[
 {q:"איזה תפקיד מילא האח של ת' לפני הטיפול?",a:"תפקיד הורי: גער בו וחינך אותו, אבל היה רחוק ממנו רגשית",w:["חבר קרוב","מטפל","לא היה לו קשר"],e:"מטרת הטיפול הייתה להחזיר לכל אחד את תפקידו."},
 {q:"מה הייתה מטרת הטיפול במשפחה?",a:"להחזיר לכל אחד את תפקידו: ההורים כהורים והאח כאח",w:["להוציא את ת' מהבית","לנתק את האח","להחליף את ההורים"],e:"כך האח יוכל להתחבר אל ת' כאח."}]},
q20:{t:"t4",v:[
 {q:"איזה כלי קיבל האח?",a:"איך לבטא ביקורת בונה: \"אני אומר לך כי אכפת לי ממך\"",w:["איך להעניש","איך להתעלם","איך לצעוק"],e:"וגם סימנים מוסכמים כמו \"אור אדום\"."},
 {q:"למה נוצרו סימנים מוסכמים כמו \"אור אדום\"?",a:"כדי לאותת על מצוקה, כך שהמציק יפסיק",w:["כדי לשחק","כדי לסמן ציונים","כדי לסמן זמן ארוחה"],e:"שיפר גם את הקרבה בין האחים."}]},
q21:{t:"t4",v:[
 {q:"איך הודרכו ההורים להתמודד עם הנוקשות של ת'?",a:"להציע לו אפשרויות בחירה במצבים משתנים",w:["לוותר תמיד","להעניש","להתעלם"],e:"למשל לגבי שעת השינה."},
 {q:"איך ההורים קידמו את העצמאות של ת'?",a:"בהדרגה נתנו לו תפקידים, כמו לענות לטלפון ולחכות בתור",w:["עשו הכל במקומו","שלחו אותו לגור לבד","לא שינו דבר"],e:"והבינו שטעויות קורות ולומדים מהן."}]},
q22:{t:"t4",v:[
 {q:"למה ההורים שינו את דעתם וקנו לת' טלפון סלולרי?",a:"כי הבינו שהוא כלי חשוב לתקשורת עם בני הגיל",w:["כי הוא היה זול","כי המורה חייבה","כי הוא איבד את הקודם"],e:"והטלפון אכן עזר לו."},
 {q:"מה עשה האב בנושא המיניות וההתבגרות?",a:"התגייס לשוחח עם ת' על בנות ועל חברויות בגיל ההתבגרות",w:["אסר לדבר על זה","שלח אותו לרופא","לא היה מעורב"],e:"ההורים הודרכו איך לדבר על הנושא."}]},
q23:{t:"t4",v:[
 {q:"מה הייתה הדילמה לגבי החבר עם הצרכים המיוחדים?",a:"לתמוך בחברות, או לחשוש ששניהם בשולי החברה וזה ימנע קשרים אחרים",w:["אם לספר להורים","אם לשלם לו","אם להעביר כיתה"],e:"החשש: שהחברות תעכב את ההתפתחות."},
 {q:"מה הייתה התוצאה של החברות?",a:"היא חיזקה את ת', והוא קיבל הזדמנות לעזור ולא רק להיעזר",w:["היא פגעה בו","היא נגמרה מיד","היא גרמה להצקות"],e:"בניגוד לחששות המטפלת."}]},
q24:{t:"t4",v:[
 {q:"מה מראה המקרה של החבר לגבי עבודה טיפולית?",a:"שכדאי לבחון בפועל ולא להחליט רק לפי חשש מוקדם",w:["שתמיד צריך למנוע חברויות","שהמטפל תמיד צודק","שחברויות לא חשובות"],e:"המעקב הראה שהקשר תרם."},
 {q:"מה דיווחו ההורים על הקשרים החברתיים של ת' לאורך הטיפול?",a:"מגמת שיפור במספר הקשרים ובאיכותם",w:["ירידה","שום שינוי","הוא הפסיק להיפגש עם אנשים"],e:"זה אחד ממדדי ההערכה."}]},
q25:{t:"t5",v:[
 {q:"למי נאמר המינוח \"אספרגר\" בשלב הראשון?",a:"להורים, למחנכת וליועצת. לאח ולכיתה הסבירו רק על הקשיים",w:["לכל הכיתה","לת' עצמו מיד","לאף אחד"],e:"ההסברים יצרו אמפתיה ורצון לעזור."},
 {q:"מה התגלה כשהמטפלת ניגשה לספר לת' על האבחנה?",a:"הוא כבר שמע את המונח, חיפש באינטרנט והבין שהמצב בר שיפור",w:["הוא נבהל מאוד","הוא לא הבין","הוא כעס על ההורים"],e:"\"ואולי יפה שעה אחת קודם\"."}]},
q26:{t:"t5",v:[
 {q:"מה הלקח של המטפלת מהשיחה על האבחנה?",a:"חשוב לבדוק מוקדם את הבנת המטופל ולשתף אותו במינוח",w:["אף פעם לא לספר","לספר רק אחרי הצבא","לתת להורים להחליט לבד"],e:"תוך התחשבות בגיל ובבשלות."},
 {q:"מתי בפועל דובר עם ת' על האבחנה?",a:"לקראת המיון לצה\"ל",w:["בגיל הגן","ביום הראשון של הטיפול","לעולם לא"],e:"כי היה צריך לשלוח מסמכים רפואיים לצבא."}]},
q27:{t:"t5",v:[
 {q:"איך ת' התקבל למגמת מחשבים?",a:"המטפלת פנתה ליועצת, והציון במתמטיקה הועלה בזכות תפקודו המצוין",w:["הוא עבר מבחן מיוחד","ההורים שילמו","הוא לא התקבל"],e:"וקיבל תעודת הצטיינות כבר במחצית הראשונה."},
 {q:"מה היה קשה לת' להבין לגבי הקבלה למגמה?",a:"את \"התחום האפור\", שהתקבל באופן שונה מהמקובל",w:["את החומר במחשבים","את המורים","את המתמטיקה"],e:"זה מאפיין של אספרגר שאולי ניתן רק לצמצום."}]},
q28:{t:"t5",v:[
 {q:"מה מציין אטווד לגבי מעברים?",a:"שינויים בשגרה עלולים לגרום מצוקה חריפה, ולכן צריך הכנה",w:["שמעברים קלים לאנשים עם אספרגר","שאין צורך בהכנה","שצריך לשנות כל יום"],e:"לכן היו שיחות הכנה ותרגול."},
 {q:"איפה עבד ת' בחופש הגדול?",a:"חודש במפעל של קרוב משפחה, בסביבה תומכת",w:["בצבא","בחנות מחשבים","בבית ספר"],e:"חוויה חיובית והמשכורת הראשונה שלו."}]},
q29:{t:"t5",v:[
 {q:"למה המטפלת חשבה שחשוב שת' יתגייס?",a:"פטור על רקע פסיכיאטרי עלול להיות מכשול בהמשך, והצבא הוא מסגרת מובנית לצבירת ניסיון",w:["כי ההורים רצו","כי זה חובה לכולם בלי יוצא מן הכלל","כי הוא רצה להיות טייס"],e:"היא גם מודעת לכך שהאמונות שלה השפיעו."},
 {q:"מה היה בסוף עם הגיוס?",a:"ת' גויס, אבל לא לתפקידים קרביים שדורשים נשק",w:["הוא קיבל פטור","הוא נעשה קצין קרבי","הוא סירב"],e:"הבשורה שימחה את כל המעורבים."}]},
q30:{t:"t5",v:[
 {q:"איך הכינו את ת' לראיונות בתהליך הגיוס?",a:"במשחקי תפקידים: מתגייס ומראיין",w:["בהרצאות","בלי הכנה","בעזרת סרטון בלבד"],e:"בסוף נראה נינוח ורגוע."},
 {q:"איזו שאלה המאמר מעלה לגבי המטפלת?",a:"איך האמונות והדעות האישיות של המטפלת משפיעות על הטיפול",w:["כמה היא מרוויחה","איפה היא גרה","כמה מטופלים יש לה"],e:"כמו האמונה בחשיבות התרומה למדינה."}]},
q31:{t:"t6",v:[
 {q:"איזה מהבאים לא נמנה בגורמים שסייעו לטיפול?",a:"טיפול תרופתי",w:["אבחנה בדרגה קלה","שיתוף פעולה של ההורים","שיתוף פעולה עם הצוות החינוכי"],e:"וגם הגיוס מהמפגש הראשון והמשולש הטיפולי."},
 {q:"מהו \"המשולש הטיפולי\" במאמר?",a:"מטופל, מטפלת והורים",w:["מורה, יועצת ומנהל","אח, אחות והורים","רופא, אחות ופסיכולוג"],e:"קשר טוב ביניהם עזר להצלחה."}]},
q32:{t:"t6",v:[
 {q:"מה מאפיין את סגנון הטיפול שתואר?",a:"למידה בעזרת מה שבחדר ובסביבה, ושימוש בתכנים שהמטופל הביא \"כאן ועכשיו\"",w:["טיפול לפי ספר קבוע בלבד","טיפול רק בשיחה על העבר","טיפול בלי קשר לחיים"],e:"מראה, חיית מחמד וסרטים."},
 {q:"איזה סימן להתקדמות הופיע כבר בשנה השנייה?",a:"חיוך והבעות פנים מגוונות, וצחוק והומור במפגשים",w:["ציונים גבוהים","גיוס לצבא","מעבר דירה"],e:"זה אחד ממדדי ההערכה."}]},
q33:{t:"t6",v:[
 {q:"מה הראו מבחני ההבנה החברתית ושיפוט המציאות?",a:"שיפור מתפקוד נמוך מהממוצע לתפקוד בתחום הממוצע",w:["ירידה","שום שינוי","מעבר לתפקוד מעולה"],e:"בהשוואה בין תחילת הטיפול לסופו."},
 {q:"איזה מהבאים הוא מדד להערכת הטיפול במאמר?",a:"ת' הגיע ברצון ובעקביות לאורך ארבע שנים",w:["ת' קיבל פרס ארצי","ת' עבר לגור לבד","ת' הפסיק ללמוד"],e:"וגם דיווחים חיוביים מבית הספר ומההורים."}]},
q34:{t:"t6",v:[
 {q:"מה מראה תיאור המקרה על תפקיד המטפל במעברים בחיים?",a:"שיש צורך בהתערבות, הסברה והכוונה של המטפל במעברים",w:["שהמטפל לא צריך להתערב","שרק ההורים מטפלים במעברים","שמעברים לא חשובים"],e:"כמו בחירת מגמה בתיכון או הגיוס."},
 {q:"מה העיקרון שעולה מבחירת המטרה הראשונה?",a:"לגייס את המטופל דרך בעיה דחופה שפתרונה מביא רווחה מורגשת, תוך שימוש בנקודות החוזק שלו",w:["להתחיל מהבעיה הכי עמוקה","להתעלם מהכיתה","להתחיל בתרופות"],e:"כך נבנה שיתוף הפעולה."}]}
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  if(blk.q)slot.appendChild(qCard(blk.q,next,"בדיקה קצרה"));
  else{const b=document.createElement("button");b.className="primary";b.textContent="המשך";b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
