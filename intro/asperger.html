<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: אספרגר - הפרעת קשר ותקשורת: תיאור מקרה בטיפול פסיכולוגי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"id",title:"ת': הרקע והאבחון",blocks:[
  {h:"על מה המאמר",html:`${def("על מה הנושא",`המאמר מתאר טיפול ארוך בנער עם תסמונת אספרגר. הנושא מכיר לנו את ת' ואת הרקע שלו.<br><b>מה נלמד כאן:</b> על מה המאמר · הפגישה הראשונה · האבחנה`)}<p>תיאור מקרה של <b>טיפול פסיכולוגי פרטני</b> שנמשך יותר מארבע שנים, עם מתבגר שאובחן כבר בגיל הגן כבעל <mark>תסמונת אספרגר</mark> ${E("Asperger")}. בטיפול שולבו <b>באופן אקלקטי</b> טכניקות מגוונות, תוך התייחסות לא רק למטופל אלא גם למשפחתו ולמערכת החינוך.</p>${rem("מה הפך את התהליך ליעיל: <b>המוטיבציה הגבוהה</b> של המטופל להצליח, האהבה והעזרה של המשפחה, והקשר הטוב שנוצר בין המטפלת, המטופל ובני משפחתו.")}`,q:"q1"},
  {h:"הפגישה הראשונה",html:`<p>ת' הגיע בגיל <b>12</b> עם הוריו ל<b>אבחון פסיכו־דידקטי</b> בגלל קשיים חברתיים, בהמלצת בית הספר. התמונה: נער בודד ודחוי, נתון ללעג ולהצקות. בפגישה ישב <b>נוקשה וזקוף</b> וענה באופן מונוטוני \"ככה\".</p>${tiles([["target","עיסוק רב ובלעדי","בכל הקשור למטוסים ולחלל"],["people","קשיים חברתיים","עם בני הגיל","אחד הסימנים שבגללם ת׳ הגיע לטיפול: היה לו קשה ליצור קשרים ולהשתלב עם ילדים בני גילו.","בהפסקות ת׳ עמד לבד בחצר, ולא ידע איך להצטרף למשחק."],["hand","נוקשות","בתנועות הגוף","התנועות של ת׳ היו נוקשות ולא טבעיות. זה מאפיין שכיח באספרגר, ומשפיע גם על איך שאחרים רואים אותו.","ת׳ הלך בצעדים מדודים ונוקשים, וילדים בכיתה חיקו אותו."],["x","קשר עין","מינימלי, אם בכלל","ת׳ כמעט לא הסתכל לאנשים בעיניים. זה מקשה על השיחה, כי חלק גדול מהתקשורת עובר דרך המבט.","בפגישות הראשונות ת׳ דיבר עם המטפלת כשהוא מסתכל על הרצפה."]])}`,q:"q3"},
  {h:"האבחנה מגיל הגן",html:`<p>התברר שכבר בגיל <b>ארבע וחצי</b> אובחן \"אספרגר קל\" אצל רופא מומחה. מגיל שנתיים וחצי קיבל טיפולים פרא־רפואיים (ריפוי בדיבור וריפוי בעיסוק), ובהמלצת המומחה המשיך ללמוד <b>במסגרת חינוכית רגילה</b>, והצליח.</p>${def("ההמלצה",`המטפלת הבהירה להורים את הקשר בין האבחנה לבין הסיבה שהגיעו, והביעה דעה שיש צורך <b>לטפל בקשיים</b> במקום לאבחן. ההורים התעקשו על האבחון, ובמהלכו היא חיזקה את ההבנה שלהם ואת ה<b>קבלה הרגשית</b> של האבחנה.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"target",title:"התחלה: מטרה קטנה וגיוס הכיתה",blocks:[
  {h:"מטרה אחת קטנה",html:`${def("על מה הנושא",`הטיפול לא התחיל ב"תיקון הכול", אלא במטרה אחת קטנה, ובגיוס האנשים סביבו.<br><b>מה נלמד כאן:</b> מטרה קטנה · גיוס הכיתה והצוות`)}<p>בפגישה הראשונה ת' ישב <b>זקוף ונוקשה</b> והתכחש לכל צורה למצבו החברתי. המטפלת הציעה <b>מטרה אחת קטנה מאוד</b>: בכיתה ת' השמיע קולות, שרק ודיבר לעצמו, וזה גרר הצקות ואף אלימות.</p>${def("הטריק",`ת' טען שהוא לא משמיע קולות. כדי לעקוף את ההתנגדות, ובידיעה שהוא <b>מדייק</b> מאוד, היא ביקשה ממנו לרשום בטבלה במשך שבוע כל הערה שהופנתה אליו: יום, שעה, תגובה. ת' חזר <b>בלי אף רישום</b>: לא העירו לו. המחנכת אישרה שהכיתה רגועה.`)}${rem("הדייקנות שלו, או אם תרצו הנוקשות, הפכו ל<b>נקודות חוזק</b> שעזרו להשיג את המטרה. הבעיה שנבחרה הייתה <b>דחופה ומערכתית</b>, ופתרונה הביא רווחה לכולם.")}`,q:"q7"},
  {h:"גיוס הצוות החינוכי",html:`<p>התערבות מערכתית הייתה <b>מחויבת המציאות</b>. הצוות שוחח עם התלמידים <b>בלי נוכחותו של ת'</b>, על \"החוש החברתי\":</p>${ex("כמו שלפעמים נפגעים חושים כמו ראייה או שמיעה ומסייעים באמצעים רפואיים, כך כשהחוש החברתי נפגע, <b>החברים</b> הם שיכולים לעזור.")}${tiles([["check","ההצקות פסקו","לחלוטין","אחרי שהצוות הסביר לכיתה, בלי שת׳ היה שם, למה קשה לו, ההצקות נפסקו לגמרי.","הילדים שצחקו על הקולות של ת׳ הפסיקו כשהבינו שזה לא בכוונה."],["people","שיתוף","התחילו להזמין אותו לפעילויות. ילד אחד הגיע כל פעם לביתו לקחת אותו","הכיתה לא רק הפסיקה להציק, אלא התחילה לשתף את ת׳ בפעילויות.","ילד מהכיתה התחיל לבוא כל בוקר לבית של ת׳ כדי ללכת איתו יחד לבית הספר."],["hand","ערכים","הכיתה רכשה ערכים של עזרה לזולת","ההשתלבות של ת׳ תרמה גם לכיתה: הילדים למדו לעזור למי שמתקשה.","ילדים בכיתה התחילו להזמין את ת׳ להצטרף למשחק בהפסקה."]])}`,q:"q9"}
 ]},
 {id:"t3",icon:"brain",title:"התערבות ברמת הפרט",blocks:[
  {h:"הרקע התאורטי",html:`${def("על מה הנושא",`הלב של הטיפול: לעזור לת' להבין אנשים אחרים, ולהבין את עצמו.<br><b>מה נלמד כאן:</b> הרקע התאורטי · להבין את האחר · שיחות, סרטים וכלבה · להבין את העצמי`)}<p>ידע חברתי לא נלמד באף בית ספר. המטפלת פעלה ב<b>שלושה מעגלים</b>:</p>${fig("circles")}${tiles([["brain","תאוריה של הנפש","ג'ורדן ופאואל: קושי לנבא התנהגות של אחרים, לקרוא כוונות ולהסביר רגשות","לפי ג׳ורדן ופאואל, לאנשים עם אספרגר קשה ״להיכנס לראש״ של אחרים: לנחש מה הם ירצו, מה הם מתכוונים ומה הם מרגישים. לכן חלק מהטיפול היה לתרגל את זה.","ת׳ לא הבין למה חבר נעלב כשתיקן אותו מול כולם, עד שתרגלו יחד ״מה הוא הרגיש באותו רגע?״."],["link","הובסון","כדי שתהיה הבנה בין־אישית, צריך להגיב באופן טבעי לרגשות, להבעות ולמעשים של אחרים"],["id","\"עצמי חווה\"","קושי לחוות אירועים באופן סובייקטיבי ולזכור אותם. לכן צריך מבנה ברור והדגשה"]])}`,q:"q11"},
  {h:"להבין את האחר",html:`${tiles([["doc","תמונות מעיתונים","ת' הביא תמונות, ושוחחו על הבעות ורגשות. אחר כך יצרו שיחה או תסריט: מה קרה לפני, למה היא בוכה"],["copies","קלפים וסיפורים","בניית סיפור עם כמה סיומים אפשריים, כדי לפתח <b>גמישות מחשבתית</b>"],["hand","משחקי תקשורת","דיבור גב אל גב או פנים אל פנים, פנטומימה ופתגמים"],["question","טון והקשר","ת' למד שלפעמים אומרים \"כן\" ומתכוונים \"לא\". כמה מבלבל!"]])}${rem("לפי אטווד, לאדם עם אספרגר יש לעתים קרובות קושי ב<b>גמישות קוגניטיבית</b>: \"ראש בנתיב אחד\". לכן תרגלו כל פעם מצב חיים והעלו כמה פתרונות חלופיים.")}`,q:"q13"},
  {h:"שיחות, סרטים וכלבה",html:`${tiles([["phone","מיומנויות שיחה","תרגול שיחות טלפון ופנים אל פנים, בתפקידים שונים. בשלב מתקדם: להביא בעצמו נושא לכל מפגש. משימה שהתחילה כחובה הפכה למיומנות טבעית"],["chart","סרטים","שיחות על דמויות, דילמות ושינויים, למשל בסרט \"בעולם טוב יותר\": נקמה מול סלחנות, ומחיר של הבעת דעה שונה מהרוב","הצפייה בסרטים והשיחה עליהם שימשו לתרגל הבנה של דמויות, של דילמות ושל מצבים חברתיים, מתוך מרחק בטוח.","אחרי סרט על נקמה מול סליחה, ת׳ והמטפלת דיברו על מה כל דמות הרגישה ולמה בחרה כך."],["hand","הכלבה","ת' צפה באיך הכלבה יוצרת קשר ולמד להבחין בניואנסים. הכלבה שימשה <b>גשר לקשר</b>","הכלבה של המטפלת עזרה לבנות קשר. ת׳ ראה איך היא יוצרת קשר עם אנשים, ולמד לשים לב לפרטים קטנים בהתנהגות.","ת׳ שם לב שהכלבה ניגשת רק למי שמושיט לה יד בשקט, ולמד מזה משהו על גישה לאנשים."]])}`,q:"q15"},
  {h:"להבין את העצמי",html:`<p>בגיל ההתבגרות דימוי הגוף רגיש מאוד. איך לשפר שפת גוף נוקשה בלי לפגוע? בעזרת <b>מראה</b> בקליניקה: ת' תיאר מה הוא אוהב במראהו וזיהה בעצמו מה טעון שיפור (\"סבתא שלי אומרת שאני רשמי\").</p>${def("המללת תחושות בטן",`ת' היה \"יס־מן\": קיבל את דעת האחר ולא הביע את רצונו. הוא למד לזהות את <b>הסימנים המקדימים</b>, לחזק את \"הקולות הפנימיים\", ולהגיב <b>באסרטיביות</b>, כולל אמירת \"לא\" שאינה פוגעת.`)}${ex("לקראת החופש הגדול נראה שהוא מסכים להמשיך טיפול רק כדי לא לפגוע במטפלת. היא המלילה את רגשותיו ואפשרה לו לצאת לחופשה, בתנאי שבעתיד יביע את רצונו האמיתי.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"people",title:"המשפחה וחברים",blocks:[
  {h:"התערבות במשפחה",html:`${def("על מה הנושא",`הטיפול לא נעשה רק בחדר: הוא כלל את המשפחה ואת החברים.<br><b>מה נלמד כאן:</b> המשפחה · הדרכת ההורים · חבר עם צרכים מיוחדים`)}<p>במבנה המשפחתי היו קשיי תקשורת בין־אישיים, והאח הבריא <b>מילא תפקיד הורי</b>: גער וחינך את ת', אבל היה רחוק ממנו רגשית.</p>${tiles([["cycle","להחזיר תפקידים","ההורים ימלאו תפקיד הורי, והאח יחזור להיות אח, ויתחבר אל ת' כאח"],["hand","ביקורת בונה","האח קיבל כלים: \"אני אומר לך כי אכפת לי ממך\"","האח של ת׳ קיבל כלים להעיר לו בלי לפגוע, כך שת׳ יבין שההערה באה מאכפתיות.","במקום ״אתה מביך אותי״, האח אומר ״אני אומר לך כי אכפת לי ממך, כשאתה מדבר ככה חזק אנשים נבהלים״."],["link","סימנים מוסכמים","למשל \"אור אדום\" למצבי מצוקה, כדי שהמציק יפסיק"]])}`,q:"q19"},
  {h:"הדרכת ההורים",html:`${tiles([["phone","תרגול בבית","שיחות טלפון, יציאה לפעילויות. האב לקח אותו לשחק כדורסל","ההורים תרגלו עם ת׳ מצבים חברתיים מחוץ לטיפול, כדי שהמיומנויות יעברו לחיים עצמם.","האבא לקח את ת׳ לשחק כדורסל, כדי שיתרגל משחק עם אחרים."],["copies","להתמודד עם נוקשות","להציע אפשרויות בחירה: \"אם אתה עייף תלך לישון, ואם לא, אפשר לצפות בטלוויזיה\""],["sprout","עצמאות","בהדרגה קיבל תפקידים: לענות לטלפון, לחכות בתור. \"טעויות קורות, ולומדים מהן\"","ת׳ קיבל בהדרגה משימות שדרשו להתמודד לבד, והלמידה מטעויות הייתה חלק מהתהליך.","ת׳ עונה לטלפון בבית, וגם כשהוא מתבלבל, ההורים אומרים לו שזה בסדר ולומדים מזה."],["phone","טלפון סלולרי","ההורים הבינו שהוא כלי חשוב לתקשורת עם בני הגיל, וקנו לו","ההורים הבינו שלבני נוער הטלפון הוא כלי חברתי חשוב, ולכן קנו לו. כך הוא יכול להיות בקשר עם החברים.","ת׳ יכול לתאם עם חבר מתי נפגשים, כמו כל בני גילו."]])}`,q:"q21"},
  {h:"חבר עם צרכים מיוחדים",html:`<p>בשנה השנייה ת' יצר קשר עקבי עם נער אחר עם צרכים מיוחדים, שלא היה מקובל בחברה.</p>${def("הדילמה",`לתמוך בחברות, או לחשוש ש<b>שניהם בשולי החברה</b> וזה ימנע מת' קשרים \"בריאים\" יותר?`)}${rem("התוצאה, בניגוד לחששות המטפלת: הקשר <b>חיזק</b> את ת'. הוא חווה קשר חיובי ולא מאיים, וקיבל הזדמנות <b>לעזור ולא רק להיעזר</b>.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"scales",title:"דילמות ומעגל החיים",blocks:[
  {h:"לקרוא לילד בשמו?",html:`${def("על מה הנושא",`לאורך השנים עלו דילמות: האם לתת לבעיה שם, ואיך עוברים לתיכון, לעבודה ולצבא.<br><b>מה נלמד כאן:</b> לקרוא לילד בשמו · מעברים · הגיוס לצה"ל`)}<p>האם לספר לת' שיש לו אספרגר? ומתי? ההורים, המחנכת והיועצת ידעו. לאחיו ולתלמידי הכיתה הסבירו על <b>הקשיים</b>, בלי המינוח הרפואי.</p>${def("ההפתעה",`לקראת הצבא, המטפלת נכנסה לשיחה בחשש. אבל ת' כבר <b>שמע את המונח</b> בבית, חיפש באינטרנט, הבין במה מדובר, וגילה <b>אופטימיות</b>: הבין שהמצב בר שיפור.`)}${rem("הלקח של המטפלת: חשוב לבדוק את הבנת המטופל ולשתף אותו במינוח, \"ואולי יפה שעה אחת קודם\".")}`,q:"q25"},
  {h:"מעברים: תיכון ועבודה",html:`<p>מעברים ומצבים חדשים קשים לאדם עם אספרגר (אטווד). צריך שיחות הכנה ותרגול, הכנה של ההורים, ולפעמים התערבות במערכת.</p>${tiles([["grad","מגמת מחשבים","חסרו לו 5 נקודות במתמטיקה. המטפלת פנתה ליועצת, והציון הועלה בזכות תפקודו המצוין. הוא קיבל <b>תעודת הצטיינות</b> כבר במחצית הראשונה","המטפלת פעלה מול בית הספר כדי ש־ת׳ יתקבל למגמה שמתאימה לו, והוא הצליח בה מאוד.","בזכות הפנייה ליועצת, ת׳ התקבל למגמה, ובסוף קיבל תעודת הצטיינות."],["question","התחום האפור","ת' התקשה להבין שנכנס \"לפנים משורת הדין\". זה מאפיין של אספרגר, ולכן צריך ליווי מתמיד","ת׳ חושב לפי כללים ברורים, ולכן קשה לו להבין מצבים שבהם עושים חריגה מהכלל, ״לפנים משורת הדין״. בגלל זה הוא צריך ליווי גם אחרי הטיפול.","כשהמורה העלתה לו את הציון כדי לעזור, ת׳ לא הבין: ״אבל זה לא הציון שקיבלתי״."],["building","עבודה בקיץ","חודש במפעל של קרוב משפחה, בסביבה תומכת. משכורת ראשונה"]])}`,q:"q27"},
  {h:"הגיוס לצה\"ל",html:`<p>ההורים חששו, ולא היה להם ניסיון אישי בגיוס. המטפלת האמינה שהשירות חשוב: <b>פטור</b> על רקע פסיכיאטרי עלול להיות מכשול בהמשך החיים, והצבא הוא מסגרת מובנית לצבירת ניסיון.</p>${tiles([["doc","הכנה","התייעצות עם הצבא ועם עמותת אפ\"י, ומכתב על התקדמותו","לפני הגיוס, המטפלת התייעצה עם הצבא ועם עמותה שעוסקת באספרגר, ושלחה מכתב על ההתקדמות שלו, כדי שישבצו אותו נכון.","בזכות המכתב, המראיין בצבא כבר ידע מה החוזקות של ת׳ ומה עלול להיות קשה לו."],["cycle","משחקי תפקידים","מתגייס ומראיין, עד שהיה נינוח ורגוע","המטפלת ות׳ תרגלו את הריאיון בצבא שוב ושוב, עם החלפת תפקידים, עד שהוא הרגיש נינוח.","פעם ת׳ שיחק את המתגייס ופעם את המראיין, עד שהשאלות כבר לא הלחיצו אותו."],["check","התוצאה","ת' גויס, אם כי לא לתפקידים קרביים שדורשים נשק","סימן להצלחת הטיפול: ת׳ גויס לצבא, אם כי לא לתפקיד קרבי.","ת׳ משרת בתפקיד שמתאים לכישורים שלו."]])}${rem("המטפלת מודעת לכך ש<b>האמונות האישיות שלה</b> (חשיבות התרומה למדינה) השפיעו על הכיוון. זו אחת השאלות שהמאמר מעלה: איך להתייחס לאמונות של המטפל.")}`,q:"q29"}
 ]},
 {id:"t6",icon:"check",title:"סיכום והערכת הטיפול",blocks:[
  {h:"מה עזר",html:`${def("על מה הנושא",`מה עזר, ואיך יודעים שהטיפול באמת עבד?<br><b>מה נלמד כאן:</b> מה עזר · הערכת הטיפול`)}${tiles([["check","אבחנה קלה","ת' אובחן כאספרגר בדרגה קלה","ת׳ אובחן בדרגה קלה של אספרגר. זה חשוב להבנת ההצלחה, כי הקשיים שלו היו פחות קשים.","בגלל שהקשיים קלים יחסית, היה לו קל יותר להשתלב בכיתה רגילה."],["target","גיוס מהמפגש הראשון","מטרה הכרחית, ושימוש במוטיבציה ובהתמדה שלו"],["people","הורים","שיתפו פעולה לאורך כל הטיפול","ההורים שיתפו פעולה לאורך כל הטיפול. לפי המאמר, זה אחד הגורמים שעזרו לו להצליח.","ההורים תרגלו בבית את מה שת׳ למד בטיפול, ועדכנו את המטפלת על מה שקורה."],["link","משולש טיפולי","קשר טוב בין מטופל, מטפלת והורים","ההצלחה נשענה על קשר טוב בין שלושה: ת׳, המטפלת וההורים. כולם עבדו יחד.","המטפלת מעדכנת את ההורים, וההורים ממשיכים בבית את מה שת׳ תרגל בטיפול."],["building","הצוות החינוכי","שיתוף פעולה מלא ויישום ההמלצות","הצוות בבית הספר שיתף פעולה עד הסוף, ויישם את ההמלצות של המטפלת.","המחנכת שינתה את מקום הישיבה של ת׳ והסבירה לכיתה, לפי מה שהמטפלת הציעה."]])}${rem("סגנון הטיפול: למידה בעזרת מה שיש בחדר ובסביבה (מראה, חיית מחמד, סרטים), ושימוש בתכנים שהמטופל הביא \"<b>כאן ועכשיו</b>\".")}`,q:"q31"},
  {h:"איך יודעים שזה עבד",html:`${tiles([["clock","ארבע שנים","הגיע ברצון ובעקביות","הטיפול נמשך יותר מארבע שנים, ות׳ הגיע ברצון ובקביעות. ההתמדה הזו היא חלק מההצלחה.","גם בתקופות שהיה לו קשה, ת׳ לא החסיר פגישות."],["doc","דיווחים חיוביים","מהמחנכת, מהיועצת וממרכזת השכבה"],["people","קשרים חברתיים","יותר, ובאיכות טובה יותר. השתתף בפעילויות"],["hand","הבעות וחיוך","כבר בשנה השנייה, וצחוק והומור במפגשים"]])}${fig("scores","מבחני הבנה חברתית ושיפוט מציאות: ציוני תקן בתחילת הטיפול ובסופו")}${def("המסקנה",`מתפקוד <b>נמוך מהממוצע</b> בהבנה חברתית ובשיפוט מציאות, לתפקוד <b>בתחום הממוצע</b>.`)}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"איזה סוג מחקר הוא המאמר על ת׳?","a":"תיאור מקרה של טיפול פרטני ארוך","w":["ניסוי מבוקר עם קבוצת ביקורת","סקר של משפחות עם ילדים עם אספרגר","מחקר מתאמי על מאות מתבגרים"],"e":"המאמר מתאר טיפול של יותר מארבע שנים במטופל אחד, ולכן זה תיאור מקרה של טיפול פרטני. אין בו קבוצת ביקורת, ולכן הוא אינו ניסוי מבוקר."},{"q":"מטפלת משלבת בטיפול משחקי תפקידים, שיחות על סרטים ועבודה עם מראה. מה המאמר מכנה זאת?","a":"שילוב אקלקטי של טכניקות","w":["טיפול קוגניטיבי־התנהגותי טהור","טיפול פסיכודינמי קלאסי","טיפול תרופתי משולב"],"e":"שילוב של משחקי תפקידים, סרטים ומראה, טכניקות מגישות שונות לפי הצורך, הוא שילוב אקלקטי. זה לא טיפול קוגניטיבי־התנהגותי טהור."}]},
"q2":{"t":"t1","v":[{"q":"איזה מהבאים לא נמנה במאמר כגורם שהפך את הטיפול ליעיל?","a":"טיפול תרופתי","w":["מוטיבציה גבוהה של המטופל","עזרה ואהבה של המשפחה","קשר טוב עם המטפלת"],"e":"שלושת הגורמים שהפכו את הטיפול ליעיל הם המוטיבציה של ת׳, העזרה והאהבה של המשפחה, והקשר הטוב עם המטפלת. ת׳ לא קיבל טיפול תרופתי."},{"q":"למי התייחס הטיפול, חוץ מהמטופל עצמו?","a":"למשפחה ולמערכת החינוך","w":["רק לאחים שלו","רק לחברים מהכיתה","לצבא ולמקום העבודה"],"e":"הטיפול היה מערכתי: הוא התייחס גם למשפחה ולמערכת החינוך, ולא רק למטופל. הוא לא עסק בצבא ובמקום העבודה כמסגרות קבועות."}]},
"q3":{"t":"t1","v":[{"q":"למה הגיע ת׳ בגיל 12 לפגישה הראשונה?","a":"לאבחון בגלל קשיים חברתיים","w":["לטיפול בהתפרצויות זעם","לבדיקה של לקות למידה","לטיפול בחרדה מבחינות"],"e":"ת׳ הגיע בגיל 12 לאבחון, בהמלצת בית הספר, בגלל קשיים חברתיים. הוא לא הגיע בגלל התפרצויות זעם."},{"q":"איזה מהבאים לא היה אחד מהמאפיינים שעלו בפגישה הראשונה?","a":"התפרצויות זעם תכופות","w":["קשר עין מינימלי","עיסוק בלעדי במטוסים ובחלל","נוקשות בתנועות הגוף"],"e":"בפגישה הראשונה עלו קשר עין מינימלי, עיסוק בלעדי במטוסים ובחלל ונוקשות בתנועות הגוף, כלומר תמונה של נוקשות ובדידות. התפרצויות זעם לא היו חלק ממנה."}]},
"q4":{"t":"t1","v":[{"q":"ת׳ עונה לכל שאלה ״ככה״, בטון אחיד. מה זה ממחיש לגבי התקשורת שלו?","a":"קושי בתקשורת רגשית ובאינטונציה","w":["התנגדות מכוונת לטיפול ולמטפלת","חוסר ידע בנושא שעליו נשאל","עייפות רגילה אחרי יום לימודים"],"e":"תשובה קצרה בטון אחיד מבטאת קושי בתקשורת רגשית ובאינטונציה, מאפיין של אספרגר. זו לא התנגדות מכוונת לטיפול."},{"q":"איך תואר מצבו החברתי בכיתה?","a":"בודד, דחוי ונתון להצקות","w":["מקובל אבל שקט","מנהיג של קבוצה קטנה","מתבודד מבחירה, בלי הצקות"],"e":"ת׳ היה בודד, דחוי ונתון להצקות בכיתה, וזו הסיבה לפנייה. הוא לא היה מתבודד מבחירה."}]},
"q5":{"t":"t1","v":[{"q":"ת׳ אובחן כבר בגיל ארבע וחצי. למה בכל זאת ההורים פנו לאבחון בגיל 12?","a":"כי הקשיים החברתיים התחדדו בגיל ההתבגרות","w":["כי האבחנה הקודמת בוטלה על ידי רופא","כי הוא עבר בית ספר באותה שנה","כי הוא הפסיק את כל הטיפולים בגן"],"e":"בגיל ההתבגרות הקשיים החברתיים התחדדו, ולכן ההורים פנו לאבחון. המטפלת הסבירה את הקשר לאבחנה שניתנה כבר בגן. האבחנה הקודמת לא בוטלה."},{"q":"איזה טיפול קיבל ת׳ מגיל שנתיים וחצי?","a":"ריפוי בדיבור וריפוי בעיסוק","w":["טיפול תרופתי קבוע","טיפול פסיכודינמי שבועי","טיפול בתנועה ובמחול"],"e":"מגיל שנתיים וחצי ת׳ קיבל טיפולים פרא־רפואיים: ריפוי בדיבור וריפוי בעיסוק. הוא לא קיבל טיפול תרופתי."}]},
"q6":{"t":"t1","v":[{"q":"המטפלת המליצה לטפל במקום לאבחן שוב, אבל ההורים התעקשו. מה היא עשתה?","a":"ערכה אבחון וחיזקה את הקבלה הרגשית שלהם","w":["סירבה לאבחן ושלחה אותם הביתה","הפנתה אותם ישר לפסיכיאטר ילדים","אבחנה בלי לשתף אותם בתוצאות כלל"],"e":"המטפלת ערכה את האבחון כפי שההורים ביקשו, וניצלה אותו כדי לחזק את ההבנה והקבלה הרגשית שלהם. היא לא סירבה ולא שלחה אותם הביתה."},{"q":"באיזו מסגרת למד ת׳?","a":"בכיתה רגילה","w":["בבית ספר מיוחד","בכיתת תקשורת קטנה","בחינוך ביתי מלא"],"e":"ת׳ למד בכיתה רגילה, בהמלצת המומחה, והצליח בה. הוא לא למד בבית ספר מיוחד."}]},
"q7":{"t":"t2","v":[{"q":"ת׳ טוען שהוא לא משמיע קולות בכיתה. מה עשתה המטפלת כדי לעקוף את ההתנגדות?","a":"ביקשה ממנו לרשום כל הערה שקיבל","w":["הקליטה אותו בכיתה בלי ידיעתו","שאלה את חבריו אם זה נכון","התעלמה מהנושא ועברה לנושא אחר"],"e":"המטפלת ניצלה את הדייקנות של ת׳ וביקשה ממנו לרשום כל הערה שקיבל בכיתה. כך עקפה את ההתנגדות בלי להתעמת איתו. היא לא הקליטה אותו בלי ידיעתו."},{"q":"מה הייתה מטרת הטיפול הראשונה?","a":"להפסיק להשמיע קולות","w":["לשפר את הציונים שלו","ליצור חבר ראשון בכיתה","ללמוד לעשות קשר עין"],"e":"המטרה הראשונה הייתה אחת, קטנה ודחופה: להפסיק להשמיע קולות בכיתה. יצירת חבר ראשון לא הייתה המטרה הראשונה."}]},
"q8":{"t":"t2","v":[{"q":"ת׳ חזר אחרי שבוע בלי אף רישום, כי לא העירו לו. מה הסביר את השינוי?","a":"עצם המעקב גרם לו לשים לב להתנהגות","w":["חבריו החליטו להתעלם ממנו לגמרי","המחנכת הענישה את כל המציקים","הוא עבר באותו שבוע לכיתה אחרת"],"e":"עצם המעקב, הצורך לרשום כל הערה, גרם לת׳ לשים לב להתנהגות שלו ולהפסיק אותה. כך הנוקשות שלו הפכה לנקודת חוזק. הוא לא עבר כיתה."},{"q":"איזו תכונה של ת׳ הפכה לנקודת חוזק?","a":"הדייקנות שלו","w":["הבדידות שלו","העיסוק במטוסים","הטון המונוטוני"],"e":"המטפלת ניצלה את הדייקנות של ת׳, שבדרך כלל נחשבת חלק מהנוקשות, והפכה אותה לנקודת חוזק בטיפול. הבדידות שלו לא שימשה כך."}]},
"q9":{"t":"t2","v":[{"q":"איך הסבירו לכיתה את הקשיים של ת׳?","a":"כפגיעה ב״חוש חברתי״, שחברים יכולים לסייע בה","w":["כמחלה מדבקת שצריך להיזהר ממנה","כהתנהגות מכוונת שצריך להעניש","בעזרת המונח הרפואי ״אספרגר״"],"e":"לכיתה הסבירו שיש לת׳ פגיעה ב״חוש החברתי״, כמו בעיה בראייה שמשקפיים עוזרים בה, וחברים יכולים לעזור לו. לא השתמשו במונח הרפואי ״אספרגר״."},{"q":"למה השיחה עם הכיתה נערכה בלי נוכחותו של ת׳?","a":"כדי לא לחשוף ולהביך אותו","w":["כי הוא סירב להגיע","כי זה מה שההורים ביקשו","כי הוא היה בטיפול באותה שעה"],"e":"השיחה עסקה בת׳, ולכן נערכה בלי נוכחותו, כדי לא לחשוף ולהביך אותו. זה לא היה בגלל שהוא סירב להגיע."}]},
"q10":{"t":"t2","v":[{"q":"למה בחירת בעיה ״דחופה ומערכתית״ הייתה חכמה?","a":"כי הפתרון הביא רווחה מורגשת לכולם","w":["כי היא הייתה הבעיה הקלה ביותר","כי ההורים בחרו בה","כי היא דרשה רק פגישה אחת"],"e":"הבעיה הייתה דחופה ומערכתית, ולכן הפתרון שלה הביא רווחה מורגשת לכולם, ת׳ וגם הכיתה. זה גייס את כולם לטיפול. היא לא נבחרה כי הייתה הקלה ביותר."},{"q":"מה קרה אחרי ההתערבות בכיתה?","a":"ההצקות פסקו לגמרי","w":["ההצקות התגברו מאוד","ת׳ עבר לבית ספר אחר","המחנכת התפטרה מהתפקיד"],"e":"אחרי ההתערבות בכיתה ההצקות פסקו לגמרי, והכיתה גם פיתחה ערכים של עזרה לזולת. ת׳ לא עבר בית ספר."}]},
"q11":{"t":"t3","v":[{"q":"ת׳ לא מבין למה חבר כעס עליו, ולא מצליח לנחש מה החבר ירצה. לפי ג׳ורדן ופאואל, באיזה תחום יש לו קושי?","a":"תאוריה של הנפש","w":["עצמי חווה","גמישות מוטורית","זיכרון עבודה"],"e":"קושי לנבא התנהגות של אחרים ולקרוא את הכוונות שלהם הוא קושי בתאוריה של הנפש. ״עצמי חווה״ עוסק בחוויה ובזיכרון הסובייקטיבי שלו עצמו, לא של אחרים."},{"q":"מה המשותף לשלושת המעגלים שבהם פעלה המטפלת?","a":"כולם עוסקים בהבנה חברתית ורגשית","w":["כולם עוסקים בלמידה בבית הספר","כולם עוסקים בטיפול תרופתי","כולם עוסקים במוטוריקה"],"e":"שלושת המעגלים (תאוריה של הנפש, הבנה בין־אישית ועצמי חווה) עוסקים כולם בהבנה חברתית ורגשית. הם לא עוסקים בלמידה בבית הספר."}]},
"q12":{"t":"t3","v":[{"q":"ת׳ מתקשה לזכור איך הרגיש באירוע מסוים לפני שבוע. איזה מושג זה ממחיש?","a":"״עצמי חווה״","w":["תאוריה של הנפש","גמישות קוגניטיבית","הבנה בין־אישית"],"e":"קושי לזכור איך הרגיש באירוע הוא קושי ב״עצמי חווה״: לחוות ולזכור אירועים באופן סובייקטיבי. תאוריה של הנפש עוסקת בהבנת אחרים."},{"q":"למה ת׳ צריך מבנה ברור והדגשה בטיפול?","a":"כי קשה לו לחוות ולזכור אירועים","w":["כי הוא לא מבין שפה מדוברת","כי הוא מתנגד לטיפול באופן עקבי","כי הוא צעיר מדי לטיפול מורכב"],"e":"בגלל הקושי ב״עצמי חווה״, קשה לת׳ לחוות ולזכור אירועים, ולכן הוא צריך בטיפול מבנה ברור והדגשה. זה לא בגלל שהוא לא מבין שפה."}]},
"q13":{"t":"t3","v":[{"q":"ת׳ ראה תמונה של אישה בוכה בעיתון. מה המטפלת ביקשה ממנו?","a":"לבנות סיפור על מה קרה לפני ולמה היא בוכה","w":["לתאר את הצבעים שמופיעים בתמונה","לגזור את התמונה ולהדביק במחברת","לכתוב את שם העיתון ואת התאריך"],"e":"בניית סיפור על מה קרה לפני ולמה האישה בוכה מתרגלת הבנה של רגשות וכוונות של אחרים. תיאור הצבעים בתמונה לא היה מתרגל את זה."},{"q":"למה הציעו כמה סיומים שונים לאותו סיפור?","a":"כדי לפתח גמישות מחשבתית","w":["כדי לבדוק את הזיכרון שלו","כדי לשפר את הכתיבה שלו","כדי לבחור את הסוף הנכון"],"e":"כמה סיומים שונים לאותו סיפור מפתחים גמישות מחשבתית, כנגד ״ראש בנתיב אחד״. המטרה לא הייתה לבחור את הסוף ״הנכון״."}]},
"q14":{"t":"t3","v":[{"q":"חברה אומרת לת׳ ״כן, ממש בא לי לבוא״ בטון סרקסטי. מה ת׳ למד בטיפול על מצב כזה?","a":"שלפעמים ״כן״ אומר ״לא״","w":["שתמיד צריך להאמין למילים","שסרקזם הוא סימן לחברות","שצריך לבקש הסבר בכתב"],"e":"ת׳ למד שהטון וההקשר משנים את המשמעות, ולכן לפעמים ״כן״ אומר ״לא״. הוא לא למד שתמיד צריך להאמין למילים, אלא בדיוק להפך."},{"q":"״ראש בנתיב אחד״ מתאר קושי ב:","a":"גמישות קוגניטיבית","w":["זיכרון לטווח ארוך","שפה ודיבור","קואורדינציה מוטורית"],"e":"״ראש בנתיב אחד״, לפי אטווד, מתאר קושי בגמישות קוגניטיבית: קושי לראות אפשרויות ופירושים שונים. הוא לא עוסק בזיכרון."}]},
"q15":{"t":"t3","v":[{"q":"בשלב מתקדם, ת׳ התבקש להביא בעצמו נושא לכל מפגש. מה מטרת המשימה?","a":"לתרגל יוזמה בשיחה","w":["לחסוך עבודה למטפלת","לבדוק את הזיכרון שלו","לקצר את המפגשים"],"e":"המשימה להביא נושא לכל מפגש תרגלה יוזמה בשיחה, ובהמשך זה הפך למיומנות טבעית. היא לא נועדה לחסוך עבודה למטפלת."},{"q":"מה שימש ״גשר לקשר״ בטיפול?","a":"הכלבה","w":["המחשב","המראה","הסרטים"],"e":"הכלבה שימשה ״גשר לקשר״: ת׳ צפה בה ולמד ממנה ניואנסים של תקשורת. המראה שימשה לעבודה על שפת הגוף."}]},
"q16":{"t":"t3","v":[{"q":"למה סרטים הם כלי טוב בטיפול בנוער?","a":"כי זה בילוי טבעי, שאפשר לכוון","w":["כי סרטים מחליפים שיחה טיפולית","כי נוער לא אוהב לדבר על עצמו","כי סרטים זולים ונגישים לכולם"],"e":"צפייה בסרטים היא בילוי טבעי לנוער, ואפשר לכוון אותה לשיחות על דמויות ועל דילמות. סרטים לא מחליפים את השיחה הטיפולית, אלא משמשים בסיס לה."},{"q":"על מה שוחחו אחרי הסרט ״בעולם טוב יותר״?","a":"נקמה מול סלחנות","w":["משפחה מול חברים","לימודים מול עבודה","עושר מול עוני"],"e":"אחרי הסרט ״בעולם טוב יותר״ שוחחו על נקמה מול סלחנות, ועל המחיר של דעה שונה מהרוב."}]},
"q17":{"t":"t3","v":[{"q":"איך עבדו על שפת הגוף הנוקשה בלי לפגוע בדימוי הגוף?","a":"מול מראה, כשת׳ זיהה בעצמו מה לשפר","w":["המטפלת תיקנה כל תנועה בקול רם","צילמו אותו והראו לכל הכיתה","שלחו אותו לחוג תיאטרון שבועי"],"e":"עבודה מול מראה אפשרה לת׳ לזהות בעצמו מה לשפר, בלי שמישהו יתקן אותו מבחוץ, וכך לא נפגע הדימוי העצמי. הוא אפילו אמר ״סבתא שלי אומרת שאני רשמי״."},{"q":"מה הכוונה שת׳ היה ״יס־מן״?","a":"הוא הסכים לכל דבר","w":["הוא היה אופטימי מאוד","הוא תמיד אמר את האמת","הוא היה ממושמע בכיתה"],"e":"״יס־מן״ פירושו שת׳ הסכים לכל דבר, ולא ידע לסרב, ולכן למד בטיפול אסרטיביות. הכוונה איננה שהיה אופטימי."}]},
"q18":{"t":"t3","v":[{"q":"נראה שת׳ מסכים להמשיך טיפול בקיץ רק כדי לא לפגוע במטפלת. מה היא עשתה?","a":"המלילה את רגשותיו ושחררה אותו","w":["הסכימה להמשיך את הטיפול בקיץ","הפסיקה את הטיפול לגמרי","שאלה את ההורים מה לעשות"],"e":"המטפלת המלילה את רגשותיו, אמרה בקול מה נראה שהוא מרגיש, ושחררה אותו לחופשה, בתנאי שבעתיד יביע את רצונו בעצמו. היא לא הסכימה להמשיך בקיץ."},{"q":"מה החשש שנשאר גם אחרי ההתקדמות?","a":"שת׳ ניתן לניצול","w":["שת׳ יהיה אלים","שת׳ יפסיק ללמוד","שת׳ יתמכר למחשב"],"e":"גם אחרי ההתקדמות נשאר חשש שת׳ ניתן לניצול, בגלל הקושי שלו להגיד ״לא״. לא היה חשש לאלימות מצדו."}]},
"q19":{"t":"t4","v":[{"q":"האח הבריא של ת׳ גער בו וחינך אותו, אבל לא היה קרוב אליו. מה הבעיה במבנה הזה?","a":"האח מילא תפקיד הורי ולא תפקיד של אח","w":["האח היה אלים כלפי ת׳ בבית","ההורים העדיפו את האח באופן גלוי","האח בכלל לא ידע על האבחנה"],"e":"האח הבריא גער בת׳ וחינך אותו, כלומר מילא תפקיד הורי ולא תפקיד של אח. לכן הם לא היו קרובים. לא נטען שהוא היה אלים."},{"q":"מה הייתה מטרת הטיפול במשפחה?","a":"להחזיר לכל אחד את תפקידו","w":["להפריד בין האחים","להגביר את המשמעת","להקטין את הקשר עם ההורים"],"e":"מטרת הטיפול במשפחה הייתה להחזיר לכל אחד את תפקידו: ההורים כהורים והאח כאח. לא הייתה כוונה להפריד בין האחים."}]},
"q20":{"t":"t4","v":[{"q":"האח למד לומר ״אני אומר לך כי אכפת לי ממך״. מה הוא קיבל?","a":"כלי לביקורת בונה","w":["תפקיד הורי חדש","סימן מוסכם למצוקה","הוראה להתעלם מת׳"],"e":"״אני אומר לך כי אכפת לי ממך״ הוא כלי לביקורת בונה, כדי שת׳ יוכל לקבל את הביקורת בלי להיפגע. זה לא תפקיד הורי חדש."},{"q":"למה נוצר סימן מוסכם כמו ״אור אדום״?","a":"כדי לאותת על מצוקה","w":["כדי לסיים את הטיפול מהר","כדי לבקש כסף מההורים","כדי להזמין חבר הביתה"],"e":"סימן מוסכם כמו ״אור אדום״ נוצר כדי שבני המשפחה יוכלו לאותת על מצוקה. זה כלי תקשורת פשוט וברור."}]},
"q21":{"t":"t4","v":[{"q":"איך הודרכו ההורים להתמודד עם הנוקשות של ת׳?","a":"להציע לו אפשרויות בחירה","w":["לקבוע לו כללים קבועים בלבד","להעניש כל סטייה מהשגרה","להתעלם מהנוקשות"],"e":"ההורים הודרכו להציע לת׳ אפשרויות בחירה (״אם אתה עייף... ואם לא...״), וכך להקל על הנוקשות. ענישה על כל סטייה מהשגרה הייתה מחמירה אותה."},{"q":"איך ההורים קידמו את העצמאות של ת׳?","a":"נתנו לו תפקידים בהדרגה","w":["שלחו אותו לפנימייה לשנה","עשו בשבילו את רוב המשימות","השאירו אותו לבד בבית שבוע"],"e":"ההורים נתנו לת׳ תפקידים בהדרגה, מתוך ההבנה ש״טעויות קורות, ולומדים מהן״. הם לא עשו בשבילו את רוב המשימות."}]},
"q22":{"t":"t4","v":[{"q":"למה ההורים שינו את דעתם וקנו לת׳ טלפון סלולרי?","a":"כי זה כלי לקשר עם בני גילו","w":["כי ת׳ התחנן במשך חודשים","כי בית הספר חייב זאת","כי המטפלת קנתה לו"],"e":"ההורים הבינו שטלפון סלולרי הוא כלי לקשר עם בני גילו, כלומר לתקשורת חברתית, ולכן שינו את דעתם. בית הספר לא חייב זאת."},{"q":"איזה תפקיד מילא האב בתרגול בבית?","a":"לקח את ת׳ לשחק כדורסל","w":["לימד אותו מתמטיקה","הסיע אותו לטיפול בלבד","כתב לו את שיעורי הבית"],"e":"האב לקח את ת׳ לשחק כדורסל, וכך תרגל איתו יציאה לפעילויות. הוא לא כתב לו את שיעורי הבית."}]},
"q23":{"t":"t4","v":[{"q":"ת׳ התיידד עם נער אחר עם צרכים מיוחדים. מה הייתה הדילמה?","a":"ששניהם יישארו בשוליים","w":["שהחבר יפגע בת׳ פיזית","שההורים יתנגדו לחברות","שהחבר יעבור בית ספר"],"e":"החשש היה ששני נערים עם צרכים מיוחדים יישארו יחד בשוליים, ואולי החברות תמנע מת׳ קשרים אחרים. לא היה חשש שהחבר יפגע בו."},{"q":"מה הייתה התוצאה של החברות?","a":"היא חיזקה את ת׳","w":["היא הרחיקה אותו מאחרים","היא הסתיימה מהר מאוד","היא הגבירה את ההצקות"],"e":"החברות חיזקה את ת׳: היא הייתה קשר לא מאיים, והחשש של המטפלת לא התממש. היא לא הרחיקה אותו מאחרים."}]},
"q24":{"t":"t4","v":[{"q":"מה מלמד המקרה של החבר על עבודה טיפולית?","a":"כדאי לבחון בפועל ולא רק לפי חשש","w":["שתמיד צריך למנוע חברויות כאלה","שהמטפלת צריכה לבחור חברים","שחברויות לא חשובות בטיפול"],"e":"התוצאה הפתיעה את המטפלת: החברות דווקא עזרה. מכאן הלקח: כדאי לבחון בפועל מה קורה, ולא לפעול רק לפי חשש."},{"q":"מה דיווחו ההורים על הקשרים החברתיים לאורך הטיפול?","a":"שיפור במספר ובאיכות","w":["ירידה במספר הקשרים","אין שינוי","רק קשרים עם מבוגרים"],"e":"לפי ההורים, לאורך הטיפול חל שיפור במספר הקשרים החברתיים של ת׳ ובאיכותם. לא היה מצב של ״אין שינוי״."}]},
"q25":{"t":"t5","v":[{"q":"לכיתה ולאח הסבירו על הקשיים של ת׳, בלי המינוח ״אספרגר״. למה?","a":"כדי לא להדביק לו תווית מול אחרים","w":["כי אסור לפי החוק לספר לכיתה","כי האבחנה עוד לא הייתה ודאית","כי ת׳ ביקש זאת במפורש"],"e":"לכיתה ולאח הסבירו את הקשיים בלי המונח ״אספרגר״, כדי לא להדביק לת׳ תווית מול אחרים. רק ההורים, המחנכת והיועצת ידעו את האבחנה. אין חוק שאוסר לספר."},{"q":"מה התגלה כשהמטפלת ניגשה לספר לת׳ על האבחנה?","a":"הוא כבר ידע והיה אופטימי","w":["הוא נבהל וסירב לדבר","הוא כעס על ההורים","הוא לא הבין מה זה"],"e":"כשהמטפלת ניגשה לספר לת׳ על האבחנה, התברר שהוא כבר ידע, והיה אופטימי כי הבין שהמצב בר שיפור. הוא לא נבהל."}]},
"q26":{"t":"t5","v":[{"q":"מה הלקח של המטפלת מהשיחה על האבחנה?","a":"לשתף את המטופל מוקדם","w":["לעולם לא לספר למטופל","לספר רק דרך ההורים","לחכות עד גיל 18"],"e":"ת׳ כבר ידע וקיבל את האבחנה טוב, ולכן הלקח של המטפלת הוא לשתף את המטופל מוקדם, ״ואולי יפה שעה אחת קודם״. לא לחכות עד גיל 18."},{"q":"מתי בפועל דובר עם ת׳ על האבחנה?","a":"לקראת המיון לצה״ל","w":["בפגישה הראשונה","בגיל הגן","בסוף התיכון"],"e":"בפועל דיברו עם ת׳ על האבחנה רק לקראת המיון לצה״ל, כשהיה לכך צורך מעשי."}]},
"q27":{"t":"t5","v":[{"q":"לת׳ חסרו 5 נקודות במתמטיקה למגמת מחשבים. מה עשתה המטפלת?","a":"פנתה ליועצת בבית הספר","w":["המליצה לו לוותר על המגמה","נתנה לו שיעורים פרטיים","פנתה למשרד החינוך"],"e":"המטפלת פנתה ליועצת בבית הספר, והתערבה במערכת ברגע המעבר. היא לא המליצה לו לוותר על המגמה."},{"q":"מה היה קשה לת׳ להבין לגבי הקבלה למגמה?","a":"את ״התחום האפור״","w":["למה הוא קיבל ציון נמוך","מה בדיוק לומדים במגמה","מי המורה של המגמה"],"e":"לת׳ היה קשה להבין את ״התחום האפור״: שחסרות 5 נקודות, ובכל זאת אולי אפשר להתקבל. זה מאפיין של חשיבה נוקשה באספרגר."}]},
"q28":{"t":"t5","v":[{"q":"למה מעברים כמו תיכון או עבודה דורשים הכנה מיוחדת אצל אדם עם אספרגר?","a":"כי שינוי מעורר מצוקה","w":["כי הוא לא מבין הוראות","כי הוא לא רוצה להתקדם","כי הוא צריך תרופות"],"e":"לפי אטווד, שינוי מעורר מצוקה אצל אדם עם אספרגר, ולכן מעברים כמו תיכון או עבודה דורשים הכנה מיוחדת. זה לא קשור להבנת הוראות."},{"q":"איפה עבד ת׳ בחופש הגדול?","a":"במפעל משפחתי","w":["בחנות מחשבים","בבית הספר","בקייטנה"],"e":"ת׳ עבד בחופש הגדול במפעל משפחתי, סביבה תומכת, וקיבל את המשכורת הראשונה שלו."}]},
"q29":{"t":"t5","v":[{"q":"למה המטפלת חשבה שחשוב שת׳ יתגייס?","a":"כי פטור עלול להזיק בהמשך","w":["כי ההורים דרשו זאת ממנו","כי הוא רצה להיות לוחם","כי החוק מחייב גיוס"],"e":"המטפלת חשבה שפטור מהצבא עלול להזיק לת׳ בהמשך, כי הוא צריך לצבור ניסיון. ההורים לא דרשו זאת."},{"q":"מה היה בסוף עם הגיוס?","a":"גויס, לא לקרבי","w":["קיבל פטור מלא","גויס ליחידה קרבית","דחה את הגיוס בשנה"],"e":"בסוף ת׳ גויס, אבל לא לתפקיד קרבי ולא לתפקידים שדורשים נשק. הוא לא קיבל פטור."}]},
"q30":{"t":"t5","v":[{"q":"איך הכינו את ת׳ לראיונות בתהליך הגיוס?","a":"משחקי תפקידים","w":["מכתב פטור מהרופא","שיחה עם קצין בכיר","קורס הכנה לצבא"],"e":"הכינו את ת׳ לראיונות בעזרת משחקי תפקידים, עד שהיה נינוח ורגוע. הוא לא קיבל מכתב פטור."},{"q":"איזו שאלה המאמר מעלה לגבי המטפלת עצמה?","a":"איך האמונות שלה משפיעות","w":["אם היא מומחית מספיק","אם היא צריכה יותר שכר","אם היא צריכה להפסיק"],"e":"המאמר מעלה שאלה רפלקטיבית: איך האמונות של המטפלת, כמו חשיבות התרומה למדינה, משפיעות על ההכוונה שלה. השאלה לא נוגעת למומחיות שלה."}]},
"q31":{"t":"t6","v":[{"q":"איזה מהבאים לא נמנה בגורמים שסייעו לטיפול?","a":"טיפול תרופתי","w":["אבחנה בדרגה קלה","שיתוף פעולה של ההורים","שיתוף פעולה של הצוות החינוכי"],"e":"הגורמים שסייעו לטיפול היו אבחנה בדרגה קלה, שיתוף פעולה של ההורים ושל הצוות החינוכי, וגיוס המטופל מהמפגש הראשון. לא היה טיפול תרופתי."},{"q":"מהו ״המשולש הטיפולי״ במאמר?","a":"מטופל, מטפלת והורים","w":["מטופל, מורה ויועצת","מטפלת, צבא ובית ספר","מטופל, אח וחבר"],"e":"״המשולש הטיפולי״ הוא קשר טוב בין שלושה: המטופל, המטפלת וההורים. המורה והיועצת אינם חלק ממנו."}]},
"q32":{"t":"t6","v":[{"q":"המטפלת השתמשה במראה, בכלבה ובסרטים. מה מאפיין את הסגנון הזה?","a":"שימוש במה שיש בסביבה ובמה שהמטופל מביא","w":["הקפדה על פרוטוקול קבוע לכל מפגש","טיפול בעיקר בדיבור על העבר","שימוש בשאלונים סטנדרטיים בלבד"],"e":"המטפלת השתמשה במה שיש בסביבה ובמה שת׳ הביא, בגישה של ״כאן ועכשיו״. היא לא עבדה לפי פרוטוקול קבוע."},{"q":"איזה סימן להתקדמות הופיע כבר בשנה השנייה?","a":"חיוך, צחוק והומור","w":["ציונים גבוהים במבחנים","הפסקת הטיפול מרצונו","גיוס לצבא בגיל 18"],"e":"כבר בשנה השנייה הופיעו אצל ת׳ חיוך, צחוק והומור, כלומר שינוי בהבעה הרגשית. הגיוס הגיע רק בסוף."}]},
"q33":{"t":"t6","v":[{"q":"מה הראו מבחני ההבנה החברתית ושיפוט המציאות?","a":"מתחת לממוצע בהתחלה, ובממוצע בסוף","w":["מעל הממוצע כבר בתחילת הטיפול","אין שינוי בין ההתחלה לבין הסוף","ירידה בציונים במהלך הטיפול"],"e":"במבחני ההבנה החברתית ושיפוט המציאות ת׳ היה מתחת לממוצע בתחילת הטיפול, ובממוצע בסופו. זה שיפור, ולא ״אין שינוי״."},{"q":"איזה מהבאים הוא מדד להערכת הטיפול במאמר?","a":"ת׳ הגיע ברצון ובעקביות ארבע שנים","w":["ת׳ קיבל תרופה פעם ביום","ת׳ עבר לבית ספר מיוחד","ת׳ סיים את הטיפול אחרי חודש"],"e":"אחד המדדים להערכת הטיפול הוא שת׳ הגיע ברצון ובעקביות במשך ארבע שנים. גם דיווחים מהצוות החינוכי שימשו מדד. הוא לא קיבל תרופה."}]},
"q34":{"t":"t6","v":[{"q":"מה מראה המקרה על תפקיד המטפל במעברים בחיים?","a":"שהוא צריך להתערב, להסביר ולהכווין","w":["שעליו להימנע מכל התערבות","שהמעברים לא קשורים לטיפול","שההורים צריכים לעשות הכול לבד"],"e":"המקרה מראה שבמעברים בחיים (תיכון, עבודה, צבא) המטפל צריך להתערב, להסביר ולהכווין. לא להימנע מהתערבות."},{"q":"מה העיקרון שעולה מבחירת המטרה הראשונה?","a":"לגייס דרך בעיה דחופה וחוזקות","w":["להתחיל מהבעיה הקשה ביותר","לתת להורים לבחור את המטרה","להתחיל מאבחון חוזר ומקיף"],"e":"העיקרון הוא לגייס את המטופל דרך בעיה דחופה ודרך החוזקות שלו, כך שהפתרון יביא רווחה מורגשת. לא להתחיל מהבעיה הקשה ביותר."}]},
"h1":{"t":"t1","v":[{"q":"ההורים של ת׳ ביקשו אבחון חדש. מה הייתה עמדת המטפלת, ומה עשתה?","a":"העדיפה לטפל, וניצלה את האבחון לחיזוק הקבלה של ההורים","w":["סירבה לאבחן והפנתה את ההורים לרופא מומחה","אבחנה מחדש וגילתה שאין לו אספרגר","העדיפה לאבחן מחדש, כי האבחנה מגיל הגן לא הייתה ידועה להורים"],"e":"היא חשבה שצריך לטפל בקשיים ולא לאבחן שוב, אבל כשההורים התעקשו השתמשה בתהליך כדי לחזק הבנה וקבלה רגשית."}]},
"h2":{"t":"t2","v":[{"q":"ת׳ הכחיש שהוא משמיע קולות בכיתה. מה העיקרון שמאחורי הטבלה שהמטפלת נתנה לו?","a":"לעקוף התנגדות בעזרת הדייקנות שלו כחוזק","w":["להוכיח לו בעזרת נתונים כתובים שהוא טועה","ללמד אותו לזהות רגשות של חבריו לכיתה","להעביר את האחריות לבעיה לצוות החינוכי"],"e":"במקום ויכוח, היא השתמשה בדייקנות (ובנוקשות) שלו. הוא רשם, לא היו הערות, והבעיה הדחופה נפתרה."}]},
"h3":{"t":"t3","v":[{"q":"ת׳ לא הבין שחבר שאמר ״כן, בטח״ בטון מסוים התכוון ל״לא״. לאיזה קושי תיאורטי זה מתאים, ואיזו טכניקה עבדה עליו?","a":"תאוריה של הנפש; תרגול טון והקשר ותסריטים","w":["עצמי חווה; עבודה מול מראה על שפת גוף והבעות","גמישות קוגניטיבית; הכנה מראש למעברים","תאוריה של הנפש; המללת תחושות בטן"],"e":"קריאת כוונות של אחרים = תאוריה של הנפש (ג׳ורדן ופאואל). עבדו על טון, הקשר ותסריטים מתמונות."}]},
"h4":{"t":"t3","v":[{"q":"ת׳ הסכים להמשיך טיפול בקיץ רק כדי לא לפגוע במטפלת. מה היא עשתה, ולמה?","a":"המלילה את רגשותיו ושחררה אותו, כדי לתרגל אסרטיביות","w":["הסכימה להמשיך, כדי לא לשבור את הרצף הטיפולי","הפסיקה את הטיפול לגמרי, כי הוא כבר לא היה צריך אותו","פנתה להורים, כדי שהם יחליטו במקומו מה טוב לו"],"e":"זו עבודה על ה״יס־מן״: לזהות את הרצון האמיתי ולהביע אותו. היא אפשרה חופשה בתנאי שבעתיד יגיד מה הוא רוצה."}]},

const SUM=`<h2>סיכום: טיפול בנער עם תסמונת אספרגר (תיאור מקרה)</h2>
<div class="key"><b>על מה מדובר?</b> המאמר מתאר טיפול פסיכולוגי שנמשך יותר מארבע שנים עם נער בשם ת׳, שאובחן כבר בגן עם <b>אספרגר קל</b>. הטיפול היה <b>אקלקטי</b>: המטפלת לקחה טכניקות מכמה גישות, ולא עבדה רק עם ת׳, אלא גם עם <b>המשפחה</b>, עם <b>הכיתה</b> ועם <b>הצוות החינוכי</b>. ההתחלה הייתה במטרה אחת קטנה, ומשם התקדמו להבנת האחר, להבנת העצמי, ולמעברים גדולים כמו תיכון וגיוס לצבא. מה עזר: המוטיבציה של ת׳, משפחה שמשתפת פעולה, וקשר טוב בין המטפלת, ת׳ והוריו. בסוף הטיפול ת׳ עבר מתפקוד <b>נמוך מהממוצע</b> בהבנה חברתית לתפקוד <b>בטווח הממוצע</b>.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>טיפול אקלקטי</b></td><td>טיפול שלוקח טכניקות מכמה גישות.</td></tr>
<tr><td><b>תאוריה של הנפש</b></td><td>היכולת לנבא מה אחרים יעשו ולהבין כוונות ורגשות.</td></tr>
<tr><td><b>גמישות מחשבתית</b></td><td>לראות כמה אפשרויות, ולא ״ראש בנתיב אחד״.</td></tr>
<tr><td><b>אסרטיביות</b></td><td>לומר מה רוצים, גם ״לא״, בלי לפגוע.</td></tr>
<tr><td><b>משולש טיפולי</b></td><td>הקשר בין המטופל, המטפלת וההורים.</td></tr>
<tr><td><b>כאן ועכשיו</b></td><td>לעבוד עם מה שקורה בחדר באותו רגע.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: ת׳ עצמו</h3>
<p>זה תיאור מקרה, ולכן הדוגמה היא ת׳. נעקוב אחריו מהפגישה הראשונה בגיל 12 ועד הגיוס לצה״ל, ובכל שלב נשאל: מה המטפלת עשתה, ולמה.</p>

<h3>1. הפגישה הראשונה והאבחנה</h3>
<ul>
<li>ת׳ הגיע בגיל 12 עם הוריו ל<b>אבחון פסיכו־דידקטי</b> בגלל קשיים חברתיים, בהמלצת בית הספר. הוא היה בודד ודחוי, ילדים צחקו עליו והציקו לו.</li>
<li>בפגישה ישב <b>נוקשה וזקוף</b>, כמעט בלי קשר עין, ענה ״ככה״ בטון מונוטוני, והתעניין כמעט רק במטוסים ובחלל.</li>
<li>התברר שכבר בגיל ארבע וחצי אובחן אצל מומחה כ״אספרגר קל״. מגיל שנתיים וחצי קיבל ריפוי בדיבור וריפוי בעיסוק, ולמד ב<b>מסגרת רגילה</b> בהצלחה.</li>
<li>המטפלת אמרה להורים שעדיף <b>לטפל</b> בקשיים מאשר לאבחן שוב. ההורים התעקשו על האבחון, והיא ניצלה אותו כדי לעזור להם להבין ו<b>לקבל רגשית</b> את האבחנה.</li>
</ul>

<h3>2. ההתחלה: מטרה אחת קטנה, וגיוס הכיתה</h3>
<p>הטיפול לא התחיל ב״לתקן הכל״. ת׳ הכחיש שיש לו בעיה חברתית, אז המטפלת בחרה בעיה אחת, דחופה ומוחשית: בכיתה הוא השמיע קולות, שר ודיבר לעצמו, וזה גרם להצקות ואפילו לאלימות.</p>
<ul>
<li><b>הטריק:</b> ת׳ טען שהוא לא משמיע קולות. במקום להתווכח, ובידיעה שהוא מדייק מאוד, המטפלת ביקשה שירשום בטבלה במשך שבוע כל הערה שקיבל: יום, שעה ותגובה. הוא חזר <b>בלי אף רישום</b>, כי לא העירו לו. המחנכת אישרה שהכיתה רגועה.</li>
<li><b>הרעיון:</b> הדייקנות של ת׳, שאפשר לראות בה נוקשות, הפכה ל<b>נקודת חוזק</b>.</li>
<li><b>גיוס הכיתה:</b> הצוות שוחח עם התלמידים, <b>בלי שת׳ נוכח</b>, על ״החוש החברתי״: כמו שמי שהראייה שלו נפגעה נעזר במשקפיים, מי שהחוש החברתי שלו נפגע נעזר בחברים. התוצאה: ההצקות פסקו, הזמינו אותו לפעילויות, וילד אחד אפילו בא לאסוף אותו מהבית.</li>
</ul>

<h3>3. העבודה עם ת׳: להבין את האחר</h3>
<p>ידע חברתי לא לומדים באף בית ספר. המטפלת נשענה על שלושה רעיונות תאורטיים:</p>
<div class="tw"><table><tr><th>רעיון</th><th>מה הקושי</th></tr>
<tr><td><b>תאוריה של הנפש</b> (ג׳ורדן ופאואל)</td><td>קושי לנבא מה אחרים יעשו, לקרוא כוונות ולהסביר רגשות</td></tr>
<tr><td><b>הובסון</b></td><td>כדי להבין אחרים צריך להגיב באופן טבעי לרגשות ולהבעות שלהם</td></tr>
<tr><td><b>״עצמי חווה״</b></td><td>קושי לחוות אירועים באופן אישי ולזכור אותם, ולכן צריך מבנה ברור</td></tr></table></div>
<p>ובפועל, מה עשו בחדר:</p>
<ul>
<li><b>תמונות מעיתונים:</b> ת׳ הביא תמונות, ודיברו על ההבעות. ״למה היא בוכה? מה קרה לפני?״</li>
<li><b>סיפורים עם כמה סופים</b>, כדי לפתח <b>גמישות מחשבתית</b>. לפי <b>אטווד</b>, לאנשים עם אספרגר יש לעתים קרובות ״ראש בנתיב אחד״.</li>
<li><b>טון והקשר:</b> ת׳ למד שלפעמים אומרים ״כן״ ומתכוונים ״לא״.</li>
<li><b>שיחות:</b> בהתחלה תרגול טלפון, ואחר כך ת׳ הביא בעצמו נושא לכל מפגש. מה שהתחיל כחובה הפך להרגל.</li>
<li><b>סרטים:</b> שיחה על דילמות, כמו נקמה מול סליחה.</li>
<li><b>הכלבה של המטפלת:</b> ת׳ ראה איך היא יוצרת קשר, והיא שימשה <b>גשר</b> ביניהם.</li>
</ul>

<h3>4. העבודה עם ת׳: להבין את עצמו</h3>
<ul>
<li><b>מראה:</b> בגיל ההתבגרות דימוי הגוף רגיש. במקום להעיר לו על שפת הגוף הנוקשה, המטפלת נתנה לו להסתכל במראה ולומר בעצמו מה הוא אוהב ומה כדאי לשפר (״סבתא שלי אומרת שאני רשמי״).</li>
<li><b>להגיד ״לא״:</b> ת׳ היה ״יס־מן״, מסכים לכל דבר. הוא למד לזהות את התחושה הפנימית, ולהגיב ב<b>אסרטיביות</b> בלי לפגוע. דוגמה: לפני החופש נראה שהוא מסכים להמשיך טיפול רק כדי לא לפגוע במטפלת. היא אמרה את זה במילים, ונתנה לו לצאת לחופשה, בתנאי שבפעם הבאה יגיד מה הוא באמת רוצה.</li>
</ul>

<h3>5. המשפחה והחברים</h3>
<ul>
<li><b>תפקידים במשפחה:</b> האח הבריא תפקד כמו הורה: גער וחינך, אבל היה רחוק רגשית. המטרה: <b>ההורים יהיו הורים, והאח יחזור להיות אח</b>. הוא למד לתת ביקורת בונה (״אני אומר לך כי אכפת לי ממך״), וקבעו סימנים מוסכמים כמו ״אור אדום״ למצבי מצוקה.</li>
<li><b>הדרכת ההורים:</b> לתרגל בבית (טלפון, יציאות; האב לקח אותו לשחק כדורסל); להתמודד עם נוקשות על ידי <b>אפשרויות בחירה</b>; להעביר אחריות בהדרגה (״טעויות קורות, ולומדים מהן״); ולקנות לו <b>טלפון סלולרי</b>, כי זה כלי לקשר עם בני גילו.</li>
<li><b>חבר עם צרכים מיוחדים:</b> בשנה השנייה ת׳ התחבר לנער אחר שלא היה מקובל. המטפלת חששה ששניהם ״יתקעו בשוליים״. אבל בפועל הקשר <b>חיזק</b> את ת׳: קשר בטוח, והזדמנות <b>לעזור</b> ולא רק להיעזר.</li>
</ul>

<h3>6. דילמות ומעברים</h3>
<ul>
<li><b>לספר לו שיש לו אספרגר?</b> ההורים והצוות ידעו, ולכיתה הסבירו על הקשיים <b>בלי</b> המונח הרפואי. לקראת הצבא המטפלת נכנסה לשיחה בחשש, וגילתה שת׳ כבר שמע את המונח בבית, חיפש באינטרנט, והיה <b>אופטימי</b>. הלקח: לבדוק מה המטופל כבר יודע, ואולי לשתף מוקדם יותר.</li>
<li><b>תיכון:</b> מעברים קשים לאנשים עם אספרגר, ולכן הכינו אותו מראש. במגמת מחשבים חסרו לו 5 נקודות במתמטיקה; המטפלת פנתה ליועצת, והציון הועלה בגלל תפקודו. הוא קיבל תעודת הצטיינות. אבל הוא התקשה להבין למה ויתרו לו (״לפנים משורת הדין״), כי ״התחום האפור״ קשה לו.</li>
<li><b>עבודה בקיץ:</b> חודש במפעל של קרוב משפחה, וקיבל משכורת ראשונה.</li>
<li><b>צה״ל:</b> המטפלת חשבה ש<b>פטור</b> על רקע נפשי עלול להזיק לו בהמשך, ושהצבא הוא מסגרת מובנית. הם התייעצו עם הצבא ועם עמותת אפ״י, ותרגלו ראיונות במשחקי תפקידים. ת׳ גויס, אבל לא לתפקיד קרבי. המטפלת מודה ש<b>האמונות האישיות שלה</b> השפיעו על הכיוון, וזו שאלה שהמאמר מעלה.</li>
</ul>

<h3>7. מה עזר, ואיך יודעים שזה עבד</h3>
<p><b>מה עזר:</b> אבחנה קלה; מטרה הכרחית מהפגישה הראשונה; המוטיבציה וההתמדה של ת׳; הורים שמשתפים פעולה; <b>משולש טיפולי</b> טוב (ת׳, מטפלת, הורים); צוות חינוכי שיישם את ההמלצות; ועבודה עם מה שיש בחדר, ״<b>כאן ועכשיו</b>״ (מראה, כלבה, סרטים, נושאים שת׳ הביא).</p>
<p><b>איך יודעים:</b> ארבע שנים הגיע ברצון; דיווחים טובים מבית הספר; יותר חברים ובאיכות טובה יותר; חיוך כבר בשנה השנייה, ואחר כך הומור; ו<b>במבחנים</b> של הבנה חברתית ושיפוט מציאות עבר מ<b>מתחת לממוצע</b> ל<b>טווח הממוצע</b>.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. ת׳, עם <b>אספרגר קל</b>, טופל יותר מארבע שנים בטיפול <b>אקלקטי</b>: איתו, עם המשפחה, הכיתה והצוות.<br>
2. הטיפול התחיל ב<b>מטרה אחת קטנה</b> (הקולות בכיתה), נעזר בדייקנות שלו כ<b>חוזק</b>, ובגיוס הכיתה בלי שהוא נוכח.<br>
3. בחדר עבדו על <b>הבנת האחר</b> (הבעות, סיפורים עם כמה סופים, טון והקשר) ועל <b>הבנת העצמי</b> (מראה, להגיד ״לא״).<br>
4. במשפחה החזירו את האח <b>מתפקיד הורי</b> לתפקיד של אח, והדריכו את ההורים לתרגל ולהעביר אחריות.<br>
5. הכינו את ת׳ למעברים (תיכון, עבודה, צבא), והוא עבר מ<b>מתחת לממוצע לטווח הממוצע</b> בהבנה חברתית.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להסביר למה התחילו במטרה קטנה, ואיך השתמשו בחוזקות.<br>
• לקשר בין שלושת הרעיונות התאורטיים לבין מה שעשו בחדר.<br>
• לתאר את העבודה עם המשפחה ועם הכיתה.<br>
• להציג את הדילמות: לספר על האבחנה, וגיוס מול פטור.<br>
• למנות מה עזר לטיפול ואיך יודעים שהוא הצליח.</div>

<li><b>השיחה עם הכיתה נעשתה בלי שת׳ נוכח.</b></li>

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function checkBox(t,bi){

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=(dir)=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1,answered=items.filter(x=>x.pick!=null).length;
    show(`<div class="stack quiz exam">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length} · נענו ${answered}`,"יציאה מהמבחן")}
     <div class="q"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div></div>
     <div class="pager">${i?`<button class="ghost" id="pv">${ic("arrowR")}<span>הקודמת</span></button>`:"<span></span>"}<button class="primary" id="nx" ${it.pick==null?"disabled":""}><span>${last?"הגשה ובדיקה":"השאלה הבאה"}</span>${ic("arrowL")}</button></div></div>`,dir);
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home("back");else{bk.dataset.sure=1;bk.querySelector("span").textContent="לחצו שוב ליציאה (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");b.style.setProperty("--i",k);
      b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step("fwd")}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step("back")};
  };step("up");
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
