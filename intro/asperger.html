const T=[
 {id:"t1",icon:"id",title:"ת': הרקע והאבחון",blocks:[
  {h:"על מה המאמר",html:`${def("על מה הנושא",`המאמר מתאר טיפול ארוך בנער עם תסמונת אספרגר. הנושא מכיר לנו את ת' ואת הרקע שלו.<br><b>מה נלמד כאן:</b> על מה המאמר · הפגישה הראשונה · האבחנה`)}<p>תיאור מקרה של <b>טיפול פסיכולוגי פרטני</b> שנמשך יותר מארבע שנים, עם מתבגר שאובחן כבר בגיל הגן כבעל <mark>תסמונת אספרגר</mark> ${E("Asperger")}. בטיפול שולבו <b>באופן אקלקטי</b> טכניקות מגוונות, תוך התייחסות לא רק למטופל אלא גם למשפחתו ולמערכת החינוך.</p>${rem("מה הפך את התהליך ליעיל: <b>המוטיבציה הגבוהה</b> של המטופל להצליח, האהבה והעזרה של המשפחה, והקשר הטוב שנוצר בין המטפלת, המטופל ובני משפחתו.")}`,q:"q1"},
  {h:"הפגישה הראשונה",html:`<p>ת' הגיע בגיל <b>12</b> עם הוריו ל<b>אבחון פסיכו־דידקטי</b> בגלל קשיים חברתיים, בהמלצת בית הספר. התמונה: נער בודד ודחוי, נתון ללעג ולהצקות. בפגישה ישב <b>נוקשה וזקוף</b> וענה באופן מונוטוני \"ככה\".</p>${tiles([["target","עיסוק רב ובלעדי","בכל הקשור למטוסים ולחלל"],["people","קשיים חברתיים","עם בני הגיל"],["hand","נוקשות","בתנועות הגוף"],["x","קשר עין","מינימלי, אם בכלל"]])}`,q:"q3"},
  {h:"האבחנה מגיל הגן",html:`<p>התברר שכבר בגיל <b>ארבע וחצי</b> אובחן \"אספרגר קל\" אצל רופא מומחה. מגיל שנתיים וחצי קיבל טיפולים פרא־רפואיים (ריפוי בדיבור וריפוי בעיסוק), ובהמלצת המומחה המשיך ללמוד <b>במסגרת חינוכית רגילה</b>, והצליח.</p>${def("ההמלצה",`המטפלת הבהירה להורים את הקשר בין האבחנה לבין הסיבה שהגיעו, והביעה דעה שיש צורך <b>לטפל בקשיים</b> במקום לאבחן. ההורים התעקשו על האבחון, ובמהלכו היא חיזקה את ההבנה שלהם ואת ה<b>קבלה הרגשית</b> של האבחנה.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"target",title:"התחלה: מטרה קטנה וגיוס הכיתה",blocks:[
  {h:"מטרה אחת קטנה",html:`${def("על מה הנושא",`הטיפול לא התחיל ב"תיקון הכול", אלא במטרה אחת קטנה, ובגיוס האנשים סביבו.<br><b>מה נלמד כאן:</b> מטרה קטנה · גיוס הכיתה והצוות`)}<p>בפגישה הראשונה ת' ישב <b>זקוף ונוקשה</b> והתכחש לכל צורה למצבו החברתי. המטפלת הציעה <b>מטרה אחת קטנה מאוד</b>: בכיתה ת' השמיע קולות, שרק ודיבר לעצמו, וזה גרר הצקות ואף אלימות.</p>${def("הטריק",`ת' טען שהוא לא משמיע קולות. כדי לעקוף את ההתנגדות, ובידיעה שהוא <b>מדייק</b> מאוד, היא ביקשה ממנו לרשום בטבלה במשך שבוע כל הערה שהופנתה אליו: יום, שעה, תגובה. ת' חזר <b>בלי אף רישום</b>: לא העירו לו. המחנכת אישרה שהכיתה רגועה.`)}${rem("הדייקנות שלו, או אם תרצו הנוקשות, הפכו ל<b>נקודות חוזק</b> שעזרו להשיג את המטרה. הבעיה שנבחרה הייתה <b>דחופה ומערכתית</b>, ופתרונה הביא רווחה לכולם.")}`,q:"q7"},
  {h:"גיוס הצוות החינוכי",html:`<p>התערבות מערכתית הייתה <b>מחויבת המציאות</b>. הצוות שוחח עם התלמידים <b>בלי נוכחותו של ת'</b>, על \"החוש החברתי\":</p>${ex("כמו שלפעמים נפגעים חושים כמו ראייה או שמיעה ומסייעים באמצעים רפואיים, כך כשהחוש החברתי נפגע, <b>החברים</b> הם שיכולים לעזור.")}${tiles([["check","ההצקות פסקו","לחלוטין"],["people","שיתוף","התחילו להזמין אותו לפעילויות. ילד אחד הגיע כל פעם לביתו לקחת אותו"],["hand","ערכים","הכיתה רכשה ערכים של עזרה לזולת"]])}`,q:"q9"}
 ]},
 {id:"t3",icon:"brain",title:"התערבות ברמת הפרט",blocks:[
  {h:"הרקע התאורטי",html:`${def("על מה הנושא",`הלב של הטיפול: לעזור לת' להבין אנשים אחרים, ולהבין את עצמו.<br><b>מה נלמד כאן:</b> הרקע התאורטי · להבין את האחר · שיחות, סרטים וכלבה · להבין את העצמי`)}<p>ידע חברתי לא נלמד באף בית ספר. המטפלת פעלה ב<b>שלושה מעגלים</b>:</p>${fig("circles")}${tiles([["brain","תאוריה של הנפש","ג'ורדן ופאואל: קושי לנבא התנהגות של אחרים, לקרוא כוונות ולהסביר רגשות"],["link","הובסון","כדי שתהיה הבנה בין־אישית, צריך להגיב באופן טבעי לרגשות, להבעות ולמעשים של אחרים"],["id","\"עצמי חווה\"","קושי לחוות אירועים באופן סובייקטיבי ולזכור אותם. לכן צריך מבנה ברור והדגשה"]])}`,q:"q11"},
  {h:"להבין את האחר",html:`${tiles([["doc","תמונות מעיתונים","ת' הביא תמונות, ושוחחו על הבעות ורגשות. אחר כך יצרו שיחה או תסריט: מה קרה לפני, למה היא בוכה"],["copies","קלפים וסיפורים","בניית סיפור עם כמה סיומים אפשריים, כדי לפתח <b>גמישות מחשבתית</b>"],["hand","משחקי תקשורת","דיבור גב אל גב או פנים אל פנים, פנטומימה ופתגמים"],["question","טון והקשר","ת' למד שלפעמים אומרים \"כן\" ומתכוונים \"לא\". כמה מבלבל!"]])}${rem("לפי אטווד, לאדם עם אספרגר יש לעתים קרובות קושי ב<b>גמישות קוגניטיבית</b>: \"ראש בנתיב אחד\". לכן תרגלו כל פעם מצב חיים והעלו כמה פתרונות חלופיים.")}`,q:"q13"},
  {h:"שיחות, סרטים וכלבה",html:`${tiles([["phone","מיומנויות שיחה","תרגול שיחות טלפון ופנים אל פנים, בתפקידים שונים. בשלב מתקדם: להביא בעצמו נושא לכל מפגש. משימה שהתחילה כחובה הפכה למיומנות טבעית"],["chart","סרטים","שיחות על דמויות, דילמות ושינויים, למשל בסרט \"בעולם טוב יותר\": נקמה מול סלחנות, ומחיר של הבעת דעה שונה מהרוב"],["hand","הכלבה","ת' צפה באיך הכלבה יוצרת קשר ולמד להבחין בניואנסים. הכלבה שימשה <b>גשר לקשר</b>"]])}`,q:"q15"},
  {h:"להבין את העצמי",html:`<p>בגיל ההתבגרות דימוי הגוף רגיש מאוד. איך לשפר שפת גוף נוקשה בלי לפגוע? בעזרת <b>מראה</b> בקליניקה: ת' תיאר מה הוא אוהב במראהו וזיהה בעצמו מה טעון שיפור (\"סבתא שלי אומרת שאני רשמי\").</p>${def("המללת תחושות בטן",`ת' היה \"יס־מן\": קיבל את דעת האחר ולא הביע את רצונו. הוא למד לזהות את <b>הסימנים המקדימים</b>, לחזק את \"הקולות הפנימיים\", ולהגיב <b>באסרטיביות</b>, כולל אמירת \"לא\" שאינה פוגעת.`)}${ex("לקראת החופש הגדול נראה שהוא מסכים להמשיך טיפול רק כדי לא לפגוע במטפלת. היא המלילה את רגשותיו ואפשרה לו לצאת לחופשה, בתנאי שבעתיד יביע את רצונו האמיתי.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"people",title:"המשפחה וחברים",blocks:[
  {h:"התערבות במשפחה",html:`${def("על מה הנושא",`הטיפול לא נעשה רק בחדר: הוא כלל את המשפחה ואת החברים.<br><b>מה נלמד כאן:</b> המשפחה · הדרכת ההורים · חבר עם צרכים מיוחדים`)}<p>במבנה המשפחתי היו קשיי תקשורת בין־אישיים, והאח הבריא <b>מילא תפקיד הורי</b>: גער וחינך את ת', אבל היה רחוק ממנו רגשית.</p>${tiles([["cycle","להחזיר תפקידים","ההורים ימלאו תפקיד הורי, והאח יחזור להיות אח, ויתחבר אל ת' כאח"],["hand","ביקורת בונה","האח קיבל כלים: \"אני אומר לך כי אכפת לי ממך\""],["link","סימנים מוסכמים","למשל \"אור אדום\" למצבי מצוקה, כדי שהמציק יפסיק"]])}`,q:"q19"},
  {h:"הדרכת ההורים",html:`${tiles([["phone","תרגול בבית","שיחות טלפון, יציאה לפעילויות. האב לקח אותו לשחק כדורסל"],["copies","להתמודד עם נוקשות","להציע אפשרויות בחירה: \"אם אתה עייף תלך לישון, ואם לא, אפשר לצפות בטלוויזיה\""],["sprout","עצמאות","בהדרגה קיבל תפקידים: לענות לטלפון, לחכות בתור. \"טעויות קורות, ולומדים מהן\""],["phone","טלפון סלולרי","ההורים הבינו שהוא כלי חשוב לתקשורת עם בני הגיל, וקנו לו"]])}`,q:"q21"},
  {h:"חבר עם צרכים מיוחדים",html:`<p>בשנה השנייה ת' יצר קשר עקבי עם נער אחר עם צרכים מיוחדים, שלא היה מקובל בחברה.</p>${def("הדילמה",`לתמוך בחברות, או לחשוש ש<b>שניהם בשולי החברה</b> וזה ימנע מת' קשרים \"בריאים\" יותר?`)}${rem("התוצאה, בניגוד לחששות המטפלת: הקשר <b>חיזק</b> את ת'. הוא חווה קשר חיובי ולא מאיים, וקיבל הזדמנות <b>לעזור ולא רק להיעזר</b>.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"scales",title:"דילמות ומעגל החיים",blocks:[
  {h:"לקרוא לילד בשמו?",html:`${def("על מה הנושא",`לאורך השנים עלו דילמות: האם לתת לבעיה שם, ואיך עוברים לתיכון, לעבודה ולצבא.<br><b>מה נלמד כאן:</b> לקרוא לילד בשמו · מעברים · הגיוס לצה"ל`)}<p>האם לספר לת' שיש לו אספרגר? ומתי? ההורים, המחנכת והיועצת ידעו. לאחיו ולתלמידי הכיתה הסבירו על <b>הקשיים</b>, בלי המינוח הרפואי.</p>${def("ההפתעה",`לקראת הצבא, המטפלת נכנסה לשיחה בחשש. אבל ת' כבר <b>שמע את המונח</b> בבית, חיפש באינטרנט, הבין במה מדובר, וגילה <b>אופטימיות</b>: הבין שהמצב בר שיפור.`)}${rem("הלקח של המטפלת: חשוב לבדוק את הבנת המטופל ולשתף אותו במינוח, \"ואולי יפה שעה אחת קודם\".")}`,q:"q25"},
  {h:"מעברים: תיכון ועבודה",html:`<p>מעברים ומצבים חדשים קשים לאדם עם אספרגר (אטווד). צריך שיחות הכנה ותרגול, הכנה של ההורים, ולפעמים התערבות במערכת.</p>${tiles([["grad","מגמת מחשבים","חסרו לו 5 נקודות במתמטיקה. המטפלת פנתה ליועצת, והציון הועלה בזכות תפקודו המצוין. הוא קיבל <b>תעודת הצטיינות</b> כבר במחצית הראשונה"],["question","התחום האפור","ת' התקשה להבין שנכנס \"לפנים משורת הדין\". זה מאפיין של אספרגר, ולכן צריך ליווי מתמיד"],["building","עבודה בקיץ","חודש במפעל של קרוב משפחה, בסביבה תומכת. משכורת ראשונה"]])}`,q:"q27"},

  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});

function bar(title,n,i,label){

function topic(ti,bi){

  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
