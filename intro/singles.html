<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: רווקים ורווקות באי־החלטיות מתמשכת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"למה לחקור רווקות כהחלטה",blocks:[
  {h:"השאלה של המחקר",html:`${def("על מה הנושא",`למה מחקר על רווקות מתייחס אליה כאל <b>החלטה</b>, ולא רק כאל מצב? הנושא מציג את השאלה ואת ההקשר: החברה הדתית, והדמיון לבחירת מקצוע.<br><b>מה נלמד כאן:</b> שאלת המחקר · רווקות בחברה הדתית · ההקבלה לבחירת קריירה`)}<p>המחקר בודק <b>קשיים מתמשכים בקבלת החלטה</b> על התחייבות לזוגיות ארוכת טווח. מחקרים קודמים התמקדו במשתני רקע (תרבות, מעמד, מוצא) או בקווי אישיות (כמו דפוסי היקשרות), אבל לא ב<b>תהליך קבלת ההחלטה</b> עצמו.</p>${rem("בשלב הרווקות ההחלטה חוזרת שוב ושוב: האם להמשיך את הקשר, אולי לפני כל פגישה. זה תהליך מתמשך ורב־שלבי, עם ממדים קוגניטיביים, רגשיים ואישיותיים.")}${ex("מתחילת שנות ה-2000 מצטברים דיווחים על התארכות הרווקות, בגלל דחייה וביטול חוזרים של ההחלטה להתחייב. וזה למרות שהרווקים עצמם מצהירים על רצון עז, ואפילו דחוף, להינשא.")}`,q:"q1"},
  {h:"רווקות בתרבות ובחברה הדתית",html:`<p>לפי להד ושושנה (2012), בתרבות הפופולרית רווקות מוצגת כ<b>בעיה וחוסר</b> (\"לא נשוי\"), ונישואין כקטגוריה עם זכויות יתר מובנות מאליהן.</p>${tiles([["people","מוטיבציה גבוהה","באוכלוסייה הדתית המוטיבציה להתחתן בולטת, עם משמעויות אישיות וחברתיות כבדות"],["x","הסברים חילוניים לא עובדים","מגורים משותפים לפני נישואין, למשל, לא מסבירים רווקות מאוחרת בחברה הדתית"],["target","לכן המדגם","דתיים: שם הפער בין הרצון להינשא לבין העיכוב חד במיוחד","החוקרים בחרו קבוצה שבה הבעיה בולטת במיוחד: רצון חזק להתחתן, ובכל זאת עיכוב. כך קל יותר לראות את התופעה.","אצל יעלי, רווקה דתייה שרוצה מאוד להתחתן, הפער בין הרצון למצב בפועל מורגש מאוד."]])}`,q:"q3"},
  {h:"ההקבלה לבחירת מקצוע",html:`<p>בחירת מקצוע נחקרה לעומק, בניגוד לבחירת זוגיות. שילה ושנהב־שפר (2004) הראו נקודות דמיון רבות בין שני התחומים:</p>${tiles([["target","חשיבות","החלטה משמעותית מאוד","אחד ההסברים לקושי: ההחלטה על בן זוג נתפסת כהחלטה גדולה מאוד, ולכן קשה יותר להכריע.","יעלי מרגישה שאם תבחר לא נכון, זה ישפיע על כל חייה, ולכן היא מהססת."],["copies","הרבה אפשרויות","מורכבת, עם הרבה אפשרויות היפותטיות","גם ההחלטה על קריירה וגם ההחלטה על בן זוג הן החלטות מורכבות, עם המון אפשרויות ״על הנייר״. קשה לדעת מראש איזו מהן נכונה, ולכן קל להתלבט.","יעלי פוגשת בחור נחמד, אבל תמיד מחשבה אחת מטרידה אותה: ״אולי יש מישהו מתאים יותר?״."],["chart","רב־ממדית","ומעסיקה ומטרידה צעירים רבים"],["id","זהות","שתיהן נדבך מרכזי בגיבוש הזהות ובסיפוק בחיים הבוגרים","הבחירה בבן זוג ובקריירה היא חלק מרכזי בשאלה ״מי אני?״ בבגרות, ומשפיעה על הסיפוק בחיים. לכן ההחלטה מרגישה כבדה כל כך.","ליעלי ההחלטה על בן זוג מרגישה כמו החלטה על כל העתיד שלה, ולא רק על הקשר הזה."]])}`,q:"q5"}
 ]},
 {id:"t2",icon:"brain",title:"מודל קר\"ב: מקורות אי־ההחלטיות",blocks:[
  {h:"מקוגניציה לרגש",html:`${def("על מה הנושא",`מה גורם לאדם להתקשות להחליט? הנושא מציג את מודל קר"ב, שמסביר את הקושי דרך רגשות ואישיות ולא רק דרך חוסר מידע.<br><b>מה נלמד כאן:</b> מקוגניציה לרגש · מודל קר"ב · שלושה אשכולות`)}<p>גטי, קראוז ואוסיפו (1996) פיתחו טקסונומיה מבוססת של קשיי החלטה בבחירת מקצוע, אבל היא מתמקדת בעיקר בקשיים <b>קוגניטיביים</b> (איסוף ועיבוד מידע).</p><p>מחקרים עדכניים מראים שגם גורמים <b>רגשיים ואישיותיים</b> מעורבים: הערכה עצמית נמוכה, חוללות עצמית נמוכה, מיקוד שליטה חיצוני, חרדה, זהות לא מגובשת וקושי בהיפרדות מאחרים משמעותיים.</p>${def("מושג מפתח",`<mark>מודל קר\"ב</mark>, קשיים רגשיים בהחלטה (סקה, 2005): 11 קטגוריות של <mark>אי־החלטיות מתמשכת</mark> ${E("Indecisiveness")}, שמתקבצות ל<b>שלושה אשכולות</b>.`)}${ex(`רווקה שיודעת בדיוק מה היא מחפשת ויש לה המון הצעות, ועדיין לא מצליחה להחליט, כי היא מפחדת "לטעות לכל החיים". הבעיה כאן רגשית, לא חוסר מידע.`)}`,q:"q7"},
  {h:"שלושת האשכולות",html:`${clustersTable}${rem("החוקרים בחרו במודל קר\"ב ולא במודל של גטי, כי בחירת בן זוג מערבת הרבה גורמים <b>רגשיים</b>, ומודל גטי חסר אותם.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"scales",title:"איך מגיבים לחוסר שביעות רצון",blocks:[
  {h:"שלושה שלבים בדרך לנישואין",html:`${def("על מה הנושא",`מה עושים כשלא מרוצים מבן זוג או מהיכרות? הנושא מציג את המודל של רוזבולט, ואת ההשערות של המחקר.<br><b>מה נלמד כאן:</b> שלושה שלבים · שני צירים: בנייה מול הרס, אקטיבי מול פסיבי · ההשערות`)}${tiles([["target","1. זיהוי","זיהוי ראשוני של בני זוג שעשויים להתאים"],["link","2. פגישה","החלטה לצאת לפגישת היכרות"],["cycle","3. להמשיך?","רצף חוזר של החלטות: להמשיך או לסיים"]])}<p>בשלב השלישי, תסכול וחוסר שביעות רצון יכולים \"להציף\" מאפיינים תפיסתיים, רגשיים ואישיותיים שישפיעו על ההחלטה.</p>`,q:"q11"},
  {h:"המודל של רוזבולט",html:`${fig("rusbult")}<p>רוזבולט ועמיתיה מיינו תגובות לחוסר שביעות רצון לפי שני צירים: <b>בנייה מול הרס</b> ו<b>אקטיביות מול פסיביות</b>. הרעיון: החלטות מתקבלות כדי להגדיל רווח נפשי ולהקטין הפסדים.</p>${def("מה נחשב לא מקדם",`תגובות <b>פסיביות או הרסניות</b> הן תגובות של אי־החלטיות. הן פוגעות פעמיים: גם בקשר וגם בשביעות הרצון של האדם, ומוסיפות לתסכול.`)}${ex(`נניח שמשהו מפריע לך בבן הזוג. <b>תגובה בונה ואקטיבית</b>: לדבר איתו על זה. <b>תגובה פסיבית</b>: לחכות שזה "יסתדר לבד". <b>תגובה הרסנית</b>: להתעלם, לבקר וליצור ריחוק.`)}`,q:"q13"},
  {h:"ההשערות",html:`<p><b>המשתנה הבלתי תלוי:</b> מידת אי־ההחלטיות (ושלושת האשכולות). <b>המשתנה התלוי:</b> דפוס התגובה לחוסר שביעות רצון.</p>${tiles([["chart","השערה 1","יותר אי־החלטיות ← יותר תגובות הרסניות ופסיביות, פחות הבעה","החוקרים שיערו שמי שמתקשה להחליט יגיב לבעיות בקשר בדרכים פחות טובות: יוותר או ייפגע בקשר, ופחות ידבר על הבעיה.","כשמשהו מפריע ליעלי בקשר, היא לא אומרת כלום, ומחכה שהקשר ״יתפרק מעצמו״."],["x","השערה 2","יותר תפיסות פסימיות ← יותר תגובות הרסניות","מי שמסתכל על הקשר בעיניים פסימיות, צפוי להגיב בדרכים שפוגעות בקשר.","יעלי בטוחה ״שזה ממילא לא יחזיק״, ולכן מסיימת את הקשר אחרי ריב קטן."],["clock","השערה 3","יותר חרדה ← יותר תגובות פסיביות","מי שחרד צפוי להגיב בפסיביות: לא לעשות כלום, ולחכות שהבעיה תיעלם.","יעלי חוששת מעימות, ולכן לא מעלה את מה שמציק לה."],["id","השערה 4","יותר קושי בתפיסה עצמית וזהות ← יותר תגובות פסיביות","מי שלא בטוח מי הוא ומה הוא רוצה, צפוי להגיב בפסיביות, כי קשה לו לדעת מה לבקש.","יעלי לא בטוחה מה חשוב לה בבן זוג, ולכן לא יודעת מה לשנות בקשר."]])}`,q:"q15"}
 ]},
 {id:"t4",icon:"flask",title:"השיטה",blocks:[
  {h:"המשתתפים",html:`${def("על מה הנושא",`איך המחקר נבנה: מי השתתפו ובאילו שאלונים השתמשו.<br><b>מה נלמד כאן:</b> משתתפים · שאלון קר"ב לבחירת בן זוג · שאלון התגובות`)}${tiles([["people","213 משתתפים","49 גברים ו-164 נשים, גילאי 19 עד 48 (ממוצע 26)"],["id","רווקים דתיים","בתהליך היכרויות לנישואין כבר כמה שנים (ממוצע כ-4.75)","המחקר נעשה על רווקים דתיים שנמצאים בתהליך היכרויות לנישואין כבר כמה שנים, בממוצע כ־4.75 שנים. זו אוכלוסייה שבה ההיכרויות מכוונות מראש לנישואין.","יעלי יוצאת לפגישות דרך שדכנית כבר ארבע שנים, וכל פגישה נבחנת כ״האם זה הוא?״."],["clock","התחילו בגיל 21","בממוצע. גברים מעט מאוחר יותר מנשים","נתון על המשתתפים: בממוצע הם התחילו לצאת לפגישות בגיל 21.","זה עוזר להבין כמה זמן הם כבר בתהליך החיפוש."]])}<p>גויסו בשיטת \"חבר מביא חבר\" ובמודעות באתרי היכרויות לציבור הדתי. מילאו את השאלונים <b>באינטרנט, באופן אנונימי</b>.</p>`,q:"q17"},
  {h:"הכלים",html:`${def("שאלון קשיים רגשיים בבחירת בן זוג",`הותאם משאלון בחירת <b>קריירה</b> (53 פריטים). למשל: \"רוב האנשים אינם מרוצים מחייהם המקצועיים\" הפך ל\"רוב האנשים אינם מרוצים מחיי הנישואין שלהם\". סולם 1 עד 9.`)}${tiles([["check","מהימנות גבוהה","במחקר מקדים עם 41 רווקים: α = .95 למדד הכולל"],["chart","ניתוח גורמים מאשש","(CFA) אישש את שלושת האשכולות, כמו בבחירת מקצוע","בדיקה סטטיסטית שבודקת אם השאלות באמת מתחלקות לקבוצות שהחוקרים הניחו מראש. כאן היא הראתה שהקשיים מתחלקים לשלושה אשכולות, כמו בבחירת מקצוע.","כמו לבדוק שבסל הקניות הפריטים באמת מתחלקים לירקות, מוצרי חלב ולחם, ולא לקבוצות אחרות."],["doc","שאלון רוזבולט","28 פריטים על ארבע התגובות. תורגם לעברית"]])}${rem("מהתגובות חושבו מדדים: <b>מידת הקידום</b> (הבעה פחות הזנחה), ושני צירים: <b>אקטיביות־פסיביות</b> ו<b>בנייה־הרס</b>.")}`,q:"q19"},
  {h:"תמונת מצב",html:`${tiles([["x","כ-80%","לא היו בקשר בזמן המילוי","רוב המשתתפים לא היו בקשר בזמן שמילאו את השאלונים. לכן הם ענו על קשרים מהעבר.","יעלי ענתה על השאלון על סמך הקשר האחרון שלה, שהסתיים לפני כמה חודשים."],["chart","7.89 מתוך 9","הרצון להינשא בשנה הנוכחית: גבוה מאוד"],["check","בעיקר הבעה","רוב המשתתפים דיווחו על תגובות אקטיביות ובונות"]])}${ex("גברים דיווחו על תגובות <b>אקטיביות יותר</b> מנשים (הבדל מובהק).")}`,q:"q21"}
 ]},
 {id:"t5",icon:"chart",title:"הממצאים",blocks:[
  {h:"השערות 1 ו-2: אוששו",html:`${def("על מה הנושא",`מה מצאו? הנושא עובר השערה אחר השערה: אילו אוששו, אילו לא, ומה התגלה בדרך.<br><b>מה נלמד כאן:</b> השערות 1 ו-2 · השערות 3 ו-4 · ניתוח הנתיבים`)}${def("השערה 1",`חלוקה לארבע קבוצות לפי רמת אי־ההחלטיות הראתה השפעה מובהקת: ככל שאי־ההחלטיות גבוהה יותר, התגובות <b>פחות מקדמות</b>. <b>אוששה.</b>`)}${def("השערה 2",`ככל שהתפיסות הפסימיות חזקות יותר, הנטייה להגיב <b>באופן הרסני</b> חזקה יותר. גם קושי שנחווה במציאת בן זוג ניבא תגובות הרסניות. <b>אוששה.</b>`)}`,q:"q23"},
  {h:"השערות 3 ו-4: לא, וחלקית",html:`${def("השערה 3",`<b>לא אוששה.</b> לא נמצא קשר בין חרדה לבין פסיביות. מה שכן נמצא: ככל שה<b>רצון להינשא השנה</b> גבוה יותר, הנטייה לפסיביות <b>נמוכה</b> יותר.`)}${def("השערה 4",`<b>אוששה חלקית.</b> הקשר בין קושי בתפיסה עצמית וזהות לבין פסיביות נמצא <b>רק אצל מי שבתהליך היכרויות יותר מ-4 שנים</b>.`)}`,q:"q25"},
  {h:"ניתוח הנתיבים",html:`${fig("path")}${rem("<b>הסדר:</b> התפיסה העצמית \"ממקמת\" את האדם עוד לפני שהוא מגיע להחלטה. ממנה נגזרות התפיסות הפסימיות, והחרדה מתעוררת כשצריך להחליט. תגובת <b>הנאמנות</b> הוצאה מהמודל, כי לא היה לה קשר מובהק לאף אשכול.")}`,q:"q27"}
 ]},
 {id:"t6",icon:"bulb",title:"דיון והשלכות",blocks:[
  {h:"למה הרס \"קל\" יותר",html:`${def("על מה הנושא",`מה התוצאות אומרות, איך מסבירים את ההפתעות, ומה ההשלכות לייעוץ?<br><b>מה נלמד כאן:</b> למה הרס קל יותר · הסברים · השלכות ומגבלות`)}<p>הממצא המרכזי מאפשר לראות בבחירת בן זוג <b>תהליך קלאסי של קבלת החלטות</b>.</p>${tiles([["scales","מודל ההשקעה","תפיסה פסימית מורידה את הרווח הצפוי מהקשר, ולכן שימורו נראה יקר יותר מסיומו","לפי המודל, נשארים בקשר כשהרווח ממנו נראה גבוה. מי שפסימי צופה רווח נמוך, ולכן סיום הקשר נראה ״זול״ יותר.","יעלי חושבת ״ממילא לא נגיע לחתונה״, ולכן לא שווה לה להשקיע בפתרון הריב."],["x","הקלה מהירה","סיום הקשר הוא הדרך הקצרה להפסיק תחושות לא נעימות, ונראה כפתח להיכרויות חדשות","כשקשה, לסיים את הקשר נותן הקלה מיידית, וגם נראה כמו הזדמנות להכיר מישהו חדש. אבל ההקלה קצרה, והבעיה חוזרת.","אחרי ויכוח, יעלי מסיימת את הקשר ומרגישה הקלה, אבל בקשר הבא זה קורה שוב."],["hand","תגובה בונה דורשת כוח","גיוס כוחות נפש ומיומנויות. לבעלי קשיים רגשיים קשה יותר","להתמודד עם קושי בקשר בצורה בונה (לדבר, לפתור) דורש כוחות נפש ומיומנויות. למי שמתמודד עם קשיים רגשיים, קל יותר לסגת ולסיים את הקשר.","כשיש ויכוח ראשון, יעלי מרגישה שאין לה כוח לשיחה הקשה, ומעדיפה לומר ״זה לא זה״."]])}`,q:"q29"},
  {h:"הסברים לממצאים המפתיעים",html:`${tiles([["clock","חרדה תכונתית מול מצבית","עם השנים גדלה החרדה המצבית (\"אני מפסיד זמן\") ודוחפת דווקא לאקטיביות"],["link","היקשרות על שני צירים","חרדה והימנעות. סוגים שונים של היקשרות לא בטוחה מגיבים בצורה שונה, ולכן אין קשר אחיד"],["id","הערכה עצמית בתחום","מתגבשת עם הניסיון. אחרי 4 שנים היא כבר ברורה, ולכן הקשר מופיע רק שם","ההערכה של יעלי את עצמה ״כבת זוג״ מתגבשת עם הניסיון בהיכרויות. אחרי כ־4 שנים היא כבר ברורה, ולכן רק אצל מי שהיה שם זמן כזה נמצא הקשר בינה לבין ההחלטות.","אחרי שנים של פגישות שלא הצליחו, יעלי מתחילה להאמין ש״משהו בי לא בסדר בזוגיות״, וזה משפיע על ההחלטות שלה."]])}${rem("ייתכן שהרצון הגבוה להינשא מושפע מ<b>רצייה חברתית</b>, בגלל הביקורת על רווקים. ייתכן גם שרווקים נוטים לייחס את הקושי לגורמים <b>חיצוניים</b>, כדי להגן על הדימוי העצמי מפני תחושת כישלון.")}`,q:"q31"},
  {h:"השלכות ומגבלות",html:`<p>ככל שהשנים עוברות, הנטייה להגיב באופן הרסני גוברת. לכן מציעים <b>התערבות מוקדמת</b>: תכנית העשרה בבית הספר, מותאמת לאוכלוסיית היעד, בשני מישורים:</p>${tiles([["brain","מישור תפיסתי","מודעות עצמית, התבוננות פנימית, וזיהוי תפיסות לא יעילות (\"הכל מזל\")"],["hand","מישור התנהגותי","תרגול תגובות כמו הבעה, במקום פסיביות והרס"]])}${def("מגבלות",`כ-80% לא היו בקשר, ולכן ענו <b>מזיכרון</b>. כדאי לבדוק מגזרים נוספים (חילוני, חרדי) ולערוך <b>מחקר אורך</b> שישווה בין מי שהתחתנו למי שנשארו רווקים.`)}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מה מבדיל את המחקר הזה ממחקרים קודמים על רווקות מאוחרת?","a":"הוא בודק את תהליך קבלת ההחלטה עצמו","w":["הוא בודק משתני רקע כמו מוצא ומעמד","הוא בודק דפוסי היקשרות בלבד","הוא בודק את התרבות הפופולרית"],"e":"מחקרים קודמים התמקדו במשתני רקע ובאישיות, והמחקר הזה בודק את תהליך קבלת ההחלטה עצמו: למה קשה להחליט להתחייב. דפוסי היקשרות נחקרו כבר קודם."},{"q":"מה המחקר בודק?","a":"קשיים מתמשכים בהחלטה להתחייב לזוגיות","w":["את הסיבות לגירושין בחברה הדתית","את השפעת אתרי ההיכרויות על זוגיות","את ההבדלים בין רווקים לנשואים בעבודה"],"e":"המחקר בודק קשיים מתמשכים בהחלטה להתחייב לזוגיות ארוכת טווח. הוא לא עוסק בגירושין או באתרי היכרויות."}]},
"q2":{"t":"t1","v":[{"q":"רווק בן 32 אומר שהוא ״רוצה להתחתן כבר השנה״, אבל מסיים כל קשר אחרי שתי פגישות. למה מקרה כזה מעניין את החוקרים?","a":"כי יש פער בין רצון עז לבין דחייה חוזרת של ההחלטה","w":["כי זה מוכיח שהוא לא באמת רוצה להתחתן בכלל","כי זה מראה שאין לו מספיק הצעות מתאימות","כי זה מעיד על בעיה רפואית שלא אובחנה"],"e":"הוא רוצה מאוד להתחתן, ובכל זאת מסיים קשרים שוב ושוב. הפער בין רצון עז לדחייה חוזרת של ההחלטה הוא מה שהמחקר מנסה להבין. זה לא מוכיח שהוא לא רוצה."},{"q":"איך מתוארת ההחלטה בשלב הרווקות?","a":"החלטה שחוזרת שוב ושוב, אולי לפני כל פגישה","w":["החלטה חד־פעמית שמתקבלת בגיל צעיר","החלטה שמתקבלת בעיקר על ידי ההורים","החלטה שמתקבלת רק אחרי שנה של קשר רציף"],"e":"בשלב הרווקות, ההחלטה אינה חד־פעמית: היא חוזרת שוב ושוב, אולי לפני כל פגישה. זה תהליך מתמשך ורב־שלבי."}]},
"q3":{"t":"t1","v":[{"q":"למה החוקרים בחרו דווקא רווקים דתיים?","a":"כי שם הפער בין הרצון לבין העיכוב חד במיוחד","w":["כי קל יותר לגייס אותם למחקר","כי אין ביניהם הבדלים במעמד","כי הם מתחתנים מאוחר יותר מכולם"],"e":"בחברה הדתית המוטיבציה להינשא בולטת במיוחד, ולכן הפער בין הרצון לבין העיכוב חד. כך קל יותר לחקור את קשיי ההחלטה. הבחירה לא נבעה מנוחות הגיוס."},{"q":"איך מוצגת רווקות בתרבות הפופולרית, לפי להד ושושנה?","a":"כבעיה וחוסר","w":["כבחירה חופשית ומכובדת","כשלב טבעי שכולם עוברים","כמצב עדיף על נישואין"],"e":"לפי להד ושושנה, התרבות הפופולרית מציגה רווקות כבעיה וכחוסר: ״לא נשוי״ מוגדר לפי מה שחסר. היא לא מוצגת כבחירה מכובדת."}]},
"q4":{"t":"t1","v":[{"q":"איזה הסבר לרווקות מאוחרת לא מתאים לחברה הדתית?","a":"מגורים משותפים לפני נישואין","w":["קושי בקבלת החלטות","תפיסות פסימיות לגבי זוגיות","חרדה מהתחייבות"],"e":"מגורים משותפים לפני נישואין הם הסבר שמתאים לחברה החילונית, ולא רלוונטי לחברה הדתית. קושי בהחלטה, פסימיות וחרדה מהתחייבות רלוונטיים גם לדתיים."},{"q":"מה הכוונה ב״זכויות יתר מובנות מאליהן״ של נישואין?","a":"נישואין נתפסים כזהות נורמטיבית שזוכה לראויות","w":["לנשואים יש הטבות כספיות מיוחדות בחוק","נשואים מקבלים עדיפות בקבלה לעבודה","נישואין הם חובה דתית ולא יותר מזה"],"e":"״זכויות יתר מובנות מאליהן״ פירושן שנישואין נתפסים כזהות נורמטיבית שזוכה לראויות חברתית. הכוונה איננה להטבות כספיות בחוק."}]},
"q5":{"t":"t1","v":[{"q":"למה בחירת מקצוע היא מודל טוב להבנת בחירת בן זוג?","a":"שתיהן חשובות, מורכבות ומרכזיות לזהות","w":["שתיהן קורות בדיוק באותו גיל בחיים","שתיהן החלטות קלות ומהירות יחסית","שתיהן נקבעות בעיקר על ידי ההורים"],"e":"בחירת מקצוע ובחירת בן זוג הן החלטות חשובות, מורכבות ומרכזיות לזהות, ולכן מודל אחד יכול לעזור להבין את השני. הן לא החלטות קלות."},{"q":"מה לא נמנה כנקודת דמיון בין בחירת מקצוע לבחירת בן זוג?","a":"בשתיהן ההחלטה קלה ומהירה","w":["בשתיהן יש הרבה אפשרויות","שתיהן חשובות מאוד","שתיהן קשורות לגיבוש הזהות"],"e":"שתי הבחירות מורכבות, ולכן ״ההחלטה קלה ומהירה״ אינה נקודת דמיון אלא ההפך. ריבוי אפשרויות, חשיבות וקשר לזהות הם כן נקודות דמיון."}]},
"q6":{"t":"t1","v":[{"q":"מי הראו שאפשר להשתמש במודל בחירת מקצוע להבנת זוגיות?","a":"שילה ושנהב־שפר","w":["גטי, קראוז ואוסיפו","להד ושושנה","רוזבולט ועמיתיה"],"e":"שילה ושנהב־שפר (2004) הראו שאפשר להשתמש במודל של בחירת מקצוע כדי להבין זוגיות. רוזבולט פיתחה את מודל התגובות בקשר."},{"q":"למה חשוב לחקור בחירת בן זוג כהחלטה?","a":"כי היא משפיעה על סיפוק ומימוש עצמי בבגרות","w":["כי היא קלה מאוד למדידה במחקר","כי היא כבר נחקרה לעומק בעבר","כי היא חשובה רק בחברה הדתית"],"e":"בחירת בן זוג משפיעה על סיפוק ומימוש עצמי בבגרות, ובכל זאת, בניגוד לבחירת מקצוע, היא לא נחקרה לעומק כהחלטה."}]},

"q8":{"t":"t2","v":[{"q":"רווקה בטוחה ש״מה שיקרה יקרה, זה לא בידיים שלי״. איזה גורם רגשי־אישיותי זה?","a":"מיקוד שליטה חיצוני","w":["חוללות עצמית גבוהה","הערכה עצמית גבוהה","זהות מגובשת"],"e":"האמונה ש״זה לא בידיים שלי״ היא מיקוד שליטה חיצוני, גורם רגשי־אישיותי שקשור לקשיי החלטה. חוללות עצמית גבוהה היא ההפך: אמונה ביכולת להצליח."},{"q":"מהי חוללות עצמית?","a":"ציפייה להצליח במשימות מוגדרות","w":["הערכה כללית של הערך העצמי","תחושה שהגורל קובע הכול","חרדה מפני החלטות"],"e":"חוללות עצמית היא ציפייה להצליח במשימות מוגדרות. הערכה עצמית היא הערכה כללית של הערך העצמי, מושג רחב יותר."}]},
"q9":{"t":"t2","v":[{"q":"״הגברים היום לא בשלים להתחייבות.״ לאיזה אשכול שייכת המחשבה?","a":"תפיסות פסימיות","w":["חרדה","תפיסה עצמית וזהות","חוללות עצמית"],"e":"״הגברים היום לא בשלים״ היא מחשבה פסימית על התחום כולו, ולכן היא שייכת לאשכול התפיסות הפסימיות. אין בה פחד מתוצאה, ולכן היא לא חרדה."},{"q":"״אני מפחד להתחייב, כי אם זו טעות, הכאב יהיה בלתי נסבל.״ לאיזה אשכול זה שייך?","a":"חרדה","w":["תפיסות פסימיות","תפיסה עצמית וזהות","מיקוד שליטה"],"e":"הפחד מהכאב אם ההחלטה תתברר כטעות הוא חרדה, כאן חרדת תוצאה או אחריות. פסימיות הייתה מחשבה שזוגיות לא תצליח, ולא פחד מהתוצאה."}]},
"q10":{"t":"t2","v":[{"q":"רווק מרגיש שהוא לא יכול להתחייב בלי שההורים שלו יאשרו כל צעד. איזו קטגוריה זו?","a":"קונפליקט היקשרות והיפרדות","w":["פסימיות לגבי התחום","חרדת אי־ודאות מההחלטה","פסימיות לגבי השליטה"],"e":"הצורך באישור ההורים לכל צעד מעיד על קושי להיפרד ולהחליט באופן עצמאי, וזה קונפליקט היקשרות והיפרדות, באשכול התפיסה העצמית והזהות."},{"q":"״זה עניין של מזל, לא של מאמץ.״ איזו קטגוריה זו?","a":"פסימיות לגבי השליטה","w":["חרדת תהליך","יציבות הזהות","פסימיות לגבי התחום"],"e":"״זה עניין של מזל, לא של מאמץ״ היא פסימיות לגבי השליטה בתוצאה, באשכול התפיסות הפסימיות. פסימיות לגבי התחום הייתה מחשבה שזוגיות בכלל לא טובה."}]},
"q11":{"t":"t3","v":[{"q":"באיזה שלב בדרך לנישואין תסכול משפיע במיוחד על ההחלטה?","a":"בשלב ההחלטה אם להמשיך להיפגש","w":["בשלב זיהוי בני זוג אפשריים","בשלב ההחלטה לצאת לפגישה ראשונה","בשלב החתונה עצמה"],"e":"בשלב ההחלטה אם להמשיך להיפגש המאפיינים הרגשיים ״מוצפים״, ולכן שם התסכול משפיע במיוחד. זיהוי בני זוג אפשריים הוא שלב מוקדם יותר."},{"q":"מהם שלושת השלבים בדרך להחלטה להינשא?","a":"זיהוי, פגישה, והחלטה אם להמשיך","w":["היכרות, אירוסין ונישואין","פגישה, משבר ופתרון","חיפוש, בחירה וחרטה"],"e":"שלושת השלבים הם זיהוי בני זוג אפשריים, פגישה, והחלטה אם להמשיך. השלב השלישי הוא רצף שחוזר שוב ושוב."}]},
"q12":{"t":"t3","v":[{"q":"מה הרעיון המוביל במודל של רוזבולט?","a":"מחליטים כדי להגדיל רווח נפשי ולהקטין הפסד","w":["מחליטים בעיקר לפי מה שהמשפחה רוצה","מחליטים רק לפי מידע אובייקטיבי וזמין","מחליטים כמעט באקראי, בלי שיקול מסודר"],"e":"לפי מודל ההשקעה של רוזבולט, אנשים מחליטים כדי להגדיל את הרווח הנפשי ולהקטין את ההפסד. ההחלטה לא נקבעת בעיקר לפי רצון המשפחה."},{"q":"אילו שני צירים מגדירים את ארבע התגובות?","a":"בנייה־הרס, ואקטיביות־פסיביות","w":["רגש־היגיון, ועבר־עתיד","פנימי־חיצוני, וגבוה־נמוך","מהיר־איטי, ואישי־חברתי"],"e":"ארבע התגובות מוגדרות לפי שני צירים: בנייה מול הרס, ואקטיביות מול פסיביות. כל תגובה היא שילוב של שני הצירים."}]},
"q13":{"t":"t3","v":[{"q":"רווקה שמשהו מפריע לה בבן הזוג פונה אליו ומציעה לדבר על זה. איזו תגובה זו?","a":"הבעה","w":["נאמנות","הזנחה","עזיבה"],"e":"פנייה ישירה והצעה לדבר הן תגובה בונה ואקטיבית, כלומר הבעה. נאמנות היא בונה אבל פסיבית: מחכים בלי לפעול."},{"q":"מישהו לא אומר כלום ומחכה ש״הזמן יעשה את שלו״. איזו תגובה?","a":"נאמנות","w":["הבעה","עזיבה","הזנחה"],"e":"לא לומר כלום ולחכות ש״הזמן יעשה את שלו״ היא תגובה בונה ופסיבית, כלומר נאמנות. הבעה הייתה פנייה אקטיבית לבן הזוג."}]},

"q23":{"t":"t5","v":[{"q":"איך נבדקה השערה 1?","a":"חלוקה לקבוצות לפי אי־החלטיות","w":["ראיון אישי עם כל משתתף","השוואה בין גברים לנשים","השוואה בין דתיים לחילוניים"],"e":"השערה 1 נבדקה כך: חילקו את המשתתפים לקבוצות לפי רמת אי־ההחלטיות, והשוו ביניהן במדד הקידום. לא השוו גברים לנשים."},{"q":"מה נמצא לגבי השערה 1?","a":"אוששה במלואה","w":["לא אוששה בכלל","אוששה רק חלקית","נמצא קשר הפוך מהצפוי"],"e":"השערה 1 אוששה במלואה: אי־החלטיות השפיעה באופן מובהק על התגובות בקשר."}]},
"q24":{"t":"t5","v":[{"q":"רווק בטוח ש״אין היום נשים רציניות״. לפי הממצאים, איך הוא צפוי להגיב לחוסר שביעות רצון?","a":"בצורה הרסנית יותר","w":["בהבעה יותר מאחרים","בנאמנות יותר מאחרים","לא תהיה השפעה בכלל"],"e":"״אין היום נשים רציניות״ היא תפיסה פסימית, ולפי השערה 2, שאוששה, פסימיות מנבאת תגובות הרסניות יותר. לא הבעה."},{"q":"איזה משתנה רקע ניבא גם הוא תגובות הרסניות?","a":"קושי שנחווה במציאת בן זוג","w":["הגיל של המשתתף","מספר האחים במשפחה","רמת ההשכלה הפורמלית"],"e":"קושי שנחווה במציאת בן זוג, חוויה מצטברת של כישלונות, ניבא גם הוא תגובות הרסניות. הגיל לא ניבא אותן."}]},
"q25":{"t":"t5","v":[{"q":"מה נמצא לגבי חרדה ופסיביות?","a":"לא נמצא קשר","w":["חרדה ניבאה יותר פסיביות","חרדה ניבאה פחות הבעה","חרדה ניבאה יותר הרס"],"e":"לא נמצא קשר בין חרדה לפסיביות, ולכן השערה 3 לא אוששה. חרדה לא ניבאה יותר תגובות פסיביות."},{"q":"מה כן ניבא פחות פסיביות?","a":"רצון גבוה להינשא השנה","w":["חרדה גבוהה","פסימיות גבוהה","תפיסה עצמית נמוכה"],"e":"רצון גבוה להינשא בשנה הנוכחית ניבא פחות תגובות פסיביות. זה ממצא נוסף שעלה בבדיקת השערה 3."}]},
"q26":{"t":"t5","v":[{"q":"למה השערה 4 אוששה רק ״חלקית״?","a":"כי הקשר נמצא רק אצל מי שבתהליך מעל 4 שנים","w":["כי הקשר נמצא רק אצל הנשים במדגם","כי הקשר נמצא בכיוון הפוך מהצפוי","כי הקשר נמצא רק אצל הצעירים במדגם"],"e":"הקשר בין קושי בתפיסה עצמית לפסיביות נמצא רק אצל מי שבתהליך מעל 4 שנים, ולכן ההשערה אוששה חלקית. הסיבה היא שתפיסה עצמית בתחום מתגבשת עם הזמן."},{"q":"אצל מי נמצא קשר בין קושי בתפיסה עצמית לפסיביות?","a":"אצל מי שבתהליך יותר מ-4 שנים","w":["אצל כולם","אצל מי שבתהליך פחות משנה","אצל גברים בלבד"],"e":"הקשר נמצא רק אצל מי שבתהליך היכרויות יותר מ-4 שנים, ולא אצל כולם. זו ההסתייגות בהשערה 4."}]},
"q27":{"t":"t5","v":[{"q":"לפי ניתוח הנתיבים, מה מגיע ראשון?","a":"תפיסה עצמית וזהות","w":["חרדה","תפיסות פסימיות","התגובה לחוסר שביעות רצון"],"e":"לפי ניתוח הנתיבים, תפיסה עצמית וזהות מגיעות ראשונות. מהן נגזרות תפיסות פסימיות, ומהן חרדה."},{"q":"איזו תגובה הוצאה ממודל הנתיבים, ולמה?","a":"נאמנות, כי לא נמצא לה קשר לאף אשכול","w":["הבעה, כי היא התגובה הנפוצה ביותר","עזיבה, כי היא נדירה יחסית במדגם","הזנחה, כי היא דומה מאוד לעזיבה"],"e":"הנאמנות הוצאה ממודל הנתיבים, כי לא נמצא לה קשר מובהק לאף אחד מהאשכולות. היא לא הוצאה כי היא נדירה."}]},
"q28":{"t":"t5","v":[{"q":"איזה ממצא בניתוח הנתיבים מפתיע לגבי חרדה?","a":"חרדה קשורה דווקא ליותר הבעה","w":["חרדה קשורה ליותר עזיבה","חרדה קשורה ליותר הזנחה","חרדה לא קשורה לשום תגובה"],"e":"בניגוד להשערה, חרדה הייתה קשורה דווקא ליותר הבעה, תגובה אקטיבית ובונה, ולא לפסיביות. זה הממצא המפתיע."},{"q":"לפי ניתוח הנתיבים, מה קשור לתפיסה עצמית נמוכה?","a":"יותר עזיבה והזנחה, פחות הבעה","w":["יותר הבעה ויותר נאמנות","פחות עזיבה ויותר הבעה","רק יותר נאמנות לאורך זמן"],"e":"תפיסה עצמית נמוכה הייתה קשורה ליותר עזיבה והזנחה, ולפחות הבעה, כלומר לתגובות שפחות מקדמות את הקשר."}]},
"q29":{"t":"t6","v":[{"q":"איך מודל ההשקעה מסביר את הקשר בין פסימיות להרס?","a":"פסימיות מורידה את הרווח הצפוי מהקשר","w":["פסימיות מגבירה את הרצון בקשר","פסימיות מגבירה חרדה בלבד","פסימיות לא קשורה לרווח והפסד"],"e":"לפי מודל ההשקעה, פסימיות מורידה את הרווח שאדם מצפה לקבל מהקשר, ולכן שימור הקשר נראה יקר מסיומו. מכאן התגובות ההרסניות."},{"q":"מה מאפשר הממצא המרכזי של המחקר?","a":"לראות בבחירת בן זוג תהליך של קבלת החלטות","w":["לנבא מי יתחתן ומתי בדיוק","להוכיח שרווקות היא בחירה מודעת","לבטל את השפעת התרבות על ההחלטה"],"e":"הממצא המרכזי מאפשר לראות בבחירת בן זוג תהליך קלאסי של קבלת החלטות. המחקר לא מנבא מי יתחתן ומתי."}]},
"q30":{"t":"t6","v":[{"q":"למה תגובות הרסניות שכיחות יותר אצל בעלי קשיים רגשיים?","a":"כי תגובה בונה דורשת כוחות נפש ומיומנויות","w":["כי הם לא באמת רוצים להתחתן","כי הם פוגשים פחות אנשים מאחרים","כי הם צעירים יותר מרוב המשתתפים"],"e":"תגובה בונה, כמו הבעה, דורשת כוחות נפש ומיומנויות. למי שיש לו קשיים רגשיים קל יותר להגיב בהרס, שדורש פחות. זה לא אומר שהוא לא רוצה להתחתן."},{"q":"למה סיום קשר מהר עשוי להיראות מושך?","a":"הוא מפסיק תחושות לא נעימות ופותח הזדמנויות","w":["הוא מגדיל את הרווח הצפוי מהקשר","הוא מראה בגרות רגשית של האדם","הוא מתאים לנורמות בחברה הדתית"],"e":"סיום קשר מהר מפסיק תחושות לא נעימות ופותח הזדמנויות חדשות, ולכן הוא נותן הקלה מהירה. זה לא מעיד על בגרות רגשית."}]},
"q31":{"t":"t6","v":[{"q":"למה חרדה לא ניבאה פסיביות, לפי ההסבר?","a":"עם השנים, חרדה מצבית דוחפת דווקא לפעולה","w":["כי המשתתפים לא חרדתיים בכלל","כי השאלון לא מדד חרדה","כי חרדה תמיד מובילה להרס"],"e":"עם השנים, חרדה מצבית (מהמצב עצמו) דוחפת דווקא לפעולה, ולכן לא ניבאה פסיביות. זה ההבדל בין חרדה תכונתית למצבית."},{"q":"למה הקשר בין תפיסה עצמית לפסיביות הופיע רק אחרי 4 שנים?","a":"הערכה עצמית בתחום מתגבשת עם הניסיון","w":["כי אחרי 4 שנים יש פחות הצעות","כי אחרי 4 שנים הרצון יורד","כי זה מקרי סטטיסטית"],"e":"ההערכה העצמית בתחום הזוגיות מתגבשת עם הניסיון. אחרי 4 שנים היא כבר ברורה, ולכן רק אז נמצא הקשר. זה לא ממצא מקרי."}]},
"q32":{"t":"t6","v":[{"q":"מה עשוי להסביר את הרצון הגבוה מאוד להינשא שדווח?","a":"רצייה חברתית","w":["אפקט תקרה","הטיית זמינות","אפקט רצפה"],"e":"בגלל הביקורת החברתית על רווקים, משתתפים עשויים לדווח על רצון גבוה מהאמיתי. זו רצייה חברתית. אפקט תקרה מתאר ציונים שקרובים למקסימום, אבל לא את הסיבה להם."},{"q":"למה רווקים עשויים לייחס את הקושי לגורמים חיצוניים?","a":"כדי להגן על הדימוי העצמי","w":["כי הגורמים החיצוניים באמת אחראים","כי זה מה שהשאלון שאל","כי הם לא מכירים את עצמם"],"e":"ייחוס הקושי לגורמים חיצוניים מגן על הדימוי העצמי מפני תחושת כישלון. זה לא אומר שהגורמים החיצוניים באמת אחראים."}]},
"q33":{"t":"t6","v":[{"q":"מה ההמלצה המעשית העיקרית?","a":"תכנית העשרה בבית הספר","w":["טיפול תרופתי בחרדה","ייעוץ זוגי אחרי החתונה","הגבלה של אתרי ההיכרויות"],"e":"ההמלצה המעשית העיקרית היא תכנית העשרה בבית הספר, במישור התפיסתי ובמישור ההתנהגותי. אין בה טיפול תרופתי."},{"q":"מה כולל המישור ההתנהגותי בתכנית?","a":"תרגול תגובות של הבעה","w":["זיהוי תפיסות לא יעילות","התבוננות פנימית","מודעות עצמית"],"e":"המישור ההתנהגותי כולל תרגול של תגובות הבעה. זיהוי תפיסות לא יעילות, התבוננות פנימית ומודעות עצמית שייכים למישור התפיסתי."}]},
"q34":{"t":"t6","v":[{"q":"מה המגבלה העיקרית של המחקר?","a":"רובם ענו מזיכרון","w":["המדגם היה גדול מדי","לא נבדקו נשים בכלל","לא נבדקה אי־החלטיות"],"e":"המגבלה העיקרית היא שרוב המשתתפים (כ-80%) לא היו בקשר וענו מזיכרון. המדגם לא היה גדול מדי."},{"q":"איזה מחקר המשך מציעים הכותבים?","a":"מחקר אורך: נשואים מול רווקים","w":["מחקר על זוגות נשואים בלבד","ניסוי מעבדה על פגישות ראשונות","מחקר נוסף על בחירת מקצוע"],"e":"הכותבים מציעים מחקר אורך שישווה בין מי שהתחתנו למי שנשארו רווקים, ומחקר במגזרים נוספים."}]},
"h1":{"t":"t1","v":[{"q":"חוקרת רוצה להסביר רווקות מאוחרת בעזרת כלים מתחום הקריירה. איזה נימוק מהמאמר הכי מצדיק את ההעברה?","a":"בשני התחומים ההחלטה חשובה, רב־ממדית ונוגעת בזהות","w":["בשני התחומים ההחלטה מתקבלת פעם אחת בלבד, ולא חוזרת שוב","בשני התחומים הקושי נובע בעיקר מחוסר מידע","בשני התחומים הלחץ החברתי הוא הגורם היחיד"],"e":"שילה ושנהב־שפר: בחירת בן זוג, כמו בחירת מקצוע, היא החלטה חשובה, עם הרבה אפשרויות, רב־ממדית ונדבך בזהות. ההחלטה ברווקות דווקא חוזרת שוב ושוב."}]},

const SUM=`<h2>סיכום: רווקים ורווקות באי־החלטיות מתמשכת (אסיף, שפירא ורומי, 2016)</h2>
<div class="key"><b>על מה מדובר?</b> יש רווקים שאומרים שהם מאוד רוצים להתחתן, ובכל זאת שוב ושוב מסיימים קשרים או נתקעים בהם. המחקר מסתכל על זה כעל <b>בעיה של קבלת החלטות</b>, בדומה לסטודנט שלא מצליח לבחור מקצוע. הוא בדק 213 רווקים ורווקות דתיים, ומצא שמי שיש לו יותר <b>קשיים רגשיים בהחלטה</b> מגיב פחות טוב כשמשהו מפריע לו בבן או בבת הזוג. במיוחד: מי שחושב בצורה <b>פסימית</b> (״אין סיכוי״, ״הכל מזל״) נוטה לפרק את הקשר. ההמלצה: לעזור לצעירים מוקדם, לפני שהדפוסים מתקבעים.</div>

<div class="key"><b>למה המאמר הזה בקורס?</b> זה אחד משלושת מאמרי החובה של <b>התרגול</b> במבוא לפסיכולוגיה (בוחרים אחד מתוך שלושה). המטרה בתרגול היא ללמוד <b>לקרוא מאמר מחקרי</b>: לקראת <b>תרגול 5</b> קוראים רק את <b>הכותרת והתקציר</b>, ולקראת <b>תרגול 7</b> את <b>המבוא והשיטה</b>. לכן כדאי לקרוא את הסיכום עם שאלות של חוקר: מה שאלת המחקר? מה ההשערות? מי המשתתפים? מה מדדו? ומה נמצא?<br><b>לתרגול 7 (מבוא ושיטה):</b> החלקים שתואמים את המבוא הם סעיפים 1–3 וההשערות בתחילת סעיף 4. השיטה היא תיאור המדגם והשאלון בסעיף 4. הממצאים, ההסברים והמגבלות (סעיפים 4–6) הם תוספת להבנה.</div>

<h3>מילון מחקר לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>תקציר</b></td><td>פסקה בתחילת המאמר שמסכמת הכול: השאלה, השיטה, הממצאים והמסקנה.</td></tr>
<tr><td><b>מבוא</b></td><td>החלק שמסביר מה כבר ידוע, מה חסר, ולמה צריך את המחקר הזה. בסופו באות ההשערות.</td></tr>
<tr><td><b>שיטה</b></td><td>מי השתתף (מדגם), באילו כלים מדדו, ואיך המחקר התבצע (הליך).</td></tr>
<tr><td><b>השערה</b></td><td>ניבוי שאפשר לבדוק: ״אם X, אז Y״.</td></tr>
<tr><td><b>משתנה</b></td><td>מה שמודדים או משנים. בתלוי מודדים את התוצאה; הבלתי תלוי הוא מה שמשנים או משווים לפיו.</td></tr>
<tr><td><b>מתאם</b></td><td>קשר בין שני משתנים. כאן: ככל שיש יותר קשיים בהחלטה, כך יש פחות תגובות בונות.</td></tr>
</table></div>

<div id="abs"><h3>איך מזהים במאמר את הכותרת ואת התקציר</h3>
<div class="ex"><b>הכותרת:</b> השורה הגדולה והמודגשת בראש העמוד הראשון. זה השם של המאמר. מתחתיה מופיעים שמות החוקרים.<br>
<b>התקציר:</b> הפסקה שבאה מיד אחרי שמות החוקרים, <b>לפני</b> שהמאמר עצמו מתחיל. לרוב היא מסודרת אחרת משאר הטקסט (מוזחת, באות קטנה יותר או בתוך מסגרת), לפעמים מופיעה מעליה המילה ״תקציר״, ובסופה בדרך כלל יש שורה של <b>״מילות מפתח״</b>. מה שבא אחרי מילות המפתח הוא כבר המבוא.<br>
<b>למה זה חשוב:</b> התקציר הוא ״המאמר בקטן״. בדרך כלל יש בו, לפי הסדר: הרקע (למה זה מעניין), שאלת המחקר, השיטה (מי ומה בדקו), הממצאים העיקריים, והמסקנה. מי שמבין את התקציר יודע על מה כל המאמר.</div>
<h4>הכותרת והתקציר של המאמר הזה, במילים שלנו</h4>
<div class="ex"><b>הכותרת:</b> ״רווקים ורווקות באי־החלטיות מתמשכת: היבטים תפיסתיים ורגשיים בתהליך ביסוס הזוגיות״.<br>
<b>מה הכותרת כבר מגלה:</b> החלק הראשון אומר <b>את מי</b> חוקרים (רווקים שמתקשים להחליט לאורך זמן), והחלק שאחרי הנקודתיים אומר <b>מה בודקים אצלם</b> (מחשבות ורגשות בתהליך של בניית זוגיות).<br><br>
<b>מה אומר התקציר, חלק אחרי חלק:</b><br>
① <b>רקע:</b> יש דמיון בין ההחלטה להתחייב למקצוע לבין ההחלטה להתחייב לזוגיות.<br>
② <b>שאלת המחקר:</b> אילו קשיים בקבלת החלטה מעכבים התחייבות לזוגיות, ואיך הם קשורים לתגובות כשמשהו מפריע בקשר?<br>
③ <b>שיטה:</b> שאלון קשיים רגשיים בבחירת מקצוע, שהותאם לזוגיות. מדגם של 213 רווקים ורווקות דתיים, בני 19 עד 48.<br>
④ <b>ממצאים:</b> נמצא קשר בין אי־החלטיות מתמשכת לבין תגובות שלא מקדמות את הקשר, כמו פסיביות והרס, כשיש חוסר שביעות רצון.<br>
⑤ <b>מסקנה:</b> כדאי להתייחס לבחירת בן זוג כמו לכל החלטה, ולזהות קשיים מוקדם. למשל, לתרגל ״הבעה״ (לדבר על מה שמפריע) כדי להפחית פסיביות והרס.</div></div>

<h3>הדוגמה שתלווה אותנו: יעלי, בת 29</h3>
<p>יעלי דתייה, יוצאת לפגישות כבר שש שנים, ובשאלון היא מסמנת שהרצון שלה להתחתן הוא 9 מתוך 9. ובכל זאת, כל פעם שמשהו מפריע לה בבחור (הוא קצת שקט מדי, או מאחר), היא מסיימת אחרי כמה פגישות. נבין דרכה את המחקר.</p>

<h3>1. למה לחקור רווקות כ״החלטה״</h3>
<ul>
<li>מחקרים קודמים שאלו <b>מי</b> נשאר רווק (רקע, מעמד) או בדקו אישיות (סגנון היקשרות). המחקר הזה שואל <b>איך מחליטים</b>. וברווקות ההחלטה לא קורית פעם אחת: יעלי מחליטה מחדש לפני כל פגישה אם להמשיך.</li>
<li><b>למה דווקא החברה הדתית:</b> הרצון להתחתן גבוה מאוד, והסברים ״חילוניים״ (כמו מגורים משותפים במקום חתונה) לא רלוונטיים. לכן הפער בין רצון חזק לבין דחייה של ההחלטה בולט במיוחד.</li>
<li><b>ההקבלה לבחירת מקצוע:</b> שתי ההחלטות חשובות, יש בהן הרבה אפשרויות, הן נוגעות בהרבה תחומי חיים, והן חלק מהזהות. לכן אפשר להשתמש בכלים מעולם הקריירה.</li>
</ul>

<h3>2. המודל: קשיים רגשיים בהחלטה (קר״ב)</h3>
<p>יש שני מודלים מעולם הקריירה. המודל של <b>גטי</b> מתמקד בקשיים <b>קוגניטיביים</b> (חוסר מידע). המודל של <b>סקה</b>, <b>קר״ב</b>, מתמקד בקשיים <b>רגשיים ואישיותיים</b>. החוקרים בחרו בקר״ב כי בחירת בן זוג היא החלטה רגשית במיוחד. קר״ב כולל 11 קשיים בשלוש קבוצות:</p>
<div class="tw"><table><tr><th>קבוצה</th><th>מה זה</th><th>איך זה נשמע אצל יעלי</th></tr>
<tr><td><b>תפיסות פסימיות</b></td><td>על התהליך, על ״השוק״, ועל השליטה</td><td>״אין גברים רציניים״, ״הכל עניין של מזל״</td></tr>
<tr><td><b>חרדה</b></td><td>מהתהליך (פרפקציוניזם), מאי־ודאות, מאחריות, מהתוצאה</td><td>״מה אם אבחר לא נכון ואתקע?״</td></tr>
<tr><td><b>תפיסה עצמית וזהות</b></td><td>זהות לא יציבה, הערכה עצמית, קושי בין קרבה לנפרדות</td><td>״אני לא בטוחה מה אני בכלל רוצה״</td></tr></table></div>

<h3>3. איך מגיבים כשמשהו מפריע: רוזבולט</h3>
<p>כשמשהו בקשר לא מספק, יש ארבע תגובות. הן מסודרות על שני צירים: <b>האם עושים משהו</b> (אקטיבי או פסיבי), ו<b>האם זה שומר על הקשר</b> (בונה או הרסני):</p>
<div class="tw"><table><tr><th></th><th>בונה (שומר על הקשר)</th><th>הרסני (פוגע בקשר)</th></tr>
<tr><td><b>אקטיבי</b></td><td><b>הבעה</b>: לדבר על מה שמפריע</td><td><b>עזיבה</b>: לסיים</td></tr>
<tr><td><b>פסיבי</b></td><td><b>נאמנות</b>: לחכות שיסתדר מעצמו</td><td><b>הזנחה</b>: להתרחק, לבקר, להשקיע פחות</td></tr></table></div>
<p>יעלי בוחרת בעזיבה. תגובות פסיביות והרסניות הן ביטוי של אי־החלטיות, והן פוגעות גם בקשר וגם באדם.</p>

<h3>4. ההשערות והתוצאות</h3>
<p><b>המדגם:</b> 213 רווקים ורווקות דתיים (49 גברים), בני 19–48, בממוצע כמעט 5 שנים בהיכרויות. כ־80% לא היו בקשר בזמן המחקר, והרצון להינשא היה גבוה מאוד (7.9 מתוך 9). השאלון של קר״ב הותאם מעולם הקריירה ונמצא מהימן מאוד.</p>
<div class="tw"><table><tr><th>ההשערה</th><th>מה נמצא</th></tr>
<tr><td>1. יותר קשיים בהחלטה ← פחות תגובות בונות</td><td><b>אושרה</b></td></tr>
<tr><td>2. תפיסות פסימיות ← תגובות הרסניות</td><td><b>אושרה</b> (וגם תחושה שקשה למצוא בן זוג ניבאה הרס)</td></tr>
<tr><td>3. חרדה ← תגובות פסיביות</td><td><b>לא אושרה</b>. ודווקא: רצון חזק להתחתן השנה ניבא <b>פחות</b> פסיביות</td></tr>
<tr><td>4. קשיי זהות ← תגובות פסיביות</td><td><b>חלקית</b>: רק אצל מי שבהיכרויות יותר מ־4 שנים</td></tr></table></div>
<p><b>ניתוח הנתיבים</b> (איך הקשיים משפיעים זה על זה): הבסיס הוא <b>התפיסה העצמית</b>, היא מזינה <b>פסימיות</b>, והפסימיות מתבטאת ב<b>חרדה</b> בזמן ההחלטה.</p>

<h3>5. איך מסבירים</h3>
<ul>
<li><b>למה פסימיות מובילה לפרידה?</b> מי שבטוח שאין סיכוי, לא רואה טעם להשקיע (לפי ״מודל ההשקעה״). פרידה גם נותנת הקלה מהירה מתחושה לא נעימה, ותגובה בונה דורשת כוחות.</li>
<li><b>למה החרדה לא גרמה לפסיביות?</b> כנראה כי יש שני סוגי חרדה. חרדה כ<b>תכונה</b> עלולה לשתק, אבל חרדה <b>מצבית</b> (״אני מפסידה זמן״) דוחפת לפעולה.</li>
<li>היקשרות לא השפיעה באופן אחיד, והערכה עצמית בתחום הזוגי מתגבשת רק עם ניסיון. ייתכן גם שאנשים ענו כפי שנראה טוב (רצייה חברתית).</li>
<li><b>מה עושים?</b> תוכנית מוקדמת, אפילו בבית הספר, בשני מישורים: <b>מחשבתי</b> (לזהות מחשבות כמו ״הכל מזל״) ו<b>התנהגותי</b> (לתרגל לדבר על מה שמפריע במקום לעזוב).</li>
</ul>

<h3>6. מגבלות</h3>
<p>רוב המשתתפים לא היו בקשר, ולכן ענו <b>מהזיכרון</b> על קשרים קודמים. המחקר בדק רק מגזר אחד. והוא מחקר חתך (פעם אחת), ולכן לא מראה מה קורה לאורך זמן.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. <b>שאלת המחקר:</b> למה רווקים שרוצים מאוד להתחתן מתקשים להחליט, ואיך זה קשור לאופן שבו הם מגיבים כשמשהו מפריע להם בקשר?<br>
2. <b>הרעיון:</b> להסתכל על רווקות כעל <b>החלטה</b>, ולהשתמש בכלי מעולם הקריירה: <b>קשיים רגשיים בהחלטה</b> (פסימיות, חרדה, זהות).<br>
3. <b>השיטה:</b> שאלונים ל־213 רווקים ורווקות דתיים, שבדקו קשיים בהחלטה ו<b>ארבע תגובות</b> לחוסר שביעות רצון (הבעה, נאמנות, הזנחה, עזיבה).<br>
4. <b>הממצאים:</b> יותר קשיים ← פחות תגובות בונות. <b>פסימיות</b> ← יותר תגובות הרסניות, כמו עזיבה. ההשערה על חרדה לא אושרה.<br>
5. <b>המשמעות:</b> כדאי לעזור לצעירים מוקדם, גם במחשבות (לזהות ״הכול מזל״) וגם בהתנהגות (לדבר במקום לעזוב). מגבלות: מחקר חתך, מגזר אחד, ותשובות מהזיכרון.<br><br>
<b>מה צריך לדעת לעשות בתרגולים:</b><br>
• לנסח את שאלת המחקר ואת ארבע ההשערות.<br>
• לזהות את המשתנים: קשיים בהחלטה (ושלושת סוגיהם) ותגובות לחוסר שביעות רצון (ושני הצירים: אקטיבי/פסיבי, בונה/הרסני).<br>
• לתאר את המדגם, את הכלים ואת סוג המחקר (שאלונים, חתך, מתאמי).<br>
• להסביר אילו השערות אושרו ואילו לא, ומה החוקרים הציעו כהסבר.<br>
• לזהות את המגבלות, ולהסביר למה אי אפשר להסיק כאן סיבה ותוצאה.</div>

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function checkBox(t,bi){

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=(dir)=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1,answered=items.filter(x=>x.pick!=null).length;
    show(`<div class="stack quiz exam">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length} · נענו ${answered}`,"יציאה מהמבחן")}
     <div class="q"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div></div>
     <div class="pager">${i?`<button class="ghost" id="pv">${ic("arrowR")}<span>הקודמת</span></button>`:"<span></span>"}<button class="primary" id="nx" ${it.pick==null?"disabled":""}><span>${last?"הגשה ובדיקה":"השאלה הבאה"}</span>${ic("arrowL")}</button></div></div>`,dir);
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home("back");else{bk.dataset.sure=1;bk.querySelector("span").textContent="לחצו שוב ליציאה (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");b.style.setProperty("--i",k);
      b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step("fwd")}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step("back")};
  };step("up");
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
