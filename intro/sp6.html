"VTA":["Ventral Tegmental Area","אזור הטגמנטום הגחוני"],
"VZ":["Ventricular Zone","האזור החדרי"],
"WMQ":["Working Memory Quotient","מנת זיכרון העבודה"],
"5-HT":["5-hydroxytryptamine","סרוטונין"],
"2-DG":["2-deoxyglucose","גלוקוז מסומן שנקלט ולא מתפרק"],
"L-DOPA":["","מולקולת־הקדם של דופמין"],
"6-OHDA":["6-hydroxydopamine","רעלן שהורס נוירונים דופמינרגיים ונוראדרנרגיים"]
};
const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"sprout",title:"מהי למידה",blocks:[
  {h:"צבים, גלשנים ולמידה",html:`${def("על מה הנושא",`מה ההבדל בין התנהגות מולדת לבין למידה, ושלושת סוגי הלמידה.<br><b>מה נלמד כאן:</b> רפלקס · אינסטינקט · למידה · למידה אסוציאטיבית`)}${ex("הפרק נפתח בחוף: צבי ים שבקעו לפני דקות זוחלים לבד אל המים. לידם, <b>ג׳וליאן</b> לומד לגלוש: הוא עולה על גל, עומד כמה שניות ונופל, ואז מסתכל איך <b>בן</b>, אבא שלו, רוכב על הגל. הצבים לא צריכים ללמוד. ג׳וליאן כן. נלווה אותו לאורך הלומדה.")}<div class="tw"><table><tr><th></th><th>רפלקס</th><th>אינסטינקט</th></tr><tr><td>מה מפעיל</td><td>גירוי מסוים</td><td>אירועים רחבים (התבגרות, עונות)</td></tr><tr><td>מורכבות</td><td>פשוט, חלק גוף מסוים</td><td>מורכב, כל הגוף</td></tr><tr><td>שליטה במוח</td><td>מרכזים נמוכים (חוט השדרה, המוח המוארך)</td><td>מרכזים גבוהים</td></tr><tr><td>דוגמה</td><td>רפלקס הברך, היצרות האישון</td><td>ציפורים נודדות, עכביש טווה רשת</td></tr></table></div>${def("למידה",`${E("Learning")} שינוי <b>קבוע יחסית</b> בהתנהגות או בידע, שנובע מ<b>ניסיון</b>. בניגוד לרפלקס ולאינסטינקט, צריך לרכוש אותה.`)}`,q:"q1"},
  {h:"שלושה סוגי למידה",html:`${def("למידה אסוציאטיבית",`${E("Associative learning")} למידה שבה מקשרים בין גירויים או אירועים שקורים יחד. היא הבסיס לשלושת הסוגים.`)}<div class="tw"><table><tr><th>סוג</th><th>מה מקשרים</th><th>אצל ג׳וליאן</th></tr><tr><td><b>התניה קלאסית</b></td><td>גירוי עם גירוי (לרוב לא מודע)</td><td>הוא נבהל מכל גל גבוה, כי פעם גל כזה הפיל אותו</td></tr><tr><td><b>התניה אופרנטית</b></td><td>התנהגות עם התוצאה שלה (לרוב מודע)</td><td>כשהוא עומד נכון, הוא נהנה מהגלישה וחוזר על זה</td></tr><tr><td><b>למידה מצפייה</b></td><td>לומדים מצפייה באחרים</td><td>הוא מסתכל על אבא שלו ומחקה</td></tr></table></div>${ex("דוגמה מהספר להתניה קלאסית: ברק תמיד בא לפני רעם, ולכן אנחנו נבהלים כבר מהברק.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"bulb",title:"התניה קלאסית: פבלוב",blocks:[
  {h:"הכלבים של פבלוב",html:`${def("על מה הנושא",`איך גירוי ניטרלי הופך לגירוי שמפעיל תגובה.<br><b>מה נלמד כאן:</b> פבלוב · חמשת המושגים · תזמון`)}<p><b>איוון פבלוב</b>, פיזיולוג רוסי, חקר עיכול בכלבים, ושם לב שהכלבים מתחילים לרייר כבר כשהם שומעים את צעדי העוזר שמביא את האוכל. הוא השמיע <b>צליל</b> ומיד אחריו נתן <b>אבקת בשר</b>, שוב ושוב. בסוף הכלבים ריירו לצליל לבד.</p>${fig("pav38")}`,q:"q5"},
  {h:"חמשת המושגים",html:`<div class="tw"><table><tr><th>מושג</th><th>מה זה</th><th>אצל פבלוב</th></tr><tr><td><b>גירוי ניטרלי</b> (NS)</td><td>לא מעורר תגובה מעצמו</td><td>הצליל, לפני הלמידה</td></tr><tr><td><b>גירוי בלתי מותנה</b> (UCS)</td><td>מעורר תגובה באופן טבעי</td><td>אבקת הבשר</td></tr><tr><td><b>תגובה בלתי מותנית</b> (UCR)</td><td>תגובה טבעית ל־UCS</td><td>ריור לבשר</td></tr><tr><td><b>גירוי מותנה</b> (CS)</td><td>הגירוי הניטרלי, אחרי הלמידה</td><td>הצליל, אחרי הצימוד</td></tr><tr><td><b>תגובה מותנית</b> (CR)</td><td>תגובה נלמדת ל־CS</td><td>ריור לצליל</td></tr></table></div>${rem("הריור הוא אותו ריור. מה שמשנה את השם הוא <b>מה מעורר אותו</b>: בשר = UCR, צליל = CR.")}`,q:"q7"},
  {h:"דוגמאות מהחיים",html:`${tiles([["leaf","החתולה טייגר","קופסת האוכל שלה נפתחת עם פותחן חשמלי. עכשיו היא רצה למטבח בכל פעם שהפותחן פועל. פותחן = CS, אוכל = UCS","דוגמה להתניה קלאסית: צליל שהיה ניטרלי נקשר לאוכל, ועכשיו הוא לבד מעורר תגובה של ציפייה.","בהתחלה רעש הפותחן לא אמר לטייגר כלום. אחרי שבכל פעם הגיע אחריו אוכל, הרעש לבד מספיק כדי שתרוץ למטבח."],["flask","מוישה וכימותרפיה","הטיפול (UCS) גורם לבחילה (UCR). אחרי כמה טיפולים היא מרגישה בחילה כבר בכניסה למשרד של הרופא (CS)"],["cart","פרסום","מצמידים מוצר לדמות אטרקטיבית או למוזיקה טובה, כדי שהמוצר לבד יעורר רגש חיובי"]])}${def("תזמון",`בדרך כלל ה־CS צריך להופיע <b>זמן קצר לפני</b> ה־UCS. יוצא דופן: <b>סלידה מטעם</b>, שבה הקשר נוצר גם אחרי שעות. <b>גרסיה וקולינג</b> הראו בחולדות שיש <b>מגבלות ביולוגיות</b> על מה שקל ללמוד.`)}${ex("ג׳וליאן אכל פעם פיצה לפני הגלישה, ובערב הייתה לו בחילה מסיבה אחרת לגמרי. עכשיו הוא לא סובל ריח של פיצה. מספיק צימוד אחד, וגם אחרי שעות.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"cycle",title:"תהליכים בהתניה קלאסית",blocks:[
  {h:"רכישה, הכחדה והתאוששות",html:`${def("על מה הנושא",`מה קורה לתגובה המותנית לאורך זמן, ומתי היא מתרחבת או מצטמצמת.<br><b>מה נלמד כאן:</b> רכישה · התניה מסדר שני · הכחדה · התאוששות ספונטנית · הכללה · הבחנה`)}<div class="tw"><table><tr><th>תהליך</th><th>מה קורה</th><th>דוגמה</th></tr><tr><td><b>רכישה</b></td><td>שלב הלמידה, הצימוד מחזק את התגובה</td><td>פבלוב מצמיד צליל ובשר</td></tr><tr><td><b>התניה מסדר שני</b></td><td>CS קיים משמש ״ללמד״ גירוי ניטרלי חדש</td><td>טייגר רצה גם לחריקת הארון שנפתח לפני הפותחן</td></tr><tr><td><b>הכחדה</b></td><td>ה־CS מופיע בלי ה־UCS, והתגובה נחלשת</td><td>הצליל בלי בשר שוב ושוב</td></tr><tr><td><b>התאוששות ספונטנית</b></td><td>אחרי הפסקה, תגובה שנכחדה חוזרת</td><td>אחרי כמה ימים הכלב שוב מרייר לצליל</td></tr></table></div>${rem("קשה מאוד להגיע להתניה מעבר לסדר שני.")}`,q:"q11"},
  {h:"הכללה, הבחנה, ואלברט הקטן",html:`${tiles([["copies","הכללת גירוי","מגיבים גם לגירויים <b>דומים</b> ל־CS","אחרי שלמדנו להגיב לגירוי מסוים, אנחנו מגיבים גם לגירויים שדומים לו. ככל שהם דומים יותר, התגובה חזקה יותר.","כלב שנשך ילד גורם לו לפחד גם מכלבים אחרים, אפילו מכלב קטן ונחמד."],["target","הבחנה בין גירויים","מגיבים <b>רק</b> ל־CS המסוים, ולא לדומים","לומדים להגיב רק לגירוי המסוים, ולא לגירויים שדומים לו. זה קורה כשרק הגירוי הזה מלווה בתוצאה.","הכלב של המשפחה מתרגש רק מהצליל של מכונית הבעלים, ולא ממכוניות אחרות שעוברות ברחוב."]])}${def("ווטסון ואלברט הקטן",`<b>ג׳ון ווטסון</b>, אבי הביהביוריזם, הראה שאפשר להתנות פחד: הוא הצמיד <b>עכברוש לבן</b> לרעש חזק ומפחיד אצל תינוק בשם אלברט, ואלברט התחיל לפחד מהעכברוש. אחר כך הפחד <b>הוכלל</b> לחפצים פרוותיים אחרים. היום הניסוי נחשב <b>לא אתי</b>.`)}${ex("ג׳וליאן נבהל מגל גבוה שהפיל אותו. אם הוא נבהל מכל גל גבוה, זו <b>הכללה</b>. אם עם הזמן הוא לומד להיבהל רק מגלים שנשברים מהר, זו <b>הבחנה</b>.")}`,q:"q13"}
 ]},
 {id:"t4",icon:"scales",title:"התניה אופרנטית: חיזוק ועונש",blocks:[
  {h:"חוק האפקט וקופסת סקינר",html:`${def("על מה הנושא",`לומדים לקשר בין התנהגות לבין התוצאה שלה.<br><b>מה נלמד כאן:</b> ת׳ורנדייק · סקינר · חיזוק ועונש · חיובי ושלילי`)}<p>בהתניה קלאסית מצמידים <b>שני גירויים</b>. בהתניה אופרנטית ה<b>התנהגות</b> באה קודם, ו<b>התוצאה</b> שבאה אחריה קובעת אם תחזור.</p>${def("חוק האפקט",`${E("Law of effect")} <b>ת׳ורנדייק</b> (1911): התנהגות שבאה אחריה תוצאה נעימה תחזור; התנהגות שבאה אחריה תוצאה לא נעימה תחזור פחות. הולכים לעבודה כי מקבלים משכורת.`)}${def("סקינר",`<b>ב״פ סקינר</b> טען שהתניה קלאסית מסבירה רק רפלקסים, לא התנהגויות חדשות כמו רכיבה על אופניים. הוא בנה את <b>תא ההתניה האופרנטית</b> (״קופסת סקינר״): חולדה לוחצת על מנוף או יונה מנקרת בדסקית, ומקבלת אוכל.`)}`,q:"q15"},
  {h:"ארבע האפשרויות",html:`<p>שתי שאלות: <b>מוסיפים או מורידים</b> משהו? והאם המטרה <b>להגביר או להפחית</b> את ההתנהגות?</p><div class="tw"><table><tr><th></th><th>מגביר התנהגות (חיזוק)</th><th>מפחית התנהגות (עונש)</th></tr><tr><td><b>חיובי</b> (מוסיפים)</td><td><b>חיזוק חיובי</b>: מוסיפים משהו נעים. משכורת, שבח</td><td><b>עונש חיובי</b>: מוסיפים משהו לא נעים. נזיפה</td></tr><tr><td><b>שלילי</b> (מורידים)</td><td><b>חיזוק שלילי</b>: מורידים משהו לא נעים. הצפצוף של החגורה נפסק כשחוגרים</td><td><b>עונש שלילי</b>: מורידים משהו נעים. לוקחים צעצוע</td></tr></table></div>${rem("״חיובי״ ו״שלילי״ = <b>הוספה והורדה</b>, לא ״טוב״ ו״רע״. וחיזוק, גם שלילי, תמיד <b>מגביר</b> התנהגות.")}${ex("ג׳וליאן חוזר להתאמן כי כיף לו לגלוש (חיזוק חיובי). כשהוא שם קרם הגנה, הצריבה בעור לא מגיעה, ולכן הוא ממשיך לשים (חיזוק שלילי). ואם יגלוש בלי רשות, אבא יבטל לו את הגלישה בשבת (עונש שלילי).")}`,q:"q17"},
  {h:"הבעיה עם עונש",html:`<p>מחקרים (<b>גרשוף</b>) קשרו עונש גופני (מכות) ל<b>פחד</b> מהמעניש, להימנעות מבית הספר, ול<b>יותר תוקפנות</b> והתנהגות אנטי־חברתית. לכן רוב בתי הספר בארה״ב אסרו עונש גופני, והמומחים היום ממליצים ל<b>חזק התנהגות טובה</b>.</p>${ex("ברנדה קיבלה מכות על התנהגות רעה, ועכשיו היא מכה את החברים שלה. העונש לימד אותה בדיוק את מה שרצו למנוע.")}${def("פסק זמן",`${E("Time-out")} <b>עונש שלילי</b>: מוציאים את הילד מפעילות נעימה. בערך <b>דקה לכל שנת גיל</b>, ברוגע, ובסוף מילה טובה.`)}`,q:"q19"}
 ]},
 {id:"t5",icon:"clock",title:"עיצוב, מחזקים ולוחות חיזוק",blocks:[
  {h:"עיצוב",html:`${def("על מה הנושא",`איך מלמדים התנהגות מורכבת, אילו סוגי מחזקים יש, ומתי לתת אותם.<br><b>מה נלמד כאן:</b> עיצוב · מחזק ראשוני ומשני · כלכלת אסימונים · לוחות חיזוק`)}${def("עיצוב",`${E("Shaping")} מחזקים <b>קירובים הדרגתיים</b> להתנהגות הרצויה. בהתחלה כל דבר שדומה, ואחר כך רק מה שקרוב יותר ויותר, עד שמחזקים רק את ההתנהגות המלאה.`)}${ex("סקינר לימד יונים לשחק פינג־פונג. הורים מלמדים ילד לסדר את החדר: קודם מחזקים צעצוע אחד, אחר כך חמישה, ובסוף רק את כל החדר. גם ג׳וליאן מקבל שבח מאבא קודם על שכיבה יציבה על הגלשן, אחר כך על כריעה, ובסוף רק על עמידה.")}`,q:"q21"},
  {h:"מחזקים ראשוניים ומשניים",html:`<div class="tw"><table><tr><th></th><th>מחזק ראשוני</th><th>מחזק משני</th></tr><tr><td>ערך</td><td>מולד</td><td>נרכש מקשר למחזק ראשוני</td></tr><tr><td>דוגמאות</td><td>אוכל, מים, שינה, מגע</td><td>כסף, שבח, מדבקות, אסימונים</td></tr></table></div>${rem("כסף שווה משהו רק כי אפשר לקנות בו. על אי בודד הוא חסר ערך.")}${def("כלכלת אסימונים",`אסימונים שאפשר להחליף בפרסים. בשימוש בבתי ספר, בתי כלא ובתי חולים. מחקר מצא שילדים עם אוטיזם קיבלו אסימון על התנהגות מתאימה ו<b>הפסידו</b> אסימון על מכות, והחליפו אותם בזמן משחק. <b>טבלת מדבקות</b> לילדים היא כלכלת אסימונים.`)}`,q:"q23"},
  {h:"לוחות חיזוק",html:`<p><b>חיזוק רציף</b> (אחרי כל תגובה) הוא הדרך <b>המהירה</b> ללמד התנהגות חדשה. אחרי שההתנהגות נלמדה עוברים ל<b>חיזוק חלקי</b>, שיש לו ארבעה סוגים:</p><div class="tw"><table><tr><th>לוח</th><th>מתי מקבלים</th><th>דפוס תגובה</th><th>דוגמה</th></tr><tr><td><b>מרווח קבוע</b></td><td>אחרי זמן קבוע</td><td>בינוני, עם הפוגות</td><td>משכך כאבים שאפשר לקבל רק פעם בשעה</td></tr><tr><td><b>מרווח משתנה</b></td><td>אחרי זמן לא צפוי</td><td>בינוני ויציב</td><td>בדיקת פייסבוק; בונוס בביקורת פתע</td></tr><tr><td><b>יחס קבוע</b></td><td>אחרי מספר קבוע של תגובות</td><td>גבוה, עם הפוגות</td><td>תשלום לפי יחידה; עמלה על כל זוג משקפיים</td></tr><tr><td><b>יחס משתנה</b></td><td>אחרי מספר לא צפוי של תגובות</td><td>גבוה ויציב</td><td><b>הימורים</b>, מכונת מזל</td></tr></table></div>${rem("הכי <b>עמיד להכחדה</b>: יחס משתנה. הכי פחות עמיד: מרווח קבוע.")}${ex("ג׳וליאן לא יודע איזה גל יהיה טוב. לפעמים הגל השלישי, לפעמים העשירי. זה יחס משתנה, ולכן הוא ממשיך לחתור עוד ועוד.")}`,q:"q25"}
 ]},
 {id:"t6",icon:"brain",title:"קוגניציה: למידה סמויה והימורים",blocks:[
  {h:"טולמן והמפה הקוגניטיבית",html:`${def("על מה הנושא",`האם יש למידה בלי חיזוק? ולמה הימורים כל כך ממכרים?<br><b>מה נלמד כאן:</b> ביהביוריזם רדיקלי · מפה קוגניטיבית · למידה סמויה · הימורים`)}<p>סקינר ראה את הנפש כ<b>״קופסה שחורה״</b> שאין טעם לחקור. <b>אדוארד טולמן</b> חלק עליו: החולדות שלו הסתובבו במבוך <b>בלי שום פרס</b>, ובנו <b>מפה קוגניטיבית</b> שלו. כששמו אוכל בסוף המבוך, הן מצאו אותו מהר בדיוק כמו חולדות שקיבלו פרס כל הזמן.</p>${def("למידה סמויה",`${E("Latent learning")} למידה שלא נראית בהתנהגות עד שיש סיבה להראות אותה.`)}${ex("ראווי נסע לבית הספר עם אבא שלו כל יום כנוסע. כשאבא לא יכול היה להסיע אותו, הוא רכב לבד באופניים בדיוק באותה דרך. הוא למד את הדרך בלי שום חיזוק.")}`,q:"q27"},
  {h:"הימורים והמוח",html:`<ul><li>סקינר כתב שקזינו שומר על המהמרים כי הוא מחזיר חלק מהכסף ב<b>יחס משתנה</b>. הוא טען שיוכל להפוך יונה למהמרת כפייתית, אבל מחקר בחולדות לא תמך בזה.</li><li>הימורים מפעילים את מסלולי <b>הדופמין</b> של התגמול, כמו סמים ממכרים. גם <b>״כמעט ניצחון״</b> מפעיל אזורי תגמול.</li><li>ב־<b>DSM-5</b> הימורים מסווגים כ<b>התמכרות</b> (קודם כהפרעת שליטה בדחפים).</li></ul>${rem("אי אפשר לבדוק בניסוי מה גורם להימורים כפייתיים, כי אסור לגרום לאנשים להפוך למהמרים. לכן הסיבתיות לא ברורה.")}`,q:"q29"}
 ]},
 {id:"t7",icon:"people",title:"למידה מצפייה",blocks:[
  {h:"בנדורה ומודלים",html:`${def("על מה הנושא",`לומדים גם מצפייה באחרים, בלי ניסיון ישיר.<br><b>מה נלמד כאן:</b> מודל · בנדורה · ארבעת השלבים · חיזוק עקיף · בובת בובו`)}${def("למידה מצפייה",`${E("Observational learning")} לומדים מצפייה באחרים ומחקים. מי שמחקים נקרא <b>מודל</b>. היא קשורה כנראה ל<b>נוירוני מראה</b>.`)}<p><b>אלברט בנדורה</b> טען שביהביוריזם טהור לא מסביר למידה בלי חיזוק חיצוני, ולכן גם מצבים פנימיים חשובים. יש שלושה סוגי מודלים:</p>${tiles([["people","חי","מדגים בפועל, מול העיניים","מודל ״חי״ הוא אדם שמדגים את ההתנהגות בפועל, מול העיניים.","ילד רואה את אבא שלו מברך את השכן בחיוך, ומתחיל לעשות כמוהו."],["doc","מילולי","מסביר במילים בלי להדגים","מודל שמלמד בעיקר במילים: אומר מה לעשות ואיך, אבל לא מראה את זה בעצמו.","מאמן שמסביר ליואב ״תכופף את הברכיים ותזרוק מהמרפק״, בלי להדגים את הזריקה."],["phone","סימבולי","דמויות בספרים, סרטים, משחקים ורשת","מודל סימבולי הוא דמות שלומדים ממנה דרך ספר, סרט, משחק או רשת, בלי לראות אותה במציאות.","ילדה מחקה תנועות ריקוד של דמות מסרטון ברשת."]])}${ex("ג׳וליאן מסתכל על בן, אבא שלו (מודל חי), מחקה את התנועות שעבדו לו, ונמנע מאלה שהפילו אותו.")}`,q:"q31"},
  {h:"ארבעת השלבים ובובת בובו",html:`<ol><li><b>קשב</b>: לשים לב למה שהמודל עושה.</li><li><b>שימור</b>: לזכור את מה שראו.</li><li><b>שחזור</b>: להיות מסוגל לבצע את ההתנהגות.</li><li><b>מוטיבציה</b>: לרצות לבצע. תלוי במה שקרה למודל.</li></ol>${tiles([["check","חיזוק עקיף","המודל קיבל פרס, ולכן מחקים יותר","כשרואים מישהו מקבל פרס על התנהגות, נוטים לחקות אותה יותר, גם אם לא קיבלנו פרס בעצמנו.","תלמיד רואה שחבר קיבל מחמאה מהמורה על שאלה טובה, ומתחיל לשאול יותר שאלות."],["x","עונש עקיף","המודל נענש, ולכן מחקים פחות","כשרואים מישהו נענש על התנהגות, נוטים פחות לחקות אותה.","ילדים רואים שחבר נשלח למנהלת על קללה, ונזהרים לא לקלל."]])}${def("בובת בובו",`בנדורה, רוס ורוס (1961): ילדים ראו מבוגר מתנהג בתוקפנות כלפי בובה מתנפחת. כשהמבוגר <b>נענש</b>, הילדים חיקו <b>פחות</b>. כשהוא קיבל <b>שבח או שהתעלמו ממנו</b>, הם חיקו את המכות, הבעיטות ואפילו את המילים.`)}${ex("ג׳וליאן לבדו לא מספיק: גם אם ראה את אבא עומד על הגלשן, הוא צריך לזכור איך (שימור), להצליח פיזית (שחזור), ולרצות (מוטיבציה).")}`,q:"q33"},
  {h:"השפעות חיוביות ושליליות",html:`${tiles([["check","השפעה פרו־חברתית","מודלים חיוביים מעודדים קריאה, אכילה בריאה, חסד ויושר. ילדים מחקים את מה שהמבוגרים <b>עושים</b> יותר ממה שהם <b>אומרים</b>"],["x","השפעה אנטי־חברתית","ילדים שרואים תוקפנות עלולים לחקות אותה. כ־30% מהילדים שעברו התעללות הופכים להורים מתעללים","הצד השלילי של למידה מצפייה: אותו מנגנון שמלמד התנהגות טובה מלמד גם התנהגות פוגענית.","ילד שרואה בבית שצועקים ומכים כשכועסים עלול לנהוג כך בעצמו עם חברים."]])}${ex("קלייר הצליפה בבנה בחגורה, ואחר כך ראתה את בתה מצליפה כך בדובי. היא הבינה שהיא רוצה לחנך אחרת.")}${def("אלימות במדיה",`בוגר תיכון נחשף לכ־200,000 מעשי אלימות במדיה. <b>אנדרסון</b> ועמיתיו מצאו ראיות רבות לקשר סיבתי בין חשיפה לאלימות לבין מחשבות והתנהגות תוקפניות. <b>פרגוסון</b> טוען שהמחקרים לא שקללו מספיק גורמים אחרים, כמו בריאות נפשית ומשפחה. הוויכוח נמשך.`)}`,q:"q35"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מהי למידה לפי הפרק?","a":"שינוי קבוע יחסית בהתנהגות או בידע שנובע מניסיון","w":["תגובה מולדת ופשוטה לגירוי מסוים, בלי שום ניסיון קודם","התנהגות מורכבת שמופעלת מעצמה בהתבגרות או בעונות","כל שינוי זמני בהתנהגות, גם בגלל עייפות או מחלה"],"e":"למידה חייבת לנבוע מניסיון ולהיות קבועה יחסית. תגובה מולדת לגירוי היא רפלקס, והתנהגות מורכבת מולדת היא אינסטינקט."},{"q":"צבי ים שבקעו זוחלים לבד אל המים. מה זה?","a":"אינסטינקט","w":["התניה קלאסית","למידה מצפייה","התניה אופרנטית"],"e":"זו התנהגות מולדת, מורכבת, שלא נלמדה. ג׳וליאן, לעומתם, צריך ללמוד לגלוש."}]},"q2":{"t":"t1","v":[{"q":"מה ההבדל בין רפלקס לאינסטינקט?","a":"רפלקס פשוט ומקומי; אינסטינקט מורכב ומערב את כל הגוף","w":["רפלקס נלמד מניסיון, ואינסטינקט מולד מהלידה","רפלקס נשלט במרכזים גבוהים, ואינסטינקט בחוט השדרה","אין הבדל, אלה שני שמות לאותה התנהגות"],"e":"שניהם מולדים. רפלקס הוא תגובה פשוטה של חלק גוף, שנשלטת במרכזים נמוכים. אינסטינקט מורכב יותר ומערב מרכזים גבוהים."}]},"q3":{"t":"t1","v":[{"q":"מה מקשרים בהתניה אופרנטית?","a":"התנהגות עם התוצאה שלה","w":["גירוי עם גירוי אחר","התנהגות של אחר עם התנהגות שלי","רפלקס עם אינסטינקט"],"e":"בקלאסית מקשרים גירוי לגירוי. באופרנטית מקשרים התנהגות לתוצאה שבאה אחריה."},{"q":"ג׳וליאן מסתכל על אבא שלו גולש ומחקה אותו. איזה סוג למידה זה?","a":"למידה מצפייה","w":["התניה קלאסית","התניה אופרנטית בלבד","רפלקס נרכש"],"e":"הוא לומד מצפייה במודל, בלי ניסיון ישיר. זו למידה מצפייה (מודלינג)."}]},"q4":{"t":"t1","v":[{"q":"אנחנו נבהלים כבר מהברק, לפני הרעם. איזה סוג למידה זה מדגים?","a":"התניה קלאסית","w":["התניה אופרנטית","למידה מצפייה","למידה סמויה"],"e":"הברק תמיד מגיע לפני הרעם, ולכן נוצר קשר בין שני הגירויים. זו התניה קלאסית."}]},"q5":{"t":"t2","v":[{"q":"מה עשה פבלוב כדי שהכלבים ירירו לצליל?","a":"השמיע צליל ומיד אחריו נתן אבקת בשר, שוב ושוב","w":["נתן לכלבים פרס בכל פעם שהם ריירו לשמע הצליל","הראה לכלבים כלב אחר שמרייר לצליל","השמיע צליל רק אחרי שהכלבים כבר אכלו"],"e":"הצימוד החוזר של צליל ובשר הפך את הצליל לגירוי מותנה. פרס על ריור היה התניה אופרנטית."}]},"q6":{"t":"t2","v":[{"q":"מה גילה פבלוב במקרה, לפני הניסוי?","a":"שהכלבים מריירים כבר לצעדים של העוזר","w":["שהכלבים מריירים רק כשהם רואים בשר","שכלבים לא מסוגלים ללמוד שום קשר","שהכלבים מריירים יותר בערב"],"e":"הוא חקר עיכול ושם לב שסימנים שקודמים לאוכל מעוררים ריור. מכאן התחיל המחקר."}]},"q7":{"t":"t2","v":[{"q":"לפני הלמידה, מהו הצליל בניסוי של פבלוב?","a":"גירוי ניטרלי","w":["גירוי מותנה","גירוי בלתי מותנה","תגובה מותנית"],"e":"לפני הצימוד הצליל לא מעורר ריור, ולכן הוא ניטרלי. אחרי הצימוד הוא הופך לגירוי מותנה."},{"q":"הכלב מרייר לצליל אחרי הלמידה. מה הריור הזה?","a":"תגובה מותנית","w":["תגובה בלתי מותנית","גירוי מותנה","גירוי ניטרלי"],"e":"ריור לבשר הוא תגובה בלתי מותנית. ריור לצליל, שנלמד, הוא תגובה מותנית."}]},"q8":{"t":"t2","v":[{"q":"מה מבדיל בין תגובה מותנית לבלתי מותנית אצל פבלוב?","a":"מה שמעורר את הריור: צליל או בשר","w":["כמות הרוק שהכלב מפריש בכל פעם","סוג הכלב שמשתתף בניסוי","הזמן ביום שבו נערך הניסוי"],"e":"הריור עצמו זהה. אם הבשר מעורר אותו זו תגובה בלתי מותנית, ואם הצליל, זו תגובה מותנית."}]},"q9":{"t":"t2","v":[{"q":"מוישה מרגישה בחילה כבר בכניסה למשרד של הרופא שנותן לה כימותרפיה. מה המשרד?","a":"גירוי מותנה","w":["גירוי בלתי מותנה","תגובה בלתי מותנית","תגובה מותנית"],"e":"הכימותרפיה (UCS) גורמת לבחילה (UCR). המשרד, שהוצמד אליה, הפך לגירוי מותנה שמעורר בחילה (CR)."},{"q":"מה מיוחד בסלידה מטעם?","a":"הקשר נוצר גם כשעוברות שעות בין הטעם לבחילה","w":["היא דורשת מאות צימודים חוזרים כדי להיווצר בכלל","היא מופיעה רק אצל כלבים במעבדה","היא נעלמת לגמרי אחרי לילה אחד"],"e":"בדרך כלל ה־CS צריך לבוא זמן קצר לפני ה־UCS. בסלידה מטעם הקשר נוצר גם אחרי שעות, ולפעמים מצימוד אחד."}]},"q10":{"t":"t2","v":[{"q":"מה הראו גרסיה וקולינג בחולדות?","a":"שיש מגבלות ביולוגיות על מה שקל ללמוד","w":["שחולדות לא מסוגלות ללמוד סלידה מטעם","שאפשר להתנות כל גירוי עם כל תגובה באותה קלות","שהתניה קלאסית עובדת רק עם צלילים"],"e":"הם מצאו שחלק מהקשרים (כמו טעם ובחילה) נלמדים בקלות, וחלק לא. כלומר יש ״הכנה״ ביולוגית."},{"q":"למה פרסומות מצמידות מוצר לדמות אטרקטיבית?","a":"כדי שהמוצר לבד יעורר רגש חיובי","w":["כדי לחזק את הקונה אחרי שקנה","כדי שהצופים יחקו את הדמות במדויק","כדי להכחיד רגש שלילי כלפי המוצר"],"e":"זו התניה קלאסית: הדמות מעוררת רגש חיובי, ואחרי צימוד המוצר עצמו מעורר אותו."}]},"q11":{"t":"t3","v":[{"q":"מה זו הכחדה בהתניה קלאסית?","a":"הצגת ה־CS בלי ה־UCS, עד שהתגובה נחלשת","w":["הצגת ה־UCS בלי ה־CS עד שהתגובה גדלה","הופעה מחדש של תגובה שנעלמה אחרי הפסקה","תגובה גם לגירויים שדומים לגירוי המותנה"],"e":"כשהצליל מופיע שוב ושוב בלי בשר, הריור נחלש. חזרת התגובה אחרי הפסקה היא התאוששות ספונטנית."},{"q":"אחרי הכחדה ומנוחה של כמה ימים, הכלב שוב מרייר לצליל. איך קוראים לזה?","a":"התאוששות ספונטנית","w":["רכישה מחדש של התגובה","הכללת גירוי","התניה מסדר שני"],"e":"תגובה שנכחדה יכולה לחזור אחרי הפסקה. זה מראה שההכחדה לא מחקה את הלמידה לגמרי."}]},"q12":{"t":"t3","v":[{"q":"החתולה טייגר רצה גם לחריקת הארון שנפתח לפני הפותחן. מה זה?","a":"התניה מסדר שני","w":["הכללת גירוי","הכחדה","התאוששות ספונטנית"],"e":"הפותחן (CS) הוצמד לחריקה, והחריקה הפכה בעצמה ל־CS. מעבר לסדר שני קשה מאוד להגיע."}]},"q13":{"t":"t3","v":[{"q":"אלברט הקטן התחיל לפחד גם מחפצים פרוותיים אחרים. מה זה?","a":"הכללת גירוי","w":["הבחנה בין גירויים","הכחדה","למידה סמויה"],"e":"התגובה התרחבה לגירויים שדומים לעכברוש הלבן. אילו פחד רק מהעכברוש, זו הייתה הבחנה."},{"q":"מה עשה ווטסון בניסוי אלברט הקטן?","a":"הצמיד עכברוש לבן לרעש חזק ומפחיד","w":["נתן לאלברט פרס בכל פעם שליטף עכברוש","הראה לאלברט ילד אחר שמפחד מעכברוש","השאיר את אלברט עם עכברוש עד שהתרגל אליו"],"e":"הרעש (UCS) עורר פחד (UCR), ואחרי צימוד העכברוש (CS) עורר פחד (CR). היום הניסוי נחשב לא אתי."}]},"q14":{"t":"t3","v":[{"q":"ג׳וליאן נבהל עכשיו רק מגלים שנשברים מהר, ולא מכל גל גבוה. איזה תהליך זה?","a":"הבחנה בין גירויים","w":["הכללת גירוי","התאוששות ספונטנית","התניה מסדר שני"],"e":"הוא מגיב רק לגירוי המסוים ולא לדומים לו. זו הבחנה."}]},"q15":{"t":"t4","v":[{"q":"מה אומר חוק האפקט של ת׳ורנדייק?","a":"התנהגות שבאה אחריה תוצאה נעימה תחזור","w":["גירוי ניטרלי שמוצמד לגירוי טבעי יעורר תגובה","לומדים התנהגות מצפייה במודלים שמקבלים פרס","התנהגות נלמדת רק כשהיא נלמדת בהדרגה"],"e":"ת׳ורנדייק (1911): תוצאה נעימה מגבירה התנהגות, ולא נעימה מפחיתה. סקינר בנה על הרעיון הזה."},{"q":"למה סקינר טען שצריך התניה אופרנטית ולא רק קלאסית?","a":"קלאסית מסבירה רק רפלקסים, לא התנהגויות חדשות","w":["קלאסית עובדת רק בחיות מעבדה, ולא בבני אדם","קלאסית לא עובדת בכלל לפי המחקר שלו","אופרנטית לא דורשת שום תוצאה"],"e":"לפי סקינר, קלאסית מסבירה תגובות רפלקסיביות קיימות, אבל לא איך לומדים, למשל, לרכוב על אופניים."}]},"q16":{"t":"t4","v":[{"q":"מה הבדל מרכזי בין התניה קלאסית לאופרנטית?","a":"באופרנטית ההתנהגות באה קודם, והתוצאה אחריה","w":["בקלאסית ההתנהגות באה קודם, והגירוי אחריה","באופרנטית אין שום תוצאה להתנהגות","בקלאסית תמיד יש פרס על ההתנהגות"],"e":"בקלאסית מצמידים שני גירויים לפני התגובה. באופרנטית התוצאה מגיעה אחרי ההתנהגות וקובעת אם תחזור."}]},"q17":{"t":"t4","v":[{"q":"הצפצוף ברכב נפסק כשחוגרים חגורה, ולכן חוגרים. מה זה?","a":"חיזוק שלילי","w":["עונש שלילי","עונש חיובי","חיזוק חיובי"],"e":"מורידים משהו לא נעים (שלילי), וההתנהגות גדלה (חיזוק)."},{"q":"לוקחים לילד את הצעצוע האהוב כי הכה את אחיו. מה זה?","a":"עונש שלילי","w":["חיזוק שלילי","עונש חיובי","חיזוק חיובי"],"e":"מורידים משהו נעים (שלילי), כדי להפחית התנהגות (עונש)."}]},"q18":{"t":"t4","v":[{"q":"מה פירוש ״חיובי״ בחיזוק חיובי?","a":"מוסיפים משהו","w":["התוצאה טובה לילד","ההתנהגות רצויה","הילד מרוצה"],"e":"חיובי = הוספה, שלילי = הורדה. זה לא קשור לטוב או רע."},{"q":"איזה משפט נכון?","a":"חיזוק, גם שלילי, תמיד מגביר התנהגות","w":["חיזוק שלילי הוא סוג של עונש קל","עונש חיובי מגביר התנהגות רצויה","חיזוק שלילי מפחית התנהגות לא רצויה"],"e":"כל חיזוק מגביר התנהגות, וכל עונש מפחית. חיזוק שלילי הוא לא עונש."}]},"q19":{"t":"t4","v":[{"q":"מה מצא גרשוף על עונש גופני?","a":"הוא קשור לפחד ולתוקפנות רבה יותר","w":["הוא הדרך היעילה ביותר להפסיק התנהגות","אין לו שום השפעה ארוכת טווח","הוא משפר את היחס לבית הספר"],"e":"עונש גופני קשור לפחד מהמעניש, להימנעות מבית הספר ולתוקפנות. לכן ממליצים לחזק התנהגות טובה."},{"q":"איזה סוג תגובה הוא פסק זמן?","a":"עונש שלילי","w":["עונש חיובי","חיזוק שלילי","חיזוק חיובי"],"e":"מוציאים את הילד מפעילות נעימה (הורדה), כדי להפחית התנהגות (עונש)."}]},"q20":{"t":"t4","v":[{"q":"לפי הפרק, כמה זמן מומלץ לפסק זמן לילד בן 5?","a":"כ־5 דקות","w":["כ־30 דקות","כשעה","עד שהילד מפסיק לבכות, בלי הגבלה"],"e":"ההמלצה: בערך דקה לכל שנת גיל, ברוגע, ובסוף מילה טובה."}]},"q21":{"t":"t5","v":[{"q":"מה זה עיצוב?","a":"חיזוק קירובים הדרגתיים עד ההתנהגות הרצויה","w":["חיזוק רק של ההתנהגות המלאה, כבר מההתחלה","צימוד של שני גירויים עד שנוצרת תגובה","חיקוי של מודל שקיבל פרס"],"e":"בעיצוב מחזקים קודם כל דבר דומה, ואז רק מה שקרוב יותר, עד שמחזקים רק את ההתנהגות המלאה."},{"q":"אבא של ג׳וליאן משבח אותו קודם על שכיבה יציבה, אחר כך על כריעה, ובסוף רק על עמידה. מה הוא עושה?","a":"עיצוב","w":["הכחדה","חיזוק לפי יחס משתנה","התניה מסדר שני"],"e":"אלה קירובים הדרגתיים להתנהגות המטרה (גלישה בעמידה)."}]},"q22":{"t":"t5","v":[{"q":"למה צריך עיצוב כדי ללמד התנהגות מורכבת?","a":"כי ההתנהגות המלאה כמעט לא מופיעה מעצמה","w":["כי חיזוק רציף לא עובד בכלל","כי בעלי חיים לא לומדים בהתניה אופרנטית","כי צריך קודם הכחדה של התנהגות קודמת"],"e":"אי אפשר לחזק התנהגות שעוד לא קרתה. לכן מתחילים ממה שקרוב אליה."}]},"q23":{"t":"t5","v":[{"q":"מהו מחזק משני?","a":"משהו שקיבל ערך מקשר למחזק ראשוני","w":["משהו שיש לו ערך מולד, כבר מרגע הלידה","חיזוק שניתן בפעם השנייה","חיזוק שניתן לאדם אחר"],"e":"כסף, שבח ואסימונים שווים משהו כי הם קשורים למחזקים ראשוניים כמו אוכל ונוחות."},{"q":"איזה מבין אלה מחזק ראשוני?","a":"מים","w":["כסף","מדבקה","שבח"],"e":"למים יש ערך מולד. כסף, מדבקות ושבח הם מחזקים משניים."}]},"q24":{"t":"t5","v":[{"q":"מה עשו במחקר על ילדים עם אוטיזם וכלכלת אסימונים?","a":"נתנו אסימון על התנהגות מתאימה ולקחו על מכות","w":["נתנו אסימון רק על מכות, כדי לספור כמה היו","נתנו ממתק מיד על כל התנהגות","לא נתנו שום פרס ורק צפו"],"e":"הילדים צברו אסימונים והחליפו אותם בזמן משחק. איבוד אסימון על מכות הוא עונש שלילי."}]},"q25":{"t":"t5","v":[{"q":"איזה לוח חיזוק הכי עמיד להכחדה?","a":"יחס משתנה","w":["מרווח קבוע","יחס קבוע","חיזוק רציף"],"e":"כשלא יודעים מתי יגיע הפרס, ממשיכים לנסות הרבה זמן. לכן הימורים כל כך עמידים."},{"q":"עמלה על כל זוג משקפיים שנמכר היא:","a":"יחס קבוע","w":["יחס משתנה","מרווח קבוע","מרווח משתנה"],"e":"הפרס מגיע אחרי מספר קבוע של תגובות (כל מכירה). זה יוצר קצב גבוה עם הפוגות."}]},"q26":{"t":"t5","v":[{"q":"בדיקה חוזרת של פייסבוק כי לא יודעים מתי תהיה הודעה מעניינת היא:","a":"מרווח משתנה","w":["מרווח קבוע","יחס קבוע","יחס משתנה"],"e":"הפרס תלוי בזמן שעובר, והזמן לא צפוי. זה יוצר קצב בינוני ויציב."},{"q":"מתי עדיף להשתמש בחיזוק רציף?","a":"כשמלמדים התנהגות חדשה","w":["כשרוצים התנהגות שתחזיק הכי הרבה זמן","כשרוצים שההתנהגות תיכחד מהר","כשההתנהגות כבר נלמדה היטב"],"e":"חיזוק רציף מלמד הכי מהר. אחרי שההתנהגות נלמדה עוברים לחיזוק חלקי, שעמיד יותר להכחדה."}]},"q27":{"t":"t6","v":[{"q":"מה הראו החולדות של טולמן?","a":"הן למדו את המבוך גם בלי פרס","w":["הן לא למדו את המבוך עד שקיבלו פרס","הן למדו רק בחיזוק לפי יחס משתנה","הן למדו רק מצפייה בחולדות אחרות"],"e":"הן בנו מפה קוגניטיבית בלי חיזוק, וכשהופיע אוכל הן הגיעו אליו מהר כמו חולדות שקיבלו פרס כל הזמן."},{"q":"ראווי רכב לבית הספר בדרך שלמד כנוסע. מה זה מדגים?","a":"למידה סמויה","w":["עיצוב","התניה קלאסית","עונש שלילי"],"e":"הוא למד את הדרך בלי חיזוק, והלמידה הופיעה רק כשהיה לה צורך."}]},"q28":{"t":"t6","v":[{"q":"מה הייתה העמדה של סקינר לגבי הנפש?","a":"״קופסה שחורה״ שאין טעם לחקור","w":["המקום שבו נבנות מפות קוגניטיביות","החלק החשוב ביותר בכל למידה","מקור הלמידה מצפייה"],"e":"סקינר היה ביהביוריסט רדיקלי. טולמן ובנדורה חלקו עליו והדגישו תהליכים פנימיים."}]},"q29":{"t":"t6","v":[{"q":"איך מסווג ההימור הכפייתי ב־DSM-5?","a":"כהתמכרות","w":["כהפרעת שליטה בדחפים","כהפרעת חרדה","הוא לא מופיע ב־DSM-5"],"e":"ב־DSM-5 הוא סווג כהתמכרות. בגרסאות קודמות הוא היה הפרעת שליטה בדחפים."},{"q":"למה קשה לדעת מה גורם להימורים כפייתיים?","a":"אסור מבחינה אתית להפוך אנשים למהמרים בניסוי","w":["כי אף מחקר לא מצא קשר בין הימורים לדופמין","כי הימורים לא מפעילים את המוח","כי רק יונים נבדקו"],"e":"אפשר למצוא קשרים (למשל עם דופמין), אבל בלי ניסוי קשה לקבוע סיבתיות."}]},"q30":{"t":"t6","v":[{"q":"מה מצאו לגבי ״כמעט ניצחון״ בהימורים?","a":"הוא מפעיל אזורי תגמול במוח","w":["הוא גורם למהמר להפסיק מיד","הוא מפעיל רק אזורי כאב במוח","אין לו שום השפעה על המוח"],"e":"גם ״כמעט ניצחון״ מפעיל את מסלולי התגמול, וזה עוזר להבין למה ממשיכים להמר."}]},"q31":{"t":"t7","v":[{"q":"מהו מודל סימבולי?","a":"דמות בספר, סרט, משחק או ברשת","w":["אדם שמדגים מול העיניים","אדם שמסביר במילים בלי להדגים","הורה שמעניש את הילד"],"e":"מודל חי מדגים, מילולי מסביר, וסימבולי מופיע במדיה."},{"q":"מה טען בנדורה על ביהביוריזם טהור?","a":"הוא לא מסביר למידה בלי חיזוק חיצוני","w":["הוא מסביר את כל סוגי הלמידה בלי חריג","הוא מתאים רק לבני אדם ולא לחיות","הוא סותר את כל מחקרי ההתניה"],"e":"בנדורה הוסיף את המצבים הפנימיים ואת הלמידה מצפייה, שקורית גם בלי חיזוק ישיר."}]},"q32":{"t":"t7","v":[{"q":"לאיזה מנגנון מוחי הפרק קושר למידה מצפייה?","a":"נוירוני מראה","w":["מסלולי הדופמין של התגמול","גיזום של סינפסות","הכחדה של תגובות"],"e":"נוירוני מראה פעילים גם כשעושים פעולה וגם כשרואים אחר עושה אותה."}]},"q33":{"t":"t7","v":[{"q":"מה הסדר של ארבעת השלבים של בנדורה?","a":"קשב, שימור, שחזור, מוטיבציה","w":["מוטיבציה, קשב, שחזור, שימור","שימור, קשב, מוטיבציה, שחזור","קשב, שחזור, שימור, מוטיבציה"],"e":"קודם שמים לב, אחר כך זוכרים, אחר כך מסוגלים לבצע, ובסוף רוצים לבצע."},{"q":"בניסוי בובת בובו, מתי הילדים חיקו פחות את התוקפנות?","a":"כשהמבוגר נענש","w":["כשהמבוגר קיבל שבח","כשהתעלמו מהמבוגר","בכל המצבים באותה מידה"],"e":"עונש עקיף הפחית חיקוי. כשהמבוגר קיבל שבח או שהתעלמו ממנו, הילדים חיקו."}]},"q34":{"t":"t7","v":[{"q":"מה זה חיזוק עקיף?","a":"המודל מקבל פרס, ולכן הצופה מחקה יותר","w":["הצופה מקבל פרס על כך שהסתכל במודל","הפרס מגיע באיחור של יום","מקבלים פרס על התנהגות של חבר"],"e":"לא הצופה מקבל את הפרס אלא המודל, וזה מגביר את המוטיבציה לחקות."}]},"q35":{"t":"t7","v":[{"q":"מה ילדים מחקים יותר לפי הפרק?","a":"את מה שמבוגרים עושים","w":["את מה שמבוגרים אומרים","רק את מה שמקבל פרס מיידי","רק דמויות סימבוליות"],"e":"ילדים נוטים לחקות התנהגות יותר מאשר הוראות מילוליות. לכן ההורים הם מודלים חשובים."},{"q":"מה עמדתו של פרגוסון על מחקרי אלימות במדיה?","a":"הם לא שקללו מספיק גורמים אחרים","w":["הם הוכיחו קשר סיבתי חזק וברור","אין צורך במחקרים נוספים בנושא","אלימות במדיה מפחיתה תוקפנות"],"e":"אנדרסון מצא ראיות לקשר סיבתי. פרגוסון טוען שגורמים כמו בריאות נפשית ומשפחה לא נבדקו מספיק."}]},"q36":{"t":"t7","v":[{"q":"מה הבינה קלייר כשראתה את בתה מצליפה בדובי?","a":"שהבת למדה ממנה את הענישה","w":["שהבת קיבלה עונש מהגננת","שהבת למדה את זה מטלוויזיה","שהדובי היה פגום"],"e":"זו דוגמה ללמידה מצפייה עם השפעה אנטי־חברתית: הילדה חיקתה את מה שראתה אצל אמא."}]}};
const H={"h1":{"t":"t1","v":[{"q":"גור חתולים שמעולם לא ראה חתול אחר צד עכבר בפעם הראשונה בצורה מושלמת. איך נקראת ההתנהגות הזו?","a":"אינסטינקט: התנהגות מולדת ומורכבת בלי ניסיון","w":["רפלקס: תגובה פשוטה ואוטומטית לגירוי מסוים","למידה מצפייה: הוא חיקה חתולים שראה בעבר","התניה אופרנטית: הוא קיבל חיזוק על ציד קודם"],"e":"הגור לא ראה ולא ניסה קודם, וההתנהגות מורכבת. זה אינסטינקט. רפלקס הוא תגובה פשוטה, כמו רפלקס הברך."},{"q":"תינוק נבהל ומותח את הידיים כשנשמע רעש פתאומי, כבר מהיום הראשון. מה זה?","a":"רפלקס: תגובה מולדת, פשוטה ואוטומטית לגירוי","w":["אינסטינקט: התנהגות מולדת ומורכבת שמופעלת ממצב רחב","התניה קלאסית: הוא למד לקשר רעש לסכנה","למידה סמויה: הוא למד בלי חיזוק ומראה זאת עכשיו"],"e":"מדובר בתגובה פשוטה ומיידית לגירוי מסוים, בלי שום ניסיון קודם. זה רפלקס."}]},"h2":{"t":"t2","v":[{"q":"מיכל הייתה בבית חולים, ובכל בדיקת דם הריחו שם אלכוהול לחיטוי. היום, ריח של אלכוהול גורם לה ללחץ. מה הגירוי המותנה?","a":"ריח האלכוהול, שנקשר לדקירה הכואבת","w":["הדקירה הכואבת, שגרמה ללחץ באופן טבעי","הלחץ שהיא מרגישה כשהיא מריחה אלכוהול","בית החולים, שבו התרחשו כל הבדיקות"],"e":"הדקירה = UCS (כואבת באופן טבעי). ריח האלכוהול היה ניטרלי, והפך לגירוי מותנה. הלחץ מהריח = CR."},{"q":"כלב מתרגש בכל פעם שבעליו לוקחת את הרצועה, כי אחרי זה תמיד יוצאים לטיול. מה התגובה המותנית?","a":"ההתרגשות מהרצועה עצמה","w":["ההתרגשות מהטיול עצמו","הרצועה שבעליו לוקחת","הטיול שבא אחרי הרצועה"],"e":"הטיול הוא UCS, וההתרגשות ממנו UCR. הרצועה הפכה לגירוי מותנה, וההתרגשות ממנה היא התגובה המותנית."}]},"h3":{"t":"t2","v":[{"q":"לפי גרסיה וקולינג, למה קל יותר לחולדה לקשר טעם לבחילה מאשר צליל לבחילה?","a":"מגבלות ביולוגיות: קשר טעם־מחלה עזר לשרוד","w":["טעם מגיע תמיד מיד לפני הבחילה, וצליל לא","חולדות לא שומעות טוב, ולכן לא לומדות מצליל","צליל דורש התניה אופרנטית, וטעם התניה קלאסית"],"e":"סלידה מטעם נוצרת אפילו אחרי שעות ואחרי פעם אחת. זה מראה שלא כל קשר קל ללמוד באותה מידה."}]},"h4":{"t":"t3","v":[{"q":"אחרי שהכלב של פבלוב למד לרייר לצליל, מנגנים לו את הצליל שוב ושוב בלי אוכל, והריור נעלם. למחרת, בניסוי חדש, הוא שוב מרייר קצת לצליל. איך נקרא מה שקרה למחרת?","a":"התאוששות ספונטנית, שמראה שהלמידה לא נמחקה","w":["רכישה מחדש, שמראה שהכלב למד את הקשר מההתחלה","הכללה, שמראה שהכלב מגיב לכל צליל דומה","התניה מסדר שני, שמראה שהצליל לימד גירוי חדש"],"e":"אחרי הכחדה ומנוחה, התגובה חוזרת לרגע. זו הסיבה שאומרים שהכחדה היא לא שכחה."}]},"h5":{"t":"t3","v":[{"q":"ילד ננשך פעם על ידי כלב גדול, ועכשיו הוא מפחד מכל הכלבים, גם מגורים קטנים. מה מתאר המקרה?","a":"הכללה: התגובה הנלמדת מופיעה גם לגירויים דומים","w":["הבחנה: הילד מגיב רק לכלבים שדומים לזה שנשך","הכחדה: הפחד נחלש כי רוב הכלבים לא נושכים","התאוששות ספונטנית: הפחד חזר אחרי תקופה"],"e":"כמו אלברט הקטן, שפחד גם מדברים פרוותיים: הפחד מהגירוי המקורי ״התפשט״ לגירויים דומים."},{"q":"ילדה למדה שהצלצול בטלפון של אמא מבשר על שיחה עם סבתא, ומתרגשת. לצלצולים של טלפונים אחרים היא לא מגיבה. מה זה?","a":"הבחנה: מגיבים רק לגירוי המסוים, לא לדומים","w":["הכללה: מגיבים גם לגירויים דומים לגירוי המקורי","הכחדה: התגובה נחלשת כי הקשר הפסיק","התניה מסדר שני: הצלצול לימד גירוי חדש"],"e":"היא לא מגיבה לצלצולים דומים, רק לזה שקשור לשיחות עם סבתא. זה ההפך מהכללה."}]},"h6":{"t":"t4","v":[{"q":"נהג נעצר לפני מצלמת מהירות, כי בפעם הקודמת קיבל קנס. מה פעל על ההתנהגות שלו בפעם הקודמת?","a":"עונש חיובי: נוסף משהו לא נעים, והנהיגה המהירה ירדה","w":["עונש שלילי: נלקח משהו נעים, והנהיגה המהירה ירדה","חיזוק שלילי: נוסף משהו לא נעים, והזהירות עלתה","חיזוק חיובי: נלקח משהו לא נעים, והזהירות עלתה"],"e":"ההתנהגות (מהירות) ירדה ← עונש. נוסף משהו (קנס) ← חיובי. עונש חיובי."},{"q":"נועה מגישה עבודה בזמן, והמרצה מוותר לה על בוחן. מאז היא מגישה הכול בזמן. מה פעל כאן?","a":"חיזוק שלילי: הורידו משהו לא נעים, וההתנהגות עלתה","w":["חיזוק חיובי: הוסיפו משהו נעים, וההתנהגות עלתה","עונש שלילי: הורידו משהו נעים, וההתנהגות ירדה","עונש חיובי: הוסיפו משהו לא נעים, וההתנהגות ירדה"],"e":"ההתנהגות (הגשה בזמן) עלתה ← חיזוק. הורידו משהו (הבוחן) ← שלילי. חיזוק שלילי, וזה לא עונש."}]},"h7":{"t":"t4","v":[{"q":"נער מקלל ליד השולחן, וההורים לוקחים לו את הטלפון לערב. הוא מקלל פחות. איזה סוג עונש זה, ולמה?","a":"עונש שלילי, כי לקחו משהו נעים וההתנהגות ירדה","w":["עונש חיובי, כי ההורים עשו משהו לא נעים לנער","חיזוק שלילי, כי לקחו משהו וההתנהגות השתנתה","חיזוק חיובי, כי ההורים לימדו אותו התנהגות טובה"],"e":"שתי השאלות: ההתנהגות ירדה ← עונש. הורידו משהו (טלפון) ← שלילי. כמו פסק זמן."}]},"h8":{"t":"t4","v":[{"q":"ילדה שהוריה מכים אותה כשהיא לא מצייתת מתחילה להרביץ לילדים בגן. מה הספר אומר על זה?","a":"עונש גופני קשור לתוקפנות: היא למדה שמכה פותרת","w":["עונש גופני יעיל, והתוקפנות בגן אינה קשורה אליו","עונש גופני מפחית תוקפנות, אם הוא עקבי ומיידי","עונש גופני עובד רק עם ילדים מעל גיל מסוים"],"e":"כמו ברנדה בספר: לפי גרשוף, מכות קשורות לפחד ולתוקפנות. ממליצים לחזק התנהגות טובה במקום."}]},"h9":{"t":"t5","v":[{"q":"מאמנת רוצה ללמד ילד לזרוק לסל מקו העונשין. קודם היא משבחת כל זריקה שפוגעת בלוח, אחר כך רק בטבעת, ובסוף רק סל. איך נקרא זה?","a":"עיצוב: חיזוק של צעדים שמתקרבים להתנהגות הרצויה","w":["למידה סמויה: הילד לומד בלי חיזוק ומראה זאת בסוף","יחס משתנה: השבח מגיע אחרי מספר לא צפוי של זריקות","התניה מסדר שני: השבח לימד את הלוח להיות מחזק"],"e":"עיצוב = מחזקים קירובים הדרגתיים. כמו אבא של ג׳וליאן, ששיבח קודם שכיבה, אחר כך כריעה, ובסוף עמידה."}]},"h10":{"t":"t5","v":[{"q":"עובד במפעל מקבל תשלום על כל 20 חולצות שהוא תופר. איזה לוח חיזוק זה, ואיך יעבוד?","a":"יחס קבוע: קצב גבוה, עם הפסקה קצרה אחרי כל תשלום","w":["מרווח קבוע: קצב נמוך, שעולה רק לקראת סוף החודש","יחס משתנה: קצב גבוה ויציב, הכי עמיד להכחדה","מרווח משתנה: קצב בינוני ויציב לאורך כל היום"],"e":"החיזוק תלוי במספר (20 חולצות) ← יחס. המספר תמיד זהה ← קבוע."},{"q":"אדם בודק את תיבת הדואר בכל כמה שעות, כי הוא לא יודע מתי יגיע מכתב חשוב. איזה לוח חיזוק זה?","a":"מרווח משתנה: תלוי בזמן, ואי אפשר לדעת מתי","w":["יחס משתנה: החיזוק תלוי במספר הבדיקות שעשה","מרווח קבוע: המכתב מגיע תמיד באותה שעה","יחס קבוע: כל בדיקה עשירית מביאה מכתב"],"e":"הבדיקות לא ״מייצרות״ מכתב, הזמן כן ← מרווח. ואי אפשר לדעת מתי ← משתנה."}]},"h11":{"t":"t5","v":[{"q":"מכונת מזל משלמת אחרי מספר לא צפוי של משיכות. מה הפרק מנבא על התנהגות המהמר כשהזכיות יפסיקו?","a":"ימשיך הרבה זמן, כי יחס משתנה הכי עמיד להכחדה","w":["הוא יפסיק מהר, כי חיזוק חלקי לומדים הכי לאט","הוא יפסיק מיד, כי הזכייה הפסיקה להיות צפויה","הוא ימשיך רק עד הזמן הקבוע של הזכייה הבאה"],"e":"כשאי אפשר לדעת מתי יגיע הפרס, כל משיכה ״אולי זו היא״. לכן קשה מאוד להפסיק, וזה חלק מההסבר להתמכרות להימורים."}]},"h12":{"t":"t5","v":[{"q":"גננת נותנת כוכב על כל פעם שילד מסדר, ו־10 כוכבים מתחלפים בצעצוע. מה הכוכבים, לפי הפרק?","a":"מחזק משני, שערכו נלמד, בכלכלת אסימונים","w":["מחזק ראשוני, שהערך שלו מולד, כמו אוכל ומים","עונש שלילי, כי לוקחים כוכבים כשהילד לא מסדר","גירוי בלתי מותנה, שמעורר הנאה בלי למידה"],"e":"לכוכבים אין ערך מולד. הם שווים משהו כי אפשר להחליף אותם בפרס. זה מחזק משני."}]},"h13":{"t":"t6","v":[{"q":"אורי נוסע כל יום באוטובוס לעבודה ולא שם לב לדרך. יום אחד האוטובוס מתקלקל, והוא הולך ברגל ומגיע בלי לטעות. מה זה מדגים?","a":"למידה סמויה: הוא בנה מפה קוגניטיבית בלי חיזוק","w":["התניה אופרנטית: הוא קיבל חיזוק על כל נסיעה","למידה מצפייה: הוא חיקה את נהג האוטובוס","הכללה: הוא הכליל מהדרך באוטובוס לכל הדרכים"],"e":"כמו החולדות של טולמן או ראווי בספר: הלמידה קרתה בלי פרס, והופיעה רק כשהיה לה צורך."}]},"h14":{"t":"t6","v":[{"q":"מה טולמן הראה שסקינר לא יכול היה להסביר?","a":"שיש תהליכים מחשבתיים בלמידה, כמו מפה קוגניטיבית","w":["שחיזוק חיובי חזק יותר מחיזוק שלילי בכל מצב","שבעלי חיים לא מסוגלים ללמוד בלי עונש","שהתניה קלאסית מסבירה את כל סוגי ההתנהגות"],"e":"סקינר ראה בנפש ״קופסה שחורה״. טולמן הראה שהחולדות למדו את המבוך בלי פרס, כלומר משהו קרה ״בראש״."}]},"h15":{"t":"t7","v":[{"q":"נער רוצה לנגן בגיטרה כמו הזמר האהוב עליו. הוא צופה בהופעות, זוכר את התנועות, אבל עוד אין לו מספיק כוח באצבעות כדי לנגן. איזה שלב חסר?","a":"שחזור: היכולת הפיזית לבצע את מה שראה","w":["קשב: הוא לא שם לב מספיק להופעות","שימור: הוא לא זוכר את מה שראה בהן","מוטיבציה: הוא לא באמת רוצה לנגן בעצמו"],"e":"ארבעת השלבים: קשב, שימור, שחזור, מוטיבציה. הוא שם לב, זוכר ורוצה, אבל עוד לא מסוגל פיזית."}]},"h16":{"t":"t7","v":[{"q":"ילד רואה את אחיו הגדול מקבל מחמאות על עזרה בבית, ומתחיל לעזור גם הוא. איך נקרא מה שהשפיע עליו?","a":"חיזוק עקיף: המודל קיבל פרס, ולכן מחקים יותר","w":["חיזוק חיובי: הילד עצמו קיבל מחמאה על העזרה","עונש עקיף: המודל נענש, ולכן הילד מחקה פחות","התניה קלאסית: הילד קישר בין עזרה למחמאה"],"e":"הילד לא קיבל בעצמו את החיזוק, הוא ראה את האח מקבל אותו. זה חיזוק עקיף, חלק מלמידה מצפייה."}]},"h17":{"t":"t7","v":[{"q":"בניסוי בובת בובו, איזה מצב של המבוגר הוביל את הילדים לחקות אותו הכי פחות?","a":"כשהמבוגר נענש על ההתנהגות התוקפנית","w":["כשהמבוגר קיבל שבח על ההתנהגות התוקפנית","כשהתעלמו מהמבוגר ולא קרה לו כלום","כשהמבוגר הסביר לילדים למה הוא מכה"],"e":"רק עונש למודל הפחית חיקוי. שבח, וגם התעלמות, הובילו לחיקוי של מכות, בעיטות ומילים."}]},"h18":{"t":"t7","v":[{"q":"הורה אומר לילד ״אסור לצעוק״, אבל בעצמו צועק כשהוא כועס. לפי הפרק, מה הילד צפוי ללמוד?","a":"לצעוק, כי ילדים מחקים יותר מה שמבוגרים עושים","w":["לא לצעוק, כי ילדים מקשיבים יותר למה שמבוגרים אומרים","לצעוק רק כשמותר, כי הוא יבחין בין המצבים","שום דבר, כי למידה דורשת חיזוק ישיר לילד"],"e":"הספר מציין שילדים מחקים את מה שמבוגרים עושים יותר ממה שהם אומרים. זו למידה מצפייה."}]}};
const K={"t1:0": [{"q": "ציפורים נודדות דרומה בסתיו בלי שמישהו לימד אותן. איך זה מסווג, ולמה?", "a": "אינסטינקט: מורכב, וכל הגוף מעורב", "w": ["רפלקס: פשוט, ותגובה לגירוי מסוים", "למידה: נובעת מניסיון של שנים", "התניה: קשר בין עונה לבין אוכל"], "e": "אינסטינקט מופעל מאירועים רחבים כמו עונות, הוא מורכב ומעורב בו כל הגוף. רפלקס פשוט ומקומי."}, {"q": "מה מבדיל את הגלישה של ג׳וליאן מהזחילה של צבי הים אל המים?", "a": "היא נרכשת מניסיון, ולא מולדת", "w": ["היא רפלקס שנשלט במוח המוארך", "היא אינסטינקט שמופעל מאירוע רחב", "היא מולדת, אבל מופיעה מאוחר יותר"], "e": "למידה היא שינוי קבוע יחסית בהתנהגות או בידע שנובע מניסיון. בניגוד לרפלקס ולאינסטינקט, צריך לרכוש אותה."}], "t1:1": [{"q": "ג׳וליאן חוזר לעמוד נכון על הגלשן כי זה כיף לו. איזה סוג למידה זה?", "a": "התניה אופרנטית: התנהגות ותוצאה", "w": ["התניה קלאסית: גירוי עם גירוי", "למידה מצפייה: חיקוי של מודל", "למידה סמויה: בלי שום חיזוק"], "e": "בהתניה אופרנטית מקשרים בין התנהגות לתוצאה שלה. התוצאה הנעימה מגבירה את ההתנהגות."}, {"q": "למה אנחנו נבהלים כבר מהברק, לפני שהרעם מגיע?", "a": "התניה קלאסית: הברק תמיד בא לפני הרעם", "w": ["התניה אופרנטית: נבהלנו וקיבלנו פרס", "למידה מצפייה: ראינו אחרים נבהלים", "רפלקס מולד שאינו קשור ללמידה"], "e": "בהתניה קלאסית מקשרים גירוי עם גירוי. הברק מגיע לפני הרעם, ולכן לבד הוא מעורר בהלה."}], "t2:0": [{"q": "הכלבים של פבלוב התחילו לרייר כששמעו את צעדי העוזר. למה זה מעניין?", "a": "כי זו תגובה נלמדת לגירוי שלפני האוכל", "w": ["כי זה מראה שלכלבים יש שמיעה מצוינת", "כי זה רפלקס מולד של כל הכלבים", "כי העוזר נתן להם פרס על הריור"], "e": "צעדי העוזר הם גירוי שהגיע לפני האוכל. הכלבים קישרו אותם לאוכל, וזו התניה קלאסית."}, {"q": "בשלב ״לפני״ הצליל לא עורר ריור. מה היה הצליל בשלב הזה?", "a": "גירוי ניטרלי (NS)", "w": ["גירוי מותנה (CS)", "גירוי בלתי מותנה (UCS)", "תגובה מותנית (CR)"], "e": "לפני הלמידה הצליל לא מעורר תגובה, ולכן הוא גירוי ניטרלי. אחרי הצימוד הוא נעשה גירוי מותנה."}], "t2:1": [{"q": "כלב מרייר. איך יודעים אם זה UCR או CR?", "a": "לפי מה שעורר אותו: בשר או צליל", "w": ["לפי כמות הריור <div class="ex"><b>איך לזהות במבחן, שתי שאלות:</b><br>
① <b>״האם הגירוי מעורר את התגובה גם בלי שום למידה?״</b> כן ← UCS. לא, רק אחרי למידה ← CS.<br>
② <b>״למה התגובה מגיבה?״</b> לגירוי הטבעי ← UCR. לגירוי הנלמד ← CR.<br>
<b>שימו לב:</b> אותה תגובה (ריור) יכולה להיות UCR או CR. מה שקובע הוא <b>מה מעורר אותה</b>.</div>
<div class="ex"><b>דוגמה מהיומיום:</b> יואב אכל פיצה, ובלילה חלה בשפעת בטן והקיא. מאז, ריח של פיצה גורם לו בחילה.<br>
• מחלת הבטן = <b>UCS</b> (גורמת בחילה באופן טבעי). הבחילה מהמחלה = <b>UCR</b>.<br>
• ריח הפיצה = <b>NS</b> לפני, ו<b>CS</b> אחרי. הבחילה מריח פיצה = <b>CR</b>.<br>
<b>ועוד דוגמאות מהספר:</b> החתולה טייגר רצה למטבח כששומעת את פותחן הקופסאות, כי הוא ״מבשר״ על אוכל. מטופלת בכימותרפיה מרגישה בחילה כבר כשהיא נכנסת למשרד של הרופא. פרסומות מצמידות מוצר לדמות מושכת, כדי שנרגיש כלפי המוצר את מה שאנחנו מרגישים כלפי הדמות.</div>
<h4>תזמון, וחריג חשוב</h4>
<p>בדרך כלל הגירוי המותנה צריך להופיע <b>זמן קצר לפני</b> הגירוי הבלתי מותנה. <b>החריג: סלידה מטעם.</b> בדוגמה של יואב, הבחילה הגיעה שעות אחרי הפיצה, ובכל זאת נוצר קשר אחרי פעם אחת בלבד. <b>גרסיה וקולינג</b> הראו שיש <b>מגבלות ביולוגיות</b> על מה שקל ללמוד: לקשר טעם לבחילה קל מאוד, כנראה כי זה עזר לשרוד ולהימנע ממזון מורעל.</p>
<h4>ווטסון ואלברט הקטן</h4>
<div class="ex"><b>מה עשה:</b> ווטסון, מייסד הביהביוריזם, הראה לתינוק בן 9 חודשים עכברוש לבן. בהתחלה אלברט לא פחד. אז ווטסון הצמיד לעכברוש רעש חזק ומבהיל, שוב ושוב.<br>
<b>מה יצא:</b> אלברט התחיל לפחד מהעכברוש לבד, ואחר כך גם מדברים פרוותיים אחרים.<br>
<b>מה זה מלמד:</b> התניה קלאסית יכולה להסביר איך נוצרים חלק מהפחדים. היום הניסוי נחשב לא אתי.</div>

<h3>3. מה קורה לתגובה הנלמדת לאורך זמן</h3>
<div class="tw"><table><tr><th>תהליך</th><th>מה קורה</th><th>דוגמה</th></tr>
<tr><td><b>רכישה</b></td><td>הצימוד החוזר מחזק את התגובה</td><td>אחרי כמה פעמים, הכלב מרייר לצליל</td></tr>
<tr><td><b>התניה מסדר שני</b></td><td>גירוי מותנה ״מלמד״ גירוי חדש</td><td>טייגר רצה גם לחריקת הארון, שבא לפני הפותחן</td></tr>
<tr><td><b>הכחדה</b></td><td>הגירוי המותנה מופיע שוב ושוב <b>בלי</b> הבלתי מותנה, והתגובה נחלשת</td><td>הצליל מושמע בלי אוכל, והכלב מפסיק לרייר</td></tr>
<tr><td><b>התאוששות ספונטנית</b></td><td>אחרי הפסקה, התגובה ״חוזרת״ לרגע</td><td>יום אחרי ההכחדה, הכלב שוב מרייר קצת לצליל</td></tr>
<tr><td><b>הכללה</b></td><td>מגיבים גם לגירויים <b>דומים</b></td><td>אלברט פחד גם מדברים פרוותיים</td></tr>
<tr><td><b>הבחנה</b></td><td>מגיבים <b>רק</b> לגירוי המסוים, לא לדומים</td><td>הכלב מרייר רק לצליל הזה, לא לצלצול אחר</td></tr></table></div>
<div class="ex"><b>למה התאוששות ספונטנית חשובה:</b> היא מוכיחה שהכחדה היא <b>לא</b> שכחה. הלמידה עדיין שמורה. היא רק ״הושתקה״.</div>

<h3>4. התניה אופרנטית: לומדים מהתוצאות של מה שעשינו</h3>
<p>בהתניה הקלאסית לומדים קשר בין שני גירויים, והתגובה אוטומטית (ריור, פחד). אבל רוב ההתנהגויות שלנו לא אוטומטיות: אנחנו <b>בוחרים</b> לעשות אותן. כאן נכנסת ההתניה האופרנטית: ה<b>התנהגות באה קודם</b>, ו<b>התוצאה</b> שאחריה קובעת אם נחזור עליה.</p>
<ul>
<li><b>ת׳ורנדייק, ״חוק האפקט״:</b> התנהגות שמובילה לתוצאה נעימה תחזור. התנהגות שמובילה לתוצאה לא נעימה תפחת.</li>
<li><b>סקינר</b> פיתח את הרעיון. ב״קופסת סקינר״ חולדה לוחצת על מנוף ומקבלת אוכל, ולומדת ללחוץ שוב ושוב.</li>
</ul>
<h4>חיזוק ועונש, חיובי ושלילי: שתי שאלות פשוטות</h4>
<p>זה החלק שהכי מבלבל בפרק, כי ״חיובי״ ו״שלילי״ כאן <b>לא</b> אומרים ״טוב״ ו״רע״. הדרך הכי פשוטה היא לשאול שתי שאלות:</p>
<div class="ex"><b>שאלה 1: ״מה קרה להתנהגות אחרי זה?״</b><br>
היא <b>עלתה</b> ← זה <b>חיזוק</b>. היא <b>ירדה</b> ← זה <b>עונש</b>.<br><br>
<b>שאלה 2: ״הוסיפו משהו או הורידו משהו?״</b><br>
<b>הוסיפו</b> ← <b>חיובי</b> (כמו פלוס). <b>הורידו</b> ← <b>שלילי</b> (כמו מינוס).</div>
<div class="tw"><table><tr><th></th><th>ההתנהגות עולה (חיזוק)</th><th>ההתנהגות יורדת (עונש)</th></tr>
<tr><td><b>מוסיפים (חיובי)</b></td><td><b>חיזוק חיובי</b>: מוסיפים משהו נעים. ילד מסדר את החדר ומקבל שבח</td><td><b>עונש חיובי</b>: מוסיפים משהו לא נעים. ילד מקלל ומקבל נזיפה</td></tr>
<tr><td><b>מורידים (שלילי)</b></td><td><b>חיזוק שלילי</b>: מורידים משהו לא נעים. חוגרים חגורה והצפצוף באוטו נפסק</td><td><b>עונש שלילי</b>: מורידים משהו נעים. ילד מרביץ לאחיו ומאבד את הטלפון לערב</td></tr></table></div>
<div class="ex"><b>מקרה מלא לתרגול:</b> לסטודנטית כואב הראש, היא לוקחת כדור, והכאב עובר. בפעם הבאה שיכאב לה, היא תיקח כדור מהר יותר.<br>
שאלה 1: ההתנהגות (לקחת כדור) <b>עלתה</b> ← חיזוק.<br>
שאלה 2: <b>הורידו</b> משהו (את הכאב) ← שלילי.<br>
<b>התשובה: חיזוק שלילי.</b> שימו לב: חיזוק שלילי הוא <b>לא</b> עונש. כל חיזוק, חיובי או שלילי, <b>מגביר</b> התנהגות.<br><br>
<b>עוד מקרה:</b> נער חוזר מאוחר, וההורים לוקחים לו את המפתחות של האוטו לשבוע. הוא חוזר בזמן.<br>
שאלה 1: ההתנהגות (לאחר) <b>ירדה</b> ← עונש. שאלה 2: <b>הורידו</b> משהו נעים (האוטו) ← שלילי. <b>עונש שלילי.</b><br>
<b>פסק זמן</b> (לשלוח ילד לשבת לבד כמה דקות) הוא גם עונש שלילי: מורידים את ההנאה מהמשחק. ההמלצה: בערך דקה לכל שנת גיל.</div>
<div class="ex"><b>מה הספר אומר על עונש גופני:</b> מחקרים (גרשוף) מקשרים מכות לפחד ולתוקפנות אצל הילד. בדוגמה מהספר, ברנדה, שקיבלה מכות בבית, מרביצה לחברים בגן. היא למדה שמכה היא דרך לפתור בעיות. לכן ממליצים להתמקד בחיזוק של התנהגות טובה.</div>

<h3>5. עיצוב, סוגי מחזקים ולוחות חיזוק</h3>
<h4>עיצוב</h4>
<div class="ex"><b>הרעיון:</b> כשההתנהגות הרצויה מסובכת מדי כדי שתקרה לבד, מחזקים <b>צעדים קטנים</b> שמתקרבים אליה, אחד אחרי השני.<br>
<b>אצל ג׳וליאן:</b> אבא משבח אותו קודם כשהוא שוכב יציב על הגלשן. כשזה מצליח, השבח מגיע רק כשהוא כורע. ובסוף רק כשהוא עומד. כל שלב ״מוביל״ לבא.<br>
<b>מהיומיום:</b> מלמדים כלב לתת יד. קודם מחזקים כשהוא מרים רגל קצת, אחר כך רק כשהוא מרים גבוה, ובסוף רק כשהוא שם אותה ביד.</div>
<h4>מחזק ראשוני ומשני</h4>
<div class="ex"><b>מחזק ראשוני</b> = יש לו ערך <b>מולד</b>, לא צריך ללמוד שהוא טוב. אוכל, מים, מגע.<br>
<b>מחזק משני</b> = הערך שלו <b>נלמד</b>, כי הוא קשור למשהו אחר. כסף, ציונים, שבח, מדבקות.<br>
<b>כלכלת אסימונים:</b> נותנים ״אסימונים״ (מדבקות, נקודות) על התנהגות רצויה, ומחליפים אותם אחר כך בפרס. כמו טבלת מדבקות לילדים. האסימונים הם מחזק משני.</div>
<h4>לוחות חיזוק: מתי מקבלים את החיזוק</h4>
<p>חיזוק <b>רציף</b> (על כל פעם) מלמד הכי <b>מהר</b>. אחרי שההתנהגות נלמדה, עוברים לחיזוק <b>חלקי</b> (רק על חלק מהפעמים). יש ארבעה סוגים, וגם כאן עוזרות שתי שאלות:</p>
<div class="ex"><b>שאלה 1: ״החיזוק תלוי במספר הפעמים או בזמן?״</b><br>
במספר הפעמים שעשית ← <b>יחס</b>. בזמן שעבר ← <b>מרווח</b>.<br>
<b>שאלה 2: ״אפשר לדעת מראש מתי יגיע?״</b><br>
כן, תמיד אותו דבר ← <b>קבוע</b>. לא, משתנה כל פעם ← <b>משתנה</b>.</div>
<div class="tw"><table><tr><th>לוח</th><th>דוגמה</th><th>מה קורה להתנהגות</th></tr>
<tr><td><b>יחס קבוע</b></td><td>עמלה על כל 10 מכירות</td><td>קצב גבוה, עם הפסקה קצרה אחרי כל פרס</td></tr>
<tr><td><b>יחס משתנה</b></td><td>מכונת מזל: זוכים אחרי מספר לא צפוי של משיכות</td><td>קצב גבוה ויציב. <b>הכי עמיד להכחדה</b></td></tr>
<tr><td><b>מרווח קבוע</b></td><td>משכך כאבים שאפשר לקבל פעם בשעה</td><td>פעילות עולה ככל שמתקרב הזמן. הכי פחות עמיד</td></tr>
<tr><td><b>מרווח משתנה</b></td><td>בדיקת הודעות: לא יודעים מתי תגיע הודעה חדשה</td><td>קצב בינוני ויציב</td></tr></table></div>
<div class="ex"><b>למה יחס משתנה הכי עמיד:</b> כשאי אפשר לדעת מתי יגיע הפרס, כל ניסיון ״אולי זה יהיה הוא״. לכן קשה מאוד להפסיק. זו הסיבה שהימורים ממכרים. <b>אצל ג׳וליאן:</b> הגל הטוב מגיע אחרי מספר לא צפוי של ניסיונות, ולכן הוא ממשיך לחתור שוב ושוב.</div>

<h3>6. גם המחשבה משתתפת: למידה סמויה והימורים</h3>
<div class="ex"><b>סקינר</b> טען שאין צורך להתעניין במה שקורה ״בראש״. הנפש היא ״קופסה שחורה״, ומה שחשוב זה רק התנהגות ותוצאה.<br>
<b>טולמן</b> הראה שזה לא מספיק. חולדות הסתובבו במבוך <b>בלי</b> שום פרס. כשפתאום שמו אוכל בסוף המבוך, הן הגיעו אליו מהר מאוד, כאילו ידעו את הדרך כל הזמן. הן בנו בראש <b>מפה קוגניטיבית</b> של המבוך.<br>
<b>למידה סמויה</b> = למידה שקורית בלי חיזוק, ומופיעה בהתנהגות רק כשיש סיבה.<br>
<b>הדוגמה מהספר:</b> ראווי נסע עם אבא שלו לבית הספר שוב ושוב כנוסע. כשהתחיל לרכוב לבד באופניים, הוא ידע את הדרך, למרות שאף פעם לא ״למד״ אותה בכוונה.</div>
<div class="ex"><b>הימורים:</b> הם עובדים בלוח יחס משתנה, ומפעילים במוח את מסלולי הדופמין, גם כש״כמעט ניצחנו״. במדריך האבחנות DSM-5 הימורים מסווגים כ<b>התמכרות</b>. אבל הקשר הסיבתי לא ברור, כי אי אפשר לעשות ניסוי שבו גורמים לאנשים להתמכר.</div>

<h3>7. למידה מצפייה: לומדים מאחרים</h3>
<p>שני סוגי ההתניה דורשים <b>ניסיון אישי</b>. אבל הרבה דברים אנחנו לומדים בלי לנסות בעצמנו, רק מ<b>להסתכל</b>. <b>בנדורה</b> קרא לזה <b>למידה מצפייה</b>, או חיקוי מודל.</p>
<ul>
<li><b>שלושה סוגי מודלים:</b> <b>חי</b> (אבא של ג׳וליאן, שגולש לידו), <b>מילולי</b> (מישהו שמסביר במילים איך עושים), ו<b>סימבולי</b> (דמויות בסרטים, בספרים ובמדיה). כנראה ש<b>נוירוני מראה</b>, תאי מוח שפעילים גם כשעושים פעולה וגם כשרואים מישהו אחר עושה אותה, קשורים לזה.</li>
</ul>
<div class="ex"><b>ארבעת השלבים של חיקוי מוצלח (לפי הסדר):</b><br>
① <b>קשב:</b> ג׳וליאן צריך לשים לב לאבא שלו כשהוא גולש.<br>
② <b>שימור:</b> הוא צריך לזכור מה ראה.<br>
③ <b>שחזור:</b> הוא צריך להיות <b>מסוגל פיזית</b> לעשות את זה. ילד בן 3 לא יוכל לגלוש, גם אם יזכור הכול.<br>
④ <b>מוטיבציה:</b> הוא צריך <b>לרצות</b> לעשות את זה.<br>
<b>אם שלב אחד חסר, אין חיקוי.</b></div>
<div class="ex"><b>חיזוק ועונש עקיפים:</b> כשרואים שהמודל קיבל פרס (<b>חיזוק עקיף</b>), מחקים יותר. כשרואים שהוא נענש (<b>עונש עקיף</b>), מחקים פחות. <b>מהיומיום:</b> ראית שחבר קיבל קנס על חנייה במקום מסוים, אז אתה לא חונה שם.</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em">ניסוי בובת בובו (בנדורה, 1961)</b><br>
<b>מה עשו:</b> ילדים צפו במבוגר שמכה ובועט בבובה מתנפחת ומקלל אותה. לחלק הראו שהמבוגר קיבל שבח, לחלק שנענש, ולחלק שלא קרה לו כלום.<br>
<b>מה יצא:</b> כשהמבוגר <b>נענש</b>, הילדים חיקו אותו פחות. כשהוא קיבל שבח <b>או שהתעלמו ממנו</b>, הם חיקו את המכות, הבעיטות ואפילו את המילים.<br>
<b>מה זה מלמד:</b> ילדים לומדים התנהגות תוקפנית רק מצפייה. ורק עונש למודל עוצר את החיקוי.</div>
<div class="ex"><b>השפעות טובות ורעות:</b><br>
<b>פרו־חברתיות:</b> ילדים מחקים מה שמבוגרים <b>עושים</b>, יותר ממה שהם <b>אומרים</b>. הורה שעוזר לשכנים מלמד עזרה טוב יותר מהורה שרק מטיף.<br>
<b>אנטי־חברתיות:</b> בדוגמה מהספר, קלייר ראתה את הבת הקטנה שלה מצליפה בדובי, בדיוק כמו שהיא עצמה הצליפה בבן שלה.<br>
<b>אלימות במדיה:</b> אנדרסון טוען שיש קשר סיבתי בין צפייה באלימות לתוקפנות. פרגוסון טוען שהמחקרים לא שקללו גורמים אחרים, כמו המשפחה. זו מחלוקת פתוחה.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הסיפור של הפרק בחמישה משפטים:</b><br>
1. רפלקסים ואינסטינקטים הם <b>מולדים</b>; <b>למידה</b> היא שינוי קבוע יחסית שנובע מ<b>ניסיון</b>.<br>
2. ב<b>התניה קלאסית</b> לומדים שגירוי ניטרלי ״מבשר״ על גירוי טבעי, ועד שהוא מעורר בעצמו את התגובה (פבלוב, אלברט הקטן).<br>
3. ב<b>התניה אופרנטית</b> התוצאה קובעת אם ההתנהגות תחזור: <b>חיזוק מגביר</b>, <b>עונש מפחית</b>. ״חיובי״ = מוסיפים, ״שלילי״ = מורידים.<br>
4. איך ומתי מחזקים משנה הכול: <b>עיצוב</b> מלמד צעד אחרי צעד, ו<b>יחס משתנה</b> יוצר את ההתנהגות העמידה ביותר.<br>
5. לומדים גם <b>בלי פרס</b> (למידה סמויה) ו<b>בלי ניסיון אישי</b> (למידה מצפייה, דרך קשב, שימור, שחזור ומוטיבציה).<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להבחין בין רפלקס, אינסטינקט ולמידה בדוגמה.<br>
• לזהות UCS, UCR, NS, CS ו־CR בתיאור של מקרה.<br>
• להסביר רכישה, הכחדה, התאוששות ספונטנית, הכללה והבחנה, ולזהות אותם.<br>
• לזהות בדוגמה חיזוק חיובי, חיזוק שלילי, עונש חיובי ועונש שלילי.<br>
• לזהות לוח חיזוק בדוגמה ולדעת איזה מהם הכי עמיד.<br>
• להסביר למידה סמויה, את ארבעת שלבי החיקוי, ואת ניסוי בובת בובו.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>״חיובי״ = מוסיפים, ״שלילי״ = מורידים</b>, ולא טוב ורע.</li>
<li><b>חיזוק שלילי הוא לא עונש.</b> כל חיזוק מגביר התנהגות.</li>
<li><b>פסק זמן = עונש שלילי</b>, לא חיובי.</li>
<li><b>אותו ריור יכול להיות UCR או CR</b>, לפי מה שמעורר אותו.</li>
<li><b>הכחדה ≠ שכחה.</b> התאוששות ספונטנית מראה שהלמידה נשמרה.</li>
<li><b>יחס משתנה הכי עמיד להכחדה</b>; חיזוק רציף מלמד הכי מהר.</li>
<li><b>יחס = לפי מספר פעמים; מרווח = לפי זמן.</b></li>
<li><b>בבובת בובו, רק עונש למודל הפחית חיקוי</b>; שבח וגם התעלמות הובילו לחיקוי.</li>
<li><b>למידה סמויה = בלי חיזוק</b>, ומופיעה רק כשיש סיבה.</li>
<li><b>סלידה מטעם היא חריג</b> לכלל התזמון: נוצרת גם אחרי שעות ואחרי פעם אחת.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});

for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}

const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;

  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");

      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});

}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="ck"></div><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  checkBox(t,bi);

}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb){pb.click();const bx=document.querySelector("#podbox");if(bx)bx.scrollIntoView({block:"center"})}}else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
