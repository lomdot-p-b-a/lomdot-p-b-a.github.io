function acrExpand(html){

  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}

    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}

  {h:"צבים, גלשנים ולמידה",html:`${def("על מה הנושא",`מה ההבדל בין התנהגות מולדת לבין למידה, ושלושת סוגי הלמידה.<br><b>מה נלמד כאן:</b> רפלקס · אינסטינקט · למידה · למידה אסוציאטיבית`)}${ex("הפרק נפתח בחוף: צבי ים שבקעו לפני דקות זוחלים לבד אל המים. לידם, <b>ג׳וליאן</b> לומד לגלוש: הוא עולה על גל, עומד כמה שניות ונופל, ואז מסתכל איך <b>בן</b>, אבא שלו, רוכב על הגל. הצבים לא צריכים ללמוד. ג׳וליאן כן. נלווה אותו לאורך הלומדה.")}<div class="tw"><table><tr><th></th><th>רפלקס</th><th>אינסטינקט</th></tr><tr><td>מה מפעיל</td><td>גירוי מסוים</td><td>אירועים רחבים (התבגרות, עונות)</td></tr><tr><td>מורכבות</td><td>פשוט, חלק גוף מסוים</td><td>מורכב, כל הגוף</td></tr><tr><td>שליטה במוח</td><td>מרכזים נמוכים (חוט השדרה, המוח המוארך)</td><td>מרכזים גבוהים</td></tr><tr><td>דוגמה</td><td>רפלקס הברך, היצרות האישון</td><td>ציפורים נודדות, עכביש טווה רשת</td></tr></table></div>${def("למידה",`${E("Learning")} שינוי <b>קבוע יחסית</b> בהתנהגות או בידע, שנובע מ<b>ניסיון</b>. בניגוד לרפלקס ולאינסטינקט, צריך לרכוש אותה.`)}`,q:"q1"},
  {h:"שלושה סוגי למידה",html:`${def("למידה אסוציאטיבית",`${E("Associative learning")} למידה שבה מקשרים בין גירויים או אירועים שקורים יחד. היא הבסיס לשלושת הסוגים.`)}<div class="tw"><table><tr><th>סוג</th><th>מה מקשרים</th><th>אצל ג׳וליאן</th></tr><tr><td><b>התניה קלאסית</b></td><td>גירוי עם גירוי (לרוב לא מודע)</td><td>הוא נבהל מכל גל גבוה, כי פעם גל כזה הפיל אותו</td></tr><tr><td><b>התניה אופרנטית</b></td><td>התנהגות עם התוצאה שלה (לרוב מודע)</td><td>כשהוא עומד נכון, הוא נהנה מהגלישה וחוזר על זה</td></tr><tr><td><b>למידה מצפייה</b></td><td>לומדים מצפייה באחרים</td><td>הוא מסתכל על אבא שלו ומחקה</td></tr></table></div>${ex("דוגמה מהספר להתניה קלאסית: ברק תמיד בא לפני רעם, ולכן אנחנו נבהלים כבר מהברק.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"bulb",title:"התניה קלאסית: פבלוב",blocks:[
  {h:"הכלבים של פבלוב",html:`${def("על מה הנושא",`איך גירוי ניטרלי הופך לגירוי שמפעיל תגובה.<br><b>מה נלמד כאן:</b> פבלוב · חמשת המושגים · תזמון`)}<p><b>איוון פבלוב</b>, פיזיולוג רוסי, חקר עיכול בכלבים, ושם לב שהכלבים מתחילים לרייר כבר כשהם שומעים את צעדי העוזר שמביא את האוכל. הוא השמיע <b>צליל</b> ומיד אחריו נתן <b>אבקת בשר</b>, שוב ושוב. בסוף הכלבים ריירו לצליל לבד.</p>${fig("pav38")}`,q:"q5"},
  {h:"חמשת המושגים",html:`<div class="tw"><table><tr><th>מושג</th><th>מה זה</th><th>אצל פבלוב</th></tr><tr><td><b>גירוי ניטרלי</b> (NS)</td><td>לא מעורר תגובה מעצמו</td><td>הצליל, לפני הלמידה</td></tr><tr><td><b>גירוי בלתי מותנה</b> (UCS)</td><td>מעורר תגובה באופן טבעי</td><td>אבקת הבשר</td></tr><tr><td><b>תגובה בלתי מותנית</b> (UCR)</td><td>תגובה טבעית ל־UCS</td><td>ריור לבשר</td></tr><tr><td><b>גירוי מותנה</b> (CS)</td><td>הגירוי הניטרלי, אחרי הלמידה</td><td>הצליל, אחרי הצימוד</td></tr><tr><td><b>תגובה מותנית</b> (CR)</td><td>תגובה נלמדת ל־CS</td><td>ריור לצליל</td></tr></table></div>${rem("הריור הוא אותו ריור. מה שמשנה את השם הוא <b>מה מעורר אותו</b>: בשר = UCR, צליל = CR.")}`,q:"q7"},
  {h:"דוגמאות מהחיים",html:`${tiles([["leaf","החתולה טייגר","קופסת האוכל שלה נפתחת עם פותחן חשמלי. עכשיו היא רצה למטבח בכל פעם שהפותחן פועל. פותחן = CS, אוכל = UCS"],["flask","מוישה וכימותרפיה","הטיפול (UCS) גורם לבחילה (UCR). אחרי כמה טיפולים היא מרגישה בחילה כבר בכניסה למשרד של הרופא (CS)"],["cart","פרסום","מצמידים מוצר לדמות אטרקטיבית או למוזיקה טובה, כדי שהמוצר לבד יעורר רגש חיובי"]])}${def("תזמון",`בדרך כלל ה־CS צריך להופיע <b>זמן קצר לפני</b> ה־UCS. יוצא דופן: <b>סלידה מטעם</b>, שבה הקשר נוצר גם אחרי שעות. <b>גרסיה וקולינג</b> הראו בחולדות שיש <b>מגבלות ביולוגיות</b> על מה שקל ללמוד.`)}${ex("ג׳וליאן אכל פעם פיצה לפני הגלישה, ובערב הייתה לו בחילה מסיבה אחרת לגמרי. עכשיו הוא לא סובל ריח של פיצה. מספיק צימוד אחד, וגם אחרי שעות.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"cycle",title:"תהליכים בהתניה קלאסית",blocks:[
  {h:"רכישה, הכחדה והתאוששות",html:`${def("על מה הנושא",`מה קורה לתגובה המותנית לאורך זמן, ומתי היא מתרחבת או מצטמצמת.<br><b>מה נלמד כאן:</b> רכישה · התניה מסדר שני · הכחדה · התאוששות ספונטנית · הכללה · הבחנה`)}<div class="tw"><table><tr><th>תהליך</th><th>מה קורה</th><th>דוגמה</th></tr><tr><td><b>רכישה</b></td><td>שלב הלמידה, הצימוד מחזק את התגובה</td><td>פבלוב מצמיד צליל ובשר</td></tr><tr><td><b>התניה מסדר שני</b></td><td>CS קיים משמש ״ללמד״ גירוי ניטרלי חדש</td><td>טייגר רצה גם לחריקת הארון שנפתח לפני הפותחן</td></tr><tr><td><b>הכחדה</b></td><td>ה־CS מופיע בלי ה־UCS, והתגובה נחלשת</td><td>הצליל בלי בשר שוב ושוב</td></tr><tr><td><b>התאוששות ספונטנית</b></td><td>אחרי הפסקה, תגובה שנכחדה חוזרת</td><td>אחרי כמה ימים הכלב שוב מרייר לצליל</td></tr></table></div>${rem("קשה מאוד להגיע להתניה מעבר לסדר שני.")}`,q:"q11"},
  {h:"הכללה, הבחנה, ואלברט הקטן",html:`${tiles([["copies","הכללת גירוי","מגיבים גם לגירויים <b>דומים</b> ל־CS"],["target","הבחנה בין גירויים","מגיבים <b>רק</b> ל־CS המסוים, ולא לדומים"]])}${def("ווטסון ואלברט הקטן",`<b>ג׳ון ווטסון</b>, אבי הביהביוריזם, הראה שאפשר להתנות פחד: הוא הצמיד <b>עכברוש לבן</b> לרעש חזק ומפחיד אצל תינוק בשם אלברט, ואלברט התחיל לפחד מהעכברוש. אחר כך הפחד <b>הוכלל</b> לחפצים פרוותיים אחרים. היום הניסוי נחשב <b>לא אתי</b>.`)}${ex("ג׳וליאן נבהל מגל גבוה שהפיל אותו. אם הוא נבהל מכל גל גבוה, זו <b>הכללה</b>. אם עם הזמן הוא לומד להיבהל רק מגלים שנשברים מהר, זו <b>הבחנה</b>.")}`,q:"q13"}
 ]},
 {id:"t4",icon:"scales",title:"התניה אופרנטית: חיזוק ועונש",blocks:[
  {h:"חוק האפקט וקופסת סקינר",html:`${def("על מה הנושא",`לומדים לקשר בין התנהגות לבין התוצאה שלה.<br><b>מה נלמד כאן:</b> ת׳ורנדייק · סקינר · חיזוק ועונש · חיובי ושלילי`)}<p>בהתניה קלאסית מצמידים <b>שני גירויים</b>. בהתניה אופרנטית ה<b>התנהגות</b> באה קודם, ו<b>התוצאה</b> שבאה אחריה קובעת אם תחזור.</p>${def("חוק האפקט",`${E("Law of effect")} <b>ת׳ורנדייק</b> (1911): התנהגות שבאה אחריה תוצאה נעימה תחזור; התנהגות שבאה אחריה תוצאה לא נעימה תחזור פחות. הולכים לעבודה כי מקבלים משכורת.`)}${def("סקינר",`<b>ב״פ סקינר</b> טען שהתניה קלאסית מסבירה רק רפלקסים, לא התנהגויות חדשות כמו רכיבה על אופניים. הוא בנה את <b>תא ההתניה האופרנטית</b> (״קופסת סקינר״): חולדה לוחצת על מנוף או יונה מנקרת בדסקית, ומקבלת אוכל.`)}`,q:"q15"},
  {h:"ארבע האפשרויות",html:`<p>שתי שאלות: <b>מוסיפים או מורידים</b> משהו? והאם המטרה <b>להגביר או להפחית</b> את ההתנהגות?</p><div class="tw"><table><tr><th></th><th>מגביר התנהגות (חיזוק)</th><th>מפחית התנהגות (עונש)</th></tr><tr><td><b>חיובי</b> (מוסיפים)</td><td><b>חיזוק חיובי</b>: מוסיפים משהו נעים. משכורת, שבח</td><td><b>עונש חיובי</b>: מוסיפים משהו לא נעים. נזיפה</td></tr><tr><td><b>שלילי</b> (מורידים)</td><td><b>חיזוק שלילי</b>: מורידים משהו לא נעים. הצפצוף של החגורה נפסק כשחוגרים</td><td><b>עונש שלילי</b>: מורידים משהו נעים. לוקחים צעצוע</td></tr></table></div>${rem("״חיובי״ ו״שלילי״ = <b>הוספה והורדה</b>, לא ״טוב״ ו״רע״. וחיזוק, גם שלילי, תמיד <b>מגביר</b> התנהגות.")}${ex("ג׳וליאן חוזר להתאמן כי כיף לו לגלוש (חיזוק חיובי). כשהוא שם קרם הגנה, הצריבה בעור לא מגיעה, ולכן הוא ממשיך לשים (חיזוק שלילי). ואם יגלוש בלי רשות, אבא יבטל לו את הגלישה בשבת (עונש שלילי).")}`,q:"q17"},
  {h:"הבעיה עם עונש",html:`<p>מחקרים (<b>גרשוף</b>) קשרו עונש גופני (מכות) ל<b>פחד</b> מהמעניש, להימנעות מבית הספר, ול<b>יותר תוקפנות</b> והתנהגות אנטי־חברתית. לכן רוב בתי הספר בארה״ב אסרו עונש גופני, והמומחים היום ממליצים ל<b>חזק התנהגות טובה</b>.</p>${ex("ברנדה קיבלה מכות על התנהגות רעה, ועכשיו היא מכה את החברים שלה. העונש לימד אותה בדיוק את מה שרצו למנוע.")}${def("פסק זמן",`${E("Time-out")} <b>עונש שלילי</b>: מוציאים את הילד מפעילות נעימה. בערך <b>דקה לכל שנת גיל</b>, ברוגע, ובסוף מילה טובה.`)}`,q:"q19"}
 ]},
 {id:"t5",icon:"clock",title:"עיצוב, מחזקים ולוחות חיזוק",blocks:[
  {h:"עיצוב",html:`${def("על מה הנושא",`איך מלמדים התנהגות מורכבת, אילו סוגי מחזקים יש, ומתי לתת אותם.<br><b>מה נלמד כאן:</b> עיצוב · מחזק ראשוני ומשני · כלכלת אסימונים · לוחות חיזוק`)}${def("עיצוב",`${E("Shaping")} מחזקים <b>קירובים הדרגתיים</b> להתנהגות הרצויה. בהתחלה כל דבר שדומה, ואחר כך רק מה שקרוב יותר ויותר, עד שמחזקים רק את ההתנהגות המלאה.`)}${ex("סקינר לימד יונים לשחק פינג־פונג. הורים מלמדים ילד לסדר את החדר: קודם מחזקים צעצוע אחד, אחר כך חמישה, ובסוף רק את כל החדר. גם ג׳וליאן מקבל שבח מאבא קודם על שכיבה יציבה על הגלשן, אחר כך על כריעה, ובסוף רק על עמידה.")}`,q:"q21"},
  {h:"מחזקים ראשוניים ומשניים",html:`<div class="tw"><table><tr><th></th><th>מחזק ראשוני</th><th>מחזק משני</th></tr><tr><td>ערך</td><td>מולד</td><td>נרכש מקשר למחזק ראשוני</td></tr><tr><td>דוגמאות</td><td>אוכל, מים, שינה, מגע</td><td>כסף, שבח, מדבקות, אסימונים</td></tr></table></div>${rem("כסף שווה משהו רק כי אפשר לקנות בו. על אי בודד הוא חסר ערך.")}${def("כלכלת אסימונים",`אסימונים שאפשר להחליף בפרסים. בשימוש בבתי ספר, בתי כלא ובתי חולים. מחקר מצא שילדים עם אוטיזם קיבלו אסימון על התנהגות מתאימה ו<b>הפסידו</b> אסימון על מכות, והחליפו אותם בזמן משחק. <b>טבלת מדבקות</b> לילדים היא כלכלת אסימונים.`)}`,q:"q23"},
  {h:"לוחות חיזוק",html:`<p><b>חיזוק רציף</b> (אחרי כל תגובה) הוא הדרך <b>המהירה</b> ללמד התנהגות חדשה. אחרי שההתנהגות נלמדה עוברים ל<b>חיזוק חלקי</b>, שיש לו ארבעה סוגים:</p><div class="tw"><table><tr><th>לוח</th><th>מתי מקבלים</th><th>דפוס תגובה</th><th>דוגמה</th></tr><tr><td><b>מרווח קבוע</b></td><td>אחרי זמן קבוע</td><td>בינוני, עם הפוגות</td><td>משכך כאבים שאפשר לקבל רק פעם בשעה</td></tr><tr><td><b>מרווח משתנה</b></td><td>אחרי זמן לא צפוי</td><td>בינוני ויציב</td><td>בדיקת פייסבוק; בונוס בביקורת פתע</td></tr><tr><td><b>יחס קבוע</b></td><td>אחרי מספר קבוע של תגובות</td><td>גבוה, עם הפוגות</td><td>תשלום לפי יחידה; עמלה על כל זוג משקפיים</td></tr><tr><td><b>יחס משתנה</b></td><td>אחרי מספר לא צפוי של תגובות</td><td>גבוה ויציב</td><td><b>הימורים</b>, מכונת מזל</td></tr></table></div>${rem("הכי <b>עמיד להכחדה</b>: יחס משתנה. הכי פחות עמיד: מרווח קבוע.")}${ex("ג׳וליאן לא יודע איזה גל יהיה טוב. לפעמים הגל השלישי, לפעמים העשירי. זה יחס משתנה, ולכן הוא ממשיך לחתור עוד ועוד.")}`,q:"q25"}
 ]},
 {id:"t6",icon:"brain",title:"קוגניציה: למידה סמויה והימורים",blocks:[
  {h:"טולמן והמפה הקוגניטיבית",html:`${def("על מה הנושא",`האם יש למידה בלי חיזוק? ולמה הימורים כל כך ממכרים?<br><b>מה נלמד כאן:</b> ביהביוריזם רדיקלי · מפה קוגניטיבית · למידה סמויה · הימורים`)}<p>סקינר ראה את הנפש כ<b>״קופסה שחורה״</b> שאין טעם לחקור. <b>אדוארד טולמן</b> חלק עליו: החולדות שלו הסתובבו במבוך <b>בלי שום פרס</b>, ובנו <b>מפה קוגניטיבית</b> שלו. כששמו אוכל בסוף המבוך, הן מצאו אותו מהר בדיוק כמו חולדות שקיבלו פרס כל הזמן.</p>${def("למידה סמויה",`${E("Latent learning")} למידה שלא נראית בהתנהגות עד שיש סיבה להראות אותה.`)}${ex("ראווי נסע לבית הספר עם אבא שלו כל יום כנוסע. כשאבא לא יכול היה להסיע אותו, הוא רכב לבד באופניים בדיוק באותה דרך. הוא למד את הדרך בלי שום חיזוק.")}`,q:"q27"},
  {h:"הימורים והמוח",html:`<ul><li>סקינר כתב שקזינו שומר על המהמרים כי הוא מחזיר חלק מהכסף ב<b>יחס משתנה</b>. הוא טען שיוכל להפוך יונה למהמרת כפייתית, אבל מחקר בחולדות לא תמך בזה.</li><li>הימורים מפעילים את מסלולי <b>הדופמין</b> של התגמול, כמו סמים ממכרים. גם <b>״כמעט ניצחון״</b> מפעיל אזורי תגמול.</li><li>ב־<b>DSM-5</b> הימורים מסווגים כ<b>התמכרות</b> (קודם כהפרעת שליטה בדחפים).</li></ul>${rem("אי אפשר לבדוק בניסוי מה גורם להימורים כפייתיים, כי אסור לגרום לאנשים להפוך למהמרים. לכן הסיבתיות לא ברורה.")}`,q:"q29"}
 ]},
 {id:"t7",icon:"people",title:"למידה מצפייה",blocks:[
  {h:"בנדורה ומודלים",html:`${def("על מה הנושא",`לומדים גם מצפייה באחרים, בלי ניסיון ישיר.<br><b>מה נלמד כאן:</b> מודל · בנדורה · ארבעת השלבים · חיזוק עקיף · בובת בובו`)}${def("למידה מצפייה",`${E("Observational learning")} לומדים מצפייה באחרים ומחקים. מי שמחקים נקרא <b>מודל</b>. היא קשורה כנראה ל<b>נוירוני מראה</b>.`)}<p><b>אלברט בנדורה</b> טען שביהביוריזם טהור לא מסביר למידה בלי חיזוק חיצוני, ולכן גם מצבים פנימיים חשובים. יש שלושה סוגי מודלים:</p>${tiles([["people","חי","מדגים בפועל, מול העיניים"],["doc","מילולי","מסביר במילים בלי להדגים"],["phone","סימבולי","דמויות בספרים, סרטים, משחקים ורשת"]])}${ex("ג׳וליאן מסתכל על בן, אבא שלו (מודל חי), מחקה את התנועות שעבדו לו, ונמנע מאלה שהפילו אותו.")}`,q:"q31"},
  {h:"ארבעת השלבים ובובת בובו",html:`<ol><li><b>קשב</b>: לשים לב למה שהמודל עושה.</li><li><b>שימור</b>: לזכור את מה שראו.</li><li><b>שחזור</b>: להיות מסוגל לבצע את ההתנהגות.</li><li><b>מוטיבציה</b>: לרצות לבצע. תלוי במה שקרה למודל.</li></ol>${tiles([["check","חיזוק עקיף","המודל קיבל פרס, ולכן מחקים יותר"],["x","עונש עקיף","המודל נענש, ולכן מחקים פחות"]])}${def("בובת בובו",`בנדורה, רוס ורוס (1961): ילדים ראו מבוגר מתנהג בתוקפנות כלפי בובה מתנפחת. כשהמבוגר <b>נענש</b>, הילדים חיקו <b>פחות</b>. כשהוא קיבל <b>שבח או שהתעלמו ממנו</b>, הם חיקו את המכות, הבעיטות ואפילו את המילים.`)}${ex("ג׳וליאן לבדו לא מספיק: גם אם ראה את אבא עומד על הגלשן, הוא צריך לזכור איך (שימור), להצליח פיזית (שחזור), ולרצות (מוטיבציה).")}`,q:"q33"},
  {h:"השפעות חיוביות ושליליות",html:`${tiles([["check","השפעה פרו־חברתית","מודלים חיוביים מעודדים קריאה, אכילה בריאה, חסד ויושר. ילדים מחקים את מה שהמבוגרים <b>עושים</b> יותר ממה שהם <b>אומרים</b>"],["x","השפעה אנטי־חברתית","ילדים שרואים תוקפנות עלולים לחקות אותה. כ־30% מהילדים שעברו התעללות הופכים להורים מתעללים"]])}${ex("קלייר הצליפה בבנה בחגורה, ואחר כך ראתה את בתה מצליפה כך בדובי. היא הבינה שהיא רוצה לחנך אחרת.")}${def("אלימות במדיה",`בוגר תיכון נחשף לכ־200,000 מעשי אלימות במדיה. <b>אנדרסון</b> ועמיתיו מצאו ראיות רבות לקשר סיבתי בין חשיפה לאלימות לבין מחשבות והתנהגות תוקפניות. <b>פרגוסון</b> טוען שהמחקרים לא שקללו מספיק גורמים אחרים, כמו בריאות נפשית ומשפחה. הוויכוח נמשך.`)}`,q:"q35"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מהי למידה לפי הפרק?","a":"שינוי קבוע יחסית בהתנהגות או בידע שנובע מניסיון","w":["תגובה מולדת ופשוטה לגירוי מסוים, בלי שום ניסיון קודם","התנהגות מורכבת שמופעלת מעצמה בהתבגרות או בעונות","כל שינוי זמני בהתנהגות, גם בגלל עייפות או מחלה"],"e":"למידה חייבת לנבוע מניסיון ולהיות קבועה יחסית. תגובה מולדת לגירוי היא רפלקס, והתנהגות מורכבת מולדת היא אינסטינקט."},{"q":"צבי ים שבקעו זוחלים לבד אל המים. מה זה?","a":"אינסטינקט","w":["התניה קלאסית","למידה מצפייה","התניה אופרנטית"],"e":"זו התנהגות מולדת, מורכבת, שלא נלמדה. ג׳וליאן, לעומתם, צריך ללמוד לגלוש."}]},"q2":{"t":"t1","v":[{"q":"מה ההבדל בין רפלקס לאינסטינקט?","a":"רפלקס פשוט ומקומי; אינסטינקט מורכב ומערב את כל הגוף","w":["רפלקס נלמד מניסיון, ואינסטינקט מולד מהלידה","רפלקס נשלט במרכזים גבוהים, ואינסטינקט בחוט השדרה","אין הבדל, אלה שני שמות לאותה התנהגות"],"e":"שניהם מולדים. רפלקס הוא תגובה פשוטה של חלק גוף, שנשלטת במרכזים נמוכים. אינסטינקט מורכב יותר ומערב מרכזים גבוהים."}]},"q3":{"t":"t1","v":[{"q":"מה מקשרים בהתניה אופרנטית?","a":"התנהגות עם התוצאה שלה","w":["גירוי עם גירוי אחר","התנהגות של אחר עם התנהגות שלי","רפלקס עם אינסטינקט"],"e":"בקלאסית מקשרים גירוי לגירוי. באופרנטית מקשרים התנהגות לתוצאה שבאה אחריה."},{"q":"ג׳וליאן מסתכל על אבא שלו גולש ומחקה אותו. איזה סוג למידה זה?","a":"למידה מצפייה","w":["התניה קלאסית","התניה אופרנטית בלבד","רפלקס נרכש"],"e":"הוא לומד מצפייה במודל, בלי ניסיון ישיר. זו למידה מצפייה (מודלינג)."}]},"q4":{"t":"t1","v":[{"q":"אנחנו נבהלים כבר מהברק, לפני הרעם. איזה סוג למידה זה מדגים?","a":"התניה קלאסית","w":["התניה אופרנטית","למידה מצפייה","למידה סמויה"],"e":"הברק תמיד מגיע לפני הרעם, ולכן נוצר קשר בין שני הגירויים. זו התניה קלאסית."}]},"q5":{"t":"t2","v":[{"q":"מה עשה פבלוב כדי שהכלבים ירירו לצליל?","a":"השמיע צליל ומיד אחריו נתן אבקת בשר, שוב ושוב","w":["נתן לכלבים פרס בכל פעם שהם ריירו לשמע הצליל","הראה לכלבים כלב אחר שמרייר לצליל","השמיע צליל רק אחרי שהכלבים כבר אכלו"],"e":"הצימוד החוזר של צליל ובשר הפך את הצליל לגירוי מותנה. פרס על ריור היה התניה אופרנטית."}]},"q6":{"t":"t2","v":[{"q":"מה גילה פבלוב במקרה, לפני הניסוי?","a":"שהכלבים מריירים כבר לצעדים של העוזר","w":["שהכלבים מריירים רק כשהם רואים בשר","שכלבים לא מסוגלים ללמוד שום קשר","שהכלבים מריירים יותר בערב"],"e":"הוא חקר עיכול ושם לב שסימנים שקודמים לאוכל מעוררים ריור. מכאן התחיל המחקר."}]},"q7":{"t":"t2","v":[{"q":"לפני הלמידה, מהו הצליל בניסוי של פבלוב?","a":"גירוי ניטרלי","w":["גירוי מותנה","גירוי בלתי מותנה","תגובה מותנית"],"e":"לפני הצימוד הצליל לא מעורר ריור, ולכן הוא ניטרלי. אחרי הצימוד הוא הופך לגירוי מותנה."},{"q":"הכלב מרייר לצליל אחרי הלמידה. מה הריור הזה?","a":"תגובה מותנית","w":["תגובה בלתי מותנית","גירוי מותנה","גירוי ניטרלי"],"e":"ריור לבשר הוא תגובה בלתי מותנית. ריור לצליל, שנלמד, הוא תגובה מותנית."}]},"q8":{"t":"t2","v":[{"q":"מה מבדיל בין תגובה מותנית לבלתי מותנית אצל פבלוב?","a":"מה שמעורר את הריור: צליל או בשר","w":["כמות הרוק שהכלב מפריש בכל פעם","סוג הכלב שמשתתף בניסוי","הזמן ביום שבו נערך הניסוי"],"e":"הריור עצמו זהה. אם הבשר מעורר אותו זו תגובה בלתי מותנית, ואם הצליל, זו תגובה מותנית."}]},"q9":{"t":"t2","v":[{"q":"מוישה מרגישה בחילה כבר בכניסה למשרד של הרופא שנותן לה כימותרפיה. מה המשרד?","a":"גירוי מותנה","w":["גירוי בלתי מותנה","תגובה בלתי מותנית","תגובה מותנית"],"e":"הכימותרפיה (UCS) גורמת לבחילה (UCR). המשרד, שהוצמד אליה, הפך לגירוי מותנה שמעורר בחילה (CR)."},{"q":"מה מיוחד בסלידה מטעם?","a":"הקשר נוצר גם כשעוברות שעות בין הטעם לבחילה","w":["היא דורשת מאות צימודים חוזרים כדי להיווצר בכלל","היא מופיעה רק אצל כלבים במעבדה","היא נעלמת לגמרי אחרי לילה אחד"],"e":"בדרך כלל ה־CS צריך לבוא זמן קצר לפני ה־UCS. בסלידה מטעם הקשר נוצר גם אחרי שעות, ולפעמים מצימוד אחד."}]},"q10":{"t":"t2","v":[{"q":"מה הראו גרסיה וקולינג בחולדות?","a":"שיש מגבלות ביולוגיות על מה שקל ללמוד","w":["שחולדות לא מסוגלות ללמוד סלידה מטעם","שאפשר להתנות כל גירוי עם כל תגובה באותה קלות","שהתניה קלאסית עובדת רק עם צלילים"],"e":"הם מצאו שחלק מהקשרים (כמו טעם ובחילה) נלמדים בקלות, וחלק לא. כלומר יש ״הכנה״ ביולוגית."},{"q":"למה פרסומות מצמידות מוצר לדמות אטרקטיבית?","a":"כדי שהמוצר לבד יעורר רגש חיובי","w":["כדי לחזק את הקונה אחרי שקנה","כדי שהצופים יחקו את הדמות במדויק","כדי להכחיד רגש שלילי כלפי המוצר"],"e":"זו התניה קלאסית: הדמות מעוררת רגש חיובי, ואחרי צימוד המוצר עצמו מעורר אותו."}]},"q11":{"t":"t3","v":[{"q":"מה זו הכחדה בהתניה קלאסית?","a":"הצגת ה־CS בלי ה־UCS, עד שהתגובה נחלשת","w":["הצגת ה־UCS בלי ה־CS עד שהתגובה גדלה","הופעה מחדש של תגובה שנעלמה אחרי הפסקה","תגובה גם לגירויים שדומים לגירוי המותנה"],"e":"כשהצליל מופיע שוב ושוב בלי בשר, הריור נחלש. חזרת התגובה אחרי הפסקה היא התאוששות ספונטנית."},{"q":"אחרי הכחדה ומנוחה של כמה ימים, הכלב שוב מרייר לצליל. איך קוראים לזה?","a":"התאוששות ספונטנית","w":["רכישה מחדש של התגובה","הכללת גירוי","התניה מסדר שני"],"e":"תגובה שנכחדה יכולה לחזור אחרי הפסקה. זה מראה שההכחדה לא מחקה את הלמידה לגמרי."}]},"q12":{"t":"t3","v":[{"q":"החתולה טייגר רצה גם לחריקת הארון שנפתח לפני הפותחן. מה זה?","a":"התניה מסדר שני","w":["הכללת גירוי","הכחדה","התאוששות ספונטנית"],"e":"הפותחן (CS) הוצמד לחריקה, והחריקה הפכה בעצמה ל־CS. מעבר לסדר שני קשה מאוד להגיע."}]},"q13":{"t":"t3","v":[{"q":"אלברט הקטן התחיל לפחד גם מחפצים פרוותיים אחרים. מה זה?","a":"הכללת גירוי","w":["הבחנה בין גירויים","הכחדה","למידה סמויה"],"e":"התגובה התרחבה לגירויים שדומים לעכברוש הלבן. אילו פחד רק מהעכברוש, זו הייתה הבחנה."},{"q":"מה עשה ווטסון בניסוי אלברט הקטן?","a":"הצמיד עכברוש לבן לרעש חזק ומפחיד","w":["נתן לאלברט פרס בכל פעם שליטף עכברוש","הראה לאלברט ילד אחר שמפחד מעכברוש","השאיר את אלברט עם עכברוש עד שהתרגל אליו"],"e":"הרעש (UCS) עורר פחד (UCR), ואחרי צימוד העכברוש (CS) עורר פחד (CR). היום הניסוי נחשב לא אתי."}]},"q14":{"t":"t3","v":[{"q":"ג׳וליאן נבהל עכשיו רק מגלים שנשברים מהר, ולא מכל גל גבוה. איזה תהליך זה?","a":"הבחנה בין גירויים","w":["הכללת גירוי","התאוששות ספונטנית","התניה מסדר שני"],"e":"הוא מגיב רק לגירוי המסוים ולא לדומים לו. זו הבחנה."}]},"q15":{"t":"t4","v":[{"q":"מה אומר חוק האפקט של ת׳ורנדייק?","a":"התנהגות שבאה אחריה תוצאה נעימה תחזור","w":["גירוי ניטרלי שמוצמד לגירוי טבעי יעורר תגובה","לומדים התנהגות מצפייה במודלים שמקבלים פרס","התנהגות נלמדת רק כשהיא נלמדת בהדרגה"],"e":"ת׳ורנדייק (1911): תוצאה נעימה מגבירה התנהגות, ולא נעימה מפחיתה. סקינר בנה על הרעיון הזה."},{"q":"למה סקינר טען שצריך התניה אופרנטית ולא רק קלאסית?","a":"קלאסית מסבירה רק רפלקסים, לא התנהגויות חדשות","w":["קלאסית עובדת רק בחיות מעבדה, ולא בבני אדם","קלאסית לא עובדת בכלל לפי המחקר שלו","אופרנטית לא דורשת שום תוצאה"],"e":"לפי סקינר, קלאסית מסבירה תגובות רפלקסיביות קיימות, אבל לא איך לומדים, למשל, לרכוב על אופניים."}]},"q16":{"t":"t4","v":[{"q":"מה הבדל מרכזי בין התניה קלאסית לאופרנטית?","a":"באופרנטית ההתנהגות באה קודם, והתוצאה אחריה","w":["בקלאסית ההתנהגות באה קודם, והגירוי אחריה","באופרנטית אין שום תוצאה להתנהגות","בקלאסית תמיד יש פרס על ההתנהגות"],"e":"בקלאסית מצמידים שני גירויים לפני התגובה. באופרנטית התוצאה מגיעה אחרי ההתנהגות וקובעת אם תחזור."}]},"q17":{"t":"t4","v":[{"q":"הצפצוף ברכב נפסק כשחוגרים חגורה, ולכן חוגרים. מה זה?","a":"חיזוק שלילי","w":["עונש שלילי","עונש חיובי","חיזוק חיובי"],"e":"מורידים משהו לא נעים (שלילי), וההתנהגות גדלה (חיזוק)."},{"q":"לוקחים לילד את הצעצוע האהוב כי הכה את אחיו. מה זה?","a":"עונש שלילי","w":["חיזוק שלילי","עונש חיובי","חיזוק חיובי"],"e":"מורידים משהו נעים (שלילי), כדי להפחית התנהגות (עונש)."}]},"q18":{"t":"t4","v":[{"q":"מה פירוש ״חיובי״ בחיזוק חיובי?","a":"מוסיפים משהו","w":["התוצאה טובה לילד","ההתנהגות רצויה","הילד מרוצה"],"e":"חיובי = הוספה, שלילי = הורדה. זה לא קשור לטוב או רע."},{"q":"איזה משפט נכון?","a":"חיזוק, גם שלילי, תמיד מגביר התנהגות","w":["חיזוק שלילי הוא סוג של עונש קל","עונש חיובי מגביר התנהגות רצויה","חיזוק שלילי מפחית התנהגות לא רצויה"],"e":"כל חיזוק מגביר התנהגות, וכל עונש מפחית. חיזוק שלילי הוא לא עונש."}]},"q19":{"t":"t4","v":[{"q":"מה מצא גרשוף על עונש גופני?","a":"הוא קשור לפחד ולתוקפנות רבה יותר","w":["הוא הדרך היעילה ביותר להפסיק התנהגות","אין לו שום השפעה ארוכת טווח","הוא משפר את היחס לבית הספר"],"e":"עונש גופני קשור לפחד מהמעניש, להימנעות מבית הספר ולתוקפנות. לכן ממליצים לחזק התנהגות טובה."},{"q":"איזה סוג תגובה הוא פסק זמן?","a":"עונש שלילי","w":[ const SUM=`<h2>סיכום: Spielman פרק 6 - למידה</h2>
<div class="key"><b>על מה מדובר?</b> חלק מההתנהגות שלנו מולד (רפלקסים ואינסטינקטים), אבל רובה <b>נלמד</b>. הפרק מציג שלוש דרכים ללמוד: <b>התניה קלאסית</b> (מקשרים בין שני גירויים, כמו הכלבים של פבלוב שריירו לצליל), <b>התניה אופרנטית</b> (מקשרים בין התנהגות לתוצאה שלה: חיזוק מגביר, עונש מפחית), ו<b>למידה מצפייה</b> (מחקים מודלים, כמו הילדים בניסוי בובת בובו). בדרך הוא מראה שגם מחשבה משחקת תפקיד: אפשר ללמוד בלי פרס (למידה סמויה) ובלי ניסיון ישיר (צפייה).</div>

<h3>הדוגמה שתלווה אותנו: ג׳וליאן לומד לגלוש</h3>
<p>הפרק נפתח בחוף: צבי ים שבקעו לפני דקות זוחלים לבד אל המים, כי זה אינסטינקט. לידם <b>ג׳וליאן</b> לומד לגלוש: עולה על גל, נופל, ומסתכל על <b>בן</b>, אבא שלו. כל שלושת סוגי הלמידה יופיעו אצלו.</p>

<h3>1. מהי למידה</h3>
<ul>
<li><b>רפלקס</b>: תגובה מולדת ופשוטה לגירוי מסוים (רפלקס הברך), במרכזים נמוכים. <b>אינסטינקט</b>: התנהגות מולדת ומורכבת שמופעלת מאירועים רחבים (נדידת ציפורים, צבים שזוחלים לים).</li>
<li><b>למידה</b> = שינוי <b>קבוע יחסית</b> בהתנהגות או בידע, שנובע מ<b>ניסיון</b>. כל שלושת הסוגים הם <b>למידה אסוציאטיבית</b>: מקשרים בין דברים שקורים יחד.</li>
</ul>

<h3>2. התניה קלאסית</h3>
<p><b>פבלוב</b> השמיע צליל ומיד אחריו נתן אבקת בשר, שוב ושוב, עד שהכלבים ריירו לצליל לבד. חמשת המושגים:</p>
<div class="tw"><table><tr><th>מושג</th><th>אצל פבלוב</th><th>אצל ג׳וליאן</th></tr>
<tr><td><b>גירוי ניטרלי</b> (NS)</td><td>צליל לפני הלמידה</td><td>ריח של פיצה</td></tr>
<tr><td><b>גירוי בלתי מותנה</b> (UCS)</td><td>בשר</td><td>מחלת בטן</td></tr>
<tr><td><b>תגובה בלתי מותנית</b> (UCR)</td><td>ריור לבשר</td><td>בחילה מהמחלה</td></tr>
<tr><td><b>גירוי מותנה</b> (CS)</td><td>הצליל אחרי הלמידה</td><td>ריח הפיצה, אחרי שאכל אותה לפני שחלה</td></tr>
<tr><td><b>תגובה מותנית</b> (CR)</td><td>ריור לצליל</td><td>בחילה מריח פיצה</td></tr></table></div>
<ul>
<li>בדרך כלל ה־CS צריך להופיע <b>זמן קצר לפני</b> ה־UCS. יוצאת דופן: <b>סלידה מטעם</b>, שנוצרת גם אחרי שעות ומצימוד אחד. <b>גרסיה וקולינג</b>: יש <b>מגבלות ביולוגיות</b> על מה שקל ללמוד.</li>
<li>דוגמאות: החתולה טייגר רצה לשמע הפותחן; מוישה מרגישה בחילה בכניסה למשרד של רופא הכימותרפיה; פרסומות מצמידות מוצר לדמות אטרקטיבית.</li>
</ul>
<p><b>מה קורה לתגובה לאורך זמן:</b></p>
<div class="tw"><table><tr><th>תהליך</th><th>מה קורה</th></tr>
<tr><td><b>רכישה</b></td><td>הצימוד מחזק את התגובה</td></tr>
<tr><td><b>התניה מסדר שני</b></td><td>CS קיים ״מלמד״ גירוי חדש (טייגר רצה גם לחריקת הארון)</td></tr>
<tr><td><b>הכחדה</b></td><td>CS בלי UCS, והתגובה נחלשת</td></tr>
<tr><td><b>התאוששות ספונטנית</b></td><td>אחרי מנוחה התגובה חוזרת</td></tr>
<tr><td><b>הכללה</b></td><td>מגיבים גם לגירויים דומים</td></tr>
<tr><td><b>הבחנה</b></td><td>מגיבים רק ל־CS המסוים</td></tr></table></div>
<p><b>ווטסון ואלברט הקטן:</b> עכברוש לבן הוצמד לרעש מפחיד, ואלברט פחד מהעכברוש, ואחר כך <b>הכליל</b> לחפצים פרוותיים. היום נחשב לא אתי.</p>

<h3>3. התניה אופרנטית</h3>
<ul>
<li><b>ת׳ורנדייק</b>, <b>חוק האפקט</b>: תוצאה נעימה מגבירה התנהגות. <b>סקינר</b>: קלאסית מסבירה רק רפלקסים, ולכן צריך התניה אופרנטית כדי להסביר התנהגויות חדשות. ״<b>קופסת סקינר</b>״: חולדה לוחצת על מנוף ומקבלת אוכל.</li>
<li>ההבדל מהקלאסית: כאן ה<b>התנהגות באה קודם</b>, ו<b>התוצאה</b> אחריה קובעת אם תחזור.</li>
</ul>
<div class="tw"><table><tr><th></th><th>מגביר התנהגות (חיזוק)</th><th>מפחית התנהגות (עונש)</th></tr>
<tr><td><b>חיובי</b> = מוסיפים</td><td>משהו נעים: הכיף של הגלישה לג׳וליאן</td><td>משהו לא נעים: נזיפה</td></tr>
<tr><td><b>שלילי</b> = מורידים</td><td>משהו לא נעים: הצפצוף נפסק כשחוגרים</td><td>משהו נעים: אבא מבטל את הגלישה בשבת</td></tr></table></div>
<ul>
<li><b>עונש גופני</b> (גרשוף) קשור לפחד ולתוקפנות; ברנדה, שקיבלה מכות, מכה חברים. ממליצים לחזק התנהגות טובה. <b>פסק זמן</b> = עונש שלילי, כדקה לכל שנת גיל.</li>
<li><b>עיצוב</b>: מחזקים קירובים הדרגתיים. אבא משבח את ג׳וליאן קודם על שכיבה יציבה, אחר כך על כריעה, ובסוף רק על עמידה.</li>
<li><b>מחזק ראשוני</b> (ערך מולד: אוכל, מים) מול <b>משני</b> (ערך נרכש: כסף, שבח, אסימונים). <b>כלכלת אסימונים</b> וטבלת מדבקות.</li>
</ul>
<p><b>לוחות חיזוק:</b> חיזוק <b>רציף</b> מלמד הכי מהר; אחר כך עוברים לחלקי:</p>
<div class="tw"><table><tr><th>לוח</th><th>דוגמה</th><th>דפוס</th></tr>
<tr><td>מרווח קבוע</td><td>משכך כאבים פעם בשעה</td><td>בינוני עם הפוגות; הכי פחות עמיד</td></tr>
<tr><td>מרווח משתנה</td><td>בדיקת פייסבוק</td><td>בינוני ויציב</td></tr>
<tr><td>יחס קבוע</td><td>עמלה על כל מכירה</td><td>גבוה עם הפוגות</td></tr>
<tr><td>יחס משתנה</td><td>הימורים; הגל הטוב של ג׳וליאן</td><td>גבוה ויציב; <b>הכי עמיד להכחדה</b></td></tr></table></div>

<h3>4. קוגניציה: למידה סמויה והימורים</h3>
<ul>
<li>סקינר: הנפש ״קופסה שחורה״. <b>טולמן</b>: חולדות במבוך בלי פרס בנו <b>מפה קוגניטיבית</b>, וכשהופיע אוכל הגיעו אליו מהר. זו <b>למידה סמויה</b>: נראית רק כשיש סיבה. ראווי רכב לבית הספר בדרך שלמד כנוסע.</li>
<li><b>הימורים</b>: יחס משתנה, מפעילים מסלולי דופמין (גם ״כמעט ניצחון״). ב־DSM-5 מסווגים כ<b>התמכרות</b>. הסיבתיות לא ברורה, כי אי אפשר לבדוק בניסוי.</li>
</ul>

<h3>5. למידה מצפייה</h3>
<ul>
<li><b>בנדורה</b>: לומדים גם בלי חיזוק ישיר, מצפייה ב<b>מודלים</b>: <b>חי</b> (אבא של ג׳וליאן), <b>מילולי</b>, <b>סימבולי</b> (מדיה). קשור כנראה ל<b>נוירוני מראה</b>.</li>
<li><b>ארבעה שלבים</b>: <b>קשב ← שימור ← שחזור ← מוטיבציה</b>. ג׳וליאן צריך לשים לב, לזכור, להצליח פיזית, ולרצות.</li>
<li><b>חיזוק עקיף</b> (המודל קיבל פרס) מגביר חיקוי; <b>עונש עקיף</b> מפחית.</li>
<li><b>בובת בובו</b> (1961): כשהמבוגר <b>נענש</b> הילדים חיקו פחות; כשקיבל שבח או שהתעלמו ממנו, חיקו מכות, בעיטות ומילים.</li>
<li><b>השפעות</b>: פרו־חברתיות (ילדים מחקים מה שמבוגרים <b>עושים</b>, יותר ממה שהם אומרים) ואנטי־חברתיות (קלייר ראתה את בתה מצליפה בדובי כמו שהיא הצליפה בבנה). <b>אלימות במדיה</b>: אנדרסון מצא קשר סיבתי, ופרגוסון טוען שלא שקללו גורמים אחרים.</li>
</ul>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>״חיובי״ = מוסיפים, ״שלילי״ = מורידים</b>, לא טוב ורע.</li>
<li><b>חיזוק שלילי הוא לא עונש</b>: כל חיזוק מגביר התנהגות.</li>
<li><b>פסק זמן = עונש שלילי</b>, לא חיובי.</li>
<li><b>אותו ריור יכול להיות UCR או CR</b>, לפי מה שמעורר אותו.</li>
<li><b>הכחדה ≠ שכחה</b>: התאוששות ספונטנית מראה שהלמידה נשמרה.</li>
<li><b>יחס משתנה הכי עמיד להכחדה</b>; חיזוק רציף מלמד הכי מהר.</li>
<li><b>בבובת בובו, רק עונש למודל הפחית חיקוי</b>; שבח וגם התעלמות הובילו לחיקוי.</li>
<li><b>למידה סמויה = בלי חיזוק</b>, ומופיעה רק כשיש סיבה.</li>
<li><b>סלידה מטעם היא חריג</b> לכלל התזמון: נוצרת גם אחרי שעות.</li>
</ul></div>`;
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){S.done[T[ti].id]={r,n};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);
}
if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
