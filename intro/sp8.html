function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}

  {h:"בלי זיכרון",html:`${def("על מה הנושא",`זיכרון הוא מערכת לעיבוד מידע עם שלושה שלבים. הנושא מתחיל מהשלב הראשון: קידוד.<br><b>מה נלמד כאן:</b> שלושת השלבים · קידוד אוטומטי ומאומץ · סוגי קידוד · אפקט ההתייחסות העצמית`)}<p>הפרק נפתח בתרגיל מחשבתי: תתעוררו בבוקר בלי שום זיכרון. לא תדעו איך מתלבשים, איך מצחצחים שיניים, מי האנשים בבית, ואפילו ״מה זו מיטה?״. למידה שווה משהו רק אם אפשר <b>לשמור</b> אותה.</p>${def("זיכרון",`${E("Memory")} מערכת לעיבוד מידע, בדומה למחשב, עם שלושה שלבים: <b>קידוד</b> (הכנסה), <b>אחסון</b> (שמירה לאורך זמן), ו<b>שליפה</b> (הוצאה בחזרה למודעות).`)}${ex("נלווה לאורך הלומדה את <b>דניאל</b>, סטודנט שנה ראשונה שמתכונן למבחן במבוא לפסיכולוגיה. נראה מה קורה לחומר בכל שלב, ובסוף איך הוא יכול ללמוד טוב יותר.")}`,q:"q1"},
  {h:"סוגי קידוד",html:`${tiles([["clock","קידוד אוטומטי","בלי מאמץ ובלי מודעות: זמן, מקום ומשמעות של מילים. דניאל זוכר איפה ישב בהרצאה בלי שניסה"],["grad","קידוד מאומץ","עבודה מכוונת: ללמוד למבחן, ללמוד לנהוג"]])}<div class="tw"><table><tr><th>קידוד</th><th>לפי מה</th></tr><tr><td><b>סמנטי</b></td><td>משמעות</td></tr><tr><td><b>חזותי</b></td><td>תמונה</td></tr><tr><td><b>אקוסטי</b></td><td>צליל</td></tr></table></div>${rem("קידוד <b>סמנטי</b> (לפי משמעות) נותן את הזיכרון המילולי הטוב ביותר.")}${def("אפקט ההתייחסות העצמית",`${E("Self-reference effect")} זוכרים טוב יותר מידע שקשור <b>אלינו</b>. גם הקשר משמעותי עוזר.`)}${ex("דניאל לומד את המושג ״הסתגלות חושית״ ונזכר איך הפסיק להריח את הקפה במעונות. הקשר לחיים שלו הופך את המושג לזכיר.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"data",title:"אחסון: מודל אטקינסון ושיפרין",blocks:[
  {h:"שלושת המחסנים",html:`${def("על מה הנושא",`לפי המודל, מידע עובר שלושה ״מחסנים״, וכל אחד שומר אותו לזמן אחר.<br><b>מה נלמד כאן:</b> זיכרון חושי · קצר טווח · זיכרון עבודה · ארוך טווח`)}${fig("as39")}<div class="tw"><table><tr><th>מחסן</th><th>משך</th><th>קיבולת</th></tr><tr><td><b>חושי</b></td><td>עד כ־2 שניות</td><td>מה שלא קיבל קשב נעלם</td></tr><tr><td><b>קצר טווח</b></td><td>כ־15–30 שניות</td><td>במקור 7±2 פריטים (מילר); מחקרים חדשים: 4±1</td></tr><tr><td><b>ארוך טווח</b></td><td>לאורך זמן</td><td>כנראה ללא הגבלה</td></tr></table></div>${def("חזרה",`${E("Rehearsal")} חזרה על המידע, או קישור שלו לידע קיים, מעבירה אותו מהזיכרון קצר הטווח לארוך הטווח.`)}`,q:"q5"},
  {h:"זיכרון עבודה ורשתות",html:`${def("זיכרון עבודה",`<b>באדלי והיץ׳</b> הציעו שהזיכרון קצר הטווח הוא בעצם <b>זיכרון עבודה</b> עם כמה תת־מערכות ו<b>מנהל מרכזי</b> שמתאם ביניהן.`)}<p>מה מחליש את הזיכרון קצר הטווח? <b>דעיכה</b> עם הזמן, ו<b>הפרעה פרואקטיבית</b> (מידע ישן מפריע לחדש).</p>${def("רשתות סמנטיות",`בזיכרון ארוך הטווח המושגים מאורגנים ב<b>רשתות</b>: הפעלה של מושג אחד ״מתפשטת״ למושגים קשורים.`)}${def("איחוד",`${E("Consolidation")} ייצוב הזיכרון. ברמת הסינפסה זה לוקח שעות, וברמת המערכת יותר.`)}${ex("דניאל שומע ״היפוקמפוס״, וזה מעורר לו ״זיכרון״, ״H.M.״ ו״מוח״. זו רשת סמנטית.")}`,q:"q7"}
 ]},
 {id:"t3",icon:"copies",title:"סוגי זיכרון ושליפה",blocks:[
  {h:"מפורש וסמוי",html:`${def("על מה הנושא",`זיכרון ארוך טווח הוא לא דבר אחד. וגם שליפה יכולה להיעשות בשלוש דרכים.<br><b>מה נלמד כאן:</b> מפורש · אפיזודי · סמנטי · סמוי · שליפה`)}<div class="tw"><table><tr><th>זיכרון מפורש (מוצהר)</th><th>זיכרון סמוי</th></tr><tr><td>מודע, אפשר לתאר במילים</td><td>לא מודע, נראה בביצוע</td></tr><tr><td><b>אפיזודי</b>: חוויות אישיות (מה, איפה, מתי). ״ביום הולדת 20 הייתי בים״</td><td><b>פרוצדורלי</b>: מיומנויות. לרכוב על אופניים</td></tr><tr><td><b>סמנטי</b>: עובדות ומושגים. ״ירושלים היא בירת ישראל״</td><td><b>טרימה</b> (priming): חשיפה קודמת משפיעה על תגובה מאוחרת</td></tr><tr><td></td><td><b>התניה רגשית</b>: רגש שנקשר לגירוי</td></tr></table></div>${def("היפרתימזיה",`זיכרון אוטוביוגרפי יוצא דופן (למשל השחקנית מרילו הנר). פחות מ־20 אנשים זוהו איתו.`)}`,q:"q9"},
  {h:"שליפה",html:`<p>שליפה היא הוצאה של מידע בחזרה למודעות. יש שלוש דרכים, וכל אחת קשה במידה אחרת:</p>${tiles([["question","היזכרות","בלי רמזים. שאלה פתוחה במבחן"],["check","זיהוי","מזהים את מה שנלמד כשרואים אותו. שאלה אמריקאית"],["cycle","למידה מחדש","לומדים מהר יותר כי כבר למדו פעם"]])}${ex("במבחן של דניאל, שאלה אמריקאית קלה לו יותר משאלה פתוחה על אותו חומר: <b>זיהוי</b> קל יותר מ<b>היזכרות</b>. ואם ישכח את החומר עד שנה הבאה, הוא ילמד אותו מהר יותר בפעם השנייה.")}`,q:"q11"}
 ]},
 {id:"t4",icon:"brain",title:"הזיכרון במוח",blocks:[
  {h:"לאשלי וחיפוש האנגרם",html:`${def("על מה הנושא",`אילו אזורי מוח מעורבים בזיכרון, ולמה רגש מחזק זיכרון.<br><b>מה נלמד כאן:</b> לאשלי · אמיגדלה · היפוקמפוס · מוחון · קדם־מצחי · זיכרון ״הבזק״`)}${def("אנגרם",`${E("Engram")} הייצוג הפיזי של זיכרון במוח. <b>קרל לאשלי</b> אימן חולדות במבוך ופגע בחלקים שונים בקורטקס שלהן כדי למצוא אותו. הוא <b>לא מצא</b>: החולדות מצאו את הדרך לא משנה איפה ובאיזה גודל הייתה הפגיעה.`)}${def("שוויון פוטנציאלי",`${E("Equipotentiality")} אם חלק מאזור זיכרון נפגע, חלק אחר באותו אזור יכול לקחת את התפקיד.`)}`,q:"q13"},
  {h:"ארבעה אזורים",html:`<div class="tw"><table><tr><th>אזור</th><th>תפקיד בזיכרון</th><th>ראיה</th></tr><tr><td><b>אמיגדלה</b></td><td>זיכרונות רגשיים, פחד</td><td>חולדות שלמדו לקפוא לצליל שקדם להלם; פגיעה באמיגדלה העלימה את הפחד</td></tr><tr><td><b>היפוקמפוס</b></td><td>איחוד זיכרונות, זיכרון מרחבי וזיהוי</td><td>המטופל <b>H.M.</b>: הוצאו לו שני ההיפוקמפוסים, ולא יכול היה ליצור זיכרונות מפורשים חדשים</td></tr><tr><td><b>מוחון</b></td><td>זיכרון סמוי: מיומנויות והתניה</td><td>ארנבים עם פגיעה במוחון לא למדו מצמוץ מותנה</td></tr><tr><td><b>קדם־מצחי</b></td><td>עיבוד ושימור מידע</td><td>עיבוד סמנטי הפעיל אותו יותר מעיבוד שטחי, והביא לזיכרון טוב יותר</td></tr></table></div>${ex("כדי לזכור, דניאל יכול לדמיין <b>היפופוטם</b> עם זיכרון מעולה: ״היפו־קמפוס״ = זיכרון.")}`,q:"q15"},
  {h:"רגש וזיכרון ״הבזק״",html:`${def("תאוריית העוררות",`רגש חזק יוצר זיכרון חזק. בלחץ המוח משחרר יותר <b>גלוטמט</b>, שעוזר לקודד את האירוע.`)}${def("זיכרון ״הבזק״",`${E("Flashbulb memory")} זיכרון חי במיוחד של אירוע חשוב ורגשי. 97% מהאמריקאים שהיו בני 8 ומעלה ב־11 בספטמבר זכרו עשור אחר כך איך שמעו על הפיגוע.`)}${rem("אבל זיכרון ״הבזק״ <b>לא בהכרח מדויק</b>. הנשיא בוש אמר שראה את המטוס הראשון פוגע, אבל לא היה צילום כזה בשידור. הזיכרון <b>נבנה מחדש</b> מחלקים, ובכל שלב אפשר לטעות.")}`,q:"q17"}
 ]},
 {id:"t5",icon:"x",title:"אמנזיה, שחזור ועדות ראייה",blocks:[
  {h:"אמנזיה",html:`${def("על מה הנושא",`מה קורה כשהזיכרון נפגע, ולמה עדי ראייה טועים.<br><b>מה נלמד כאן:</b> אמנזיה · בנייה ושחזור · הצעה · אפקט המידע המטעה · זיכרונות משוחזרים`)}<div class="tw"><table><tr><th></th><th>אמנזיה אנטרוגרדית</th><th>אמנזיה רטרוגרדית</th></tr><tr><td>מה נפגע</td><td>יצירת זיכרונות <b>חדשים</b></td><td>זיכרונות <b>מלפני</b> הפגיעה</td></tr><tr><td>קשור ל</td><td>פגיעה בהיפוקמפוס</td><td>טראומה לראש, בעיקר זיכרונות אפיזודיים</td></tr><tr><td>דוגמה</td><td>H.M. למד מיומנויות מוטוריות חדשות, בלי לזכור שהתאמן</td><td>K.C. איבד את זיכרון חייו אחרי תאונת אופנוע</td></tr></table></div>${rem("H.M. למד מיומנות בלי לזכור את האימון: הזיכרון ה<b>סמוי</b> שלו עבד, המפורש לא.")}`,q:"q19"},
  {h:"הזיכרון נבנה מחדש",html:`<p>יצירת זיכרון היא <b>בנייה</b>, ושליפה היא <b>שחזור</b>. בכל שליפה הזיכרון יכול להשתנות.</p>${def("אפקט המידע המטעה",`${E("Misinformation effect")} <b>לופטוס ופאלמר</b> (1974): הראו סרטון של תאונה ושאלו כמה מהר נסעו המכוניות כש״<b>התנגשו בעוצמה</b>״ (smashed) או כש״<b>נגעו</b>״ זו בזו. הפועל שינה את הערכת המהירות, ומי ששמע ״התנגשו בעוצמה״ גם ״זכר״ יותר זכוכית שבורה שלא הייתה.`)}${def("הצעה",`${E("Suggestibility")} מידע מבחוץ יוצר זיכרון כוזב. בפרשת הצלף בוושינגטון (2002) עדים רבים ״ראו״ טנדר לבן, והחשודים נהגו במכונית כחולה.`)}`,q:"q21"},
  {h:"עדי ראייה וזיכרונות משוחזרים",html:`<ul><li>לפי ״פרויקט החפות״, <b>זיהוי שגוי של עדי ראייה</b> הוא הגורם המוביל להרשעות שווא שבוטלו בזכות DNA.</li><li><b>רונלד קוטון</b>: נהלים משטרתיים מכוונים חיזקו את הביטחון של העדה בזיהוי שגוי. DNA זיכה אותו.</li><li>לעומתו, במקרה של אליזבת׳ סמארט החוקרים נזהרו לא להשפיע על אחותה, העדה היחידה, והיא זכרה לבסוף את הקול של החוטף.</li></ul>${def("זיכרונות משוחזרים",`<b>לופטוס</b> מטילה ספק בזיכרונות ״שהתגלו״ בהיפנוזה או בדמיון מודרך, כי הצעות של המטפל יכולות לעצב אותם. ההמלצות: שאלות ניטרליות, מסדרי זיהוי ״עיוורים״, ואזהרה למושבעים.`)}`,q:"q23"}
 ]},
 {id:"t6",icon:"clock",title:"שכחה",blocks:[
  {h:"עקומת השכחה והפרעה",html:`${def("על מה הנושא",`למה שוכחים, ובאיזה קצב.<br><b>מה נלמד כאן:</b> כשל קידוד · עקומת אבינגהאוס · הפרעה · שבעת החטאים`)}${def("כשל קידוד",`חלק ממה ש״נשכח״ <b>מעולם לא נכנס</b>. רוב האנשים לא מצליחים לתאר מטבע, כי קודדו רק מה שצריך כדי להבדיל אותו ממטבעות אחרים.`)}${fig("curve39")}<p>לפי <b>אבינגהאוס</b>, שוכחים <b>הכי מהר בהתחלה</b>, ואחר כך הקצב מתמתן: כ־50% מהמידע החדש אחרי 20 דקות, וכ־70% אחרי 24 שעות.</p>${tiles([["split","הפרעה פרואקטיבית","מידע <b>ישן</b> מפריע ללמוד חדש"],["split","הפרעה רטרואקטיבית","מידע <b>חדש</b> מפריע לזכור ישן"]])}${ex("דניאל למד פעם שהמספר הישן של הבית היה X, ועכשיו קשה לו לזכור את החדש: פרואקטיבית. אחרי שלמד את פרק 8, קשה לו לזכור את פרק 6: רטרואקטיבית.")}`,q:"q25"},
  {h:"שבעת החטאים של שכטר",html:`<div class="tw"><table><tr><th>קבוצה</th><th>חטא</th><th>מה זה</th></tr><tr><td rowspan="3"><b>שכחה</b></td><td>ארעיות</td><td>דעיכה עם הזמן</td></tr><tr><td>פיזור דעת</td><td>חוסר קשב (איפה שמתי את המפתחות?)</td></tr><tr><td>חסימה</td><td>״על קצה הלשון״</td></tr><tr><td rowspan="3"><b>עיוות</b></td><td>ייחוס שגוי</td><td>מבלבלים את המקור</td></tr><tr><td>הצעה</td><td>זיכרון כוזב בגלל אחרים</td></tr><tr><td>הטיה</td><td>אמונות מעצבות את הזיכרון (כולל הטיית ״ידעתי מראש״)</td></tr><tr><td><b>חדירה</b></td><td>התמדה</td><td>זיכרונות לא רצויים שחוזרים</td></tr></table></div>${ex("במבחן, דניאל יודע שהוא מכיר את שם החוקר אבל לא מצליח לשלוף אותו: <b>חסימה</b>. הוא בטוח ששמע משהו בהרצאה, אבל בעצם קרא אותו ברשת: <b>ייחוס שגוי</b>.")}`,q:"q27"}
 ]},
 {id:"t7",icon:"bulb",title:"איך לשפר זיכרון",blocks:[

const Q={"q1":{"t":"t1","v":[{"q":"מהם שלושת השלבים של הזיכרון?","a":"קידוד, אחסון ושליפה","w":["קשב, חזרה ושכחה","תחושה, תפיסה ופירוש","רכישה, הכחדה והתאוששות"],"e":"זיכרון הוא מערכת לעיבוד מידע: מכניסים (קידוד), שומרים (אחסון) ומוציאים (שליפה)."},{"q":"מה מלמד תרגיל המחשבה בפתיחת הפרק?","a":"למידה שווה משהו רק אם אפשר לשמור אותה","w":["אפשר לתפקד היטב גם בלי זיכרון ארוך טווח","זיכרון נחוץ רק ללמידה בבית הספר","מיומנויות יומיומיות לא דורשות זיכרון"],"e":"בלי זיכרון לא היינו יודעים להתלבש או לזהות את בני הבית. כל למידה תלויה ביכולת לשמור אותה."}]},"q2":{"t":"t1","v":[{"q":"דניאל זוכר איפה ישב בהרצאה בלי שניסה לזכור. איזה קידוד זה?","a":"קידוד אוטומטי","w":["קידוד מאומץ","קידוד אקוסטי","חזרה מעמיקה"],"e":"מידע על זמן ומקום מקודד בלי מאמץ ובלי מודעות."}]},"q3":{"t":"t1","v":[{"q":"איזה סוג קידוד נותן את הזיכרון המילולי הטוב ביותר?","a":"סמנטי","w":["אקוסטי","חזותי","אוטומטי"],"e":"קידוד לפי משמעות נותן את הזיכרון המילולי הטוב ביותר."},{"q":"מהו אפקט ההתייחסות העצמית?","a":"זוכרים טוב יותר מידע שקשור אלינו","w":["זוכרים טוב יותר מידע שאחרים סיפרו לנו","זוכרים פחות טוב מידע על עצמנו","זוכרים רק מה שמתאים לדימוי העצמי שלנו"],"e":"מידע שמקושר לעצמי ולחיים האישיים נזכר טוב יותר."}]},"q4":{"t":"t1","v":[{"q":"איזה מבין אלה הוא קידוד מאומץ?","a":"ללמוד חומר למבחן","w":["לזכור איפה חנית בלי לנסות","לזכור מה השעה הייתה בבוקר","להבין מילה שמכירים"],"e":"קידוד מאומץ דורש עבודה מכוונת, כמו לימוד למבחן או ללמוד לנהוג."}]},"q5":{"t":"t2","v":[{"q":"כמה זמן מחזיק הזיכרון קצר הטווח בלי חזרה?","a":"כ־15–30 שניות","w":["עד כ־2 שניות בלבד","כמה שעות","ללא הגבלת זמן"],"e":"זיכרון חושי מחזיק עד כ־2 שניות, קצר טווח 15–30 שניות, וארוך טווח לאורך זמן."},{"q":"מה מעביר מידע מהזיכרון קצר הטווח לארוך הטווח?","a":"חזרה","w":["קשב לגירוי בזיכרון החושי","שינה בלבד","הפרעה פרואקטיבית"],"e":"חזרה על המידע או קישור שלו לידע קיים מעבירים אותו לזיכרון ארוך טווח. קשב מעביר מהחושי לקצר הטווח."}]},"q6":{"t":"t2","v":[{"q":"מה קורה למידע בזיכרון החושי שלא קיבל קשב?","a":"הוא נעלם","w":["הוא עובר לזיכרון ארוך טווח","הוא נשמר כזיכרון סמוי","הוא נשמר כ־30 שניות"],"e":"הזיכרון החושי קצר מאוד, ומה שלא קיבל קשב נמחק."},{"q":"מה הקיבולת של הזיכרון קצר הטווח לפי מחקרים חדשים?","a":"4±1 פריטים","w":["7±2 פריטים","ללא הגבלה","פריט אחד"],"e":"מילר הציע 7±2, אבל מחקרים חדשים מציעים 4±1."}]},"q7":{"t":"t2","v":[{"q":"מה הציעו באדלי והיץ׳?","a":"זיכרון עבודה עם תת־מערכות ומנהל מרכזי","w":["שלושה מחסנים: חושי, קצר וארוך טווח","שוויון פוטנציאלי בין אזורי זיכרון","עקומת שכחה שיורדת מהר בהתחלה"],"e":"באדלי והיץ׳ ראו בזיכרון קצר הטווח זיכרון עבודה פעיל. שלושת המחסנים הם המודל של אטקינסון ושיפרין."},{"q":"שמיעת ״היפוקמפוס״ מעוררת אצל דניאל ״זיכרון״ ו״H.M.״. מה זה מדגים?","a":"רשת סמנטית","w":["זיכרון פרוצדורלי","הפרעה רטרואקטיבית","זיכרון חושי"],"e":"מושגים מאורגנים ברשתות, והפעלה של אחד מתפשטת למושגים קשורים."}]},"q8":{"t":"t2","v":[{"q":"מה מחליש את הזיכרון קצר הטווח?","a":"דעיכה והפרעה פרואקטיבית","w":["איחוד מהיר ורשתות סמנטיות","שינה טובה ופעילות אירובית סדירה","חזרה וחלוקה לנתחים"],"e":"עם הזמן המידע דועך, ומידע ישן מפריע לחדש."}]},"q9":{"t":"t3","v":[{"q":"״ביום ההולדת ה־20 שלי הייתי בים״ הוא דוגמה לזיכרון:","a":"אפיזודי","w":["סמנטי","פרוצדורלי","טרימה"],"e":"חוויה אישית עם מה, איפה ומתי היא זיכרון אפיזודי, חלק מהזיכרון המפורש."},{"q":"איזה מבין אלה הוא זיכרון סמוי?","a":"לדעת לרכוב על אופניים","w":["לדעת שירושלים היא בירת ישראל","לזכור את הטיול האחרון","לזכור הגדרה למבחן"],"e":"מיומנות היא זיכרון פרוצדורלי, סוג של זיכרון סמוי. עובדות וחוויות הן זיכרון מפורש."}]},"q10":{"t":"t3","v":[{"q":"מהו זיכרון סמנטי?","a":"עובדות ומושגים כלליים","w":["חוויות אישיות עם זמן ומקום","מיומנויות מוטוריות","רגש שנקשר לגירוי"],"e":"זיכרון סמנטי הוא ידע כללי, ואפיזודי הוא חוויות אישיות. שניהם זיכרון מפורש."},{"q":"מהי טרימה (priming)?","a":"חשיפה קודמת משפיעה על תגובה מאוחרת","w":["חזרה מודעת ומכוונת על אותו מידע","זיכרון של אירוע רגשי וחי","למידה מהירה בפעם השנייה"],"e":"טרימה היא זיכרון סמוי: גירוי קודם משפיע בלי מודעות."}]},"q11":{"t":"t3","v":[{"q":"שאלה אמריקאית במבחן בודקת בעיקר:","a":"זיהוי <h3>2. אחסון: מודל אטקינסון ושיפרין</h3>

<tr><td><b>חושי</b></td><td>עד כ־2 שניות</td><td>מה שלא קיבל קשב נעלם</td><td>קשב</td></tr>
<tr><td><b>קצר טווח</b></td><td>כ־15–30 שניות</td><td>7±2 (מילר); לפי מחקרים חדשים 4±1</td><td>חזרה</td></tr>
<tr><td><b>ארוך טווח</b></td><td>לאורך זמן</td><td>כנראה ללא הגבלה</td><td></td></tr></table></div>
<ul>
<li><b>באדלי והיץ׳</b>: הזיכרון קצר הטווח הוא <b>זיכרון עבודה</b> עם תת־מערכות ו<b>מנהל מרכזי</b>. מחלישים אותו <b>דעיכה</b> ו<b>הפרעה פרואקטיבית</b>.</li>
<li>בזיכרון ארוך הטווח מושגים מאורגנים ב<b>רשתות סמנטיות</b> (״היפוקמפוס״ מעורר ״זיכרון״ ו״H.M.״). <b>איחוד</b> לוקח שעות ויותר.</li>
</ul>

<h3>3. סוגי זיכרון ושליפה</h3>
<div class="tw"><table><tr><th>מפורש (מודע, במילים)</th><th>סמוי (לא מודע, בביצוע)</th></tr>
<tr><td><b>אפיזודי</b>: חוויות אישיות. ״ביום ההולדת ה־20 הייתי בים״</td><td><b>פרוצדורלי</b>: מיומנויות. לרכוב על אופניים</td></tr>
<tr><td><b>סמנטי</b>: עובדות. ״ירושלים היא בירת ישראל״</td><td><b>טרימה</b>, ו<b>התניה רגשית</b></td></tr></table></div>
<p><b>שליפה</b> בשלוש דרכים: <b>היזכרות</b> (בלי רמזים, שאלה פתוחה), <b>זיהוי</b> (שאלה אמריקאית, קל יותר), ו<b>למידה מחדש</b> (מהר יותר בפעם השנייה).</p>

<h3>4. הזיכרון במוח</h3>
<ul>
<li><b>לאשלי</b> חיפש את ה<b>אנגרם</b> (הייצוג הפיזי של זיכרון) בחולדות במבוך ולא מצא. מכאן <b>שוויון פוטנציאלי</b>: חלק אחר באזור מפצה על חלק שנפגע.</li>
</ul>
<div class="tw"><table><tr><th>אזור</th><th>תפקיד</th><th>ראיה</th></tr>
<tr><td><b>אמיגדלה</b></td><td>זיכרון רגשי, פחד</td><td>פגיעה העלימה פחד מותנה בחולדות</td></tr>
<tr><td><b>היפוקמפוס</b></td><td>איחוד, זיכרון מרחבי</td><td>H.M.: בלי היפוקמפוסים, בלי זיכרונות מפורשים חדשים</td></tr>
<tr><td><b>מוחון</b></td><td>זיכרון סמוי</td><td>ארנבים לא למדו מצמוץ מותנה</td></tr>
<tr><td><b>קדם־מצחי</b></td><td>עיבוד ושימור</td><td>עיבוד סמנטי הפעיל אותו יותר</td></tr></table></div>
<ul>
<li><b>תאוריית העוררות</b>: רגש חזק = זיכרון חזק (בלחץ משתחרר יותר גלוטמט). <b>זיכרון ״הבזק״</b>: חי במיוחד (97% זכרו איך שמעו על 11 בספטמבר), אבל לא בהכרח מדויק (בוש ״ראה״ את המטוס הראשון).</li>
</ul>

<h3>5. כשהזיכרון טועה</h3>
<ul>
<li><b>אמנזיה אנטרוגרדית</b>: אי אפשר ליצור זיכרונות <b>חדשים</b> (H.M., שלמד מיומנויות בלי לזכור שהתאמן). <b>רטרוגרדית</b>: אובדן זיכרונות <b>מלפני</b> הפגיעה (K.C. אחרי תאונת אופנוע).</li>
<li>יצירת זיכרון = <b>בנייה</b>; שליפה = <b>שחזור</b>, ובו הזיכרון יכול להשתנות.</li>
<li><b>אפקט המידע המטעה</b> (לופטוס ופאלמר, 1974): ״התנגשו בעוצמה״ מול ״נגעו״ שינה את הערכת המהירות, ויצר ״זכוכית שבורה״ שלא הייתה.</li>
<li><b>הצעה</b>: בפרשת הצלף עדים ״ראו״ טנדר לבן. <b>זיהוי שגוי של עדי ראייה</b> הוא הגורם המוביל להרשעות שווא שבוטלו ב־DNA (רונלד קוטון). לעומתו, באליזבת׳ סמארט נזהרו לא להשפיע על העדה.</li>
<li><b>זיכרונות משוחזרים</b>: לופטוס מזהירה שהצעות של מטפל יכולות לעצב אותם.</li>
</ul>

<h3>6. שכחה</h3>
<ul>
<li><b>כשל קידוד</b>: חלק מה״שכוח״ מעולם לא נכנס (מטבע).</li>
<li><b>אבינגהאוס</b>: שוכחים הכי מהר בהתחלה: כ־50% אחרי 20 דקות, כ־70% אחרי 24 שעות.</li>
<li><b>הפרעה פרואקטיבית</b> (ישן מפריע לחדש) מול <b>רטרואקטיבית</b> (חדש מפריע לישן; פרק 8 מפריע לדניאל לזכור את פרק 6).</li>
</ul>
<div class="tw"><table><tr><th>שבעת החטאים (שכטר)</th><th></th></tr>
<tr><td><b>שכחה</b></td><td>ארעיות, פיזור דעת, חסימה (״על קצה הלשון״)</td></tr>
<tr><td><b>עיוות</b></td><td>ייחוס שגוי (בלבול מקור), הצעה, הטיה</td></tr>
<tr><td><b>חדירה</b></td><td>התמדה (זיכרונות לא רצויים שחוזרים)</td></tr></table></div>

<h3>7. איך ללמוד טוב יותר</h3>
<ul>
<li><b>חזרה</b>, <b>חלוקה לנתחים</b>, ו<b>חזרה מעמיקה</b> (קישור לידע קיים). <b>רמות עיבוד</b> (קרייק ולוקהרט): עיבוד עמוק = זיכרון ארוך יותר.</li>
<li><b>עזרי זיכרון</b>: ראשי תיבות, משפטים וחרוזים. היפופוטם עם זיכרון טוב = היפוקמפוס.</li>
<li>הגייה בקול שיפרה זיכרון ביותר מ־10%.</li>
<li><b>התוכנית של דניאל</b>: לפזר את הלמידה, לכתוב במילים שלו, לקשר לחיים, להשתמש ב<b>כרטיסיות</b> ולא במרקר, ללמוד בשקט, לעשות ספורט, ולישון לפני המבחן.</li>
</ul>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>קשב מעביר מחושי לקצר טווח; חזרה מעבירה מקצר לארוך.</b></li>
<li><b>H.M. איבד יכולת ליצור זיכרונות מפורשים</b>, אבל למד מיומנויות. זו אמנזיה אנטרוגרדית.</li>
<li><b>אפיזודי וסמנטי הם שניהם מפורשים</b>; פרוצדורלי וטרימה סמויים.</li>
<li><b>זיהוי קל יותר מהיזכרות.</b></li>
<li><b>זיכרון ״הבזק״ חי אבל לא בהכרח מדויק.</b></li>
<li><b>פרואקטיבית = ישן מפריע לחדש; רטרואקטיבית = חדש מפריע לישן.</b></li>
<li><b>לאשלי לא מצא את האנגרם.</b></li>
<li><b>הדגשה במרקר לא מומלצת</b>; כרטיסיות ולמידה מפוזרת כן.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#sum"&&typeof SUM!=="undefined")summary();else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
