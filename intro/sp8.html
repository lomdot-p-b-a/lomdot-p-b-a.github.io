<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: Spielman פרק 8 · Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(var(--dist))}to{opacity:1;transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

 {id:"t1",icon:"brain",title:"קידוד: איך מידע נכנס",blocks:[
  {h:"בלי זיכרון",html:`${def("על מה הנושא",`זיכרון הוא מערכת לעיבוד מידע עם שלושה שלבים. הנושא מתחיל מהשלב הראשון: קידוד.<br><b>מה נלמד כאן:</b> שלושת השלבים · קידוד אוטומטי ומאומץ · סוגי קידוד · אפקט ההתייחסות העצמית`)}<p>הפרק נפתח בתרגיל מחשבתי: תתעוררו בבוקר בלי שום זיכרון. לא תדעו איך מתלבשים, איך מצחצחים שיניים, מי האנשים בבית, ואפילו ״מה זו מיטה?״. למידה שווה משהו רק אם אפשר <b>לשמור</b> אותה.</p>${def("זיכרון",`${E("Memory")} מערכת לעיבוד מידע, בדומה למחשב, עם שלושה שלבים: <b>קידוד</b> (הכנסה), <b>אחסון</b> (שמירה לאורך זמן), ו<b>שליפה</b> (הוצאה בחזרה למודעות).`)}${ex("נלווה לאורך הלומדה את <b>דניאל</b>, סטודנט שנה ראשונה שמתכונן למבחן במבוא לפסיכולוגיה. נראה מה קורה לחומר בכל שלב, ובסוף איך הוא יכול ללמוד טוב יותר.")}`,q:"q1"},

 {id:"t2",icon:"data",title:"אחסון: מודל אטקינסון ושיפרין",blocks:[
  {h:"שלושת המחסנים",html:`${def("על מה הנושא",`לפי המודל, מידע עובר שלושה ״מחסנים״, וכל אחד שומר אותו לזמן אחר.<br><b>מה נלמד כאן:</b> זיכרון חושי · קצר טווח · זיכרון עבודה · ארוך טווח`)}${fig("as39")}<div class="tw"><table><tr><th>מחסן</th><th>משך</th><th>קיבולת</th></tr><tr><td><b>חושי</b></td><td>עד כ־2 שניות</td><td>מה שלא קיבל קשב נעלם</td></tr><tr><td><b>קצר טווח</b></td><td>כ־15–30 שניות</td><td>במקור 7±2 פריטים (מילר); מחקרים חדשים: 4±1</td></tr><tr><td><b>ארוך טווח</b></td><td>לאורך זמן</td><td>כנראה ללא הגבלה</td></tr></table></div>${def("חזרה",`${E("Rehearsal")} חזרה על המידע, או קישור שלו לידע קיים, מעבירה אותו מהזיכרון קצר הטווח לארוך הטווח.`)}`,q:"q5"},
  {h:"זיכרון עבודה ורשתות",html:`${def("זיכרון עבודה",`<b>באדלי והיץ׳</b> הציעו שהזיכרון קצר הטווח הוא בעצם <b>זיכרון עבודה</b> עם כמה תת־מערכות ו<b>מנהל מרכזי</b> שמתאם ביניהן.`)}<p>מה מחליש את הזיכרון קצר הטווח? <b>דעיכה</b> עם הזמן, ו<b>הפרעה פרואקטיבית</b> (מידע ישן מפריע לחדש).</p>${def("רשתות סמנטיות",`בזיכרון ארוך הטווח המושגים מאורגנים ב<b>רשתות</b>: הפעלה של מושג אחד ״מתפשטת״ למושגים קשורים.`)}${def("איחוד",`${E("Consolidation")} ייצוב הזיכרון. ברמת הסינפסה זה לוקח שעות, וברמת המערכת יותר.`)}${ex("דניאל שומע ״היפוקמפוס״, וזה מעורר לו ״זיכרון״, ״H.M.״ ו״מוח״. זו רשת סמנטית.")}`,q:"q7"}

 {id:"t3",icon:"copies",title:"סוגי זיכרון ושליפה",blocks:[
  {h:"מפורש וסמוי",html:`${def("על מה הנושא",`זיכרון ארוך טווח הוא לא דבר אחד. וגם שליפה יכולה להיעשות בשלוש דרכים.<br><b>מה נלמד כאן:</b> מפורש · אפיזודי · סמנטי · סמוי · שליפה`)}<div class="tw"><table><tr><th>זיכרון מפורש (מוצהר)</th><th>זיכרון סמוי</th></tr><tr><td>מודע, אפשר לתאר במילים</td><td>לא מודע, נראה בביצוע</td></tr><tr><td><b>אפיזודי</b>: חוויות אישיות (מה, איפה, מתי). ״ביום הולדת 20 הייתי בים״</td><td><b>פרוצדורלי</b>: מיומנויות. לרכוב על אופניים</td></tr><tr><td><b>סמנטי</b>: עובדות ומושגים. ״ירושלים היא בירת ישראל״</td><td><b>טרימה</b> (priming): חשיפה קודמת משפיעה על תגובה מאוחרת</td></tr><tr><td></td><td><b>התניה רגשית</b>: רגש שנקשר לגירוי</td></tr></table></div>${def("היפרתימזיה",`זיכרון אוטוביוגרפי יוצא דופן (למשל השחקנית מרילו הנר). פחות מ־20 אנשים זוהו איתו.`)}`,q:"q9"},

 {id:"t4",icon:"brain",title:"הזיכרון במוח",blocks:[
  {h:"לאשלי וחיפוש האנגרם",html:`${def("על מה הנושא",`אילו אזורי מוח מעורבים בזיכרון, ולמה רגש מחזק זיכרון.<br><b>מה נלמד כאן:</b> לאשלי · אמיגדלה · היפוקמפוס · מוחון · קדם־מצחי · זיכרון ״הבזק״`)}${def("אנגרם",`${E("Engram")} הייצוג הפיזי של זיכרון במוח. <b>קרל לאשלי</b> אימן חולדות במבוך ופגע בחלקים שונים בקורטקס שלהן כדי למצוא אותו. הוא <b>לא מצא</b>: החולדות מצאו את הדרך לא משנה איפה ובאיזה גודל הייתה הפגיעה.`)}${def("שוויון פוטנציאלי",`${E("Equipotentiality")} אם חלק מאזור זיכרון נפגע, חלק אחר באותו אזור יכול לקחת את התפקיד.`)}`,q:"q13"},
  {h:"ארבעה אזורים",html:`<div class="tw"><table><tr><th>אזור</th><th>תפקיד בזיכרון</th><th>ראיה</th></tr><tr><td><b>אמיגדלה</b></td><td>זיכרונות רגשיים, פחד</td><td>חולדות שלמדו לקפוא לצליל שקדם להלם; פגיעה באמיגדלה העלימה את הפחד</td></tr><tr><td><b>היפוקמפוס</b></td><td>איחוד זיכרונות, זיכרון מרחבי וזיהוי</td><td>המטופל <b>H.M.</b>: הוצאו לו שני ההיפוקמפוסים, ולא יכול היה ליצור זיכרונות מפורשים חדשים</td></tr><tr><td><b>מוחון</b></td><td>זיכרון סמוי: מיומנויות והתניה</td><td>ארנבים עם פגיעה במוחון לא למדו מצמוץ מותנה</td></tr><tr><td><b>קדם־מצחי</b></td><td>עיבוד ושימור מידע</td><td>עיבוד סמנטי הפעיל אותו יותר מעיבוד שטחי, והביא לזיכרון טוב יותר</td></tr></table></div>${ex("כדי לזכור, דניאל יכול לדמיין <b>היפופוטם</b> עם זיכרון מעולה: ״היפו־קמפוס״ = זיכרון.")}`,q:"q15"},

 {id:"t5",icon:"x",title:"אמנזיה, שחזור ועדות ראייה",blocks:[
  {h:"אמנזיה",html:`${def("על מה הנושא",`מה קורה כשהזיכרון נפגע, ולמה עדי ראייה טועים.<br><b>מה נלמד כאן:</b> אמנזיה · בנייה ושחזור · הצעה · אפקט המידע המטעה · זיכרונות משוחזרים`)}<div class="tw"><table><tr><th></th><th>אמנזיה אנטרוגרדית</th><th>אמנזיה רטרוגרדית</th></tr><tr><td>מה נפגע</td><td>יצירת זיכרונות <b>חדשים</b></td><td>זיכרונות <b>מלפני</b> הפגיעה</td></tr><tr><td>קשור ל</td><td>פגיעה בהיפוקמפוס</td><td>טראומה לראש, בעיקר זיכרונות אפיזודיים</td></tr><tr><td>דוגמה</td><td>H.M. למד מיומנויות מוטוריות חדשות, בלי לזכור שהתאמן</td><td>K.C. איבד את זיכרון חייו אחרי תאונת אופנוע</td></tr></table></div>${rem("H.M. למד מיומנות בלי לזכור את האימון: הזיכרון ה<b>סמוי</b> שלו עבד, המפורש לא.")}`,q:"q19"},
  {h:"הזיכרון נבנה מחדש",html:`<p>יצירת זיכרון היא <b>בנייה</b>, ושליפה היא <b>שחזור</b>. בכל שליפה הזיכרון יכול להשתנות.</p>${def("אפקט המידע המטעה",`${E("Misinformation effect")} <b>לופטוס ופאלמר</b> (1974): הראו סרטון של תאונה ושאלו כמה מהר נסעו המכוניות כש״<b>התנגשו בעוצמה</b>״ (smashed) או כש״<b>נגעו</b>״ זו בזו. הפועל שינה את הערכת המהירות, ומי ששמע ״התנגשו בעוצמה״ גם ״זכר״ יותר זכוכית שבורה שלא הייתה.`)}${def("הצעה",`${E("Suggestibility")} מידע מבחוץ יוצר זיכרון כוזב. בפרשת הצלף בוושינגטון (2002) עדים רבים ״ראו״ טנדר לבן, והחשודים נהגו במכונית כחולה.`)}`,q:"q21"},
  {h:"עדי ראייה וזיכרונות משוחזרים",html:`<ul><li>לפי ״פרויקט החפות״, <b>זיהוי שגוי של עדי ראייה</b> הוא הגורם המוביל להרשעות שווא שבוטלו בזכות DNA.</li><li><b>רונלד קוטון</b>: נהלים משטרתיים מכוונים חיזקו את הביטחון של העדה בזיהוי שגוי. DNA זיכה אותו.</li><li>לעומתו, במקרה של אליזבת׳ סמארט החוקרים נזהרו לא להשפיע על אחותה, העדה היחידה, והיא זכרה לבסוף את הקול של החוטף.</li></ul>${def("זיכרונות משוחזרים",`<b>לופטוס</b> מטילה ספק בזיכרונות ״שהתגלו״ בהיפנוזה או בדמיון מודרך, כי הצעות של המטפל יכולות לעצב אותם. ההמלצות: שאלות ניטרליות, מסדרי זיהוי ״עיוורים״, ואזהרה למושבעים.`)}`,q:"q23"}
 ]},
 {id:"t6",icon:"clock",title:"שכחה",blocks:[
  {h:"עקומת השכחה והפרעה",html:`${def("על מה הנושא",`למה שוכחים, ובאיזה קצב.<br><b>מה נלמד כאן:</b> כשל קידוד · עקומת אבינגהאוס · הפרעה · שבעת החטאים`)}${def("כשל קידוד",`חלק ממה ש״נשכח״ <b>מעולם לא נכנס</b>. רוב האנשים לא מצליחים לתאר מטבע, כי קודדו רק מה שצריך כדי להבדיל אותו ממטבעות אחרים.`)}${fig("curve39")}<p>לפי <b>אבינגהאוס</b>, שוכחים <b>הכי מהר בהתחלה</b>, ואחר כך הקצב מתמתן: כ־50% מהמידע החדש אחרי 20 דקות, וכ־70% אחרי 24 שעות.</p>${tiles([["split","הפרעה פרואקטיבית","מידע <b>ישן</b> מפריע ללמוד חדש","מה שלמדנו קודם ״דוחף קדימה״ ומפריע ללמוד או לזכור משהו חדש.","דניאל עבר דירה, ועדיין רושם בטפסים את הכתובת הישנה, כי היא ״קופצת״ ראשונה."],["split","הפרעה רטרואקטיבית","מידע <b>חדש</b> מפריע לזכור ישן","מה שלמדנו עכשיו ״דוחף אחורה״ ומפריע לזכור משהו שלמדנו קודם.","אחרי שדניאל למד בערב לפרק אחר, קשה לו להיזכר בפרק שלמד בבוקר."]])}${ex("דניאל למד פעם שהמספר הישן של הבית היה X, ועכשיו קשה לו לזכור את החדש: פרואקטיבית. אחרי שלמד את פרק 8, קשה לו לזכור את פרק 6: רטרואקטיבית.")}`,q:"q25"},
  {h:"שבעת החטאים של שכטר",html:`<div class="tw"><table><tr><th>קבוצה</th><th>חטא</th><th>מה זה</th></tr><tr><td rowspan="3"><b>שכחה</b></td><td>ארעיות</td><td>דעיכה עם הזמן</td></tr><tr><td>פיזור דעת</td><td>חוסר קשב (איפה שמתי את המפתחות?)</td></tr><tr><td>חסימה</td><td>״על קצה הלשון״</td></tr><tr><td rowspan="3"><b>עיוות</b></td><td>ייחוס שגוי</td><td>מבלבלים את המקור</td></tr><tr><td>הצעה</td><td>זיכרון כוזב בגלל אחרים</td></tr><tr><td>הטיה</td><td>אמונות מעצבות את הזיכרון (כולל הטיית ״ידעתי מראש״)</td></tr><tr><td><b>חדירה</b></td><td>התמדה</td><td>זיכרונות לא רצויים שחוזרים</td></tr></table></div>${ex("במבחן, דניאל יודע שהוא מכיר את שם החוקר אבל לא מצליח לשלוף אותו: <b>חסימה</b>. הוא בטוח ששמע משהו בהרצאה, אבל בעצם קרא אותו ברשת: <b>ייחוס שגוי</b>.")}`,q:"q27"}
 ]},
 {id:"t7",icon:"bulb",title:"איך לשפר זיכרון",blocks:[
  {h:"אסטרטגיות זיכרון",html:`${def("על מה הנושא",`מה הפרק ממליץ לעשות כדי לזכור ולהצליח במבחן.<br><b>מה נלמד כאן:</b> חזרה · חלוקה לנתחים · חזרה מעמיקה · עזרי זיכרון · טיפים ללמידה`)}${tiles([["cycle","חזרה","חזרה מודעת על המידע, כמו לוח הכפל","חוזרים על המידע שוב ושוב באופן מודע. זה מחזיק אותו בזיכרון לזמן קצר, ועוזר גם לשמור אותו.","דניאל חוזר בשקט על מספר טלפון עד שהוא מקליד אותו."],["copies","חלוקה לנתחים","קיבוץ לקבוצות: 0467־555־520 במקום עשר ספרות נפרדות","מקבצים פריטים לקבוצות בעלות משמעות, וכך אפשר להחזיק יותר מידע בבת אחת בזיכרון קצר הטווח.","במקום לזכור עשר ספרות נפרדות, דניאל זוכר שלוש קבוצות: 052־055־0467."],["link","חזרה מעמיקה","חושבים מה המידע אומר ומקשרים לידע קיים, ורק אז חוזרים","לא רק חוזרים, אלא חושבים מה המידע אומר ומקשרים אותו למה שכבר יודעים. זה נשמר הרבה יותר טוב.","כדי לזכור מה זו הפרעה פרואקטיבית, דניאל נזכר במעבר הדירה שלו, וכך המושג ״נדבק״ לזיכרון אישי."]])}${def("רמות עיבוד",`<b>קרייק ולוקהרט</b> (1972): עיבוד <b>עמוק</b> יותר (משמעות, קישור) מוביל לזיכרון ארוך יותר.`)}${def("עזרי זיכרון",`ראשי תיבות, משפטים שכל מילה בהם מתחילה באות של מושג, וחרוזים. ככל שהעזר חי ומוזר יותר, קל יותר לזכור אותו.`)}${tiles([["doc","כתיבה רגשית","מי שכתב על חוויות טראומטיות כמה פעמים בחודש הראה אחרי 5 שבועות קיבולת גדולה יותר בזיכרון קצר טווח"],["phone","להגיד בקול","הגיית מילים בקול (או אפילו בתנועת שפתיים) שיפרה את הזיכרון שלהן ביותר מ־10%"]])}`,q:"q29"},
  {h:"איך ללמוד למבחן",html:`<ul><li><b>חזרה מעמיקה ורמות עיבוד</b>: לקשר לידע קיים.</li><li><b>התייחסות עצמית</b>: לכתוב במילים שלכם, ולקשר לחיים.</li><li><b>למידה מפוזרת</b>: לפזר את הלמידה על פני זמן, ולא לדחוס הכל ללילה אחד. האיחוד לוקח זמן.</li><li><b>חזרה מאורגנת</b>, כולל מבחני תרגול.</li><li><b>כרטיסיות במקום מרקר</b>: הדגשה מבזבזת זמן על מה שכבר יודעים. שאלה בצד אחד, תשובה בצד השני, וממשיכים עם ערימת ה״טעיתי״.</li><li><b>להפחית הפרעה</b>: מקום שקט, בלי טלוויזיה.</li><li><b>פעילות אירובית</b>: מעודדת יצירת נוירונים בהיפוקמפוס.</li><li><b>שינה</b>: בזמן השינה המוח מארגן ומאחד מידע.</li></ul>${ex("התוכנית של דניאל: לפזר את הלמידה על שבוע, לכתוב כרטיסיות במילים שלו, לקשר כל מושג לחוויה אישית, לישון לפני המבחן, ולא לסמוך על המרקר.")}`,q:"q31"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מהם שלושת השלבים של הזיכרון?","a":"קידוד, אחסון ושליפה","w":["קשב, חזרה ושכחה","תחושה, תפיסה ופירוש","רכישה, הכחדה והתאוששות"],"e":"זיכרון הוא מערכת לעיבוד מידע: מכניסים (קידוד), שומרים (אחסון) ומוציאים (שליפה)."},{"q":"מה מלמד תרגיל המחשבה בפתיחת הפרק?","a":"למידה שווה משהו רק אם אפשר לשמור אותה","w":["אפשר לתפקד היטב גם בלי זיכרון ארוך טווח","זיכרון נחוץ רק ללמידה בבית הספר","מיומנויות יומיומיות לא דורשות זיכרון"],"e":"בלי זיכרון לא היינו יודעים להתלבש או לזהות את בני הבית. כל למידה תלויה ביכולת לשמור אותה."}]},"q2":{"t":"t1","v":[{"q":"דניאל זוכר איפה ישב בהרצאה בלי שניסה לזכור. איזה קידוד זה?","a":"קידוד אוטומטי","w":["קידוד מאומץ","קידוד אקוסטי","חזרה מעמיקה"],"e":"מידע על זמן ומקום מקודד בלי מאמץ ובלי מודעות."}]},"q3":{"t":"t1","v":[{"q":"איזה סוג קידוד נותן את הזיכרון המילולי הטוב ביותר?","a":"סמנטי","w":["אקוסטי","חזותי","אוטומטי"],"e":"קידוד לפי משמעות נותן את הזיכרון המילולי הטוב ביותר."},{"q":"מהו אפקט ההתייחסות העצמית?","a":"זוכרים טוב יותר מידע שקשור אלינו","w":["זוכרים טוב יותר מידע שאחרים סיפרו לנו","זוכרים פחות טוב מידע על עצמנו","זוכרים רק מה שמתאים לדימוי העצמי שלנו"],"e":"מידע שמקושר לעצמי ולחיים האישיים נזכר טוב יותר."}]},"q4":{"t":"t1","v":[{"q":"איזה מבין אלה הוא קידוד מאומץ?","a":"ללמוד חומר למבחן","w":["לזכור איפה חנית בלי לנסות","לזכור מה השעה הייתה בבוקר","להבין מילה שמכירים"],"e":"קידוד מאומץ דורש עבודה מכוונת, כמו לימוד למבחן או ללמוד לנהוג."}]},"q5":{"t":"t2","v":[{"q":"כמה זמן מחזיק הזיכרון קצר הטווח בלי חזרה?","a":"כ־15–30 שניות","w":["עד כ־2 שניות בלבד","כמה שעות","ללא הגבלת זמן"],"e":"זיכרון חושי מחזיק עד כ־2 שניות, קצר טווח 15–30 שניות, וארוך טווח לאורך זמן."},{"q":"מה מעביר מידע מהזיכרון קצר הטווח לארוך הטווח?","a":"חזרה","w":["קשב לגירוי בזיכרון החושי","שינה בלבד","הפרעה פרואקטיבית"],"e":"חזרה על המידע או קישור שלו לידע קיים מעבירים אותו לזיכרון ארוך טווח. קשב מעביר מהחושי לקצר הטווח."}]},"q6":{"t":"t2","v":[{"q":"מה קורה למידע בזיכרון החושי שלא קיבל קשב?","a":"הוא נעלם","w":["הוא עובר לזיכרון ארוך טווח","הוא נשמר כזיכרון סמוי","הוא נשמר כ־30 שניות"],"e":"הזיכרון החושי קצר מאוד, ומה שלא קיבל קשב נמחק."},{"q":"מה הקיבולת של הזיכרון קצר הטווח לפי מחקרים חדשים?","a":"4±1 פריטים","w":["7±2 פריטים","ללא הגבלה","פריט אחד"],"e":"מילר הציע 7±2, אבל מחקרים חדשים מציעים 4±1."}]},"q7":{"t":"t2","v":[{"q":"מה הציעו באדלי והיץ׳?","a":"זיכרון עבודה עם תת־מערכות ומנהל מרכזי","w":["שלושה מחסנים: חושי, קצר וארוך טווח","שוויון פוטנציאלי בין אזורי זיכרון","עקומת שכחה שיורדת מהר בהתחלה"],"e":"באדלי והיץ׳ ראו בזיכרון קצר הטווח זיכרון עבודה פעיל. שלושת המחסנים הם המודל של אטקינסון ושיפרין."},{"q":"שמיעת ״היפוקמפוס״ מעוררת אצל דניאל ״זיכרון״ ו״H.M.״. מה זה מדגים?","a":"רשת סמנטית","w":["זיכרון פרוצדורלי","הפרעה רטרואקטיבית","זיכרון חושי"],"e":"מושגים מאורגנים ברשתות, והפעלה של אחד מתפשטת למושגים קשורים."}]},"q8":{"t":"t2","v":[{"q":"מה מחליש את הזיכרון קצר הטווח?","a":"דעיכה והפרעה פרואקטיבית","w":["איחוד מהיר ורשתות סמנטיות","שינה טובה ופעילות אירובית סדירה","חזרה וחלוקה לנתחים"],"e":"עם הזמן המידע דועך, ומידע ישן מפריע לחדש."}]},"q9":{"t":"t3","v":[{"q":"״ביום ההולדת ה־20 שלי הייתי בים״ הוא דוגמה לזיכרון:","a":"אפיזודי","w":["סמנטי","פרוצדורלי","טרימה"],"e":"חוויה אישית עם מה, איפה ומתי היא זיכרון אפיזודי, חלק מהזיכרון המפורש."},{"q":"איזה מבין אלה הוא זיכרון סמוי?","a":"לדעת לרכוב על אופניים","w":["לדעת שירושלים היא בירת ישראל","לזכור את הטיול האחרון","לזכור הגדרה למבחן"],"e":"מיומנות היא זיכרון פרוצדורלי, סוג של זיכרון סמוי. עובדות וחוויות הן זיכרון מפורש."}]},"q10":{"t":"t3","v":[{"q":"מהו זיכרון סמנטי?","a":"עובדות ומושגים כלליים","w":["חוויות אישיות עם זמן ומקום","מיומנויות מוטוריות","רגש שנקשר לגירוי"],"e":"זיכרון סמנטי הוא ידע כללי, ואפיזודי הוא חוויות אישיות. שניהם זיכרון מפורש."},{"q":"מהי טרימה (priming)?","a":"חשיפה קודמת משפיעה על תגובה מאוחרת","w":["חזרה מודעת ומכוונת על אותו מידע","זיכרון של אירוע רגשי וחי","למידה מהירה בפעם השנייה"],"e":"טרימה היא זיכרון סמוי: גירוי קודם משפיע בלי מודעות."}]},"q11":{"t":"t3","v":[{"q":"שאלה אמריקאית במבחן בודקת בעיקר:","a":"זיהוי","w":["היזכרות","למידה מחדש","קידוד"],"e":"בשאלה אמריקאית מזהים את התשובה מבין אפשרויות. שאלה פתוחה דורשת היזכרות."},{"q":"מה זו למידה מחדש?","a":"לומדים מהר יותר משהו שכבר למדו פעם","w":["לומדים חומר חדש לגמרי בפעם הראשונה","שוכחים חומר ישן בגלל חדש","נזכרים בלי שום רמז"],"e":"גם אם נראה שהחומר נשכח, ללמוד אותו שוב לוקח פחות זמן."}]},"q12":{"t":"t3","v":[{"q":"מה ההבדל בין זיכרון מפורש לסמוי?","a":"מפורש מודע ונאמר במילים; סמוי נראה בביצוע","w":["סמוי מודע ונאמר במילים; מפורש נראה בביצוע","מפורש קצר טווח; סמוי ארוך טווח","אין הבדל בין השניים"],"e":"זיכרון מפורש (אפיזודי וסמנטי) הוא מודע. סמוי (פרוצדורלי, טרימה, התניה) מתגלה בביצוע."}]},"q13":{"t":"t4","v":[{"q":"מה מצא לאשלי בחיפוש אחר האנגרם?","a":"החולדות מצאו את הדרך בכל פגיעה","w":["הזיכרון של המבוך נמצא באזור אחד מסוים","פגיעה קטנה מחקה את כל הזיכרון","רק פגיעה בהיפוקמפוס השפיעה"],"e":"לאשלי לא מצא את האנגרם, וזה הוביל להשערת השוויון הפוטנציאלי."},{"q":"מהו שוויון פוטנציאלי?","a":"חלק אחר באזור יכול לקחת את התפקיד של חלק שנפגע","w":["כל אזורי המוח שווים לגמרי בתפקיד הזיכרון שלהם","זיכרון נשמר במקום אחד בדיוק","שני ההיפוקמפוסים זהים"],"e":"לאשלי הציע שאם חלק מאזור זיכרון נפגע, חלק אחר באותו אזור מפצה."}]},"q14":{"t":"t4","v":[{"q":"מהו אנגרם?","a":"הייצוג הפיזי של זיכרון במוח","w":["אזור במוח שמטפל בפחד ובתוקפנות","סוג של זיכרון סמוי","חומר כימי שמחזק זיכרון"],"e":"אנגרם הוא ה״עקבה״ הפיזית של זיכרון. לאשלי חיפש אותו ולא מצא."}]},"q15":{"t":"t4","v":[{"q":"מה קרה ל־H.M. אחרי שהוצאו לו ההיפוקמפוסים?","a":"לא יכול היה ליצור זיכרונות מפורשים חדשים","w":["שכח את כל מה שקרה בחייו לפני הניתוח","איבד את היכולת ללמוד מיומנויות","איבד את הזיכרון הרגשי בלבד"],"e":"הזיכרונות הישנים נשמרו, אבל זיכרונות מפורשים חדשים לא נוצרו. מיומנויות חדשות הוא כן למד."},{"q":"איזה אזור קשור לזיכרון סמוי כמו מיומנויות והתניה?","a":"המוחון","w":["ההיפוקמפוס","האמיגדלה","הקורטקס הקדם־מצחי"],"e":"ארנבים עם פגיעה במוחון לא למדו מצמוץ מותנה."}]},"q16":{"t":"t4","v":[{"q":"חולדות שלמדו לקפוא לצליל שקדם להלם הפסיקו לפחד אחרי פגיעה ב:","a":"אמיגד const SUM=`<h2>סיכום: Spielman פרק 8 - זיכרון</h2>
<div class="key"><b>למה הפרק הזה חשוב?</b> הספר פותח בתרגיל מחשבתי: דמיינו שקמתם בבוקר בלי שום זיכרון. לא הייתם יודעים איך מתלבשים, איך מצחצחים שיניים, מי האנשים בבית, ואפילו אם זה הבית שלכם. כל מה שלמדנו שווה משהו רק אם יש לנו דרך <b>לשמור</b> אותו.<br><br>
<b>השאלה של הפרק במשפט אחד:</b> איך המידע נכנס לזיכרון, איפה הוא נשמר, איך מוציאים אותו, ולמה לפעמים הוא נעלם או משתבש?<br><br>
<b>הפרק בנוי מארבעה חלקים, לפי ארבעת הסעיפים בספר:</b><br>
① <b>איך הזיכרון עובד</b> (סעיפים 1–3): שלושה תפקידים (קידוד, אחסון, שליפה), שלושה ״מחסנים״, וסוגי הזיכרון.<br>
② <b>איפה במוח</b> (סעיף 4): האם זיכרון יושב במקום אחד או מפוזר, ואילו אזורים חשובים.<br>
③ <b>כשהזיכרון נכשל</b> (סעיפים 5–6): אמנזיה, עדות ראייה שגויה, ולמה שוכחים.<br>
④ <b>איך לשפר</b> (סעיף 7): אסטרטגיות זיכרון ולמידה.<br>
<b>הקשר בין החלקים:</b> אם מבינים איך הזיכרון בנוי (חלק 1), מבינים גם איפה הוא נשבר (חלק 3), ואיך לעזור לו (חלק 4).</div>

<tr><td><b>מפורש</b></td><td>זיכרון שאנחנו <b>יודעים</b> שיש לנו ויכולים לספר עליו.</td></tr>

<div class="ex"><b>הדוגמה שתלווה אותנו: דניאל לפני המבחן.</b> דניאל, סטודנט שנה ראשונה, מתכונן למבחן במבוא לפסיכולוגיה. נעקוב אחרי החומר שהוא לומד: איך הוא נכנס, איפה הוא נשמר, למה חלק ממנו נשכח, ואיך דניאל יכול ללמוד טוב יותר.</div>

<h3>1. קידוד: איך מידע נכנס</h3>
<p>הספר משווה את הזיכרון למחשב: מערכת לעיבוד מידע עם שלושה תפקידים, <b>קידוד, אחסון ושליפה</b>. מתחילים מהראשון.</p>
<div class="ex"><b>שני סוגי קידוד לפי המאמץ:</b><br>

<b>מאומץ</b> = דורש עבודה וקשב. <b>אצל דניאל:</b> ללמוד הגדרות למבחן.<br>
<b>השאלה שעוזרת:</b> ״האם האדם <b>ניסה</b> לזכור?״ אם לא, ובכל זאת זוכר, זה אוטומטי.</div>
<div class="ex"><b>שלושה סוגי קידוד לפי מה שנשמר:</b><br>
<b>סמנטי</b> = לפי המשמעות. <b>חזותי</b> = לפי איך זה נראה. <b>אקוסטי</b> = לפי איך זה נשמע.<br>
<b>הממצא:</b> לזיכרון של מילים, קידוד <b>סמנטי</b> הוא הטוב ביותר. מי שחושב מה המילה <b>אומרת</b> זוכר אותה יותר ממי ששם לב רק לאותיות או לצליל.<br>
<b>אפקט ההתייחסות העצמית:</b> מידע שקשור <b>אלינו</b> נזכר טוב יותר. <b>אצל דניאל:</b> הוא מקשר ״הסתגלות חושית״ לריח הקפה במעונות, שהוא הפסיק להריח אחרי כמה דקות.</div>

<h3>2. אחסון: מודל אטקינסון ושיפרין</h3>
<p>אחרי שהמידע נכנס, צריך לשמור אותו. לפי <b>מודל אטקינסון ושיפרין</b>, המידע עובר דרך שלושה ״מחסנים״, כמו בפס ייצור:</p>
<div class="tw"><table><tr><th>מחסן</th><th>כמה זמן</th><th>כמה נכנס</th><th>מה מעביר הלאה</th></tr>
<tr><td><b>חושי</b></td><td>שבריר שנייה עד כמה שניות</td><td>הרבה, אבל מה שלא קיבל קשב נעלם</td><td><b>קשב</b></td></tr>
<tr><td><b>קצר טווח</b></td><td>כ־15–30 שניות</td><td>בערך 7±2 פריטים (מילר); מחקרים חדשים: 4±1</td><td><b>חזרה</b></td></tr>
<tr><td><b>ארוך טווח</b></td><td>לאורך זמן</td><td>כמעט ללא הגבלה</td><td>-</td></tr></table></div>
<div class="ex"><b>אצל דניאל:</b> בהרצאה הוא שומע הרבה (זיכרון חושי). רק מה שהוא <b>שם לב</b> אליו עובר לזיכרון קצר טווח. ורק מה שהוא <b>חוזר עליו</b> נכנס לזיכרון ארוך טווח.<br>
<b>הכלל לזכור:</b> <b>קשב</b> מעביר מחושי לקצר. <b>חזרה</b> מעבירה מקצר לארוך.</div>
<div class="ex"><b>תיקון למודל: באדלי והיץ׳.</b> הזיכרון קצר הטווח הוא לא רק ״מחסן״ פסיבי, אלא <b>זיכרון עבודה</b>: מקום שבו <b>מעבדים</b> מידע, עם כמה תת־מערכות ו<b>מנהל מרכזי</b> שמחלק את הקשב. והקשר בין קצר לארוך הוא לא חד־כיווני: גם ידע מהזיכרון הארוך חוזר ומשפיע על מה שמעבדים עכשיו.<br>
<b>דוגמה:</b> כשדניאל פותר תרגיל בראש, הוא מחזיק מספרים בזיכרון העבודה, ומשתמש בחוקי חשבון מהזיכרון הארוך.<br>
<b>מה מחליש את הזיכרון קצר הטווח:</b> <b>דעיכה</b> (פשוט עובר זמן) ו<b>הפרעה</b> (מידע אחר נכנס).</div>
<div class="ex"><b>בזיכרון ארוך הטווח</b> המושגים מאורגנים ב<b>רשתות סמנטיות</b>: כל מושג מחובר למושגים קרובים. כשחושבים על ״היפוקמפוס״, ״זיכרון״ ו״H.M.״ ״נדלקים״ גם הם. <b>איחוד</b> = התהליך שבו זיכרון חדש מתייצב, והוא לוקח שעות ויותר.</div>

<h3>3. סוגי זיכרון ושליפה</h3>
<p>הזיכרון ארוך הטווח הוא לא מחסן אחד. הספר מחלק אותו לשניים, ולכל אחד יש תת־סוגים:</p>
<div class="tw"><table><tr><th>מפורש (מודע, אפשר לספר במילים)</th><th>סמוי (לא מודע, רואים בביצוע)</th></tr>
<tr><td><b>אפיזודי</b>: חוויות אישיות עם זמן ומקום. ״ביום ההולדת ה־20 הייתי בים״</td><td><b>פרוצדורלי</b>: מיומנויות. לרכוב על אופניים, להקליד</td></tr>
<tr><td><b>סמנטי</b>: עובדות וידע כללי. ״ירושלים היא בירת ישראל״</td><td><b>טרימה</b> (חשיפה קודמת משפיעה בלי שנדע) ו<b>התניה רגשית</b></td></tr></table></div>
<div class="ex"><b>השאלות שעוזרות:</b><br>
① ״האם אפשר <b>לספר</b> את הזיכרון במילים?״ אם כן, הוא <b>מפורש</b>. אם רואים אותו רק <b>בביצוע</b>, הוא <b>סמוי</b>.<br>
② אם מפורש: ״האם יש בו <b>אני, זמן ומקום</b>?״ אם כן, <b>אפיזודי</b>. אם זה ידע כללי, <b>סמנטי</b>.<br>
<b>דוגמה:</b> ״אני זוכרת שלמדתי לנהוג עם אבא בחניון״ = אפיזודי. ״מה הצבע של רמזור לעצירה״ = סמנטי. היכולת עצמה לנהוג = פרוצדורלי.</div>
<div class="ex"><b>שלוש דרכים לשלוף:</b><br>
<b>היזכרות</b> = שולפים בלי רמזים, כמו בשאלה פתוחה.<br>
<b>זיהוי</b> = מזהים את התשובה מתוך אפשרויות, כמו בשאלה אמריקאית. <b>קל יותר</b>.<br>
<b>למידה מחדש</b> = לומדים שוב משהו שנשכח, ומגלים שזה הולך מהר יותר. זה מראה שמשהו נשאר בזיכרון.<br>
<b>אצל דניאל:</b> בשאלה אמריקאית הוא מזהה את המונח, אבל בשאלה פתוחה לא מצליח לשלוף אותו. זה הגיוני: זיהוי קל מהיזכרות.</div>

<h3>4. הזיכרון במוח</h3>
<p>אחרי שהבנו <b>איך</b> הזיכרון עובד, הספר שואל <b>איפה</b> הוא יושב: במקום אחד במוח, או בהרבה מקומות?</p>
<div class="ex"><b>לאשלי וחיפוש האנגרם.</b> <b>אנגרם</b> = הייצוג הפיזי של זיכרון, קבוצת הנוירונים ״שמחזיקה״ אותו. לאשלי אימן חולדות במבוך, ואז פגע בחלקים שונים בקורטקס שלהן כדי ״למחוק״ את הזיכרון. החולדות עדיין זכרו את המבוך.<br>
<b>המסקנה שלו:</b> הוא לא מצא את האנגרם, והציע שזיכרונות <b>מפוזרים</b> במוח ולא שמורים במקום אחד. כשחלק נפגע, חלקים אחרים מפצים.</div>
<div class="tw"><table><tr><th>אזור</th><th>התפקיד בזיכרון</th><th>ראיה או דוגמה</th></tr>
<tr><td><b>היפוקמפוס</b></td><td>כאן <b>מקודדים</b> זיכרונות חדשים (איחוד), וגם זיכרון מרחבי</td><td>H.M. בלי היפוקמפוסים: לא יצר זיכרונות מפורשים חדשים</td></tr>
<tr><td><b>אמיגדלה</b></td><td>זיכרון רגשי ופחד. עוזרת <b>להחליט מה לשמור</b>, לפי עוצמת הרגש</td><td>פגיעה בה העלימה פחד מותנה בחולדות</td></tr>
<tr><td><b>מוחון</b></td><td>זיכרון <b>פרוצדורלי</b> וסמוי</td><td>ארנבים עם פגיעה במוחון לא למדו מצמוץ מותנה</td></tr>
<tr><td><b>קדם־מצחי</b></td><td>עיבוד ושימור של מידע</td><td>עיבוד לפי משמעות הפעיל אותו יותר</td></tr></table></div>
<div class="ex"><b>רגש וזיכרון:</b> חוויה רגשית חזקה משחררת נוירוטרנסמיטרים והורמונים שמחזקים את הזיכרון (<b>תאוריית העוררות</b>). לכן אירוע מרגש נזכר טוב יותר מאירוע אפור.<br>
<b>זיכרון ״הבזק״</b> = זיכרון חי במיוחד של אירוע משמעותי. <b>אבל:</b> הוא <b>חי</b>, לא בהכרח <b>מדויק</b>. 97% זכרו איך שמעו על 11 בספטמבר, ובכל זאת פרטים רבים השתנו עם השנים. אפילו הנשיא בוש ״זכר״ שראה את המטוס הראשון בטלוויזיה, אף שזה לא שודר אז.<br>
<b>דוגמה:</b> אנשים ״בטוחים״ איפה היו כששמעו חדשות דרמטיות, אבל כששואלים אותם שוב אחרי שנה, הסיפור משתנה.</div>

<h3>5. כשהזיכרון טועה: אמנזיה, שחזור ועדות ראייה</h3>
<p>עד עכשיו ראינו איך הזיכרון עובד. עכשיו הספר מראה איפה הוא נשבר, קודם בפגיעה במוח, ואחר כך גם אצל אנשים בריאים.</p>
<div class="tw"><table><tr><th></th><th>אמנזיה אנטרוגרדית</th><th>אמנזיה רטרוגרדית</th></tr>
<tr><td><b>מה אובד</b></td><td>היכולת ליצור זיכרונות <b>חדשים</b> אחרי הפגיעה</td><td>זיכרונות <b>מלפני</b> הפגיעה</td></tr>
<tr><td><b>כיוון בזמן</b></td><td>קדימה ←</td><td>← אחורה</td></tr>
<tr><td><b>דוגמה</b></td><td>H.M.: למד מיומנויות חדשות, בלי לזכור שהתאמן</td><td>K.C. אחרי תאונת אופנוע</td></tr></table></div>
<div class="ex"><b>השאלה שעוזרת:</b> ״הזיכרונות שחסרים הם מ<b>לפני</b> הפגיעה או מ<b>אחרי</b>?״ לפני = רטרוגרדית. אחרי (לא נוצרים חדשים) = אנטרוגרדית.<br>
<b>שימו לב ל־H.M.:</b> הוא לא יצר זיכרונות <b>מפורשים</b> חדשים, אבל למד מיומנויות (<b>סמוי</b>). זה מראה שאלה מערכות נפרדות.</div>
<div class="ex"><b>הזיכרון הוא לא הקלטה.</b> יצירת זיכרון היא <b>בנייה</b>, ושליפה היא <b>שחזור</b>. בכל פעם ששולפים זיכרון, בונים אותו מחדש, והוא יכול להשתנות.<br>
<b>אפקט המידע המטעה (לופטוס ופאלמר, 1974):</b> אנשים צפו בסרט של תאונה. מי שנשאל באיזו מהירות המכוניות ״התנגשו בעוצמה״ העריך מהירות גבוהה יותר ממי שנשאל באיזו מהירות הן ״נגעו״, ואפילו ״זכר״ זכוכית שבורה שלא הייתה. מילה אחת בשאלה שינתה את הזיכרון.<br>
<b>הצעה:</b> בפרשת הצלף בוושינגטון, עדים רבים ״ראו״ טנדר לבן, אחרי שזה דווח בתקשורת. הרוצחים נסעו ברכב אחר לגמרי.</div>
<div class="ex"><b>עדות ראייה:</b> זיהוי שגוי של עדי ראייה הוא הגורם המוביל להרשעות שווא שבוטלו בזכות DNA. <b>דוגמה:</b> רונלד קוטון ישב בכלא שנים בגלל עדה שהייתה בטוחה שזיהתה אותו.<br>
<b>לעומת זאת:</b> במקרה של אליזבת׳ סמארט נזהרו לא להשפיע על העדה הצעירה, וזה עזר לשמור על הזיכרון שלה.<br>
<b>זיכרונות משוחזרים:</b> לופטוס מזהירה ששאלות והצעות של מטפל יכולות ליצור ״זיכרונות״ שלא קרו. זו מחלוקת בתחום.</div>

<h3>6. שכחה</h3>
<p>גם בלי פגיעה במוח, כולנו שוכחים. הספר מציג כמה סיבות שונות:</p>
<div class="ex"><b>1. כשל קידוד:</b> חלק מה״שכוח״ <b>מעולם לא נכנס</b>. <b>דוגמה:</b> רוב האנשים לא מצליחים לצייר מטבע שהם מחזיקים כל יום, כי מעולם לא שמו לב לפרטים.<br>
<b>2. עקומת השכחה (אבינגהאוס):</b> שוכחים הכי מהר <b>בהתחלה</b>. בערך 50% אחרי 20 דקות, ו־70% אחרי יום. אחר כך השכחה מאטה.<br>
<b>3. הפרעה:</b> המידע נשמר, אבל משהו אחר חוסם את הגישה אליו.</div>
<div class="tw"><table><tr><th></th><th>הפרעה פרואקטיבית</th><th>הפרעה רטרואקטיבית</th></tr>
<tr><td><b>מה מפריע למה</b></td><td>ה<b>ישן</b> מפריע לזכור את ה<b>חדש</b></td><td>ה<b>חדש</b> מפריע לזכור את ה<b>ישן</b></td></tr>
<tr><td><b>דוגמה</b></td><td>החלפתם מספר טלפון, ואתם עדיין מקלידים את הישן</td><td>דניאל למד פרק 8, ועכשיו מתבלבל בחומר של פרק 6</td></tr></table></div>
<div class="ex"><b>טריק לזכור:</b> ״פרו״ = קדימה: הישן ״דוחף קדימה״ ומפריע לחדש. ״רטרו״ = אחורה: החדש ״חוזר אחורה״ ומפריע לישן.</div>
<div class="tw"><table><tr><th>שבעת ״החטאים״ של שכטר</th><th>מה זה</th></tr>
<tr><td><b>שכחה</b></td><td><b>ארעיות</b> (נמחק עם הזמן), <b>פיזור דעת</b> (לא שמנו לב), <b>חסימה</b> (״על קצה הלשון״)</td></tr>
<tr><td><b>עיוות</b></td><td><b>ייחוס שגוי</b> (בלבול במקור: ״איפה שמעתי את זה?״), <b>הצעה</b>, <b>הטיה</b> (הזיכרון מתאים את עצמו לעמדות של היום)</td></tr>
<tr><td><b>חדירה</b></td><td><b>התמדה</b>: זיכרונות לא רצויים שחוזרים שוב ושוב</td></tr></table></div>

<h3>7. איך לשפר זיכרון</h3>
<p>אחרי שראינו איך הזיכרון נכשל, הספר מסיים במה שאפשר לעשות. כל טיפ כאן מבוסס על משהו שלמדנו בפרק.</p>
<div class="ex"><b>אסטרטגיות זיכרון:</b><br>
• <b>חזרה</b>: מעבירה מקצר לארוך טווח (סעיף 2).<br>
• <b>חלוקה לנתחים</b>: מקבצים פריטים, כמו מספר טלפון ב־3 קבוצות, וכך הזיכרון קצר הטווח ״מכיל״ יותר.<br>
• <b>חזרה מעמיקה</b>: לא רק לחזור, אלא <b>לקשר</b> לידע קיים. לפי <b>רמות העיבוד</b> (קרייק ולוקהרט), עיבוד <b>עמוק</b> (לפי משמעות) = זיכרון ארוך יותר.<br>
• <b>עזרי זיכרון</b>: ראשי תיבות, משפטים, חרוזים, תמונות. <b>דוגמה:</b> ״היפופוטם עם זיכרון טוב״ = היפוקמפוס.<br>
• <b>הגייה בקול</b> שיפרה זיכרון ביותר מ־10%.<br>
• <b>התייחסות עצמית</b> ו<b>שינה מספקת</b>.</div>
<div class="ex"><b>התוכנית של דניאל למבחן:</b> לפזר את הלמידה על כמה ימים, לכתוב במילים שלו, לקשר כל מושג לחיים שלו, להשתמש בכרטיסיות ולא במרקר, ללמוד בשקט, לעשות ספורט, ולישון טוב לפני המבחן.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. לזיכרון שלושה תפקידים: <b>קידוד, אחסון ושליפה</b> (היזכרות, זיהוי, למידה מחדש).<br>
2. לפי <b>אטקינסון ושיפרין</b>, מידע עובר מחושי לקצר טווח (בעזרת <b>קשב</b>) ומשם לארוך טווח (בעזרת <b>חזרה</b>). <b>באדלי והיץ׳</b> הוסיפו את זיכרון העבודה.<br>
3. זיכרון ארוך טווח הוא <b>מפורש</b> (אפיזודי, סמנטי) או <b>סמוי</b> (פרוצדורלי, טרימה). במוח: <b>היפוקמפוס</b> מקודד חדש, <b>אמיגדלה</b> לרגש, <b>מוחון</b> למיומנויות. לאשלי לא מצא אנגרם אחד.<br>
4. הזיכרון <b>נבנה מחדש</b> בכל שליפה, ולכן עדות ראייה אינה אמינה (אפקט המידע המטעה, הצעה). אמנזיה היא <b>אנטרוגרדית</b> או <b>רטרוגרדית</b>.<br>
5. שוכחים בגלל <b>כשל קידוד</b>, <b>הפרעה</b> (פרואקטיבית ורטרואקטיבית) ושבעת החטאים, ומשפרים בעזרת עיבוד עמוק, עזרי זיכרון, פיזור ושינה.<br><br>
<b>מה צריך לדעת לעשות במבחן (לפי מטרות הספר):</b><br>
• לתאר את שלושת התפקידים ואת שלושת שלבי האחסון.<br>
• להבחין בין פרוצדורלי למפורש, ובין סמנטי לאפיזודי, בדוגמה.<br>
• להסביר את תפקידי ההיפוקמפוס, האמיגדלה והמוחון.<br>
• להשוות בין שני סוגי האמנזיה.<br>
• להסביר למה עדות ראייה לא אמינה.<br>
• להסביר כשל קידוד ואת טעויות הזיכרון.<br>
• להשוות בין שני סוגי ההפרעה.<br>
• ליישם אסטרטגיות לשיפור זיכרון ולמידה.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>קשב</b> מעביר מחושי לקצר טווח; <b>חזרה</b> מעבירה מקצר לארוך.</li>
<li><b>H.M.</b> איבד את היכולת ליצור זיכרונות מפורשים חדשים, אבל למד מיומנויות. זו אמנזיה <b>אנטרוגרדית</b>.</li>
<li><b>אפיזודי וסמנטי</b> הם שניהם מפורשים; <b>פרוצדורלי וטרימה</b> סמויים.</li>
<li><b>זיהוי</b> קל יותר מהיזכרות.</li>
<li>זיכרון <b>״הבזק״</b> חי, אבל לא בהכרח מדויק.</li>
<li><b>פרואקטיבית</b> = ישן מפריע לחדש; <b>רטרואקטיבית</b> = חדש מפריע לישן.</li>
<li><b>לאשלי לא מצא</b> את האנגרם, והציע שזיכרון מפוזר.</li>
<li><b>כשל קידוד</b> הוא לא שכחה של משהו שנשמר: המידע מעולם לא נכנס.</li>
<li><b>הדגשה במרקר לא מומלצת</b>; כרטיסיות ולמידה מפוזרת כן.</li>
</ul></div>`;

    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";

     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

/* Flashcards: front = the term and a prompt, back = the answer and an example.
   "יודע" removes the card from this round, "עוד לא" sends it to the end of the deck. */
function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");
    const card=app.querySelector("#fc"),acts=app.querySelector(".fc-actions");
    const flip=()=>{flipped=!flipped;card.classList.toggle("flipped",flipped);card.setAttribute("aria-pressed",flipped);
      if(flipped&&!acts.querySelector(".fc-btns")){acts.innerHTML=`<div class="fc-btns"><button class="fc-no" id="no">${ic("cycle")}<span>עוד לא</span></button><button class="primary fc-yes" id="yes">${ic("check")}<span>ידעתי</span></button></div>`;
        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};
        acts.querySelector("#no").onclick=()=>{missed.add(k);S.cards[k]=0;save();deck.push(deck.shift());step("fwd")};}};
    card.onclick=flip;
    document.onkeydown=e=>{if(!document.body.contains(card))return document.onkeydown=null;if(e.key===" "||e.key==="Enter"){if(document.activeElement===card||document.activeElement===document.body){e.preventDefault();flip()}}};
  };
  step("up");
}
/* Mind map: one level at a time. The current node sits in the middle, its children around it.

function mindmap(mi,onBack){
  const M=MAPSET[mi],seen=new Set();
  const tint=(n,c)=>{n._c=c;(n.c||[]).forEach(x=>tint(x,c))};
  M.root._c="var(--accent)";M.root.c.forEach((b,k)=>tint(b,`var(--t${k%8+1})`));
  const leaves=n=>n.c?n.c.flatMap(leaves):[n],total=leaves(M.root).length;
  let path=[M.root],sel=null;
  document.body.style.setProperty("--c","var(--accent)");
  show(`<div class="stack mm-view"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>${onBack?"חזרה לנושא":"כל הנושאים"}</span></button><span class="prog" id="mmc">0 מתוך ${total} מושגים</span></div></div>
   <div class="mm-head"><span class="eyebrow">מפת חשיבה</span><h2>${M.title}</h2><p class="muted">לחצו על ענף כדי לפתוח אותו, ועל מושג כדי לקרוא עליו. לחיצה על המרכז חוזרת רמה אחת אחורה.</p></div>
   <nav class="mm-crumbs" id="mmb" aria-label="מיקום במפה"></nav>
   <div class="mm" id="mm"><svg class="mm-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
   <div class="mm-detail" id="mmd" aria-live="polite"></div></div>`,"up");
  app.querySelector("#back").onclick=onBack||(()=>home("back"));

/* Every module gets flashcards and a mind map. A hand-written CARDS or MAPS file wins;
   otherwise both are built from the module's own definitions (tiles, long concept cards, def boxes). */
const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim()};
function deriveTerms(){
  return T.flatMap((t,ti)=>t.blocks.map((blk,bi)=>{const d=document.createElement("div");d.innerHTML=blk.html;
    const items=[...d.children].filter(isTerm).flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem).filter(x=>strip(x.name));
    return{t,ti,bi,h:blk.h,items}}).filter(b=>b.items.length));
}
function autoCards(blocks){
  const byTopic=T.map(t=>blocks.filter(b=>b.t===t).flatMap(b=>b.items.map(it=>({it,t})))
    .sort((a,b)=>strip(b.it.body).length-strip(a.it.body).length));
  const out=[],used=new Set();
  for(let r=0;out.length<12&&byTopic.some(x=>x.length>r);r++)for(const list of byTopic){if(out.length>=12)break;const x=list[r];if(!x)continue;const key=strip(x.it.name);if(used.has(key))continue;used.add(key);
    const hasEx=/cpt-ex/.test(x.it.body);out.push({t:x.t.id,f:x.it.name,q:hasEx?"מה זה? נסו גם לחשוב על דוגמה":"מה ההגדרה?",b:x.it.body,ex:""})}
  return out;
}
function autoMap(blocks){
  const chunk=(name,items)=>{const leaves=items.map(it=>({n:it.name,en:it.en,d:it.body}));if(leaves.length<=8)return[{n:name,c:leaves}];
    const parts=Math.ceil(leaves.length/7);return Array.from({length:parts},(_,k)=>({n:`${name} (${k+1}/${parts})`,c:leaves.slice(k*7,k*7+7)}))};
  const kids=T.map(t=>{const bs=blocks.filter(b=>b.t===t);if(!bs.length)return null;
    const sub=bs.flatMap(b=>chunk(b.h,b.items));
    const c=sub.length===1?sub[0].c:sub.map(s=>({n:s.n,d:`${s.c.length} מושגים מהקטע ״${s.n}״.`,c:s.c}));
    return{n:t.title,d:`נושא ${T.indexOf(t)+1} בלומדה. ${c.length} ${sub.length===1?"מושגים":"קטעים"} בענף.`,c}}).filter(Boolean);
  if(kids.length<2)return null;
  return{id:"module",title:"מפת הלומדה",sub:"כל הנושאים והמושגים במבט אחד",root:{n:CONFIG.he||CONFIG.title,d:CONFIG.about||"כל הנושאים של הלומדה. לחצו על נושא כדי לפתוח את המושגים שלו.",c:kids}};
}
