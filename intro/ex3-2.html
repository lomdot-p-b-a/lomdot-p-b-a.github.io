const T=[
 {id:"t1",icon:"brain",title:"זיכרון והזדקנות: הרקע",blocks:[
  {h:"למה זה מעסיק אנשים",html:`${def("על מה הנושא",`למה זיכרון ופעולות חשיבה נחלשים עם הגיל, והאם אפשר לעשות משהו? הנושא מסביר את הרקע למחקר.<br><b>מה נלמד כאן:</b> תפקודים ניהוליים · פלסטיות מוחית · אימון קוגניטיבי ממוחשב · תלונות זיכרון סובייקטיביות`)}<p>אוכלוסייה מזדקנת ותוחלת חיים ארוכה יותר הביאו לכך שאנשים עובדים עד גיל מאוחר יותר. הרבה מהם מודאגים מאובדן זיכרון, שסימניו מופיעים בדרך כלל כבר <b>בשנות ה-50</b>.</p>${def("מושג מפתח",`<mark>תפקודים ניהוליים</mark> ${E("Executive functions")}: היכולות שמאפשרות ללמוד מיומנויות חדשות, לפתור בעיות מורכבות ולהפעיל שליטה עצמית. הם פחות נדרשים במשימות מוכרות ואוטומטיות.`)}${rem(`ירידת הזיכרון עם הגיל קשורה לירידה בתפקודים הניהוליים, שאולי קשורה לירידה בנפח <b>האונה המצחית</b> ${E("Frontal lobe")}.`)}${ex(`<b>תפקודים ניהוליים</b>: ללמוד להשתמש בטלפון חדש, לתכנן מסלול כשהכביש חסום, או להתאפק לא לענות בכעס. אלה פעולות שדורשות "מנהל" במוח.`)}`,q:"q1"},
  {h:"המוח ממשיך להשתנות",html:`${def("מושג מפתח",`<mark>פלסטיות מוחית</mark> ${E("Plasticity")}: המוח ממשיך להתפתח ולהתחבר מחדש גם בגיל מבוגר. גירוי מחשבתי ביומיום עוזר לפתח ולשמר את התפקוד הקוגניטיבי.`)}<p>לכן <b>מניעה בשלב שלפני המחלה</b> היא כנראה הדרך היעילה ביותר להקטין את השכיחות של מחלות ניווניות.</p>${def("מושג מפתח",`<mark>אימון קוגניטיבי ממוחשב</mark> ${E("Computerized cognitive training, CCT")}: התפתח משנות ה-2000, כי אין בו מגבלות של זמן ומקום. בהתחלה שימש לשיקום, ובהדרגה עבר ל<b>מניעה</b> של ירידה קוגניטיבית.`)}${ex(`<b>פלסטיות</b>: סבתא בת 70 שלומדת לנגן בפסנתר. המוח שלה יוצר חיבורים חדשים, גם בגיל הזה.`)}`,q:"q3"},
  {h:"תלונות זיכרון סובייקטיביות",html:`${def("מושג מפתח",`<mark>תלונות זיכרון סובייקטיביות</mark> ${E("Subjective memory complaints, SMC")}: האדם מדווח שהזיכרון שלו ירד, <b>אבל במבחן סטנדרטי אין פגיעה אובייקטיבית</b>.`)}${tiles([["people","נפוץ מאוד","בין 25% ל-50% מהמבוגרים"],["clock","מנבא","מחקרים רבים מצאו ש-SMC מנבא ירידה קוגניטיבית ודמנציה בעתיד"],["target","לכן מניעה","צריך התערבות מוקדמת כדי לדחות את הפגיעה"]])}${ex(`אדם בן 65 שאומר "אני כל הזמן שוכח איפה שמתי את המפתחות", אבל במבחני זיכרון במרפאה התוצאות שלו תקינות לגמרי.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"phone",title:"אימון בסמארטפון ובעיות שיטה",blocks:[
  {h:"למה דווקא סמארטפון",html:`${def("על מה הנושא",`למה אימון דווקא בסמארטפון, ואיך בודקים שהשיפור אמיתי ולא סתם תוצאה של ציפייה או של תרגול?<br><b>מה נלמד כאן:</b> יתרונות הסמארטפון · קבוצות ביקורת · פלצבו · אפקט תרגול`)}<p>טכנולוגיה ניידת יצרה תחום חדש: <mark>בריאות ניידת</mark> ${E("mHealth")}. בקוריאה, ב-2015, ל-83% מהאוכלוסייה היה סמארטפון, והשיעור בקרב בני 60 ומעלה עולה.</p>${tiles([["phone","זמין ביומיום","אפשר להתאמן בבית, בלי להגיע למרפאה"],["cart","יש כבר אפליקציות","חינמיות ובתשלום, לזיכרון ולחשיבה"],["question","אבל אין מחקר","כמעט אין מחקר על היעילות של אימון זיכרון מובנה בסמארטפון"]])}`,q:"q7"},
  {h:"איך משווים נכון",html:`<p>כדי שאימון כזה ייחשב טיפול מבוסס, צריך <b>קבוצת ביקורת מתאימה</b>: דומה במעורבות, במוטיבציה, בזמן האימון, בממשק ובחידוש.</p>${tiles([["copies","ביקורת פעילה","קבוצה שעושה משהו דומה. עדיפה מבחינה מתודולוגית"],["clock","רשימת המתנה","קבוצה שלא מקבלת כלום בינתיים ומקבלת אחר כך"]])}${def("שני \"אויבים\"",`<mark>אפקט פלצבו או ציפייה</mark>: שיפור שנובע מהאמונה שהאימון עוזר. נמצאו ראיות לכך באימון זיכרון עבודה. <mark>אפקט תרגול</mark> ${E("Practice effect")}: שיפור רק כי עושים את המבחן פעם שנייה. חשוב במיוחד אצל מבוגרים.`)}${rem("לכן במחקר הזה יש <b>שתי</b> קבוצות ביקורת: אחת פעילה ואחת של רשימת המתנה.")}${ex(`<b>פלצבו</b>: מי שבטוח שהאימון עוזר, ישתדל יותר במבחן. <b>אפקט תרגול</b>: בפעם השנייה שעושים את אותו מבחן, כבר מכירים אותו ומצליחים יותר. לכן צריך קבוצת ביקורת שעוברת את אותו הדבר בלי האימון.`)}`,q:"q9"}
 ]},
 {id:"t3",icon:"flask",title:"המחקר: איך הוא נבנה",blocks:[
  {h:"מי השתתפו",html:`${def("על מה הנושא",`איך המחקר נבנה: מי השתתפו, לאילו שלוש קבוצות חולקו, ומה נמדד.<br><b>מה נלמד כאן:</b> משתתפים · SMART מול שתי קבוצות ביקורת · מדדים`)}<p>גויסו 60 מבוגרים בשנות ה-50 וה-60 לחייהם שדיווחו על תלונות זיכרון.</p>${yn(["אומרים שהזיכרון שלהם פחות טוב מאשר לבני גילם, ושירד ב-10 השנים האחרונות","ציון 24 ומעלה במבחן מצב מנטלי (תקין)","יש להם סמארטפון"],["אלצהיימר או פגיעה קוגניטיבית","צורך מיידי בטיפול רפואי","דיכאון קשה לא מטופל"])}<p>אחרי נשירה וסינון נשארו <mark>53 משתתפים</mark> (25 גברים, 28 נשים), גילאי 50 עד 68, גיל ממוצע 59.3. לא היו הבדלים בין הקבוצות בגיל, בהשכלה או ביכולת קוגניטיבית.</p>`,q:"q11"},
  {h:"שלוש קבוצות",html:`${fig("groups")}${tiles([["phone","SMART","אפליקציה חדשה: 10 משימות בקשב, זיכרון וזיכרון עבודה, ב-3 רמות קושי. בכל מפגש 3 משימות"],["chart","Fit Brains","אפליקציה מסחרית מוכרת. נבחרה כי יש לה גרסה בקוריאנית, משימות לפי תחומים ורמות קושי. כל משימה פעמיים, כדי שהזמן יהיה שווה"],["clock","רשימת המתנה","בלי אימון. נבדקו שוב אחרי 8 שבועות, ואז קיבלו את SMART"]])}${rem("סה\"כ <b>40 מפגשים</b>. החוקרים התקשרו כל שבוע ובדקו בסוף את רישומי האימון בטלפון.")}`,q:"q13"},
  {h:"מה מדדו",html:`${measTable}<p>הניתוח: מערך של <b>3 קבוצות × 2 זמנים</b> (לפני ואחרי). IQ ושינוי בדיכאון נכנסו כ<mark>משתני בקרה</mark> ${E("Covariates")}, כי בקבוצת SMART הם היו מעט גבוהים יותר.</p>`,q:"q15"}
 ]},
 {id:"t4",icon:"chart",title:"התוצאות",blocks:[
  {h:"ביצוע: רק זיכרון עבודה",html:`${def("על מה הנושא",`מה מצאו? ההפתעה: השיפור בביצוע וההרגשה הסובייקטיבית הלכו בכיוונים שונים.<br><b>מה נלמד כאן:</b> זיכרון עבודה · תלונות זיכרון · דיכאון, חרדה ונשירה`)}<p>אינטראקציה של קבוצה × זמן נמצאה <b>רק</b> בשני מדדים: <mark>מנת זיכרון העבודה</mark> (WMQ) ו<mark>זיכרון עבודה שמיעתי-מילולי</mark>. בשניהם העלייה הייתה מובהקת <b>רק בקבוצת SMART</b>.</p>${tiles([["check","SMART","WMQ עלה בכ-8.8 נקודות"],["x","Fit Brains","עלייה קטנה ולא מובהקת"],["x","המתנה","כמעט ללא שינוי"]])}${rem("בזיכרון הכללי, בקשב ובמבחן סטרופ לא נמצאה אינטראקציה. בחלק מהמבחנים הניהוליים היה שיפור לאורך זמן <b>בכל הקבוצות</b>, כלומר לא בגלל האימון.")}`,q:"q17"},
  {h:"ההרגשה: הפוך",html:`${fig("paradox","שינוי ממוצע מלפני לאחרי בכל קבוצה")}<p><b>שביעות הרצון מהזיכרון</b> (MMQ-C) עלתה <b>רק בקבוצת Fit Brains</b>, למרות שהיא לא השתפרה בביצוע. בקבוצת SMART, שהשתפרה, שביעות הרצון לא עלתה.</p>${rem("<b>המסקנה החשובה:</b> שיפור אובייקטיבי בביצוע <b>לא בהכרח</b> מקטין את התלונה הסובייקטיבית.")}`,q:"q19"},
  {h:"דיכאון, חרדה ונשירה",html:`<p>דיכאון וחרדה <b>ירדו לאורך הזמן בכל הקבוצות</b>, כולל רשימת ההמתנה. כלומר זה לא היה בגלל האימון.</p>${ex("5 המשתתפים שנשרו היו עם מנת זיכרון עבודה נמוכה יותר בהתחלה, מ-48 שהמשיכו (בערך 91 לעומת 107).")}`,q:"q21"}
 ]},
 {id:"t5",icon:"bulb",title:"דיון, מגבלות ומסקנה",blocks:[

 {q:"מה אפשר ללמוד מכך ש-SMART שיפרה זיכרון עבודה בלי לשפר את שביעות הרצון?",a:"שיפור אובייקטיבי לא בהכרח מקטין את תלונות הזיכרון",w:["שהאפליקציה לא עובדת","שזיכרון עבודה לא קשור לזיכרון","שהמשתתפים שיקרו"],e:"זו אחת המסקנות המרכזיות."},
 {q:"מה השתנה בזיכרון הכללי (MQ)?",a:"לא נמצאה אינטראקציה, כלומר אין יתרון לאימון כלשהו",w:["עלה רק ב-SMART","עלה רק ב-Fit Brains","ירד ב-SMART"],e:"השיפור הייחודי היה רק בזיכרון עבודה."}]},
q21:{t:"t4",v:[
 {q:"מה קרה לדיכאון ולחרדה?",a:"ירדו לאורך הזמן בכל הקבוצות, כולל רשימת ההמתנה",w:["ירדו רק ב-SMART","עלו בכל הקבוצות","ירדו רק ב-Fit Brains"],e:"לכן הירידה לא נובעת מהאימון."},
 {q:"דיכאון ירד גם ברשימת ההמתנה. מה המשמעות?",a:"הירידה לא קשורה לאימון",w:["רשימת ההמתנה קיבלה טיפול","האימון הוא שהוריד את הדיכאון","המדד לא אמין"],e:"זו בדיוק הסיבה שיש קבוצה בלי אימון."}]},
q22:{t:"t4",v:[
 {q:"במה היו שונים 5 המשתתפים שנשרו?",a:"הייתה להם מנת זיכרון עבודה נמוכה יותר בהתחלה",w:["הם היו מבוגרים יותר","הם היו בדיכאון","היה להם IQ גבוה יותר"],e:"בערך 91 לעומת 107."},
 {q:"למה חשוב לבדוק במה שונים המשתתפים שנשרו?",a:"כי נשירה לא אקראית יכולה להטות את התוצאות",w:["כדי להחזיר אותם למחקר","כי זה חובה חוקית בלבד","כדי לחשב את הגיל הממוצע"],e:"אם הנושרים שונים, המדגם הסופי כבר לא מייצג את כולם."}]},
q23:{t:"t5",v:[
 {q:"למה השיפור בזיכרון עבודה חשוב במיוחד למבוגרים בריאים עם SMC?",a:"כי SMC אצלם כנראה משקף ירידה בזיכרון עבודה, שתלוי באונה המצחית",w:["כי זיכרון עבודה לא משתנה עם הגיל","כי זה מונע אלצהיימר בוודאות","כי זה משפר שמיעה"],e:"באלצהיימר, לעומת זאת, הפגיעה ברקה ובקודקוד."},
 {q:"במה שונה אלצהיימר מ-SMC אצל מבוגרים בריאים, לפי המאמר?",a:"באלצהיימר השינויים באונות הרקה והקודקוד, וב-SMC כנראה ירידה בזיכרון עבודה מצחי",w:["אין הבדל","באלצהיימר הפגיעה רק באונה המצחית","SMC הוא שלב מתקדם של אלצהיימר"],e:"זה מסביר למה זיכרון עבודה הוא יעד חשוב."}]},
q24:{t:"t5",v:[
 {q:"איך החוקרים מסבירים שרק SMART שיפרה זיכרון עבודה?",a:"היא אימנה יותר זיכרון וזיכרון עבודה, וגם קשב ועכבה",w:["היא הייתה ארוכה יותר","המשתתפים בה היו צעירים יותר","היא הייתה בחינם"],e:"4 משימות זיכרון ו-3 של זיכרון עבודה, לעומת 2 משימות זיכרון ב-Fit Brains."},
 {q:"מה מצאה המטא-אנליזה שהמאמר מצטט על אימון קוגניטיבי ממוחשב?",a:"רק זיכרון עבודה השתפר גם באימון ביתי, קצר ובמנה קטנה",w:["כל התחומים השתפרו","שום תחום לא השתפר","רק מהירות עיבוד השתפרה"],e:"לשיפור בזיכרון הכללי צריך כנראה אימון ארוך ואינטנסיבי."}]},
q25:{t:"t5",v:[
 {q:"מה ההבדל בין העברה קרובה להעברה רחוקה?",a:"קרובה: שיפור במשימה דומה. רחוקה: שיפור בתפקוד היומיומי",w:["קרובה: בבית. רחוקה: במעבדה","קרובה: אצל צעירים. רחוקה: אצל מבוגרים","אין הבדל"],e:"העברה רחוקה קטנה יותר, בעיקר אצל מבוגרים."},
 {q:"אחרי אימון זיכרון עבודה, אדם משתפר במשימת זיכרון עבודה אחרת. זו:",a:"העברה קרובה",w:["העברה רחוקה","אפקט פלצבו","אפקט תקרה"],e:"העברה רחוקה היא שיפור בתפקוד היומיומי, מחוץ למשימות האימון."}]},
q26:{t:"t5",v:[
 {q:"למה, לפי החוקרים, Fit Brains שיפרה את שביעות הרצון מהזיכרון?",a:"צריך להגיע לציון יעד כדי לעלות רמה, וזה חיזק מסוגלות עצמית ותחושת הישג",w:["כי היא הייתה קשה יותר","כי היא שיפרה זיכרון עבודה","כי היא כללה טיפול בדיכאון"],e:"ב-SMART אפשר לעלות לקושי גבוה בלי קשר לביצוע."},
 {q:"למה השימוש באסטרטגיות זיכרון (MMQ-S) לא עלה?",a:"כי האימונים לא לימדו אסטרטגיות",w:["כי המשתתפים כבר השתמשו בכולן","כי המדד לא עבד","כי האימון היה קצר מדי"],e:"מחקרים אחרים מצאו שהתערבות על ציפיות ומטא-זיכרון כן מקטינה SMC."}]},
q27:{t:"t5",v:[
 {q:"איזו מהבאות היא מגבלה של המחקר?",a:"המדגם היה משכיל עם IQ גבוה מהממוצע, ולכן קשה להכליל",w:["לא הייתה קבוצת ביקורת","החלוקה לא הייתה אקראית","לא מדדו זיכרון עבודה"],e:"IQ ממוצע 114."},
 {q:"למה העובדה שהמשתתפים ידעו מה מטרת המחקר היא בעיה?",a:"כי ציפיות ואמונה בתוצאה יכולות להשפיע על התוצאות",w:["כי זה לא אתי","כי הם יכלו לרמות במבחן","כי זה מאריך את המחקר"],e:"זה עלול להיות משתנה מתערב (ציפייה)."}]},
q28:{t:"t5",v:[
 {q:"מה המסקנה של המאמר?",a:"8 שבועות של אימון זיכרון בסמארטפון עשויים לשפר זיכרון עבודה, אבל לא בהכרח מקטינים תלונות זיכרון",w:["אימון בסמארטפון מונע דמנציה","כל אפליקציות הזיכרון יעילות באותה מידה","אימון בסמארטפון לא משפר שום דבר"],e:"שתי החלקים של המסקנה חשובים."},
 {q:"מה החידוש של המחקר, לפי החוקרים?",a:"המחקר הראשון עם קבוצות ביקורת שבדק אימון זיכרון בסמארטפון אצל מבוגרים בריאים עם SMC",w:["המחקר הראשון על זיכרון","המחקר הראשון על אלצהיימר","המחקר הראשון שהשתמש בסמארטפון לאבחון"],e:"ולכן הוא מוסיף ראיות לשיטות אימון חדשות."}]}
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
