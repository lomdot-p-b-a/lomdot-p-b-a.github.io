<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"brain",title:"זיכרון והזדקנות: הרקע",blocks:[
  {h:"למה זה מעסיק אנשים",html:`${def("על מה הנושא",`למה זיכרון ופעולות חשיבה נחלשים עם הגיל, והאם אפשר לעשות משהו? הנושא מסביר את הרקע למחקר.<br><b>מה נלמד כאן:</b> תפקודים ניהוליים · פלסטיות מוחית · אימון קוגניטיבי ממוחשב · תלונות זיכרון סובייקטיביות`)}<p>אוכלוסייה מזדקנת ותוחלת חיים ארוכה יותר הביאו לכך שאנשים עובדים עד גיל מאוחר יותר. הרבה מהם מודאגים מאובדן זיכרון, שסימניו מופיעים בדרך כלל כבר <b>בשנות ה-50</b>.</p>${def("מושג מפתח",`<mark>תפקודים ניהוליים</mark> ${E("Executive functions")}: היכולות שמאפשרות ללמוד מיומנויות חדשות, לפתור בעיות מורכבות ולהפעיל שליטה עצמית. הם פחות נדרשים במשימות מוכרות ואוטומטיות.`)}${rem(`ירידת הזיכרון עם הגיל קשורה לירידה בתפקודים הניהוליים, שאולי קשורה לירידה בנפח <b>האונה המצחית</b> ${E("Frontal lobe")}.`)}${ex(`<b>תפקודים ניהוליים</b>: ללמוד להשתמש בטלפון חדש, לתכנן מסלול כשהכביש חסום, או להתאפק לא לענות בכעס. אלה פעולות שדורשות "מנהל" במוח.`)}`,q:"q1"},
  {h:"המוח ממשיך להשתנות",html:`${def("מושג מפתח",`<mark>פלסטיות מוחית</mark> ${E("Plasticity")}: המוח ממשיך להתפתח ולהתחבר מחדש גם בגיל מבוגר. גירוי מחשבתי ביומיום עוזר לפתח ולשמר את התפקוד הקוגניטיבי.`)}<p>לכן <b>מניעה בשלב שלפני המחלה</b> היא כנראה הדרך היעילה ביותר להקטין את השכיחות של מחלות ניווניות.</p>${def("מושג מפתח",`<mark>אימון קוגניטיבי ממוחשב</mark> ${E("Computerized cognitive training, CCT")}: התפתח משנות ה-2000, כי אין בו מגבלות של זמן ומקום. בהתחלה שימש לשיקום, ובהדרגה עבר ל<b>מניעה</b> של ירידה קוגניטיבית.`)}${ex(`<b>פלסטיות</b>: סבתא בת 70 שלומדת לנגן בפסנתר. המוח שלה יוצר חיבורים חדשים, גם בגיל הזה.`)}`,q:"q3"},
  {h:"תלונות זיכרון סובייקטיביות",html:`${def("מושג מפתח",`<mark>תלונות זיכרון סובייקטיביות</mark> ${E("Subjective memory complaints, SMC")}: האדם מדווח שהזיכרון שלו ירד, <b>אבל במבחן סטנדרטי אין פגיעה אובייקטיבית</b>.`)}${tiles([["people","נפוץ מאוד","בין 25% ל-50% מהמבוגרים"],["clock","מנבא","מחקרים רבים מצאו ש-SMC מנבא ירידה קוגניטיבית ודמנציה בעתיד","תלונות על הזיכרון, גם כשהמבחנים תקינים, מנבאות ירידה בעתיד. לכן כדאי להתערב מוקדם.","רחל מרגישה שהזיכרון שלה נחלש. גם אם המבחנים תקינים, זה סימן שכדאי להתחיל לאמן אותו."],["target","לכן מניעה","צריך התערבות מוקדמת כדי לדחות את הפגיעה"]])}${ex(`אדם בן 65 שאומר "אני כל הזמן שוכח איפה שמתי את המפתחות", אבל במבחני זיכרון במרפאה התוצאות שלו תקינות לגמרי.`)}`,q:"q5"}

 {id:"t2",icon:"phone",title:"אימון בסמארטפון ובעיות שיטה",blocks:[
  {h:"למה דווקא סמארטפון",html:`${def("על מה הנושא",`למה אימון דווקא בסמארטפון, ואיך בודקים שהשיפור אמיתי ולא סתם תוצאה של ציפייה או של תרגול?<br><b>מה נלמד כאן:</b> יתרונות הסמארטפון · קבוצות ביקורת · פלצבו · אפקט תרגול`)}<p>טכנולוגיה ניידת יצרה תחום חדש: <mark>בריאות ניידת</mark> ${E("mHealth")}. בקוריאה, ב-2015, ל-83% מהאוכלוסייה היה סמארטפון, והשיעור בקרב בני 60 ומעלה עולה.</p>${tiles([["phone","זמין ביומיום","אפשר להתאמן בבית, בלי להגיע למרפאה"],["cart","יש כבר אפליקציות","חינמיות ובתשלום, לזיכרון ולחשיבה"],["question","אבל אין מחקר","כמעט אין מחקר על היעילות של אימון זיכרון מובנה בסמארטפון"]])}`,q:"q7"},
  {h:"איך משווים נכון",html:`<p>כדי שאימון כזה ייחשב טיפול מבוסס, צריך <b>קבוצת ביקורת מתאימה</b>: דומה במעורבות, במוטיבציה, בזמן האימון, בממשק ובחידוש.</p>${tiles([["copies","ביקורת פעילה","קבוצה שעושה משהו דומה. עדיפה מבחינה מתודולוגית","קבוצת ביקורת שעושה פעילות דומה, אבל בלי הרכיב שנבדק. כך יודעים שהשיפור לא נובע רק מעצם ההשתתפות.","אסתר מתאמנת באפליקציית Fit Brains אותו זמן כמו רחל ב־SMART. אם רק רחל משתפרת, זה בזכות SMART ולא בזכות עצם האימון."],["clock","רשימת המתנה","קבוצה שלא מקבלת כלום בינתיים ומקבלת אחר כך","קבוצת ביקורת שלא מקבלת כלום בזמן המחקר, ומקבלת את הטיפול אחר כך. הבעיה: היא לא עושה כלום, ולכן לא ברור אם השיפור בקבוצה השנייה נובע מהטיפול עצמו או רק מהעיסוק.","משתתפת ברשימת ההמתנה לא מתאמנת בכלל במשך 8 שבועות, ורק אחרי הבדיקה החוזרת מקבלת את SMART."]])}${def("שני \"אויבים\"",`<mark>אפקט פלצבו או ציפייה</mark>: שיפור שנובע מהאמונה שהאימון עוזר. נמצאו ראיות לכך באימון זיכרון עבודה. <mark>אפקט תרגול</mark> ${E("Practice effect")}: שיפור רק כי עושים את המבחן פעם שנייה. חשוב במיוחד אצל מבוגרים.`)}${rem("לכן במחקר הזה יש <b>שתי</b> קבוצות ביקורת: אחת פעילה ואחת של רשימת המתנה.")}${ex(`<b>פלצבו</b>: מי שבטוח שהאימון עוזר, ישתדל יותר במבחן. <b>אפקט תרגול</b>: בפעם השנייה שעושים את אותו מבחן, כבר מכירים אותו ומצליחים יותר. לכן צריך קבוצת ביקורת שעוברת את אותו הדבר בלי האימון.`)}`,q:"q9"}
 ]},
 {id:"t3",icon:"flask",title:"המחקר: איך הוא נבנה",blocks:[
  {h:"מי השתתפו",html:`${def("על מה הנושא",`איך המחקר נבנה: מי השתתפו, לאילו שלוש קבוצות חולקו, ומה נמדד.<br><b>מה נלמד כאן:</b> משתתפים · SMART מול שתי קבוצות ביקורת · מדדים`)}<p>גויסו 60 מבוגרים בשנות ה-50 וה-60 לחייהם שדיווחו על תלונות זיכרון.</p>${yn(["אומרים שהזיכרון שלהם פחות טוב מאשר לבני גילם, ושירד ב-10 השנים האחרונות","ציון 24 ומעלה במבחן מצב מנטלי (תקין)","יש להם סמארטפון"],["אלצהיימר או פגיעה קוגניטיבית","צורך מיידי בטיפול רפואי","דיכאון קשה לא מטופל"])}<p>אחרי נשירה וסינון נשארו <mark>53 משתתפים</mark> (25 גברים, 28 נשים), גילאי 50 עד 68, גיל ממוצע 59.3. לא היו הבדלים בין הקבוצות בגיל, בהשכלה או ביכולת קוגניטיבית.</p>`,q:"q11"},

 {id:"t4",icon:"chart",title:"התוצאות",blocks:[
  {h:"ביצוע: רק זיכרון עבודה",html:`${def("על מה הנושא",`מה מצאו? ההפתעה: השיפור בביצוע וההרגשה הסובייקטיבית הלכו בכיוונים שונים.<br><b>מה נלמד כאן:</b> זיכרון עבודה · תלונות זיכרון · דיכאון, חרדה ונשירה`)}<p>אינטראקציה של קבוצה × זמן נמצאה <b>רק</b> בשני מדדים: <mark>מנת זיכרון העבודה</mark> (WMQ) ו<mark>זיכרון עבודה שמיעתי-מילולי</mark>. בשניהם העלייה הייתה מובהקת <b>רק בקבוצת SMART</b>.</p>${tiles([["check","SMART","WMQ עלה בכ-8.8 נקודות","רק בקבוצת SMART זיכרון העבודה עלה בצורה ברורה, בכמעט 9 נקודות.","רחל מגלה בבדיקה בסוף שהיא מחזיקה בראש יותר מידע בבת אחת."],["x","Fit Brains","עלייה קטנה ולא מובהקת","בקבוצת Fit Brains הייתה עלייה קטנה, לא מספיק גדולה כדי להיחשב הבדל אמיתי.","אסתר הרגישה שהשתפרה, אבל במבחן לא נמצא שיפור ממשי."],["x","המתנה","כמעט ללא שינוי","בקבוצה שלא התאמנה כמעט לא היה שינוי. זה מראה שהשיפור של SMART לא נבע רק מכך שעשו את המבחן פעם שנייה.","בעלה של רחל, שלא התאמן, קיבל כמעט אותו ציון בשתי הבדיקות."]])}${rem("בזיכרון הכללי, בקשב ובמבחן סטרופ לא נמצאה אינטראקציה. בחלק מהמבחנים הניהוליים היה שיפור לאורך זמן <b>בכל הקבוצות</b>, כלומר לא בגלל האימון.")}`,q:"q17"},
  {h:"ההרגשה: הפוך",html:`${fig("paradox","שינוי ממוצע מלפני לאחרי בכל קבוצה")}<p><b>שביעות הרצון מהזיכרון</b> (MMQ-C) עלתה <b>רק בקבוצת Fit Brains</b>, למרות שהיא לא השתפרה בביצוע. בקבוצת SMART, שהשתפרה, שביעות הרצון לא עלתה.</p>${rem("<b>המסקנה החשובה:</b> שיפור אובייקטיבי בביצוע <b>לא בהכרח</b> מקטין את התלונה הסובייקטיבית.")}`,q:"q19"},
  {h:"דיכאון, חרדה ונשירה",html:`<p>דיכאון וחרדה <b>ירדו לאורך הזמן בכל הקבוצות</b>, כולל רשימת ההמתנה. כלומר זה לא היה בגלל האימון.</p>${ex("5 המשתתפים שנשרו היו עם מנת זיכרון עבודה נמוכה יותר בהתחלה, מ-48 שהמשיכו (בערך 91 לעומת 107).")}`,q:"q21"}
 ]},
 {id:"t5",icon:"bulb",title:"דיון, מגבלות ומסקנה",blocks:[
  {h:"למה דווקא זיכרון עבודה, ולמה רק SMART",html:`${def("על מה הנושא",`איך מסבירים את התוצאות, ומה המגבלות?<br><b>מה נלמד כאן:</b> למה רק זיכרון עבודה · העברה · מוטיבציה · מגבלות ומסקנה`)}${tiles([["brain","ירידה ממקור מצחי","אצל מבוגרים בריאים, SMC כנראה משקף ירידה ב<b>זיכרון עבודה</b>, שתלוי באונה המצחית. באלצהיימר הפגיעה ברקה ובקודקוד"],["copies","יותר אימון במה שנבדק","SMART כלל 4 משימות זיכרון ו-3 של זיכרון עבודה, ו-Fit Brains רק 2 משימות זיכרון"],["target","קשב ועכבה","SMART אימן גם קשב ועכבת תגובה, שקשורים מאוד לזיכרון עבודה","SMART אימן גם קשב ויכולת לעצור תגובה. שתי היכולות האלה קשורות מאוד לזיכרון עבודה, ואולי לכן הוא השתפר.","תרגול של ״לא ללחוץ כשמופיע צבע מסוים״ מאמן גם את היכולת להחזיק מידע ולסנן הסחות."]])}${rem("מטא-אנליזה מצאה שמבין כל התחומים, <b>רק זיכרון עבודה</b> השתפר גם באימון ביתי, קצר ובמנה קטנה. לשיפור בזיכרון הכללי צריך כנראה אימון ארוך ואינטנסיבי.")}`,q:"q23"},
  {h:"העברה, מוטיבציה ותחושת הצלחה",html:`${tiles([["link","העברה קרובה","שיפור במשימת זיכרון עבודה אחרת. השפעה גדולה יותר","שיפור במשימה דומה למה שהתאמנו עליו. זה קורה יותר בקלות, וההשפעה גדולה יותר.","רחל התאמנה בזכירת רצפים באפליקציה, והשתפרה גם במבחן זיכרון עבודה אחר במעבדה."],["building","העברה רחוקה","שיפור בתפקוד היומיומי. השפעה קטנה יותר, בעיקר אצל מבוגרים","שיפור בחיים עצמם, מחוץ למשימות האימון. זה קשה יותר להשיג, וההשפעה קטנה יותר.","השאלה החשובה: האם רחל גם תשכח פחות איפה שמה את המפתחות. כאן השיפור קטן הרבה יותר."]])}<p><b>למה Fit Brains שיפר את ההרגשה?</b> שם צריך להגיע לציון יעד כדי לעלות רמה. ההתקדמות ההדרגתית כנראה חיזקה <mark>מסוגלות עצמית</mark> ${E("Self-efficacy")} ותחושת הישג. ב-SMART אפשר לעבור למשימות קשות בלי קשר לביצוע, ולכן התגמול הפנימי היה חלש יותר.</p>${rem("השימוש באסטרטגיות זיכרון (MMQ-S) לא עלה, כנראה כי האימונים לא לימדו אסטרטגיות.")}`,q:"q25"},
  {h:"מגבלות ומסקנה",html:`${tiles([["grad","מדגם משכיל","IQ ממוצע 114 וביצוע מעל הממוצע. קשה להכליל לכל המבוגרים עם SMC"],["people","מדגם קטן","מעט משתתפים בכל קבוצה, ולכן עוצמה סטטיסטית נמוכה","כשיש מעט משתתפים, קשה לגלות הבדל אמיתי בין הקבוצות, גם אם הוא קיים.","עם עשרה משתתפים בכל קבוצה, שיפור קטן אך אמיתי יכול להיראות כמו מקרה."],["phone","בלי שליטה בסביבה","קשה לוודא באיזו רצינות התאמנו בבית"],["question","ציפיות","המשתתפים ידעו מה מטרת המחקר ולאיזו קבוצה שויכו","המשתתפים ידעו מה מטרת המחקר ולאיזו קבוצה שייכים, ולכן ייתכן שהציפיות שלהם השפיעו על התוצאות. זו מגבלה.","רחל ידעה שהיא בקבוצת ״האפליקציה החדשה״, ואולי ניסתה יותר במבחן בסוף."],["clock","אין מעקב","לא בדקו כמה זמן ההשפעה נשמרת ואם היא עוברת ליומיום"]])}${def("המסקנה",`8 שבועות של אימון זיכרון בסמארטפון <b>עשויים לשפר זיכרון עבודה</b> אצל מבוגרים. אבל שיפור בביצוע לא בהכרח מקטין את תלונות הזיכרון. זה המחקר הראשון עם קבוצות ביקורת שבדק אימון כזה אצל מבוגרים בריאים עם SMC.`)}`,q:"q27"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"לפי המאמר, מה מקשר בין הזדקנות לירידה בזיכרון?","a":"ירידה בתפקודים ניהוליים, אולי בגלל האונה המצחית","w":["ירידה בזיכרון הפרוצדורלי בגלל פגיעה במוח הקטן","ירידה בשמיעה ובראייה שמונעת קליטה של מידע","ירידה במוטיבציה ללמוד דברים חדשים אחרי הפרישה"],"e":"המאמר מקשר את הירידה בזיכרון עם הגיל לירידה בתפקודים ניהוליים, אולי בגלל שינויים באונה המצחית. הוא לא מייחס אותה לזיכרון הפרוצדורלי או לחושים."},{"q":"מתי מופיעים בדרך כלל הסימנים הראשונים לאובדן זיכרון?","a":"בשנות ה-50","w":["בשנות ה-30","בשנות ה-70","רק אחרי הפרישה"],"e":"הסימנים הראשונים לאובדן זיכרון מופיעים בדרך כלל בשנות ה-50. לכן המחקר עוסק במבוגרים בשנות ה-50 וה-60, לפני ירידה משמעותית."}]},
"q2":{"t":"t1","v":[{"q":"איזו פעולה דורשת במיוחד תפקודים ניהוליים?","a":"תכנון מסלול חדש כשהכביש חסום","w":["נסיעה במסלול הקבוע לעבודה","צחצוח שיניים בבוקר","הקלדה במקלדת מוכרת"],"e":"תפקודים ניהוליים נדרשים כשצריך לתכנן ולהתמודד עם בעיה חדשה, כמו מסלול חלופי. נסיעה במסלול הקבוע היא פעולה אוטומטית שלא דורשת אותם."},{"q":"למה ירידה בתפקודים ניהוליים מטרידה במיוחד?","a":"כי הם חיוניים לחיים פעילים ולחשיבה הגבוהה","w":["כי הם קובעים את מצב הרוח של האדם","כי הם אחראים על הזיכרון לטווח ארוך בלבד","כי הם הדבר הראשון שנפגע באלצהיימר"],"e":"תפקודים ניהוליים חיוניים ללמידה, לפתרון בעיות ולשליטה עצמית, כלומר לחיים פעילים ולחשיבה הגבוהה. הם לא אחראים רק על הזיכרון לטווח ארוך."}]},
"q3":{"t":"t1","v":[{"q":"איך רעיון הפלסטיות מצדיק התערבות מוקדמת?","a":"כי המוח עוד יכול להשתנות, וגירוי עוזר לשמר תפקוד","w":["כי המוח מפסיק להשתנות לגמרי אחרי גיל 50","כי פלסטיות מוחית קיימת בעיקר אצל חולים","כי פלסטיות מוכיחה שאין שום ירידה עם הגיל"],"e":"מכיוון שהמוח ממשיך להשתנות גם בגיל מבוגר, גירוי ואימון יכולים לשמר תפקוד, ולכן כדאי להתערב מוקדם, לפני מחלה. פלסטיות לא אומרת שאין שום ירידה עם הגיל."},{"q":"מה הכוונה ב״פלסטיות מוחית״?","a":"המוח ממשיך להתפתח ולהתחבר מחדש גם בגיל מבוגר","w":["המוח מתקבע בגיל הצעירות ולא משתנה עוד","המוח מאבד תאים בקצב קבוע לאורך כל החיים","המוח משתנה רק אחרי פגיעה או מחלה"],"e":"פלסטיות מוחית היא היכולת של המוח להמשיך להתפתח וליצור חיבורים חדשים גם בגיל מבוגר. היא לא קורית רק אחרי פגיעה או מחלה."}]},
"q4":{"t":"t1","v":[{"q":"איך השתנתה המטרה של אימון קוגניטיבי ממוחשב לאורך השנים?","a":"משיקום של פגיעה למניעה של ירידה","w":["ממניעה של ירידה לשיקום","מאבחון לטיפול תרופתי","מבידור ללמידה בבית הספר"],"e":"בהתחלה אימון ממוחשב שימש לשיקום אחרי פגיעה מוחית, ובהדרגה עבר למניעה של ירידה אצל אנשים בריאים. המסיח הראשון הופך את הכיוון."},{"q":"למה אימון ממוחשב התפשט משנות ה-2000?","a":"כי אין בו מגבלות של זמן ומקום","w":["כי הוא זול יותר מתרופות","כי הוא הוכח כמרפא אלצהיימר","כי רופאים חייבו אותו"],"e":"אימון ממוחשב לא מוגבל בזמן ובמקום, ואפשר להתאמן בכל מקום. הוא לא הוכח כמרפא אלצהיימר, וזו בדיוק השאלה שעדיין נחקרת."}]},
"q5":{"t":"t1","v":[{"q":"גבר בן 62 מתלונן שהוא שוכח שמות, אבל המבחנים במרפאה תקינים. מה מתאר אותו?","a":"תלונות זיכרון סובייקטיביות","w":["אלצהיימר בשלב מוקדם","פגיעה קוגניטיבית קלה","ירידה בזיכרון פרוצדורלי"],"e":"הוא מדווח על ירידה, אבל המבחנים תקינים, ולכן אלה תלונות זיכרון סובייקטיביות (SMC). בפגיעה קוגניטיבית קלה הייתה גם ירידה במבחנים."},{"q":"מה מבדיל SMC מפגיעה קוגניטיבית?","a":"ב-SMC אין פגיעה במבחן סטנדרטי","w":["ב-SMC הפגיעה חמורה יותר","ב-SMC אין תלונה של האדם עצמו","ב-SMC הפגיעה רק בזיכרון עבודה"],"e":"ב-SMC האדם מתלונן על הזיכרון, אבל במבחן סטנדרטי אין פגיעה. התלונה של האדם היא דווקא לב ההגדרה, ולכן ״אין תלונה״ שגוי."}]},
"q6":{"t":"t1","v":[{"q":"אם אין פגיעה אובייקטיבית, למה חשוב לטפל ב-SMC?","a":"כי SMC מנבא ירידה קוגניטיבית ודמנציה בעתיד","w":["כי SMC תמיד מעיד על אלצהיימר","כי SMC גורם לדיכאון קשה","כי SMC הוא מחלה מוכרת שדורשת תרופות"],"e":"SMC מנבא ירידה קוגניטיבית ודמנציה בעתיד, ולכן התערבות מוקדמת עשויה לדחות את הפגיעה. הוא לא תמיד מעיד על אלצהיימר."},{"q":"כמה נפוצות תלונות זיכרון סובייקטיביות?","a":"בין רבע למחצית מהמבוגרים","w":["פחות מ-5% מהמבוגרים","כמעט כל המבוגרים","רק אצל מבוגרים עם דיכאון"],"e":"בין רבע למחצית מהמבוגרים מדווחים על תלונות זיכרון סובייקטיביות, כלומר זו תופעה נפוצה מאוד. היא לא מוגבלת למבוגרים עם דיכאון."}]},
"q7":{"t":"t2","v":[{"q":"יש כבר הרבה אפליקציות לאימון זיכרון בשוק. למה החוקרים בכל זאת ערכו מחקר?","a":"כי כמעט אין מחקר על היעילות שלהן","w":["כי האפליקציות לא זמינות בקוריאנית","כי האפליקציות יקרות מדי למבוגרים","כי האפליקציות מיועדות לילדים"],"e":"העובדה שיש הרבה אפליקציות בשוק לא מוכיחה שהן עובדות, וכמעט אין מחקר על היעילות שלהן. לכן המחקר נחוץ."},{"q":"מה הכוונה ב-mHealth?","a":"בריאות ניידת","w":["רפואה מבוססת ראיות","בריאות נפשית של מבוגרים","מחקר רפואי במעבדה"],"e":"mHealth (Mobile Health) היא בריאות ניידת: שירותי בריאות דרך טלפונים ומכשירים ניידים. היא לא רפואה מבוססת ראיות."}]},
"q8":{"t":"t2","v":[{"q":"למה הנתון על בעלות על סמארטפונים בקוריאה רלוונטי למחקר?","a":"כי הוא מראה שאימון כזה נגיש לרוב האוכלוסייה","w":["כי הוא מוכיח שסמארטפונים משפרים זיכרון","כי הוא מראה שמבוגרים לא משתמשים בטלפון","כי הוא מסביר למה בחרו אפליקציה מסחרית"],"e":"83% מהאוכלוסייה בקוריאה מחזיקים סמארטפון, והשיעור עולה גם בקרב מבוגרים. לכן אימון כזה נגיש לרוב האוכלוסייה. הנתון לא מוכיח שסמארטפונים משפרים זיכרון."},{"q":"מה היתרון של אימון בסמארטפון על פני התערבות במרפאה?","a":"אפשר להתאמן בבית, בכל זמן","w":["הוא תמיד יעיל יותר","הוא לא דורש מוטיבציה","הוא מחליף בדיקות רפואיות"],"e":"אפשר להתאמן בסמארטפון בבית ובכל זמן, כחלק מהיומיום. זה לא אומר שהוא תמיד יעיל יותר מהתערבות במרפאה."}]},
"q9":{"t":"t2","v":[{"q":"חוקר משווה אימון זיכרון לקבוצה שלא עושה כלום, ומוצא שיפור. מה הבעיה?","a":"השיפור יכול לנבוע מציפייה או מעיסוק כלשהו","w":["אין בעיה, זו השוואה מספקת","קבוצה שלא עושה כלום תמיד משתפרת יותר","זה מוכיח שהאימון לא יעיל"],"e":"מי שמשתתף באימון כלשהו מצפה להשתפר ועוסק במשהו, ושני הדברים לבדם יכולים לשפר תוצאות. לכן השוואה לקבוצה שלא עושה כלום לא מספיקה, וצריך גם ביקורת פעילה."},{"q":"למה ביקורת פעילה עדיפה על רשימת המתנה?","a":"כי היא דומה באימון, בזמן ובממשק","w":["כי היא זולה יותר להפעלה","כי המשתתפים בה לא יודעים שהם נבדקים","כי היא לא דורשת מבחן חוזר"],"e":"ביקורת פעילה עוברת אימון דומה בזמן ובממשק, ולכן היא שולטת בציפייה ובעיסוק. כך אפשר לייחס את ההבדל לתוכן האימון. היא לא נבחרה כי היא זולה."}]},
"q10":{"t":"t2","v":[{"q":"משתתף עשה את אותו מבחן זיכרון פעמיים והשתפר, בלי שום אימון. מה כנראה פעל כאן?","a":"אפקט תרגול","w":["אפקט פלצבו","פלסטיות מוחית","העברה רחוקה"],"e":"בפעם השנייה כבר מכירים את המבחן, ולכן משתפרים גם בלי אימון, וזה אפקט תרגול. פלצבו היה שיפור שנובע מהציפייה לטיפול, ופה לא היה טיפול."},{"q":"למה במחקר יש שתי קבוצות ביקורת?","a":"כדי לשלוט גם בציפייה וגם בתרגול ובזמן","w":["כדי להגדיל את המדגם","כדי לבדוק שתי אפליקציות מסחריות","כדי שכולם יקבלו בסוף את SMART"],"e":"ביקורת פעילה שולטת בציפייה ובעיסוק, ורשימת המתנה שולטת בתרגול של המבחן ובחלוף הזמן. כך אפשר לבודד את ההשפעה של תוכן האימון."}]},
"q11":{"t":"t3","v":[{"q":"איזה מהבאים היה תנאי להשתתפות?","a":"ציון תקין במבחן מצב מנטלי","w":["אבחנה של פגיעה קוגניטיבית","גיל מעל 70","דיכאון שמטופל בתרופות"],"e":"תנאי ההשתתפות היו תלונות זיכרון וציון תקין (24 ומעלה) במבחן מצב מנטלי, כלומר בלי פגיעה קוגניטיבית. אבחנה של פגיעה קוגניטיבית הייתה פוסלת."},{"q":"מי מהבאים לא היה יכול להשתתף?","a":"אדם עם דיכאון קשה לא מטופל","w":["אדם בן 55 עם תלונות זיכרון","אדם עם סמארטפון והשכלה גבוהה","אדם שזיכרונו ירד בעשור האחרון"],"e":"דיכאון קשה לא מטופל היה קריטריון החרגה, כי הוא משפיע על הזיכרון בלי קשר לאימון. גיל 55 ותלונות זיכרון התאימו לקריטריונים."}]},
"q12":{"t":"t3","v":[{"q":"כמה משתתפים נכללו בניתוח הסופי, ומה היה טווח הגילאים?","a":"53, גילאי 50 עד 68","w":["60, גילאי 50 עד 68","53, גילאי 60 עד 80","40, גילאי 40 עד 60"],"e":"60 אנשים גויסו, ו-53 נשארו בניתוח הסופי, בגילאי 50 עד 68. המסיח הראשון מבלבל בין מספר המגויסים למספר שנותח."},{"q":"למה חשוב שלא היו הבדלים בין הקבוצות בגיל, בהשכלה וביכולת?","a":"כדי לייחס את ההבדלים לאימון","w":["כדי שהקבוצות יהיו קטנות","כדי שכולם יקבלו את אותה אפליקציה","כדי שהמבחנים יהיו קלים יותר"],"e":"כשהקבוצות דומות בגיל, בהשכלה וביכולת, אפשר לייחס את ההבדלים שנמצאו לאימון ולא להבדלים קודמים. זה מחזק את המסקנה הסיבתית."}]},
"q13":{"t":"t3","v":[{"q":"למה האימון היה קצר (פחות מ-30 דקות) אבל תכוף?","a":"כי שימוש ארוך בסמארטפון מכביד","w":["כי מבוגרים לא יכולים להתרכז יותר","כי זה מה שהאפליקציה המסחרית קבעה","כי אימון ארוך פוגע בזיכרון"],"e":"שימוש ארוך בסמארטפון מכביד, ולכן האימון היה קצר (15 עד 20 דקות) אבל תכוף: 5 ימים בשבוע במשך 8 שבועות. זה לא בגלל שמבוגרים לא מסוגלים להתרכז יותר."},{"q":"כמה מפגשים היו בסך הכול?","a":"40","w":["8","20","80"],"e":"5 ימים בשבוע במשך 8 שבועות הם 40 מפגשים. 8 הוא מספר השבועות, לא מספר המפגשים."}]},
"q14":{"t":"t3","v":[{"q":"למה קבוצת Fit Brains עשתה כל משימה פעמיים?","a":"כדי להשוות את זמן האימון","w":["כדי שהאימון יהיה קשה יותר","כדי לבדוק את אפקט התרגול","כי האפליקציה דורשת זאת"],"e":"כל משימה ב-Fit Brains קצרה יותר, ולכן עשו כל אחת פעמיים כדי שזמן האימון יהיה שווה לזה של SMART. כך ההשוואה בין הקבוצות הוגנת."},{"q":"למה נבחרה דווקא האפליקציה Fit Brains?","a":"כי יש לה גרסה בקוריאנית ומשימות לפי תחומים","w":["כי היא הוכחה כיעילה במחקרים רבים","כי היא הזולה מבין כל האפליקציות","כי היא פותחה על ידי החוקרים עצמם"],"e":"Fit Brains נבחרה כי יש לה גרסה בקוריאנית ומשימות לפי תחומים קוגניטיביים ורמות קושי. היא לא הוכחה כיעילה במחקרים רבים, וזה מה שנבדק כאן."}]},
"q15":{"t":"t3","v":[{"q":"איזה כלי מדד את ההרגשה הסובייקטיבית לגבי הזיכרון?","a":"MMQ","w":["MDS","סטרופ","CES-D"],"e":"MMQ הוא שאלון שמודד את ההרגשה הסובייקטיבית לגבי הזיכרון: שביעות רצון, בעיות ביומיום ושימוש באסטרטגיות. CES-D מודד דיכאון."},{"q":"מה מודד מבחן סטרופ במחקר?","a":"עכבת תגובה","w":["זיכרון לטווח ארוך","חרדת מצב","שביעות רצון מהזיכרון"],"e":"מבחן סטרופ מודד עכבת תגובה, כלומר היכולת לעצור תגובה אוטומטית, ותפקוד של האונה המצחית. הוא לא מודד זיכרון לטווח ארוך."}]},
"q16":{"t":"t3","v":[{"q":"למה הכניסו IQ ושינוי בדיכאון כמשתני בקרה?","a":"כי בקבוצת SMART הם היו מעט גבוהים יותר","w":["כי הם המשתנים התלויים העיקריים במחקר","כי כל המשתתפים סבלו מדיכאון קשה","כי הם נמדדו רק בסוף תקופת האימון"],"e":"בקבוצת SMART ה-IQ והשינוי בדיכאון היו מעט גבוהים יותר, ולכן הכניסו אותם כמשתני בקרה, כדי שהבדלים קטנים אלה לא יסבירו את התוצאות."},{"q":"מה המערך של המחקר?","a":"3 קבוצות × 2 זמנים","w":["2 קבוצות × 3 זמנים","3 קבוצות × 1 זמן","מחקר מתאמי בלי קבוצות"],"e":"שלוש קבוצות (SMART, Fit Brains ורשימת המתנה) נמדדו בשני זמנים (לפני ואחרי), ולכן המערך הוא 3 × 2."}]},
"q17":{"t":"t4","v":[{"q":"איפה נמצאה אינטראקציה של קבוצה × זמן בביצוע?","a":"רק במדדי זיכרון העבודה","w":["בזיכרון הכללי ובקשב","בכל המדדים הקוגניטיביים","רק במבחן סטרופ"],"e":"אינטראקציה של קבוצה × זמן נמצאה רק במדדי זיכרון העבודה (WMQ וזיכרון עבודה שמיעתי־מילולי). בזיכרון הכללי ובקשב לא נמצאה."},{"q":"מה קרה ל-WMQ בשלוש הקבוצות?","a":"עלייה מובהקת רק ב-SMART","w":["עלייה מובהקת בכל הקבוצות","עלייה מובהקת רק ב-Fit Brains","ירידה בכל הקבוצות"],"e":"ב-WMQ הייתה עלייה מובהקת רק בקבוצת SMART, בכ-8.8 נקודות. אילו כל הקבוצות היו עולות, לא הייתה אינטראקציה."}]},
"q18":{"t":"t4","v":[{"q":"בחלק מהמבחנים הניהוליים כל הקבוצות השתפרו, כולל רשימת ההמתנה. מה המסקנה?","a":"השיפור לא נבע מהאימון","w":["כל סוגי האימון יעילים באותה מידה","רשימת ההמתנה התאמנה בסתר","המבחנים לא היו מהימנים"],"e":"אם גם רשימת ההמתנה, שלא התאמנה, השתפרה, השיפור כנראה נבע מתרגול של המבחן או מחלוף הזמן, ולא מהאימון. זה לא אומר שכל האימונים יעילים באותה מידה."},{"q":"מה נמצא במבחן סטרופ?","a":"אין אינטראקציה","w":["שיפור רק ב-SMART","שיפור רק ב-Fit Brains","ירידה ב-SMART"],"e":"במבחן סטרופ לא נמצאה אינטראקציה, כלומר האימון לא שיפר עכבת תגובה יותר מהביקורת. גם בקשב ובזיכרון הכללי לא נמצאה."}]},
"q19":{"t":"t4","v":[{"q":"באיזו קבוצה עלתה שביעות הרצון מהזיכרון?","a":"רק ב-Fit Brains","w":["רק ב-SMART","בשתי קבוצות האימון","בכל שלוש הקבוצות"],"e":"שביעות הרצון מהזיכרון עלתה רק בקבוצת Fit Brains, אף שהיא לא השתפרה בביצוע. בקבוצת SMART, שהשתפרה בביצוע, היא לא עלתה."},{"q":"מה הפרדוקס המרכזי בתוצאות?","a":"מי שהשתפר לא הרגיש טוב יותר, ולהפך","w":["כל הקבוצות השתפרו והרגישו טוב יותר","אף קבוצה לא השתפרה בשום מדד","רשימת ההמתנה השתפרה יותר מכולן"],"e":"קבוצת SMART השתפרה בביצוע אבל לא הרגישה טוב יותר, וקבוצת Fit Brains הרגישה טוב יותר אבל לא השתפרה. ביצוע והרגשה הלכו בכיוונים שונים."}]},
"q20":{"t":"t4","v":[{"q":"מטפלת רוצה להקטין תלונות זיכרון של מטופל. לפי המחקר, האם מספיק לשפר את הביצוע שלו?","a":"לא בהכרח, כי שיפור בביצוע לא מקטין תמיד את התלונה","w":["כן, שיפור בביצוע תמיד מקטין את התלונות","כן, אבל רק אצל נשים ולא אצל גברים","לא, כי ביצוע ותלונות לא קשורים בשום מצב"],"e":"במחקר, שיפור בביצוע (ב-SMART) לא לווה בהפחתה של התלונות, ולכן לא מספיק לשפר את הביצוע. ״ביצוע ותלונות לא קשורים בשום מצב״ קיצוני מדי."},{"q":"מה נמצא בזיכרון הכללי (MQ)?","a":"אין יתרון לאף אימון","w":["שיפור גדול ב-SMART","שיפור גדול ב-Fit Brains","ירידה בכל הקבוצות"],"e":"בזיכרון הכללי (MQ) לא נמצאה אינטראקציה, כלומר אף אימון לא שיפר אותו יותר מהביקורת. לשיפור בזיכרון כללי כנראה צריך אימון ארוך יותר."}]},
"q21":{"t":"t4","v":[{"q":"דיכאון וחרדה ירדו גם ברשימת ההמתנה. מה המשמעות?","a":"הירידה לא נבעה מהאימון","w":["האימון השפיע גם על רשימת ההמתנה","רשימת ההמתנה קיבלה טיפול אחר","הדיכאון נמדד לא נכון"],"e":"אם הדיכאון והחרדה ירדו גם אצל מי שלא התאמן, האימון לא יכול להיות ההסבר. כנראה פעל משהו משותף לכולם, כמו ההשתתפות במחקר."},{"q":"מה קרה לדיכאון ולחרדה לאורך המחקר?","a":"ירדו בכל הקבוצות","w":["ירדו רק ב-SMART","ירדו רק ב-Fit Brains","עלו בכל הקבוצות"],"e":"דיכאון וחרדה ירדו בכל שלוש הקבוצות, כולל רשימת ההמתנה. לכן הירידה לא קשורה לסוג האימון."}]},
"q22":{"t":"t4","v":[{"q":"5 המשתתפים שנשרו היו עם זיכרון עבודה נמוך יותר בהתחלה. למה זה חשוב?","a":"כי נשירה לא אקראית יכולה להטות את התוצאות","w":["כי זה מוכיח שהאימון קשה מדי למבוגרים","כי זה מסביר את הירידה בדיכאון בכל הקבוצות","כי זה מראה שהם לא התאמנו בכלל בבית"],"e":"כשמי שנושר שונה ממי שנשאר, כאן עם זיכרון עבודה נמוך יותר, הנשירה לא אקראית, ומי שנשאר אולי לא מייצג את כולם. זה עלול להטות את התוצאות."},{"q":"במה היו שונים המשתתפים שנשרו?","a":"זיכרון עבודה נמוך יותר","w":["גיל צעיר יותר מהשאר","השכלה גבוהה יותר מהשאר","דיכאון נמוך יותר מהשאר"],"e":"למשתתפים שנשרו היה זיכרון עבודה נמוך יותר בהתחלה, בערך 91 לעומת 107. הם לא נבדלו בגיל או בהשכלה."}]},
"q23":{"t":"t5","v":[{"q":"למה שיפור בזיכרון עבודה רלוונטי במיוחד לאנשים עם SMC?","a":"כי SMC אצל בריאים קשור כנראה לזיכרון עבודה מצחי","w":["כי SMC נגרם מפגיעה באונה הרקתית","כי זיכרון עבודה לא יורד עם הגיל","כי SMC הוא בעצם אלצהיימר מוקדם"],"e":"לפי המאמר, SMC אצל אנשים בריאים קשור כנראה לירידה בזיכרון העבודה, שתלוי באונה המצחית. לכן שיפור בזיכרון עבודה רלוונטי במיוחד עבורם."},{"q":"במה שונה אלצהיימר מ-SMC אצל בריאים, לפי המאמר?","a":"באלצהיימר הפגיעה ברקה ובקודקוד","w":["באלצהיימר הפגיעה במצח בלבד","באלצהיימר אין פגיעה במבחנים","אין הבדל במיקום הפגיעה"],"e":"באלצהיימר הפגיעה נמצאת ברקה ובקודקוד, וב-SMC אצל בריאים כנראה מדובר בירידה מצחית. לכן ״במצח בלבד״ מתאר את SMC ולא את אלצהיימר."}]},
"q24":{"t":"t5","v":[{"q":"למה רק SMART שיפרה זיכרון עבודה?","a":"היא אימנה יותר זיכרון עבודה, וגם קשב ועכבה","w":["היא הייתה ארוכה יותר מ-Fit Brains","המשתתפים בה היו צעירים יותר מהאחרים","היא נתנה פרסים ונקודות על כל הצלחה"],"e":"ב-SMART היו 3 משימות של זיכרון עבודה, וגם משימות קשב ועכבה, וב-Fit Brains לא היו בכלל. לכן רק היא שיפרה זיכרון עבודה. היא לא הייתה ארוכה יותר, כי הזמן הושווה."},{"q":"מה מצאה המטא־אנליזה שהמאמר מצטט?","a":"רק זיכרון עבודה השתפר גם באימון ביתי קצר","w":["כל התחומים השתפרו באימון ביתי קצר","אימון ביתי לא משפר אף תחום קוגניטיבי","רק הזיכרון הכללי השתפר באימון ביתי"],"e":"המטא־אנליזה מצאה שגם אימון ביתי קצר משפר זיכרון עבודה, אבל לשיפור בזיכרון כללי צריך אימון ארוך ואינטנסיבי. לכן ״כל התחומים השתפרו״ שגוי."}]},
"q25":{"t":"t5","v":[{"q":"אחרי אימון, מבוגרת זוכרת יותר טוב איפה שמה את המפתחות. איזו העברה זו?","a":"העברה רחוקה","w":["העברה קרובה","אפקט תרגול","אפקט פלצבו"],"e":"שיפור בתפקוד יומיומי, מחוץ למשימות האימון, הוא העברה רחוקה. העברה קרובה הייתה שיפור במשימה דומה לזו שהתאמנו עליה."},{"q":"איזו העברה צפויה להיות גדולה יותר, לפי המאמר?","a":"העברה קרובה","w":["העברה רחוקה","שתיהן באותה מידה","אף אחת, כי אין העברה"],"e":"העברה קרובה, לתחום דומה לאימון, צפויה להיות גדולה יותר. העברה רחוקה לחיי היומיום קטנה יותר, בעיקר אצל מבוגרים."}]},
"q26":{"t":"t5","v":[{"q":"למה Fit Brains שיפרה את ההרגשה בלי לשפר את הביצוע?","a":"עלייה ברמות לפי ציון יעד חיזקה תחושת הישג","w":["היא אימנה יותר זיכרון עבודה מ-SMART","היא כללה טיפול ממוקד בדיכאון","המשתתפים בה היו צעירים ומשכילים יותר"],"e":"ב-Fit Brains עלו ברמות לפי ציון יעד, וזה חיזק תחושת הישג ומסוגלות עצמית, גם בלי שיפור אמיתי בביצוע. היא דווקא אימנה פחות זיכרון עבודה מ-SMART."},{"q":"למה השימוש באסטרטגיות זיכרון לא עלה?","a":"כי האימונים לא לימדו אסטרטגיות","w":["כי המשתתפים כבר השתמשו בהן","כי האסטרטגיות לא עובדות אצל מבוגרים","כי השאלון לא מדד אותן"],"e":"האימונים כללו משימות, אבל לא לימדו אסטרטגיות זיכרון, ולכן השימוש בהן לא עלה. השאלון כן מדד אותן."}]},
"q27":{"t":"t5","v":[{"q":"למה קשה להכליל מהמחקר לכל המבוגרים עם SMC?","a":"כי המדגם היה משכיל עם IQ גבוה","w":["כי כל המשתתפים היו נשים","כי המחקר נערך במעבדה","כי לא הייתה קבוצת ביקורת"],"e":"המשתתפים היו משכילים, עם IQ ממוצע של 114, ולכן קשה להכליל לכל המבוגרים עם SMC. הייתה קבוצת ביקורת, ואפילו שתיים."},{"q":"למה בעיה שהמשתתפים ידעו לאיזו קבוצה שויכו?","a":"כי ציפיות יכולות להשפיע על התוצאות","w":["כי זה מאריך את משך המחקר","כי זה מקטין את המדגם בכל קבוצה","כי זה מונע את אפקט התרגול"],"e":"כשהמשתתפים יודעים באיזו קבוצה הם, הציפיות שלהם יכולות להשפיע על התוצאות, בעיקר במדדים הסובייקטיביים כמו שביעות רצון. זה לא קשור למשך המחקר."}]},
"q28":{"t":"t5","v":[{"q":"מה המסקנה של המאמר?","a":"אימון עשוי לשפר זיכרון עבודה, לא בהכרח את התלונות","w":["אימון בסמארטפון מונע אלצהיימר לגמרי","אימון משפר את כל סוגי הזיכרון באותה מידה","אימון בסמארטפון לא משפר שום מדד קוגניטיבי"],"e":"המסקנה היא ש-8 שבועות של אימון עשויים לשפר זיכרון עבודה, אבל לא בהכרח מקטינים את התלונות על הזיכרון. המחקר לא טוען שאימון מונע אלצהיימר."},{"q":"מה החידוש של המחקר?","a":"ראשון עם קבוצות ביקורת לאימון כזה אצל בריאים עם SMC","w":["ראשון שבדק אימון קוגניטיבי ממוחשב בכלל","ראשון שבדק חולי אלצהיימר בבית","ראשון שבדק אפליקציה מסחרית מוכרת"],"e":"החידוש הוא שזה המחקר הראשון על אימון כזה אצל בריאים עם SMC שכלל שתי קבוצות ביקורת: פעילה ורשימת המתנה. אימון קוגניטיבי ממוחשב כבר נחקר קודם."}]},

const SUM=`<h2>סיכום: אימון זיכרון בסמארטפון למבוגרים עם תלונות זיכרון (או ועמיתים, 2018)</h2>
<div class="key"><b>על מה מדובר?</b> הרבה אנשים בשנות ה־50 וה־60 מרגישים שהזיכרון שלהם ״כבר לא מה שהיה״, גם כשהמבחנים שלהם תקינים. המחקר בדק אם <b>אפליקציית אימון</b> בסמארטפון (SMART) יכולה לעזור להם. כדי לדעת שזה האימון ולא סתם ״אני מאמין שזה עוזר״, השוו אותה גם לאפליקציה מסחרית (Fit Brains) וגם לקבוצה שרק חיכתה. הממצאים: SMART שיפרה רק <b>זיכרון עבודה</b>, ולא זיכרון כללי או קשב. ומפתיע: מי שהשתפר בפועל (SMART) <b>לא הרגיש</b> שהזיכרון שלו השתפר, ומי שהרגיש (Fit Brains) לא השתפר. כלומר, <b>שיפור אמיתי והרגשה של שיפור הם שני דברים שונים</b>.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>תלונות זיכרון סובייקטיביות (SMC)</b></td><td>מרגישים ירידה בזיכרון, אבל המבחנים תקינים.</td></tr>
<tr><td><b>זיכרון עבודה</b></td><td>להחזיק מידע בראש ולעבד אותו באותו רגע.</td></tr>
<tr><td><b>אפקט תרגול</b></td><td>מצליחים יותר בפעם השנייה, כי כבר מכירים את המבחן.</td></tr>
<tr><td><b>ביקורת פעילה</b></td><td>קבוצה שעושה פעילות דומה, כדי לשלוט בציפייה לשיפור.</td></tr>
<tr><td><b>רשימת המתנה</b></td><td>קבוצה שלא עושה כלום, אבל נבחנת באותם מבחנים.</td></tr>
<tr><td><b>העברה קרובה / רחוקה</b></td><td>שיפור במשימות דומות לאימון / שיפור ביומיום.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: רחל, בת 59</h3>
<p>רחל שוכחת איפה שמה את המפתחות ומתקשה לזכור שמות. היא מודאגת, אבל אצל הרופא כל המבחנים תקינים. היא מצטרפת למחקר ומוגרלת לקבוצת SMART. השכנה שלה, אסתר, מוגרלת לקבוצת Fit Brains, ובעלה של רחל לרשימת ההמתנה.</p>

<h3>1. הרקע</h3>
<ul>
<li>סימני ירידה בזיכרון מופיעים כבר בשנות ה־50, וקשורים לירידה ב<b>תפקודים ניהוליים</b> (תכנון, שליטה בקשב) ולהתכווצות של האונה המצחית.</li>
<li>אבל המוח ממשיך להיות <b>גמיש</b> גם בגיל מבוגר, ולכן כדאי להתערב <b>לפני</b> שמופיעה מחלה.</li>
<li><b>תלונות זיכרון סובייקטיביות (SMC):</b> בדיוק המצב של רחל. האדם מרגיש ירידה, אבל המבחנים תקינים. זה נפוץ (25–50% מהמבוגרים), וחשוב: זה <b>מנבא</b> ירידה ודמנציה בהמשך. לכן שווה לטפל בזה מוקדם.</li>
<li>סמארטפון זמין ונוח, אבל כמעט לא נחקר אימון מובנה בו.</li>
</ul>

<h3>2. הבעיה בשיטה, ואיך פתרו אותה</h3>
<p>כשבודקים אימון זיכרון, יש שני ״אויבים״ שעלולים ליצור שיפור מדומה:</p>
<ul>
<li><b>ציפייה (פלצבו):</b> מי שמאמין שהאימון עוזר, מתאמץ יותר במבחן.</li>
<li><b>אפקט תרגול:</b> בפעם השנייה שעושים מבחן, מכירים אותו ומצליחים יותר. אצל מבוגרים זה חזק במיוחד.</li>
</ul>
<p><b>הפתרון: שתי קבוצות ביקורת.</b> <b>ביקורת פעילה</b> (אסתר, Fit Brains): גם היא מתאמנת באפליקציה אותו זמן, ולכן גם היא ״מצפה״ לשיפור. <b>רשימת המתנה</b> (בעלה של רחל): לא עושה כלום, אבל עושה את אותם מבחנים פעמיים, ולכן מראה כמה שיפור בא רק מתרגול. אם רחל משתפרת יותר משתיהן, זה האימון עצמו.</p>

<h3>3. המחקר</h3>
<ul>
<li><b>משתתפים:</b> 53 בני 50–68 (ממוצע 59), עם תלונות זיכרון אבל בלי דמנציה או דיכאון קשה.</li>
<li><b>SMART:</b> 10 משימות של קשב, זיכרון וזיכרון עבודה, בשלוש רמות קושי, 40 מפגשים ב־8 שבועות.</li>
<li><b>מה מדדו:</b> זיכרון (כללי, עבודה), קשב, עכבה (מבחן סטרופ), דיכאון וחרדה, ושאלון על איך האדם <b>מרגיש</b> לגבי הזיכרון שלו.</li>
</ul>

<h3>4. מה נמצא</h3>
<div class="tw"><table><tr><th>מה נמדד</th><th>מה קרה</th><th>מה זה אומר</th></tr>
<tr><td>זיכרון עבודה (להחזיק ולעבד מידע בראש)</td><td>עלה <b>רק אצל רחל (SMART)</b>, בכ־9 נקודות</td><td>זה השיפור היחיד שנובע מהאימון</td></tr>
<tr><td>זיכרון כללי, קשב, סטרופ</td><td>אין הבדל בין הקבוצות</td><td>האימון לא עזר כאן</td></tr>
<tr><td>חלק מהמבחנים הניהוליים</td><td>השתפרו <b>בכל הקבוצות</b>, גם אצל בעלה</td><td>תרגול, לא אימון</td></tr>
<tr><td>שביעות רצון מהזיכרון</td><td>עלתה <b>רק אצל אסתר (Fit Brains)</b></td><td>הרגשה של שיפור בלי שיפור בפועל</td></tr>
<tr><td>דיכאון וחרדה</td><td>ירדו <b>בכל הקבוצות</b>, גם ברשימת ההמתנה</td><td>לא בגלל האימון</td></tr></table></div>
<p>ועוד פרט: חמשת האנשים שעזבו באמצע היו עם זיכרון עבודה נמוך יותר מלכתחילה.</p>

<h3>5. איך מסבירים</h3>
<ul>
<li><b>למה דווקא זיכרון עבודה?</b> אצל אנשים בריאים, תלונות זיכרון משקפות ירידה באונה ה<b>מצחית</b> (שאחראית על זיכרון עבודה), ולא באזורים שנפגעים באלצהיימר. SMART אימנה בדיוק את זה. וגם מטא־אנליזה מצאה שאימון קצר בבית משפר בעיקר זיכרון עבודה.</li>
<li><b>העברה קרובה ורחוקה:</b> אימון משפר בעיקר משימות <b>דומות</b> לו (״העברה קרובה״), ומעט מאוד את היומיום (״העברה רחוקה״). רחל השתפרה במבחן, אבל לא בהכרח במציאת המפתחות.</li>
<li><b>למה אסתר הרגישה טוב יותר?</b> ב־Fit Brains עולים רמה רק אחרי שמגיעים לציון יעד, וזה יוצר תחושת הצלחה ו<b>מסוגלות עצמית</b> (״אני מסוגלת״). ב־SMART עולים רמה בלי קשר לביצוע, ולכן אין את התחושה הזו.</li>
<li>הביטחון בשימוש באסטרטגיות זיכרון לא עלה אצל אף אחד, כי לא לימדו אסטרטגיות.</li>
</ul>

<h3>6. מגבלות</h3>
<p>המשתתפים היו משכילים (IQ גבוה מהממוצע), המדגם קטן, לא היה פיקוח על האימון בבית, המשתתפים ידעו לאיזו קבוצה שייכים (ולכן היו להם ציפיות), ולא היה מעקב אחרי שהאימון נגמר.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. מבוגרים עם <b>תלונות זיכרון</b> (בלי פגיעה במבחנים) נמצאים בסיכון לירידה בהמשך, ולכן כדאי להתערב מוקדם.<br>
2. בדקו אימון בסמארטפון (<b>SMART</b>) מול <b>ביקורת פעילה</b> (Fit Brains, שולטת בציפייה) ו<b>רשימת המתנה</b> (שולטת בתרגול).<br>
3. SMART שיפרה רק <b>זיכרון עבודה</b>, ולא זיכרון כללי, קשב או סטרופ.<br>
4. <b>שיפור אמיתי והרגשה של שיפור נפרדו</b>: שביעות הרצון עלתה דווקא ב־Fit Brains, אולי בגלל תחושת מסוגלות.<br>
5. השיפור הוא בעיקר <b>העברה קרובה</b>; והמגבלות: מדגם קטן ומשכיל, בלי פיקוח, בלי מעקב, והמשתתפים ידעו את הקבוצה שלהם.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להסביר מה כל קבוצת ביקורת שוללת.<br>
• לומר מה השתפר ומה לא, ומה השתפר בכל הקבוצות (ולמה זה לא האימון).<br>
• להסביר למה דווקא זיכרון עבודה, דרך האונה המצחית.<br>
• להסביר את הפער בין שביעות רצון לשיפור בפועל.<br>
• להבחין בין העברה קרובה לרחוקה, ולמנות מגבלות.</div>
<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>SMART לא שיפרה את הזיכרון הכללי</b>, רק זיכרון עבודה.</li>
<li><b>שביעות הרצון עלתה דווקא בקבוצה שלא השתפרה</b> (Fit Brains).</li>
<li><b>דיכאון וחרדה ירדו גם ברשימת ההמתנה</b>, ולכן זה לא האימון.</li>
<li><b>תלונות זיכרון = בלי פגיעה במבחנים</b>, אבל עדיין גורם סיכון.</li>

const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){

let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

/* Flashcards: front = the term and a prompt, back = the answer and an example.
   "יודע" removes the card from this round, "עוד לא" sends it to the end of the deck. */
function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");
    const card=app.querySelector("#fc"),acts=app.querySelector(".fc-actions");
    const flip=()=>{flipped=!flipped;card.classList.toggle("flipped",flipped);card.setAttribute("aria-pressed",flipped);
      if(flipped&&!acts.querySelector(".fc-btns")){acts.innerHTML=`<div class="fc-btns"><button class="fc-no" id="no">${ic("cycle")}<span>עוד לא</span></button><button class="primary fc-yes" id="yes">${ic("check")}<span>ידעתי</span></button></div>`;
        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};
        acts.querySelector("#no").onclick=()=>{missed.add(k);S.cards[k]=0;save();deck.push(deck.shift());step("fwd")};}};
    card.onclick=flip;
    document.onkeydown=e=>{if(!document.body.contains(card))return document.onkeydown=null;if(e.key===" "||e.key==="Enter"){if(document.activeElement===card||document.activeElement===document.body){e.preventDefault();flip()}}};
  };
  step("up");
}
/* Mind map: one level at a time. The current node sits in the middle, its children around it.
   A branch opens into its own ring; a leaf opens its explanation under the map. */
function mapList(){

function mindmap(mi,onBack){
  const M=MAPSET[mi],seen=new Set();
  const tint=(n,c)=>{n._c=c;(n.c||[]).forEach(x=>tint(x,c))};
  M.root._c="var(--accent)";M.root.c.forEach((b,k)=>tint(b,`var(--t${k%8+1})`));
  const leaves=n=>n.c?n.c.flatMap(leaves):[n],total=leaves(M.root).length;
  let path=[M.root],sel=null;
  document.body.style.setProperty("--c","var(--accent)");
  show(`<div class="stack mm-view"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>${onBack?"חזרה לנושא":"כל הנושאים"}</span></button><span class="prog" id="mmc">0 מתוך ${total} מושגים</span></div></div>
   <div class="mm-head"><span class="eyebrow">מפת חשיבה</span><h2>${M.title}</h2><p class="muted">לחצו על ענף כדי לפתוח אותו, ועל מושג כדי לקרוא עליו. לחיצה על המרכז חוזרת רמה אחת אחורה.</p></div>
   <nav class="mm-crumbs" id="mmb" aria-label="מיקום במפה"></nav>

   <div class="mm-detail" id="mmd" aria-live="polite"></div></div>`,"up");
  app.querySelector("#back").onclick=onBack||(()=>home("back"));
  const box=app.querySelector("#mm"),svg=box.querySelector("svg"),det=app.querySelector("#mmd"),crumbs=app.querySelector("#mmb");
  const enLine=n=>n.en?`<span class="mm-en" dir="ltr" lang="en">${n.en}</span>`:"";
  const detail=(n,isBranch)=>{
    const sib=path[path.length-1].c||[],k=sib.indexOf(n),next=!isBranch?sib.slice(k+1).find(x=>!x.c):null;
    det.style.setProperty("--c",n._c);
    det.innerHTML=`<div class="mmd-in"><div class="mmd-h"><span class="mmd-dot"></span><div><h3>${n.n}</h3>${enLine(n)}</div></div><div class="mmd-body">${n.d}</div>${n.ex?`<div class="mmd-ex"><b>דוגמה:</b> ${n.ex}</div>`:""}
     ${isBranch?`<p class="mmd-note">${n.c.some(x=>x.c)?`${n.c.length} ענפים. לחצו על ענף כדי לפתוח אותו.`:`${n.c.length} מושגים בענף הזה. לחצו על מושג כדי לקרוא עליו.`}</p>`:next?`<button class="mmd-next">${ic("arrowL")}<span>המושג הבא: ${next.n}</span></button>`:""}</div>`;
    det.classList.remove("show");void det.offsetWidth;det.classList.add("show");
    const nb=det.querySelector(".mmd-next");if(nb)nb.onclick=()=>pick(next);
  };
  const pick=n=>{if(n.c){path.push(n);sel=null;render();detail(n,true);return}
    sel=n;seen.add(n);app.querySelector("#mmc").textContent=`${seen.size} מתוך ${total} מושגים`;
    box.querySelectorAll(".mm-node.kid").forEach(b=>{const on=b._n===n;b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);if(seen.has(b._n))b.classList.add("seen")});
    detail(n,false);if(det.getBoundingClientRect().top>innerHeight-120)det.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"})};
  const render=()=>{
    const cur=path[path.length-1],kids=cur.c||[],n=kids.length;

    crumbs.querySelectorAll("button").forEach(b=>b.onclick=()=>{path=path.slice(0,+b.dataset.k+1);sel=null;render();det.innerHTML=""});
    box.querySelectorAll(".mm-node").forEach(e=>e.remove());
    const wide=box.clientWidth>620,rx=wide?36:34,ry=wide?37:39;
    const pos=kids.map((_,k)=>{const a=(-90+360*k/n)*Math.PI/180;return[50+rx*Math.cos(a),50+ry*Math.sin(a)]});
    svg.innerHTML=pos.map(([x,y],k)=>{const mx=(50+x)/2+(y-50)*.12,my=(50+y)/2-(x-50)*.12;return `<path d="M50 50Q${mx.toFixed(2)} ${my.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)}" pathLength="1" style="--c:${kids[k]._c};--i:${k}"/>`}).join("");
    const ctr=document.createElement("button");ctr.className="mm-node center";ctr.style.setProperty("--c",cur._c);
    ctr.innerHTML=`<span class="mm-n">${cur.n}</span>${enLine(cur)}${path.length>1?`<span class="mm-up">${ic("arrowR")} חזרה</span>`:""}`;
    ctr.setAttribute("aria-label",path.length>1?`${cur.n}, חזרה רמה אחת`:cur.n);
    ctr.onclick=()=>{if(path.length>1){path.pop();sel=null;render();det.innerHTML=""}else detail(cur,true)};
    box.appendChild(ctr);
    kids.forEach((k2,k)=>{const b=document.createElement("button");b._n=k2;
      b.className="mm-node kid "+(k2.c?"branch":"leaf")+(seen.has(k2)?" seen":"");b.style.cssText=`--c:${k2._c};--x:${pos[k][0]}%;--y:${pos[k][1]}%;--i:${k}`;
      b.innerHTML=`<span class="mm-n">${k2.n}</span>${k2.c?`<span class="mm-cnt">${k2.c.length} מושגים</span>`:enLine(k2)}`;
      if(!k2.c)b.setAttribute("aria-pressed","false");
      b.onclick=()=>pick(k2);box.appendChild(b)});
    box.classList.remove("mm-go");void box.offsetWidth;box.classList.add("mm-go");
  };
  render();detail(M.root,true);
}
function cardsDone(total,known,missed){
  document.onkeydown=null;
  const miss=[...missed],n=total-miss.length,pct=Math.round(100*n/total);
  show(`<div class="stack results"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>כל הנושאים</span></button></div></div>
   <article class="card score">
    <span class="eyebrow">סיום כרטיסיות</span>
    <div class="score-row">${ring(pct,`<b data-count="${pct}" data-suffix="%">${REDUCED?pct+"%":"0%"}</b>`)}<div><div class="big"><span data-count="${n}">${REDUCED?n:0}</span><small>/${total} ידעת בסיבוב הראשון</small></div>
    <p>${miss.length?"כרטיסים שסימנת ״עוד לא״ חזרו לסוף החפיסה עד שידעת אותם. אפשר לעבור עליהם שוב בנפרד.":"מצוין, ידעת את כל הכרטיסים."}</p></div></div>
    <div class="row">${miss.length?`<button class="primary" id="again-miss">${ic("cycle")}<span>שוב רק את ${miss.length} שהתקשיתי בהם</span></button>`:""}<button id="again-all">${ic("cards")}<span>כל הכרטיסים מחדש</span></button><button id="hm">לכל הנושאים</button></div>
   </article></div>`,"up");
  app.querySelector("#back").onclick=()=>home("back");app.querySelector("#hm").onclick=()=>home("back");
  app.querySelector("#again-all").onclick=()=>flashcards();

  countUp(app);
}

/* Every module gets flashcards and a mind map. A hand-written CARDS or MAPS file wins;
   otherwise both are built from the module's own definitions (tiles, long concept cards, def boxes). */
const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim()};
function deriveTerms(){
  return T.flatMap((t,ti)=>t.blocks.map((blk,bi)=>{const d=document.createElement("div");d.innerHTML=blk.html;
    const items=[...d.children].filter(isTerm).flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem).filter(x=>strip(x.name));
    return{t,ti,bi,h:blk.h,items}}).filter(b=>b.items.length));
}
function autoCards(blocks){
  const byTopic=T.map(t=>blocks.filter(b=>b.t===t).flatMap(b=>b.items.map(it=>({it,t})))
    .sort((a,b)=>strip(b.it.body).length-strip(a.it.body).length));
  const out=[],used=new Set();
  for(let r=0;out.length<12&&byTopic.some(x=>x.length>r);r++)for(const list of byTopic){if(out.length>=12)break;const x=list[r];if(!x)continue;const key=strip(x.it.name);if(used.has(key))continue;used.add(key);
    const hasEx=/cpt-ex/.test(x.it.body);out.push({t:x.t.id,f:x.it.name,q:hasEx?"מה זה? נסו גם לחשוב על דוגמה":"מה ההגדרה?",b:x.it.body,ex:""})}
  return out;
}
function autoMap(blocks){
  const chunk=(name,items)=>{const leaves=items.map(it=>({n:it.name,en:it.en,d:it.body}));if(leaves.length<=8)return[{n:name,c:leaves}];
    const parts=Math.ceil(leaves.length/7);return Array.from({length:parts},(_,k)=>({n:`${name} (${k+1}/${parts})`,c:leaves.slice(k*7,k*7+7)}))};
  const kids=T.map(t=>{const bs=blocks.filter(b=>b.t===t);if(!bs.length)return null;
    const sub=bs.flatMap(b=>chunk(b.h,b.items));
    const c=sub.length===1?sub[0].c:sub.map(s=>({n:s.n,d:`${s.c.length} מושגים מהקטע ״${s.n}״.`,c:s.c}));
    return{n:t.title,d:`נושא ${T.indexOf(t)+1} בלומדה. ${c.length} ${sub.length===1?"מושגים":"קטעים"} בענף.`,c}}).filter(Boolean);
  if(kids.length<2)return null;
  return{id:"module",title:"מפת הלומדה",sub:"כל הנושאים והמושגים במבט אחד",root:{n:CONFIG.he||CONFIG.title,d:CONFIG.about||"כל הנושאים של הלומדה. לחצו על נושא כדי לפתוח את המושגים שלו.",c:kids}};
}
const TERM_BLOCKS=deriveTerms();
const DECK=typeof CARDS!=="undefined"&&CARDS.length?CARDS:autoCards(TERM_BLOCKS);
const MAPSET=(typeof MAPS!=="undefined"?MAPS:[]).concat([autoMap(TERM_BLOCKS)].filter(Boolean));
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#cards"&&DECK.length)flashcards();else if(_h==="#map"&&MAPSET.length)mindmap(0);else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb)pb.click()}else home();
</script>
