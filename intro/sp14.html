const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

  {h:"נטע והגדרות של לחץ",html:`${def("על מה הנושא",`יש כמה דרכים להגדיר לחץ. הגישה המקובלת אומרת שהלחץ ״בעיני המתבונן״.<br><b>מה נלמד כאן:</b> שלוש הגדרות · הערכה ראשונית ומשנית · לחץ טוב ומצוקה`)}${ex("הפרק נפתח בלחצים של סטודנטים: מבחנים, עבודות, שכר לימוד, חובות, ולפעמים גם ילדים ועבודה. נלווה את <b>נטע</b>, סטודנטית שנה ראשונה שעובדת במשמרות ערב, בסמסטר הראשון שלה.")}<div class="tw"><table><tr><th>הגדרה</th><th>מה זה לחץ</th><th>הבעיה</th></tr><tr><td><b>לפי הגירוי</b></td><td>אירוע תובעני: עבודה קשה, צפיפות</td><td>מתעלמת מהבדלים בין אנשים</td></tr><tr><td><b>לפי התגובה</b> (סלייה)</td><td>התגובה הגופנית לכל דרישה</td><td>גם חדשות טובות מאיצות דופק</td></tr><tr><td><b>כתהליך</b> (לזרוס ופולקמן)</td><td>האדם <b>מעריך</b> שהאירוע מאיים או גדול ממנו</td><td>הגישה המקובלת</td></tr></table></div>`,q:"q1"},
  {h:"הערכה ראשונית ומשנית",html:`${tiles([["target","הערכה ראשונית","האם האירוע <b>איום</b> (נזק או אובדן אפשרי) או <b>אתגר</b> (רווח או צמיחה)?"],["hand","הערכה משנית","אילו <b>דרכי התמודדות</b> יש לי, וכמה הן יעילות?"]])}<p>לחץ נוצר כשהאדם שופט שה<b>דרישות גדולות מהמשאבים</b> שלו. לכן הלחץ ״בעיני המתבונן״, וגורמי לחץ ${E("Stressors")} הם האירועים שמעוררים אותו.</p>${ex("נטע ושירה מקבלות אותו מבחן אמצע. נטע רואה בו <b>אתגר</b> ויש לה תוכנית לימוד, ולכן היא לחוצה מעט. שירה רואה בו <b>איום</b> ולא יודעת מאיפה להתחיל, ולכן היא לחוצה מאוד. אותו אירוע, הערכה שונה.")}${ex("מהספר: שתי נשים מגלות גוש בשד. רובין לא רואה מה תוכל לעשות ולחוצה מאוד; מריה רואה אפשרויות יעילות ולחוצה פחות.")}`,q:"q3"},
  {h:"לחץ טוב ומצוקה",html:`${fig("yd40")}${tiles([["check","לחץ טוב (eustress)","מניע: עוזר להתכונן למבחן, להתאמן ולעבוד. גברים שנחשפו ללחץ קל זכרו טוב יותר טקסט מדעי"],["x","מצוקה (distress)","מעבר לרמה האופטימלית: שחיקה, עייפות, ירידה בביצוע ופגיעה בבריאות"]])}<p>44% מהמבוגרים בארה״ב דיווחו שהלחץ שלהם עלה בחמש השנים האחרונות. נשים דיווחו על יותר לחץ מגברים בכל הסקרים, וגם מובטלים ובעלי הכנסה נמוכה. <b>פסיכולוגיית הבריאות</b>, שקמה בשנות ה־70, חוקרת איך גורמים פסיכולוגיים משפיעים על הבריאות.</p>`,q:"q5"}
 ]},
 {id:"t2",icon:"brain",title:"הגוף בלחץ",blocks:[
  {h:"קנון וסלייה",html:`${def("על מה הנושא",`מה קורה בגוף בזמן לחץ, ולמה לחץ ממושך מזיק.<br><b>מה נלמד כאן:</b> הילחם או ברח · תסמונת ההסתגלות הכללית · הציר ההורמונלי`)}${def("הילחם או ברח",`<b>וולטר קנון</b> (1932): אדרנלין ונוראדרנלין, דופק מהיר, נשימה מהירה, הזעה, אישונים מורחבים ושרירים מתוחים. תגובה <b>מסתגלת</b> ששומרת על <b>הומאוסטזיס</b> (איזון פנימי).`)}${def("תסמונת ההסתגלות הכללית",`<b>הנס סלייה</b> חשף חולדות ללחצים ממושכים (קור, ניתוח, מאמץ, הלם). <b>בלי קשר לסוג הלחץ</b> נמצאו אותם סימנים: בלוטות האדרנל גדלו, התימוס ובלוטות הלימפה התכווצו, והופיעו כיבים בקיבה.`)}${fig("gas40")}<div class="tw"><table><tr><th>שלב</th><th>מה קורה</th><th>דוגמה מהספר</th></tr><tr><td><b>אזעקה</b></td><td>תגובה מיידית, כמו הילחם או ברח</td><td>מתעוררים לשריפה בבית</td></tr><tr><td><b>התנגדות</b></td><td>הגוף מסתגל ונשאר דרוך בעוצמה נמוכה</td><td>הורה שהילד שלו נעדר 72 שעות</td></tr><tr><td><b>תשישות</b></td><td>המשאבים נגמרים: מחלה, נזק, מוות</td><td>ההורה עדיין מחפש אחרי שלושה חודשים</td></tr></table></div>${rem("ביקורת על סלייה: המודל מבוסס על <b>תגובה</b> ומתעלם מה<b>הערכה</b> של האדם.")}`,q:"q7"},
  {h:"שתי מערכות בגוף",html:`${tiles([["clock","המערכת הסימפתטית","מהירה: אדרנלין מבלוטות האדרנל, עוררות של הילחם או ברח"],["cycle","ציר HPA","איטי והורמונלי: היפותלמוס ← CRF ← יותרת המוח ← ACTH ← בלוטות האדרנל ← <b>קורטיזול</b>, ״הורמון הלחץ״"]])}<div class="tw"><table><tr><th>קורטיזול לזמן קצר</th><th>קורטיזול לאורך זמן</th></tr><tr><td>אנרגיה, חיזוק זמני של החיסון, פחות רגישות לכאב</td><td>מערכת חיסון חלשה; רמות גבוהות שכיחות בדיכאון</td></tr></table></div>${ex("ערב לפני המבחן הלב של נטע דופק (סימפתטי). אחרי שבועות של משמרות ומבחנים, רמות הקורטיזול גבוהות לאורך זמן, והיא נדבקת בכל צינון שעובר בכיתה.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"x",title:"גורמי לחץ",blocks:[
  {h:"טראומה ושינויים בחיים",html:`${def("על מה הנושא",`מה מעורר לחץ: מאירועים קיצוניים ועד מטרדים קטנים.<br><b>מה נלמד כאן:</b> טראומה · סולם SRRS · מטרדים יומיומיים · לחץ בעבודה · שחיקה`)}${tiles([["clock","כרוני","נמשך זמן רב: טיפול בהורה עם דמנציה, אבטלה ממושכת"],["x","אקוטי","קצר אבל עוצמתי: רגל שבורה"]])}<p><b>אירועים טראומטיים</b> (קרב, תקיפה, אסון טבע, תאונה) יכולים להוביל ל־<b>PTSD</b>: זיכרונות חודרניים, דריכות, רגש שלילי, ניתוק והימנעות.</p>${def("סולם SRRS",`<b>הולמס וראהה</b> (1967) בנו סולם של 43 אירועי חיים שדורשים הסתגלות, כל אחד עם ״<b>יחידות שינוי</b>״ (LCU): מוות של בן זוג 100, גירושים 73, מחלה 53, <b>נישואים 50</b>, פיטורים 47, חופשה 13. סוכמים את מה שקרה בשנה האחרונה. ציון גבוה קשור למחלות ולפציעות.`)}${rem("שימו לב: גם אירועים <b>שמחים</b> כמו נישואים נמצאים בסולם, כי גם הם דורשים הסתגלות.")}`,q:"q11"},
  {h:"הביקורת, ומטרדים יומיומיים",html:`<p><b>ביקורת על SRRS:</b> פריטים מעורפלים (״מוות של חבר קרוב״); הנחה שאירועים טובים ורעים מלחיצים באותה מידה, בזמן שהשליליים קשורים יותר לדיכאון; וה<b>בעיה הגדולה</b>: הסולם <b>מתעלם מההערכה</b> של האדם. פיטורים יכולים להיות אסון לאחד והזדמנות לאחר.</p>${def("מטרדים יומיומיים",`${E("Daily hassles")} פקקים, מפתחות שאבדו, ויכוחים. הם מצטברים, ו<b>מנבאים בריאות טוב יותר</b> מאירועי חיים גדולים. סטודנטים עם לחץ מפייסבוק חלו יותר בזיהומים בדרכי הנשימה.`)}${ex("בסמסטר של נטע אין אירוע דרמטי, אבל יש פקק כל בוקר, מדפסת שלא עובדת, ומשמרת שמתארכת. לפי המחקר, דווקא המטרדים האלה מנבאים טוב יותר אם היא תחלה.")}`,q:"q13"},
  {h:"עבודה, שחיקה ויחסים",html:`${def("עומס בעבודה",`${E("Job strain")} <b>דרישות גבוהות</b> + <b>מעט שליטה</b> (קרסק). למשל קופאים, נהגי מונית, טבחים. קשור ליתר לחץ דם, להתקפי לב ולדיכאון. בקרב עובדי מדינה בריטים מתחת לגיל 50, עומס גבוה העלה ב־68% את הסיכוי למחלת לב.`)}${def("שחיקה",`${E("Burnout")} (מסלאק): שלושה רכיבים: <b>תשישות</b>, <b>דה־פרסונליזציה</b> (ציניות וניתוק כלפי מקבלי השירות), ו<b>תחושת הישג נמוכה</b>. שכיחה במקצועות טיפול והוראה. בחצי מהעובדים עם שחיקה קשה היה גם דיכאון.`)}${ex("צ׳רלי־אן, מטפלת בבית אבות, עם ממונה לא תומך, מעט עצמאות, שכר נמוך ודיירים לא מכבדים. היא נעשתה עוינת, נעדרה, ובסוף התפטרה.")}<p><b>יחסים:</b> קונפליקטים במערכת יחסים קרובה הם גורם לחץ משמעותי. מי שדיווחו על הכי הרבה אינטראקציות שליליות עם בן הזוג היו בסיכון גבוה ב־34% לבעיות לב.</p>`,q:"q15"}
 ]},
 {id:"t4",icon:"flask",title:"לחץ ומחלה",blocks:[
  {h:"מערכת החיסון",html:`${def("על מה הנושא",`איך לחץ ממושך הופך למחלה: חיסון, לב, אסתמה וכאבי ראש.<br><b>מה נלמד כאן:</b> הפרעות פסיכו־פיזיולוגיות · פסיכונוירואימונולוגיה · מחקר הצינון · טלומרים`)}<p>מערכת הלחץ בנויה למצבי חירום קצרים. כשהיא פועלת חודשים בגלל דאגות יומיומיות, נוצר ״בלאי״. <b>הפרעות פסיכו־פיזיולוגיות</b> הן מחלות גופניות שלחץ ורגש גורמים להן או מחמירים אותן: יתר לחץ דם, מעי רגיז, אסתמה, כאבי גב וראש, אקנה ואקזמה.</p>${def("פסיכונוירואימונולוגיה",`חוקרת איך גורמים פסיכולוגיים משפיעים על החיסון. <b>אדר וכהן</b> (1975) הצמידו מים בטעם מיוחד לתרופה שמדכאת חיסון, ואחר כך <b>הטעם לבד</b> דיכא את החיסון של החולדות. כלומר אפשר <b>להתנות</b> את מערכת החיסון.`)}${def("מחקר הצינון",`<b>כהן</b> (1998): 276 מתנדבים קיבלו טיפות אף עם נגיף צינון. מי שהיה לו גורם לחץ כרוני של יותר מחודש (בעיקר בעבודה או ביחסים) חלה הרבה יותר: כ־50% לעומת כ־35%.`)}`,q:"q17"},
  {h:"הלב",html:`<p>מחלות לב גורמות לכשליש מהמוות בארה״ב. יתר לחץ דם נקרא ״<b>הרוצח השקט</b>״, כי לרוב אין לו תסמינים.</p><div class="tw"><table><tr><th>ממצא</th><th>מה נמצא</th></tr><tr><td><b>טיפוס A</b> (פרידמן ורוזנמן)</td><td>תחרותי, חסר סבלנות, לחוץ בזמן ועוין. בהתחלה נמצא קשר חזק למחלות לב, אבל מחקרים מאוחרים <b>לא שחזרו</b> את הקשר הכללי</td></tr><tr><td><b>כעס ועוינות</b></td><td>הרכיב שכן מנבא: סטודנטים לרפואה עם הכי הרבה כעס היו בסיכון פי 6 להתקף לב עד גיל 55</td></tr><tr><td><b>דיכאון</b></td><td>תסמיני דיכאון קשורים לסיכון גבוה ב־64% למחלת לב. איגוד הלב האמריקאי ממליץ לבדוק דיכאון בחולי לב</td></tr></table></div>${ex("פרידמן שם לב שהכיסאות בחדר ההמתנה שלו שחוקים בקצוות: החולים ישבו על הקצה, מתוחים. מכאן נולד רעיון ״טיפוס A״.")}`,q:"q19"},
  {h:"טלומרים, אסתמה וכאבי ראש",html:`${def("טלומרים",`קטעי DNA שמגנים על קצות הכרומוזומים. אמהות לילדים עם מחלה כרונית היו עם טלומרים קצרים יותר, כמו של אנשים מבוגרים מהן ב־9 עד 17 שנה.`)}${tiles([["leaf","אסתמה","רגש ולחץ יכולים לעורר התקף. צעיר קיבל התקפים כשנכנס לפרופיל של האקסית בפייסבוק, והם פסקו כשעזב את פייסבוק"],["brain","כאב ראש מתח","הסוג הנפוץ ביותר (כ־42%). לחץ מגביר רגישות לכאב"]])}${rem("השרשרת: לחץ ממושך ← קורטיזול ועוררות לאורך זמן ← חיסון חלש, לחץ דם גבוה ובלאי ← מחלה.")}`,q:"q21"}
 ]},
 {id:"t5",icon:"hand",title:"ויסות לחץ",blocks:[
  {h:"דרכי התמודדות",html:`${def("על מה הנושא",`איך מתמודדים עם לחץ, ולמה שליטה ותמיכה כל כך חשובות.<br><b>מה נלמד כאן:</b> התמודדות ממוקדת בעיה ורגש · שליטה · חוסר אונים נלמד · תמיכה חברתית · טכניקות`)}<div class="tw"><table><tr><th></th><th>ממוקדת בעיה</th><th>ממוקדת רגש</th></tr><tr><td>מה עושים</td><td>משנים את <b>גורם הלחץ</b></td><td>מפחיתים את <b>הרגש</b> השלילי</td></tr><tr><td>דוגמה</td><td>ברדפורד נכשל בסטטיסטיקה, נפגש עם המרצה וקובע זמן לימוד</td><td>ברדפורד צופה בקומדיה או משחק במחשב</td></tr><tr><td>מתי עדיפה</td><td>כשאפשר <b>לשלוט</b> במצב</td><td>כשאי אפשר לשלוט</td></tr></table></div>${ex("נטע בונה לוח זמנים ומבקשת להחליף משמרת לפני המבחן: ממוקדת בעיה. בערב היא הולכת לריצה כדי להירגע: ממוקדת רגש.")}`,q:"q23"},
  {h:"שליטה וחוסר אונים נלמד",html:`<p>לפי <b>בנדורה</b>, העוצמה של הלחץ תלויה במידה רבה ב<b>שליטה הנתפסת</b>. תחושת שליטה קשורה לבריאות טובה יותר ולפחות מחלות לב. עובדים בתפקידים עם מעט שליטה סבלו יותר ממחלות לב.</p>${def("חוסר אונים נלמד",`<b>סליגמן</b>: כלבים שלא יכלו לברוח ממכות חשמל <b>לא ניסו לברוח</b> אחר כך, גם כשיכלו. הוא קשר את זה לדיכאון, ובגרסה המתוקנת הדגיש את ההסבר: מי שמסביר כישלון כ<b>פנימי</b> (״זה אני״), <b>יציב</b> (״תמיד יהיה ככה״) ו<b>כללי</b> (״בכל תחום״) נמצא בסיכון לדיכאון.`)}${ex("אם נטע תיכשל במבחן ותגיד ״אני טיפשה, תמיד אכשל, בכל דבר״, זה סגנון ההסבר שמוביל לדיכאון. ״לא התכוננתי מספיק למבחן הזה״ מגן עליה.")}`,q:"q25"},
  {h:"תמיכה חברתית וטכניקות",html:`${def("תמיכה חברתית",`עצה, עידוד, נחמה ועזרה מעשית. במחקר באלמדה, אנשים <b>מבודדים</b> היו בסיכון גבוה פי 2.3 (גברים) ו־2.8 (נשים) למות בתוך 9 שנים. סקירה של 148 מחקרים: קשרים חזקים = סיכוי גבוה בכ־50% לשרוד, השפעה דומה להפסקת עישון.`)}<p>תמיכה מחזקת את החיסון, מורידה לחץ דם במשימה מלחיצה (כשחבר נמצא בחדר), ומעודדת הרגלים בריאים.</p>${tiles([["sprout","פעילות גופנית","אנשים בכושר מתמודדים ומתאוששים טוב יותר מלחץ"],["moon","תגובת ההרפיה","בנסון: מנטרה חוזרת, מקום שקט, תנוחה נוחה. מפחיתה עוררות סימפתטית"],["chart","ביופידבק","מכשיר מראה פעילות גופנית (דופק, מתח שרירים), וכך לומדים לשלוט בה. משמש לכאבי ראש, לחץ דם, אסתמה ופוביות"]])}`,q:"q27"}
 ]},
 {id:"t6",icon:"sprout",title:"המרדף אחר האושר",blocks:[
  {h:"מהו אושר",html:`${def("על מה הנושא",`מה זה אושר, מה מנבא אותו, ולמה אנחנו טועים בניבוי שלו.<br><b>מה נלמד כאן:</b> רווחה סובייקטיבית · מה מנבא אושר · ניבוי רגשי · הסתגלות · פסיכולוגיה חיובית · זרימה`)}${def("אושר",`מצב <b>מתמשך</b> של שמחה, סיפוק ורגש חיובי, יחד עם תחושה שלחיים יש משמעות. נקרא <b>רווחה סובייקטיבית</b>, שונה ממצב רוח חולף.`)}${tiles([["sprout","החיים הנעימים","הנאה יומיומית"],["target","החיים הטובים","שימוש בחוזקות בעיסוק סוחף"],["people","החיים המשמעותיים","שירות לאחרים ולמטרה גדולה"]])}<p>זה המודל של <b>סליגמן</b>. המאושרים ביותר עוסקים בשלושתם.</p>`,q:"q29"},
  {h:"מה מנבא אושר",html:`<div class="tw"><table><tr><th>גורם</th><th>מה נמצא</th></tr><tr><td><b>יחסים</b></td><td>נשואים מאושרים יותר; לאנשים מאושרים יש יותר חברים. סיפוק בזוגיות ובמשפחה הוא כנראה המנבא החזק ביותר</td></tr><tr><td><b>כסף</b></td><td>הרווחה עלתה עם ההכנסה רק עד כ־75,000 דולר בשנה</td></tr><tr><td><b>גיל</b></td><td>שביעות הרצון נוטה לעלות עם הגיל. אין הבדל בין גברים לנשים</td></tr><tr><td><b>דת</b></td><td>קשורה לאושר בעיקר במדינות עם תנאי חיים קשים</td></tr><tr><td><b>ילדים, יופי</b></td><td>אין קשר: מי שאין לו ילדים מאושר מעט יותר</td></tr></table></div>${def("ניבוי רגשי",`${E("Affective forecasting")} אנחנו גרועים בניבוי <b>כמה חזק וכמה זמן</b> נרגיש משהו. כמעט כל הזוגות הטריים ציפו ששביעות הרצון תישאר או תעלה, והיא ירדה בתוך ארבע שנים.`)}${def("הסתגלות",`אחרי אירוע טוב או רע חוזרים בדרך כלל ל<b>רמת הבסיס</b>: גם זוכי לוטו. אבל לא תמיד: התאלמנות ופיטורים גרמו לירידה מתמשכת.`)}`,q:"q31"},
  {h:"פסיכולוגיה חיובית וזרימה",html:`<p>ב־1998, כנשיא האגודה האמריקאית לפסיכולוגיה, <b>סליגמן</b> קרא לפסיכולוגיה לחקור גם <b>חוזקות ורווחה</b>, ולא רק פתולוגיה. כך קמה <b>הפסיכולוגיה החיובית</b>.</p>${tiles([["check","רגש חיובי","קשור לאריכות ימים. בכל נקודה על סולם של 1–5, הסיכון למחלת לב ירד ב־22%"],["bulb","אופטימיות","ציפייה לתוצאות טובות. קשורה לבריאות, להיענות לטיפול ולפחות סיבוכים אחרי ניתוח"],["copies","שלושה דברים טובים","מי שכתב כל יום שלושה דברים טובים היה מאושר יותר במשך יותר מחצי שנה"]])}${def("זרימה",`${E("Flow")} (צ׳יקסנטמיהאיי): חוויה סוחפת שמתגמלת בפני עצמה. מאבדים את תחושת הזמן ומתרכזים בלי מאמץ. קורית ב<b>פעילות מאתגרת שמתאימה ליכולת</b>. כ־20% מדווחים עליה באופן קבוע.`)}${ex("כשנטע מנגנת בגיטרה שעה ולא שמה לב שהזמן עבר, זו זרימה. וזה גם מה שעוזר לה לווסת את הלחץ של הסמסטר.")}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"לפי לזרוס ופולקמן, מה זה לחץ?","a":"תהליך שבו האדם מעריך שהאירוע מאיים או גדול ממנו","w":["התגובה הגופנית הקבועה לכל דרישה מהגוף, בלי קשר לפירוש","כל אירוע תובעני, כמו עבודה קשה או צפיפות, לכל אדם","רגש שלילי שמופיע רק אחרי אירוע טראומטי"],"e":"הגישה של לזרוס ופולקמן רואה בלחץ תהליך שתלוי בהערכה. סלייה הגדיר לפי תגובה, והגדרות אחרות לפי גירוי."},{"q":"מה החיסרון של הגדרת לחץ לפי הגירוי?","a":"היא מתעלמת מההבדלים בין אנשים","w":["היא לא מתייחסת לאירועים חיצוניים","היא מתמקדת רק בהורמונים","היא מתאימה רק לחיות"],"e":"סטודנט מוכן ולא מוכן חווים את אותו מבחן אחרת. הגדרה לפי הגירוי לא מסבירה את זה."}]},"q2":{"t":"t1","v":[{"q":"למה הגדרת הלחץ לפי התגובה הגופנית לא מספיקה?","a":"גם חדשות טובות מעוררות תגובה גופנית דומה","w":["כי לגוף אין שום תגובה מדידה ללחץ אמיתי","כי התגובה הגופנית זהה אצל כולם","כי סלייה חקר רק אירועים שמחים"],"e":"דופק מואץ יכול להופיע גם אחרי חדשות משמחות, ולכן התגובה לבדה לא מגדירה לחץ."}]},"q3":{"t":"t1","v":[{"q":"מה שואלים בהערכה הראשונית?","a":"האם האירוע הוא איום או אתגר","w":["אילו דרכי התמודדות ומשאבים יש לי","כמה זמן בדיוק יימשך הלחץ","מי מהקרובים יכול לעזור לי"],"e":"הערכה ראשונית: איום או אתגר. הערכה משנית: אילו משאבים ודרכי התמודדות יש לי."},{"q":"נטע ושירה מקבלות אותו מבחן, אבל רק שירה לחוצה מאוד. איך הפרק מסביר את זה?","a":"ההערכה שלהן שונה, ולכן הלחץ שונה","w":["המבחן של שירה קשה יותר מזה של נטע","לשירה יש יותר קורטיזול מלידה","נטע לא מבינה שהמבחן חשוב"],"e":"לפי לזרוס ופולקמן הלחץ ״בעיני המתבונן״: אותו אירוע, הערכה שונה."}]},"q4":{"t":"t1","v":[{"q":"מתי נוצר לחץ לפי גישת התהליך?","a":"כשהדרישות נתפסות כגדולות מהמשאבים","w":["בכל פעם שיש שינוי כלשהו בחיים, טוב או רע","רק כשיש סכנה פיזית ממשית","כשרמת הקורטיזול עולה בבוקר"],"e":"לחץ נוצר כשהאדם שופט שאין לו מספיק משאבים מול הדרישות."}]},"q5":{"t":"t1","v":[{"q":"מהו לחץ טוב (eustress)?","a":"לחץ מתון שמניע ומשפר ביצוע","w":["לחץ שנוצר רק מאירועים שמחים","מצב שבו אין שום לחץ בכלל","לחץ חזק שמוביל לשחיקה"],"e":"סלייה קרא ללחץ מועיל eustress. מעבר לרמה האופטימלית הלחץ הופך למצוקה."},{"q":"מה קורה לביצוע כשהלחץ עובר את הרמה האופטימלית?","a":"הביצוע יורד","w":["הביצוע ממשיך לעלות","הביצוע נשאר קבוע","הלחץ הופך ללחץ טוב"],"e":"הביצוע עולה עם הלחץ עד נקודה מסוימת, ואחר כך יורד. זו מצוקה."}]},"q6":{"t":"t1","v":[{"q":"מה חוקרת פסיכולוגיית הבריאות?","a":"איך גורמים פסיכולוגיים משפיעים על הבריאות","w":["איך מחלות גופניות משנות את האישיות לאורך זמן","רק את ההשפעה של תרופות על המוח","את ההבדלים בין רופאים לפסיכולוגים"],"e":"התחום קם בשנות ה־70 וחוקר אורח חיים, התערבויות וקבוצות בסיכון."}]},"q7":{"t":"t2","v":[{"q":"מה הראו החולדות של סלייה?","a":"אותם סימנים גופניים, בלי קשר לסוג הלחץ","w":["כל סוג לחץ גרם לסימנים אחרים לגמרי","חולדות לא מגיבות ללחץ ממושך","רק קור גרם לכיבים בקיבה"],"e":"בלוטות אדרנל מוגדלות, התכווצות התימוס וכיבים הופיעו בכל סוגי הלחץ. מכאן תסמונת ההסתגלות הכללית."},{"q":"מה הסדר של שלבי תסמונת ההסתגלות הכללית?","a":"אזעקה, התנגדות, תשישות","w":["התנגדות, אזעקה, תשישות","אזעקה, תשישות, התנגדות","תשישות, התנגדות, אזעקה"],"e":"קודם תגובה מיידית, אחר כך הסתגלות בעוצמה נמוכה, ובסוף המשאבים נגמרים."}]},"q8":{"t":"t2","v":[{"q":"הורה מחפש ילד שנעדר כבר שלושה חודשים. באיזה שלב הוא לפי סלייה?","a":"תשישות","w":["אזעקה","התנגדות","הומאוסטזיס"],"e":"אחרי לחץ ממושך כל כך המשאבים מתרוקנים. אחרי 72 שעות הוא היה בשלב ההתנגדות."},{"q":"מה הביקורת העיקרית על המודל של סלייה?","a":"הוא מתעלם מההערכה של האדם","w":["הוא לא מסביר נזק גופני מלחץ","הוא נבדק רק על בני אדם","הוא לא כולל שלב של תגובה מיידית"],"e":"המודל מבוסס על התגובה בלבד. ובכל זאת הוא חשוב, כי הוא מסביר איך לחץ גורם לנזק גופני."}]},"q9":{"t":"t2","v":[{"q":"מה ההבדל בין המערכת הסימפתטית לציר HPA?","a":"הסימפתטית מהירה; ציר HPA איטי והורמונלי","w":["ציר HPA מהיר; הסימפתטית איטית והורמונלית","שתיהן פועלות רק בזמן שינה","הסימפתטית מפרישה קורטיזול ישירות"],"e":"הסימפתטית מגיבה מהר באדרנלין. ציר HPA עובר מההיפותלמוס ליותרת המוח ולאדרנל, ומשחרר קורטיזול."},{"q":"מה ההשפעה של קורטיזול גבוה לאורך זמן?","a":"מערכת חיסון חלשה","w":["חיזוק קבוע של מערכת החיסון","פחות רגישות לכאב לכל החיים","ירידה בלחץ הדם"],"e":"לזמן קצר קורטיזול מחזק את החיסון. לאורך זמן הוא מחליש אותו, ורמות גבוהות שכיחות בדיכאון."}]},"q10":{"t":"t2","v":[{"q":"מה תיאר וולטר קנון?","a":"את תגובת ״הילחם או ברח״","w":["את שלושת שלבי ההסתגלות","את סולם אירועי החיים","את חוסר האונים הנלמד"],"e":"קנון (1932) תיאר את העוררות הגופנית בסכנה, וראה בה תגובה ששומרת על הומאוסטזיס."}]},"q11":{"t":"t3","v":[{"q":"למה נישואים מופיעים בסולם SRRS?","a":"כי גם אירועים שמחים דורשים הסתגלות","w":["כי נישואים תמיד גורמים למצוקה","כי הסולם כולל רק אירועים שליליים","כי נישואים קשורים לגירושים"],"e":"הסולם מודד שינויים שדורשים הסתגלות מחדש, בין שהם טובים ובין שהם רעים."},{"q":"איזה אירוע מקבל את הציון הגבוה ביותר בסולם SRRS?","a":"מוות של בן או בת זוג","w":["גירושים מבן או בת הזוג","נישואים","פיטורים מהעבודה"],"e":"מוות של בן זוג = 100, גירושים 73, נישואים 50, פיטורים 47."}]},"q12":{"t":"t3","v":[{"q":"מה ההבדל בין גורם לחץ כרוני לאקוטי?","a":"כרוני נמשך זמן רב; אקוטי קצר אבל עוצמתי","w":["כרוני תמיד קל יותר מאקוטי, ופחות מזיק","אקוטי נמשך שנים; כרוני רגעי","אין הבדל אמיתי ביניהם"],"e":"טיפול בהורה עם דמנציה הוא כרוני. רגל שבורה היא אקוטית."}]},"q13":{"t":"t3","v":[{"q":"מה הביקורת הגדולה ביותר על סולם SRRS?","a":"הוא מתעלם מההערכה של האדם","w":["יש בו מעט מדי אירועים","הוא לא קשור לשום מחלה","אנשים לא מסכימים על הדירוג בין תרבויות"],"e":"אותו אירוע (פיטורים) יכול להיות אסון לאחד והזדמנות לאחר. דווקא הדירוג עקבי בין תרבויות."},{"q":"מה מנבא בריאות טוב יותר: אירועי חיים גדולים או מטרדים יומיומיים?","a":"מטרדים יומיומיים","w":["אירועי חיים גדולים","שניהם בדיוק באותה מידה","אף אחד מהם"],"e":"מטרדים קטנים שמצטברים מנבאים בעיות בריאות טוב יותר מציוני SRRS."}]},"q14":{"t":"t3","v":[{"q":"מה נמצא על סטודנטים ולחץ מפייסבוק?","a":"הם חלו יותר בזיהומים בדרכי הנשימה","w":["הם היו מאושרים יותר מחבריהם ללימודים","הם לא הושפעו בכלל מהלחץ","הם שכחו יותר חומר בבחינות"],"e":"לחץ הקשור לפייסבוק נקשר ליותר זיהומים, במיוחד אצל מי שהרשת שלו גדולה."}]},"q15":{"t":"t3","v":[{"q":"מהו עומס בעבודה (job strain) לפ און בחולי לב."}]},"q20":{"t":"t4","v":[{"q":"למה יתר לחץ דם נקרא ״הרוצח השקט״?","a":"כי לרוב אין לו תסמינים","w":["כי הוא פוגע רק בזמן שינה","כי הוא לא מסוכן","כי הוא נגרם מרעש"],"e":"אנשים לא מרגישים אותו, ובינתיים הוא מגביר סיכון להתקף לב ושבץ."}]},"q21":{"t":"t4","v":[{"q":"מה נמצא על טלומרים של אמהות לילדים עם מחלה כרונית?","a":"הם היו קצרים יותר, כמו של אנשים מבוגרים מהן","w":["הם היו ארוכים יותר מהממוצע באוכלוסייה","לא נמצא שום הבדל","הם התארכו עם שנות הטיפול"],"e":"הלחץ הכרוני נקשר להזדקנות מואצת ברמת התא: כמו אנשים מבוגרים ב־9 עד 17 שנה."},{"q":"מהו כאב הראש הנפוץ ביותר?","a":"כאב ראש מתח","w":["מיגרנה","כאב ראש מאסתמה","כאב ראש מתרופות"],"e":"כאב ראש מתח מהווה כ־42% מכאבי הראש, ולחץ מגביר רגישות לכאב."}]},"q22":{"t":"t4","v":[{"q":"מה סיפר המקרה של הצעיר עם האסתמה ופייסבוק?","a":"ההתקפים הופיעו כשנכנס לפרופיל של האקסית","w":["השימוש בפייסבוק ריפא את האסתמה שלו לגמרי","ההתקפים נגרמו מאבק במחשב","ההתקפים לא היו קשורים לרגש"],"e":"כשהפסיק להשתמש בפייסבוק ההתקפים נעלמו. רגש יכול לעורר התקף אסתמה."}]},"q23":{"t":"t5","v":[{"q":"נטע מבקשת להחליף משמרת לפני המבחן. איזו התמודדות זו?","a":"ממוקדת בעיה","w":["ממוקדת רגש","הימנעות","הערכה ראשונית"],"e":"היא משנה את גורם הלחץ עצמו."},{"q":"מתי עדיפה התמודדות ממוקדת רגש?","a":"כשאי אפשר לשלוט במצב","w":["כשאפשר לשנות את המצב בקלות","תמיד, בכל מצב","רק כשהלחץ קל"],"e":"כשהגורם לא בשליטה, הפחתת הרגש יעילה יותר. כשאפשר לשלוט, ממוקדת בעיה עדיפה."}]},"q24":{"t":"t5","v":[{"q":"ברדפורד צופה בקומדיה כדי לשכוח שנכשל בסטטיסטיקה. מה זה?","a":"התמודדות ממוקדת רגש","w":["התמודדות ממוקדת בעיה","חוסר אונים נלמד","ביופידבק"],"e":"הוא מפחית את הרגש השלילי בלי לשנות את הבעיה."}]},"q25":{"t":"t5","v":[{"q":"מה גילה סליגמן בכלבים שלא יכלו לברוח ממכות חשמל?","a":"אחר כך לא ניסו לברוח, גם כשיכלו","w":["הם למדו לברוח מהר יותר מאחרים","הם נעשו תוקפניים כלפי החוקרים","הם לא הושפעו מהמכות"],"e":"זה חוסר אונים נלמד. סליגמן קשר אותו לדיכאון."},{"q":"איזה סגנון הסבר לכישלון מסכן לדיכאון?","a":"פנימי, יציב וכללי","w":["חיצוני, זמני וספציפי","פנימי, const SUM=`<h2>סיכום: Spielman פרק 14 - לחץ, אורח חיים ובריאות</h2>
<div class="key"><b>על מה מדובר?</b> לחץ הוא לא רק ״מה שקורה לנו״, אלא איך אנחנו <b>מעריכים</b> את מה שקורה: אותו מבחן יכול להיות אתגר לאחד ואיום לאחר. הגוף מגיב ללחץ דרך שתי מערכות (הסימפתטית המהירה וציר הקורטיזול האיטי), וכשהתגובה נמשכת חודשים היא שוחקת את מערכת החיסון ואת הלב. הפרק עובר על גורמי לחץ (מטראומה ועד מטרדים קטנים), על הקשר בין לחץ למחלה, על דרכי התמודדות (שליטה ותמיכה חברתית הן המפתח), ובסוף על <b>אושר</b>: מה מנבא אותו, ולמה אנחנו טועים בניבוי שלו.</div>

<h3>הדוגמה שתלווה אותנו: נטע בסמסטר הראשון</h3>
<p>הפרק נפתח בלחצים של סטודנטים: מבחנים, עבודות, שכר לימוד, ולפעמים גם עבודה וילדים. נטע, סטודנטית שנה ראשונה שעובדת במשמרות ערב, תעזור לנו לראות כל מושג בפעולה.</p>

<h3>1. מהו לחץ</h3>
<div class="tw"><table><tr><th>הגדרה</th><th>לחץ הוא...</th><th>הבעיה</th></tr>
<tr><td>לפי הגירוי</td><td>אירוע תובעני</td><td>מתעלמת מהבדלים בין אנשים</td></tr>
<tr><td>לפי התגובה (סלייה)</td><td>תגובה גופנית לכל דרישה</td><td>גם חדשות טובות מאיצות דופק</td></tr>
<tr><td><b>כתהליך</b> (לזרוס ופולקמן)</td><td>הערכה שהאירוע מאיים או גדול מאיתנו</td><td>הגישה המקובלת</td></tr></table></div>
<ul>
<li><b>הערכה ראשונית</b>: איום או אתגר? <b>הערכה משנית</b>: אילו דרכי התמודדות יש לי? לחץ = <b>דרישות גדולות מהמשאבים</b>. נטע רואה במבחן אתגר ויש לה תוכנית; חברתה רואה בו איום. אותו מבחן, לחץ שונה.</li>
<li><b>לחץ טוב</b> (eustress) מניע ומשפר ביצוע עד <b>רמה אופטימלית</b>; מעבר לה מתחילה <b>מצוקה</b> (distress): שחיקה וירידה בביצוע.</li>
</ul>

<h3>2. הגוף בלחץ</h3>

<tr><td>תשישות</td><td>המשאבים נגמרים: מחלה ונזק</td><td>עדיין מחפשים אחרי 3 חודשים</td></tr></table></div>

<li><b>שתי מערכות</b>: הסימפתטית (מהירה, אדרנלין) ו<b>ציר HPA</b> (איטי: היפותלמוס ← יותרת המוח ← אדרנל ← <b>קורטיזול</b>). לזמן קצר קורטיזול נותן אנרגיה ומחזק חיסון; לאורך זמן הוא <b>מחליש</b> את החיסון. אחרי שבועות של משמרות ומבחנים, נטע נדבקת בכל צינון.</li>

<h3>3. גורמי לחץ</h3>
<ul>
<li><b>כרוני</b> (נמשך) מול <b>אקוטי</b> (קצר ועוצמתי). <b>טראומה</b> עלולה להוביל ל־PTSD.</li>
<li><b>סולם SRRS</b> (הולמס וראהה): 43 אירועים עם ״יחידות שינוי״: מוות של בן זוג 100, גירושים 73, <b>נישואים 50</b>, פיטורים 47. גם אירועים שמחים, כי הם דורשים הסתגלות. ביקורת: פריטים מעורפלים, ובעיקר <b>מתעלם מההערכה</b>.</li>
<li><b>מטרדים יומיומיים</b> (פקקים, מדפסת תקועה) <b>מנבאים בריאות טוב יותר</b> מאירועים גדולים. אצל נטע אין דרמה, אבל המטרדים מצטברים.</li>
<li><b>עומס בעבודה</b> (קרסק): דרישות גבוהות + <b>מעט שליטה</b>. קשור ללחץ דם ולמחלות לב.</li>
<li><b>שחיקה</b> (מסלאק): <b>תשישות</b>, <b>דה־פרסונליזציה</b>, <b>תחושת הישג נמוכה</b>. צ׳רלי־אן מבית האבות נשחקה והתפטרה.</li>
<li><b>יחסים</b>: קונפליקט עם בן זוג קשור לסיכון גבוה ב־34% לבעיות לב.</li>
</ul>

<h3>4. לחץ ומחלה</h3>
<ul>
<li><b>הפרעות פסיכו־פיזיולוגיות</b>: מחלות גופניות שלחץ גורם להן או מחמיר אותן (יתר לחץ דם, מעי רגיז, אסתמה, אקזמה).</li>
<li><b>פסיכונוירואימונולוגיה</b>: <b>אדר וכהן</b> התנו את מערכת החיסון של חולדות (טעם לבד דיכא חיסון). <b>כהן</b>: לחץ כרוני של יותר מחודש = יותר צינון (כ־50% מול 35%). <b>טלומרים</b> של אמהות לילדים חולים קצרים כמו של אנשים מבוגרים מהן ב־9–17 שנה.</li>
<li><b>לב</b>: ״<b>טיפוס A</b>״ (פרידמן ורוזנמן) לא שוחזר כמכלול, אבל <b>כעס ועוינות</b> כן מנבאים מחלת לב. <b>דיכאון</b> מעלה את הסיכון בכ־64%.</li>
<li><b>אסתמה</b> וכאבי <b>ראש מתח</b> (הנפוצים ביותר, כ־42%) מושפעים מרגש ומלחץ.</li>
</ul>

<h3>5. ויסות לחץ</h3>
<div class="tw"><table><tr><th></th><th>ממוקדת בעיה</th><th>ממוקדת רגש</th></tr>
<tr><td>מה עושים</td><td>משנים את גורם הלחץ</td><td>מפחיתים את הרגש</td></tr>
<tr><td>אצל נטע</td><td>מבקשת להחליף משמרת לפני המבחן</td><td>יוצאת לריצה להירגע</td></tr>
<tr><td>עדיפה כש</td><td>אפשר לשלוט</td><td>אי אפשר לשלוט</td></tr></table></div>
<ul>
<li><b>שליטה נתפסת</b> (בנדורה) מפחיתה לחץ. <b>חוסר אונים נלמד</b> (סליגמן): כלבים שלא יכלו לברוח הפסיקו לנסות. הסבר <b>פנימי, יציב וכללי</b> לכישלון (״אני טיפשה, תמיד, בכל דבר״) מנבא דיכאון.</li>
<li><b>תמיכה חברתית</b>: מבודדים בסיכון גבוה פי 2.3–2.8 למות (אלמדה); קשרים חזקים = סיכוי גבוה בכ־50% לשרוד, כמו הפסקת עישון.</li>
<li><b>טכניקות</b>: פעילות גופנית, <b>תגובת ההרפיה</b> (בנסון: מנטרה ושקט), <b>ביופידבק</b> (רואים את הדופק על מסך ולומדים לשלוט בו).</li>
</ul>

<h3>6. אושר</h3>
<ul>
<li><b>רווחה סובייקטיבית</b> = מצב מתמשך של שמחה וסיפוק עם משמעות. <b>סליגמן</b>: החיים ה<b>נעימים</b>, ה<b>טובים</b> (חוזקות) וה<b>משמעותיים</b> (שירות).</li>
<li><b>מנבאים</b>: זוגיות ומשפחה (החזק ביותר), חברים, גיל. <b>כסף</b> עד סף (כ־75,000 דולר). <b>אין קשר</b>: ילדים, יופי.</li>
<li><b>ניבוי רגשי</b>: אנחנו טועים בכמה ולכמה זמן נרגיש. <b>הסתגלות</b>: גם זוכי לוטו חוזרים לבסיס (אבל לא אחרי התאלמנות או פיטורים).</li>
<li><b>פסיכולוגיה חיובית</b> (סליגמן, 1998): רגש חיובי ואופטימיות קשורים לבריאות. ״שלושה דברים טובים ביום״ העלה אושר לחצי שנה. <b>זרימה</b> (צ׳יקסנטמיהאיי): חוויה סוחפת בפעילות מאתגרת שמתאימה ליכולת. כשנטע מנגנת בגיטרה ושוכחת את הזמן, זו זרימה.</li>
</ul>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>לפי לזרוס ופולקמן, הלחץ תלוי בהערכה</b>, לא באירוע עצמו.</li>
<li><b>הערכה ראשונית = איום או אתגר; משנית = דרכי התמודדות.</b></li>
<li><b>סדר שלבי סלייה: אזעקה, התנגדות, תשישות.</b></li>
<li><b>נישואים נמצאים בסולם SRRS</b>, כי גם שינוי חיובי מלחיץ.</li>
<li><b>מטרדים יומיומיים מנבאים בריאות טוב יותר מאירועים גדולים.</b></li>
<li><b>טיפוס A כמכלול לא שוחזר</b>; כעס ועוינות כן מנבאים.</li>
<li><b>קורטיזול מחזק חיסון לזמן קצר</b> ומחליש לאורך זמן.</li>
<li><b>ממוקדת רגש עדיפה כשאין שליטה</b>, לא תמיד.</li>
<li><b>ילדים לא מגבירים אושר</b>; הכסף עוזר רק עד סף.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");

    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));

  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
