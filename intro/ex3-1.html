<style>

h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}

button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}

button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}

.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

 {id:"t1",icon:"brain",title:"שינה וזיכרון: הרקע",blocks:[
  {h:"השערת איחוד הזיכרון התלוי בשינה",html:`${def("על מה הנושא",`לפני שמגיעים למחקר עצמו, צריך להבין את הרעיון שהוא בודק: שהשינה עוזרת לזיכרון. הנושא מסביר את ההשערה ומה תומך בה.<br><b>מה נלמד כאן:</b> איחוד זיכרון בשינה · הפרעה (Interference)`)}${def("מושג מפתח",`<mark>השערת איחוד הזיכרון התלוי בשינה</mark> ${E("Sleep-dependent memory consolidation hypothesis")}: אנשים <b>זוכרים יותר ושוכחים פחות</b> אחרי פרק זמן של שינה, לעומת פרק זמן שווה של ערות (Stickgold, 2005).`)}<p>ההשערה קיבלה תמיכה בשלושה סוגי זיכרון:</p>${tiles([["doc","זיכרון דקלרטיבי","ידע שאפשר לנסח במילים: עובדות, מילים, אירועים","ידע שאפשר ״להצהיר״ עליו במילים: עובדות, מילים ואירועים. זה סוג הזיכרון שהמחקר בדק.","דנה יכולה לספר מה למדה בשיעור היסטוריה, ולמנות את המילים שהופיעו ברשימה."],["hand","זיכרון פרוצדורלי","מיומנויות ו\"איך עושים\"","זיכרון של מיומנויות, ״איך עושים״ דברים. אנחנו משתמשים בו בלי לחשוב על זה במילים.","דנה רוכבת על אופניים בלי לחשוב איך לשמור על שיווי משקל."],["clock","זיכרון עבודה","החזקה ועיבוד של מידע לזמן קצר","היכולת להחזיק מידע בראש לזמן קצר ולעבוד איתו, למשל לחשב או לסדר.","דנה פותרת תרגיל בחשבון בראש, ומחזיקה את התוצאה של השלב הראשון בזמן שהיא עושה את השני."]])}${rem(`הרעיון המרכזי: בזמן השינה המוח <b>מעבד מחדש</b> זיכרונות "במצב לא מקוון" ${E("Offline reprocessing")}, וזה חלק חשוב מהאופן שבו זיכרונות נוצרים, מתארגנים ונשלפים.`)}${ex(`שני סטודנטים לומדים אותן 30 מילים בשמונה בערב. אחד הולך לישון, והשני נשאר ער כל הלילה. בבוקר, זה שישן זוכר יותר מילים. השינה "שמרה" את מה שנלמד.`)}`,q:"q1"},
  {h:"מה מחזק את ההשערה",html:`${tiles([["brain","הדמיה מוחית (fMRI)","לילה של שינה מגביר פעילות באזורים שקשורים ללמידה הראשונית, והפעילות הזו קשורה לשיפור בביצוע"],["flask","גנטיקה (חולדות)","גנים שקשורים לאיחוד זיכרון ולגמישות מוחית מתבטאים יותר בזמן שינה"],["doc","זיכרון מילולי","השינה מקטינה את ההשפעה השלילית של מידע מפריע, ולכן אחרי שינה זוכרים יותר","אחרי שינה זוכרים יותר, כי בזמן השינה אין מידע חדש ש״דורס״ את מה שלמדנו.","דנה לומדת מילים באנגלית בצהריים, ישנה שעה, ואחר כך זוכרת יותר מאשר אם הייתה נשארת ערה."]])}${def("למה זה חשוב",`<mark>הפרעה</mark> ${E("Interference")}: מידע חדש שנכנס אחרי הלמידה ופוגע בזכירה של מה שלמדנו. השינה \"מגינה\" על הזיכרון מפני ההפרעה הזו.`)}${ex(`<b>הפרעה</b>: למדת מספר טלפון, ומיד אחר כך מישהו אמר לך מספר אחר. עכשיו קשה לך לזכור את הראשון. המידע החדש "דרס" את הישן.`)}`,q:"q3"}

 {id:"t2",icon:"moon",title:"מתבגרים שלא ישנים מספיק",blocks:[
  {h:"מחסור כרוני בשינה",html:`${def("על מה הנושא",`למה לחקור דווקא מתבגרים, ולמה דווקא תנומה? הנושא מסביר את הבעיה שהמחקר מנסה לפתור.<br><b>מה נלמד כאן:</b> מחסור כרוני בשינה · השקע שאחרי הצהריים · הקצב הצירקדי`)}<p>מומלץ שמתבגרים יישנו <mark>8 עד 10 שעות</mark> בלילה. בפועל, בהרבה מדינות מפותחות מחסור בשינה הוא הכלל ולא היוצא מן הכלל:</p>${tiles([["moon","ארה\"ב","7.5 שעות בממוצע"],["moon","הונג קונג","7.3 שעות","דוגמה למדינה שבה ישנים בממוצע פחות מהמומלץ. זה מראה שמחסור בשינה נפוץ במדינות מפותחות.","ממוצע של 7.3 שעות נמוך מ־8 עד 10 השעות שמומלצות לבני נוער."],["moon","יפן","6.3 שעות","אחת המדינות עם ממוצע השינה הנמוך ביותר ברשימה, הרבה פחות מהמומלץ.","בממוצע של 6.3 שעות, חסרות כמעט שתיים עד ארבע שעות שינה בכל לילה."],["moon","קוריאה","5.4 שעות","תלמידי תיכון בקוריאה ישנים בממוצע רק כ־5.4 שעות בלילה. זו אחת הסיבות שבחרו לבדוק תנומה ביום.","דנה, כמו רוב התלמידים שם, ישנה פחות ממה שהגוף צריך, בגלל הלחץ ללימודים."]])}<p><b>מעגל הבעיה:</b> שינה קצרה באמצע השבוע, ו\"השלמה\" בסוף השבוע. ההשכמה המאוחרת מקטינה את החשיפה לאור בבוקר, מאחרת עוד יותר את שעון השינה, ומחמירה נדודי שינה וישנוניות ביום.</p>${ex("מחקר בפנימייה מצא ששבוע של 5 שעות שינה בלילה פגע בזיכרון דקלרטיבי חזותי, והפגיעה נמשכה <b>גם אחרי שני לילות של שינת התאוששות</b>.")}`,q:"q5"},
  {h:"למה דווקא תנומה",html:`<p>קשה להגדיל את שינת הלילה של תלמידים: לחץ לימודי, אינטרנט ורשתות חברתיות. גם חינוך לשינה בבתי ספר נותן שיפור קצר שלא נשמר לאורך זמן.</p>${tiles([["check","השפעה דומה","שינת לילה ותנומה ביום נמצאו בעלות השפעה <b>דומה</b> על איחוד הזיכרון","מחקרים קודמים מצאו שתנומה ביום עוזרת לאיחוד הזיכרון כמעט כמו שינת לילה. לכן היה הגיוני לבדוק תנומה כפתרון.","אם קשה להאריך את שינת הלילה של דנה, תנומה של שעה בצהריים אולי תיתן חלק מאותה תועלת."],["clock","\"שקע אחרי הצהריים\"","תנומה עוזרת מול ירידת הערנות הטבעית אחרי הצהריים, שקשורה לשעון הביולוגי"],["target","שימוש אסטרטגי","לא תחליף לשינת לילה, אלא דרך להקטין את הנזק של מחסור כרוני ולשפר זיכרון"]])}${def("מושג מפתח",`<mark>השקע שאחרי הצהריים</mark> ${E("Post-lunch dip")}: ירידה בערנות שמופיעה אחר הצהריים, כחלק מהקצב הצירקדי ${E("Circadian rhythm")}.`)}${ex(`<b>השקע שאחרי הצהריים</b>: הרגע הזה בשתיים בצהריים, בשיעור, שבו העיניים נעצמות לבד, גם אם ישנת טוב בלילה.`)}`,q:"q7"}

 {id:"t3",icon:"flask",title:"המחקר: איך הוא נבנה",blocks:[
  {h:"מטרה, השערה ומשתתפים",html:`${def("על מה הנושא",`איך בדקו את השאלה? הנושא עובר על המטרה, המשתתפים, מהלך הניסוי ומה נמדד.<br><b>מה נלמד כאן:</b> מטרה והשערה · תנומה מול ערות · מבחני זיכרון · מערך 2×2`)}${def("מטרת המחקר",`לבדוק את השערת איחוד הזיכרון התלוי בשינה בעזרת <b>תנומה</b>, אצל מתבגרים, ו<b>בסביבה הטבעית שלהם</b>. המחקר הראשון שבדק כך <b>זיכרון מילולי</b>.`)}<p><b>ההשערה:</b> מתבגרים שיקבלו הזדמנות לתנומה יהיו פחות ישנוניים ויזכרו טוב יותר, ביחס לבסיס, מעמיתים שנשארו ערים באותו זמן.</p>${tiles([["people","39 תלמידים","גילאי 15 עד 18, כ-70% בנות","המדגם של המחקר: בני נוער בגיל תיכון, רובם בנות. גודל המדגם והרכב המגדר משפיעים על מה שאפשר להסיק.","דנה, תלמידת תיכון בת 16, היא בדיוק הגיל שנבדק."],["building","פנימייה בהונג קונג","בית ספר עם מגורים, בשפה האנגלית"],["x","קריטריוני החרגה","הפרעת שינה, מצב רפואי משמעותי, לקות שפה/קריאה, ליקוי ראייה או שמיעה"]])}${rem("למה זיכרון <b>מילולי</b>? רוב ההוראה בכיתה מועברת במילים, ולכן היכולת לזכור מידע מילולי חשובה מאוד ללמידה \"בחיים האמיתיים\".")}`,q:"q9"},
  {h:"מהלך הניסוי",html:`<p>שבוע לפני הניסוי התלמידים מילאו <b>יומן שינה</b>, והתבקשו להימנע מקפאין 24 שעות לפני. אחר כך <b>הותאמו</b> לפי גיל, מין וישנוניות, וחולקו <mark>באקראי</mark> לשתי קבוצות: תנומה (20) וללא תנומה (19).</p>${fig("timeline")}${rem("בין שני המבחנים ביקשו מכולם <b>לא להתאמן</b> ולא להשתמש באסטרטגיות זיכרון. שעת התנומה נקבעה כך שתתאים לשקע שאחרי הצהריים.")}`,q:"q11"},
  {h:"מה מדדו",html:`<p><b>ישנוניות:</b> ${E("CASQ")} מדד ישנוניות <b>רגילה</b> (16 פריטים, שימש להתאמת הקבוצות). ${E("SSS")} מדד ישנוניות <b>ברגע זה</b>, בסולם 1 עד 7, בבסיס ובמבחן החוזר.</p><p><b>זיכרון:</b> שלוש משימות של זיכרון מילולי דקלרטיבי, כולן הוקראו בקול לכל הקבוצה, כמו בשיעור:</p>${taskTable}${def("המערך",`ניתוח שונות מעורב 2×2 ${E("Mixed ANOVA")}: <b>זמן</b> (בסיס מול חוזר) הוא משתנה <b>תוך-נבדקי</b>, ו<b>קבוצה</b> (תנומה מול ערות) הוא משתנה <b>בין-נבדקי</b>.`)}${ex(`<b>מערך 2×2</b>: כל תלמיד נבדק פעמיים (לפני ואחרי), וכל תלמיד שייך לקבוצה אחת בלבד (תנומה או ערות). כך אפשר לראות אם השינוי שונה בין הקבוצות.`)}`,q:"q13"}
 ]},
 {id:"t4",icon:"chart",title:"התוצאות",blocks:[
  {h:"המדגם הסופי והישנוניות",html:`${def("על מה הנושא",`מה מצאו? הנושא מציג את התוצאות לפי הסדר: ישנוניות, זיכרון, ולמידה חדשה.<br><b>מה נלמד כאן:</b> ישנוניות · אינטראקציה · שימור הזיכרון · למידה חדשה וזיהוי`)}<p>4 תלמידים מקבוצת התנומה דיווחו שלא נרדמו, ו-2 מהקבוצה השנייה לא חזרו למבחן. הם הוצאו מהניתוח, ונשארו <mark>33 משתתפים</mark> (16 עם תנומה, 17 בלי). הקבוצות לא נבדלו בגיל, במין, בשעות השינה או בישנוניות.</p>${def("ישנוניות",`נמצאה <b>אינטראקציה</b> של זמן × קבוצה: אצל קבוצת התנומה הישנוניות <b>ירדה</b> באופן מובהק, ובקבוצה השנייה היא <b>עלתה</b>, אבל לא באופן מובהק.`)}${def("מושג מפתח",`<mark>אינטראקציה</mark> ${E("Interaction")}: ההשפעה של משתנה אחד (זמן) <b>שונה</b> בהתאם לרמה של משתנה אחר (קבוצה). כאן: השינוי לאורך הזמן היה שונה בין הקבוצות.`)}${ex(`<b>אינטראקציה</b>: בקבוצת התנומה הישנוניות ירדה, ובקבוצת הערות היא עלתה. השאלה "מה קרה לאורך הזמן" מקבלת תשובה שונה לכל קבוצה.`)}`,q:"q15"},
  {h:"מה קרה לזיכרון",html:`${fig("results","הביצוע ירד בשתי הקבוצות, אבל פחות אצל מי שישן")}${tiles([["doc","סיפורים","ירידה בשתי הקבוצות, אבל <b>גדולה יותר בלי תנומה</b>. אינטראקציה מובהקת","בזיכרון של סיפור, שתי הקבוצות שכחו, אבל הקבוצה שלא ישנה שכחה יותר. ההבדל הזה מובהק.","דנה ששנה בצהריים זוכרת יותר פרטים מהסיפור מחברה שנשארה ערה."],["link","זוגות מילים","ירידה מובהקת <b>רק</b> בקבוצה בלי התנומה. אינטראקציה מובהקת","בזוגות מילים, רק הקבוצה שלא ישנה שכחה. הקבוצה שישנה שמרה על הזיכרון. זה מתאים לרעיון ששינה עוזרת לזיכרון של קשרים.","דנה זוכרת ש״כלב״ הלך עם ״ענן״, אבל חברתה שלא ישנה כבר לא בטוחה."],["copies","רשימת מילים","שתי הקבוצות ירדו באותה מידה. <b>אין</b> אינטראקציה","ברשימה של מילים בודדות, שתי הקבוצות שכחו באותה מידה, ולכן התנומה לא עזרה כאן.","גם דנה וגם החברה שכחו בערך אותו מספר מילים מהרשימה."]])}`,q:"q17"},
  {h:"למידה חדשה וזיהוי",html:`<p>במבחן החוזר הוצגה <b>רשימה חדשה</b> (רשימה B) כדי לבדוק <mark>למידה חדשה</mark>. לא נמצא הבדל בין הקבוצות. גם ב<b>מבחן הזיהוי</b> לא היה הבדל.</p>${yn(["שליפה חופשית של סיפורים","שליפה עם רמז של זוגות מילים","ירידה בישנוניות"],["רשימת מילים","למידה חדשה","זיהוי"])}${rem("במילים פשוטות: התנומה <b>הגנה</b> על מה שכבר נלמד (ובעיקר על חומר עם קשרים ומשמעות), אבל לא עזרה ללמוד דברים חדשים.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"bulb",title:"דיון, מגבלות ומסקנה",blocks:[
  {h:"מה התוצאות אומרות",html:`${def("על מה הנושא",`מה המשמעות של התוצאות, ואיפה הן מוגבלות?<br><b>מה נלמד כאן:</b> פירוש התוצאות · אסוציאטיבי מול פריטים · מגבלות · מסקנה`)}<p>זה היה <b>ניסוי השדה הראשון</b> שהראה השפעה של תנומה אצל מתבגרים. ההשפעה הופיעה למרות משתנים שלא נשלטו בחדרי הפנימייה.</p>${tiles([["clock","שעה אחרי הצהריים","תואמת לשקע הטבעי בערנות, ולכן התנומה טבעית יותר בזמן הזה"],["moon","בלי לפגוע בלילה","תנומה של עד שעה כנראה לא מאחרת את ההירדמות בלילה"],["building","בלי לשנות שעות","אפשרות מעשית במקום להתחיל את הלימודים מאוחר יותר"]])}${ex("לתלמידים עצמם הייתה עמדה חיובית לגבי שילוב תנומה בסדר היום.")}`,q:"q21"},
  {h:"אסוציאטיבי מול פריטים, ומה עם REM",html:`<p>התנומה עזרה בשליפה של <b>קשרים</b> (סיפורים, זוגות מילים), אבל לא בזיהוי של <b>פריטים בודדים</b>. לפי מחקר fMRI, אלה תהליכים נפרדים במוח:</p>${tiles([["link","למידה אסוציאטיבית",`מערבת יותר את <mark>ההיפוקמפוס</mark> ${E("Hippocampus")}`,"לזכור קשר בין שני דברים. סוג כזה של זיכרון נשען יותר על ההיפוקמפוס.","דנה זוכרת לא רק את הפנים של מישהו, אלא גם איזה שם שייך להן."],["copies","למידה של פריטים","מערבת יותר אזורים <b>אנטורינליים ופרה-היפוקמפליים</b>","לזכור פריט בודד, בלי הקשר שלו. סוג כזה נשען יותר על אזורים אחרים, ליד ההיפוקמפוס.","דנה זוכרת שראתה פנים מסוימות, אבל לא את השם."]])}<p>זו ראיה עקיפה לכך שאיחוד הזיכרון בשינה מערב את ההיפוקמפוס.</p>${rem("<b>למה לא הייתה השפעה על למידה חדשה?</b> מחקר קודם מצא שהיתרון ללמידה חדשה קשור לכמות <b>שנת REM</b> בתנומה. שעה אחת לא מספיקה כדי ששנת REM תופיע.")}`,q:"q23"},
  {h:"מגבלות ומסקנה",html:`${tiles([["x","אין מדד אובייקטיבי","לא השתמשו בפוליסומנוגרפיה או אקטיגרפיה, רק בדיווח עצמי. אורך התנומה לא נרשם","החוקרים לא מדדו את השינה במכשיר, אלא סמכו על מה שהתלמידים דיווחו, ולא רשמו כמה זמן כל אחד ישן. זו מגבלה של המחקר.","אולי דנה ״ישנה״ רק עשר דקות מתוך השעה, ואף אחד לא יודע."],["building","סביבה לא נשלטת","חדרי המעונות עלולים להיות שונים זה מזה","התלמידים ישנו בחדרים שלהם במעונות, וייתכן שהחדרים היו שונים זה מזה ברעש, באור ובנוחות.","בחדר של דנה שקט, אבל בחדר של חברה אחרת יש רעש מהמסדרון."],["people","רוב בנות","מגביל הכללה לבנים (גם בבית הספר היו יותר בנות)","מגבלה של המחקר: רוב המשתתפים היו בנות, ולכן קשה לדעת אם התוצאות נכונות גם לבנים.","אם רק 12 מתוך 39 היו בנים, אי אפשר לומר בביטחון שגם אצלם שינה משפיעה באותה מידה."],["copies","בדיקה קבוצתית","מקשה להכליל למצבי בדיקה אחרים","מגבלה נוספת: כולם נבדקו יחד בקבוצה, ולא כל אחד לבד. לכן לא ברור אם התוצאה תהיה זהה בבדיקה אחרת.","דנה נבחנה בכיתה עם כולם. ייתכן שבחדר שקט, לבד, היא הייתה זוכרת אחרת."]])}${rem("<b>שימו לב:</b> אם מישהו מהקבוצה \"הערה\" נרדם בלי לדווח, זה דווקא היה <b>מקטין</b> את ההבדל. כלומר, ההשפעה האמיתית אולי גדולה יותר.")}${def("המסקנה",`הזדמנות לתנומה ביום <b>תומכת באיחוד זיכרון דקלרטיבי</b> אצל מתבגרים. כדאי לבחון שילוב תנומות בסדר היום של בתי הספר.`)}`,q:"q25"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"חוקרת רוצה לבדוק את השערת איחוד הזיכרון בשינה. מה ההשוואה הנכונה?","a":"שינה מול ערות, באותו פרק זמן אחרי הלמידה","w":["לילה של שינה מול לילה של שינה קצרה, בלי למידה","למידה בבוקר מול למידה בערב, בלי מדידת שינה","אנשים שישנים הרבה מול אנשים שישנים מעט בדרך כלל"],"e":"ההשערה טוענת ששינה מגינה על זיכרון יותר מערות, ולכן משווים שינה לערות באותו פרק זמן אחרי הלמידה. השוואה בין מי שישנים הרבה למי שישנים מעט ״בדרך כלל״ לא בודקת מה קורה אחרי למידה מסוימת."},{"q":"מה הרעיון המרכזי מאחורי ״עיבוד מחדש לא מקוון״?","a":"בזמן השינה המוח מעבד ומארגן זיכרונות","w":["בזמן השינה המוח מוחק מידע מיותר בלבד","בזמן השינה לומדים מידע חדש מהסביבה","בזמן השינה הזיכרון מושבת לגמרי ומתאושש"],"e":"״עיבוד מחדש לא מקוון״ הוא הרעיון שבזמן השינה המוח ממשיך לעבד ולארגן זיכרונות שנלמדו קודם. בשינה לא לומדים מידע חדש מהסביבה, והזיכרון לא מושבת."}]},
"q2":{"t":"t1","v":[{"q":"תלמיד לומד לרכוב על אופניים, ותלמידה לומדת תאריכים היסטוריים. איזה סוג זיכרון כל אחד מפעיל?","a":"אופניים: פרוצדורלי. תאריכים: דקלרטיבי","w":["אופניים: דקלרטיבי. תאריכים: פרוצדורלי","שניהם: זיכרון עבודה","אופניים: זיכרון עבודה. תאריכים: פרוצדורלי"],"e":"רכיבה על אופניים היא ידע של ״איך עושים״, כלומר זיכרון פרוצדורלי. תאריכים הם ידע שאפשר לנסח במילים, כלומר זיכרון דקלרטיבי. המסיח הראשון מחליף ביניהם."},{"q":"באיזה סוג זיכרון עוסק המחקר הזה?","a":"דקלרטיבי מילולי","w":["פרוצדורלי מוטורי","זיכרון עבודה חזותי","זיכרון רגשי"],"e":"סיפורים, זוגות מילים ורשימת מילים הם ידע שאפשר לנסח במילים, ולכן המחקר עוסק בזיכרון דקלרטיבי מילולי. לא נבדקו מיומנויות מוטוריות."}]},
"q3":{"t":"t1","v":[{"q":"סטודנטית למדה רשימת מילים, ואז שמעה רשימה אחרת שבלבלה אותה. לפי המאמר, מה השינה הייתה עושה?","a":"מקטינה את הפגיעה של המידע המפריע","w":["מוחקת את הרשימה השנייה מהזיכרון","מגבירה את הבלבול בין הרשימות","לא משפיעה, כי מדובר בזיכרון מילולי"],"e":"לפי המאמר, שינה מגינה על הזיכרון מפני הפרעה, כלומר מקטינה את הפגיעה של מידע חדש שמבלבל. היא לא מוחקת את הרשימה השנייה."},{"q":"מה מצאו מחקרי fMRI על לילה של שינה?","a":"עלייה בפעילות באזורי הלמידה, שקשורה לשיפור בביצוע","w":["ירידה בפעילות בכל אזורי המוח בזמן השינה","פעילות רק באזורים של חלומות ושל רגש","אין הבדל בפעילות המוחית בין שינה לערות"],"e":"מחקרי fMRI מצאו שאחרי לילה של שינה הפעילות באזורים שהשתתפו בלמידה עולה, והעלייה קשורה לשיפור בביצוע. זה תומך ברעיון שהשינה ממשיכה את הלמידה."}]},
"q4":{"t":"t1","v":[{"q":"איזה ממצא מחולדות תומך בהשערת איחוד הזיכרון?","a":"גנים של איחוד זיכרון וגמישות מוחית מתבטאים יותר בשינה","w":["חולדות שישנו פחות למדו מהר יותר מהאחרות","חולדות זכרו טוב יותר כשנמנעה מהן שינה","לא נמצא קשר בין שינה לביטוי גנים אצל חולדות"],"e":"גנים שקשורים לאיחוד זיכרון ולגמישות מוחית מתבטאים יותר בזמן השינה. זו עדות ברמה הגנטית שתומכת בהשערה. חולדות שנמנעה מהן שינה דווקא זכרו פחות טוב."},{"q":"מה מבדיל ״הפרעה״ (Interference) משכחה רגילה?","a":"מידע חדש שנכנס אחרי הלמידה פוגע בזכירה","w":["הזיכרון נמחק לבד עם הזמן","המידע לא נקלט מלכתחילה","הזיכרון נפגע בגלל עייפות בזמן הלמידה"],"e":"בהפרעה, מידע חדש שנכנס אחרי הלמידה פוגע בזכירה של המידע הקודם. זה לא דעיכה עם הזמן, אלא ״דריסה״ של הישן בידי החדש."}]},
"q5":{"t":"t2","v":[{"q":"מתבגר ישראלי ישן 7 שעות בלילה. לפי המאמר, איך זה ביחס להמלצה?","a":"פחות מההמלצה של 8 עד 10 שעות","w":["בדיוק לפי ההמלצה","יותר מההמלצה","תלוי רק בגיל המדויק שלו"],"e":"ההמלצה למתבגרים היא 8 עד 10 שעות שינה, ו-7 שעות זה פחות מזה. המאמר מדגיש שמחסור בשינה אצל מתבגרים הוא הכלל ולא היוצא מן הכלל."},{"q":"מה מראים הנתונים מארה״ב, הונג קונג, יפן וקוריאה?","a":"מתבגרים בכל המדינות ישנים פחות מהמומלץ","w":["רק בקוריאה יש מחסור בשינה","מתבגרים באסיה ישנים יותר מבארה״ב","בכל המדינות מתבגרים ישנים כמומלץ"],"e":"בכל המדינות שנבדקו, מתבגרים ישנים פחות מהמומלץ: כ-7.5 שעות בארה״ב, ורק כ-5.4 בקוריאה. מתבגרים באסיה דווקא ישנים פחות, לא יותר."}]},
"q6":{"t":"t2","v":[{"q":"נערה ״משלימה שינה״ בשבת עד 12 בצהריים. לפי המאמר, למה זה מחמיר את הבעיה?","a":"פחות אור בבוקר מאחר את שעון השינה עוד יותר","w":["כי השינה בשבת עמוקה מדי ומבלבלת את הגוף","כי היא שוכחת את מה שלמדה במהלך השבוע","כי זה מגביר אצלה את הצורך בקפאין"],"e":"שינה עד הצהריים מורידה את החשיפה לאור בבוקר, וזה מאחר את השעון הביולוגי עוד יותר. כך נוצר מעגל: שינה קצרה בשבוע, השלמה בסוף שבוע, ושוב איחור בהירדמות."},{"q":"מה מראה מחקר הפנימייה עם 5 שעות שינה בלילה?","a":"הנזק לזיכרון נמשך גם אחרי לילות התאוששות","w":["לילה אחד של השלמה מתקן את כל הנזק","מחסור בשינה פוגע רק בערנות","מחסור בשינה לא פוגע בזיכרון חזותי"],"e":"במחקר הפנימייה, אחרי כמה לילות של 5 שעות שינה, גם שני לילות של שינת התאוששות לא תיקנו את הנזק לזיכרון. לכן ״לילה אחד של השלמה מתקן הכל״ שגוי."}]},
"q7":{"t":"t2","v":[{"q":"למה התנומה במחקר נקבעה דווקא לשעות אחר הצהריים?","a":"כדי שתתאים לשקע הטבעי בערנות","w":["כי אז התלמידים עייפים מהאוכל","כי זו השעה היחידה שבה הייתה הפסקה","כי בבוקר אסור לישון בפנימייה"],"e":"אחר הצהריים יש שקע טבעי בערנות, חלק מהקצב הצירקדי, ולכן קל יותר להירדם. ההסבר אינו ״עייפות מהאוכל״."},{"q":"מה מצאו מחקרים קודמים על שינת לילה לעומת תנומה?","a":"השפעה דומה על איחוד הזיכרון","w":["תנומה עדיפה תמיד על שינת לילה","שינת לילה בלבד מאחדת זיכרון","תנומה פוגעת באיחוד הזיכרון"],"e":"מחקרים קודמים מצאו ששינת לילה ותנומה משפיעות באופן דומה על איחוד הזיכרון. זה מה שמצדיק לבדוק תנומה כחלופה מעשית."}]},
"q8":{"t":"t2","v":[{"q":"למה החוקרים לא פשוט המליצו לתלמידים לישון יותר בלילה?","a":"כי קשה להגדיל שינת לילה, וחינוך לשינה לא מחזיק","w":["כי שינת לילה לא משפיעה על הזיכרון","כי התלמידים כבר ישנו מספיק בלילה","כי ההורים התנגדו לשינוי בשעות"],"e":"לחץ לימודי ורשתות חברתיות מקשים להאריך את שינת הלילה, ותוכניות לחינוך לשינה משפרות רק לזמן קצר. לכן חיפשו פתרון אחר. התלמידים לא ישנו מספיק, ולכן המסיח השני שגוי."},{"q":"איך המאמר מציע לראות תנומה ביום?","a":"ככלי עזר, לא כתחליף ללילה","w":["כתחליף מלא לשינת הלילה","כפתרון לכל בעיות השינה","כבזבוז של זמן לימודים"],"e":"המאמר רואה בתנומה כלי עזר שמקטין את הנזקים של מחסור כרוני בשינה, ולא תחליף לשינת לילה. הוא לא טוען שהיא פותרת את כל בעיות השינה."}]},
"q9":{"t":"t3","v":[{"q":"מה היה חדש במחקר הזה?","a":"ראשון שבדק תנומה וזיכרון מילולי אצל מתבגרים בסביבה טבעית","w":["ראשון שבדק את השפעת השינה על זיכרון באופן כללי","ראשון שבדק מתבגרים במעבדת שינה מבוקרת","ראשון שהשתמש בפוליסומנוגרפיה בתוך בית ספר"],"e":"החידוש הוא השילוב: תנומה, מתבגרים, סביבה טבעית (פנימייה) וזיכרון מילולי. כבר נעשו מחקרים על שינה וזיכרון, ולכן זה לא ״המחקר הראשון על שינה וזיכרון״."},{"q":"למה חשוב לבדוק דווקא זיכרון מילולי?","a":"כי רוב ההוראה בכיתה מילולית","w":["כי הוא הקל ביותר למדידה במחקר","כי הוא לא מושפע משינה בכלל","כי מתבגרים טובים בו במיוחד"],"e":"רוב ההוראה בכיתה היא מילולית, ולכן ממצא על זיכרון מילולי רלוונטי ישירות ללמידה בבית הספר. זיכרון מילולי דווקא כן מושפע משינה, וזה מה שנבדק."}]},
"q10":{"t":"t3","v":[{"q":"מי מהבאים היה מוחרג מהמחקר?","a":"תלמיד עם לקות קריאה","w":["תלמידה בת 17","תלמיד שישן 6 שעות בלילה","תלמידה שגרה בפנימייה"],"e":"לקות שפה או קריאה הייתה קריטריון החרגה, כי היא פוגעת בביצוע במשימות מילוליות בלי קשר לשינה. 6 שעות שינה בלילה לא היו סיבה להחריג. רוב המתבגרים ישנים פחות מהמומלץ."},{"q":"למה הוחרגו תלמידים עם לקות שמיעה?","a":"כי המשימות הוקראו בקול","w":["כי הם ישנים יותר מאחרים","כי הם לא גרו בפנימייה","כי הם מתקשים להירדם"],"e":"המשימות הוקראו בקול, ולכן קושי בשמיעה היה פוגע בביצוע בלי קשר לשינה. ההחרגה נועדה למנוע הסבר חלופי לתוצאות."}]},
"q11":{"t":"t3","v":[{"q":"למה התאימו את הקבוצות לפי גיל, מין וישנוניות לפני החלוקה האקראית?","a":"כדי שהקבוצות יהיו דומות לפני הטיפול","w":["כדי לבדוק הבדלי מגדר בשינה","כדי שהקבוצות יהיו בגדלים שונים","כדי שרק הישנוניים יקבלו תנומה"],"e":"כשהקבוצות דומות בגיל, במין ובישנוניות לפני הניסוי, אפשר לייחס את ההבדל שנמצא אחריו לתנומה. לא רצו קבוצות בגדלים שונים או לבדוק הבדלי מגדר."},{"q":"למה ביקשו מהתלמידים לא להשתמש באסטרטגיות זיכרון בין המבחנים?","a":"כדי שההבדל יבטא את השינה, לא את התרגול","w":["כדי שהמבחן החוזר יהיה קשה יותר","כדי לבדוק את האינטליגנציה של התלמידים","כדי שהתלמידים לא יירדמו בזמן המבחן"],"e":"אם תלמידים היו חוזרים על החומר בין המבחנים, ההבדל היה יכול לנבוע מהתרגול ולא מהשינה. לכן ביקשו מהם לא להשתמש באסטרטגיות זיכרון."}]},
"q12":{"t":"t3","v":[{"q":"מה עשתה הקבוצה ללא תנומה בזמן שהקבוצה האחרת ישנה?","a":"פעילויות שקטות לבד","w":["למדה את החומר שוב","שיחקה ספורט בחוץ","ישנה בחדר אחר בלי דיווח"],"e":"הקבוצה ללא תנומה עשתה פעילויות שקטות לבד, ולא חזרה על החומר. כך ההבדל העיקרי בין הקבוצות הוא השינה עצמה."},{"q":"למה ביקשו מהתלמידים להימנע מקפאין 24 שעות לפני הניסוי?","a":"כי קפאין משפיע על הערנות ועל ההירדמות","w":["כי קפאין משפר זיכרון מילולי","כי קפאין אסור לפי תקנון הפנימייה","כי קפאין משפיע בעיקר על הבנות"],"e":"קפאין משפיע על הערנות ועל היכולת להירדם, ולכן היה מבלבל את מדידת הישנוניות ואת התנומה. המסיח ״קפאין משפר זיכרון מילולי״ לא הסיבה שצוינה."}]},
"q13":{"t":"t3","v":[{"q":"למה השתמשו ב-CASQ רק בהתחלה, וב-SSS פעמיים?","a":"CASQ מודד ישנוניות כללית, SSS ישנוניות ברגע","w":["CASQ מודד זיכרון, SSS מודד ישנוניות","CASQ ארוך מדי, ולכן מילאו אותו פעם אחת","SSS מודד ישנוניות כללית, CASQ ברגע"],"e":"CASQ מודד ישנוניות כללית לאורך זמן, ולכן שימש להתאמת הקבוצות בהתחלה. SSS מודד ישנוניות ברגע מסוים, ולכן נמדד פעמיים כדי לראות שינוי. המסיח האחרון הופך ביניהם."},{"q":"במערך 2×2, איזה משתנה הוא בין־נבדקי?","a":"קבוצה (תנומה מול ערות)","w":["זמן (בסיס מול חוזר)","סוג המשימה","גיל המשתתף"],"e":"כל משתתף שייך לקבוצה אחת בלבד, תנומה או ערות, ולכן ״קבוצה״ הוא משתנה בין־נבדקי. ״זמן״ (בסיס מול חוזר) נמדד אצל כל משתתף, ולכן הוא תוך־נבדקי."}]},
"q14":{"t":"t3","v":[{"q":"״סירה–טלפון״: שומעים ״סירה״ וצריך להשלים ״טלפון״. איזו משימה זו ומה היא בודקת?","a":"זוגות מילים: שליפה עם רמז של קשר","w":["רשימת מילים: זיהוי של פריטים בודדים","שליפת סיפורים: שליפה חופשית של טקסט","רשימת מילים: שליפה חופשית בלי רמז"],"e":"שומעים מילה אחת וצריך לשלוף את המילה שהוצמדה אליה, וזה זוגות מילים: שליפה עם רמז של קשר, כלומר למידה אסוציאטיבית. ברשימת מילים זוכרים פריטים בלי רמז."},{"q":"מה מבדיל את משימת ״רשימת המילים״ (RAVLT) מ״זוגות המילים״?","a":"ברשימה זוכרים פריטים בודדים, בזוגות קשרים","w":["ברשימה זוכרים קשרים, בזוגות פריטים","ברשימה יש סיפור, בזוגות אין","אין הבדל, שתיהן בודקות אותו דבר"],"e":"ברשימת המילים זוכרים פריטים בודדים, ובזוגות המילים זוכרים קשרים בין מילים. ההבדל הזה מסביר בדיון למה התנומה עזרה רק בחלק מהמשימות."}]},
"q15":{"t":"t4","v":[{"q":"למה הוציאו מהניתוח את 4 התלמידים שלא נרדמו?","a":"כי הם לא קיבלו בפועל את ״הטיפול״","w":["כי הם לא מילאו את השאלונים","כי הם הפריעו לאחרים לישון","כי הם קיבלו ציונים חריגים"],"e":"מי שלא נרדם לא קיבל בפועל את ״הטיפול״, השינה, ולכן לא מייצג את קבוצת התנומה. הם לא הוצאו בגלל ציונים חריגים."},{"q":"כמה משתתפים נשארו בניתוח הסופי?","a":"33","w":["39","20","45"],"e":"39 תלמידים התחילו את המחקר. 4 לא נרדמו ו-2 לא חזרו למבחן השני, ולכן נשארו 33 בניתוח הסופי."}]},
"q16":{"t":"t4","v":[{"q":"בקבוצת התנומה הישנוניות ירדה, ובקבוצה השנייה עלתה. איך נקרא דפוס כזה בניתוח?","a":"אינטראקציה זמן × קבוצה","w":["אפקט עיקרי של זמן","אפקט עיקרי של קבוצה","אפקט רצפה בישנוניות"],"e":"כשהשינוי לאורך הזמן שונה בין הקבוצות (ירידה מול עלייה), זו אינטראקציה זמן × קבוצה. אפקט עיקרי של זמן היה שינוי דומה בשתי הקבוצות."},{"q":"אם הייתה רק ירידה כללית בזיכרון בשתי הקבוצות באותה מידה, מה היינו מוצאים?","a":"אפקט עיקרי של זמן, בלי אינטראקציה","w":["אינטראקציה מובהקת זמן × קבוצה","אפקט עיקרי של קבוצה בלבד","אפקט של תנומה על הזיכרון"],"e":"ירידה דומה בשתי הקבוצות היא אפקט עיקרי של זמן, בלי אינטראקציה, כי הקבוצה לא שינתה את מה שקרה לאורך הזמן. זה בדיוק מה שנמצא ברשימת המילים."}]},

"q18":{"t":"t4","v":[{"q":"ברשימת המילים שתי הקבוצות ירדו באותה מידה. מה זה מראה?","a":"התנומה לא הגנה על זכירת פריטים בודדים","w":["התנומה שיפרה זכירת פריטים בודדים","שהמשימה הייתה קלה מדי","שהקבוצות לא היו דומות בבסיס"],"e":"ירידה זהה בשתי הקבוצות מראה שהתנומה לא הגנה על זכירה של פריטים בודדים. הקבוצות היו דומות בבסיס, ולכן זה לא ההסבר."},{"q":"בשתי משימות מתוך שלוש התנומה עזרה. מה המשותף להן?","a":"שתיהן מבוססות על קשרים","w":["שתיהן בודקות זיהוי","שתיהן חזותיות בעיקרן","שתיהן קצרות מאוד"],"e":"סיפורים וזוגות מילים מבוססים על קשרים בין פריטים, ובהם התנומה עזרה. ברשימת מילים, שבה זוכרים פריטים בודדים, היא לא עזרה."}]},

const SUM=`<h2>סיכום: תנומת צהריים וזיכרון מילולי אצל מתבגרים (לאו ועמיתים, 2018)</h2>
<div class="key"><b>על מה מדובר?</b> מתבגרים ישנים בלילה הרבה פחות ממה שהם צריכים, ושינה חשובה לזיכרון. קשה לגרום להם לישון יותר בלילה, אז החוקרים שאלו: האם <b>שעת תנומה בצהריים</b> יכולה לעזור? הם לקחו תלמידים בפנימייה, לימדו אותם חומר, ואז חצי ישנו שעה וחצי נשארו ערים. הממצא: התנומה <b>לא שיפרה</b> את הזיכרון, אבל היא <b>הגנה עליו משכחה</b>, ורק בסוג מסוים של זיכרון: <b>קשרים בין דברים</b> (סיפור, זוגות מילים), ולא מילים בודדות. זה מתאים לרעיון שבזמן שינה המוח ״מקבע״ זיכרונות, ושה<b>היפוקמפוס</b> מעורב בזה.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>איחוד זיכרון</b></td><td>תהליך שבו זיכרון חדש מתייצב, ושינה עוזרת לו.</td></tr>
<tr><td><b>הפרעה</b></td><td>מידע חדש ש״דורס״ מידע ישן כשאנחנו ערים.</td></tr>
<tr><td><b>זיכרון של קשרים</b></td><td>לזכור מה הלך עם מה: סיפור, זוגות מילים. תלוי בהיפוקמפוס.</td></tr>
<tr><td><b>שקע אחר הצהריים</b></td><td>ירידה טבעית בערנות, חלק מהשעון הביולוגי.</td></tr>
<tr><td><b>תוך־נבדקי / בין־נבדקי</b></td><td>כל משתתף בכל התנאים / כל משתתף בתנאי אחד.</td></tr>
<tr><td><b>אינטראקציה</b></td><td>השינוי מלפני לאחרי שונה בין הקבוצות.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: דנה, תלמידת כיתה י״א</h3>
<p>דנה ישנה בלילה בממוצע 7 שעות, הולכת לישון מאוחר וקמה מוקדם לבית הספר, ובסופ״ש ״משלימה״. היא משתתפת בניסוי: בבוקר היא לומדת סיפור, זוגות מילים ורשימת מילים, ואז היא בקבוצת התנומה. חברה שלה, גלי, בקבוצת הערות.</p>

<h3>1. הרקע: למה שינה קשורה לזיכרון</h3>
<p><b>השערת איחוד הזיכרון התלוי בשינה:</b> אחרי שינה זוכרים <b>יותר</b> מאשר אחרי זמן ערות באורך זהה. איך זה עובד? בזמן השינה המוח ״מעבד מחדש״ את מה שלמדנו, בלי שאנחנו מודעים (<b>עיבוד לא מקוון</b>), ומגן על הזיכרון מ<b>הפרעה</b>: מידע חדש שהיה ״דורס״ את הישן אם היינו ערים.</p>
<p><b>למה דווקא מתבגרים:</b> הם צריכים 8–10 שעות, וישנים פחות (ארה״ב 7.5, הונג קונג 7.3, יפן 6.3, קוריאה 5.4). נוצר מעגל: ישנים מעט באמצע השבוע ← ״משלימים״ בסופ״ש ← פחות אור בבוקר ← השעון הפנימי זז מאוחר יותר ← שוב קשה להירדם. שבוע של 5 שעות שינה פגע בזיכרון גם אחרי שני לילות של השלמה.</p>
<p><b>למה תנומה ולא שינת לילה:</b> קשה להאריך שינת לילה (לימודים, רשתות), וגם חינוך לשינה לא מחזיק לאורך זמן. תנומה, לעומת זאת, יעילה לאיחוד בערך כמו שינת לילה, ומתאימה ל<b>שקע של אחרי הצהריים</b> (הירידה הטבעית בערנות, חלק מהשעון הביולוגי).</p>

<h3>2. איך הניסוי נבנה</h3>
<ul>
<li><b>משתתפים:</b> 39 תלמידים בני 15–18 בפנימייה בהונג קונג (נשארו 33), רובם בנות.</li>
<li><b>הכנה:</b> יומן שינה שבוע, בלי קפאין 24 שעות. חילקו לשתי קבוצות דומות בגיל, מין וישנוניות, ואז בהגרלה.</li>
<li><b>מה עשו:</b> בבוקר לומדים ונבחנים (בסיס). אחר הצהריים: קבוצה אחת ישנה שעה (דנה), השנייה ערה בלי לתרגל (גלי). אחר כך נבחנים שוב. ובדקו גם כמה הם ישנוניים, בסולם 1–7.</li>
<li><b>מבנה הניתוח:</b> שני גורמים. <b>זמן</b> (לפני ואחרי) הוא <b>תוך־נבדקי</b>, כי כל תלמיד נבחן פעמיים. <b>קבוצה</b> (תנומה או ערות) היא <b>בין־נבדקית</b>, כי כל תלמיד שייך רק לקבוצה אחת. מה שמחפשים הוא <b>אינטראקציה</b>: האם השינוי מלפני לאחרי שונה בין הקבוצות?</li>
</ul>

<h3>3. מה נמצא</h3>
<p>כדי להבין את הטבלה, צריך לדעת שבדקו ארבעה סוגי זיכרון. ההבדל ביניהם: האם זוכרים <b>קשר</b> בין דברים, או <b>פריטים בודדים</b>.</p>
<div class="tw"><table><tr><th>משימה</th><th>סוג הזיכרון</th><th>מה קרה</th></tr>
<tr><td>לספר מחדש סיפור</td><td>קשרים, טקסט עם משמעות</td><td>שתי הבנות שכחו קצת, אבל <b>גלי (ערות) שכחה יותר</b></td></tr>
<tr><td>זוגות מילים (״כלב־ענן״: אומרים ״כלב״, צריך להיזכר ב״ענן״)</td><td>קשרים בין שני פריטים</td><td><b>רק גלי שכחה</b>; דנה שמרה</td></tr>
<tr><td>רשימת מילים</td><td>פריטים בודדים, שליפה וזיהוי</td><td>שתיהן שכחו <b>באותה מידה</b></td></tr>
<tr><td>רשימה חדשה אחרי התנומה</td><td>למידה של משהו חדש</td><td><b>אין הבדל</b></td></tr></table></div>
<p><b>ישנוניות:</b> ירדה בקבוצת התנומה, ועלתה קצת (לא מובהק) בקבוצת הערות.</p>

<h3>4. מה זה אומר</h3>
<ul>
<li><b>קשרים ולא פריטים:</b> זיכרון של <b>קשרים</b> בין דברים תלוי ב<b>היפוקמפוס</b>, וזיכרון של פריטים בודדים תלוי באזורים אחרים. לכן הממצא הוא ראיה <b>עקיפה</b> לכך שההיפוקמפוס פועל באיחוד בזמן שינה. (״עקיפה״ כי לא מדדו את המוח.)</li>
<li><b>למה התנומה לא עזרה ללמוד דבר חדש:</b> היתרון הזה קשור לשנת חלומות (REM), ושעה אחת של תנומה כנראה לא מספיקה כדי להגיע אליה.</li>
<li><b>יישום:</b> תנומה של עד שעה כנראה לא תפריע להירדם בלילה, והיא חלופה מעשית לדחיית שעת תחילת הלימודים. והתלמידים אהבו את זה.</li>
</ul>

<h3>5. מגבלות</h3>
<ul>
<li>לא מדדו שינה באופן אובייקטיבי (בלי מכשירים), לא רשמו כמה זמן כל אחד ישן בפועל, החדרים היו שונים, רוב המשתתפים בנות, והבדיקה הייתה קבוצתית.</li>
<li><b>מגבלה ״שעובדת לטובת״ המחקר:</b> אם גלי, או מישהו אחר מקבוצת הערות, נרדם לרגע, גם הוא קיבל קצת מהיתרון של השינה. זה <b>מקטין</b> את ההבדל בין הקבוצות. כלומר ההשפעה האמיתית של התנומה כנראה <b>גדולה יותר</b> ממה שנמצא.</li>
</ul>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. מתבגרים ישנים <b>פחות</b> ממה שהם צריכים, וקשה להאריך את שינת הלילה, ולכן בדקו אם <b>תנומת צהריים</b> עוזרת לזיכרון.<br>
2. 33 תלמידי פנימייה למדו בבוקר, ואז חצי <b>ישנו שעה</b> וחצי נשארו <b>ערים</b>, ונבחנו שוב.<br>
3. התנומה לא שיפרה את הזיכרון, אלא <b>הקטינה את השכחה</b>, ורק בזיכרון של <b>קשרים</b> (סיפור, זוגות מילים).<br>
4. זו <b>ראיה עקיפה</b> לתפקיד ההיפוקמפוס באיחוד בזמן שינה; ולמידה חדשה לא השתפרה, אולי כי לא הגיעו ל־REM.<br>
5. המגבלות: בלי מדידת שינה אובייקטיבית, רוב בנות, ואם מישהו מקבוצת הערות נרדם, ההבדל <b>קטן</b>, כלומר ההשפעה האמיתית כנראה גדולה יותר.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להסביר את השערת איחוד הזיכרון התלוי בשינה, ואת מעגל השינה של מתבגרים.<br>
• לזהות במערך מה תוך־נבדקי ומה בין־נבדקי, ומה זו האינטראקציה.<br>
• לומר באילו משימות היה הבדל ובאילו לא, ולמה.<br>
• להסביר למה ההבדל בין שכחה פחותה לשיפור חשוב.<br>
• למנות מגבלות ולהסביר את כיוון ההשפעה שלהן.</div>
<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>התנומה לא שיפרה את הזיכרון</b>; היא <b>הקטינה את השכחה</b>.</li>
<li><b>ברשימת המילים, בזיהוי ובלמידה חדשה אין הבדל.</b></li>
<li><b>זמן = תוך־נבדקי; קבוצה = בין־נבדקית.</b></li>
<li><b>התפקיד של ההיפוקמפוס הוא מסקנה עקיפה</b>; לא מדדו מוח.</li>
<li><b>אם מישהו מקבוצת הערות נרדם, ההבדל קטן</b>, לא גדל.</li>
</ul></div>`;

/* animate a ring and a number from 0 to their value */
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const to=+el.dataset.count,suf=el.dataset.suffix||"",tot=el.dataset.total;
    if(REDUCED){el.textContent=to+suf;return}
    const t0=performance.now(),d=900;
    const f=now=>{const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e)+suf+(tot?"/"+tot:"");if(k<1)requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
  root.querySelectorAll(".ring[data-p]").forEach(r=>{requestAnimationFrame(()=>requestAnimationFrame(()=>r.style.setProperty("--p",r.dataset.p)))});
}

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

/* Flashcards: front = the term and a prompt, back = the answer and an example.
   "יודע" removes the card from this round, "עוד לא" sends it to the end of the deck. */
function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");
    const card=app.querySelector("#fc"),acts=app.querySelector(".fc-actions");
    const flip=()=>{flipped=!flipped;card.classList.toggle("flipped",flipped);card.setAttribute("aria-pressed",flipped);
      if(flipped&&!acts.querySelector(".fc-btns")){acts.innerHTML=`<div class="fc-btns"><button class="fc-no" id="no">${ic("cycle")}<span>עוד לא</span></button><button class="primary fc-yes" id="yes">${ic("check")}<span>ידעתי</span></button></div>`;
        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};
        acts.querySelector("#no").onclick=()=>{missed.add(k);S.cards[k]=0;save();deck.push(deck.shift());step("fwd")};}};
    card.onclick=flip;
    document.onkeydown=e=>{if(!document.body.contains(card))return document.onkeydown=null;if(e.key===" "||e.key==="Enter"){if(document.activeElement===card||document.activeElement===document.body){e.preventDefault();flip()}}};
  };
  step("up");
}

function mindmap(mi,onBack){
  const M=MAPSET[mi],seen=new Set();
  const tint=(n,c)=>{n._c=c;(n.c||[]).forEach(x=>tint(x,c))};
  M.root._c="var(--accent)";M.root.c.forEach((b,k)=>tint(b,`var(--t${k%8+1})`));
  const leaves=n=>n.c?n.c.flatMap(leaves):[n],total=leaves(M.root).length;
  let path=[M.root],sel=null;
  document.body.style.setProperty("--c","var(--accent)");
  show(`<div class="stack mm-view"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>${onBack?"חזרה לנושא":"כל הנושאים"}</span></button><span class="prog" id="mmc">0 מתוך ${total} מושגים</span></div></div>
   <div class="mm-head"><span class="eyebrow">מפת חשיבה</span><h2>${M.title}</h2><p class="muted">לחצו על ענף כדי לפתוח אותו, ועל מושג כדי לקרוא עליו. לחיצה על המרכז חוזרת רמה אחת אחורה.</p></div>
   <nav class="mm-crumbs" id="mmb" aria-label="מיקום במפה"></nav>
   <div class="mm" id="mm"><svg class="mm-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
   <div class="mm-detail" id="mmd" aria-live="polite"></div></div>`,"up");
  app.querySelector("#back").onclick=onBack||(()=>home("back"));
  const box=app.querySelector("#mm"),svg=box.querySelector("svg"),det=app.querySelector("#mmd"),crumbs=app.querySelector("#mmb");

     ${isBranch?`<p class="mmd-note">${n.c.some(x=>x.c)?`${n.c.length} ענפים. לחצו על ענף כדי לפתוח אותו.`:`${n.c.length} מושגים בענף הזה. לחצו על מושג כדי לקרוא עליו.`}</p>`:next?`<button class="mmd-next">${ic("arrowL")}<span>המושג הבא: ${next.n}</span></button>`:""}</div>`;

    sel=n;seen.add(n);app.querySelector("#mmc").textContent=`${seen.size} מתוך ${total} מושגים`;

    const ctr=document.createElement("button");ctr.className="mm-node center";ctr.style.setProperty("--c",cur._c);
    ctr.innerHTML=`<span class="mm-n">${cur.n}</span>${enLine(cur)}${path.length>1?`<span class="mm-up">${ic("arrowR")} חזרה</span>`:""}`;

    ctr.onclick=()=>{if(path.length>1){path.pop();sel=null;render();det.innerHTML=""}else detail(cur,true)};
    box.appendChild(ctr);
    kids.forEach((k2,k)=>{const b=document.createElement("button");b._n=k2;
      b.className="mm-node kid "+(k2.c?"branch":"leaf")+(seen.has(k2)?" seen":"");b.style.cssText=`--c:${k2._c};--x:${pos[k][0]}%;--y:${pos[k][1]}%;--i:${k}`;
      b.innerHTML=`<span class="mm-n">${k2.n}</span>${k2.c?`<span class="mm-cnt">${k2.c.length} מושגים</span>`:enLine(k2)}`;

  };

}

/* Every module gets flashcards and a mind map. A hand-written CARDS or MAPS file wins;
   otherwise both are built from the module's own definitions (tiles, long concept cards, def boxes). */
const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim()};
function deriveTerms(){
  return T.flatMap((t,ti)=>t.blocks.map((blk,bi)=>{const d=document.createElement("div");d.innerHTML=blk.html;
    const items=[...d.children].filter(isTerm).flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem).filter(x=>strip(x.name));
    return{t,ti,bi,h:blk.h,items}}).filter(b=>b.items.length));
}
function autoCards(blocks){
  const byTopic=T.map(t=>blocks.filter(b=>b.t===t).flatMap(b=>b.items.map(it=>({it,t})))
    .sort((a,b)=>strip(b.it.body).length-strip(a.it.body).length));
  const out=[],used=new Set();
  for(let r=0;out.length<12&&byTopic.some(x=>x.length>r);r++)for(const list of byTopic){if(out.length>=12)break;const x=list[r];if(!x)continue;const key=strip(x.it.name);if(used.has(key))continue;used.add(key);
    const hasEx=/cpt-ex/.test(x.it.body);out.push({t:x.t.id,f:x.it.name,q:hasEx?"מה זה? נסו גם לחשוב על דוגמה":"מה ההגדרה?",b:x.it.body,ex:""})}
  return out;
}
function autoMap(blocks){
  const chunk=(name,items)=>{const leaves=items.map(it=>({n:it.name,en:it.en,d:it.body}));if(leaves.length<=8)return[{n:name,c:leaves}];
    const parts=Math.ceil(leaves.length/7);return Array.from({length:parts},(_,k)=>({n:`${name} (${k+1}/${parts})`,c:leaves.slice(k*7,k*7+7)}))};
  const kids=T.map(t=>{const bs=blocks.filter(b=>b.t===t);if(!bs.length)return null;
    const sub=bs.flatMap(b=>chunk(b.h,b.items));
    const c=sub.length===1?sub[0].c:sub.map(s=>({n:s.n,d:`${s.c.length} מושגים מהקטע ״${s.n}״.`,c:s.c}));
    return{n:t.title,d:`נושא ${T.indexOf(t)+1} בלומדה. ${c.length} ${sub.length===1?"מושגים":"קטעים"} בענף.`,c}}).filter(Boolean);
  if(kids.length<2)return null;
  return{id:"module",title:"מפת הלומדה",sub:"כל הנושאים והמושגים במבט אחד",root:{n:CONFIG.he||CONFIG.title,d:CONFIG.about||"כל הנושאים של הלומדה. לחצו על נושא כדי לפתוח את המושגים שלו.",c:kids}};
}

const MAPSET=(typeof MAPS!=="undefined"?MAPS:[]).concat([autoMap(TERM_BLOCKS)].filter(Boolean));
