 {id:"t1",icon:"brain",title:"שינה וזיכרון: הרקע",blocks:[

  {h:"המדגם הסופי והישנוניות",html:`${def("על מה הנושא",`מה מצאו? הנושא מציג את התוצאות לפי הסדר: ישנוניות, זיכרון, ולמידה חדשה.<br><b>מה נלמד כאן:</b> ישנוניות · אינטראקציה · שימור הזיכרון · למידה חדשה וזיהוי`)}<p>4 תלמידים מקבוצת התנומה דיווחו שלא נרדמו, ו-2 מהקבוצה השנייה לא חזרו למבחן. הם הוצאו מהניתוח, ונשארו <mark>33 משתתפים</mark> (16 עם תנומה, 17 בלי). הקבוצות לא נבדלו בגיל, במין, בשעות השינה או בישנוניות.</p>${def("ישנוניות",`נמצאה <b>אינטראקציה</b> של זמן × קבוצה: אצל קבוצת התנומה הישנוניות <b>ירדה</b> באופן מובהק, ובקבוצה השנייה היא <b>עלתה</b>, אבל לא באופן מובהק.`)}${def("מושג מפתח",`<mark>אינטראקציה</mark> ${E("Interaction")}: ההשפעה של משתנה אחד (זמן) <b>שונה</b> בהתאם לרמה של משתנה אחר (קבוצה). כאן: השינוי לאורך הזמן היה שונה בין הקבוצות.`)}${ex(`<b>אינטראקציה</b>: בקבוצת התנומה הישנוניות ירדה, ובקבוצת הערות היא עלתה. השאלה "מה קרה לאורך הזמן" מקבלת תשובה שונה לכל קבוצה.`)}`,q:"q15"},
  {h:"מה קרה לזיכרון",html:`${fig("results","הביצוע ירד בשתי הקבוצות, אבל פחות אצל מי שישן")}${tiles([["doc","סיפורים","ירידה בשתי הקבוצות, אבל <b>גדולה יותר בלי תנומה</b>. אינטראקציה מובהקת"],["link","זוגות מילים","ירידה מובהקת <b>רק</b> בקבוצה בלי התנומה. אינטראקציה מובהקת"],["copies","רשימת מילים","שתי הקבוצות ירדו באותה מידה. <b>אין</b> אינטראקציה"]])}`,q:"q17"},
  {h:"למידה חדשה וזיהוי",html:`<p>במבחן החוזר הוצגה <b>רשימה חדשה</b> (רשימה B) כדי לבדוק <mark>למידה חדשה</mark>. לא נמצא הבדל בין הקבוצות. גם ב<b>מבחן הזיהוי</b> לא היה הבדל.</p>${yn(["שליפה חופשית של סיפורים","שליפה עם רמז של זוגות מילים","ירידה בישנוניות"],["רשימת מילים","למידה חדשה","זיהוי"])}${rem("במילים פשוטות: התנומה <b>הגנה</b> על מה שכבר נלמד (ובעיקר על חומר עם קשרים ומשמעות), אבל לא עזרה ללמוד דברים חדשים.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"bulb",title:"דיון, מגבלות ומסקנה",blocks:[
  {h:"מה התוצאות אומרות",html:`${def("על מה הנושא",`מה המשמעות של התוצאות, ואיפה הן מוגבלות?<br><b>מה נלמד כאן:</b> פירוש התוצאות · אסוציאטיבי מול פריטים · מגבלות · מסקנה`)}<p>זה היה <b>ניסוי השדה הראשון</b> שהראה השפעה של תנומה אצל מתבגרים. ההשפעה הופיעה למרות משתנים שלא נשלטו בחדרי הפנימייה.</p>${tiles([["clock","שעה אחרי הצהריים","תואמת לשקע הטבעי בערנות, ולכן התנומה טבעית יותר בזמן הזה"],["moon","בלי לפגוע בלילה","תנומה של עד שעה כנראה לא מאחרת את ההירדמות בלילה"],["building","בלי לשנות שעות","אפשרות מעשית במקום להתחיל את הלימודים מאוחר יותר"]])}${ex("לתלמידים עצמם הייתה עמדה חיובית לגבי שילוב תנומה בסדר היום.")}`,q:"q21"},
  {h:"אסוציאטיבי מול פריטים, ומה עם REM",html:`<p>התנומה עזרה בשליפה של <b>קשרים</b> (סיפורים, זוגות מילים), אבל לא בזיהוי של <b>פריטים בודדים</b>. לפי מחקר fMRI, אלה תהליכים נפרדים במוח:</p>${tiles([["link","למידה אסוציאטיבית",`מערבת יותר את <mark>ההיפוקמפוס</mark> ${E("Hippocampus")}`],["copies","למידה של פריטים","מערבת יותר אזורים <b>אנטורינליים ופרה-היפוקמפליים</b>"]])}<p>זו ראיה עקיפה לכך שאיחוד הזיכרון בשינה מערב את ההיפוקמפוס.</p>${rem("<b>למה לא הייתה השפעה על למידה חדשה?</b> מחקר קודם מצא שהיתרון ללמידה חדשה קשור לכמות <b>שנת REM</b> בתנומה. שעה אחת לא מספיקה כדי ששנת REM תופיע.")}`,q:"q23"},
  {h:"מגבלות ומסקנה",html:`${tiles([["x","אין מדד אובייקטיבי","לא השתמשו בפוליסומנוגרפיה או אקטיגרפיה, רק בדיווח עצמי. אורך התנומה לא נרשם"],["building","סביבה לא נשלטת","חדרי המעונות עלולים להיות שונים זה מזה"],["people","רוב בנות","מגביל הכללה לבנים (גם בבית הספר היו יותר בנות)"],["copies","בדיקה קבוצתית","מקשה להכליל למצבי בדיקה אחרים"]])}${rem("<b>שימו לב:</b> אם מישהו מהקבוצה \"הערה\" נרדם בלי לדווח, זה דווקא היה <b>מקטין</b> את ההבדל. כלומר, ההשפעה האמיתית אולי גדולה יותר.")}${def("המסקנה",`הזדמנות לתנומה ביום <b>תומכת באיחוד זיכרון דקלרטיבי</b> אצל מתבגרים. כדאי לבחון שילוב תנומות בסדר היום של בתי הספר.`)}`,q:"q25"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"חוקרת רוצה לבדוק את השערת איחוד הזיכרון בשינה. מה ההשוואה הנכונה?","a":"שינה מול ערות, באותו פרק זמן אחרי הלמידה","w":["לילה של שינה מול לילה של שינה קצרה, בלי למידה","למידה בבוקר מול למידה בערב, בלי מדידת שינה","אנשים שישנים הרבה מול אנשים שישנים מעט בדרך כלל"],"e":"ההשערה טוענת ששינה מגינה על זיכרון יותר מערות, ולכן משווים שינה לערות באותו פרק זמן אחרי הלמידה. השוואה בין מי שישנים הרבה למי שישנים מעט ״בדרך כלל״ לא בודקת מה קורה אחרי למידה מסוימת."},{"q":"מה הרעיון המרכזי מאחורי ״עיבוד מחדש לא מקוון״?","a":"בזמן השינה המוח מעבד ומארגן זיכרונות","w":["בזמן השינה המוח מוחק מידע מיותר בלבד","בזמן השינה לומדים מידע חדש מהסביבה","בזמן השינה הזיכרון מושבת לגמרי ומתאושש"],"e":"״עיבוד מחדש לא מקוון״ הוא הרעיון שבזמן השינה המוח ממשיך לעבד ולארגן זיכרונות שנלמדו קודם. בשינה לא לומדים מידע חדש מהסביבה, והזיכרון לא מושבת."}]},
"q2":{"t":"t1","v":[{"q":"תלמיד לומד לרכוב על אופניים, ותלמידה לומדת תאריכים היסטוריים. איזה סוג זיכרון כל אחד מפעיל?","a":"אופניים: פרוצדורלי. תאריכים: דקלרטיבי","w":["אופניים: דקלרטיבי. תאריכים: פרוצדורלי","שניהם: זיכרון עבודה","אופניים: זיכרון עבודה. תאריכים: פרוצדורלי"],"e":"רכיבה על אופניים היא ידע של ״איך עושים״, כלומר זיכרון פרוצדורלי. תאריכים הם ידע שאפשר לנסח במילים, כלומר זיכרון דקלרטיבי. המסיח הראשון מחליף ביניהם."},{"q":"באיזה סוג זיכרון עוסק המחקר הזה?","a":"דקלרטיבי מילולי","w":["פרוצדורלי מוטורי","זיכרון עבודה חזותי","זיכרון רגשי"],"e":"סיפורים, זוגות מילים ורשימת מילים הם ידע שאפשר לנסח במילים, ולכן המחקר עוסק בזיכרון דקלרטיבי מילולי. לא נבדקו מיומנויות מוטוריות."}]},
"q3":{"t":"t1","v":[{"q":"סטודנטית למדה רשימת מילים, ואז שמעה רשימה אחרת שבלבלה אותה. לפי המאמר, מה השינה הייתה עושה?","a":"מקטינה את הפגיעה של המידע המפריע","w":["מוחקת את הרשימה השנייה מהזיכרון","מגבירה את הבלבול בין הרשימות","לא משפיעה, כי מדובר בזיכרון מילולי"],"e":"לפי המאמר, שינה מגינה על הזיכרון מפני הפרעה, כלומר מקטינה את הפגיעה של מידע חדש שמבלבל. היא לא מוחקת את הרשימה השנייה."},{"q":"מה מצאו מחקרי fMRI על לילה של שינה?","a":"עלייה בפעילות באזורי הלמידה, שקשורה לשיפור בביצוע","w":["ירידה בפעילות בכל אזורי המוח בזמן השינה","פעילות רק באזורים של חלומות ושל רגש","אין הבדל בפעילות המוחית בין שינה לערות"],"e":"מחקרי fMRI מצאו שאחרי לילה של שינה הפעילות באזורים שהשתתפו בלמידה עולה, והעלייה קשורה לשיפור בביצוע. זה תומך ברעיון שהשינה ממשיכה את הלמידה."}]},
"q4":{"t":"t1","v":[{"q":"איזה ממצא מחולדות תומך בהשערת איחוד הזיכרון?","a":"גנים של איחוד זיכרון וגמישות מוחית מתבטאים יותר בשינה","w":["חולדות שישנו פחות למדו מהר יותר מהאחרות","חולדות זכרו טוב יותר כשנמנעה מהן שינה","לא נמצא קשר בין שינה לביטוי גנים אצל חולדות"],"e":"גנים שקשורים לאיחוד זיכרון ולגמישות מוחית מתבטאים יותר בזמן השינה. זו עדות ברמה הגנטית שתומכת בהשערה. חולדות שנמנעה מהן שינה דווקא זכרו פחות טוב."},{"q":"מה מבדיל ״הפרעה״ (Interference) משכחה רגילה?","a":"מידע חדש שנכנס אחרי הלמידה פוגע בזכירה","w":["הזיכרון נמחק לבד עם הזמן","המידע לא נקלט מלכתחילה","הזיכרון נפגע בגלל עייפות בזמן הלמידה"],"e":"בהפרעה, מידע חדש שנכנס אחרי הלמידה פוגע בזכירה של המידע הקודם. זה לא דעיכה עם הזמן, אלא ״דריסה״ של הישן בידי החדש."}]},
"q5":{"t":"t2","v":[{"q":"מתבגר ישראלי ישן 7 שעות בלילה. לפי המאמר, איך זה ביחס להמלצה?","a":"פחות מההמלצה של 8 עד 10 שעות","w":["בדיוק לפי ההמלצה","יותר מההמלצה","תלוי רק בגיל המדויק שלו"],"e":"ההמלצה למתבגרים היא 8 עד 10 שעות שינה, ו-7 שעות זה פחות מזה. המאמר מדגיש שמחסור בשינה אצל מתבגרים הוא הכלל ולא היוצא מן הכלל."},{"q":"מה מראים הנתונים מארה״ב, הונג קונג, יפן וקוריאה?","a":"מתבגרים בכל המדינות ישנים פחות מהמומלץ","w":["רק בקוריאה יש מחסור בשינה","מתבגרים באסיה ישנים יותר מבארה״ב","בכל המדינות מתבגרים ישנים כמומלץ"],"e":"בכל המדינות שנבדקו, מתבגרים ישנים פחות מהמומלץ: כ-7.5 שעות בארה״ב, ורק כ-5.4 בקוריאה. מתבגרים באסיה דווקא ישנים פחות, לא יותר."}]},
"q6":{"t":"t2","v":[{"q":"נערה ״משלימה שינה״ בשבת עד 12 בצהריים. לפי המאמר, למה זה מחמיר את הבעיה?","a":"פחות אור בבוקר מאחר את שעון השינה עוד יותר","w":["כי השינה בשבת עמוקה מדי ומבלבלת את הגוף","כי היא שוכחת את מה שלמדה במהלך השבוע","כי זה מגביר אצלה את הצורך בקפאין"],"e":"שינה עד הצהריים מורידה את החשיפה לאור בבוקר, וזה מאחר את השעון הביולוגי עוד יותר. כך נוצר מעגל: שינה קצרה בשבוע, השלמה בסוף שבוע, ושוב איחור בהירדמות."},{"q":"מה מראה מחקר הפנימייה עם 5 שעות שינה בלילה?","a":"הנזק לזיכרון נמשך גם אחרי לילות התאוששות","w":["לילה אחד של השלמה מתקן את כל הנזק","מחסור בשינה פוגע רק בערנות","מחסור בשינה לא פוגע בזיכרון חזותי"],"e":"במחקר הפנימייה, אחרי כמה לילות של 5 שעות שינה, גם שני לילות של שינת התאוששות לא תיקנו את הנזק לזיכרון. לכן ״לילה אחד של השלמה מתקן הכל״ שגוי."}]},
"q7":{"t":"t2","v":[{"q":"למה התנומה במחקר נקבעה דווקא לשעות אחר הצהריים?","a":"כדי שתתאים לשקע הטבעי בערנות","w":["כי אז התלמידים עייפים מהאוכל","כי זו השעה היחידה שבה הייתה הפסקה","כי בבוקר אסור לישון בפנימייה"],"e":"אחר הצהריים יש שקע טבעי בערנות, חלק מהקצב הצירקדי, ולכן קל יותר להירדם. ההסבר אינו ״עייפות מהאוכל״."},{"q":"מה מצאו מחקרים קודמים על שינת לילה לעומת תנומה?","a":"השפעה דומה על איחוד הזיכרון","w":["תנומה עדיפה תמיד על שינת לילה","שינת לילה בלבד מאחדת זיכרון","תנומה פוגעת באיחוד הזיכרון"],"e":"מחקרים קודמים מצאו ששינת לילה ותנומה משפיעות באופן דומה על איחוד הזיכרון. זה מה שמצדיק לבדוק תנומה כחלופה מעשית."}]},
"q8":{"t":"t2","v":[{"q":"למה החוקרים לא פשוט המליצו לתלמידים לישון יותר בלילה?","a":"כי קשה להגדיל שינת לילה, וחינוך לשינה לא מחזיק","w":["כי שינת לילה לא משפיעה על הזיכרון","כי התלמידים כבר ישנו מספיק בלילה","כי ההורים התנגדו לשינוי בשעות"],"e":"לחץ לימודי ורשתות חברתיות מקשים להאריך את שינת הלילה, ותוכניות לחינוך לשינה משפרות רק לזמן קצר. לכן חיפשו פתרון אחר. התלמידים לא ישנו מספיק, ולכן המסיח השני שגוי."},{"q":"איך המאמר מציע לראות תנומה ביום?","a":"ככלי עזר, לא כתחליף ללילה","w":["כתחליף מלא לשינת הלילה","כפתרון לכל בעיות השינה","כבזבוז של זמן לימודים"],"e":"המאמר רואה בתנומה כלי עזר שמקטין את הנזקים של מחסור כרוני בשינה, ולא תחליף לשינת לילה. הוא לא טוען שהיא פותרת את כל בעיות השינה."}]},
"q9":{"t":"t3","v":[{"q":"מה היה חדש במחקר הזה?","a":"ראשון שבדק תנומה וזיכרון מילולי אצל מתבגרים בסביבה טבעית","w":["ראשון שבדק את השפעת השינה על זיכרון באופן כללי","ראשון שבדק מתבגרים במעבדת שינה מבוקרת","ראשון שהשתמש בפוליסומנוגרפיה בתוך בית ספר"],"e":"החידוש הוא השילוב: תנומה, מתבגרים, סביבה טבעית (פנימייה) וזיכרון מילולי. כבר נעשו מחקרים על שינה וזיכרון, ולכן זה לא ״המחקר הראשון על שינה וזיכרון״."},{"q":"למה חשוב לבדוק דווקא זיכרון מילולי?","a":"כי רוב ההוראה בכיתה מילולית","w":["כי הוא הקל ביותר למדידה במחקר","כי הוא לא מושפע משינה בכלל","כי מתבגרים טובים בו במיוחד"],"e":"רוב ההוראה בכיתה היא מילולית, ולכן ממצא על זיכרון מילולי רלוונטי ישירות ללמידה בבית הספר. זיכרון מילולי דווקא כן מושפע משינה, וזה מה שנבדק."}]},
"q10":{"t":"t3","v":[{"q":"מי מהבאים היה מוחרג מהמחקר?","a":"תלמיד עם לקות קריאה","w":["תלמידה בת 17","תלמיד שישן 6 שעות בלילה","תלמידה שגרה בפנימייה"],"e":"לקות שפה או קריאה הייתה קריטריון החרגה, כי היא פוגעת בביצוע במשימות מילוליות בלי קשר לשינה. 6 שעות שינה בלילה לא היו סיבה להחריג. רוב המתבגרים ישנים פחות מהמומלץ."},{"q":"למה הוחרגו תלמידים עם לקות שמיעה?","a":"כי המשימות הוקראו בקול","w":["כי הם ישנים יותר מאחרים","כי הם לא גרו בפנימייה","כי הם מתקשים להירדם"],"e":"המשימות הוקראו בקול, ולכן קושי בשמיעה היה פוגע בביצוע בלי קשר לשינה. ההחרגה נועדה למנוע הסבר חלופי לתוצאות."}]},
"q11":{"t":"t3","v":[{"q":"למה התאימו את הקבוצות לפי גיל, מין וישנוניות לפני החלוקה האקראית?","a":"כדי שהקבוצות יהיו דומות לפני הטיפול","w":["כדי לבדוק הבדלי מגדר בשינה","כדי שהקבוצות יהיו בגדלים שונים","כדי שרק הישנוניים יקבלו תנומה"],"e":"כשהקבוצות דומות בגיל, במין ובישנוניות לפני הניסוי, אפשר לייחס את ההבדל שנמצא אחריו לתנומה. לא רצו קבוצות בגדלים שונים או לבדוק הבדלי מגדר."},{"q":"למה ביקשו מהתלמידים לא להשתמש באסטרטגיות זיכרון בין המבחנים?","a":"כדי שההבדל יבטא את השינה, לא את התרגול","w":["כדי שהמבחן החוזר יהיה קשה יותר","כדי לבדוק את האינטליגנציה של התלמידים","כדי שהתלמידים לא יירדמו בזמן המבחן"],"e":"אם תלמידים היו חוזרים על החומר בין המבחנים, ההבדל היה יכול לנבוע מהתרגול ולא מהשינה. לכן ביקשו מהם לא להשתמש באסטרטגיות זיכרון."}]},
"q12":{"t":"t3","v":[{"q":"מה עשתה הקבוצה ללא תנומה בזמן שהקבוצה האחרת ישנה?","a":"פעילויות שקטות לבד","w":["למדה את החומר שוב","שיחקה ספורט בחוץ","ישנה בחדר אחר בלי דיווח"],"e":"הקבוצה ללא תנומה עשתה פעילויות שקטות לבד, ולא חזרה על החומר. כך ההבדל העיקרי בין הקבוצות הוא השינה עצמה."},{"q":"למה ביקשו מהתלמידים להימנע מקפאין 24 שעות לפני הניסוי?","a":"כי קפאין משפיע על הערנות ועל ההירדמות","w":["כי קפאין משפר זיכרון מילולי","כי קפאין אסור לפי תקנון הפנימייה","כי קפאין משפיע בעיקר על הבנות"],"e":"קפאין משפיע על הערנות ועל היכולת להירדם, ולכן היה מבלבל את מדידת הישנוניות ואת התנומה. המסיח ״קפאין משפר זיכרון מילולי״ לא הסיבה שצוינה."}]},
"q13":{"t":"t3","v":[{"q":"למה השתמשו ב-CASQ רק בהתחלה, וב-SSS פעמיים?","a":"CASQ מודד ישנוניות כללית, SSS ישנוניות ברגע","w":["CASQ מודד זיכרון, SSS מודד ישנוניות","CASQ ארוך מדי, ולכן מילאו אותו פעם אחת","SSS מודד ישנוניות כללית, CASQ ברגע"],"e":"CASQ מודד ישנוניות כללית לאורך זמן, ולכן שימש להתאמת הקבוצות בהתחלה. SSS מודד ישנוניות ברגע מסוים, ולכן נמדד פעמיים כדי לראות שינוי. המסיח האחרון הופך ביניהם."},{"q":"במערך 2×2, איזה משתנה הוא בין־נבדקי?","a":"קבוצה (תנומה מול ערות)","w":["זמן (בסיס מול חוזר)","סוג המשימה","גיל המשתתף"],"e":"כל משתתף שייך לקבוצה אחת בלבד, תנומה או ערות, ולכן ״קבוצה״ הוא משתנה בין־נבדקי. ״זמן״ (בסיס מול חוזר) נמדד אצל כל משתתף, ולכן הוא תוך־נבדקי."}]},
"q14":{"t":"t3","v":[{"q":"״סירה–טלפון״: שומעים ״סירה״ וצריך להשלים ״טלפון״. איזו משימה זו ומה היא בודקת?","a":"זוגות מילים: שליפה עם רמז של קשר","w":["רשימת מילים: זיהוי של פריטים בודדים","שליפת סיפורים: שליפה חופשית של טקסט","רשימת מילים: שליפה חופשית בלי רמז"],"e":"שומעים מילה אחת וצריך לשלוף את המילה שהוצמדה אליה, וזה זוגות מילים: שליפה עם רמז של קשר, כלומר למידה אסוציאטיבית. ברשימת מילים זוכרים פריטים בלי רמז."},{"q":"מה מבדיל את משימת ״רשימת המילים״ (RAVLT) מ״זוגות המילים״?","a":"ברשימה זוכרים פריטים בודדים, בזוגות קשרים","w":["ברשימה זוכרים קשרים, בזוגות פריטים","ברשימה יש סיפור, בזוגות אין","אין הבדל, שתיהן בודקות אותו דבר"],"e":"ברשימת המילים זוכרים פריטים בודדים, ובזוגות המילים זוכרים קשרים בין מילים. ההבדל הזה מסביר בדיון למה התנומה עזרה רק בחלק מהמשימות."}]},
"q15":{"t":"t4","v":[{"q":"למה הוציאו מהניתוח את 4 התלמידים שלא נרדמו?","a":"כי הם לא קיבלו בפועל את ״הטיפול״","w":["כי הם לא מילאו את השאלונים","כי הם הפריעו לאחרים לישון","כי הם קיבלו ציונים חריגים"],"e":"מי שלא נרדם לא קיבל בפועל את ״הטיפול״, השינה, ולכן לא מייצג את קבוצת התנומה. הם לא הוצאו בגלל ציונים חריגים."},{"q":"כמה משתתפים נשארו בניתוח הסופי?","a":"33","w":["39","20","45"],"e":"39 תלמידים התחילו את המחקר. 4 לא נרדמו ו-2 לא חזרו למבחן השני, ולכן נשארו 33 בניתוח הסופי."}]},
"q16":{"t":"t4","v":[{"q":"בקבוצת התנומה הישנוניות ירדה, ובקבוצה השנייה עלתה. איך נקרא דפוס כזה בניתוח?","a":"אינטראקציה זמן × קבוצה","w":["אפקט עיקרי של זמן","אפקט עיקרי של קבוצה","אפקט רצפה בישנוניות"],"e":"כשהשינוי לאורך הזמן שונה בין הקבוצות (ירידה מול עלייה), זו אינטראקציה זמן × קבוצה. אפקט עיקרי של זמן היה שינוי דומה בשתי הקבוצות."},{"q":"אם הייתה רק ירידה כללית בזיכרון בשתי הקבוצות באותה מידה, מה היינו מוצאים?","a":"אפקט עיקרי של זמן, בלי אינטראקציה","w":["אינטראקציה מובהקת זמן × קבוצה","אפקט עיקרי של קבוצה בלבד","אפקט של תנומה על הזיכרון"],"e":"ירידה דומה בשתי הקבוצות היא אפקט עיקרי של זמן, בלי אינטראקציה, כי הקבוצה לא שינתה את מה שקרה לאורך הזמן. זה בדיוק מה שנמצא ברשימת המילים."}]},
"q17":{"t":"t4","v":[{"q":"במשימת הסיפורים שתי הקבוצות ירדו, אבל פחות אצל מי שישן. מה המשמעות?","a":"התנומה הגנה על הזיכרון מפני שכחה","w":["התנומה שיפרה את הזיכרון מעל הבסיס","התנומה לא השפיעה בכלל","התנומה פגעה בזיכרון"],"e":"שתי הקבוצות ירדו, אבל מי שישן ירד פחות, ולכן התנומה הגנה על הזיכרון מפני שכחה. היא לא שיפרה אותו מעל הבסיס."},{"q":"במשימת זוגות המילים, איפה הייתה ירידה מובהקת?","a":"רק בקבוצה בלי התנומה","w":["רק בקבוצת התנומה","בשתי הקבוצות באותה מידה","באף אחת מהקבוצות"],"e":"בזוגות המילים הייתה ירידה מובהקת רק בקבוצה בלי התנומה, ובקבוצת התנומה הזיכרון נשמר. זו אינטראקציה מובהקת."}]},
"q18":{"t":"t4","v":[{"q":"ברשימת המילים שתי הקבוצות ירדו באותה מידה. מה זה מראה?","a":"התנומה לא הגנה על זכירת פריטים בודדים","w":["התנומה שיפרה זכירת פריטים בודדים","שהמשימה הייתה קלה מדי","שהקבוצות לא היו דומות בבסיס"],"e":"ירידה זהה בשתי הקבוצות מראה שהתנומה לא הגנה על זכירה של פריטים בודדים. הקבוצות היו דומות בבסיס, ולכן זה לא ההסבר."},{"q":"בשתי משימות מתוך שלוש התנומה עזרה. מה המשותף להן?","a":"שתיהן מבוססות על קשרים","w":["שתיהן בודקות זיהוי","שתיהן חזותיות בעיקרן","שתיהן קצרות מאוד"],"e":"סיפורים וזוגות מילים מבוססים על קשרים בין פריטים, ובהם התנומה עזרה. ברשימת מילים, שבה זוכרים פריטים בודדים, היא לא עזרה."}]},
"q19":{"t":"t4","v":[{"q":"תלמיד מקבוצת התנומה לומד רשימה חדשה במבחן החוזר. לפי הממצאים, האם יצליח יותר מתלמיד שלא ישן?","a":"לא, לא נמצא הבדל","w":["כן, הרבה יותר מהאחר","כן, אבל רק בזיהוי","לא, הוא יצליח פחות"],"e":"לא נמצא הבדל בלמידה של רשימה חדשה בין הקבוצות. התנומה הגנה על מה שכבר נלמד, אבל לא שיפרה את היכולת ללמוד חומר חדש."},{"q":"איזה משפט מסכם נכון את התוצאות?","a":"התנומה הגנה על חומר עם קשרים, לא על למידה חדשה","w":["התנומה שיפרה כל סוג של זיכרון","התנומה שיפרה בעיקר למידה חדשה","התנומה לא השפיעה על אף מדד"],"e":"התנומה הגנה על חומר שמבוסס על קשרים (סיפורים וזוגות מילים), אבל לא שיפרה למידה חדשה. לכן ״שיפרה כל סוג זיכרון״ שגוי."}]},
"q20":{"t":"t4","v":[{"q":"ציון הישנוניות בבסיס היה כ-3 עד 3.5 מתוך 7. איך לפרש אותו?","a":"ישנוניות מוגברת, אבל לא קלינית","w":["ערנות מלאה ומקסימלית","ישנוניות קיצונית וסכנה","ציון לא תקין שצריך להוציא"],"e":"ציון של 3 עד 3.5 מתוך 7 בסולם SSS הוא ישנוניות מוגברת, ״ער אבל רגוע״, אבל לא ברמה קלינית. ציון של ישנוניות קיצונית היה קרוב ל-7."},{"q":"למה חשוב שהקבוצות לא נבדלו בגיל, במין, בשעות שינה ובישנוניות?","a":"כדי לייחס את ההבדלים לתנומה","w":["כדי שהמחקר יהיה קצר יותר","כדי שהתוצאות יתאימו לבנים","כדי לבדוק את ההשפעה של המין"],"e":"כשהקבוצות דומות בגיל, במין, בשעות השינה ובישנוניות, ההבדלים שנמצאו לא נובעים מהמשתנים האלה, ואפשר לייחס אותם לתנומה. זה מחזק את המסקנה הסיבתית."}]},

for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
