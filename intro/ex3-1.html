 {q:"מה מצא מחקר הפנימייה על שבוע של 5 שעות שינה בלילה?",a:"הוא פגע בזיכרון חזותי, והפגיעה נמשכה גם אחרי שני לילות התאוששות",w:["הפגיעה נעלמה אחרי לילה אחד","הוא לא פגע בזיכרון","הוא שיפר את זיכרון העבודה"],e:"הנזק של מחסור כרוני לא נעלם מהר."}]},
q7:{t:"t2",v:[

q8:{t:"t2",v:[

q9:{t:"t3",v:[
 {q:"מה היה חדש במחקר הזה?",a:"הוא הראשון שבדק בסביבה טבעית את השפעת התנומה על זיכרון מילולי אצל מתבגרים",w:["הוא הראשון שבדק שינה אצל בני אדם","הוא הראשון שבדק שינה במעבדה","הוא הראשון שבדק זיכרון אצל מבוגרים"],e:"הדגש: סביבה טבעית (פנימייה) + זיכרון מילולי + מתבגרים."},
 {q:"למה החוקרים בחרו לבדוק דווקא זיכרון מילולי?",a:"כי רוב ההוראה בכיתה מועברת במילים",w:["כי קל יותר למדוד אותו במעבדת שינה","כי זיכרון חזותי לא מושפע משינה","כי מתבגרים לא זוכרים תמונות"],e:"זיכרון מילולי רלוונטי מאוד ללמידה בבית הספר."}]},
q10:{t:"t3",v:[

 {q:"מי מהבאים לא היה יכול להשתתף במחקר?",a:"תלמיד עם הפרעת שינה",w:["תלמידה בת 16","תלמיד שגר בפנימייה","תלמידה ששותה קפה בדרך כלל"],e:"הפרעת שינה, מצב רפואי, לקות שפה וליקוי ראייה או שמיעה היו קריטריוני החרגה."}]},
q11:{t:"t3",v:[

q12:{t:"t3",v:[

q13:{t:"t3",v:[

 {q:"במערך 2×2 של המחקר, \"זמן\" (בסיס מול חוזר) הוא משתנה:",a:"תוך-נבדקי",w:["בין-נבדקי","תלוי","מתערב"],e:"כל משתתף נבדק בשני הזמנים. הקבוצה היא המשתנה הבין-נבדקי."}]},
q14:{t:"t3",v:[

 {q:"למה כל המשימות הוקראו בקול לכל הקבוצה?",a:"כדי לדמות את מה שקורה בשיעור בבית הספר",w:["כי לא היו מחשבים","כי התלמידים לא ידעו לקרוא","כדי שהמשימות יהיו קלות יותר"],e:"זה מחזק את התוקף האקולוגי של המחקר."}]},
q15:{t:"t4",v:[

q16:{t:"t4",v:[
 {q:"מה קרה לישנוניות (SSS) מהבסיס למבחן החוזר?",a:"בקבוצת התנומה ירדה באופן מובהק, ובקבוצה השנייה עלתה אבל לא באופן מובהק",w:["ירדה בשתי הקבוצות באותה מידה","עלתה בקבוצת התנומה","לא השתנתה בכלל"],e:"זו אינטראקציה של זמן × קבוצה."},
 {q:"מה המשמעות של אינטראקציה מובהקת בין זמן לקבוצה?",a:"השינוי לאורך הזמן היה שונה בין הקבוצות",w:["שתי הקבוצות השתנו באותה מידה","אחת הקבוצות לא השתתפה בשני המבחנים","הזמן לא השפיע בכלל"],e:"ההשפעה של משתנה אחד תלויה ברמה של משתנה אחר."}]},
q17:{t:"t4",v:[
 {q:"מה נמצא במשימת הסיפורים?",a:"ירידה בשתי הקבוצות, אבל גדולה יותר אצל מי שלא ישן",w:["שיפור רק בקבוצת התנומה","ירידה רק בקבוצת התנומה","אין הבדל בין הקבוצות"],e:"התנומה לא מנעה שכחה, אבל הקטינה אותה."},
 {q:"במשימת זוגות המילים, באיזו קבוצה הייתה ירידה מובהקת?",a:"רק בקבוצה בלי התנומה",w:["רק בקבוצת התנומה","בשתי הקבוצות באותה מידה","באף קבוצה"],e:"בקבוצת התנומה הירידה לא הייתה מובהקת."}]},
q18:{t:"t4",v:[
 {q:"מה נמצא בשליפה החופשית של רשימת המילים (רשימה A)?",a:"שתי הקבוצות ירדו, בלי אינטראקציה",w:["רק קבוצת התנומה השתפרה","רק הקבוצה בלי התנומה ירדה","שתי הקבוצות השתפרו"],e:"כאן התנומה לא נתנה יתרון."},
 {q:"בשתי משימות מתוך שלוש, התנומה עזרה. באילו?",a:"סיפורים וזוגות מילים",w:["רשימת מילים וזוגות מילים","סיפורים ורשימת מילים","בכל שלוש המשימות"],e:"ברשימת המילים לא נמצאה אינטראקציה."}]},
q19:{t:"t4",v:[
 {q:"מה נמצא לגבי למידה חדשה (רשימה B)?",a:"לא היה הבדל בין הקבוצות",w:["קבוצת התנומה למדה הרבה יותר","הקבוצה בלי התנומה למדה יותר","אף אחד לא הצליח ללמוד"],e:"התנומה הגנה על מה שכבר נלמד, לא עזרה ללמוד חדש."},
 {q:"איזה משפט מסכם נכון את תוצאות הזיכרון?",a:"התנומה הגנה על חומר שכבר נלמד, בעיקר חומר עם קשרים, אבל לא שיפרה למידה חדשה או זיהוי",w:["התנומה שיפרה את כל סוגי הזיכרון","התנומה פגעה בזיכרון","התנומה עזרה רק בזיהוי"],e:"זה הדפוס המרכזי של התוצאות."}]},
q20:{t:"t4",v:[
 {q:"מה מראה ציון הישנוניות בבסיס (כ-3 עד 3.5 מתוך 7)?",a:"ערניות של \"ער אבל רגוע\", כלומר ישנוניות מוגברת אבל לא קלינית",w:["ישנוניות קיצונית","ערנות מלאה","שהתלמידים ישנו במבחן"],e:"החוקרים מציינים שזה גבוה במיוחד במצב מבחן, שבדרך כלל מעורר."},
 {q:"האם הקבוצות היו שונות לפני הניסוי בשעות השינה או בישנוניות?",a:"לא, לא נמצאו הבדלים מובהקים",w:["כן, קבוצת התנומה ישנה הרבה פחות","כן, בקבוצת התנומה היו רק בנים","כן, הקבוצה בלי תנומה הייתה צעירה יותר"],e:"זה מחזק את המסקנה שההבדלים נבעו מהתנומה."}]},
q21:{t:"t5",v:[
 {q:"למה החוקרים חושבים שתנומה אחרי הצהריים היא תזמון טוב?",a:"כי היא תואמת לשקע הטבעי בערנות, ולכן תנומה טבעית יותר אז",w:["כי זו השעה שבה אין שיעורים","כי בבוקר אסור לישון","כי בערב המוח לא לומד"],e:"השקע קשור לשינויי טמפרטורת הגוף והקצב הצירקדי."},
 {q:"האם תנומה של עד שעה צפויה לפגוע בשינת הלילה, לפי המאמר?",a:"כנראה שלא",w:["כן, היא תמיד מאחרת את ההירדמות","כן, אבל רק אצל בנות","המאמר לא מתייחס לזה"],e:"מחקר קודם של המעבדה מצא שגם עד 90 דקות לא פגעו בשינת הלילה."}]},
q22:{t:"t5",v:[
 {q:"מה היתרון המעשי של תנומות על פני דחיית שעת תחילת הלימודים?",a:"אין צורך בשינוי לוגיסטי גדול של סדר היום בבית הספר",w:["תנומות זולות יותר משינה בלילה","תנומות מחליפות שינת לילה","תנומות משפרות למידה חדשה"],e:"זו אחת המסקנות המעשיות בדיון."},
 {q:"מה המשמעות של ניסוי שדה (במקום מעבדה)?",a:"התוצאות מתאימות יותר למציאות, כלומר תוקף אקולוגי גבוה יותר",w:["שליטה מלאה בכל המשתנים","אין צורך בקבוצת ביקורת","המדגם תמיד גדול יותר"],e:"המחיר: פחות שליטה במשתנים כמו תנאי החדרים."}]},
q23:{t:"t5",v:[
 {q:"איך החוקרים מסבירים שהתנומה עזרה בשליפת קשרים אבל לא בזיהוי פריטים?",a:"למידה אסוציאטיבית מערבת את ההיפוקמפוס, ולמידה של פריטים מערבת אזורים אחרים",w:["כי מבחן הזיהוי היה קל מדי","כי פריטים בודדים נשכחים תמיד","כי התלמידים לא הקשיבו לרשימה"],e:"וזו ראיה עקיפה לכך שאיחוד הזיכרון בשינה מערב את ההיפוקמפוס."},
 {q:"איזה מבנה מוחי מעורב יותר בלמידה אסוציאטיבית, לפי המאמר?",a:"ההיפוקמפוס",w:["האמיגדלה","המוחון","האונה העורפית"],e:"פריטים בודדים מערבים יותר אזורים אנטורינליים ופרה-היפוקמפליים."}]},
q24:{t:"t5",v:[
 {q:"למה התנומה לא שיפרה למידה חדשה?",a:"כי שעה לא מספיקה כדי ששנת REM תופיע, והיתרון ללמידה חדשה קשור ל-REM",w:["כי התלמידים היו עייפים מדי","כי רשימה B הייתה קשה מדי","כי שינה פוגעת בלמידה חדשה"],e:"מחקר קודם קשר את היתרון ללמידה חדשה לכמות שנת REM."},
 {q:"איזה שלב שינה קשור, לפי מחקר קודם, ליתרון בלמידה חדשה?",a:"שנת REM",w:["שלב ההירדמות","שינה קלה בלבד","שלב ההתעוררות"],e:"ובתנומה של שעה REM כנראה לא הופיע."}]},
q25:{t:"t5",v:[
 {q:"מהי המגבלה העיקרית שהחוקרים מציינים?",a:"לא היה מדד אובייקטיבי לשינה, רק דיווח עצמי",w:["המדגם היה גדול מדי","לא הייתה קבוצת ביקורת","הניסוי נעשה במעבדה"],e:"לא השתמשו בפוליסומנוגרפיה או אקטיגרפיה, ואורך התנומה לא נרשם."},
 {q:"אם חלק מהקבוצה \"הערה\" נרדם בלי לדווח, מה זה היה עושה לתוצאות?",a:"מקטין את ההבדל בין הקבוצות, ולכן ההשפעה האמיתית אולי גדולה יותר",w:["מגדיל את ההבדל בצורה מלאכותית","הופך את התוצאות","לא משנה דבר"],e:"זה היה מטה את התוצאות לכיוון \"אין הבדל\"."}]},
q26:{t:"t5",v:[
 {q:"למה העובדה שרוב המשתתפים היו בנות היא מגבלה?",a:"היא מגבילה את ההכללה לבנים",w:["כי בנות לא ישנות ביום","כי זה הפך את המחקר ללא אקראי","כי בנות זוכרות פחות"],e:"החוקרים מציינים שגם בבית הספר היו יותר בנות."},
 {q:"מה המסקנה של המאמר?",a:"תנומה ביום תומכת באיחוד זיכרון דקלרטיבי אצל מתבגרים, וכדאי לבחון שילוב שלה בבתי ספר",w:["תנומה צריכה להחליף את שינת הלילה","תנומה משפרת את כל סוגי הלמידה","אין טעם לשנות דבר בבתי ספר"],e:"זו המסקנה בסוף המאמר."}]}
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
