const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

 {id:"t1",icon:"brain",title:"תחושה מול תפיסה",blocks:[
  {h:"פינת הרחוב",html:`${def("על מה הנושא",`מה ההבדל בין לקלוט גירוי לבין להבין אותו, וכמה חזק גירוי צריך להיות כדי שנרגיש אותו.<br><b>מה נלמד כאן:</b> תחושה · התמרה · סף מוחלט · סף הבדל · חוק ובר`)}${ex("הפרק נפתח בפינת רחוב: מכוניות ואנשים זזים, נגן רחוב מנגן, צופר רחוק, ריח של אוכל מדוכן, והמדרכה הקשה מתחת לרגליים. נקרא לאדם שעומד שם <b>יואב</b>, ונחזור אליו לאורך הלומדה.")}${def("תחושה",`${E("Sensation")} <b>קולטנים</b> (נוירונים מיוחדים) מזהים גירוי. זה הצד ה<b>פיזי</b> של החוויה.`)}${def("התמרה",`${E("Transduction")} הפיכת האנרגיה של הגירוי (אור, קול, ריח) ל<b>פוטנציאלי פעולה</b> שעוברים למערכת העצבים המרכזית.`)}${def("תפיסה",`${E("Perception")} ארגון, פירוש וחוויה מודעת של המידע החושי. זה הצד ה<b>פסיכולוגי</b>.`)}${ex("יואב מריח קינמון: זו <b>תחושה</b>. הוא נזכר בעוגה של סבתא: זו <b>תפיסה</b>.")}`,q:"q1"},
  {h:"ספים",html:`${def("סף מוחלט",`${E("Absolute threshold")} העוצמה <b>המינימלית</b> של גירוי שמזהים ב־<b>50%</b> מהפעמים. החושים רגישים מאוד: בלילה בהיר אפשר אולי לזהות להבת נר מכ־50 ק״מ, ובשקט מוחלט תקתוק שעון מכ־6 מטרים.`)}${def("תת־סיפי",`${E("Subliminal")} גירוי מתחת לסף המודעות: נקלט, אבל לא שמים לב אליו. במעבדה הוא משפיע מעט, אבל ל״מסרים נסתרים״ יש השפעה קטנה מאוד על התנהגות בחיים.`)}${def("סף הבדל",`${E("Just noticeable difference, JND")} השינוי ה<b>קטן ביותר</b> בין שני גירויים שאפשר להבחין בו. הוא <b>משתנה עם עוצמת הגירוי</b>.`)}${def("חוק ובר",`${E("Weber's law")} סף ההבדל הוא <b>חלק קבוע</b> (יחס) מהגירוי המקורי.`)}${ex("מסך טלפון שנדלק באולם קולנוע חשוך בולט מיד, אבל באצטדיון מואר כמעט לא שמים לב אליו. אותו שינוי, גירוי בסיס שונה.")}`,q:"q3"},
  {h:"מלמטה למעלה ומלמעלה למטה",html:`${tiles([["data","עיבוד מלמטה למעלה","מונע על ידי <b>הגירוי</b>. רעש של זכוכית נשברת במסעדה רועשת תופס את תשומת הלב","התפיסה מתחילה מהגירוי עצמו ״עולה״ למוח. משהו חזק, בולט או פתאומי תופס אותנו גם כשלא חיפשנו אותו.","יואב עומד בפינת הרחוב ומדבר בטלפון, וצפירה פתאומית של אמבולנס גורמת לו להסתובב מיד."],["target","עיבוד מלמעלה למטה","מונע על ידי <b>ידע וציפיות</b>. מחפשים מפתחות עם מחזיק צהוב, ולכן סורקים חפצים צהובים במקומות הגיוניים","התפיסה מתחילה מהידע והציפיות שלנו ״יורדת״ אל מה שרואים. אנחנו מחפשים ומפרשים לפי מה שאנחנו מצפים לראות.","יואב מחכה לחבר עם חולצה אדומה, ולכן כל כתם אדום ברחוב ״קופץ״ לו, ואנשים בצבעים אחרים כמעט לא נקלטים."]])}${def("הסתגלות חושית",`${E("Sensory adaptation")} גירוי קבוע מפסיק להיות מורגש, אף שהקולטנים עדיין קולטים אותו. יואב כבר לא שומע את רעש התנועה אחרי כמה דקות.`)}${def("עיוורון קשב",`${E("Inattentional blindness")} לא רואים גירוי גלוי לגמרי כי הקשב במקום אחר. בניסוי של <b>סימונס וצ׳אבריס</b> (1999) ספרו מסירות של הקבוצה הלבנה, וכמעט <b>חצי</b> לא ראו אדם בתחפושת גורילה שעבר במשך 9 שניות.`)}${def("תורת זיהוי האות",`${E("Signal detection theory")} היכולת לזהות אות משמעותי בתוך ״רעש״ רקע. <b>מוטיבציה והקשר</b> משפיעים עליה: אמא מתעוררת ממלמול שקט של התינוק, אבל לא מרעשים אחרים.`)}`,q:"q5"},
  {h:"תפיסה מושפעת מהניסיון",html:`<p>התפיסה מושפעת מ<b>ניסיון, תרבות, אישיות וציפיות</b>:</p>${tiles([["building","תרבות ואשליה","אנשים מערביים רגישים יותר לאשליית <b>מילר־לייר</b> (קווים שווים נראים שונים). הסבר: עולם ״מרובע״ של בניינים. הזולו, שגרים בבקתות עגולות, פחות רגישים לה"],["leaf","טעם וציפייה","מי שיש לו יחס חיובי למזון דל שומן מדרג אותו כטעים יותר"],["moon","ניסיון מוקדם","מי שלא היה לו ניסיון בראייה בשתי עיניים בתקופה קריטית מתקשה בתפיסת עומק"]])}${rem("תחושה דומה פחות או יותר אצל כולם. תפיסה יכולה להיות שונה מאוד בין אנשים.")}`,q:"q7"}

 {id:"t2",icon:"chart",title:"גלים: אור וקול",blocks:[
  {h:"התכונות של גל",html:`${def("על מה הנושא",`אור וקול נעים כגלים, והתכונות של הגל קובעות מה נחווה.<br><b>מה נלמד כאן:</b> משרעת · אורך גל · תדירות · הספקטרום · גובה צליל ועוצמה`)}${fig("wave37")}${tiles([["chart","משרעת","הגובה של הגל. באור קובעת <b>בהירות</b>, בקול <b>עוצמה</b>","משרעת היא כמה ״גבוה״ הגל. באור היא קובעת כמה בהיר נראה האור, ובקול כמה חזק נשמע הצליל.","כשמגבירים את הרמקול, הגלים נעשים גבוהים יותר (משרעת גדולה), והשיר נשמע חזק יותר, בלי שהצליל עצמו משתנה."],["split","אורך גל","המרחק בין שיא לשיא. באור קובע <b>צבע</b>","המרחק בין שיא אחד של גל לשיא הבא. באור, אורך הגל קובע איזה צבע נראה.","אור עם גלים ארוכים נראה אדום, ואור עם גלים קצרים נראה כחול או סגול."],["clock","תדירות","כמה גלים עוברים בשנייה, נמדד ב<b>הרץ</b> (Hz). בקול קובעת <b>גובה צליל</b>","תדירות היא כמה גלים עוברים בשנייה. בקול היא קובעת אם הצליל נשמע גבוה (תדירות גבוהה) או נמוך (תדירות נמוכה).","הצפצוף של שעון מעורר הוא צליל גבוה, כי התדירות שלו גבוהה. רעם הוא צליל נמוך, כי התדירות שלו נמוכה."]])}${rem("גל <b>ארוך</b> = תדירות <b>נמוכה</b>. גל <b>קצר</b> = תדירות <b>גבוהה</b>.")}`,q:"q9"},
  {h:"אור וקול במספרים",html:`${def("הספקטרום האלקטרומגנטי",`כל הקרינה סביבנו: גמא, רנטגן, אולטרה סגול, אור נראה, אינפרא אדום, מיקרוגל ורדיו. אנחנו רואים רק חלק קטן: <b>האור הנראה</b>, בערך <b>380 עד 740 ננומטר</b>. דבורים רואות אולטרה סגול, וחלק מהנחשים מזהים אינפרא אדום.`)}${def("קול",`בני אדם שומעים <b>20 עד 20,000 הרץ</b>, ורגישים ביותר באמצע הטווח. כלבים וחתולים שומעים גבוה יותר. <b>גובה צליל</b> קשור לתדירות; <b>עוצמה</b> קשורה למשרעת ונמדדת ב<b>דציבלים</b>. <b>גוון</b> ${E("Timbre")} הוא מה שמבדיל בין כלי נגינה שמנגנים אותו צליל.`)}<div class="tw"><table><tr><th>צליל</th><th>בערך</th></tr><tr><td>שיחה רגילה</td><td>60 דציבל</td></tr><tr><td>תנועה כבדה בעיר</td><td>85, נזק אפשרי אחרי 8 שעות</td></tr><tr><td>אוזניות בעוצמה מלאה</td><td>100–105, נזק אחרי 15 דקות</td></tr><tr><td>סף כאב (מטוס ממריא)</td><td>130</td></tr></table></div>${rem("כשליש מאובדן השמיעה נגרם מחשיפה לרעש.")}`,q:"q11"}

 {id:"t3",icon:"target",title:"ראייה",blocks:[
  {h:"מבנה העין",html:`${def("על מה הנושא",`איך אור הופך לתמונה במוח.<br><b>מה נלמד כאן:</b> מבנה העין · קנים ומדוכים · הנקודה העיוורת · שני מסלולים`)}<p>האור עובר דרך ה<b>קרנית</b>, ה<b>אישון</b> (שגודלו נשלט על ידי ה<b>קשתית</b>) וה<b>עדשה</b>, שממקדת אותו על ה<b>גומה המרכזית</b> ${E("Fovea")} שבתוך ה<b>רשתית</b>.</p><div class="tw"><table><tr><th></th><th>מדוכים (Cones)</th><th>קנים (Rods)</th></tr><tr><td>איפה</td><td>מרוכזים בגומה המרכזית</td><td>בשאר הרשתית</td></tr><tr><td>באיזה אור</td><td>אור חזק</td><td>אור חלש</td></tr><tr><td>מה נותנים</td><td>פרטים <b>וצבע</b></td><td>תנועה בשוליים, בלי צבע</td></tr></table></div>${ex("יואב נכנס מהרחוב המואר לאולם קולנוע חשוך ולא רואה כלום כמה רגעים. העין עוברת מעבודה של מדוכים לעבודה של קנים, וזה לוקח זמן.")}`,q:"q13"},
  {h:"מהעין למוח",html:`<ul><li>הקנים והמדוכים מתחברים לתאי <b>גנגליון</b>, שהאקסונים שלהם יוצרים את <b>עצב הראייה</b>.</li><li>במקום שבו העצב יוצא אין קולטנים: <b>הנקודה העיוורת</b>. לא שמים לב אליה כי הנקודה של כל עין במקום אחר, והמוח ״משלים״.</li><li>בהצטלבות הראייה ${E("Optic chiasm")} המידע מ<b>שדה הראייה הימני</b> עובר לצד <b>השמאלי</b> של המוח, ולהפך.</li><li>המידע מגיע ל<b>אונה העורפית</b>, ומשם בשני מסלולים: <b>״מה״</b> (זיהוי עצם) ו<b>״איפה/איך״</b> (מיקום ותנועה).</li></ul>${ex("כדור מתגלגל לכיוון יואב: מסלול ״מה״ מזהה שזה כדור, ומסלול ״איפה״ עוקב אחרי המיקום שלו כדי שיוכל לעצור אותו.")}${def("האבל וויזל",`זכו בנובל ב־1981 על מחקר ראייה, בעיקר בחתולים וקופים. מצאו תאים שמגיבים לקווים בכיוון מסוים. בגורי חתולים, עין שנתפרה בתקופה קריטית ״איבדה״ את השטח שלה במוח לטובת העין הפתוחה.`)}`,q:"q15"}
 ]},
 {id:"t4",icon:"copies",title:"צבע ועומק",blocks:[
  {h:"שתי תיאוריות צבע",html:`${def("על מה הנושא",`איך רואים צבעים, ואיך רואים עומק מתמונה שטוחה.<br><b>מה נלמד כאן:</b> תלת־צבעית · תהליך מנוגד · עיוורון צבעים · רמזי עומק`)}<div class="tw"><table><tr><th></th><th>תיאוריה תלת־צבעית</th><th>תיאוריית התהליך המנוגד</th></tr><tr><td>הרעיון</td><td>שלושה סוגי מדוכים: אדום, ירוק וכחול</td><td>הצבע מקודד בזוגות: שחור־לבן, צהוב־כחול, ירוק־אדום</td></tr><tr><td>איפה פועלת</td><td>ברשתית</td><td>אחרי שהאות יוצא מהרשתית</td></tr><tr><td>מה מסבירה</td><td>איך שלושה מדוכים יוצרים כל צבע</td><td>למה אין ״ירוק־אדמדם״, ו<b>תמונות שאריתיות</b></td></tr></table></div>${rem("שתי התיאוריות <b>לא סותרות</b>: כל אחת מתארת שלב אחר.")}${ex("תמונה שארית: מסתכלים 30–60 שניות על דגל ירוק, ואז על דף לבן, ורואים אותו באדום.")}`,q:"q17"},
  {h:"עיוורון צבעים ותפיסת עומק",html:`${def("עיוורון צבעים",`הנפוץ ביותר הוא <b>אדום־ירוק</b>, ותורשתי דרך כרומוזום X. לכן הוא שכיח הרבה יותר אצל גברים (כ־8% מהגברים ממוצא אירופי) מאשר אצל נשים. בודקים במבחן <b>אישיהרה</b> (מספרים מוסתרים בנקודות).`)}${tiles([["copies","רמזים דו־עיניים","דורשים שתי עיניים. <b>פער דו־עיני</b>: כל עין רואה תמונה קצת שונה. סרטי תלת־ממד מנצלים את זה","המוח משווה בין שתי התמונות, מכל עין, ומהפער ביניהן מחשב כמה רחוק נמצא העצם. כשסוגרים עין אחת, הרמז הזה נעלם.","כשמחזיקים אצבע מול הפנים וסוגרים כל פעם עין אחרת, האצבע ״קופצת״. ככה המוח יודע שהיא קרובה."],["target","רמזים חד־עיניים","עובדים עם עין אחת, ולכן רואים עומק גם בציור. <b>פרספקטיבה קווית</b> (קווים מקבילים מתכנסים), <b>חפיפה</b>, גודל יחסי. יש יותר רמזים כאלה","רמזים שמספיקה להם עין אחת, ולכן גם צייר יכול ליצור עומק על דף שטוח: קווים שמתכנסים, עצם שמסתיר עצם אחר, ועצם שנראה קטן ולכן רחוק.","בתמונה של מסילת רכבת, שתי המסילות נראות מתקרבות באופק, ולכן אנחנו ״רואים״ שהמסילה ממשיכה רחוק."]])}${ex("ברוס ברידג׳מן נולד עם עין עצלה קשה ולא ראה עומק. ב־2012, בגיל קרוב ל־70, בסרט תלת־ממד, הוא פתאום ראה עומק, וזה נשאר.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"phone",title:"שמיעה",blocks:[
  {h:"מבנה האוזן",html:`${def("על מה הנושא",`איך קול הופך לשמיעה, איך יודעים מאיפה הוא מגיע, ומה קורה כשהשמיעה נפגעת.<br><b>מה נלמד כאן:</b> מבנה האוזן · גובה צליל · מיקום קול · אובדן שמיעה`)}<div class="tw"><table><tr><th>חלק</th><th>מה יש בו</th></tr><tr><td>אוזן חיצונית</td><td>האפרכסת, תעלת השמע ו<b>עור התוף</b></td></tr><tr><td>אוזן תיכונה</td><td>שלוש <b>עצמות השמע</b>: פטיש, סדן וארכוף</td></tr><tr><td>אוזן פנימית</td><td>ה<b>שבלול</b> (מלא נוזל, עם תאי שערה) והתעלות החצי־מעגליות (שיווי משקל)</td></tr></table></div><p>הקול מרטיט את עור התוף ← העצמות זזות ← הארכוף לוחץ על החלון הסגלגל ← הנוזל בשבלול זז ← <b>תאי השערה</b> על <b>הקרום הבסיסי</b> מגורים ← עצב השמע ← התלמוס ← <b>קורטקס השמיעה באונה הרקתית</b>.</p>${ex("נגן הרחוב פורט מיתר. התנודה של האוויר עוברת את כל השרשרת הזו באוזן של יואב, והוא שומע מנגינה.")}`,q:"q21"},
  {h:"גובה צליל ומיקום",html:`<div class="tw"><table><tr><th>תיאוריה</th><th>הרעיון</th><th>המגבלה</th></tr><tr><td><b>זמנית</b></td><td>גובה הצליל מקודד ב<b>קצב הירי</b> של הנוירונים</td><td>נוירונים לא יורים מהר מספיק לכל הטווח עד 20,000 הרץ</td></tr><tr><td><b>מקום</b></td><td>אזורים שונים של הקרום הבסיסי מגיבים לתדירויות שונות: הבסיס לגבוהות, הקצה לנמוכות</td><td></td></tr></table></div><p><b>השילוב:</b> עד כ־4,000 הרץ שתיהן פועלות; מעל זה רק המקום.</p>${tiles([["phone","רמזים חד־אוזניים","צורת האפרכסת ״מסננת״ את הקול. עוזר לדעת אם הוא מלמעלה, מלמטה, מלפנים או מאחור"],["copies","רמזים דו־אוזניים","<b>הבדל בעוצמה</b> (הראש מחליש את הקול לאוזן הרחוקה) ו<b>הבדל בזמן</b> בין האוזניים. מראים ימין או שמאל","המוח משווה מה כל אוזן שומעת: הקול חזק יותר ומגיע קצת מוקדם יותר לאוזן הקרובה. כך יודעים אם הקול בא מימין או משמאל.","יואב שומע צפירה, ויודע מיד שהיא מימין, כי האוזן הימנית קלטה אותה חזק יותר ומעט לפני השמאלית."]])}${ex("הצופר נשמע חזק יותר ומוקדם יותר באוזן הימנית של יואב, ולכן הוא מסתובב ימינה.")}`,q:"q23"},
  {h:"אובדן שמיעה",html:`<div class="tw"><table><tr><th>סוג</th><th>מה קורה</th><th>מה עוזר</th></tr><tr><td><b>הולכתי</b></td><td>הקול לא מגיע היטב לשבלול (חסימה, חור בעור התוף, בעיה בעצמות)</td><td>מכשיר שמיעה שמגביר</td></tr><tr><td><b>תחושתי־עצבי</b> (הנפוץ ביותר)</td><td>האות לא עובר מהשבלול למוח (גיל, רעש, זיהומים, תרופות)</td><td>לפעמים <b>שתל שבלול</b> שמגרה ישירות את עצב השמע</td></tr></table></div>${def("מחלת מנייר",`ניוון באוזן הפנימית: אובדן שמיעה, <b>טנטון</b> (צלצול), סחרחורת ולחץ.`)}${def("תרבות החירשים",`לחירשים יש שפה (בארה״ב ASL, שפת סימנים מלאה), בתי ספר ומנהגים. התרבות מעדיפה לשמר את שפת הסימנים על פני דיבור, קריאת שפתיים או שתל.`)}`,q:"q25"}
 ]},
 {id:"t6",icon:"hand",title:"החושים האחרים",blocks:[
  {h:"טעם וריח",html:`${def("על מה הנושא",`טעם, ריח, מגע, כאב, ושלושה חושים שמספרים לנו איפה הגוף שלנו.<br><b>מה נלמד כאן:</b> טעם · ריח · מגע · כאב · שיווי משקל · פרופריוספציה`)}<p>טעם וריח הם <b>חושים כימיים</b>, ויחד הם יוצרים <b>טעם</b> (flavor).</p>${tiles([["leaf","טעם","מתוק, מלוח, חמוץ, מר, ו<b>אומאמי</b> (קשור לגלוטמט). אולי גם שישי: שומן. בלוטות הטעם מתחדשות כל 10–14 ימים","יש חמישה טעמים בסיסיים, ואולי שישי. כל מה שאנחנו מרגישים באוכל מעבר לזה מגיע בעיקר מהשילוב עם הריח.","מרק עוף טעים ״עמוק״ בגלל אומאמי. כשהאף סתום בהצטננות, האוכל נראה כמעט בלי טעם, כי הריח לא משתתף."],["leaf","ריח","קולטנים בקרום הריר בחלק העליון של האף ← <b>בולבוס הריח</b> ← המערכת הלימבית. לכלבים פי 2–3 גנים לקולטני ריח מלבני אדם","הריח מגיע מהאף ישר למערכת הלימבית, שקשורה לרגש ולזיכרון. לכן ריח יכול להחזיר זיכרון ורגש מיד.","יואב מריח ברחוב עוגה שאפו כמו אצל סבתא שלו, ופתאום נזכר בשבתות בילדות ומרגיש התרגשות."]])}${def("פרומונים",`אותות כימיים בין פרטים, לרוב על מצב רבייה. בחולדות הם מושכים זכרים. אצל בני אדם הנושא עדיין <b>שנוי במחלוקת</b>.`)}${ex("הריח מדוכן האוכל ברחוב מגיע ליואב ומעורר זיכרון רגשי, כי מסלול הריח עובר במערכת הלימבית.")}`,q:"q27"},
  {h:"מגע, כאב ומיקום הגוף",html:`<p>בעור יש כמה סוגי קולטנים: גופיפי מייסנר (לחץ קל, רטט איטי), פאצ׳יני (לחץ חולף, רטט מהיר), דיסקיות מרקל (לחץ קל), רופיני (מתיחה), ו<b>קצות עצב חופשיים</b> לטמפרטורה ולזיהוי פגיעה (<b>נוציספציה</b>). המידע מגיע לקורטקס התחושתי באונה הקודקודית.</p><div class="tw"><table><tr><th>כאב דלקתי</th><th>כאב נוירופתי</th></tr><tr><td>מאותת על פגיעה ברקמה</td><td>נובע מפגיעה בנוירונים עצמם, שמגבירה את אותות הכאב</td></tr></table></div>${def("חוסר רגישות מולד לכאב",`מחלה גנטית נדירה: מרגישים חום ולחץ, אבל לא כאב. התוצאה: פציעות קשות וזיהומים, ותוחלת חיים קצרה יותר. זה מראה כמה הכאב <b>מגן</b>.`)}${tiles([["cycle","שיווי משקל","מערכת וסטיבולרית באוזן הפנימית. בעיה בה = מחלת תנועה וסחרחורת","מערכת באוזן הפנימית מרגישה את התנועה והמצב של הראש, ועוזרת לשמור על יציבות. כשהמידע ממנה לא מתאים למה שהעיניים רואות, מקבלים בחילה וסחרחורת.","יואב קורא בספר באוטובוס מתפתל: העיניים רואות דף יציב, האוזן מרגישה תנועה, והוא מתחיל להרגיש בחילה."],["hand","פרופריוספציה","תחושת <b>המיקום</b> של הגוף","החוש שאומר לנו איפה כל חלק בגוף נמצא, בלי להסתכל עליו.","יואב יכול לגעת באף כשהעיניים עצומות, כי המוח יודע איפה היד נמצאת."],["sprout","קינסתזיה","תחושת <b>התנועה</b> של הגוף במרחב","החוש שאומר לנו איך הגוף זז במרחב: כיוון, מהירות ותנועה של הגפיים.","כשיואב עולה במדרגות בחושך, הוא מרגיש את התנועה של הרגליים ומתאים את הצעד, בלי לראות את המדרגות."]])}`,q:"q29"}
 ]},
 {id:"t7",icon:"copies",title:"עקרונות הגשטלט",blocks:[
  {h:"השלם שונה מסכום חלקיו",html:`${def("על מה הנושא",`איך המוח מארגן את מה שהוא קולט לצורות שלמות.<br><b>מה נלמד כאן:</b> גשטלט · דמות ורקע · קרבה · דמיון · רציפות · סגירות · מערך תפיסתי`)}<p><b>מקס ורטהיימר</b> הראה שאנשים רואים תנועה בתמונות סטטיות שמהבהבות מהר. יחד עם <b>קלר וקופקה</b> הוא ייסד את פסיכולוגיית ה<b>גשטלט</b> (״צורה״). הרעיון: <b>השלם שונה מסכום חלקיו</b>. התפיסה מוסיפה מבנה, בדרכים צפויות.</p>${fig("gest37")}<div class="tw"><table><tr><th>עיקרון</th><th>מה זה</th><th>דוגמה</th></tr><tr><td><b>דמות ורקע</b></td><td>מפרידים בין עצם במרכז לבין רקע</td><td>אגרטל או שני פרצופים</td></tr><tr><td><b>קרבה</b></td><td>דברים קרובים נראים כקבוצה</td><td>קריאה בלי רווחים בין מילים</td></tr><tr><td><b>דמיון</b></td><td>דברים דומים נראים כקבוצה</td><td>שחקנים לפי צבע החולצה</td></tr><tr><td><b>רציפות</b></td><td>מעדיפים קווים רציפים וחלקים</td><td>X נראה כשני קווים שנחתכים</td></tr><tr><td><b>סגירות</b></td><td>משלימים צורות חסרות</td><td>עיגול מקווקו נראה עיגול</td></tr></table></div>`,q:"q31"},
  {h:"השערות תפיסתיות ומערך תפיסתי",html:`${def("השערה תפיסתית",`התפיסה נשענת על <b>ניחושים מושכלים</b> שמושפעים מאישיות, ניסיון וציפיות. יחד הם יוצרים <b>מערך תפיסתי</b> ${E("Perceptual set")}: מילה שאומרים לפני דמות דו־משמעית משנה את מה שרואים בה.`)}${def("הטיה ותרבות",`מחקרים מצאו ש<b>הטיה גזעית סמויה</b> משפיעה על התפיסה: משתתפים זיהו נשק מהר יותר כשהוא הופיע ליד תמונה של אדם שחור, ומיהרו יותר ״לירות״ במטרות חמושות שחורות במשחק מחשב.`)}${ex("יואב מחכה לחבר עם מעיל אדום, ו״מזהה״ אותו בכל אדם עם מעיל אדום ברחוב. הציפייה יצרה מערך תפיסתי.")}${rem("זה מסכם את הפרק: <b>תחושה</b> קולטת, ו<b>תפיסה</b> מארגנת ומפרשת, לפי חוקי הגשטלט ולפי מה שאנחנו מצפים לראות.")}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מה ההבדל בין תחושה לתפיסה?","a":"תחושה קולטת גירוי; תפיסה מארגנת ומפרשת אותו","w":["תפיסה קולטת גירוי; תחושה מארגנת ומפרשת אותו בהמשך","תחושה קיימת רק בראייה, ותפיסה בכל שאר החושים","אין הבדל, אלה שני שמות לאותו תהליך"],"e":"תחושה היא הצד הפיזי (קולטנים מזהים גירוי). תפיסה היא הצד הפסיכולוגי (ארגון, פירוש וחוויה מודעת)."},{"q":"יואב מריח קינמון ונזכר בעוגה של סבתא. מה מבין אלה הוא תפיסה?","a":"ההיזכרות בעוגה של סבתא","w":["הקליטה של מולקולות הריח באף","הפיכת הריח לפוטנציאל פעולה בעצב","ההגעה של מולקולות הריח לאף"],"e":"הקליטה וההתמרה הן תחושה. הפירוש והמשמעות (העוגה של סבתא) הם תפיסה."}]},"q2":{"t":"t1","v":[{"q":"מהי התמרה?","a":"הפיכת אנרגיית הגירוי לפוטנציאלי פעולה","w":["הפסקת התגובה לגירוי שנמשך הרבה זמן","ארגון המידע החושי לצורות שלמות במוח","הבחירה במה לשים לב מתוך כל הגירויים"],"e":"התמרה היא השלב שבו אור, קול או ריח הופכים לאות עצבי. הפסקת תגובה לגירוי קבוע היא הסתגלות חושית."}]},"q3":{"t":"t1","v":[{"q":"מהו סף מוחלט?","a":"העוצמה המינימלית שמזהים ב־50% מהפעמים","w":["העוצמה המקסימלית לפני שהגירוי מתחיל לכאוב","השינוי הקטן ביותר שאפשר להבחין בו בין שני גירויים","העוצמה שבה מזהים גירוי בכל הפעמים, בלי יוצא מן הכלל"],"e":"הסף המוחלט מוגדר כעוצמה שמזהים במחצית מהניסיונות. השינוי הקטן בין גירויים הוא סף ההבדל."},{"q":"מה אומר חוק ובר?","a":"סף ההבדל הוא יחס קבוע מהגירוי המקורי","w":["סף ההבדל זהה בכל עוצמה של גירוי, בכל החושים","גירוי תת־סיפי משפיע מאוד על ההתנהגות בחיים","הסף המוחלט שווה אצל כל בני האדם"],"e":"ככל שהגירוי המקורי חזק יותר, צריך שינוי גדול יותר כדי להבחין בו. לכן מסך טלפון בולט בקולנוע חשוך ולא באצטדיון מואר."}]},"q4":{"t":"t1","v":[{"q":"מה הפרק אומר על מסרים תת־סיפיים?","a":"במעבדה מעבדים אותם, אבל בחיים השפעתם קטנה מאוד","w":["הם משנים התנהגות קנייה באופן חזק, עקבי ומוכח","אי אפשר לעבד אותם בשום צורה, גם לא במעבדה","הם עובדים רק כשהם מעל לסף המודעות"],"e":"אנשים יכולים לעבד מידע מחוץ למודעות, אבל ״מסרים נסתרים״ משפיעים מעט מאוד על התנהגות מחוץ למעבדה."}]},"q5":{"t":"t1","v":[{"q":"אדם מחפש מפתחות עם מחזיק צהוב וסורק חפצים צהובים. איזה עיבוד זה?","a":"מלמעלה למטה","w":["מלמטה למעלה","הסתגלות חושית","התמרה"],"e":"החיפוש מונע על ידי ידע וציפייה, ולכן זה עיבוד מלמעלה למטה. רעש פתאומי שתופס קשב הוא מלמטה למעלה."},{"q":"מה מצא ניסוי הגורילה של סימונס וצ׳אבריס?","a":"כמעט חצי מהמשתתפים לא ראו את הגורילה","w":["כל המשתתפים ראו את הגורילה מיד","המשתתפים ראו את הגורילה רק כשלא ספרו","רק מומחים לכדורסל לא ראו את הגורילה"],"e":"המשתתפים ספרו מסירות, והקשב שלהם היה שם. זו דוגמה לעיוורון קשב."}]},"q6":{"t":"t1","v":[{"q":"יואב כבר לא שומע את רעש התנועה אחרי כמה דקות ברחוב. איך קוראים לזה?","a":"הסתגלות חושית","w":["עיוורון קשב","סף מוחלט","עיבוד מלמעלה למטה"],"e":"גירוי קבוע מפסיק להיות מורגש, אף שהקולטנים עדיין קולטים אותו."},{"q":"אמא מתעוררת ממלמול שקט של התינוק אבל לא מרעשים אחרים. איזו תורה מסבירה את זה?","a":"תורת זיהוי האות","w":["חוק ובר על סף ההבדל","התיאוריה התלת־צבעית","תיאוריית המקום בשמיעה"],"e":"תורת זיהוי האות עוסקת בזיהוי אות משמעותי בתוך רעש, ומראה שמוטיבציה והקשר משפיעים עליו."}]},"q7":{"t":"t1","v":[{"q":"למה אנשים מערביים רגישים יותר לאשליית מילר־לייר?","a":"הם גדלים בעולם של בניינים ״מרובעים״","w":["יש להם יותר קולטנים ברשתית","הם רואים פחות טלוויזיה מאחרים","אצלם הראייה בשתי עיניים מתפתחת מאוחר"],"e":"ההסבר הוא ניסיון: עולם עם פינות וקווים ישרים. הזולו, שגרים בבקתות עגולות, פחות רגישים לאשליה."}]},"q8":{"t":"t1","v":[{"q":"מה מלמדות הדוגמאות של תרבות, אישיות וציפייה בפרק?","a":"התפיסה מושפעת מניסיון וממה שמצפים","w":["התחושה שונה לגמרי מאדם לאדם","הקולטנים משתנים לפי התרבות","ציפיות משפיעות רק על טעם ולא על ראייה"],"e":"התחושה דומה אצל רוב האנשים, אבל התפיסה יכולה להיות שונה מאוד לפי ניסיון, תרבות וציפיות."}]},"q9":{"t":"t2","v":[{"q":"באור, מה קובע אורך הגל?","a":"את הצבע","w":["את הבהירות","את העוצמה","את המרחק"],"e":"אורך הגל קובע צבע. המשרעת קובעת בהירות."},{"q":"בקול, מה קובעת התדירות?","a":"את גובה הצליל","w":["את עוצמת הצליל","את הגוון של הכלי","את המיקום של המקור"],"e":"תדירות גבוהה = צליל גבוה. העוצמה תלויה במשרעת."}]},"q10":{"t":"t2","v":[{"q":"מה הק א אין קולטנים, אבל העין השנייה ״מכסה״, והמוח משלים את החסר."},{"q":"מידע משדה הראייה הימני מגיע ל:","a":"הצד השמאלי של המוח","w":["הצד הימני של המוח","שני הצדדים באופן שווה","המוחון בלבד"],"e":"בהצטלבות הראייה המידע עובר לצד הנגדי."}]},"q16":{"t":"t3","v":[{"q":"כדור מתגלגל לכיוון יואב. מה עושה מסלול ״איפה/איך״?","a":"עוקב אחרי המיקום והתנועה של הכדור","w":["מזהה שזה כדור ולא חפץ אחר ברחוב","קובע את הצבע של הכדור לפי המדוכים","ממקד את התמונה על הרשתית"],"e":"מסלול ״מה״ מזהה את העצם, ומסלול ״איפה/איך״ מטפל במיקום, בתנועה ובפעולה מולו."},{"q":"מה מצאו האבל וויזל בגורי חתולים שעין אחת שלהם נתפרה?","a":"האזור של העין הסגורה עבר לעין הפתוחה","w":["העין הסגורה התחזקה מאוד אחרי שנפתחה","לא היה שום שינוי בקורטקס הראייה","שתי העיניים איבדו את הראייה"],"e":"בלי קלט בתקופה קריטית, הקשרים של העין הסגורה אבדו, והמוח הקצה את השטח לעין הפתוחה."}]},"q17":{"t":"t4","v":[{"q":"מה מסבירה תיאוריית התהליך המנוגד שהתיאוריה התלת־צבעית לא מסבירה?","a":"תמונות שאריתיות","w":["את קיומם של שלושה סוגי מדוכים","איך רואים בחושך","את עיוורון הצבעים התורשתי"],"e":"תמונה שארית (דגל ירוק שנראה אדום אחר כך) מוסברת בקידוד בזוגות מנוגדים."},{"q":"מה הקשר בין שתי תיאוריות הצבע?","a":"הן משלימות: כל אחת פועלת בשלב אחר","w":["התהליך המנוגד הפריך את התלת־צבעית","התלת־צבעית הפריכה את התהליך המנוגד","שתיהן פועלות רק ברשתית"],"e":"התלת־צבעית פועלת ברשתית, והתהליך המנוגד אחרי שהאות יוצא ממנה."}]},"q18":{"t":"t4","v":[{"q":"למה עיוורון צבעים אדום־ירוק שכיח יותר אצל גברים?","a":"הוא עובר בתורשה דרך כרומוזום X","w":["לגברים יש פחות קנים ברשתית","הוא נגרם מחשיפה לאור חזק בעבודה","הוא קשור לאונה העורפית הקטנה יותר"],"e":"לגברים יש X אחד, ולכן גן פגום אחד מספיק. לנשים יש שני X."}]},"q19":{"t":"t4","v":[{"q":"למה אפשר לראות עומק בציור על דף שטוח?","a":"בזכות רמזים חד־עיניים כמו פרספקטיבה","w":["בזכות פער דו־עיני בין שתי העיניים","בזכות הקנים שבשולי הרשתית","בזכות התמונה השארית"],"e":"רמזים חד־עיניים (פרספקטיבה קווית, חפיפה, גודל יחסי) עובדים גם בתמונה שטוחה."},{"q":"מה מנצלים סרטי תלת־ממד?","a":"פער דו־עיני","w":["פרספקטיבה קווית","חפיפה בין עצמים","סגירות"],"e":"כל עין מקבלת תמונה קצת שונה, וזה יוצר תחושת עומק."}]},"q20":{"t":"t4","v":[{"q":"מה מלמד המקרה של ברוס ברידג׳מן?","a":"תפיסת עומק יכולה להופיע גם בגיל מבוגר","w":["אי אפשר לראות עומק בלי ניסיון בילדות","עין עצלה לא משפיעה על ראיית עומק","סרטי תלת־ממד פוגעים בראייה"],"e":"הוא לא ראה עומק כמעט 70 שנה, ופתאום ראה בסרט תלת־ממד, והיכולת נשארה."}]},"q21":{"t":"t5","v":[{"q":"איפה נמצאים תאי השערה שמגיבים לקול?","a":"על הקרום הבסיסי בשבלול","w":["בעור התוף שבאוזן החיצונית","בעצמות השמע שבאוזן התיכונה","בתעלות החצי־מעגליות"],"e":"תאי השערה יושבים על הקרום הבסיסי בשבלול. התעלות החצי־מעגליות קשורות לשיווי משקל."},{"q":"איך נקראות שלוש עצמות השמע?","a":"פטיש, סדן וארכוף","w":["קרנית, עדשה ורשתית","אפרכסת, תוף ושבלול","מייסנר, פאצ׳יני ומרקל"],"e":"עצמות השמע באוזן התיכונה מעבירות את הרטט מעור התוף לחלון הסגלגל."}]},"q22":{"t":"t5","v":[{"q":"לאן מגיע בסוף המידע השמיעתי?","a":"לקורטקס השמיעה באונה הרקתית","w":["לקורטקס הראייה באונה העורפית","לקורטקס התחושתי באונה הקודקודית","ישירות למוחון"],"e":"מהשבלול דרך עצב השמע והתלמוס לאונה הרקתית."}]},"q23":{"t":"t5","v":[{"q":"מה המגבלה של התיאוריה הזמנית בשמיעה?","a":"נוירונים לא יורים מהר מספיק לכל הטווח","w":["היא לא מסבירה צלילים נמוכים בכלל, רק גבוהים","היא מתאימה רק לחיות ולא לבני אדם","היא סותרת את כל הממצאים על השבלול"],"e":"קצב הירי מוגבל, ולכן צלילים גבוהים (מעל כ־4,000 הרץ) מקודדים רק לפי מקום."},{"q":"לפי תיאוריית המקום, איזה חלק של הקרום הבסיסי מגיב לצלילים גבוהים?","a":"הבסיס","w":["הקצה","האמצע","כל הקרום באותה מידה"],"e":"הבסיס מגיב לתדירויות גבוהות והקצה לנמוכות."}]},"q24":{"t":"t5","v":[{"q":"איך יואב יודע שהצופר מגיע מימין?","a":"הקול חזק ומוקדם יותר באוזן הימנית","w":["האפרכסת מסננת את הקול שמגיע מלמעלה","התלמוס מבחין בגובה הצליל של הצופר","הקול נשמע רק באוזן אחת"],"e":"רמזים דו־אוזניים (הבדל בעוצמה ובזמן) מראים ימין או שמאל. האפרכסת עוזרת למעלה, למטה, לפנים ולאחור."}]},"q25":{"t":"t5","v":[{"q":"מהו אובדן השמיעה הנפוץ ביותר?","a":"תחושתי־עצבי","w":["הולכתי","מולד","מחלת מנייר"],"e":"אובדן תחושתי־עצבי (האות לא עובר מהשבלול למוח) הוא הנפוץ, וגורמיו גיל, רעש, זיהומים ועוד."},{"q":"למי מכשיר שמיעה שמגביר קול יעזור בדרך כלל?","a":"למי שיש אובדן שמיעה הולכתי","w":["למי שיש אובדן תחושתי־עצבי חמור","למי שעצב השמע שלו נפגע","למי שיש מחלת מנייר"],"e":"באובדן הולכתי הקול לא מגיע טוב לשבלול, וההגברה עוזרת. במקרים עצביים לפעמים צריך שתל שבלול."}]},"q26":{"t":"t5","v":[{"q":"מה עושה שתל שבלול?","a":"מגרה ישירות את עצב השמע","w":["מגביר את הקול לעור התוף","מחליף את עצמות השמע","מתקן את האפרכסת"],"e":"שתל שבלול כולל מיקרופון, מעבד ואלקטרודות שמגרות את עצב השמע ישירות."}]},"q27":{"t":"t6","v":[{"q":"מהו אומאמי?","a":"הטעם החמישי, שקשור לגלוטמט","w":["טעם השומן, שהתגלה ראשון מכולם","הריח של פרומונים אצל בני אדם","סוג של בלוטת טעם"],"e":"מעבר למתוק, מלוח, חמוץ ומר יש אומאמי, ואולי גם טעם של שומן."},{"q":"למה ריח מעורר הרבה פעמים זיכרון רגשי?","a":"מסלול הריח עובר במערכת הלימבית","w":["הריח עובר קודם בקורטקס הראייה","לריח אין קשר לזיכרון בכלל","הריח עובר דרך עצב השמע"],"e":"מבולבוס הריח המידע עובר למערכת הלימבית ולקורטקס הריח, וזה קשור לרגש ולזיכרון."}]},"q28":{"t":"t6","v":[{"q":"מה הפרק אומר על פרומונים אצל בני אדם?","a":"הנושא עדיין שנוי במחלוקת","w":["הוכח שהם קובעים משיכה מינית","הוכח שאין לבני אדם פרומונים","הם פועלים רק דרך הטעם"],"e":"בחולדות הם ברורים, אבל אצל בני אדם המחקר עדיין לא חד־משמעי."}]},"q29":{"t":"t6","v":[{"q":"מה ההבדל בין כאב דלקתי לכאב נוירופתי?","a":"דלקתי מאותת על פגיעה ברקמה; נוירופתי נובע מפגיעה בנוירונים","w":["דלקתי נובע מפגיעה בנוירונים; נוירופתי מאותת על פגיעה ברקמה","דלקתי מופיע רק אצל ילדים, ונוירופתי רק אצל מבוגרים","אין הבדל, אלה שני שמות לאותו כאב"],"e":"כאב דלקתי הוא אות על נזק לרקמה. כאב נוירופתי נובע מנזק לנוירונים, שמגביר את אותות הכאב."},{"q":"מה מלמדת המחלה של חוסר רגישות מולד לכאב?","a":"שהכאב מגן עלינו מפציעות","w":["שאפשר לחיות בלי כאב בלי שום מחיר","שכאב נובע רק מגורמים פסיכולוגיים","שגם חום ולחץ לא מורגשים במחלה"],"e":"בלי כאב נגרמות פציעות קשות וזיהומים, ותוחלת החיים קצרה. חום ולחץ כן מורגשים."}]},"q30":{"t":"t6","v":[{"q":"מהי פרופריוספציה?","a":"תחושת המיקום של הגוף","w":["תחושת התנועה של הגוף במרחב","שיווי המשקל באוזן הפנימית","זיהוי פגיעה ברקמה"],"e":"פרופריוספציה = איפה הגוף. קינסתזיה = התנועה שלו. שיווי משקל = המערכת הווסטיבולרית."}]},"q31":{"t":"t7","v":[{"q":"מה הרעיון המרכזי של פסיכולוגיית הגשטלט?","a":"השלם שונה מסכום חלקיו","w":["התחושה קובעת לבד את מה שנתפס","כל אדם תופס אחרת בלי שום חוקיות","התפיסה היא רק עיבוד מלמטה למעלה"],"e":"התפיסה מוסיפה מבנה לקלט החושי, בדרכים צפויות. מכאן המשפט ״השלם שונה מסכום חלקיו״."},{"q":"עיגול מקווקו נראה לנו כעיגול שלם. איזה עיקרון זה?","a":"סגירות","w":["קרבה","דמיון","דמות ורקע"],"e":"סגירות = נטייה להשלים צורות חסרות."}]},"q32":{"t":"t7","v":[{"q":"אנחנו קוראים טקסט בלי רווחים בקושי. איזה עיקרון זה מדגים?","a":"קרבה","w":["סגירות","רציפות","דמות ורקע"],"e":"הרווחים יוצרים קבוצות של אותיות קרובות. בלי רווחים קשה לקבץ אותן למילים."},{"q":"איזה עיקרון מסביר שאנחנו מקבצים שחקנים לפי צבע החולצה?","a":"דמיון","w":["קרבה","סגירות","רציפות"],"e":"דברים דומים נראים כקבוצה."}]},"q33":{"t":"t7","v":[{"q":"מהו מערך תפיסתי?","a":"ציפיות וניסיון שמשפיעים על מה שנתפס","w":["רשימת חוקי הגשטלט, מסודרת לפי חשיבות","קבוצת הקולטנים של חוש מסוים","המקום במוח שבו מתרחשת התפיסה"],"e":"השערות תפיסתיות (ניחושים מושכלים) יוצרות מערך תפיסתי. למשל, מילה לפני דמות דו־משמעית משנה מה רואים."},{"q":"מה מצאו המחקרים על הטיה גזעית סמויה ותפיסה?","a":"נשק זוהה מהר יותר ליד תמונה של אדם שחור","w":["לא נמצאה שום השפעה של הטיה על התפיסה","הטיה השפיעה רק על שמיעה ולא על ראייה","נשק זוהה לאט יותר ליד כל תמונה של אדם"],"e":"הממצאים מראים שהטיה סמויה משפיעה על מה שאנשים ״רואים״ ועל תגובות מהירות."}]},"q34":{"t":"t7","v":[{"q":"מי ייסד את פסיכולוגיית הגשטלט?","a":"ורטהיימר, קלר וקופקה","w":["האבל, ויזל ולנד","סימונס, צ׳אבריס ומוסט","ובר, פרויד וג׳יימס"],"e":"ורטהיימר הראה תנועה מדומה בתמונות שמהבהבות, ויחד עם קלר וקופקה ייסד את הגישה."}]}};
const H={"h1":{"t":"t1","v":[{"q":"נעמה שומעת שיר ברדיו ומתחילה לבכות, כי הוא הושמע בחתונה של ההורים שלה. החבר שלה שומע אותם צלילים ולא מרגיש כלום. מה ההבדל ביניהם?","a":"התחושה זהה, אבל התפיסה שונה, כי הפירוש תלוי בניסיון","w":["התפיסה זהה, אבל התחושה שונה, כי האוזניים שלהם שונות","גם התחושה וגם התפיסה זהות, ורק הרגש שונה","התחושה שונה, כי לנעמה יש סף שמיעה נמוך יותר"],"e":"תחושה = קליטת הצלילים והפיכתם לאות עצבי. תפיסה = הפירוש והמשמעות, שתלויים בזיכרונות ובניסיון."}]},"h2":{"t":"t1","v":[{"q":"בחדר שקט מוסיפים לנורה חלשה קצת אור, וכולם שמים לב. מוסיפים את אותה כמות אור לחדר מואר מאוד, ואף אחד לא שם לב. מה מסביר את זה?","a":"חוק ובר: השינוי צריך להיות גדול ביחס לגירוי המקורי","w":["סף מוחלט: האור הנוסף חלש מכדי להיקלט בחדר המואר","הסתגלות חושית: בחדר המואר העיניים כבר התרגלו לאור","עיוורון קשב: בחדר המואר הקשב מופנה לדברים אחרים"],"e":"סף ההבדל הוא יחס קבוע מהגירוי. ככל שהגירוי המקורי חזק יותר, צריך שינוי גדול יותר כדי להבחין בו."},{"q":"יש לך תיק שוקל 1 ק״ג, ומישהו מכניס אליו ספר של חצי ק״ג. אחר כך מכניסים את אותו ספר לתיק של 20 ק״ג. מתי תרגיש את ההבדל, ולמה?","a":"בתיק הקל, כי סף ההבדל הוא יחס מהמשקל המקורי","w":["בתיק הכבד, כי משקל גדול מגביר את הרגישות בידיים","בשניהם באותה מידה, כי הספר שוקל בדיוק אותו דבר","באף אחד, כי חצי ק״ג נמצא מתחת לסף המוחלט"],"e":"לפי חוק ובר, אותה תוספת מורגשת רק כשהיא גדולה ביחס לגירוי המקורי. בתיק הכבד היחס קטן מדי."}]},"h3":{"t":"t1","v":[{"q":"בשבוע הראשון בדירה חדשה ליד כביש ראשי, רועי לא מצליח להירדם מהרעש. אחרי חודש הוא כבר לא שומע אותו. מה קרה?","a":"הסתגלות חושית: גירוי קבוע שלא משתנה מפסיק להיות מורגש","w":["עיוורון קשב: הקשב שלו מופנה עכשיו לדברים אחרים בדירה","סף מוחלט: הרעש ירד מתחת לסף כי התרגל אליו","תפיסה מלמעלה למטה: הוא כבר לא מצפה לשמוע את הרעש"],"e":"הסתגלות חושית = הקולטנים מפסיקים להגיב לגירוי קבוע. הרעש לא השתנה, אבל הוא כבר לא ״נכנס״."},{"q":"נהגת מסתכלת בטלפון בצומת, ולא רואה הולך רגל שעובר ממש מולה, למרות שהוא בשדה הראייה שלה. איך נקרא זה?","a":"עיוורון קשב: הקשב שלה מופנה למקום אחר","w":["הסתגלות חושית: היא התרגלה להולכי רגל בצומת","נקודה עיוורת: הולך הרגל היה בדיוק במקום שאין בו קולטנים","סף הבדל: הולך הרגל לא היה שונה מספיק מהרקע"],"e":"כמו בניסוי הגורילה: כשהקשב עסוק במשהו אחר, לא רואים דברים בולטים לגמרי."}]},"h4":{"t":"t1","v":[{"q":"במסעדה רועשת אריאל לא שומע על מה מדברים בשולחן ליד, אבל ברגע שמישהו שם אומר ״אריאל״, הוא מסתובב. מה מתאר המקרה?","a":"זיהוי אות: גירוי חשוב מזוהה בתוך רעש","w":["סף מוחלט: השם שלו נאמר בעוצמה גבוהה מספיק","הסתגלות חושית: הוא התרגל לרעש ושמע רק את השם","חוק ובר: השם היה שונה מספיק מרעש הרקע"],"e":"זיהוי אות = לזהות גירוי משמעותי בתוך ״רעש״. השם שלנו חשוב לנו, ולכן הוא ״קופץ״ מתוך המהומה."}]},"h5":{"t":"t1","v":[{"q":"את מחכה לחברה עם כובע צהוב, ובמשך כמה שניות את ״רואה״ אותה בכל אדם עם כובע צהוב. איזה עיבוד פועל כאן?","a":"מלמעלה למטה: הציפייה והידע שלך מכוונים את התפיסה","w":["מלמטה למעלה: הגירוי הצהוב החזק תופס לבד את הקשב","הסתגלות חושית: העיניים התרגלו לצבע הצהוב ברחוב","זיהוי אות: הצבע הצהוב חזק מספיק כדי לעבור את הסף"],"e":"בעיבוד מלמעלה למטה, מה שאנחנו מצפים לו ויודעים משפיע על מה שאנחנו רואים. כך נוצר גם ״מערך תפיסתי״."}]},"h6":{"t":"t2","v":[{"q":"מגבירים את העוצמה ברמקול בלי לשנות את השיר. איזו תכונה של גל הקול השתנתה?","a":"המשרעת, ולכן הקול נשמע חזק יותר","w":["התדירות, ולכן הקול נשמע חזק יותר","אורך הגל, ולכן הצליל נשמע גבוה יותר","הגוון, ולכן הכלי נשמע שונה מקודם"],"e":"בקול, משרעת = עוצמה (דציבל), ותדירות = גובה הצליל. הגברה משנה רק את המשרעת."},{"q":"פסנתר וגיטרה מנגנים בדיוק את אותו צליל באותה עוצמה, ובכל זאת מזהים מי זה מי. מה מאפשר את זה?","a":"הגוון, שמבדיל בין מקורות קול זהים בגובה","w":["המשרעת, שמבדילה בין כלים באותו גובה צליל","התדירות, שמבדילה בין כלים באותה עוצמה","אורך הגל, שקובע מאיזה כיוון הקול מגיע"],"e":"גוון הוא מה שנותן לכל כלי ״צבע״ משלו, גם כשהגובה והעוצמה זהים."}]},"h7":{"t":"t2","v":[{"q":"נער שומע מוזיקה באוזניות בעוצמה מלאה, שעה כל יום. מה הספר מזהיר שעלול לקרות?","a":"נזק לשמיעה, שבעוצמה כזו מופיע אחרי 15 דקות","w":["שום נזק, כי נזק לשמיעה נגרם רק מעל סף הכאב","נזק רק אחרי 8 שעות ביום, כמו בתנועה כבדה","נזק רק לאוזן אחת, כי הקול מגיע אליה מוקדם יותר"],"e":"אוזניות בעוצמה מלאה מגיעות ל־100–105 דציבל, ונזק יכול להופיע כבר אחרי 15 דקות. כשליש מאובדן השמיעה נגרם מרעש."}]},"h8":{"t":"t3","v":[{"q":"בלילה, כשמסתכלים ישר על כוכב חלש הוא נעלם, וכשמסתכלים קצת הצידה רואים אותו. למה?","a":"בשוליים יש קנים, שרגישים לאור חלש; במרכז יש בעיקר מדוכים","w":["במרכז יש קנים, שרגישים לאור חלש; בשוליים יש מדוכים","הכוכב נופל בדיוק על הנקודה העיוורת כשמסתכלים עליו ישר","העדשה ממקדת אור חלש רק כשמסתכלים מהצד"],"e":"הגומה המרכזית מלאה במדוכים, שצריכים אור חזק. הקנים, שעובדים באור חלש, נמצאים בשולי הרשתית."},{"q":"נכנסים מיום שמשי לקולנוע חשוך, ובהתחלה לא רואים כלום. אחרי כמה דקות כבר רואים את המושבים, אבל בלי צבעים ברורים. למה?","a":"עברנו לראות בקנים, שעובדים באור חלש בלי צבע","w":["המדוכים התרגלו לחושך, והם לא רגישים לצבע","האישון התכווץ, ולכן נכנס פחות אור צבעוני","הנקודה העיוורת גדלה בחושך ומסתירה את הצבעים"],"e":"מדוכים = צבע ופרטים באור חזק. קנים = אור חלש, בלי צבע. לוקח זמן עד שהקנים ״נכנסים לפעולה״."}]},"h9":{"t":"t3","v":[{"q":"אדם עם פגיעה במסלול ״איפה/איך״ במוח מזהה כוס שמונחת לפניו, אבל מתקשה להושיט יד ולתפוס אותה. מה זה מראה?","a":"זיהוי עצמים ומיקום ותנועה מעובדים במסלולים נפרדים","w":["עצב הראייה נפגע, ולכן המידע לא מגיע לאונה העורפית","המדוכים נפגעו, ולכן הוא לא רואה את פרטי הכוס","הצטלבות הראייה נפגעה, ולכן הוא רואה רק חצי שדה"],"e":"מהאונה העורפית יוצאים שני מסלולים: ״מה?״ (זיהוי) ו״איפה/איך?״ (מיקום ותנועה). פגיעה באחד משאירה את השני."}]},"h10":{"t":"t4","v":[{"q":"בוהים דקה בדגל עם פס ירוק, ואז מסתכלים על קיר לבן ורואים פס אדום. איזו תיאוריה מסבירה את זה?","a":"תיאוריית התהליך המנוגד: ירוק ואדום הם זוג מנוגד","w":["התיאוריה התלת־צבעית: שלושה סוגי מדוכים מתעייפים","תיאוריית המקום: כל צבע מעובד במקום אחר ברשתית","התיאוריה הזמנית: צבע מקודד לפי קצב הירי"],"e":"תמונה שארית מוסברת בתהליך המנוגד: אחרי עייפות של ״ירוק״, ה״אדום״ המנוגד לו מקבל זמנית את הבכורה."}]},"h11":{"t":"t4","v":[{"q":"ציור נוף על דף שטוח נראה עמוק: פסי רכבת נפגשים באופק, ועץ אחד מסתיר חלק מבית. אילו רמזים יוצרים את העומק?","a":"רמזים חד־עיניים: פרספקטיבה קווית וחפיפה","w":["רמזים דו־עיניים: הפער בין התמונות בשתי העיניים","רמזים דו־עיניים: פרספקטיבה קווית וחפיפה","רמזים חד־עיניים: הפער בין התמונות בשתי העיניים"],"e":"בתמונה שטוחה שתי העיניים רואות אותו דבר, ולכן העומק נוצר מרמזים חד־עיניים בלבד."},{"q":"איך עובדים משקפי תלת־ממד בקולנוע?","a":"כל עין רואה תמונה מעט שונה, והמוח מחשב עומק מהפער","w":["הם מגדילים את התמונה, וכך היא נראית קרובה יותר","הם מוסיפים פרספקטיבה קווית שלא קיימת בסרט עצמו","הם מסתירים חלקים מהתמונה, וכך נוצרת חפיפה"],"e":"זה הפער הדו־עיני, רמז דו־עיני לעומק: המוח משתמש בהבדל בין התמונות בשתי העיניים כדי לחשב מרחק."}]},"h12":{"t":"t5","v":[{"q":"אמבולנס עובר מצד ימין של רינה. איך היא יודעת שהוא מימין?","a":"הקול מגיע לאוזן הימנית מוקדם יותר וחזק יותר","w":["הקול מגיע לאוזן השמאלית מוקדם יותר וחזק יותר","צורת האפרכסת מראה לה את הכיוון ימין או שמאל","גובה הצליל של הצופר שונה בכל אחת מהאוזניים"],"e":"רמזים דו־אוזניים (הבדלי זמן ועוצמה בין האוזניים) אומרים ימין או שמאל. האפרכסת עוזרת למעלה/למטה ולפנים/אחור."}]},"h13":{"t":"t5","v":[{"q":"לפי תיאוריית המקום, צליל גבוה מאוד (10,000 הרץ) מפעיל איזה חלק של הקרום הבסיסי?","a":"את הבסיס של הקרום","w":["את הקצה של הקרום","את כל הקרום באופן שווה","את האמצע של הקרום"],"e":"בתיאוריית המקום: בסיס הקרום = צלילים גבוהים, הקצה = צלילים נמוכים. מעל כ־4,000 הרץ רק המקום מסביר את הגובה."},{"q":"למה התיאוריה הזמנית לבדה לא מספיקה כדי להסביר שמיעה של צלילים גבוהים מאוד?","a":"נוירונים לא יורים מהר מספיק כדי ״לעקוב״ אחריהם","w":["צלילים גבוהים לא מגיעים בכלל לשבלול באוזן הפנימית","צלילים גבוהים מעובדים רק בצד אחד של המוח","צלילים גבוהים נקלטים בעור ולא בתאי השערה"],"e":"עד כ־4,000 הרץ שתי התיאוריות פועלות יחד. מעל זה קצב הירי לא מספיק, ורק המקום על הקרום מסביר."}]},"h14":{"t":"t5","v":[{"q":"לסבא יש עור תוף פגוע, והקול לא מגיע כראוי לשבלול. איזה סוג אובדן שמיעה זה, ומה יעזור?","a":"אובדן הולכתי; מכשיר שמיעה יכול לעזור","w":["אובדן תחושתי־עצבי; מכשיר שמיעה יכול לעזור","אובדן הולכתי; רק שתל שבלול יכול לעזור","אובדן תחושתי־עצבי; אין שום טיפול אפשרי"],"e":"הולכתי = הקול לא מגיע לשבלול, ומכשיר שמיעה מגביר אותו. תחושתי־עצבי (הנפוץ) = האות לא עובר למוח, ולפעמים מתאים שתל שבלול."}]},"h15":{"t":"t6","v":[{"q":"ריח של עוגיות מחזיר לליאור זיכרון חי ומרגש מהבית של סבתא. למה דווקא ריח עושה את זה כל כך חזק?","a":"הריח מגיע ישירות למערכת הלימבית, של רגש וזיכרון","w":["מידע הריח עובר קודם באונה העורפית, של ראייה","קולטני הריח מתחדשים כל 10 ימים ושומרים זיכרונות","הריח נקלט בבלוטות הטעם, ששומרות זיכרונות ילדות"],"e":"בולבוס הריח מחובר ישירות למערכת הלימבית, ולכן ריחות מעוררים זיכרונות רגשיים חזקים."}]},"h16":{"t":"t6","v":[{"q":"ילד שנולד בלי יכולת להרגיש כאב נפצע שוב ושוב ולא שם לב. מה המקרה מלמד על כאב?","a":"הכאב מגן עלינו, כי הוא מזהיר מפני פגיעה","w":["הכאב מיותר, כי אפשר לזהות פגיעה בראייה","הכאב נלמד, כי ילדים לומדים מתי לכאוב","הכאב תלוי רק בתרבות שבה גדלים"],"e":"אנשים עם חוסר רגישות מולד לכאב סובלים מפציעות וזיהומים וחיים פחות. זה מראה את התפקיד המגן של הכאב."},{"q":"בעיניים עצומות את נוגעת בקצה האף בלי לפספס. איזה חוש מאפשר את זה?","a":"פרופריוספציה: הידיעה איפה חלקי הגוף נמצאים","w":["קינסתזיה: הידיעה של שיווי המשקל של הגוף","המערכת הווסטיבולרית: הידיעה איפה האף נמצא","מגע: הידיעה איפה העור נוגע באף"],"e":"פרופריוספציה = לדעת איפה חלקי הגוף. קינסתזיה = לדעת איך הגוף זז. שיווי משקל = המערכת הווסטיבולרית."}]},"h17":{"t":"t7","v":[{"q":"בכיתה, התלמידים שיושבים יחד בפינה נראים למורה כ״קבוצה״, למרות שהם לא מכירים. איזה עיקרון גשטלט פועל?","a":"קרבה: דברים קרובים זה לזה נתפסים כקבוצה","w":["דמיון: דברים דומים זה לזה נתפסים כקבוצה","סגירות: המוח משלים חלקים חסרים לשלם","רציפות: המוח מעדיף קווים חלקים ורציפים"],"e":"קרבה = מה שקרוב נראה שייך יחד. לכן גם רווחים בין מילים מאפשרים לנו לקרוא."},{"q":"בלוגו יש עיגול שעשוי מקווים עם רווחים, ובכל זאת כולם רואים עיגול שלם. איזה עיקרון גשטלט פועל?","a":"סגירות: המוח משלים חלקים חסרים לצורה שלמה","w":["קרבה: הקווים קרובים זה לזה ולכן הם קבוצה","דמיון: כל הקווים באותו צבע ולכן הם קבוצה","דמות ורקע: העיגול נפרד מהרקע הלבן"],"e":"סגירות = המוח ״סוגר״ פערים. זו הסיבה שאנחנו רואים צורות שלמות גם כשהן לא שלמות."}]},"h18":{"t":"t7","v":[{"q":"לפי הספר, במחקרים אנשים זיהו נשק מהר יותר כשהוא הופיע אחרי תמונה של אדם שחור. מה הממצא הזה מלמד על התפיסה?","a":"ציפיות סמויות יוצרות מערך תפיסתי שמשנה את הראייה","w":["התפיסה מדויקת תמיד, ורק הזיכרון מוטה","זו הסתגלות חושית לתמונות שחוזרות על עצמן","זה עיקרון הדמיון של הגשטלט, שמקבץ דברים דומים"],"e":"הטיה גזעית סמויה פועלת כציפייה (מלמעלה למטה), והיא משפיעה על מה שאנחנו ״רואים״. התפיסה היא פירוש, לא העתק."}]}};
const SUM=`<h2>סיכום: Spielman פרק 5 - תחושה ותפיסה</h2>
<div class="key"><b>למה הפרק הזה חשוב בפסיכולוגיה?</b> כל מה שאנחנו יודעים על העולם מגיע אלינו דרך החושים. אבל מה שאנחנו ״רואים״ ו״שומעים״ הוא לא העתק של העולם: המוח <b>מפרש</b> את מה שהחושים קולטים, לפי מה שאנחנו יודעים, מצפים ושמים אליו לב. לפי הספר, אנחנו נשענים על החושים כדי להתמצא בסביבה: למצוא אוכל ומחסה, לקיים קשרים חברתיים ולהימנע מסכנה. לכן השאלה של השיעור בסילבוס היא: <b>״תפיסה: מציאות או אשליה?״</b><br><br>
<b>השאלה של הפרק במשפט אחד:</b> איך גירוי מהעולם (אור, קול, ריח) הופך לחוויה שלנו, ולמה החוויה הזו לא תמיד זהה למה שיש באמת בחוץ?<br><br>
<b>הפרק בנוי משלושה חלקים:</b><br>
① <b>העקרונות</b> (סעיף 1): ההבדל בין תחושה לתפיסה, כמה חזק גירוי צריך להיות כדי שנרגיש אותו, ומה משפיע על מה שאנחנו שמים לב אליו.<br>
② <b>החושים עצמם</b> (סעיפים 2–5): אור וקול כגלים, ראייה, שמיעה ושאר החושים.<br>
③ <b>איך המוח מארגן את מה שנקלט</b> (סעיף 6): עקרונות הגשטלט, ואיך ציפיות משנות את מה שאנחנו רואים.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>גירוי</b></td><td>כל דבר מהעולם שחוש יכול לקלוט: אור, צליל, ריח, לחץ על העור.</td></tr>
<tr><td><b>קולטן (רצפטור)</b></td><td>תא מיוחד בחוש (בעין, באוזן, באף) שמגיב לסוג מסוים של גירוי.</td></tr>
<tr><td><b>התמרה</b></td><td>הפיכה של הגירוי לשפה של המוח: אותות עצביים. כמו מתורגמן שמתרגם אור לחשמל.</td></tr>
<tr><td><b>סף</b></td><td>הגבול: מאיזו עוצמה מתחילים להרגיש משהו.</td></tr>
<tr><td><b>רשתית / שבלול</b></td><td>הרשתית היא ״מסך״ בתוך העין שעליו נמצאים קולטני האור. השבלול הוא איבר בצורת חילזון באוזן הפנימית, ובו קולטני הקול.</td></tr></table></div>

<h3>הדוגמה שתלווה אותנו: יואב בפינת הרחוב</h3>
<p>הפרק נפתח באדם שעומד בפינת רחוב: מכוניות ואנשים עוברים, נגן רחוב מנגן, צופר נשמע מרחוק, ריח מדוכן אוכל, והמדרכה קשה מתחת לרגליים. נקרא לו <b>יואב</b> (דמות בדויה), ונבדוק דרכו כל מושג. ברגע אחד החושים שלו מקבלים כמות עצומה של מידע, והשאלה היא מה מכל זה באמת ״מגיע״ אליו.</p>

<h3>1. תחושה, תפיסה, ומה אנחנו שמים לב אליו</h3>
<h4>תחושה מול תפיסה</h4>
<p>זו ההבחנה הכי חשובה בפרק:</p>
<div class="ex"><b>תחושה = הקליטה (הצד הפיזי).</b> הקולטנים מזהים גירוי ו<b>ממירים</b> אותו לאות עצבי (התמרה). זה קורה אוטומטית.<br>
<b>תפיסה = הפירוש (הצד הפסיכולוגי).</b> המוח מארגן את האותות ונותן להם משמעות, לפי ניסיון, ידע וציפיות.<br><br>
<b>אצל יואב:</b> האף שלו קולט מולקולות של קינמון. זו <b>תחושה</b>. הוא חושב ״זה הריח של העוגה של סבתא״ ומרגיש געגוע. זו <b>תפיסה</b>.<br>
<b>לפי הספר:</b> התפיסה מושפעת מאמונות, ערכים, דעות קדומות, תרבות וניסיון חיים.<br><b>מהיומיום:</b> שניים שומעים אותו שיר. התחושה זהה: אותם צלילים. אבל לאחד הוא מזכיר פרידה ולשני חתונה. התפיסה שונה.</div>
<h4>ספים: כמה חזק צריך להיות הגירוי</h4>
<div class="ex"><b>סף מוחלט:</b> העוצמה הכי חלשה שאדם מזהה ב־<b>50%</b> מהפעמים. למה 50% ולא 100%? כי סביב הגבול לפעמים מרגישים ולפעמים לא. מגדירים את הסף כנקודה שבה מזהים בדיוק בחצי מהניסיונות.<br>
<b>גירוי תת־סיפי:</b> גירוי חלש מדי בשביל המודעות. במעבדה רואים שהמוח בכל זאת מעבד אותו קצת, אבל בחיים האמיתיים ההשפעה שלו קטנה מאוד. ״פרסומות סמויות״ שמשנות התנהגות הן בעיקר מיתוס.<br><br>
<b>סף הבדל (JND):</b> השינוי הכי קטן שאפשר להבחין בו בין שני גירויים.<br>
<b>חוק ובר:</b> סף ההבדל הוא <b>יחס קבוע</b> מהגירוי המקורי, לא מספר קבוע. ככל שהגירוי חזק יותר, צריך שינוי גדול יותר כדי לשים לב.<br>
<b>דוגמה:</b> מסך טלפון שנדלק בקולנוע חשוך בולט מאוד. אותו מסך באצטדיון מואר לא מורגש. אותה תוספת אור, אבל ביחס לסביבה היא שונה.<br>
<b>עוד דוגמה:</b> אם תיק שוקל 1 ק״ג ומוסיפים לו חצי ק״ג, מרגישים מייד. אם הוא שוקל 20 ק״ג, חצי ק״ג כמעט לא מורגש.</div>
<h4>מה קובע למה נשים לב?</h4>
<p>יואב לא יכול לשים לב לכל מה שהחושים שלו קולטים. כמה מנגנונים קובעים מה ״נכנס״:</p>
<div class="ex"><b>מלמטה למעלה:</b> הגירוי עצמו תופס את הקשב, כי הוא חזק או פתאומי. <b>אצל יואב:</b> זכוכית נשברת לידו, והוא מסתובב בלי להחליט.<br><br>
<b>מלמעלה למטה:</b> הידע והציפיות שלנו מכוונים מה נחפש ואיך נפרש. <b>אצל יואב:</b> הוא מחכה לחבר עם מעיל אדום, ולכן העיניים שלו ״קופצות״ על כל דבר אדום.<br><br>
<b>הסתגלות חושית:</b> גירוי שלא משתנה מפסיק להיות מורגש. <b>אצל יואב:</b> אחרי כמה דקות הוא כבר לא שומע את רעש התנועה. <b>מהיומיום:</b> לא מרגישים את השעון על היד, או את הריח של הבית שלך.<br><br>
<b>עיוורון קשב:</b> לא רואים משהו בולט לגמרי, כי הקשב שלנו עסוק במשהו אחר. <b>אצל יואב:</b> הוא מסתכל בטלפון, והחבר עובר לידו בלי שהוא שם לב.<br><br>
<b>זיהוי אות:</b> היכולת לזהות גירוי חשוב בתוך ״רעש״, והיא תלויה גם במוטיבציה. <b>אצל יואב:</b> בתוך כל המהומה, הוא שומע מישהו קורא בשמו.</div>
<div class="ex"><b>ניסוי הגורילה (סימונס וצ׳אבריס, 1999):</b><br>
<b>מה עשו:</b> הראו סרטון של שתי קבוצות שמוסרות כדור, וביקשו לספור כמה מסירות עשתה קבוצה אחת.<br>
<b>מה יצא:</b> באמצע הסרטון אדם בתחפושת גורילה עבר במרכז המסך במשך 9 שניות. כמעט <b>חצי</b> מהצופים לא ראו אותו.<br>
<b>מה זה מלמד:</b> עיוורון קשב. אנחנו לא רואים את כל מה שמול העיניים, רק את מה שהקשב שלנו מכוון אליו.</div>
<div class="ex"><b>תרבות וציפיות משנות את התפיסה:</b><br>
<b>אשליית מילר־לייר</b> (שני קווים זהים באורכם, עם ״חיצים״ פונים פנימה או החוצה, שנראים באורך שונה): אנשים ממדינות מערביות, שגדלו בעולם של בניינים ופינות ישרות, נופלים בה יותר. אנשי שבט הזולו, שגדלו בבקתות עגולות, נופלים בה פחות.<br>
<b>טעם:</b> אנשים שיש להם יחס חיובי לאוכל דל שומן מדרגים אותו כטעים יותר. הציפייה משנה את החוויה.</div>

<h3>2. אור וקול כגלים</h3>
<p>לפני שעוברים לעין ולאוזן, צריך להבין את מה שהן קולטות. גם אור וגם קול נעים כ<b>גלים</b>, ולכל גל יש שתי תכונות עיקריות. הסוד של הסעיף הוא שכל תכונה ״מתורגמת״ לחוויה אחרת:</p>
<div class="tw"><table><tr><th>תכונת הגל</th><th>באור זה מרגיש כמו...</th><th>בקול זה מרגיש כמו...</th></tr>
<tr><td><b>משרעת</b> (כמה ״גבוה״ הגל)</td><td><b>בהירות</b>: גל גבוה = אור בהיר</td><td><b>עוצמה</b> (נמדדת בדציבל): גל גבוה = קול חזק</td></tr>
<tr><td><b>אורך גל / תדירות</b> (כמה גלים בשנייה)</td><td><b>צבע</b></td><td><b>גובה הצליל</b>: תדירות גבוהה = צליל גבוה (צפצוף)</td></tr>
<tr><td><b>מה האדם קולט</b></td><td>380–740 ננומטר</td><td>20–20,000 הרץ</td></tr></table></div>
<div class="ex"><b>איך לזכור:</b> גל <b>ארוך</b> = מעט גלים בשנייה = תדירות <b>נמוכה</b>. תחשבו על ים: גלים ארוכים מגיעים לחוף לאט, גלים קצרים מגיעים בתכיפות.<br>
<b>גוון:</b> מה שמבדיל בין פסנתר לגיטרה כשהם מנגנים בדיוק את אותו צליל.<br>
<b>רעש ושמיעה:</b> שיחה רגילה = 60 דציבל. תנועה כבדה = 85, ונזק לשמיעה אחרי 8 שעות. אוזניות בעוצמה מלאה = 100–105, ונזק כבר אחרי 15 דקות. סף כאב = 130. בערך שליש מאובדן השמיעה נגרם מחשיפה לרעש.</div>

<h3>3. ראייה</h3>
<h4>המסלול של האור בעין</h4>
<div class="ex">האור נכנס דרך ה<b>קרנית</b> (השכבה השקופה מקדימה) ← עובר ב<b>אישון</b> (הפתח השחור, שה<b>קשתית</b> הצבעונית שולטת בגודלו) ← ה<b>עדשה</b> ממקדת אותו ← הוא נופל על ה<b>רשתית</b>, במיוחד על ה<b>גומה המרכזית</b>, הנקודה שבה רואים הכי חד.</div>
<h4>שני סוגי קולטנים: מדוכים וקנים</h4>
<div class="tw"><table><tr><th></th><th>מדוכים</th><th>קנים</th></tr>
<tr><td><b>איפה</b></td><td>מרוכזים בגומה המרכזית</td><td>בשאר הרשתית, בשוליים</td></tr>
<tr><td><b>באיזה אור</b></td><td>אור חזק</td><td>אור חלש</td></tr>
<tr><td><b>מה הם נותנים</b></td><td>פרטים קטנים וצבע</td><td>תנועה בשוליים, בלי צבע</td></tr></table></div>
<div class="ex"><b>מהיומיום:</b> נכנסים מהשמש לקולנוע חשוך, ובהתחלה לא רואים כלום. לוקח כמה דקות עד שהקנים, שעובדים באור חלש, ״נכנסים לפעולה״.<br>
<b>עוד:</b> בלילה, כשמסתכלים ישר על כוכב חלש הוא נעלם, וכשמסתכלים קצת הצידה רואים אותו. כי הקנים נמצאים בשוליים.</div>
<h4>מהעין למוח</h4>
<ul>
<li>מהרשתית יוצא <b>עצב הראייה</b>. במקום שבו הוא יוצא אין קולטנים, ולכן יש <b>נקודה עיוורת</b>. אנחנו לא מרגישים אותה, כי המוח ״משלים״ את החסר.</li>
<li>ב<b>הצטלבות הראייה</b> המידע מהצד הימני של שדה הראייה עובר לצד <b>השמאלי</b> של המוח, וההפך.</li>
<li>המידע מגיע לאונה <b>העורפית</b> (בחלק האחורי של הראש), ומשם יוצא בשני מסלולים: <b>״מה?״</b> (זיהוי של מה רואים) ו<b>״איפה/איך?״</b> (מיקום ותנועה).</li>
<li><b>האבל וויזל</b> (פרס נובל, 1981) גילו תאים במוח שמגיבים רק לקווים בכיוון מסוים. בגורי חתולים שעין אחת שלהם נסגרה בתקופה קריטית, העין הזו ״איבדה״ את השטח שלה במוח.</li>
</ul>
<h4>איך רואים צבע: שתי תיאוריות שמשלימות זו את זו</h4>
<div class="ex"><b>התיאוריה התלת־צבעית:</b> ברשתית יש <b>שלושה סוגי מדוכים</b>, וכל אחד רגיש בעיקר לצבע אחר. כל צבע שאנחנו רואים נוצר משילוב של השלושה, כמו במסך מחשב.<br>
<b>תיאוריית התהליך המנוגד:</b> אחרי הרשתית, הצבעים מעובדים ב<b>זוגות מנוגדים</b>: שחור־לבן, צהוב־כחול, ירוק־אדום. כשאחד מהזוג פעיל, השני מעוכב.<br>
<b>מה התיאוריה השנייה מסבירה: תמונה שארית.</b> אם בוהים דקה בריבוע ירוק ואז מסתכלים על קיר לבן, רואים ריבוע <b>אדום</b>. החלק ה״ירוק״ התעייף, ולכן ה״אדום״ שמנוגד לו מקבל את הבכורה לרגע.<br>
<b>הלקח:</b> שתי התיאוריות לא סותרות. כל אחת מתארת שלב אחר: הראשונה ברשתית, השנייה אחריה.<br>
<b>עיוורון צבעים אדום־ירוק</b> עובר בתורשה דרך כרומוזום X, ולכן הוא שכיח יותר בגברים.</div>
<h4>איך רואים עומק</h4>
<div class="ex"><b>רמזים דו־עיניים (צריך את שתי העיניים):</b> כל עין רואה תמונה קצת שונה, והמוח משתמש בהבדל כדי לחשב מרחק. זה <b>הפער הדו־עיני</b>, וככה עובדים משקפי תלת־ממד. נסו לסגור עין אחת ואז את השנייה, ותראו שהאצבע ״קופצת״.<br>
<b>רמזים חד־עיניים (מספיקה עין אחת):</b> בזכותם רואים עומק גם בתמונה שטוחה. <b>פרספקטיבה קווית:</b> פסי רכבת שנפגשים באופק. <b>חפיפה:</b> מה שמסתיר משהו אחר נראה קרוב יותר. <b>גודל יחסי:</b> אדם שנראה קטן נראה רחוק.</div>

<h3>4. שמיעה</h3>
<h4>המסלול של הקול</h4>
<div class="ex">הקול נכנס בתעלת השמע ומרעיד את <b>עור התוף</b> ← שלוש עצמות קטנות באוזן התיכונה (<b>פטיש, סדן, ארכוף</b>) זזות, והארכוף לוחץ על <b>החלון הסגלגל</b> של השבלול ← הנוזל בתוך ה<b>שבלול</b> זז ← שם <b>תאי שערה</b> שיושבים על <b>הקרום הבסיסי</b> הופכים את הרעידה לאות עצבי ← <b>עצב השמע</b> ← התלמוס ← קורטקס השמיעה ב<b>אונה הרקתית</b> (בצד הראש, ליד האוזניים).</div>
<h4>איך שומעים גובה צליל: שתי תיאוריות</h4>
<div class="ex"><b>התיאוריה הזמנית:</b> גובה הצליל מקודד לפי <b>קצב הירי</b> של הנוירונים. צליל גבוה = ירי מהיר. הבעיה: נוירונים לא יכולים לירות מהר מספיק בשביל צלילים גבוהים מאוד.<br>
<b>תיאוריית המקום:</b> גובה הצליל מקודד לפי <b>המקום</b> על הקרום הבסיסי שרועד הכי חזק. <b>בסיס</b> הקרום = צלילים <b>גבוהים</b>, <b>הקצה</b> = צלילים <b>נמוכים</b>.<br>
<b>הפתרון:</b> עד בערך 4,000 הרץ שתיהן עובדות יחד. מעל זה, רק תיאוריית המקום.</div>
<h4>איך יודעים מאיפה הקול מגיע</h4>
<div class="ex"><b>אצל יואב:</b> צופר נשמע מימין. הקול מגיע לאוזן הימנית <b>קצת קודם</b> ו<b>קצת חזק יותר</b> מאשר לשמאלית, כי הראש ״מסתיר״. ההבדלים האלה בין שתי האוזניים (<b>רמזים דו־אוזניים</b>) אומרים לו ימין או שמאל. ה<b>צורה של האפרכסת</b> עוזרת לדעת אם הקול מלמעלה, מלמטה, מקדימה או מאחורה. לזה הספר קורא <b>רמזים חד־אוזניים</b>, כי מספיקה אוזן אחת. לפי הספר, גובה הצליל נשען גם על <b>קצב הירי</b> של תאי השערה וגם על <b>המיקום</b> שלהם על הקרום.</div>
<h4>אובדן שמיעה</h4>
<div class="tw"><table><tr><th></th><th>אובדן שמיעה הולכתי</th><th>אובדן שמיעה תחושתי־עצבי</th></tr>
<tr><td><b>מה נפגע</b></td><td>הקול לא מגיע לשבלול (למשל עור תוף פגוע)</td><td>האות לא עובר מהשבלול למוח (תאי שערה או עצב פגועים)</td></tr>
<tr><td><b>מה עוזר</b></td><td>מכשיר שמיעה</td><td>לפעמים שתל שבלול</td></tr>
<tr><td><b>כמה נפוץ</b></td><td>פחות</td><td><b>הסוג הנפוץ</b></td></tr></table></div>
<p><b>מחלת מנייר</b> גורמת לאובדן שמיעה, צפצופים באוזניים (טנטון) וסחרחורות. בקהילת החירשים רבים מעדיפים שפת סימנים, ורואים בחירשות תרבות ולא ליקוי.</p>

<h3>5. החושים האחרים</h3>
<ul>
<li><b>טעם:</b> חמישה טעמים בסיסיים: מתוק, מלוח, חמוץ, מר ו<b>אומאמי</b> (הטעם ״המלא״ של מרק או גבינה), ואולי גם שומן. בלוטות הטעם מתחדשות כל 10–14 ימים.</li>
<li><b>ריח:</b> הקולטנים באף שולחים מידע לבולבוס הריח, שמחובר ישירות ל<b>מערכת הלימבית</b>, האזור של רגשות וזיכרון. <b>לכן ריחות מעוררים זיכרונות רגשיים חזקים</b>, כמו הקינמון של יואב. <b>פרומונים</b> (חומרי ריח שמעבירים מסרים בין בני אותו מין) קיימים בבעלי חיים; אצל בני אדם זה שנוי במחלוקת.</li>
<li><b>טעם וריח הם ״חושים כימיים״:</b> הקולטנים בלשון ובאף נקשרים ישירות למולקולות של הטעם או הריח.</li>
<li><b>מגע, טמפרטורה וכאב:</b> בעור יש כמה סוגים של קולטנים ללחץ ולרטט, וקצות עצב חופשיים לחום ולקור (<b>תרמוצפציה</b>) ולפגיעה (<b>נוציצפציה</b>, חישת כאב). הכול מגיע לאונה <b>הקודקודית</b>.</li>
<li><b>כאב:</b> <b>כאב דלקתי</b> נגרם מפגיעה ברקמה (למשל נקע). <b>כאב נוירופתי</b> נגרם מפגיעה בעצבים עצמם. אנשים שנולדים בלי יכולת להרגיש כאב נפצעים שוב ושוב, סובלים מזיהומים וחיים פחות שנים. כלומר הכאב <b>מגן</b> עלינו.</li>
<li><b>שיווי משקל:</b> המערכת הווסטיבולרית באוזן הפנימית: תאי שערה בתעלות החצי־מעגליות ובשקיקים מגיבים לשינוי בתנוחת הראש ולכוח המשיכה. <b>פרופריוספציה:</b> לדעת <b>איפה</b> חלקי הגוף נמצאים, למשל לגעת באף בעיניים עצומות. <b>קינסתזיה:</b> לדעת <b>איך הגוף זז</b>. שתיהן נשענות על קולטנים שחשים מתיחה ומתח בשרירים, במפרקים, בגידים ובעור.</li>
</ul>

<h3>6. עקרונות הגשטלט: המוח מארגן את מה שהוא קולט</h3>
<p>אחרי שראינו איך כל חוש קולט, חוזרים לשאלה של התפיסה: איך המוח הופך את כל הנקודות, הקווים והצלילים לעולם מסודר? הפסיכולוגים <b>ורטהיימר, קלר וקופקה</b> טענו ש<b>השלם שונה מסכום חלקיו</b>: המוח לא רואה ״אוסף של נקודות״, אלא מארגן אותן אוטומטית לצורות, לפי כמה כללים קבועים:</p>
<div class="ex"><b>דמות ורקע:</b> המוח מפריד בין ״הדבר״ לבין מה שמאחוריו. בציור המפורסם רואים או אגרטל או שני פרצופים, אבל לא את שניהם באותו רגע.<br>
<b>קרבה:</b> דברים קרובים זה לזה נראים כקבוצה. ככה הרווחים בין מילים מאפשרים לקרוא.<br>
<b>דמיון:</b> דברים דומים נראים כקבוצה. במגרש, מזהים מיד מי באותה קבוצה לפי צבע החולצה.<br>
<b>רציפות:</b> המוח מעדיף קווים חלקים ורציפים. את X רואים כשני קווים ישרים שנחתכים, ולא כשני ״V״ שנוגעים.<br>
<b>סגירות:</b> המוח משלים חלקים חסרים. עיגול עם רווחים קטנים עדיין נראה כעיגול.</div>
<h4>השערות תפיסתיות ומערך תפיסתי</h4>
<p>המוח לא רק מארגן, הוא גם <b>מנחש</b>. הוא בונה <b>השערה</b> על מה שהוא רואה, לפי מה שהוא מכיר ומצפה לו. כשיש לנו ציפייה מסוימת, נוצר <b>מערך תפיסתי</b>: נטייה לראות את מה שאנחנו מצפים לראות.</p>
<div class="ex"><b>אצל יואב:</b> הוא מחכה לחבר עם מעיל אדום, ולכמה שניות הוא ״רואה״ את החבר בכל אדם עם מעיל אדום.<br>
<b>מהיומיום:</b> מחכים לשיחה חשובה ו״שומעים״ את הטלפון מצלצל במקלחת.<br><b>לפי הספר, המערך התפיסתי תלוי גם במאפיינים ובמצב הנפשי של האדם:</b> מי שרעב שם לב יותר לכל מה שקשור לאוכל, ומי שמפחד ״רואה״ סכנה בכל צל.<br>
<b>ממצא מטריד מהספר:</b> <b>הטיה גזעית סמויה</b> משפיעה על התפיסה. במחקרים, אנשים זיהו נשק מהר יותר כשהוא הופיע אחרי תמונה של אדם שחור. הציפייה הסמויה שינתה את מה שהם ״ראו״.<br>
<b>וזו התשובה לשאלה של השיעור:</b> התפיסה היא לא העתק של המציאות, אלא <b>פירוש</b> שלה. רוב הזמן הפירוש מדויק ומועיל, אבל ציפיות, קשב ותרבות יכולים להטות אותו.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הסיפור של הפרק בחמישה משפטים:</b><br>
1. <b>תחושה</b> היא קליטה של גירוי והפיכתו לאות עצבי. <b>תפיסה</b> היא הפירוש שהמוח נותן לאות.<br>
2. כדי להרגיש גירוי הוא צריך לעבור <b>סף</b>, ושינוי מורגש רק אם הוא גדול ביחס לגירוי המקורי (<b>חוק ובר</b>).<br>
3. אנחנו לא שמים לב להכול: גירוי חזק תופס קשב (<b>מלמטה למעלה</b>), ציפיות מכוונות אותו (<b>מלמעלה למטה</b>), ודברים שלא משתנים או שלא נמצאים בפוקוס פשוט ״נעלמים״.<br>
4. כל חוש בנוי לתרגם סוג אחר של גירוי. באור ובקול, <b>משרעת</b> קובעת בהירות או עוצמה, ו<b>אורך הגל</b> קובע צבע או גובה צליל.<br>
5. המוח <b>מארגן</b> את הקלט לצורות שלמות (גשטלט) ו<b>מנחש</b> לפי ציפיות. לכן התפיסה היא פירוש של המציאות, לא העתק שלה.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להבחין בין תחושה לתפיסה בדוגמה.<br>
• להסביר סף מוחלט, סף הבדל וחוק ובר, ולזהות אותם במקרה.<br>
• לזהות בתיאור מקרה: מלמטה למעלה, מלמעלה למטה, הסתגלות חושית, עיוורון קשב, זיהוי אות.<br>
• לחבר תכונות של גל (משרעת, אורך גל) לחוויה באור ובקול.<br>
• לתאר את מסלול הראייה והשמיעה, ולהבדיל בין מדוכים לקנים.<br>
• להסביר את שתי תיאוריות הצבע ואת שתי תיאוריות גובה הצליל, ומה כל אחת מסבירה.<br>
• להבחין בין רמזי עומק דו־עיניים לחד־עיניים, ובין סוגי אובדן השמיעה.<br>
• לזהות עיקרון גשטלט בתמונה או בתיאור, ולהסביר מערך תפיסתי.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>סף מוחלט = זיהוי ב־50%</b> מהפעמים, לא ב־100%.</li>
<li><b>סף ההבדל לא קבוע.</b> לפי חוק ובר הוא יחס קבוע מהגירוי, ולכן גדל כשהגירוי חזק יותר.</li>
<li><b>באור: אורך הגל = צבע, משרעת = בהירות. בקול: תדירות = גובה, משרעת = עוצמה.</b></li>
<li><b>מדוכים = צבע ופרטים, בגומה המרכזית. קנים = חושך ושוליים.</b></li>
<li><b>שתי תיאוריות הצבע לא סותרות.</b> תמונה שארית מוסברת בתהליך המנוגד.</li>
<li><b>תיאוריית המקום: בסיס הקרום = צלילים גבוהים.</b></li>
<li><b>אובדן תחושתי־עצבי הוא הנפוץ</b>. מכשיר שמיעה עוזר בעיקר באובדן הולכתי.</li>
<li><b>פרופריוספציה = איפה הגוף; קינסתזיה = איך הגוף זז.</b></li>
<li><b>עיוורון קשב ≠ הסתגלות חושית.</b> הראשון בגלל שהקשב במקום אחר, השני בגלל שהגירוי לא משתנה.</li>
<li><b>מלמעלה למטה = ציפיות וידע</b>; מלמטה למעלה = הגירוי עצמו.</li>
</ul></div>`;

    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}{const pb=app.querySelector("#pod");if(pb)pb.onclick=()=>{const bx=app.querySelector("#podbox");bx.hidden=!bx.hidden;const f=bx.querySelector(".podframe");if(!bx.hidden&&!f.firstChild)f.innerHTML=`<iframe src="https://drive.google.com/file/d/${CONFIG.podcast.id}/preview" allow="autoplay" title="פודקאסט" loading="lazy"></iframe>`}}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb){pb.click();const bx=document.querySelector("#podbox");if(bx)bx.scrollIntoView({block:"center"})}}else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
