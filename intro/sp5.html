const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

  {h:"פינת הרחוב",html:`${def("על מה הנושא",`מה ההבדל בין לקלוט גירוי לבין להבין אותו, וכמה חזק גירוי צריך להיות כדי שנרגיש אותו.<br><b>מה נלמד כאן:</b> תחושה · התמרה · סף מוחלט · סף הבדל · חוק ובר`)}${ex("הפרק נפתח בפינת רחוב: מכוניות ואנשים זזים, נגן רחוב מנגן, צופר רחוק, ריח של אוכל מדוכן, והמדרכה הקשה מתחת לרגליים. נקרא לאדם שעומד שם <b>יואב</b>, ונחזור אליו לאורך הלומדה.")}${def("תחושה",`${E("Sensation")} <b>קולטנים</b> (נוירונים מיוחדים) מזהים גירוי. זה הצד ה<b>פיזי</b> של החוויה.`)}${def("התמרה",`${E("Transduction")} הפיכת האנרגיה של הגירוי (אור, קול, ריח) ל<b>פוטנציאלי פעולה</b> שעוברים למערכת העצבים המרכזית.`)}${def("תפיסה",`${E("Perception")} ארגון, פירוש וחוויה מודעת של המידע החושי. זה הצד ה<b>פסיכולוגי</b>.`)}${ex("יואב מריח קינמון: זו <b>תחושה</b>. הוא נזכר בעוגה של סבתא: זו <b>תפיסה</b>.")}`,q:"q1"},
  {h:"ספים",html:`${def("סף מוחלט",`${E("Absolute threshold")} העוצמה <b>המינימלית</b> של גירוי שמזהים ב־<b>50%</b> מהפעמים. החושים רגישים מאוד: בלילה בהיר אפשר אולי לזהות להבת נר מכ־50 ק״מ, ובשקט מוחלט תקתוק שעון מכ־6 מטרים.`)}${def("תת־סיפי",`${E("Subliminal")} גירוי מתחת לסף המודעות: נקלט, אבל לא שמים לב אליו. במעבדה הוא משפיע מעט, אבל ל״מסרים נסתרים״ יש השפעה קטנה מאוד על התנהגות בחיים.`)}${def("סף הבדל",`${E("Just noticeable difference, JND")} השינוי ה<b>קטן ביותר</b> בין שני גירויים שאפשר להבחין בו. הוא <b>משתנה עם עוצמת הגירוי</b>.`)}${def("חוק ובר",`${E("Weber's law")} סף ההבדל הוא <b>חלק קבוע</b> (יחס) מהגירוי המקורי.`)}${ex("מסך טלפון שנדלק באולם קולנוע חשוך בולט מיד, אבל באצטדיון מואר כמעט לא שמים לב אליו. אותו שינוי, גירוי בסיס שונה.")}`,q:"q3"},
  {h:"מלמטה למעלה ומלמעלה למטה",html:`${tiles([["data","עיבוד מלמטה למעלה","מונע על ידי <b>הגירוי</b>. רעש של זכוכית נשברת במסעדה רועשת תופס את תשומת הלב"],["target","עיבוד מלמעלה למטה","מונע על ידי <b>ידע וציפיות</b>. מחפשים מפתחות עם מחזיק צהוב, ולכן סורקים חפצים צהובים במקומות הגיוניים"]])}${def("הסתגלות חושית",`${E("Sensory adaptation")} גירוי קבוע מפסיק להיות מורגש, אף שהקולטנים עדיין קולטים אותו. יואב כבר לא שומע את רעש התנועה אחרי כמה דקות.`)}${def("עיוורון קשב",`${E("Inattentional blindness")} לא רואים גירוי גלוי לגמרי כי הקשב במקום אחר. בניסוי של <b>סימונס וצ׳אבריס</b> (1999) ספרו מסירות של הקבוצה הלבנה, וכמעט <b>חצי</b> לא ראו אדם בתחפושת גורילה שעבר במשך 9 שניות.`)}${def("תורת זיהוי האות",`${E("Signal detection theory")} היכולת לזהות אות משמעותי בתוך ״רעש״ רקע. <b>מוטיבציה והקשר</b> משפיעים עליה: אמא מתעוררת ממלמול שקט של התינוק, אבל לא מרעשים אחרים.`)}`,q:"q5"},
  {h:"תפיסה מושפעת מהניסיון",html:`<p>התפיסה מושפעת מ<b>ניסיון, תרבות, אישיות וציפיות</b>:</p>${tiles([["building","תרבות ואשליה","אנשים מערביים רגישים יותר לאשליית <b>מילר־לייר</b> (קווים שווים נראים שונים). הסבר: עולם ״מרובע״ של בניינים. הזולו, שגרים בבקתות עגולות, פחות רגישים לה"],["leaf","טעם וציפייה","מי שיש לו יחס חיובי למזון דל שומן מדרג אותו כטעים יותר"],["moon","ניסיון מוקדם","מי שלא היה לו ניסיון בראייה בשתי עיניים בתקופה קריטית מתקשה בתפיסת עומק"]])}${rem("תחושה דומה פחות או יותר אצל כולם. תפיסה יכולה להיות שונה מאוד בין אנשים.")}`,q:"q7"}
 ]},
 {id:"t2",icon:"chart",title:"גלים: אור וקול",blocks:[
  {h:"התכונות של גל",html:`${def("על מה הנושא",`אור וקול נעים כגלים, והתכונות של הגל קובעות מה נחווה.<br><b>מה נלמד כאן:</b> משרעת · אורך גל · תדירות · הספקטרום · גובה צליל ועוצמה`)}${fig("wave37")}${tiles([["chart","משרעת","הגובה של הגל. באור קובעת <b>בהירות</b>, בקול <b>עוצמה</b>"],["split","אורך גל","המרחק בין שיא לשיא. באור קובע <b>צבע</b>"],["clock","תדירות","כמה גלים עוברים בשנייה, נמדד ב<b>הרץ</b> (Hz). בקול קובעת <b>גובה צליל</b>"]])}${rem("גל <b>ארוך</b> = תדירות <b>נמוכה</b>. גל <b>קצר</b> = תדירות <b>גבוהה</b>.")}`,q:"q9"},
  {h:"אור וקול במספרים",html:`${def("הספקטרום האלקטרומגנטי",`כל הקרינה סביבנו: גמא, רנטגן, אולטרה סגול, אור נראה, אינפרא אדום, מיקרוגל ורדיו. אנחנו רואים רק חלק קטן: <b>האור הנראה</b>, בערך <b>380 עד 740 ננומטר</b>. דבורים רואות אולטרה סגול, וחלק מהנחשים מזהים אינפרא אדום.`)}${def("קול",`בני אדם שומעים <b>20 עד 20,000 הרץ</b>, ורגישים ביותר באמצע הטווח. כלבים וחתולים שומעים גבוה יותר. <b>גובה צליל</b> קשור לתדירות; <b>עוצמה</b> קשורה למשרעת ונמדדת ב<b>דציבלים</b>. <b>גוון</b> ${E("Timbre")} הוא מה שמבדיל בין כלי נגינה שמנגנים אותו צליל.`)}<div class="tw"><table><tr><th>צליל</th><th>בערך</th></tr><tr><td>שיחה רגילה</td><td>60 דציבל</td></tr><tr><td>תנועה כבדה בעיר</td><td>85, נזק אפשרי אחרי 8 שעות</td></tr><tr><td>אוזניות בעוצמה מלאה</td><td>100–105, נזק אחרי 15 דקות</td></tr><tr><td>סף כאב (מטוס ממריא)</td><td>130</td></tr></table></div>${rem("כשליש מאובדן השמיעה נגרם מחשיפה לרעש.")}`,q:"q11"}
 ]},
 {id:"t3",icon:"target",title:"ראייה",blocks:[
  {h:"מבנה העין",html:`${def("על מה הנושא",`איך אור הופך לתמונה במוח.<br><b>מה נלמד כאן:</b> מבנה העין · קנים ומדוכים · הנקודה העיוורת · שני מסלולים`)}<p>האור עובר דרך ה<b>קרנית</b>, ה<b>אישון</b> (שגודלו נשלט על ידי ה<b>קשתית</b>) וה<b>עדשה</b>, שממקדת אותו על ה<b>גומה המרכזית</b> ${E("Fovea")} שבתוך ה<b>רשתית</b>.</p><div class="tw"><table><tr><th></th><th>מדוכים (Cones)</th><th>קנים (Rods)</th></tr><tr><td>איפה</td><td>מרוכזים בגומה המרכזית</td><td>בשאר הרשתית</td></tr><tr><td>באיזה אור</td><td>אור חזק</td><td>אור חלש</td></tr><tr><td>מה נותנים</td><td>פרטים <b>וצבע</b></td><td>תנועה בשוליים, בלי צבע</td></tr></table></div>${ex("יואב נכנס מהרחוב המואר לאולם קולנוע חשוך ולא רואה כלום כמה רגעים. העין עוברת מעבודה של מדוכים לעבודה של קנים, וזה לוקח זמן.")}`,q:"q13"},
  {h:"מהעין למוח",html:`<ul><li>הקנים והמדוכים מתחברים לתאי <b>גנגליון</b>, שהאקסונים שלהם יוצרים את <b>עצב הראייה</b>.</li><li>במקום שבו העצב יוצא אין קולטנים: <b>הנקודה העיוורת</b>. לא שמים לב אליה כי הנקודה של כל עין במקום אחר, והמוח ״משלים״.</li><li>בהצטלבות הראייה ${E("Optic chiasm")} המידע מ<b>שדה הראייה הימני</b> עובר לצד <b>השמאלי</b> של המוח, ולהפך.</li><li>המידע מגיע ל<b>אונה העורפית</b>, ומשם בשני מסלולים: <b>״מה״</b> (זיהוי עצם) ו<b>״איפה/איך״</b> (מיקום ותנועה).</li></ul>${ex("כדור מתגלגל לכיוון יואב: מסלול ״מה״ מזהה שזה כדור, ומסלול ״איפה״ עוקב אחרי המיקום שלו כדי שיוכל לעצור אותו.")}${def("האבל וויזל",`זכו בנובל ב־1981 על מחקר ראייה, בעיקר בחתולים וקופים. מצאו תאים שמגיבים לקווים בכיוון מסוים. בגורי חתולים, עין שנתפרה בתקופה קריטית ״איבדה״ את השטח שלה במוח לטובת העין הפתוחה.`)}`,q:"q15"}
 ]},
 {id:"t4",icon:"copies",title:"צבע ועומק",blocks:[
  {h:"שתי תיאוריות צבע",html:`${def("על מה הנושא",`איך רואים צבעים, ואיך רואים עומק מתמונה שטוחה.<br><b>מה נלמד כאן:</b> תלת־צבעית · תהליך מנוגד · עיוורון צבעים · רמזי עומק`)}<div class="tw"><table><tr><th></th><th>תיאוריה תלת־צבעית</th><th>תיאוריית התהליך המנוגד</th></tr><tr><td>הרעיון</td><td>שלושה סוגי מדוכים: אדום, ירוק וכחול</td><td>הצבע מקודד בזוגות: שחור־לבן, צהוב־כחול, ירוק־אדום</td></tr><tr><td>איפה פועלת</td><td>ברשתית</td><td>אחרי שהאות יוצא מהרשתית</td></tr><tr><td>מה מסבירה</td><td>איך שלושה מדוכים יוצרים כל צבע</td><td>למה אין ״ירוק־אדמדם״, ו<b>תמונות שאריתיות</b></td></tr></table></div>${rem("שתי התיאוריות <b>לא סותרות</b>: כל אחת מתארת שלב אחר.")}${ex("תמונה שארית: מסתכלים 30–60 שניות על דגל ירוק, ואז על דף לבן, ורואים אותו באדום.")}`,q:"q17"},
  {h:"עיוורון צבעים ותפיסת עומק",html:`${def("עיוורון צבעים",`הנפוץ ביותר הוא <b>אדום־ירוק</b>, ותורשתי דרך כרומוזום X. לכן הוא שכיח הרבה יותר אצל גברים (כ־8% מהגברים ממוצא אירופי) מאשר אצל נשים. בודקים במבחן <b>אישיהרה</b> (מספרים מוסתרים בנקודות).`)}${tiles([["copies","רמזים דו־עיניים","דורשים שתי עיניים. <b>פער דו־עיני</b>: כל עין רואה תמונה קצת שונה. סרטי תלת־ממד מנצלים את זה"],["target","רמזים חד־עיניים","עובדים עם עין אחת, ולכן רואים עומק גם בציור. <b>פרספקטיבה קווית</b> (קווים מקבילים מתכנסים), <b>חפיפה</b>, גודל יחסי. יש יותר רמזים כאלה"]])}${ex("ברוס ברידג׳מן נולד עם עין עצלה קשה ולא ראה עומק. ב־2012, בגיל קרוב ל־70, בסרט תלת־ממד, הוא פתאום ראה עומק, וזה נשאר.")}`,q:"q19"}
 ]},
 {id:"t5",icon:"phone",title:"שמיעה",blocks:[
  {h:"מבנה האוזן",html:`${def("על מה הנושא",`איך קול הופך לשמיעה, איך יודעים מאיפה הוא מגיע, ומה קורה כשהשמיעה נפגעת.<br><b>מה נלמד כאן:</b> מבנה האוזן · גובה צליל · מיקום קול · אובדן שמיעה`)}<div class="tw"><table><tr><th>חלק</th><th>מה יש בו</th></tr><tr><td>אוזן חיצונית</td><td>האפרכסת, תעלת השמע ו<b>עור התוף</b></td></tr><tr><td>אוזן תיכונה</td><td>שלוש <b>עצמות השמע</b>: פטיש, סדן וארכוף</td></tr><tr><td>אוזן פנימית</td><td>ה<b>שבלול</b> (מלא נוזל, עם תאי שערה) והתעלות החצי־מעגליות (שיווי משקל)</td></tr></table></div><p>הקול מרטיט את עור התוף ← העצמות זזות ← הארכוף לוחץ על החלון הסגלגל ← הנוזל בשבלול זז ← <b>תאי השערה</b> על <b>הקרום הבסיסי</b> מגורים ← עצב השמע ← התלמוס ← <b>קורטקס השמיעה באונה הרקתית</b>.</p>${ex("נגן הרחוב פורט מיתר. התנודה של האוויר עוברת את כל השרשרת הזו באוזן של יואב, והוא שומע מנגינה.")}`,q:"q21"},
  {h:"גובה צליל ומיקום",html:`<div class="tw"><table><tr><th>תיאוריה</th><th>הרעיון</th><th>המגבלה</th></tr><tr><td><b>זמנית</b></td><td>גובה הצליל מקודד ב<b>קצב הירי</b> של הנוירונים</td><td>נוירונים לא יורים מהר מספיק לכל הטווח עד 20,000 הרץ</td></tr><tr><td><b>מקום</b></td><td>אזורים שונים של הקרום הבסיסי מגיבים לתדירויות שונות: הבסיס לגבוהות, הקצה לנמוכות</td><td></td></tr></table></div><p><b>השילוב:</b> עד כ־4,000 הרץ שתיהן פועלות; מעל זה רק המקום.</p>${tiles([["phone","רמזים חד־אוזניים","צורת האפרכסת ״מסננת״ את הקול. עוזר לדעת אם הוא מלמעלה, מלמטה, מלפנים או מאחור"],["copies","רמזים דו־אוזניים","<b>הבדל בעוצמה</b> (הראש מחליש את הקול לאוזן הרחוקה) ו<b>הבדל בזמן</b> בין האוזניים. מראים ימין או שמאל"]])}${ex("הצופר נשמע חזק יותר ומוקדם יותר באוזן הימנית של יואב, ולכן הוא מסתובב ימינה.")}`,q:"q23"},
  {h:"אובדן שמיעה",html:`<div class="tw"><table><tr><th>סוג</th><th>מה קורה</th><th>מה עוזר</th></tr><tr><td><b>הולכתי</b></td><td>הקול לא מגיע היטב לשבלול (חסימה, חור בעור התוף, בעיה בעצמות)</td><td>מכשיר שמיעה שמגביר</td></tr><tr><td><b>תחושתי־עצבי</b> (הנפוץ ביותר)</td><td>האות לא עובר מהשבלול למוח (גיל, רעש, זיהומים, תרופות)</td><td>לפעמים <b>שתל שבלול</b> שמגרה ישירות את עצב השמע</td></tr></table></div>${def("מחלת מנייר",`ניוון באוזן הפנימית: אובדן שמיעה, <b>טנטון</b> (צלצול), סחרחורת ולחץ.`)}${def("תרבות החירשים",`לחירשים יש שפה (בארה״ב ASL, שפת סימנים מלאה), בתי ספר ומנהגים. התרבות מעדיפה לשמר את שפת הסימנים על פני דיבור, קריאת שפתיים או שתל.`)}`,q:"q25"}
 ]},
 {id:"t6",icon:"hand",title:"החושים האחרים",blocks:[
  {h:"טעם וריח",html:`${def("על מה הנושא",`טעם, ריח, מגע, כאב, ושלושה חושים שמספרים לנו איפה הגוף שלנו.<br><b>מה נלמד כאן:</b> טעם · ריח · מגע · כאב · שיווי משקל · פרופריוספציה`)}<p>טעם וריח הם <b>חושים כימיים</b>, ויחד הם יוצרים <b>טעם</b> (flavor).</p>${tiles([["leaf","טעם","מתוק, מלוח, חמוץ, מר, ו<b>אומאמי</b> (קשור לגלוטמט). אולי גם שישי: שומן. בלוטות הטעם מתחדשות כל 10–14 ימים"],["leaf","ריח","קולטנים בקרום הריר בחלק העליון של האף ← <b>בולבוס הריח</b> ← המערכת הלימבית. לכלבים פי 2–3 גנים לקולטני ריח מלבני אדם"]])}${def("פרומונים",`אותות כימיים בין פרטים, לרוב על מצב רבייה. בחולדות הם מושכים זכרים. אצל בני אדם הנושא עדיין <b>שנוי במחלוקת</b>.`)}${ex("הריח מדוכן האוכל ברחוב מגיע ליואב ומעורר זיכרון רגשי, כי מסלול הריח עובר במערכת הלימבית.")}`,q:"q27"},
  {h:"מגע, כאב ומיקום הגוף",html:`<p>בעור יש כמה סוגי קולטנים: גופיפי מייסנר (לחץ קל, רטט איטי), פאצ׳יני (לחץ חולף, רטט מהיר), דיסקיות מרקל (לחץ קל), רופיני (מתיחה), ו<b>קצות עצב חופשיים</b> לטמפרטורה ולזיהוי פגיעה (<b>נוציספציה</b>). המידע מגיע לקורטקס התחושתי באונה הקודקודית.</p><div class="tw"><table><tr><th>כאב דלקתי</th><th>כאב נוירופתי</th></tr><tr><td>מאותת על פגיעה ברקמה</td><td>נובע מפגיעה בנוירונים עצמם, שמגבירה את אותות הכאב</td></tr></table></div>${def("חוסר רגישות מולד לכאב",`מחלה גנטית נדירה: מרגישים חום ולחץ, אבל לא כאב. התוצאה: פציעות קשות וזיהומים, ותוחלת חיים קצרה יותר. זה מראה כמה הכאב <b>מגן</b>.`)}${tiles([["cycle","שיווי משקל","מערכת וסטיבולרית באוזן הפנימית. בעיה בה = מחלת תנועה וסחרחורת"],["hand","פרופריוספציה","תחושת <b>המיקום</b> של הגוף"],["sprout","קינסתזיה","תחושת <b>התנועה</b> של הגוף במרחב"]])}`,q:"q29"}
 ]},
 {id:"t7",icon:"copies",title:"עקרונות הגשטלט",blocks:[
  {h:"השלם שונה מסכום חלקיו",html:`${def("על מה הנושא",`איך המוח מארגן את מה שהוא קולט לצורות שלמות.<br><b>מה נלמד כאן:</b> גשטלט · דמות ורקע · קרבה · דמיון · רציפות · סגירות · מערך תפיסתי`)}<p><b>מקס ורטהיימר</b> הראה שאנשים רואים תנועה בתמונות סטטיות שמהבהבות מהר. יחד עם <b>קלר וקופקה</b> הוא ייסד את פסיכולוגיית ה<b>גשטלט</b> (״צורה״). הרעיון: <b>השלם שונה מסכום חלקיו</b>. התפיסה מוסיפה מבנה, בדרכים צפויות.</p>${fig("gest37")}<div class="tw"><table><tr><th>עיקרון</th><th>מה זה</th><th>דוגמה</th></tr><tr><td><b>דמות ורקע</b></td><td>מפרידים בין עצם במרכז לבין רקע</td><td>אגרטל או שני פרצופים</td></tr><tr><td><b>קרבה</b></td><td>דברים קרובים נראים כקבוצה</td><td>קריאה בלי רווחים בין מילים</td></tr><tr><td><b>דמיון</b></td><td>דברים דומים נראים כקבוצה</td><td>שחקנים לפי צבע החולצה</td></tr><tr><td><b>רציפות</b></td><td>מעדיפים קווים רציפים וחלקים</td><td>X נראה כשני קווים שנחתכים</td></tr><tr><td><b>סגירות</b></td><td>משלימים צורות חסרות</td><td>עיגול מקווקו נראה עיגול</td></tr></table></div>`,q:"q31"},
  {h:"השערות תפיסתיות ומערך תפיסתי",html:`${def("השערה תפיסתית",`התפיסה נשענת על <b>ניחושים מושכלים</b> שמושפעים מאישיות, ניסיון וציפיות. יחד הם יוצרים <b>מערך תפיסתי</b> ${E("Perceptual set")}: מילה שאומרים לפני דמות דו־משמעית משנה את מה שרואים בה.`)}${def("הטיה ותרבות",`מחקרים מצאו ש<b>הטיה גזעית סמויה</b> משפיעה על התפיסה: משתתפים זיהו נשק מהר יותר כשהוא הופיע ליד תמונה של אדם שחור, ומיהרו יותר ״לירות״ במטרות חמושות שחורות במשחק מחשב.`)}${ex("יואב מחכה לחבר עם מעיל אדום, ו״מזהה״ אותו בכל אדם עם מעיל אדום ברחוב. הציפייה יצרה מערך תפיסתי.")}${rem("זה מסכם את הפרק: <b>תחושה</b> קולטת, ו<b>תפיסה</b> מארגנת ומפרשת, לפי חוקי הגשטלט ולפי מה שאנחנו מצפים לראות.")}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מה ההבדל בין תחושה לתפיסה?","a":"תחושה קולטת גירוי; תפיסה מארגנת ומפרשת אותו","w":["תפיסה קולטת גירוי; תחושה מארגנת ומפרשת אותו בהמשך","תחושה קיימת רק בראייה, ותפיסה בכל שאר החושים","אין הבדל, אלה שני שמות לאותו תהליך"],"e":"תחושה היא הצד הפיזי (קולטנים מזהים גירוי). תפיסה היא הצד הפסיכולוגי (ארגון, פירוש וחוויה מודעת)."},{"q":"יואב מריח קינמון ונזכר בעוגה של סבתא. מה מבין אלה הוא תפיסה?","a":"ההיזכרות בעוגה של סבתא","w":["הקליטה של מולקולות הריח באף","הפיכת הריח לפוטנציאל פעולה בעצב","ההגעה של מולקולות הריח לאף"],"e":"הקליטה וההתמרה הן תחושה. הפירוש והמשמעות (העוגה של סבתא) הם תפיסה."}]},"q2":{"t":"t1","v":[{"q":"מהי התמרה?","a":"הפיכת אנרגיית הגירוי לפוטנציאלי פעולה","w":["הפסקת התגובה לגירוי שנמשך הרבה זמן","ארגון המידע החושי לצורות שלמות במוח","הבחירה במה לשים לב מתוך כל הגירויים"],"e":"התמרה היא השלב שבו אור, קול או ריח הופכים לאות עצבי. הפסקת תגובה לגירוי קבוע היא הסתגלות חושית."}]},"q3":{"t":"t1","v":[{"q":"מהו סף מוחלט?","a":"העוצמה המינימלית שמזהים ב־50% מהפעמים","w":["העוצמה המקסימלית לפני שהגירוי מתחיל לכאוב","השינוי הקטן ביותר שאפשר להבחין בו בין שני גירויים","העוצמה שבה מזהים גירוי בכל הפעמים, בלי יוצא מן הכלל"],"e":"הסף המוחלט מוגדר כעוצמה שמזהים במחצית מהניסיונות. השינוי הקטן בין גירויים הוא סף ההבדל."},{"q":"מה אומר חוק ובר?","a":"סף ההבדל הוא יחס קבוע מהגירוי המקורי","w":["סף ההבדל זהה בכל עוצמה של גירוי, בכל החושים","גירוי תת־סיפי משפיע מאוד על ההתנהגות בחיים","הסף המוחלט שווה אצל כל בני האדם"],"e":"ככל שהגירוי המקורי חזק יותר, צריך שינוי גדול יותר כדי להבחין בו. לכן מסך טלפון בולט בקולנוע חשוך ולא באצטדיון מואר."}]},"q4":{"t":"t1","v":[{"q":"מה הפרק אומר על מסרים תת־סיפיים?","a":"במעבדה מעבדים אותם, אבל בחיים השפעתם קטנה מאוד","w":["הם משנים התנהגות קנייה באופן חזק, עקבי ומוכח","אי אפשר לעבד אותם בשום צורה, גם לא במעבדה","הם עובדים רק כשהם מעל לסף המודעות"],"e":"אנשים יכולים לעבד מידע מחוץ למודעות, אבל ״מסרים נסתרים״ משפיעים מעט מאוד על התנהגות מחוץ למעבדה."}]},"q5":{"t":"t1","v":[{"q":"אדם מחפש מפתחות עם מחזיק צהוב וסורק חפצים צהובים. איזה עיבוד זה?","a":"מלמעלה למטה","w":["מלמטה למעלה","הסתגלות חושית","התמרה"],"e":"החיפוש מונע על ידי ידע וציפייה, ולכן זה עיבוד מלמעלה למטה. רעש פתאומי שתופס קשב הוא מלמטה למעלה."},{"q":"מה מצא ניסוי הגורילה של סימונס וצ׳אבריס?","a":"כמעט חצי מהמשתתפים לא ראו את הגורילה","w":["כל המשתתפים ראו את הגורילה מיד","המשתתפים ראו את הגורילה רק כשלא ספרו","רק מומחים לכדורסל לא ראו את הגורילה"],"e":"המשתתפים ספרו מסירות, והקשב שלהם היה שם. זו דוגמה לעיוורון קשב."}]},"q6":{"t":"t1","v":[{"q":"יואב כבר לא שומע את רעש התנועה אחרי כמה דקות ברחוב. איך קוראים לזה?","a":"הסתגלות חושית","w":["עיוורון קשב","סף מוחלט","עיבוד מלמעלה למטה"],"e":"גירוי קבוע מפסיק להיות מורגש, אף שהקולטנים עדיין קולטים אותו."},{"q":"אמא מתעוררת ממלמול שקט של התינוק אבל לא מרעשים אחרים. איזו תורה מסבירה את זה?","a":"תורת זיהוי האות","w":["חוק ובר על סף ההבדל","התיאוריה התלת־צבעית","תיאוריית המקום בשמיעה"],"e":"תורת זיהוי האות עוסקת בזיהוי אות משמעותי בתוך רעש, ומראה שמוטיבציה והקשר משפיעים עליו."}]},"q7":{"t":"t1","v":[{"q":"למה אנשים מערביים רגישים יותר לאשליית מילר־לייר?","a":"הם גדלים בעולם של בניינים ״מרובעים״","w":["יש להם יותר קולטנים ברשתית","הם רואים פחות טלוויזיה מאחרים","אצלם הראייה בשתי עיניים מתפתחת מאוחר"],"e":"ההסבר הוא ניסיון: עולם עם פינות וקווים ישרים. הזולו, שגרים בבקתות עגולות, פחות רגישים לאשליה."}]},"q8":{"t":"t1","v":[{"q":"מה מלמדות הדוגמאות של תרבות, אישיות וציפייה בפרק?","a":"התפיסה מושפעת מניסיון וממה שמצפים","w":["התחושה שונה לגמרי מאדם לאדם","הקולטנים משתנים לפי התרבות","ציפיות משפיעות רק על טעם ולא על ראייה"],"e":"התחושה דומה אצל רוב האנשים, אבל התפיסה יכולה להיות שונה מאוד לפי ניסיון, תרבות וציפיות."}]},"q9":{"t":"t2","v":[{"q":"באור, מה קובע אורך הגל?","a":"את הצבע","w":["את הבהירות","את העוצמה","את המרחק"],"e":"אורך הגל קובע צבע. המשרעת קובעת בהירות."},{"q":"בקול, מה קובעת התדירות?","a":"את גובה הצליל","w":["את עוצמת הצליל","את הגוון של הכלי","את המיקום של המקור"],"e":"תדירות גבוהה = צליל גבוה. העוצמה תלויה במשרעת."}]},"q10":{"t":"t2","v":[{"q":"מה הקשר בין אורך גל לתדירות?","a":"גל ארוך = תדירות נמוכה","w":["גל ארוך = תדירות גבוהה","אין שום קשר בין השניים","גל ארוך = משרעת גבוהה"],"e":"ככל שהגל ארוך יותר, פחות גלים עוברים בשנייה, ולכן התדירות נמוכה."}]},"q11":{"t":"t2","v":[{"q":"מה הטווח שבני אדם שומעים?","a":"20 עד 20,000 הרץ","w":["380 עד 740 הרץ","2,000 עד 200,000 הרץ","0 עד 2,000 הרץ"],"e":"20–20,000 הרץ, עם רגישות גבוהה באמצע. 380–740 הוא טווח האור הנראה, בננומטרים."},{"q":"מהו האור הנראה?","a":"חלק קטן מהספקטרום האלקטרומגנטי","w":["כל הספקטרום האלקטרומגנטי, מגמא ועד רדיו","החלק של קרינת אולטרה סגול בלבד","קרינה שרק דבורים רואות"],"e":"אנחנו רואים בערך 380–740 ננומטר, חלק קטן מכל הקרינה. דבורים רואות גם אולטרה סגול."}]},"q12":{"t":"t2","v":[{"q":"מה מבדיל בין פסנתר לכינור שמנגנים אותו צליל באותה עוצמה?","a":"הגוון","w":["גובה הצליל","המשרעת","התדירות הבסיסית"],"e":"גוון (timbre) נובע משילוב של תדירות, משרעת ותזמון, והוא מה שמבדיל בין כלים."}]},"q13":{"t":"t3","v":[{"q":"מה נכון לגבי המדוכים?","a":"מרוכזים בגומה המרכזית ונותנים צבע ופרטים","w":["פזורים בשולי הרשתית ופועלים בעיקר בחושך","מזהים תנועה בשוליים, בלי לזהות צבע","נמצאים בנקודה העיוורת של העין"],"e":"מדוכים: גומה מרכזית, אור חזק, צבע ופרטים. קנים: שוליים, אור חלש, תנועה."},{"q":"למה כשנכנסים לקולנוע חשוך לא רואים כמה רגעים?","a":"העין עוברת מעבודת מדוכים לעבודת קנים","w":["האישון נסגר לגמרי בחושך ונפתח רק לאט","הקנים מפסיקים לעבוד כשיש חושך מלא","העדשה צריכה זמן להתמקד מחדש"],"e":"במעבר מאור לחושך הראייה עוברת מהמדוכים לקנים, וזה לוקח זמן."}]},"q14":{"t":"t3","v":[{"q":"מה תפקיד העדשה?","a":"למקד את האור על הגומה המרכזית","w":["לשלוט בגודל האישון לפי האור","להפוך אור לפוטנציאל פעולה","להעביר את המידע לאונה העורפית"],"e":"העדשה מכווננת את המיקוד. הקשתית שולטת בגודל האישון, והקולטנים מבצעים את ההתמרה."}]},"q15":{"t":"t3","v":[{"q":"למה לא שמים לב לנקודה העיוורת?","a":"הנקודה של כל עין במקום אחר, והמוח משלים","w":["אין לבני אדם נקודה עיוורת בכלל, רק לחיות","היא קיימת רק בעין אחת מתוך השתיים","היא נמצאת מחוץ לשדה הראייה"],"e":"במקום שבו עצב הראייה יוצ ":{"t":"t6","v":[{"q":"מהי פרופריוספציה?","a":"תחושת המיקום של הגוף","w":["תחושת התנועה של הגוף במרחב","שיווי המשקל באוזן הפנימית","זיהוי פגיעה ברקמה"],"e":"פרופריוספציה = איפה הגוף. קינסתזיה = התנועה שלו. שיווי משקל = המערכת הווסטיבולרית."}]},"q31":{"t":"t7","v":[{"q":"מה הרעיון המרכזי של פסיכולוגיית הגשטלט?","a":"השלם שונה מסכום חלקיו","w":["התחושה קובעת לבד את מה שנתפס","כל אדם תופס אחרת בלי שום חוקיות","התפיסה היא רק עיבוד מלמטה למעלה"],"e":"התפיסה מוסיפה מבנה לקלט החושי, בדרכים צפויות. מכאן המשפט ״השלם שונה מסכום חלקיו״."},{"q":"עיגול מקווקו נראה לנו כעיגול שלם. איזה עיקרון זה?","a":"סגירות","w":["קרבה","דמיון","דמות ורקע"],"e":"סגירות = נטייה להשלים צורות חסרות."}]},"q32":{"t":"t7","v":[{"q":"אנחנו קוראים טקסט בלי רווחים בקושי. איזה עיקרון זה מדגים?","a":"קרבה","w":["סגירות","רציפות","דמות ורקע"],"e":"הרווחים יוצרים קבוצות של אותיות קרובות. בלי רווחים קשה לקבץ אותן למילים."},{"q":"איזה עיקרון מסביר שאנחנו מקבצים שחקנים לפי צבע החולצה?","a":"דמיון","w":["קרבה","סגירות","רציפות"],"e":"דברים דומים נראים כקבוצה."}]},"q33":{"t":"t7","v":[{"q":"מהו מערך תפיסתי?","a":"ציפיות וניסיון שמשפיעים על מה שנתפס","w":["רשימת חוקי הגשטלט, מסודרת לפי חשיבות","קבוצת הקולטנים של חוש מסוים","המקום במוח שבו מתרחשת התפיסה"],"e":"השערות תפיסתיות (ניחושים מושכלים) יוצרות מערך תפיסתי. למשל, מילה לפני דמות דו־משמעית משנה מה רואים."},{"q":"מה מצאו המחקרים על הטיה גזעית סמויה ותפיסה?","a":"נשק זוהה מהר יותר ליד תמונה של אדם שחור","w":["לא נמצאה שום השפעה של הטיה על התפיסה","הטיה השפיעה רק על שמיעה ולא על ראייה","נשק זוהה לאט יותר ליד כל תמונה של אדם"],"e":"הממצאים מראים שהטיה סמויה משפיעה על מה שאנשים ״רואים״ ועל תגובות מהירות."}]},"q34":{"t":"t7","v":[{"q":"מי ייסד את פסיכולוגיית הגשטלט?","a":"ורטהיימר, קלר וקופקה","w":["האבל, ויזל ולנד","סימונס, צ׳אבריס ומוסט","ובר, פרויד וג׳יימס"],"e":"ורטהיימר הראה תנועה מדומה בתמונות שמהבהבות, ויחד עם קלר וקופקה ייסד את הגישה."}]}};
const SUM=`<h2>סיכום: Spielman פרק 5 - תחושה ותפיסה</h2>
<div class="key"><b>על מה מדובר?</b> הפרק מסביר איך העולם ״נכנס״ לראש. <b>תחושה</b> היא הקליטה: קולטנים מזהים אור, קול, ריח או מגע, והופכים אותם לאות עצבי. <b>תפיסה</b> היא הפירוש: המוח מארגן את האותות ונותן להם משמעות, לפי ניסיון וציפיות. הפרק עובר על הספים (כמה חזק גירוי צריך להיות), על אור וקול כגלים, על הראייה והשמיעה בפירוט, על שאר החושים, ובסוף על <b>עקרונות הגשטלט</b>: הכללים שלפיהם המוח מארגן את מה שהוא קולט לצורות שלמות.</div>

<h3>הדוגמה שתלווה אותנו: יואב בפינת הרחוב</h3>
<p>הפרק נפתח באדם שעומד בפינת רחוב: מכוניות ואנשים זזים, נגן רחוב מנגן, צופר רחוק, ריח מדוכן אוכל, והמדרכה קשה מתחת לרגליים. נקרא לו יואב, ונבדוק דרכו כל חוש וכל מושג.</p>

<h3>1. תחושה, תפיסה וספים</h3>
<ul>
<li><b>תחושה</b> = הצד הפיזי: קולטנים מזהים גירוי. <b>התמרה</b> = הפיכת האנרגיה לפוטנציאלי פעולה. <b>תפיסה</b> = הצד הפסיכולוגי: ארגון ופירוש. יואב מריח קינמון (תחושה) ונזכר בעוגה של סבתא (תפיסה).</li>
<li><b>סף מוחלט</b> = העוצמה המינימלית שמזהים ב־50% מהפעמים. <b>תת־סיפי</b> = מתחת למודעות; במעבדה מעבדים, אבל בחיים ההשפעה קטנה מאוד.</li>
<li><b>סף הבדל</b> (JND) = השינוי הקטן ביותר שמבחינים בו. <b>חוק ובר</b>: הוא יחס קבוע מהגירוי המקורי. מסך טלפון בולט בקולנוע חשוך, לא באצטדיון מואר.</li>
</ul>
<p>מה קובע מה נשים לב אליו? הטבלה מסכמת:</p>
<div class="tw"><table><tr><th>מושג</th><th>מה זה</th><th>אצל יואב</th></tr>
<tr><td><b>מלמטה למעלה</b></td><td>הגירוי עצמו תופס קשב</td><td>זכוכית נשברת לידו, והוא מסתובב</td></tr>
<tr><td><b>מלמעלה למטה</b></td><td>ידע וציפייה מכוונים</td><td>הוא מחפש חבר עם מעיל אדום</td></tr>
<tr><td><b>הסתגלות חושית</b></td><td>גירוי קבוע מפסיק להיות מורגש</td><td>אחרי כמה דקות לא שומע את התנועה</td></tr>
<tr><td><b>עיוורון קשב</b></td><td>לא רואים דבר גלוי כי הקשב במקום אחר</td><td>מתרכז בטלפון ולא רואה שהחבר עבר</td></tr>
<tr><td><b>זיהוי אות</b></td><td>זיהוי אות בתוך רעש, תלוי מוטיבציה</td><td>שומע את השם שלו בתוך המהומה</td></tr></table></div>
<ul>
<li><b>ניסוי הגורילה</b> (סימונס וצ׳אבריס, 1999): ספרו מסירות, וכמעט חצי לא ראו גורילה שעברה 9 שניות.</li>
<li><b>התפיסה מושפעת מתרבות וציפייה:</b> מערביים רגישים יותר לאשליית מילר־לייר (עולם ״מרובע״); הזולו, בבקתות עגולות, פחות. מי שיש לו יחס חיובי למזון דל שומן מדרג אותו כטעים יותר.</li>
</ul>

<h3>2. גלים: אור וקול</h3>
<div class="tw"><table><tr><th>תכונה</th><th>באור</th><th>בקול</th></tr>
<tr><td><b>משרעת</b> (גובה הגל)</td><td>בהירות</td><td>עוצמה (דציבל)</td></tr>
<tr><td><b>אורך גל / תדירות</b></td><td>צבע</td><td>גובה צליל</td></tr>
<tr><td><b>טווח אנושי</b></td><td>380–740 ננומטר</td><td>20–20,000 הרץ</td></tr></table></div>
<ul>
<li>גל ארוך = תדירות נמוכה. <b>גוון</b> = מה שמבדיל בין כלי נגינה באותו צליל.</li>
<li>שיחה = 60 דציבל; תנועה כבדה 85 (נזק אחרי 8 שעות); אוזניות במלוא העוצמה 100–105 (נזק אחרי 15 דקות); סף כאב 130. כשליש מאובדן השמיעה נגרם מרעש.</li>
</ul>

<h3>3. ראייה</h3>
<p>האור עובר דרך הקרנית, האישון (שהקשתית שולטת בגודלו) והעדשה, אל הגומה המרכזית שברשתית. שם יש שני סוגי קולטנים:</p>
<div class="tw"><table><tr><th></th><th>מדוכים</th><th>קנים</th></tr>
<tr><td>איפה</td><td>בגומה המרכזית</td><td>בשאר הרשתית</td></tr>
<tr><td>אור</td><td>חזק</td><td>חלש</td></tr>
<tr><td>נותנים</td><td>פרטים וצבע</td><td>תנועה בשוליים, בלי צבע</td></tr></table></div>
<ul>
<li>כשיואב נכנס מהרחוב לקולנוע חשוך, לוקח זמן לעבור מהמדוכים לקנים.</li>
<li>תאי גנגליון ← <b>עצב הראייה</b>. איפה שהוא יוצא: <b>נקודה עיוורת</b> (לא מורגשת, כי המוח משלים). ב<b>הצטלבות הראייה</b> שדה ימין עובר לצד שמאל של המוח. משם לאונה העורפית, בשני מסלולים: <b>״מה״</b> (זיהוי) ו<b>״איפה/איך״</b> (מיקום ותנועה).</li>
<li><b>האבל וויזל</b> (נובל 1981): תאים שמגיבים לקווים בכיוון מסוים; בגורי חתולים, עין סגורה בתקופה קריטית ״איבדה״ את השטח שלה במוח.</li>
<li><b>צבע:</b> התיאוריה ה<b>תלת־צבעית</b> (שלושה סוגי מדוכים, ברשתית) ותיאוריית ה<b>תהליך המנוגד</b> (זוגות: שחור־לבן, צהוב־כחול, ירוק־אדום, אחרי הרשתית; מסבירה <b>תמונות שאריתיות</b>). הן משלימות. עיוורון אדום־ירוק תורשתי דרך X, ולכן שכיח בגברים.</li>
<li><b>עומק:</b> רמזים <b>דו־עיניים</b> (פער דו־עיני, ככה עובד תלת־ממד) ורמזים <b>חד־עיניים</b> (פרספקטיבה קווית, חפיפה, גודל יחסי), שבזכותם רואים עומק גם בציור.</li>
</ul>

<h3>4. שמיעה</h3>
<ul>
<li><b>המסלול:</b> עור התוף ← פטיש, סדן, ארכוף ← השבלול ← <b>תאי שערה</b> על <b>הקרום הבסיסי</b> ← עצב השמע ← תלמוס ← קורטקס השמיעה ב<b>אונה הרקתית</b>.</li>
<li><b>גובה צליל:</b> תיאוריה <b>זמנית</b> (קצב ירי; לא מגיעה לכל הטווח) ותיאוריית <b>המקום</b> (בסיס הקרום = גבוהים, הקצה = נמוכים). עד כ־4,000 הרץ שתיהן; מעל זה רק מקום.</li>
<li><b>מיקום:</b> הצופר נשמע <b>חזק</b> ו<b>מוקדם</b> יותר באוזן הימנית של יואב (רמזים דו־אוזניים = ימין או שמאל). צורת האפרכסת עוזרת לדעת למעלה, למטה, לפנים ולאחור.</li>
<li><b>אובדן שמיעה:</b> <b>הולכתי</b> (הקול לא מגיע לשבלול; מכשיר שמיעה עוזר) מול <b>תחושתי־עצבי</b> (הנפוץ; האות לא עובר למוח; לפעמים שתל שבלול). מחלת מנייר: אובדן שמיעה, טנטון וסחרחורת. תרבות החירשים מעדיפה שפת סימנים.</li>
</ul>

<h3>5. החושים האחרים</h3>
<ul>
<li><b>טעם:</b> מתוק, מלוח, חמוץ, מר, <b>אומאמי</b> (ואולי שומן). בלוטות הטעם מתחדשות כל 10–14 ימים.</li>
<li><b>ריח:</b> קולטנים באף ← בולבוס הריח ← <b>המערכת הלימבית</b>. לכן הריח מהדוכן מעורר אצל יואב זיכרון רגשי. <b>פרומונים</b> אצל בני אדם שנויים במחלוקת.</li>
<li><b>מגע:</b> כמה סוגי קולטנים בעור, וקצות עצב חופשיים לחום ולזיהוי פגיעה. הכל מגיע לאונה הקודקודית.</li>
<li><b>כאב:</b> <b>דלקתי</b> (פגיעה ברקמה) מול <b>נוירופתי</b> (פגיעה בנוירונים). חוסר רגישות מולד לכאב מראה כמה הכאב מגן: פציעות, זיהומים ותוחלת חיים קצרה.</li>
<li><b>שיווי משקל</b> (מערכת וסטיבולרית באוזן הפנימית), <b>פרופריוספציה</b> (מיקום הגוף), <b>קינסתזיה</b> (תנועת הגוף).</li>
</ul>

<h3>6. עקרונות הגשטלט</h3>
<p>ורטהיימר, קלר וקופקה טענו ש<b>השלם שונה מסכום חלקיו</b>: המוח מארגן את הקלט לפי חוקים קבועים.</p>
<div class="tw"><table><tr><th>עיקרון</th><th>מה זה</th><th>דוגמה</th></tr>
<tr><td>דמות ורקע</td><td>מפרידים עצם מרקע</td><td>אגרטל או שני פרצופים</td></tr>
<tr><td>קרבה</td><td>קרובים = קבוצה</td><td>רווחים בין מילים</td></tr>
<tr><td>דמיון</td><td>דומים = קבוצה</td><td>שחקנים לפי צבע חולצה</td></tr>
<tr><td>רציפות</td><td>מעדיפים קווים חלקים</td><td>X = שני קווים נחתכים</td></tr>
<tr><td>סגירות</td><td>משלימים חסר</td><td>עיגול מקווקו = עיגול</td></tr></table></div>
<p><b>השערות תפיסתיות</b> יוצרות <b>מערך תפיסתי</b>: יואב מחכה לחבר עם מעיל אדום, ו״רואה״ אותו בכל מעיל אדום. מחקרים גם מצאו ש<b>הטיה גזעית סמויה</b> משפיעה על התפיסה (נשק זוהה מהר יותר ליד תמונה של אדם שחור).</p>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>סף מוחלט = זיהוי ב־50%</b>, לא ב־100%.</li>
<li><b>סף ההבדל לא קבוע</b>: לפי חוק ובר הוא יחס קבוע מהגירוי, ולכן גדל עם העוצמה.</li>
<li><b>באור, אורך הגל = צבע</b>; המשרעת = בהירות. <b>בקול, תדירות = גובה</b>; משרעת = עוצמה.</li>
<li><b>מדוכים = צבע ופרטים, בגומה; קנים = חושך ושוליים.</b></li>
<li><b>שתי תיאוריות הצבע לא סותרות</b>; תמונה שארית מוסברת בתהליך המנוגד.</li>
<li><b>תיאוריית המקום: בסיס הקרום = צלילים גבוהים.</b></li>
<li><b>אובדן תחושתי־עצבי הוא הנפוץ</b>, ומכשיר שמיעה עוזר בעיקר בהולכתי.</li>
<li><b>פרופריוספציה = מיקום; קינסתזיה = תנועה.</b></li>
<li><b>עיוורון קשב ≠ הסתגלות חושית</b>: הראשון בגלל קשב במקום אחר, השני בגלל גירוי קבוע.</li>
</ul></div>`;
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){S.done[T[ti].id]={r,n};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);
}
if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
