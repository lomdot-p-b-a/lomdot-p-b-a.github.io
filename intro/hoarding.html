/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}

p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}

.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}

.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>

const T=[
 {id:"t1",icon:"building",title:"מהי אגרנות כפייתית",blocks:[
  {h:"הגדרה ושכיחות",html:`${def("על מה הנושא",`מהי אגרנות, ואיך מבדילים אותה מסתם בלגן או מאיסוף? הנושא מציג את ההגדרה והקריטריונים.<br><b>מה נלמד כאן:</b> הגדרה ושכיחות · טעויות בהערכה · קריטריונים ב-DSM-5 · רמות תובנה`)}${def("מושג מפתח",`<mark>אגרנות</mark> ${E("Hoarding Disorder")}: הפרעה שמאופיינת ב<b>איסוף בלתי נשלט</b> של חפצים, תוך ייחוס משמעות לחפצים ובלי הבחנה בערכם האמיתי, ו<b>אי־יכולת להיפרד</b> מהם. האגירה מצמצמת את מרחב המחיה כמעט עד אפס, פוגעת באיכות החיים ולרוב מביאה להזנחה עצמית וסביבתית.`)}${tiles([["doc","DSM-5, 2013","רק אז הוכרה כהפרעה נפשית נפרדת"],["people","2% עד 6%","מהאוכלוסייה. חוצה מגדרים ומעמדות"],["clock","שנות ה-30","הסימנים הראשונים. ביטוי קיצוני בגיל הזיקנה"]])}${ex("אחד האזכורים הראשונים: ברומן \"הנפשות המתות\" של גוגול (1842) יש זקן עשיר מאוד שחי בזוהמה, בבית עמוס חפצים ישנים ושבורים.")}`,q:"q1"},
  {h:"טעויות נפוצות בהערכה",html:`<p>כ-50% מהאגרנים חיים בלי גישה לכיריים ולמקרר, וכ-10% בלי גישה לשירותים. אבל רק <b>כ-6%</b> מדווחים שהם בסכנה רפואית ממשית.</p>${yn([],["כל מי שחי בהזנחה קשה נמצא בסכנה","אגרנות תמיד באה עם הזנחה (יש אגרנים שמקפידים מאוד על סדר וניקיון)","אגרנים חוו בעבר מחסור קשה (מי שגדל בעוני לא הופך לאגרן יותר ממי שגדל בשפע)"])}${rem("הערכה מוטעית שכל אגרן בסכנה עלולה להוביל לתכנית התערבות <b>לא מותאמת</b>, ואף כזו שפוגעת בזכויות האגרן.")}`,q:"q3"},
  {h:"הקריטריונים ב-DSM-5",html:`<p>לכולנו יש חפצים שקשה לנו לזרוק. ה-DSM מבחין בין זה לבין אגרנות כפייתית, שנמשכת <b>לפחות חצי שנה</b> וכוללת:</p>${tiles([["x","קושי עקבי להיפרד","מחפצים, בלי קשר לערכם האמיתי"],["lock","צורך לשמור","הקושי נובע מצורך לשמור, גם כשהחפצים לא שמישים"],["building","עומס על אזורי מחיה","שפוגע בייעוד שלהם. אם יש סדר, זה רק בזכות צד שלישי"],["question","מצוקה או פגיעה","חברתית, תעסוקתית, או בשמירה על סביבה בטוחה"],["brain","לא בגלל מצב רפואי","כמו פגיעה מוחית"],["copies","לא מוסבר בהפרעה אחרת","כמו OCD, דיכאון, סכיזופרניה או דמנציה"]])}${def("רמות תובנה",`<b>טובה:</b> מבין שההתנהגות בעייתית. <b>ירודה:</b> משוכנע ברוב המקרים שאין בעיה. <b>אין תובנה (מחשבות שווא):</b> משוכנע לחלוטין שאין בעיה, למרות המציאות.`)}${ex(`<b>תובנה טובה</b>: "אני יודעת שיש לי יותר מדי דברים, אבל קשה לי לזרוק". <b>אין תובנה</b>: "הבית שלי מסודר מצוין, כל השכנים פשוט מגזימים", כשאי אפשר להגיע למטבח.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"brain",title:"איך ההפרעה מתפתחת",blocks:[
  {h:"עולמו של האגרן",html:`${def("על מה הנושא",`איך אדם מגיע למצב של אגרנות? הנושא מתאר את עולמו של האגרן ואת השלבים שבהם ההפרעה מתפתחת.<br><b>מה נלמד כאן:</b> עולמו של האגרן · חמשת השלבים · אבחון וטיפול`)}<p>לאגרן יש צורך סובייקטיבי \"להציל\" את החפצים, ומצוקה כשצריך להשליך אותם. הוא ממשיך לאגור לאורך כל חייו: קנייה, חיטוט בפחי זבל ואיסוף חפצים שאין בהם צורך.</p>${tiles([["clock","\"אצטרך את זה\"","בהתחלה: הסבר של שימוש עתידי, שלו או של אחרים"],["copies","\"קודם אמיין\"","אחר כך: אי אפשר לזרוק עד שימיין. המיון כמובן לא קורה"],["hand","חלק מהגוף","ערך סנטימנטלי. ויתור על חפץ מרגיש כמו ויתור על חלק מגופו"]])}${rem("ההפרעה פוגעת גם בתפקוד בבית (מקלחת, מטבח, שירותים), יוצרת סיכון בטיחותי, ופוגעת פיזית, חברתית וכלכלית גם <b>בבני הבית והשכנים</b>.")}`,q:"q7"},
  {h:"חמשת השלבים",html:`${fig("stages","לפי סולם ICD Clutter-Hoarding Scale")}${rem("<b>שלב 3 הוא נקודת המפנה</b>: מכאן צריך התערבות של אנשי מקצוע שונים. בשלב 5 צריך התערבות <b>אינטנסיבית ורב־מקצועית</b>.")}`,q:"q9"},
  {h:"אבחון וטיפול",html:`<p>בעבר אגרנות נחשבה לחלק מ<mark>הפרעת אישיות טורדנית־כפייתית</mark> ${E("OCPD")}. אבל האגרן <b>נהנה</b> מהאיסוף, מתמכר לתהליך ומרגיש שלחפצים יש ערך רגשי, מה שלא קיים ב-OCPD. רק 5% עד 10% מבעלי OCPD סובלים גם מאגרנות.</p>${tiles([["brain","בסיס נוירו־ביולוגי","פעילות יתר באזור הקדמי של המוח, שפועל בקבלת החלטות"],["copies","תחלואה כפולה","דיכאון, פוביות, חרדות, פוסט־טראומה, סכיזופרניה. כ-30% עם הפרעת קשב"],["building","פגיעה אורגנית","דמנציה, גידול או טראומה מוחית יכולים להוביל לאגירה"]])}${rem("<b>קשה לטיפול.</b> תרופות (כמו SSRI) עוזרות בעיקר להפרעות הנלוות ולא לאגרנות עצמה. טיפול נוסף: CBT, טיפול קוגניטיבי־התנהגותי.")}`,q:"q11"}
 ]},
 {id:"t3",icon:"scales",title:"הדילמה האתית",blocks:[
  {h:"חופש הפרט מול חובה להגן",html:`${def("על מה הנושא",`כשאדם מסרב לעזרה אבל ביתו מסוכן, מה העובד הסוציאלי צריך לעשות? הנושא מציג את הדילמה.<br><b>מה נלמד כאן:</b> חופש הפרט · חובת ההגנה · החוק והאתיקה`)}${fig("dilemma")}<p>רוב האגרנים <b>צלולים</b>, מסוגלים להביע את רצונם, מודעים למצבם ולא רואים פגם באורח חייהם. מכאן הדילמה המרכזית של העובד הסוציאלי:</p>${tiles([["id","לכבד","לכבד את רצונו ולאפשר לו לחיות לפי ראות עיניו, גם בהזנחה קיצונית"],["hand","להגן","למלא את המחויבות המקצועית: תנאי מחיה סבירים ומניעת סכנות, גם בעזרת פנייה לחוק"],["people","הסביבה","ריחות, מזיקים וחפצים שגולשים לחללים משותפים פוגעים בשכנים"]])}`,q:"q13"},
  {h:"החוק והאתיקה",html:`${tiles([["scales","חוק יסוד: כבוד האדם וחירותו (1992)","אין פוגעים בחייו, בגופו, בכבודו או בקניינו של אדם. לכל אדם זכות לפרטיות"],["doc","חוק העובדים הסוציאליים (1996)","קידום רווחת הפרט והחברה, תוך שמירה על כבוד האדם ושוויון"],["check","קוד האתיקה (1995)","הערך הראשון: <b>עצמאות ואחריות</b> האדם לנהל את חייו ולבחור את תנאי קיומו"]])}${def("הקושי בפועל",`מצד אחד, העובד רואה אדם במצב ירוד ונדרש לעזור <b>מיד</b>. מצד שני, נדרש להימנע מהתערבות <b>בלי שיתוף והסכמה</b>. ובנוסף, יש לחץ מהקהילה, מבני משפחה ומארגונים, שמפנים \"אצבע מאשימה\" כלפי העובד הסוציאלי.`)}`,q:"q15"}
 ]},
 {id:"t4",icon:"id",title:"המקרה של יצחק",blocks:[
  {h:"ההיכרות והמעקב",html:`${def("על מה הנושא",`המקרה של יצחק מראה שלוש דרכים שונות לטפל באותו אדם, ומה קרה בכל אחת.<br><b>מה נלמד כאן:</b> מעקב תקופתי · התערבות בחסות החוק · התערבות בהסכמה`)}<p><b>יצחק</b> (שם בדוי), בן 84, ערירי, אגרן כפייתי \"קלאסי\". ההיכרות התחילה כעשור קודם: פנייה בגלל הזנחה, ובמשרד הופיע אדם צלול ומתפקד שסירב לכל עזרה.</p><p>שנים אחר כך הגיעה פנייה על \"חסר בית שמקבץ נדבות\". זה היה יצחק: גר בדירתו, מקבץ נדבות כל יום ומחזיק עגלה מלאה שקיות.</p>${def("דרך 1: מעקב תקופתי",`במשך שנתיים, אחת לכמה חודשים, עובד סוציאלי הציע עזרה. יצחק סירב שוב ושוב, ותגובותיו נעשו קיצוניות יותר. העובד הרגיש שהביקורים <b>פוגעים באוטונומיה</b> שלו ואף מטרידים אותו.`)}${rem("<b>דילמה:</b> גם הקשיש וגם הקהילה (שהתלוננה) הם \"לקוחות\" של המחלקה, והאינטרסים שלהם מנוגדים. הצוות החליט להתמקד בצורכי הקשיש.")}`,q:"q17"},
  {h:"הביקור בבית ו\"בחסות החוק\"",html:`<p>בביקור: הדלת נפתחה רק 30 עד 40 ס\"מ, חפצים עד התקרה, ויצחק ישן מקופל בישיבה על שתי מרצפות. הדירה מנותקת ממים, חשמל וגז. הוא אמר: \"אני לא צריך כלום\". הבקשה היחידה שלו: <b>לסלק את העכברושים</b>.</p><p>אבחון פסיכוגריאטרי (ברחוב, כי סירב להגיע): דמנציה סנילית, המלצה על אפוטרופוס וסידור מוסדי. הוא סירב.</p>${def("דרך 2: התערבות \"בחסות החוק\"",`בית המשפט מינה אפוטרופוס זמני <b>לפינוי ולחיבור לחשמל ומים בלבד</b>. ביום הפינוי הגיעו כעשרה אנשים, ואחרי כמה שעות הפינוי הופסק בגלל הצעקות והכעס של יצחק. הפינוי גרם לו <b>נזק רגשי רב</b>, והוא טען שנעלמו חפצים יקרים ושנפגעה פרטיותו.`)}`,q:"q19"},
  {h:"דרך 3: התערבות \"בהסכמה\"",html:`<p>הוחלט על פינוי <b>איטי</b> בגיבוי בית המשפט, עם <mark>מלווה אישי</mark>: איש מקצוע־עזר שמכיר את הקהילה, רגיש, סבלני ובלי רתיעה מההזנחה.</p>${tiles([["hand","קשר","המלווה הגיע כל יום, דאג לאוכל, שתייה ובגדים, ונוצר קשר משמעותי"],["copies","יצחק ממיין","יצחק מיין בעצמו, והמלווה זרק. איטי מאוד, עם עליות ומורדות"],["check","הבקשה נענתה","המלווה פיזר רעל וסילק את העכברושים"]])}${rem("אחרי כשנה: הכניסה, המטבח, המקלחת והשירותים פונו. יצחק <b>הסכים</b> לחבר חשמל ומים, הלך עם המלווה לבנק לשלם חובות, ואף ביקש בעצמו דלת, תאורה ובדיקות ראייה.")}`,q:"q21"},
  {h:"ההחמרה והמעבר",html:`<p>כעבור זמן מצבו הגופני הידרדר והוא תלוי לגמרי במלווה. הצוות שוב התלבט: האם עכשיו לפעול נגד רצונו?</p><p>הוא הסכים לבדיקה רפואית ואחר כך <b>לאשפוז</b>, אחרי שיחות רבות ועם הבטחה לביקורים. בבדיקה השנייה נשללה סכיזופרניה וצוינה <b>הפרעת אישיות</b>. יצחק התנגד לסידור מוסדי, אבל <b>המלווה</b> שכנע אותו לעבור לבית אבות זמנית.</p>${ex("אחרי שבוע ביקש להישאר: \"טוב לי כאן, בבית אין לי תנאים כמו שיש פה\". בסוף הדרך מצבו טוב ויציב, עלה במשקל, מצב רוחו רגוע והוא מביע שביעות רצון.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"bulb",title:"הדיון: לטפל בהסכמה",blocks:[
  {h:"שלוש דרכים, שלוש תוצאות",html:`${def("על מה הנושא",`למה "התערבות בהסכמה" עבדה הכי טוב, ממה היא בנויה, ומה המחיר שלה?<br><b>מה נלמד כאן:</b> השוואה בין הדרכים · מרכיבי ההתערבות · מחירים ומגבלות`)}${waysTable}<p>לפי סולם השלבים, יצחק היה ב<b>שלב החמישי</b>. החוקרים מציינים שרוב המחקרים מתמקדים ב-CBT, ושיש מחסור בידע על עבודה סוציאלית עם אגרנים. לכן הטיפול התנהל ב<b>ניסוי וטעייה</b>.</p>${rem("האבחנות השונות ואף הסותרות שיצחק קיבל מוסברות בכך שההפרעה מלווה במחלות נוספות ושהמקור שלה יכול להיות שונה.")}`,q:"q25"},

  {h:"מחירים ומגבלות",html:`${def("המסקנה",`\"התערבות בהסכמה\" היא הדרך <b>המיטבית</b>: התוצאות הטובות ביותר <b>בלי פגיעה במצבו הנפשי</b>. היא פותרת את הדילמה האתית כי היא מאפשרת שיפור <b>איטי אך בטוח</b>, בהסכמת המטופל ובלי לפגוע באוטונומיה שלו.`)}${tiles([["clock","המחיר","הרבה זמן, השקעה רגשית, התמדה, ואורך רוח. גיוס והכשרה של מלווים ואנשי מקצוע נוספים"],["question","לא בטוח","אין ודאות שבלי ההתערבות \"בחסות החוק\" היו מגיעים לאותן תוצאות"],["x","לא לכל מקרה","פחות מתאים כשהאגרן לא עצמאי וצריך טיפול רפואי דחוף"],["doc","מקרה אחד","צריך לבחון את השיטה במקרים נוספים ובמחקר שדה"]])}`,q:"q29"}

const Q={"q1":{"t":"t1","v":[{"q":"אישה אוספת בולים יקרים, מסדרת אותם באלבומים ומוכרת חלק מהם. מה מבדיל אותה מאגרנית לפי ההגדרה?","a":"היא מבחינה בערך החפצים ומסוגלת להיפרד מהם","w":["היא אוספת רק סוג אחד ומסוים של חפצים","היא נהנית מאוד מתהליך האיסוף עצמו","היא מקפידה מאוד על סדר וניקיון בבית"],"e":"אגרנות מוגדרת כאיסוף בלי הבחנה בערך החפצים, ואי־יכולת להיפרד מהם. האספנית מבחינה בערך ומוכרת חלק מהבולים, ולכן היא לא אגרנית. איסוף של סוג אחד בלבד אינו ההבדל."},{"q":"מתי הוכרה אגרנות כהפרעה נפשית נפרדת?","a":"ב-DSM-5, בשנת 2013","w":["ב-DSM-III, בשנת 1980","ב-DSM-IV, בשנת 1994","היא עדיין לא הוכרה כהפרעה נפרדת"],"e":"אגרנות הוכרה כהפרעה נפשית נפרדת רק ב-DSM-5 בשנת 2013. לפני כן היא נחשבה לחלק מהפרעה אחרת, הפרעת אישיות טורדנית־כפייתית."}]},
"q2":{"t":"t1","v":[{"q":"מה נכון לגבי מי שסובל מאגרנות?","a":"ההפרעה חוצה מגדרים ומעמדות","w":["היא נפוצה בעיקר בקרב עניים","היא נפוצה בעיקר בקרב גברים","היא מופיעה בעיקר בילדות"],"e":"אגרנות מופיעה אצל 2% עד 6% מהאוכלוסייה, וחוצה מגדרים ומעמדות. היא לא נפוצה דווקא בקרב עניים או גברים."},{"q":"מתי מופיעים הסימנים הראשונים לאגרנות, ומתי הביטוי הקיצוני?","a":"סימנים בשנות ה-30, ביטוי קיצוני בזיקנה","w":["סימנים בילדות, ביטוי קיצוני בהתבגרות","סימנים בזיקנה בלבד","סימנים ראשונים ותופעה קיצונית בשנות ה-20"],"e":"הסימנים הראשונים מופיעים בדרך כלל בשנות ה-30, וההפרעה מחמירה עם השנים עד לביטוי קיצוני בזיקנה. היא לא מופיעה בעיקר בילדות."}]},
"q3":{"t":"t1","v":[{"q":"כמחצית מהאגרנים חיים בלי גישה לכיריים, אבל רק כ-6% מדווחים על סכנה רפואית. מה הלקח לעובד הסוציאלי?","a":"לא להניח שכל אגרן מוזנח נמצא בסכנה","w":["שרוב האגרנים משקרים לגבי מצבם","שצריך לפנות כל אגרן מיד","שאין צורך לטפל באגרנים כלל"],"e":"למרות התנאים הקשים, רק מעטים מדווחים על סכנה רפואית. לכן לא כדאי להניח שכל אגרן מוזנח נמצא בסכנה, כי הערכה שגויה מובילה להתערבות לא מותאמת. זה לא אומר שאין צורך לטפל."},{"q":"מה הסכנה בהנחה שכל אגרן נמצא בסכנה?","a":"התערבות לא מותאמת, שאף פוגעת בזכויות האגרן","w":["הזנחה של אגרנים שבאמת נמצאים בסכנה","בזבוז של משאבי הרווחה על מקרים קלים","פגיעה באמון של השכנים במחלקת הרווחה"],"e":"ההנחה שכל אגרן בסכנה עלולה להוביל להתערבות לא מותאמת, שאף פוגעת בזכויות שלו, כמו פינוי בכפייה. זו טעות נפוצה בהערכה."}]},
"q4":{"t":"t1","v":[{"q":"עובדת סוציאלית מניחה שקשיש אוגר חפצים ״כי גדל בעוני בשואה״. מה המחקרים במאמר אומרים?","a":"עוני בילדות לא מנבא אגרנות","w":["זו הסיבה העיקרית לאגרנות","רק עוני קיצוני מנבא אגרנות","עוני בילדות מגן מפני אגרנות"],"e":"המחקרים במאמר מראים שעוני בילדות לא מנבא אגרנות: מי שגדל בעוני לא הופך לאגרן יותר ממי שגדל בשפע. לכן ההסבר ״גדל בעוני״ אינו מבוסס."},{"q":"האם אגרנות תמיד באה עם הזנחה?","a":"לא, יש אגרנים מסודרים ונקיים","w":["כן, תמיד","כן, אחרי שלב 3","לא, אגרנים אף פעם לא מזניחים"],"e":"אגרנות לא תמיד באה עם הזנחה, ויש אגרנים מסודרים ונקיים. גם זו טעות נפוצה בהערכה. ״אגרנים אף פעם לא מזניחים״ שגוי בכיוון ההפוך."}]},
"q5":{"t":"t1","v":[{"q":"אגרן שהבית שלו מסודר רק כי בתו מפנה בכל שבוע. האם הוא עדיין עומד בקריטריונים?","a":"כן, סדר בזכות צד שלישי לא שולל את ההפרעה","w":["לא, כי הבית בפועל מסודר ונקי","לא, כי אין עומס באזורי המחיה שלו","כן, אבל רק אם הוא מעל גיל שישים"],"e":"ה-DSM מתייחס לכך במפורש: אם הבית מסודר רק בזכות צד שלישי (כאן הבת), זה לא שולל את ההפרעה. הקושי להיפרד מחפצים נשאר."},{"q":"כמה זמן צריכה להימשך התופעה כדי להיחשב אגרנות לפי DSM-5?","a":"לפחות חצי שנה","w":["לפחות חודש","לפחות שנתיים","לפחות חמש שנים"],"e":"לפי DSM-5, התופעה צריכה להימשך לפחות חצי שנה כדי להיחשב אגרנות. זה אחד הקריטריונים."}]},
"q6":{"t":"t1","v":[{"q":"אגרן אומר: ״אני יודע שיש לי בעיה, אבל ברוב הזמן אני לא מרגיש שזה נורא.״ מה רמת התובנה שלו?","a":"ירודה","w":["טובה","אין תובנה","מלאה"],"e":"הוא יודע שיש בעיה, אבל ברוב הזמן משוכנע שהיא לא חמורה, וזו תובנה ירודה. ״אין תובנה״ היה מצב שבו הוא לא מכיר בבעיה בכלל."},{"q":"קשיש אוגר חפצים בגלל דמנציה. לפי DSM-5, האם האבחנה היא אגרנות?","a":"לא, כי זה מוסבר במצב אחר","w":["כן, תמיד","כן, אם זה נמשך חצי שנה","לא, כי הוא לא מודע לזה"],"e":"לפי DSM-5, אם האגירה מוסברת בהפרעה אחרת או במצב רפואי, כמו דמנציה, האבחנה היא לא אגרנות. משך הזמן לא משנה את זה."}]},
"q7":{"t":"t2","v":[{"q":"אגרנית אומרת: ״אני לא יכולה לזרוק עד שאמיין הכול.״ איזה שלב בהסבר שלה זה?","a":"שלב מאוחר, כשהמיון הופך לתירוץ","w":["השלב הראשון של ״אצטרך את זה״","השלב שבו היא מוכנה לפינוי","השלב של ערך סנטימנטלי בלבד"],"e":"בשלב מאוחר, ״קודם אמיין״ הופך לתירוץ לא לזרוק, והמיון כמובן לא קורה. בשלב הראשון ההסבר הוא ״אצטרך את זה פעם״."},{"q":"למה לאגרן קשה כל כך לוותר על חפץ?","a":"כי זה מרגיש כמו ויתור על חלק מגופו","w":["כי החפצים יקרים מאוד מבחינה כספית","כי הוא מפחד מתגובת השכנים לזריקה","כי הוא לא יודע לאן אפשר לזרוק"],"e":"לאגרן, ויתור על חפץ מרגיש כמו ויתור על חלק מגופו, כי יש לחפצים ערך סנטימנטלי עמוק. הסיבה היא לא הערך הכספי שלהם."}]},
"q8":{"t":"t2","v":[{"q":"את מי פוגעת ההפרעה חוץ מהאגרן עצמו?","a":"בני הבית והשכנים","w":["רק את האגרן עצמו","רק את העובדים הסוציאליים","רק את בעלי הבית שמשכירים"],"e":"האגרנות פוגעת גם בבני הבית ובשכנים: פיזית (ריחות, מזיקים), חברתית וכלכלית. היא לא פוגעת רק באגרן."},{"q":"איך האגרן מגיב לחוויה של ״בזבוז״?","a":"מתנגד לה","w":["נהנה ממנה","מתעלם ממנה","מחפש אותה"],"e":"האגרן מתנגד לחוויה של ״בזבוז״ ולא מוכן להיות ״בזבזן״, ולכן קשה לו לזרוק דברים שאולי יהיו שימושיים. הוא לא נהנה ממנה ולא מחפש אותה."}]},
"q9":{"t":"t2","v":[{"q":"למה השלב השלישי בסולם נחשב ״נקודת מפנה״?","a":"כי ממנו צריך התערבות של אנשי מקצוע","w":["כי ממנו האגרן מתחיל להבין את הבעיה","כי בו האגרנות מתחילה","כי בו אפשר לפנות את הבית לבד"],"e":"מהשלב השלישי צריך התערבות של אנשי מקצוע, ולכן הוא נקודת המפנה. בשלב החמישי כבר נדרשת התערבות אינטנסיבית ורב־מקצועית. האגרנות לא מתחילה בשלב 3."},{"q":"מה מאפיין את השלב החמישי?","a":"המערכות החיוניות לא פועלות","w":["הבית מסודר, אבל עמוס בחפצים","יש בעיה רק בחדר אחד בבית","האגרן מבקש עזרה בעצמו"],"e":"בשלב החמישי, החמור ביותר, המערכות החיוניות בבית לא פועלות: מים, חשמל וגז. בית מסודר אבל עמוס מתאר שלב מוקדם."}]},
"q10":{"t":"t2","v":[{"q":"בבית לא מכבסים ולא מדיחים, אין הדברה, אבל עוד יש סדר מסוים. באיזה שלב?","a":"השלב השני","w":["השלב הראשון","השלב הרביעי","השלב החמישי"],"e":"אין כביסה, הדחה או הדברה, אבל עוד יש סדר מסוים. זה השלב השני, עוד לפני נקודת המפנה בשלב השלישי. בשלב הרביעי כבר אין מקום לישון או לבשל."},{"q":"החפצים יוצאים לחדר המדרגות, ואין מקום לישון או לבשל. באיזה שלב?","a":"השלב הרביעי","w":["השלב השני","השלב השלישי","השלב הראשון"],"e":"חפצים בחדר המדרגות, ואין מקום לישון או לבשל, מתארים את השלב הרביעי: אחרי נקודת המפנה, אבל לפני הקיצון שבו המערכות החיוניות מפסיקות לפעול."}]},
"q11":{"t":"t2","v":[{"q":"מה מבדיל אגרנות מהפרעת אישיות טורדנית־כפייתית (OCPD)?","a":"האגרן נהנה מהאיסוף ומייחס לחפצים ערך רגשי","w":["אגרנים מקפידים יותר על סדר וכללים","בהפרעת OCPD אוספים הרבה יותר חפצים","אין הבדל, זו בעצם אותה הפרעה"],"e":"האגרן נהנה מהאיסוף ומייחס לחפצים ערך רגשי, ובהפרעת OCPD זה לא כך. לכן אגרנות כבר לא נחשבת לחלק מ-OCPD. דווקא ב-OCPD מקפידים יותר על סדר וכללים."},{"q":"מה מצאו מחקרים במוח של אגרנים?","a":"פעילות יתר באזור קבלת ההחלטות","w":["ירידה בפעילות בכל אזורי המוח","פגיעה מבנית במרכז הזיכרון","שינוי בפעילות באזורי השפה"],"e":"מחקרים מצאו אצל אגרנים פעילות יתר באזור קבלת ההחלטות, באזור הקדמי של המוח. זה מתאים לקושי להחליט מה לזרוק."}]},
"q12":{"t":"t2","v":[{"q":"רופא נותן לאגרן SSRI. לפי המאמר, למה זה צפוי לעזור?","a":"בעיקר להפרעות הנלוות, לא לאגירה","w":["לאגירה עצמה, באופן מלא ומהיר","לכל התסמינים במידה שווה","לשום דבר, כי זה לא מתאים בכלל"],"e":"לפי המאמר, תרופות SSRI עוזרות בעיקר להפרעות הנלוות, כמו דיכאון וחרדה, ופחות לאגירה עצמה. לכן לא צפוי שיפור מלא ומהיר באגירה."},{"q":"כמה מהאגרנים סובלים גם מהפרעת קשב?","a":"כ-30%","w":["כ-5%","כ-60%","כמעט כולם"],"e":"כ-30% מהאגרנים סובלים גם מהפרעת קשב. תחלואה כפולה שכיחה אצלם."}]},
"q13":{"t":"t3","v":[{"q":"למה הדילמה בעבודה עם אגרנים קשה במיוחד?","a":"כי רוב האגרנים צלולים ומבינים את מצבם","w":["כי רוב האגרנים סובלים מדמנציה מתקדמת","כי אין חוקים שמתייחסים לנושא הזה","כי השכנים תמיד תומכים באגרן"],"e":"רוב האגרנים צלולים ומבינים את מצבם, ובכל זאת לא רואים פגם באורח חייהם. לכן קשה להצדיק התערבות נגד רצונם. רובם אינם סובלים מדמנציה."},{"q":"מה הדילמה האתית המרכזית?","a":"חופש הפרט מול המחויבות להגן","w":["עלות הטיפול מול תקציב הרווחה","רצון המשפחה מול רצון השכנים","טיפול תרופתי מול טיפול פסיכולוגי"],"e":"הדילמה המרכזית היא בין חופש הפרט, לכבד את רצונו של האגרן, לבין המחויבות להגן עליו. היא לא כלכלית."}]},
"q14":{"t":"t3","v":[{"q":"שכנים מתלוננים על ריחות ועכברים, והאגרן רוצה להמשיך לחיות כך. איזו דילמה זו?","a":"טובת האגרן מול טובת הסביבה","w":["חופש הפרט מול חובת הדיווח","טיפול מהיר מול טיפול איטי","אבחנה רפואית מול סוציאלית"],"e":"השכנים סובלים מריחות ומעכברים, והאגרן רוצה להמשיך כך. זו הדילמה בין טובת האגרן לטובת הסביבה, דילמה נוספת שהמאמר מזכיר."},{"q":"מה הקהילה עושה לעובד הסוציאלי, לפי המאמר?","a":"מאשימה אותו","w":["תומכת בו בכל החלטה","מתעלמת מהמקרה לגמרי","מטפלת באגרן בעצמה"],"e":"לפי המאמר, הקהילה, ולעתים גם בני המשפחה וארגונים, מאשימה את העובד הסוציאלי במצב. זה מוסיף לחץ לפעול מהר."}]},
"q15":{"t":"t3","v":[{"q":"עובדת סוציאלית רוצה לפנות בית בכוח, כי ״הוא לא יודע מה טוב לו״. איזה ערך בקוד האתיקה היא עלולה להפר?","a":"עצמאות האדם לבחור","w":["קידום רווחת החברה כולה","שוויון בין כל הפונים","חובת הדיווח לרשויות"],"e":"פינוי בכוח מתוך ״הוא לא יודע מה טוב לו״ עלול להפר את הערך הראשון בקוד האתיקה: עצמאות האדם לבחור. רווחת החברה אינה הערך שמופר כאן."},{"q":"איזה חוק קובע שאין פוגעים בחייו, בגופו, בכבודו או בקניינו של אדם?","a":"חוק יסוד: כבוד האדם וחירותו","w":["חוק העובדים הסוציאליים","קוד האתיקה של העובדים הסוציאליים","חוק הכשרות המשפטית והאפוטרופסות"],"e":"חוק יסוד: כבוד האדם וחירותו (1992) קובע שאין פוגעים בחייו, בגופו, בכבודו או בקניינו של אדם, וכולל את הזכות לפרטיות. קוד האתיקה הוא מסמך מקצועי, לא חוק."}]},
"q16":{"t":"t3","v":[{"q":"מה הקושי של העובד הסוציאלי מול אגרן מוזנח?","a":"צריך לעזור מיד, אבל רק בהסכמה","w":["אין לו סמכות לעזור בשום מצב","אין לו מספיק תקציב לפינוי","האגרן תמיד מבקש עזרה מיד"],"e":"העובד צריך לעזור מהר, כי המצב מוזנח, אבל רק בהסכמה של האגרן, וזה הקושי. יש לו סמכות לעזור, אבל לא נגד רצון האדם."},{"q":"קוד האתיקה מדגיש מתן עזרה תוך:","a":"שמירה על העצמאות וההסכמה","w":["עמידה בלוחות זמנים קצרים","שיתוף פעולה עם השכנים בלבד","החלטה מהירה של העובד לבד"],"e":"קוד האתיקה מדגיש עזרה תוך שמירה על העצמאות של האדם ועל ההסכמה שלו. החלטה מהירה של העובד לבד סותרת את זה."}]},
"q17":{"t":"t4","v":[{"q":"בפעם הראשונה שיצחק הגיע למשרד, הוא היה צלול וסירב לעזרה. מה זה מראה?","a":"הוא היה מסוגל להחליט בעצמו","w":["הוא לא הבין את מצבו","הוא סבל כבר אז מדמנציה","הוא רצה רק כסף מהמחלקה"],"e":"יצחק היה צלול וסירב לעזרה, כלומר היה מסוגל להחליט בעצמו. זה בדיוק מה שהופך את הדילמה לקשה, כי אי אפשר פשוט להתעלם מרצונו."},{"q":"איך התגלגל יצחק שוב לטיפול אחרי שנים?","a":"פנייה על ״קבצן חסר בית״","w":["הוא פנה בעצמו לרווחה","בתו ביקשה עזרה מהמחלקה","הוא אושפז בבית חולים"],"e":"יצחק חזר לטיפול אחרי פנייה על ״קבצן חסר בית״, אף שבפועל גר בדירתו. הוא לא פנה בעצמו."}]},
"q18":{"t":"t4","v":[{"q":"מה הייתה התוצאה של המעקב התקופתי?","a":"אין שיפור, והוא הקצין","w":["שיפור הדרגתי במצבו","הוא הסכים לפינוי הדירה","הוא עבר לבית אבות"],"e":"במעקב התקופתי לא היה שיפור, והמצב אף הקצין, והעובד הרגיש שהביקורים פוגעים באוטונומיה של יצחק. הוא לא הסכים לפינוי בשלב הזה."},{"q":"מה החליט הצוות כשהאינטרסים של יצחק והקהילה התנגשו?","a":"להתמקד בצורכי הקשיש","w":["להתמקד בתלונות השכנים","להעביר את המקרה למשטרה","לסגור את התיק"],"e":"כשהאינטרסים של יצחק והקהילה התנגשו, הצוות החליט להתמקד בצורכי הקשיש, למרות ששניהם ״לקוחות״ של המחלקה. הוא לא העביר את המקרה למשטרה."}]},
"q19":{"t":"t4","v":[{"q":"יצחק אמר ״אני לא צריך כלום״, אבל ביקש לסלק את העכברושים. למה הבקשה הזו חשובה?","a":"היא נקודת כניסה לבניית קשר","w":["היא מראה שהוא לא אגרן","היא מצדיקה פינוי בכוח","היא מראה שהוא חולה בדמנציה"],"e":"הבקשה לסלק את העכברושים היא צורך שיצחק עצמו מכיר בו, ולכן היא נקודת כניסה לבניית קשר. בהמשך המלווה מילא אותה. היא לא מצדיקה פינוי בכוח."},{"q":"מה מצאו בביקור בדירה?","a":"חפצים עד התקרה, בלי מים, חשמל וגז","w":["דירה מסודרת ונקייה יחסית","דירה כמעט ריקה מחפצים","דירה עם חדר שינה אחד פנוי"],"e":"בדירה היו חפצים עד התקרה, בלי מים, חשמל וגז, ויצחק ישן בישיבה על שתי מרצפות. זה מתאים לשלב החמישי, החמור ביותר."}]},
"q20":{"t":"t4","v":[{"q":"למה בית המשפט מינה אפוטרופוס רק לפינוי ולחיבור תשתיות, ולא לבית אבות?","a":"כי לא הייתה סכנה מיידית, ומעבר בכפייה היה פוגע","w":["כי יצחק עצמו ביקש זאת מבית המשפט","כי לא היה מקום פנוי בבית אבות באזור","כי האפוטרופוס סירב לקחת אחריות"],"e":"לא הייתה סכנה מיידית, ומעבר בכפייה לבית אבות היה פוגע בו. לכן בית המשפט בחר בהתערבות מינימלית: פינוי וחיבור תשתיות. יצחק לא ביקש זאת בעצמו."},{"q":"מה קרה ביום הפינוי ״בחסות החוק״?","a":"הפינוי הופסק באמצע","w":["הדירה פונתה במלואה","יצחק עזר בפינוי","השכנים עצרו את הפינוי"],"e":"ביום הפינוי ״בחסות החוק״ הגיעו עשרה אנשים, היו צעקות וכעס, והפינוי הופסק באמצע. יצחק לא עזר, אלא התנגד."}]},
"q21":{"t":"t4","v":[{"q":"מה היה החידוש בדרך השלישית לעומת השנייה?","a":"מלווה אישי שבנה קשר יומיומי","w":["פינוי מהיר יותר","יותר אנשים ביום הפינוי","ויתור על גיבוי בית המשפט"],"e":"החידוש בדרך השלישית הוא מלווה אישי שבנה קשר יומיומי עם יצחק. הפינוי היה איטי, עם גיבוי של בית המשפט, ולא מהיר יותר."},{"q":"איך התנהל הפינוי בהתערבות בהסכמה?","a":"יצחק מיין, והמלווה זרק","w":["המלווה מיין וזרק לבד","צוות פינוי זרק הכול ביום אחד","יצחק זרק לבד בלי עזרה"],"e":"בהתערבות בהסכמה יצחק מיין בעצמו, והמלווה זרק. התהליך היה איטי, עם עליות ומורדות. צוות פינוי לא זרק הכל ביום אחד."}]},
"q22":{"t":"t4","v":[{"q":"אחרי כשנה, יצחק ביקש בעצמו דלת ובדיקות ראייה. מה זה מראה?","a":"השיפור עודד אותו לפנות בעצמו לעזרה","w":["שהוא החלים לגמרי מהאגרנות","שהמלווה לחץ עליו לבקש","שהוא רצה למכור את הדירה"],"e":"כשיצחק ביקש בעצמו דלת ובדיקות ראייה, ניכר שהשיפור עודד אותו לפנות לעזרה, וזה שינוי במעורבות שלו. זה לא אומר שהוא החלים לגמרי מהאגרנות."},{"q":"מה פונה אחרי כשנה?","a":"הכניסה, המטבח והשירותים","w":["כל הדירה, עד החפץ האחרון","רק חדר השינה שלו","שום חלק בדירה"],"e":"אחרי כשנה פונו הכניסה, המטבח והשירותים, וחוברו חשמל ומים. לא כל הדירה פונתה."}]},
"q23":{"t":"t4","v":[{"q":"למה יצחק הסכים לבסוף לעבור לבית אבות?","a":"בזכות הקשר עם המלווה","w":["כי בית המשפט חייב אותו","כי הדירה נמכרה","כי השכנים לחצו"],"e":"יצחק הסכים לעבור לבית אבות, זמנית, בזכות הקשר עם המלווה, שהצליח לשכנע אותו. זה לא היה בגלל צו של בית המשפט."},{"q":"מה אמר יצחק אחרי שבוע בבית האבות?","a":"שטוב לו שם ושהוא רוצה להישאר","w":["שהוא רוצה לחזור הביתה מיד","שהוא מתגעגע לחפצים שלו","שהמקום מסוכן ולא נעים"],"e":"אחרי שבוע בבית האבות יצחק אמר שטוב לו ושהוא רוצה להישאר: ״בבית אין לי תנאים כמו שיש פה״. הוא לא ביקש לחזור הביתה."}]},
"q24":{"t":"t4","v":[{"q":"יצחק קיבל אבחנות שונות לאורך הזמן. איך המאמר מסביר זאת?","a":"ההפרעה מלווה במחלות נוספות","w":["הרופאים טעו בכל האבחנות","יצחק העמיד פנים בבדיקות","האבחנות נעשו ברחוב ולכן לא דויקו"],"e":"אגרנות מלווה לעתים קרובות במחלות נוספות, והאבחנות התקבלו ממקורות שונים, ולכן הן שונות. זו תחלואה כפולה, ולא טעות של כל הרופאים."},{"q":"למה האשפוז הצליח הפעם?","a":"כי הוא הסכים אחרי שיחות רבות","w":["כי בית המשפט הורה על כך","כי הוא היה חסר הכרה","כי השכנים הזמינו אמבולנס"],"e":"הפעם האשפוז הצליח כי יצחק הסכים לו אחרי שיחות רבות, ולא בכפייה. ההסכמה היא ההבדל בין הניסיונות."}]},

"q30":{"t":"t5","v":[{"q":"מה המסקנה של המאמר?","a":"התערבות בהסכמה היא הדרך המיטבית","w":["התערבות בחסות החוק היא הדרך המיטבית","מעקב תקופתי מספיק ברוב המקרים","אין דרך טובה לטפל באגרנים"],"e":"המסקנה היא שהתערבות בהסכמה היא הדרך המיטבית: שיפור איטי אך בטוח, בלי פגיעה באוטונומיה. התערבות בחסות החוק שיפרה תנאים, אבל במחיר נפשי גבוה."},{"q":"איזו הסתייגות הכותבים עצמם מציינים?","a":"זה רק מקרה אחד","w":["השיטה נכשלה אצל יצחק","השיטה זולה מדי ליישום","השיטה מתאימה רק לגברים"],"e":"הכותבים עצמם מסתייגים: זה מקרה אחד בלבד, וצריך לבחון את השיטה במקרים נוספים. השיטה לא נכשלה אצל יצחק."}]}};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
