<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: אגרנות כפייתית - אפשר לטפל בהסכמה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"building",title:"מהי אגרנות כפייתית",blocks:[
  {h:"הגדרה ושכיחות",html:`${def("על מה הנושא",`מהי אגרנות, ואיך מבדילים אותה מסתם בלגן או מאיסוף? הנושא מציג את ההגדרה והקריטריונים.<br><b>מה נלמד כאן:</b> הגדרה ושכיחות · טעויות בהערכה · קריטריונים ב-DSM-5 · רמות תובנה`)}${def("מושג מפתח",`<mark>אגרנות</mark> ${E("Hoarding Disorder")}: הפרעה שמאופיינת ב<b>איסוף בלתי נשלט</b> של חפצים, תוך ייחוס משמעות לחפצים ובלי הבחנה בערכם האמיתי, ו<b>אי־יכולת להיפרד</b> מהם. האגירה מצמצמת את מרחב המחיה כמעט עד אפס, פוגעת באיכות החיים ולרוב מביאה להזנחה עצמית וסביבתית.`)}${tiles([["doc","DSM-5, 2013","רק אז הוכרה כהפרעה נפשית נפרדת"],["people","2% עד 6%","מהאוכלוסייה. חוצה מגדרים ומעמדות","אגרנות היא לא תופעה נדירה. היא מופיעה אצל כמה אחוזים מהאוכלוסייה, אצל גברים ונשים ובכל המעמדות.","בבניין של 50 דירות, ייתכן שיש דייר אחד עם אגרנות."],["clock","שנות ה-30","הסימנים הראשונים. ביטוי קיצוני בגיל הזיקנה","האגרנות מתחילה בדרך כלל בשנות ה־30 לחיים, ומחמירה עם השנים. בזקנה היא מגיעה לביטוי הקיצוני ביותר.","יצחק התחיל לשמור עיתונים ישנים כבר בגיל צעיר, אבל רק בזקנה הבית הגיע למצב שאי אפשר לגור בו."]])}${ex("אחד האזכורים הראשונים: ברומן \"הנפשות המתות\" של גוגול (1842) יש זקן עשיר מאוד שחי בזוהמה, בבית עמוס חפצים ישנים ושבורים.")}`,q:"q1"},
  {h:"טעויות נפוצות בהערכה",html:`<p>כ-50% מהאגרנים חיים בלי גישה לכיריים ולמקרר, וכ-10% בלי גישה לשירותים. אבל רק <b>כ-6%</b> מדווחים שהם בסכנה רפואית ממשית.</p>${yn([],["כל מי שחי בהזנחה קשה נמצא בסכנה","אגרנות תמיד באה עם הזנחה (יש אגרנים שמקפידים מאוד על סדר וניקיון)","אגרנים חוו בעבר מחסור קשה (מי שגדל בעוני לא הופך לאגרן יותר ממי שגדל בשפע)"])}${rem("הערכה מוטעית שכל אגרן בסכנה עלולה להוביל לתכנית התערבות <b>לא מותאמת</b>, ואף כזו שפוגעת בזכויות האגרן.")}`,q:"q3"},
  {h:"הקריטריונים ב-DSM-5",html:`<p>לכולנו יש חפצים שקשה לנו לזרוק. ה-DSM מבחין בין זה לבין אגרנות כפייתית, שנמשכת <b>לפחות חצי שנה</b> וכוללת:</p>${tiles([["x","קושי עקבי להיפרד","מחפצים, בלי קשר לערכם האמיתי"],["lock","צורך לשמור","הקושי נובע מצורך לשמור, גם כשהחפצים לא שמישים"],["building","עומס על אזורי מחיה","שפוגע בייעוד שלהם. אם יש סדר, זה רק בזכות צד שלישי"],["question","מצוקה או פגיעה","חברתית, תעסוקתית, או בשמירה על סביבה בטוחה"],["brain","לא בגלל מצב רפואי","כמו פגיעה מוחית"],["copies","לא מוסבר בהפרעה אחרת","כמו OCD, דיכאון, סכיזופרניה או דמנציה"]])}${def("רמות תובנה",`<b>טובה:</b> מבין שההתנהגות בעייתית. <b>ירודה:</b> משוכנע ברוב המקרים שאין בעיה. <b>אין תובנה (מחשבות שווא):</b> משוכנע לחלוטין שאין בעיה, למרות המציאות.`)}${ex(`<b>תובנה טובה</b>: "אני יודעת שיש לי יותר מדי דברים, אבל קשה לי לזרוק". <b>אין תובנה</b>: "הבית שלי מסודר מצוין, כל השכנים פשוט מגזימים", כשאי אפשר להגיע למטבח.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"brain",title:"איך ההפרעה מתפתחת",blocks:[
  {h:"עולמו של האגרן",html:`${def("על מה הנושא",`איך אדם מגיע למצב של אגרנות? הנושא מתאר את עולמו של האגרן ואת השלבים שבהם ההפרעה מתפתחת.<br><b>מה נלמד כאן:</b> עולמו של האגרן · חמשת השלבים · אבחון וטיפול`)}<p>לאגרן יש צורך סובייקטיבי \"להציל\" את החפצים, ומצוקה כשצריך להשליך אותם. הוא ממשיך לאגור לאורך כל חייו: קנייה, חיטוט בפחי זבל ואיסוף חפצים שאין בהם צורך.</p>${tiles([["clock","\"אצטרך את זה\"","בהתחלה: הסבר של שימוש עתידי, שלו או של אחרים"],["copies","\"קודם אמיין\"","אחר כך: אי אפשר לזרוק עד שימיין. המיון כמובן לא קורה"],["hand","חלק מהגוף","ערך סנטימנטלי. ויתור על חפץ מרגיש כמו ויתור על חלק מגופו"]])}${rem("ההפרעה פוגעת גם בתפקוד בבית (מקלחת, מטבח, שירותים), יוצרת סיכון בטיחותי, ופוגעת פיזית, חברתית וכלכלית גם <b>בבני הבית והשכנים</b>.")}`,q:"q7"},
  {h:"חמשת השלבים",html:`${fig("stages","לפי סולם ICD Clutter-Hoarding Scale")}${rem("<b>שלב 3 הוא נקודת המפנה</b>: מכאן צריך התערבות של אנשי מקצוע שונים. בשלב 5 צריך התערבות <b>אינטנסיבית ורב־מקצועית</b>.")}`,q:"q9"},
  {h:"אבחון וטיפול",html:`<p>בעבר אגרנות נחשבה לחלק מ<mark>הפרעת אישיות טורדנית־כפייתית</mark> ${E("OCPD")}. אבל האגרן <b>נהנה</b> מהאיסוף, מתמכר לתהליך ומרגיש שלחפצים יש ערך רגשי, מה שלא קיים ב-OCPD. רק 5% עד 10% מבעלי OCPD סובלים גם מאגרנות.</p>${tiles([["brain","בסיס נוירו־ביולוגי","פעילות יתר באזור הקדמי של המוח, שפועל בקבלת החלטות"],["copies","תחלואה כפולה","דיכאון, פוביות, חרדות, פוסט־טראומה, סכיזופרניה. כ-30% עם הפרעת קשב","אצל רבים מהאוגרים יש גם הפרעות נוספות, כמו דיכאון או חרדה. לכן הטיפול צריך להתייחס לכל התמונה.","יצחק אוגר חפצים, וגם סובל מדיכאון."],["building","פגיעה אורגנית","דמנציה, גידול או טראומה מוחית יכולים להוביל לאגירה"]])}${rem("<b>קשה לטיפול.</b> תרופות (כמו SSRI) עוזרות בעיקר להפרעות הנלוות ולא לאגרנות עצמה. טיפול נוסף: CBT, טיפול קוגניטיבי־התנהגותי.")}`,q:"q11"}
 ]},
 {id:"t3",icon:"scales",title:"הדילמה האתית",blocks:[
  {h:"חופש הפרט מול חובה להגן",html:`${def("על מה הנושא",`כשאדם מסרב לעזרה אבל ביתו מסוכן, מה העובד הסוציאלי צריך לעשות? הנושא מציג את הדילמה.<br><b>מה נלמד כאן:</b> חופש הפרט · חובת ההגנה · החוק והאתיקה`)}${fig("dilemma")}<p>רוב האגרנים <b>צלולים</b>, מסוגלים להביע את רצונם, מודעים למצבם ולא רואים פגם באורח חייהם. מכאן הדילמה המרכזית של העובד הסוציאלי:</p>${tiles([["id","לכבד","לכבד את רצונו ולאפשר לו לחיות לפי ראות עיניו, גם בהזנחה קיצונית","הדילמה המרכזית: לכבד את הרצון של האדם לחיות כמו שהוא בוחר, גם כשהבית מוזנח מאוד.","העובדת הסוציאלית לא זורקת את החפצים של יצחק בלי הסכמה שלו, גם אם המצב קשה."],["hand","להגן","למלא את המחויבות המקצועית: תנאי מחיה סבירים ומניעת סכנות, גם בעזרת פנייה לחוק","צד אחד של הדילמה: העובד הסוציאלי מחויב לדאוג לתנאי חיים סבירים ולמנוע סכנה, גם אם זה אומר לפנות לחוק בניגוד לרצון האדם.","העובדת הסוציאלית רואה שיש סכנת שריפה בבית של יצחק, ושוקלת לבקש מבית המשפט צו פינוי."],["people","הסביבה","ריחות, מזיקים וחפצים שגולשים לחללים משותפים פוגעים בשכנים","אגרנות פוגעת לא רק באגרן, אלא גם בשכנים: ריחות, מזיקים וחפצים שיוצאים לחדר המדרגות. זה מוסיף לחץ להתערב.","השכנים של יצחק מתלוננים על עכברושים בבניין ועל ערימות שחוסמות את המדרגות."]])}`,q:"q13"},
  {h:"החוק והאתיקה",html:`${tiles([["scales","חוק יסוד: כבוד האדם וחירותו (1992)","אין פוגעים בחייו, בגופו, בכבודו או בקניינו של אדם. לכל אדם זכות לפרטיות","חוק שמגן על הזכויות של כל אדם, כולל הרכוש שלו והפרטיות שלו. לכן אי אפשר להיכנס לבית ולפנות חפצים סתם.","החפצים של יצחק הם הרכוש שלו, והחוק מגן עליהם."],["doc","חוק העובדים הסוציאליים (1996)","קידום רווחת הפרט והחברה, תוך שמירה על כבוד האדם ושוויון","החוק מגדיר שהמטרה של העובד הסוציאלי היא לקדם את רווחת האדם, אבל תוך שמירה על הכבוד שלו.","העובדת רוצה לשפר את חייו של יצחק, אבל עושה את זה בלי להשפיל אותו."],["check","קוד האתיקה (1995)","הערך הראשון: <b>עצמאות ואחריות</b> האדם לנהל את חייו ולבחור את תנאי קיומו","הערך הראשון בקוד: לכל אדם יש זכות להחליט על חייו. זה מחזק את הצורך לכבד את הבחירה של יצחק.","יצחק מחליט אילו חפצים להשאיר, והעובדת עוזרת לו, אבל לא מחליטה במקומו."]])}${def("הקושי בפועל",`מצד אחד, העובד רואה אדם במצב ירוד ונדרש לעזור <b>מיד</b>. מצד שני, נדרש להימנע מהתערבות <b>בלי שיתוף והסכמה</b>. ובנוסף, יש לחץ מהקהילה, מבני משפחה ומארגונים, שמפנים \"אצבע מאשימה\" כלפי העובד הסוציאלי.`)}`,q:"q15"}
 ]},
 {id:"t4",icon:"id",title:"המקרה של יצחק",blocks:[
  {h:"ההיכרות והמעקב",html:`${def("על מה הנושא",`המקרה של יצחק מראה שלוש דרכים שונות לטפל באותו אדם, ומה קרה בכל אחת.<br><b>מה נלמד כאן:</b> מעקב תקופתי · התערבות בחסות החוק · התערבות בהסכמה`)}<p><b>יצחק</b> (שם בדוי), בן 84, ערירי, אגרן כפייתי \"קלאסי\". ההיכרות התחילה כעשור קודם: פנייה בגלל הזנחה, ובמשרד הופיע אדם צלול ומתפקד שסירב לכל עזרה.</p><p>שנים אחר כך הגיעה פנייה על \"חסר בית שמקבץ נדבות\". זה היה יצחק: גר בדירתו, מקבץ נדבות כל יום ומחזיק עגלה מלאה שקיות.</p>${def("דרך 1: מעקב תקופתי",`במשך שנתיים, אחת לכמה חודשים, עובד סוציאלי הציע עזרה. יצחק סירב שוב ושוב, ותגובותיו נעשו קיצוניות יותר. העובד הרגיש שהביקורים <b>פוגעים באוטונומיה</b> שלו ואף מטרידים אותו.`)}${rem("<b>דילמה:</b> גם הקשיש וגם הקהילה (שהתלוננה) הם \"לקוחות\" של המחלקה, והאינטרסים שלהם מנוגדים. הצוות החליט להתמקד בצורכי הקשיש.")}`,q:"q17"},
  {h:"הביקור בבית ו\"בחסות החוק\"",html:`<p>בביקור: הדלת נפתחה רק 30 עד 40 ס\"מ, חפצים עד התקרה, ויצחק ישן מקופל בישיבה על שתי מרצפות. הדירה מנותקת ממים, חשמל וגז. הוא אמר: \"אני לא צריך כלום\". הבקשה היחידה שלו: <b>לסלק את העכברושים</b>.</p><p>אבחון פסיכוגריאטרי (ברחוב, כי סירב להגיע): דמנציה סנילית, המלצה על אפוטרופוס וסידור מוסדי. הוא סירב.</p>${def("דרך 2: התערבות \"בחסות החוק\"",`בית המשפט מינה אפוטרופוס זמני <b>לפינוי ולחיבור לחשמל ומים בלבד</b>. ביום הפינוי הגיעו כעשרה אנשים, ואחרי כמה שעות הפינוי הופסק בגלל הצעקות והכעס של יצחק. הפינוי גרם לו <b>נזק רגשי רב</b>, והוא טען שנעלמו חפצים יקרים ושנפגעה פרטיותו.`)}`,q:"q19"},
  {h:"דרך 3: התערבות \"בהסכמה\"",html:`<p>הוחלט על פינוי <b>איטי</b> בגיבוי בית המשפט, עם <mark>מלווה אישי</mark>: איש מקצוע־עזר שמכיר את הקהילה, רגיש, סבלני ובלי רתיעה מההזנחה.</p>${tiles([["hand","קשר","המלווה הגיע כל יום, דאג לאוכל, שתייה ובגדים, ונוצר קשר משמעותי","בהתערבות בהסכמה, המלווה הגיע כל יום ודאג לצרכים הבסיסיים של יצחק. כך נבנה ביניהם קשר של אמון, שאפשר להתקדם לאט.","אחרי כמה שבועות שהמלווה מביא ליצחק ארוחה ומחליף איתו מילה, יצחק מסכים לראשונה לזרוק שקית עיתונים."],["copies","יצחק ממיין","יצחק מיין בעצמו, והמלווה זרק. איטי מאוד, עם עליות ומורדות"],["check","הבקשה נענתה","המלווה פיזר רעל וסילק את העכברושים"]])}${rem("אחרי כשנה: הכניסה, המטבח, המקלחת והשירותים פונו. יצחק <b>הסכים</b> לחבר חשמל ומים, הלך עם המלווה לבנק לשלם חובות, ואף ביקש בעצמו דלת, תאורה ובדיקות ראייה.")}`,q:"q21"},
  {h:"ההחמרה והמעבר",html:`<p>כעבור זמן מצבו הגופני הידרדר והוא תלוי לגמרי במלווה. הצוות שוב התלבט: האם עכשיו לפעול נגד רצונו?</p><p>הוא הסכים לבדיקה רפואית ואחר כך <b>לאשפוז</b>, אחרי שיחות רבות ועם הבטחה לביקורים. בבדיקה השנייה נשללה סכיזופרניה וצוינה <b>הפרעת אישיות</b>. יצחק התנגד לסידור מוסדי, אבל <b>המלווה</b> שכנע אותו לעבור לבית אבות זמנית.</p>${ex("אחרי שבוע ביקש להישאר: \"טוב לי כאן, בבית אין לי תנאים כמו שיש פה\". בסוף הדרך מצבו טוב ויציב, עלה במשקל, מצב רוחו רגוע והוא מביע שביעות רצון.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"bulb",title:"הדיון: לטפל בהסכמה",blocks:[
  {h:"שלוש דרכים, שלוש תוצאות",html:`${def("על מה הנושא",`למה "התערבות בהסכמה" עבדה הכי טוב, ממה היא בנויה, ומה המחיר שלה?<br><b>מה נלמד כאן:</b> השוואה בין הדרכים · מרכיבי ההתערבות · מחירים ומגבלות`)}${waysTable}<p>לפי סולם השלבים, יצחק היה ב<b>שלב החמישי</b>. החוקרים מציינים שרוב המחקרים מתמקדים ב-CBT, ושיש מחסור בידע על עבודה סוציאלית עם אגרנים. לכן הטיפול התנהל ב<b>ניסוי וטעייה</b>.</p>${rem("האבחנות השונות ואף הסותרות שיצחק קיבל מוסברות בכך שההפרעה מלווה במחלות נוספות ושהמקור שלה יכול להיות שונה.")}`,q:"q25"},
  {h:"המרכיבים של \"התערבות בהסכמה\"",html:`${tiles([["hand","דאגה, אמפתיה וקבלה","וסיפוק צרכים בסיסיים (מזון, הגנה, חברה) כדי לבנות קשר"],["link","קשר כבסיס לשיח","שיח משותף על ההחלטות, בתדירות גבוהה ככל האפשר"],["people","מלווה מתאים","רגיש, עדין, סבלני, מוכן לעזור ובלי רתיעה מההזנחה","כדי לעזור לאוגר צריך מלווה סבלני ועדין, שלא נרתע מההזנחה. בלי זה קשה לבנות אמון.","המלווה של יצחק מגיע כל שבוע, יושב איתו בסבלנות, ולא מעיר על הבלגן."],["id","עובד סוציאלי מטפל","קשר ישיר ואינטנסיבי, הדרכת המלווה וזיהוי נקודות סכנה"],["copies","צוות רב־מקצועי","עו\"ס, עו\"ס לחוק, רופא, עורך דין, אפוטרופוס, משפחה ועוד"],["clock","קצב מתאים","פגישות קבועות, והזמנת האגרן לישיבות כדי שישמיע את רצונו"]])}`,q:"q27"},
  {h:"מחירים ומגבלות",html:`${def("המסקנה",`\"התערבות בהסכמה\" היא הדרך <b>המיטבית</b>: התוצאות הטובות ביותר <b>בלי פגיעה במצבו הנפשי</b>. היא פותרת את הדילמה האתית כי היא מאפשרת שיפור <b>איטי אך בטוח</b>, בהסכמת המטופל ובלי לפגוע באוטונומיה שלו.`)}${tiles([["clock","המחיר","הרבה זמן, השקעה רגשית, התמדה, ואורך רוח. גיוס והכשרה של מלווים ואנשי מקצוע נוספים","טיפול באגרנות דורש הרבה זמן, כוח ואנשים. זו השקעה גדולה, ולא פתרון מהיר.","הטיפול ביצחק נמשך חודשים, ודרש כמה אנשי מקצוע."],["question","לא בטוח","אין ודאות שבלי ההתערבות \"בחסות החוק\" היו מגיעים לאותן תוצאות"],["x","לא לכל מקרה","פחות מתאים כשהאגרן לא עצמאי וצריך טיפול רפואי דחוף"],["doc","מקרה אחד","צריך לבחון את השיטה במקרים נוספים ובמחקר שדה","המאמר מתאר מקרה אחד בלבד, ולכן אי אפשר להסיק ממנו שהשיטה תעבוד לכל אחד. צריך לבדוק אותה על עוד מקרים ובמחקר מסודר.","מה שעבד עם יצחק לא בהכרח יעבוד עם אגרן אחר, בעיר אחרת, עם מלווה אחר."]])}`,q:"q29"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"אישה אוספת בולים יקרים, מסדרת אותם באלבומים ומוכרת חלק מהם. מה מבדיל אותה מאגרנית לפי ההגדרה?","a":"היא מבחינה בערך החפצים ומסוגלת להיפרד מהם","w":["היא אוספת רק סוג אחד ומסוים של חפצים","היא נהנית מאוד מתהליך האיסוף עצמו","היא מקפידה מאוד על סדר וניקיון בבית"],"e":"אגרנות מוגדרת כאיסוף בלי הבחנה בערך החפצים, ואי־יכולת להיפרד מהם. האספנית מבחינה בערך ומוכרת חלק מהבולים, ולכן היא לא אגרנית. איסוף של סוג אחד בלבד אינו ההבדל."},{"q":"מתי הוכרה אגרנות כהפרעה נפשית נפרדת?","a":"ב-DSM-5, בשנת 2013","w":["ב-DSM-III, בשנת 1980","ב-DSM-IV, בשנת 1994","היא עדיין לא הוכרה כהפרעה נפרדת"],"e":"אגרנות הוכרה כהפרעה נפשית נפרדת רק ב-DSM-5 בשנת 2013. לפני כן היא נחשבה לחלק מהפרעה אחרת, הפרעת אישיות טורדנית־כפייתית."}]},
"q2":{"t":"t1","v":[{"q":"מה נכון לגבי מי שסובל מאגרנות?","a":"ההפרעה חוצה מגדרים ומעמדות","w":["היא נפוצה בעיקר בקרב עניים","היא נפוצה בעיקר בקרב גברים","היא מופיעה בעיקר בילדות"],"e":"אגרנות מופיעה אצל 2% עד 6% מהאוכלוסייה, וחוצה מגדרים ומעמדות. היא לא נפוצה דווקא בקרב עניים או גברים."},{"q":"מתי מופיעים הסימנים הראשונים לאגרנות, ומתי הביטוי הקיצוני?","a":"סימנים בשנות ה-30, ביטוי קיצוני בזיקנה","w":["סימנים בילדות, ביטוי קיצוני בהתבגרות","סימנים בזיקנה בלבד","סימנים ראשונים ותופעה קיצונית בשנות ה-20"],"e":"הסימנים הראשונים מופיעים בדרך כלל בשנות ה-30, וההפרעה מחמירה עם השנים עד לביטוי קיצוני בזיקנה. היא לא מופיעה בעיקר בילדות."}]},
"q3":{"t":"t1","v":[{"q":"כמחצית מהאגרנים חיים בלי גישה לכיריים, אבל רק כ-6% מדווחים על סכנה רפואית. מה הלקח לעובד הסוציאלי?","a":"לא להניח שכל אגרן מוזנח נמצא בסכנה","w":["שרוב האגרנים משקרים לגבי מצבם","שצריך לפנות כל אגרן מיד","שאין צורך לטפל באגרנים כלל"],"e":"למרות התנאים הקשים, רק מעטים מדווחים על סכנה רפואית. לכן לא כדאי להניח שכל אגרן מוזנח נמצא בסכנה, כי הערכה שגויה מובילה להתערבות לא מותאמת. זה לא אומר שאין צורך לטפל."},{"q":"מה הסכנה בהנחה שכל אגרן נמצא בסכנה?","a":"התערבות לא מותאמת, שאף פוגעת בזכויות האגרן","w":["הזנחה של אגרנים שבאמת נמצאים בסכנה","בזבוז של משאבי הרווחה על מקרים קלים","פגיעה באמון של השכנים במחלקת הרווחה"],"e":"ההנחה שכל אגרן בסכנה עלולה להוביל להתערבות לא מותאמת, שאף פוגעת בזכויות שלו, כמו פינוי בכפייה. זו טעות נפוצה בהערכה."}]},
"q4":{"t":"t1","v":[{"q":"עובדת סוציאלית מניחה שקשיש אוגר חפצים ״כי גדל בעוני בשואה״. מה המחקרים במאמר אומרים?","a":"עוני בילדות לא מנבא אגרנות","w":["זו הסיבה העיקרית לאגרנות","רק עוני קיצוני מנבא אגרנות","עוני בילדות מגן מפני אגרנות"],"e":"המחקרים במאמר מראים שעוני בילדות לא מנבא אגרנות: מי שגדל בעוני לא הופך לאגרן יותר ממי שגדל בשפע. לכן ההסבר ״גדל בעוני״ אינו מבוסס."},{"q":"האם אגרנות תמיד באה עם הזנחה?","a":"לא, יש אגרנים מסודרים ונקיים","w":["כן, תמיד","כן, אחרי שלב 3","לא, אגרנים אף פעם לא מזניחים"],"e":"אגרנות לא תמיד באה עם הזנחה, ויש אגרנים מסודרים ונקיים. גם זו טעות נפוצה בהערכה. ״אגרנים אף פעם לא מזניחים״ שגוי בכיוון ההפוך."}]},
"q5":{"t":"t1","v":[{"q":"אגרן שהבית שלו מסודר רק כי בתו מפנה בכל שבוע. האם הוא עדיין עומד בקריטריונים?","a":"כן, סדר בזכות צד שלישי לא שולל את ההפרעה","w":["לא, כי הבית בפועל מסודר ונקי","לא, כי אין עומס באזורי המחיה שלו","כן, אבל רק אם הוא מעל גיל שישים"],"e":"ה-DSM מתייחס לכך במפורש: אם הבית מסודר רק בזכות צד שלישי (כאן הבת), זה לא שולל את ההפרעה. הקושי להיפרד מחפצים נשאר."},{"q":"כמה זמן צריכה להימשך התופעה כדי להיחשב אגרנות לפי DSM-5?","a":"לפחות חצי שנה","w":["לפחות חודש","לפחות שנתיים","לפחות חמש שנים"],"e":"לפי DSM-5, התופעה צריכה להימשך לפחות חצי שנה כדי להיחשב אגרנות. זה אחד הקריטריונים."}]},
"q6":{"t":"t1","v":[{"q":"אגרן אומר: ״אני יודע שיש לי בעיה, אבל ברוב הזמן אני לא מרגיש שזה נורא.״ מה רמת התובנה שלו?","a":"ירודה","w":["טובה","אין תובנה","מלאה"],"e":"הוא יודע שיש בעיה, אבל ברוב הזמן משוכנע שהיא לא חמורה, וזו תובנה ירודה. ״אין תובנה״ היה מצב שבו הוא לא מכיר בבעיה בכלל."},{"q":"קשיש אוגר חפצים בגלל דמנציה. לפי DSM-5, האם האבחנה היא אגרנות?","a":"לא, כי זה מוסבר במצב אחר","w":["כן, תמיד","כן, אם זה נמשך חצי שנה","לא, כי הוא לא מודע לזה"],"e":"לפי DSM-5, אם האגירה מוסברת בהפרעה אחרת או במצב רפואי, כמו דמנציה, האבחנה היא לא אגרנות. משך הזמן לא משנה את זה."}]},
"q7":{"t":"t2","v":[{"q":"אגרנית אומרת: ״אני לא יכולה לזרוק עד שאמיין הכול.״ איזה שלב בהסבר שלה זה?","a":"שלב מאוחר, כשהמיון הופך לתירוץ","w":["השלב הראשון של ״אצטרך את זה״","השלב שבו היא מוכנה לפינוי","השלב של ערך סנטימנטלי בלבד"],"e":"בשלב מאוחר, ״קודם אמיין״ הופך לתירוץ לא לזרוק, והמיון כמובן לא קורה. בשלב הראשון ההסבר הוא ״אצטרך את זה פעם״."},{"q":"למה לאגרן קשה כל כך לוותר על חפץ?","a":"כי זה מרגיש כמו ויתור על חלק מגופו","w":["כי החפצים יקרים מאוד מבחינה כספית","כי הוא מפחד מתגובת השכנים לזריקה","כי הוא לא יודע לאן אפשר לזרוק"],"e":"לאגרן, ויתור על חפץ מרגיש כמו ויתור על חלק מגופו, כי יש לחפצים ערך סנטימנטלי עמוק. הסיבה היא לא הערך הכספי שלהם."}]},
"q8":{"t":"t2","v":[{"q":"את מי פוגעת ההפרעה חוץ מהאגרן עצמו?","a":"בני הבית והשכנים","w":["רק את האגרן עצמו","רק את העובדים הסוציאליים","רק את בעלי הבית שמשכירים"],"e":"האגרנות פוגעת גם בבני הבית ובשכנים: פיזית (ריחות, מזיקים), חברתית וכלכלית. היא לא פוגעת רק באגרן."},{"q":"איך האגרן מגיב לחוויה של ״בזבוז״?","a":"מתנגד לה","w":["נהנה ממנה","מתעלם ממנה","מחפש אותה"],"e":"האגרן מתנגד לחוויה של ״בזבוז״ ולא מוכן להיות ״בזבזן״, ולכן קשה לו לזרוק דברים שאולי יהיו שימושיים. הוא לא נהנה ממנה ולא מחפש אותה."}]},
"q9":{"t":"t2","v":[{"q":"למה השלב השלישי בסולם נחשב ״נקודת מפנה״?","a":"כי ממנו צריך התערבות של אנשי מקצוע","w":["כי ממנו האגרן מתחיל להבין את הבעיה","כי בו האגרנות מתחילה","כי בו אפשר לפנות את הבית לבד"],"e":"מהשלב השלישי צריך התערבות של אנשי מקצוע, ולכן הוא נקודת המפנה. בשלב החמישי כבר נדרשת התערבות אינטנסיבית ורב־מקצועית. האגרנות לא מתחילה בשלב 3."},{"q":"מה מאפיין את השלב החמישי?","a":"המערכות החיוניות לא פועלות","w":["הבית מסודר, אבל עמוס בחפצים","יש בעיה רק בחדר אחד בבית","האגרן מבקש עזרה בעצמו"],"e":"בשלב החמישי, החמור ביותר, המערכות החיוניות בבית לא פועלות: מים, חשמל וגז. בית מסודר אבל עמוס מתאר שלב מוקדם."}]},
"q10":{"t":"t2","v":[{"q":"בבית לא מכבסים ולא מדיחים, אין הדברה, אבל עוד יש סדר מסוים. באיזה שלב?","a":"השלב השני","w":["השלב הראשון","השלב הרביעי","השלב החמישי"],"e":"אין כביסה, הדחה או הדברה, אבל עוד יש סדר מסוים. זה השלב השני, עוד לפני נקודת המפנה בשלב השלישי. בשלב הרביעי כבר אין מקום לישון או לבשל."},{"q":"החפצים יוצאים לחדר המדרגות, ואין מקום לישון או לבשל. באיזה שלב?","a":"השלב הרביעי","w":["השלב השני","השלב השלישי","השלב הראשון"],"e":"חפצים בחדר המדרגות, ואין מקום לישון או לבשל, מתארים את השלב הרביעי: אחרי נקודת המפנה, אבל לפני הקיצון שבו המערכות החיוניות מפסיקות לפעול."}]},
"q11":{"t":"t2","v":[{"q":"מה מבדיל אגרנות מהפרעת אישיות טורדנית־כפייתית (OCPD)?","a":"האגרן נהנה מהאיסוף ומייחס לחפצים ערך רגשי","w":["אגרנים מקפידים יותר על סדר וכללים","בהפרעת OCPD אוספים הרבה יותר חפצים","אין הבדל, זו בעצם אותה הפרעה"],"e":"האגרן נהנה מהאיסוף ומייחס לחפצים ערך רגשי, ובהפרעת OCPD זה לא כך. לכן אגרנות כבר לא נחשבת לחלק מ-OCPD. דווקא ב-OCPD מקפידים יותר על סדר וכללים."},{"q":"מה מצאו מחקרים במוח של אגרנים?","a":"פעילות יתר באזור קבלת ההחלטות","w":["ירידה בפעילות בכל אזורי המוח","פגיעה מבנית במרכז הזיכרון","שינוי בפעילות באזורי השפה"],"e":"מחקרים מצאו אצל אגרנים פעילות יתר באזור קבלת ההחלטות, באזור הקדמי של המוח. זה מתאים לקושי להחליט מה לזרוק."}]},
"q12":{"t":"t2","v":[{"q":"רופא נותן לאגרן SSRI. לפי המאמר, למה זה צפוי לעזור?","a":"בעיקר להפרעות הנלוות, לא לאגירה","w":["לאגירה עצמה, באופן מלא ומהיר","לכל התסמינים במידה שווה","לשום דבר, כי זה לא מתאים בכלל"],"e":"לפי המאמר, תרופות SSRI עוזרות בעיקר להפרעות הנלוות, כמו דיכאון וחרדה, ופחות לאגירה עצמה. לכן לא צפוי שיפור מלא ומהיר באגירה."},{"q":"כמה מהאגרנים סובלים גם מהפרעת קשב?","a":"כ-30%","w":["כ-5%","כ-60%","כמעט כולם"],"e":"כ-30% מהאגרנים סובלים גם מהפרעת קשב. תחלואה כפולה שכיחה אצלם."}]},
"q13":{"t":"t3","v":[{"q":"למה הדילמה בעבודה עם אגרנים קשה במיוחד?","a":"כי רוב האגרנים צלולים ומבינים את מצבם","w":["כי רוב האגרנים סובלים מדמנציה מתקדמת","כי אין חוקים שמתייחסים לנושא הזה","כי השכנים תמיד תומכים באגרן"],"e":"רוב האגרנים צלולים ומבינים את מצבם, ובכל זאת לא רואים פגם באורח חייהם. לכן קשה להצדיק התערבות נגד רצונם. רובם אינם סובלים מדמנציה."},{"q":"מה הדילמה האתית המרכזית?","a":"חופש הפרט מול המחויבות להגן","w":["עלות הטיפול מול תקציב הרווחה","רצון המשפחה מול רצון השכנים","טיפול תרופתי מול טיפול פסיכולוגי"],"e":"הדילמה המרכזית היא בין חופש הפרט, לכבד את רצונו של האגרן, לבין המחויבות להגן עליו. היא לא כלכלית."}]},
"q14":{"t":"t3","v":[{"q":"שכנים מתלוננים על ריחות ועכברים, והאגרן רוצה להמשיך לחיות כך. איזו דילמה זו?","a":"טובת האגרן מול טובת הסביבה","w":["חופש הפרט מול חובת הדיווח","טיפול מהיר מול טיפול איטי","אבחנה רפואית מול סוציאלית"],"e":"השכנים סובלים מריחות ומעכברים, והאגרן רוצה להמשיך כך. זו הדילמה בין טובת האגרן לטובת הסביבה, דילמה נוספת שהמאמר מזכיר."},{"q":"מה הקהילה עושה לעובד הסוציאלי, לפי המאמר?","a":"מאשימה אותו","w":["תומכת בו בכל החלטה","מתעלמת מהמקרה לגמרי","מטפלת באגרן בעצמה"],"e":"לפי המאמר, הקהילה, ולעתים גם בני המשפחה וארגונים, מאשימה את העובד הסוציאלי במצב. זה מוסיף לחץ לפעול מהר."}]},
"q15":{"t":"t3","v":[{"q":"עובדת סוציאלית רוצה לפנות בית בכוח, כי ״הוא לא יודע מה טוב לו״. איזה ערך בקוד האתיקה היא עלולה להפר?","a":"עצמאות האדם לבחור","w":["קידום רווחת החברה כולה","שוויון בין כל הפונים","חובת הדיווח לרשויות"],"e":"פינוי בכוח מתוך ״הוא לא יודע מה טוב לו״ עלול להפר את הערך הראשון בקוד האתיקה: עצמאות האדם לבחור. רווחת החברה אינה הערך שמופר כאן."},{"q":"איזה חוק קובע שאין פוגעים בחייו, בגופו, בכבודו או בקניינו של אדם?","a":"חוק יסוד: כבוד האדם וחירותו","w":["חוק העובדים הסוציאליים","קוד האתיקה של העובדים הסוציאליים","חוק הכשרות המשפטית והאפוטרופסות"],"e":"חוק יסוד: כבוד האדם וחירותו (1992) קובע שאין פוגעים בחייו, בגופו, בכבודו או בקניינו של אדם, וכולל את הזכות לפרטיות. קוד האתיקה הוא מסמך מקצועי, לא חוק."}]},
"q16":{"t":"t3","v":[{"q":"מה הקושי של העובד הסוציאלי מול אגרן מוזנח?","a":"צריך לעזור מיד, אבל רק בהסכמה","w":["אין לו סמכות לעזור בשום מצב","אין לו מספיק תקציב לפינוי","האגרן תמיד מבקש עזרה מיד"],"e":"העובד צריך לעזור מהר, כי המצב מוזנח, אבל רק בהסכמה של האגרן, וזה הקושי. יש לו סמכות לעזור, אבל לא נגד רצון האדם."},{"q":"קוד האתיקה מדגיש מתן עזרה תוך:","a":"שמירה על העצמאות וההסכמה","w":["עמידה בלוחות זמנים קצרים","שיתוף פעולה עם השכנים בלבד","החלטה מהירה של העובד לבד"],"e":"קוד האתיקה מדגיש עזרה תוך שמירה על העצמאות של האדם ועל ההסכמה שלו. החלטה מהירה של העובד לבד סותרת את זה."}]},
"q17":{"t":"t4","v":[{"q":"בפעם הראשונה שיצחק הגיע למשרד, הוא היה צלול וסירב לעזרה. מה זה מראה?","a":"הוא היה מסוגל להחליט בעצמו","w":["הוא לא הבין את מצבו","הוא סבל כבר אז מדמנציה","הוא רצה רק כסף מהמחלקה"],"e":"יצחק היה צלול וסירב לעזרה, כלומר היה מסוגל להחליט בעצמו. זה בדיוק מה שהופך את הדילמה לקשה, כי אי אפשר פשוט להתעלם מרצונו."},{"q":"איך התגלגל יצחק שוב לטיפול אחרי שנים?","a":"פנייה על ״קבצן חסר בית״","w":["הוא פנה בעצמו לרווחה","בתו ביקשה עזרה מהמחלקה","הוא אושפז בבית חולים"],"e":"יצחק חזר לטיפול אחרי פנייה על ״קבצן חסר בית״, אף שבפועל גר בדירתו. הוא לא פנה בעצמו."}]},
"q18":{"t":"t4","v":[{"q":"מה הייתה התוצאה של המעקב התקופתי?","a":"אין שיפור, והוא הקצין","w":["שיפור הדרגתי במצבו","הוא הסכים לפינוי הדירה","הוא עבר לבית אבות"],"e":"במעקב התקופתי לא היה שיפור, והמצב אף הקצין, והעובד הרגיש שהביקורים פוגעים באוטונומיה של יצחק. הוא לא הסכים לפינוי בשלב הזה."},{"q":"מה החליט הצוות כשהאינטרסים של יצחק והקהילה התנגשו?","a":"להתמקד בצורכי הקשיש","w":["להתמקד בתלונות השכנים","להעביר את המקרה למשטרה","לסגור את התיק"],"e":"כשהאינטרסים של יצחק והקהילה התנגשו, הצוות החליט להתמקד בצורכי הקשיש, למרות ששניהם ״לקוחות״ של המחלקה. הוא לא העביר את המקרה למשטרה."}]},
"q19":{"t":"t4","v":[{"q":"יצחק אמר ״אני לא צריך כלום״, אבל ביקש לסלק את העכברושים. למה הבקשה הזו חשובה?","a":"היא נקודת כניסה לבניית קשר","w":["היא מראה שהוא לא אגרן","היא מצדיקה פינוי בכוח","היא מראה שהוא חולה בדמנציה"],"e":"הבקשה לסלק את העכברושים היא צורך שיצחק עצמו מכיר בו, ולכן היא נקודת כניסה לבניית קשר. בהמשך המלווה מילא אותה. היא לא מצדיקה פינוי בכוח."},{"q":"מה מצאו בביקור בדירה?","a":"חפצים עד התקרה, בלי מים, חשמל וגז","w":["דירה מסודרת ונקייה יחסית","דירה כמעט ריקה מחפצים","דירה עם חדר שינה אחד פנוי"],"e":"בדירה היו חפצים עד התקרה, בלי מים, חשמל וגז, ויצחק ישן בישיבה על שתי מרצפות. זה מתאים לשלב החמישי, החמור ביותר."}]},
"q20":{"t":"t4","v":[{"q":"למה בית המשפט מינה אפוטרופוס רק לפינוי ולחיבור תשתיות, ולא לבית אבות?","a":"כי לא הייתה סכנה מיידית, ומעבר בכפייה היה פוגע","w":["כי יצחק עצמו ביקש זאת מבית המשפט","כי לא היה מקום פנוי בבית אבות באזור","כי האפוטרופוס סירב לקחת אחריות"],"e":"לא הייתה סכנה מיידית, ומעבר בכפייה לבית אבות היה פוגע בו. לכן בית המשפט בחר בהתערבות מינימלית: פינוי וחיבור תשתיות. יצחק לא ביקש זאת בעצמו."},{"q":"מה קרה ביום הפינוי ״בחסות החוק״?","a":"הפינוי הופסק באמצע","w":["הדירה פונתה במלואה","יצחק עזר בפינוי","השכנים עצרו את הפינוי"],"e":"ביום הפינוי ״בחסות החוק״ הגיעו עשרה אנשים, היו צעקות וכעס, והפינוי הופסק באמצע. יצחק לא עזר, אלא התנגד."}]},
"q21":{"t":"t4","v":[{"q":"מה היה החידוש בדרך השלישית לעומת השנייה?","a":"מלווה אישי שבנה קשר יומיומי","w":["פינוי מהיר יותר","יותר אנשים ביום הפינוי","ויתור על גיבוי בית המשפט"],"e":"החידוש בדרך השלישית הוא מלווה אישי שבנה קשר יומיומי עם יצחק. הפינוי היה איטי, עם גיבוי של בית המשפט, ולא מהיר יותר."},{"q":"איך התנהל הפינוי בהתערבות בהסכמה?","a":"יצחק מיין, והמלווה זרק","w":["המלווה מיין וזרק לבד","צוות פינוי זרק הכול ביום אחד","יצחק זרק לבד בלי עזרה"],"e":"בהתערבות בהסכמה יצחק מיין בעצמו, והמלווה זרק. התהליך היה איטי, עם עליות ומורדות. צוות פינוי לא זרק הכל ביום אחד."}]},
"q22":{"t":"t4","v":[{"q":"אחרי כשנה, יצחק ביקש בעצמו דלת ובדיקות ראייה. מה זה מראה?","a":"השיפור עודד אותו לפנות בעצמו לעזרה","w":["שהוא החלים לגמרי מהאגרנות","שהמלווה לחץ עליו לבקש","שהוא רצה למכור את הדירה"],"e":"כשיצחק ביקש בעצמו דלת ובדיקות ראייה, ניכר שהשיפור עודד אותו לפנות לעזרה, וזה שינוי במעורבות שלו. זה לא אומר שהוא החלים לגמרי מהאגרנות."},{"q":"מה פונה אחרי כשנה?","a":"הכניסה, המטבח והשירותים","w":["כל הדירה, עד החפץ האחרון","רק חדר השינה שלו","שום חלק בדירה"],"e":"אחרי כשנה פונו הכניסה, המטבח והשירותים, וחוברו חשמל ומים. לא כל הדירה פונתה."}]},
"q23":{"t":"t4","v":[{"q":"למה יצחק הסכים לבסוף לעבור לבית אבות?","a":"בזכות הקשר עם המלווה","w":["כי בית המשפט חייב אותו","כי הדירה נמכרה","כי השכנים לחצו"],"e":"יצחק הסכים לעבור לבית אבות, זמנית, בזכות הקשר עם המלווה, שהצליח לשכנע אותו. זה לא היה בגלל צו של בית המשפט."},{"q":"מה אמר יצחק אחרי שבוע בבית האבות?","a":"שטוב לו שם ושהוא רוצה להישאר","w":["שהוא רוצה לחזור הביתה מיד","שהוא מתגעגע לחפצים שלו","שהמקום מסוכן ולא נעים"],"e":"אחרי שבוע בבית האבות יצחק אמר שטוב לו ושהוא רוצה להישאר: ״בבית אין לי תנאים כמו שיש פה״. הוא לא ביקש לחזור הביתה."}]},
"q24":{"t":"t4","v":[{"q":"יצחק קיבל אבחנות שונות לאורך הזמן. איך המאמר מסביר זאת?","a":"ההפרעה מלווה במחלות נוספות","w":["הרופאים טעו בכל האבחנות","יצחק העמיד פנים בבדיקות","האבחנות נעשו ברחוב ולכן לא דויקו"],"e":"אגרנות מלווה לעתים קרובות במחלות נוספות, והאבחנות התקבלו ממקורות שונים, ולכן הן שונות. זו תחלואה כפולה, ולא טעות של כל הרופאים."},{"q":"למה האשפוז הצליח הפעם?","a":"כי הוא הסכים אחרי שיחות רבות","w":["כי בית המשפט הורה על כך","כי הוא היה חסר הכרה","כי השכנים הזמינו אמבולנס"],"e":"הפעם האשפוז הצליח כי יצחק הסכים לו אחרי שיחות רבות, ולא בכפייה. ההסכמה היא ההבדל בין הניסיונות."}]},
"q25":{"t":"t5","v":[{"q":"ההתערבות ״בחסות החוק״ שיפרה את התנאים הפיזיים. למה בכל זאת הכותבים לא ממליצים עליה?","a":"כי היא פגעה באוטונומיה ובמצב הנפשי","w":["כי היא יקרה מדי לרשות","כי היא לא שיפרה דבר","כי היא לא חוקית בישראל"],"e":"ההתערבות ״בחסות החוק״ שיפרה את התנאים הפיזיים, אבל פגעה באוטונומיה ובמצב הנפשי של יצחק. המחיר הנפשי היה גבוה מדי. היא כן שיפרה משהו, ולכן ״לא שיפרה דבר״ שגוי."},{"q":"איזו דרך אפשרה ליצחק לחיות כרצונו, אבל לא שיפרה את מצבו?","a":"מעקב תקופתי","w":["התערבות בחסות החוק","התערבות בהסכמה","אשפוז בכפייה"],"e":"מעקב תקופתי אפשר ליצחק לחיות כרצונו, בלי התערבות, אבל לא שיפר את מצבו, ואף הוא הקצין. זה החיסרון של הדרך הזו."}]},
"q26":{"t":"t5","v":[{"q":"למה הטיפול ביצחק התנהל ב״ניסוי וטעייה״?","a":"כי חסר ידע על עבודה סוציאלית עם אגרנים","w":["כי לא היה תקציב לטיפול מסודר ומתוכנן","כי יצחק סירב לכל תוכנית שהוצעה לו","כי הצוות לא היה מקצועי מספיק"],"e":"כמעט אין ידע על עבודה סוציאלית עם אגרנים, ורוב המחקר עוסק בטיפול CBT. לכן הטיפול ביצחק התנהל בניסוי וטעייה. הבעיה לא הייתה תקציב."},{"q":"באיזה שלב של אגרנות היה יצחק?","a":"החמישי","w":["השלישי","השני","הרביעי"],"e":"יצחק היה בשלב החמישי, החמור ביותר: חפצים עד התקרה, ובלי מים, חשמל וגז."}]},
"q27":{"t":"t5","v":[{"q":"מה הבסיס להתערבות בהסכמה?","a":"קשר שנבנה דרך דאגה וסיפוק צרכים בסיסיים","w":["צו בית משפט ברור ומחייב","פינוי מהיר ויסודי של הדירה","אבחנה פסיכיאטרית מדויקת"],"e":"הבסיס להתערבות בהסכמה הוא קשר שנבנה דרך דאגה וסיפוק צרכים בסיסיים, כמו סילוק העכברושים. הקשר הוא מה שמאפשר שיח. צו בית משפט הוא בסיס של התערבות בכפייה."},{"q":"איזו תכונה לא מופיעה בדרישות מהמלווה?","a":"ניסיון בפינוי מהיר","w":["סבלנות","רגישות ועדינות","היעדר רתיעה מהזנחה"],"e":"השיטה מבוססת על איטיות, ולכן מהמלווה נדרשים סבלנות, רגישות ועדינות, וחוסר רתיעה מהזנחה. ניסיון בפינוי מהיר לא נדרש, כי הוא סותר את הגישה."}]},
"q28":{"t":"t5","v":[{"q":"למה ממליצים להזמין את האגרן לישיבות הצוות?","a":"כדי שישמיע את רצונו","w":["כדי לבדוק אם הוא צלול","כדי להראות לו את הנהלים","כדי לחתום על הסכמה משפטית"],"e":"מזמינים את האגרן לישיבות הצוות כדי שישמיע את רצונו, וכך מגיעים להסכמות. זה לא נועד לבדוק אם הוא צלול."},{"q":"מה תפקיד העובד הסוציאלי המטפל בשיטה?","a":"קשר, הדרכת המלווה וזיהוי סכנות","w":["פינוי הדירה בעצמו","מתן תרופות למטופל","ייצוג משפטי של האגרן"],"e":"העובד הסוציאלי המטפל אחראי על הקשר, על הדרכת המלווה ועל זיהוי סכנות. העבודה היומיומית, כולל הפינוי, נעשית בידי המלווה."}]},
"q29":{"t":"t5","v":[{"q":"מתי התערבות בהסכמה פחות מתאימה?","a":"כשיש צורך רפואי דחוף","w":["כשהאגרן צלול ומתפקד","כשהאגרן חי לבד בדירה","כשיש שכנים שמתלוננים"],"e":"התערבות בהסכמה היא תהליך איטי, ולכן היא פחות מתאימה כשיש צורך רפואי דחוף ואין זמן. אגרן צלול ומתפקד הוא דווקא המקרה המתאים לה."},{"q":"מה המחיר של התערבות בהסכמה?","a":"זמן, השקעה רגשית ואורך רוח","w":["פגיעה באוטונומיה של האגרן","פגיעה בפרטיות של האגרן","ערעור מצבו הנפשי"],"e":"המחיר של התערבות בהסכמה הוא זמן, השקעה רגשית ואורך רוח, וגם גיוס והכשרה של מלווים. היא לא פוגעת באוטונומיה, וזה היתרון שלה."}]},
"q30":{"t":"t5","v":[{"q":"מה המסקנה של המאמר?","a":"התערבות בהסכמה היא הדרך המיטבית","w":["התערבות בחסות החוק היא הדרך המיטבית","מעקב תקופתי מספיק ברוב המקרים","אין דרך טובה לטפל באגרנים"],"e":"המסקנה היא שהתערבות בהסכמה היא הדרך המיטבית: שיפור איטי אך בטוח, בלי פגיעה באוטונומיה. התערבות בחסות החוק שיפרה תנאים, אבל במחיר נפשי גבוה."},{"q":"איזו הסתייגות הכותבים עצמם מציינים?","a":"זה רק מקרה אחד","w":["השיטה נכשלה אצל יצחק","השיטה זולה מדי ליישום","השיטה מתאימה רק לגברים"],"e":"הכותבים עצמם מסתייגים: זה מקרה אחד בלבד, וצריך לבחון את השיטה במקרים נוספים. השיטה לא נכשלה אצל יצחק."}]},
"h1":{"t":"t1","v":[{"q":"אדם אוסף חפצים ומתקשה להיפרד, אבל רק בגלל דמנציה מתקדמת. האם זו אגרנות לפי DSM-5?","a":"לא, כי ההתנהגות מוסברת בהפרעה אחרת","w":["כן, כי יש קושי עקבי להיפרד מחפצים בלי קשר לערכם","כן, אם זה נמשך יותר מחצי שנה","לא, כי אגרנות מופיעה רק בגיל צעיר"],"e":"אחד הקריטריונים: לא בגלל מצב רפואי ולא מוסבר בהפרעה אחרת (OCD, דיכאון, דמנציה)."}]},
"h2":{"t":"t1","v":[{"q":"מה מהבאים הוא טעות הערכה נפוצה לגבי אגרנים?","a":"להניח שמחסור בעבר מנבא אגרנות","w":["להניח שחלק מהם צלולים ומודעים","להניח שההפרעה מחמירה בזקנה","להניח שיש בה בסיס נוירו־ביולוגי"],"e":"מחסור בעבר לא מנבא אגרנות. גם לא כל מי שחי בהזנחה בסכנה, ולא תמיד יש הזנחה."}]},
"h3":{"t":"t2","v":[{"q":"מה מבדיל אגרנות מהפרעת אישיות אובססיבית־כפייתית (OCPD)?","a":"האגרן נהנה ומייחס ערך רגשי; מעט בעלי OCPD אוגרים","w":["האגרן חרד מלכלוך ומזיהום; בעל OCPD לא חרד","באגרנות אין תובנה בכלל אף פעם; ב־OCPD יש תמיד תובנה מלאה","אגרנות מגיבה היטב ל־SSRI; OCPD לא מגיבה כלל"],"e":"רק 5–10% מבעלי OCPD אוגרים. SSRI עוזר בעיקר לבעיות הנלוות, ותובנה באגרנות משתנה."}]},
"h4":{"t":"t2","v":[{"q":"בסולם ICD Clutter-Hoarding, מה מיוחד בשלב 3?","a":"זו נקודת המפנה שבה צריך אנשי מקצוע","w":["זה השלב שבו צריך התערבות רב־מקצועית אינטנסיבית","זה השלב שבו האגרן עדיין מתפקד בלי עזרה","זה השלב שבו מתחילים להופיע מזיקים"],"e":"שלב 5 דורש התערבות אינטנסיבית ורב־מקצועית (יצחק היה בשלב 5). שלב 3 הוא נקודת המפנה."}]},
"h5":{"t":"t3","v":[{"q":"איזה מקור מחזק את הצד של ״לכבד את החירות״ בדילמה?","a":"חוק יסוד כבוד האדם וחירותו והערך הראשון בקוד האתיקה","w":["חוק העובדים הסוציאליים, שמחייב לקדם את רווחת הלקוח ובטיחותו","תלונות השכנים על ריחות ומזיקים","הסכנה הבריאותית לאגרן עצמו"],"e":"מצד הכבוד: רוב האגרנים צלולים, חוק היסוד (1992), וקוד האתיקה (1995). מצד ההגנה: חוק העו״ס, סכנות ושכנים."}]},

 חוק היסוד וקוד האתיקה תומכים בכבוד לרצונו."}]},"h9":{"t":"t3","v":[{"q":"מה הערך הראשון בקוד האתיקה של העובדים הסוציאליים?","a":"עצמאות האדם ואחריותו","w":["הגנה על הקהילה והשכנים","ציות להחלטות בית המשפט","מתן טיפול רפואי מהיר"],"e":"לכן הקוד תומך בכבוד לרצונו של יצחק."}]},"h10":{"t":"t4","v":[{"q":"במשך שנתיים עובדת סוציאלית ביקרה את יצחק והציעה עזרה. מה קרה?","a":"שום שיפור, והוא ראה בזה הטרדה","w":["הוא הסכים לפינוי מלא של הבית","הבית השתפר לגמרי תוך שנה","הוא ביקש לעבור לבית אבות"],"e":"זו הדרך הראשונה: מעקב."}]},"h11":{"t":"t4","v":[{"q":"בדרך השנייה מינו ליצחק אפוטרופוס זמני ופינו את הבית. מה התוצאה?","a":"הבית השתפר, יצחק נפגע","w":["שום שיפור בבית עצמו","יצחק שמח ושיתף פעולה","יצחק עבר מיד לבית אבות"],"e":"הוא צעק, הרגיש שחדרו לפרטיות שלו, והפינוי הופסק."}]},"h12":{"t":"t4","v":[{"q":"בדרך השלישית, מי החליט מה לזרוק?","a":"יצחק עצמו","w":["המלווה האישי","האפוטרופוס","השכנים"],"e":"יצחק מיין, והמלווה זרק רק מה שיצחק הסכים."}]},"h13":{"t":"t4","v":[{"q":"מה הייתה הבקשה היחידה שיצחק ביקש בעצמו בהתחלה?","a":"לסלק את העכברושים","w":["לפנות את כל הבית","לעבור לבית אבות","לתקן את החשמל"],"e":"היענות לבקשה הזו עזרה לבנות אמון."}]},"h14":{"t":"t4","v":[{"q":"הצוות התלבט: מי ״הלקוח״, יצחק או השכנים? במה בחר?","a":"בצרכים של יצחק","w":["בצרכים של השכנים","בצרכים של הרשויות","בהחלטת בית המשפט"],"e":"זו עוד דילמה שהמאמר מעלה."}]},"h15":{"t":"t5","v":[{"q":"מה מאפיין מלווה מתאים בהתערבות בהסכמה?","a":"רגיש, סבלני, לא נרתע","w":["קפדן, שמסדר במקום האגרן","מהיר, שמפנה הכל ביום אחד","רחוק, שמגיע פעם בחודש"],"e":"בנוסף: עובד סוציאלי שמדריך אותו, צוות, וקצב מותאם."}]},"h16":{"t":"t5","v":[{"q":"מהי אחת המגבלות של המסקנה?","a":"אולי לא הייתה מצליחה בלי החוק","w":["היא זולה מדי למימוש","היא נבדקה על מאות מקרים","היא מתאימה במיוחד למצב חירום"],"e":"היא גם דורשת משאבים, פחות מתאימה לחירום רפואי, וזה מקרה אחד."}]}};
const SUM=`<h2>סיכום: אגרנות כפייתית - אפשר לטפל בהסכמה (תיאור מקרה)</h2>
<div class="key"><b>על מה מדובר?</b> המאמר מתאר דילמה קשה של עובדים סוציאליים: מה עושים עם אדם מבוגר וצלול שאוגר דברים בבית עד שהבית מסוכן, אבל <b>לא רוצה עזרה</b>? אם מכבדים את רצונו, הוא ושכניו בסכנה. אם מתערבים בכוח, פוגעים בחירות ובכבוד שלו. דרך הסיפור של יצחק, בן 84, המאמר משווה שלוש דרכים: <b>רק לעקוב</b> (לא עזר), <b>להתערב בכוח החוק</b> (שיפר את הבית אבל פגע ביצחק), ו<b>להתערב בהסכמה</b> בעזרת מלווה אישי (עבד, בלי לפגוע בו). המסקנה: התערבות בהסכמה היא הדרך הטובה ביותר, אבל היא דורשת הרבה זמן וסבלנות.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>אגרנות כפייתית</b></td><td>איסוף שלא נשלט וקושי עצום להיפרד מחפצים.</td></tr>
<tr><td><b>תובנה</b></td><td>עד כמה האדם מבין שיש לו בעיה.</td></tr>
<tr><td><b>סולם ICD Clutter-Hoarding</b></td><td>סולם של חמש דרגות חומרה. דרגה 3 היא נקודת המפנה.</td></tr>
<tr><td><b>אפוטרופוס זמני</b></td><td>מי שהחוק ממנה להחליט במקום האדם, לתקופה.</td></tr>
<tr><td><b>מלווה אישי</b></td><td>אדם שמגיע כל יום ועוזר לפי קצב והסכמה של האגרן.</td></tr>
<tr><td><b>התערבות בהסכמה</b></td><td>טיפול שנבנה על קשר ואמון, בלי כפייה.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: יצחק</h3>
<p>יצחק, בן 84, גר לבד. הבית שלו מלא עד התקרה בעיתונים, שקיות וחפצים, יש עכברושים, ושכנים מתלוננים על ריח. הוא צלול, מבין מה קורה, ו<b>מסרב</b> לכל עזרה. כל הסיכום בנוי סביבו.</p>

<h3>1. מהי אגרנות כפייתית</h3>
<p><b>אגרנות</b> = איסוף שלא נשלט, ייחוס משמעות גדולה לחפצים, וקושי עצום להיפרד מהם. היא הוכרה כהפרעה <b>נפרדת</b> רק ב־<b>DSM-5</b> (2013, ספר האבחנות הפסיכיאטרי). 2–6% מהאוכלוסייה, מתחילה בדרך כלל בשנות ה־30, ומחמירה בזקנה.</p>
<p><b>הקריטריונים</b> (לפחות חצי שנה): קושי עקבי להיפרד מחפצים <b>בלי קשר לערך</b> שלהם; <b>צורך לשמור</b> ומצוקה מהמחשבה לזרוק; הצטברות שפוגעת בשימוש בחדרים (אם יש סדר, זה רק כי מישהו אחר סידר); מצוקה או פגיעה בתפקוד; ו<b>לא</b> בגלל מחלה אחרת (כמו דמנציה, דיכאון או OCD). <b>תובנה:</b> חלק מבינים שזו בעיה, חלק פחות, וחלק בכלל לא.</p>
<p><b>טעויות נפוצות בהערכה</b> (שמובילות להתערבות לא מתאימה): לא כל מי שחי בבלגן נמצא בסכנה (50% לא יכולים להשתמש במטבח, אבל רק כ־6% בסכנה רפואית); לא תמיד יש הזנחה; ו<b>מחסור בעבר</b> (״הוא גדל בעוני ולכן אוגר״) <b>לא</b> מנבא אגרנות.</p>

<h3>2. מה קורה בראש של האגרן, ואיך זה מתפתח</h3>
<ul>
<li>מחשבה טיפוסית: ״אני עוד אצטרך את זה״ ← ״קודם אמיין ואז אזרוק״ (וזה לא קורה) ← החפצים מרגישים כמו חלק מהגוף.</li>
<li><b>סולם ICD Clutter-Hoarding</b> (סולם של חמש דרגות חומרה): <b>דרגה 3 היא נקודת המפנה</b>, שבה כבר צריך אנשי מקצוע. <b>דרגה 5</b> דורשת התערבות אינטנסיבית של כמה אנשי מקצוע. יצחק היה בדרגה 5.</li>
<li><b>אגרנות היא לא הפרעת אישיות אובססיבית־כפייתית (OCPD):</b> האגרן <b>נהנה</b> מהאיסוף ורואה בחפצים ערך רגשי, ורק 5–10% מבעלי OCPD אוגרים.</li>
<li>יש בסיס במוח (פעילות יתר באזור הקדמי שקשור לקבלת החלטות), והרבה פעמים יש הפרעות נוספות (כ־30% עם הפרעת קשב). תרופות SSRI עוזרות בעיקר להפרעות הנלוות; הטיפול הנפוץ הוא CBT (טיפול קוגניטיבי־התנהגותי).</li>
</ul>

<h3>3. הדילמה: לכבד או להגן?</h3>
<div class="tw"><table><tr><th>בעד לכבד את רצונו של יצחק</th><th>בעד להגן עליו ועל הסביבה</th></tr>
<tr><td>הוא צלול ומבין את המצב</td><td>יש סכנת שריפה, נפילה ומחלות</td></tr>
<tr><td><b>חוק יסוד: כבוד האדם וחירותו</b> (1992)</td><td><b>חוק העובדים הסוציאליים</b> (1996) מחייב לקדם את רווחת הלקוח</td></tr>
<tr><td>הערך הראשון ב<b>קוד האתיקה</b> של העובדים הסוציאליים: עצמאות ואחריות האדם לחייו</td><td>השכנים סובלים מריח ומזיקים, והקהילה לוחצת ומאשימה את הרשויות</td></tr></table></div>

<h3>4. שלוש דרכים שניסו עם יצחק</h3>
<p><b>דרך 1: מעקב.</b> במשך שנתיים עובדת סוציאלית ביקרה מדי פעם והציעה עזרה. יצחק סירב שוב ושוב, לפעמים בתגובות קיצוניות. <b>התוצאה:</b> שום שיפור, והוא ראה בביקורים הטרדה.</p>
<p><b>דרך 2: בחסות החוק.</b> מינו לו <b>אפוטרופוס זמני</b> כדי לפנות את הבית ולתקן תשתיות. הגיעו כעשרה אנשים לפנות. <b>התוצאה:</b> הבית השתפר פיזית, אבל יצחק צעק, נפגע רגשית והרגיש שחדרו לפרטיות שלו, והפינוי הופסק.</p>
<p><b>דרך 3: בהסכמה.</b> הצוות שינה גישה. מינו לו <b>מלווה אישי</b> שהגיע כל יום. יצחק עצמו מיין את החפצים, והמלווה זרק מה שיצחק הסכים. הבקשה היחידה שיצחק ביקש בעצמו הייתה <b>לסלק את העכברושים</b>, וזה נעשה. לאט לאט נבנה אמון: אחרי שנה תוקנו התשתיות, הוא התחיל לסדר עניינים בבנק, וביקש דברים בעצמו. לבסוף, אחרי אשפוז, עבר לבית אבות ואמר <b>״טוב לי כאן״</b>. <b>המחיר:</b> זמן, סבלנות והשקעה רגשית גדולה.</p>
<p><b>עוד דילמה:</b> מי ״הלקוח״? יצחק, או השכנים והקהילה? הצוות בחר בצרכים של יצחק. ואבחנות סותרות שהוא קיבל (קודם דמנציה, אחר כך הפרעת אישיות) מוסברות בכך שהיו לו כמה בעיות יחד.</p>

<h3>5. מה עושה התערבות בהסכמה</h3>
<ol>
<li><b>דאגה ואמפתיה</b>, ומענה לצרכים הבסיסיים, כדי לבנות קשר.</li>
<li><b>קשר</b> כבסיס לשיחה משותפת, במפגשים תכופים.</li>
<li><b>מלווה מתאים:</b> רגיש, סבלני, ולא נרתע מהבלגן.</li>
<li><b>עובד סוציאלי</b> שמחזיק קשר אינטנסיבי, מדריך את המלווה ומזהה סכנות.</li>
<li><b>צוות</b> של כמה אנשי מקצוע.</li>
<li><b>קצב מותאם</b>, והזמנה של האגרן עצמו לישיבות על הטיפול בו.</li>
</ol>

<h3>6. מסקנה ומגבלות</h3>
<ul>
<li><b>המסקנה:</b> התערבות בהסכמה מביאה לשיפור איטי ובטוח, בלי פגיעה נפשית, וכך פותרת את הדילמה בין כבוד להגנה.</li>
<li><b>מגבלות:</b> היא דורשת הרבה משאבים; לא בטוח שהייתה מצליחה בלי שלב ״החוק״ שקדם לה; היא פחות מתאימה כשצריך טיפול רפואי דחוף; זה מקרה אחד בלבד; ויש מעט ידע על עבודה סוציאלית עם אגרנים (רוב המחקר על CBT), ולכן הרבה ממנה היה ניסוי וטעייה.</li>
</ul>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. <b>אגרנות כפייתית</b> הוכרה כהפרעה נפרדת ב־DSM-5: קושי עקבי להיפרד מחפצים, הצטברות שפוגעת בשימוש בבית, ומצוקה, לא בגלל מחלה אחרת.<br>
2. היא <b>לא OCPD</b> ולא תמיד הזנחה, ומחסור בעבר לא מנבא אותה.<br>
3. הדילמה: <b>לכבד</b> את רצון האדם הצלול (חוק יסוד, קוד האתיקה) או <b>להגן</b> עליו ועל הסביבה (חוק העובדים הסוציאליים).<br>
4. עם יצחק ניסו שלוש דרכים: <b>מעקב</b> (לא עזר), <b>חוק</b> (שיפר את הבית אבל פגע בו), ו<b>הסכמה</b> עם מלווה אישי (שיפור איטי ובטוח).<br>
5. ההסכמה פותרת את הדילמה, אבל דורשת <b>זמן ומשאבים</b>, וזה מקרה אחד בלבד.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• למנות את הקריטריונים לאבחנה ולהבחין מ־OCPD.<br>
• לזהות טעויות נפוצות בהערכה.<br>
• להציג את שני צדי הדילמה ואת החוקים שמאחוריהם.<br>
• להשוות בין שלוש הדרכים ולומר מה כל אחת השיגה.<br>
• למנות את רכיבי ההתערבות בהסכמה ואת המגבלות.</div>

<li><b>הבקשה היחידה של יצחק: לסלק את העכברושים.</b></li>
<li><b>דרגה 3 היא נקודת המפנה</b>; דרגה 5 היא הקיצונית (ושם היה יצחק).</li>

<li><b>חוק יסוד כבוד האדם וקוד האתיקה תומכים בכבוד</b>; חוק העובדים הסוציאליים תומך בהגנה.</li>
</ul></div>`;

      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

/* Flashcards: front = the term and a prompt, back = the answer and an example.
   "יודע" removes the card from this round, "עוד לא" sends it to the end of the deck. */
function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");
    const card=app.querySelector("#fc"),acts=app.querySelector(".fc-actions");
    const flip=()=>{flipped=!flipped;card.classList.toggle("flipped",flipped);card.setAttribute("aria-pressed",flipped);
      if(flipped&&!acts.querySelector(".fc-btns")){acts.innerHTML=`<div class="fc-btns"><button class="fc-no" id="no">${ic("cycle")}<span>עוד לא</span></button><button class="primary fc-yes" id="yes">${ic("check")}<span>ידעתי</span></button></div>`;
        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};
        acts.querySelector("#no").onclick=()=>{missed.add(k);S.cards[k]=0;save();deck.push(deck.shift());step("fwd")};}};
    card.onclick=flip;
    document.onkeydown=e=>{if(!document.body.contains(card))return document.onkeydown=null;if(e.key===" "||e.key==="Enter"){if(document.activeElement===card||document.activeElement===document.body){e.preventDefault();flip()}}};
  };
  step("up");
}
/* Mind map: one level at a time. The current node sits in the middle, its children around it.

function mindmap(mi,onBack){
  const M=MAPSET[mi],seen=new Set();
  const tint=(n,c)=>{n._c=c;(n.c||[]).forEach(x=>tint(x,c))};
  M.root._c="var(--accent)";M.root.c.forEach((b,k)=>tint(b,`var(--t${k%8+1})`));
  const leaves=n=>n.c?n.c.flatMap(leaves):[n],total=leaves(M.root).length;
  let path=[M.root],sel=null;
  document.body.style.setProperty("--c","var(--accent)");
  show(`<div class="stack mm-view"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>${onBack?"חזרה לנושא":"כל הנושאים"}</span></button><span class="prog" id="mmc">0 מתוך ${total} מושגים</span></div></div>
   <div class="mm-head"><span class="eyebrow">מפת חשיבה</span><h2>${M.title}</h2><p class="muted">לחצו על ענף כדי לפתוח אותו, ועל מושג כדי לקרוא עליו. לחיצה על המרכז חוזרת רמה אחת אחורה.</p></div>
   <nav class="mm-crumbs" id="mmb" aria-label="מיקום במפה"></nav>
   <div class="mm" id="mm"><svg class="mm-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
   <div class="mm-detail" id="mmd" aria-live="polite"></div></div>`,"up");
  app.querySelector("#back").onclick=onBack||(()=>home("back"));
  const box=app.querySelector("#mm"),svg=box.querySelector("svg"),det=app.querySelector("#mmd"),crumbs=app.querySelector("#mmb");
  const enLine=n=>n.en?`<span class="mm-en" dir="ltr" lang="en">${n.en}</span>`:"";
  const detail=(n,isBranch)=>{
    const sib=path[path.length-1].c||[],k=sib.indexOf(n),next=!isBranch?sib.slice(k+1).find(x=>!x.c):null;
    det.style.setProperty("--c",n._c);
    det.innerHTML=`<div class="mmd-in"><div class="mmd-h"><span class="mmd-dot"></span><div><h3>${n.n}</h3>${enLine(n)}</div></div><div class="mmd-body">${n.d}</div>${n.ex?`<div class="mmd-ex"><b>דוגמה:</b> ${n.ex}</div>`:""}
     ${isBranch?`<p class="mmd-note">${n.c.some(x=>x.c)?`${n.c.length} ענפים. לחצו על ענף כדי לפתוח אותו.`:`${n.c.length} מושגים בענף הזה. לחצו על מושג כדי לקרוא עליו.`}</p>`:next?`<button class="mmd-next">${ic("arrowL")}<span>המושג הבא: ${next.n}</span></button>`:""}</div>`;

    const nb=det.querySelector(".mmd-next");if(nb)nb.onclick=()=>pick(next);
  };
  const pick=n=>{if(n.c){path.push(n);sel=null;render();detail(n,true);return}
    sel=n;seen.add(n);app.querySelector("#mmc").textContent=`${seen.size} מתוך ${total} מושגים`;
    box.querySelectorAll(".mm-node.kid").forEach(b=>{const on=b._n===n;b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);if(seen.has(b._n))b.classList.add("seen")});
    detail(n,false);if(det.getBoundingClientRect().top>innerHeight-120)det.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"})};
  const render=()=>{
    const cur=path[path.length-1],kids=cur.c||[],n=kids.length;
    crumbs.innerHTML=path.map((p,k)=>k<path.length-1?`<button data-k="${k}">${p.n}</button><span aria-hidden="true">‹</span>`:`<b>${p.n}</b>`).join("");
    crumbs.querySelectorAll("button").forEach(b=>b.onclick=()=>{path=path.slice(0,+b.dataset.k+1);sel=null;render();det.innerHTML=""});
    box.querySelectorAll(".mm-node").forEach(e=>e.remove());
    const wide=box.clientWidth>620,rx=wide?36:34,ry=wide?37:39;
    const pos=kids.map((_,k)=>{const a=(-90+360*k/n)*Math.PI/180;return[50+rx*Math.cos(a),50+ry*Math.sin(a)]});
    svg.innerHTML=pos.map(([x,y],k)=>{const mx=(50+x)/2+(y-50)*.12,my=(50+y)/2-(x-50)*.12;return `<path d="M50 50Q${mx.toFixed(2)} ${my.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)}" pathLength="1" style="--c:${kids[k]._c};--i:${k}"/>`}).join("");
    const ctr=document.createElement("button");ctr.className="mm-node center";ctr.style.setProperty("--c",cur._c);
    ctr.innerHTML=`<span class="mm-n">${cur.n}</span>${enLine(cur)}${path.length>1?`<span class="mm-up">${ic("arrowR")} חזרה</span>`:""}`;
    ctr.setAttribute("aria-label",path.length>1?`${cur.n}, חזרה רמה אחת`:cur.n);
    ctr.onclick=()=>{if(path.length>1){path.pop();sel=null;render();det.innerHTML=""}else detail(cur,true)};
    box.appendChild(ctr);
    kids.forEach((k2,k)=>{const b=document.createElement("button");b._n=k2;
      b.className="mm-node kid "+(k2.c?"branch":"leaf")+(seen.has(k2)?" seen":"");b.style.cssText=`--c:${k2._c};--x:${pos[k][0]}%;--y:${pos[k][1]}%;--i:${k}`;
      b.innerHTML=`<span class="mm-n">${k2.n}</span>${k2.c?`<span class="mm-cnt">${k2.c.length} מושגים</span>`:enLine(k2)}`;
      if(!k2.c)b.setAttribute("aria-pressed","false");
      b.onclick=()=>pick(k2);box.appendChild(b)});
    box.classList.remove("mm-go");void box.offsetWidth;box.classList.add("mm-go");
  };
  render();detail(M.root,true);
}

/* Every module gets flashcards and a mind map. A hand-written CARDS or MAPS file wins;
   otherwise both are built from the module's own definitions (tiles, long concept cards, def boxes). */
const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim()};
function deriveTerms(){
  return T.flatMap((t,ti)=>t.blocks.map((blk,bi)=>{const d=document.createElement("div");d.innerHTML=blk.html;
    const items=[...d.children].filter(isTerm).flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem).filter(x=>strip(x.name));
    return{t,ti,bi,h:blk.h,items}}).filter(b=>b.items.length));
}
function autoCards(blocks){
  const byTopic=T.map(t=>blocks.filter(b=>b.t===t).flatMap(b=>b.items.map(it=>({it,t})))
    .sort((a,b)=>strip(b.it.body).length-strip(a.it.body).length));
  const out=[],used=new Set();
  for(let r=0;out.length<12&&byTopic.some(x=>x.length>r);r++)for(const list of byTopic){if(out.length>=12)break;const x=list[r];if(!x)continue;const key=strip(x.it.name);if(used.has(key))continue;used.add(key);
    const hasEx=/cpt-ex/.test(x.it.body);out.push({t:x.t.id,f:x.it.name,q:hasEx?"מה זה? נסו גם לחשוב על דוגמה":"מה ההגדרה?",b:x.it.body,ex:""})}
  return out;
}
function autoMap(blocks){
  const chunk=(name,items)=>{const leaves=items.map(it=>({n:it.name,en:it.en,d:it.body}));if(leaves.length<=8)return[{n:name,c:leaves}];
    const parts=Math.ceil(leaves.length/7);return Array.from({length:parts},(_,k)=>({n:`${name} (${k+1}/${parts})`,c:leaves.slice(k*7,k*7+7)}))};
  const kids=T.map(t=>{const bs=blocks.filter(b=>b.t===t);if(!bs.length)return null;
    const sub=bs.flatMap(b=>chunk(b.h,b.items));
    const c=sub.length===1?sub[0].c:sub.map(s=>({n:s.n,d:`${s.c.length} מושגים מהקטע ״${s.n}״.`,c:s.c}));
    return{n:t.title,d:`נושא ${T.indexOf(t)+1} בלומדה. ${c.length} ${sub.length===1?"מושגים":"קטעים"} בענף.`,c}}).filter(Boolean);
  if(kids.length<2)return null;
  return{id:"module",title:"מפת הלומדה",sub:"כל הנושאים והמושגים במבט אחד",root:{n:CONFIG.he||CONFIG.title,d:CONFIG.about||"כל הנושאים של הלומדה. לחצו על נושא כדי לפתוח את המושגים שלו.",c:kids}};
}

const MAPSET=(typeof MAPS!=="undefined"?MAPS:[]).concat([autoMap(TERM_BLOCKS)].filter(Boolean));
