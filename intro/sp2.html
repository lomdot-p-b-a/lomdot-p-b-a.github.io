const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"למה צריך מחקר",blocks:[
  {h:"השאלה שתלווה אותנו",html:`${def("על מה הנושא",`למה לא מספיק ״לדעת מהבטן״, ואיך המדע בודק רעיונות.<br><b>מה נלמד כאן:</b> השאלה המלווה · ידע אמפירי · השיטה המדעית · תיאוריה והשערה`)}<p>הפרק נפתח בשאלה שלכולם יש עליה דעה: האם צפייה ב<b>אלימות בטלוויזיה</b> הופכת אנשים לתוקפניים יותר? ואולי להפך, היא ״משחררת״ את התוקפנות? כבר סוקרטס חשש שהכתב יחליש את הזיכרון. בכל דור יש טכנולוגיה חדשה ודעות חזקות עליה.</p>${ex("נשתמש בשאלה הזו לאורך כל הלומדה: בכל שיטת מחקר נשאל, איך היינו בודקים בעזרתה אם תוכניות אלימות מגבירות תוקפנות אצל ילדים?")}${rem("לאורך ההיסטוריה, הסתמכות על אינטואיציה, סמכות או מזל הובילה לאמונות שגויות: שכדור הארץ שטוח, או שמחלת נפש נגרמת מ״דיבוק״. המחקר הוא ההגנה מפני טעויות כאלה.")}`,q:"q1"},
  {h:"ידע אמפירי והשיטה המדעית",html:`${def("אמפירי",`${E("Empirical")} ידע שמבוסס על ראיות <b>שאפשר לראות</b> שוב ושוב, לא משנה מי מתבונן.`)}${def("השיטה המדעית",`${E("Scientific method")} תהליך שבו בודקים רעיונות (תיאוריות והשערות) מול תצפיות, והתצפיות מולידות רעיונות חדשים לבדוק. זה מעגל.`)}${tiles([["target","הסקה דדוקטיבית","מתחילים מ<b>כלל</b> (השערה) ומסיקים ממנו מה צפוי לקרות במציאות","הולכים מהכלל אל הפרט: מתחילים מתיאוריה, מסיקים ממנה השערה, ואז בודקים אם היא מתקיימת.","מהתיאוריה ״לחץ פוגע בזיכרון״ מסיקים: ״סטודנטים שילמדו לפני מבחן בלחץ יזכרו פחות״, ובודקים זאת."],["data","הסקה אינדוקטיבית","מתחילים מ<b>תצפיות</b> ובונים מהן כלל. המסקנה יכולה להיות שגויה"]])}${ex("אינדוקציה שגויה: תפוחים, בננות ותפוזים גדלים על עצים, ולכן ״כל הפירות גדלים על עצים״. ואז מגיעים תותים ואוכמניות.")}<p>הפסיכולוגיה חוקרת גם <b>התנהגות</b> שרואים, וגם <b>תהליכים</b> שאי אפשר לראות (מחשבות, רגשות), שאותם צריך להסיק בעקיפין.</p>`,q:"q3"},
  {h:"תיאוריה, השערה והפרכה",html:`${def("תיאוריה",`${E("Theory")} מערכת רעיונות מפותחת שמסבירה תופעה. היא מורכבת מדי לבדיקה אחת, ולכן בודקים חלקים ממנה.`)}${def("השערה",`${E("Hypothesis")} <b>ניבוי שאפשר לבדוק</b>, לרוב בצורת ״אם... אז...״. היא הגשר בין הרעיון למציאות.`)}${def("ניתנת להפרכה",`${E("Falsifiable")} השערה מדעית חייבת להיות כזו ש<b>אפשר להראות שהיא שגויה</b>. התיאוריות של <b>פרויד</b> (איד, אגו, סופר־אגו) זוכות לביקורת כי ברובן אי אפשר להפריך אותן.`)}${ex("תיאוריית ג׳יימס־לאנג: הרגש תלוי בעוררות הגופנית. השערה שאפשר להפריך: אדם שלא מרגיש עוררות גופנית לא ירגיש פחד. מחקר על אנשים עם פגיעה בחוט השדרה מצא שהרגש שלהם פחות עז, אבל <b>עדיין קיים</b>.")}${ex("בשאלה שלנו: תיאוריה = ״צפייה באלימות מלמדת התנהגות אלימה״. השערה = ״אם ילדים יצפו בתוכנית אלימה, אז הם יתנהגו בתוקפנות רבה יותר במשחק אחריה״.")}`,q:"q5"},
  {h:"חשיבה ביקורתית, עובדות ודעות",html:`<p>גם המחקר לא תמיד חד־משמעי. למשל, מחקר אחד מצא שאפליקציה שיפרה ציונים של סטודנטים לרפואה, ומחקר אחר מצא שטכנולוגיה פוגעת בשינה ובניהול זמן של סטודנטים. לכן צריך לשאול על כל טענה:</p>${tiles([["grad","מי אומר?","האם למקור יש מומחיות בתחום?"],["cart","מה הוא מרוויח?","האם יש לו אינטרס?"],["data","מה הראיות?","האם הן באמת תומכות בטענה?"],["people","מה חושבים אחרים?","מה עמדת חוקרים אחרים?"]])}${tiles([["check","עובדה","מציאות שאפשר לראות ולבדוק במחקר אמפירי","עובדה היא משהו שאפשר לבדוק ולמדוד, ומי שבודק יגיע לאותה תוצאה. המדע עוסק בעיקר בעובדות.","״רוב הסטודנטים בכיתה ישנים פחות משש שעות בלילה״ היא טענה שאפשר לבדוק בשאלון."],["bulb","דעה","שיפוט אישי, שאולי נכון ואולי לא","דעה היא שיפוט אישי. היא יכולה להיות נכונה או לא, אבל אי אפשר להוכיח אותה רק מכך שמישהו מאמין בה.","״סטודנטים היום עצלנים״ היא דעה. כדי לבדוק אותה צריך קודם להגדיר ולמדוד מה זה ״עצלנות״."]])}<p>מחקר משמש גם לקבלת <b>מדיניות</b> (למשל: האם לממן תוכניות התערבות מוקדמת לילדים? מחקרים מצאו שבאופן כללי הן יעילות, אבל לא כולן באותה מידה) וגם ל<b>החלטות אישיות</b>.</p>`,q:"q7"}
 ]},
 {id:"t2",icon:"people",title:"שיטות תיאוריות: מקרה, תצפית וסקר",blocks:[
  {h:"חקר מקרה",html:`${def("על מה הנושא",`שיטות שמתארות התנהגות, בלי לבדוק סיבה ותוצאה.<br><b>מה נלמד כאן:</b> חקר מקרה · תצפית טבעית · תצפית מובנית · סקר`)}${def("חקר מקרה",`${E("Case study")} מחקר מעמיק של אדם אחד או מעט אנשים, לרוב עם מאפיין נדיר. <b>יתרון:</b> הפרטים הכי עשירים. <b>חיסרון:</b> קשה ל<b>הכליל</b>, כלומר להחיל את הממצא על אנשים אחרים.`)}${ex("התאומות הסיאמיות קריסטה וטטיאנה הוגן, שמחוברות בראש ואולי גם בתלמוס. הן חולקות חלק מהחוויות החושיות, ובכל זאת הן שתי אישיות נפרדות. מקרה מרתק, אבל אי אפשר להכליל ממנו על אנשים אחרים.")}`,q:"q9"},
  {h:"תצפית טבעית ותצפית מובנית",html:`${def("תצפית טבעית",`${E("Naturalistic observation")} צופים בהתנהגות <b>בסביבה הטבעית</b> שלה. <b>יתרון:</b> <b>תוקף אקולוגי</b> גבוה, כלומר הממצא קרוב לחיים האמיתיים. <b>חיסרון:</b> קשה לשלוט, אי אפשר לבחור מתי ההתנהגות תופיע, וזה דורש זמן, כסף ומזל.`)}<p>הצופה צריך להיות <b>בלתי מורגש</b>, כי אנשים מתנהגים אחרת כשמסתכלים עליהם (כמו שנוהגים אחרת כשניידת משטרה מאחורינו). דוגמאות: ג׳יין גודול צפתה בשימפנזים כמעט 50 שנה; חוקרות צפו בדחייה חברתית בין ילדי גן בחצר.</p>${def("תצפית מובנית",`${E("Structured observation")} צופים באנשים בזמן שהם מבצעים <b>משימה קבועה</b>. דוגמה: ״המצב הזר״ של מרי איינסוורת׳ לבדיקת התקשרות של תינוק.`)}${def("הטיית הצופה ומהימנות בין־שופטים",`<b>הטיית הצופה</b> ${E("Observer bias")}: הציפיות של הצופה משפיעות בלי כוונה על מה שהוא רושם. הפתרון: כמה צופים, ובדיקה של <b>מהימנות בין־שופטים</b> ${E("Inter-rater reliability")}, כלומר כמה הם מסכימים זה עם זה.`)}${ex("בשאלה שלנו: אפשר לצפות בילדים בחצר בית הספר ולרשום מעשי תוקפנות. אבל אם הצופה יודע מי מהילדים רואה הרבה טלוויזיה אלימה, הוא עלול ״לראות״ אצלם יותר תוקפנות.")}`,q:"q11"},
  {h:"סקר, אוכלוסייה ומדגם",html:`${def("סקר",`${E("Survey")} רשימת שאלות שעונים עליהן. <b>יתרון:</b> זול, קל, ומגיע להרבה אנשים מגוונים. <b>חיסרון:</b> מעט עומק, ו<b>דיווח עצמי</b> לא תמיד מדויק: אנשים משקרים, שוכחים, או מציגים את עצמם טוב יותר.`)}${tiles([["people","אוכלוסייה","הקבוצה הכללית שמעניינת את החוקר","כל הקבוצה שהחוקר רוצה להסיק עליה מסקנות. בדרך כלל היא גדולה מדי כדי לבדוק את כולם.","חוקרת רוצה לדעת כמה ישנים סטודנטים בישראל. כל הסטודנטים בישראל הם האוכלוסייה."],["copies","מדגם","חלק מהאוכלוסייה שבאמת נבדק","החלק מהאוכלוסייה שבאמת נבדק. אם המדגם מייצג (דומה לאוכלוסייה), אפשר להכליל ממנו לכולם.","החוקרת שולחת שאלון ל־500 סטודנטים ממוסדות שונים. הם המדגם."]])}${def("מדדי מרכז",`<b>שכיח</b> = התשובה הנפוצה ביותר; <b>חציון</b> = הערך האמצעי; <b>ממוצע</b> = סכום חלקי מספר. הממוצע <b>רגיש לערכים קיצוניים</b>.`)}${ex("סקר אחרי 11 בספטמבר: המשתתפים דיווחו על מעט דעות קדומות כלפי אמריקאים ערבים, אבל היו פחות מוכנים ליצור איתם קשר חברתי. כלומר דעה קדומה <b>עדינה</b>, שסקר ישיר לא חושף לגמרי.")}`,q:"q13"}
 ]},
 {id:"t3",icon:"clock",title:"ארכיון, מחקר אורך ומחקר חתך",blocks:[
  {h:"מחקר ארכיוני",html:`${def("על מה הנושא",`מחקר על נתונים שכבר קיימים, ושתי דרכים לחקור שינוי עם הגיל.<br><b>מה נלמד כאן:</b> ארכיון · אורך · חתך · קוהורט · נשירה`)}${def("מחקר ארכיוני",`${E("Archival research")} ניתוח רשומות קיימות, בלי לפגוש משתתפים. <b>יתרון:</b> זול ומהיר. <b>חיסרון:</b> החוקר לא קבע מה נאסף, צריך להתאים את השאלה לנתונים, והרשומות לא תמיד עקביות.`)}${ex("בשאלה שלנו: אפשר לבדוק נתונים קיימים של שעות צפייה ושל דיווחי אלימות בבתי ספר. אבל אולי מעולם לא נאסף בדיוק מה שאנחנו צריכים.")}`,q:"q15"},
  {h:"אורך מול חתך",html:`<p>כשרוצים לדעת איך משהו משתנה עם הגיל, יש שתי דרכים. הטבלה משווה ביניהן:</p><div class="tw"><table><tr><th></th><th>מחקר אורך</th><th>מחקר חתך</th></tr><tr><td>מה עושים</td><td>בודקים <b>אותם אנשים</b> שוב ושוב לאורך שנים</td><td>משווים <b>קבוצות גיל שונות</b> בנקודת זמן אחת</td></tr><tr><td>יתרון</td><td>רואים שינוי אמיתי אצל אותם אנשים</td><td>מהיר וזול</td></tr><tr><td>חיסרון</td><td>יקר, ארוך, ו<b>נשירה</b> של משתתפים</td><td>הבדלי <b>קוהורט</b> עלולים להיראות כמו הבדלי גיל</td></tr></table></div>${def("קוהורט ונשירה",`<b>קוהורט</b> ${E("Cohort")} = דור או קבוצה שחלקו חוויות חברתיות ותרבותיות. <b>נשירה</b> ${E("Attrition")} = ירידה במספר המשתתפים לאורך המחקר.`)}${ex("סקר מצא שצעירים תומכים יותר בנישואים חד־מיניים ממבוגרים. האם אנשים משנים דעה כשהם מתבגרים, או שכל דור גדל באקלים חברתי אחר? מחקר חתך לא יכול להבחין. דוגמה למחקר אורך: מחקר הסרטן של האגודה האמריקאית, שעוקב אחרי מאות אלפים כ־20 שנה, ומחקרים מוקדמים כאלה קשרו לראשונה עישון לסרטן.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"chart",title:"מתאם",blocks:[
  {h:"מה זה מתאם",html:`${def("על מה הנושא",`מתאם מראה ששני דברים ״הולכים יחד״, אבל לא שאחד גורם לשני.<br><b>מה נלמד כאן:</b> מקדם המתאם · חיובי ושלילי · משתנה מתערב · מתאם מדומה`)}${def("מתאם",`${E("Correlation")} קשר שבו שני משתנים משתנים יחד. <b>מקדם המתאם</b> (r) נע בין 1− ל־1+: ה<b>גודל</b> מראה את העוצמה (קרוב ל־1 = חזק), וה<b>סימן</b> מראה את הכיוון.`)}${fig("corr36")}${tiles([["chart","חיובי","שניהם עולים יחד. גובה ומשקל","מתאם חיובי: כשמשתנה אחד עולה, גם השני עולה (וכשאחד יורד, גם השני יורד).","ככל שסטודנט לומד יותר שעות, הציון שלו נוטה להיות גבוה יותר."],["split","שלילי","אחד עולה, השני יורד. שעות שינה ועייפות","מתאם שלילי: כשמשתנה אחד עולה, השני יורד. זה עדיין קשר, רק בכיוון הפוך.","ככל שסטודנט ישן פחות שעות, הוא מרגיש עייף יותר."],["x","אין מתאם","מידת נעליים ושעות שינה","אין קשר בין שני המשתנים: השינוי באחד לא אומר כלום על השני.","לדעת את מידת הנעליים של מישהו לא עוזר לנחש כמה הוא ישן בלילה."]])}${ex("מחקר באוניברסיטת מינסוטה מצא מתאם שלילי <b>חלש</b> (r = −0.29) בין מספר הלילות עם פחות מ־5 שעות שינה לבין הממוצע בלימודים. שלילי ≠ ״אין קשר״.")}`,q:"q19"},
  {h:"מתאם הוא לא סיבתיות",html:`${def("משתנה מתערב",`${E("Confounding variable")} גורם שלישי שמשפיע על שני המשתנים. מכירות גלידה ופשיעה עולות יחד, כי שניהם עולים <b>בחום</b>.`)}${ex("בשאלה שלנו: נניח שמצאנו שילדים שצופים יותר באלימות תוקפניים יותר. אולי האלימות גורמת לתוקפנות. אבל אולי ילדים תוקפניים <b>בוחרים</b> לצפות באלימות, ואולי גורם שלישי (למשל השגחה מועטה בבית) משפיע על שניהם. מתאם לא מכריע.")}<p>גם אוכלי דגני בוקר חולים פחות במחלות לב, אבל זה לא אומר שהדגנים הם הסיבה.</p>`,q:"q21"},
  {h:"מתאם מדומה והטיית אישוש",html:`${def("מתאם מדומה",`${E("Illusory correlation")} אמונה בקשר שלא באמת קיים. מטא־אנליזה של כמעט 40 מחקרים מצאה שאין קשר בין <b>ירח מלא</b> להתנהגות מוזרה. מתאמים מדומים על קבוצות קשורים גם ל<b>דעות קדומות</b>.`)}${def("הטיית אישוש",`${E("Confirmation bias")} מחפשים ראיות שתומכות במה שכבר חושבים, ומתעלמים מראיות נגד.`)}${ex("אחות במיון בטוחה ש״בירח מלא יש יותר מקרים מוזרים״. בלילות ירח מלא היא שמה לב לכל מקרה מוזר, ובלילות אחרים לא סופרת. כך נוצר מתאם מדומה שנשען על הטיית אישוש.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"flask",title:"הניסוי",blocks:[
  {h:"מבנה הניסוי",html:`${def("על מה הנושא",`הניסוי הוא הדרך <b>היחידה</b> לטעון לסיבה ותוצאה.<br><b>מה נלמד כאן:</b> קבוצות · משתנים · הגדרה אופרציונלית · אקראיות · סמיות`)}${fig("exp36")}${tiles([["flask","קבוצת ניסוי","מקבלת את המניפולציה","הקבוצה שמקבלת את מה שבודקים. משווים אותה לקבוצת הביקורת, שלא מקבלת אותו.","בניסוי על השפעת מוזיקה על ריכוז, קבוצת הניסוי לומדת עם מוזיקה, וקבוצת הביקורת לומדת בשקט."],["lock","קבוצת ביקורת","לא מקבלת אותה, ובכל השאר זהה","הקבוצה שלא מקבלת את הטיפול, אבל בכל השאר דומה לקבוצת הניסוי. משווים אליה כדי לדעת אם הטיפול באמת עשה את ההבדל.","קבוצה אחת מקבלת אפליקציית אימון לזיכרון, וקבוצת הביקורת לא. אם רק קבוצת האפליקציה השתפרה, כנראה שזה בזכותה."]])}${def("משתנים",`<b>משתנה בלתי תלוי</b> ${E("Independent variable")} = מה שהחוקר <b>משנה</b>. <b>משתנה תלוי</b> ${E("Dependent variable")} = מה שהחוקר <b>מודד</b>, כדי לראות אם הבלתי תלוי השפיע.`)}${ex("בשאלה שלנו: המשתנה הבלתי תלוי הוא סוג התוכנית (אלימה או לא). המשתנה התלוי הוא התוקפנות במשחק אחריה. אם הקבוצה שצפתה באלימות תוקפנית יותר, זה תומך בטענה <b>סיבתית</b>.")}`,q:"q25"},
  {h:"הגדרה אופרציונלית ואקראיות",html:`${def("הגדרה אופרציונלית",`${E("Operational definition")} תיאור מדויק של <b>איך</b> מודדים משתנה, כדי שאחרים יבינו ויוכלו לחזור על המחקר.`)}${ex("״תוקפנות״ זה מושג כללי מדי. הגדרה אופרציונלית: ״מספר הפעמים שהילד מכה או דוחף בובה במשך 10 דקות של משחק חופשי״.")}${tiles([["copies","מדגם אקראי","לכל אחד באוכלוסייה יש סיכוי שווה להיבחר. כך המדגם מייצג את האוכלוסייה","הדרך לבחור מי ישתתף במחקר. כשלכולם יש סיכוי שווה להיבחר, אפשר להכליל מהמדגם לכל האוכלוסייה.","כדי ללמוד על כל הסטודנטים בקמפוס, מגרילים שמות מתוך רשימת כל הסטודנטים, במקום לשאול רק את מי שיושב בקפיטריה."],["split","חלוקה אקראית","לכל משתתף יש סיכוי שווה להגיע לכל קבוצה. כך אין הבדלים שיטתיים בין הקבוצות","הדרך לחלק את המשתתפים לקבוצות בתוך הניסוי. כך ההבדל היחיד בין הקבוצות הוא מה שהחוקר שינה.","מטילים מטבע לכל משתתף: עץ לקבוצת הניסוי, פלי לקבוצת הביקורת."]])}${rem("מדגם אקראי עוזר ל<b>הכליל</b>. חלוקה אקראית עוזרת לטעון ל<b>סיבתיות</b>. אלה שני דברים שונים.")}`,q:"q27"},
  {h:"פלצבו, סמיות וניסוי־למחצה",html:`${def("אפקט הפלצבו",`${E("Placebo effect")} הציפייה לבדה משנה את החוויה. לכן קבוצת הביקורת מקבלת לפעמים ״כדור סוכר״.`)}${tiles([["lock","סמיות יחידה","המשתתפים לא יודעים לאיזו קבוצה שייכים, החוקר כן","המשתתפים לא יודעים אם קיבלו את הטיפול האמיתי או פלצבו, ולכן הציפיות שלהם לא משפיעות על התוצאה. החוקר כן יודע.","משתתפים בולעים כדור, ולא יודעים אם הוא תרופה או כדור סוכר."],["lock","סמיות כפולה","גם המשתתפים וגם החוקרים לא יודעים. מגן גם מציפיות וגם מ<b>הטיית הנסיין</b>","גם המשתתפים וגם החוקרים שבודקים אותם לא יודעים מי קיבל מה. כך גם הציפיות של החוקר לא משפיעות על המדידה.","החוקר שמודד את הזיכרון של המשתתפים לא יודע מי קיבל את התרופה, ולכן לא יכול ״לעזור״ להם בלי לשים לב."]])}${def("הטיית הנסיין",`${E("Experimenter bias")} הציפיות של החוקר משפיעות על התוצאות, למשל באיך הוא מדרג התנהגות לא ברורה.`)}${def("ניסוי־למחצה",`${E("Quasi-experimental")} כשאי אפשר לשלוט במשתנה (למשל מין), ולכן אי אפשר לטעון לסיבתיות. וגם יש ניסויים שאסור לעשות מטעמי אתיקה, כמו לחלק ילדים לקבוצה שתעבור התעללות.`)}${ex("אם מי שמדרג את התוקפנות של הילדים יודע מי צפה בתוכנית האלימה, הוא עלול לדרג אותם כתוקפניים יותר. בסמיות כפולה הוא לא יודע.")}`,q:"q29"}
 ]},
 {id:"t6",icon:"check",title:"ניתוח ממצאים: מובהקות, שחזור, מהימנות ותוקף",blocks:[
  {h:"מובהקות, ביקורת עמיתים ושחזור",html:`${def("על מה הנושא",`איך יודעים שתוצאה ״אמיתית״, ושהמדד שלנו טוב.<br><b>מה נלמד כאן:</b> מובהקות · ביקורת עמיתים · שחזור · מהימנות · תוקף`)}${def("מובהקות סטטיסטית",`${E("Statistical significance")} הבדל נחשב מובהק אם הסיכוי לראות אותו, אילו הקבוצות לא היו שונות באמת, <b>קטן מ־5%</b>.`)}${def("ביקורת עמיתים",`${E("Peer review")} מומחים בודקים את המאמר (רציונל, שיטה, אתיקה, סטטיסטיקה ומסקנות) לפני פרסום.`)}${def("שחזור",`${E("Replication")} חוזרים על המחקר, לרוב עם מדגם אחר. אם הוא נכשל שוב ושוב, הממצא המקורי בספק. בשנים האחרונות מדברים על <b>״משבר השחזור״</b>.`)}${ex("מחקרים שטענו לקשר בין חיסונים לאוטיזם <b>נמשכו מהפרסום</b>, ונמצא שהיה בהם ניגוד עניינים. אבל הנזק נשאר: ב־2019 היו בארה״ב מעל 1,000 מקרי חצבת.")}`,q:"q31"},
  {h:"מהימנות ותוקף",html:`<div class="tw"><table><tr><th></th><th>מהימנות</th><th>תוקף</th></tr><tr><td>השאלה</td><td>האם המדד <b>עקבי</b>?</td><td>האם הוא מודד את <b>מה שהוא אמור</b> למדוד?</td></tr><tr><td>סוגים</td><td>בין־שופטים, עקביות פנימית, מבחן־מבחן חוזר</td><td>אקולוגי, מבנה, נראה, ניבוי</td></tr></table></div>${rem("מדד <b>תקף</b> חייב להיות <b>מהימן</b>, אבל מדד מהימן לא בהכרח תקף.")}${ex("משקל שתמיד מראה 2 ק״ג יותר: <b>מהימן</b> (עקבי) אבל <b>לא תקף</b>. ובמבחני כניסה לאוניברסיטה (SAT): נמצא שהם מנבאים ציונים בשנה הראשונה, אבל יש טענות שהם מוטים נגד קבוצות מוחלשות, ויותר מ־1,000 מוסדות ויתרו עליהם.")}`,q:"q33"}
 ]},
 {id:"t7",icon:"scales",title:"אתיקה",blocks:[
  {h:"מחקר בבני אדם",html:`${def("על מה הנושא",`הכללים שמגנים על משתתפים, ולמה הם נוצרו.<br><b>מה נלמד כאן:</b> ועדת IRB · הסכמה מדעת · הטעיה ותחקיר · טסקיגי · חיות`)}${def("ועדת IRB",`${E("Institutional Review Board")} ועדה של מנהלים, מדענים ונציגי ציבור שבודקת כל מחקר בבני אדם <b>לפני</b> שהוא מתחיל.`)}${def("הסכמה מדעת",`${E("Informed consent")} טופס שכל משתתף חותם עליו: מה צפוי, מה הסיכונים, שההשתתפות <b>מרצון</b>, שאפשר <b>לפרוש בכל רגע</b> בלי עונש, ושהמידע <b>חסוי</b>. מתחת לגיל 18 חותם הורה או אפוטרופוס.`)}${tiles([["x","הטעיה","לפעמים מסתירים את מטרת המחקר כדי שהתשובות לא יוטו. אסור שתזיק","לפעמים אי אפשר לספר מראש את מטרת המחקר, כי זה ישנה את ההתנהגות. מותר להטעות רק אם זה לא מזיק למשתתפים.","אומרים למשתתפים שבודקים ״זיכרון״, כשבפועל בודקים אם הם יעזרו למישהו שמפיל ספרים במסדרון."],["check","תחקיר","אחרי הטעיה חובה להסביר הכל: המטרה, למה הוטעו, ומה ייעשה בנתונים","אחרי מחקר עם הטעיה, חובה להסביר למשתתפים את האמת: מה נבדק, למה הוטעו, ומה ייעשה בנתונים שלהם.","בסוף הניסוי החוקרת מספרת שהספרים ״נפלו״ בכוונה, מסבירה למה, ושואלת אם יש שאלות."]])}${ex("בשאלה שלנו: ההורים חותמים על הסכמה, הילדים יכולים להפסיק בכל רגע, והוועדה תבדוק שהצפייה בתוכנית לא מזיקה להם.")}`,q:"q35"},
  {h:"טסקיגי, ומחקר בחיות",html:`<p>הכללים נוצרו אחרי פגיעות חמורות. המקרה המפורסם הוא <b>מחקר העגבת בטסקיגי</b>:</p><ul><li>ב־<b>1932</b> שירות הבריאות האמריקאי גייס כ־600 גברים שחורים עניים באלבמה, תמורת טיפול רפואי, ארוחות וביטוח קבורה.</li><li>מי שנמצאו חולים <b>לא נאמר להם</b> שהם חולים.</li><li>מ־<b>1947</b> פניצילין היה טיפול יעיל, אבל לא נתנו להם אותו, וגם לא איפשרו להם לקבל טיפול במקום אחר. רבים מתו, והדביקו נשים וילדים.</li><li>המחקר הופסק רק ב־<b>1972</b> אחרי חשיפה בעיתונות, והוביל לחוק המחקר הלאומי ב־1974.</li></ul>${def("מחקר בחיות",`בעיקר מכרסמים וציפורים (כ־90%). העיקרון: <b>למזער כאב וסבל</b>. ועדת <b>IACUC</b> (עם וטרינרים) מאשרת כל מחקר ומבקרת במתקנים פעמיים בשנה.`)}${rem("טסקיגי נחשב ל<b>ניסוי־למחצה</b>, כי החוקרים לא חילקו את המשתתפים באקראי לחולים ובריאים.")}`,q:"q37"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"לפי הפרק, למה צריך מחקר מדעי ולא מספיק להסתמך על אינטואיציה?","a":"אינטואיציה וסמכות הובילו לאמונות שגויות","w":["כי אינטואיציה תמיד שגויה, בכל תחום ובכל מצב","כי מחקר מדעי לעולם לא טועה","כי סמכות של מומחה מספיקה כדי לדעת את האמת"],"e":"הספר מביא דוגמאות כמו כדור הארץ השטוח ו״דיבוק״ כסיבה למחלת נפש. מחקר מגן מטעויות, אבל גם הוא לא חסין מטעות."},{"q":"מה השאלה שפותחת את הפרק?","a":"האם צפייה באלימות בטלוויזיה מגבירה תוקפנות","w":["האם טלפונים חכמים פוגעים בזיכרון של מבוגרים","האם חיסונים גורמים לאוטיזם אצל ילדים","האם שינה משפרת ציונים בבחינות"],"e":"הפרק פותח בשאלה על אלימות בטלוויזיה, ומזכיר שגם סוקרטס חשש מהשפעת טכנולוגיה (הכתב) על הזיכרון."}]},"q2":{"t":"t1","v":[{"q":"מה ההבדל בין עובדה לדעה לפי הפרק?","a":"עובדה נבדקת במחקר אמפירי; דעה היא שיפוט אישי","w":["עובדה היא מה שרוב האנשים חושבים שהוא נכון","דעה היא עובדה שעוד לא פורסמה בכתב עת מדעי","אין הבדל, שתיהן נשענות על ראיות"],"e":"עובדות הן מציאות שאפשר לראות ולבדוק. דעות הן שיפוטים אישיים שיכולים להיות נכונים או לא."}]},"q3":{"t":"t1","v":[{"q":"מה פירוש ״ידע אמפירי״?","a":"ידע שנשען על ראיות שאפשר לראות שוב ושוב","w":["ידע שמגיע ממומחה בעל סמכות גבוהה בתחום","ידע שנשען על היגיון בלבד, בלי תצפית","ידע שרוב האנשים מסכימים עליו"],"e":"אמפירי = מבוסס על ראיות מוחשיות שכל מתבונן יכול לראות שוב."},{"q":"חוקר ראה שתפוחים, בננות ותפוזים גדלים על עצים, והסיק שכל הפירות גדלים על עצים. איזו הסקה זו?","a":"אינדוקטיבית","w":["דדוקטיבית","ניסויית מבוקרת","מתאמית"],"e":"אינדוקציה = מתצפיות לכלל. המסקנה יכולה להיות שגויה, כמו שתותים מראים."}]},"q4":{"t":"t1","v":[{"q":"מהי הסקה דדוקטיבית?","a":"מכלל כללי מסיקים מה צפוי לקרות במקרה מסוים","w":["מתצפיות רבות בונים כלל כללי וחדש שמסביר אותן","מחברים בין שתי תצפיות בלי שום כלל","בודקים התנהגות בלי לנסח השערה"],"e":"דדוקציה מתחילה מהשערה כללית ומסיקה ממנה מה צפוי במציאות. אינדוקציה הולכת בכיוון ההפוך."}]},"q5":{"t":"t1","v":[{"q":"מה התנאי שהשערה מדעית חייבת לעמוד בו?","a":"שאפשר יהיה להראות שהיא שגויה","w":["שהיא תאושר במחקר הראשון שבודק אותה","שהיא תתבסס על תיאוריה של פרויד","שהיא תהיה כללית ככל האפשר"],"e":"השערה מדעית חייבת להיות ניתנת להפרכה. זו גם הביקורת על חלק מהתיאוריות של פרויד."},{"q":"למה התיאוריות של פרויד זוכות לביקורת מדעית?","a":"ברובן אי אפשר להפריך אותן","w":["הן נבדקו רק על חיות במעבדה","הן לא השפיעו על הפסיכותרפיה","הן נשענות רק על מחקרי אורך"],"e":"מושגים כמו איד, אגו וסופר־אגו קשה לבדוק כך שאפשר להראות שהם שגויים. ובכל זאת הן חשובות היסטורית."}]},"q6":{"t":"t1","v":[{"q":"מה מצא המחקר על אנשים עם פגיעה בחוט השדרה, לגבי תיאוריית ג׳יימס־לאנג?","a":"הרגש שלהם פחות עז, אבל עדיין קיים","w":["הם לא חוו רגשות בכלל, כפי שהתיאוריה צפתה","הרגש שלהם היה עז יותר משל אחרים","לא נמצא שום הבדל ברגש בכלל"],"e":"התיאוריה צפתה שבלי עוררות גופנית לא יהיה רגש. נמצא שהרגש נחלש אבל נשאר, ולכן ההשערה הופרכה חלקית."}]},"q7":{"t":"t1","v":[{"q":"איזו שאלה לא מופיעה ברשימת השאלות של חשיבה ביקורתית?","a":"האם הטענה מתאימה למה שאני כבר מאמין","w":["האם למקור יש מומחיות אמיתית בתחום הזה","מה המקור מרוויח מהטענה שהוא מפרסם","מה חושבים חוקרים אחרים על זה"],"e":"שאלה על התאמה לאמונות שלי היא בדיוק הטיית אישוש. ארבע השאלות הן: מומחיות, אינטרס, ראיות, ודעת חוקרים אחרים."}]},"q8":{"t":"t1","v":[{"q":"מה הפרק אומר על מחקר ותוכניות התערבות מוקדמת לילדים?","a":"באופן כללי הן יעילות, אבל לא כולן באותה מידה","w":["כולן יעילות באותה מידה בדיוק, ולאורך זמן","אף אחת מהן לא הוכחה כיעילה","הן מזיקות לילדים בטווח הארוך"],"e":"הדוגמה מראה איך מחקר מכוון מדיניות: ההחלטה על מימון צריכה להישען על ראיות."}]},"q9":{"t":"t2","v":[{"q":"מה החיסרון העיקרי של חקר מקרה?","a":"קשה להכליל ממנו לאנשים אחרים","w":["הפרטים שהוא נותן שטחיים מאוד","הוא יקר יותר מכל שיטה אחרת","הוא לא מתאים למקרים נדירים"],"e":"חקר מקרה נותן את הפרטים העשירים ביותר, אבל המשתתפים לרוב חריגים, ולכן קשה להכליל."},{"q":"מה מלמד המקרה של התאומות קריסטה וטטיאנה הוגן?","a":"גם עם חיבור במוח הן שתי אישיויות נפרדות","w":["שתי אישיויות יכולות להתמזג לאחת לגמרי","התלמוס לא קשור לחוויות חושיות בכלל","חקר מקרה מאפשר להכליל לכל האוכלוסייה"],"e":"הן חולקות חלק מהחוויות החושיות, ועדיין הן שני אנשים נפרדים. זו דוגמה לחקר מקרה נדיר."}]},"q10":{"t":"t2","v":[{"q":"מה פירוש ״להכליל״ ממחקר?","a":"להחיל את הממצאים על קבוצות גדולות יותר","w":["לחזור על המחקר בדיוק באותה דרך ועם אותו מדגם","לסכם את כל הממצאים במספר אחד","לבדוק אם המדד עקבי לאורך זמן"],"e":"הכללה = לטעון שמה שנמצא במדגם נכון גם לחלקים רחבים של החברה."}]},"q11":{"t":"t2","v":[{"q":"מה היתרון העיקרי של תצפית טבעית?","a":"תוקף אקולוגי גבוה, קרוב לחיים האמיתיים","w":["שליטה מלאה ברגע שבו ההתנהגות תופיע","היא זולה ומהירה יותר מכל שיטה אחרת","אפשר להסיק ממנה סיבה ותוצאה"],"e":"היא מראה התנהגות כפי שהיא בחיים, אבל קשה לשלוט בה והיא דורשת זמן ומזל."},{"q":"למה צופה בתצפית טבעית צריך להיות בלתי מורגש?","a":"כי אנשים מתנהגים אחרת כשמסתכלים עליהם","w":["כי אסור לפי כללי האתיקה לראות משתתפים","כי אחרת לא אפשר לחשב מהימנות בין־שופטים","כי ההתנהגות לא מופיעה בלי הפרעה"],"e":"כמו נהג שמאט כשיש ניידת מאחוריו: נוכחות הצופה משנה את ההתנהגות."}]},"q12":{"t":"t2","v":[{"q":"מה זה ״המצב הזר״ של מרי איינסוורת׳?","a":"תצפית מובנית שבודקת התקשרות של תינוק","w":["תצפית טבעית בשימפנזים שנמשכה עשרות שנים באפריקה","סקר להורים על התנהגות התינוק","חקר מקרה של תינוק אחד נדיר"],"e":"בתצפית מובנית כל המשתתפים עוברים אותה משימה קבועה. במצב הזר, התגובה של התינוק בפגישה מחדש עם המטפל היא החשובה."}]},"q13":{"t":"t2","v":[{"q":"איך מתמודדים עם הטיית הצופה?","a":"כמה צופים, ובדיקה של מהימנות בין־שופטים","w":["צופה אחד מנוסה, שיודע בדיוק את ההשערה","שאלון דיווח עצמי במקום התצפית","הגדלת המדגם לאלפי משתתפים"],"e":"הטיית הצופה היא השפעה של ציפיות על מה שנרשם. כמה צופים שמסכימים ביניהם מקטינים אותה."},{"q":"מה החיסרון העיקרי של סקר?","a":"דיווח עצמי לא תמיד מדויק","w":["הוא יקר מאוד וקשה להעביר","הוא מגיע רק לקבוצות קטנות","אי אפשר לשאול בו על עמדות"],"e":"אנשים יכולים לשקר, לשכוח, או להציג את עצמם טוב יותר, למשל לדווח על פחות שתיית אלכוהול."}]},"q14":{"t":"t2","v":[{"q":"מה מצא הסקר על עמדות כלפי אמריקאים ערבים אחרי 11 בספטמבר?","a":"מעט דעה קדומה גלויה, אבל פחות רצון לקשר חברתי","w":["דעה קדומה גלויה וחזקה מאוד בקרב רוב ה רת המדגם האקראי?","a":"שהמדגם ייצג את האוכלוסייה","w":["שהקבוצות יהיו שוות זו לזו","שהחוקר לא ישפיע על התוצאות","שהמחקר יהיה זול ומהיר יותר"],"e":"כשלכל אחד יש סיכוי שווה להיבחר, המדגם נוטה לייצג את האוכלוסייה, וכך אפשר להכליל."}]},"q29":{"t":"t5","v":[{"q":"מה מוסיפה סמיות כפולה על פני סמיות יחידה?","a":"גם החוקרים לא יודעים מי בכל קבוצה","w":["גם המשתתפים לא יודעים מי בכל קבוצה","המשתתפים לא יודעים מה המטרה","אין קבוצת ביקורת בכלל"],"e":"בסמיות יחידה רק המשתתפים לא יודעים. בכפולה גם החוקרים, וכך מונעים גם הטיית נסיין."},{"q":"למה נותנים לקבוצת הביקורת ״כדור סוכר״?","a":"כדי לשלוט באפקט הפלצבו","w":["כדי לשלוט בהטיית הצופה","כדי להגדיל את המדגם","כדי לחסוך בעלויות התרופה"],"e":"הציפייה לבדה יכולה לשפר את ההרגשה. כדור סוכר מאפשר להפריד בין השפעת התרופה להשפעת הציפייה."}]},"q30":{"t":"t5","v":[{"q":"מחקר משווה גברים ונשים בזיכרון מרחבי. למה זה ניסוי־למחצה?","a":"כי אי אפשר לחלק את המין באקראי","w":["כי המדגם במחקר קטן מדי","כי אין בו משתנה תלוי ברור","כי הוא נעשה מחוץ למעבדה"],"e":"כשאי אפשר לשלוט במשתנה, אין חלוקה אקראית, ולכן אי אפשר לטעון לסיבתיות."}]},"q31":{"t":"t6","v":[{"q":"מתי הבדל נחשב מובהק סטטיסטית?","a":"כשהסיכוי שהוא מקרי קטן מ־5%","w":["כשהוא גדול מ־5% בין הקבוצות","כשהוא מופיע אצל כל המשתתפים","כשהחוקר צפה אותו מראש"],"e":"מובהקות = הסיכוי לראות את ההבדל אילו הקבוצות לא היו שונות באמת קטן מ־5%."},{"q":"מה תפקיד ביקורת העמיתים?","a":"מומחים בודקים את המחקר לפני פרסום","w":["משתתפים בודקים את התוצאות של עצמם","חוקרים אחרים חוזרים על המחקר בדיוק","הוועדה האתית מאשרת את הפרסום"],"e":"ביקורת עמיתים היא בקרת איכות: מומחים בודקים רציונל, שיטה, אתיקה וסטטיסטיקה."}]},"q32":{"t":"t6","v":[{"q":"מה מלמד המקרה של המחקרים על חיסונים ואוטיזם?","a":"מחקר שנמשך מהפרסום יכול לגרום נזק ממשי","w":["חיסונים גורמים לאוטיזם אצל חלק מהילדים","ביקורת עמיתים תמיד תופסת זיוף","שחזור מחקרים הוא מיותר"],"e":"המחקרים נמשכו בגלל ניגוד עניינים, אבל האמונה נשארה, וב־2019 היו בארה״ב מעל 1,000 מקרי חצבת."},{"q":"מה המשמעות של כישלון חוזר לשחזר מחקר?","a":"הממצא המקורי מוטל בספק","w":["המחקר החדש כנראה שגוי","הממצא המקורי הוכח סופית","צריך להגדיל את רמת המובהקות"],"e":"שחזור הוא הדרך לבדוק אם ממצא אמיתי. כישלונות חוזרים מערערים עליו."}]},"q33":{"t":"t6","v":[{"q":"משקל שתמיד מראה 2 ק״ג יותר מהמשקל האמיתי הוא:","a":"מהימן אבל לא תקף","w":["תקף אבל לא מהימן","גם מהימן וגם תקף","לא מהימן ולא תקף"],"e":"הוא עקבי (מהימן), אבל לא מודד נכון (לא תקף). מדד מהימן לא בהכרח תקף."},{"q":"איזה משפט נכון לגבי מהימנות ותוקף?","a":"מדד תקף חייב להיות מהימן","w":["מדד מהימן חייב להיות תקף","אין קשר בין מהימנות לתוקף","מדד תקף לא יכול להיות מהימן"],"e":"אם מדד מודד נכון את מה שצריך, הוא חייב גם להיות עקבי. אבל עקביות לבדה לא מבטיחה שמודדים את הדבר הנכון."}]},"q34":{"t":"t6","v":[{"q":"מהי מהימנות?","a":"עד כמה המדד עקבי","w":["עד כמה המדד מודד את מה שהוא אמור","עד כמה המחקר קרוב לחיים האמיתיים","עד כמה התוצאה מובהקת"],"e":"מהימנות = עקביות. תוקף = האם המדד מודד את מה שהוא אמור למדוד."}]},"q35":{"t":"t7","v":[{"q":"מה לא חייב להופיע בטופס הסכמה מדעת?","a":"ההשערה המדויקת של החוקר","w":["שההשתתפות היא מרצון","שאפשר לפרוש בכל רגע בלי עונש","שהמידע יישמר חסוי"],"e":"לפעמים מסתירים את ההשערה כדי לא להטות תשובות (הטעיה). אבל ההתנדבות, הזכות לפרוש והסודיות חייבות להופיע."},{"q":"מי חותם על הסכמה מדעת כשהמשתתף מתחת לגיל 18?","a":"הורה או אפוטרופוס","w":["המשתתף בלבד","ועדת ה־IRB של המוסד","החוקר הראשי"],"e":"לפי הפרק, מתחת לגיל 18 הורה או אפוטרופוס חותם על הטופס."}]},"q36":{"t":"t7","v":[{"q":"מה חובה לעשות אחרי מחקר שהשתמש בהטעיה?","a":"תחקיר שמסביר את המטרה ואת סיבת ההטעיה","w":["לבקש מהמשתתפים לחתום שוב על טופס הסכמה","למחוק את כל הנתונים שנאספו","לא לספר דבר כדי לשמור על המחקר"],"e":"בתחקיר מספרים למשתתפים את האמת: מה נבדק, למה הוטעו, ומה ייעשה בנתונים."}]},"q37":{"t":"t7","v":[{"q":"מה הייתה הפגיעה המרכזית במחקר טסקיגי?","a":"הסתירו מהחולים את המחלה ומנעו מהם טיפול","w":["חילקו את המשתתפים באקראי לחולים ובריאים","נתנו למשתתפים פניצילין בלי הסכמה","גייסו רק משתתפים מתחת לגיל 18"],"e":"לחולים לא נאמר שהם חולים, ומ־1947 מנעו מהם פניצילין. המחקר נמשך עד 1972."},{"q":"מה הוביל להפסקת מחקר טסקיגי ב־1972?","a":"חשיפה בעיתונות","w":["ועדת IRB של האוניברסיטה","המשתתפים שתבעו את החוקרים","גילוי הפניצילין באותה שנה"],"e":"רק אחרי החשיפה בתקשורת המחקר הופסק, וב־1974 נחקק חוק המחקר הלאומי."}]},"q38":{"t":"t7","v":[{"q":"מה תפקיד ועדת IACUC?","a":"לאשר מחקרים בחיות ולבקר במתקנים","w":["לאשר מחקרים בבני אדם מתחת לגיל 18","לבדוק מאמרים לפני פרסום בכתב עת","לחלק את המשתתפים לקבוצות באקראי"],"e":"IACUC, עם וטרינרים, מאשרת כל מחקר בחיות ומבקרת במתקנים פעמיים בשנה. IRB אחראית על בני אדם."},{"q":"למה מחקר טסקיגי נחשב ניסוי־למחצה?","a":"כי לא חילקו את המשתתפים באקראי","w":["כי לא הייתה בו קבוצת ביקורת","כי הוא נמשך פחות משנה","כי הוא נעשה על חיות"],"e":"החולים היו קבוצת הניסוי והבריאים קבוצת הביקורת, אבל לא בחלוקה אקראית."}]}};
const H={"h1":{"t":"t1","v":[{"q":"סטודנטית שמה לב שבשלושה מבחנים שלפניהם לא ישנה היא נכשלה, ומסיקה ש״כשלא ישנים, נכשלים״. איזה סוג חשיבה זה?","a":"אינדוקציה: מכמה מקרים בונים כלל כללי","w":["דדוקציה: מכלל כללי מסיקים על מקרה אחד","הפרכה: מוכיחים שההשערה הקודמת שגויה","חשיבה ביקורתית: בודקים מי מרוויח מהטענה"],"e":"אינדוקציה הולכת מהפרט אל הכלל. הסכנה: הכלל עלול להיות שגוי, כמו ״כל הפירות גדלים על עצים״ עד שפוגשים תות."},{"q":"חוקר מתחיל מהתיאוריה ״צפייה באלימות מלמדת אלימות״, ומסיק שילדים שיצפו בסרט אלים יכו בובה יותר. איזה סוג חשיבה זה?","a":"דדוקציה: מהכלל מסיקים מה יקרה במקרה מסוים","w":["אינדוקציה: מכמה מקרים בונים כלל כללי","תצפית טבעית: צופים בהתנהגות בלי להתערב","חקר מקרה: בודקים לעומק אדם אחד"],"e":"דדוקציה הולכת מהכלל אל המקרה. כך נגזרת השערה מתיאוריה."}]},"h2":{"t":"t1","v":[{"q":"לפי תיאוריה מסוימת, אדם שמתנהג בתוקפנות מבטא דחף מודחק, ואדם שמתנהג בעדינות ״מתגונן״ מפני אותו דחף. מה הבעיה בתיאוריה?","a":"אי אפשר להפריך אותה, כי כל תוצאה מתאימה לה","w":["היא מבוססת על מדגם קטן מדי של מטופלים","היא נבדקה רק בתצפית טבעית, בלי ניסוי","היא מסבירה רק התנהגות תוקפנית, ולא עדינה"],"e":"השערה טובה חייבת לאפשר תוצאה שתוכיח שהיא שגויה. זו הביקורת על חלק מהרעיונות של פרויד."}]},"h3":{"t":"t1","v":[{"q":"משפיענית ברשת ממליצה על תוסף ״שמשפר זיכרון״, ומקבלת עמלה על כל רכישה. איזו שאלה של חשיבה ביקורתית הכי רלוונטית?","a":"מה היא מרוויחה מהטענה הזו?","w":["האם הטענה היא עובדה או דעה?","האם המדגם שלה מייצג?","האם היא השתמשה בקבוצת ביקורת?"],"e":"ארבע השאלות: מומחיות, אינטרס (מה מרוויחים), ראיות, ומה חושבים מומחים אחרים. כאן יש אינטרס ברור."}]},"h4":{"t":"t2","v":[{"q":"חוקרים עוקבים במשך שנים אחרי אדם אחד שאיבד את היכולת לזכור דברים חדשים אחרי ניתוח. מה החיסרון העיקרי של השיטה?","a":"קשה להכליל ממנו לכל האנשים","w":["המידע שמתקבל שטחי ולא מפורט","אי אפשר לעקוב אחרי אדם לאורך זמן","השיטה יקרה מכל השיטות האחרות"],"e":"חקר מקרה נותן פרטים עשירים מאוד, אבל מה שנכון לאדם אחד לא בהכרח נכון לכולם."}]},"h5":{"t":"t2","v":[{"q":"חוקרת צופה בילדים בהפסקה בחצר בית הספר, בלי להתערב. מה היתרון העיקרי?","a":"תוקף אקולוגי: ההתנהגות טבעית","w":["שליטה מלאה במה שקורה לכל ילד","אפשר להסיק מה גורם לתוקפנות","כל הילדים עוברים בדיוק אותה משימה"],"e":"זו תצפית טבעית. החיסרון: אין שליטה, ולפעמים מחכים הרבה עד שההתנהגות מופיעה."},{"q":"חוקרים מביאים אמהות ותינוקות לחדר קבוע, והאמא יוצאת לכמה דקות. מה השיטה ומה היתרון שלה?","a":"תצפית מובנית: כולם באותו מצב, ויש שליטה","w":["תצפית טבעית: ההתנהגות אמיתית כמו בבית","ניסוי: אפשר להסיק מה גורם למה","חקר מקרה: מקבלים פרטים עשירים על תינוק אחד"],"e":"זה ״המצב הזר״. תצפית מובנית נותנת שליטה, אבל פחות טבעיות."}]},"h6":{"t":"t2","v":[{"q":"חוקר שבטוח שבנים תוקפניים יותר רושם דחיפה של בן כ״תוקפנות״ ודחיפה של בת כ״משחק״. מה הבעיה, ומה הפתרון?","a":"הטיית הצופה, ופותרים בהסכמה בין כמה צופים","w":["מדגם לא מייצג, ופותרים בבחירה אקראית של ילדים","חוסר תוקף אקולוגי, ופותרים בתצפית בחצר","אפקט פלסבו, ופותרים בקבוצת ביקורת"],"e":"ההסכמה בין צופים שרושמים בנפרד נקראת מהימנות בין־שופטים."}]},"h7":{"t":"t2","v":[{"q":"סקר שואל סטודנטים ״כמה שעות ביום אתה בטלפון?״. למה התשובות עלולות להיות לא מדויקות?","a":"אנשים לא תמיד יודעים, או רוצים להיראות טוב","w":["הסקר בודק אדם אחד בלבד ולכן לא מייצג","הסקר נעשה במעבדה ולכן ההתנהגות לא טבעית","הסקר משתמש במידע ישן שנאסף למטרה אחרת"],"e":"היתרון של סקר: זול, מהיר ומגיע להרבה אנשים. החיסרון: אין עומק, ודיווח עצמי לא תמיד מדויק."}]},"h8":{"t":"t3","v":[{"q":"חוקרת משתמשת בתיקים רפואיים ישנים כדי לבדוק קשר בין משקל לידה לבעיות קשב. מה הסיכון העיקרי?","a":"אולי המידע שהיא צריכה פשוט לא נרשם","w":["המשתתפים ישנו את ההתנהגות כי הם יודעים שצופים בהם","המחקר ייקח עשרות שנים, ולכן משתתפים יפרשו","היא לא תוכל לבדוק יותר מאדם אחד בכל פעם"],"e":"מחקר ארכיון זול ולא דורש גיוס משתתפים, אבל תלוי במה שאחרים בחרו לרשום."}]},"h9":{"t":"t3","v":[{"q":"חוקר בודק באותו יום אנשים בני 20, 40 ו־60, ומשווה את הזיכרון שלהם. איזה מחקר זה, ומה הסיכון?","a":"מחקר חתך, וההבדלים עלולים לנבוע מהדור ולא מהגיל","w":["מחקר אורך, ומשתתפים עלולים לנשור לאורך השנים","מחקר ארכיון, והמידע אולי לא נרשם","ניסוי, ואי אפשר להקצות אנשים לגילים באקראי"],"e":"אנשים בני 60 גדלו בתקופה אחרת (השכלה, טכנולוגיה). לכן ההבדל אולי נובע מהדור (אפקט קוהורט)."},{"q":"חוקרת בודקת את אותם אנשים כל חמש שנים, במשך 30 שנה. מה החיסרון העיקרי?","a":"לוקח זמן רב, ומשתתפים נושרים","w":["ההבדלים עלולים לנבוע מהדור ולא מהגיל","אין שום דרך לראות איך אדם אחד משתנה","אי אפשר להשוות בין קבוצות גיל שונות"],"e":"זה מחקר אורך. היתרון: רואים שינוי אמיתי אצל אותם אנשים. החיסרון: זמן, עלות ונשירה."}]},"h10":{"t":"t4","v":[{"q":"מחקר מצא שככל שאנשים ישנים פחות, הם מדווחים על יותר מתח. איזה סוג מתאם זה?","a":"שלילי: אחד עולה כשהשני יורד","w":["מתאם חיובי: שני המשתנים זזים יחד","מתאם אפס: אין קשר בין המשתנים","מתאם סיבתי: חוסר שינה גורם למתח"],"e":"פחות שינה, יותר מתח = כיוונים הפוכים = שלילי. וזה עדיין לא אומר מה גורם למה."}]},"h11":{"t":"t4","v":[{"q":"מקדם מתאם של <span dir=\"ltr\">−0.8</span> ומקדם של <span dir=\"ltr\">+0.3</span>. איזה קשר חזק יותר?","a":"‎−0.8, כי העוצמה נקבעת לפי המרחק מאפס","w":["‎+0.3, כי מתאם חיובי תמיד חזק יותר","שניהם שווים, כי שניהם רחוקים מאפס","אי אפשר להשוות בין מתאם חיובי לשלילי"],"e":"הסימן אומר כיוון, והמספר אומר עוצמה. 0.8 קרוב יותר ל־1 מאשר 0.3."}]},"h12":{"t":"t4","v":[{"q":"מחקר מצא שבימים שנמכרת יותר גלידה יש יותר טביעות בים. מה ההסבר הסביר?","a":"משתנה שלישי, חום, גורם לשניהם","w":["גלידה גורמת לשחיינים להתעייף ולטבוע","טביעות גורמות לאנשים לקנות יותר גלידה","זה מתאם מדומה שלא באמת קיים"],"e":"זו בעיית המשתנה השלישי. בימים חמים קונים יותר גלידה וגם שוחים יותר."}]},"h13":{"t":"t4","v":[{"q":"אדם בטוח שבירח מלא יש יותר תאונות, כי הוא זוכר כמה מקרים כאלה. מחקרים לא מצאו קשר. איך קוראים לזה?","a":"מתאם מדומה: רואים קשר שלא קיים","w":["מתאם שלילי: הירח מפחית את התאונות","משתנה שלישי: משהו אחר גורם לשניהם","הטיית צופה: החוקר רושם רק מה שהוא מצפה"],"e":"זוכרים את המקרים שמתאימים לאמונה ושוכחים את השאר (הטיית אישוש), ולכן ״רואים״ קשר."}]},"h14":{"t":"t5","v":[{"q":"חוקרת מחלקת ילדים בהגרלה: חלק צופים בסרט אלים, וחלק בסרט רגיל. אחר כך היא סופרת כמה פעמים כל ילד מכה בובה. מהו המשתנה התלוי?","a":"מספר המכות בבובה, כי את זה היא מודדת","w":["סוג הסרט, כי את זה היא משנה בין הקבוצות","ההגרלה, כי היא קובעת מי בכל קבוצה","גיל הילדים, כי הוא שונה בין הילדים"],"e":"המשתנה הבלתי תלוי הוא מה שהחוקר משנה (הסרט). המשתנה התלוי הוא מה שהוא מודד (המכות)."}]},"h15":{"t":"t5","v":[{"q":"באותו ניסוי, למה חשוב שהחלוקה לקבוצות נעשתה בהגרלה?","a":"כדי שהקבוצות יהיו דומות לפני הסרט","w":["כדי שהמדגם ייצג את כל הילדים בארץ","כדי שהילדים לא ידעו באיזו קבוצה הם","כדי שהחוקרת לא תדע מה ציפו לראות"],"e":"הקצאה אקראית מנטרלת הבדלים קודמים בין הילדים. היא שמאפשרת להסיק סיבתיות."}]},"h16":{"t":"t5","v":[{"q":"בניסוי תרופה, קבוצה אחת מקבלת כדור אמיתי, והשנייה כדור סוכר שנראה זהה. למה צריך את כדור הסוכר?","a":"כדי לנטרל פלסבו: שיפור רק כי מצפים לו","w":["כדי שהקבוצות יהיו דומות לפני תחילת הניסוי","כדי שהמדגם ייצג את כל החולים במחלה","כדי לבדוק את המהימנות בין השופטים"],"e":"אם שתי הקבוצות משתפרות באותה מידה, השיפור נובע מהציפייה ולא מהתרופה."}]},"h17":{"t":"t5","v":[{"q":"בניסוי, לא המשתתפים ולא החוקרים שפוגשים אותם יודעים מי קיבל טיפול אמיתי. מה זה מונע?","a":"גם פלסבו וגם הטיית חוקר (סמיות כפולה)","w":["רק אפקט פלסבו אצל המשתתפים (סמיות יחידה)","רק בעיה של מדגם לא מייצג (דגימה אקראית)","רק בעיית המשתנה השלישי (הקצאה אקראית)"],"e":"בסמיות יחידה רק המשתתפים לא יודעים. בסמיות כפולה גם החוקרים, כדי שהציפיות שלהם לא ישפיעו."}]},"h18":{"t":"t5","v":[{"q":"חוקר רוצה להסיק מניסוי על כל הסטודנטים בארץ, אבל בדק רק סטודנטים מהקורס שלו. מה הבעיה?","a":"המדגם לא מייצג, ולכן קשה להכליל","w":["אין קבוצת ביקורת, ולכן אין סיבתיות","אין הקצאה אקראית, ולכן הקבוצות שונות","אין סמיות כפולה, ולכן יש אפקט פלסבו"],"e":"כדי להכליל צריך מדגם אקראי, שבו לכל אחד באוכלוסייה יש סיכוי שווה להיבחר."}]},"h19":{"t":"t6","v":[{"q":"מה המשמעות של ״תוצאה מובהקת סטטיסטית״?","a":"לא סביר שההבדל נוצר במקרה","w":["ההבדל גדול וחשוב בחיי היומיום","התוצאה נבדקה והתקבלה שוב במחקר נוסף","המבחן מודד את מה שהוא אמור למדוד"],"e":"מובהקות אומרת רק שהתוצאה כנראה לא מקרית. היא לא אומרת שההבדל גדול או חשוב."}]},"h20":{"t":"t6","v":[{"q":"מבחן אישיות נותן לאותו אדם תוצאות שונות מאוד כשהוא עושה אותו פעמיים בשבוע. מה חסר למבחן?","a":"מהימנות: עקביות בתוצאות","w":["תוקף: מדידה של מה שהוא אמור למדוד","מובהקות: תוצאה שלא נוצרה במקרה","שחזור: תוצאה שהתקבלה במחקר נוסף"],"e":"מבחן מהימן נותן תוצאות דומות במדידות חוזרות. מבחן יכול להיות מהימן ובכל זאת לא תקף."},{"q":"מבחן ״אינטליגנציה״ מודד בעקביות את מהירות ההקלדה. מה נכון?","a":"הוא מהימן, אבל לא תקף","w":["הוא תקף, אבל לא מהימן","הוא גם מהימן וגם תקף","הוא לא מהימן ולא תקף"],"e":"הוא עקבי (מהימן), אבל לא מודד את מה שהוא אמור למדוד (לא תקף). כמו משקל שתמיד מראה 2 ק״ג יותר."}]},"h21":{"t":"t6","v":[{"q":"למה מדענים מייחסים חשיבות רבה לשחזור של מחקרים?","a":"תוצאה שחוזרת שוב ושוב אמינה יותר","w":["שחזור מוכיח שהתוצאה גדולה וחשובה","שחזור מחליף את הצורך במובהקות","שחזור מבטיח שהמדגם יהיה מייצג"],"e":"מחקר אחד יכול לצאת במקרה או בגלל טעות. כשתוצאה חוזרת, אפשר לסמוך עליה יותר."}]},"h22":{"t":"t7","v":[{"q":"בניסוי שבו הוטעו המשתתפים לגבי המטרה, מה החוקר חייב לעשות בסוף?","a":"שיחת תחקיר: להסביר את המטרה האמיתית ואת ההטעיה","w":["לבקש מהמשתתפים לחתום על הסכמה מדעת","לפרסם את שמות המשתתפים כדי שאפשר יהיה לשחזר","לתת למשתתפים כדור סוכר כדי לנטרל פלסבו"],"e":"הסכמה מדעת ניתנת לפני הניסוי. התחקיר בסוף מסביר מה באמת נבדק ולמה הייתה הטעיה."}]},"h23":{"t":"t7","v":[{"q":"חוקרת רוצה לבדוק ילדים בני 8. ממי היא צריכה הסכמה?","a":"מההורים, וגם הסכמה של הילד עצמו","w":["רק מהילד, כי הוא המשתתף","רק מבית הספר, כי שם נערך המחקר","רק מוועדת האתיקה, ולא מהמשפחה"],"e":"קטינים לא יכולים לתת הסכמה מדעת לבד. ההורים מסכימים, והילד נותן ״הסכמה״ משלו."}]},"h24":{"t":"t7","v":[{"q":"משתתף רוצה לעזוב ניסוי באמצע. מה נכון לפי כללי האתיקה?","a":"מותר לו לעזוב בכל שלב, בלי עונש","w":["אסור, כי הוא כבר חתם על הסכמה מדעת","מותר, אבל רק אחרי שיחת התחקיר","מותר, אבל הנתונים שלו חייבים להישאר במחקר"],"e":"הזכות לפרוש היא חלק מההסכמה מדעת. ועדת האתיקה (IRB) מוודאת שהכללים נשמרים."}]}};
const SUM=`<h2>סיכום: Spielman פרק 2 - מחקר פסיכולוגי</h2>
<div class="key"><b>השאלה של הפרק במשפט אחד:</b> איך פסיכולוגים יודעים שמשהו נכון, ולא רק מרגישים שהוא נכון?<br><br>
<b>הפרק בנוי משלושה חלקים, וכל אחד ממשיך את הקודם:</b><br>
① <b>למה צריך מחקר בכלל</b> (סעיף 1): תחושת בטן ו״כולם יודעים״ מטעים, ולכן בודקים רעיונות מול ראיות.<br>
② <b>איך בודקים</b> (סעיפים 2–5): יש שלוש רמות. שיטות ש<b>מתארות</b> מה קורה, מחקר ש<b>מראה ששני דברים הולכים יחד</b>, וניסוי, שהוא היחיד שיכול להראות <b>מה גורם למה</b>.<br>
③ <b>האם אפשר לסמוך על התוצאה, ואיך עושים את זה בלי לפגוע באנשים</b> (סעיפים 6–7).</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>משתנה</b></td><td>כל דבר שיכול להשתנות בין אנשים או מצבים ואפשר למדוד אותו: שעות שינה, ציון, מצב רוח, כמות קפה.</td></tr>
<tr><td><b>השערה</b></td><td>ניחוש מדויק שאפשר לבדוק. ״אם X, אז Y״.</td></tr>
<tr><td><b>אוכלוסייה / מדגם</b></td><td>אוכלוסייה = כל האנשים שמעניינים אותנו (כל הסטודנטים בישראל). מדגם = האנשים שבאמת בדקנו (300 סטודנטים).</td></tr>
<tr><td><b>הכללה</b></td><td>להסיק מהמדגם על כל האוכלוסייה. ״מצאנו אצל 300 סטודנטים, אז זה כנראה נכון לכל הסטודנטים״.</td></tr>
<tr><td><b>סיבתיות</b></td><td>שדבר אחד <b>גורם</b> לדבר אחר. לא רק שהם מופיעים יחד, אלא שאחד יוצר את השני.</td></tr></table></div>

<h3>השאלה שתלווה אותנו: אלימות בטלוויזיה</h3>
<p>הפרק נפתח בשאלה: <b>האם צפייה באלימות בטלוויזיה הופכת ילדים לתוקפניים יותר?</b> לכל אחד יש דעה, אבל דעה זה לא מחקר. בכל סעיף נבדוק: איך השיטה הזו הייתה עונה על השאלה, ומה היא <b>לא</b> הייתה יכולה להגיד.</p>

<h3>1. למה צריך מחקר?</h3>
<p>במשך רוב ההיסטוריה אנשים קבעו מה נכון לפי תחושת בטן, לפי מה שאמר מישהו חשוב, או לפי ״כולם יודעים״. כך האמינו שכדור הארץ שטוח, ושמחלת נפש נגרמת מ״דיבוק״. הפסיכולוגיה מנסה להחליף את זה בשיטה מסודרת.</p>
<ul>
<li><b>ידע אמפירי</b> = ידע שמבוסס על <b>ראיות שאפשר לראות ולבדוק</b>, ולא על מה שמישהו חושב. אם אני אומר ״קפה משפר ריכוז״, ידע אמפירי הוא תוצאה של בדיקה, לא התחושה שלי אחרי אספרסו.</li>
<li><b>השיטה המדעית</b> היא מעגל: יש רעיון, בודקים אותו מול המציאות, ולפי מה שיצא מתקנים את הרעיון ובודקים שוב.</li>
</ul>
<h4>שני כיווני חשיבה: דדוקציה ואינדוקציה</h4>
<p>ההבדל ביניהם הוא <b>הכיוון</b>: מהכלל לפרט, או מהפרט לכלל.</p>
<div class="ex"><b>דדוקציה = מהכלל אל המקרה.</b> מתחילים מכלל, ומסיקים ממנו מה יקרה במקרה מסוים.<br>
דוגמה: ״כל הסטודנטים שלא ישנים לפני מבחן מקבלים פחות״ ← ״אז אם לא אישן הלילה, אקבל פחות מחר״.<br><br>
<b>אינדוקציה = מהמקרים אל הכלל.</b> רואים כמה מקרים, ובונים מהם כלל.<br>
דוגמה: ״שלוש פעמים לא ישנתי לפני מבחן, ובכולן נכשלתי״ ← ״כנראה כשלא ישנים, נכשלים״.<br>
<b>הבעיה באינדוקציה:</b> הכלל יכול להיות שגוי. מי שראה רק תפוחים, תפוזים ואגסים יגיד ״כל הפירות גדלים על עצים״, עד שהוא פוגש תות.</div>
<h4>תיאוריה, השערה, והפרכה</h4>
<ul>
<li><b>תיאוריה</b> = הסבר רחב לתופעה. ״צפייה באלימות מלמדת ילדים להתנהג באלימות״.</li>
<li><b>השערה</b> = ניבוי מסוים שנובע מהתיאוריה ושאפשר לבדוק. ״אם ילדים יצפו 20 דקות בתוכנית אלימה, הם יכו בובה יותר פעמים במשחק אחרי זה״.</li>
<li>השערה חייבת להיות <b>ניתנת להפרכה</b>: צריכה להיות תוצאה אפשרית שתוכיח שהיא שגויה. אם הילדים לא יכו את הבובה יותר, ההשערה הופרכה. זה טוב, כי עכשיו למדנו משהו.</li>
</ul>
<div class="ex"><b>למה פרויד מקבל על זה ביקורת:</b> לפי חלק מהרעיונות שלו, אם אדם מתנהג באגרסיביות, זה דחף מודחק. ואם הוא מתנהג בעדינות, זה ״הגנה״ נגד אותו דחף. כל תוצאה מתאימה לתיאוריה, ולכן אין שום תוצאה שתוכיח שהיא שגויה. תיאוריה כזו אי אפשר לבדוק.</div>
<h4>חשיבה ביקורתית: איך בודקים טענה ששומעים</h4>
<p>כשמישהו טוען משהו (באינסטגרם, בפרסומת, בחדשות), שואלים ארבע שאלות: <b>האם יש לו מומחיות</b> בתחום? <b>מה הוא מרוויח</b> מזה? <b>מה הראיות?</b> ו<b>מה חושבים מומחים אחרים?</b> וגם מבחינים בין <b>עובדה</b>, שאפשר לבדוק (״השינה מסדרת את הזיכרון״), לבין <b>דעה</b>, שהיא שיפוט אישי (״לישון זה מבזבז זמן״).</p>

<h3>2. שיטות תיאוריות: לתאר מה קורה</h3>
<p>עכשיו, כשהבנו למה צריך לבדוק, הפרק עובר לשאלה <b>איך</b>. השלב הראשון הוא פשוט <b>לתאר</b>: מה אנשים עושים, כמה פעמים, באיזה מצבים. השיטות האלה עונות על ״מה קורה?״, אבל <b>לא</b> על ״למה?״.</p>

<h4>חקר מקרה</h4>
<p><b>מה זה:</b> בודקים לעומק אדם אחד או קבוצה קטנה מאוד. בדרך כלל מישהו עם מצב נדיר.<br>
<b>דוגמה:</b> אדם שנפגע במוח בתאונה ומאז לא מצליח לזכור דברים חדשים. חוקרים עוקבים אחריו שנים.<br>
<b>יתרון:</b> מקבלים פרטים מאוד עשירים. <b>חיסרון:</b> קשה <b>להכליל</b>. מה שנכון לאדם אחד לא בהכרח נכון לכולם.</p>

<h4>תצפית טבעית ותצפית מובנית</h4>
<p><b>תצפית טבעית:</b> צופים בהתנהגות במקום שבו היא קורה באמת, בלי להתערב. למשל, צופים בילדים בהפסקה בחצר בית הספר. היתרון: ההתנהגות אמיתית, כי הם לא במעבדה. לזה קוראים <b>תוקף אקולוגי</b> גבוה: התוצאה מתאימה לחיים האמיתיים. החיסרון: אין שליטה, ולפעמים מחכים הרבה זמן עד שמשהו קורה.</p>
<p><b>תצפית מובנית:</b> מביאים אנשים למקום קבוע ונותנים להם משימה קבועה, ואז צופים. הדוגמה המפורסמת: ״המצב הזר״, שבו אמא יוצאת מהחדר ורואים איך התינוק מגיב. היתרון: יותר שליטה, וכולם עוברים אותו דבר. החיסרון: פחות טבעי.</p>
<div class="ex"><b>בעיה בתצפית: הטיית הצופה.</b> מי שמצפה לראות משהו, ״רואה״ אותו יותר. חוקר שבטוח שבנים תוקפניים יותר עלול לרשום דחיפה של בן כ״תוקפנות״ ודחיפה של בת כ״משחק״.<br>
<b>הפתרון:</b> כמה צופים רושמים בנפרד, ובודקים אם הם מסכימים ביניהם. ההסכמה הזו נקראת <b>מהימנות בין־שופטים</b>. אם כולם רשמו אותו דבר, אפשר לסמוך על התצפית.</div>

<h4>סקר</h4>
<p><b>מה זה:</b> שואלים הרבה אנשים שאלות, בשאלון או בטלפון.<br>
<b>דוגמה:</b> סקר שבודק כמה שעות ביום סטודנטים משתמשים בטלפון.<br>
<b>יתרון:</b> זול ומהיר, ומגיע להרבה אנשים. <b>חיסרון:</b> אין עומק, ואנשים לא תמיד עונים אמת. לפעמים הם לא יודעים (כמה באמת אתה בטלפון?), ולפעמים הם רוצים להיראות טוב.</p>

<h4>מחקר ארכיון</h4>
<p><b>מה זה:</b> משתמשים במידע שכבר נאסף, כמו תיקים רפואיים, רישומי משטרה או ציונים ישנים.<br>
<b>יתרון:</b> זול, ולא צריך לגייס משתתפים. <b>חיסרון:</b> החוקר לא בחר מה לאסוף. אם המידע שהוא צריך לא נרשם, אין לו מה לעשות.</p>

<h4>אוכלוסייה, מדגם וממוצעים</h4>
<p>בכל השיטות האלה בודקים <b>מדגם</b> ורוצים להסיק על <b>האוכלוסייה</b>. כדי לסכם את התוצאות משתמשים ב״מדדי מרכז״, שעונים על השאלה ״מה הערך הטיפוסי?״:</p>
<div class="ex"><b>נניח שחמישה חברים מרוויחים בחודש:</b> 6,000, 7,000, 7,000, 8,000, 52,000.<br>
<b>שכיח</b> (הערך שמופיע הכי הרבה): 7,000.<br>
<b>חציון</b> (הערך האמצעי כשמסדרים לפי הגודל): 7,000.<br>
<b>ממוצע</b> (סכום חלקי מספר האנשים): 16,000.<br>
<b>הלקח:</b> הממוצע ״קפץ״ בגלל אדם אחד שמרוויח הרבה. לכן אומרים שהממוצע <b>רגיש לערכים קיצוניים</b>, והחציון לא.</div>
<div class="ex"><b>בשאלה שלנו:</b> אפשר לצפות בילדים בחצר ולרשום כמה פעמים הם מרביצים, ולשאול את ההורים בסקר כמה טלוויזיה הם רואים. נדע הרבה על מה שקורה, אבל לא נדע אם הטלוויזיה <b>גורמת</b> לתוקפנות.</div>

<h3>3. איך חוקרים שינוי עם הגיל: מחקר אורך מול מחקר חתך</h3>
<p>שיטות תיאוריות יכולות לבדוק גם איך אנשים משתנים עם הגיל. יש לזה שתי דרכים:</p>
<div class="ex"><b>מחקר אורך:</b> לוקחים <b>אותם אנשים</b> ובודקים אותם שוב ושוב לאורך שנים. למשל, בודקים את אותם 200 ילדים בגיל 5, 10 ו־15.<br>
<b>יתרון:</b> רואים איך אותו אדם באמת השתנה.<br>
<b>חסרונות:</b> לוקח שנים ועולה הרבה כסף. בנוסף יש <b>נשירה</b>: עם השנים חלק מהמשתתפים עוברים דירה, מאבדים עניין או מפסיקים להגיע, והמדגם הולך וקטן.</div>
<div class="ex"><b>מחקר חתך:</b> בודקים <b>באותו יום</b> כמה קבוצות גיל שונות. למשל, 100 ילדים בני 5, 100 בני 10 ו־100 בני 15, ומשווים ביניהם.<br>
<b>יתרון:</b> מהיר. מקבלים תשובה תוך שבועות ולא שנים.<br>
<b>חיסרון: אפקט הקוהורט.</b> ״קוהורט״ = דור, אנשים שנולדו באותה תקופה וגדלו באותו עולם. כשמשווים בני 20 לבני 60, ההבדל יכול לנבוע מ<b>הגיל</b>, אבל גם מזה שהם גדלו בעולם אחר.</div>
<div class="ex"><b>דוגמה לבעיית הקוהורט:</b> מחקר חתך מוצא שבני 20 משתמשים בטלפון הרבה יותר מבני 70. האם זה כי ״צעירים אוהבים טלפונים״, כלומר עניין של גיל? או כי בני ה־70 גדלו בעולם בלי סמארטפונים, כלומר עניין של דור? מחקר חתך לא יכול להפריד ביניהם. הדוגמה בספר: צעירים תומכים יותר בנישואים חד־מיניים, ולא ברור אם זה גיל או דור.</div>

<h3>4. מחקר מתאמי: דברים שהולכים יחד</h3>
<p>עד עכשיו רק תיארנו. השלב הבא הוא לבדוק אם <b>שני משתנים קשורים</b>: כשאחד עולה, האם השני עולה או יורד? לזה קוראים <b>מתאם</b>.</p>
<h4>מקדם המתאם (r)</h4>
<p>המתאם מסוכם במספר אחד, <b>r</b>, שנע בין 1− ל־1+. יש בו שני דברים לקרוא:</p>
<div class="ex"><b>הסימן (+ או −) אומר את הכיוון:</b><br>
<b>חיובי (+):</b> שניהם זזים באותו כיוון. יותר שעות למידה ← ציון גבוה יותר.<br>
<b>שלילי (−):</b> הם זזים בכיוונים הפוכים. יותר היעדרויות מהשיעורים ← ציון נמוך יותר.<br><br>
<b>המספר עצמו (בלי הסימן) אומר את העוצמה:</b><br>
קרוב ל־1 (או ל־1−) = קשר חזק. קרוב ל־0 = כמעט אין קשר.<br>
לכן <span dir="ltr">r = −0.9</span> הוא קשר <b>חזק יותר</b> מ־<span dir="ltr">r = +0.3</span>. הסימן רק אומר לאן.</div>
<div class="ex"><b>דוגמה מהספר:</b> נמצא <span dir="ltr">r = −0.29</span> בין לילות שינה קצרים לבין ציונים. הסימן שלילי: פחות שינה, ציונים נמוכים יותר. המספר 0.29 קטן יחסית, אז מדובר בקשר <b>חלש</b>.<br>
<b>טעות נפוצה:</b> מתאם שלילי <b>הוא</b> קשר. הוא לא אומר ״אין קשר״. ״אין קשר״ זה r קרוב ל־0.</div>
<h4>הכלל הכי חשוב: מתאם לא מוכיח סיבתיות</h4>
<p>זה ששני דברים הולכים יחד <b>לא אומר</b> שאחד גורם לשני. כשרואים מתאם בין A ל־B, יש שלוש אפשרויות:</p>
<div class="ex">① <b>A גורם ל־B.</b><br>② <b>B גורם ל־A</b> (הכיוון הפוך ממה שחשבנו).<br>③ <b>משהו שלישי, C, גורם לשניהם.</b> לזה קוראים <b>משתנה מתערב</b> (או משתנה שלישי).<br><br>
<b>הדוגמה הקלאסית:</b> בימים שבהם מוכרים יותר גלידה יש גם יותר פשיעה. הגלידה לא גורמת לפשע. ה<b>חום</b> גורם לשניהם: בקיץ קונים יותר גלידה, ובקיץ יותר אנשים בחוץ ויש יותר עימותים.</div>
<div class="ex"><b>בשאלה שלנו:</b> נניח שמצאנו שילדים שרואים יותר אלימות בטלוויזיה תוקפניים יותר. שלוש אפשרויות:<br>
① הצפייה באלימות <b>גורמת</b> לתוקפנות.<br>
② ילדים תוקפניים <b>בוחרים</b> לראות תוכניות אלימות.<br>
③ <b>גורם שלישי</b>, למשל הורים שמשגיחים מעט, גורם גם לצפייה בלי הגבלה וגם לתוקפנות.<br>
מחקר מתאמי לא יכול לדעת מי מהן נכונה.</div>
<h4>מתאם מדומה</h4>
<p><b>מתאם מדומה</b> = אנחנו <b>בטוחים</b> שיש קשר, אבל בפועל אין. הוא נוצר בגלל <b>הטיית אישוש</b>: אנחנו זוכרים את המקרים שמתאימים לאמונה שלנו, ושוכחים את אלה שלא.</p>
<div class="ex"><b>מהיומיום:</b> ״בכל פעם שאני שוטף את האוטו, יורד גשם״. אתה זוכר את הפעמים שירד גשם אחרי שטיפה, כי זה עצבן אותך. את עשרות הפעמים שלא ירד, שכחת.<br>
<b>מהספר:</b> הרבה אנשים בטוחים שבירח מלא אנשים מתנהגים ״משוגע״ יותר. כמעט 40 מחקרים בדקו את זה, ולא נמצא קשר.</div>

<h3>5. הניסוי: הדרך היחידה לדעת מה גורם למה</h3>
<p>ראינו שמתאם לא יכול להגיד מה גורם למה, כי תמיד יש הסברים אחרים. הניסוי פותר את זה: החוקר <b>בעצמו משנה</b> דבר אחד ושומר את כל השאר זהה. אם אחרי זה יש הבדל, הוא יכול לנבוע רק מהדבר ששינה.</p>
<h4>איך בונים ניסוי, צעד אחרי צעד (על השאלה שלנו)</h4>
<div class="ex">① <b>בוחרים מדגם אקראי:</b> כל ילד באוכלוסייה מקבל סיכוי שווה להיבחר. ככה המדגם מייצג את כל הילדים, ואפשר להכליל.<br>
② <b>מחלקים באקראי לשתי קבוצות</b>, למשל בהגרלה. ככה אין הבדל קבוע בין הקבוצות: בשתיהן יש בערך אותו מספר ילדים תוקפניים, עייפים או שקטים.<br>
③ <b>קבוצת הניסוי</b> צופה בתוכנית אלימה. <b>קבוצת הביקורת</b> צופה בתוכנית לא אלימה, באותו אורך.<br>
④ <b>מודדים תוקפנות</b> בשתי הקבוצות ומשווים. אם בקבוצת הניסוי יותר תוקפנות, הסיבה היא כנראה התוכנית, כי זה ההבדל היחיד ביניהן.</div>
<h4>משתנה בלתי תלוי ומשתנה תלוי</h4>
<p>שני מונחים שמופיעים כמעט בכל מבחן. הדרך הכי פשוטה לזהות אותם היא לשאול שתי שאלות:</p>
<div class="ex"><b>״מה החוקר שינה בעצמו?״</b> ← זה <b>המשתנה הבלתי תלוי</b>. הוא ״לא תלוי״ במשתתפים, כי החוקר קבע אותו.<br>
<b>״מה החוקר מדד אחרי זה?״</b> ← זה <b>המשתנה התלוי</b>. הוא ״תלוי״ במה שקרה, כי הוא התוצאה.<br><br>
<b>בשאלה שלנו:</b> סוג התוכנית (אלימה או לא) = בלתי תלוי. כמות התוקפנות = תלוי.<br>
<b>דוגמה נוספת:</b> חוקר נותן לחצי מהסטודנטים כוס קפה ולחצי מים, ובודק כמה מילים הם זוכרים. קפה או מים = בלתי תלוי. מספר המילים שנזכרו = תלוי.</div>
<h4>הגדרה אופרציונלית</h4>
<p>״תוקפנות״ זו מילה כללית. כדי למדוד אותה צריך להגדיר <b>בדיוק</b> מה סופרים. זו <b>הגדרה אופרציונלית</b>: תרגום של מושג למשהו שאפשר למדוד במספרים.</p>
<div class="ex"><b>דוגמאות:</b> ״תוקפנות״ = מספר הפעמים שהילד מכה בובה ב־10 דקות. ״ריכוז״ = כמה שאלות פתר נכון ב־5 דקות. ״אושר״ = הציון בשאלון מ־1 עד 10. ההגדרה מאפשרת לחוקרים אחרים לחזור על המחקר בדיוק אותו דבר.</div>
<h4>מדגם אקראי מול חלוקה אקראית</h4>
<p>שני המושגים נשמעים דומים, אבל עושים דברים שונים:</p>
<div class="tw"><table><tr><th></th><th>מדגם אקראי</th><th>חלוקה אקראית</th></tr>
<tr><td><b>מתי</b></td><td>כשבוחרים <b>מי ישתתף</b></td><td>כשמחליטים <b>לאיזו קבוצה</b> כל משתתף ילך</td></tr>
<tr><td><b>למה</b></td><td>כדי שהמדגם ייצג את כולם, ואפשר יהיה <b>להכליל</b></td><td>כדי שהקבוצות יהיו דומות, ואפשר יהיה להסיק <b>סיבתיות</b></td></tr></table></div>
<h4>פלצבו וסמיות</h4>
<p><b>פלצבו:</b> לפעמים עצם הציפייה משנה את ההרגשה. מי שבטוח שקיבל כדור נגד כאב ראש, מרגיש פחות כאב גם אם זה היה כדור סוכר. לכן קבוצת הביקורת מקבלת ״כדור סוכר״ שנראה בדיוק כמו התרופה. כך אם תהיה הטבה רק בקבוצה שקיבלה את התרופה האמיתית, נדע שזו התרופה ולא הציפייה.</p>
<div class="ex"><b>סמיות יחידה:</b> <b>המשתתפים</b> לא יודעים אם קיבלו תרופה או פלצבו. כך הציפייה שלהם לא משפיעה.<br>
<b>סמיות כפולה:</b> גם <b>החוקרים</b> שבודקים את המשתתפים לא יודעים מי קיבל מה. למה זה חשוב? כי חוקר שיודע שילד צפה בתוכנית האלימה עלול ״לראות״ אצלו יותר תוקפנות. זו <b>הטיית הנסיין</b>, וסמיות כפולה מונעת אותה.</div>
<h4>ניסוי־למחצה ומגבלות</h4>
<p>לפעמים אי אפשר לחלק באקראי. אי אפשר להגריל מי יהיה גבר ומי אישה, או מי יגדל בעוני. מחקר שמשווה קבוצות שכבר קיימות נקרא <b>ניסוי־למחצה</b>. בגלל שלא הייתה חלוקה אקראית, הקבוצות יכולות להיות שונות בעוד דברים, ולכן <b>אי אפשר להסיק ממנו סיבתיות</b>. ויש ניסויים שאסור לעשות בכלל מטעמי אתיקה, למשל לגרום לילדים להיות אלימים.</p>

<h3>6. האם אפשר לסמוך על התוצאה?</h3>
<p>אחרי שעשינו מחקר וקיבלנו תוצאה, השאלה הבאה היא אם היא אמיתית או מקרית. יש לזה כמה כלים:</p>
<div class="ex"><b>מובהקות סטטיסטית:</b> תמיד יש סיכוי שההבדל בין הקבוצות יצא במקרה. אם מטילים מטבע 10 פעמים ויוצא 6 פעמים ״עץ״, זה כנראה מזל, לא מטבע מזויף. בפסיכולוגיה תוצאה נחשבת <b>מובהקת</b> כשהסיכוי שהיא מקרית <b>קטן מ־5%</b>.</div>
<ul>
<li><b>ביקורת עמיתים:</b> לפני שמאמר מתפרסם, חוקרים אחרים בתחום קוראים אותו ובודקים שהשיטה והמסקנות תקינות.</li>
<li><b>שחזור:</b> חוקרים אחרים חוזרים על אותו מחקר. אם התוצאה יוצאת שוב, אפשר לסמוך עליה יותר. אם היא לא חוזרת, יש בעיה. בשנים האחרונות התברר שהרבה ממצאים לא חזרו, ולזה קוראים ״<b>משבר השחזור</b>״.</li>
</ul>
<div class="ex"><b>למה זה חשוב, מהספר:</b> מחקר שטען שחיסונים גורמים לאוטיזם נמצא שגוי ונמשך מהפרסום. אבל אנשים כבר האמינו בו והפסיקו לחסן, ובשנת 2019 היו בארצות הברית מעל 1,000 מקרי חצבת. מחקר גרוע יכול להזיק גם אחרי שמבטלים אותו.</div>
<h4>מהימנות ותוקף</h4>
<p>שתי שאלות על כלי המדידה עצמו, למשל שאלון או מבחן:</p>
<div class="ex"><b>מהימנות = האם הכלי עקבי?</b> אם מודדים פעמיים, מקבלים אותה תוצאה?<br>
<b>תוקף = האם הכלי מודד את מה שהוא אמור למדוד?</b><br><br>
<b>דוגמה:</b> משקל ביתי שתמיד מראה 2 ק״ג יותר מהמשקל האמיתי. הוא <b>מהימן</b>, כי כל פעמיים שתעלה עליו הוא יראה אותו מספר. אבל הוא <b>לא תקף</b>, כי המספר לא נכון.<br>
<b>דוגמה נוספת:</b> מבחן אינטליגנציה שבודק בעצם כמה מהר אתה מקליד. אולי הוא יוצא אותו דבר כל פעם (מהימן), אבל הוא לא מודד אינטליגנציה (לא תקף).<br><br>
<b>הכלל:</b> כלי <b>תקף</b> חייב להיות גם <b>מהימן</b>, כי אי אפשר למדוד נכון אם התוצאה קופצת כל פעם. אבל כלי מהימן לא בהכרח תקף.</div>

<h3>7. אתיקה: לחקור בלי לפגוע</h3>
<p>החלק האחרון מזכיר שמחקר נעשה על בני אדם ובעלי חיים, ויש כללים שמגינים עליהם.</p>
<ul>
<li><b>ועדת אתיקה (IRB):</b> כל מחקר בבני אדם צריך אישור מראש מוועדה שבודקת שהוא לא מזיק.</li>
<li><b>הסכמה מדעת:</b> לפני שמתחילים, המשתתף מקבל הסבר: מה יקרה, מה הסיכונים, שההשתתפות מרצון, שאפשר להפסיק בכל רגע, ושהמידע שלו יישאר סודי. רק אחרי שהבין, הוא חותם. מתחת לגיל 18 ההורה חותם.</li>
<li><b>הטעיה ותחקיר:</b> לפעמים אי אפשר לספר מראש את מטרת המחקר, כי זה ישנה את ההתנהגות. מותר להטעות רק אם זה לא מזיק, ובסוף חובה לעשות <b>תחקיר</b>: להסביר למשתתף מה באמת נבדק ולמה.</li>
</ul>
<div class="ex"><b>דוגמה להטעיה ותחקיר:</b> אומרים למשתתפים שהם בודקים ״טעם של עוגיות״, אבל בעצם בודקים אם הם אוכלים יותר כשהם לבד. בסוף מסבירים להם מה נבדק באמת.</div>
<div class="ex"><b>מחקר טסקיגי (1932–1972): הדוגמה למה כל זה נחוץ.</b> כ־600 גברים שחורים ועניים בארצות הברית השתתפו במחקר על מחלת העגבת. לחולים לא אמרו שהם חולים. כשבשנות ה־40 התגלה שפניצילין מרפא את המחלה, לא נתנו להם אותו, כדי לראות איך המחלה מתפתחת. המחקר הופסק רק אחרי שעיתונאים חשפו אותו, ובעקבותיו נחקק חוק שמחייב ועדות אתיקה.<br>
<b>שימו לב:</b> זה היה <b>ניסוי־למחצה</b>, כי לא הייתה חלוקה אקראית. החולים היו חולים כבר לפני המחקר.</div>
<ul>
<li><b>בעלי חיים:</b> בערך 90% מהם מכרסמים וציפורים. חובה לצמצם כאב, וועדה מיוחדת (<b>IACUC</b>) מאשרת את המחקר ומבקרת במעבדה פעמיים בשנה.</li>
<li><b>בשאלה שלנו:</b> ההורים חותמים על הסכמה, כל ילד יכול להפסיק מתי שירצה, והוועדה בודקת שהצפייה לא תזיק לו.</li>
</ul>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הסיפור של הפרק בחמישה משפטים:</b><br>
1. תחושת בטן מטעה, ולכן פסיכולוגים בודקים רעיונות מול ראיות, עם השערה שאפשר להפריך.<br>
2. שיטות <b>תיאוריות</b> (חקר מקרה, תצפית, סקר, ארכיון) אומרות <b>מה קורה</b>, אבל לא למה.<br>
3. מחקר <b>מתאמי</b> אומר ששני דברים <b>הולכים יחד</b>, אבל לא מי גורם למה, כי תמיד ייתכן כיוון הפוך או משתנה שלישי.<br>
4. רק <b>ניסוי</b>, עם חלוקה אקראית לקבוצות, יכול להראות ש<b>דבר אחד גורם לאחר</b>.<br>
5. אחרי המחקר בודקים אם אפשר לסמוך על התוצאה (מובהקות, שחזור, מהימנות ותוקף), וכל זה נעשה לפי כללי אתיקה.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לקבל תיאור של מחקר ולזהות איזו שיטה זו (חקר מקרה, תצפית, סקר, מתאם, ניסוי).<br>
• לזהות משתנה <b>בלתי תלוי</b> (מה שינו) ו<b>תלוי</b> (מה מדדו).<br>
• לקרוא מקדם מתאם: כיוון לפי הסימן, עוצמה לפי המספר.<br>
• להסביר למה מתאם לא מוכיח סיבתיות, ולתת משתנה שלישי אפשרי.<br>
• להבדיל בין מדגם אקראי לחלוקה אקראית, בין מחקר אורך לחתך, ובין מהימנות לתוקף.<br>
• להכיר את כללי האתיקה ואת טסקיגי.</div>

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
