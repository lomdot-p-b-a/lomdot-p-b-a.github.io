<head>

<title>לומדת חובת קריאה: Sleep deprivation induces fragmented memory loss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"השאלה: מה חסך שינה עושה לשכחה",blocks:[
  {h:"התקציר",html:`${def("על מה הנושא",`ידוע שחסך שינה גורם לשכוח יותר. המאמר שואל שאלה חדשה: האם הוא משנה גם את <b>סוג</b> השכחה?<br><b>מה נלמד כאן:</b> התקציר · מאיה · למה שינה מגינה על זיכרון`)}<p>ידוע שחסך שינה מגביר שכחה של זיכרונות אירועים <b>(אפיזודיים)</b>. אבל לא היה ידוע אם חסך שינה ארוך משנה גם את <b>האופי</b> של השכחה. החוקרים השוו שלושה מצבים: לילה של שינה, יום של ערות, ולילה <b>בלי שינה</b>.</p>${tiles([["moon","שינה","שוכחים הכי מעט","כשישנים אחרי הלמידה, שוכחים הכי מעט, כי בזמן השינה אין מידע חדש שמפריע.","מאיה למדה בערב וישנה לילה שלם, ובבוקר זכרה את רוב המושגים."],["clock","יום ער","שוכחים יותר <b>פריטים</b>"],["x","לילה בלי שינה","שוכחים יותר פריטים, <b>וגם</b> הקשרים ביניהם נקטעים","בלי שינה לא רק שוכחים יותר פריטים, אלא גם הקשרים בין הפרטים נקטעים: זוכרים את המושג, אבל לא למה הוא שייך.","אחרי לילה לבן, מאיה זוכרת את המושג ״גיזום״, אבל לא זוכרת באיזה פרק הוא הופיע."]])}${def("בשורה התחתונה",`גם ערות וגם חסך שינה הגבירו את שכחת ה<b>פריטים</b>. רק חסך שינה בלילה גרם בנוסף ל<b>פיצול</b>: זוכרים פרט, אבל לא את מה שהיה קשור אליו.`)}`,q:"q1"},
  {h:"מאיה והלילה הלבן",html:`${ex("מאיה לומדת למבחן בערב, ומחליטה לא לישון בכלל. בבוקר היא זוכרת ש״היה מושג בשם <b>גיזום</b>״, אבל לא זוכרת באיזה פרק הוא היה או למה הוא קשור. זה בדיוק ״זיכרון מפוצל״: הפריט שרד, הקשר נעלם.")}<p>נחזור למאיה לאורך הלומדה, כדי להבין מה בדיוק קרה לזיכרון שלה, ולמה זה שונה ממה שהיה קורה אילו פשוט הייתה ערה במשך יום רגיל.</p>${rem("השאלה של המחקר היא לא רק <b>כמה</b> שוכחים בלי שינה, אלא <b>איך</b> שוכחים: האם הזיכרון נעלם כולו, או מתפרק לחלקים?")}`,q:"q2"},
  {h:"למה שינה מגינה על זיכרון",html:`${def("הפרעה רטרואקטיבית",`${E("Retroactive interference")} מה שקורה <b>אחרי</b> שלמדנו (מידע חדש, פעילות) מפריע לזיכרון החדש ומגביר שכחה (Wixted, 2004).`)}<p>שינה מפחיתה שכחה לעומת ערות, כנראה כי בזמן השינה אין מידע חדש שמתחרה בזיכרון. כלומר השינה <b>מגינה</b> על הזיכרון מהפרעה.</p>${def("הפרעה פרואקטיבית",`${E("Proactive interference")} מה שקרה <b>לפני</b> הלמידה מפריע לזיכרון החדש (Underwood, 1957).`)}${ex("מאיה הייתה ערה כל היום לפני שלמדה, וגם כל הלילה אחרי. לכן אצלה פעלו <b>שני</b> סוגי ההפרעה: מה שהיה לפני (פרואקטיבית) ומה שבא אחרי (רטרואקטיבית).")}`,q:"q3"}
 ]},
 {id:"t2",icon:"link",title:"שכחת פריט מול פיצול",blocks:[
  {h:"זיכרון אירוע הוא רשת של קשרים",html:`${def("על מה הנושא",`זיכרון של אירוע הוא לא פרט אחד, אלא כמה פרטים שקשורים זה לזה. הנושא מסביר מה זה ״פיצול״.<br><b>מה נלמד כאן:</b> זיכרון אפיזודי · ג׳ונסן 2019 · ההשערה`)}<p>כדי להיזכר באירוע צריך את ה<b>קשרים</b> בין הפרטים שלו (Tulving, 1985): איפה זה קרה, מי היה שם, מה היה שם. רוב מחקרי חסך השינה בדקו רק <b>פריט בודד</b>, ולא את הקשרים.</p>${def("ג׳ונסן ועמיתים (2019)",`בדקו אירועים עם מקום, אדם וחפץ. אחרי ערות שכחו יותר מאחרי שינה. אבל השכחה הייתה <b>״הכל או כלום״</b>: אם זכרו פרט אחד מהאירוע, היה סיכוי גבוה שיזכרו גם את האחרים. כלומר הערות הגבירה שכחה, אבל <b>לא פיצלה</b> את מה ששרד.`)}`,q:"q5"},
  {h:"שני סוגי שכחה",html:`<p>המאמר מבחין בין שני סוגים של שכחה:</p>${fig("frag35")}${tiles([["x","שכחת פריט","לא זוכרים שהמילה בכלל הופיעה. מאיה לא זוכרת את המושג","לא זוכרים בכלל שהמילה הופיעה. זה שונה מ״פיצול״, שבו זוכרים את הפריט, אבל לא את מה שהיה קשור אליו.","מאיה רואה במבחן את המושג ״סינפסה״, ובכלל לא זוכרת שלמדה אותו."],["link","פיצול (שכחה אסוציאטיבית)","זוכרים את הפריט, אבל לא את מה שהיה קשור אליו. מאיה זוכרת את המושג, לא את הפרק","בלי שינה, הזיכרון ״מתפרק״: זוכרים את הפרט עצמו, אבל לא את ההקשר שלו.","מאיה זוכרת את המושג מהמבחן, אבל לא זוכרת מאיזה פרק הוא."]])}${def("ההשערה",`חסך שינה בלילה יגביר <b>גם</b> את שכחת הפריטים <b>וגם</b> את הפיצול, לעומת שינה ולעומת ערות ביום.`)}`,q:"q7"},
  {h:"ומה עם רגש?",html:`<p>מחקרים קודמים מצאו שזיכרונות <b>רגשיים שליליים</b> עמידים יותר לחסך שינה (Sterpenich, 2007; Vargas, 2019). לכן החוקרים שילבו גם <b>תמונות שליליות</b> וגם <b>ניטרליות</b>, כדי לבדוק אם הרגש מגן מפני פיצול.</p>${rem("שימו לב: הרגש היה רק ב<b>תמונות</b>. המילים עצמן היו ניטרליות.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"people",title:"השיטה: שני ניסויים",blocks:[
  {h:"המשתתפים והמערך",html:`${def("על מה הנושא",`איך בנו את המחקר: שני ניסויים, ובכל אחד כל משתתף עבר את שני התנאים.<br><b>מה נלמד כאן:</b> משתתפים · מערך תוך־נבדקי · ציר הזמן`)}${tiles([["people","ניסוי 1: שינה מול ערות","27 מבוגרים בריאים (10 גברים), גיל ממוצע כ־21"],["moon","ניסוי 2: שינה מול חסך שינה","28 מבוגרים בריאים (4 גברים), גיל ממוצע כ־19"]])}${def("מערך תוך־נבדקי",`${E("Within-subjects")} כל משתתף עבר את <b>שני</b> התנאים, בהפרש של שבוע, והסדר הוחלף בין משתתפים. כך כל אחד הוא הביקורת של עצמו.`)}`,q:"q11"},
  {h:"ציר הזמן",html:`${fig("timeline35")}<ul><li><b>T1</b>: מבחן מיד אחרי הלמידה.</li><li><b>T2</b>: אחרי כ־12 שעות. בניסוי 2 תמיד בבוקר, אחרי לילה של שינה או לילה בלי שינה.</li><li><b>T3</b>: יומיים אחרי T2, אחרי שכולם כבר ישנו כדי להתאושש.</li></ul>${ex("קבוצת החסך בניסוי 2 היא מאיה: קמה ב־08:00, הייתה ערה כל היום (וידאו את זה בשעון יד שמודד תנועה, <b>אקטיגרפיה</b>), למדה ב־20:00, ונשארה ערה כל הלילה תחת השגחה, עם משחקים, סרטים וספרים. ב־T2 היא כבר ערה כ־24 שעות.")}`,q:"q13"},
  {h:"איך וידאו שינה וערנות",html:`${tiles([["brain","פוליסומנוגרפיה","בלילה של השינה בניסוי 2 מדדו במעבדה פעילות מוח (EEG), תנועות עיניים ושרירים, וחילקו את השינה לשלבים. ממוצע: כ־7 שעות","מדידה מלאה של השינה במעבדה: פעילות המוח, תנועות העיניים והשרירים. כך יודעים בדיוק כמה ישנו ובאילו שלבים.","בלילה של השינה, מאיה ישנה במעבדה עם חיישנים על הראש, והחוקרים ראו מתי היא בשינה עמוקה ומתי בחלום."],["clock","ניסוי 1","שינה בבית, לפי דיווח עצמי (כ־7.8 שעות). ביום הערות: בלי תנומות, קפאין ואלכוהול","בניסוי הראשון ישנו בבית, ומשך השינה נמדד לפי מה שדיווחו. ביום הערות היה אסור לישון תנומות, לשתות קפה או אלכוהול, כדי שהערות תהיה ״נקייה״.","בתנאי היום, מאיה למדה בבוקר ונשארה ערה עד הערב, בלי קפה ובלי תנומה."],["chart","ערנות","סולם ישנוניות של סטנפורד (SSS) ומבחן ערנות פסיכומוטורי (PVT) בכל מבחן","בכל מבחן מדדו גם כמה המשתתפים ישנוניים וכמה הם ערניים, כדי לבדוק אם העייפות היא שמסבירה את השכחה.","לפני כל מבחן מאיה דירגה כמה היא עייפה, ולחצה על כפתור בכל פעם שהופיע אור על המסך."]])}${rem("בניסוי 2, ב־T2 קבוצת החסך הייתה <b>ישנונית יותר</b> וביצעה גרוע יותר במבחן הערנות. זה חשוב כשנפרש את התוצאות.")}`,q:"q15"}
 ]},
 {id:"t4",icon:"flask",title:"המשימות והמדדים",blocks:[
  {h:"הלמידה",html:`${def("על מה הנושא",`מה המשתתפים למדו, איך בדקו אותם, ואיך חישבו את שני סוגי השכחה.<br><b>מה נלמד כאן:</b> הגירויים · הלמידה · המבחן · שני המדדים`)}<p>המשתתפים ראו <b>120 זוגות</b>: <b>מילת תואר</b> באנגלית מעל <b>תמונה</b>. חצי מהתמונות היו <b>אובייקטים</b> וחצי <b>נופים</b>, וחצי מהתמונות היו <b>שליליות</b> וחצי <b>ניטרליות</b>. המילים כולן ניטרליות.</p>${ex("על המסך: המילה <b>soft</b> מעל תמונה של כרית (אובייקט). המשתתף מדמיין את השילוב, מחליט אם הוא ״מציאותי״ או ״מוזר״, ואז מסווג את התמונה: אובייקט או נוף.")}${rem("הסיווג היה מדויק מאוד (כ־97%) ובלי הבדל בין התנאים. כלומר כולם למדו באותה רמה.")}`,q:"q17"},
  {h:"המבחן",html:`<p>במבחן הופיעו המילים <b>בלי התמונות</b>, יחד עם מילים חדשות שלא נלמדו. על כל מילה עונים:</p>${tiles([["check","\"ישן\"","ראיתי את המילה. אז ממשיכים: האם היא הייתה עם <b>אובייקט</b> או עם <b>נוף</b>? ומתארים בקצרה"],["x","\"חדש\"","לא ראיתי. הניסיון נגמר"],["question","\"?\"","לא יודע. הניסיון נגמר"]])}${rem("כיוון שהותר לענות ״?״, אי אפשר היה לחשב מדד רגישות (d′) רגיל.")}`,q:"q19"},
  {h:"שני המדדים",html:`${def("אובדן פריטים",`מתוך המילים שזוהו נכון ב־T1, כמה <b>לא</b> זוהו נכון במבחן המאוחר (טעות או ״?״).`)}${def("ציון פיצול",`מתוך המילים שזוהו נכון <b>גם</b> ב־T1 <b>וגם</b> במבחן המאוחר, וש־ב־T1 גם סוג התמונה נזכר נכון: כמה פעמים סוג התמונה <b>נשכח</b> במבחן המאוחר.`)}${ex("ב־T1 מאיה זכרה ש־soft היה עם אובייקט. בבוקר היא עדיין זוכרת את המילה soft, אבל עונה ״?״ על סוג התמונה. זו נקודה בציון ה<b>פיצול</b>. אילו שכחה את soft עצמה, זו הייתה נקודה ב<b>אובדן פריטים</b>.")}`,q:"q21"}
 ]},
 {id:"t5",icon:"chart",title:"הממצאים",blocks:[
  {h:"שכחת פריטים",html:`${def("על מה הנושא",`מה נמצא, בשני הניסויים ובשלוש נקודות הזמן.<br><b>מה נלמד כאן:</b> פריטים · פיצול · רגש · יומיים אחרי`)}${tiles([["clock","ניסוי 1","אחרי <b>ערות</b> שכחו יותר פריטים מאחרי שינה (כ־21% מול כ־17%)","בניסוי הראשון, מי שנשאר ער שכח יותר פריטים ממי שישן. ההבדל קטן יחסית.","מאיה שכחה קצת יותר מושגים אחרי יום ער מאשר אחרי לילה של שינה."],["x","ניסוי 2","אחרי <b>חסך שינה</b> שכחו יותר פריטים מאחרי שינה (כ־27% מול כ־18%), עלייה של כ־50%","בניסוי השני, אחרי לילה בלי שינה שכחו יותר פריטים מאחרי שינה, בערך פי 1.5. זה הבדל גדול.","מאיה שכחה כמעט פי אחד וחצי יותר מושגים אחרי הלילה הלבן."]])}${rem("כלומר <b>שני</b> סוגי הערות הגבירו שכחת פריטים. ההבדל בין הניסויים הוא בפיצול.")}`,q:"q23"},
  {h:"פיצול",html:`${yn(["חסך שינה (ניסוי 2) הגביר פיצול לעומת שינה"],["ערות ביום (ניסוי 1) לא הגבירה פיצול"])}${def("רגש",`בניסוי 2, תמונות <b>שליליות</b> פוצלו <b>יותר</b> מניטרליות באופן כללי. אבל הרגש <b>לא שינה</b> את השפעת חסך השינה: לא נמצאה אינטראקציה.`)}${ex("זה ההבדל בין מאיה, שלא ישנה כל הלילה, לבין חברה שלמדה בבוקר והייתה ערה כל היום: שתיהן שכחו מושגים, אבל רק אצל מאיה המושגים שנשארו ״התנתקו״ מההקשר שלהם.")}`,q:"q25"},
  {h:"יומיים אחרי, ושלבי שינה",html:`<ul><li><b>T1 ← T3:</b> גם אחרי שכולם ישנו להתאושש, ההבדלים של חסך השינה נשארו, גם בפריטים וגם בפיצול. לכן הם <b>לא</b> רק תוצאה של עייפות ברגע המבחן.</li><li><b>T2 ← T3:</b> לא נמצא שינוי נוסף בפיצול.</li><li><b>T1 (בסיס):</b> לא היו הבדלים בין התנאים בלמידה.</li><li><b>שלבי שינה:</b> לא נמצא קשר בין זמן בשלב שינה כלשהו (גם לא שינה עמוקה, N3) לבין השכחה.</li></ul>${rem("התאוששות בשינה אחרי לילה לבן <b>לא</b> מחזירה את מה שאבד.")}`,q:"q27"}
 ]},
 {id:"t6",icon:"bulb",title:"דיון ומגבלות",blocks:[
  {h:"איך מסבירים",html:`${def("על מה הנושא",`למה רק חסך שינה מפצל זיכרונות, ומה המגבלות.<br><b>מה נלמד כאן:</b> הפרעה כפולה · הומיאוסטזיס סינפטי · רגש · מגבלות`)}${tiles([["split","הפרעה כפולה","בחסך שינה הלמידה ״מוקפת״ בערות: לפניה ואחריה. כלומר פועלות הפרעה <b>פרואקטיבית ורטרואקטיבית</b>. ביום ער פעלה רק הרטרואקטיבית","בלילה לבן הלמידה ״מוקפת״ בערות משני הצדדים: מה שקרה לפני מפריע לזכור את החדש, ומה שקורה אחרי מפריע גם הוא. ביום ער, רק מה שבא אחרי הפריע.","מאיה הייתה ערה כל היום לפני הלמידה וכל הלילה אחריה, ולכן קיבלה הפרעה מכל הכיוונים."],["brain","הומיאוסטזיס סינפטי","בערות הסינפסות מתחזקות, ושינה (בעיקר N3) ״מאפסת״ אותן (Tononi & Cirelli). בלי שינה, עודף חיזוק יחד עם הפרעה אולי מפרק את הקשרים","לפי הרעיון, בזמן הערות הסינפסות מתחזקות כל הזמן. השינה, בעיקר השינה העמוקה, מחלישה אותן בחזרה, כדי שיהיה מקום ללמידה חדשה.","אחרי יום ארוך של לימודים, השינה של מאיה ״מנקה״ את המוח, כך שלמחרת היא יכולה ללמוד שוב."]])}${rem("ההסבר השני הוא <b>השערה בלבד</b>: הזמן בשלב N3 לא היה קשור לביצוע.")}`,q:"q29"},
  {h:"רגש, מגבלות ומשמעות",html:`<p><b>רגש:</b> בניגוד למחקרים קודמים, הרגש לא הגן מפני ההשפעה של חסך השינה. החוקרים מציעים שה<b>קשר</b> לתוכן רגשי פגיע יותר מהתוכן הרגשי עצמו. תמונות שליליות פוצלו יותר באופן כללי, בדומה לממצאים של ביסבי שרגש שלילי פוגע בשלמות הזיכרון.</p>${tiles([["x","מגבלה 1","המילים היו ניטרליות, ולכן אי אפשר לבדוק רגש בפריט עצמו"],["x","מגבלה 2","עייפות ולחץ ב־T2 יכלו לתרום, אבל תוצאות T3 מראות שזה לא כל ההסבר"],["x","מגבלה 3","ייתכן שגם לחץ בזמן האיחוד תרם לפיצול שנשאר"]])}${ex("המסקנה המעשית למאיה: לילה לבן לפני מבחן לא רק גורם לשכוח יותר. הוא גורם לזכור פרטים <b>מנותקים</b>, בלי ההקשר שצריך כדי לענות על שאלה.")}`,q:"q31"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מה החידוש העיקרי בשאלה של המחקר?","a":"האם חסך שינה משנה את סוג השכחה","w":["האם חסך שינה מגביר את כמות השכחה הכללית","האם שינה בבית טובה כמו שינה במעבדה","האם אנשים צעירים שוכחים פחות מאנשים מבוגרים"],"e":"שחסך שינה מגביר שכחה כבר היה ידוע. החידוש הוא השאלה אם הוא משנה את האופי של השכחה: האם הזיכרון מתפרק."},{"q":"לפי התקציר, מה גרם רק חסך שינה בלילה, ולא ערות ביום?","a":"פיצול של הקשרים בין פרטים","w":["שכחה של יותר פריטים בודדים","ירידה בדיוק הסיווג בזמן הלמידה","שיפור בזיכרון של תמונות שליליות"],"e":"גם ערות ביום וגם חסך שינה הגבירו שכחת פריטים. רק חסך שינה גרם בנוסף לפיצול."}]},"q2":{"t":"t1","v":[{"q":"מאיה זוכרת בבוקר את המושג, אבל לא את ההקשר שבו הוא הופיע. איך המאמר יקרא לזה?","a":"זיכרון מפוצל","w":["שכחת פריט","הפרעה פרואקטיבית בלבד","זיכרון שלם"],"e":"הפריט שרד אבל הקשר שלו נשכח. זה בדיוק מה שהמאמר מכנה פיצול."},{"q":"מה ההבדל בין ״כמה שוכחים״ לבין ״איך שוכחים״ במחקר?","a":"האם הזיכרון נעלם כולו או מתפרק לחלקים","w":["האם שוכחים מהר או לאט לאורך היום ובלילה","האם שוכחים יותר מילים או יותר תמונות","האם שוכחים בבית או במעבדה"],"e":"״איך״ מתייחס לאופי השכחה: הכל או כלום, לעומת פרט ששרד בלי הקשר שלו."}]},"q3":{"t":"t1","v":[{"q":"מהי הפרעה רטרואקטיבית?","a":"מה שקורה אחרי הלמידה מפריע לזיכרון","w":["מה שקרה לפני הלמידה מפריע לזיכרון החדש","שינה עמוקה שמוחקת זיכרונות חדשים מהיום","קושי ללמוד כשעייפים מאוד"],"e":"רטרו = אחורה: מידע חדש שמגיע אחרי הלמידה מפריע לזיכרון שכבר נלמד. ההפרעה מהעבר נקראת פרואקטיבית."},{"q":"לפי המאמר, למה שינה מפחיתה שכחה לעומת ערות?","a":"אין בה מידע חדש שמתחרה בזיכרון","w":["בשינה לומדים מחדש את כל המידע","בשינה המוח מפסיק לגמרי לעבוד","בשינה רמת הלחץ עולה ומחזקת זיכרון"],"e":"ההסבר המרכזי: שינה מגינה מפני הפרעה רטרואקטיבית, כי בזמנה לא נקלט מידע חדש."}]},"q4":{"t":"t1","v":[{"q":"מאיה הייתה ערה כל היום לפני הלמידה וכל הלילה אחריה. אילו הפרעות פעלו עליה?","a":"גם פרואקטיבית וגם רטרואקטיבית","w":["רק רטרואקטיבית, כי הלמידה הייתה בערב","רק פרואקטיבית","אף אחת מהן, כי היא למדה בערב ולא בבוקר"],"e":"ערות לפני הלמידה יוצרת הפרעה פרואקטיבית, וערות אחריה יוצרת הפרעה רטרואקטיבית."}]},"q5":{"t":"t2","v":[{"q":"מה מצאו ג׳ונסן ועמיתים (2019) על שכחה אחרי ערות?","a":"השכחה הייתה ״הכל או כלום״","w":["הזיכרונות שנשארו היו מפוצלים","ערות לא הגבירה שכחה בכלל","רק פרטי המקום נשכחו"],"e":"אחרי ערות שכחו יותר, אבל אם זכרו פרט אחד מהאירוע, זכרו בדרך כלל גם את האחרים. כלומר בלי פיצול."},{"q":"למה כדי להיזכר באירוע צריך יותר מפריט בודד?","a":"כי צריך את הקשרים בין פרטי האירוע","w":["כי פריט בודד נשמר רק בזיכרון עבודה","כי רוב האירועים כוללים רק פריט אחד","כי פריטים בודדים נשכחים תמיד בשינה"],"e":"לפי טולווינג, זיכרון אפיזודי נשען על הקשרים בין הפרטים: מקום, אדם, חפץ."}]},"q6":{"t":"t2","v":[{"q":"מה היה חסר ברוב המחקרים הקודמים על חסך שינה?","a":"בדיקה של הקשרים, ולא רק של פריט","w":["השוואה בין לילה של שינה לבין יום של ערות","בדיקה של זיכרון מילולי","משתתפים מבוגרים ובריאים"],"e":"רוב המחקרים בדקו פריט בודד, ולכן לא יכלו לראות אם הזיכרון מתפרק."}]},"q7":{"t":"t2","v":[{"q":"מה ההגדרה של פיצול במאמר?","a":"זוכרים את הפריט אבל לא את מה שהיה קשור אליו","w":["לא זוכרים שהפריט בכלל הופיע בזמן הלמידה","זוכרים פריט שלא הופיע בלמידה בכלל, בטעות","זוכרים את התמונה אבל לא את המילה"],"e":"פיצול = הפריט שרד, הקשר נשכח. שכחה של הפריט עצמו היא שכחת פריט."},{"q":"מה הייתה ההשערה של החוקרים?","a":"חסך שינה יגביר גם שכחת פריטים וגם פיצול","w":["חסך שינה יגביר רק שכחת פריטים, בלי שום פיצול","ערות ביום תגביר פיצול יותר מחסך שינה","שינה תגביר פיצול לעומת ערות"],"e":"החוקרים צפו שחסך שינה בלילה יגביר את שני סוגי השכחה, לעומת שינה ולעומת ערות ביום."}]},"q8":{"t":"t2","v":[{"q":"מאיה שכחה לגמרי שהמושג ״גיזום״ הופיע בחומר. איזה סוג שכחה זה?","a":"שכחת פריט","w":["פיצול","הפרעה פרואקטיבית","זיכרון רגשי"],"e":"אם הפריט עצמו נעלם, זו שכחת פריט. פיצול הוא כשהפריט נשאר והקשר שלו נעלם."}]},"q9":{"t":"t2","v":[{"q":"למה החוקרים שילבו תמונות שליליות?","a":"כדי לבדוק אם רגש מגן מפני הפיצול","w":["כדי שהמשתתפים יישארו ערניים במהלך הלילה","כדי להקשות על משימת הסיווג","כדי לבדוק אם המילים עצמן שליליות או ניטרליות"],"e":"מחקרים קודמים מצאו שרגש שלילי עמיד לחסך שינה, ולכן רצו לבדוק אם הוא מגן גם מפני פיצול."},{"q":"מה היה רגשי בגירויים של המחקר?","a":"רק התמונות","w":["רק המילים","גם המילים וגם התמונות","אף אחד מהם"],"e":"המילים היו כולן ניטרליות. חצי מהתמונות היו שליליות וחצי ניטרליות."}]},"q10":{"t":"t2","v":[{"q":"מה מחקרים קודמים טענו על זיכרונות רגשיים שליליים וחסך שינה?","a":"הם עמידים יותר לחסך שינה","w":["הם נמחקים ראשונים בחסך שינה","הם לא מושפעים משינה בכלל","הם נשמרים רק בשנת חלום"],"e":"שטרפניך (2007) וורגס (2019) מצאו שרגש שלילי יכול לקזז חלק מהשפעת חסך השינה על שכחת פריטים."}]},"q11":{"t":"t3","v":[{"q":"מה היה המערך בכל אחד מהניסויים?","a":"תוך־נבדקי, כל משתתף עבר את שני התנאים","w":["בין־נבדקי: כל משתתף עבר רק תנאי אחד מהשניים","מתאמי, בלי תנאים בכלל","תצפית בבית בלבד, בלי מעבדה"],"e":"כל משתתף עבר את שני התנאים בהפרש של שבוע, וסדר התנאים הוחלף בין המשתתפים."},{"q":"מה השוו בניסוי 2?","a":"לילה של שינה מול לילה בלי שינה","w":["לילה של שינה מול יום שלם של ערות רגילה","יום של ערות מול לילה בלי שינה","שינה בבית מול שינה במעבדה"],"e":"ניסוי 1 השווה שינה לערות ביום. ניסוי 2 השווה שינה לחסך שינה בלילה."}]},"q12":{"t":"t3","v":[{"q":"כמה משתתפים היו בכל ניסוי?","a":"27 בניסוי 1 ו־28 בניסוי 2","w":["51 בכל אחד מהניסויים","120 בסך הכל, ב־4 קבוצות","14 בכל אחת מארבע הקבוצות"],"e":"27 בניסוי הראשון ו־28 בשני. ה־51 היו מדגם נפרד שדירג את התמונות."}]},"q13":{"t":"t3","v":[{"q":"מתי נערך מבחן T2 בניסוי 2?","a":"תמיד בבוקר, אחרי שינה או לילה בלי שינה","w":["תמיד בערב, אחרי יום שלם של ערות","מיד אחרי הלמידה, באותו ערב בדיוק","יומיים אחרי הלמידה"],"e":"בניסוי 2 הלמידה הייתה בערב ו־T2 בבוקר שאחריו. T3 היה יומיים אחר כך."},{"q":"איך וידאו שקבוצת החסך באמת הייתה ערה כל היום לפני הלמידה?","a":"בשעון יד שמודד תנועה (אקטיגרפיה)","w":["בפוליסומנוגרפיה מלאה במעבדת השינה","בשאלון שמילאו בעצמם בבוקר","בבדיקת קפאין בדם"],"e":"במהלך היום ענדו שעון אקטיגרפיה. בלילה נשארו ערים תחת השגחה."}]},"q14":{"t":"t3","v":[{"q":"מה היה מבחן T3?","a":"מבחן יומיים אחרי T2, אחרי שינת התאוששות","w":["מבחן מ const SUM=`<h2>סיכום: חסך שינה גורם לאובדן זיכרון ״מפוצל״ (Ashton et al., 2020)</h2>
<div class="key"><b>על מה מדובר?</b> כבר ידוע שבלי שינה שוכחים יותר. המחקר שואל שאלה אחרת: האם חסך שינה משנה גם את <b>סוג</b> השכחה? הוא השווה שלושה מצבים: לילה של <b>שינה</b>, יום של <b>ערות</b>, ולילה <b>בלי שינה</b>. התוצאה: גם ערות ביום וגם חסך שינה גרמו לשכוח יותר <b>פריטים</b>. אבל רק חסך שינה גרם בנוסף ל<b>פיצול</b>: אנשים זכרו פריט, אבל לא את מה שהיה קשור אליו. וההבדלים נשארו גם יומיים אחרי, אחרי שכולם כבר ישנו.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>הפרעה רטרואקטיבית</b></td><td>מה שקורה אחרי הלמידה מפריע לזיכרון.</td></tr>
<tr><td><b>הפרעה פרואקטיבית</b></td><td>מה שקרה לפני הלמידה מפריע לזיכרון החדש.</td></tr>
<tr><td><b>שכחת פריט</b></td><td>לא זוכרים שהפריט בכלל הופיע.</td></tr>
<tr><td><b>פיצול</b></td><td>זוכרים את הפריט, אבל לא את מה שהיה קשור אליו.</td></tr>
<tr><td><b>מערך תוך־נבדקי</b></td><td>כל משתתף עובר את כל התנאים, ומשמש ביקורת של עצמו.</td></tr>
<tr><td><b>הומיאוסטזיס סינפטי</b></td><td>הרעיון ששינה מחזירה לאיזון סינפסות שהתחזקו בערות.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: מאיה והלילה הלבן</h3>
<p>מאיה לומדת למבחן בערב ומחליטה לא לישון בכלל. בבוקר היא זוכרת שהיה מושג בשם ״גיזום״, אבל לא זוכרת באיזה פרק הוא היה ולמה הוא קשור. נעקוב אחריה כדי להבין מה המחקר מצא, ולמה זה שונה ממה שהיה קורה לחברה שלה שלמדה בבוקר והייתה ערה כל היום.</p>

<h3>1. הרקע: למה שינה מגינה על זיכרון</h3>
<ul>
<li><b>הפרעה רטרואקטיבית</b> = מה שקורה <b>אחרי</b> הלמידה (מידע חדש, פעילות) מפריע לזיכרון. שינה מפחיתה שכחה כנראה כי בזמנה אין מידע חדש שמתחרה בזיכרון.</li>
<li><b>הפרעה פרואקטיבית</b> = מה שקרה <b>לפני</b> הלמידה מפריע לזיכרון החדש.</li>
<li>אצל מאיה פעלו <b>שתיהן</b>: היא הייתה ערה כל היום לפני הלמידה, וכל הלילה אחריה. זה יהיה חשוב בהסבר בסוף.</li>
</ul>

<h3>2. שני סוגי שכחה</h3>
<p>זיכרון של אירוע הוא לא פרט אחד, אלא כמה פרטים <b>וקשרים</b> ביניהם (טולווינג). רוב המחקרים על חסך שינה בדקו רק פריט בודד. לכן המאמר מבחין בין שני סוגים:</p>
<div class="tw"><table><tr><th>סוג השכחה</th><th>מה קורה</th><th>אצל מאיה</th></tr>
<tr><td><b>שכחת פריט</b></td><td>לא זוכרים שהפריט בכלל הופיע</td><td>היא לא זוכרת שהיה מושג ״גיזום״</td></tr>
<tr><td><b>פיצול</b> (שכחת קשר)</td><td>זוכרים את הפריט, לא את מה שהיה קשור אליו</td><td>היא זוכרת את המושג, לא את הפרק</td></tr></table></div>
<ul>
<li><b>ג׳ונסן ועמיתים (2019)</b> מצאו שאחרי <b>ערות</b> שוכחים יותר, אבל ״<b>הכל או כלום</b>״: אם זוכרים פרט אחד מהאירוע, זוכרים גם את האחרים. כלומר בלי פיצול.</li>
<li><b>ההשערה:</b> חסך שינה בלילה יגביר <b>גם</b> שכחת פריטים <b>וגם</b> פיצול.</li>
<li><b>רגש:</b> מחקרים קודמים מצאו שזיכרונות שליליים עמידים לחסך שינה, ולכן חצי מהתמונות היו שליליות. המילים כולן היו ניטרליות.</li>
</ul>

<h3>3. השיטה</h3>
<p>היו שני ניסויים, ובכל אחד <b>כל משתתף עבר את שני התנאים</b> בהפרש של שבוע (מערך תוך־נבדקי):</p>
<div class="tw"><table><tr><th></th><th>ניסוי 1</th><th>ניסוי 2</th></tr>
<tr><td>משתתפים</td><td>27 (גיל ממוצע כ־21)</td><td>28 (גיל ממוצע כ־19)</td></tr>
<tr><td>השוואה</td><td>שינה מול <b>ערות ביום</b></td><td>שינה מול <b>לילה בלי שינה</b></td></tr>
<tr><td>למידה</td><td>08:00 (ערות) או 20:00 (שינה)</td><td>תמיד 20:00</td></tr>
<tr><td>מדידת שינה</td><td>שינה בבית, דיווח עצמי</td><td>במעבדה, פוליסומנוגרפיה; בחסך: שעון אקטיגרפיה ביום והשגחה בלילה</td></tr></table></div>
<ul>
<li><b>שלושה מבחנים:</b> <b>T1</b> מיד; <b>T2</b> אחרי כ־12 שעות (בניסוי 2 תמיד בבוקר); <b>T3</b> יומיים אחרי, אחרי שינת התאוששות. ב־T2 קבוצת החסך הייתה ערה כ־24 שעות.</li>
<li><b>הלמידה:</b> 120 זוגות של <b>מילת תואר</b> מעל <b>תמונה</b> (אובייקט או נוף, שלילית או ניטרלית). המשתתפים דמיינו את השילוב, החליטו אם הוא מציאותי או מוזר, וסיווגו את התמונה. הסיווג היה מדויק (כ־97%) בכל התנאים, כלומר כולם למדו באותה רמה.</li>
<li><b>המבחן:</b> רק המילים, יחד עם מילים חדשות. עונים ״ישן״, ״חדש״ או ״?״. על ״ישן״ שואלים גם: אובייקט או נוף?</li>
<li><b>שני מדדים:</b> <b>אובדן פריטים</b> (מבין המילים שזוהו ב־T1, כמה לא זוהו אחר כך) ו<b>ציון פיצול</b> (מבין המילים שזוהו בשני המבחנים, כמה פעמים סוג התמונה נשכח).</li>
<li><b>ערנות:</b> סולם ישנוניות (SSS) ומבחן ערנות (PVT). בניסוי 2 קבוצת החסך הייתה ישנונית יותר ב־T2.</li>
</ul>

<h3>4. הממצאים</h3>
<p>עכשיו אפשר לענות על השאלה. הטבלה מסכמת מה קרה בכל מדד:</p>
<div class="tw"><table><tr><th>מה נמדד</th><th>ערות ביום (ניסוי 1)</th><th>חסך שינה (ניסוי 2)</th></tr>
<tr><td>שכחת פריטים, לעומת שינה</td><td><b>יותר</b> (כ־21% מול כ־17%)</td><td><b>יותר</b> (כ־27% מול כ־18%, עלייה של כ־50%)</td></tr>
<tr><td>פיצול, לעומת שינה</td><td><b>אין הבדל</b></td><td><b>יותר</b></td></tr>
<tr><td>רגש</td><td>אין השפעה</td><td>תמונות שליליות פוצלו יותר באופן כללי, אבל הרגש <b>לא שינה</b> את השפעת החסך</td></tr></table></div>
<ul>
<li><b>יומיים אחרי (T3):</b> גם אחרי שכולם ישנו, ההבדלים של חסך השינה נשארו. לכן הם לא רק עייפות ברגע המבחן.</li>
<li><b>בבסיס (T1)</b> לא היו הבדלים בין התנאים.</li>
<li><b>שלבי שינה:</b> לא נמצא קשר בין זמן בשלב כלשהו (גם לא N3) לבין השכחה.</li>
</ul>
<p><b>חזרה למאיה:</b> גם היא וגם החברה שהייתה ערה ביום שכחו מושגים. אבל רק אצל מאיה, המושגים שנשארו ״התנתקו״ מההקשר שלהם.</p>

<h3>5. איך מסבירים</h3>
<ul>
<li><b>הפרעה כפולה:</b> בחסך שינה הלמידה מוקפת ערות לפניה ואחריה, ולכן פועלות הפרעה פרואקטיבית <b>וגם</b> רטרואקטיבית. ביום הערות פעלה רק רטרואקטיבית.</li>
<li><b>הומיאוסטזיס סינפטי</b> (טונוני וצ׳ירלי): בערות הסינפסות מתחזקות, ושינה (בעיקר N3) מחזירה אותן לאיזון. בלי שינה יש עודף חיזוק, ויחד עם ההפרעה זה אולי מפרק את הקשרים. אבל זו <b>השערה</b>, כי זמן ה־N3 לא היה קשור לביצוע.</li>
<li><b>רגש:</b> ייתכן שה<b>קשר</b> לתוכן רגשי פגיע יותר מהתוכן הרגשי עצמו.</li>
</ul>

<h3>6. מגבלות ומשמעות</h3>
<p>המילים היו ניטרליות, ולכן אי אפשר לבדוק רגש בפריט עצמו. עייפות ולחץ ב־T2 יכלו לתרום, אבל T3 מראה שזה לא כל ההסבר. ייתכן שגם לחץ בזמן האיחוד תרם. <b>המשמעות:</b> חסך שינה לא רק מוחק זיכרונות, אלא משאיר פרטים מנותקים. למאיה: לילה לבן לפני מבחן משאיר אותה עם מושגים בלי ההקשר שצריך כדי לענות.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. המחקר שואל אם חסך שינה משנה לא רק <b>כמה</b> שוכחים, אלא גם <b>איך</b>: שכחת פריט מול פיצול.<br>
2. בשני ניסויים תוך־נבדקיים השוו <b>שינה מול ערות ביום</b> (ניסוי 1) ו<b>שינה מול לילה בלי שינה</b> (ניסוי 2), עם זוגות של מילה ותמונה.<br>
3. גם ערות ביום וגם חסך שינה הגבירו <b>שכחת פריטים</b>, אבל רק חסך שינה גרם גם ל<b>פיצול</b>.<br>
4. ההבדלים <b>נשארו יומיים אחרי</b>, אחרי שינת התאוששות, והרגש לא הגן מפני החסך.<br>
5. ההסבר המוצע: <b>הפרעה כפולה</b> (לפני ואחרי הלמידה) ואולי עודף חיזוק סינפטי, אבל זה השערה, כי לא נמצא קשר לשלבי שינה.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להבחין בין שכחת פריט לפיצול, ובין הפרעה רטרו־ לפרו־אקטיבית.<br>
• לתאר את מערך שני הניסויים ואת ההבדל ביניהם.<br>
• להסביר איך חושבו שני המדדים (אובדן פריטים וציון פיצול).<br>
• לפרש למה T3 מראה שזה לא רק עייפות.<br>
• למנות מגבלות, ולהסביר למה ההסבר הסינפטי נשאר השערה.</div>
<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>ערות ביום כן הגבירה שכחת פריטים</b>; היא רק לא גרמה לפיצול.</li>
<li><b>פיצול ≠ שכחת פריט:</b> בפיצול הפריט עצמו נזכר.</li>
<li><b>הרגש לא הגן מפני החסך</b>, אף שתמונות שליליות פוצלו יותר באופן כללי.</li>
<li><b>המילים היו ניטרליות</b>; רק התמונות היו רגשיות.</li>
<li><b>ההבדלים נשארו גם ב־T3</b>, אחרי שינת התאוששות.</li>
<li><b>לא נמצא קשר לשלבי שינה</b>, ולכן ההסבר הסינפטי הוא השערה.</li>
<li><b>מערך תוך־נבדקי</b>: כל משתתף עבר את שני התנאים של הניסוי שלו.</li>
<li><b>ג׳ונסן מצא ״הכל או כלום״ אחרי ערות</b>, לא פיצול.</li>
</ul></div>`;

function topic(ti,bi,dir="fwd"){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  const last=bi+1>=t.blocks.length;
  show(`<div class="stack reading">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card page"><h2 class="ph">${blk.h}</h2>${acrExpand(blk.html)}</article>${MAPSET.length&&bi===0?MAPSET.map((m,k)=>m.topic===t.id?`<button class="mm-cta" data-map="${k}"><span class="ti">${ic("map")}</span><span class="tt"><b>מפת חשיבה: ${m.title}</b><small>${m.sub}</small></span>${ic("arrowL")}</button>`:"").join(""):""}<div id="ck"></div>
   <div class="pager">${bi>0?`<button class="ghost" id="prev">${ic("arrowR")}<span>הקטע הקודם</span></button>`:"<span></span>"}<button class="primary" id="next"><span>${last?`למבחן הנושא · ${t.qids.length} שאלות`:"הקטע הבא"}</span>${ic("arrowL")}</button></div></div>`,dir);
  enhanceTerms(app.querySelector(".page"));
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=()=>home("back");
  app.querySelector("#next").onclick=()=>{if(!last)topic(ti,bi+1,"fwd");else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  const pv=app.querySelector("#prev");if(pv)pv.onclick=()=>topic(ti,bi-1,"back");
  app.querySelectorAll(".mm-cta").forEach(b=>b.onclick=()=>mindmap(+b.dataset.map,()=>topic(ti,bi,"back")));
  checkBox(t,bi);
}

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;
  const showQ=i=>{const v=list[i],opts=shuffle([v.a,...v.w]);
    host.innerHTML=`<div class="q ckq"><span class="eyebrow">בדיקת הבנה · ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? חזרו לטקסט למעלה לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.style.setProperty("--i",k);b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();box.classList.add("answered");
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a){x.classList.add("right");x.querySelector(".k").innerHTML=ic("check")}});
        if(!ok){b.classList.add("wrong");b.querySelector(".k").innerHTML=ic("x")}
        const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"no");
        fb.innerHTML=`<div class="fbi"><strong>${ok?"נכון":"לא בדיוק"}</strong><p>${esc(v.e)}${ok?"":" כדאי לחזור לטקסט ולקרוא שוב."}</p></div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.innerHTML=`<span>לשאלה ${i+2}</span>${ic("arrowL")}`;
          nx.onclick=()=>{const y=scrollY;showQ(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="cknote";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע: ${r} מתוך ${list.length} נכון.`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };showQ(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=(dir)=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1,answered=items.filter(x=>x.pick!=null).length;
    show(`<div class="stack quiz exam">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length} · נענו ${answered}`,"יציאה מהמבחן")}
     <div class="q"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div></div>
     <div class="pager">${i?`<button class="ghost" id="pv">${ic("arrowR")}<span>הקודמת</span></button>`:"<span></span>"}<button class="primary" id="nx" ${it.pick==null?"disabled":""}><span>${last?"הגשה ובדיקה":"השאלה הבאה"}</span>${ic("arrowL")}</button></div></div>`,dir);
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home("back");else{bk.dataset.sure=1;bk.querySelector("span").textContent="לחצו שוב ליציאה (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");b.style.setProperty("--i",k);
      b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step("fwd")}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step("back")};
  };step("up");
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();

  const wrong=items.filter(it=>!it.ok);
  const verdict=pct>=90?"מצוין. אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. לכל טעות למטה יש כפתור לחזרה על הנושא.";
  show(`<div class="stack results"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>כל הנושאים</span></button></div></div>
   <article class="card score">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="score-row">${ring(pct,`<b data-count="${pct}">${REDUCED?pct:0}</b><small>מתוך 100</small>`)}<div><div class="big"><span data-count="${r}">${REDUCED?r:0}</span><small>/${n} נכונות</small></div><p>${verdict}</p></div></div>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3 class="sec-title">הטעויות שלך · ${wrong.length}</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`,"up");
  const wl=app.querySelector("#wl");
  wrong.forEach((it,k)=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));c.style.setProperty("--i",k);
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span class="ot"><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span class="ot"><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no"><div class="fbi"><strong>למה?</strong><p>${esc(it.v.e)}</p></div></div>
     <div class="row"><button class="go">${ic("book")}<span>חזרה על הנושא: ${esc(t.title)}</span></button></div>`;

}

/* Flashcards: front = the term and a prompt, back = the answer and an example.
   "יודע" removes the card from this round, "עוד לא" sends it to the end of the deck. */
function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");

        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};

function mindmap(mi,onBack){
  const M=MAPSET[mi],seen=new Set();
  const tint=(n,c)=>{n._c=c;(n.c||[]).forEach(x=>tint(x,c))};
  M.root._c="var(--accent)";M.root.c.forEach((b,k)=>tint(b,`var(--t${k%8+1})`));
  const leaves=n=>n.c?n.c.flatMap(leaves):[n],total=leaves(M.root).length;

   <div class="mm-head"><span class="eyebrow">מפת חשיבה</span><h2>${M.title}</h2><p class="muted">לחצו על ענף כדי לפתוח אותו, ועל מושג כדי לקרוא עליו. לחיצה על המרכז חוזרת רמה אחת אחורה.</p></div>
   <nav class="mm-crumbs" id="mmb" aria-label="מיקום במפה"></nav>
   <div class="mm" id="mm"><svg class="mm-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
   <div class="mm-detail" id="mmd" aria-live="polite"></div></div>`,"up");
  app.querySelector("#back").onclick=onBack||(()=>home("back"));
  const box=app.querySelector("#mm"),svg=box.querySelector("svg"),det=app.querySelector("#mmd"),crumbs=app.querySelector("#mmb");
  const enLine=n=>n.en?`<span class="mm-en" dir="ltr" lang="en">${n.en}</span>`:"";
  const detail=(n,isBranch)=>{
    const sib=path[path.length-1].c||[],k=sib.indexOf(n),next=!isBranch?sib.slice(k+1).find(x=>!x.c):null;
    det.style.setProperty("--c",n._c);
    det.innerHTML=`<div class="mmd-in"><div class="mmd-h"><span class="mmd-dot"></span><div><h3>${n.n}</h3>${enLine(n)}</div></div><div class="mmd-body">${n.d}</div>${n.ex?`<div class="mmd-ex"><b>דוגמה:</b> ${n.ex}</div>`:""}
     ${isBranch?`<p class="mmd-note">${n.c.some(x=>x.c)?`${n.c.length} ענפים. לחצו על ענף כדי לפתוח אותו.`:`${n.c.length} מושגים בענף הזה. לחצו על מושג כדי לקרוא עליו.`}</p>`:next?`<button class="mmd-next">${ic("arrowL")}<span>המושג הבא: ${next.n}</span></button>`:""}</div>`;
    det.classList.remove("show");void det.offsetWidth;det.classList.add("show");
    const nb=det.querySelector(".mmd-next");if(nb)nb.onclick=()=>pick(next);
  };
  const pick=n=>{if(n.c){path.push(n);sel=null;render();detail(n,true);return}
    sel=n;seen.add(n);app.querySelector("#mmc").textContent=`${seen.size} מתוך ${total} מושגים`;
    box.querySelectorAll(".mm-node.kid").forEach(b=>{const on=b._n===n;b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);if(seen.has(b._n))b.classList.add("seen")});
    detail(n,false);if(det.getBoundingClientRect().top>innerHeight-120)det.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"})};
  const render=()=>{
    const cur=path[path.length-1],kids=cur.c||[],n=kids.length;
    crumbs.innerHTML=path.map((p,k)=>k<path.length-1?`<button data-k="${k}">${p.n}</button><span aria-hidden="true">‹</span>`:`<b>${p.n}</b>`).join("");
    crumbs.querySelectorAll("button").forEach(b=>b.onclick=()=>{path=path.slice(0,+b.dataset.k+1);sel=null;render();det.innerHTML=""});
    box.querySelectorAll(".mm-node").forEach(e=>e.remove());
    const wide=box.clientWidth>620,rx=wide?36:34,ry=wide?37:39;
    const pos=kids.map((_,k)=>{const a=(-90+360*k/n)*Math.PI/180;return[50+rx*Math.cos(a),50+ry*Math.sin(a)]});
    svg.innerHTML=pos.map(([x,y],k)=>{const mx=(50+x)/2+(y-50)*.12,my=(50+y)/2-(x-50)*.12;return `<path d="M50 50Q${mx.toFixed(2)} ${my.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)}" pathLength="1" style="--c:${kids[k]._c};--i:${k}"/>`}).join("");
    const ctr=document.createElement("button");ctr.className="mm-node center";ctr.style.setProperty("--c",cur._c);
    ctr.innerHTML=`<span class="mm-n">${cur.n}</span>${enLine(cur)}${path.length>1?`<span class="mm-up">${ic("arrowR")} חזרה</span>`:""}`;
    ctr.setAttribute("aria-label",path.length>1?`${cur.n}, חזרה רמה אחת`:cur.n);
    ctr.onclick=()=>{if(path.length>1){path.pop();sel=null;render();det.innerHTML=""}else detail(cur,true)};
    box.appendChild(ctr);
    kids.forEach((k2,k)=>{const b=document.createElement("button");b._n=k2;
      b.className="mm-node kid "+(k2.c?"branch":"leaf")+(seen.has(k2)?" seen":"");b.style.cssText=`--c:${k2._c};--x:${pos[k][0]}%;--y:${pos[k][1]}%;--i:${k}`;
      b.innerHTML=`<span class="mm-n">${k2.n}</span>${k2.c?`<span class="mm-cnt">${k2.c.length} מושגים</span>`:enLine(k2)}`;
      if(!k2.c)b.setAttribute("aria-pressed","false");
      b.onclick=()=>pick(k2);box.appendChild(b)});
    box.classList.remove("mm-go");void box.offsetWidth;box.classList.add("mm-go");
  };
  render();detail(M.root,true);
}

/* Every module gets flashcards and a mind map. A hand-written CARDS or MAPS file wins;
   otherwise both are built from the module's own definitions (tiles, long concept cards, def boxes). */
const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim()};
function deriveTerms(){
  return T.flatMap((t,ti)=>t.blocks.map((blk,bi)=>{const d=document.createElement("div");d.innerHTML=blk.html;
    const items=[...d.children].filter(isTerm).flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem).filter(x=>strip(x.name));
    return{t,ti,bi,h:blk.h,items}}).filter(b=>b.items.length));
}
function autoCards(blocks){
  const byTopic=T.map(t=>blocks.filter(b=>b.t===t).flatMap(b=>b.items.map(it=>({it,t})))
    .sort((a,b)=>strip(b.it.body).length-strip(a.it.body).length));
  const out=[],used=new Set();
  for(let r=0;out.length<12&&byTopic.some(x=>x.length>r);r++)for(const list of byTopic){if(out.length>=12)break;const x=list[r];if(!x)continue;const key=strip(x.it.name);if(used.has(key))continue;used.add(key);
    const hasEx=/cpt-ex/.test(x.it.body);out.push({t:x.t.id,f:x.it.name,q:hasEx?"מה זה? נסו גם לחשוב על דוגמה":"מה ההגדרה?",b:x.it.body,ex:""})}
  return out;
}
function autoMap(blocks){
  const chunk=(name,items)=>{const leaves=items.map(it=>({n:it.name,en:it.en,d:it.body}));if(leaves.length<=8)return[{n:name,c:leaves}];
    const parts=Math.ceil(leaves.length/7);return Array.from({length:parts},(_,k)=>({n:`${name} (${k+1}/${parts})`,c:leaves.slice(k*7,k*7+7)}))};
  const kids=T.map(t=>{const bs=blocks.filter(b=>b.t===t);if(!bs.length)return null;
    const sub=bs.flatMap(b=>chunk(b.h,b.items));
    const c=sub.length===1?sub[0].c:sub.map(s=>({n:s.n,d:`${s.c.length} מושגים מהקטע ״${s.n}״.`,c:s.c}));
    return{n:t.title,d:`נושא ${T.indexOf(t)+1} בלומדה. ${c.length} ${sub.length===1?"מושגים":"קטעים"} בענף.`,c}}).filter(Boolean);
  if(kids.length<2)return null;
  return{id:"module",title:"מפת הלומדה",sub:"כל הנושאים והמושגים במבט אחד",root:{n:CONFIG.he||CONFIG.title,d:CONFIG.about||"כל הנושאים של הלומדה. לחצו על נושא כדי לפתוח את המושגים שלו.",c:kids}};
}
