    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"השאלה: מה חסך שינה עושה לשכחה",blocks:[
  {h:"התקציר",html:`${def("על מה הנושא",`ידוע שחסך שינה גורם לשכוח יותר. המאמר שואל שאלה חדשה: האם הוא משנה גם את <b>סוג</b> השכחה?<br><b>מה נלמד כאן:</b> התקציר · מאיה · למה שינה מגינה על זיכרון`)}<p>ידוע שחסך שינה מגביר שכחה של זיכרונות אירועים <b>(אפיזודיים)</b>. אבל לא היה ידוע אם חסך שינה ארוך משנה גם את <b>האופי</b> של השכחה. החוקרים השוו שלושה מצבים: לילה של שינה, יום של ערות, ולילה <b>בלי שינה</b>.</p>${tiles([["moon","שינה","שוכחים הכי מעט"],["clock","יום ער","שוכחים יותר <b>פריטים</b>"],["x","לילה בלי שינה","שוכחים יותר פריטים, <b>וגם</b> הקשרים ביניהם נקטעים"]])}${def("בשורה התחתונה",`גם ערות וגם חסך שינה הגבירו את שכחת ה<b>פריטים</b>. רק חסך שינה בלילה גרם בנוסף ל<b>פיצול</b>: זוכרים פרט, אבל לא את מה שהיה קשור אליו.`)}`,q:"q1"},
  {h:"מאיה והלילה הלבן",html:`${ex("מאיה לומדת למבחן בערב, ומחליטה לא לישון בכלל. בבוקר היא זוכרת ש״היה מושג בשם <b>גיזום</b>״, אבל לא זוכרת באיזה פרק הוא היה או למה הוא קשור. זה בדיוק ״זיכרון מפוצל״: הפריט שרד, הקשר נעלם.")}<p>נחזור למאיה לאורך הלומדה, כדי להבין מה בדיוק קרה לזיכרון שלה, ולמה זה שונה ממה שהיה קורה אילו פשוט הייתה ערה במשך יום רגיל.</p>${rem("השאלה של המחקר היא לא רק <b>כמה</b> שוכחים בלי שינה, אלא <b>איך</b> שוכחים: האם הזיכרון נעלם כולו, או מתפרק לחלקים?")}`,q:"q2"},
  {h:"למה שינה מגינה על זיכרון",html:`${def("הפרעה רטרואקטיבית",`${E("Retroactive interference")} מה שקורה <b>אחרי</b> שלמדנו (מידע חדש, פעילות) מפריע לזיכרון החדש ומגביר שכחה (Wixted, 2004).`)}<p>שינה מפחיתה שכחה לעומת ערות, כנראה כי בזמן השינה אין מידע חדש שמתחרה בזיכרון. כלומר השינה <b>מגינה</b> על הזיכרון מהפרעה.</p>${def("הפרעה פרואקטיבית",`${E("Proactive interference")} מה שקרה <b>לפני</b> הלמידה מפריע לזיכרון החדש (Underwood, 1957).`)}${ex("מאיה הייתה ערה כל היום לפני שלמדה, וגם כל הלילה אחרי. לכן אצלה פעלו <b>שני</b> סוגי ההפרעה: מה שהיה לפני (פרואקטיבית) ומה שבא אחרי (רטרואקטיבית).")}`,q:"q3"}
 ]},
 {id:"t2",icon:"link",title:"שכחת פריט מול פיצול",blocks:[
  {h:"זיכרון אירוע הוא רשת של קשרים",html:`${def("על מה הנושא",`זיכרון של אירוע הוא לא פרט אחד, אלא כמה פרטים שקשורים זה לזה. הנושא מסביר מה זה ״פיצול״.<br><b>מה נלמד כאן:</b> זיכרון אפיזודי · ג׳ונסן 2019 · ההשערה`)}<p>כדי להיזכר באירוע צריך את ה<b>קשרים</b> בין הפרטים שלו (Tulving, 1985): איפה זה קרה, מי היה שם, מה היה שם. רוב מחקרי חסך השינה בדקו רק <b>פריט בודד</b>, ולא את הקשרים.</p>${def("ג׳ונסן ועמיתים (2019)",`בדקו אירועים עם מקום, אדם וחפץ. אחרי ערות שכחו יותר מאחרי שינה. אבל השכחה הייתה <b>״הכל או כלום״</b>: אם זכרו פרט אחד מהאירוע, היה סיכוי גבוה שיזכרו גם את האחרים. כלומר הערות הגבירה שכחה, אבל <b>לא פיצלה</b> את מה ששרד.`)}`,q:"q5"},
  {h:"שני סוגי שכחה",html:`<p>המאמר מבחין בין שני סוגים של שכחה:</p>${fig("frag35")}${tiles([["x","שכחת פריט","לא זוכרים שהמילה בכלל הופיעה. מאיה לא זוכרת את המושג"],["link","פיצול (שכחה אסוציאטיבית)","זוכרים את הפריט, אבל לא את מה שהיה קשור אליו. מאיה זוכרת את המושג, לא את הפרק"]])}${def("ההשערה",`חסך שינה בלילה יגביר <b>גם</b> את שכחת הפריטים <b>וגם</b> את הפיצול, לעומת שינה ולעומת ערות ביום.`)}`,q:"q7"},
  {h:"ומה עם רגש?",html:`<p>מחקרים קודמים מצאו שזיכרונות <b>רגשיים שליליים</b> עמידים יותר לחסך שינה (Sterpenich, 2007; Vargas, 2019). לכן החוקרים שילבו גם <b>תמונות שליליות</b> וגם <b>ניטרליות</b>, כדי לבדוק אם הרגש מגן מפני פיצול.</p>${rem("שימו לב: הרגש היה רק ב<b>תמונות</b>. המילים עצמן היו ניטרליות.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"people",title:"השיטה: שני ניסויים",blocks:[
  {h:"המשתתפים והמערך",html:`${def("על מה הנושא",`איך בנו את המחקר: שני ניסויים, ובכל אחד כל משתתף עבר את שני התנאים.<br><b>מה נלמד כאן:</b> משתתפים · מערך תוך־נבדקי · ציר הזמן`)}${tiles([["people","ניסוי 1: שינה מול ערות","27 מבוגרים בריאים (10 גברים), גיל ממוצע כ־21"],["moon","ניסוי 2: שינה מול חסך שינה","28 מבוגרים בריאים (4 גברים), גיל ממוצע כ־19"]])}${def("מערך תוך־נבדקי",`${E("Within-subjects")} כל משתתף עבר את <b>שני</b> התנאים, בהפרש של שבוע, והסדר הוחלף בין משתתפים. כך כל אחד הוא הביקורת של עצמו.`)}`,q:"q11"},
  {h:"ציר הזמן",html:`${fig("timeline35")}<ul><li><b>T1</b>: מבחן מיד אחרי הלמידה.</li><li><b>T2</b>: אחרי כ־12 שעות. בניסוי 2 תמיד בבוקר, אחרי לילה של שינה או לילה בלי שינה.</li><li><b>T3</b>: יומיים אחרי T2, אחרי שכולם כבר ישנו כדי להתאושש.</li></ul>${ex("קבוצת החסך בניסוי 2 היא מאיה: קמה ב־08:00, הייתה ערה כל היום (וידאו את זה בשעון יד שמודד תנועה, <b>אקטיגרפיה</b>), למדה ב־20:00, ונשארה ערה כל הלילה תחת השגחה, עם משחקים, סרטים וספרים. ב־T2 היא כבר ערה כ־24 שעות.")}`,q:"q13"},
  {h:"איך וידאו שינה וערנות",html:`${tiles([["brain","פוליסומנוגרפיה","בלילה של השינה בניסוי 2 מדדו במעבדה פעילות מוח (EEG), תנועות עיניים ושרירים, וחילקו את השינה לשלבים. ממוצע: כ־7 שעות"],["clock","ניסוי 1","שינה בבית, לפי דיווח עצמי (כ־7.8 שעות). ביום הערות: בלי תנומות, קפאין ואלכוהול"],["chart","ערנות","סולם ישנוניות של סטנפורד (SSS) ומבחן ערנות פסיכומוטורי (PVT) בכל מבחן"]])}${rem("בניסוי 2, ב־T2 קבוצת החסך הייתה <b>ישנונית יותר</b> וביצעה גרוע יותר במבחן הערנות. זה חשוב כשנפרש את התוצאות.")}`,q:"q15"}
 ]},
 {id:"t4",icon:"flask",title:"המשימות והמדדים",blocks:[
  {h:"הלמידה",html:`${def("על מה הנושא",`מה המשתתפים למדו, איך בדקו אותם, ואיך חישבו את שני סוגי השכחה.<br><b>מה נלמד כאן:</b> הגירויים · הלמידה · המבחן · שני המדדים`)}<p>המשתתפים ראו <b>120 זוגות</b>: <b>מילת תואר</b> באנגלית מעל <b>תמונה</b>. חצי מהתמונות היו <b>אובייקטים</b> וחצי <b>נופים</b>, וחצי מהתמונות היו <b>שליליות</b> וחצי <b>ניטרליות</b>. המילים כולן ניטרליות.</p>${ex("על המסך: המילה <b>soft</b> מעל תמונה של כרית (אובייקט). המשתתף מדמיין את השילוב, מחליט אם הוא ״מציאותי״ או ״מוזר״, ואז מסווג את התמונה: אובייקט או נוף.")}${rem("הסיווג היה מדויק מאוד (כ־97%) ובלי הבדל בין התנאים. כלומר כולם למדו באותה רמה.")}`,q:"q17"},
  {h:"המבחן",html:`<p>במבחן הופיעו המילים <b>בלי התמונות</b>, יחד עם מילים חדשות שלא נלמדו. על כל מילה עונים:</p>${tiles([["check","\"ישן\"","ראיתי את המילה. אז ממשיכים: האם היא הייתה עם <b>אובייקט</b> או עם <b>נוף</b>? ומתארים בקצרה"],["x","\"חדש\"","לא ראיתי. הניסיון נגמר"],["question","\"?\"","לא יודע. הניסיון נגמר"]])}${rem("כיוון שהותר לענות ״?״, אי אפשר היה לחשב מדד רגישות (d′) רגיל.")}`,q:"q19"},
  {h:"שני המדדים",html:`${def("אובדן פריטים",`מתוך המילים שזוהו נכון ב־T1, כמה <b>לא</b> זוהו נכון במבחן המאוחר (טעות או ״?״).`)}${def("ציון פיצול",`מתוך המילים שזוהו נכון <b>גם</b> ב־T1 <b>וגם</b> במבחן המאוחר, וש־ב־T1 גם סוג התמונה נזכר נכון: כמה פעמים סוג התמונה <b>נשכח</b> במבחן המאוחר.`)}${ex("ב־T1 מאיה זכרה ש־soft היה עם אובייקט. בבוקר היא עדיין זוכרת את המילה soft, אבל עונה ״?״ על סוג התמונה. זו נקודה בציון ה<b>פיצול</b>. אילו שכחה את soft עצמה, זו הייתה נקודה ב<b>אובדן פריטים</b>.")}`,q:"q21"}
 ]},
 {id:"t5",icon:"chart",title:"הממצאים",blocks:[
  {h:"שכחת פריטים",html:`${def("על מה הנושא",`מה נמצא, בשני הניסויים ובשלוש נקודות הזמן.<br><b>מה נלמד כאן:</b> פריטים · פיצול · רגש · יומיים אחרי`)}${tiles([["clock","ניסוי 1","אחרי <b>ערות</b> שכחו יותר פריטים מאחרי שינה (כ־21% מול כ־17%)"],["x","ניסוי 2","אחרי <b>חסך שינה</b> שכחו יותר פריטים מאחרי שינה (כ־27% מול כ־18%), עלייה של כ־50%"]])}${rem("כלומר <b>שני</b> סוגי הערות הגבירו שכחת פריטים. ההבדל בין הניסויים הוא בפיצול.")}`,q:"q23"},
  {h:"פיצול",html:`${yn(["חסך שינה (ניסוי 2) הגביר פיצול לעומת שינה"],["ערות ביום (ניסוי 1) לא הגבירה פיצול"])}${def("רגש",`בניסוי 2, תמונות <b>שליליות</b> פוצלו <b>יותר</b> מניטרליות באופן כללי. אבל הרגש <b>לא שינה</b> את השפעת חסך השינה: לא נמצאה אינטראקציה.`)}${ex("זה ההבדל בין מאיה, שלא ישנה כל הלילה, לבין חברה שלמדה בבוקר והייתה ערה כל היום: שתיהן שכחו מושגים, אבל רק אצל מאיה המושגים שנשארו ״התנתקו״ מההקשר שלהם.")}`,q:"q25"},
  {h:"יומיים אחרי, ושלבי שינה",html:`<ul><li><b>T1 ← T3:</b> גם אחרי שכולם ישנו להתאושש, ההבדלים של חסך השינה נשארו, גם בפריטים וגם בפיצול. לכן הם <b>לא</b> רק תוצאה של עייפות ברגע המבחן.</li><li><b>T2 ← T3:</b> לא נמצא שינוי נוסף בפיצול.</li><li><b>T1 (בסיס):</b> לא היו הבדלים בין התנאים בלמידה.</li><li><b>שלבי שינה:</b> לא נמצא קשר בין זמן בשלב שינה כלשהו (גם לא שינה עמוקה, N3) לבין השכחה.</li></ul>${rem("התאוששות בשינה אחרי לילה לבן <b>לא</b> מחזירה את מה שאבד.")}`,q:"q27"}
 ]},
 {id:"t6",icon:"bulb",title:"דיון ומגבלות",blocks:[
  {h:"איך מסבירים",html:`${def("על מה הנושא",`למה רק חסך שינה מפצל זיכרונות, ומה המגבלות.<br><b>מה נלמד כאן:</b> הפרעה כפולה · הומיאוסטזיס סינפטי · רגש · מגבלות`)}${tiles([["split","הפרעה כפולה","בחסך שינה הלמידה ״מוקפת״ בערות: לפניה ואחריה. כלומר פועלות הפרעה <b>פרואקטיבית ורטרואקטיבית</b>. ביום ער פעלה רק הרטרואקטיבית"],["brain","הומיאוסטזיס סינפטי","בערות הסינפסות מתחזקות, ושינה (בעיקר N3) ״מאפסת״ אותן (Tononi & Cirelli). בלי שינה, עודף חיזוק יחד עם הפרעה אולי מפרק את הקשרים"]])}${rem("ההסבר השני הוא <b>השערה בלבד</b>: הזמן בשלב N3 לא היה קשור לביצוע.")}`,q:"q29"},
  {h:"רגש, מגבלות ומשמעות",html:`<p><b>רגש:</b> בניגוד למחקרים קודמים, הרגש לא הגן מפני ההשפעה של חסך השינה. החוקרים מציעים שה<b>קשר</b> לתוכן רגשי פגיע יותר מהתוכן הרגשי עצמו. תמונות שליליות פוצלו יותר באופן כללי, בדומה לממצאים של ביסבי שרגש שלילי פוגע בשלמות הזיכרון.</p>${tiles([["x","מגבלה 1","המילים היו ניטרליות, ולכן אי אפשר לבדוק רגש בפריט עצמו"],["x","מגבלה 2","עייפות ולחץ ב־T2 יכלו לתרום, אבל תוצאות T3 מראות שזה לא כל ההסבר"],["x","מגבלה 3","ייתכן שגם לחץ בזמן האיחוד תרם לפיצול שנשאר"]])}${ex("המסקנה המעשית למאיה: לילה לבן לפני מבחן לא רק גורם לשכוח יותר. הוא גורם לזכור פרטים <b>מנותקים</b>, בלי ההקשר שצריך כדי לענות על שאלה.")}`,q:"q31"}
 ]}

const Q={"q1":{"t":"t1","v":[{"q":"מה החידוש העיקרי בשאלה של המחקר?","a":"האם חסך שינה משנה את סוג השכחה","w":["האם חסך שינה מגביר את כמות השכחה הכללית","האם שינה בבית טובה כמו שינה במעבדה","האם אנשים צעירים שוכחים פחות מאנשים מבוגרים"],"e":"שחסך שינה מגביר שכחה כבר היה ידוע. החידוש הוא השאלה אם הוא משנה את האופי של השכחה: האם הזיכרון מתפרק."},{"q":"לפי התקציר, מה גרם רק חסך שינה בלילה, ולא ערות ביום?","a":"פיצול של הקשרים בין פרטים","w":["שכחה של יותר פריטים בודדים","ירידה בדיוק הסיווג בזמן הלמידה","שיפור בזיכרון של תמונות שליליות"],"e":"גם ערות ביום וגם חסך שינה הגבירו שכחת פריטים. רק חסך שינה גרם בנוסף לפיצול."}]},"q2":{"t":"t1","v":[{"q":"מאיה זוכרת בבוקר את המושג, אבל לא את ההקשר שבו הוא הופיע. איך המאמר יקרא לזה?","a":"זיכרון מפוצל","w":["שכחת פריט","הפרעה פרואקטיבית בלבד","זיכרון שלם"],"e":"הפריט שרד אבל הקשר שלו נשכח. זה בדיוק מה שהמאמר מכנה פיצול."},{"q":"מה ההבדל בין ״כמה שוכחים״ לבין ״איך שוכחים״ במחקר?","a":"האם הזיכרון נעלם כולו או מתפרק לחלקים","w":["האם שוכחים מהר או לאט לאורך היום ובלילה","האם שוכחים יותר מילים או יותר תמונות","האם שוכחים בבית או במעבדה"],"e":"״איך״ מתייחס לאופי השכחה: הכל או כלום, לעומת פרט ששרד בלי הקשר שלו."}]},"q3":{"t":"t1","v":[{"q":"מהי הפרעה רטרואקטיבית?","a":"מה שקורה אחרי הלמידה מפריע לזיכרון","w":["מה שקרה לפני הלמידה מפריע לזיכרון החדש","שינה עמוקה שמוחקת זיכרונות חדשים מהיום","קושי ללמוד כשעייפים מאוד"],"e":"רטרו = אחורה: מידע חדש שמגיע אחרי הלמידה מפריע לזיכרון שכבר נלמד. ההפרעה מהעבר נקראת פרואקטיבית."},{"q":"לפי המאמר, למה שינה מפחיתה שכחה לעומת ערות?","a":"אין בה מידע חדש שמתחרה בזיכרון","w":["בשינה לומדים מחדש את כל המידע","בשינה המוח מפסיק לגמרי לעבוד","בשינה רמת הלחץ עולה ומחזקת זיכרון"],"e":"ההסבר המרכזי: שינה מגינה מפני הפרעה רטרואקטיבית, כי בזמנה לא נקלט מידע חדש."}]},"q4":{"t":"t1","v":[{"q":"מאיה הייתה ערה כל היום לפני הלמידה וכל הלילה אחריה. אילו הפרעות פעלו עליה?","a":"גם פרואקטיבית וגם רטרואקטיבית","w":["רק רטרואקטיבית, כי הלמידה הייתה בערב","רק פרואקטיבית","אף אחת מהן, כי היא למדה בערב ולא בבוקר"],"e":"ערות לפני הלמידה יוצרת הפרעה פרואקטיבית, וערות אחריה יוצרת הפרעה רטרואקטיבית."}]},"q5":{"t":"t2","v":[{"q":"מה מצאו ג׳ונסן ועמיתים (2019) על שכחה אחרי ערות?","a":"השכחה הייתה ״הכל או כלום״","w":["הזיכרונות שנשארו היו מפוצלים","ערות לא הגבירה שכחה בכלל","רק פרטי המקום נשכחו"],"e":"אחרי ערות שכחו יותר, אבל אם זכרו פרט אחד מהאירוע, זכרו בדרך כלל גם את האחרים. כלומר בלי פיצול."},{"q":"למה כדי להיזכר באירוע צריך יותר מפריט בודד?","a":"כי צריך את הקשרים בין פרטי האירוע","w":["כי פריט בודד נשמר רק בזיכרון עבודה","כי רוב האירועים כוללים רק פריט אחד","כי פריטים בודדים נשכחים תמיד בשינה"],"e":"לפי טולווינג, זיכרון אפיזודי נשען על הקשרים בין הפרטים: מקום, אדם, חפץ."}]},"q6":{"t":"t2","v":[{"q":"מה היה חסר ברוב המחקרים הקודמים על חסך שינה?","a":"בדיקה של הקשרים, ולא רק של פריט","w":["השוואה בין לילה של שינה לבין יום של ערות","בדיקה של זיכרון מילולי","משתתפים מבוגרים ובריאים"],"e":"רוב המחקרים בדקו פריט בודד, ולכן לא יכלו לראות אם הזיכרון מתפרק."}]},"q7":{"t":"t2","v":[{"q":"מה ההגדרה של פיצול במאמר?","a":"זוכרים את הפריט אבל לא את מה שהיה קשור אליו","w":["לא זוכרים שהפריט בכלל הופיע בזמן הלמידה","זוכרים פריט שלא הופיע בלמידה בכלל, בטעות","זוכרים את התמונה אבל לא את המילה"],"e":"פיצול = הפריט שרד, הקשר נשכח. שכחה של הפריט עצמו היא שכחת פריט."},{"q":"מה הייתה ההשערה של החוקרים?","a":"חסך שינה יגביר גם שכחת פריטים וגם פיצול","w":["חסך שינה יגביר רק שכחת פריטים, בלי שום פיצול","ערות ביום תגביר פיצול יותר מחסך שינה","שינה תגביר פיצול לעומת ערות"],"e":"החוקרים צפו שחסך שינה בלילה יגביר את שני סוגי השכחה, לעומת שינה ולעומת ערות ביום."}]},"q8":{"t":"t2","v":[{"q":"מאיה שכחה לגמרי שהמושג ״גיזום״ הופיע בחומר. איזה סוג שכחה זה?","a":"שכחת פריט","w":["פיצול","הפרעה פרואקטיבית","זיכרון רגשי"],"e":"אם הפריט עצמו נעלם, זו שכחת פריט. פיצול הוא כשהפריט נשאר והקשר שלו נעלם."}]},"q9":{"t":"t2","v":[{"q":"למה החוקרים שילבו תמונות שליליות?","a":"כדי לבדוק אם רגש מגן מפני הפיצול","w":["כדי שהמשתתפים יישארו ערניים במהלך הלילה","כדי להקשות על משימת הסיווג","כדי לבדוק אם המילים עצמן שליליות או ניטרליות"] const SUM=`<h2>סיכום: חסך שינה גורם לאובדן זיכרון ״מפוצל״ (Ashton et al., 2020)</h2>
<div class="key"><b>על מה מדובר?</b> כבר ידוע שבלי שינה שוכחים יותר. המחקר שואל שאלה אחרת: האם חסך שינה משנה גם את <b>סוג</b> השכחה? הוא השווה שלושה מצבים: לילה של <b>שינה</b>, יום של <b>ערות</b>, ולילה <b>בלי שינה</b>. התוצאה: גם ערות ביום וגם חסך שינה גרמו לשכוח יותר <b>פריטים</b>. אבל רק חסך שינה גרם בנוסף ל<b>פיצול</b>: אנשים זכרו פריט, אבל לא את מה שהיה קשור אליו. וההבדלים נשארו גם יומיים אחרי, אחרי שכולם כבר ישנו.</div>

<h3>הדוגמה שתלווה אותנו: מאיה והלילה הלבן</h3>
<p>מאיה לומדת למבחן בערב ומחליטה לא לישון בכלל. בבוקר היא זוכרת שהיה מושג בשם ״גיזום״, אבל לא זוכרת באיזה פרק הוא היה ולמה הוא קשור. נעקוב אחריה כדי להבין מה המחקר מצא, ולמה זה שונה ממה שהיה קורה לחברה שלה שלמדה בבוקר והייתה ערה כל היום.</p>

<h3>1. הרקע: למה שינה מגינה על זיכרון</h3>
<ul>
<li><b>הפרעה רטרואקטיבית</b> = מה שקורה <b>אחרי</b> הלמידה (מידע חדש, פעילות) מפריע לזיכרון. שינה מפחיתה שכחה כנראה כי בזמנה אין מידע חדש שמתחרה בזיכרון.</li>
<li><b>הפרעה פרואקטיבית</b> = מה שקרה <b>לפני</b> הלמידה מפריע לזיכרון החדש.</li>
<li>אצל מאיה פעלו <b>שתיהן</b>: היא הייתה ערה כל היום לפני הלמידה, וכל הלילה אחריה. זה יהיה חשוב בהסבר בסוף.</li>
</ul>

<h3>2. שני סוגי שכחה</h3>
<p>זיכרון של אירוע הוא לא פרט אחד, אלא כמה פרטים <b>וקשרים</b> ביניהם (טולווינג). רוב המחקרים על חסך שינה בדקו רק פריט בודד. לכן המאמר מבחין בין שני סוגים:</p>
<div class="tw"><table><tr><th>סוג השכחה</th><th>מה קורה</th><th>אצל מאיה</th></tr>
<tr><td><b>שכחת פריט</b></td><td>לא זוכרים שהפריט בכלל הופיע</td><td>היא לא זוכרת שהיה מושג ״גיזום״</td></tr>
<tr><td><b>פיצול</b> (שכחת קשר)</td><td>זוכרים את הפריט, לא את מה שהיה קשור אליו</td><td>היא זוכרת את המושג, לא את הפרק</td></tr></table></div>
<ul>
<li><b>ג׳ונסן ועמיתים (2019)</b> מצאו שאחרי <b>ערות</b> שוכחים יותר, אבל ״<b>הכל או כלום</b>״: אם זוכרים פרט אחד מהאירוע, זוכרים גם את האחרים. כלומר בלי פיצול.</li>
<li><b>ההשערה:</b> חסך שינה בלילה יגביר <b>גם</b> שכחת פריטים <b>וגם</b> פיצול.</li>
<li><b>רגש:</b> מחקרים קודמים מצאו שזיכרונות שליליים עמידים לחסך שינה, ולכן חצי מהתמונות היו שליליות. המילים כולן היו ניטרליות.</li>
</ul>

<tr><td>השוואה</td><td>שינה מול <b>ערות ביום</b></td><td>שינה מול <b>לילה בלי שינה</b></td></tr>
<tr><td>למידה</td><td>08:00 (ערות) או 20:00 (שינה)</td><td>תמיד 20:00</td></tr>
<tr><td>מדידת שינה</td><td>שינה בבית, דיווח עצמי</td><td>במעבדה, פוליסומנוגרפיה; בחסך: שעון אקטיגרפיה ביום והשגחה בלילה</td></tr></table></div>
<ul>
<li><b>שלושה מבחנים:</b> <b>T1</b> מיד; <b>T2</b> אחרי כ־12 שעות (בניסוי 2 תמיד בבוקר); <b>T3</b> יומיים אחרי, אחרי שינת התאוששות. ב־T2 קבוצת החסך הייתה ערה כ־24 שעות.</li>
<li><b>הלמידה:</b> 120 זוגות של <b>מילת תואר</b> מעל <b>תמונה</b> (אובייקט או נוף, שלילית או ניטרלית). המשתתפים דמיינו את השילוב, החליטו אם הוא מציאותי או מוזר, וסיווגו את התמונה. הסיווג היה מדויק (כ־97%) בכל התנאים, כלומר כולם למדו באותה רמה.</li>
<li><b>המבחן:</b> רק המילים, יחד עם מילים חדשות. עונים ״ישן״, ״חדש״ או ״?״. על ״ישן״ שואלים גם: אובייקט או נוף?</li>
<li><b>שני מדדים:</b> <b>אובדן פריטים</b> (מבין המילים שזוהו ב־T1, כמה לא זוהו אחר כך) ו<b>ציון פיצול</b> (מבין המילים שזוהו בשני המבחנים, כמה פעמים סוג התמונה נשכח).</li>
<li><b>ערנות:</b> סולם ישנוניות (SSS) ומבחן ערנות (PVT). בניסוי 2 קבוצת החסך הייתה ישנונית יותר ב־T2.</li>
</ul>

<h3>4. הממצאים</h3>
<p>עכשיו אפשר לענות על השאלה. הטבלה מסכמת מה קרה בכל מדד:</p>
<div class="tw"><table><tr><th>מה נמדד</th><th>ערות ביום (ניסוי 1)</th><th>חסך שינה (ניסוי 2)</th></tr>
<tr><td>שכחת פריטים, לעומת שינה</td><td><b>יותר</b> (כ־21% מול כ־17%)</td><td><b>יותר</b> (כ־27% מול כ־18%, עלייה של כ־50%)</td></tr>
<tr><td>פיצול, לעומת שינה</td><td><b>אין הבדל</b></td><td><b>יותר</b></td></tr>
<tr><td>רגש</td><td>אין השפעה</td><td>תמונות שליליות פוצלו יותר באופן כללי, אבל הרגש <b>לא שינה</b> את השפעת החסך</td></tr></table></div>
<ul>
<li><b>יומיים אחרי (T3):</b> גם אחרי שכולם ישנו, ההבדלים של חסך השינה נשארו. לכן הם לא רק עייפות ברגע המבחן.</li>
<li><b>בבסיס (T1)</b> לא היו הבדלים בין התנאים.</li>
<li><b>שלבי שינה:</b> לא נמצא קשר בין זמן בשלב כלשהו (גם לא N3) לבין השכחה.</li>
</ul>
<p><b>חזרה למאיה:</b> גם היא וגם החברה שהייתה ערה ביום שכחו מושגים. אבל רק אצל מאיה, המושגים שנשארו ״התנתקו״ מההקשר שלהם.</p>

<h3>5. איך מסבירים</h3>
<ul>
<li><b>הפרעה כפולה:</b> בחסך שינה הלמידה מוקפת ערות לפניה ואחריה, ולכן פועלות הפרעה פרואקטיבית <b>וגם</b> רטרואקטיבית. ביום הערות פעלה רק רטרואקטיבית.</li>
<li><b>הומיאוסטזיס סינפטי</b> (טונוני וצ׳ירלי): בערות הסינפסות מתחזקות, ושינה (בעיקר N3) מחזירה אותן לאיזון. בלי שינה יש עודף חיזוק, ויחד עם ההפרעה זה אולי מפרק את הקשרים. אבל זו <b>השערה</b>, כי זמן ה־N3 לא היה קשור לביצוע.</li>
<li><b>רגש:</b> ייתכן שה<b>קשר</b> לתוכן רגשי פגיע יותר מהתוכן הרגשי עצמו.</li>
</ul>

<h3>6. מגבלות ומשמעות</h3>
<p>המילים היו ניטרליות, ולכן אי אפשר לבדוק רגש בפריט עצמו. עייפות ולחץ ב־T2 יכלו לתרום, אבל T3 מראה שזה לא כל ההסבר. ייתכן שגם לחץ בזמן האיחוד תרם. <b>המשמעות:</b> חסך שינה לא רק מוחק זיכרונות, אלא משאיר פרטים מנותקים. למאיה: לילה לבן לפני מבחן משאיר אותה עם מושגים בלי ההקשר שצריך כדי לענות.</p>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>ערות ביום כן הגבירה שכחת פריטים</b>; היא רק לא גרמה לפיצול.</li>
<li><b>פיצול ≠ שכחת פריט:</b> בפיצול הפריט עצמו נזכר.</li>
<li><b>הרגש לא הגן מפני החסך</b>, אף שתמונות שליליות פוצלו יותר באופן כללי.</li>
<li><b>המילים היו ניטרליות</b>; רק התמונות היו רגשיות.</li>
<li><b>ההבדלים נשארו גם ב־T3</b>, אחרי שינת התאוששות.</li>
<li><b>לא נמצא קשר לשלבי שינה</b>, ולכן ההסבר הסינפטי הוא השערה.</li>
<li><b>מערך תוך־נבדקי</b>: כל משתתף עבר את שני התנאים של הניסוי שלו.</li>
<li><b>ג׳ונסן מצא ״הכל או כלום״ אחרי ערות</b>, לא פיצול.</li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#sum"&&typeof SUM!=="undefined")summary();else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
</html>
