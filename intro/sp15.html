const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"question",title:"מהי הפרעה, ואיך מאבחנים",blocks:[
  {h:"מתי זו הפרעה",html:`${def("על מה הנושא",`לא כל התנהגות חריגה היא הפרעה. איך מחליטים, ואיך מסווגים?<br><b>מה נלמד כאן:</b> הגדרה · ״תפקוד לקוי מזיק״ · הגדרת האגודה · DSM-5 · תחלואה נלווית`)}${ex("נלווה לאורך הלומדה את <b>ד״ר מיכל</b>, פסיכולוגית במרכז הייעוץ לסטודנטים. בכל נושא נפגוש סטודנט אחר שמגיע אליה, ונראה איך היא חושבת על מה שהוא מתאר. (הדמויות בדויות, ונועדו רק להמחשה.)")}<p>הפרעה פסיכולוגית כוללת מחשבות, רגשות והתנהגויות חריגים. אבל <b>חריגות</b> לבדה, או הפרה של נורמות, <b>לא מספיקה</b>: אדם יכול להיות חריג מאוד ובריא לגמרי.</p>${def("תפקוד לקוי מזיק",`${E("Harmful dysfunction")} הפרעה קיימת כשמנגנון פנימי <b>לא ממלא את תפקידו הטבעי</b>, וזה גורם נזק.`)}${def("ההגדרה של האגודה האמריקאית",`שלושה תנאים: (1) <b>תפקוד לקוי</b> ביולוגי, פסיכולוגי או התפתחותי; (2) <b>פגיעה משמעותית</b> בתפקוד או מצוקה; (3) <b>לא</b> תגובה צפויה ומקובלת תרבותית לאירוע (כמו אבל אחרי מוות).`)}`,q:"q1"},
  {h:"DSM-5",html:`${def("DSM-5",`הספר שבו משתמשים רוב אנשי המקצוע בארה״ב. ה־DSM הראשון יצא ב־<b>1952</b>, וה־DSM-5 ב־<b>2013</b>. הוא כולל <b>237</b> הפרעות, ולכל אחת: תסמינים, שכיחות, גורמי סיכון ו<b>תחלואה נלווית</b>.`)}${def("תחלואה נלווית",`${E("Comorbidity")} כשלאדם יש <b>יותר מהפרעה אחת</b> בו בזמן.`)}${rem("יתרון ה־DSM: קריטריונים <b>מפורשים</b>, ולכן טוב גם לטיפול וגם למחקר. ביקורת: מספר ההפרעות הולך וגדל.")}${ex("סטודנט מגיע לד״ר מיכל אחרי פרידה, עצוב כבר שבוע. האם זו הפרעה? אם זו תגובה צפויה לאירוע, והתפקוד לא נפגע משמעותית, כנראה שלא. היא תבדוק את שלושת התנאים.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"split",title:"מאיפה זה בא: נקודות מבט",blocks:[
  {h:"נקודות מבט ומודל הפגיעות־לחץ",html:`${def("על מה הנושא",`הסברים להפרעות, מ״כוחות על־טבעיים״ ועד השילוב של גנים וסביבה.<br><b>מה נלמד כאן:</b> על־טבעי · ביולוגי · פסיכולוגי · פגיעות־לחץ`)}<div class="tw"><table><tr><th>נקודת מבט</th><th>ההסבר</th></tr><tr><td><b>על־טבעית</b></td><td>כוחות אלוהיים, ״דיבוק״. מאות שנים, ועדיין בחלק מהתרבויות</td></tr><tr><td><b>ביולוגית</b></td><td>תהליכים ביולוגיים פגומים: גנים, מוח, הורמונים, כימיה</td></tr><tr><td><b>פסיכולוגית</b></td><td>לחץ, מחשבות, וסביבה</td></tr><tr><td><b>עכשווית</b></td><td>שילוב של ביולוגיה וגורמים פסיכו־חברתיים</td></tr></table></div>${def("מודל הפגיעות־לחץ",`${E("Diathesis-stress")} מי שיש לו <b>פגיעות</b> בסיסית (גנטית, למשל) נוטה יותר לפתח הפרעה כשהוא פוגש <b>לחץ</b>. אף אחד מהשניים לבדו לא מספיק.`)}${fig("ds41","מחקר האימוץ של טיינרי: אחוז ההפרעה הפסיכוטית לפי סיכון גנטי וסביבה")}${rem("רק השילוב של סיכון גבוה <b>וגם</b> בית מופרע העלה את הסיכון באופן דרמטי. זו בדיוק פגיעות־לחץ.")}`,q:"q5"}
 ]},
 {id:"t3",icon:"x",title:"הפרעות חרדה",blocks:[
  {h:"פוביה וחרדה חברתית",html:`${def("על מה הנושא",`פחד וחרדה מוגזמים, מתמשכים ומפריעים לתפקוד.<br><b>מה נלמד כאן:</b> פוביה ספציפית · חרדה חברתית · פאניקה · אגורפוביה · חרדה מוכללת`)}${def("פוביה ספציפית",`פחד מוגזם וממושך מאובייקט או מצב: חיות, מעליות, טיסה. כ־<b>12.5%</b> במהלך החיים.`)}<p>איך נוצרת פוביה? <b>התניה קלאסית</b> (נשיכת כלב), <b>למידה מצפייה</b> (בן דוד מפוחד), <b>העברה מילולית</b> (״נחשים מסוכנים״), ו<b>מוכנות</b>: קל יותר לפחד מגירויים שהיו מסוכנים באבולוציה, כמו נחשים ועכבישים.</p>${def("חרדה חברתית",`פחד והימנעות ממצבים שבהם אפשר להיות מוערך לרעה: הרצאה, שיחה, אכילה במסעדה. קצת יותר מ־12%. <b>עכבה התנהגותית</b> (נטייה מולדת להירתע מהלא מוכר) מעלה את הסיכון פי 7. <b>התנהגויות ביטחון</b> (הימנעות ממגע עין) משמרות את ההפרעה, כי לא מאפשרות לגלות שהפחד מוגזם.`)}${ex("סטודנט מספר לד״ר מיכל שהוא מוותר על כל עבודה עם הצגה בכיתה, ומסתכל על הרצפה כשמדבר. זה דפוס של חרדה חברתית, וההימנעות היא מה ששומר עליו.")}`,q:"q7"},
  {h:"פאניקה ואגורפוביה",html:`${def("הפרעת פאניקה",`<b>התקפי פאניקה</b> חוזרים ובלתי צפויים (פחד קיצוני ששיאו תוך 10 דקות), ועוד <b>חודש לפחות</b> של דאגה מהתקפים נוספים. כ־4.7% במהלך החיים, וכ־23% חווים התקף בודד בלי הפרעה.`)}<ul><li><b>גנטיקה</b>: תורשתיות של כ־43%.</li><li><b>האתר הכחול</b> (לוקוס צרולאוס): פעילות לא תקינה של נוראדרנלין.</li><li><b>התניה</b>: ההתקף כתגובה מותנית לתחושות גוף. שכיח פי 3 אצל אנשים עם אסתמה.</li><li><b>קוגניציה</b>: פירוש ״קטסטרופלי״ של תחושות גוף רגילות (״הלב דופק, אני מת״). שינוי הפירוש יעיל כמו תרופות.</li></ul>${def("אגורפוביה",`(״פחד מהשוק״) פחד והימנעות ממצבים שקשה לברוח מהם או לקבל עזרה: תחבורה ציבורית, קניונים, המון. כ־1.4%. רבים עם הפרעת פאניקה מפתחים אותה.`)}`,q:"q9"},
  {h:"חרדה מוכללת",html:`${def("חרדה מוכללת (GAD)",`דאגה מוגזמת, בלתי נשלטת ו״חסרת מטרה״, ברוב הימים, למשך <b>חצי שנה לפחות</b>, עם לפחות שלושה תסמינים (חוסר מנוחה, עייפות, עצבנות). כ־5.7%, ו<b>נשים פי 2</b> מגברים.`)}${ex("אלכס דואג כל הזמן שילדיו יטבעו, שתפרוץ שריפה, ולעבודה של בעלו. כשבעלו מאחר 45 דקות, הוא מתקשר למשטרה.")}<p>הסברים: גנטיקה (תפקיד צנוע); <b>קוגניטיבי</b>: הדאגה היא דרך <b>להימנע</b> מרגשות שליליים חזקים יותר; והתעללות בילדות קשורה חזק ל־GAD בבגרות.</p>`,q:"q11"}
 ]},
 {id:"t4",icon:"cycle",title:"OCD ו־PTSD",blocks:[
  {h:"הפרעה טורדנית־כפייתית והפרעות קשורות",html:`${def("על מה הנושא",`מחשבות חודרניות והתנהגויות חוזרות, ותגובה לטראומה.<br><b>מה נלמד כאן:</b> OCD · דימוי גוף · אגרנות · PTSD · גורמי סיכון והגנה`)}<div class="tw"><table><tr><th>אובססיות (מחשבות)</th><th>קומפולסיות (פעולות)</th></tr><tr><td>זיהום וחיידקים, ספקות, סדר וסימטריה, אחריות מוגזמת</td><td>שטיפת ידיים, ניקיון, בדיקה, סידור, ספירה</td></tr></table></div><p>OCD: כ־2.3% במהלך החיים. <b>גנטיקה</b>: תאומים זהים 57% מול לא־זהים 22%. <b>מוח</b>: פעילות יתר בקורטקס האורביטו־פרונטלי. <b>למידה</b>: התניה קלאסית יוצרת את החרדה, ו<b>חיזוק שלילי</b> (הקומפולסיה מורידה חרדה) משמר אותה.</p>${tiles([["id","הפרעת דימוי גוף","עיסוק מוגזם בפגם במראה שלא קיים או כמעט לא נראה. כ־2.4%","האדם עסוק מאוד בפגם במראה, שאחרים כמעט לא רואים או שלא קיים בכלל. העיסוק הזה פוגע בתפקוד.","מטופל של ד״ר מיכל בודק את האף שלו במראה שעות ביום, ובטוח שכולם מסתכלים עליו."],["data","אגרנות","קושי להיפרד מחפצים בלי קשר לערכם. פעם סימפטום של OCD, היום הפרעה נפרדת (זוכרים את יצחק מלומדת האגרנות?)","קושי חזק להיפרד מחפצים, גם אם אין להם ערך. היום זו הפרעה נפרדת, ולא רק סימפטום של OCD.","מטופלת שומרת עיתונים ישנים עד שאי אפשר להיכנס לחדר."]])}`,q:"q13"},
  {h:"PTSD",html:`<p>PTSD נמצא ב־DSM-5 תחת ״הפרעות טראומה ולחץ״, ולא בחרדה כמו קודם. זו <b>ההפרעה היחידה</b> שבה ה־DSM מציין במפורש את הסיבה: חשיפה ל<b>מוות, פציעה קשה או אלימות מינית</b>, ממשיים או מאיימים. תסמינים: זיכרונות חודרניים, הבזקים, הימנעות, רגש שלילי, ניתוק, עצבנות ובהלה מוגברת, למשך <b>חודש לפחות</b>.</p>${tiles([["x","גורמי סיכון","חומרת הטראומה, <b>חוסר תמיכה מיידית</b>, לחץ נוסף אחרי. טראומה מידי אדם מסוכנת יותר מאסון טבע"],["check","גורמי הגנה","<b>תמיכה חברתית</b> אחרי הטראומה, ומעורבות בקהילה"]])}${def("למידה",`הטראומה היא גירוי בלתי מותנה, ותזכורות הופכות לגירויים מותנים שמעוררים פחד. אצל אנשים עם PTSD ההתניה <b>מהירה</b> יותר וההכחדה <b>איטית</b> יותר.`)}${ex("ותיקי וייטנאם שהרגישו פחות תמיכה כשחזרו הביתה נטו יותר לפתח PTSD.")}`,q:"q15"}
 ]},
 {id:"t5",icon:"moon",title:"הפרעות מצב רוח",blocks:[
  {h:"דיכאון ודו־קוטבית",html:`${def("על מה הנושא",`הפרעות ברגש ובמצב הרוח, ומה גורם להן.<br><b>מה נלמד כאן:</b> דיכאון מז׳ורי · דיכאון מתמשך · דו־קוטבית · סיבות · אובדנות`)}<div class="tw"><table><tr><th>הפרעה</th><th>מה זה</th><th>שכיחות</th></tr><tr><td><b>דיכאון מז׳ורי</b></td><td>מצב רוח ירוד ו/או אובדן הנאה, <b>שבועיים</b> לפחות, ועוד תסמינים (שינה, תיאבון, עייפות, אשמה, ריכוז, מחשבות מוות)</td><td>6.6% בשנה; 16.9% במהלך החיים. נשים כ־20%, גברים כ־13%</td></tr><tr><td><b>דיכאון מתמשך</b></td><td>מצב רוח ירוד רוב היום, <b>שנתיים</b> לפחות</td><td></td></tr><tr><td><b>דו־קוטבית</b></td><td>לפחות <b>אפיזודה מאנית אחת</b> (שבוע לפחות): אופוריה או עצבנות, דיבור מוגבר, תוכניות גרנדיוזיות, הוצאות</td><td>כ־1 מכל 100 במהלך החיים</td></tr></table></div><p>אחרי אפיזודה אחת של דיכאון, ל־50%–60% תהיה שנייה. יש גם ״<b>דפוס עונתי</b>״ (״דכדוך החורף״).</p>`,q:"q17"},
  {h:"הסיבות",html:`<ul><li><b>גנטיקה</b>: תאומים זהים: דיכאון 50% (מול 38%), דו־קוטבית 67% (מול 16%).</li><li><b>מוליכים עצביים</b>: נוראדרנלין וסרוטונין. ליתיום (לדו־קוטבית) חוסם פעילות נוראדרנלין.</li><li><b>קורטיזול</b> גבוה; <b>מוח</b>: אמיגדלה פעילה יותר לגירויים שליליים, קורטקס קדם־מצחי פחות פעיל.</li><li><b>אירועי חיים</b>: בעיקר ״אירועי יציאה״ (מוות, גירושים). פרידה שהצד השני יזם קשורה לשיעור גבוה פי 2 ממוות של אדם אהוב.</li><li><b>גן־סביבה</b>: נשאים של הגרסה ה<b>קצרה</b> של גן 5-HTTLPR פגיעים יותר אחרי לחץ.</li></ul><div class="tw"><table><tr><th>תיאוריה קוגניטיבית</th><th>הרעיון</th></tr><tr><td><b>בק</b></td><td>סכמות דיכאוניות (אובדן, כישלון, דחייה) מופעלות בלחץ, ומטות את הקשב לשלילי</td></tr><tr><td><b>חוסר תקווה</b></td><td>הסבר יציב וכללי לאירועים רעים מוביל לחוסר תקווה. פגיעות קוגניטיבית גבוהה = פי 7</td></tr><tr><td><b>הרהור טורדני</b></td><td>התמקדות חוזרת ופסיבית בתסמינים. נשים נוטות לזה יותר</td></tr></table></div>`,q:"q19"},
  {h:"אובדנות",html:`<ul><li>כ־<b>90%</b> ממי שמתו בהתאבדות סבלו מהפרעה נפשית, לרוב הפרעת מצב רוח.</li><li><b>גברים</b> מתים בהתאבדות פי 4 מנשים ומשתמשים באמצעים קטלניים יותר; נשים מנסות יותר.</li><li>כ־36% מבעלי דו־קוטבית מנסים להתאבד. תלות באלכוהול מעלה את הסיכון פי 10.</li><li>השיא באביב (אפריל–מאי), לא בחורף.</li></ul>${rem("מי שחושב על התאבדות צריך עזרה, ולא גישה לאמצעים קטלניים. בישראל אפשר לפנות לער״ן (1201) או לסה״ר. אם הנושא נוגע בך, כדאי לדבר עם מישהו.")}${ex("סטודנטית מספרת לד״ר מיכל שכבר חודש היא לא נהנית מכלום וישנה רוב היום. מעבר לאבחנה, הצעד הראשון של ד״ר מיכל הוא לשאול ישירות על מחשבות אובדניות, כי שאלה כזו לא מגבירה סיכון.")}`,q:"q21"}
 ]},
 {id:"t6",icon:"brain",title:"סכיזופרניה",blocks:[
  {h:"התסמינים",html:`${def("על מה הנושא",`הפרעה פסיכוטית קשה: מה התסמינים, ומה גורם לה.<br><b>מה נלמד כאן:</b> תסמינים · גנטיקה · מחקרי אימוץ · דופמין · מוח · סביבה`)}<p>כ־<b>1%</b> במהלך החיים, לרוב מאובחנת בשנות ה־20. זו הפרעה <b>פסיכוטית</b>, ו<b>לא</b> ״פיצול אישיות״ (שזו הפרעת זהות דיסוציאטיבית).</p><div class="tw"><table><tr><th>תסמין</th><th>מה זה</th></tr><tr><td><b>הזיות</b></td><td>תפיסה בלי גירוי. שמיעתיות אצל כשני שלישים</td></tr><tr><td><b>מחשבות שווא</b></td><td>רדיפה, גדלות, החדרת מחשבות, גופניות</td></tr><tr><td><b>חשיבה לא מאורגנת</b></td><td>קפיצות בין נושאים, דיבור לא הגיוני</td></tr><tr><td><b>התנהגות לא מאורגנת</b></td><td>כולל <b>קטטוניה</b> (קיפאון או תנוחות מוזרות)</td></tr><tr><td><b>תסמינים שליליים</b></td><td>רגש שטוח, חוסר רצון, מיעוט דיבור, ריחוק חברתי, אנהדוניה</td></tr></table></div>${rem("רק 3%–5% ממעשי האלימות נעשים בידי אנשים עם מחלת נפש קשה, והם בסיכון גבוה פי 10 להיות <b>קורבנות</b> של פשע.")}`,q:"q23"},
  {h:"הסיבות",html:`<ul><li><b>גנטיקה</b>: הורה עם סכיזופרניה מעלה את הסיכון כמעט פי 6, ויותר קרבה = יותר סיכון.</li><li><b>הסטון</b> (1966): 11% מהמאומצים שאמם חולה אובחנו, מול 0 בביקורת.</li><li><b>טיינרי</b> (2004): סיכון גנטי גבוה + בית מופרע = 36.8%; בכל שאר הצירופים כ־5%. תמיכה ב<b>פגיעות־לחץ</b>.</li><li><b>השערת הדופמין</b>: <b>עודף</b> דופמין במערכת הלימבית = הזיות ומחשבות שווא; <b>מחסור</b> בקדם־מצחי = תסמינים שליליים.</li><li><b>מוח</b>: חדרים מוגדלים (אובדן רקמה), פחות חומר אפור באונה המצחית.</li><li><b>סביבה מוקדמת</b>: סיבוכי לידה, שפעת של האם בשליש הראשון.</li><li><b>קנאביס</b>: מחקר שוודי על 45,000 מגויסים: פי 2 ויותר; מעל 50 שימושים פי 6. אבל הוא לא הכרחי ולא מספיק.</li></ul>${def("תסמינים פרודרומליים",`תסמינים פסיכוטיים קלים שקודמים לאבחנה. אם מזהים אותם, אפשר להתערב מוקדם.`)}`,q:"q25"}
 ]},
 {id:"t7",icon:"people",title:"דיסוציאציה, ילדות ואישיות",blocks:[
  {h:"הפרעות דיסוציאטיביות",html:`${def("על מה הנושא",`שלוש קבוצות אחרונות: ניתוק מהעצמי, הפרעות שמתחילות בילדות, והפרעות אישיות.<br><b>מה נלמד כאן:</b> דיסוציאציה · ADHD · אוטיזם · אשכולות אישיות · גבולית · אנטי־חברתית`)}<div class="tw"><table><tr><th>הפרעה</th><th>מה זה</th></tr><tr><td><b>אמנזיה דיסוציאטיבית</b></td><td>לא זוכרים מידע אישי חשוב, לרוב אחרי טראומה</td></tr><tr><td><b>דה־פרסונליזציה / דה־ריאליזציה</b></td><td>תחושת ניתוק מעצמי או מהעולם</td></tr><tr><td><b>הפרעת זהות דיסוציאטיבית</b></td><td>שתי זהויות או יותר, עם פערי זיכרון</td></tr></table></div>${rem("הפרעת זהות דיסוציאטיבית <b>שנויה במחלוקת</b>: יש שחושבים שמזייפים אותה כדי להתחמק מאחריות, והאבחונים עלו מאוד אחרי שהופיעה בתרבות הפופולרית. ובכל זאת, רבים סובלים ממנה באמת.")}`,q:"q27"},
  {h:"הפרעות בילדות",html:`${tiles([["target","ADHD","דפוס מתמשך של קשב לקוי ו/או היפראקטיביות ואימפולסיביות שמפריע לתפקוד. גורמים גנטיים ונוירולוגיים. יכול להימשך לבגרות","הפרעה שמתחילה בילדות ומתבטאת בקושי מתמשך בקשב, ו/או בפעלתנות יתר ובאימפולסיביות, שמפריעים לתפקוד. יש לה רקע גנטי ונוירולוגי, והיא יכולה להימשך גם בבגרות.","סטודנט שמגיע לד״ר מיכל מספר שמאז ומעולם קשה לו לשבת בהרצאה, הוא מאבד דברים ומגיש עבודות ברגע האחרון, וזה פוגע בלימודים."],["people","הספקטרום האוטיסטי","קשיים באינטראקציה ובתקשורת חברתית, ותנועות או תחומי עניין חוזרים. לגנטיקה תפקיד מרכזי","הפרעה התפתחותית עם קשיים בתקשורת חברתית, לצד דפוסים חוזרים של התנהגות או עניין. לגנטיקה יש תפקיד מרכזי.","ילד מתקשה לנהל שיחה עם בני גילו, ומדבר שעות רק על רכבות."]])}${rem("יש שטוענים שחיסון MMR גורם לאוטיזם, אבל <b>הראיות לא תומכות</b> בזה (זוכרים את המחקר שנמשך מפרק 2?).")}${ex("סטודנט מספר לד״ר מיכל שמאז ומתמיד הוא לא מצליח לשבת בהרצאה, מאבד דברים ומתחיל עבודות בלי לסיים. היא תשאל מתי זה התחיל, כי ADHD היא הפרעה התפתחותית שמתחילה בילדות.")}`,q:"q29"},
  {h:"הפרעות אישיות",html:`<p>הפרעת אישיות = סגנון אישיות <b>נוקשה</b> שגורם מצוקה ופגיעה לאדם ולסביבה. ב־DSM-5 יש <b>10</b> הפרעות בשלושה אשכולות:</p><div class="tw"><table><tr><th>אשכול</th><th>הסגנון</th></tr><tr><td><b>A</b></td><td>מוזר, אקסצנטרי</td></tr><tr><td><b>B</b></td><td>אימפולסיבי, דרמטי, רגשי</td></tr><tr><td><b>C</b></td><td>חרד ופוחד</td></tr></table></div>${tiles([["cycle","גבולית (B)","חוסר יציבות במצב רוח, בהתנהגות ובדימוי העצמי; פחד מבדידות; יחסים סוערים; כעס עז. גנטיקה וחוויות ילדות קשות","הפרעת אישיות שבה מצב הרוח, היחסים והדימוי העצמי משתנים בחדות. יש פחד גדול מנטישה.","מטופלת מעריצה חברה ביום אחד, ולמחרת בטוחה שהיא שונאת אותה."],["x","אנטי־חברתית (B)","התעלמות מזכויות אחרים, הטעיה, אימפולסיביות, מעט או אין אשמה. גנטיקה וחיברות, וכנראה חוויה רגשית שונה","הפרעת אישיות שבה האדם מתעלם מזכויות של אחרים, משקר ופוגע, ולא מרגיש אשמה.","אדם שמרמה שוב ושוב חברים כדי להשיג כסף, ולא מתחרט."]])}`,q:"q31"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"מה הפרק אומר על התנהגות חריגה?","a":"חריגות לבדה לא מספיקה כדי לקבוע שיש הפרעה","w":["כל התנהגות חריגה היא הפרעה פסיכולוגית מובהקת","הפרה של נורמות חברתיות היא תמיד הפרעה","התנהגות חריגה מעידה תמיד על מחלה ביולוגית"],"e":"אדם יכול להיות חריג ובריא לגמרי. צריך גם תפקוד לקוי, פגיעה משמעותית, ושזו לא תגובה צפויה תרבותית."},{"q":"מה אומרת הגישה של ״תפקוד לקוי מזיק״?","a":"מנגנון פנימי לא ממלא את תפקידו הטבעי, וזה גורם נזק","w":["כל רגש שלילי חזק הוא הפרעה, גם אם הוא חולף מהר ולא פוגע","הפרעה קיימת רק כשיש נזק מוחי שנראה בסריקה","הפרעה נקבעת לפי מה שרוב החברה חושבת"],"e":"לפי הגישה, צריך גם כשל של מנגנון וגם נזק שנובע ממנו."}]},"q2":{"t":"t1","v":[{"q":"איזה מבין אלה לא נחשב הפרעה לפי ההגדרה של האגודה האמריקאית?","a":"אבל אחרי מוות של אדם קרוב","w":["מצוקה קשה שפוגעת בעבודה ובלימודים בלי סיבה","תפקוד לקוי פסיכולוגי עם פגיעה משמעותית","פחד מוגזם שמונע יציאה מהבית"],"e":"תגובה צפויה ומקובלת תרבותית לאירוע, כמו אבל, לא נחשבת הפרעה."}]},"q3":{"t":"t1","v":[{"q":"כמה הפרעות כולל ה־DSM-5?","a":"237","w":["52","16","יותר מ־1,000"],"e":"ה־DSM-5 (2013) כולל 237 הפרעות. הראשון יצא ב־1952."},{"q":"מהי תחלואה נלווית?","a":"יותר מהפרעה אחת אצל אותו אדם","w":["הפרעה שעוברת בתורשה במשפחה","הפרעה שמופיעה רק בילדות","הפרעה בלי אבחנה רשמית"],"e":"תחלואה נלווית היא מצב שבו לאדם יש כמה הפרעות בו בזמן."}]},"q4":{"t":"t1","v":[{"q":"מה היתרון של ה־DSM-5 לפי הפרק?","a":"קריטריונים מפורשים, שמתאימים לטיפול ולמחקר","w":["הוא כולל מעט מאוד הפרעות, ולכן קל ללמוד אותו","הוא מתבסס רק על נקודת מבט ביולוגית","הוא לא השתנה מאז 1952"],"e":"הקריטריונים המפורשים עוזרים גם לקלינאים וגם לחוקרים. הביקורת היא שמספר ההפרעות הולך וגדל."}]},"q5":{"t":"t2","v":[{"q":"מה טוען מודל הפגיעות־לחץ?","a":"פגיעות בסיסית יחד עם לחץ מובילה להפרעה","w":["לחץ לבדו מספיק כדי לגרום לכל הפרעה","גנים לבדם קובעים אם תהיה הפרעה","הפרעות נגרמות מכוחות על־טבעיים"],"e":"אף אחד מהשניים לבדו לא מספיק. רק השילוב מעלה את הסיכון באופן משמעותי."},{"q":"במחקר של טיינרי, מי היו בסיכון הגבוה ביותר להפרעה פסיכוטית?","a":"סיכון גנטי גבוה שגדלו בבית מופרע","w":["סיכון גנטי גבוה שגדלו בבית בריא","סיכון גנטי נמוך שגדלו בבית מופרע","כל הקבוצות היו באותו סיכון"],"e":"36.8% בשילוב של סיכון גבוה ובית מופרע, וכ־5% בכל שאר הצירופים."}]},"q6":{"t":"t2","v":[{"q":"מה מאפיין את נקודת המבט העכשווית על הפרעות?","a":"שילוב של ביולוגיה וגורמים פסיכו־חברתיים","w":["הסבר ביולוגי בלבד, בלי שום השפעה של סביבה","הסבר סביבתי בלבד, בלי גנים","הסבר על־טבעי, כמו בעבר"],"e":"היום רואים בהפרעות תוצאה של ביולוגיה וגם של לחץ, מחשבות וסביבה."}]},"q7":{"t":"t3","v":[{"q":"מה זה ״מוכנות״ בהקשר של פוביות?","a":"קל יותר לפחד מגירויים שהיו מסוכנים באבולוציה","w":["מי שמוכן נפשית מראש לא יפתח פוביה אף פעם","פוביה מופיעה רק אחרי הכנה ארוכה","ילדים מוכנים יותר לפחד ממבוגרים"],"e":"לכן פוביות מנחשים ועכבישים נפוצות יותר מפוביות משקעים חשמליים."},{"q":"איך ״התנהגויות ביטחון״ משמרות חרדה חברתית?","a":"הן מונעות לגלות שהפחד מוגזם","w":["הן מגבירות את הביטחון העצמי בהדרגה","הן גורמות לאדם להיחשף יותר","הן מפחיתות את הסיכון הגנטי"],"e":"למשל הימנעות ממגע עין: האדם לא מגלה שאיש לא שופט אותו, והאמונה השלילית נשמרת."}]},"q8":{"t":"t3","v":[{"q":"איזה מבין אלה לא מופיע בפרק כדרך שבה פוביה נוצרת?","a":"חשיפה הדרגתית לגירוי","w":["התניה קלאסית אחרי חוויה רעה","למידה מצפייה במישהו מפחד","העברה מילולית של מידע מפחיד"],"e":"חשיפה הדרגתית היא דרך לטפל בפוביה, לא דרך שבה היא נוצרת."},{"q":"עכבה התנהגותית מעלה את הסיכון לחרדה חברתית בערך:","a":"פי 7","w":["פי 2","בכלל לא","פי 100"],"e":"הנטייה המולדת להירתע מהלא מוכר קשורה לעלייה של יותר מפי 7 בסיכון."}]},"q9":{"t":"t3","v":[{"q":"מה צריך כדי לאבחן הפרעת פאניקה?","a":"התקפים חוזרים ובלתי צפויים, ועוד חודש של דאגה מהם","w":["התקף פאניקה אחד, לא משנה מה קרה אחריו","פחד מתמשך ממקום מסוים במשך שנה שלמה ויותר","דאגה כללית ברוב הימים לחצי שנה"],"e":"הרבה אנשים חווים התקף בודד. הפרעה דורשת התקפים חוזרים ודאגה מתמשכת."},{"q":"מה ההסבר הקוגניטיבי לפאניקה?","a":"פירוש קטסטרופלי של תחושות גוף רגילות","w":["מחסור בנוראדרנלין בכל אזורי המוח","חשיפה לגירוי מפחיד ספציפי","זיכרון של טראומה מהילדות"],"e":"״הלב דופק, אני עומד למות״. שינוי הפירוש יעיל כמו תרופות."}]},"q10":{"t":"t3","v":[{"q":"מהי אגורפוביה?","a":"פחד ממצבים שקשה לברוח מהם או לקבל בהם עזרה","w":["פחד מאנשים זרים בשיחה פנים אל פנים","פחד מבעלי חיים מסוימים","פחד מגבהים בלבד"],"e":"למשל תחבורה ציבורית, קניונים ומקומות הומים. רבים עם הפרעת פאניקה מפתחים אותה."}]},"q11":{"t":"t3","v":[{"q":"מה מאפיין חרדה מוכללת?","a":"דאגה מוגזמת ובלתי נשלטת ברוב הימים, חצי שנה לפחות","w":["פחד מוגזם מאובייקט או ממצב מסוים, כמו טיסה","התקפי פחד פתאומיים ששיאם תוך 10 דקות","מחשבות חודרניות ופעולות חוזרות"],"e":"הדאגה של GAD כללית ומתמשכת. אלכס דואג לילדים, לשריפות ולעבודה של בעלו."},{"q":"לפי התיאוריה הקוגניטיבית, מה התפקיד של הדאגה ב־GAD?","a":"דרך להימנע מרגשות שליליים חזקים יותר","w":["דרך לפתור בעיות בצורה יעילה ומהירה","סימן לאינטליגנציה גבוהה","תוצאה של מחסור בשינה בלבד"],"e":"הדאגה ״מגינה״ מרגש חזק יותר, ואולי נובעת מטראומה מוקדמת."}]},"q12":{"t":"t3","v":[{"q":"מי נוטה יותר לפתח חרדה מוכללת?","a":"נשים, פי 2 מגברים","w":["גברים, פי 2 מנשים","אין הבדל בין המינים","רק ילדים"],"e":"נשים מפתחות GAD פי 2 מגברים. השכיחות במהלך החיים כ־5.7%."}]},"q13":{"t":"t4","v":[{"q":"איך חיזוק שלילי משמר את OCD?","a":"הקומפולסיה מורידה את החרדה, ולכן חוזרת","w":["האדם מקבל פרס חיצוני על כל שטיפת ידיים","הסביבה מענישה את הקומפולסיה","החרדה עולה אחרי כל קומפולסיה"],"e":"הורדת החרדה (מורידים משהו לא נעים) מחזקת את הקומפולסיה. התניה קלאסית יוצרת את החרדה מלכתחילה."},{"q":"איזה אזור במוח פעיל מדי ב־OCD כשמגרים את האדם?","a":"הקורטקס האורביטו־פרונטלי","w":["המוחון","האונה העורפית","ההיפוקמפוס והאמיגדלה"],"e":"נמצאה פעילות יתר בקורטקס האורביטו־פרונטלי וקישוריות גבוהה במעגל של OCD."}]},"q14":{"t":"t4","v":[{"q":"מה מעמדה של אגרנות ב־DSM-5?","a":"הפרעה נפרדת, ולא רק סימפטום של OCD","w":["סימפטום של OCD בלבד, ולא הפרעה","סוג של הפרעת אישיות","היא לא מופיעה ב־DSM-5"],"e":"פעם היא נחשבה סימפטום של OCD, והיום היא הפרעה עצמאית בקבוצת ההפרעות הקשורות."},{"q":"מהי הפרעת דימוי גוף?","a":"עיסוק מוגזם בפגם במראה שכמעט לא נראה","w":["פחד ל "],"e":"״זה תמיד יהיה ככה, ובכל תחום״ מוביל לחוסר תקווה. בעלי פגיעות כזו היו בסיכון פי 7."},{"q":"מהו הרהור טורדני?","a":"התמקדות חוזרת ופסיבית בתסמינים","w":["חשיבה יצירתית ופעילה על פתרונות","זיכרון חוזר של טראומה","דאגה כללית לעתיד"],"e":"הרהור טורדני קשור ליותר דיכאון ולדיכאון ממושך יותר, ונשים נוטות אליו יותר."}]},"q20":{"t":"t5","v":[{"q":"מה מצאו לגבי גן 5-HTTLPR?","a":"נשאי הגרסה הקצרה פגיעים יותר לדיכאון אחרי לחץ","w":["הגן לבדו גורם לדיכאון, בלי שום קשר ללחץ","הגרסה הקצרה מגינה מפני דיכאון","לא נמצא קשר לדיכאון"],"e":"זו אינטראקציה בין גן לסביבה: הגן מגביר את ההשפעה של הלחץ."},{"q":"מה שיעור ההתאמה בדו־קוטבית בין תאומים זהים?","a":"כ־67%","w":["כ־16%","כ־100%","כ־5%"],"e":"67% בזהים מול 16% בלא־זהים. כלומר יש מרכיב גנטי חזק, אבל לא מוחלט."}]},"q21":{"t":"t5","v":[{"q":"מי מתים בהתאבדות בשיעור גבוה יותר?","a":"גברים, פי 4 מנשים","w":["נשים, פי 4 מגברים","אין הבדל","רק בני נוער"],"e":"גברים משתמשים באמצעים קטלניים יותר. נשים מנסות יותר."},{"q":"כמה ממי שמתו בהתאבדות סבלו מהפרעה נפשית?","a":"כ־90%","w":["כ־10%","כ־50%","כמעט אף אחד"],"e":"לרוב מדובר בהפרעת מצב רוח. לכן זיהוי וטיפול חשובים מאוד."}]},"q22":{"t":"t5","v":[{"q":"מתי שיעורי ההתאבדות בשיאם לפי הפרק?","a":"באביב","w":["בחורף","בחגים","בקיץ בלבד"],"e":"השיא באפריל–מאי, והשפל בדרך כלל בחורף."}]},"q23":{"t":"t6","v":[{"q":"מה נכון לגבי סכיזופרניה?","a":"זו הפרעה פסיכוטית, לא ״פיצול אישיות״","w":["זה סוג של הפרעת זהות דיסוציאטיבית","היא מאובחנת בדרך כלל בגיל 60","היא נפוצה אצל כחמישית מהאוכלוסייה"],"e":"סכיזופרניה פוגעת בקשר עם המציאות. ״פיצול אישיות״ הוא הפרעת זהות דיסוציאטיבית. השכיחות כ־1%."},{"q":"איזה מבין אלה הוא תסמין שלילי?","a":"רגש שטוח","w":["הזיות שמיעה","מחשבות שווא של רדיפה","דיבור לא מאורגן"],"e":"תסמינים שליליים הם ״חסר״: רגש שטוח, חוסר רצון, מיעוט דיבור. הזיות ומחשבות שווא הם ״עודף״."}]},"q24":{"t":"t6","v":[{"q":"מה הפרק אומר על אלימות ומחלת נפש קשה?","a":"הם בסיכון גבוה יותר להיות קורבנות","w":["רוב מעשי האלימות בחברה נעשים בידיהם","הם תמיד מסוכנים לסביבה","אין שום נתון על הנושא"],"e" const H={"h1":{"t":"t1","v":[{"q":"אישה בוכה ולא מצליחה להתרכז בעבודה במשך שבועיים אחרי מות אביה. לפי ההגדרה בספר, האם זו הפרעה?","a":"לא, כי זו תגובה צפויה ומקובלת לאירוע","w":["כן, כי יש פגיעה משמעותית בתפקוד","כן, כי התסמינים נמשכים יותר משבוע","לא, כי היא לא פנתה לטיפול"],"e":"שלושת התנאים: תפקוד לקוי, פגיעה משמעותית, ולא תגובה צפויה. אבל הוא תגובה צפויה."},{"q":"לפי גישת ״תפקוד לקוי מזיק״, מה הופך מצב להפרעה?","a":"מנגנון פנימי לא מתפקד, וזה גורם נזק","w":["ההתנהגות נדירה באוכלוסייה ושונה מהרוב","האדם מרגיש עצוב או לחוץ באופן זמני","החברה לא מקבלת את ההתנהגות של האדם"],"e":"חריגות לבדה לא מספיקה, כמו שיער ג׳ינג׳י. צריך גם תפקוד לקוי וגם נזק."}]},"h2":{"t":"t2","v":[{"q":"במחקר של טיינרי, מאומצים עם סיכון גנטי גבוה שגדלו בבית מופרע פיתחו הפרעה פסיכוטית ב־36.8%, ובשאר הצירופים כ־5%. במה זה תומך?","a":"מודל פגיעות־לחץ: הגנים והסביבה יחד","w":["הגנים לבדם קובעים את הסיכון להפרעה","הסביבה לבדה קובעת את הסיכון להפרעה","אין קשר בין הגנים לבין ההפרעה"],"e":"סיכון גנטי בבית בריא, או בית מופרע בלי סיכון גנטי, לא העלו את השכיחות. רק השילוב."}]},"h3":{"t":"t3","v":[{"q":"סטודנט מוותר על כל מצגת בכיתה, ובשיחות מסתכל על הרצפה כדי ״לא להיתפס״. מה ההתנהגויות האלה עושות לחרדה, לפי הספר?","a":"מפחיתות ברגע, אבל משמרות לאורך זמן","w":["הן מעלימות אותה לגמרי, ולכן הן מומלצות","הן גורמות לה, כי הן יוצרות מצבים מביכים","הן לא קשורות לחרדה, אלא לביישנות מולדת"],"e":"אלה התנהגויות ביטחון: הן מונעות מהאדם לגלות שהמצב לא באמת מסוכן."}]},"h4":{"t":"t3","v":[{"q":"אישה חווה פתאום דפיקות לב חזקות, ובטוחה שזה התקף לב. זה מגביר את הפחד, ואז את הדפיקות. מה מתאר הספר כגורם בהפרעת פאניקה?","a":"פירוש קטסטרופלי של תחושות","w":["עכבה התנהגותית מולדת","חיזוק שלילי של קומפולסיה","הרהור טורדני על העבר"],"e":"שינוי הפירוש של התחושות יעיל בהפחתת התקפי פאניקה כמו תרופות."}]},"h5":{"t":"t3","v":[{"q":"אדם מודאג כל הזמן מעבודה, כסף, בריאות והילדים, והדאגה לא נשלטת ונמשכת חודשים. איזו הפרעה הכי מתאימה?","a":"חרדה מוכללת","w":["פוביה ספציפית","חרדה חברתית","הפרעת פאניקה"],"e":"חרדה מוכללת היא דאגה מוגזמת ב const SUM=`<h2>סיכום: Spielman פרק 15 - הפרעות פסיכולוגיות</h2>
<div class="key"><b>למה הפרק הזה חשוב?</b> הספר פותח במקרה קשה: אדם שרצח 12 בני אדם, ושהיה לו עבר של מחשבות שגלי רדיו שולטים בו וקולות בראש. אבל הספר מיד מדגיש: לפי המחקר, הפרעות נפשיות <b>אינן תנאי הכרחי ואינן תנאי מספיק</b> לאלימות. הגורמים העיקריים לאלימות הם גיל צעיר, מגדר ומצב חברתי־כלכלי. כבר מההתחלה הפרק מלמד להיזהר מסטיגמות.<br><br>
<b>השאלה של הפרק במשפט אחד:</b> מתי התנהגות או רגש הם ״הפרעה״, איך מאבחנים, מאיפה הפרעות באות, ומה מאפיין את הקבוצות העיקריות?<br><br>
<b>הפרק בנוי משני חלקים:</b><br>
① <b>הבסיס</b> (סעיפים 1–2): מה זו הפרעה, איך מסווגים, ומאיפה היא באה.<br>
② <b>סיור בהפרעות</b> (סעיפים 3–7): חרדה, OCD ו־PTSD, מצב רוח, סכיזופרניה, ולבסוף דיסוציאציה, ילדות ואישיות. לכל אחת: מה היא, כמה היא שכיחה, ומה ידוע על הסיבות.<br>
<b>בשיעור:</b> שבועות 10–11.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>שכיחות לאורך החיים</b></td><td>כמה אחוז מהאנשים יחוו את ההפרעה מתישהו בחיים.</td></tr>
<tr><td><b>תחלואה נלווית</b></td><td>כשלאדם יש יותר מהפרעה אחת בו־זמנית.</td></tr>
<tr><td><b>התאמה בין תאומים</b></td><td>אם לתאום אחד יש הפרעה, מה הסיכוי שגם לשני. גבוה יותר אצל זהים = יש מרכיב גנטי.</td></tr>
<tr><td><b>פסיכוטי</b></td><td>מצב שבו האדם מאבד קשר עם המציאות (הזיות, מחשבות שווא).</td></tr>
<tr><td><b>אפיזודה</b></td><td>תקופה מוגדרת שבה התסמינים מופיעים.</td></tr></table></div>

<div class="ex"><b>הדוגמה שתלווה אותנו: ד״ר מיכל במרכז הייעוץ</b> (דמות בדויה להמחשה). פסיכולוגית במרכז הייעוץ לסטודנטים. בכל נושא נפגוש סטודנט אחר שמגיע אליה, ונראה איך היא חושבת על מה שהוא מתאר.</div>

<h3>1. מהי הפרעה, ואיך מאבחנים</h3>
<p>לפני שמדברים על הפרעות מסוימות, צריך להחליט מה בכלל נחשב הפרעה. זה קשה יותר ממה שנשמע.</p>
<div class="ex"><b>חריגות לבדה לא מספיקה.</b> <b>דוגמה מהספר:</b> שיער ג׳ינג׳י נדיר, אבל אף אחד לא חושב שזו הפרעה.<br>
<b>״תפקוד לקוי מזיק״</b> = הפרעה היא מצב שבו מנגנון פנימי לא ממלא את התפקיד שלו, <b>וזה גורם נזק</b> לאדם.<br>
<b>ההגדרה הרשמית</b> דורשת שלושה תנאים:<br>
① <b>תפקוד לקוי</b> במחשבות, ברגשות או בהתנהגות.<br>
② <b>מצוקה או פגיעה משמעותית</b> בחיים (עבודה, לימודים, קשרים).<br>
③ <b>לא תגובה צפויה</b> או מקובלת תרבותית לאירוע. <b>דוגמה:</b> אבל אחרי מוות של אדם קרוב הוא תגובה צפויה.<br>
<b>השאלה שעוזרת:</b> ״האם יש תפקוד לקוי, <b>וגם</b> פגיעה משמעותית, <b>וגם</b> זו לא תגובה צפויה?״ רק אם שלושתם, זו הפרעה.<br>
<b>אצל ד״ר מיכל:</b> סטודנט שעצוב שבוע אחרי פרידה כנראה לא עומד בתנאים.</div>
<div class="ex"><b>ה־DSM-5</b> (2013) = המדריך האמריקאי לאבחון. המהדורה הראשונה יצאה ב־1952. ב־DSM-5 יש 237 הפרעות, עם קריטריונים מפורשים לכל אחת.<br>
<b>למה צריך סיווג?</b> כדי שאנשי מקצוע ידברו באותה שפה, יאבחנו באופן עקבי, ויוכלו לחקור.</div>
<div class="ex"><b>מאיפה הפרעות באות? נקודות מבט:</b><br>
• בעבר: <b>על־טבעית</b> (״דיבוק״, כוחות רעים).<br>
• היום: <b>ביולוגית</b> (גנים, מוח, נוירוטרנסמיטרים) ו<b>פסיכולוגית</b> (לחץ, מחשבות, למידה), ובדרך כלל <b>שילוב</b>.<br>
<b>מודל פגיעות־לחץ</b> = נטייה בסיסית (למשל גנטית) + לחץ בחיים = הפרעה. אף אחד מהם לבד לא מספיק.<br>
<b>המחקר של טיינרי:</b> מאומצים שהאם הביולוגית שלהם חלתה בסכיזופרניה (סיכון גנטי), <b>וגם</b> גדלו בבית מופרע: 36.8% פיתחו הפרעה פסיכוטית. בכל שאר הצירופים, כ־5% בלבד. <b>הלקח:</b> הגנים והסביבה יחד.</div>

<h3>2. הפרעות חרדה</h3>
<p>מתחילים בקבוצה הנפוצה. חרדה היא רגש רגיל ומועיל. היא נעשית הפרעה כשהיא מוגזמת, נמשכת, ופוגעת בחיים.</p>
<div class="tw"><table><tr><th>הפרעה</th><th>מה זה</th><th>שכיחות (חיים)</th></tr>
<tr><td><b>פוביה ספציפית</b></td><td>פחד עז ומתמשך מאובייקט או מצב (גבהים, זריקות)</td><td>כ־12.5%</td></tr>
<tr><td><b>חרדה חברתית</b></td><td>פחד ממצבים שבהם אחרים עלולים לשפוט אותנו לרעה</td><td>קצת יותר מ־12%</td></tr>
<tr><td><b>הפרעת פאניקה</b></td><td>התקפי פאניקה חוזרים ולא צפויים, ודאגה מתמשכת מההתקף הבא</td><td>כ־4.7%</td></tr>
<tr><td><b>אגורפוביה</b></td><td>פחד ממקומות שקשה לברוח מהם (חניונים, קניות, קהל)</td><td>כ־1.4%</td></tr>
<tr><td><b>חרדה מוכללת</b></td><td>דאגה מוגזמת ולא נשלטת בנושאים רבים, ברוב הימים</td><td>כ־5.7%</td></tr></table></div>
<div class="ex"><b>מאיפה זה בא?</b><br>
• <b>פוביה</b> יכולה להיווצר בהתניה, בצפייה באחרים, או ממידע ששומעים.<br>
• <b>חרדה חברתית</b>: גורם סיכון מרכזי הוא <b>עכבה התנהגותית</b> (נטייה מולדת להירתע ממצבים חדשים), שקשורה לסיכון גבוה <b>פי 7 ויותר</b>. מה ששומר על החרדה הם <b>התנהגויות ביטחון</b>, שמפחיתות חרדה ברגע, אבל מונעות לגלות שהמצב לא מסוכן. <b>אצל ד״ר מיכל:</b> סטודנט שמוותר על כל הצגה בכיתה, ובשיחה מסתכל על הרצפה.<br>
• <b>פאניקה</b>: התורשתיות כ־43%. ו<b>פירוש קטסטרופלי</b> של תחושות בגוף (״דפיקות הלב = התקף לב״) מזין אותה. שינוי הפירוש יעיל כמו תרופות.<br>
• <b>חרדה מוכללת</b>: הדוגמה מהספר היא אלכס, שבעלו איחר 45 דקות ממשחק כדורגל, ואלכס כבר היה בטוח שקרה אסון.<br>
<b>מגדר:</b> הפרעות חרדה שכיחות יותר אצל נשים.</div>

<h3>3. OCD ו־PTSD</h3>
<p>שתי הפרעות שבעבר נחשבו הפרעות חרדה, והיום הן בקבוצות נפרדות.</p>
<div class="ex"><b>OCD</b> (הפרעה טורדנית־כפייתית, כ־2.3%):<br>
• <b>אובססיות</b> = מחשבות חודרניות שגורמות למצוקה (לכלוך, ספק, סדר).<br>
• <b>קומפולסיות</b> = פעולות חוזרות שנועדו להפחית את המצוקה (שטיפה, בדיקה, ספירה).<br>
<b>סיבות:</b> מרכיב גנטי (התאמה של כ־57% בתאומים זהים מול 22% בלא זהים), וקורטקס אורביטו־פרונטלי פעיל מדי.<br>
<b>למה הקומפולסיה נשמרת?</b> <b>חיזוק שלילי</b>: הפעולה מורידה את החרדה, ולכן חוזרים עליה.<br>
<b>הפרעות קרובות:</b> <b>הפרעת דימוי גוף</b> (עיסוק מוגזם בפגם קטן או מדומה במראה, כ־2.4%), ו<b>הפרעת אגרנות</b>, שהיום היא הפרעה נפרדת.</div>
<div class="ex"><b>PTSD</b> (הפרעת דחק פוסט־טראומטית):<br>
• <b>ההפרעה היחידה</b> ב־DSM שבה <b>הסיבה</b> מוגדרת: חשיפה לטראומה קיצונית (מוות, פציעה חמורה, תקיפה מינית).<br>
• תסמינים: זיכרונות חודרניים והבזקים, הימנעות, שינויים שליליים במחשבות וברגשות, ודריכות ובהלה, למשך חודש לפחות.<br>
• <b>מה מנבא PTSD:</b> חומרת הטראומה, <b>חוסר תמיכה חברתית</b> מיד אחרי, ולחץ נוסף בהמשך.<br>
• הספר מזכיר גם הפרעה חדשה ב־DSM: <b>אבל ממושך</b>.</div>

<h3>4. הפרעות מצב רוח</h3>
<p>עכשיו לקבוצה שמכונה ״הצינון של ההפרעות הנפשיות״, בגלל השכיחות שלה.</p>
<div class="tw"><table><tr><th>הפרעה</th><th>מה צריך</th><th>שכיחות</th></tr>
<tr><td><b>דיכאון מז׳ורי</b></td><td>מצב רוח ירוד או אובדן הנאה, לפחות <b>שבועיים</b></td><td>6.6% בשנה; 16.9% בחיים (נשים כ־20%, גברים כ־13%)</td></tr>
<tr><td><b>דיכאון מתמשך</b></td><td>מצב רוח ירוד רוב הזמן, לפחות <b>שנתיים</b></td><td>-</td></tr>
<tr><td><b>דו־קוטבית</b></td><td>לפחות <b>אפיזודה מאנית אחת</b> (שבוע): אנרגיה מוגברת, פחות שינה, דיבור מהיר</td><td>כ־1%</td></tr></table></div>
<div class="ex"><b>סיבות ביולוגיות:</b> גנטיקה (בדו־קוטבית: 67% בזהים מול 16% בלא זהים), נוראדרנלין וסרוטונין, עודף קורטיזול, אמיגדלה פעילה וקורטקס קדם־מצחי פחות פעיל. <b>גן 5-HTTLPR</b>: גרסה מסוימת שלו, יחד עם אירועי חיים קשים, מעלה סיכון לדיכאון. ו<b>״אירועי יציאה״</b> (אדם חשוב עוזב או מת) קודמים לעתים קרובות לדיכאון.<br>
<b>סיבות קוגניטיביות:</b><br>
• <b>בק</b>: סכמות דיכאוניות, תבניות חשיבה שליליות על עצמי, על העולם ועל העתיד.<br>
• <b>חוסר תקווה</b>: הסבר <b>יציב</b> (״תמיד יהיה כך״) ו<b>כללי</b> (״בכל דבר״) לאירועים רעים. מי שחשב כך היה בסיכון גבוה <b>פי 7</b> לפתח דיכאון.<br>
• <b>הרהור טורדני</b>: לחשוב שוב ושוב על הרגש הרע. נפוץ יותר אצל נשים.</div>
<div class="ex"><b>אובדנות</b> (לפי הספר):<br>
• כ־<b>90%</b> ממי שמתו בהתאבדות היה להם לפחות אבחנה אחת של הפרעה נפשית, בעיקר הפרעת מצב רוח.<br>
• גברים מתים בהתאבדות <b>פי 4</b> מנשים.<br>
• כ־<b>36%</b> מבעלי הפרעה דו־קוטבית מנסים להתאבד לפחות פעם אחת.<br>
• בניגוד לאמונה הרווחת, השיא הוא <b>באביב</b>, לא בחגים.<br>
<b>אצל ד״ר מיכל:</b> כשסטודנטית מספרת שכבר חודש היא לא נהנית מכלום, היא שואלת ישירות על מחשבות אובדניות.<br>
<span style="color:#666">(מידע מעשי, לא מהספר: בישראל אפשר לפנות לער״ן בטלפון 1201.)</span></div>

<h3>5. סכיזופרניה</h3>
<p>הפרעה פסיכוטית, שכיחה בכ־1% ומתחילה בדרך כלל בשנות ה־20. הספר מדגיש מההתחלה: היא <b>לא</b> ״פיצול אישיות״.</p>
<div class="ex"><b>תסמינים:</b><br>
• <b>הזיות</b>: חוויות חושיות בלי גירוי (בעיקר שמיעת קולות).<br>
• <b>מחשבות שווא</b>: אמונות שגויות ועקשניות (״שולטים בי בגלי רדיו״).<br>
• <b>חשיבה ודיבור לא מאורגנים</b>, והתנהגות לא מאורגנת (כולל קטטוניה).<br>
• <b>תסמינים שליליים</b>: <b>חסר</b> של משהו רגיל, כמו רגש שטוח או חוסר רצון.<br>
<b>השאלה שעוזרת:</b> ״האם יש כאן משהו <b>נוסף</b> (קולות, אמונות) או משהו <b>חסר</b> (רגש, מוטיבציה)?״ נוסף = חיובי, חסר = שלילי.</div>
<div class="ex"><b>סיבות:</b><br>
• <b>גנטיקה</b>: הסיכון גבוה כמעט <b>פי 6</b> אם להורה יש סכיזופרניה. ומחקר טיינרי מראה פגיעות־לחץ.<br>
• <b>השערת הדופמין</b>: עודף פעילות דופמין קשור לתסמינים.<br>
• <b>המוח</b>: חדרי מוח מוגדלים.<br>
• <b>גורמים בהיריון ובלידה</b>: למשל לחץ או אבל של האם בהיריון.<br>
• <b>מריחואנה</b>: קשורה לסיכון גבוה יותר.<br>
<b>תסמינים פרודרומליים</b> = סימנים מוקדמים לפני ההתפרצות, שמאפשרים התערבות מוקדמת.<br>
<b>אלימות וסטיגמה:</b> רק 3%–5% ממעשי האלימות נעשים בידי אנשים עם מחלת נפש קשה, והם עצמם בסיכון <b>פי 10</b> להיות קורבנות של פשע.</div>

<h3>6. דיסוציאציה, ילדות ואישיות</h3>
<p>הסיור מסתיים בשלוש קבוצות אחרונות.</p>
<div class="ex"><b>הפרעות דיסוציאטיביות</b> = ״ניתוק״ בזיכרון, בזהות או בתחושת המציאות:<br>
• <b>אמנזיה דיסוציאטיבית</b>: חוסר יכולת לזכור מידע אישי חשוב, בדרך כלל אחרי טראומה.<br>
• <b>דה־פרסונליזציה</b> (ניתוק מעצמי) / <b>דה־ריאליזציה</b> (העולם נראה לא אמיתי).<br>
• <b>הפרעת זהות דיסוציאטיבית</b>: שתי זהויות או יותר. שנויה במחלוקת, ויש דיון על תפקיד הגורמים החברתיים בה.</div>
<div class="ex"><b>הפרעות שמתחילות בילדות:</b><br>
• <b>ADHD</b>: קשב ו/או היפראקטיביות ואימפולסיביות. יכולה להימשך לבגרות. <b>אצל ד״ר מיכל:</b> כשסטודנט מתלונן על קשיי ריכוז, היא שואלת מתי זה התחיל.<br>
• <b>ספקטרום האוטיזם</b>: קשיים בתקשורת חברתית, ותחומי עניין והתנהגויות חוזרים. מרכיב גנטי חזק (התאמה של 60%–90% בתאומים זהים). המחקר שטען שחיסון MMR גורם לאוטיזם <b>הופרך</b>.</div>
<div class="ex"><b>הפרעות אישיות:</b> דפוסים קבועים ונוקשים של חשיבה והתנהגות, שפוגעים ביחסים ובחיים. ב־DSM-5 יש <b>10</b>, בשלושה <b>אשכולות</b>:<br>
<b>A</b> = מוזר ותמהוני. <b>B</b> = דרמטי, רגשי ולא יציב. <b>C</b> = חרד ומפוחד.<br>
<b>שתי הפרעות שהספר מפרט, שתיהן באשכול B:</b><br>
• <b>גבולית</b> (כ־1.4%): חוסר יציבות ברגש, בדימוי העצמי וביחסים, ופחד מנטישה.<br>
• <b>אנטי־חברתית</b>: התעלמות מזכויות של אחרים, ומעט אשמה.</div>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. הפרעה = <b>תפקוד לקוי</b> + <b>פגיעה משמעותית</b> + <b>לא תגובה צפויה</b>. מאבחנים לפי ה־DSM-5.<br>
2. ההסבר המקובל הוא <b>פגיעות־לחץ</b>: נטייה ביולוגית ולחץ יחד (מחקר טיינרי).<br>
3. <b>חרדה</b>: פוביה, חברתית, פאניקה, אגורפוביה, מוכללת. <b>OCD</b> נשמר בחיזוק שלילי. <b>PTSD</b> היא היחידה עם סיבה מוגדרת.<br>
4. <b>מצב רוח</b>: דיכאון (שבועיים), מתמשך (שנתיים), דו־קוטבית (אפיזודה מאנית אחת), עם סיבות ביולוגיות וקוגניטיביות. <b>סכיזופרניה</b>: תסמינים חיוביים ושליליים, גנטיקה, דופמין וסביבה.<br>
5. <b>דיסוציאציה</b>, <b>ADHD ואוטיזם</b>, ו<b>הפרעות אישיות</b> בשלושה אשכולות. ובכל הפרק: אנשים עם הפרעות הם לרוב <b>לא</b> אלימים.<br><br>
<b>מה צריך לדעת לעשות במבחן (לפי מטרות הספר):</b><br>
• להסביר מה הופך התנהגות להפרעה, ואת מודל פגיעות־לחץ.<br>
• לזהות הפרעה מתיאור מקרה, ולהבחין בין הפרעות דומות.<br>
• לציין גורמי סיכון וסיבות לכל קבוצה.<br>
• להבחין בין תסמינים חיוביים לשליליים בסכיזופרניה.<br>
• להכיר את שלושת אשכולות האישיות, ואת הגבולית והאנטי־חברתית.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>חריגות ≠ הפרעה</b>; ואבל אחרי מוות הוא לא הפרעה.</li>
<li><b>PTSD</b> כבר לא בקבוצת החרדה, והיא ההפרעה היחידה עם סיבה מוגדרת.</li>
<li><b>דיכאון מז׳ורי = שבועיים</b>; <b>מתמשך = שנתיים</b>; <b>מאניה = שבוע</b>.</li>
<li><b>דו־קוטבית</b> דורשת רק אפיזודה מאנית אחת.</li>
<li><b>סכיזופרניה ≠ פיצול אישיות.</b></li>
<li><b>אגרנות</b> היא הפרעה נפרדת, לא תסמין של OCD.</li>
<li><b>הקומפולסיה נשמרת בחיזוק שלילי</b>.</li>
<li><b>גבולית ואנטי־חברתית</b> שתיהן באשכול B.</li>
<li><b>גברים מתים בהתאבדות פי 4</b>; השיא באביב.</li>
<li><b>MMR לא גורם לאוטיזם.</b></li>
</ul></div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
</html>
