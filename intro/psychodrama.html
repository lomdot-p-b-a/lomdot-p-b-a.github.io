<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>

  <text x="200" y="124" text-anchor="middle" font-size="11.5" class="f-mut">פעם בשבוע, שעה וחצי, במשך שנתיים</text></svg>`},
 journey:()=>{const J=[["1","החתונה","ניתוק"],["2","סינדרלה","כעס ועלפון"],["\u20663–4\u2069","הסיפור של לילי","דחייה"],["5","הפחד","חוויה מתקנת"],["6","המכתב","פרידה"]];

const E=t=>`<span class="en">(${t})</span>`;

const T=[
 {id:"t1",icon:"people",title:"מהי פסיכודרמה",blocks:[
  {h:"הגדרה",html:`${def("על מה הנושא",`מהי פסיכודרמה, ואיך משתמשים בה עם ילדים? הנושא מציג את השיטה ואת השאלה אם צריך לפרש לילד את מה שהוא משחק.<br><b>מה נלמד כאן:</b> פסיכודרמה · פסיכודרמה עם ילדים · לפרש או לא לפרש`)}${def("מושג מפתח",`<mark>פסיכודרמה</mark> ${E("Psychodrama")}: אמצעי טיפולי שבו האדם <b>חווה מחדש</b> מצבים משמעותיים בחייו ונפגש, בהמחזה, עם דמויות משמעותיות עבורו.`)}${tiles([["sprout","קתרזיס","פורקן רגשי בזמן ההמחזה"],["bulb","תובנה","הבנה של מה שקורה"],["target","דרכים חדשות","חיפוש אפשרויות חדשות להתמודדות"]])}${ex("מורנו, <b>אבי הפסיכודרמה</b>, התחיל לעבוד כך עם ילדים לפני כשישים שנה. לטענתו, לאפשר לילדים לשחק באופן ספונטני את בעיותיהם מביא לתוצאות טיפוליות.")}`,q:"q1"},
  {h:"פסיכודרמה עם ילדים",html:`<p>בקבוצות ילדים יש קונפליקט חריף בין הצורך לשמור על התהליך הקבוצתי לבין הצרכים האישיים (יאלום). לכן הותאמה השיטה:</p>${tiles([["people","אין קהל","כולם משתתפים בתפקידים"],["copies","תפאורה ותלבושות","חלק מהחימום, וגם ביטוי לא מילולי ויצירתי ושיתוף פעולה"],["doc","מטאפורה","ילדים נשארים לרוב בתחום המטאפורה (אגדות, סיפורים), בעוד מבוגרים מעלים בעיות ישירות"]])}${rem("דרך המטאפורה הילד נפגש עם רגשותיו ועם הדמויות המשמעותיות, חווה <b>קתרזיס</b>, ומגייס כוחות להתמודד.")}`,q:"q3"},
  {h:"לפרש או לא לפרש?",html:`${tiles([["x","באום (1973)","עימות ישיר עם שורשי הקונפליקט עלול להעלות חרדה והתנגדות אצל ילדים עם בעיות קשות"],["check","אנה פרויד","חשוב מאוד לפרש ולהביא לילד הבנה של משמעות המשחק הסימבולי"]])}${def("עמדת הכותבת",`יש <b>להתאים</b> את הטיפול לאישיות ולכוחות של המטופל, ולשקול את השאלה כל פעם מחדש. התשובה משתנה מילד לילד ומפסיכודרמה לפסיכודרמה.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"id",title:"הקבוצה ודנה",blocks:[
  {h:"הקבוצה",html:`${def("על מה הנושא",`המאמר עוקב אחרי ילדה אחת, דנה, בתוך קבוצה טיפולית. הנושא מכיר את הקבוצה, את דנה ואת מטרות הטיפול.<br><b>מה נלמד כאן:</b> הקבוצה · דנה · מטרות`)}<p>הקבוצה פעלה <b>במוסד טיפולי</b> שבו גרו הילדים: 6 ילדים (3 בנים, 3 בנות) בגילאי 10 עד 12, שבעה מבוגרים <b>קו־תרפיסטים</b> (עובדים סוציאליים של המוסד, כל אחד צמוד לילד קבוע), והמנחה.</p>${fig("session")}${rem("<b>הפרוטגוניסט</b>, הגיבור המרכזי, סיפר את הסיפור, חילק תפקידים והנחה את התפאורה והתחפושות. מעניין: הילדים כמעט לא הביאו את המציאות של חייהם, אלא אגדות או סיפורים דמיוניים.")}`,q:"q7"},
  {h:"דנה",html:`<p>דנה (שם בדוי) טופלה בקבוצה <b>מגיל 10 עד 12</b>. היא הגיעה למוסד בעקבות טראומה של התעללות מינית מצד אביה, שעליה ריצה האב עונש מאסר.</p>${tiles([["x","בעיות התנהגות","קשות, והפרעות רגשיות (אפקטיביות)"],["brain","ריכוז וניתוקים","הפרעות ריכוז, ניתוקים ובעיות הסתגלות"],["people","דחייה חברתית","הילדים דחו אותה, והיא הרבתה לדבר לעצמה"]])}${rem("ההפרעות האלה <b>שכיחות</b> אצל נפגעי התעללות מינית.")}`,q:"q9"},
  {h:"מטרות הטיפול",html:`${tiles([["brain","1. עיבוד","לאפשר לה לעבד את הטראומה"],["link","2. אמון","לפתח קשרים עם בני גילה ועם מבוגרים, על בסיס יכולת לתת אמון"],["clock","3. ויסות","לדחות סיפוקים ולא להגיב בתוקפנות לתסכול"],["sprout","4. דימוי","לפתח דימוי עצמי ודימוי גוף חיוביים"]])}${fig("journey","הפסיכודרמות שבהן דנה הייתה הגיבורה")}`,q:"q11"}
 ]},
 {id:"t3",icon:"cycle",title:"ניתוק, כעס ואמון",blocks:[
  {h:"פסיכודרמה 1: החתונה",html:`${def("על מה הנושא",`בהתחלה דנה "התנתקה" בכל פעם שהיה קשה. הנושא מראה איך הפסיכודרמה עזרה לה להתחיל להרגיש ולסמוך.<br><b>מה נלמד כאן:</b> ניתוק (דיסוציאציה) · הכפיל · חילופי תפקידים`)}<p>כחודש אחרי תחילת הקבוצה, דנה ביקשה להציג חתונה, בתפקיד <b>הכלה</b>. כל הילדים השתתפו בהכנות. מתחת לחופה, לפתע עיניה התרוצצו \"כחיה המבקשת מוצא\": היא <b>התנתקה</b> מהמתרחש והוצפה חרדות.</p>${def("מנגנון ההינתקות",`<mark>ניתוק (דיסוציאציה)</mark> ${E("Dissociation")}: מנגנון שדנה השתמשה בו לעתים קרובות, ושכיח אצל נפגעות אלימות מינית.`)}${rem("הקבוצה עוד לא הייתה בשלה. \"אם הכלה\" הודיעה שהכלה חשה ברע והחגיגה נדחית, והמוזמנים הבטיחו לבוא. כך הקבוצה <b>הכילה</b> את דנה ונתנה <b>אישור</b> לתגובת הניתוק.")}${ex(`<b>ניתוק</b>: ילד שבזמן ריב צועק בבית "מכבה" את עצמו: הוא שם, אבל כאילו לא שומע ולא מרגיש. כך הוא מגן על עצמו מכאב.`)}`,q:"q13"},
  {h:"פסיכודרמה 2: סינדרלה והעלפון",html:`<p>בתפקיד סינדרלה דנה כעסה על האם החורגת: \"לא שמרת עלי!\". ייתכן שזה ביטוי לכעס על אם שלא הגנה עליה. אחר כך ביקשה שוב את החתונה, בלי להזמין את אבי הכלה, ולחשה: \"אני מתעלפת!\".</p>${def("הכפיל",`המנחה כרעה לצידה ולחשה: \"אני כל כך פוחדת. כולם ילכו ואני אשאר איתו\", והציעה לה לחזור על המילים רק אם הן מדויקות לה. דנה חזרה. זה תפקיד ה<mark>כפיל</mark> ${E("Double")}, ונתינת מילים לרגש <b>הוציאה אותה מהניתוק</b>.`)}${ex(`<b>הכפיל</b>: חבר בקבוצה או המנחה עומד ליד הילד ואומר בקול את מה שהילד אולי מרגיש ולא מעז להגיד.`)}`,q:"q15"},
  {h:"חילופי תפקידים",html:`<p>דנה ביקשה עזרה מ<b>אמא</b>. במציאות האם התעלמה ממצוקתה, אבל כאן ביקשה <b>אם אידיאלית</b> שתגן עליה. ב<mark>חילופי תפקידים</mark> ${E("Role reversal")} דנה שיחקה גם את הכלה וגם את האם, ואחר כך גם את החתן.</p>${tiles([["x","החלק הפגוע","נפחד ומסרב לתת אמון"],["check","החלק המאמין","מאמין בכוחו ובזולת"]])}${rem("למלא <b>שלושה תפקידים</b> לסירוגין היה הישג גדול לילדה נוקשה מאוד. הכלה ביקשה מהחתן שלא יפגע בה, הוא נשבע, והיא חזרה לאורחים. דנה בחנה כאן את יכולתה <b>לתת אמון</b> בבני המין השני.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"doc",title:"הסיפור של לילי",blocks:[
  {h:"להיות חלק",html:`${def("על מה הנושא",`דרך סיפור על ילדה אחרת, לילי, דנה התחילה לגעת בסיפור שלה.<br><b>מה נלמד כאן:</b> להיות חלק · הסיפור של לילי · סוף אחר`)}<p>בחודשיים שאחרי, דנה מילאה תפקידים בפסיכודרמות של ילדים אחרים, בגמישות הולכת וגדלה.</p>${rem("לילדה מנותקת ומסוגרת היה ערך רב ל<b>תחושת השייכות</b>: לקבל תפקידים, לבצע אותם באמפתיה, ולהסתפק לפעמים בתפקיד שולי ולא להיות במרכז.")}`,q:"q19"},
  {h:"פסיכודרמה 3: הסיפור",html:`<p>דנה כתבה סיפור על לילי, שמגיעה לחברותיה. אביהן מחזר אחריה, מגרש את אשתו, ובסוף מבקש את ידה. לילי נעתרת לו, ואומרת לנסיך שליבה נתון לאחר.</p>${def("גישת הכותבת",`בגישה הפסיכודרמטית היא <b>לא פירשה</b> את הסיפור, אלא אפשרה לדנה לחוות את התוכן דרך ההצגה. בסיפור יש תכנים <mark>השלכתיים</mark> ${E("Projective")} רבים.`)}${tiles([["scales","אמביוולנטיות","דמות האב מבלבלת: לפעמים אלימה ומפחידה, לפעמים רכה ומפתה"],["x","רגשות אשם","דמות האם השלילית היא אולי ניסיון של לילי להצדיק את מעשיה"],["lock","בידוד","היער שמקיף את הבית מבטא את הבידוד והניתוק של המשפחה"]])}`,q:"q21"},
  {h:"פסיכודרמה 4: סוף אחר",html:`<p>בסוף ההצגה המנחה הציעה להמציא סוף אחר, ודנה <b>סירבה</b>. לפי הכותבת, זה מבטא את הקושי לדחות את האב, אפילו בהמחזה.</p>${ex("כחודש אחר כך דנה ביקשה להציג שוב. הפעם, כשהאב ביקש את ידה, צעקה: \"אני לא רוצה אותך ולא את המתנות שלך!\", וגייסה את כל כוחה כדי להרחיק אותו. בסוף נראתה מותשת, עם חיוך של <b>הקלה ושחרור</b>.")}${rem("אחרי הפסיכודרמה הזו הצוות דיווח על <b>שינוי משמעותי</b>: היא התחילה לשלוט בצרכיה, נעשתה רגועה יותר, ויכולת הריכוז שלה בכיתה עלתה.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"sprout",title:"חוויה מתקנת ופרידה",blocks:[
  {h:"פסיכודרמה 5: הפחד",html:`${def("על מה הנושא",`השלב שבו דנה חווה מחדש את הפחד, אבל הפעם עם סוף טוב יותר.<br><b>מה נלמד כאן:</b> הצגת הפחד · חוויה מתקנת · ביבליותרפיה והמכתב`)}<p>כשנה אחרי ההתחלה דנה התחילה להקפיד על הופעתה, הופיעו סימני התבגרות, והיא התחילה להגיב <b>בחום למגע</b> שבעבר נרתעה ממנו.</p>${def("למה להציג את הפחד",`הצגת \"הדבר שאני פוחד ממנו\" נותנת <b>תחושת שליטה</b>: הילד הוא המחזאי, הבמאי והשחקן הראשי, וזה מקנה ביטחון.`)}<p>דנה סיפרה על פחד מדמות של איש שבא בלילה. בחילופי התפקידים היא קפאה. המנחה הסבירה שכאן היא <b>מוגנת</b>, שהיא יכולה לבחור תגובה אחרת מזו שבמציאות, ושהקבוצה תעזור בכל כיוון. הצוות בדק בזהירות כל הזמן אם היא רוצה להמשיך.</p>`,q:"q25"},
  {h:"חוויה מתקנת",html:`${ex("דנה בחרה להילחם והרחיקה את האיש: \"אני מספיק חזקה כדי להילחם בך! ... אני לא פוחדת ממך יותר!\"")}${def("מושג מפתח",`<mark>חוויה מתקנת</mark> ${E("Corrective experience")}: לחוות מחדש מצב טראומטי ולהגיב אחרת, מתוך כוח. כאן זה אפשר לדנה להשתחרר מתחושת <b>חוסר האונים</b>.`)}${rem("בתמונה האחרונה דנה \"הגדולה\", בת 12, פגשה את דנה \"הקטנה\" ואמרה לה שהיא מבינה שאז לא יכלה לעשות כלום, כי הייתה קטנה ולא היה מי שיעזור, אבל <b>עכשיו היא תמיד תשמור עליה</b>.")}`,q:"q27"},
  {h:"פסיכודרמה 6: המכתב",html:`<p>לקראת הסיום, אחרי כשנתיים: הישגיה השתפרו, היא אחראית, מתחשבת ומקובלת, ויש לה חבר מהמוסד. אמה, שהתגרשה, ביקשה לגדל אותה שוב.</p>${def("ביבליותרפיה",`כדי לברר מה דנה באמת רוצה (ולא רק לרצות את אמה), המנחה השתמשה ב<mark>ביבליותרפיה</mark> ${E("Bibliotherapy")}: סיפור על ילד שגר אצל דודיו, ומקבל מכתב מהוריו שמבקשים שיחזור. כל ילד כתב את המכתב של הילד.`)}${ex("דנה כתבה שהילד מודה לדודים שטיפלו בו באהבה, אבל מתגעגע ורוצה לחזור. היא הקריאה את המכתב והוסיפה שגם היא מקווה לחזור לחיות עם אמה.")}`,q:"q29"}
 ]},
 {id:"t6",icon:"check",title:"סיכום",blocks:[
  {h:"מה השתנה",html:`${def("על מה הנושא",`מה השתנה אצל דנה, ואיך מסבירים את השינוי?<br><b>מה נלמד כאן:</b> מה השתנה · שלושת שלבי השינוי · מהדחקה לביטוי`)}<p>במשך שנתיים דנה בנתה יחסים של <b>אמון ופתיחות</b> עם הקבוצה, ביטאה את פחדיה, את רגשות האשם ואת הכעס כלפי אביה, <b>בלי ששמו הוזכר במפורש ולו פעם אחת</b>. היא למדה לקבל ולאהוב את עצמה ואת גופה.</p>${tiles([["id","דימוי עצמי","מילדה מוזנחת בחיצוניות לילדה נעימה ומטופחת"],["grad","לימודים","שיפור ניכר בהישגים"],["people","חברה","הפכה למנהיגה טבעית, והילדים הצטערו על עזיבתה"]])}`,q:"q31"},
  {h:"איך להבין את השינוי",html:`${def("שלושת שלבי השינוי (קזדין)",`שינוי ב<b>תחושה הסובייקטיבית</b> של הדימוי העצמי, <b>ירידה בסימפטומים</b>, ו<b>שינוי בתפקוד</b>. לפי הכותבת, שלושתם קרו אצל דנה.`)}${def("מנגנון ההדחקה",`בהתחלה דנה השתמשה ב<mark>הדחקה</mark> ${E("Repression")} כדי להעלים מהתודעה את האירועים. ההדחקה צורכת <b>הרבה אנרגיה</b>, ולא נשארו כוחות לחשיבה, למידה וזכירה. כשהטראומה עובדה בפסיכודרמה, <b>השתחררו כוחות</b> לדברים אחרים.`)}${rem("מורנו: \"הדרמה הספונטנית משפיעה באורח תרפויטי על השחקן, אשר יוצר את הדרמה ובו בזמן משחרר עצמו ממנה\". דנה שחזרה את הטראומה באופן השלכתי, ובמקביל שחררה את עצמה ממנה.")}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"ילד מציג בקבוצה ריב עם אחיו, צועק את מה שלא העז לומר, ומרגיש הקלה גדולה. איזה מרכיב של פסיכודרמה זה?","a":"קתרזיס (פורקן רגשי)","w":["תובנה על מה שקרה","דרכים חדשות להתמודדות","חילופי תפקידים"],"e":"צעקה של מה שלא העז לומר, ואחריה הקלה גדולה, היא קתרזיס: פורקן רגשי בזמן ההמחזה. תובנה הייתה הבנה חדשה של מה שקרה, ופה מדובר בשחרור של רגש."},{"q":"מה מבדיל פסיכודרמה משיחה טיפולית רגילה?","a":"האדם חווה מחדש מצבים בהמחזה, מול דמויות משמעותיות","w":["המטפל מפרש כל מה שהמטופל אומר בשיחה","המטופל רק צופה בהצגה שאחרים מעלים","הטיפול מתבסס בעיקר על תרופות ובדיקות"],"e":"בפסיכודרמה המטופל חווה מחדש מצבים בהמחזה, מול דמויות משמעותיות, וזה הלב של השיטה. בשיחה רגילה מדברים על המצב, בלי לחוות אותו מחדש."}]},
"q2":{"t":"t1","v":[{"q":"מי נחשב לאבי הפסיכודרמה?","a":"מורנו","w":["יאלום","פרויד","אריקסון"],"e":"מורנו נחשב לאבי הפסיכודרמה. הוא התחיל לעבוד כך עם ילדים לפני כשישים שנה. יאלום עסק בטיפול קבוצתי, אבל לא הוא המייסד."},{"q":"מה טען מורנו על משחק ספונטני של ילדים?","a":"שמשחק ספונטני של הבעיות מביא לתוצאות טיפוליות","w":["שצריך לפרש כל משחק לילד מיד","שילדים לא מתאימים לפסיכודרמה כלל","שמשחק ספונטני מגביר את החרדה"],"e":"מורנו טען שמשחק ספונטני של הבעיות מביא לתוצאות טיפוליות, ולכן ספונטניות היא מרכיב מרכזי בשיטה. הוא לא טען שצריך לפרש כל משחק."}]},
"q3":{"t":"t1","v":[{"q":"בקבוצת פסיכודרמה של ילדים אין קהל, וכולם משחקים. למה?","a":"כי זה עוזר לשמור על התהליך הקבוצתי","w":["כי ילדים לא אוהבים לצפות באחרים","כי אין מספיק מקום בחדר הטיפול","כי המנחה לא רוצה עדים להצגה"],"e":"כשכולם משחקים ואין קהל, כל הילדים שותפים, וזה עוזר לשמור על התהליך הקבוצתי. זו התאמה של השיטה לקבוצות ילדים, ולא עניין של מקום בחדר."},{"q":"למה ניתן דגש על תפאורה ותלבושות?","a":"חימום, ביטוי יצירתי ושיתוף","w":["כדי שההצגה תהיה יפה ומרשימה","כדי להרשים את הצוות במוסד","כי הילדים דרשו זאת מהמנחה"],"e":"תפאורה ותלבושות משמשות לחימום, לביטוי יצירתי ולשיתוף, ומאפשרות ביטוי לא מילולי. המטרה איננה שההצגה תהיה יפה."}]},
"q4":{"t":"t1","v":[{"q":"ילדה בוחרת להציג את ״שלגיה״ ולא את מה שקרה לה בבית. מה זה ממחיש?","a":"ילדים מעלים בעיות דרך מטאפורה","w":["הילדה לא רוצה לקבל טיפול","הילדה לא מבינה את המשימה","הילדה מעדיפה סיפורים מצחיקים"],"e":"ילדים מעלים בעיות דרך מטאפורה, למשל אגדה, ולא ישירות כמו מבוגרים. בחירה ב״שלגיה״ לא אומרת שהיא לא רוצה טיפול."},{"q":"איזה קונפליקט חריף במיוחד בקבוצות ילדים, לפי יאלום?","a":"בין הקבוצה לצרכי היחיד","w":["בין הילדים לבין ההורים","בין המנחה לבין הצוות","בין משחק לבין לימודים"],"e":"לפי יאלום, בקבוצות ילדים הקונפליקט בין צורכי הקבוצה לצורכי היחיד חריף במיוחד, ולכן השיטה הותאמה להם. הוא לא עסק כאן בקונפליקט עם ההורים."}]},
"q5":{"t":"t1","v":[{"q":"מה החשש של באום מעימות ישיר עם שורשי הקונפליקט?","a":"שיעורר חרדה והתנגדות","w":["שהילד ישתעמם במפגש","שהמנחה יאבד שליטה","שההורים יתנגדו לטיפול"],"e":"באום חשש שעימות ישיר עם שורשי הקונפליקט יעורר חרדה והתנגדות, ולכן נזהר מפירוש. החשש לא היה שהילד ישתעמם."},{"q":"מה עמדת אנה פרויד לגבי פירוש המשחק?","a":"חשוב לפרש ולהביא לילד הבנה","w":["אסור לפרש לילדים בכלל","צריך לפרש רק להורים","צריך לפרש רק אחרי שנה"],"e":"אנה פרויד סברה שחשוב לפרש את המשחק ולהביא לילד הבנה, עמדה הפוכה לזו של באום. היא לא אסרה פירוש לילדים."}]},
"q6":{"t":"t1","v":[{"q":"מה עמדת הכותבת בשאלה אם לפרש?","a":"להתאים לכל ילד ולכל מפגש מחדש","w":["תמיד לפרש, כמו אנה פרויד","אף פעם לא לפרש, כמו באום","לפרש רק בסוף הטיפול"],"e":"הכותבת לא נוקטת עמדה קבועה, אלא מתאימה את ההחלטה אם לפרש לכל ילד ולכל מפגש מחדש. היא לא מאמצת את אנה פרויד או את באום במלואם."},{"q":"ילד מציג דמות של מלך כועס, ונראה שזה מבטא את הכעס שלו עצמו. איך נקרא תוכן כזה?","a":"השלכתי","w":["קתרזיס","חוויה מתקנת","מנגנון הדחקה"],"e":"כשילד מבטא את הכעס שלו דרך דמות של מלך כועס, זה תוכן השלכתי: רגשות שמובעים דרך דמויות. קתרזיס הוא הפורקן עצמו, ולא הביטוי דרך דמות."}]},
"q7":{"t":"t2","v":[{"q":"בכל מפגש, כל ילד עבד גם עם מבוגר קבוע מהמוסד. מה היה תפקיד המבוגר?","a":"קו־תרפיסט צמוד","w":["צופה ומתעד בלבד","שחקן מקצועי מבחוץ","נציג ההורים בקבוצה"],"e":"המבוגר הקבוע, עובד סוציאלי של המוסד, היה קו־תרפיסט צמוד לכל ילד. הוא לא היה רק צופה ומתעד."},{"q":"מהו ״פרוטגוניסט״?","a":"הגיבור המרכזי","w":["המנחה של הקבוצה","הצופה בהצגה","הקו־תרפיסט"],"e":"הפרוטגוניסט הוא הגיבור המרכזי של ההצגה: הוא מספר את הסיפור ומחלק את התפקידים. המנחה הוא מי שמוביל את המפגש."}]},
"q8":{"t":"t2","v":[{"q":"מה מעניין בנושאים שהילדים בחרו להציג?","a":"הם הביאו בעיקר אגדות וסיפורים","w":["כולם הציגו אירועים מהבית","כולם בחרו סיפורים מצחיקים","הם סירבו להציג בכלל"],"e":"הילדים בחרו בעיקר אגדות וסיפורים, כלומר מטאפורות, כדרך עקיפה להעלות את הבעיות שלהם. הם לא הציגו בעיקר אירועים מהבית."},{"q":"מה סדר האירועים הקבוע במפגש?","a":"שיחה, חימום, בחירת גיבור, הכנה והצגה","w":["הצגה, שיחה, ואז חימום קצר","חימום, ואז סיום מיידי של המפגש","בחירת גיבור, ואז שיחה בלבד"],"e":"לכל מפגש היה מבנה קבוע: שיחה, חימום, בחירת גיבור, הכנה והצגה. החימום תמיד בא לפני ההצגה."}]},
"q9":{"t":"t2","v":[{"q":"באיזה גיל טופלה דנה בקבוצה?","a":"מגיל 10 עד 12","w":["מגיל 5 עד 7","מגיל 14 עד 16","מגיל 18 עד 20"],"e":"דנה טופלה בקבוצה כשנתיים, מגיל 10 עד 12."},{"q":"איזה מהבאים לא היה בין הקשיים של דנה כשהגיעה?","a":"הצטיינות","w":["הפרעות ריכוז","ניתוקים תכופים","דחייה חברתית"],"e":"כשהגיעה, לדנה היו הפרעות ריכוז, ניתוקים תכופים ודחייה חברתית. ההישגים שלה השתפרו רק בהמשך, ולכן היא לא הייתה מצטיינת."}]},
"q10":{"t":"t2","v":[{"q":"דנה מדברת לעצמה והילדים דוחים אותה. מה המאמר אומר על הקשיים האלה?","a":"שהם שכיחים אצל נפגעי טראומה כזו","w":["שהם נדירים ומפתיעים מאוד","שהם נובעים רק מהחיים במוסד","שהם מעידים על מחלה גנטית"],"e":"לפי המאמר, דיבור עצמי ודחייה חברתית שכיחים אצל נפגעי טראומה כזו. זה דפוס מוכר, ולא משהו נדיר או מפתיע."},{"q":"איך תוארה דנה בתחילת הטיפול?","a":"מוזנחת ונדחית","w":["מטופחת ומקובלת","שקטה ומצטיינת","מנהיגה בקבוצה"],"e":"בתחילת הטיפול דנה תוארה כמוזנחת ונדחית, ההפך מהמצב בסוף הטיפול."}]},
"q11":{"t":"t2","v":[{"q":"איזו מהבאות לא הייתה מטרה של הטיפול בדנה?","a":"להחזיר אותה מיד לבית האב","w":["לעבד את הטראומה","לפתח יכולת לתת אמון","לפתח דימוי עצמי חיובי"],"e":"ארבע המטרות של הטיפול היו עיבוד הטראומה, פיתוח אמון, ויסות ודימוי עצמי חיובי. החזרה מיידית לבית האב לא הייתה מטרה."},{"q":"דנה מתפרצת בכעס כשלא מקבלת מה שרצתה. לאיזו מטרה של הטיפול זה קשור?","a":"ויסות","w":["עיבוד הטראומה","פיתוח אמון","דימוי גוף"],"e":"התפרצויות זעם כשלא מקבלים מה שרוצים קשורות למטרה של ויסות: היכולת לשלוט בתגובות הרגשיות. היא לא קשורה לדימוי הגוף."}]},
"q12":{"t":"t2","v":[{"q":"כמה ילדים היו בקבוצה?","a":"6","w":["2","12","20"],"e":"בקבוצה היו 6 ילדים: שלושה בנים ושלוש בנות."},{"q":"למה חשוב שהילדים לא קיבלו טיפול פסיכולוגי אחר באותה תקופה?","a":"כדי לייחס את השינוי לפסיכודרמה","w":["כי זה אסור לפי החוק","כי לא היה תקציב לכך","כי הילדים סירבו לטיפול נוסף"],"e":"כשהילדים לא מקבלים טיפול אחר באותה תקופה, יש פחות הסברים חלופיים, ואפשר לייחס את השינוי לפסיכודרמה. זה לא נבע מאיסור בחוק."}]},
"q13":{"t":"t3","v":[{"q":"מתחת לחופה, דנה פתאום ״לא שם״: מבטה מתרוצץ והיא מוצפת חרדה. מה המנגנון?","a":"ניתוק","w":["הדחקה","השלכה","קתרזיס"],"e":"״לא שם״, מבט מתרוצץ והצפה בחרדה הם ניתוק, מנגנון שכיח אצל נפגעות אלימות. הדחקה היא העלמה של אירועים מהתודעה, ולא ״יציאה״ מהרגע."},{"q":"מה מבדיל ניתוק מהדחקה?","a":"ניתוק: ״יציאה״ מהרגע. הדחקה: העלמת אירועים מהתודעה","w":["ניתוק: העלמת זיכרונות. הדחקה: יציאה מהרגע","שניהם אותו מנגנון","ניתוק קורה רק בשינה"],"e":"בניתוק האדם ״יוצא״ מהרגע, ובהדחקה אירועים נעלמים מהתודעה. המסיח הראשון הופך ביניהם."}]},
"q14":{"t":"t3","v":[{"q":"כשדנה התנתקה, ״אם הכלה״ הודיעה שהחגיגה נדחית. מה זה עשה?","a":"הכיל את דנה ואישר את תגובתה","w":["הפסיק את הטיפול בה לגמרי","העניש אותה על ההתנהגות","העביר את התפקיד לילדה אחרת"],"e":"ההודעה שהחגיגה נדחית הכילה את דנה ואישרה את התגובה שלה, בלי לכפות עליה להמשיך. הקבוצה עוד לא הייתה בשלה לעבד את הנושא. זה לא היה עונש."},{"q":"למה לא עבדו על הנושא כבר בפסיכודרמה הראשונה?","a":"כי הן עוד לא היו בשלות","w":["כי המנחה לא שמה לב","כי לא היה זמן במפגש","כי דנה ביקשה להפסיק"],"e":"בשלב הראשון עוד לא נבנה מספיק אמון, ולכן לא עבדו על הנושא כבר בפסיכודרמה הראשונה. זה לא היה בגלל חוסר זמן."}]},
"q15":{"t":"t3","v":[{"q":"בתפקיד סינדרלה, דנה כועסת על האם החורגת שלא שמרה עליה. איך הכותבת מפרשת זאת?","a":"כעס על אם שלא הגנה","w":["כעס על המנחה","קנאה בילדות אחרות","פחד מהקו־תרפיסט"],"e":"הכותבת מפרשת את הכעס על האם החורגת כתוכן השלכתי: כעס על אם שלא הגנה עליה. הכעס לא מופנה למנחה."},{"q":"מהו תפקיד ה״כפיל״?","a":"לתת מילים לרגשות שהגיבור עוד לא אומר","w":["לשחק את הדמות השלילית בהצגה","להחליף את הגיבור כשהוא עייף","לצפות במתרחש ולתעד אותו"],"e":"הכפיל נותן מילים לרגשות שהגיבור עוד לא אומר, והגיבור מאמץ אותן רק אם הן מדויקות לו. הוא לא משחק את הדמות השלילית."}]},
"q16":{"t":"t3","v":[{"q":"מה עשה מתן המילים לרגש כשדנה ״התעלפה״?","a":"הוציא אותה מהניתוק","w":["העמיק את הניתוק","גרם לה לעזוב","לא השפיע עליה"],"e":"כשהכפיל נתן מילים לרגש, דנה יצאה מה״התעלפות״, מהניתוק. זה כוחו של הכפיל. זה לא העמיק את הניתוק."},{"q":"דנה רוצה לברוח מהחדר. מה המנחה מציעה?","a":"להתחבא בתוך החדר","w":["לצאת להפסקה קצרה","לסיים את המפגש מיד","לשבת בצד ולצפות"],"e":"המנחה הציעה לדנה להתחבא בתוך החדר, כדי שתישאר במרחב הבטוח ולא תברח ממנו. היא לא סיימה את המפגש."}]},
"q17":{"t":"t3","v":[{"q":"דנה משחקת בתורות את הכלה, את האם ואת החתן. איזו טכניקה זו?","a":"חילופי תפקידים","w":["כפיל","שיקוף בתנועה","ביבליותרפיה"],"e":"כשהגיבור משחק בתורות גם דמויות אחרות (האם, החתן), זו טכניקת חילופי תפקידים. כפיל הוא מישהו אחר שמשמיע את הרגשות של הגיבור."},{"q":"למה היה הישג לדנה למלא שלושה תפקידים?","a":"כי זה דרש ממנה גמישות","w":["כי זה היה ארוך מאוד","כי היא לא אהבה לשחק","כי אף ילד לא הצליח בזה"],"e":"מילוי שלושה תפקידים דרש מדנה גמישות: לגלם גם את החלק הפגוע וגם את החלק המאמין. זה הישג לילדה שנטתה לנוקשות ולניתוק."}]},
"q18":{"t":"t3","v":[{"q":"במציאות האם התעלמה ממצוקתה, אבל בהצגה דנה ביקשה אם שתגן עליה. מה היא ביקשה?","a":"אם אידיאלית","w":["אם חורגת","אם מענישה","אם רחוקה"],"e":"בהצגה דנה ביקשה אם שתגן עליה, כלומר אם אידיאלית, וכך השלימה את מה שחסר לה במציאות. זו לא אם מענישה או רחוקה."},{"q":"הכלה ביקשה מהחתן שלא יפגע בה, והוא נשבע. מה דנה בחנה כאן?","a":"את היכולת לתת אמון במין השני","w":["את היכולת לשחק מספר תפקידים","את הפחד מהמנחה","את הקשר עם האם"],"e":"כשהכלה ביקשה מהחתן שלא יפגע בה, והוא נשבע, דנה בחנה את היכולת לתת אמון במין השני. זו אחת ממטרות הטיפול."}]},
"q19":{"t":"t4","v":[{"q":"בחודשיים שאחרי, דנה שיחקה תפקידים צדדיים בהצגות של אחרים. למה זה חשוב?","a":"זה בנה שייכות ויכולת לא להיות במרכז","w":["זה לימד אותה טכניקות משחק","זה הסיח את דעתה מהטראומה","זה הוכיח שהיא החלימה לגמרי"],"e":"תפקידים צדדיים בהצגות של אחרים בנו אצל דנה שייכות ויכולת לא להיות במרכז. יש לכך ערך רב לילדה מנותקת. זה לא הוכיח שהיא החלימה לגמרי."},{"q":"מה השתנה אצל דנה בתפקידים בהצגות של אחרים?","a":"גמישות הולכת וגדלה","w":["סירוב הולך וגדל","היא הפסיקה להשתתף","היא דרשה להיות תמיד במרכז"],"e":"בתפקידים בהצגות של אחרים ניכרו אצל דנה גמישות ואמפתיה שהלכו וגדלו. היא לא דרשה להיות תמיד במרכז."}]},
"q20":{"t":"t4","v":[{"q":"דנה כתבה סיפור על לילי. האם המנחה פירשה אותו?","a":"לא, היא נתנה לה לחוות","w":["כן, בפירוט מלא","כן, רק להורים","כן, מול כל הקבוצה"],"e":"המנחה לא פירשה את הסיפור, אלא נתנה לדנה לחוות אותו, בהתאם לגישה הפסיכודרמטית. היא לא פירשה אותו מול הקבוצה."},{"q":"דמות האב בסיפור לפעמים מפחידה ולפעמים רכה ומפתה. מה זה מבטא?","a":"רגשות סותרים","w":["קתרזיס","ניתוק","ויסות"],"e":"אב שלפעמים מפחיד ולפעמים רך ומפתה מבטא רגשות סותרים כלפי אותה דמות. זה לא ניתוק."}]},
"q21":{"t":"t4","v":[{"q":"מה מבטא היער שמקיף את הבית בסיפור?","a":"בידוד המשפחה","w":["חופש ושמחה","עושר המשפחה","סכנה מבחוץ בלבד"],"e":"היער שמקיף את הבית מבטא את הבידוד של המשפחה. זה תוכן השלכתי. הוא לא מבטא חופש ושמחה."},{"q":"מה ייתכן שמבטאת דמות האם השלילית בסיפור?","a":"רגשות אשם","w":["כעס על המנחה","אהבה לאם האמיתית","פחד מהקו־תרפיסט"],"e":"דמות האם השלילית בסיפור אולי מבטאת רגשות אשם. היא לא מבטאת כעס על המנחה."}]},
"q22":{"t":"t4","v":[{"q":"המנחה הציעה לדנה להמציא סוף אחר לסיפור, והיא סירבה. מה זה מבטא לפי הכותבת?","a":"קושי לדחות את האב","w":["שהיא אהבה את הסוף הקיים","שהיא התעייפה מההצגה","שהיא כעסה על המנחה"],"e":"לפי הכותבת, הסירוב להמציא סוף אחר מבטא קושי לדחות את האב: דנה עדיין לא הייתה מוכנה לכך. זה לא בגלל שאהבה את הסוף הקיים."},{"q":"מה מראה ההבדל בין הפעם הראשונה לשנייה שבה הוצג הסיפור?","a":"שינוי הדרגתי ביכולת לדחות","w":["שהסיפור השתנה בלי סיבה","שדנה שכחה את הסיפור","שהמנחה כפתה סוף אחר"],"e":"ההבדל בין הפעם הראשונה לשנייה מראה שינוי הדרגתי ביכולת לדחות את האב. המנחה לא כפתה סוף אחר."}]},
"q23":{"t":"t4","v":[{"q":"בפעם השנייה, דנה דחתה את דמות האב בכל הכוח ונראתה מותשת ומשוחררת. מה דיווח הצוות אחר כך?","a":"רוגע ושיפור בריכוז","w":["החמרה בהתנהגות","ניתוקים תכופים יותר","בקשה להפסיק טיפול"],"e":"אחרי שדחתה את דמות האב בכל הכוח, הצוות דיווח על רוגע ועל שיפור בריכוז. זה שינוי משמעותי, ולא החמרה."},{"q":"איך הגיבה דנה הפעם להצעה של האב בסיפור?","a":"דחתה אותו בצעקה ובכוח","w":["הסכימה, כמו בפעם הקודמת","התנתקה מהסצנה","ביקשה להפסיק את ההצגה"],"e":"הפעם דנה דחתה את האב בצעקה ובכוח, וסיימה בחיוך של הקלה. בפעם הקודמת היא לא הצליחה לדחות אותו."}]},
"q24":{"t":"t4","v":[{"q":"למה עיבוד רגשי של הטראומה שיפר גם את הריכוז בכיתה?","a":"כי השתחררה אנרגיה שהושקעה בהדחקה","w":["כי היא קיבלה עזרה בשיעורי בית","כי היא עברה לכיתה קטנה","כי היא התחילה לקחת תרופה"],"e":"הדחקה צורכת אנרגיה רבה. כשהטראומה עובדה, האנרגיה הזו השתחררה, ואפשר היה להשקיע אותה בריכוז ובלמידה. זה לא בגלל עזרה בשיעורי בית."},{"q":"מה מראות שתי ההצגות של הסיפור יחד?","a":"שעיבוד טראומה הדרגתי","w":["שפסיכודרמה עובדת בפעם אחת","שצריך תמיד לכפות סוף אחר","שהסיפור לא היה קשור אליה"],"e":"דנה חזרה לסיפור כשהייתה מוכנה, ובפעם השנייה הצליחה לדחות את האב. זה מראה שעיבוד טראומה הוא תהליך הדרגתי, ולא קורה בפעם אחת."}]},
"q25":{"t":"t5","v":[{"q":"למה הצגת ״הדבר שאני פוחד ממנו״ עוזרת לילד?","a":"כי היא נותנת לו תחושת שליטה","w":["כי הפחד נעלם כשמדברים עליו","כי זה מבדר את כל הקבוצה","כי זה מקצר את משך הטיפול"],"e":"הצגה של הדבר שמפחיד את הילד נותנת לו תחושת שליטה בפחד, ותחושת שליטה מקנה ביטחון. הפחד לא ״נעלם״ רק כי מדברים עליו."},{"q":"איזה שינוי ניכר אצל דנה כשנה אחרי תחילת הטיפול?","a":"הקפדה על הופעתה","w":["החמרה בניתוקים","סירוב להשתתף","מעבר למוסד אחר"],"e":"כשנה אחרי תחילת הטיפול ניכר שינוי: דנה התחילה להקפיד על הופעתה. זה שינוי בדימוי הגוף. הניתוקים לא החמירו."}]},
"q26":{"t":"t5","v":[{"q":"כשדנה קפאה בסצנה המפחידה, מה הדגישה המנחה?","a":"שכאן היא מוגנת ויכולה לבחור","w":["שצריך לסיים מיד את ההצגה","שהיא חייבת להמשיך בכל מחיר","שהיא לא צריכה לפחד מכלום"],"e":"כשדנה קפאה, המנחה הדגישה שכאן היא מוגנת ויכולה לבחור, ושהקבוצה תעזור לה בכל כיוון. היא לא כפתה עליה להמשיך."},{"q":"איך נוהלה הסצנה הקשה בפסיכודרמה החמישית?","a":"בזהירות ובבדיקה מתמדת","w":["מהר, כדי לא להאריך את הסבל","בלי קשר לתגובות של דנה","רק בדיבור, בלי המחזה"],"e":"את הסצנה הקשה ניהלו בזהירות, תוך בדיקה מתמדת של התגובות של דנה והדגשה של התמיכה. לא מיהרו לסיים אותה."}]},
"q27":{"t":"t5","v":[{"q":"דנה בוחרת בסצנה להילחם בדמות המאיימת ולהרחיק אותה, במקום לקפוא. איך נקראת החוויה הזו?","a":"חוויה מתקנת","w":["קתרזיס","ניתוק","חילופי תפקידים"],"e":"לחוות מחדש מצב מאיים ולהגיב אחרת, מתוך כוח, זו חוויה מתקנת. קתרזיס הוא פורקן רגשי, ופה העיקר הוא תגובה חדשה."},{"q":"ממה עזרה החוויה המתקנת לדנה להשתחרר?","a":"מתחושת חוסר האונים","w":["מהצורך בקבוצה","מהקשר עם האם","מהזיכרונות לגמרי"],"e":"החוויה המתקנת עזרה לדנה להשתחרר מתחושת חוסר האונים, ולעבור מתחושה של קורבן לתחושה של בעלת כוח. היא לא השתחררה מהזיכרונות לגמרי."}]},
"q28":{"t":"t5","v":[{"q":"דנה ״הגדולה״ אומרת לדנה ״הקטנה״ שאז לא יכלה לעשות כלום, ועכשיו תשמור עליה. מה המשמעות?","a":"הורדת האשמה העצמית","w":["כעס על עצמה מהעבר","שכחה של מה שקרה","ויתור על הקשר עם האם"],"e":"כשהיא אומרת לעצמה הקטנה ״אז לא יכולת לעשות כלום״, היא מורידה מעצמה את האשמה העצמית, ומתפייסת עם הילדה שהייתה. זה לא כעס על עצמה."},{"q":"מה הסבירה המנחה לדנה כשקפאה?","a":"שכאן היא מוגנת","w":["שהיא צריכה להתאמץ יותר","שהיא יכולה ללכת הביתה","שאין לה סיבה לפחד"],"e":"כשדנה קפאה, המנחה הסבירה לה שכאן היא מוגנת, ושיש לה בחירה שלא הייתה לה במציאות. היא לא אמרה שאין לה סיבה לפחד."}]},
"q29":{"t":"t5","v":[{"q":"כדי לברר אם דנה רוצה לחזור לאמה, המנחה הציגה סיפור על ילד שמקבל מכתב מהוריו. איזו טכניקה זו?","a":"ביבליותרפיה","w":["כפיל","חילופי תפקידים","שיקוף"],"e":"שימוש בסיפור כדי לברר רגשות ורצונות הוא ביבליותרפיה. חילופי תפקידים היו מחייבים את דנה לגלם דמות בעצמה."},{"q":"למה לא שאלו את דנה ישירות אם היא רוצה לחזור?","a":"כדי לשמוע את רצונה האמיתי","w":["כי היא לא ידעה לענות","כי אסור לשאול ישירות","כי ההורים התנגדו"],"e":"דנה נטתה לרצות את אמה, ולכן שאלה ישירה הייתה עלולה להביא לתשובה מרצה. הסיפור אפשר לשמוע את הרצון האמיתי שלה."}]},
"q30":{"t":"t5","v":[{"q":"מה כתבה דנה במכתב של הילד מהסיפור?","a":"שהוא מודה, אבל רוצה לחזור","w":["שהוא רוצה להישאר אצל הדודים","שהוא כועס מאוד על ההורים","שהוא לא יודע מה הוא רוצה"],"e":"במכתב של הילד דנה כתבה שהוא מודה לדודים, אבל רוצה לחזור הביתה, והוסיפה שגם היא רוצה לחזור לאמה."},{"q":"איך תוארה דנה לקראת סיום הטיפול?","a":"אחראית ומקובלת","w":["מנותקת ומבודדת","תוקפנית ונדחית","מוזנחת ושקטה"],"e":"לקראת סיום הטיפול דנה תוארה כאחראית ומקובלת, עם הישגים טובים יותר וחבר. זה ההפך מהמצב בתחילת הטיפול."}]},
"q31":{"t":"t6","v":[{"q":"מה מיוחד בכך שדנה ביטאה כעס כלפי אביה לאורך הטיפול?","a":"שמו לא הוזכר במפורש אף פעם","w":["שהיא אמרה זאת לאביה ישירות","שזה קרה רק בפגישה הראשונה","שהיא אמרה זאת רק להורים"],"e":"דנה ביטאה כעס כלפי אביה לאורך הטיפול, אבל שמו לא הוזכר במפורש אף פעם. הכל עבר דרך מטאפורה. היא לא אמרה לו זאת ישירות."},{"q":"איזה מעמד קיבלה דנה במוסד בסוף?","a":"מנהיגה טבעית","w":["ילדה מבודדת","ילדה נדחית","ילדה שקטה ולא בולטת"],"e":"בסוף הטיפול דנה הפכה למנהיגה טבעית במוסד, והילדים הצטערו על עזיבתה."}]},
"q32":{"t":"t6","v":[{"q":"מה מראה השינוי בהופעה החיצונית של דנה?","a":"שיפור בדימוי העצמי ובדימוי הגוף","w":["שהיא קיבלה בגדים חדשים מהמוסד","שהיא רצתה לרצות את המנחה","שהמוסד שינה את הכללים שלו"],"e":"השינוי בהופעה החיצונית משקף שיפור בדימוי העצמי ובדימוי הגוף, שהיו מהמטרות של הטיפול. זה לא קרה כי קיבלה בגדים מהמוסד."},{"q":"מה ניתן ללמוד מכך שהשינוי ארך שנתיים?","a":"שעיבוד טראומה הדרגתי","w":["שהטיפול לא היה יעיל","שצריך תמיד שנתיים בדיוק","שהשינוי היה מקרי"],"e":"השינוי ארך שנתיים, כי עיבוד טראומה הוא תהליך הדרגתי, בקצב של המטופלת. זה לא אומר שהטיפול לא היה יעיל."}]},
"q33":{"t":"t6","v":[{"q":"לפי קזדין, אילו שלושה שינויים מעידים על הצלחת טיפול?","a":"בדימוי העצמי, בסימפטומים ובתפקוד","w":["בציונים, במשקל ובשינה","בקשר עם ההורים, עם המנחה ועם המוסד","במשחק, בדיבור ובכתיבה"],"e":"לפי קזדין, הצלחת טיפול נמדדת בשינוי בשלושה תחומים: דימוי עצמי, סימפטומים ותפקוד. לפי הכותבת, שלושתם קרו אצל דנה."},{"q":"למה ההדחקה פגעה בלימודים של דנה?","a":"כי היא צורכת אנרגיה רבה","w":["כי היא מוחקת ידע מהזיכרון","כי היא גורמת לעייפות פיזית","כי היא מונעת הגעה לכיתה"],"e":"הדחקה צורכת אנרגיה רבה, ואנרגיה זו חסרה לחשיבה, ללמידה ולזכירה, ולכן נפגעו הלימודים. ההדחקה לא מוחקת ידע מהזיכרון."}]},
"q34":{"t":"t6","v":[{"q":"מה טען מורנו על הדרמה הספונטנית?","a":"שהשחקן יוצר אותה ובו בזמן משתחרר ממנה","w":["שהיא מתאימה רק לשחקנים מקצועיים","שהיא מגבירה את הטראומה","שהיא דורשת פירוש מתמיד"],"e":"מורנו טען שבדרמה ספונטנית השחקן יוצר אותה, ובו בזמן משתחרר ממנה. זו ההשפעה התרפויטית של ההמחזה. היא לא מיועדת רק לשחקנים מקצועיים."},{"q":"מה הוא מנגנון ההדחקה?","a":"העלמת אירועים מהתודעה","w":["יציאה מהרגע בזמן לחץ","ביטוי רגשות דרך דמויות","פורקן רגשי בהמחזה"],"e":"הדחקה היא העלמה של אירועים מהתודעה. יציאה מהרגע היא ניתוק, ביטוי דרך דמויות הוא השלכה, ופורקן רגשי הוא קתרזיס."}]}};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#intro" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
