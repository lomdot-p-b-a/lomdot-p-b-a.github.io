<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: טיפול בילדה שחוותה התעללות מינית במשפחה - במסגרת קבוצת פסיכודרמה לילדים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"people",title:"מהי פסיכודרמה",blocks:[
  {h:"הגדרה",html:`${def("על מה הנושא",`מהי פסיכודרמה, ואיך משתמשים בה עם ילדים? הנושא מציג את השיטה ואת השאלה אם צריך לפרש לילד את מה שהוא משחק.<br><b>מה נלמד כאן:</b> פסיכודרמה · פסיכודרמה עם ילדים · לפרש או לא לפרש`)}${def("מושג מפתח",`<mark>פסיכודרמה</mark> ${E("Psychodrama")}: אמצעי טיפולי שבו האדם <b>חווה מחדש</b> מצבים משמעותיים בחייו ונפגש, בהמחזה, עם דמויות משמעותיות עבורו.`)}${tiles([["sprout","קתרזיס","פורקן רגשי בזמן ההמחזה","פורקן רגשי: כשמשחקים מחדש מצב קשה, רגשות שהיו ״תקועים״ יוצאים החוצה, וזה מקל.","כשדנה צועקת על ״הדמות המאיימת״ בהצגה, היא משחררת כעס שהחזיקה בפנים זמן רב."],["bulb","תובנה","הבנה של מה שקורה","דרך ההמחזה מבינים טוב יותר מה קורה לנו ולמה.","אחרי שהיא משחקת את הסצנה, דנה מבינה שהיא מפחדת בעיקר מלהישאר לבד."],["target","דרכים חדשות","חיפוש אפשרויות חדשות להתמודדות","אפשר לנסות בהצגה תגובות חדשות למצבים קשים, ולתרגל אותן לפני שמשתמשים בהן בחיים.","בסצנה דנה מתרגלת לומר ״די, אני לא מוכנה״, ולא רק לקפוא."]])}${ex("מורנו, <b>אבי הפסיכודרמה</b>, התחיל לעבוד כך עם ילדים לפני כשישים שנה. לטענתו, לאפשר לילדים לשחק באופן ספונטני את בעיותיהם מביא לתוצאות טיפוליות.")}`,q:"q1"},
  {h:"פסיכודרמה עם ילדים",html:`<p>בקבוצות ילדים יש קונפליקט חריף בין הצורך לשמור על התהליך הקבוצתי לבין הצרכים האישיים (יאלום). לכן הותאמה השיטה:</p>${tiles([["people","אין קהל","כולם משתתפים בתפקידים","בפסיכודרמה עם ילדים כולם משתתפים ומשחקים תפקיד, ואין ״צופים מהצד״.","כל ילדי הקבוצה מקבלים תפקיד בחתונה שדנה מביימת, גם אם רק אורחים."],["copies","תפאורה ותלבושות","חלק מהחימום, וגם ביטוי לא מילולי ויצירתי ושיתוף פעולה","הכנת הבמה והתלבושות היא חלק מהחימום. היא מאפשרת לבטא את עצמם בלי מילים, וגם לעבוד יחד.","דנה בוחרת צעיף אדום לדמות שלה, והקבוצה בונה יחד ״חדר״ מכיסאות."],["doc","מטאפורה","ילדים נשארים לרוב בתחום המטאפורה (אגדות, סיפורים), בעוד מבוגרים מעלים בעיות ישירות","ילדים מעדיפים לדבר על מה שקשה דרך סיפורים ואגדות, ולא ישירות. המרחק הזה מאפשר להם לגעת בכאב בלי להיבהל.","דנה לא מדברת על מה שקרה לה בבית, אלא כותבת סיפור על ילדה בשם לילי ביער."]])}${rem("דרך המטאפורה הילד נפגש עם רגשותיו ועם הדמויות המשמעותיות, חווה <b>קתרזיס</b>, ומגייס כוחות להתמודד.")}`,q:"q3"},
  {h:"לפרש או לא לפרש?",html:`${tiles([["x","באום (1973)","עימות ישיר עם שורשי הקונפליקט עלול להעלות חרדה והתנגדות אצל ילדים עם בעיות קשות","לפי באום, לעמת ילד ישירות עם שורש הבעיה עלול להפחיד אותו ולגרום לו להתנגד, במיוחד אם הבעיות קשות. לכן עדיף להישאר בתוך המשחק.","המנחה לא אומרת לדנה ״הסיפור הוא בעצם עלייך״, ונותנת לה להמשיך לשחק."],["check","אנה פרויד","חשוב מאוד לפרש ולהביא לילד הבנה של משמעות המשחק הסימבולי","לפי אנה פרויד, חשוב להסביר לילד מה המשמעות של המשחק שלו, כדי שיבין את עצמו.","לפי הגישה הזו, המנחה הייתה אומרת לדנה ״אולי לילי מרגישה כמו שאת מרגישה לפעמים?״."]])}${def("עמדת הכותבת",`יש <b>להתאים</b> את הטיפול לאישיות ולכוחות של המטופל, ולשקול את השאלה כל פעם מחדש. התשובה משתנה מילד לילד ומפסיכודרמה לפסיכודרמה.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"id",title:"הקבוצה ודנה",blocks:[
  {h:"הקבוצה",html:`${def("על מה הנושא",`המאמר עוקב אחרי ילדה אחת, דנה, בתוך קבוצה טיפולית. הנושא מכיר את הקבוצה, את דנה ואת מטרות הטיפול.<br><b>מה נלמד כאן:</b> הקבוצה · דנה · מטרות`)}<p>הקבוצה פעלה <b>במוסד טיפולי</b> שבו גרו הילדים: 6 ילדים (3 בנים, 3 בנות) בגילאי 10 עד 12, שבעה מבוגרים <b>קו־תרפיסטים</b> (עובדים סוציאליים של המוסד, כל אחד צמוד לילד קבוע), והמנחה.</p>${fig("session")}${rem("<b>הפרוטגוניסט</b>, הגיבור המרכזי, סיפר את הסיפור, חילק תפקידים והנחה את התפאורה והתחפושות. מעניין: הילדים כמעט לא הביאו את המציאות של חייהם, אלא אגדות או סיפורים דמיוניים.")}`,q:"q7"},
  {h:"דנה",html:`<p>דנה (שם בדוי) טופלה בקבוצה <b>מגיל 10 עד 12</b>. היא הגיעה למוסד בעקבות טראומה של התעללות מינית מצד אביה, שעליה ריצה האב עונש מאסר.</p>${tiles([["x","בעיות התנהגות","קשות, והפרעות רגשיות (אפקטיביות)"],["brain","ריכוז וניתוקים","הפרעות ריכוז, ניתוקים ובעיות הסתגלות"],["people","דחייה חברתית","הילדים דחו אותה, והיא הרבתה לדבר לעצמה","לפני הטיפול, הילדים דחו את דנה והיא הרבתה לדבר לעצמה. זה חלק מהתמונה שבגללה הגיעה לטיפול.","בהפסקה דנה ישבה לבד ודיברה בשקט עם עצמה."]])}${rem("ההפרעות האלה <b>שכיחות</b> אצל נפגעי התעללות מינית.")}`,q:"q9"},
  {h:"מטרות הטיפול",html:`${tiles([["brain","1. עיבוד","לאפשר לה לעבד את הטראומה"],["link","2. אמון","לפתח קשרים עם בני גילה ועם מבוגרים, על בסיס יכולת לתת אמון"],["clock","3. ויסות","לדחות סיפוקים ולא להגיב בתוקפנות לתסכול"],["sprout","4. דימוי","לפתח דימוי עצמי ודימוי גוף חיוביים"]])}${fig("journey","הפסיכודרמות שבהן דנה הייתה הגיבורה")}`,q:"q11"}
 ]},
 {id:"t3",icon:"cycle",title:"ניתוק, כעס ואמון",blocks:[
  {h:"פסיכודרמה 1: החתונה",html:`${def("על מה הנושא",`בהתחלה דנה "התנתקה" בכל פעם שהיה קשה. הנושא מראה איך הפסיכודרמה עזרה לה להתחיל להרגיש ולסמוך.<br><b>מה נלמד כאן:</b> ניתוק (דיסוציאציה) · הכפיל · חילופי תפקידים`)}<p>כחודש אחרי תחילת הקבוצה, דנה ביקשה להציג חתונה, בתפקיד <b>הכלה</b>. כל הילדים השתתפו בהכנות. מתחת לחופה, לפתע עיניה התרוצצו \"כחיה המבקשת מוצא\": היא <b>התנתקה</b> מהמתרחש והוצפה חרדות.</p>${def("מנגנון ההינתקות",`<mark>ניתוק (דיסוציאציה)</mark> ${E("Dissociation")}: מנגנון שדנה השתמשה בו לעתים קרובות, ושכיח אצל נפגעות אלימות מינית.`)}${rem("הקבוצה עוד לא הייתה בשלה. \"אם הכלה\" הודיעה שהכלה חשה ברע והחגיגה נדחית, והמוזמנים הבטיחו לבוא. כך הקבוצה <b>הכילה</b> את דנה ונתנה <b>אישור</b> לתגובת הניתוק.")}${ex(`<b>ניתוק</b>: ילד שבזמן ריב צועק בבית "מכבה" את עצמו: הוא שם, אבל כאילו לא שומע ולא מרגיש. כך הוא מגן על עצמו מכאב.`)}`,q:"q13"},
  {h:"פסיכודרמה 2: סינדרלה והעלפון",html:`<p>בתפקיד סינדרלה דנה כעסה על האם החורגת: \"לא שמרת עלי!\". ייתכן שזה ביטוי לכעס על אם שלא הגנה עליה. אחר כך ביקשה שוב את החתונה, בלי להזמין את אבי הכלה, ולחשה: \"אני מתעלפת!\".</p>${def("הכפיל",`המנחה כרעה לצידה ולחשה: \"אני כל כך פוחדת. כולם ילכו ואני אשאר איתו\", והציעה לה לחזור על המילים רק אם הן מדויקות לה. דנה חזרה. זה תפקיד ה<mark>כפיל</mark> ${E("Double")}, ונתינת מילים לרגש <b>הוציאה אותה מהניתוק</b>.`)}${ex(`<b>הכפיל</b>: חבר בקבוצה או המנחה עומד ליד הילד ואומר בקול את מה שהילד אולי מרגיש ולא מעז להגיד.`)}`,q:"q15"},
  {h:"חילופי תפקידים",html:`<p>דנה ביקשה עזרה מ<b>אמא</b>. במציאות האם התעלמה ממצוקתה, אבל כאן ביקשה <b>אם אידיאלית</b> שתגן עליה. ב<mark>חילופי תפקידים</mark> ${E("Role reversal")} דנה שיחקה גם את הכלה וגם את האם, ואחר כך גם את החתן.</p>${tiles([["x","החלק הפגוע","נפחד ומסרב לתת אמון","החלק בתוך האדם שנפגע בעבר, ולכן מפחד ולא מוכן לסמוך על אחרים.","דנה מגלמת את החלק בתוכה שאומר ״אל תתקרבי, יפגעו בך שוב״."],["check","החלק המאמין","מאמין בכוחו ובזולת","החלק שעדיין מאמין בעצמו ובאנשים. בטיפול נותנים לשני החלקים ״לדבר״ זה עם זה.","דנה מגלמת גם את החלק שאומר ״יש אנשים טובים, ואת חזקה״."]])}${rem("למלא <b>שלושה תפקידים</b> לסירוגין היה הישג גדול לילדה נוקשה מאוד. הכלה ביקשה מהחתן שלא יפגע בה, הוא נשבע, והיא חזרה לאורחים. דנה בחנה כאן את יכולתה <b>לתת אמון</b> בבני המין השני.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"doc",title:"הסיפור של לילי",blocks:[
  {h:"להיות חלק",html:`${def("על מה הנושא",`דרך סיפור על ילדה אחרת, לילי, דנה התחילה לגעת בסיפור שלה.<br><b>מה נלמד כאן:</b> להיות חלק · הסיפור של לילי · סוף אחר`)}<p>בחודשיים שאחרי, דנה מילאה תפקידים בפסיכודרמות של ילדים אחרים, בגמישות הולכת וגדלה.</p>${rem("לילדה מנותקת ומסוגרת היה ערך רב ל<b>תחושת השייכות</b>: לקבל תפקידים, לבצע אותם באמפתיה, ולהסתפק לפעמים בתפקיד שולי ולא להיות במרכז.")}`,q:"q19"},
  {h:"פסיכודרמה 3: הסיפור",html:`<p>דנה כתבה סיפור על לילי, שמגיעה לחברותיה. אביהן מחזר אחריה, מגרש את אשתו, ובסוף מבקש את ידה. לילי נעתרת לו, ואומרת לנסיך שליבה נתון לאחר.</p>${def("גישת הכותבת",`בגישה הפסיכודרמטית היא <b>לא פירשה</b> את הסיפור, אלא אפשרה לדנה לחוות את התוכן דרך ההצגה. בסיפור יש תכנים <mark>השלכתיים</mark> ${E("Projective")} רבים.`)}${tiles([["scales","אמביוולנטיות","דמות האב מבלבלת: לפעמים אלימה ומפחידה, לפעמים רכה ומפתה"],["x","רגשות אשם","דמות האם השלילית היא אולי ניסיון של לילי להצדיק את מעשיה","בסיפור שכתבה, דמות האם השלילית יכולה להיות דרך של הגיבורה ״להצדיק״ את מה שעשתה. כך ילדה מתמודדת עם תחושת אשמה.","לילי בסיפור בורחת מהבית, והאם בסיפור מתוארת כרעה, אולי כדי שהבריחה ״תהיה בסדר״."],["lock","בידוד","היער שמקיף את הבית מבטא את הבידוד והניתוק של המשפחה","היער שמקיף את הבית בסיפור מסמל בידוד וניתוק של המשפחה מהעולם.","בסיפור של דנה אין שכנים ואין חברים, רק יער סביב הבית."]])}`,q:"q21"},
  {h:"פסיכודרמה 4: סוף אחר",html:`<p>בסוף ההצגה המנחה הציעה להמציא סוף אחר, ודנה <b>סירבה</b>. לפי הכותבת, זה מבטא את הקושי לדחות את האב, אפילו בהמחזה.</p>${ex("כחודש אחר כך דנה ביקשה להציג שוב. הפעם, כשהאב ביקש את ידה, צעקה: \"אני לא רוצה אותך ולא את המתנות שלך!\", וגייסה את כל כוחה כדי להרחיק אותו. בסוף נראתה מותשת, עם חיוך של <b>הקלה ושחרור</b>.")}${rem("אחרי הפסיכודרמה הזו הצוות דיווח על <b>שינוי משמעותי</b>: היא התחילה לשלוט בצרכיה, נעשתה רגועה יותר, ויכולת הריכוז שלה בכיתה עלתה.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"sprout",title:"חוויה מתקנת ופרידה",blocks:[
  {h:"פסיכודרמה 5: הפחד",html:`${def("על מה הנושא",`השלב שבו דנה חווה מחדש את הפחד, אבל הפעם עם סוף טוב יותר.<br><b>מה נלמד כאן:</b> הצגת הפחד · חוויה מתקנת · ביבליותרפיה והמכתב`)}<p>כשנה אחרי ההתחלה דנה התחילה להקפיד על הופעתה, הופיעו סימני התבגרות, והיא התחילה להגיב <b>בחום למגע</b> שבעבר נרתעה ממנו.</p>${def("למה להציג את הפחד",`הצגת \"הדבר שאני פוחד ממנו\" נותנת <b>תחושת שליטה</b>: הילד הוא המחזאי, הבמאי והשחקן הראשי, וזה מקנה ביטחון.`)}<p>דנה סיפרה על פחד מדמות של איש שבא בלילה. בחילופי התפקידים היא קפאה. המנחה הסבירה שכאן היא <b>מוגנת</b>, שהיא יכולה לבחור תגובה אחרת מזו שבמציאות, ושהקבוצה תעזור בכל כיוון. הצוות בדק בזהירות כל הזמן אם היא רוצה להמשיך.</p>`,q:"q25"},
  {h:"חוויה מתקנת",html:`${ex("דנה בחרה להילחם והרחיקה את האיש: \"אני מספיק חזקה כדי להילחם בך! ... אני לא פוחדת ממך יותר!\"")}${def("מושג מפתח",`<mark>חוויה מתקנת</mark> ${E("Corrective experience")}: לחוות מחדש מצב טראומטי ולהגיב אחרת, מתוך כוח. כאן זה אפשר לדנה להשתחרר מתחושת <b>חוסר האונים</b>.`)}${rem("בתמונה האחרונה דנה \"הגדולה\", בת 12, פגשה את דנה \"הקטנה\" ואמרה לה שהיא מבינה שאז לא יכלה לעשות כלום, כי הייתה קטנה ולא היה מי שיעזור, אבל <b>עכשיו היא תמיד תשמור עליה</b>.")}`,q:"q27"},
  {h:"פסיכודרמה 6: המכתב",html:`<p>לקראת הסיום, אחרי כשנתיים: הישגיה השתפרו, היא אחראית, מתחשבת ומקובלת, ויש לה חבר מהמוסד. אמה, שהתגרשה, ביקשה לגדל אותה שוב.</p>${def("ביבליותרפיה",`כדי לברר מה דנה באמת רוצה (ולא רק לרצות את אמה), המנחה השתמשה ב<mark>ביבליותרפיה</mark> ${E("Bibliotherapy")}: סיפור על ילד שגר אצל דודיו, ומקבל מכתב מהוריו שמבקשים שיחזור. כל ילד כתב את המכתב של הילד.`)}${ex("דנה כתבה שהילד מודה לדודים שטיפלו בו באהבה, אבל מתגעגע ורוצה לחזור. היא הקריאה את המכתב והוסיפה שגם היא מקווה לחזור לחיות עם אמה.")}`,q:"q29"}
 ]},
 {id:"t6",icon:"check",title:"סיכום",blocks:[
  {h:"מה השתנה",html:`${def("על מה הנושא",`מה השתנה אצל דנה, ואיך מסבירים את השינוי?<br><b>מה נלמד כאן:</b> מה השתנה · שלושת שלבי השינוי · מהדחקה לביטוי`)}<p>במשך שנתיים דנה בנתה יחסים של <b>אמון ופתיחות</b> עם הקבוצה, ביטאה את פחדיה, את רגשות האשם ואת הכעס כלפי אביה, <b>בלי ששמו הוזכר במפורש ולו פעם אחת</b>. היא למדה לקבל ולאהוב את עצמה ואת גופה.</p>${tiles([["id","דימוי עצמי","מילדה מוזנחת בחיצוניות לילדה נעימה ומטופחת","אחד הסימנים לשינוי: דנה התחילה לראות את עצמה אחרת. זה בא לידי ביטוי גם בהופעה החיצונית.","דנה, שהגיעה בהתחלה מוזנחת, התחילה להגיע לקבוצה מסודרת ומטופחת."],["grad","לימודים","שיפור ניכר בהישגים","גם בלימודים היה שיפור ניכר. לפי הכותבת, כשכבר לא צריך לבזבז כוח על הדחקה, נשאר כוח ללמוד.","המורה דיווחה שדנה מתרכזת יותר בשיעור, והציונים שלה עלו."],["people","חברה","הפכה למנהיגה טבעית, והילדים הצטערו על עזיבתה"]])}`,q:"q31"},
  {h:"איך להבין את השינוי",html:`${def("שלושת שלבי השינוי (קזדין)",`שינוי ב<b>תחושה הסובייקטיבית</b> של הדימוי העצמי, <b>ירידה בסימפטומים</b>, ו<b>שינוי בתפקוד</b>. לפי הכותבת, שלושתם קרו אצל דנה.`)}${def("מנגנון ההדחקה",`בהתחלה דנה השתמשה ב<mark>הדחקה</mark> ${E("Repression")} כדי להעלים מהתודעה את האירועים. ההדחקה צורכת <b>הרבה אנרגיה</b>, ולא נשארו כוחות לחשיבה, למידה וזכירה. כשהטראומה עובדה בפסיכודרמה, <b>השתחררו כוחות</b> לדברים אחרים.`)}${rem("מורנו: \"הדרמה הספונטנית משפיעה באורח תרפויטי על השחקן, אשר יוצר את הדרמה ובו בזמן משחרר עצמו ממנה\". דנה שחזרה את הטראומה באופן השלכתי, ובמקביל שחררה את עצמה ממנה.")}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"ילד מציג בקבוצה ריב עם אחיו, צועק את מה שלא העז לומר, ומרגיש הקלה גדולה. איזה מרכיב של פסיכודרמה זה?","a":"קתרזיס (פורקן רגשי)","w":["תובנה על מה שקרה","דרכים חדשות להתמודדות","חילופי תפקידים"],"e":"צעקה של מה שלא העז לומר, ואחריה הקלה גדולה, היא קתרזיס: פורקן רגשי בזמן ההמחזה. תובנה הייתה הבנה חדשה של מה שקרה, ופה מדובר בשחרור של רגש."},{"q":"מה מבדיל פסיכודרמה משיחה טיפולית רגילה?","a":"האדם חווה מחדש מצבים בהמחזה, מול דמויות משמעותיות","w":["המטפל מפרש כל מה שהמטופל אומר בשיחה","המטופל רק צופה בהצגה שאחרים מעלים","הטיפול מתבסס בעיקר על תרופות ובדיקות"],"e":"בפסיכודרמה המטופל חווה מחדש מצבים בהמחזה, מול דמויות משמעותיות, וזה הלב של השיטה. בשיחה רגילה מדברים על המצב, בלי לחוות אותו מחדש."}]},
"q2":{"t":"t1","v":[{"q":"מי נחשב לאבי הפסיכודרמה?","a":"מורנו","w":["יאלום","פרויד","אריקסון"],"e":"מורנו נחשב לאבי הפסיכודרמה. הוא התחיל לעבוד כך עם ילדים לפני כשישים שנה. יאלום עסק בטיפול קבוצתי, אבל לא הוא המייסד."},{"q":"מה טען מורנו על משחק ספונטני של ילדים?","a":"שמשחק ספונטני של הבעיות מביא לתוצאות טיפוליות","w":["שצריך לפרש כל משחק לילד מיד","שילדים לא מתאימים לפסיכודרמה כלל","שמשחק ספונטני מגביר את החרדה"],"e":"מורנו טען שמשחק ספונטני של הבעיות מביא לתוצאות טיפוליות, ולכן ספונטניות היא מרכיב מרכזי בשיטה. הוא לא טען שצריך לפרש כל משחק."}]},
"q3":{"t":"t1","v":[{"q":"בקבוצת פסיכודרמה של ילדים אין קהל, וכולם משחקים. למה?","a":"כי זה עוזר לשמור על התהליך הקבוצתי","w":["כי ילדים לא אוהבים לצפות באחרים","כי אין מספיק מקום בחדר הטיפול","כי המנחה לא רוצה עדים להצגה"],"e":"כשכולם משחקים ואין קהל, כל הילדים שותפים, וזה עוזר לשמור על התהליך הקבוצתי. זו התאמה של השיטה לקבוצות ילדים, ולא עניין של מקום בחדר."},{"q":"למה ניתן דגש על תפאורה ותלבושות?","a":"חימום, ביטוי יצירתי ושיתוף","w":["כדי שההצגה תהיה יפה ומרשימה","כדי להרשים את הצוות במוסד","כי הילדים דרשו זאת מהמנחה"],"e":"תפאורה ותלבושות משמשות לחימום, לביטוי יצירתי ולשיתוף, ומאפשרות ביטוי לא מילולי. המטרה איננה שההצגה תהיה יפה."}]},
"q4":{"t":"t1","v":[{"q":"ילדה בוחרת להציג את ״שלגיה״ ולא את מה שקרה לה בבית. מה זה ממחיש?","a":"ילדים מעלים בעיות דרך מטאפורה","w":["הילדה לא רוצה לקבל טיפול","הילדה לא מבינה את המשימה","הילדה מעדיפה סיפורים מצחיקים"],"e":"ילדים מעלים בעיות דרך מטאפורה, למשל אגדה, ולא ישירות כמו מבוגרים. בחירה ב״שלגיה״ לא אומרת שהיא לא רוצה טיפול."},{"q":"איזה קונפליקט חריף במיוחד בקבוצות ילדים, לפי יאלום?","a":"בין הקבוצה לצרכי היחיד","w":["בין הילדים לבין ההורים","בין המנחה לבין הצוות","בין משחק לבין לימודים"],"e":"לפי יאלום, בקבוצות ילדים הקונפליקט בין צורכי הקבוצה לצורכי היחיד חריף במיוחד, ולכן השיטה הותאמה להם. הוא לא עסק כאן בקונפליקט עם ההורים."}]},
"q5":{"t":"t1","v":[{"q":"מה החשש של באום מעימות ישיר עם שורשי הקונפליקט?","a":"שיעורר חרדה והתנגדות","w":["שהילד ישתעמם במפגש","שהמנחה יאבד שליטה","שההורים יתנגדו לטיפול"],"e":"באום חשש שעימות ישיר עם שורשי הקונפליקט יעורר חרדה והתנגדות, ולכן נזהר מפירוש. החשש לא היה שהילד ישתעמם."},{"q":"מה עמדת אנה פרויד לגבי פירוש המשחק?","a":"חשוב לפרש ולהביא לילד הבנה","w":["אסור לפרש לילדים בכלל","צריך לפרש רק להורים","צריך לפרש רק אחרי שנה"],"e":"אנה פרויד סברה שחשוב לפרש את המשחק ולהביא לילד הבנה, עמדה הפוכה לזו של באום. היא לא אסרה פירוש לילדים."}]},
"q6":{"t":"t1","v":[{"q":"מה עמדת הכותבת בשאלה אם לפרש?","a":"להתאים לכל ילד ולכל מפגש מחדש","w":["תמיד לפרש, כמו אנה פרויד","אף פעם לא לפרש, כמו באום","לפרש רק בסוף הטיפול"],"e":"הכותבת לא נוקטת עמדה קבועה, אלא מתאימה את ההחלטה אם לפרש לכל ילד ולכל מפגש מחדש. היא לא מאמצת את אנה פרויד או את באום במלואם."},{"q":"ילד מציג דמות של מלך כועס, ונראה שזה מבטא את הכעס שלו עצמו. איך נקרא תוכן כזה?","a":"השלכתי","w":["קתרזיס","חוויה מתקנת","מנגנון הדחקה"],"e":"כשילד מבטא את הכעס שלו דרך דמות של מלך כועס, זה תוכן השלכתי: רגשות שמובעים דרך דמויות. קתרזיס הוא הפורקן עצמו, ולא הביטוי דרך דמות."}]},
"q7":{"t":"t2","v":[{"q":"בכל מפגש, כל ילד עבד גם עם מבוגר קבוע מהמוסד. מה היה תפקיד המבוגר?","a":"קו־תרפיסט צמוד","w":["צופה ומתעד בלבד","שחקן מקצועי מבחוץ","נציג ההורים בקבוצה"],"e":"המבוגר הקבוע, עובד סוציאלי של המוסד, היה קו־תרפיסט צמוד לכל ילד. הוא לא היה רק צופה ומתעד."},{"q":"מהו ״פרוטגוניסט״?","a":"הגיבור המרכזי","w":["המנחה של הקבוצה","הצופה בהצגה","הקו־תרפיסט"],"e":"הפרוטגוניסט הוא הגיבור המרכזי של ההצגה: הוא מספר את הסיפור ומחלק את התפקידים. המנחה הוא מי שמוביל את המפגש."}]},
"q8":{"t":"t2","v":[{"q":"מה מעניין בנושאים שהילדים בחרו להציג?","a":"הם הביאו בעיקר אגדות וסיפורים","w":["כולם הציגו אירועים מהבית","כולם בחרו סיפורים מצחיקים","הם סירבו להציג בכלל"],"e":"הילדים בחרו בעיקר אגדות וסיפורים, כלומר מטאפורות, כדרך עקיפה להעלות את הבעיות שלהם. הם לא הציגו בעיקר אירועים מהבית."},{"q":"מה סדר האירועים הקבוע במפגש?","a":"שיחה, חימום, בחירת גיבור, הכנה והצגה","w":["הצגה, שיחה, ואז חימום קצר","חימום, ואז סיום מיידי של המפגש","בחירת גיבור, ואז שיחה בלבד"],"e":"לכל מפגש היה מבנה קבוע: שיחה, חימום, בחירת גיבור, הכנה והצגה. החימום תמיד בא לפני ההצגה."}]},
"q9":{"t":"t2","v":[{"q":"באיזה גיל טופלה דנה בקבוצה?","a":"מגיל 10 עד 12","w":["מגיל 5 עד 7","מגיל 14 עד 16","מגיל 18 עד 20"],"e":"דנה טופלה בקבוצה כשנתיים, מגיל 10 עד 12."},{"q":"איזה מהבאים לא היה בין הקשיים של דנה כשהגיעה?","a":"הצטיינות","w":["הפרעות ריכוז","ניתוקים תכופים","דחייה חברתית"],"e":"כשהגיעה, לדנה היו הפרעות ריכוז, ניתוקים תכופים ודחייה חברתית. ההישגים שלה השתפרו רק בהמשך, ולכן היא לא הייתה מצטיינת."}]},
"q10":{"t":"t2","v":[{"q":"דנה מדברת לעצמה והילדים דוחים אותה. מה המאמר אומר על הקשיים האלה?","a":"שהם שכיחים אצל נפגעי טראומה כזו","w":["שהם נדירים ומפתיעים מאוד","שהם נובעים רק מהחיים במוסד","שהם מעידים על מחלה גנטית"],"e":"לפי המאמר, דיבור עצמי ודחייה חברתית שכיחים אצל נפגעי טראומה כזו. זה דפוס מוכר, ולא משהו נדיר או מפתיע."},{"q":"איך תוארה דנה בתחילת הטיפול?","a":"מוזנחת ונדחית","w":["מטופחת ומקובלת","שקטה ומצטיינת","מנהיגה בקבוצה"],"e":"בתחילת הטיפול דנה תוארה כמוזנחת ונדחית, ההפך מהמצב בסוף הטיפול."}]},
"q11":{"t":"t2","v":[{"q":"איזו מהבאות לא הייתה מטרה של הטיפול בדנה?","a":"להחזיר אותה מיד לבית האב","w":["לעבד את הטראומה","לפתח יכולת לתת אמון","לפתח דימוי עצמי חיובי"],"e":"ארבע המטרות של הטיפול היו עיבוד הטראומה, פיתוח אמון, ויסות ודימוי עצמי חיובי. החזרה מיידית לבית האב לא הייתה מטרה."},{"q":"דנה מתפרצת בכעס כשלא מקבלת מה שרצתה. לאיזו מטרה של הטיפול זה קשור?","a":"ויסות","w":["עיבוד הטראומה","פיתוח אמון","דימוי גוף"],"e":"התפרצויות זעם כשלא מקבלים מה שרוצים קשורות למטרה של ויסות: היכולת לשלוט בתגובות הרגשיות. היא לא קשורה לדימוי הגוף."}]},
"q12":{"t":"t2","v":[{"q":"כמה ילדים היו בקבוצה?","a":"6","w":["2","12","20"],"e":"בקבוצה היו 6 ילדים: שלושה בנים ושלוש בנות."},{"q":"למה חשוב שהילדים לא קיבלו טיפול פסיכולוגי אחר באותה תקופה?","a":"כדי לייחס את השינוי לפסיכודרמה","w":["כי זה אסור לפי החוק","כי לא היה תקציב לכך","כי הילדים סירבו לטיפול נוסף"],"e":"כשהילדים לא מקבלים טיפול אחר באותה תקופה, יש פחות הסברים חלופיים, ואפשר לייחס את השינוי לפסיכודרמה. זה לא נבע מאיסור בחוק."}]},
"q13":{"t":"t3","v":[{"q":"מתחת לחופה, דנה פתאום ״לא שם״: מבטה מתרוצץ והיא מוצפת חרדה. מה המנגנון?","a":"ניתוק","w":["הדחקה","השלכה","קתרזיס"],"e":"״לא שם״, מבט מתרוצץ והצפה בחרדה הם ניתוק, מנגנון שכיח אצל נפגעות אלימות. הדחקה היא העלמה של אירועים מהתודעה, ולא ״יציאה״ מהרגע."},{"q":"מה מבדיל ניתוק מהדחקה?","a":"ניתוק: ״יציאה״ מהרגע. הדחקה: העלמת אירועים מהתודעה","w":["ניתוק: העלמת זיכרונות. הדחקה: יציאה מהרגע","שניהם אותו מנגנון","ניתוק קורה רק בשינה"],"e":"בניתוק האדם ״יוצא״ מהרגע, ובהדחקה אירועים נעלמים מהתודעה. המסיח הראשון הופך ביניהם."}]},
"q14":{"t":"t3","v":[{"q":"כשדנה התנתקה, ״אם הכלה״ הודיעה שהחגיגה נדחית. מה זה עשה?","a":"הכיל את דנה ואישר את תגובתה","w":["הפסיק את הטיפול בה לגמרי","העניש אותה על ההתנהגות","העביר את התפקיד לילדה אחרת"],"e":"ההודעה שהחגיגה נדחית הכילה את דנה ואישרה את התגובה שלה, בלי לכפות עליה להמשיך. הקבוצה עוד לא הייתה בשלה לעבד את הנושא. זה לא היה עונש."},{"q":"למה לא עבדו על הנושא כבר בפסיכודרמה הראשונה?","a":"כי הן עוד לא היו בשלות","w":["כי המנחה לא שמה לב","כי לא היה זמן במפגש","כי דנה ביקשה להפסיק"],"e":"בשלב הראשון עוד לא נבנה מספיק אמון, ולכן לא עבדו על הנושא כבר בפסיכודרמה הראשונה. זה לא היה בגלל חוסר זמן."}]},
"q15":{"t":"t3","v":[{"q":"בתפקיד סינדרלה, דנה כועסת על האם החורגת שלא שמרה עליה. איך הכותבת מפרשת זאת?","a":"כעס על אם שלא הגנה","w":["כעס על המנחה","קנאה בילדות אחרות","פחד מהקו־תרפיסט"],"e":"הכותבת מפרשת את הכעס על האם החורגת כתוכן השלכתי: כעס על אם שלא הגנה עליה. הכעס לא מופנה למנחה."},{"q":"מהו תפקיד ה״כפיל״?","a":"לתת מילים לרגשות שהגיבור עוד לא אומר","w":["לשחק את הדמות השלילית בהצגה","להחליף את הגיבור כשהוא עייף","לצפות במתרחש ולתעד אותו"],"e":"הכפיל נותן מילים לרגשות שהגיבור עוד לא אומר, והגיבור מאמץ אותן רק אם הן מדויקות לו. הוא לא משחק את הדמות השלילית."}]},
"q16":{"t":"t3","v":[{"q":"מה עשה מתן המילים לרגש כשדנה ״התעלפה״?","a":"הוציא אותה מהניתוק","w":["העמיק את הניתוק","גרם לה לעזוב","לא השפיע עליה"],"e":"כשהכפיל נתן מילים לרגש, דנה יצאה מה״התעלפות״, מהניתוק. זה כוחו של הכפיל. זה לא העמיק את הניתוק."},{"q":"דנה רוצה לברוח מהחדר. מה המנחה מציעה?","a":"להתחבא בתוך החדר","w":["לצאת להפסקה קצרה","לסיים את המפגש מיד","לשבת בצד ולצפות"],"e":"המנחה הציעה לדנה להתחבא בתוך החדר, כדי שתישאר במרחב הבטוח ולא תברח ממנו. היא לא סיימה את המפגש."}]},
"q17":{"t":"t3","v":[{"q":"דנה משחקת בתורות את הכלה, את האם ואת החתן. איזו טכניקה זו?","a":"חילופי תפקידים","w":["כפיל","שיקוף בתנועה","ביבליותרפיה"],"e":"כשהגיבור משחק בתורות גם דמויות אחרות (האם, החתן), זו טכניקת חילופי תפקידים. כפיל הוא מישהו אחר שמשמיע את הרגשות של הגיבור."},{"q":"למה היה הישג לדנה למלא שלושה תפקידים?","a":"כי זה דרש ממנה גמישות","w":["כי זה היה ארוך מאוד","כי היא לא אהבה לשחק","כי אף ילד לא הצליח בזה"],"e":"מילוי שלושה תפקידים דרש מדנה גמישות: לגלם גם את החלק הפגוע וגם את החלק המאמין. זה הישג לילדה שנטתה לנוקשות ולניתוק."}]},
"q18":{"t":"t3","v":[{"q":"במציאות האם התעלמה ממצוקתה, אבל בהצגה דנה ביקשה אם שתגן עליה. מה היא ביקשה?","a":"אם אידיאלית","w":["אם חורגת","אם מענישה","אם רחוקה"],"e":"בהצגה דנה ביקשה אם שתגן עליה, כלומר אם אידיאלית, וכך השלימה את מה שחסר לה במציאות. זו לא אם מענישה או רחוקה."},{"q":"הכלה ביקשה מהחתן שלא יפגע בה, והוא נשבע. מה דנה בחנה כאן?","a":"את היכולת לתת אמון במין השני","w":["את היכולת לשחק מספר תפקידים","את הפחד מהמנחה","את הקשר עם האם"],"e":"כשהכלה ביקשה מהחתן שלא יפגע בה, והוא נשבע, דנה בחנה את היכולת לתת אמון במין השני. זו אחת ממטרות הטיפול."}]},
"q19":{"t":"t4","v":[{"q":"בחודשיים שאחרי, דנה שיחקה תפקידים צדדיים בהצגות של אחרים. למה זה חשוב?","a":"זה בנה שייכות ויכולת לא להיות במרכז","w":["זה לימד אותה טכניקות משחק","זה הסיח את דעתה מהטראומה","זה הוכיח שהיא החלימה לגמרי"],"e":"תפקידים צדדיים בהצגות של אחרים בנו אצל דנה שייכות ויכולת לא להיות במרכז. יש לכך ערך רב לילדה מנותקת. זה לא הוכיח שהיא החלימה לגמרי."},{"q":"מה השתנה אצל דנה בתפקידים בהצגות של אחרים?","a":"גמישות הולכת וגדלה","w":["סירוב הולך וגדל","היא הפסיקה להשתתף","היא דרשה להיות תמיד במרכז"],"e":"בתפקידים בהצגות של אחרים ניכרו אצל דנה גמישות ואמפתיה שהלכו וגדלו. היא לא דרשה להיות תמיד במרכז."}]},
"q20":{"t":"t4","v":[{"q":"דנה כתבה סיפור על לילי. האם המנחה פירשה אותו?","a":"לא, היא נתנה לה לחוות","w":["כן, בפירוט מלא","כן, רק להורים","כן, מול כל הקבוצה"],"e":"המנחה לא פירשה את הסיפור, אלא נתנה לדנה לחוות אותו, בהתאם לגישה הפסיכודרמטית. היא לא פירשה אותו מול הקבוצה."},{"q":"דמות האב בסיפור לפעמים מפחידה ולפעמים רכה ומפתה. מה זה מבטא?","a":"רגשות סותרים","w":["קתרזיס","ניתוק","ויסות"],"e":"אב שלפעמים מפחיד ולפעמים רך ומפתה מבטא רגשות סותרים כלפי אותה דמות. זה לא ניתוק."}]},
"q21":{"t":"t4","v":[{"q":"מה מבטא היער שמקיף את הבית בסיפור?","a":"בידוד המשפחה","w":["חופש ושמחה","עושר המשפחה","סכנה מבחוץ בלבד"],"e":"היער שמקיף את הבית מבטא את הבידוד של המשפחה. זה תוכן השלכתי. הוא לא מבטא חופש ושמחה."},{"q":"מה ייתכן שמבטאת דמות האם השלילית בסיפור?","a":"רגשות אשם","w":["כעס על המנחה","אהבה לאם האמיתית","פחד מהקו־תרפיסט"],"e":"דמות האם השלילית בסיפור אולי מבטאת רגשות אשם. היא לא מבטאת כעס על המנחה."}]},
"q22":{"t":"t4","v":[{"q":"המנחה הציעה לדנה להמציא סוף אחר לסיפור, והיא סירבה. מה זה מבטא לפי הכותבת?","a":"קושי לדחות את האב","w":["שהיא אהבה את הסוף הקיים","שהיא התעייפה מההצגה","שהיא כעסה על המנחה"],"e":"לפי הכותבת, הסירוב להמציא סוף אחר מבטא קושי לדחות את האב: דנה עדיין לא הייתה מוכנה לכך. זה לא בגלל שאהבה את הסוף הקיים."},{"q":"מה מראה ההבדל בין הפעם הראשונה לשנייה שבה הוצג הסיפור?","a":"שינוי הדרגתי ביכולת לדחות","w":["שהסיפור השתנה בלי סיבה","שדנה שכחה את הסיפור","שהמנחה כפתה סוף אחר"],"e":"ההבדל בין הפעם הראשונה לשנייה מראה שינוי הדרגתי ביכולת לדחות את האב. המנחה לא כפתה סוף אחר."}]},
"q23":{"t":"t4","v":[{"q":"בפעם השנייה, דנה דחתה את דמות האב בכל הכוח ונראתה מותשת ומשוחררת. מה דיווח הצוות אחר כך?","a":"רוגע ושיפור בריכוז","w":["החמרה בהתנהגות","ניתוקים תכופים יותר","בקשה להפסיק טיפול"],"e":"אחרי שדחתה את דמות האב בכל הכוח, הצוות דיווח על רוגע ועל שיפור בריכוז. זה שינוי משמעותי, ולא החמרה."},{"q":"איך הגיבה דנה הפעם להצעה של האב בסיפור?","a":"דחתה אותו בצעקה ובכוח","w":["הסכימה, כמו בפעם הקודמת","התנתקה מהסצנה","ביקשה להפסיק את ההצגה"],"e":"הפעם דנה דחתה את האב בצעקה ובכוח, וסיימה בחיוך של הקלה. בפעם הקודמת היא לא הצליחה לדחות אותו."}]},
"q24":{"t":"t4","v":[{"q":"למה עיבוד רגשי של הטראומה שיפר גם את הריכוז בכיתה?","a":"כי השתחררה אנרגיה שהושקעה בהדחקה","w":["כי היא קיבלה עזרה בשיעורי בית","כי היא עברה לכיתה קטנה","כי היא התחילה לקחת תרופה"],"e":"הדחקה צורכת אנרגיה רבה. כשהטראומה עובדה, האנרגיה הזו השתחררה, ואפשר היה להשקיע אותה בריכוז ובלמידה. זה לא בגלל עזרה בשיעורי בית."},{"q":"מה מראות שתי ההצגות של הסיפור יחד?","a":"שעיבוד טראומה הדרגתי","w":["שפסיכודרמה עובדת בפעם אחת","שצריך תמיד לכפות סוף אחר","שהסיפור לא היה קשור אליה"],"e":"דנה חזרה לסיפור כשהייתה מוכנה, ובפעם השנייה הצליחה לדחות את האב. זה מראה שעיבוד טראומה הוא תהליך הדרגתי, ולא קורה בפעם אחת."}]},
"q25":{"t":"t5","v":[{"q":"למה הצגת ״הדבר שאני פוחד ממנו״ עוזרת לילד?","a":"כי היא נותנת לו תחושת שליטה","w":["כי הפחד נעלם כשמדברים עליו","כי זה מבדר את כל הקבוצה","כי זה מקצר את משך הטיפול"],"e":"הצגה של הדבר שמפחיד את הילד נותנת לו תחושת שליטה בפחד, ותחושת שליטה מקנה ביטחון. הפחד לא ״נעלם״ רק כי מדברים עליו."},{"q":"איזה שינוי ניכר אצל דנה כשנה אחרי תחילת הטיפול?","a":"הקפדה על הופעתה","w":["החמרה בניתוקים","סירוב להשתתף","מעבר למוסד אחר"],"e":"כשנה אחרי תחילת הטיפול ניכר שינוי: דנה התחילה להקפיד על הופעתה. זה שינוי בדימוי הגוף. הניתוקים לא החמירו."}]},
"q26":{"t":"t5","v":[{"q":"כשדנה קפאה בסצנה המפחידה, מה הדגישה המנחה?","a":"שכאן היא מוגנת ויכולה לבחור","w":["שצריך לסיים מיד את ההצגה","שהיא חייבת להמשיך בכל מחיר","שהיא לא צריכה לפחד מכלום"],"e":"כשדנה קפאה, המנחה הדגישה שכאן היא מוגנת ויכולה לבחור, ושהקבוצה תעזור לה בכל כיוון. היא לא כפתה עליה להמשיך."},{"q":"איך נוהלה הסצנה הקשה בפסיכודרמה החמישית?","a":"בזהירות ובבדיקה מתמדת","w":["מהר, כדי לא להאריך את הסבל","בלי קשר לתגובות של דנה","רק בדיבור, בלי המחזה"],"e":"את הסצנה הקשה ניהלו בזהירות, תוך בדיקה מתמדת של התגובות של דנה והדגשה של התמיכה. לא מיהרו לסיים אותה."}]},
"q27":{"t":"t5","v":[{"q":"דנה בוחרת בסצנה להילחם בדמות המאיימת ולהרחיק אותה, במקום לקפוא. איך נקראת החוויה הזו?","a":"חוויה מתקנת","w":["קתרזיס","ניתוק","חילופי תפקידים"],"e":"לחוות מחדש מצב מאיים ולהגיב אחרת, מתוך כוח, זו חוויה מתקנת. קתרזיס הוא פורקן רגשי, ופה העיקר הוא תגובה חדשה."},{"q":"ממה עזרה החוויה המתקנת לדנה להשתחרר?","a":"מתחושת חוסר האונים","w":["מהצורך בקבוצה","מהקשר עם האם","מהזיכרונות לגמרי"],"e":"החוויה המתקנת עזרה לדנה להשתחרר מתחושת חוסר האונים, ולעבור מתחושה של קורבן לתחושה של בעלת כוח. היא לא השתחררה מהזיכרונות לגמרי."}]},
"q28":{"t":"t5","v":[{"q":"דנה ״הגדולה״ אומרת לדנה ״הקטנה״ שאז לא יכלה לעשות כלום, ועכשיו תשמור עליה. מה המשמעות?","a":"הורדת האשמה העצמית","w":["כעס על עצמה מהעבר","שכחה של מה שקרה","ויתור על הקשר עם האם"],"e":"כשהיא אומרת לעצמה הקטנה ״אז לא יכולת לעשות כלום״, היא מורידה מעצמה את האשמה העצמית, ומתפייסת עם הילדה שהייתה. זה לא כעס על עצמה."},{"q":"מה הסבירה המנחה לדנה כשקפאה?","a":"שכאן היא מוגנת","w":["שהיא צריכה להתאמץ יותר","שהיא יכולה ללכת הביתה","שאין לה סיבה לפחד"],"e":"כשדנה קפאה, המנחה הסבירה לה שכאן היא מוגנת, ושיש לה בחירה שלא הייתה לה במציאות. היא לא אמרה שאין לה סיבה לפחד."}]},
"q29":{"t":"t5","v":[{"q":"כדי לברר אם דנה רוצה לחזור לאמה, המנחה הציגה סיפור על ילד שמקבל מכתב מהוריו. איזו טכניקה זו?","a":"ביבליותרפיה","w":["כפיל","חילופי תפקידים","שיקוף"],"e":"שימוש בסיפור כדי לברר רגשות ורצונות הוא ביבליותרפיה. חילופי תפקידים היו מחייבים את דנה לגלם דמות בעצמה."},{"q":"למה לא שאלו את דנה ישירות אם היא רוצה לחזור?","a":"כדי לשמוע את רצונה האמיתי","w":["כי היא לא ידעה לענות","כי אסור לשאול ישירות","כי ההורים התנגדו"],"e":"דנה נטתה לרצות את אמה, ולכן שאלה ישירה הייתה עלולה להביא לתשובה מרצה. הסיפור אפשר לשמוע את הרצון האמיתי שלה."}]},
"q30":{"t":"t5","v":[{"q":"מה כתבה דנה במכתב של הילד מהסיפור?","a":"שהוא מודה, אבל רוצה לחזור","w":["שהוא רוצה להישאר אצל הדודים","שהוא כועס מאוד על ההורים","שהוא לא יודע מה הוא רוצה"],"e":"במכתב של הילד דנה כתבה שהוא מודה לדודים, אבל רוצה לחזור הביתה, והוסיפה שגם היא רוצה לחזור לאמה."},{"q":"איך תוארה דנה לקראת סיום הטיפול?","a":"אחראית ומקובלת","w":["מנותקת ומבודדת","תוקפנית ונדחית","מוזנחת ושקטה"],"e":"לקראת סיום הטיפול דנה תוארה כאחראית ומקובלת, עם הישגים טובים יותר וחבר. זה ההפך מהמצב בתחילת הטיפול."}]},
"q31":{"t":"t6","v":[{"q":"מה מיוחד בכך שדנה ביטאה כעס כלפי אביה לאורך הטיפול?","a":"שמו לא הוזכר במפורש אף פעם","w":["שהיא אמרה זאת לאביה ישירות","שזה קרה רק בפגישה הראשונה","שהיא אמרה זאת רק להורים"],"e":"דנה ביטאה כעס כלפי אביה לאורך הטיפול, אבל שמו לא הוזכר במפורש אף פעם. הכל עבר דרך מטאפורה. היא לא אמרה לו זאת ישירות."},{"q":"איזה מעמד קיבלה דנה במוסד בסוף?","a":"מנהיגה טבעית","w":["ילדה מבודדת","ילדה נדחית","ילדה שקטה ולא בולטת"],"e":"בסוף הטיפול דנה הפכה למנהיגה טבעית במוסד, והילדים הצטערו על עזיבתה."}]},
"q32":{"t":"t6","v":[{"q":"מה מראה השינוי בהופעה החיצונית של דנה?","a":"שיפור בדימוי העצמי ובדימוי הגוף","w":["שהיא קיבלה בגדים חדשים מהמוסד","שהיא רצתה לרצות את המנחה","שהמוסד שינה את הכללים שלו"],"e":"השינוי בהופעה החיצונית משקף שיפור בדימוי העצמי ובדימוי הגוף, שהיו מהמטרות של הטיפול. זה לא קרה כי קיבלה בגדים מהמוסד."},{"q":"מה ניתן ללמוד מכך שהשינוי ארך שנתיים?","a":"שעיבוד טראומה הדרגתי","w":["שהטיפול לא היה יעיל","שצריך תמיד שנתיים בדיוק","שהשינוי היה מקרי"],"e":"השינוי ארך שנתיים, כי עיבוד טראומה הוא תהליך הדרגתי, בקצב של המטופלת. זה לא אומר שהטיפול לא היה יעיל."}]},
"q33":{"t":"t6","v":[{"q":"לפי קזדין, אילו שלושה שינויים מעידים על הצלחת טיפול?","a":"בדימוי העצמי, בסימפטומים ובתפקוד","w":["בציונים, במשקל ובשינה","בקשר עם ההורים, עם המנחה ועם המוסד","במשחק, בדיבור ובכתיבה"],"e":"לפי קזדין, הצלחת טיפול נמדדת בשינוי בשלושה תחומים: דימוי עצמי, סימפטומים ותפקוד. לפי הכותבת, שלושתם קרו אצל דנה."},{"q":"למה ההדחקה פגעה בלימודים של דנה?","a":"כי היא צורכת אנרגיה רבה","w":["כי היא מוחקת ידע מהזיכרון","כי היא גורמת לעייפות פיזית","כי היא מונעת הגעה לכיתה"],"e":"הדחקה צורכת אנרגיה רבה, ואנרגיה זו חסרה לחשיבה, ללמידה ולזכירה, ולכן נפגעו הלימודים. ההדחקה לא מוחקת ידע מהזיכרון."}]},
"q34":{"t":"t6","v":[{"q":"מה טען מורנו על הדרמה הספונטנית?","a":"שהשחקן יוצר אותה ובו בזמן משתחרר ממנה","w":["שהיא מתאימה רק לשחקנים מקצועיים","שהיא מגבירה את הטראומה","שהיא דורשת פירוש מתמיד"],"e":"מורנו טען שבדרמה ספונטנית השחקן יוצר אותה, ובו בזמן משתחרר ממנה. זו ההשפעה התרפויטית של ההמחזה. היא לא מיועדת רק לשחקנים מקצועיים."},{"q":"מה הוא מנגנון ההדחקה?","a":"העלמת אירועים מהתודעה","w":["יציאה מהרגע בזמן לחץ","ביטוי רגשות דרך דמויות","פורקן רגשי בהמחזה"],"e":"הדחקה היא העלמה של אירועים מהתודעה. יציאה מהרגע היא ניתוק, ביטוי דרך דמויות הוא השלכה, ופורקן רגשי הוא קתרזיס."}]},
"h1":{"t":"t1","v":[{"q":"מנחה שוקלת אם להסביר לילד שהדרקון בהצגה ״הוא בעצם אבא״. מה עמדת הכותבת?","a":"להחליט לפי הילד וכוחותיו, ולשקול כל פעם מחדש","w":["תמיד לפרש לילד, כי בלי הבנה מילולית אין שינוי אמיתי","לעולם לא לפרש, כי זה מעורר חרדה והתנגדות","לפרש רק אם הקבוצה כולה מסכימה לפירוש"],"e":"באום נגד פירוש (חרדה, התנגדות), אנה פרויד בעד. הכותבת: תלוי בילד ובפסיכודרמה. עם דנה היא בחרה לא לפרש."}]},
"h2":{"t":"t1","v":[{"q":"מה ההבדל המרכזי בין פסיכודרמה עם ילדים לפסיכודרמה עם מבוגרים לפי המאמר?","a":"ילדים נשארים במטאפורה; מבוגרים משתמשים בה כדי להגיע לבעיה","w":["ילדים צריכים קהל צופה; מבוגרים עובדים בלי קהל","ילדים לא חווים קתרזיס בהמחזה; מבוגרים כן חווים","ילדים מביאים מציאות מחייהם; מבוגרים מביאים בעיקר אגדות וסיפורים"],"e":"ילדים נשארים לרוב בתחום האגדות והסיפורים. בפסיכודרמה עם ילדים גם אין קהל: כולם משתתפים."}]},
"h3":{"t":"t3","v":[{"q":"בפסיכודרמת החתונה דנה התנתקה, והקבוצה ״דחתה את החגיגה״. מה הייתה המשמעות?","a":"הכלה של דנה ואישור לתגובת הניתוק שלה","w":["פירוש של הניתוק כקשור ישירות לאב ולפגיעה","עונש על כך שלא שיתפה פעולה בהצגה","מעבר מתוכנן מראש לחילופי תפקידים"],"e":"הקבוצה עוד לא הייתה בשלה לעיבוד. ״הכלה חשה ברע״ ו״המוזמנים יבואו״: הכילו אותה ונתנו לגיטימציה."}]},
"h4":{"t":"t3","v":[{"q":"הכפיל לחש לדנה ״אני כל כך פוחדת...״. למה היה חשוב שתחזור על המילים רק אם הן מדויקות לה?","a":"כדי שהמילים יבטאו את הרגש שלה ולא ייכפו עליה","w":["כדי לבדוק אם היא מבינה עברית","כדי שהקבוצה תשמע את הסיפור האמיתי","כדי להכין אותה לחילופי תפקידים עם האב בהמשך הטיפול"],"e":"הכפיל מציע מילים לרגש. נתינת מילים מדויקות לרגש היא שהוציאה אותה מהניתוק."}]},
"h5":{"t":"t4","v":[{"q":"דנה סירבה בהתחלה להמציא סוף אחר לסיפור לילי. כיצד הכותבת פירשה את הסירוב?","a":"קושי לדחות את האב, אפילו בהמחזה","w":["חוסר עניין בפסיכודרמה של עצמה באותו שלב","התנגדות למנחה כדמות סמכותית","סימן שהסיפור לא קשור לחייה"],"e":"חודש אחר כך היא בחרה בעצמה סוף אחר: ״אני לא רוצה אותך ולא את המתנות שלך!״, ואחרי זה דווח על שיפור בשליטה ובריכוז."}]},

":[{"q":"מה מיוחד באופן שבו עובדה הטראומה בקבוצה?","a":"האב לא הוזכר בשמו אף פעם","w":["האב השתתף בכמה מפגשים","דנה סיפרה הכל בשיחה אישית","המנחה פירשה כל סצנה בסוף"],"e":"הכל נעשה דרך מטאפורה וסיפורים, ובכל זאת הטראומה עובדה."}]}};
const SUM=`<h2>סיכום: פסיכודרמה קבוצתית עם ילדים (תיאור מקרה)</h2>
<div class="key"><b>על מה מדובר?</b> <b>פסיכודרמה</b> היא טיפול שבו האדם <b>משחק</b> מצבים חשובים מחייו, ופוגש בהצגה את הדמויות המשמעותיות לו. המאמר עוקב במשך שנתיים אחרי <b>דנה</b>, ילדה בת 10–12 שגרה במוסד טיפולי אחרי טראומה קשה מצד אביה, בתוך קבוצת פסיכודרמה של ילדים. בהתחלה דנה <b>התנתקה</b> בכל רגע קשה. דרך הצגות של חתונה, סינדרלה וסיפור שהיא עצמה כתבה, היא התחילה להרגיש, לסמוך, ובסוף <b>לעמוד מול הפחד</b> ולהרחיק אותו בהצגה. השינוי נראה גם בחיים: ריכוז, לימודים, חברים ודימוי עצמי. ונקודה חשובה: המנחה כמעט <b>לא פירשה</b> לדנה את מה שהיא משחקת, אלא נתנה לה לחוות.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>פסיכודרמה</b></td><td>טיפול שבו משחקים מחדש מצבים משמעותיים מהחיים.</td></tr>
<tr><td><b>פרוטגוניסט</b></td><td>הגיבור שבמרכז ההצגה. מספר, מחלק תפקידים ובוחר תפאורה.</td></tr>
<tr><td><b>כפיל</b></td><td>מי שאומר בקול את מה שהגיבור אולי מרגיש ולא מעז להגיד.</td></tr>
<tr><td><b>חילופי תפקידים</b></td><td>הגיבור משחק דמות אחרת בסצנה.</td></tr>
<tr><td><b>ניתוק (דיסוציאציה)</b></td><td>מנגנון הגנה: נמצאים שם, אבל כאילו לא מרגישים.</td></tr>
<tr><td><b>חוויה מתקנת</b></td><td>לחוות מחדש מצב קשה, אבל הפעם להגיב מתוך כוח.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: דנה</h3>
<p>זה תיאור מקרה, ולכן הדוגמה היא דנה. נעקוב אחרי שש פסיכודרמות שבהן היא הייתה הגיבורה, ובכל אחת נראה איזו טכניקה שימשה ומה השתנה.</p>

<h3>1. מהי פסיכודרמה</h3>
<ul>
<li><b>ההגדרה:</b> חוויה מחדש של מצבים משמעותיים דרך המחזה. היא מאפשרת שלושה דברים: <b>קתרזיס</b> (פורקן רגשי), <b>תובנה</b> (הבנה של מה שקורה), ו<b>דרכים חדשות</b> להתמודד.</li>
<li><b>מורנו</b>, ״אבי הפסיכודרמה״, עבד כך עם ילדים לפני כשישים שנה. לטענתו, לתת לילדים לשחק את הבעיות שלהם באופן ספונטני זה כבר טיפולי.</li>
</ul>
<p><b>איך מתאימים לילדים:</b> בקבוצת ילדים יש מתח חזק בין הצורך של הקבוצה לבין הצרכים של כל ילד (<b>יאלום</b>). לכן: <b>אין קהל</b>, כולם משחקים; תפאורה ותלבושות הן חלק מהחימום; וילדים נשארים בדרך כלל ב<b>מטאפורה</b> (אגדות, סיפורים), בעוד שמבוגרים מדברים על הבעיה ישירות.</p>
<p><b>לפרש או לא לפרש?</b> זו שאלה מרכזית במאמר:</p>
<div class="tw"><table><tr><th>מי</th><th>העמדה</th></tr>
<tr><td><b>באום</b> (1973)</td><td>לא לפרש: עימות ישיר עם שורש הבעיה עלול לעורר חרדה והתנגדות</td></tr>
<tr><td><b>אנה פרויד</b></td><td>כן לפרש: חשוב שהילד יבין מה המשמעות של המשחק</td></tr>
<tr><td><b>הכותבת</b></td><td>תלוי: מתאימים לכל ילד ולכל פסיכודרמה מחדש</td></tr></table></div>

<h3>2. הקבוצה ודנה</h3>
<ul>
<li><b>הקבוצה:</b> 6 ילדים בני 10–12 במוסד, ולצד כל ילד מבוגר קבוע (<b>קו־תרפיסט</b>), ומנחה. הילד שבמרכז ההצגה נקרא <b>הפרוטגוניסט</b>: הוא מספר את הסיפור, מחלק תפקידים ובוחר תפאורה. מעניין שהילדים כמעט לא הביאו את החיים האמיתיים שלהם, אלא אגדות.</li>
<li><b>דנה:</b> הגיעה למוסד אחרי טראומה של פגיעה מצד אביה. היו לה בעיות התנהגות, הפרעות רגשיות, קשיי ריכוז, <b>ניתוקים</b>, ודחייה חברתית. אלה תגובות שכיחות אצל ילדים שעברו פגיעה כזו.</li>
<li><b>ארבע מטרות:</b> לעבד את הטראומה; לבנות <b>אמון</b> בילדים ובמבוגרים; ללמוד לחכות ולא להגיב בתוקפנות לתסכול; ולבנות דימוי עצמי ודימוי גוף חיוביים.</li>
</ul>

<h3>3. ניתוק, כעס ואמון (פסיכודרמות 1–2)</h3>
<p><b>פסיכודרמה 1: החתונה.</b> חודש אחרי ההתחלה דנה ביקשה להציג חתונה, בתפקיד הכלה. מתחת לחופה, פתאום עיניה התרוצצו ״כמו חיה שמחפשת מוצא״: היא <b>התנתקה</b>. <b>ניתוק (דיסוציאציה)</b> הוא מנגנון הגנה: האדם נמצא שם, אבל כאילו לא מרגיש. הקבוצה עוד לא הייתה מוכנה לעבוד על זה, אז ״אם הכלה״ הודיעה שהכלה לא מרגישה טוב והחתונה נדחית. כך הקבוצה <b>הכילה</b> את דנה ולא דחפה אותה.</p>
<p><b>פסיכודרמה 2: סינדרלה והחתונה שוב.</b></p>
<ul>
<li>בתור סינדרלה דנה צעקה על האם החורגת: ״לא שמרת עלי!״. אולי כעס על אמא שלא הגנה עליה.</li>
<li>אחר כך ביקשה שוב חתונה, ולחשה ״אני מתעלפת!״. המנחה כרעה לידה כ<b>כפיל</b> ולחשה: ״אני כל כך פוחדת. כולם ילכו ואני אשאר איתו״, והציעה לה לחזור על המילים רק אם הן נכונות לה. דנה חזרה עליהן. <b>כפיל</b> = מישהו שאומר בקול את מה שהגיבור אולי מרגיש ולא מעז להגיד. לתת מילים לרגש הוציא אותה מהניתוק.</li>
<li><b>חילופי תפקידים:</b> דנה שיחקה בתורות את הכלה, את האם (אם אידיאלית שמגינה) ואת החתן. לילדה נוקשה כמוה, לעבור בין שלושה תפקידים היה הישג. הכלה ביקשה מהחתן שלא יפגע בה, הוא נשבע, והיא חזרה לאורחים. כך היא <b>בדקה אם אפשר לתת אמון</b>.</li>
</ul>

<h3>4. הסיפור של לילי (פסיכודרמות 3–4)</h3>
<p>בחודשיים הבאים דנה שיחקה בהצגות של ילדים אחרים, גם בתפקידים קטנים. לילדה מנותקת, להיות <b>חלק</b> ולא במרכז נתן תחושת שייכות.</p>
<ul>
<li><b>פסיכודרמה 3:</b> דנה כתבה סיפור על ילדה בשם לילי, ובו דמות אב שמחזרת אחריה, והיא נעתרת. המנחה <b>לא פירשה</b> את הסיפור, אלא נתנה לדנה לחוות אותו בהצגה. יש בו תכנים <b>השלכתיים</b> (הילדה ״משליכה״ את החוויה שלה על דמות אחרת): אב שהוא לפעמים מפחיד ולפעמים מפתה, אם שלילית שאולי מצדיקה רגשות אשם, ויער שמסמל בידוד.</li>
<li><b>פסיכודרמה 4:</b> המנחה הציעה סוף אחר, ודנה <b>סירבה</b>. כנראה עוד היה לה קשה לדחות את האב, אפילו בהצגה. חודש אחר כך ביקשה להציג שוב, והפעם צעקה על האב ״אני לא רוצה אותך ולא את המתנות שלך!״ והרחיקה אותו בכל כוחה. בסוף הייתה מותשת, עם חיוך של הקלה. אחרי זה הצוות דיווח על <b>שינוי משמעותי</b>: יותר רגועה, שולטת בעצמה, ומתרכזת בכיתה.</li>
</ul>

<h3>5. חוויה מתקנת ופרידה (פסיכודרמות 5–6)</h3>
<p><b>פסיכודרמה 5: הפחד.</b> שנה אחרי ההתחלה דנה התחילה לטפח את עצמה, ולהגיב בחום למגע שבעבר נרתעה ממנו. להציג ״את מה שאני פוחד ממנו״ נותן <b>תחושת שליטה</b>: הילד הוא הכותב, הבמאי והשחקן. דנה סיפרה על פחד מאיש שבא בלילה, ובחילופי התפקידים קפאה. המנחה הסבירה שכאן היא <b>מוגנת</b>, שהיא יכולה לבחור תגובה אחרת מזו שהייתה לה במציאות, ושהקבוצה איתה. הצוות בדק כל הזמן אם היא רוצה להמשיך.</p>
<ul>
<li>דנה בחרה להילחם: ״אני מספיק חזקה כדי להילחם בך! אני לא פוחדת ממך יותר!״. זו <b>חוויה מתקנת</b>: לחוות מחדש מצב טראומטי, אבל הפעם להגיב מתוך כוח, וכך להשתחרר מ<b>חוסר האונים</b>.</li>
<li>בתמונה האחרונה דנה ״הגדולה״ (12) פגשה את דנה ״הקטנה״, ואמרה לה שאז לא יכלה לעשות כלום, כי הייתה קטנה ולא היה מי שיעזור, אבל עכשיו היא תמיד תשמור עליה.</li>
</ul>
<p><b>פסיכודרמה 6: המכתב.</b> אחרי כשנתיים הישגיה עלו, היא אחראית, מקובלת ויש לה חבר. אמה, שהתגרשה, ביקשה שדנה תחזור אליה. כדי לברר מה <b>דנה</b> רוצה (ולא רק לרצות את אמה), המנחה השתמשה ב<b>ביבליותרפיה</b>, טיפול דרך סיפור: ילד שגר אצל דודיו מקבל מכתב מהוריו, וכל ילד כותב תשובה. דנה כתבה שהילד מודה לדודים אבל רוצה לחזור, והוסיפה שגם היא מקווה לחזור לאמה.</p>

<h3>6. מה השתנה ואיך מסבירים</h3>
<ul>
<li><b>מה השתנה:</b> אמון ופתיחות בקבוצה; היא ביטאה פחד, אשמה וכעס כלפי אביה <b>בלי שהוא הוזכר בשמו אפילו פעם אחת</b>; מילדה מוזנחת לילדה מטופחת; שיפור בלימודים; ומנהיגה בקבוצה.</li>
<li><b>שלושת סוגי השינוי (קזדין):</b> שינוי ב<b>תחושה</b> (דימוי עצמי), ירידה ב<b>סימפטומים</b>, ושינוי ב<b>תפקוד</b>. לפי הכותבת, שלושתם קרו.</li>
<li><b>למה הלימודים השתפרו?</b> בהתחלה דנה השתמשה ב<b>הדחקה</b>: דחיקה של הזיכרונות מחוץ לתודעה. הדחקה <b>צורכת הרבה אנרגיה</b>, ולא נשאר כוח לחשוב וללמוד. כשהטראומה עובדה, האנרגיה השתחררה.</li>
<li><b>מורנו:</b> הדרמה הספונטנית מרפאת את השחקן, שיוצר אותה ובו בזמן משתחרר ממנה.</li>
</ul>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. <b>פסיכודרמה</b> היא חוויה מחדש של מצבים משמעותיים דרך המחזה, ומאפשרת קתרזיס, תובנה ודרכי התמודדות חדשות (מורנו).<br>
2. עם ילדים <b>אין קהל</b>, נשארים לרוב ב<b>מטאפורה</b>, והשאלה אם <b>לפרש</b> שנויה במחלוקת (אנה פרויד בעד, באום נגד, הכותבת: תלוי בילד).<br>
3. דנה התחילה ב<b>ניתוקים</b>; הקבוצה הכילה אותה, ו<b>כפיל</b> ו<b>חילופי תפקידים</b> עזרו לה לתת מילים לרגש ולבדוק אמון.<br>
4. בסיפור לילי המנחה <b>לא פירשה</b>; דנה סירבה בהתחלה לסוף אחר, ורק אחר כך הרחיקה את האב, ואז בהצגת הפחד חוותה <b>חוויה מתקנת</b>.<br>
5. השינוי נראה בתחושה, בסימפטומים ובתפקוד (קזדין), והלימודים השתפרו כי <b>הדחקה צורכת אנרגיה</b>.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להגדיר פסיכודרמה ולהסביר איך מתאימים אותה לילדים.<br>
• להציג את המחלוקת על פירוש ואת עמדת הכותבת.<br>
• להבחין בין כפיל לחילופי תפקידים, ולזהות כל טכניקה בסצנות.<br>
• להסביר מהי חוויה מתקנת ולמה הצגת הפחד נותנת שליטה.<br>
• לתאר את שלושת סוגי השינוי ולהסביר את השיפור בלימודים.</div>
<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>בפסיכודרמה עם ילדים אין קהל</b>; כולם משתתפים.</li>
<li><b>אנה פרויד בעד לפרש, באום נגד</b>; הכותבת: תלוי בילד.</li>
<li><b>המנחה לא פירשה את סיפור לילי.</b></li>
<li><b>בפעם הראשונה דנה סירבה לסוף אחר</b>; רק חודש אחר כך הרחיקה את האב.</li>
<li><b>כפיל ≠ חילופי תפקידים:</b> כפיל אומר את הרגש של הגיבור; בחילופי תפקידים הגיבור משחק דמות אחרת.</li>
<li><b>האב לא הוזכר בשמו אף פעם</b>, ובכל זאת הטראומה עובדה.</li>
<li><b>הדחקה צורכת אנרגיה</b>, ולכן שחרור ממנה שיפר את הלמידה.</li>
</ul></div>`;

  app.querySelector("#go").onclick=()=>{if(!started.length)return topic(0,0,"fwd");if(r){if(r.quiz)return quiz(r.ti);return topic(r.ti,Math.min(r.bi||0,T[r.ti].blocks.length-1),"fwd")}review()};
  const on=(id,f)=>{const e=app.querySelector("#"+id);if(e)e.onclick=f};
  on("rev",review);on("sum",()=>summary());on("crd",()=>flashcards());on("map",()=>MAPSET.length>1?mapList():mindmap(0));on("exm",exam);on("wk",weakTopics);
  on("pod",()=>{const bx=app.querySelector("#podbox");bx.hidden=!bx.hidden;app.querySelector("#pod").classList.toggle("on",!bx.hidden);const f=bx.querySelector(".podframe");if(!bx.hidden){if(!f.firstChild)f.innerHTML=`<iframe src="https://drive.google.com/file/d/${CONFIG.podcast.id}/preview" allow="autoplay" title="פודקאסט" loading="lazy"></iframe>`;bx.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"})}});
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  countUp(app);
}

function bar(title,n,i,label,backLabel="כל הנושאים"){
  return `<div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>${backLabel}</span></button><span class="prog">${label}</span></div><div class="steps" style="--n:${n}">${Array.from({length:n},(_,k)=>`<i class="${k<i?"on":k===i?"on now":""}"></i>`).join("")}</div></div><span class="eyebrow ctx">${title}</span>`;
}

function topic(ti,bi,dir="fwd"){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  const last=bi+1>=t.blocks.length;
  show(`<div class="stack reading">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card page"><h2 class="ph">${blk.h}</h2>${acrExpand(blk.html)}</article>${MAPSET.length&&bi===0?MAPSET.map((m,k)=>m.topic===t.id?`<button class="mm-cta" data-map="${k}"><span class="ti">${ic("map")}</span><span class="tt"><b>מפת חשיבה: ${m.title}</b><small>${m.sub}</small></span>${ic("arrowL")}</button>`:"").join(""):""}<div id="ck"></div>
   <div class="pager">${bi>0?`<button class="ghost" id="prev">${ic("arrowR")}<span>הקטע הקודם</span></button>`:"<span></span>"}<button class="primary" id="next"><span>${last?`למבחן הנושא · ${t.qids.length} שאלות`:"הקטע הבא"}</span>${ic("arrowL")}</button></div></div>`,dir);
  enhanceTerms(app.querySelector(".page"));
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=()=>home("back");
  app.querySelector("#next").onclick=()=>{if(!last)topic(ti,bi+1,"fwd");else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  const pv=app.querySelector("#prev");if(pv)pv.onclick=()=>topic(ti,bi-1,"back");
  app.querySelectorAll(".mm-cta").forEach(b=>b.onclick=()=>mindmap(+b.dataset.map,()=>topic(ti,bi,"back")));
  checkBox(t,bi);
}

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;
  const showQ=i=>{const v=list[i],opts=shuffle([v.a,...v.w]);
    host.innerHTML=`<div class="q ckq"><span class="eyebrow">בדיקת הבנה · ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? חזרו לטקסט למעלה לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.style.setProperty("--i",k);b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();box.classList.add("answered");
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a){x.classList.add("right");x.querySelector(".k").innerHTML=ic("check")}});
        if(!ok){b.classList.add("wrong");b.querySelector(".k").innerHTML=ic("x")}
        const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"no");
        fb.innerHTML=`<div class="fbi"><strong>${ok?"נכון":"לא בדיוק"}</strong><p>${esc(v.e)}${ok?"":" כדאי לחזור לטקסט ולקרוא שוב."}</p></div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.innerHTML=`<span>לשאלה ${i+2}</span>${ic("arrowL")}`;
          nx.onclick=()=>{const y=scrollY;showQ(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="cknote";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע: ${r} מתוך ${list.length} נכון.`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };showQ(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=(dir)=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1,answered=items.filter(x=>x.pick!=null).length;
    show(`<div class="stack quiz exam">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length} · נענו ${answered}`,"יציאה מהמבחן")}
     <div class="q"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div></div>
     <div class="pager">${i?`<button class="ghost" id="pv">${ic("arrowR")}<span>הקודמת</span></button>`:"<span></span>"}<button class="primary" id="nx" ${it.pick==null?"disabled":""}><span>${last?"הגשה ובדיקה":"השאלה הבאה"}</span>${ic("arrowL")}</button></div></div>`,dir);
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home("back");else{bk.dataset.sure=1;bk.querySelector("span").textContent="לחצו שוב ליציאה (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");b.style.setProperty("--i",k);
      b.innerHTML=`<span class="k">${LET[k]}</span><span class="ot">${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step("fwd")}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step("back")};
  };step("up");
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map((t,k)=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)};--i:${k}"><span class="tt">${esc(t.title)}</span><span class="bar"><i style="--w:${q}%"></i></span><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  const verdict=pct>=90?"מצוין. אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. לכל טעות למטה יש כפתור לחזרה על הנושא.";
  show(`<div class="stack results"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>כל הנושאים</span></button></div></div>
   <article class="card score">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="score-row">${ring(pct,`<b data-count="${pct}">${REDUCED?pct:0}</b><small>מתוך 100</small>`)}<div><div class="big"><span data-count="${r}">${REDUCED?r:0}</span><small>/${n} נכונות</small></div><p>${verdict}</p></div></div>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3 class="sec-title">הטעויות שלך · ${wrong.length}</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`,"up");
  const wl=app.querySelector("#wl");
  wrong.forEach((it,k)=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));c.style.setProperty("--i",k);
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span class="ot"><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span class="ot"><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no"><div class="fbi"><strong>למה?</strong><p>${esc(it.v.e)}</p></div></div>
     <div class="row"><button class="go">${ic("book")}<span>חזרה על הנושא: ${esc(t.title)}</span></button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0,"fwd");wl.appendChild(c)});
  app.querySelector("#back").onclick=()=>home("back");app.querySelector("#hm").onclick=()=>home("back");app.querySelector("#again").onclick=exam;
  countUp(app);requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll(".trow .bar i").forEach(x=>x.classList.add("go"))));
}

function weakTopics(){

   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`,"up");
  const wl=app.querySelector("#wl");

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();

    <div class="score-row">${ring(pct,`<b data-count="${pct}" data-suffix="%">${REDUCED?pct+"%":"0%"}</b>`)}<div><div class="big"><span data-count="${r}">${REDUCED?r:0}</span><small>/${n} נכונות</small></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p></div></div>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}"><span>לנושא הבא: ${T[nextT].title}</span>${ic("arrowL")}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`,"up");
  app.querySelector("#back").onclick=()=>home("back");app.querySelector("#hm").onclick=()=>home("back");
