<style>

}

:root[data-theme="dark"]{

  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}

/* home */

.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}

.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}

.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}

.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}

.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}

.who .yr{font-size:.8rem;color:var(--muted)}
.cpt{border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));border-radius:14px;padding:14px 16px;margin:12px 0;background:var(--surface)}.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.08rem}.cpt-h svg{width:26px;height:26px;color:var(--c,var(--accent));flex:none}.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}.cpt-ex{background:var(--raised);border-radius:10px;padding:10px 12px;line-height:1.7;font-size:.97rem}.cpt-ex b{color:var(--c,var(--accent))}

.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}

.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}

.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}

.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}

.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}

.card.sum ul,.card.sum ol{margin:4px 0;padding-inline-start:22px}

.card.sum th{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.card.sum .tw{overflow-x:auto}
.about{margin:.6rem 0 0;line-height:1.65}.about b{color:var(--ink,inherit)}
</style>
</head>

"UCR":["Unconditioned Response","תגובה לא מותנית"],
"UCS":["Unconditioned Stimulus","גירוי לא מותנה"],

"VRM":["Verbal Recognition Memory","זיכרון זיהוי מילולי"],

};
const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"bulb",title:"מהי תרבות ארגונית",blocks:[
  {h:"הגדרה ושבעה מאפיינים",html:`${def("על מה הנושא",`כשנכנסים לארגון חדש מרגישים מיד "איך הולך פה": אם לובשים חליפות, אם צוחקים במסדרון, אם מותר לטעות. זו התרבות הארגונית. הנושא מסביר מה היא ובמה היא שונה בין ארגונים.<br><b>מה נלמד כאן:</b> הגדרה ושבעה מאפיינים · תרבות מתארת, לא מעריכה · תרבות חזקה מול חלשה`)}${def("מושג מפתח",`<mark>תרבות ארגונית</mark> ${E("Organizational culture")}: מערכת של <b>משמעות משותפת</b> לחברי הארגון, שמבדילה אותו מארגונים אחרים.`)}<p>שבעה מאפיינים מבטאים את מהות התרבות. כל אחד הוא רצף מנמוך לגבוה:</p>${tiles([["bulb","חדשנות ולקיחת סיכונים","עד כמה מעודדים לחדש ולהסתכן","מאפיין תרבות שמראה אם הארגון מעודד עובדים לנסות דברים חדשים, גם במחיר של טעויות.","ב״עץ ודני״ נועה מציעה לנסות עיצוב חדש, ואומרים לה ״בואי ננסה, גם אם זה ייכשל, נלמד״."],["target","תשומת לב לפרטים","עד כמה מצפים לדיוק וניתוח","מאפיין שמראה עד כמה מצפים מהעובדים לדייק ולבדוק כל פרט.","בנגרייה בודקים כל רהיט עם סרגל לפני משלוח, וטעות של מילימטר נחשבת לבעיה."],["chart","מכוונות לתוצאות","תוצאות לעומת השיטות להשגתן","מאפיין שמראה אם הארגון מתעניין בעיקר בתוצאה הסופית, או גם בדרך שבה הגיעו אליה.","בארגון שמכוון לתוצאות אומרים ״לא משנה איך, העיקר שהלקוח קיבל את הארון בזמן״."],["hand","מכוונות לאנשים","עד כמה ההחלטות מתחשבות בהשפעה על העובדים","מאפיין שמראה עד כמה ההנהלה מתחשבת בהשפעה של ההחלטות שלה על העובדים.","לפני שינוי שעות הפתיחה, דני שואל את העובדים איך זה ישפיע על החיים שלהם."],["people","מכוונות לצוותים","עבודה בצוותים לעומת יחידים"],["scales","תוקפנות","תחרותיות לעומת נינוחות","מאפיין שמראה אם העובדים תחרותיים ו״דוחפים״, או נינוחים ומשתפים פעולה.","בחברה אחת המוכרים מתחרים על כל לקוח. ב״עץ ודני״ הם עוזרים זה לזה לסגור עסקאות."],["lock","יציבות","שמירה על המצב הקיים לעומת צמיחה","מאפיין שמראה אם הארגון מעדיף לשמור על מה שקיים, או לצמוח ולהשתנות.","״עץ ודני״ שומרת על אותם ספקים ואותם מוצרים שנים, ולא ממהרת להתרחב."]])}${ex(`בגוגל יש תרבות של חדשנות ונטילת סיכונים: מעודדים עובדים לנסות רעיונות חדשים. בבנק מסורתי יש תרבות של תשומת לב לפרטים: כל טעות בטופס היא בעיה.`)}`,q:"c1"},
  {h:"תרבות מתארת, לא מעריכה",html:`<p>תרבות ארגונית היא מונח <mark>מתאר</mark>: איך העובדים <b>רואים</b> את הארגון, לא אם הם <b>אוהבים</b> את זה. זה מה שמבדיל אותה משביעות רצון מהעבודה, שהיא מונח <mark>מעריך</mark>.</p>${tiles([["building","תרבות דומיננטית","ערכי הליבה שרוב חברי הארגון חולקים, ושנותנים לו את האישיות שלו","ערכי הליבה שרוב העובדים בארגון חולקים. זו ״האישיות״ של הארגון כולו, גם אם יש מחלקות עם ערכים נוספים משלהן.","ב״עץ ודני״ כמעט כולם מאמינים ש״הלקוח קודם לכול״, וזה מה שמגדיר את החברה."],["copies","תת-תרבויות","\"מיני-תרבויות\" במחלקות או אתרים: ערכי הליבה ועוד ערכים ייחודיים להם"]])}${def("ערכי ליבה",`<mark>ערכי ליבה</mark> ${E("Core values")}: הערכים העיקריים שמקובלים בכל הארגון.`)}${ex(`<b>ערך ליבה</b>: בחברת שירות, "הלקוח תמיד קודם". כל עובד, מהמנכ"ל ועד המוקדן, אמור לפעול לפיו.`)}`,q:"c3"},
  {h:"תרבות חזקה מול חלשה",html:`${def("מושג מפתח",`ב<mark>תרבות חזקה</mark>, ערכי הליבה <b>מוחזקים בעוצמה</b> וגם <b>משותפים לרבים</b>. אם הדעות על המשימה והערכים שונות מאוד, התרבות חלשה.`)}<p>ככל שהתרבות חזקה יותר, היא משפיעה יותר על ההתנהגות, ויוצרת בקרה התנהגותית גבוהה. היא גם מפחיתה תחלופה, כי העובדים מסכימים על מה שהארגון מייצג.</p>${rem("<b>תרבות מול פורמליזציה:</b> פורמליזציה גבוהה יוצרת צפיות, סדר ועקביות. תרבות חזקה משיגה את אותו הדבר <b>בלי מסמכים כתובים</b>. ככל שהתרבות חזקה, יש פחות צורך בכללים פורמליים.")}${ex(`<b>חזקה</b>: בחברה שבה כולם, מהמנכ"ל ועד המנקה, יודעים שהבטיחות קודמת להכול ופועלים כך. <b>חלשה</b>: חברה שבה כל מחלקה חושבת אחרת על מה חשוב.`)}`,q:"c5"}
 ]},
 {id:"t2",icon:"scales",title:"מה התרבות עושה",blocks:[
  {h:"התפקידים של התרבות",html:`${def("על מה הנושא",`לתרבות יש כוח רב על ההתנהגות של העובדים. הנושא מראה מה היא תורמת לארגון, ומתי היא דווקא מזיקה.<br><b>מה נלמד כאן:</b> התפקידים של התרבות · אקלים ארגוני · כשהתרבות הופכת לנטל`)}${tiles([["link","מגדירה גבולות","יוצרת הבחנה בין הארגון לארגונים אחרים"],["id","זהות","נותנת לחברי הארגון תחושת זהות","התרבות נותנת לעובדים הרגשה של ״מי אנחנו״, ושל שייכות למשהו.","נועה מספרת בגאווה לחברים שהיא עובדת ב״עץ ודני״, ״איפה שעושים רהיטים באהבה״."],["target","מחויבות","לדבר גדול יותר מהאינטרס האישי","התרבות גורמת לעובדים להרגיש מחויבים למשהו גדול יותר מהאינטרס האישי שלהם.","נועה נשארת שעה נוספת כדי שלקוחה תקבל את המטבח לפני החג, גם כשאף אחד לא ביקש."],["lock","יציבות","\"הדבק החברתי\" שמחזיק את הארגון","התרבות היא ״הדבק החברתי״: היא עוזרת לעובדים לדעת מה לעשות ואיך להתנהג, ומחזיקה את הארגון יחד.","גם כשמגיע מנהל חדש, העובדים ממשיכים לנהוג ״כמו שנוהגים אצלנו״."],["cycle","מנגנון בקרה","מכוונת ומעצבת עמדות והתנהגות. \"מגדירה את חוקי המשחק\""]])}${def("אקלים ארגוני",`<mark>אקלים ארגוני</mark> ${E("Organizational climate")}: התפיסות המשותפות של חברי הארגון לגבי הארגון וסביבת העבודה. כמו \"רוח צוות\" ברמת הארגון. אקלים חיובי קשור לשביעות רצון, מחויבות ומוטיבציה, וגם לשביעות רצון של לקוחות.`)}${ex(`<b>אקלים ארגוני</b>: עובדים שאומרים "פה באמת אכפת מאיתנו". זו התפיסה המשותפת שלהם לגבי סביבת העבודה.`)}`,q:"c7"},
  {h:"כשהתרבות הופכת לנטל",html:`${tiles([["lock","מיסוד","הארגון מוערך בזכות עצמו ולא בזכות מה שהוא מייצר. מקבל \"חיי נצח\", והרגלים שצריך לבחון הופכים למובנים מאליהם","כשהארגון מוערך בזכות עצמו, ולא רק בגלל מה שהוא מייצר, ההרגלים הופכים ל״ככה זה אצלנו״, ואף אחד כבר לא בודק אם הם עדיין נכונים.","״אצלנו תמיד עושים ישיבה ביום ראשון בבוקר״, גם כשכבר אין בה צורך."],["x","מחסום לשינוי","כשהסביבה משתנה מהר, תרבות מושרשת כבר לא מתאימה. עקביות שהייתה נכס הופכת לנטל","תרבות חזקה עוזרת כשהסביבה יציבה. אבל כשהשוק משתנה מהר, אותה עקביות הופכת לנטל.","כולם עוברים לקנות רהיטים באינטרנט, וב״עץ ודני״ עדיין אומרים ״אצלנו קונים רק בחנות״."],["people","מחסום לגיוון","חדשים שונים צריכים לאמץ את ערכי הליבה כדי להשתלב, ומה שמייחד אותם הולך לאיבוד","כדי להשתלב, עובדים חדשים ושונים צריכים לאמץ את ערכי הליבה. כך הדברים שמייחדים אותם, ושיכלו לתרום, הולכים לאיבוד.","מעצבת עם רעיונות נועזים מגלה שכדי ״להתאים״ היא צריכה לעצב כמו כולם."],["split","מחסום למיזוגים","התאמה תרבותית הפכה לגורם המרכזי. מיזוגים רבים נכשלים בגלל התנגשות תרבויות","כשמתאחדים שני ארגונים עם תרבויות שונות, ההתנגשות ביניהן היא אחת הסיבות העיקריות שמיזוגים נכשלים.","״עץ ודני״ הנינוחה מתמזגת עם חברה תחרותית, והעובדים משתי החברות לא מצליחים לעבוד יחד."]])}${ex("מחקר הראה שעובדים מתייחסים ללקוחות כמו שהארגון מתייחס אליהם: כשמתייחסים אליהם טוב, הם נותנים שירות טוב.")}`,q:"c9"}
 ]},
 {id:"t3",icon:"sprout",title:"איך תרבות נוצרת ונשמרת",blocks:[
  {h:"הכל מתחיל במייסדים",html:`${def("על מה הנושא",`תרבות לא נוצרת סתם. הנושא עוקב אחרי "מחזור החיים" שלה: מאיפה היא מתחילה, ואיך היא נשמרת כשעובדים באים והולכים.<br><b>מה נלמד כאן:</b> המייסדים · גיוס, הנהלה בכירה וחיברות · שלבי החיברות`)}<p>המקור האולטימטיבי של התרבות הוא <mark>המייסדים</mark>. אין להם מסורות קודמות, והארגון הקטן מאפשר להם להטמיע את החזון שלהם.</p><p><b>שלוש דרכים שבהן מייסדים יוצרים תרבות:</b></p>${tiles([["people","גיוס","מגייסים ומשאירים רק אנשים שחושבים ומרגישים כמוהם","כדי לשמור על התרבות, הארגון מגייס ומשאיר אנשים שחושבים ומרגישים כמו העובדים הקיימים.","בראיון לנועה שאלו לא רק על ניסיון, אלא גם ״מה את עושה כשלקוח לא מרוצה?״, כדי לבדוק שהיא מתאימה לערכים."],["grad","חינוך","מחנכים ומחברתים אותם לדרך החשיבה שלהם"],["id","דוגמה אישית","ההתנהגות שלהם גורמת לעובדים להזדהות ולהפנים את הערכים","המנהלים מעבירים את התרבות במה שהם עושים, ולא רק במה שהם אומרים. העובדים מחקים אותם.","ב״עץ ודני״ דני נשאר לנקות את הנגרייה בסוף היום, ונועה מתחילה לעשות אותו דבר."]])}${rem("כשהארגון מצליח, האישיות של המייסד נטמעת בתרבות.")}`,q:"c11"},
  {h:"שלושה כוחות ששומרים על התרבות",html:`${tiles([["target","מיון (Selection)","בוחרים מי שמתאים לערכים. גם המועמדים יכולים לסנן את עצמם, כך שזו דרך דו-כיוונית","בוחרים עובדים שמתאימים לערכים של הארגון. גם המועמדים בודקים אם הארגון מתאים להם, ומי שלא מתאים מוותר.","מועמד שמבין בראיון שב״עץ ודני״ עובדים בקצב איטי ומדויק, מחליט שזה לא בשבילו."],["pyramid","הנהלה בכירה","במילים ובהתנהגות היא קובעת נורמות: סיכונים, חופש, לבוש, ומה מקדם אנשים"],["cycle","חיברות (Socialization)","תהליך שמתאים את העובדים החדשים לתרבות הארגון","התהליך שבו עובד חדש לומד ״איך עושים פה דברים״ ומתאים את עצמו לתרבות.","בשבועות הראשונים נועה לומדת מהוותיקים שכל רהיט נבדק פעמיים לפני משלוח."]])}${fig("social")}${rem("המנבא החשוב ביותר של התנהגות עתידית הוא התנהגות בעבר. מה שאדם יודע לפני שהוא מצטרף, ועד כמה הוא פרואקטיבי, קובעים כמה טוב הוא יסתגל.")}`,q:"c13"},
  {h:"אפשרויות החיברות",html:`${socTable}<p>יש שתי \"חבילות\" עיקריות:</p>${tiles([["doc","חבילה מוסדית","פורמלי, קבוצתי, קבוע, טורי והפשטה. מוחקת הבדלים ויוצרת התנהגות צפויה. נפוצה במשטרה ובכיבוי אש"],["sprout","חבילה אישית","בלתי פורמלי, אישי, משתנה, אקראי והשקעה. משאירה מקום לחדשנות ולגישות ייחודיות","דרך חיברות גמישה ואישית, שמאפשרת לעובד החדש להביא את עצמו. היא מעודדת חדשנות.","במקום תוכנית קליטה קבועה, דני נותן לנועה לנסות דברים בדרך שלה וללמוד תוך כדי."]])}`,q:"c16"}
 ]},
 {id:"t4",icon:"copies",title:"איך עובדים לומדים את התרבות",blocks:[
  {h:"ארבע דרכים",html:`${def("על מה הנושא",`עובד חדש לא מקבל "ספר חוקים" של התרבות. הוא קולט אותה מדברים קטנים שקורים סביבו. הנושא מציג את ארבע הדרכים שבהן זה קורה.<br><b>מה נלמד כאן:</b> סיפורים · טקסים · סמלים חומריים · שפה`)}${tiles([["doc","סיפורים","סיפורים על המייסדים ועל אירועים מהעבר, שמעבירים מסר על מה שהארגון מעריך","סיפורים שמסתובבים בארגון, על המייסדים או על אירועים מהעבר, מלמדים עובדים חדשים מה הארגון מעריך.","כולם מספרים לנועה איך דני נסע בלילה לתקן ארון ללקוחה מבוגרת. המסר: הלקוח קודם."],["cycle","טקסים","רצפים חוזרים של פעילויות שמבטאים ומחזקים את ערכי המפתח","פעילויות שחוזרות על עצמן ומדגישות את מה שחשוב לארגון.","בכל סוף חודש יש ארוחה משותפת שבה מודים בקול לעובד שעזר הכי הרבה לאחרים."],["building","סמלים חומריים","מבנה המשרדים, הרכבים והמטוסים של המנהלים. משדרים מי חשוב וכמה שוויון יש","החפצים והמבנה הפיזי משדרים מי חשוב וכמה שוויון יש: גודל המשרד, הרכב, הלבוש.","לדני אין משרד נפרד, והוא יושב באולם עם כולם. זה משדר שוויון."],["question","שפה","מונחים, ראשי תיבות וז'רגון ייחודיים שמאחדים את חברי התרבות","מילים, קיצורים וביטויים שרק אנשי הארגון מבינים. הם יוצרים תחושה של ״אנחנו״.","בנגרייה אומרים ״להעביר לדני״ כשמשהו צריך טיפול מיוחד, וכל עובד חדש לומד את זה מהר."]])}${ex("סיפורים: ב-נייקי מספרים איך המייסד שפך גומי למכשיר הוופלים של אשתו כדי ליצור נעל ריצה טובה יותר. טקסים: הקריאה המשותפת של עובדי וולמארט. סמלים: במטה של אלקואה כמעט אין משרדים פרטיים, וזה משדר פתיחות ושוויון.")}`,q:"c18"}
 ]},
 {id:"t5",icon:"check",title:"תרבות אתית, חיובית ורוחנית",blocks:[
  {h:"תרבות אתית",html:`${def("על מה הנושא",`אפשר לעצב תרבות בכוונה. הנושא מציג שלושה כיוונים שארגונים מנסים לפתח, ומה קורה לתרבות כשהיא עוברת למדינה אחרת.<br><b>מה נלמד כאן:</b> תרבות אתית · תרבות חיובית · רוחניות בעבודה · ההקשר הגלובלי`)}<p>התרבות שהכי מעודדת סטנדרטים אתיים גבוהים היא <b>גבוהה בסובלנות לסיכון</b>, <b>נמוכה עד בינונית בתוקפנות</b>, וממוקדת <b>גם באמצעים וגם בתוצאות</b>.</p><p><b>חמישה עקרונות ליצירת תרבות אתית:</b></p>${tiles([["id","מודל לחיקוי גלוי","העובדים מסתכלים על ההנהלה הבכירה","כדי ליצור תרבות אתית, ההנהלה צריכה להתנהג באופן אתי בעצמה, ובגלוי, כי העובדים מסתכלים עליה.","דני מחזיר ללקוח כסף על טעות של הנגרייה, גם כשהלקוח לא שם לב. העובדים רואים ולומדים."],["doc","לתקשר ציפיות","קוד אתי שמפחית עמימות","קוד אתי כתוב שמסביר מה מותר ומה אסור. הוא מפחית בלבול ומצבים של ״לא ידעתי״.","בקוד של ״עץ ודני״ כתוב שאסור לקבל מתנות מספקים. נועה יודעת בדיוק מה לעשות כשמציעים לה."],["grad","הכשרה אתית","סדנאות שמבהירות מה מותר ומה לא"],["scales","לתגמל ולהעניש בגלוי","לבדוק גם את האמצעים, לא רק את התוצאות"],["lock","מנגנוני הגנה","דרכים לדווח על בעיות אתיות בלי לחשוש מעונש","כדי שתהיה תרבות אתית, עובדים צריכים להרגיש בטוחים לדווח על בעיה, בלי לפחד שייפגעו.","נועה יכולה לדווח שעובד מקצר תהליכים בבטיחות, בלי לחשוש שיפטרו אותה."]])}`,q:"c20"},
  {h:"תרבות חיובית",html:`${def("מושג מפתח",`<mark>תרבות ארגונית חיובית</mark> ${E("Positive organizational culture")}: תרבות שבונה על החוזקות של העובדים, מתגמלת יותר משהיא מענישה, ומדגישה חיוניות וצמיחה אישית.`)}${tiles([["chart","בנייה על חוזקות","לעזור לעובדים לגלות את החוזקות שלהם ולנצל אותן"],["check","לתגמל יותר מלהעניש","גם תגמולים קטנים וזולים, כמו שבחים והכרה"],["sprout","חיוניות וצמיחה","קריירה ולא רק עבודה: הארגון מפתח את העובד"]])}${rem("יש גבולות: לא כל התרבויות מעריכות חיוביות כמו ארה\"ב, ובשלב מסוים זה עלול להיראות מאולץ.")}${ex(`מנהל שבמקום לחפש מה העובד עשה לא בסדר, שואל "במה אתה הכי טוב, ואיך נשתמש בזה יותר?", ומפרגן בפומבי על הצלחות.`)}`,q:"c22"},
  {h:"רוחניות בעבודה והקשר הגלובלי",html:`${def("מושג מפתח",`<mark>רוחניות במקום העבודה</mark> ${E("Workplace spirituality")}: <b>לא</b> דת או תיאולוגיה. ההכרה שלאנשים יש חיים פנימיים שמזינים ומוזנים מעבודה משמעותית, בהקשר של קהילה.`)}${tiles([["hand","נדיבות","חסד ודאגה לאושר של העובדים ובעלי העניין"],["target","תחושת תכלית","תרבות שבנויה סביב מטרה משמעותית, ולא רק רווח"],["check","אמון וכבוד","כנות, פתיחות, ויחס של כבוד לכל אדם","בתרבות חיובית, העובדים כנים ופתוחים זה עם זה, ומתייחסים לכל אדם בכבוד.","כשנועה טועה, המנהלת מדברת איתה בפרטיות ובכבוד, ולא מול כולם."],["bulb","פתיחות מחשבתית","חשיבה גמישה ויצירתיות"]])}<p><b>שלוש ביקורות:</b> האם יש לזה בסיס מדעי, האם לגיטימי לכפות ערכים רוחניים על עובדים, והאם רוחניות ורווח מתיישבים.</p>${rem("<b>הקשר הגלובלי:</b> תרבות ארגונית חזקה יכולה לחצות גבולות, אבל היא משקפת לעיתים קרובות את התרבות הלאומית, ואי אפשר להתעלם מהתרבות המקומית.")}${ex(`רוחניות בעבודה היא לא תפילה במשרד. זו עובדת בעמותה שמרגישה שהעבודה שלה נותנת משמעות לחייה, וחלק מקהילה שאכפת לה.`)}`,q:"c24"}
 ]},
 {id:"t6",icon:"check",title:"תרגול בסגנון המבחן",blocks:[
  {h:"מושגים מהמבחן לדוגמה",html:`<p>המבחן לדוגמה בודק גם את <b>המודל של שיין</b>, שנלמד בהרצאה:</p>${tiles([["copies","הרובד הגלוי","מה שרואים ושומעים: סיפורים, טקסים, סמלים, שפה, לבוש, משרדים","השכבה החיצונית של התרבות במודל של שיין: מה שאפשר לראות ולשמוע. סיפורים, טקסים, סמלים, שפה ולבוש.","ביום הראשון נועה רואה שכולם בבגדי עבודה, שאין משרדים סגורים, ושיש לוח תודות על הקיר."],["question","הרובד הסמוי","ערכים ונורמות שמוצהרים ומנחים התנהגות","השכבה האמצעית: הערכים והנורמות שהארגון אומר במפורש שהוא מאמין בהם.","על הקיר תלוי משפט: ״אנחנו מאמינים באיכות ובשירות אישי״."],["brain","הנחות היסוד","אמונות עמוקות ולא מודעות, למשל על טבע האדם (תיאוריה X או Y)","השכבה העמוקה ביותר: אמונות שאנשים בארגון כבר לא שמים לב אליהן, למשל ״אפשר לסמוך על אנשים״. הן קובעות את כל השאר.","ב״עץ ודני״ לא מחתימים כרטיס נוכחות, כי ההנחה הבסיסית היא שעובדים רוצים לעבוד טוב."]])}${rem("את <b>שבעת המאפיינים</b> של התרבות (חדשנות, פרטים, תוצאות, אנשים, צוות, תוקפנות, יציבות) המבחן מכנה טיפולוגיית הערכים של צ׳טמן.")}<p>השאלה הראשונה בכל זוג לקוחה מקובץ <b>השאלות לדוגמה למבחן</b> של הקורס (עם התשובה לפי המפתח), והשנייה היא שאלה מקבילה בסגנון דומה.</p>`,q:"ec1"}
 ]}
];
const Q={"c1":{"t":"t1","v":[{"q":"בחברה מסוימת מתגמלים מנהלים רק לפי המספרים בסוף הרבעון, ולא משנה איך הגיעו אליהם. איזה מאפיין תרבות גבוה כאן?","a":"מכוונות לתוצאות","w":["תשומת לב לפרטים","מכוונות לאנשים","תוקפנות"],"e":"תגמול רק לפי המספרים, בלי לבדוק איך הגיעו אליהם, הוא מכוונות לתוצאות: התמקדות במה שהושג ולא בדרך. תוקפנות היא תחרותיות בין אנשים, וזה לא מה שמתואר כאן."},{"q":"בחברה מסוימת, כל החלטה עסקית נבחנת לפי ההשפעה שלה על העובדים. איזה מאפיין תרבות גבוה כאן?","a":"מכוונות לאנשים","w":["מכוונות לצוות","מכוונות לתוצאות","יציבות"],"e":"מכוונות לאנשים: עד כמה ההחלטות מתחשבות בהשפעה על האנשים בארגון."}]},
"c2":{"t":"t1","v":[{"q":"איזה מהבאים אינו אחד משבעת מאפייני התרבות הארגונית?","a":"גודל הארגון","w":["תוקפנות","תשומת לב לפרטים","מכוונות לצוות"],"e":"השבעה: חדשנות וסיכון, פרטים, תוצאות, אנשים, צוות, תוקפנות, יציבות."},{"q":"במשרד רואי חשבון, טעות קטנה במספר נחשבת לכישלון חמור. איזה מאפיין תרבות גבוה כאן?","a":"תשומת לב לפרטים","w":["מכוונות לתוצאות","יציבות","תוקפנות"],"e":"כשטעות קטנה במספר נחשבת לכישלון חמור, מצופה מהעובדים דיוק מלא, וזו תשומת לב לפרטים. מכוונות לתוצאות הייתה מתמקדת בשורה התחתונה, לא בדיוק של כל פרט."}]},
"c3":{"t":"t1","v":[{"q":"עובד אומר: ״בחברה שלנו מעודדים לקחת סיכונים, ואני שונא את זה.״ איזה חלק במשפט מתאר תרבות ואיזה שביעות רצון?","a":"״מעודדים סיכונים״ הוא תרבות, ״אני שונא״ הוא שביעות רצון","w":["שני החלקים מתארים תרבות","שני החלקים מתארים שביעות רצון","״מעודדים סיכונים״ הוא שביעות רצון, ״אני שונא״ הוא תרבות"],"e":"״מעודדים סיכונים״ מתאר איך הארגון נראה, וזו תרבות. ״אני שונא את זה״ מעריך את הארגון, וזו שביעות רצון. תרבות היא מונח מתאר, ושביעות רצון היא מונח מעריך."},{"q":"למה תרבות ארגונית נחשבת מונח ״מתאר״?","a":"כי היא עוסקת באיך רואים את הארגון, לא אם אוהבים אותו","w":["כי היא מתוארת בתקנון הכתוב של הארגון","כי היא נמדדת לפי תיאור התפקיד של כל עובד","כי היא מתארת את המבנה הפורמלי של הארגון"],"e":"תרבות עוסקת באיך העובדים רואים את הארגון, ולא בשאלה אם הם אוהבים אותו. היא לא כתובה בתקנון, אלא משותפת לחברי הארגון."}]},
"c4":{"t":"t1","v":[{"q":"בבנק גדול כולם חולקים ערכים של אמינות וזהירות, אבל במחלקת הדיגיטל יש גם ערכים של מהירות וניסוי. מה יש במחלקת הדיגיטל?","a":"תת־תרבות","w":["תרבות דומיננטית חדשה","תרבות חלשה","תרבות נגד"],"e":"תת־תרבות כוללת את ערכי הליבה של הארגון ועוד ערכים ייחודיים ליחידה. במחלקת הדיגיטל שומרים על אמינות וזהירות ומוסיפים עליהן מהירות, ולכן זו לא תרבות נגד."},{"q":"מה נותן לארגון את ״האישיות״ שלו, לפי הפרק?","a":"התרבות הדומיננטית: ערכי הליבה שרוב החברים חולקים","w":["תת־התרבויות של המחלקות השונות בארגון","המבנה הפורמלי והנהלים הכתובים","הערכים האישיים של המנכ״ל הנוכחי"],"e":"התרבות הדומיננטית היא מה שמתכוונים אליו כשמדברים על ״התרבות של הארגון״."}]},
"c5":{"t":"t1","v":[{"q":"בחברה A כל העובדים מכירים את הערכים, אבל רק מעטים מאמינים בהם. בחברה B רוב העובדים מאמינים בהם בלהט. באיזו חברה התרבות חזקה?","a":"B, כי הערכים מוחזקים בעוצמה וגם משותפים לרבים","w":["A, כי כולם מכירים את הערכים","בשתיהן, כי בשתיהן יש ערכים מוגדרים","באף אחת, כי תרבות חזקה דורשת נהלים כתובים"],"e":"תרבות חזקה היא תרבות שבה ערכי הליבה מוחזקים בעוצמה וגם משותפים לרבים. ב-A כולם מכירים את הערכים, אבל רק מעטים מאמינים בהם, ולכן התרבות שם חלשה."},{"q":"חברה עם תרבות חזקה מאוד מגלה שהיא כמעט לא צריכה נהלים כתובים. למה?","a":"כי התרבות עצמה יוצרת עקביות וצפיות בהתנהגות","w":["כי עובדים בתרבות חזקה לא קוראים נהלים","כי תרבות חזקה מתאימה רק לארגונים קטנים","כי תרבות חזקה מבוססת על ריכוזיות גבוהה"],"e":"תרבות חזקה יוצרת עקביות וצפיות בהתנהגות, ולכן היא יכולה להחליף נהלים כתובים (פורמליזציה). הסיבה היא לא שעובדים ״לא קוראים נהלים״."}]},
"c6":{"t":"t1","v":[{"q":"למה תרבות חזקה מפחיתה תחלופת עובדים?","a":"כי ההסכמה על מה שהארגון מייצג יוצרת נאמנות","w":["כי היא מגבירה את השכר של העובדים","כי היא מגבילה את האפשרות לעזוב","כי היא מבוססת על חוזים ארוכי טווח"],"e":"כשכולם מסכימים על מה שהארגון מייצג, נוצרות לכידות, נאמנות ומחויבות, ולכן פחות עובדים עוזבים. תרבות לא קשורה לגובה השכר."},{"q":"מה צפוי לקרות לתחלופה בארגון עם תרבות חלשה, לעומת תרבות חזקה?","a":"התחלופה צפויה להיות גבוהה יותר","w":["התחלופה צפויה להיות נמוכה יותר","אין קשר בין חוזק התרבות לתחלופה","התחלופה תלויה רק בשכר"],"e":"תרבות חזקה מחזיקה עובדים בזכות הנאמנות לערכים. בתרבות חלשה אין את הדבק הזה, ולכן התחלופה צפויה להיות גבוהה יותר."}]},
"c7":{"t":"t2","v":[{"q":"איזה מהבאים אינו תפקיד של תרבות ארגונית?","a":"קביעת השכר של העובדים","w":["יצירת תחושת זהות לחברי הארגון","הגברת היציבות של המערכת החברתית","יצירת גבולות שמבדילים את הארגון"],"e":"תרבות היא ״הדבק החברתי״: היא יוצרת זהות, יציבות וגבולות. קביעת שכר היא מנגנון תגמול פורמלי, לא תפקיד של תרבות."},{"q":"עובד חדש מגלה שאף אחד לא אמר לו ״לא עונים למיילים אחרי שש״, אבל הוא מבין את זה תוך שבוע. איזה תפקיד של התרבות זה ממחיש?","a":"מנגנון שמכוון ומעצב עמדות והתנהגות","w":["יצירת גבולות מול ארגונים אחרים","הגברת המחויבות למשהו גדול מהאינטרס האישי","מיסוד הארגון לאורך זמן"],"e":"אף אחד לא אמר לו את הכלל, אבל הוא למד אותו מהסביבה. כך התרבות מכוונת ומעצבת עמדות והתנהגות. ״יצירת גבולות״ נוגעת להבדל מול ארגונים אחרים, לא לכללי התנהגות בפנים."}]},
"c8":{"t":"t2","v":[{"q":"עובדים בבית חולים אומרים: ״פה באמת אכפת מהבטיחות שלנו.״ מה הם מתארים?","a":"אקלים ארגוני","w":["תת־תרבות","מיסוד","חוזה פסיכולוגי"],"e":"״פה באמת אכפת מהבטיחות שלנו״ היא תפיסה משותפת של סביבת העבודה, כלומר אקלים ארגוני. מיסוד הוא מצב שבו הארגון הופך לערך בפני עצמו."},{"q":"מה ההבדל בין תרבות ארגונית לאקלים ארגוני?","a":"תרבות: ערכים ומשמעות משותפים. אקלים: תפיסה משותפת של הסביבה","w":["תרבות היא תחושה אישית, אקלים הוא נוהל כתוב","תרבות קיימת רק בארגונים גדולים, אקלים בכל ארגון","אין הבדל, אלה שני שמות לאותו מושג"],"e":"תרבות היא ערכים ומשמעות משותפים, ואקלים הוא התפיסה המשותפת של סביבת העבודה, למשל אקלים של בטיחות. אלה מושגים קרובים, אבל לא זהים."}]},
"c9":{"t":"t2","v":[{"q":"עמותה שהוקמה כדי לפתור בעיה מסוימת ממשיכה לפעול שנים אחרי שהבעיה נפתרה, כי הארגון עצמו הפך ל״ערך״. מה זה?","a":"מיסוד","w":["תת־תרבות","תרבות חלשה","אקלים ארגוני"],"e":"כשהארגון עצמו הופך לערך וממשיך להתקיים אחרי שהמטרה המקורית הושגה, זה מיסוד. תת־תרבות היא קבוצה בתוך הארגון עם ערכים נוספים, וזה לא קשור כאן."},{"q":"חברה עם תרבות חזקה של ״איכות לפני מהירות״ מפסידה לקוחות כשהשוק עובר למוצרים זולים ומהירים. מה קרה?","a":"התרבות הפכה למחסום לשינוי כשהסביבה השתנתה","w":["התרבות בחברה הייתה חלשה מדי","התרבות פגעה בגיוון של העובדים","התרבות לא התאימה למיזוג עם חברה אחרת"],"e":"תרבות חזקה מתאימה לסביבה יציבה, אבל כשהסביבה משתנה מהר היא נעשית מחסום לשינוי. התרבות כאן דווקא חזקה, ולכן ״חלשה מדי״ שגוי."}]},
"c10":{"t":"t2","v":[{"q":"חברה גייסה עובדים מרקעים שונים, אבל אחרי שנה כולם חושבים ומתנהגים אותו דבר. מה הסכנה שהפרק מתאר?","a":"תרבות חזקה מוחקת את הייחוד שלהם ופוגעת בגיוון","w":["תרבות חלשה לא מצליחה לשלב עובדים חדשים","העובדים לא עברו חיברות מספיקה","החברה בחרה עובדים שלא מתאימים לערכים"],"e":"תרבות חזקה מעודדת אחידות, ולכן עלולה למחוק את הייחוד שהעובדים הביאו ולפגוע ביתרון של הגיוון. החיברות דווקא הצליחה מאוד, וזו בדיוק הבעיה."},{"q":"שתי חברות רווחיות התמזגו, והמיזוג נכשל. מה הסיבה הסבירה ביותר לפי הפרק?","a":"חוסר התאמה בין התרבויות","w":["פער בין הרווחים של החברות","הבדל בגודל של החברות","הבדל בטכנולוגיות של החברות"],"e":"מיזוגים נכשלים לעתים קרובות בגלל חוסר התאמה בין התרבויות, גם כששתי החברות רווחיות. לכן התאמה תרבותית הפכה לשיקול מרכזי במיזוגים."}]},
"c11":{"t":"t3","v":[{"q":"למה למייסדים יש השפעה כה גדולה על התרבות?","a":"כי בארגון חדש וקטן קל להטמיע את החזון שלהם","w":["כי הם תמיד בעלי המניות הגדולים ביותר","כי הם כותבים את כל הנהלים הרשמיים","כי הם מנהלים את הארגון כל חייו"],"e":"בארגון חדש וקטן קל למייסד להטמיע את החזון שלו בכל העובדים. הוא לא בהכרח מנהל את הארגון כל חייו, ובכל זאת ההשפעה שלו נשארת."},{"q":"איזו מהבאות אינה דרך שבה מייסדים יוצרים תרבות?","a":"כתיבת חוקה מפורטת לארגון","w":["גיוס עובדים שחושבים כמוהם","חיברות של העובדים לדרך החשיבה שלהם","שימוש בהתנהגות שלהם כמודל לחיקוי"],"e":"מייסדים יוצרים תרבות דרך גיוס אנשים שחושבים כמוהם, דרך חיברות ודרך הדוגמה האישית שלהם. כתיבת חוקה מפורטת היא פורמליזציה, לא דרך ליצור תרבות."}]},
"c12":{"t":"t3","v":[{"q":"מועמדת לעבודה מגלה בראיון שהחברה מעודדת תחרות פנימית חריפה, ומחליטה לא להמשיך. מה זה ממחיש?","a":"המיון הוא דו־כיווני: גם המועמדים מסננים את עצמם","w":["כשל בתהליך הגיוס והמיון של החברה","שלב המפגש בתהליך החיברות של העובד","תרבות חלשה שלא מצליחה למשוך עובדים"],"e":"המיון הוא דו־כיווני: גם הארגון בוחר את המועמדים, וגם המועמדים מסננים את עצמם כשהערכים לא מתאימים להם. זה לא כשל בגיוס, אלא חלק תקין מהתהליך."},{"q":"איך ההנהלה הבכירה שומרת על התרבות?","a":"דרך מה שהיא אומרת ועושה, שהופך לנורמה","w":["דרך כתיבת נהלים מפורטים לכל עובד","דרך העלאת שכר למי שמתאים לתרבות","דרך פיטורים של מי שלא מתאים"],"e":"מה שההנהלה הבכירה אומרת ועושה הופך לנורמה שמחלחלת לכל הארגון. נהלים כתובים הם פורמליזציה, והם פחות משפיעים מהדוגמה האישית."}]},
"c13":{"t":"t3","v":[{"q":"סטודנטית לרפואה מגיעה לסטאז׳ עם ערכים וציפיות שגיבשה בשנות הלימודים. באיזה שלב של החיברות היא נמצאת כשהיא מגיעה?","a":"לפני הכניסה","w":["מפגש","מטמורפוזה","פרידה"],"e":"לפני הכניסה לארגון היא כבר גיבשה ערכים וציפיות, בלימודים, וזה שלב ״לפני הכניסה״. המפגש מתחיל רק כשהיא נכנסת לעבודה עצמה ופוגשת את המציאות."},{"q":"עובד חדש מגלה שהעבודה שונה מאוד ממה שתיארו בראיון, ומתחיל לשקול לעזוב. באיזה שלב של החיברות הוא?","a":"מפגש","w":["לפני הכניסה","מטמורפוזה","מיסוד"],"e":"במפגש העובד רואה מה באמת קורה בארגון, ולפעמים זה שונה מהציפיות, ואפילו גורם לו לשקול לעזוב. מטמורפוזה היא השלב שבו הוא כבר מסתגל."}]},
"c14":{"t":"t3","v":[{"q":"אחרי חצי שנה, עובדת מרגישה שהיא כבר ״חלק מהמקום״, מבינה את הנורמות ומתנהגת לפיהן. באיזה שלב היא?","a":"מטמורפוזה","w":["מפגש","לפני הכניסה","פרידה"],"e":"הרגשה של ״חלק מהמקום״ והתנהגות לפי הנורמות הן מטמורפוזה: העובדת השתנתה והסתגלה לעבודה, לקבוצה ולארגון. המפגש הוא השלב שבו הפער בין ציפייה למציאות עוד מפתיע."},{"q":"למה ארגונים בודקים בראיון איך המועמד התנהג בעבר?","a":"כי התנהגות בעבר היא המנבא הטוב ביותר להתנהגות עתידית","w":["כי זה מקצר את שלב המפגש של העובד בארגון","כי זה מבטל את הצורך בתהליך חיברות מסודר","כי זה מונע מהמועמד לסנן את עצמו מהתהליך"],"e":"ההנחה המרכזית היא שהתנהגות בעבר היא המנבא הטוב ביותר להתנהגות בעתיד, ולכן בודקים אותה. זה לא מבטל את תהליך החיברות שאחרי הכניסה."}]},
"c15":{"t":"t3","v":[{"q":"איזו מהבאות אינה אחת התוצאות של תהליך החיברות במודל?","a":"שביעות רצון מהשכר","w":["פריון העובד","מחויבות לארגון","שיעור התחלופה"],"e":"לפי המודל, שלוש התוצאות של החיברות הן פריון, מחויבות ותחלופה. שביעות רצון מהשכר לא נכללת בהן."},{"q":"עובד שעבר חיברות מוצלחת צפוי, לפי המודל:","a":"להיות פרודוקטיבי ומחויב יותר, ולעזוב פחות","w":["לעזוב מהר יותר, כי הוא מבין את הארגון","להיות פרודוקטיבי יותר, אבל פחות מחויב","להיות מחויב יותר, אבל פחות פרודוקטיבי"],"e":"חיברות מוצלחת משפרת את שלוש התוצאות: יותר פריון, יותר מחויבות ופחות עזיבה. הבנת הארגון לא גורמת לעזוב מהר יותר."}]},
"c16":{"t":"t3","v":[{"q":"עובדת חדשה מקבלת עובד ותיק שמלווה אותה ומשמש לה מודל לחיקוי. איזו אפשרות חיברות זו?","a":"טורי (Serial)","w":["קבוצתי (Collective)","הפשטה (Divestiture)","פורמלי (Formal)"],"e":"כשעובד ותיק מלווה את החדשה ומשמש לה מודל לחיקוי, זו חיברות טורית. בחיברות קבוצתית כמה עובדים חדשים עוברים יחד את אותו תהליך."},{"q":"ארגון מעודד עובדים חדשים להביא את הכישורים והייחודיות שלהם, ולא לשנות אותם. איזו אפשרות חיברות זו?","a":"השקעה (Investiture)","w":["הפשטה (Divestiture)","טורי (Serial)","קבוצתי (Collective)"],"e":"השקעה (Investiture) מאשרת ומחזקת את התכונות והכישורים שהעובד מביא. הפשטה (Divestiture) מנסה להסיר אותם, ולכן היא ההפך."},{"q":"כל המתגייסים החדשים למשטרה עוברים יחד קורס זהה במשך חצי שנה. איזו אפשרות חיברות זו?","a":"קבוצתי (Collective)","w":["אישי (Individual)","טורי (Serial)","השקעה (Investiture)"],"e":"כל המתגייסים עוברים יחד את אותו קורס, וזו חיברות קבוצתית. בחיברות טורית היה מלווה ותיק שמשמש מודל, וכאן התהליך משותף לכולם."}]},
"c17":{"t":"t3","v":[{"q":"ארגון רוצה שכל העובדים יתנהגו באופן צפוי ואחיד. איזו חבילת חיברות מתאימה?","a":"פורמלי, קבוצתי, קבוע, טורי והפשטה","w":["לא פורמלי, אישי, משתנה, אקראי והשקעה","פורמלי, אישי, משתנה, אקראי והפשטה","לא פורמלי, קבוצתי, קבוע, טורי והשקעה"],"e":"פורמלי, קבוצתי, קבוע, טורי והפשטה הם השילוב שמוחק הבדלים ויוצר התנהגות צפויה ואחידה. החבילה ההפוכה שומרת על ייחודיות."},{"q":"חברת חדשנות רוצה עובדים עם דרכי חשיבה שונות ולא אחידות. איזו חבילת חיברות מתאימה?","a":"לא פורמלי, אישי, משתנה, אקראי והשקעה","w":["פורמלי, קבוצתי, קבוע, טורי והפשטה","פורמלי, קבוצתי, משתנה, טורי והשקעה","לא פורמלי, קבוצתי, קבוע, אקראי והפשטה"],"e":"לא פורמלי, אישי, משתנה, אקראי והשקעה הם השילוב ששומר על ייחודיות ומעודד חשיבה שונה. החבילה עם הפשטה דווקא מוחקת את השוני."}]},
"c18":{"t":"t4","v":[{"q":"מנכ״ל יושב בחלל פתוח עם כל העובדים, בלי חדר פרטי. מה המסר התרבותי, ובאיזו דרך הוא מועבר?","a":"שוויון ופתיחות, דרך סמל חומרי","w":["היררכיה וסמכות, דרך טקס","שוויון ופתיחות, דרך סיפור","יעילות, דרך שפה פנימית"],"e":"ישיבה בחלל פתוח בלי חדר פרטי היא סמל חומרי, והוא משדר שוויון ופתיחות. סיפור היה עובר מפה לאוזן, וכאן המסר מגיע מסידור המשרד עצמו."},{"q":"עובדים חדשים שומעים שוב ושוב איך המייסד ישן במשרד שבוע שלם כדי לעמוד בדדליין. מה המסר, ובאיזו דרך הוא מועבר?","a":"מחויבות מוחלטת, דרך סיפור","w":["מחויבות מוחלטת, דרך טקס","איזון בין עבודה לחיים, דרך סיפור","היררכיה, דרך סמל חומרי"],"e":"סיפור שעובר בין עובדים על המייסד מלמד שהמחויבות לעבודה מוחלטת. זה לא טקס, כי אין פעילות קבועה שחוזרת על עצמה."}]},
"c19":{"t":"t4","v":[{"q":"בכל יום שישי הצוות מתאסף, מחלק פרס ״העובד של השבוע״ ושר שיר קבוצתי. איזו דרך להעברת תרבות זו?","a":"טקס","w":["סיפור","סמל חומרי","שפה"],"e":"פעילות קבועה שחוזרת כל שבוע ומחזקת ערכים (הכרה, גיבוש) היא טקס. סמל חומרי היה חפץ או סידור פיזי, כמו משרד או רכב."},{"q":"בחברת היי־טק עובדים חדשים לא מבינים בהתחלה ביטויים כמו ״לסגור ספרינט״ או ״להעלות לפרוד״. מה זה ממחיש?","a":"שפה, שמזהה את חברי התרבות","w":["טקס, שמחזק ערכים","סמל חומרי, שמשדר סטטוס","סיפור, שמעגן את העבר"],"e":"ז׳רגון משותף שעובדים חדשים לא מבינים הוא שפה, והוא מסמן מי שייך לתרבות. טקס היה פעילות חוזרת, לא מילים."}]},
"c26":{"t":"t4","v":[{"q":"חברה נותנת למנהלים בכירים חניה צמודה ורכב יוקרה, ולשאר העובדים לא. מה המסר התרבותי?","a":"היררכיה והבדלי סטטוס","w":["שוויון ופתיחות","חדשנות ונטילת סיכונים","מכוונות לצוות"],"e":"חניה צמודה ורכב יוקרה רק לבכירים הם סמלים חומריים, והם משדרים היררכיה והבדלי סטטוס. שוויון ופתיחות הם בדיוק ההפך מהמסר הזה."},{"q":"מה המשותף לארבע הדרכים שבהן עובדים לומדים את התרבות?","a":"כולן מעבירות ערכים בלי שמישהו אומר אותם במפורש","w":["כולן מבוססות על נהלים כתובים ומוסדרים","כולן נקבעות ומנוהלות על ידי משאבי אנוש","כולן מופיעות רק בשלב שלפני הכניסה לארגון"],"e":"סיפורים, טקסים, סמלים חומריים ושפה מעבירים ערכים בעקיפין, בלי שמישהו מכריז עליהם. הם לא מבוססים על נהלים כתובים."}]},
"c27":{"t":"t4","v":[{"q":"עובד ותיק מספר לחדשים על עובדת שסירבה לבוס בכיר כי הוא לא עמד בנוהל בטיחות, וקיבלה על זה שבחים. מה הסיפור מלמד?","a":"שבטיחות קודמת לסמכות בארגון הזה","w":["שהארגון לא מכבד את הבכירים","שהנהלים בארגון לא ברורים","שהארגון מעודד קונפליקטים בין עובדים"],"e":"הסיפור מראה שבארגון הזה מתגמלים מי שעומד על הבטיחות, גם מול בכיר. כלומר, בטיחות קודמת לסמכות. זה לא אומר שהבכירים לא מכובדים."},{"q":"איזו מהבאות אינה אחת מארבע הדרכים העיקריות ללמידת התרבות?","a":"תיאורי תפקיד","w":["סיפורים","טקסים","סמלים חומריים"],"e":"ארבע הדרכים ללמידת התרבות הן סיפורים, טקסים, סמלים חומריים ושפה. תיאורי תפקיד הם מסמכים פורמליים, ולא אחת מהן."}]},
"c20":{"t":"t5","v":[{"q":"איזו תרבות צפויה לעודד יותר התנהגות לא אתית?","a":"תוקפנות גבוהה וקידוש התוצאות בלבד","w":["סובלנות לסיכון ותשומת לב לאמצעים","תוקפנות נמוכה ומיקוד באמצעים ובתוצאות","מכוונות לאנשים וסובלנות לסיכון"],"e":"תרבות אתית: סובלנות לסיכון, תוקפנות נמוכה־בינונית, ומיקוד גם באמצעים."},{"q":"למה מיקוד ״גם באמצעים וגם בתוצאות״ חשוב לתרבות אתית?","a":"כי כשרק התוצאה חשובה, קל להצדיק דרכים לא אתיות","w":["כי אמצעים חשובים תמיד יותר מתוצאות","כי תוצאות לא ניתנות למדידה מדויקת","כי זה מגביר את הסובלנות לסיכון בארגון"],"e":"כשרק התוצאה חשובה, קל להצדיק כל דרך להשיג אותה, גם דרך לא אתית. לכן תרבות אתית מתמקדת גם באמצעים וגם בתוצאות. זה לא אומר שאמצעים ״תמיד חשובים יותר״."}]},
"c21":{"t":"t5","v":[{"q":"מנכ״ל מפרסם קוד אתי, אבל בעצמו מקבל מתנות יקרות מספקים. איזה עיקרון ליצירת תרבות אתית הוא מפר?","a":"להיות מודל לחיקוי גלוי","w":["לספק הכשרה באתיקה","להעניש בגלוי מעשים לא אתיים","לתקשר ציפיות אתיות"],"e":"עובדים לומדים מההתנהגות של הבכירים יותר מכל מסמך. כשהמנכ״ל מקבל מתנות, הוא מפר את העיקרון להיות מודל גלוי לחיקוי, גם אם הקוד האתי פורסם."},{"q":"איזה מהבאים אינו אחד מחמשת העקרונות ליצירת תרבות אתית?","a":"להעלות את השכר של כולם","w":["לתגמל בגלוי מעשים אתיים","לספק מנגנונים להגנה","לספק הכשרה באתיקה"],"e":"חמשת העקרונות ליצירת תרבות אתית: מודל גלוי, תקשורת של ציפיות, הכשרה, תגמול גלוי של מעשים אתיים וענישה גלויה של מעשים לא אתיים, ומנגנוני הגנה. העלאת שכר לכולם לא נכללת בהם."}]},
"c22":{"t":"t5","v":[{"q":"מנהלת שואלת כל עובד ״במה אתה הכי טוב?״ ומתאימה לו משימות לפי זה, ומפרגנת על הצלחות יותר משהיא מענישה על טעויות. מה היא בונה?","a":"תרבות חיובית","w":["תרבות אתית","תרבות חזקה","תרבות רוחנית"],"e":"בנייה על החוזקות של כל עובד, ותגמול יותר מאשר ענישה, הם המאפיינים של תרבות חיובית. תרבות אתית עוסקת בהתנהגות מוסרית, וזה לא מה שמתואר כאן."},{"q":"חברה אמריקאית מנסה להנחיל תרבות חיובית עם הרבה מחמאות בסניף ביפן, והעובדים מרגישים אי־נוחות. מה הפרק היה אומר?","a":"לא כל התרבויות מעריכות חיוביות באותה מידה","w":["התרבות החיובית לא יושמה נכון","העובדים היפנים צריכים חיברות","תרבות חיובית מתאימה רק לארגונים קטנים"],"e":"הפרק מציין שלא כל התרבויות הלאומיות מעריכות חיוביות ומחמאות באותה מידה. זה הגבול של תרבות חיובית. הבעיה היא לא שהיא יושמה בצורה לא נכונה."}]},
"c23":{"t":"t5","v":[{"q":"עובדת בעמותה אומרת: ״העבודה פה נותנת לחיים שלי משמעות, ואני מרגישה חלק מקהילה.״ מה היא מתארת?","a":"רוחניות בעבודה","w":["תרבות חיובית","אקלים ארגוני","מעורבות בעבודה"],"e":"עבודה שנותנת משמעות לחיים ותחושת קהילה היא רוחניות בעבודה. מעורבות בעבודה היא שקיעה במשימה עצמה, ולא תחושה של משמעות וקהילה."},{"q":"מה הכוונה ב״רוחניות במקום העבודה״?","a":"לאנשים יש חיים פנימיים שמזינים ומוזנים מעבודה משמעותית","w":["פעילות דתית מאורגנת שמתקיימת בזמן העבודה","מדיטציה ותרגילי נשימה שהארגון מחייב","ערכים מוסריים שכתובים בקוד האתי של הארגון"],"e":"רוחניות בעבודה אינה דת או טקסים. הכוונה היא שלאנשים יש חיים פנימיים, שמזינים עבודה משמעותית בהקשר של קהילה ומוזנים ממנה."}]},
"c24":{"t":"t5","v":[{"q":"איזה מהבאים אינו מאפיין של ארגון רוחני?","a":"היררכיה קפדנית","w":["תחושת ייעוד חזקה","אמון וכבוד","פתיחות"],"e":"ארגון רוחני מתאפיין בייעוד, באמון ובכבוד ובפתיחות. היררכיה קפדנית לא מתאימה לו, ולכן היא לא מאפיין שלו."},{"q":"איזו מהבאות היא ביקורת על רוחניות בארגונים?","a":"שאלה אם יש לה לגיטימיות בארגון שמטרתו רווח","w":["שהיא מגבירה את התחלופה בארגון","שהיא מורידה פריון באופן מוכח","שהיא מתאימה רק לארגונים ממשלתיים"],"e":"הביקורת שואלת אם יש לגיטימיות לרוחניות בארגון שמטרתו רווח, ואם השניים מתיישבים. אין ראיות שהיא מורידה פריון, ולכן המסיח הזה שגוי."}]},
"c25":{"t":"t5","v":[{"q":"חברה ישראלית פותחת סניף בהודו ומנסה להעתיק אליו את התרבות שלה בדיוק. מה הפרק היה ממליץ?","a":"להתחשב בתרבות המקומית, כי היא משפיעה על התרבות הארגונית","w":["להעתיק בדיוק, כי תרבות ארגונית חזקה גוברת על הלאומית","לוותר על התרבות הארגונית לגמרי בסניף","לגייס רק ישראלים לסניף"],"e":"תרבות ארגונית יכולה לחצות גבולות, אבל לרוב משקפת את התרבות הלאומית."},{"q":"מה נכון לגבי הקשר בין תרבות ארגונית לתרבות לאומית?","a":"התרבות הארגונית משקפת לרוב את התרבות הלאומית","w":["התרבות הארגונית תמיד מבטלת את הלאומית","אין קשר בין השתיים","התרבות הלאומית קיימת רק בארגונים ממשלתיים"],"e":"התרבות הארגונית משקפת לרוב את התרבות הלאומית, ולכן אי אפשר להתעלם מהתרבות המקומית. היא לא מבטלת אותה."}]},
"ec1":{"t":"t6","v":[{"q":"ביום הראשון בטירונות, כל המדריכים מספרים לצוערים על רידג׳, מציל אגדי שהציל מאתיים איש. לפי המודל של שיין, הסיפור הוא:","a":"הרובד הגלוי של התרבות הארגונית","w":["הרובד הסמוי של התרבות הארגונית","הנחת היסוד של התרבות הארגונית","כל התשובות נכונות"],"e":"סיפורים, טקסים, סמלים ושפה הם חלק מהרובד הגלוי, שאפשר לראות ולשמוע."},{"q":"לפי מודל שיין, באיזה רובד נמצאים ערכים מוצהרים כמו ״הלקוח במרכז״ שכתובים על הקיר?","a":"ערכים מוצהרים (הרובד האמצעי)","w":["הרובד הגלוי (תוצרים)","הנחות היסוד","הרובד הגלוי, כי הם כתובים"],"e":"״הלקוח במרכז״ הוא ערך שהארגון מצהיר עליו, ולכן הוא שייך לרובד האמצעי במודל שיין. העובדה שהוא כתוב על הקיר לא הופכת אותו לתוצר גלוי, כי התוכן שלו הוא ערך."}]},
"ec2":{"t":"t6","v":[{"q":"באילו מהדרכים הבאות מוטמעת התרבות הארגונית?","a":"כל התשובות נכונות","w":["טקסי מעבר וסמלים","גיוס ומיון","שפה וחזון"],"e":"התרבות נשמרת בגיוס, ועוברת לעובדים דרך סיפורים, טקסים, סמלים ושפה."},{"q":"חברה רוצה להטמיע ערך חדש של שיתוף פעולה. איזה צעד יהיה האפקטיבי ביותר לפי מה שנלמד?","a":"שהבכירים ינהגו כך בעצמם ויתגמלו את זה בגלוי","w":["לתלות שלטים עם הערך בכל המשרדים","לשלוח מייל רשמי לכל העובדים עם הערך","להוסיף את הערך לתקנון ולנהלי הארגון"],"e":"עובדים לומדים מה שהבכירים עושים ומתגמלים, ולכן זו הדרך היעילה להטמיע ערך חדש. שלטים, מיילים ונהלים הם הצהרות, ופחות משפיעים מההתנהגות בפועל."}]},

const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mgmt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
