<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: מוטיבציה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>
</head>

};
const ic=(k,cls="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${I[k]}</svg>`;

const arrowDef=id=>`<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-c"/></marker></defs>`;

const FIG={
 maslow:()=>{const L=[["מימוש עצמי","צמיחה, מיצוי הפוטנציאל"],["הערכה","כבוד עצמי, הכרה, מעמד"],["חברתיים","שייכות, חברות, קבלה"],["ביטחון","הגנה מפגיעה פיזית ורגשית"],["פיזיולוגיים","רעב, צמא, מחסה"]];

const T=[
 {id:"t1",icon:"target",title:"מהי מוטיבציה",blocks:[
  {h:"שלושת המרכיבים",html:`${def("על מה הנושא",`למה עובד אחד מתאמץ ואחר לא? מוטיבציה היא מה ש"מניע" אותנו לפעול. לפני שנכיר את התיאוריות, נבין ממה היא בנויה.<br><b>מה נלמד כאן:</b> עוצמה · כיוון · התמדה`)}${def("מושג מפתח",`<mark>מוטיבציה</mark> ${E("Motivation")}: התהליכים שמסבירים את <b>העוצמה</b>, <b>הכיוון</b> וה<b>התמדה</b> של המאמץ של אדם להשגת מטרה.`)}${tiles([["chart","עוצמה (Intensity)","כמה קשה האדם מתאמץ. זה מה שרוב האנשים חושבים עליו כשהם אומרים מוטיבציה"],["target","כיוון (Direction)","לאן המאמץ מופנה. מאמץ גבוה לא יעזור אם הוא לא מכוון למטרות הארגון"],["clock","התמדה (Persistence)","כמה זמן האדם מצליח להחזיק את המאמץ, עד שהוא משיג את המטרה"]])}${rem("מוטיבציה היא לא תכונה קבועה: אותו אדם יכול להיות עם מוטיבציה גבוהה במשימה אחת ונמוכה במשימה אחרת.")}${ex(`סטודנט לפני מבחן: <b>עוצמה</b> – כמה שעות הוא לומד. <b>כיוון</b> – האם הוא לומד את החומר הנכון או גולל ברשתות "בשביל הלימודים". <b>התמדה</b> – האם הוא ממשיך גם אחרי שבוע, או נשבר אחרי יומיים.`)}`,q:"m1"}
 ]},
 {id:"t2",icon:"pyramid",title:"התיאוריות המוקדמות",blocks:[
  {h:"פירמידת הצרכים של מאסלו",html:`${def("על מה הנושא",`התיאוריות הראשונות על מוטיבציה נוצרו בשנות ה-50. הן מוכרות מאוד למנהלים, אבל לא כולן קיבלו תמיכה מחקרית. כדאי להכיר אותן כי הן הבסיס לתיאוריות החדשות.<br><b>מה נלמד כאן:</b> מאסלו: פירמידת הצרכים · תיאוריה X ותיאוריה Y · הרצברג: שני גורמים · מקללנד: שלושה צרכים`)}<p><b>אברהם מאסלו</b> טען שבכל אדם יש היררכיה של חמישה צרכים. צורך שסופק במידה רבה <mark>כבר לא מניע</mark>, ואז הצורך הבא בתור הופך לדומיננטי.</p>${fig("maslow")}${def("שתי קבוצות",`<mark>צרכים נמוכים</mark> (פיזיולוגיים וביטחון) מסופקים בעיקר <b>מבחוץ</b>, למשל בשכר וקביעות. <mark>צרכים גבוהים</mark> (חברתיים, הערכה ומימוש עצמי) מסופקים <b>מבפנים</b>.`)}${rem("התיאוריה מאוד מוכרת ואינטואיטיבית, אבל המחקר כמעט לא תומך בה.")}${ex(`עובד שלא בטוח שיקבל משכורת בסוף החודש (צורך בביטחון) לא יתעניין בפרויקט "מאתגר ומגשים" (מימוש עצמי). קודם צריך לסגור את הצרכים הנמוכים.`)}`,q:"m2"},
  {h:"תיאוריה X ותיאוריה Y",html:`${who("מ","דאגלס מקגרגור","","הציע שתי השקפות על בני אדם, שמעצבות את ההתנהגות של מנהלים כלפי העובדים.")}${tiles([["lock","תיאוריה X (שלילית)","עובדים לא אוהבים לעבוד, מתחמקים מאחריות, וצריך לכוון ואפילו לכפות עליהם"],["sprout","תיאוריה Y (חיובית)","עבודה טבעית כמו מנוחה או משחק. האדם הממוצע יכול לקבל ואף לחפש אחריות"]])}<p>מקגרגור האמין ב-Y, והמליץ על השתתפות בקבלת החלטות, עבודה מאתגרת ויחסים טובים בקבוצה. <b>אבל:</b> אין ראיות מחקריות שאף אחת מההנחות נכונה.</p>`,q:"m4"},
  {h:"תיאוריית שני הגורמים של הרצברג",html:`<p><b>פרדריק הרצברג</b> שאל אנשים מתי הרגישו טוב או רע במיוחד בעבודה. התשובות היו שונות לגמרי:</p>${tiles([["bulb","גורמים מניעים (פנימיים)","קידום, הכרה, אחריות, הישגים. אלה יוצרים שביעות רצון"],["hand","גורמי היגיינה (חיצוניים)","שכר, פיקוח, מדיניות החברה, תנאי עבודה, ביטחון תעסוקתי. הם רק מונעים חוסר שביעות רצון"]])}${fig("herzberg")}${rem("מנהל שמתקן רק את גורמי ההיגיינה \"מרגיע\" את העובדים, אבל לא מניע אותם.")}`,q:"m5"},
  {h:"תורת הצרכים של מקללנד",html:`<p><b>דייוויד מקללנד</b> הציע שלושה צרכים שמסבירים מוטיבציה:</p>${tiles([["chart","צורך בהישגים (nAch)","הדחף להצטיין ולהצליח מול סטנדרט"],["pyramid","צורך בכוח (nPow)","הצורך לגרום לאחרים להתנהג כפי שלא היו מתנהגים אחרת"],["people","צורך בשייכות (nAff)","הרצון ביחסים חמים וקרובים עם אחרים"]])}${def("שימו לב",`בעלי צורך גבוה בהישגים מעדיפים משימות עם <mark>סיכוי של 50% להצליח</mark>: לא קלות מדי (אין אתגר) ולא תלויות במזל. הם מצליחים בעבודה עם אחריות אישית, משוב וסיכון בינוני.`)}${ex(`איש מכירות עם צורך גבוה בהישגים יעדיף יעד של 30 עסקאות, שאפשר לעמוד בו אם מתאמצים, על פני יעד של 5 (משעמם) או 100 (בלתי אפשרי).`)}`,q:"m8"}
 ]},
 {id:"t3",icon:"sprout",title:"מוטיבציה פנימית ומעורבות",blocks:[
  {h:"תורת ההכוונה העצמית",html:`${def("על מה הנושא",`יש דברים שאנחנו עושים כי "חייבים" (בשביל כסף), ויש דברים שאנחנו עושים כי אנחנו נהנים. הנושא מראה מה קורה כשמערבבים בין השניים, ומהי מעורבות אמיתית בעבודה.<br><b>מה נלמד כאן:</b> תורת ההכוונה העצמית · התאמה עצמית · מעורבות בעבודה`)}${ex("מרשה התנדבה בעמותה לאימוץ חיות ונהנתה מכל רגע. אחרי שהתחילו לשלם לה על אותה עבודה בדיוק, היא נהנית הרבה פחות.")}${def("מושג מפתח",`<mark>תורת ההכוונה העצמית</mark> ${E("Self-determination theory")}: אנשים רוצים להרגיש שליטה במעשים שלהם. כל דבר שהופך משימה מהנה ל"חובה" פוגע במוטיבציה.`)}<p>חלק מרכזי בה הוא <mark>תורת ההערכה הקוגניטיבית</mark> ${E("Cognitive evaluation theory")}: תגמול חיצוני על משימה שהייתה מהנה בפני עצמה עלול <b>להוריד</b> את המוטיבציה, אם התגמול נתפס כשולט.</p>${def("מושג נלווה",`<mark>התאמה עצמית</mark> ${E("Self-concordance")}: עד כמה הסיבות לרדוף אחרי מטרה מתאימות לתחומי העניין ולערכים של האדם. מי שרודף מטרה מסיבות פנימיות, מצליח יותר ומאושר יותר, גם אם לא השיג אותה.`)}`,q:"m10"},
  {h:"מעורבות בעבודה",html:`${def("מושג מפתח",`<mark>מעורבות בעבודה</mark> ${E("Job engagement")}: השקעה של אנרגיה <b>פיזית, קוגניטיבית ורגשית</b> של העובד בביצוע העבודה.`)}${ex("אחות שכשהיא בעבודה, כל השאר נעלם: הרגשות, המחשבות וההתנהגות שלה מופנים לטיפול במטופלים, והיא אפילו לא שמה לב כמה זמן עבר.")}${rem("מעורבות היא יותר מלאהוב את העבודה או למצוא אותה מעניינת. זו מחויבות עמוקה שמניעה ביצועים.")}`,q:"m12"}
 ]},
 {id:"t4",icon:"target",title:"הצבת מטרות ומסוגלות עצמית",blocks:[
  {h:"תורת הצבת המטרות",html:`${def("על מה הנושא",`"תעשה כמיטב יכולתך" או "תמכור 50 יחידות עד סוף החודש"? הנושא מסביר למה מטרה מוגדרת עובדת טוב יותר, ואיך האמונה ביכולת שלנו משפיעה על המאמץ.<br><b>מה נלמד כאן:</b> תורת הצבת המטרות · ניהול לפי יעדים (MBO) · מסוגלות עצמית`)}${who("ל","אדווין לוק","שנות ה-60","הכוונה לפעול להשגת מטרה היא מקור מרכזי למוטיבציה בעבודה.")}${tiles([["target","מטרות ספציפיות","משיגות יותר מ\"תעשה כמיטב יכולתך\""],["chart","מטרות קשות","כשהן מתקבלות, מביאות לביצועים גבוהים יותר ממטרות קלות"],["cycle","משוב","מוביל לביצועים טובים יותר מאשר בלי משוב"]])}<p><b>שלושה גורמים ממתנים:</b> <mark>מחויבות למטרה</mark> (גבוהה יותר כשהמטרה פומבית, כשלאדם יש מיקוד שליטה פנימי וכשהוא הציב אותה בעצמו), <mark>מאפייני המשימה</mark> (ההשפעה חזקה יותר במשימות פשוטות, מוכרות ועצמאיות), ו<mark>תרבות</mark>.</p>`,q:"m13"},
  {h:"ניהול לפי יעדים (MBO)",html:`${def("מושג מפתח",`<mark>ניהול לפי יעדים</mark> ${E("Management by objectives")}: תוכנית של מטרות ספציפיות, שנקבעות <b>בשיתוף</b>, לתקופת זמן מוגדרת, עם משוב על ההתקדמות.`)}<p>יעדי הארגון מתורגמים ליעדים לכל רמה: חטיבה, מחלקה, עובד. מכיוון שמנהלים בדרגים נמוכים משתתפים בקביעת היעדים, השיטה עובדת גם מלמטה למעלה.</p>${tiles([["target","ספציפיות היעדים",""],["people","השתתפות בקבלת החלטות",""],["clock","תקופת זמן מוגדרת",""],["cycle","משוב על הביצועים",""]])}${ex(`המנהלת והעובד יושבים יחד בתחילת הרבעון וקובעים: "להעלות את שביעות רצון הלקוחות מ-70% ל-80% עד מרץ". כל חודש הם בודקים יחד איפה הוא עומד.`)}`,q:"m15"},
  {h:"מסוגלות עצמית",html:`${def("מושג מפתח",`<mark>מסוגלות עצמית</mark> ${E("Self-efficacy")}: האמונה של אדם שהוא <b>מסוגל</b> לבצע משימה. במצב קשה, מי שמסוגלותו נמוכה מוריד את המאמץ, ומי שמסוגלותו גבוהה מתאמץ יותר.`)}<p><b>אלברט בנדורה</b>: ארבע דרכים להעלות מסוגלות עצמית:</p>${tiles([["chart","שליטה מתוך ביצוע","ניסיון מוצלח במשימה. <b>המקור החשוב ביותר</b>"],["people","למידה מצפייה","לראות מישהו אחר מצליח, במיוחד מישהו דומה לנו"],["hand","שכנוע מילולי","מישהו משכנע אותנו שיש לנו את הכישורים"],["bulb","עוררות","מצב אנרגטי ש\"מדליק\" אותנו לפני ביצוע"]])}${rem("הצבת מטרות ומסוגלות עצמית משלימות: מנהל שמציב לך מטרה קשה משדר שהוא מאמין בך, וזה מעלה את המסוגלות שלך.")}${ex(`שני סטודנטים נכשלו בבוחן. אחת חושבת "אני מסוגלת, פשוט לא למדתי מספיק" ומגבירה את הלמידה. השני חושב "אני לא בנוי לזה" ומוותר. ההבדל הוא במסוגלות העצמית.`)}`,q:"m17"}
 ]},
 {id:"t5",icon:"scales",title:"חיזוק, הוגנות וציפיות",blocks:[
  {h:"תורת החיזוק",html:`${def("על מה הנושא",`שלוש תיאוריות שמסבירות מוטיבציה דרך מה שקורה <b>אחרי</b> ההתנהגות: מה מקבלים בתמורה, האם זה הוגן בהשוואה לאחרים, והאם המאמץ באמת ישתלם.<br><b>מה נלמד כאן:</b> תורת החיזוק · תורת ההוגנות · צדק ארגוני · תורת הציפיות של ורום`)}${def("מושג מפתח",`<mark>תורת החיזוק</mark> ${E("Reinforcement theory")}: התנהגות היא פונקציה של <b>התוצאות</b> שלה. מה שמגיע מיד אחרי התנהגות ומגדיל את הסיכוי שתחזור, הוא חיזוק.`)}<p>בניגוד להצבת מטרות (גישה קוגניטיבית), תורת החיזוק מתעלמת ממה שקורה בתוך האדם. לכן, במובן הצר, היא אפילו לא תיאוריה של מוטיבציה.</p>${tiles([["cycle","ביהביוריזם","התנהגות באה בעקבות גירויים, באופן כמעט לא מחושב"],["people","למידה חברתית","לומדים גם מצפייה באחרים, ולא רק מניסיון ישיר"]])}${ex(`עובד שמגיע בזמן ומקבל מחמאה מהמנהל, ימשיך להגיע בזמן. המחמאה היא החיזוק.`)}`,q:"m19"},
  {h:"תורת ההוגנות",html:`${def("מושג מפתח",`<mark>תורת ההוגנות</mark> ${E("Equity theory")}: אנשים משווים את היחס בין <b>התשומות</b> שלהם (מאמץ, ניסיון, השכלה) ל<b>תוצאות</b> (שכר, קידום, הכרה) לאותו יחס אצל אחרים, ופועלים לתקן חוסר הוגנות.`)}<p><b>ארבעה סוגי השוואה:</b> עצמי-בפנים (תפקיד אחר שלי בארגון), עצמי-בחוץ (עבודה קודמת שלי), אחר-בפנים (עמית בארגון), אחר-בחוץ (מישהו בארגון אחר).</p><p><b>שש תגובות לחוסר הוגנות:</b> לשנות את התשומות, לשנות את התוצאות, לעוות את התפיסה של עצמי, לעוות את התפיסה של אחרים, לבחור מישהו אחר להשוות אליו, או לעזוב.</p>${rem("תשלום יתר כמעט לא משנה התנהגות: אנשים סובלניים הרבה יותר לחוסר הוגנות לטובתם.")}${ex(`דנה ויוסי עושים אותה עבודה באותה רמה, אבל יוסי מרוויח יותר. דנה תרגיש חוסר הוגנות, ואולי תתאמץ פחות, תבקש העלאה או תחפש עבודה אחרת.`)}`,q:"m21"},
  {h:"צדק ארגוני",html:`<p>הצדק הארגוני מרחיב את תורת ההוגנות לתמונה רחבה יותר:</p>${tiles([["pie","צדק חלוקתי","האם <b>הכמות</b> והחלוקה של התגמולים הוגנות"],["doc","צדק פרוצדורלי","האם <b>התהליך</b> שבו הוחלט הוגן. כולל שליטה בתהליך (להשמיע את עמדתך) והסברים"],["hand","צדק בין-אישי (אינטראקטיבי)","האם מתייחסים אליי <b>בכבוד, באכפתיות ובהתחשבות</b>"]])}${rem("צדק פרוצדורלי הופך חשוב במיוחד כשהצדק החלוקתי חסר: כשלא קיבלנו מה שרצינו, אנחנו מתמקדים בשאלה למה.")}`,q:"m24"},
  {h:"תורת הציפיות של ורום",html:`<p>אחת התיאוריות המקובלות ביותר: עובד יתאמץ אם הוא מאמין שהמאמץ יוביל להערכה טובה, שההערכה תוביל לתגמול, ושהתגמול יספק את המטרות האישיות שלו.</p>${fig("expect")}${ex("סטודנט שבטוח שגם אם ילמד קשה לא יקבל ציון גבוה (קשר 1 חלש), או שהציון לא ישנה לו כלום (קשר 3 חלש), לא יתאמץ.")}`,q:"m26"}
 ]},
 {id:"t6",icon:"check",title:"תרגול בסגנון המבחן",blocks:[
  {h:"מושגים מהמבחן לדוגמה",html:`<p>במבחן לדוגמה יש שאלת יישום על <b>הרצברג</b>: צריך למיין כל פרט בתרחיש לשתי קבוצות.</p>${tiles([["bulb","מניעים (אינטרינזיים)","הכרה, אחריות, קידום, הישגים, העבודה עצמה"],["scales","היגיינה (אקסטרינזיים)","שכר, קביעות, תנאים פיזיים, יחסים עם עמיתים, מדיניות החברה"]])}<p>השאלה הראשונה בכל זוג לקוחה מקובץ <b>השאלות לדוגמה למבחן</b> של הקורס (עם התשובה לפי המפתח), והשנייה היא שאלה מקבילה בסגנון דומה.</p>`,q:"em1"}
 ]}
];
const Q={"m1":{"t":"t1","v":[{"q":"מתכנת עובד 12 שעות ביום על פרויקט, אבל אחרי שבועיים נשבר ומפסיק. איזה מרכיב של מוטיבציה חלש אצלו?","a":"התמדה","w":["עוצמה","כיוון","עוצמה וכיוון יחד"],"e":"הוא התאמץ חזק (עוצמה) ובכיוון הנכון, אבל לא החזיק לאורך זמן."},{"q":"עובדת משקיעה שעות בעיצוב מצגות מושקעות, אבל הלקוח ביקש רק נתונים. איזה מרכיב של מוטיבציה בעייתי?","a":"כיוון","w":["עוצמה","התמדה","עוצמה והתמדה יחד"],"e":"היא משקיעה הרבה (עוצמה) ולאורך זמן (התמדה), אבל לא לכיוון שהלקוח ביקש. לכן הבעיה בכיוון. אין כאן בעיית עוצמה, כי היא דווקא מתאמצת מאוד."}]},
"m1b":{"t":"t1","v":[{"q":"מנהל אומר: ״לדני אין מוטיבציה, זה פשוט האופי שלו.״ מה הבעיה בטענה, לפי הפרק?","a":"מוטיבציה משתנה ממצב למצב, ואינה תכונה קבועה","w":["מוטיבציה נקבעת רק לפי השכר ולא לפי האופי","מוטיבציה נמדדת רק בעוצמה, לא בהתנהגות","מוטיבציה קבועה, אבל אפשר למדוד אותה רק במבחן"],"e":"אותו אדם יכול להיות עם מוטיבציה גבוהה במשימה אחת ונמוכה באחרת."},{"q":"מה רוב האנשים מתכוונים אליו כשהם אומרים ״מוטיבציה״, ולמה זה לא מספיק?","a":"לעוצמה, אבל בלי כיוון והתמדה זה לא מספיק","w":["להתמדה, אבל בלי עוצמה אין תוצאות","לכיוון, אבל בלי שכר אין מאמץ","לעוצמה, וזה מספיק כי היא כוללת את השאר"],"e":"כשאומרים ״מוטיבציה״ מתכוונים בדרך כלל לעוצמה, כמה קשה אדם מתאמץ. אבל לפי הפרק צריך גם כיוון והתמדה, ולכן עוצמה לבדה לא מספיקה ולא ״כוללת את השאר״."}]},
"m1c":{"t":"t1","v":[{"q":"סטודנטית לומדת 6 שעות ביום כבר חודש, אבל רק את הפרקים שהיא אוהבת, ולא את מה שיופיע במבחן. מה נכון?","a":"עוצמה והתמדה גבוהות, כיוון בעייתי","w":["עוצמה נמוכה, כיוון והתמדה גבוהים","כל שלושת המרכיבים גבוהים","התמדה נמוכה, עוצמה וכיוון גבוהים"],"e":"שש שעות ביום (עוצמה) במשך חודש (התמדה) מראות מאמץ גבוה. הבעיה היא שהמאמץ לא מכוון למה שיופיע במבחן, כלומר הכיוון בעייתי."},{"q":"מה ההגדרה של מוטיבציה לפי הפרק?","a":"התהליכים שמסבירים את העוצמה, הכיוון וההתמדה של מאמץ להשגת מטרה","w":["תכונת אישיות יציבה שקובעת כמה אדם מתאמץ בכל משימה בעבודה","הרצון להרוויח יותר כסף ולהתקדם בארגון לאורך השנים","מצב רגשי חיובי שמופיע כשהעבודה עצמה מעניינת ומהנה"],"e":"לפי הפרק, מוטיבציה היא תהליך שמסביר את העוצמה, הכיוון וההתמדה של המאמץ להשגת מטרה. היא לא תכונת אישיות קבועה, ולכן אותו אדם יכול להיות עם מוטיבציה גבוהה במשימה אחת ונמוכה באחרת."}]},
"m1d":{"t":"t1","v":[{"q":"מנהלת רוצה לשפר את ״הכיוון״ של המוטיבציה בצוות. מה הצעד המתאים ביותר?","a":"להבהיר אילו משימות תורמות למטרות הארגון","w":["להגדיל את הבונוס על שעות נוספות","לעודד את העובדים להמשיך גם כשקשה","להאריך את שעות העבודה של הצוות"],"e":"כיוון הוא לאן מופנה המאמץ. בונוס ושעות משפיעים בעיקר על עוצמה, ועידוד על התמדה."},{"q":"איזה מצב מתאר בעיה בהתמדה, ולא בעוצמה או בכיוון?","a":"עובד שמתחיל כל פרויקט בהתלהבות ונוטש באמצע","w":["עובד שעובד לאט מאוד על המשימה הנכונה","עובד שעובד קשה על משימות שאף אחד לא ביקש","עובד שבוחר תמיד את המשימות הקלות"],"e":"מי שמתחיל בהתלהבות ונוטש באמצע מתאמץ ומכוון נכון, אבל לא מחזיק עד הסוף, וזו בעיית התמדה. עבודה איטית על המשימה הנכונה היא דווקא בעיית עוצמה."}]},
"m2":{"t":"t2","v":[{"q":"עובד עם משכורת יציבה וקביעות מתחיל לחפש קשרים חברתיים בעבודה. איך מאסלו מסביר את זה?","a":"צורכי הביטחון סופקו, ולכן הצורך החברתי הפך לדומיננטי","w":["צורכי ההערכה סופקו, ולכן הוא חוזר לצרכים הנמוכים","הצורך החברתי תמיד חזק יותר מהצורך בביטחון","הוא מחפש מימוש עצמי, כי הצרכים החברתיים כבר סופקו"],"e":"לפי מאסלו, צורך שסופק במידה רבה מפסיק להניע, והצורך הבא בפירמידה הופך לדומיננטי. אחרי ביטחון (משכורת וקביעות) מגיע הצורך החברתי. הוא עוד לא במימוש עצמי, כי הצורך החברתי עדיין לא סופק."},{"q":"מהו הסדר הנכון בפירמידת מאסלו, מלמטה למעלה?","a":"פיזיולוגיים, ביטחון, חברתיים, הערכה, מימוש עצמי","w":["פיזיולוגיים, חברתיים, ביטחון, הערכה, מימוש עצמי","ביטחון, פיזיולוגיים, חברתיים, מימוש עצמי, הערכה","פיזיולוגיים, ביטחון, הערכה, חברתיים, מימוש עצמי"],"e":"הסדר מלמטה: פיזיולוגיים, ביטחון, חברתיים, הערכה, מימוש עצמי. טעות נפוצה היא להחליף בין ביטחון לחברתיים, אבל ביטחון בא מיד אחרי הצרכים הפיזיולוגיים."}]},
"m3":{"t":"t2","v":[{"q":"מנהל מציע לעובדים פרויקט ״מגשים ומאתגר״, אבל הם לא בטוחים שיקבלו משכורת בזמן. לפי מאסלו, למה ההצעה לא תעבוד?","a":"צורך הביטחון לא סופק, ולכן צורך גבוה לא יניע","w":["מימוש עצמי מסופק מבחוץ, ולא מהעבודה עצמה","צורך הביטחון שייך לצרכים הגבוהים","פרויקט מאתגר מספק בעיקר את הצורך החברתי"],"e":"לפי מאסלו, צורך גבוה כמו מימוש עצמי לא מניע כל עוד צורך נמוך יותר, כאן ביטחון במשכורת, לא סופק. צורך הביטחון שייך לצרכים הנמוכים, לא לגבוהים."},{"q":"מה נכון לגבי מאסלו, לפי הפרק?","a":"מוכרת ואינטואיטיבית, אבל כמעט בלי תמיכה מחקרית","w":["התיאוריה נתמכה במחקרים רבים בארגונים","התיאוריה נדחתה כי היא לא אינטואיטיבית","התיאוריה נתמכת רק לגבי הצרכים הגבוהים"],"e":"התיאוריה של מאסלו מוכרת ונשמעת הגיונית, אבל כמעט אין לה תמיכה מחקרית. היא לא נדחתה בגלל שאינה אינטואיטיבית: היא דווקא אינטואיטיבית מאוד, והבעיה היא בראיות."}]},
"m4":{"t":"t2","v":[{"q":"מנהלת נותנת לעובדים לבחור איך לבצע משימות ומשתפת אותם בהחלטות. לפי מקגרגור, באיזו השקפה היא מחזיקה, ומה המחקר אומר עליה?","a":"תיאוריה Y, ואין ראיות מחקריות שהיא נכונה","w":["תיאוריה X, ואין ראיות מחקריות שהיא נכונה","תיאוריה Y, והמחקר הוכיח שהיא נכונה","תיאוריה X, והמחקר הוכיח שהיא נכונה"],"e":"שיתוף ואחריות מאפיינים את Y. אבל לאף אחת מההשקפות אין תמיכה מחקרית."},{"q":"מה מקגרגור המליץ, בהתאם לתיאוריה Y?","a":"השתתפות בהחלטות, עבודה מאתגרת ויחסים טובים בקבוצה","w":["פיקוח צמוד, כללים ברורים ותגמול לפי תפוקה","העלאת שכר וקביעות כדי לספק את צורכי הביטחון","הפרדה בין מנהלים לעובדים כדי למנוע קונפליקטים"],"e":"מקגרגור האמין ב-Y והמליץ על דרכים שמניחות שעובדים רוצים אחריות."}]},
"m5":{"t":"t2","v":[{"q":"לפי הרצברג, עובד שקיבל שכר הוגן, תנאים טובים וקביעות, אבל עבודה משעממת בלי הכרה, ירגיש:","a":"לא חוסר שביעות רצון, אבל גם לא שביעות רצון","w":["שביעות רצון, כי כל התנאים החיצוניים טובים","חוסר שביעות רצון, כי חסרים לו גורמי היגיינה","שביעות רצון חלקית, כי חצי מהגורמים מסופקים"],"e":"גורמי היגיינה מונעים חוסר שביעות רצון, אבל לא יוצרים שביעות רצון."},{"q":"לפי הרצברג, מה ההפך של ״שביעות רצון״?","a":"״אין שביעות רצון״, ולא ״חוסר שביעות רצון״","w":["״חוסר שביעות רצון״, כמו בגישה המסורתית","״אדישות״, שנוצרת מגורמי היגיינה","״תסכול״, שנוצר מגורמים מניעים"],"e":"הרצברג טען שיש שני רצפים נפרדים. ההפך של שביעות רצון הוא ״אין שביעות רצון״, וההפך של חוסר שביעות רצון הוא ״אין חוסר שביעות רצון״. ״חוסר שביעות רצון״ כהפך הוא הגישה המסורתית שהוא דחה."}]},
"m6":{"t":"t2","v":[{"q":"איזה מהבאים הוא גורם מניע לפי הרצברג, ולא גורם היגיינה?","a":"אחריות על פרויקט","w":["יחסים טובים עם עמיתים","מדיניות החברה","איכות הפיקוח"],"e":"אחריות היא גורם פנימי שנוגע לעבודה עצמה, ולכן היא גורם מניע. יחסים עם עמיתים נשמעים פנימיים, אבל הם חלק מהסביבה, ולכן גורם היגיינה."},{"q":"מנהלת רוצה ליצור מוטיבציה אמיתית בצוות לפי הרצברג. מה כדאי לה לשנות?","a":"להעשיר את התפקיד באחריות, הכרה והזדמנות להישגים","w":["לשפר את תנאי המשרד ולהעלות את השכר לכולם","לשפר את היחסים בצוות ולהקל את הפיקוח עליהם","להבטיח לכולם קביעות ולנסח מדיניות ברורה"],"e":"לפי הרצברג, רק גורמים מניעים כמו אחריות, הכרה והישגים יוצרים שביעות רצון. שכר ותנאים הם גורמי היגיינה: הם מונעים חוסר שביעות רצון, אבל לא יוצרים מוטיבציה."}]},
"m7":{"t":"t2","v":[{"q":"מה הבעיה בשיטה שבה הרצברג אסף את הנתונים, לפי הביקורת?","a":"דיווח עצמי: הצלחה נזקפת לעצמי, כישלון לסביבה","w":["הוא חקר רק מנהלים בכירים, ולכן אי אפשר להכליל","הוא מדד רק שכר, ולא שאל על תחושות בעבודה","הוא השתמש בניסוי מעבדה ולא בשאלות על העבודה"],"e":"זו בעצם ההטיה לטובת העצמי: הגורמים הטובים ״שלי״, והרעים ״של הארגון״."},{"q":"איזו הטיה מפרק התפיסה מסבירה את הביקורת על הרצברג?","a":"הטיה לטובת העצמי","w":["אפקט ההילה","הטיית עיגון","אפקט הניגוד"],"e":"אנשים ייחסו הצלחה לעצמם (גורמים פנימיים) וכישלון לסביבה (גורמים חיצוניים)."}]},
"m8":{"t":"t2","v":[{"q":"איש מכירות עם צורך גבוה בהישגים צריך לבחור יעד חודשי. מה הוא כנראה יעדיף?","a":"יעד שאפשר להשיג רק עם מאמץ אמיתי","w":["יעד קל שבטוח יעמוד בו","יעד גבוה מאוד, שתלוי בעיקר במזל","יעד שקובע המנהל, בלי משוב"],"e":"בעלי צורך גבוה בהישגים (nAch) מעדיפים אתגר בינוני, בסביבות 50% הצלחה, שתלוי במאמץ שלהם. יעד קל לא מאתגר, ויעד גבוה מאוד תלוי במזל ולא בהם."},{"q":"מנהלת נהנית לשכנע אחרים לאמץ את הרעיונות שלה ולהשפיע על החלטות. איזה צורך דומיננטי אצלה לפי מקללנד?","a":"צורך בכוח (nPow)","w":["צורך בהישגים (nAch)","צורך בשייכות (nAff)","צורך במימוש עצמי"],"e":"הצורך לגרום לאחרים להתנהג כפי שלא היו מתנהגים אחרת הוא nPow. מימוש עצמי שייך למאסלו."}]},
"m9":{"t":"t2","v":[{"q":"באיזה תפקיד אדם עם צורך גבוה בהישגים יצליח במיוחד?","a":"ניהול עסק עצמאי, עם אחריות אישית ומשוב מהיר","w":["תפקיד שבו כל ההחלטות מתקבלות בוועדה","תפקיד בטוח ושגרתי, בלי סיכון","תפקיד שבו ההצלחה תלויה בעיקר במזל"],"e":"בעלי nAch מצליחים כשיש אחריות אישית, משוב מהיר וסיכון בינוני, כמו בעסק עצמאי. בתפקיד שבו כל ההחלטות בוועדה אין להם אחריות אישית על התוצאה."},{"q":"עובד מעדיף לעבוד בצוות מגובש וחם, גם על חשבון קידום. איזה צורך דומיננטי אצלו?","a":"צורך בשייכות (nAff)","w":["צורך בכוח (nPow)","צורך בהישגים (nAch)","צורך בביטחון"],"e":"הרצון ביחסים חמים וקרובים הוא nAff. צורך בביטחון שייך למאסלו."}]},
"m10":{"t":"t3","v":[{"q":"ילדה שאהבה לקרוא מתחילה לקבל כסף על כל ספר, ואחרי חודש קוראת פחות. מה מסביר זאת?","a":"התגמול נתפס כשולט, והפך את הקריאה ל״חובה״","w":["הסכום לא היה גבוה מספיק כדי להניע אותה","הצורך הפיזיולוגי שלה כבר סופק, ולכן הוא לא מניע","החיזוק ניתן מאוחר מדי אחרי הקריאה"],"e":"תורת ההערכה הקוגניטיבית: תגמול חיצוני על משימה מהנה עלול להוריד מוטיבציה."},{"q":"באיזה מצב תגמול חיצוני צפוי לפגוע הכי הרבה במוטיבציה, לפי תורת ההערכה הקוגניטיבית?","a":"משימה שהייתה מהנה, ותגמול שנתפס כשולט","w":["משימה משעממת, ותגמול שנתפס כשולט","משימה מהנה, ותגמול שנתפס כהכרה","משימה משעממת, ותגמול שנתפס כהכרה"],"e":"לפי תורת ההערכה הקוגניטיבית, תגמול חיצוני פוגע כשהמשימה מהנה בפני עצמה והתגמול מרגיש כמו שליטה. במשימה משעממת אין מוטיבציה פנימית לפגוע בה, ותגמול שנתפס כהכרה דווקא יכול לחזק."}]},
"m11":{"t":"t3","v":[{"q":"שתי סטודנטיות לומדות משפטים. אחת כי זה מעניין אותה, השנייה כי ההורים לחצו. לפי הפרק, מי צפויה להיות מאושרת יותר, גם אם שתיהן ייכשלו?","a":"הראשונה, כי יש לה התאמה עצמית גבוהה","w":["השנייה, כי יש לה מוטיבציה חיצונית חזקה","שתיהן באותה מידה, כי התוצאה זהה","השנייה, כי הלחץ מעלה את המחויבות"],"e":"מי שרודף מטרה מסיבות פנימיות מצליח ומאושר יותר, גם בלי להשיג אותה."},{"q":"מה מודדת ״התאמה עצמית״?","a":"עד כמה הסיבות לרדוף אחרי מטרה מתאימות לערכים של האדם","w":["עד כמה האדם מאמין שהוא מסוגל להשיג את המטרה","עד כמה המטרה ספציפית וקשה","עד כמה האדם מרגיש שהתגמול הוגן"],"e":"התאמה עצמית בודקת אם הסיבות לרדוף אחרי מטרה מתאימות לערכים של האדם. ״האם אני מסוגל״ הוא מסוגלות עצמית, מושג אחר."}]},
"m12":{"t":"t3","v":[{"q":"עובד אוהב את העבודה ומוצא אותה מעניינת, אבל לא משקיע בה מעבר לנדרש. האם יש לו מעורבות בעבודה?","a":"לא בהכרח: מעורבות היא השקעה של אנרגיה בביצוע","w":["כן, כי מעורבות היא אהבה לעבודה","כן, כי עניין בעבודה הוא תנאי מספיק","לא, כי מעורבות נמדדת רק בשעות עבודה"],"e":"מעורבות היא יותר מלאהוב את העבודה. זו השקעה של אנרגיה בביצוע."},{"q":"איזו דוגמה מתארת הכי טוב מעורבות בעבודה?","a":"עובדת ששקועה במשימה בגוף, במחשבה וברגש, ומאבדת תחושת זמן","w":["עובדת שמגיעה תמיד בזמן ולא מפספסת אף יום עבודה","עובדת שמרוצה מאוד מהשכר, מהתנאים ומההטבות","עובדת שמספרת לכולם כמה היא אוהבת את מקום העבודה"],"e":"מעורבות היא השקעה של אנרגיה גופנית, מחשבתית ורגשית בביצוע עצמו, עד שמאבדים תחושת זמן. הגעה בזמן היא נוכחות, ושביעות רצון מהשכר אינה מעורבות."}]},
"m12b":{"t":"t3","v":[{"q":"חברה מציעה בונוס על כל רעיון שעובדים מגישים בתיבת ההצעות, ומספר הרעיונות היצירתיים דווקא ירד. מה ההסבר המתאים לפי הפרק?","a":"הבונוס נתפס כשולט, והמוטיבציה הפנימית ירדה","w":["הבונוס היה נמוך מדי ביחס למאמץ הנדרש","העובדים לא האמינו שהרעיונות ייושמו בפועל","לעובדים אין מסוגלות עצמית בתחום הרעיונות"],"e":"תורת ההערכה הקוגניטיבית: תגמול חיצוני על פעילות שהייתה מהנה עלול להוריד מוטיבציה."},{"q":"מה המשותף לתורת ההכוונה העצמית ולהתאמה עצמית?","a":"שתיהן מדגישות את החשיבות של מוטיבציה שבאה מבפנים","w":["שתיהן טוענות שתגמול חיצוני תמיד מגביר מוטיבציה","שתיהן עוסקות בהשוואה בין עובדים בארגון","שתיהן מבוססות על היררכיה של חמישה צרכים"],"e":"שתיהן מדגישות מוטיבציה שבאה מבפנים: תחושת שליטה ובחירה, והתאמה לערכים. שתיהן דווקא מזהירות שתגמול חיצוני עלול לפגוע, ולא טוענות שהוא תמיד עוזר."}]},
"m13":{"t":"t4","v":[{"q":"מנהל אומר לעובד: ״תעשה כמיטב יכולתך החודש.״ לפי לוק, מה היה עדיף?","a":"יעד ספציפי וקשה, למשל 40 עסקאות, עם משוב שבועי","w":["יעד קל, כדי שהעובד ירגיש הצלחה וימשיך","להשאיר את הניסוח, כי הוא לא מפעיל לחץ מיותר","יעד ספציפי וקל, בלי משוב שעלול להפריע לו"],"e":"מטרות ספציפיות וקשות, עם משוב, מובילות לביצועים הגבוהים ביותר."},{"q":"באיזה תנאי מטרה קשה תוביל לביצועים טובים יותר ממטרה קלה, לפי לוק?","a":"כשהעובד קיבל את המטרה ומחויב אליה","w":["כשהמטרה עמומה ומשאירה חופש","כשאין משוב, כדי לא להלחיץ","כשהמשימה מורכבת ותלויה באחרים"],"e":"מטרות קשות עובדות כשהן מתקבלות. מורכבות ותלות דווקא מחלישות את ההשפעה."}]},
"m14":{"t":"t4","v":[{"q":"באיזה מצב המחויבות למטרה צפויה להיות הגבוהה ביותר?","a":"העובד הציב את המטרה בעצמו והציג אותה לצוות","w":["המנהל הציב את המטרה ושמר אותה בסוד","המטרה הוצבה בעיקר לעובדים עם מיקוד שליטה חיצוני","המטרה הוצבה ולא נבדקה עד סוף השנה"],"e":"מחויבות גבוהה כשהמטרה פומבית, כשהעובד הציב אותה בעצמו וכשיש לו מיקוד שליטה פנימי. מטרה שנשמרת בסוד מוחלשת, כי אין לחץ חברתי לעמוד בה."},{"q":"באיזו משימה הצבת מטרות תשפיע הכי פחות?","a":"משימה חדשה ומורכבת שתלויה בצוותים אחרים","w":["הקלדת נתונים פשוטה ומוכרת","מכירות טלפוניות שהעובד מבצע לבד","משימה שגרתית שהעובד מכיר היטב"],"e":"הצבת מטרות משפיעה הכי חזק במשימות פשוטות, מוכרות ועצמאיות. במשימה חדשה ומורכבת שתלויה באחרים, המטרה לבדה משנה פחות, כי ההצלחה לא בשליטת העובד."}]},
"m15":{"t":"t4","v":[{"q":"בחברה, ההנהלה קובעת יעדים לכל עובד ושולחת אותם במייל, עם משוב בסוף השנה. מה חסר כדי שזה יהיה MBO?","a":"השתתפות בקביעת היעדים ומשוב לאורך התקופה","w":["תגמול כספי על כל יעד שהושג","יעדים כלליים במקום יעדים ספציפיים","הצבת יעדים רק לדרג הניהולי הבכיר"],"e":"MBO כולל ספציפיות, השתתפות, תקופה מוגדרת ומשוב. תגמול כספי אינו אחד הרכיבים."},{"q":"איזה מהבאים אינו אחד מארבעת המרכיבים של MBO?","a":"תגמול כספי על כל יעד","w":["יעדים ספציפיים","השתתפות בקבלת ההחלטות","תקופת זמן מוגדרת"],"e":"ארבעת המרכיבים של MBO הם יעדים ספציפיים, השתתפות בקבלת ההחלטות, זמן מוגדר ומשוב. תגמול כספי על כל יעד לא נכלל בהם."}]},
"m16":{"t":"t4","v":[{"q":"שני עובדים קיבלו פרויקט קשה. אחד מגביר את המאמץ כשנתקל בקושי, והשני מאט. מה מסביר את ההבדל, לפי הפרק?","a":"מסוגלות עצמית","w":["התאמה עצמית","מעורבות בעבודה","צורך בשייכות"],"e":"במצב קשה, מי שמסוגלותו נמוכה מוריד מאמץ, ומי שגבוהה מתאמץ יותר."},{"q":"מה ההבדל בין מסוגלות עצמית להתאמה עצמית?","a":"מסוגלות: האם אני יכול. התאמה: האם הסיבות מתאימות לערכים שלי","w":["מסוגלות: האם המטרה ספציפית. התאמה: האם היא קשה מספיק","מסוגלות: האם התגמול הוגן. התאמה: האם הוא מספק אותי","אין הבדל, אלה שני שמות לאותו מושג"],"e":"מסוגלות עצמית היא האמונה ״אני יכול להצליח בזה״. התאמה עצמית היא השאלה אם הסיבות שלי לרדוף אחרי המטרה מתאימות לערכים שלי. מושג אחד עוסק ביכולת והשני במקור המוטיבציה."}]},
"m17":{"t":"t4","v":[{"q":"מנהלת רוצה להעלות את המסוגלות של עובד חדש בכמה שיותר. לפי בנדורה, מה הכי יעיל?","a":"לתת לו משימה שהוא יכול להצליח בה, ולהעלות בהדרגה את הקושי","w":["להראות לו סרטון של עובד מצטיין שעושה את המשימה","לומר לו שוב ושוב שהוא מוכשר ושהוא יצליח","לקיים לו הרצאה מעוררת השראה לפני כל משימה"],"e":"שליטה מתוך ביצוע היא המקור החשוב ביותר. השאר הם למידה מצפייה, שכנוע ועוררות."},{"q":"עובדת שומעת ממנטורית ״יש לך את כל מה שצריך כדי להצליח בתפקיד״. איזה מקור של מסוגלות עצמית זה?","a":"שכנוע מילולי","w":["למידה מצפייה","שליטה מתוך ביצוע","עוררות"],"e":"מישהו אחר אומר לה שיש לה את הכישורים, וזה שכנוע מילולי. למידה מצפייה הייתה צפייה במישהו דומה לה שמצליח."}]},
"m18":{"t":"t4","v":[{"q":"מנהל מציב לעובדת יעד קשה. לפי הפרק, מה עוד קורה מעבר להגדרת היעד?","a":"היא מבינה שהמנהל מאמין בה, והמסוגלות שלה עולה","w":["היא מרגישה שהיחס לא הוגן, ומפחיתה מאמץ","המוטיבציה הפנימית שלה יורדת, כי היעד חיצוני","היא נוטה להסתפק בפתרון הראשון"],"e":"יעד קשה מהמנהל משדר שהוא מאמין ביכולת שלה, ולכן גם מעלה את המסוגלות שלה. המוטיבציה הפנימית לא בהכרח יורדת, כי היעד נתפס כאמון ולא כשליטה."},{"q":"מה הקשר בין הצבת מטרות למסוגלות עצמית לפי הפרק?","a":"הן משלימות: מטרה קשה משדרת אמון ומעלה מסוגלות","w":["הן סותרות: מטרה קשה מורידה מסוגלות","אין ביניהן קשר, הן שייכות לתחומים שונים","מסוגלות קודמת, ולכן מטרות לא משפיעות עליה"],"e":"שתי התיאוריות משלימות: מטרה קשה משדרת אמון, וזה מעלה את המסוגלות העצמית. הן לא סותרות, כי מטרה קשה לא מורידה את האמונה ביכולת אלא מחזקת אותה."}]},
"m19":{"t":"t5","v":[{"q":"מנהל משבח עובד כל פעם שהוא מגיש דוח בזמן, והעובד מגיש בזמן יותר ויותר. איך תורת החיזוק מסבירה זאת?","a":"התוצאה החיובית הגדילה את הסיכוי שההתנהגות תחזור","w":["העובד הציב לעצמו מטרה ספציפית וקשה","העובד השווה את עצמו לעמיתים והרגיש הוגנות","העובד האמין שהמאמץ יוביל לתגמול"],"e":"תורת החיזוק מסבירה התנהגות לפי התוצאות שלה: השבח הגדיל את הסיכוי שהגשה בזמן תחזור. היא לא עוסקת במטרות או באמונות בראש של העובד. אלה הסברים של תיאוריות קוגניטיביות."},{"q":"מה מבדיל את תורת החיזוק מתורת הצבת המטרות?","a":"חיזוק מתעלם ממה שבתוך האדם, הצבת מטרות היא קוגניטיבית","w":["חיזוק עוסק בכוונות, ומטרות בתוצאות","חיזוק עובד רק עם כסף, ומטרות רק עם הכרה","אין הבדל, שתיהן מסבירות התנהגות לפי תוצאות"],"e":"תורת החיזוק מתעלמת ממה שקורה בתוך האדם ומתמקדת בהתנהגות ובתוצאות, והצבת מטרות היא תיאוריה קוגניטיבית. לכן חיזוק לא עוסק בכוונות, והמסיח הראשון הופך את השתיים."}]},
"m20":{"t":"t5","v":[{"q":"עובד חדש רואה שעמית שהציע רעיון קיבל הכרה, ומתחיל להציע רעיונות בעצמו. איזו גישה מסבירה זאת?","a":"למידה חברתית","w":["ביהביוריזם","תורת ההוגנות","תורת ההערכה הקוגניטיבית"],"e":"הוא לא קיבל חיזוק בעצמו, אלא למד מצפייה במה שקרה לעמית, וזו למידה חברתית. ביהביוריזם היה דורש שהוא עצמו יקבל את החיזוק."},{"q":"מה מוסיפה הלמידה החברתית על הביהביוריזם?","a":"שלומדים גם מצפייה באחרים, ולא רק מניסיון אישי","w":["שהתנהגות נקבעת רק לפי תוצאות מיידיות","שתגמול חיצוני פוגע במוטיבציה הפנימית","שאנשים משווים תשומות ותוצאות"],"e":"בביהביוריזם לומדים רק מתוצאות ישירות. בלמידה חברתית גם ממודלים."}]},
"m21":{"t":"t5","v":[{"q":"נועה עובדת שעות נוספות ומקבלת אותו שכר כמו עמית שעובד פחות. לפי תורת ההוגנות, מה היא משווה?","a":"את יחס התשומות־תוצאות שלה ליחס שלו","w":["את השכר שלה לשכר שלו בלבד","את המאמץ שלה למאמץ שלו בלבד","את השכר שלה לשכר הממוצע בענף"],"e":"לפי תורת ההוגנות, משווים יחס: מה אני נותן (שעות, מאמץ) לעומת מה אני מקבל, מול אותו יחס אצל האחר. השוואה של שכר בלבד מפספסת את התשומות, וזה כל העניין כאן."},{"q":"עובד משווה את התנאים בתפקיד הנוכחי שלו לתנאים שהיו לו במקום העבודה הקודם. איזה סוג השוואה זה?","a":"עצמי־בחוץ","w":["עצמי־בפנים","אחר־בחוץ","אחר־בפנים"],"e":"הוא משווה לעצמו (״עצמי״) בארגון אחר שעבד בו קודם (״בחוץ״). אילו השווה לעמית מחברה אחרת, זה היה ״אחר־בחוץ״."}]},
"m22":{"t":"t5","v":[{"q":"דנה מרגישה שמשלמים לה פחות מעמית, ומשכנעת את עצמה ש״הוא בטח עובד יותר קשה ממה שנראה״. איזו תגובה זו?","a":"עיוות התפיסה של האחר","w":["שינוי התשומות","עיוות התפיסה של עצמי","בחירת מישהו אחר להשוואה"],"e":"היא לא משנה את המאמץ שלה, אלא את האופן שבו היא רואה את העמית (״הוא עובד יותר קשה״). זה עיוות התפיסה של האחר. אילו שכנעה את עצמה שהיא עובדת פחות ממה שחשבה, זה היה עיוות התפיסה של עצמי."},{"q":"איזו מהבאות אינה תגובה לחוסר הוגנות לפי תורת ההוגנות?","a":"לבקש ממישהו אחר להחליט במקומי","w":["לבחור מישהו אחר להשוואה","לעוות את התפיסה של עצמי","לעזוב את הארגון לגמרי"],"e":"שש התגובות: לשנות תשומות, לשנות תוצאות, לעוות תפיסת עצמי או אחר, להחליף השוואה, לעזוב."}]},

  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mgmt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
