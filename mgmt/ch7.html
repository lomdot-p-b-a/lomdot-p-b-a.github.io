<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: מוטיבציה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

@keyframes fill{from{transform:scaleX(0)}to{transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"target",title:"מהי מוטיבציה",blocks:[
  {h:"שלושת המרכיבים",html:`${def("על מה הנושא",`למה עובד אחד מתאמץ ואחר לא? מוטיבציה היא מה ש"מניע" אותנו לפעול. לפני שנכיר את התיאוריות, נבין ממה היא בנויה.<br><b>מה נלמד כאן:</b> עוצמה · כיוון · התמדה`)}${def("מושג מפתח",`<mark>מוטיבציה</mark> ${E("Motivation")}: התהליכים שמסבירים את <b>העוצמה</b>, <b>הכיוון</b> וה<b>התמדה</b> של המאמץ של אדם להשגת מטרה.`)}${tiles([["chart","עוצמה (Intensity)","כמה קשה האדם מתאמץ. זה מה שרוב האנשים חושבים עליו כשהם אומרים מוטיבציה","החלק הראשון של המוטיבציה: כמה מאמץ משקיעים. אבל עוצמה לבד לא מספיקה.","מיכל עובדת שעות נוספות כל ערב."],["target","כיוון (Direction)","לאן המאמץ מופנה. מאמץ גבוה לא יעזור אם הוא לא מכוון למטרות הארגון","המאמץ צריך להיות מכוון למה שחשוב לארגון. אחרת הוא לא מקדם כלום.","אם מיכל משקיעה את השעות הנוספות בעיצוב מצגות, כשמה שנדרש ממנה הוא מכירות, המאמץ לא מועיל."],["clock","התמדה (Persistence)","כמה זמן האדם מצליח להחזיק את המאמץ, עד שהוא משיג את המטרה","החלק השלישי: להמשיך להתאמץ לאורך זמן, עד שמגיעים למטרה.","מיכל ממשיכה לעבוד על הפרויקט במשך חודשים, גם כשהתוצאות לא מגיעות מהר."]])}${rem("מוטיבציה היא לא תכונה קבועה: אותו אדם יכול להיות עם מוטיבציה גבוהה במשימה אחת ונמוכה במשימה אחרת.")}${ex(`סטודנט לפני מבחן: <b>עוצמה</b> – כמה שעות הוא לומד. <b>כיוון</b> – האם הוא לומד את החומר הנכון או גולל ברשתות "בשביל הלימודים". <b>התמדה</b> – האם הוא ממשיך גם אחרי שבוע, או נשבר אחרי יומיים.`)}`,q:"m1"}
 ]},
 {id:"t2",icon:"pyramid",title:"התיאוריות המוקדמות",blocks:[
  {h:"פירמידת הצרכים של מאסלו",html:`${def("על מה הנושא",`התיאוריות הראשונות על מוטיבציה נוצרו בשנות ה-50. הן מוכרות מאוד למנהלים, אבל לא כולן קיבלו תמיכה מחקרית. כדאי להכיר אותן כי הן הבסיס לתיאוריות החדשות.<br><b>מה נלמד כאן:</b> מאסלו: פירמידת הצרכים · תיאוריה X ותיאוריה Y · הרצברג: שני גורמים · מקללנד: שלושה צרכים`)}<p><b>אברהם מאסלו</b> טען שבכל אדם יש היררכיה של חמישה צרכים. צורך שסופק במידה רבה <mark>כבר לא מניע</mark>, ואז הצורך הבא בתור הופך לדומיננטי.</p>${fig("maslow")}${def("שתי קבוצות",`<mark>צרכים נמוכים</mark> (פיזיולוגיים וביטחון) מסופקים בעיקר <b>מבחוץ</b>, למשל בשכר וקביעות. <mark>צרכים גבוהים</mark> (חברתיים, הערכה ומימוש עצמי) מסופקים <b>מבפנים</b>.`)}${rem("התיאוריה מאוד מוכרת ואינטואיטיבית, אבל המחקר כמעט לא תומך בה.")}${ex(`עובד שלא בטוח שיקבל משכורת בסוף החודש (צורך בביטחון) לא יתעניין בפרויקט "מאתגר ומגשים" (מימוש עצמי). קודם צריך לסגור את הצרכים הנמוכים.`)}`,q:"m2"},
  {h:"תיאוריה X ותיאוריה Y",html:`${who("מ","דאגלס מקגרגור","","הציע שתי השקפות על בני אדם, שמעצבות את ההתנהגות של מנהלים כלפי העובדים.")}${tiles([["lock","תיאוריה X (שלילית)","עובדים לא אוהבים לעבוד, מתחמקים מאחריות, וצריך לכוון ואפילו לכפות עליהם","תיאוריה X: הנחה שלילית על העובדים. מנהל שמאמין בה ישגיח ויפקח מקרוב.","מנהל שבטוח שבלי מצלמות העובדים לא יעבדו, ובודק כל רגע מה הם עושים."],["sprout","תיאוריה Y (חיובית)","עבודה טבעית כמו מנוחה או משחק. האדם הממוצע יכול לקבל ואף לחפש אחריות","תיאוריה Y: הנחה חיובית על העובדים. מנהל שמאמין בה ייתן להם אחריות וחופש.","רונית נותנת לצוות לבחור איך לבצע את המשימה, ובודקת רק את התוצאה."]])}<p>מקגרגור האמין ב-Y, והמליץ על השתתפות בקבלת החלטות, עבודה מאתגרת ויחסים טובים בקבוצה. <b>אבל:</b> אין ראיות מחקריות שאף אחת מההנחות נכונה.</p>`,q:"m4"},
  {h:"תיאוריית שני הגורמים של הרצברג",html:`<p><b>פרדריק הרצברג</b> שאל אנשים מתי הרגישו טוב או רע במיוחד בעבודה. התשובות היו שונות לגמרי:</p>${tiles([["bulb","גורמים מניעים (פנימיים)","קידום, הכרה, אחריות, הישגים. אלה יוצרים שביעות רצון","לפי הרצברג, אלה הדברים שבאמת גורמים לאנשים לרצות לעבוד. כולם קשורים לעבודה עצמה.","מיכל מקבלת אחריות על פרויקט חשוב, ומרגישה מחוברת לעבודה."],["hand","גורמי היגיינה (חיצוניים)","שכר, פיקוח, מדיניות החברה, תנאי עבודה, ביטחון תעסוקתי. הם רק מונעים חוסר שביעות רצון","דברים שקשורים לסביבת העבודה. כשהם לא בסדר יש תסכול, אבל כשהם בסדר זה עדיין לא יוצר התלהבות.","העלאה בשכר הפסיקה את התלונות של מיכל, אבל לא גרמה לה לאהוב את העבודה יותר."]])}${fig("herzberg")}${rem("מנהל שמתקן רק את גורמי ההיגיינה \"מרגיע\" את העובדים, אבל לא מניע אותם.")}`,q:"m5"},
  {h:"תורת הצרכים של מקללנד",html:`<p><b>דייוויד מקללנד</b> הציע שלושה צרכים שמסבירים מוטיבציה:</p>${tiles([["chart","צורך בהישגים (nAch)","הדחף להצטיין ולהצליח מול סטנדרט","אנשים עם צורך גבוה בהישגים רוצים להצטיין ולעמוד בסטנדרט גבוה. הם אוהבים משימות קשות אבל אפשריות, עם משוב ברור.","מיכל מבקשת יעד מכירות גבוה, ובודקת כל שבוע איפה היא עומדת."],["pyramid","צורך בכוח (nPow)","הצורך לגרום לאחרים להתנהג כפי שלא היו מתנהגים אחרת","הרצון להשפיע ולשלוט: לגרום לאחרים לעשות דברים שלא היו עושים בלעדיך.","מוכר ותיק נהנה לקבוע לאחרים את סידור המשמרות, ומבקש להיות אחראי המשמרת."],["people","צורך בשייכות (nAff)","הרצון ביחסים חמים וקרובים עם אחרים","הרצון ביחסים חמים וקרובים, להיות אהוב ומקובל. אנשים כאלה מעדיפים שיתוף פעולה על פני תחרות.","מוכרת אחרת מעדיפה לעבוד במשמרת עם החברות שלה, גם אם זה אומר פחות בונוסים."]])}${def("שימו לב",`בעלי צורך גבוה בהישגים מעדיפים משימות עם <mark>סיכוי של 50% להצליח</mark>: לא קלות מדי (אין אתגר) ולא תלויות במזל. הם מצליחים בעבודה עם אחריות אישית, משוב וסיכון בינוני.`)}${ex(`איש מכירות עם צורך גבוה בהישגים יעדיף יעד של 30 עסקאות, שאפשר לעמוד בו אם מתאמצים, על פני יעד של 5 (משעמם) או 100 (בלתי אפשרי).`)}`,q:"m8"}
 ]},
 {id:"t3",icon:"sprout",title:"מוטיבציה פנימית ומעורבות",blocks:[
  {h:"תורת ההכוונה העצמית",html:`${def("על מה הנושא",`יש דברים שאנחנו עושים כי "חייבים" (בשביל כסף), ויש דברים שאנחנו עושים כי אנחנו נהנים. הנושא מראה מה קורה כשמערבבים בין השניים, ומהי מעורבות אמיתית בעבודה.<br><b>מה נלמד כאן:</b> תורת ההכוונה העצמית · התאמה עצמית · מעורבות בעבודה`)}${ex("מרשה התנדבה בעמותה לאימוץ חיות ונהנתה מכל רגע. אחרי שהתחילו לשלם לה על אותה עבודה בדיוק, היא נהנית הרבה פחות.")}${def("מושג מפתח",`<mark>תורת ההכוונה העצמית</mark> ${E("Self-determination theory")}: אנשים רוצים להרגיש שליטה במעשים שלהם. כל דבר שהופך משימה מהנה ל"חובה" פוגע במוטיבציה.`)}<p>חלק מרכזי בה הוא <mark>תורת ההערכה הקוגניטיבית</mark> ${E("Cognitive evaluation theory")}: תגמול חיצוני על משימה שהייתה מהנה בפני עצמה עלול <b>להוריד</b> את המוטיבציה, אם התגמול נתפס כשולט.</p>${def("מושג נלווה",`<mark>התאמה עצמית</mark> ${E("Self-concordance")}: עד כמה הסיבות לרדוף אחרי מטרה מתאימות לתחומי העניין ולערכים של האדם. מי שרודף מטרה מסיבות פנימיות, מצליח יותר ומאושר יותר, גם אם לא השיג אותה.`)}`,q:"m10"},
  {h:"מעורבות בעבודה",html:`${def("מושג מפתח",`<mark>מעורבות בעבודה</mark> ${E("Job engagement")}: השקעה של אנרגיה <b>פיזית, קוגניטיבית ורגשית</b> של העובד בביצוע העבודה.`)}${ex("אחות שכשהיא בעבודה, כל השאר נעלם: הרגשות, המחשבות וההתנהגות שלה מופנים לטיפול במטופלים, והיא אפילו לא שמה לב כמה זמן עבר.")}${rem("מעורבות היא יותר מלאהוב את העבודה או למצוא אותה מעניינת. זו מחויבות עמוקה שמניעה ביצועים.")}`,q:"m12"}
 ]},
 {id:"t4",icon:"target",title:"הצבת מטרות ומסוגלות עצמית",blocks:[
  {h:"תורת הצבת המטרות",html:`${def("על מה הנושא",`"תעשה כמיטב יכולתך" או "תמכור 50 יחידות עד סוף החודש"? הנושא מסביר למה מטרה מוגדרת עובדת טוב יותר, ואיך האמונה ביכולת שלנו משפיעה על המאמץ.<br><b>מה נלמד כאן:</b> תורת הצבת המטרות · ניהול לפי יעדים (MBO) · מסוגלות עצמית`)}${who("ל","אדווין לוק","שנות ה-60","הכוונה לפעול להשגת מטרה היא מקור מרכזי למוטיבציה בעבודה.")}${tiles([["target","מטרות ספציפיות","משיגות יותר מ\"תעשה כמיטב יכולתך\"","מטרה ברורה ומדויקת עוזרת לדעת בדיוק מה צריך להשיג, ולכן היא מובילה לביצועים טובים יותר.","״לסגור 15 עסקאות החודש״ עובד טוב יותר מאשר ״תשתדלי למכור כמה שיותר״."],["chart","מטרות קשות","כשהן מתקבלות, מביאות לביצועים גבוהים יותר ממטרות קלות","מטרה מאתגרת שהעובד מסכים לה גורמת לו להתאמץ יותר. התנאי הוא שהוא באמת מקבל אותה.","מיכל מסכימה ליעד גבוה מהרגיל, ומתאמצת יותר כדי לעמוד בו."],["cycle","משוב","מוביל לביצועים טובים יותר מאשר בלי משוב","כשיודעים איך מתקדמים לקראת המטרה, אפשר לתקן ולהתאמץ בכיוון הנכון. לכן מטרה עם משוב מביאה לביצועים טובים יותר ממטרה בלי משוב.","כל שבוע רונית מראה למיכל כמה ספות מכרה מתוך היעד, ומיכל יודעת אם להגביר קצב."]])}<p><b>שלושה גורמים ממתנים:</b> <mark>מחויבות למטרה</mark> (גבוהה יותר כשהמטרה פומבית, כשלאדם יש מיקוד שליטה פנימי וכשהוא הציב אותה בעצמו), <mark>מאפייני המשימה</mark> (ההשפעה חזקה יותר במשימות פשוטות, מוכרות ועצמאיות), ו<mark>תרבות</mark>.</p>`,q:"m13"},
  {h:"ניהול לפי יעדים (MBO)",html:`${def("מושג מפתח",`<mark>ניהול לפי יעדים</mark> ${E("Management by objectives")}: תוכנית של מטרות ספציפיות, שנקבעות <b>בשיתוף</b>, לתקופת זמן מוגדרת, עם משוב על ההתקדמות.`)}<p>יעדי הארגון מתורגמים ליעדים לכל רמה: חטיבה, מחלקה, עובד. מכיוון שמנהלים בדרגים נמוכים משתתפים בקביעת היעדים, השיטה עובדת גם מלמטה למעלה.</p>${tiles([["target","ספציפיות היעדים",""],["people","השתתפות בקבלת החלטות",""],["clock","תקופת זמן מוגדרת","","בשיטת ניהול לפי יעדים, לכל יעד יש מועד ברור שעד אליו צריך להשיג אותו. בלי מועד, היעד נשאר ״מתישהו״.","היעד של מיכל הוא ״50 ספות עד סוף הרבעון״, ולא סתם ״למכור יותר ספות״."],["cycle","משוב על הביצועים",""]])}${ex(`המנהלת והעובד יושבים יחד בתחילת הרבעון וקובעים: "להעלות את שביעות רצון הלקוחות מ-70% ל-80% עד מרץ". כל חודש הם בודקים יחד איפה הוא עומד.`)}`,q:"m15"},
  {h:"מסוגלות עצמית",html:`${def("מושג מפתח",`<mark>מסוגלות עצמית</mark> ${E("Self-efficacy")}: האמונה של אדם שהוא <b>מסוגל</b> לבצע משימה. במצב קשה, מי שמסוגלותו נמוכה מוריד את המאמץ, ומי שמסוגלותו גבוהה מתאמץ יותר.`)}<p><b>אלברט בנדורה</b>: ארבע דרכים להעלות מסוגלות עצמית:</p>${tiles([["chart","שליטה מתוך ביצוע","ניסיון מוצלח במשימה. <b>המקור החשוב ביותר</b>","המקור החזק ביותר לאמונה ״אני מסוגל״ הוא הצלחה שכבר הייתה לי במשימה דומה.","אחרי שמיכל סגרה בעצמה עסקה גדולה ראשונה, היא בטוחה שתצליח לסגור עוד אחת."],["people","למידה מצפייה","לראות מישהו אחר מצליח, במיוחד מישהו דומה לנו","כשרואים מישהו אחר מצליח, במיוחד מישהו שדומה לנו, מתחילים להאמין שגם אנחנו נוכל.","מיכל רואה מוכרת חדשה כמוה סוגרת עסקה עם לקוח עסקי, ומרגישה שגם היא יכולה."],["hand","שכנוע מילולי","מישהו משכנע אותנו שיש לנו את הכישורים","מישהו שאנחנו סומכים עליו אומר לנו שיש לנו את הכישורים, וזה מגביר את הביטחון.","רונית אומרת למיכל: ״את מצוינת עם לקוחות קשים, את תסתדרי עם הלקוח הזה״."],["bulb","עוררות","מצב אנרגטי ש\"מדליק\" אותנו לפני ביצוע","מצב של אנרגיה ו״דריכות״ לפני משימה גורם לנו להרגיש מוכנים ומסוגלים יותר.","לפני הצגה מול לקוח גדול, מיכל מרגישה התרגשות שנותנת לה אנרגיה להופיע."]])}${rem("הצבת מטרות ומסוגלות עצמית משלימות: מנהל שמציב לך מטרה קשה משדר שהוא מאמין בך, וזה מעלה את המסוגלות שלך.")}${ex(`שני סטודנטים נכשלו בבוחן. אחת חושבת "אני מסוגלת, פשוט לא למדתי מספיק" ומגבירה את הלמידה. השני חושב "אני לא בנוי לזה" ומוותר. ההבדל הוא במסוגלות העצמית.`)}`,q:"m17"}
 ]},
 {id:"t5",icon:"scales",title:"חיזוק, הוגנות וציפיות",blocks:[
  {h:"תורת החיזוק",html:`${def("על מה הנושא",`שלוש תיאוריות שמסבירות מוטיבציה דרך מה שקורה <b>אחרי</b> ההתנהגות: מה מקבלים בתמורה, האם זה הוגן בהשוואה לאחרים, והאם המאמץ באמת ישתלם.<br><b>מה נלמד כאן:</b> תורת החיזוק · תורת ההוגנות · צדק ארגוני · תורת הציפיות של ורום`)}${def("מושג מפתח",`<mark>תורת החיזוק</mark> ${E("Reinforcement theory")}: התנהגות היא פונקציה של <b>התוצאות</b> שלה. מה שמגיע מיד אחרי התנהגות ומגדיל את הסיכוי שתחזור, הוא חיזוק.`)}<p>בניגוד להצבת מטרות (גישה קוגניטיבית), תורת החיזוק מתעלמת ממה שקורה בתוך האדם. לכן, במובן הצר, היא אפילו לא תיאוריה של מוטיבציה.</p>${tiles([["cycle","ביהביוריזם","התנהגות באה בעקבות גירויים, באופן כמעט לא מחושב","לפי הגישה הזו, ההתנהגות נקבעת לפי מה שקורה אחריה: חיזוק או עונש. אין צורך להסביר מה האדם חושב או מרגיש.","מיכל מגיעה בזמן כי בכל פעם שהיא מגיעה בזמן היא מקבלת מחמאה."],["people","למידה חברתית","לומדים גם מצפייה באחרים, ולא רק מניסיון ישיר","לומדים לא רק ממה שקורה לנו, אלא גם מצפייה במה שקורה לאחרים.","מיכל רואה שעובד שהגיע באיחור קיבל הערה, ולכן מקפידה להגיע בזמן, אף שהיא עצמה מעולם לא נענשה."]])}${ex(`עובד שמגיע בזמן ומקבל מחמאה מהמנהל, ימשיך להגיע בזמן. המחמאה היא החיזוק.`)}`,q:"m19"},
  {h:"תורת ההוגנות",html:`${def("מושג מפתח",`<mark>תורת ההוגנות</mark> ${E("Equity theory")}: אנשים משווים את היחס בין <b>התשומות</b> שלהם (מאמץ, ניסיון, השכלה) ל<b>תוצאות</b> (שכר, קידום, הכרה) לאותו יחס אצל אחרים, ופועלים לתקן חוסר הוגנות.`)}<p><b>ארבעה סוגי השוואה:</b> עצמי-בפנים (תפקיד אחר שלי בארגון), עצמי-בחוץ (עבודה קודמת שלי), אחר-בפנים (עמית בארגון), אחר-בחוץ (מישהו בארגון אחר).</p><p><b>שש תגובות לחוסר הוגנות:</b> לשנות את התשומות, לשנות את התוצאות, לעוות את התפיסה של עצמי, לעוות את התפיסה של אחרים, לבחור מישהו אחר להשוות אליו, או לעזוב.</p>${rem("תשלום יתר כמעט לא משנה התנהגות: אנשים סובלניים הרבה יותר לחוסר הוגנות לטובתם.")}${ex(`דנה ויוסי עושים אותה עבודה באותה רמה, אבל יוסי מרוויח יותר. דנה תרגיש חוסר הוגנות, ואולי תתאמץ פחות, תבקש העלאה או תחפש עבודה אחרת.`)}`,q:"m21"},
  {h:"צדק ארגוני",html:`<p>הצדק הארגוני מרחיב את תורת ההוגנות לתמונה רחבה יותר:</p>${tiles([["pie","צדק חלוקתי","האם <b>הכמות</b> והחלוקה של התגמולים הוגנות","האם מה שקיבלתי, בהשוואה לאחרים, הוגן: כמה כסף, בונוס או קידום, ואיך זה חולק.","מיכל מגלה שאבי קיבל בונוס גדול יותר על אותן מכירות, ומרגישה שהחלוקה לא הוגנת."],["doc","צדק פרוצדורלי","האם <b>התהליך</b> שבו הוחלט הוגן. כולל שליטה בתהליך (להשמיע את עמדתך) והסברים","האם הדרך שבה הוחלט הייתה הוגנת: האם הסבירו לי, והאם נתנו לי להשמיע את עמדתי. זה חשוב במיוחד כשלא קיבלנו מה שרצינו.","מיכל לא קיבלה בונוס, אבל רונית הסבירה לה בדיוק איך נקבע, ושמעה את מה שהיה לה לומר. מיכל מאוכזבת, אבל מרגישה שהתהליך היה הוגן."],["hand","צדק בין-אישי (אינטראקטיבי)","האם מתייחסים אליי <b>בכבוד, באכפתיות ובהתחשבות</b>"]])}${rem("צדק פרוצדורלי הופך חשוב במיוחד כשהצדק החלוקתי חסר: כשלא קיבלנו מה שרצינו, אנחנו מתמקדים בשאלה למה.")}`,q:"m24"},
  {h:"תורת הציפיות של ורום",html:`<p>אחת התיאוריות המקובלות ביותר: עובד יתאמץ אם הוא מאמין שהמאמץ יוביל להערכה טובה, שההערכה תוביל לתגמול, ושהתגמול יספק את המטרות האישיות שלו.</p>${fig("expect")}${ex("סטודנט שבטוח שגם אם ילמד קשה לא יקבל ציון גבוה (קשר 1 חלש), או שהציון לא ישנה לו כלום (קשר 3 חלש), לא יתאמץ.")}`,q:"m26"}
 ]},
 {id:"t6",icon:"check",title:"תרגול בסגנון המבחן",blocks:[
  {h:"מושגים מהמבחן לדוגמה",html:`<p>במבחן לדוגמה יש שאלת יישום על <b>הרצברג</b>: צריך למיין כל פרט בתרחיש לשתי קבוצות.</p>${tiles([["bulb","מניעים (אינטרינזיים)","הכרה, אחריות, קידום, הישגים, העבודה עצמה","אותם גורמים כמו אצל הרצברג: דברים שקשורים לעבודה עצמה ולהתפתחות, ויוצרים מוטיבציה.","מיכל מתלהבת כשהיא מקבלת הכרה על הישג."],["scales","היגיינה (אקסטרינזיים)","שכר, קביעות, תנאים פיזיים, יחסים עם עמיתים, מדיניות החברה","גורמים בסביבת העבודה. הם מונעים תסכול, אבל לא מוסיפים מוטיבציה.","משרד נוח ושכר הוגן מונעים תלונות, אבל לא גורמים לעובדים להתאמץ יותר."]])}<p>השאלה הראשונה בכל זוג לקוחה מקובץ <b>השאלות לדוגמה למבחן</b> של הקורס (עם התשובה לפי המפתח), והשנייה היא שאלה מקבילה בסגנון דומה.</p>`,q:"em1"}
 ]}
];
const Q={"m1":{"t":"t1","v":[{"q":"מתכנת עובד 12 שעות ביום על פרויקט, אבל אחרי שבועיים נשבר ומפסיק. איזה מרכיב של מוטיבציה חלש אצלו?","a":"התמדה","w":["עוצמה","כיוון","עוצמה וכיוון יחד"],"e":"הוא התאמץ חזק (עוצמה) ובכיוון הנכון, אבל לא החזיק לאורך זמן."},{"q":"עובדת משקיעה שעות בעיצוב מצגות מושקעות, אבל הלקוח ביקש רק נתונים. איזה מרכיב של מוטיבציה בעייתי?","a":"כיוון","w":["עוצמה","התמדה","עוצמה והתמדה יחד"],"e":"היא משקיעה הרבה (עוצמה) ולאורך זמן (התמדה), אבל לא לכיוון שהלקוח ביקש. לכן הבעיה בכיוון. אין כאן בעיית עוצמה, כי היא דווקא מתאמצת מאוד."}]},
"m1b":{"t":"t1","v":[{"q":"מנהל אומר: ״לדני אין מוטיבציה, זה פשוט האופי שלו.״ מה הבעיה בטענה, לפי הפרק?","a":"מוטיבציה משתנה ממצב למצב, ואינה תכונה קבועה","w":["מוטיבציה נקבעת רק לפי השכר ולא לפי האופי","מוטיבציה נמדדת רק בעוצמה, לא בהתנהגות","מוטיבציה קבועה, אבל אפשר למדוד אותה רק במבחן"],"e":"אותו אדם יכול להיות עם מוטיבציה גבוהה במשימה אחת ונמוכה באחרת."},{"q":"מה רוב האנשים מתכוונים אליו כשהם אומרים ״מוטיבציה״, ולמה זה לא מספיק?","a":"לעוצמה, אבל בלי כיוון והתמדה זה לא מספיק","w":["להתמדה, אבל בלי עוצמה אין תוצאות","לכיוון, אבל בלי שכר אין מאמץ","לעוצמה, וזה מספיק כי היא כוללת את השאר"],"e":"כשאומרים ״מוטיבציה״ מתכוונים בדרך כלל לעוצמה, כמה קשה אדם מתאמץ. אבל לפי הפרק צריך גם כיוון והתמדה, ולכן עוצמה לבדה לא מספיקה ולא ״כוללת את השאר״."}]},
"m1c":{"t":"t1","v":[{"q":"סטודנטית לומדת 6 שעות ביום כבר חודש, אבל רק את הפרקים שהיא אוהבת, ולא את מה שיופיע במבחן. מה נכון?","a":"עוצמה והתמדה גבוהות, כיוון בעייתי","w":["עוצמה נמוכה, כיוון והתמדה גבוהים","כל שלושת המרכיבים גבוהים","התמדה נמוכה, עוצמה וכיוון גבוהים"],"e":"שש שעות ביום (עוצמה) במשך חודש (התמדה) מראות מאמץ גבוה. הבעיה היא שהמאמץ לא מכוון למה שיופיע במבחן, כלומר הכיוון בעייתי."},{"q":"מה ההגדרה של מוטיבציה לפי הפרק?","a":"התהליכים שמסבירים את העוצמה, הכיוון וההתמדה של מאמץ להשגת מטרה","w":["תכונת אישיות יציבה שקובעת כמה אדם מתאמץ בכל משימה בעבודה","הרצון להרוויח יותר כסף ולהתקדם בארגון לאורך השנים","מצב רגשי חיובי שמופיע כשהעבודה עצמה מעניינת ומהנה"],"e":"לפי הפרק, מוטיבציה היא תהליך שמסביר את העוצמה, הכיוון וההתמדה של המאמץ להשגת מטרה. היא לא תכונת אישיות קבועה, ולכן אותו אדם יכול להיות עם מוטיבציה גבוהה במשימה אחת ונמוכה באחרת."}]},
"m1d":{"t":"t1","v":[{"q":"מנהלת רוצה לשפר את ״הכיוון״ של המוטיבציה בצוות. מה הצעד המתאים ביותר?","a":"להבהיר אילו משימות תורמות למטרות הארגון","w":["להגדיל את הבונוס על שעות נוספות","לעודד את העובדים להמשיך גם כשקשה","להאריך את שעות העבודה של הצוות"],"e":"כיוון הוא לאן מופנה המאמץ. בונוס ושעות משפיעים בעיקר על עוצמה, ועידוד על התמדה."},{"q":"איזה מצב מתאר בעיה בהתמדה, ולא בעוצמה או בכיוון?","a":"עובד שמתחיל כל פרויקט בהתלהבות ונוטש באמצע","w":["עובד שעובד לאט מאוד על המשימה הנכונה","עובד שעובד קשה על משימות שאף אחד לא ביקש","עובד שבוחר תמיד את המשימות הקלות"],"e":"מי שמתחיל בהתלהבות ונוטש באמצע מתאמץ ומכוון נכון, אבל לא מחזיק עד הסוף, וזו בעיית התמדה. עבודה איטית על המשימה הנכונה היא דווקא בעיית עוצמה."}]},
"m2":{"t":"t2","v":[{"q":"עובד עם משכורת יציבה וקביעות מתחיל לחפש קשרים חברתיים בעבודה. איך מאסלו מסביר את זה?","a":"צורכי הביטחון סופקו, ולכן הצורך החברתי הפך לדומיננטי","w":["צורכי ההערכה סופקו, ולכן הוא חוזר לצרכים הנמוכים","הצורך החברתי תמיד חזק יותר מהצורך בביטחון","הוא מחפש מימוש עצמי, כי הצרכים החברתיים כבר סופקו"],"e":"לפי מאסלו, צורך שסופק במידה רבה מפסיק להניע, והצורך הבא בפירמידה הופך לדומיננטי. אחרי ביטחון (משכורת וקביעות) מגיע הצורך החברתי. הוא עוד לא במימוש עצמי, כי הצורך החברתי עדיין לא סופק."},{"q":"מהו הסדר הנכון בפירמידת מאסלו, מלמטה למעלה?","a":"פיזיולוגיים, ביטחון, חברתיים, הערכה, מימוש עצמי","w":["פיזיולוגיים, חברתיים, ביטחון, הערכה, מימוש עצמי","ביטחון, פיזיולוגיים, חברתיים, מימוש עצמי, הערכה","פיזיולוגיים, ביטחון, הערכה, חברתיים, מימוש עצמי"],"e":"הסדר מלמטה: פיזיולוגיים, ביטחון, חברתיים, הערכה, מימוש עצמי. טעות נפוצה היא להחליף בין ביטחון לחברתיים, אבל ביטחון בא מיד אחרי הצרכים הפיזיולוגיים."}]},
"m3":{"t":"t2","v":[{"q":"מנהל מציע לעובדים פרויקט ״מגשים ומאתגר״, אבל הם לא בטוחים שיקבלו משכורת בזמן. לפי מאסלו, למה ההצעה לא תעבוד?","a":"צורך הביטחון לא סופק, ולכן צורך גבוה לא יניע","w":["מימוש עצמי מסופק מבחוץ, ולא מהעבודה עצמה","צורך הביטחון שייך לצרכים הגבוהים","פרויקט מאתגר מספק בעיקר את הצורך החברתי"],"e":"לפי מאסלו, צורך גבוה כמו מימוש עצמי לא מניע כל עוד צורך נמוך יותר, כאן ביטחון במשכורת, לא סופק. צורך הביטחון שייך לצרכים הנמוכים, לא לגבוהים."},{"q":"מה נכון לגבי מאסלו, לפי הפרק?","a":"מוכרת ואינטואיטיבית, אבל כמעט בלי תמיכה מחקרית","w":["התיאוריה נתמכה במחקרים רבים בארגונים","התיאוריה נדחתה כי היא לא אינטואיטיבית","התיאוריה נתמכת רק לגבי הצרכים הגבוהים"],"e":"התיאוריה של מאסלו מוכרת ונשמעת הגיונית, אבל כמעט אין לה תמיכה מחקרית. היא לא נדחתה בגלל שאינה אינטואיטיבית: היא דווקא אינטואיטיבית מאוד, והבעיה היא בראיות."}]},
"m4":{"t":"t2","v":[{"q":"מנהלת נותנת לעובדים לבחור איך לבצע משימות ומשתפת אותם בהחלטות. לפי מקגרגור, באיזו השקפה היא מחזיקה, ומה המחקר אומר עליה?","a":"תיאוריה Y, ואין ראיות מחקריות שהיא נכונה","w":["תיאוריה X, ואין ראיות מחקריות שהיא נכונה","תיאוריה Y, והמחקר הוכיח שהיא נכונה","תיאוריה X, והמחקר הוכיח שהיא נכונה"],"e":"שיתוף ואחריות מאפיינים את Y. אבל לאף אחת מההשקפות אין תמיכה מחקרית."},{"q":"מה מקגרגור המליץ, בהתאם לתיאוריה Y?","a":"השתתפות בהחלטות, עבודה מאתגרת ויחסים טובים בקבוצה","w":["פיקוח צמוד, כללים ברורים ותגמול לפי תפוקה","העלאת שכר וקביעות כדי לספק את צורכי הביטחון","הפרדה בין מנהלים לעובדים כדי למנוע קונפליקטים"],"e":"מקגרגור האמין ב-Y והמליץ על דרכים שמניחות שעובדים רוצים אחריות."}]},
"m5":{"t":"t2","v":[{"q":"לפי הרצברג, עובד שקיבל שכר הוגן, תנאים טובים וקביעות, אבל עבודה משעממת בלי הכרה, ירגיש:","a":"לא חוסר שביעות רצון, אבל גם לא שביעות רצון","w":["שביעות רצון, כי כל התנאים החיצוניים טובים","חוסר שביעות רצון, כי חסרים לו גורמי היגיינה","שביעות רצון חלקית, כי חצי מהגורמים מסופקים"],"e":"גורמי היגיינה מונעים חוסר שביעות רצון, אבל לא יוצרים שביעות רצון."},{"q":"לפי הרצברג, מה ההפך של ״שביעות רצון״?","a":"״אין שביעות רצון״, ולא ״חוסר שביעות רצון״","w":["״חוסר שביעות רצון״, כמו בגישה המסורתית","״אדישות״, שנוצרת מגורמי היגיינה","״תסכול״, שנוצר מגורמים מניעים"],"e":"הרצברג טען שיש שני רצפים נפרדים. ההפך של שביעות רצון הוא ״אין שביעות רצון״, וההפך של חוסר שביעות רצון הוא ״אין חוסר שביעות רצון״. ״חוסר שביעות רצון״ כהפך הוא הגישה המסורתית שהוא דחה."}]},
"m6":{"t":"t2","v":[{"q":"איזה מהבאים הוא גורם מניע לפי הרצברג, ולא גורם היגיינה?","a":"אחריות על פרויקט","w":["יחסים טובים עם עמיתים","מדיניות החברה","איכות הפיקוח"],"e":"אחריות היא גורם פנימי שנוגע לעבודה עצמה, ולכן היא גורם מניע. יחסים עם עמיתים נשמעים פנימיים, אבל הם חלק מהסביבה, ולכן גורם היגיינה."},{"q":"מנהלת רוצה ליצור מוטיבציה אמיתית בצוות לפי הרצברג. מה כדאי לה לשנות?","a":"להעשיר את התפקיד באחריות, הכרה והזדמנות להישגים","w":["לשפר את תנאי המשרד ולהעלות את השכר לכולם","לשפר את היחסים בצוות ולהקל את הפיקוח עליהם","להבטיח לכולם קביעות ולנסח מדיניות ברורה"],"e":"לפי הרצברג, רק גורמים מניעים כמו אחריות, הכרה והישגים יוצרים שביעות רצון. שכר ותנאים הם גורמי היגיינה: הם מונעים חוסר שביעות רצון, אבל לא יוצרים מוטיבציה."}]},
"m7":{"t":"t2","v":[{"q":"מה הבעיה בשיטה שבה הרצברג אסף את הנתונים, לפי הביקורת?","a":"דיווח עצמי: הצלחה נזקפת לעצמי, כישלון לסביבה","w":["הוא חקר רק מנהלים בכירים, ולכן אי אפשר להכליל","הוא מדד רק שכר, ולא שאל על תחושות בעבודה","הוא השתמש בניסוי מעבדה ולא בשאלות על העבודה"],"e":"זו בעצם ההטיה לטובת העצמי: הגורמים הטובים ״שלי״, והרעים ״של הארגון״."},{"q":"איזו הטיה מפרק התפיסה מסבירה את הביקורת על הרצברג?","a":"הטיה לטובת העצמי","w":["אפקט ההילה","הטיית עיגון","אפקט הניגוד"],"e":"אנשים ייחסו הצלחה לעצמם (גורמים פנימיים) וכישלון לסביבה (גורמים חיצוניים)."}]},
"m8":{"t":"t2","v":[{"q":"איש מכירות עם צורך גבוה בהישגים צריך לבחור יעד חודשי. מה הוא כנראה יעדיף?","a":"יעד שאפשר להשיג רק עם מאמץ אמיתי","w":["יעד קל שבטוח יעמוד בו","יעד גבוה מאוד, שתלוי בעיקר במזל","יעד שקובע המנהל, בלי משוב"],"e":"בעלי צורך גבוה בהישגים (nAch) מעדיפים אתגר בינוני, בסביבות 50% הצלחה, שתלוי במאמץ שלהם. יעד קל לא מאתגר, ויעד גבוה מאוד תלוי במזל ולא בהם."},{"q":"מנהלת נהנית לשכנע אחרים לאמץ את הרעיונות שלה ולהשפיע על החלטות. איזה צורך דומיננטי אצלה לפי מקללנד?","a":"צורך בכוח (nPow)","w":["צורך בהישגים (nAch)","צורך בשייכות (nAff)","צורך במימוש עצמי"],"e":"הצורך לגרום לאחרים להתנהג כפי שלא היו מתנהגים אחרת הוא nPow. מימוש עצמי שייך למאסלו."}]},
"m9":{"t":"t2","v":[{"q":"באיזה תפקיד אדם עם צורך גבוה בהישגים יצליח במיוחד?","a":"ניהול עסק עצמאי, עם אחריות אישית ומשוב מהיר","w":["תפקיד שבו כל ההחלטות מתקבלות בוועדה","תפקיד בטוח ושגרתי, בלי סיכון","תפקיד שבו ההצלחה תלויה בעיקר במזל"],"e":"בעלי nAch מצליחים כשיש אחריות אישית, משוב מהיר וסיכון בינוני, כמו בעסק עצמאי. בתפקיד שבו כל ההחלטות בוועדה אין להם אחריות אישית על התוצאה."},{"q":"עובד מעדיף לעבוד בצוות מגובש וחם, גם על חשבון קידום. איזה צורך דומיננטי אצלו?","a":"צורך בשייכות (nAff)","w":["צורך בכוח (nPow)","צורך בהישגים (nAch)","צורך בביטחון"],"e":"הרצון ביחסים חמים וקרובים הוא nAff. צורך בביטחון שייך למאסלו."}]},
"m10":{"t":"t3","v":[{"q":"ילדה שאהבה לקרוא מתחילה לקבל כסף על כל ספר, ואחרי חודש קוראת פחות. מה מסביר זאת?","a":"התגמול נתפס כשולט, והפך את הקריאה ל״חובה״","w":["הסכום לא היה גבוה מספיק כדי להניע אותה","הצורך הפיזיולוגי שלה כבר סופק, ולכן הוא לא מניע","החיזוק ניתן מאוחר מדי אחרי הקריאה"],"e":"תורת ההערכה הקוגניטיבית: תגמול חיצוני על משימה מהנה עלול להוריד מוטיבציה."},{"q":"באיזה מצב תגמול חיצוני צפוי לפגוע הכי הרבה במוטיבציה, לפי תורת ההערכה הקוגניטיבית?","a":"משימה שהייתה מהנה, ותגמול שנתפס כשולט","w":["משימה משעממת, ותגמול שנתפס כשולט","משימה מהנה, ותגמול שנתפס כהכרה","משימה משעממת, ותגמול שנתפס כהכרה"],"e":"לפי תורת ההערכה הקוגניטיבית, תגמול חיצוני פוגע כשהמשימה מהנה בפני עצמה והתגמול מרגיש כמו שליטה. במשימה משעממת אין מוטיבציה פנימית לפגוע בה, ותגמול שנתפס כהכרה דווקא יכול לחזק."}]},
"m11":{"t":"t3","v":[{"q":"שתי סטודנטיות לומדות משפטים. אחת כי זה מעניין אותה, השנייה כי ההורים לחצו. לפי הפרק, מי צפויה להיות מאושרת יותר, גם אם שתיהן ייכשלו?","a":"הראשונה, כי יש לה התאמה עצמית גבוהה","w":["השנייה, כי יש לה מוטיבציה חיצונית חזקה","שתיהן באותה מידה, כי התוצאה זהה","השנייה, כי הלחץ מעלה את המחויבות"],"e":"מי שרודף מטרה מסיבות פנימיות מצליח ומאושר יותר, גם בלי להשיג אותה."},{"q":"מה מודדת ״התאמה עצמית״?","a":"עד כמה הסיבות לרדוף אחרי מטרה מתאימות לערכים של האדם","w":["עד כמה האדם מאמין שהוא מסוגל להשיג את המטרה","עד כמה המטרה ספציפית וקשה","עד כמה האדם מרגיש שהתגמול הוגן"],"e":"התאמה עצמית בודקת אם הסיבות לרדוף אחרי מטרה מתאימות לערכים של האדם. ״האם אני מסוגל״ הוא מסוגלות עצמית, מושג אחר."}]},
"m12":{"t":"t3","v":[{"q":"עובד אוהב את העבודה ומוצא אותה מעניינת, אבל לא משקיע בה מעבר לנדרש. האם יש לו מעורבות בעבודה?","a":"לא בהכרח: מעורבות היא השקעה של אנרגיה בביצוע","w":["כן, כי מעורבות היא אהבה לעבודה","כן, כי עניין בעבודה הוא תנאי מספיק","לא, כי מעורבות נמדדת רק בשעות עבודה"],"e":"מעורבות היא יותר מלאהוב את העבודה. זו השקעה של אנרגיה בביצוע."},{"q":"איזו דוגמה מתארת הכי טוב מעורבות בעבודה?","a":"עובדת ששקועה במשימה בגוף, במחשבה וברגש, ומאבדת תחושת זמן","w":["עובדת שמגיעה תמיד בזמן ולא מפספסת אף יום עבודה","עובדת שמרוצה מאוד מהשכר, מהתנאים ומההטבות","עובדת שמספרת לכולם כמה היא אוהבת את מקום העבודה"],"e":"מעורבות היא השקעה של אנרגיה גופנית, מחשבתית ורגשית בביצוע עצמו, עד שמאבדים תחושת זמן. הגעה בזמן היא נוכחות, ושביעות רצון מהשכר אינה מעורבות."}]},
"m12b":{"t":"t3","v":[{"q":"חברה מציעה בונוס על כל רעיון שעובדים מגישים בתיבת ההצעות, ומספר הרעיונות היצירתיים דווקא ירד. מה ההסבר המתאים לפי הפרק?","a":"הבונוס נתפס כשולט, והמוטיבציה הפנימית ירדה","w":["הבונוס היה נמוך מדי ביחס למאמץ הנדרש","העובדים לא האמינו שהרעיונות ייושמו בפועל","לעובדים אין מסוגלות עצמית בתחום הרעיונות"],"e":"תורת ההערכה הקוגניטיבית: תגמול חיצוני על פעילות שהייתה מהנה עלול להוריד מוטיבציה."},{"q":"מה המשותף לתורת ההכוונה העצמית ולהתאמה עצמית?","a":"שתיהן מדגישות את החשיבות של מוטיבציה שבאה מבפנים","w":["שתיהן טוענות שתגמול חיצוני תמיד מגביר מוטיבציה","שתיהן עוסקות בהשוואה בין עובדים בארגון","שתיהן מבוססות על היררכיה של חמישה צרכים"],"e":"שתיהן מדגישות מוטיבציה שבאה מבפנים: תחושת שליטה ובחירה, והתאמה לערכים. שתיהן דווקא מזהירות שתגמול חיצוני עלול לפגוע, ולא טוענות שהוא תמיד עוזר."}]},
"m13":{"t":"t4","v":[{"q":"מנהל אומר לעובד: ״תעשה כמיטב יכולתך החודש.״ לפי לוק, מה היה עדיף?","a":"יעד ספציפי וקשה, למשל 40 עסקאות, עם משוב שבועי","w":["יעד קל, כדי שהעובד ירגיש הצלחה וימשיך","להשאיר את הניסוח, כי הוא לא מפעיל לחץ מיותר","יעד ספציפי וקל, בלי משוב שעלול להפריע לו"],"e":"מטרות ספציפיות וקשות, עם משוב, מובילות לביצועים הגבוהים ביותר."},{"q":"באיזה תנאי מטרה קשה תוביל לביצועים טובים יותר ממטרה קלה, לפי לוק?","a":"כשהעובד קיבל את המטרה ומחויב אליה","w":["כשהמטרה עמומה ומשאירה חופש","כשאין משוב, כדי לא להלחיץ","כשהמשימה מורכבת ותלויה באחרים"],"e":"מטרות קשות עובדות כשהן מתקבלות. מורכבות ותלות דווקא מחלישות את ההשפעה."}]},
"m14":{"t":"t4","v":[{"q":"באיזה מצב המחויבות למטרה צפויה להיות הגבוהה ביותר?","a":"העובד הציב את המטרה בעצמו והציג אותה לצוות","w":["המנהל הציב את המטרה ושמר אותה בסוד","המטרה הוצבה בעיקר לעובדים עם מיקוד שליטה חיצוני","המטרה הוצבה ולא נבדקה עד סוף השנה"],"e":"מחויבות גבוהה כשהמטרה פומבית, כשהעובד הציב אותה בעצמו וכשיש לו מיקוד שליטה פנימי. מטרה שנשמרת בסוד מוחלשת, כי אין לחץ חברתי לעמוד בה."},{"q":"באיזו משימה הצבת מטרות תשפיע הכי פחות?","a":"משימה חדשה ומורכבת שתלויה בצוותים אחרים","w":["הקלדת נתונים פשוטה ומוכרת","מכירות טלפוניות שהעובד מבצע לבד","משימה שגרתית שהעובד מכיר היטב"],"e":"הצבת מטרות משפיעה הכי חזק במשימות פשוטות, מוכרות ועצמאיות. במשימה חדשה ומורכבת שתלויה באחרים, המטרה לבדה משנה פחות, כי ההצלחה לא בשליטת העובד."}]},
"m15":{"t":"t4","v":[{"q":"בחברה, ההנהלה קובעת יעדים לכל עובד ושולחת אותם במייל, עם משוב בסוף השנה. מה חסר כדי שזה יהיה MBO?","a":"השתתפות בקביעת היעדים ומשוב לאורך התקופה","w":["תגמול כספי על כל יעד שהושג","יעדים כלליים במקום יעדים ספציפיים","הצבת יעדים רק לדרג הניהולי הבכיר"],"e":"MBO כולל ספציפיות, השתתפות, תקופה מוגדרת ומשוב. תגמול כספי אינו אחד הרכיבים."},{"q":"איזה מהבאים אינו אחד מארבעת המרכיבים של MBO?","a":"תגמול כספי על כל יעד","w":["יעדים ספציפיים","השתתפות בקבלת ההחלטות","תקופת זמן מוגדרת"],"e":"ארבעת המרכיבים של MBO הם יעדים ספציפיים, השתתפות בקבלת ההחלטות, זמן מוגדר ומשוב. תגמול כספי על כל יעד לא נכלל בהם."}]},
"m16":{"t":"t4","v":[{"q":"שני עובדים קיבלו פרויקט קשה. אחד מגביר את המאמץ כשנתקל בקושי, והשני מאט. מה מסביר את ההבדל, לפי הפרק?","a":"מסוגלות עצמית","w":["התאמה עצמית","מעורבות בעבודה","צורך בשייכות"],"e":"במצב קשה, מי שמסוגלותו נמוכה מוריד מאמץ, ומי שגבוהה מתאמץ יותר."},{"q":"מה ההבדל בין מסוגלות עצמית להתאמה עצמית?","a":"מסוגלות: האם אני יכול. התאמה: האם הסיבות מתאימות לערכים שלי","w":["מסוגלות: האם המטרה ספציפית. התאמה: האם היא קשה מספיק","מסוגלות: האם התגמול הוגן. התאמה: האם הוא מספק אותי","אין הבדל, אלה שני שמות לאותו מושג"],"e":"מסוגלות עצמית היא האמונה ״אני יכול להצליח בזה״. התאמה עצמית היא השאלה אם הסיבות שלי לרדוף אחרי המטרה מתאימות לערכים שלי. מושג אחד עוסק ביכולת והשני במקור המוטיבציה."}]},
"m17":{"t":"t4","v":[{"q":"מנהלת רוצה להעלות את המסוגלות של עובד חדש בכמה שיותר. לפי בנדורה, מה הכי יעיל?","a":"לתת לו משימה שהוא יכול להצליח בה, ולהעלות בהדרגה את הקושי","w":["להראות לו סרטון של עובד מצטיין שעושה את המשימה","לומר לו שוב ושוב שהוא מוכשר ושהוא יצליח","לקיים לו הרצאה מעוררת השראה לפני כל משימה"],"e":"שליטה מתוך ביצוע היא המקור החשוב ביותר. השאר הם למידה מצפייה, שכנוע ועוררות."},{"q":"עובדת שומעת ממנטורית ״יש לך את כל מה שצריך כדי להצליח בתפקיד״. איזה מקור של מסוגלות עצמית זה?","a":"שכנוע מילולי","w":["למידה מצפייה","שליטה מתוך ביצוע","עוררות"],"e":"מישהו אחר אומר לה שיש לה את הכישורים, וזה שכנוע מילולי. למידה מצפייה הייתה צפייה במישהו דומה לה שמצליח."}]},
"m18":{"t":"t4","v":[{"q":"מנהל מציב לעובדת יעד קשה. לפי הפרק, מה עוד קורה מעבר להגדרת היעד?","a":"היא מבינה שהמנהל מאמין בה, והמסוגלות שלה עולה","w":["היא מרגישה שהיחס לא הוגן, ומפחיתה מאמץ","המוטיבציה הפנימית שלה יורדת, כי היעד חיצוני","היא נוטה להסתפק בפתרון הראשון"],"e":"יעד קשה מהמנהל משדר שהוא מאמין ביכולת שלה, ולכן גם מעלה את המסוגלות שלה. המוטיבציה הפנימית לא בהכרח יורדת, כי היעד נתפס כאמון ולא כשליטה."},{"q":"מה הקשר בין הצבת מטרות למסוגלות עצמית לפי הפרק?","a":"הן משלימות: מטרה קשה משדרת אמון ומעלה מסוגלות","w":["הן סותרות: מטרה קשה מורידה מסוגלות","אין ביניהן קשר, הן שייכות לתחומים שונים","מסוגלות קודמת, ולכן מטרות לא משפיעות עליה"],"e":"שתי התיאוריות משלימות: מטרה קשה משדרת אמון, וזה מעלה את המסוגלות העצמית. הן לא סותרות, כי מטרה קשה לא מורידה את האמונה ביכולת אלא מחזקת אותה."}]},
"m19":{"t":"t5","v":[{"q":"מנהל משבח עובד כל פעם שהוא מגיש דוח בזמן, והעובד מגיש בזמן יותר ויותר. איך תורת החיזוק מסבירה זאת?","a":"התוצאה החיובית הגדילה את הסיכוי שההתנהגות תחזור","w":["העובד הציב לעצמו מטרה ספציפית וקשה","העובד השווה את עצמו לעמיתים והרגיש הוגנות","העובד האמין שהמאמץ יוביל לתגמול"],"e":"תורת החיזוק מסבירה התנהגות לפי התוצאות שלה: השבח הגדיל את הסיכוי שהגשה בזמן תחזור. היא לא עוסקת במטרות או באמונות בראש של העובד. אלה הסברים של תיאוריות קוגניטיביות."},{"q":"מה מבדיל את תורת החיזוק מתורת הצבת המטרות?","a":"חיזוק מתעלם ממה שבתוך האדם, הצבת מטרות היא קוגניטיבית","w":["חיזוק עוסק בכוונות, ומטרות בתוצאות","חיזוק עובד רק עם כסף, ומטרות רק עם הכרה","אין הבדל, שתיהן מסבירות התנהגות לפי תוצאות"],"e":"תורת החיזוק מתעלמת ממה שקורה בתוך האדם ומתמקדת בהתנהגות ובתוצאות, והצבת מטרות היא תיאוריה קוגניטיבית. לכן חיזוק לא עוסק בכוונות, והמסיח הראשון הופך את השתיים."}]},
"m20":{"t":"t5","v":[{"q":"עובד חדש רואה שעמית שהציע רעיון קיבל הכרה, ומתחיל להציע רעיונות בעצמו. איזו גישה מסבירה זאת?","a":"למידה חברתית","w":["ביהביוריזם","תורת ההוגנות","תורת ההערכה הקוגניטיבית"],"e":"הוא לא קיבל חיזוק בעצמו, אלא למד מצפייה במה שקרה לעמית, וזו למידה חברתית. ביהביוריזם היה דורש שהוא עצמו יקבל את החיזוק."},{"q":"מה מוסיפה הלמידה החברתית על הביהביוריזם?","a":"שלומדים גם מצפייה באחרים, ולא רק מניסיון אישי","w":["שהתנהגות נקבעת רק לפי תוצאות מיידיות","שתגמול חיצוני פוגע במוטיבציה הפנימית","שאנשים משווים תשומות ותוצאות"],"e":"בביהביוריזם לומדים רק מתוצאות ישירות. בלמידה חברתית גם ממודלים."}]},
"m21":{"t":"t5","v":[{"q":"נועה עובדת שעות נוספות ומקבלת אותו שכר כמו עמית שעובד פחות. לפי תורת ההוגנות, מה היא משווה?","a":"את יחס התשומות־תוצאות שלה ליחס שלו","w":["את השכר שלה לשכר שלו בלבד","את המאמץ שלה למאמץ שלו בלבד","את השכר שלה לשכר הממוצע בענף"],"e":"לפי תורת ההוגנות, משווים יחס: מה אני נותן (שעות, מאמץ) לעומת מה אני מקבל, מול אותו יחס אצל האחר. השוואה של שכר בלבד מפספסת את התשומות, וזה כל העניין כאן."},{"q":"עובד משווה את התנאים בתפקיד הנוכחי שלו לתנאים שהיו לו במקום העבודה הקודם. איזה סוג השוואה זה?","a":"עצמי־בחוץ","w":["עצמי־בפנים","אחר־בחוץ","אחר־בפנים"],"e":"הוא משווה לעצמו (״עצמי״) בארגון אחר שעבד בו קודם (״בחוץ״). אילו השווה לעמית מחברה אחרת, זה היה ״אחר־בחוץ״."}]},
"m22":{"t":"t5","v":[{"q":"דנה מרגישה שמשלמים לה פחות מעמית, ומשכנעת את עצמה ש״הוא בטח עובד יותר קשה ממה שנראה״. איזו תגובה זו?","a":"עיוות התפיסה של האחר","w":["שינוי התשומות","עיוות התפיסה של עצמי","בחירת מישהו אחר להשוואה"],"e":"היא לא משנה את המאמץ שלה, אלא את האופן שבו היא רואה את העמית (״הוא עובד יותר קשה״). זה עיוות התפיסה של האחר. אילו שכנעה את עצמה שהיא עובדת פחות ממה שחשבה, זה היה עיוות התפיסה של עצמי."},{"q":"איזו מהבאות אינה תגובה לחוסר הוגנות לפי תורת ההוגנות?","a":"לבקש ממישהו אחר להחליט במקומי","w":["לבחור מישהו אחר להשוואה","לעוות את התפיסה של עצמי","לעזוב את הארגון לגמרי"],"e":"שש התגובות: לשנות תשומות, לשנות תוצאות, לעוות תפיסת עצמי או אחר, להחליף השוואה, לעזוב."}]},
"m23":{"t":"t5","v":[{"q":"עובד מגלה שהוא מרוויח יותר מעמיתים שעושים בדיוק אותה עבודה. לפי המחקר, מה סביר שיקרה?","a":"כמעט כלום, כי אנשים סובלניים לחוסר הוגנות לטובתם","w":["הוא יגביר משמעותית את המאמץ כדי להצדיק את השכר","הוא יבקש להוריד את השכר שלו","הוא יעזוב, כי חוסר הוגנות בכל כיוון מפריע באותה מידה"],"e":"המחקר מראה שאנשים סובלניים לחוסר הוגנות לטובתם: תשלום יתר כמעט לא משנה התנהגות. התחזית שהוא יגביר משמעותית את המאמץ לא נתמכה במחקר."},{"q":"מה ממצא המחקר לגבי תשלום יתר לעומת תשלום חסר?","a":"תשלום חסר משנה התנהגות, תשלום יתר כמעט לא","w":["שניהם משנים התנהגות באותה מידה","תשלום יתר משנה התנהגות יותר מתשלום חסר","אף אחד מהם לא משנה התנהגות"],"e":"תשלום חסר גורם לאנשים לשנות התנהגות, ותשלום יתר כמעט לא. אנשים מגיבים בעיקר כשחוסר ההוגנות פוגע בהם, ולא כשהוא לטובתם."}]},
"m24":{"t":"t5","v":[{"q":"עובדת לא קיבלה קידום, אבל שמעה הסבר מפורט ונתנו לה להציג את עמדתה. איזה סוג צדק נשמר?","a":"צדק פרוצדורלי","w":["צדק חלוקתי","צדק בין־אישי","תשלום יתר"],"e":"היא קיבלה הסבר והזדמנות להשמיע את עמדתה, כלומר התהליך היה הוגן, וזה צדק פרוצדורלי. התוצאה עצמה (בלי קידום) עוסקת בצדק חלוקתי, ושם היא לא קיבלה מה שרצתה."},{"q":"עובד קיבל העלאה הוגנת, אבל המנהל הודיע לו עליה בזלזול מול כולם. איזה סוג צדק נפגע?","a":"צדק בין־אישי (היחס)","w":["צדק חלוקתי (כמות התגמול)","צדק פרוצדורלי (התהליך)","צדק תועלתני (רוב האנשים)"],"e":"ההעלאה עצמה הוגנת (חלוקתי), אבל היחס בזלזול מול כולם פוגע בצדק הבין־אישי. התהליך (פרוצדורלי) לא נפגע, כי הבעיה היא באופן שבו דיברו אליו."},{"q":"שני עובדים עשו אותה עבודה, ורק אחד קיבל בונוס, למרות שהתהליך היה שקוף ומכבד. איזה סוג צדק נפגע?","a":"צדק חלוקתי","w":["צדק פרוצדורלי","צדק בין־אישי","שום סוג, כי התהליך היה הוגן"],"e":"התהליך היה שקוף ומכבד, ולכן הצדק הפרוצדורלי והבין־אישי נשמרו. מה שנפגע הוא החלוקה עצמה: שניים עשו אותו דבר ורק אחד קיבל, וזה צדק חלוקתי."}]},
"m25":{"t":"t5","v":[{"q":"מתי עובדים יתעניינו במיוחד בשאלה ״איך בדיוק התקבלה ההחלטה?״","a":"כשלא קיבלו את מה שרצו","w":["כשקיבלו יותר ממה שציפו","כשההחלטה התקבלה מהר","כשהמנהל התייחס אליהם בכבוד"],"e":"כשאנשים לא קיבלו את מה שרצו, הצדק החלוקתי חסר, והם מתחילים לבדוק אם התהליך היה הוגן. כשהם מקבלים יותר משציפו, הם כמעט לא שואלים איך זה קרה."},{"q":"מנהלת צריכה להודיע על קיצוץ בבונוסים. לפי הפרק, מה יקטין הכי הרבה את התחושה של חוסר צדק?","a":"להסביר את התהליך ולתת לעובדים להשמיע את עמדתם","w":["לחלק את הבונוס הנותר באופן אקראי בין כולם","להודיע במייל קצר בלי לפרט את השיקולים","להגדיל את הבונוס למנהלים כדי לשמור עליהם"],"e":"כשהחלוקה עצמה מאכזבת, תהליך הוגן, עם הסבר ואפשרות להשמיע עמדה, מקטין את תחושת חוסר הצדק. הודעה קצרה בלי שיקולים פוגעת גם בצדק הפרוצדורלי."}]},
"m26":{"t":"t5","v":[{"q":"עובדת בטוחה שגם אם תעבוד קשה, ההערכה שלה תיקבע לפי ״קשרים״. איזה קשר חלש אצלה בתורת הציפיות?","a":"מאמץ־ביצועים (ההערכה)","w":["ביצועים־תגמול","תגמול־מטרות אישיות","מאמץ־מטרות אישיות"],"e":"היא לא מאמינה שהמאמץ שלה יתורגם להערכה טובה, ולכן הקשר מאמץ־ביצועים חלש. הקשר ביצועים־תגמול עוסק בשלב הבא: האם הערכה טובה מובילה לתגמול."},{"q":"עובד מקבל הערכה מצוינת, אבל יודע שהבונוסים מחולקים שווה בשווה בלי קשר להערכה. איזה קשר חלש?","a":"ביצועים־תגמול","w":["מאמץ־ביצועים","תגמול־מטרות אישיות","מאמץ־תגמול"],"e":"ההערכה שלו טובה, אבל הבונוס לא תלוי בה, ולכן הקשר ביצועים־תגמול חלש. הקשר מאמץ־ביצועים דווקא תקין, כי המאמץ שלו הוביל להערכה מצוינת."}]},
"m27":{"t":"t5","v":[{"q":"עובדת זוכה בכל רבעון בנסיעה לחו״ל, אבל יש לה ילדים קטנים והיא לא רוצה לנסוע. איזה קשר חלש אצלה?","a":"תגמול־מטרות אישיות","w":["מאמץ־ביצועים (ההערכה)","ביצועים־תגמול (הבונוס)","מאמץ־תגמול (ישירות)"],"e":"היא מקבלת תגמול, אבל זה תגמול שהיא לא רוצה, ולכן הקשר תגמול־מטרות אישיות חלש. הקשר ביצועים־תגמול תקין, כי היא אכן זוכה בתגמול על הביצועים."},{"q":"מנהל רוצה לחזק את הקשר תגמול־מטרות אישיות אצל הצוות. מה הצעד המתאים ביותר?","a":"לתת לעובדים לבחור את סוג התגמול שחשוב להם","w":["להבהיר איך בדיוק נמדדים הביצועים","להבטיח שכל ביצוע טוב יזכה לתגמול","לתת הדרכה כדי שהמאמץ יוביל לביצועים"],"e":"כשעובדים בוחרים את סוג התגמול, הוא מתאים יותר למטרות האישיות שלהם. הבהרת אופן המדידה מחזקת את הקשר מאמץ־ביצועים, לא את הקשר הזה."}]},
"em1":{"t":"t6","v":[{"q":"אליעזר מקבל מהבוס את ההכרה שהוא מייחל לה, ומרגיש שניתנת לו אחריות רבה ושיש לו אפשרויות קידום. אבל השכר לא גבוה, אין קביעות, התנאים הפיזיים לא נוחים והיחסים עם העמיתים לא טובים. לפי תיאוריית שני הגורמים של הרצברג, אליעזר:","a":"חש אדישות, כי מקבל את הצרכים האינטרינזיים אך לא את האקסטרינזיים","w":["חש אדישות, כי מקבל את הצרכים האקסטרינזיים אך לא את האינטרינזיים","חש שביעות רצון בתפקיד","חש אי־שביעות רצון בתפקיד"],"e":"זו התשובה לפי מפתח המבחן לדוגמה. הגורמים המניעים (הכרה, אחריות, קידום) קיימים, וגורמי ההיגיינה (שכר, קביעות, תנאים, יחסים) חסרים."},{"q":"לפי הרצברג, איזה מהבאים הוא גורם היגיינה (אקסטרינזי)?","a":"יחסים עם העמיתים","w":["הכרה מהבוס","אפשרויות קידום","אחריות על פרויקט"],"e":"יחסים עם עמיתים הם חלק מהסביבה. הכרה, קידום ואחריות הם גורמים מניעים."}]},
"em2":{"t":"t6","v":[{"q":"מיכל מרוויחה היטב, יש לה קביעות ומשרד מרווח. אבל אף אחד לא מכיר בעבודתה ואין לה אחריות או אפשרות קידום. לפי הרצברג, מיכל:","a":"לא חשה חוסר שביעות רצון, אבל גם לא שביעות רצון","w":["חשה שביעות רצון, כי התנאים החיצוניים טובים","חשה חוסר שביעות רצון, כי חסרים לה גורמי היגיינה","חשה שביעות רצון, כי חצי מהגורמים מסופקים"],"e":"גורמי ההיגיינה קיימים, ולכן אין חוסר שביעות רצון. המניעים חסרים, ולכן אין שביעות רצון."},{"q":"יוסי מקבל הכרה, אחריות ואפשרות קידום, וגם שכר גבוה, קביעות ותנאים טובים. לפי הרצברג, יוסי:","a":"חש שביעות רצון ואין לו חוסר שביעות רצון","w":["חש אדישות, כי הגורמים מבטלים זה את זה","חש שביעות רצון רק בזכות השכר והתנאים","לא חש שביעות רצון, כי חסרים לו גורמי היגיינה"],"e":"יש ליוסי גם גורמים מניעים (הכרה, אחריות) וגם גורמי היגיינה (שכר, קביעות). לפי הרצברג, אלה שני רצפים נפרדים, ולכן הוא גם שבע רצון וגם בלי חוסר שביעות רצון. הגורמים לא ״מבטלים״ זה את זה."}]},
"em3":{"t":"t6","v":[{"q":"בתרחיש במבחן מופיעים: ״קידום״, ״שכר״, ״הכרה״ ו״קביעות״. איך ממיינים אותם לפי הרצברג?","a":"מניעים: קידום והכרה. היגיינה: שכר וקביעות","w":["מניעים: שכר וקידום. היגיינה: הכרה וקביעות","מניעים: הכרה וקביעות. היגיינה: שכר וקידום","מניעים: קידום וקביעות. היגיינה: שכר והכרה"],"e":"מניעים קשורים לעבודה עצמה ולהישגים. היגיינה קשורה לסביבה ולתנאים."},{"q":"איזה זוג מכיל רק גורמי היגיינה לפי הרצברג?","a":"תנאים פיזיים ומדיניות","w":["הכרה ותנאים פיזיים","אחריות ומדיניות החברה","הישגים והעבודה עצמה"],"e":"תנאים פיזיים ומדיניות הם גורמים חיצוניים לעבודה, ולכן היגיינה. בכל אחד מהזוגות האחרים יש לפחות גורם מניע אחד, כמו הכרה או אחריות."}]},

const SUM=`<h2>סיכום: מוטיבציה בעבודה</h2>
<div class="key"><b>על מה מדובר?</b> למה עובד אחד מתאמץ ואחר לא, גם כשהם באותו תפקיד ובאותו שכר? הפרק עוסק בשאלה <b>מה מניע אנשים לעבוד</b>, ומה מנהל יכול לעשות כדי להגביר את זה. הוא עובר על תיאוריות מוטיבציה בסדר היסטורי, ואפשר לחלק אותן לשלוש שאלות:<br>1. <b>מה האדם צריך?</b> (תיאוריות הצרכים, שנות ה־50)<br>2. <b>מה קורה בתוך הראש שלו?</b> (מוטיבציה פנימית, מטרות ואמונה ביכולת)<br>3. <b>מה הוא מקבל אחרי שהוא מתאמץ?</b> (חיזוק, הוגנות וציפיות)<br>בסוף, <b>ורום</b> מחבר הכל לשרשרת אחת.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>מוטיבציה</b></td><td>מה שמסביר את העוצמה, הכיוון וההתמדה של המאמץ.</td></tr>
<tr><td><b>גורם היגיינה</b></td><td>גורם חיצוני (שכר, תנאים) שרק מונע חוסר שביעות רצון.</td></tr>
<tr><td><b>מוטיבציה פנימית</b></td><td>עושים משהו כי הוא מעניין או מהנה בפני עצמו.</td></tr>
<tr><td><b>מסוגלות עצמית</b></td><td>האמונה שאני מסוגל לבצע משימה.</td></tr>
<tr><td><b>הוגנות</b></td><td>השוואה בין מה שנותנים ומקבלים, לעומת אחרים.</td></tr>
<tr><td><b>ציפייה</b></td><td>האמונה שמאמץ יוביל לביצוע, ביצוע לתגמול, ותגמול למטרה.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: מיכל, מוכרת ב״עץ ודני״</h3>
<p>מיכל עובדת כמוכרת בחנות של חברת הרהיטים ״עץ ודני״, ורונית היא המנהלת שלה. נשאל לאורך הסיכום: מה יגרום למיכל להתאמץ יותר? כל תיאוריה תיתן תשובה אחרת.</p>

<h3>1. ממה מוטיבציה בנויה</h3>
<p><b>מוטיבציה</b> היא התהליכים שמסבירים שלושה דברים במאמץ של אדם לעבר מטרה:</p>
<ul>
<li><b>עוצמה:</b> כמה קשה מיכל מתאמצת (כמה לקוחות היא ניגשת אליהם).</li>
<li><b>כיוון:</b> לאן המאמץ מופנה. אם מיכל משקיעה שעות בסידור התצוגה במקום במכירות, יש לה עוצמה אבל לא בכיוון שהארגון צריך.</li>
<li><b>התמדה:</b> כמה זמן היא מחזיקה. האם היא נשברת אחרי שבוע חלש, או ממשיכה.</li>
</ul>
<p>חשוב: מוטיבציה היא <b>לא תכונה קבועה</b>. מיכל יכולה להיות עם מוטיבציה גבוהה במכירות ונמוכה בעבודה המשרדית.</p>

<h3>2. התיאוריות המוקדמות: ״מה האדם צריך?״</h3>
<p>אלה תיאוריות משנות ה־50. הן מאוד מוכרות למנהלים, אבל רובן <b>לא קיבלו תמיכה מחקרית</b>. צריך להכיר אותן כי הן הבסיס לתיאוריות החדשות, והן מופיעות במבחן.</p>
<p><b>מאסלו: היררכיית הצרכים.</b> לכל אדם יש חמישה צרכים בסדר קבוע: פיזיולוגיים ← ביטחון ← חברתיים ← הערכה ← מימוש עצמי. צורך שכבר סופק <b>מפסיק להניע</b>, ואז הצורך הבא בתור הופך לחשוב. הצרכים הנמוכים (פיזיולוגי, ביטחון) מסופקים <b>מבחוץ</b> (שכר, קביעות), והגבוהים <b>מבפנים</b>. לפי מאסלו, אם מיכל לא בטוחה שתקבל משכורת בסוף החודש, לא יעניין אותה פרויקט ״מאתגר ומגשים״. התיאוריה אינטואיטיבית, אבל המחקר <b>כמעט לא תומך</b> בה.</p>
<p><b>מקגרגור: תיאוריה X ותיאוריה Y.</b> זו לא תיאוריה על העובד, אלא על <b>איך המנהל רואה עובדים</b>. מנהל X מאמין שעובדים לא אוהבים לעבוד ומתחמקים מאחריות, ולכן צריך לפקח עליהם ולכפות. מנהל Y מאמין שעבודה טבעית כמו משחק, ושאנשים מחפשים אחריות. מקגרגור המליץ על Y (שיתוף בהחלטות, עבודה מאתגרת). אבל <b>אין ראיות</b> שאחת ההנחות נכונה.</p>
<p><b>הרצברג: שני גורמים.</b> הרצברג שאל אנשים מתי הרגישו טוב במיוחד בעבודה ומתי רע במיוחד, וגילה שהתשובות שונות לגמרי. יש שני סוגים של גורמים:</p>
<div class="tw"><table><tr><th></th><th>גורמים מניעים (פנימיים)</th><th>גורמי היגיינה (חיצוניים)</th></tr>
<tr><td>מה הם</td><td>הכרה, אחריות, קידום, הישגים, העבודה עצמה</td><td>שכר, פיקוח, תנאי עבודה, מדיניות החברה, ביטחון תעסוקתי, יחסים עם עמיתים</td></tr>
<tr><td>מה הם עושים</td><td>יוצרים <b>שביעות רצון</b> ומניעים</td><td>רק מונעים <b>חוסר</b> שביעות רצון</td></tr>
<tr><td>אצל מיכל</td><td>רונית נותנת לה אחריות על לקוחות עסקיים ומפרגנת לה מול כולם</td><td>רונית מתקנת את המזגן בחנות ומעלה מעט את השכר</td></tr></table></div>
<p><b>המסקנה של הרצברג:</b> מנהל שמשפר רק שכר ותנאים ״מרגיע״ את העובדים, הם מפסיקים להתלונן, אבל הם לא מתאמצים יותר. כדי להניע צריך גורמים מניעים. (זו שאלה שמופיעה במבחן לדוגמה: למיין פרטים בתרחיש לשתי הקבוצות.)</p>
<p><b>מקללנד: שלושה צרכים.</b> לאנשים יש צורך ב<b>הישגים</b> (nAch, להצטיין), ב<b>כוח</b> (nPow, להשפיע על אחרים) וב<b>שייכות</b> (nAff, יחסים חמים). מבין התיאוריות המוקדמות, זו עם <b>התמיכה המחקרית הטובה ביותר</b>. אנשים עם צורך גבוה בהישגים אוהבים משימות עם <b>סיכוי של כ־50% להצליח</b>: לא קלות מדי ולא תלויות במזל. אם מיכל כזו, היא תעדיף יעד של 30 עסקאות (קשה אבל אפשרי) על פני 5 (משעמם) או 100 (בלתי אפשרי), ותצליח בעבודה עם אחריות אישית ומשוב.</p>

<h3>3. מה קורה בתוך הראש: מוטיבציה פנימית ומעורבות</h3>
<p>עכשיו עוברים מ״מה אנשים צריכים״ ל״איך הם חווים את העבודה״.</p>
<p><b>תורת ההכוונה העצמית:</b> אנשים רוצים להרגיש שהם <b>שולטים</b> במה שהם עושים. כל דבר שהופך משימה מהנה ל״חובה״ פוגע במוטיבציה. חלק ממנה הוא <b>תורת ההערכה הקוגניטיבית</b>: תגמול חיצוני על משימה שהייתה מהנה בפני עצמה עלול <b>להוריד</b> מוטיבציה, אם הוא נתפס כשולט. הדוגמה מהספר: מרשה התנדבה בעמותה לאימוץ חיות ונהנתה מכל רגע. כשהתחילו לשלם לה, היא נהנתה פחות. ב״עץ ודני״: מיכל אוהבת לעצב פינות תצוגה; אם רונית תתחיל לשלם לה לפי פינה ולבדוק אותה, ההנאה עלולה להיעלם.</p>
<p><b>התאמה עצמית:</b> עד כמה הסיבות שלי לרדוף אחרי מטרה מתאימות לערכים ולתחומי העניין שלי. מי שרודף מטרה מסיבות פנימיות מצליח יותר ומאושר יותר, גם אם לא השיג אותה.</p>
<p><b>מעורבות בעבודה:</b> השקעה של אנרגיה <b>פיזית, קוגניטיבית ורגשית</b> בעבודה. זה יותר מ״לאהוב את העבודה״: כשמיכל מעורבת, היא שוכחת מהשעון כשהיא עוזרת לזוג צעיר לרהט דירה.</p>

<h3>4. מטרות ואמונה ביכולת</h3>
<p><b>לוק: תורת הצבת המטרות.</b> הכוונה להשיג מטרה היא מקור מרכזי למוטיבציה. שלושה ממצאים:</p>
<ul>
<li>מטרה <b>ספציפית</b> (״למכור 50 ספות עד סוף החודש״) עדיפה על ״תעשי כמיטב יכולתך״.</li>
<li>מטרה <b>קשה</b>, אם העובד <b>קיבל</b> אותה, מביאה לביצועים גבוהים יותר ממטרה קלה.</li>
<li><b>משוב</b> משפר ביצועים.</li>
</ul>
<p>מתי זה עובד יותר? (״ממתנים״): כשיש <b>מחויבות</b> למטרה (היא פומבית, העובד הציב אותה בעצמו, ויש לו מיקוד שליטה פנימי), כשה<b>משימה</b> פשוטה, מוכרת ועצמאית, ותלוי גם ב<b>תרבות</b>.</p>
<p><b>MBO, ניהול לפי יעדים:</b> השיטה המעשית של הצבת מטרות. מטרות ספציפיות, שנקבעות <b>בשיתוף</b> עם העובד, לתקופה מוגדרת, עם משוב. יעדי החברה מתורגמים לכל רמה (חטיבה ← מחלקה ← עובד). רונית ומיכל יושבות בתחילת הרבעון וקובעות יחד ״להעלות את שביעות רצון הלקוחות מ־70% ל־80% עד מרץ״, ובודקות כל חודש.</p>
<p><b>בנדורה: מסוגלות עצמית.</b> האמונה שאני <b>מסוגל</b> לבצע משימה. כשקשה, מי שמסוגלותו נמוכה מוריד מאמץ, ומי שמסוגלותו גבוהה מתאמץ יותר. ארבעה מקורות להעלות אותה:</p>
<ol>
<li><b>שליטה מתוך ביצוע:</b> הצלחה קודמת במשימה. <b>המקור החשוב ביותר.</b> מיכל סגרה עסקה גדולה ראשונה, ועכשיו היא מאמינה שתסגור עוד.</li>
<li><b>למידה מצפייה:</b> לראות מישהו דומה לי מצליח.</li>
<li><b>שכנוע מילולי:</b> רונית אומרת לה ״את יכולה״.</li>
<li><b>עוררות:</b> מצב אנרגטי לפני משימה.</li>
</ol>
<p><b>החיבור בין השתיים:</b> כשרונית מציבה למיכל מטרה קשה, היא משדרת ״אני מאמינה בך״, וזה מעלה את המסוגלות של מיכל.</p>

<h3>5. מה קורה אחרי ההתנהגות: חיזוק, הוגנות וציפיות</h3>
<p>שלוש תיאוריות שמסבירות מוטיבציה דרך מה ש<b>מקבלים בתמורה</b> למאמץ.</p>
<p><b>תורת החיזוק:</b> התנהגות היא פונקציה של התוצאות שלה. אם מיכל מגיעה בזמן ומקבלת מחמאה, היא תמשיך להגיע בזמן. התיאוריה <b>מתעלמת ממה שקורה בתוך האדם</b> (מחשבות, רגשות), ולכן במובן הצר היא אפילו <b>לא תיאוריית מוטיבציה</b>. (הרחבה: <b>למידה חברתית</b>, לומדים גם מצפייה באחרים שמקבלים חיזוק.)</p>
<p><b>אדמס: תורת ההוגנות.</b> אנשים משווים את היחס בין מה שהם <b>נותנים</b> (מאמץ, ניסיון, השכלה) לבין מה שהם <b>מקבלים</b> (שכר, קידום, הכרה), לאותו יחס אצל אחרים. מיכל ואבי עושים אותה עבודה באותה רמה, ואבי מרוויח יותר. מיכל תרגיש חוסר הוגנות ותנסה לתקן.</p>
<ul>
<li><b>עם מי משווים (4 אפשרויות):</b> אני בתפקיד אחר כאן, אני בעבודה קודמת, עמית בארגון, מישהו בארגון אחר.</li>
<li><b>מה עושים (6 תגובות):</b> לשנות את מה שנותנים (להתאמץ פחות), לשנות את מה שמקבלים (לבקש העלאה), לעוות את התפיסה של עצמי, לעוות את התפיסה של האחר (״אבי בטח עובד יותר בבוקר״), לבחור מישהו אחר להשוות אליו, או לעזוב.</li>
<li>אנשים סובלניים הרבה יותר כשחוסר ההוגנות <b>לטובתם</b>: תשלום יתר כמעט לא משנה התנהגות.</li>
</ul>
<p><b>צדק ארגוני</b> מרחיב את ההוגנות לשלושה סוגים:</p>
<div class="tw"><table><tr><th>סוג</th><th>השאלה</th><th>אצל מיכל</th></tr>
<tr><td>חלוקתי</td><td>האם <b>מה</b> שקיבלתי הוגן?</td><td>האם הבונוס שלה הוגן ביחס לאבי</td></tr>
<tr><td>פרוצדורלי</td><td>האם <b>התהליך</b> שבו החליטו הוגן? (יכולתי להשמיע את דעתי? הסבירו לי?)</td><td>האם רונית הסבירה איך נקבעו הבונוסים</td></tr>
<tr><td>בין־אישי</td><td>האם <b>התייחסו</b> אליי בכבוד?</td><td>האם רונית דיברה איתה בכבוד כשבישרה לה</td></tr></table></div>
<p>צדק פרוצדורלי חשוב במיוחד כש<b>לא</b> קיבלנו מה שרצינו: אז אנחנו בודקים <b>למה</b>.</p>
<p><b>ורום: תורת הציפיות. השרשרת שמחברת הכל.</b> עובד יתאמץ רק אם הוא מאמין בשלושה קשרים:</p>
<ol>
<li><b>מאמץ ← ביצוע:</b> אם אתאמץ, אצליח? (זה המקום של המסוגלות העצמית)</li>
<li><b>ביצוע ← תגמול:</b> אם אצליח, אקבל משהו? (זה המקום של החיזוק וההוגנות)</li>
<li><b>תגמול ← מטרה אישית:</b> האם התגמול חשוב לי? (זה המקום של הצרכים)</li>
</ol>
<p>אם <b>קשר אחד</b> חלש, המוטיבציה נופלת. אם מיכל בטוחה שהיא יכולה למכור ושמכירות מתוגמלות, אבל הבונוס הוא שובר לחנות שלא מעניינת אותה, היא לא תתאמץ.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. מוטיבציה מסבירה <b>עוצמה, כיוון והתמדה</b> של מאמץ, והיא לא תכונה קבועה.<br>
2. התיאוריות המוקדמות שואלות <b>מה האדם צריך</b>: מאסלו, מקגרגור (X/Y), הרצברג (מניעים מול היגיינה) ומקללנד, שלו התמיכה הטובה ביותר.<br>
3. מבפנים: תגמול חיצוני שנתפס כשולט יכול <b>להוריד</b> מוטיבציה פנימית; ומעורבות היא השקעה פיזית, קוגניטיבית ורגשית.<br>
4. <b>מטרות</b> ספציפיות וקשות עם משוב משפרות ביצוע (לוק, MBO), ו<b>מסוגלות עצמית</b> נבנית בעיקר מהצלחה קודמת (בנדורה).<br>
5. מבחוץ: <b>חיזוק</b>, <b>הוגנות</b> (אדמס, צדק ארגוני), ו<b>ציפיות</b> (ורום), שבהן קשר חלש אחד מפיל את המוטיבציה.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• למיין פרטים בתרחיש לגורמים מניעים ולגורמי היגיינה.<br>
• להבחין בין מקגרגור (המנהל) לשאר התיאוריות, ולומר לאיזו יש תמיכה.<br>
• להסביר מתי תגמול פוגע במוטיבציה, ומה עושה מטרה אפקטיבית.<br>
• לזהות מקור של מסוגלות עצמית, תגובה לחוסר הוגנות וסוג צדק.<br>
• לאתר את הקשר החלש בשרשרת של ורום.</div>
<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>שכר אצל הרצברג הוא גורם היגיינה</b>, לא מניע. משפר שביעות רצון? לא, רק מונע חוסר שביעות רצון.</li>
<li><b>מקגרגור מתאר את המנהל</b> (איך הוא רואה עובדים), לא את העובדים עצמם.</li>
<li><b>מבין הוותיקות, למקללנד יש התמיכה הטובה ביותר</b>; למאסלו ולמקגרגור כמעט אין.</li>
<li><b>תגמול חיצוני יכול להוריד מוטיבציה</b> כשהמשימה מהנה והתגמול נתפס כשולט.</li>

const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){

let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

        const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"no");
        fb.innerHTML=`<div class="fbi"><strong>${ok?"נכון":"לא בדיוק"}</strong><p>${esc(v.e)}${ok?"":" כדאי לחזור לטקסט ולקרוא שוב."}</p></div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.innerHTML=`<span>לשאלה ${i+2}</span>${ic("arrowL")}`;

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

/* Flashcards: front = the term and a prompt, back = the answer and an example.
   "יודע" removes the card from this round, "עוד לא" sends it to the end of the deck. */
function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");
    const card=app.querySelector("#fc"),acts=app.querySelector(".fc-actions");
    const flip=()=>{flipped=!flipped;card.classList.toggle("flipped",flipped);card.setAttribute("aria-pressed",flipped);
      if(flipped&&!acts.querySelector(".fc-btns")){acts.innerHTML=`<div class="fc-btns"><button class="fc-no" id="no">${ic("cycle")}<span>עוד לא</span></button><button class="primary fc-yes" id="yes">${ic("check")}<span>ידעתי</span></button></div>`;
        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};
        acts.querySelector("#no").onclick=()=>{missed.add(k);S.cards[k]=0;save();deck.push(deck.shift());step("fwd")};}};
    card.onclick=flip;
    document.onkeydown=e=>{if(!document.body.contains(card))return document.onkeydown=null;if(e.key===" "||e.key==="Enter"){if(document.activeElement===card||document.activeElement===document.body){e.preventDefault();flip()}}};
  };
  step("up");
}
/* Mind map: one level at a time. The current node sits in the middle, its children around it.
   A branch opens into its own ring; a leaf opens its explanation under the map. */
function mapList(){

  app.querySelector("#back").onclick=()=>home("back");
