<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: קבוצות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>
</head>

<script>
const CONFIG={key:"lomda-mgmt-ch9",cover:"cover4",eyebrow:"מבוא לניהול ומבנה ארגוני · פרק 9",title:"קבוצות",note:"מבוסס על פרק 9 בספר הקורס (באנגלית). המונחים באנגלית מופיעים בסוגריים."};
const I={
 building:'<path d="M4 21V5l8-3 8 3v16M2 21h20M8 8h2M14 8h2M8 12h2M14 12h2M10 21v-4h4v4"/>',

 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 id:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.3"/><path d="M5 16c.6-1.6 2-2.4 3.5-2.4S11.4 14.4 12 16M14.5 10h4M14.5 13.5h3"/>',

};
const ic=(k,cls="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${I[k]}</svg>`;

const arrowDef=id=>`<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-c"/></marker></defs>`;

const FIG={
 stages:()=>{const s=[["גיבוש","Forming","אי-ודאות"],["סערה","Storming","קונפליקט"],["נורמות","Norming","לכידות"],["ביצוע","Performing","עבודה"],["פירוק","Adjourning","סיום"]];
  return `<svg viewBox="0 0 400 170" role="img" aria-label="חמשת שלבי התפתחות הקבוצה">${arrowDef("sa")}
  <line x1="370" y1="62" x2="34" y2="62" class="s-line" stroke-dasharray="4 4" marker-end="url(#sa)"/>

 {id:"t1",icon:"people",title:"מהי קבוצה",blocks:[
  {h:"הגדרה וסוגים",html:`${def("על מה הנושא",`רוב העבודה בארגונים נעשית בקבוצות: צוותים, ועדות, משמרות. לפני שמבינים איך קבוצות עובדות, צריך להבין מה זו קבוצה ולמה אנשים בכלל מצטרפים אליהן.<br><b>מה נלמד כאן:</b> הגדרה של קבוצה · פורמלית מול בלתי פורמלית · זהות חברתית`)}${def("מושג מפתח",`<mark>קבוצה</mark> ${E("Group")}: שני אנשים או יותר, שמקיימים <b>אינטראקציה</b>, <b>תלויים זה בזה</b>, והתאגדו כדי להשיג מטרות מסוימות.`)}${tiles([["pyramid","קבוצה פורמלית","מוגדרת במבנה הארגון, עם משימות מוגדרות. למשל, צוות של שישה אנשים בטיסה"],["people","קבוצה בלתי פורמלית","נוצרת באופן טבעי מתוך הצורך בקשר חברתי. למשל, שלושה עובדים ממחלקות שונות שאוכלים יחד צהריים"]])}${def("למה מצטרפים לקבוצות?",`<mark>תורת הזהות החברתית</mark> ${E("Social identity theory")}: אנשים מרגישים גאווה או עלבון אישי בגלל הישגים של קבוצה שהם שייכים אליה. כמו אוהדים שחוגגים ניצחון של הקבוצה שלהם כאילו היה שלהם.`)}`,q:"g1"},
  {h:"זהות חברתית: מתי היא חשובה",html:`<p>לפי תורת הזהות החברתית, ה<b>הערכה העצמית</b> שלנו נקשרת לביצועי הקבוצה. כשהקבוצה מצליחה אנחנו \"מתחממים בזוהר\" שלה וההערכה העצמית עולה. כשהיא נכשלת, אנחנו מרגישים רע, ולפעמים אפילו דוחים את החלק הזה בזהות (כמו \"אוהדי מזג אוויר נוח\"). זהות חברתית גם <b>מפחיתה אי-ודאות</b> לגבי מי אנחנו ומה עלינו לעשות.</p>${def("הצד השלילי",`<mark>העדפת קבוצת הפנים</mark> ${E("Ingroup favoritism")}: אנחנו רואים את חברי הקבוצה שלנו כטובים יותר מאחרים, ואת מי שלא בקבוצה כ\"כולם אותו דבר\". זה סולל את הדרך לסטריאוטיפים.`)}<p>ארבעה מאפיינים הופכים זהות חברתית לחשובה:</p>${tiles([["people","דמיון","מי שיש לו ערכים ומאפיינים דומים לחברי הארגון מזדהה יותר"],["target","ייחודיות","שמים לב לזהויות שמבדילות אותנו. וטרינר בתחום לא וטרינרי מזדהה עם המקצוע שלו"],["chart","סטטוס","מעדיפים להתחבר לקבוצות בעלות סטטוס גבוה. בוגרי אוניברסיטאות יוקרתיות מדגישים את הקשר ותורמים יותר"],["question","הפחתת אי-ודאות","החברות בקבוצה עוזרת להבין מי אני ואיפה אני בעולם"]])}${ex(`עובדי מחלקת שיווק בטוחים שהם "היצירתיים" בחברה, ושכל אנשי הכספים "אותו דבר, רק מספרים". זו העדפת קבוצת הפנים.`)}`,q:"g27"}
 ]},
 {id:"t2",icon:"cycle",title:"איך קבוצה מתפתחת",blocks:[
  {h:"מודל חמשת השלבים",html:`${def("על מה הנושא",`קבוצה חדשה לא מתחילה לעבוד ביעילות מהיום הראשון. הנושא מציג שני מודלים שמתארים איך קבוצה משתנה לאורך זמן.<br><b>מה נלמד כאן:</b> מודל חמשת השלבים · מודל שיווי המשקל המקוטע`)}${fig("stages")}${tiles([["question","1. גיבוש","אי-ודאות לגבי המטרה, המבנה וההנהגה. בודקים מה מקובל. נגמר כשמרגישים חלק מקבוצה"],["x","2. סערה","קונפליקט פנימי על שליטה. נגמר כשיש היררכיה ברורה של הנהגה"],["link","3. נורמות","יחסים קרובים, לכידות וזהות קבוצתית. מתגבשות ציפיות משותפות"],["chart","4. ביצוע","המבנה עובד. האנרגיה עוברת מהיכרות לביצוע המשימה"],["check","5. פירוק","רק בקבוצות זמניות: התמקדות בסיום ובסגירה"]])}${rem("במציאות קבוצות לא תמיד עוברות את השלבים בסדר הזה, ולפעמים כמה שלבים קורים במקביל.")}<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>חמשת השלבים</th><th>שיווי משקל מקוטע</th></tr></thead><tbody><tr><td><b>מתאים ל</b></td><td>תיאור כללי של קבוצות</td><td>קבוצות זמניות עם דדליין</td></tr><tr><td><b>הדרך</b></td><td>שלב אחרי שלב, בסדר קבוע</td><td>אינרציה, קפיצה באמצע, ואינרציה שוב</td></tr><tr><td><b>מה מניע שינוי</b></td><td>היכרות ופתרון קונפליקטים</td><td>המודעות לזמן שנשאר</td></tr></tbody></table></div>`,q:"g3"},
  {h:"מודל שיווי המשקל המקוטע",html:`<p>מודל חלופי ל<b>קבוצות זמניות עם דדליין</b>:</p>${fig("punct")}${tiles([["target","הפגישה הראשונה","קובעת את הכיוון של הקבוצה, לפעמים כבר בשניות הראשונות"],["lock","שלב 1: אינרציה","הקבוצה \"נתקעת\" בכיוון שנקבע, גם אם יש תובנות חדשות"],["clock","המעבר באמצע","בדיוק באמצע הזמן, כמו שעון מעורר: פרץ של שינויים וכיוון חדש"],["chart","פגישה אחרונה","פרץ פעילות אחרון כדי לסיים"]])}${def("מושג מפתח",`<mark>שיווי משקל מקוטע</mark> ${E("Punctuated-equilibrium model")}: תקופות ארוכות של אינרציה, שנקטעות בשינויים מהירים, בעיקר בגלל המודעות לזמן ולדדליין.`)}${ex(`קבוצת סטודנטים מקבלת עבודה לשישה שבועות. שלושה שבועות כמעט לא קורה כלום. בדיוק באמצע מישהו אומר "רגע, נשארו רק שלושה שבועות!", הקבוצה משנה כיוון ומתחילה לעבוד ברצינות, ובשבוע האחרון יש פרץ לסיום.`)}`,q:"g5"}

 {id:"t3",icon:"id",title:"תפקידים ונורמות",blocks:[
  {h:"תפקידים",html:`${def("על מה הנושא",`בכל קבוצה יש "חוקים לא כתובים": מי עושה מה, ומה מקובל לעשות. הנושא מסביר את שני הכלים שבהם קבוצה מכוונת את ההתנהגות של חבריה.<br><b>מה נלמד כאן:</b> תפקידים · נורמות · קונפורמיות`)}${def("מושג מפתח",`<mark>תפקיד</mark> ${E("Role")}: מערכת התנהגויות צפויות שמיוחסות למי שממלא מקום מסוים ביחידה חברתית.`)}${tiles([["target","תפיסת תפקיד","איך <b>אני</b> חושב שאני אמור להתנהג"],["people","ציפיות תפקיד","איך <b>אחרים</b> מצפים שאתנהג"],["doc","חוזה פסיכולוגי","הסכם <b>לא כתוב</b> על ציפיות הדדיות בין העובד למעסיק"],["x","קונפליקט תפקידים","ציפיות שונות, לפעמים סותרות, מתפקידים שונים. למשל: מנהל בכיר ואבא"]])}${ex("בניסוי הכלא של זימברדו, סטודנטים רגילים קיבלו באקראי תפקיד של סוהר או אסיר. תוך ימים ה\"סוהרים\" התאכזרו וה\"אסירים\" נשברו, והניסוי הופסק. זה מראה כמה מהר אנשים מאמצים תפקיד.")}`,q:"g7"},
  {h:"נורמות",html:`${def("מושג מפתח",`<mark>נורמות</mark> ${E("Norms")}: סטנדרטים של התנהגות מקובלת בקבוצה, שחברי הקבוצה חולקים.`)}${ex("מחקרי הות'ורן (שנות ה-20 וה-30): כשהגבירו את התאורה, הפריון עלה. כשהחלישו אותה, הוא <b>המשיך לעלות</b>. התברר שהקבוצה עצמה קבעה מהו \"פריון הוגן\" ואכפה אותו בלעג ולחץ, ושהכסף השפיע פחות מהנורמות של הקבוצה.")}${def("סטייה בעבודה",`<mark>התנהגות סוטה במקום העבודה</mark> ${E("Deviant workplace behavior")}: התנהגות רצונית שמפרה נורמות ארגוניות חשובות ומאיימת על הארגון או על חבריו. למשל הפצת שמועות, צעקות או הטרדה.`)}`,q:"g10"},
  {h:"קונפורמיות: ניסוי אש",html:`${def("מושג מפתח",`<mark>קונפורמיות</mark> ${E("Conformity")}: התאמת ההתנהגות שלנו לנורמות של הקבוצה.`)}<p><b>סולומון אש</b> ביקש מקבוצות להשוות אורכים של קווים, משימה שבה כמעט אף אחד לא טועה לבד. אבל כל המשתתפים מלבד אחד היו שותפים לניסוי, ונתנו בכוונה תשובה שגויה.</p>${tiles([["chart","75%","מהנבדקים נתנו לפחות פעם אחת תשובה שגויה כדי להתאים לקבוצה"],["pie","37%","מהפעמים, בממוצע, הנבדק הקונפורמי ענה לא נכון"]])}${rem("הלחץ חזק במיוחד מצד <b>קבוצות התייחסות</b>: קבוצות שהאדם רואה את עצמו כחלק מהן, או רוצה להיות. מאז ניסוי אש רמות הקונפורמיות ירדו, והתוצאות תלויות תרבות.")}${ex(`בפגישה כולם אומרים שהתוכנית מעולה. אתה חושב שיש בה בעיה, אבל שותק ומהנהן. זו קונפורמיות.`)}`,q:"g11"}

 {id:"t4",icon:"pyramid",title:"סטטוס, גודל, לכידות וגיוון",blocks:[
  {h:"סטטוס",html:`${def("על מה הנושא",`למה בקבוצות מסוימות כולם מתאמצים ובאחרות לא? הנושא בוחן ארבעה מאפיינים של קבוצה שמשפיעים על ההתנהגות והביצועים שלה.<br><b>מה נלמד כאן:</b> סטטוס · גודל ובטלנות חברתית · לכידות · גיוון`)}${def("מושג מפתח",`<mark>סטטוס</mark> ${E("Status")}: מעמד או דרגה שאחרים מייחסים לאדם או לקבוצה.`)}<p>לפי <b>תורת מאפייני הסטטוס</b>, הסטטוס נובע משלושה מקורות:</p>${tiles([["pyramid","כוח על אחרים","מי ששולט במשאבים ובתוצאות"],["target","תרומה למטרות","מי שהתרומה שלו קריטית להצלחה"],["id","מאפיינים אישיים","תכונות שהקבוצה מעריכה: אינטליגנציה, מראה, אישיות"]])}${rem("לבעלי סטטוס גבוה יש יותר חופש לסטות מהנורמות, והם עמידים יותר ללחץ לקונפורמיות.")}${ex(`בפגישה, כשהמנכ"לית מדברת כולם מקשיבים, וכשהמתמחה מדבר אנשים בודקים טלפונים. המנכ"לית בעלת סטטוס גבוה בקבוצה.`)}`,q:"g13"},
  {h:"גודל הקבוצה ובטלנות חברתית",html:`<p><b>קבוצות קטנות</b> (כ-7) מהירות יותר בביצוע. <b>קבוצות גדולות</b> (12 ומעלה) טובות יותר באיסוף מידע ובפתרון בעיות.</p>${def("מושג מפתח",`<mark>בטלנות חברתית</mark> ${E("Social loafing")}: הנטייה להשקיע פחות מאמץ בעבודה בקבוצה מאשר בעבודה לבד.`)}${ex("רינגלמן מדד משיכה בחבל: אדם לבד משך 63 ק\"ג. בשלישייה, כל אחד משך 53 ק\"ג בממוצע. בשמינייה, רק 31 ק\"ג לאדם.")}<p><b>איך מונעים:</b> מטרות קבוצתיות, תחרות בין קבוצות, הערכת עמיתים, בחירת אנשים עם מוטיבציה לעבודה בקבוצה, ותגמול שמבוסס חלקית על התרומה האישית.</p>`,q:"g15"},
  {h:"לכידות וגיוון",html:`${def("מושג מפתח",`<mark>לכידות</mark> ${E("Cohesiveness")}: עד כמה חברי הקבוצה נמשכים זה לזה ורוצים להישאר בה.`)}<p>לכידות לבדה לא מבטיחה פריון. הכל תלוי ב<b>נורמות הביצוע</b> של הקבוצה:</p>${cohTable}<p><b>איך מגבירים לכידות:</b> להקטין את הקבוצה, לעודד הסכמה על המטרות, להגדיל את הזמן יחד, להעלות את הסטטוס של הקבוצה ואת הקושי להתקבל אליה.</p>${def("גיוון",`<mark>גיוון</mark> ${E("Diversity")}: עד כמה חברי הקבוצה דומים או שונים זה מזה. גיוון מגביר קונפליקט, בעיקר בהתחלה, אבל יכול גם להוביל לרעיונות מגוונים יותר.`)}${ex(`<b>לכידות</b>: צוות שיוצא יחד לארוחות ומחפה זה על זה. <b>גיוון</b>: צוות שבו יש מהנדסת בת 25, איש שיווק בן 50 ומעצב מחו"ל. בהתחלה יש יותר ויכוחים, אבל גם רעיונות מגוונים יותר.`)}`,q:"g17"}
 ]},
 {id:"t5",icon:"split",title:"קבלת החלטות בקבוצה",blocks:[
  {h:"קבוצה מול יחיד",html:`${def("על מה הנושא",`האם עדיף שאדם אחד יחליט, או קבוצה? הנושא משווה ביניהם, מציג שתי מלכודות של קבוצות, ושיטות שעוזרות לקבוצה להחליט טוב יותר.<br><b>מה נלמד כאן:</b> קבוצה מול יחיד · חשיבה קבוצתית ותזוזה קבוצתית · טכניקות לקבלת החלטות`)}<div class="tiles"><div class="tile" style="--c:var(--good)">${ic("check")}<b>חוזקות</b><span>מידע וידע מלאים יותר, מגוון דעות, וקבלה רחבה יותר של הפתרון</span></div><div class="tile" style="--c:var(--bad)">${ic("x")}<b>חולשות</b><span>גוזל זמן, לחץ לקונפורמיות, שליטה של מעטים, ואחריות לא ברורה</span></div></div>${tiles([["target","יעילות (Effectiveness)","קבוצות מדויקות מהחבר הממוצע (אבל לא מהטוב ביותר), יצירתיות יותר, ומשיגות קבלה רחבה יותר"],["clock","חיסכון (Efficiency)","יחידים מהירים יותר, וקבוצות כמעט תמיד צורכות יותר שעות עבודה"]])}`,q:"g20"},
  {h:"חשיבה קבוצתית ותזוזה קבוצתית",html:`${def("מושג מפתח",`<mark>חשיבה קבוצתית</mark> ${E("Groupthink")}: מצב שבו הנורמה של הסכמה גוברת על הערכה מציאותית של החלופות.`)}<p><b>ארבעה סימנים:</b></p>${tiles([["lock","הצדקת הנחות","מתרצים כל התנגדות להנחות, גם מול ראיות"],["hand","לחץ על מפקפקים","לחץ ישיר על מי שמביע ספק"],["x","שתיקה","מי שחושב אחרת שותק ומקטין לעצמו את הספק"],["people","אשליית אחדות","מי ששותק נחשב כמי שמסכים"]])}${def("מושג נוסף",`<mark>תזוזה קבוצתית</mark> ${E("Groupshift")}: בדיון, הקבוצה מקצינה את העמדה ההתחלתית שלה, לכיוון זהירות יתר או לכיוון סיכון.`)}${ex(`<b>חשיבה קבוצתית</b>: ועדה שמאשרת פרויקט כושל כי אף אחד לא רוצה "להרוס את האווירה". <b>תזוזה קבוצתית</b>: כל אחד לבד היה משקיע קצת בסטארט-אפ, אבל אחרי דיון הקבוצה מחליטה להשקיע הכול.`)}`,q:"g22"},
  {h:"טכניקות לקבלת החלטות",html:`${tiles([["people","קבוצה אינטראקטיבית","פגישה רגילה פנים מול פנים. הכי נפוצה, וגם הכי חשופה ללחץ לקונפורמיות"],["bulb","סיעור מוחות","כל רעיון מתקבל, <b>בלי ביקורת</b>. מייצר רעיונות, אבל יחידים לבד מייצרים יותר"],["doc","קבוצה נומינלית","כל אחד כותב לבד, מציגים בלי דיון, דנים, ומדרגים בשקט. <b>עדיפה על סיעור מוחות</b>"],["data","פגישה אלקטרונית","במחשב: הערות אנונימיות וספירת הצבעות"]])}${rem("השם \"נומינלית\" (בשם בלבד): כולם יושבים יחד, אבל עובדים בנפרד, ולכן החשיבה העצמאית נשמרת.")}`,q:"g25"}
 ]},
 {id:"t6",icon:"check",title:"תרגול בסגנון המבחן",blocks:[
  {h:"מושגים מהמבחן לדוגמה",html:`<p>המבחן לדוגמה בודק כמעט רק <b>יישום</b>: תרחיש קצר, ואתם צריכים לזהות את המושג.</p>${tiles([["cycle","שלבי טוקמן","גיבוש, סערה, נורמות, ביצוע, פירוק. הפירוק רק בקבוצות זמניות"],["id","תפקידים","תוך־תפקידי: דרישות סותרות באותו תפקיד. בין־תפקידי: בין תפקידים שונים. עמימות: לא ברור מה התפקיד"],["pyramid","לכידות","עולה כשקשה להתקבל, כשהקבוצה קטנה וכשמבלים יחד"],["people","בטלה חברתית","פחות מאמץ אישי ככל שהקבוצה גדלה"]])}<p>השאלה הראשונה בכל זוג לקוחה מקובץ <b>השאלות לדוגמה למבחן</b> של הקורס (עם התשובה לפי המפתח), והשנייה היא שאלה מקבילה בסגנון דומה.</p>`,q:"ex1"}
 ]}
];
const Q={
g1:{t:"t1",v:[
 {q:"ארבעה אנשים נוסעים יחד במעלית בבניין משרדים, בלי להכיר זה את זה. איזה תנאי של ״קבוצה״ לא מתקיים?",a:"אין תלות הדדית ומטרה משותפת",w:["הם פחות משלושה אנשים במקום","אין ביניהם היררכיה פורמלית ברורה","הם לא נמצאים יחד מספיק זמן"],e:"קבוצה דורשת אינטראקציה, תלות הדדית ומטרה. היררכיה וזמן אינם תנאים."},
 {q:"שלושה עובדים ממחלקות שונות נפגשים לריצה אחרי העבודה, ובמקביל כל אחד משתתף בצוות פרויקט שהמנהל הקים. מה נכון?",a:"הריצה היא קבוצה בלתי פורמלית, הצוות הוא פורמלי",w:["שתיהן קבוצות פורמליות, כי שתיהן קבועות","הריצה אינה קבוצה, כי אין לה מטרה ארגונית","שתיהן בלתי פורמליות, כי החברים בחרו להצטרף"],e:"פורמלית מוגדרת במבנה הארגון. בלתי פורמלית נוצרת מצורך חברתי."}]},
g2:{t:"t1",v:[
 {q:"אחרי שהחברה זכתה בפרס, עובדים מפרסמים את הלוגו בפרופיל שלהם. כשהחברה הסתבכה בשערורייה, רבים הסירו אותו. מה זה ממחיש?",a:"ההערכה העצמית נקשרת לביצועי הקבוצה",w:["העדפת קבוצת הפנים כלפי מתחרים","קונפורמיות לנורמות של הקבוצה","בטלנות חברתית בזמן משבר"],e:"זהות חברתית: מתחממים בזוהר בהצלחה, ומתרחקים בכישלון."},
 {q:"לפי תורת הזהות החברתית, מה עוד מספקת החברות בקבוצה, מעבר לגאווה?",a:"הפחתת אי־ודאות לגבי מי אני ומה עליי לעשות",w:["הגנה מפני קונפליקט בין תפקידים שונים","חופש לסטות מהנורמות של הארגון","חיסכון בזמן בקבלת החלטות בצוות"],e:"זהות חברתית עוזרת להבין מי אנחנו ואיפה אנחנו בעולם."}]},
g27:{t:"t1",v:[
 {q:"מהנדסים בחברה טוענים שכל אנשי המכירות ״אותו דבר, רק מדברים״, ושהמהנדסים ״כל אחד עם סגנון משלו״. מה זה?",a:"העדפת קבוצת הפנים",w:["אפקט ההילה","קונפורמיות לקבוצה","חשיבה קבוצתית"],e:"רואים את הקבוצה שלנו כמגוונת וטובה, ואת האחרים ככולם אותו דבר."},
 {q:"רופאה שעובדת בחברת הייטק מזדהה מאוד עם מקצוע הרפואה, יותר מעמיתיה בבית חולים. איזה מאפיין של זהות חברתית פועל כאן?",a:"ייחודיות",w:["סטטוס","דמיון","הפחתת אי־ודאות"],e:"שמים לב לזהות שמבדילה אותנו מהסביבה."}]},
g28:{t:"t1",v:[
 {q:"עובד צעיר שהערכים שלו דומים מאוד לערכי הארגון מזדהה איתו חזק יותר מאחרים. איזה מאפיין פועל כאן?",a:"דמיון",w:["ייחודיות","סטטוס","הפחתת אי־ודאות"],e:"מי שדומה לחברי הארגון מזדהה יותר."},
 {q:"מה הצד השלילי של זהות חברתית חזקה, לפי הפרק?",a:"היא עלולה לסלול את הדרך לסטריאוטיפים",w:["היא מורידה את ההערכה העצמית של החברים","היא מגבירה בטלנות חברתית בקבוצות","היא מונעת לכידות בקבוצות קטנות"],e:"העדפת קבוצת הפנים מובילה לראות את האחרים ככולם אותו דבר."}]},
g3:{t:"t2",v:[
 {q:"בצוות חדש כבר ברור מי מוביל, אבל רק עכשיו מתחילים להיווצר יחסים קרובים וציפיות משותפות. באיזה שלב הם?",a:"נורמות",w:["סערה","ביצוע","גיבוש"],e:"הסערה הסתיימה (יש היררכיה), והקבוצה בונה לכידות וזהות."},
 {q:"מה מסמן את סוף שלב הסערה?",a:"היררכיה ברורה של הנהגה בקבוצה",w:["תחושה שהחברים הם חלק מקבוצה","מעבר של האנרגיה לביצוע המשימה","יחסים קרובים וזהות קבוצתית"],e:"הגיבוש נגמר בתחושת שייכות, הסערה בהיררכיה, הנורמות בלכידות."}]},
g4:{t:"t2",v:[
 {q:"צוות קבוע במחלקת כספים עובד ביעילות כבר שנים. איזה שלב לא צפוי להגיע אצלו?",a:"פירוק",w:["נורמות","ביצוע","סערה"],e:"פירוק קיים רק בקבוצות זמניות."},
 {q:"מה נכון לגבי מודל חמשת השלבים, לפי הפרק?",a:"קבוצות לא תמיד עוברות את השלבים בסדר הזה",w:["כל קבוצה חייבת לעבור את כל חמשת השלבים לפי הסדר","הוא מתאים בעיקר לקבוצות זמניות עם דדליין","שלב הביצוע תמיד מגיע מיד אחרי הגיבוש"],e:"המודל הוא תיאור כללי, לא חוק קבוע."}]},
g5:{t:"t2",v:[
 {q:"ועדה קיבלה שמונה שבועות להגיש המלצות. לפי מודל שיווי המשקל המקוטע, מתי צפוי השינוי הגדול בדרך העבודה?",a:"בסביבות השבוע הרביעי",w:["בשבוע הראשון","בשבוע האחרון בלבד","בהדרגה לאורך כל התקופה"],e:"המעבר קורה בדיוק באמצע הזמן, כמו שעון מעורר."},
 {q:"קבוצה קבעה כיוון בפגישה הראשונה, ושבוע אחרי זה עלה מידע חדש שסותר אותו. לפי המודל, מה סביר?",a:"הקבוצה תמשיך בכיוון המקורי עד אמצע הזמן",w:["הקבוצה תשנה כיוון מיד לפי המידע החדש","הקבוצה תיכנס לשלב סערה על ההנהגה","הקבוצה תתפרק ותתארגן מחדש סביב המידע"],e:"בשלב הראשון יש אינרציה: נתקעים בכיוון גם מול תובנות חדשות."}]},
g6:{t:"t2",v:[
 {q:"מה מניע שינוי בקבוצה לפי כל אחד מהמודלים?",a:"חמשת השלבים: היכרות ופתרון קונפליקטים. שיווי משקל: המודעות לזמן",w:["חמשת השלבים: המודעות לזמן. שיווי משקל: פתרון קונפליקטים","בשניהם: החלפת המנהיג של הקבוצה","חמשת השלבים: הדדליין. שיווי משקל: הלכידות"],e:"זה ההבדל המרכזי בין המודלים."},
 {q:"לאיזה מצב מתאים יותר מודל שיווי המשקל המקוטע מאשר מודל חמשת השלבים?",a:"צוות שהוקם לחודשיים כדי להגיש הצעה",w:["מחלקה קבועה שעובדת יחד כבר שנים","קבוצה בלתי פורמלית של חברים לצהריים","ועד עובדים קבוע בארגון"],e:"שיווי משקל מקוטע מתאר קבוצות זמניות עם דדליין."}]},
g7:{t:"t3",v:[
 {q:"עובד עבד שנים בנאמנות, מתוך ציפייה שהחברה תשמור עליו בזמן קשה, ופוטר בצמצומים הראשונים. מה הופר?",a:"החוזה הפסיכולוגי",w:["ציפיות התפקיד","הנורמות של הקבוצה","תפיסת התפקיד"],e:"הסכם לא כתוב על ציפיות הדדיות בין העובד למעסיק."},
 {q:"אחות בכירה היא גם ראש ועד העובדים. ההנהלה מבקשת ממנה לקצץ במשמרות, והוועד מבקש להתנגד. מה היא חווה?",a:"קונפליקט בין־תפקידי",w:["עמימות תפקיד","קונפליקט תוך־תפקידי","הפרת חוזה פסיכולוגי"],e:"הציפיות הסותרות באות משני תפקידים שונים."}]},
g8:{t:"t3",v:[
 {q:"מנהלת חדשה חושבת שתפקידה לפקח מקרוב, אבל הצוות מצפה שתיתן חופש. מה הפער?",a:"בין תפיסת התפקיד שלה לציפיות הצוות",w:["בין החוזה הפסיכולוגי לבין הנורמות","קונפליקט בין שני תפקידים שהיא ממלאת","בין הסטטוס שלה לבין הלכידות"],e:"תפיסה: איך אני חושבת שאני צריכה להתנהג. ציפיות: מה אחרים מצפים."},
 {q:"מה ההבדל בין ציפיות תפקיד לבין נורמות?",a:"ציפיות נוגעות למי שבתפקיד מסוים, נורמות לכל חברי הקבוצה",w:["ציפיות כתובות בנוהל, נורמות לא כתובות","ציפיות נקבעות על ידי העובד, נורמות על ידי המנהל","אין הבדל, אלה שני שמות לאותו דבר"],e:"תפקיד קשור למקום מסוים ביחידה. נורמה היא סטנדרט משותף לכולם."}]},
g9:{t:"t3",v:[
 {q:"מה המסקנה העיקרית מניסוי הכלא של זימברדו לגבי תפקידים?",a:"אנשים מאמצים תפקיד מהר מאוד, גם כשקיבלו אותו באקראי",w:["רק אנשים עם אישיות תוקפנית מתאכזרים בתפקיד סמכות","תפקידים משפיעים רק כשהם מוגדרים בנוהל כתוב","אנשים מתנגדים לתפקידים שנקבעו להם באקראי"],e:"הסטודנטים היו רגילים, והתפקידים חולקו באקראי."},
 {q:"למה בחירה אקראית של ״סוהרים״ ו״אסירים״ חשובה למסקנה של זימברדו?",a:"כי היא שוללת את ההסבר שההתנהגות נבעה מאישיות",w:["כי היא מבטיחה שכל המשתתפים היו סטודנטים","כי היא מקצרת את משך הניסוי","כי היא מונעת קונפורמיות בין המשתתפים"],e:"אם החלוקה אקראית, ההבדל בהתנהגות נובע מהתפקיד."}]},
g10:{t:"t3",v:[
 {q:"במחקרי הות׳ורן הפריון עלה גם כשהגבירו וגם כשהחלישו את התאורה. מה התברר בסוף?",a:"הנורמות של הקבוצה השפיעו על הפריון יותר מהתנאים והכסף",w:["התאורה נמדדה לא נכון, ולכן התוצאות אינן תקפות","העובדים העדיפו תאורה חלשה, כי היא מרגיעה ומפחיתה עייפות","הכסף היה הגורם המרכזי לשינוי בפריון"],e:"הקבוצה קבעה ״פריון הוגן״ ואכפה אותו בלעג ולחץ."},
 {q:"עובד חדש במפעל מייצר יותר מכולם, וחבריו מתחילים ללעוג לו ולקרוא לו ״חנפן״. מה מתרחש?",a:"אכיפה של נורמת פריון קבוצתית",w:["התנהגות סוטה במקום העבודה","בטלנות חברתית של הוותיקים","קונפליקט תפקידים אצל העובד"],e:"כמו בהות׳ורן: הקבוצה שומרת על הנורמה בלחץ חברתי."}]},
g11:{t:"t3",v:[
 {q:"בניסוי אש, בכמה מהפעמים, בממוצע, ענה הנבדק הקונפורמי תשובה שגויה?",a:"37%",w:["75%","50%","90%"],e:"75% טעו לפחות פעם אחת. 37% זה הממוצע של התשובות השגויות."},
 {q:"מה מיוחד במשימה שאש בחר, שהופך את התוצאות למרשימות?",a:"כמעט אף אחד לא טועה בה כשהוא עונה לבד",w:["היא הייתה קשה מאוד, ולכן אנשים חיפשו עזרה","היא נגעה לנושא רגשי, שבו קל להשפיע","היא נעשתה בקבוצות של חברים קרובים"],e:"הטעויות נבעו רק מהלחץ הקבוצתי."}]},
g12:{t:"t3",v:[
 {q:"לפי הפרק, מאיזו קבוצה הלחץ לקונפורמיות יהיה החזק ביותר עבור סטודנטית שחולמת להתקבל לצוות מחקר יוקרתי?",a:"מצוות המחקר, שהוא קבוצת התייחסות עבורה",w:["מהסטודנטים בכיתה שלה, כי היא יושבת איתם","מכל קבוצה באותה מידה, כי הלחץ אוניברסלי","מקבוצה שהיא לא רוצה להשתייך אליה"],e:"קבוצת התייחסות היא קבוצה שאדם חלק ממנה או רוצה להיות."},
 {q:"מה מבדיל התנהגות סוטה במקום העבודה מסתם הפרת נוהל קטנה?",a:"היא רצונית, מפרה נורמות חשובות ומאיימת על הארגון או חבריו",w:["היא תמיד פוגעת ברכוש של הארגון באופן ישיר","היא נעשית בעיקר על ידי מנהלים בדרגים בכירים","היא תמיד מתגלה מהר ונענשת לפי הנהלים"],e:"למשל הפצת שמועות, צעקות או הטרדה."}]},
g13:{t:"t4",v:[
 {q:"מתכנתת זוטרה היא היחידה שמבינה את המערכת הקריטית של החברה, וכולם מקשיבים לה בפגישות. מאיזה מקור נובע הסטטוס שלה?",a:"תרומה למטרות הקבוצה",w:["כוח על אחרים","מאפיינים אישיים","הדרגה הפורמלית שלה"],e:"התרומה שלה קריטית להצלחה."},
 {q:"בכיר בחברה מגיע לפגישות בלבוש לא פורמלי, למרות שכולם בחליפות, ואף אחד לא מעיר. מה מסביר זאת?",a:"לבעלי סטטוס גבוה יש יותר חופש לסטות מהנורמות",w:["הנורמה בחברה היא דווקא לבוש לא פורמלי","יש בקבוצה לכידות נמוכה ואין אכיפה של נורמות","הקבוצה בשלב הסערה"],e:"בעלי סטטוס גבוה עמידים יותר ללחץ לקונפורמיות."}]},
g14:{t:"t4",v:[
 {q:"מנהלת צריכה צוות שיאסוף מידע מגוון על שוק חדש ויציע פתרונות. לפי הפרק, איזה גודל מתאים?",a:"קבוצה גדולה, של 12 ומעלה",w:["קבוצה קטנה של כ-7, כי היא מהירה יותר","שני אנשים, כדי למנוע בטלנות","גודל לא משנה לסוג המשימה"],e:"קבוצות גדולות טובות יותר באיסוף מידע ופתרון בעיות."},
 {q:"צוות צריך לבצע משימה מוגדרת מהר. איזה גודל מתאים יותר?",a:"קבוצה קטנה, של כ-7",w:["קבוצה גדולה, כי יש יותר ידיים","12 ומעלה, כדי לחלק את העבודה","גודל לא משנה לסוג המשימה"],e:"קבוצות קטנות מהירות יותר בביצוע."}]},
g15:{t:"t4",v:[
 {q:"בעבודה קבוצתית של 6 סטודנטים, כולם מקבלים אותו ציון, ושניים כמעט לא עושים כלום. מה הדרך היעילה ביותר לצמצם את זה לפי הפרק?",a:"שחלק מהציון יתבסס על התרומה האישית",w:["להגדיל את הקבוצה כדי לחלק את העומס","לבטל את הציון הקבוצתי לגמרי","לתת לקבוצה יותר זמן לעבודה"],e:"תגמול חלקי לפי תרומה אישית, הערכת עמיתים ומטרות קבוצתיות מצמצמים בטלנות."},
 {q:"איזו מהדרכים הבאות לא תצמצם בטלנות חברתית?",a:"להגדיל את הקבוצה",w:["לקיים תחרות בין קבוצות","להוסיף הערכת עמיתים","לבחור אנשים שאוהבים עבודת צוות"],e:"בקבוצה גדולה יותר קל יותר ״להתחבא״, ולכן הבטלנות גדלה."}]},
g16:{t:"t4",v:[
 {q:"בניסוי רינגלמן, אדם לבד משך 63 ק״ג. כמה משך כל אחד, בממוצע, בשלישייה?",a:"53 ק״ג",w:["63 ק״ג","31 ק״ג","45 ק״ג"],e:"בשלישייה 53 ק״ג לאדם, ובשמינייה רק 31."},
 {q:"מה מראים נתוני רינגלמן (63, 53, 31 ק״ג) על הקשר בין גודל הקבוצה לבטלנות?",a:"ככל שהקבוצה גדלה, המאמץ האישי יורד",w:["המאמץ האישי עולה בקבוצה בינונית","המאמץ יורד רק מעל 12 משתתפים","אין קשר בין הגודל למאמץ"],e:"המאמץ לאדם ירד בעקביות כשהקבוצה גדלה."}]},
g17:{t:"t4",v:[
 {q:"צוות מגובש מאוד, שהחברים בו מחפים זה על זה כשמישהו לא עומד ביעדים. מה צפוי לגבי הפריון?",a:"נמוך, כי הלכידות מחזקת נורמת ביצוע נמוכה",w:["גבוה, כי לכידות תמיד מעלה פריון","בינוני, כי הלכידות מאזנת את הנורמות","גבוה, כי החברים תומכים זה בזה"],e:"לכידות מגבירה את ההשפעה של הנורמות, לטוב ולרע."},
 {q:"באיזה מצב לכידות דווקא מזיקה לפריון?",a:"כשנורמות הביצוע של הקבוצה נמוכות",w:["כשנורמות הביצוע של הקבוצה גבוהות","כשהקבוצה קטנה מאוד","כשקשה להתקבל לקבוצה"],e:"לכידות גבוהה עם נורמות נמוכות = פריון נמוך."}]},
g18:{t:"t4",v:[
 {q:"מנהל רוצה להגביר את הלכידות בצוות. איזה צעד יפעל בכיוון ההפוך?",a:"לצרף לצוות עוד עשרה עובדים",w:["להעלות את הסטטוס של הצוות","להקשות על הקבלה לצוות","להגדיל את הזמן שהם מבלים יחד"],e:"הקטנת הקבוצה מגבירה לכידות, והגדלה מחלישה אותה."},
 {q:"איזה מהבאים לא מופיע בפרק כדרך להגביר לכידות?",a:"להגביר את הגיוון בקבוצה",w:["לעודד הסכמה על המטרות","להקשות על הקבלה לקבוצה","להקטין את הקבוצה"],e:"גיוון דווקא מגביר קונפליקט, בעיקר בהתחלה."}]},
g19:{t:"t4",v:[
 {q:"צוות מגוון מאוד בגיל, במקצוע ובמוצא מתווכח הרבה בחודש הראשון. מה הפרק היה אומר?",a:"זה צפוי בהתחלה, ובהמשך הגיוון יכול להניב רעיונות מגוונים",w:["הגיוון נכשל, וכדאי לפרק את הצוות ולבנות אותו מחדש","גיוון תמיד פוגע בביצועים, ולכן עדיף צוות הומוגני","הוויכוחים מעידים על בטלנות חברתית של חלק מהחברים"],e:"גיוון מגביר קונפליקט, בעיקר בהתחלה, אבל יש לו גם יתרונות."},
 {q:"מה הקשר בין גיוון ללכידות, לפי מה שנלמד?",a:"גיוון מגביר קונפליקט, ובכך עלול להקשות על לכידות בהתחלה",w:["גיוון מגביר לכידות, כי יש יותר נקודות מבט בקבוצה","אין קשר בין מידת הגיוון בקבוצה לבין הלכידות שלה","גיוון מגביר לכידות, אבל רק בקבוצות גדולות במיוחד"],e:"בהתחלה ההבדלים יוצרים חיכוך, ולכן קשה יותר להתלכד."}]},
g20:{t:"t5",v:[
 {q:"מנהלת צריכה החלטה שהצוות יתחייב ליישם. למה עדיף שהקבוצה תחליט, ולא היא לבד?",a:"החלטה קבוצתית זוכה לקבלה רחבה יותר",w:["החלטה קבוצתית מהירה יותר","קבוצה מדויקת יותר מהחבר הטוב ביותר","בקבוצה האחריות ברורה יותר"],e:"קבלה רחבה היא חוזקה. מהירות ואחריות ברורה הן דווקא חולשות של קבוצה."},
 {q:"איזה מהבאים הוא חולשה של החלטה בקבוצה?",a:"שליטה של מעטים בדיון",w:["מגוון דעות רחב יותר","מידע וידע מלאים יותר","קבלה רחבה של הפתרון"],e:"החולשות: זמן, לחץ לקונפורמיות, שליטה של מעטים ואחריות לא ברורה."}]},
g21:{t:"t5",v:[
 {q:"בצוות יש מומחית אחת מצוינת ועוד ארבעה חברים ממוצעים. לפי הפרק, ההחלטה הקבוצתית תהיה בדרך כלל:",a:"מדויקת מהממוצע, אבל פחות מהמומחית לבד",w:["מדויקת יותר גם מהמומחית לבד","פחות מדויקת מכל אחד מהחברים","מדויקת בדיוק כמו המומחית לבד"],e:"קבוצות מדויקות מהחבר הממוצע, אבל לא מהטוב ביותר."},
 {q:"מה ההבדל בין ״יעילות״ ל״חיסכון״ בהשוואה בין קבוצה ליחיד?",a:"קבוצות יעילות יותר (דיוק, יצירתיות), יחידים חסכוניים יותר (זמן)",w:["קבוצות חסכוניות יותר בזמן, ויחידים מדויקים ויצירתיים יותר","קבוצות עדיפות בשני הממדים, גם בזמן וגם בדיוק","יחידים עדיפים בשני הממדים, גם בזמן וגם בדיוק"],e:"קבוצות כמעט תמיד צורכות יותר שעות עבודה."}]},
g22:{t:"t5",v:[
 {q:"בישיבה, עובד שהביע ספק שמע מהמנהל ״בוא לא נהרוס את האווירה״, ושאר המשתתפים שתקו. מה הסימנים כאן?",a:"לחץ על מפקפקים ושתיקה: חשיבה קבוצתית",w:["תזוזה קבוצתית לכיוון זהירות","בטלנות חברתית של המשתתפים","קונפליקט תפקידים אצל המנהל"],e:"שני סימנים של חשיבה קבוצתית."},
 {q:"מה מבדיל חשיבה קבוצתית מתזוזה קבוצתית?",a:"חשיבה קבוצתית: הסכמה גוברת על ביקורת. תזוזה: הקצנה של העמדה",w:["חשיבה קבוצתית: הקצנה של העמדה. תזוזה: הסכמה שגוברת","שתיהן עוסקות בסיכון, רק כל אחת בכיוון אחר","אין הבדל מהותי, אלה שני שמות לאותה תופעה"],e:"שתי מלכודות שונות בקבלת החלטות בקבוצה."}]},
g23:{t:"t5",v:[
 {q:"איזה מהבאים אינו סימן של חשיבה קבוצתית?",a:"מינוי ״פרקליט השטן״ קבוע",w:["תירוצים לכל התנגדות להנחות","מי ששותק נחשב כמי שמסכים","לחץ ישיר על מי שמביע ספק"],e:"מינוי מבקר הוא דרך להתמודד עם חשיבה קבוצתית, לא סימן שלה."},
 {q:"חבר ועדה חושב שהתוכנית בעייתית, אבל משכנע את עצמו ש״כנראה אני מגזים״ ושותק. איזה סימן זה?",a:"שתיקה והקטנת הספק",w:["אשליית אחדות","לחץ על מפקפקים","הצדקת הנחות"],e:"מי שחושב אחרת שותק ומקטין לעצמו את הספק."}]},
g24:{t:"t5",v:[
 {q:"כל אחד מחברי ועדה נטה לבד להשקעה זהירה. אחרי דיון, הוועדה החליטה על השקעה זהירה עוד יותר. מה קרה?",a:"תזוזה קבוצתית לכיוון זהירות",w:["חשיבה קבוצתית","קונפורמיות כמו בניסוי אש","שיווי משקל מקוטע"],e:"תזוזה קבוצתית מקצינה את העמדה ההתחלתית, בכל כיוון."},

for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>

    </div>

   <div class="foot"><a href="../#mgmt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
