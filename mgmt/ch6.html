<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: תפיסה וקבלת החלטות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(var(--dist))}to{opacity:1;transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const attribTable=`<div class="tblwrap"><table class="tbl"><thead><tr><th>הגורם</th><th>גבוה ←</th><th>נמוך ←</th></tr></thead><tbody>
<tr><td><b>ייחודיות</b> ${E("Distinctiveness")}<br><span class="muted" style="font-size:.85rem">האם ההתנהגות חריגה אצלו?</span></td><td class="out">חיצוני</td><td class="in">פנימי</td></tr>
<tr><td><b>הסכמה</b> ${E("Consensus")}<br><span class="muted" style="font-size:.85rem">האם כולם מתנהגים כך באותו מצב?</span></td><td class="out">חיצוני</td><td class="in">פנימי</td></tr>
<tr><td><b>עקביות</b> ${E("Consistency")}<br><span class="muted" style="font-size:.85rem">האם הוא מתנהג כך לאורך זמן?</span></td><td class="in">פנימי</td><td class="out">חיצוני</td></tr></tbody></table></div>`;

const T=[
 {id:"t1",icon:"target",title:"מהי תפיסה",blocks:[
  {h:"העולם כפי שאנחנו רואים אותו",html:`${def("על מה הנושא",`שני אנשים רואים את אותו מצב, ומבינים אותו אחרת לגמרי. למה? כי אנחנו לא רואים את העולם כמו שהוא, אלא כמו שאנחנו מפרשים אותו. הנושא מסביר מה זו תפיסה ומה משפיע עליה.<br><b>מה נלמד כאן:</b> מהי תפיסה · שלושה גורמים שמשפיעים עליה`)}${def("מושג מפתח",`<mark>תפיסה</mark> ${E("Perception")} היא תהליך שבו אדם מארגן ומפרש את הרשמים שקלט בחושים, כדי לתת משמעות לסביבה שלו.`)}<p>מה שאנחנו תופסים יכול להיות שונה מאוד מהמציאות האובייקטיבית. נדיר למצוא ארגון שבו כל העובדים מסכימים שתנאי העבודה, השכר וההנהלה מצוינים, גם כשזה נכון.</p>${rem("למה זה חשוב בהתנהגות ארגונית? כי אנשים פועלים לפי <b>המציאות כפי שהם תופסים אותה</b>, ולא לפי המציאות עצמה.")}${ex(`שני עובדים שומעים שהמנהל קורא להם לשיחה. אחת חושבת "כנראה רוצים לקדם אותי", והשני חושב "אני בצרות". אותו גירוי, שתי תפיסות שונות.`)}`,q:"p1"},
  {h:"מה משפיע על התפיסה?",html:`<p>שני אנשים מסתכלים על אותו דבר ורואים דברים שונים. יש שלושה מקורות להבדל:</p>${fig("factors")}${ex("אדם בחליפה מהודרת במועדון במוצאי שבת לא יבלוט. אותו אדם, באותה חליפה, בשיעור בשמונה בבוקר, יבלוט מאוד. לא הוא השתנה ולא אתם השתנית, <b>המצב</b> השתנה.")}`,q:"p2"}
 ]},
 {id:"t2",icon:"question",title:"תורת הייחוס",blocks:[
  {h:"למה הוא התנהג ככה?",html:`${def("על מה הנושא",`כשמישהו מאחר לפגישה, אנחנו מיד שואלים: הוא לא אחראי, או שהיו פקקים? הנושא הזה עוסק בשאלה איך אנחנו מחליטים <b>למה</b> אנשים מתנהגים כפי שהם מתנהגים, ואיפה אנחנו טועים.<br><b>מה נלמד כאן:</b> סיבה פנימית מול חיצונית · ייחודיות, הסכמה ועקביות · טעויות בייחוס`)}<p>חפצים לא מתכוונים לשום דבר, אבל אנשים כן. לכן כשאנחנו רואים אדם מתנהג, אנחנו מנסים להבין למה.</p>${def("מושג מפתח",`<mark>תורת הייחוס</mark> ${E("Attribution theory")} מנסה לקבוע אם ההתנהגות של אדם נובעת מ<b>סיבה פנימית</b> (שבשליטתו) או מ<b>סיבה חיצונית</b> (הנסיבות).`)}${ex("עובד מאחר לעבודה. ייחוס פנימי: \"הוא בילה עד מאוחר ולא קם.\" ייחוס חיצוני: \"הייתה תאונה בכביש והכל נתקע.\"")}`,q:"a1"},
  {h:"שלושה גורמים שקובעים את הייחוס",html:`<p>כדי להחליט אם הסיבה פנימית או חיצונית, אנחנו בודקים שלושה דברים:</p>${attribTable}${ex("כולם שנסעו באותו כביש איחרו? הסכמה גבוהה, אז נייחס את האיחור לפקק (חיצוני). הוא מאחר פעמיים-שלוש בשבוע? עקביות גבוהה, אז נייחס את זה לו (פנימי).")}`,q:"a2"},
  {h:"טעויות בייחוס",html:`${tiles([["people","טעות הייחוס הבסיסית","כשאנחנו שופטים <b>אחרים</b>: מגזימים בהשפעת האישיות וממעיטים בהשפעת הנסיבות","כשאנחנו מסבירים מה <b>מישהו אחר</b> עשה, אנחנו קופצים ל״ככה הוא״ (תכונה, אישיות), ושוכחים לבדוק מה קרה סביבו. זו טעות שכולנו עושים באופן קבוע.","המכירות של מוכר ירדו, ורונית בטוחה שהוא ״עצלן״. היא לא שמה לב שהמתחרה ממול הוריד מחירים באותו חודש."],["target","הטיה לטובת העצמי","הצלחות שלי בזכותי (פנימי), כישלונות שלי בגלל הנסיבות (חיצוני)","כשמדובר <b>בנו</b>, אנחנו הופכים את הכיוון: את ההצלחה מסבירים בעצמנו, ואת הכישלון במצב. כך שומרים על תדמית עצמית טובה.","כשהסניף עמד ביעד, רונית אמרה ״זה בזכות הניהול שלי״. כשהסניף לא עמד ביעד, היא אמרה ״השוק היה חלש״."]])}${ex("מנהל מכירות בטוח שהנציג שלו עצלן, ומתעלם מכך שמתחרה הוריד מחירים. זו טעות הייחוס הבסיסית.")}`,q:"a4"}
 ]},
 {id:"t3",icon:"copies",title:"קיצורי דרך בשיפוט אחרים",blocks:[
  {h:"ארבעה קיצורי דרך",html:`${def("על מה הנושא",`אין לנו זמן לבדוק לעומק כל אדם שאנחנו פוגשים, ולכן המוח משתמש ב"קיצורי דרך". הם חוסכים זמן, אבל גם גורמים לטעויות, למשל בראיון עבודה או בהערכת עובד.<br><b>מה נלמד כאן:</b> תפיסה בררנית · אפקט ההילה · אפקט הניגוד · סטריאוטיפים`)}<p>כדי לשפוט אנשים מהר, המוח משתמש בקיצורי דרך. הם חוסכים זמן, אבל גם מעוותים:</p>${tiles([["target","תפיסה סלקטיבית",`מפרשים את מה שרואים לפי תחומי העניין, הרקע והניסיון שלנו ${E("Selective perception")}`,"אי אפשר לקלוט הכול, ולכן כל אחד ״מסנן״ ושם לב בעיקר למה שקשור לתחום, לרקע ולניסיון שלו. אותו מצב נראה אחרת לאנשים שונים.","באותה ישיבה על ירידה במכירות, איש השיווק רואה בעיה של פרסום, ומנהלת הכספים רואה בעיה של מחירים."],["bulb","אפקט ההילה",`רושם כללי על אדם בגלל <b>תכונה אחת</b> ${E("Halo effect")}`,"תכונה אחת בולטת, טובה או רעה, ״צובעת״ את כל השאר. אם האדם חייכן, נניח שהוא גם אחראי ומקצועי, בלי שבדקנו את זה.","מועמד חייכן ונעים בראיון, ורונית מניחה שהוא גם יהיה מוכר מצוין, למרות שלא שאלה אותו שום דבר על ניסיון במכירות."],["scales","אפקט הניגוד",`שופטים אדם בהשוואה למי שפגשנו ממש לפניו ${E("Contrast effect")}`,"אנחנו לא שופטים אדם לבד, אלא ביחס למי שראינו ממש לפניו. אחרי מישהו חלש, אדם בינוני נראה חזק.","אחרי מועמד שאיחר ולא ידע כלום על החברה, המועמד הבא, שהוא בסך הכול בינוני, נראה לרונית מצוין."],["people","סטריאוטיפ",`שופטים אדם לפי הקבוצה שהוא שייך אליה ${E("Stereotyping")}`,"שופטים אדם לפי מה שאנחנו חושבים על הקבוצה שלו (גיל, מגדר, מוצא), ולא לפי מה שהוא עצמו. זה חוסך זמן, אבל מוביל לטעויות ולאפליה.","״הוא בן 55, הוא בטח לא יסתדר עם מערכת ההזמנות הממוחשבת״, לפני שבכלל ראו אותו עובד עליה."]])}`,q:"s1"},
  {h:"איפה זה פוגש אותנו בארגון",html:`${tiles([["hand","ראיון עבודה","רושם ראשוני נוצר בשבריר שנייה, ומידע שלילי בהתחלה שוקל יותר. רוב המראיינים כמעט לא משנים דעה אחרי 4-5 הדקות הראשונות."],["chart","ציפיות לביצועים","<b>נבואה שמגשימה את עצמה</b> (אפקט פיגמליון): מנהל שמצפה להרבה, מקבל הרבה. מצפה למעט, מקבל מעט."],["doc","הערכת ביצועים","בהערכות סובייקטיביות כל ההטיות נכנסות פנימה. לפעמים ההערכה מלמדת על המעריך יותר מאשר על העובד.","כשהמנהל מעריך עובד לפי התרשמות ולא לפי מדד ברור, כל ההטיות שלמדנו (הילה, ניגוד, סטריאוטיפ ועוד) משפיעות על הציון.","עובד שרונית מחבבת מקבל הערכה גבוהה, אף שהמכירות שלו דומות לשל עובד שהיא פחות מחבבת."]])}`,q:"s5"}
 ]},
 {id:"t4",icon:"split",title:"איך מקבלים החלטות",blocks:[
  {h:"המודל הרציונלי",html:`${def("על מה הנושא",`כל יום אנחנו מקבלים החלטות: מה לקנות, את מי לגייס, איזה פרויקט לבחור. הנושא משווה בין איך <b>צריך</b> להחליט (מודל רציונלי) לבין איך אנחנו <b>באמת</b> מחליטים.<br><b>מה נלמד כאן:</b> המודל הרציונלי · רציונליות מוגבלת · אינטואיציה`)}${def("שני מושגים",`<mark>בעיה</mark>: פער בין המצב הנוכחי למצב הרצוי. <mark>החלטה</mark>: בחירה בין שתי חלופות או יותר.`)}<p>התפיסה משפיעה על כל שלב: מה בכלל נחשב בעיה, איזה מידע רלוונטי, ואילו חלופות נראות לנו. המודל הרציונלי מתאר איך <b>צריך</b> להחליט כדי להשיג את התוצאה הטובה ביותר:</p>${fig("steps6")}${rem("המודל מניח מידע מלא, זיהוי של כל החלופות בלי הטיה, ובחירה בחלופה עם התועלת הגבוהה ביותר. במציאות, רוב ההחלטות לא נראות ככה.")}${ex(`<b>בעיה</b>: המכירות ירדו ב-20% (פער בין מה שיש למה שרוצים). <b>החלטה</b>: לבחור בין להוריד מחיר, להגדיל פרסום או לשפר את המוצר.`)}`,q:"d1"},
  {h:"רציונליות מוגבלת",html:`${def("מושג מפתח",`<mark>רציונליות מוגבלת</mark> ${E("Bounded rationality")}: היכולת שלנו לעבד מידע מוגבלת, ולכן אנחנו בונים מודלים פשוטים שתופסים רק את עיקר הבעיה.`)}<p>במקום לחפש את הפתרון המושלם, בודקים חלופות קרובות למצב הקיים, ועוצרים בראשונה שהיא "מספיק טובה". זה נקרא <mark>הסתפקות</mark> ${E("Satisficing")}.</p>${rem("הסתפקות היא לא תמיד רעה. המודל הרציונלי דורש המון מידע, זמן ואנרגיה, ולפעמים תהליך פשוט הוא דווקא ההגיוני יותר.")}${ex(`כשמחפשים דירה, לא בודקים את כל הדירות בעיר. מסתכלים על כמה מודעות, ובוחרים את הראשונה ש"מספיק טובה" (מחיר סביר, קרוב לעבודה). זו רציונליות מוגבלת.`)}`,q:"d3"},
  {h:"אינטואיציה",html:`${def("מושג מפתח",`<mark>קבלת החלטות אינטואיטיבית</mark> ${E("Intuitive decision making")}: תהליך לא מודע, שנבנה מניסיון מזוקק.`)}<p>האינטואיציה מהירה, והיא לא חייבת לעמוד בסתירה לניתוח רציונלי. אצל אנשים מנוסים, שתי הדרכים יכולות להשלים זו את זו.</p>${rem("אבל לא כדאי להסתמך עליה יותר מדי: קשה לדעת מתי תחושת הבטן צודקת ומתי לא.")}${ex(`מגייסת ותיקה שמרגישה "משהו לא בסדר" בקורות חיים, עוד לפני שהיא יודעת להסביר למה. זו אינטואיציה שנבנתה משנים של ניסיון.`)}`,q:"d4"}
 ]},
 {id:"t5",icon:"x",title:"הטיות וטעויות בהחלטות",blocks:[
  {h:"הטיות שקשורות למידע",html:`${def("על מה הנושא",`גם אנשים חכמים טועים בהחלטות, ובאופן צפוי. הנושא מציג את ההטיות הנפוצות, כדי שתזהו אותן אצלכם ואצל אחרים.<br><b>מה נלמד כאן:</b> הטיות במידע (עיגון, אישוש, זמינות) · הטיות בהחלטה עצמה · איך מצמצמים`)}${tiles([["chart","ביטחון יתר",`אנשים שבטוחים ב-90% צודקים בערך ב-50% מהמקרים ${E("Overconfidence")}`,"הפער בין כמה שאנחנו בטוחים לבין כמה שאנחנו צודקים גדול במיוחד כשהידע שלנו בנושא מוגבל, ודווקא אז אנחנו בודקים פחות.","רונית ״בטוחה ב־100%״ שסניף חדש יצליח, ולכן לא עושה בדיקת שוק לפני שהיא חותמת על שכירות."],["lock","עיגון",`נתקעים על המידע הראשון ולא מתקנים מספיק לפי מידע חדש ${E("Anchoring")}`,"המספר הראשון ששמענו הופך ל״עוגן״. גם כשמתקנים אותו, נשארים קרובים אליו, ולכן מי שאומר מספר ראשון משפיע על כל ההמשך.","משכיר מבקש 20,000 ש״ח לחודש על חנות. רונית מתמקחת ומגיעה ל־17,000, ומרגישה שהרוויחה, אף שהמחיר בשוק הוא 12,000."],["check","אישוש",`מחפשים מידע שמחזק את מה שכבר החלטנו, ומזלזלים במידע שסותר ${E("Confirmation")}`,"זה קורה בלי שנשים לב: ראיה שתומכת בנו נראית משכנעת, וראיה נגדית נראית ״לא רלוונטית״. כך ההחלטה נשארת, גם כשהיא שגויה.","רונית החליטה לפתוח בחיפה, ומעכשיו קוראת רק כתבות על ״הפריחה בחיפה״, ומדלגת על דוחות על מסחר חלש באזור."],["clock","זמינות",`שופטים לפי מה שהכי קל להיזכר בו ${E("Availability")}`,"דברים טריים, בולטים או מרגשים ״קופצים״ לראש ראשונים, ולכן מקבלים משקל גדול מדי לעומת דברים שקרו מזמן או שהיו שגרתיים.","בהערכה השנתית רונית זוכרת בעיקר את הטעות הבולטת שעובד עשה לפני שבוע, ושוכחת 11 חודשים של עבודה טובה."]])}${ex("בהתחלת משא ומתן על שכר, המספר הראשון שנאמר משמש עוגן לכל ההמשך.")}`,q:"b2"},
  {h:"הטיות שקשורות להחלטות עצמן",html:`${tiles([["cycle","הסלמת מחויבות",`נשארים בהחלטה למרות ראיות ברורות שהיא שגויה. "זורקים כסף טוב אחרי כסף רע" ${E("Escalation of commitment")}`,"ככל שהשקענו יותר זמן, כסף ושם בהחלטה, קשה יותר להודות שטעינו. לכן ממשיכים להשקיע בה גם כשהראיות אומרות לעצור.","הסניף בחיפה מפסיד כבר שנה, ורונית מוסיפה עוד תקציב פרסום כדי ״להוכיח שצדקה״, במקום לסגור אותו."],["question","טעות האקראיות",`מאמינים שאפשר לחזות אירועים אקראיים, למשל אמונות טפלות ${E("Randomness error")}`,"רואים דפוס במקום שאין בו שום חוק, ומאמינים שאפשר לחזות דברים שהם מקריים.","״אנחנו תמיד מוכרים יותר בימי שלישי, אז נקבע את המבצעים רק לשלישי״, אף שזה קרה במקרה כמה פעמים."],["scales","שנאת סיכון",`מעדיפים רווח בטוח ובינוני על פני סיכון, גם כשהתוחלת שלו גבוהה יותר ${E("Risk aversion")}`,"אנשים מעדיפים רווח בטוח, גם אם הוא קטן יותר, על פני הימור שבממוצע ישתלם יותר. זה גורם לוותר על הזדמנויות טובות.","רונית בוחרת בהנחה קבועה וקטנה מספק, במקום חוזה גמיש שבממוצע היה חוסך לה יותר כסף."],["pie","הטיית חוכמה לאחר מעשה",`אחרי שהתוצאה ידועה, בטוחים ש"ידענו מראש" ${E("Hindsight bias")}`,"אחרי שיודעים איך משהו נגמר, נדמה שהיה ברור מראש שזה יקרה. בפועל, לפני כן אף אחד לא ידע.","אחרי שהסניף נסגר, כולם בישיבה אומרים ״היה ברור שזה ייכשל״. אבל אף אחד לא אמר את זה לפני הפתיחה."]])}${rem("הסלמת מחויבות קורית במיוחד כשאדם מרגיש <b>אחראי</b> לכישלון ורוצה להוכיח שההחלטה המקורית לא הייתה טעות.")}`,q:"b5"},
  {h:"איך מצמצמים הטיות",html:`${tiles([["target","להתמקד במטרות","בלי מטרה ברורה אי אפשר לדעת איזה מידע רלוונטי ובין מה לבחור","כשהמטרה ברורה, קל יותר לדעת איזה מידע חשוב ומה אפשר להזניח, וכך מצמצמים את ההשפעה של הטיות.","לפני שבוחרים עיר לסניף, רונית מגדירה מטרה: ״מקסימום לקוחות צעירים בתקציב של 10,000 ש״ח לחודש״. עכשיו ברור מה לבדוק."],["question","לחפש מידע שסותר","הדרך היעילה ביותר נגד ביטחון יתר, הטיית אישוש וחוכמה לאחר מעשה","בכוונה לשאול ״מה יכול להוכיח שאני טועה?״ ולחפש תשובה. זו הדרך הכי יעילה נגד ביטחון יתר, אישוש וחוכמה לאחר מעשה.","לפני החתימה רונית מבקשת מעובד לכתוב את כל הסיבות שבגללן הסניף בחיפה עלול להיכשל."],["link","לא לייצר משמעות מצירופי מקרים","לשאול אם יש לדפוס הסבר אמיתי, או שזה סתם מקרה","דרך לצמצם את טעות האקראיות: כשרואים ״דפוס״, לשאול אם יש לו הסבר אמיתי, או שזה סתם מקרה.","לפני שרונית קובעת את כל המבצעים ליום שלישי, היא בודקת אם המכירות באמת גבוהות שם לאורך חודשים, או שזה קרה פעמיים במקרה."],["split","להגדיל את מספר החלופות","יותר אפשרויות מגדילות את הסיכוי למצוא פתרון טוב","כשבודקים רק אפשרות אחת או שתיים, קל להיתקע. כשמכריחים את עצמנו לחשוב על עוד אפשרויות, גדל הסיכוי למצוא פתרון טוב יותר.","במקום לבחור רק בין ״לפתוח בחיפה״ ל״לא לפתוח״, רונית בודקת גם חנות אונליין או שיתוף פעולה עם חנות קיימת."]])}`,q:"b9"}
 ]},
 {id:"t6",icon:"bulb",title:"השפעות, אתיקה ויצירתיות",blocks:[
  {h:"מה משפיע על ההחלטות שלנו",html:`${def("על מה הנושא",`החלטות לא נעשות בחלל ריק: האישיות שלנו, הארגון והתרבות משפיעים עליהן. בנושא נראה גם איך מחליטים באופן אתי, ומה זו יצירתיות.<br><b>מה נלמד כאן:</b> השפעות אישיות וארגוניות · שלושה קריטריונים אתיים · יצירתיות`)}<p><b>הבדלים אישיים:</b></p>${tiles([["chart","שאפתנות (חלק ממצפוניות)","אנשים שואפי הישגים נוטים יותר להסלמת מחויבות, כי הם שונאים להיכשל","אנשים שואפי הישגים שונאים להיכשל, ולכן קשה להם במיוחד להודות שהחלטה שלהם לא עובדת. בגלל זה הם נוטים יותר להסלמת מחויבות.","מנהל שאפתן ממשיך להשקיע בפרויקט שהוא יזם, למרות שהוא מפסיד, כי לסגור אותו מרגיש לו כמו כישלון אישי."],["hand","תחושת חובה","אנשים חדורי תחושת חובה נוטים פחות להסלמה, כי הם עושים מה שטוב לארגון","אנשים עם תחושת חובה חזקה שמים את טובת הארגון לפני הרצון להיראות צודקים, ולכן קל להם יותר לעצור החלטה שלא עובדת.","מנהל עם תחושת חובה חזקה רואה שהפרויקט שהוא יזם מפסיד, ומציע בעצמו להפסיק אותו."],["target","הערכה עצמית גבוהה","משתמשים בהטיה לטובת העצמי כדי לשמור עליה","מי שהערכה עצמית חשובה לו במיוחד משתמש יותר בהטיה לטובת העצמי: מייחס הצלחות לעצמו וכישלונות לנסיבות, כדי לשמור על התמונה הטובה של עצמו.","מוכר שבטוח שהוא ״הכי טוב בסניף״ מסביר כל חודש חלש ב״לקוחות קשים״."],["cycle","מגדר והרהור יתר","נשים נוטות יותר לנתח שוב ושוב בעיות והחלטות (Rumination)"]])}<p><b>אילוצים ארגוניים:</b> הערכת ביצועים, מערכת תגמולים, תקנות פורמליות, לוחות זמנים שהמערכת כופה, ותקדימים היסטוריים (למשל, התקציב של השנה הקודמת קובע את התקציב הנוכחי).</p>`,q:"e3"},
  {h:"שלושה קריטריונים אתיים",html:`${tiles([["chart","תועלתנות",`ההחלטה הטובה היא זו שמביאה את <b>הטוב הגדול ביותר למספר הגדול ביותר</b>. שולטת בעולם העסקים ${E("Utilitarianism")}`,"בודקים את התוצאה: מה יביא הכי הרבה תועלת להכי הרבה אנשים. החיסרון: עלול לפגוע בזכויות של מעטים.","לפטר עובד אחד כדי לשמור על המשרות של עשרים אחרים, כי זה ״הטוב הגדול ביותר״."],["id","זכויות","לכבד ולהגן על זכויות היסוד של כל אדם: פרטיות, חופש ביטוי, הליך הוגן. מגן על חושפי שחיתויות","ההחלטה צריכה לשמור על זכויות היסוד של כל אדם, גם אם זה פחות משתלם. החיסרון: עלול להאט ולפגוע ביעילות.","החברה מגינה על עובדת שדיווחה על זיוף מלאי, ולא מפטרת אותה, אף שהדיווח הזיק לתדמית."],["scales","צדק","לאכוף כללים בהגינות ובאופן שוויוני. למשל, שכר זהה לאותו תפקיד וותק כקריטריון לפיטורים. נפוץ באיגודים מקצועיים","אותם כללים לכולם, באופן שוויוני והוגן. החיסרון: פחות מעודד יוזמה ומצוינות.","שכר זהה לכל המוכרים באותו תפקיד, וקביעה מראש שבפיטורים מתחשבים בוותק."]])}${def("מושג נלווה",`<mark>חושפי שחיתויות</mark> ${E("Whistle-blowers")}: אנשים שמדווחים לגורמים מחוץ לארגון על התנהלות לא אתית של המעסיק.`)}${rem("לכל קריטריון יתרונות וחסרונות: תועלתנות יעילה, אבל עלולה לדרוס זכויות של מיעוטים.")}${ex(`חושפת שחיתויות: רואת חשבון שמגלה שהחברה מזייפת דוחות, ומדווחת לרשות המסים אחרי שההנהלה התעלמה.`)}`,q:"e4"},
  {h:"יצירתיות",html:`${def("מושג מפתח",`<mark>יצירתיות</mark> ${E("Creativity")}: היכולת להפיק רעיונות <b>חדשים ומועילים</b>.`)}<p>לרוב האנשים יש פוטנציאל יצירתי. במחקר על 461 אנשים, פחות מאחוז היו יצירתיים במיוחד, אבל כ-60% היו יצירתיים במידה מסוימת.</p>${fig("venn","המודל התלת-רכיבי: ככל שכל רכיב גבוה יותר, היצירתיות גבוהה יותר")}${ex(`עובד שמציע להפוך את חדר ההמתנה המשעמם בבנק לפינת קפה עם מטענים: רעיון <b>חדש</b> וגם <b>מועיל</b>. רעיון חדש שלא מועיל (לצבוע את הבנק בסגול) הוא לא יצירתיות במובן של הפרק.`)}`,q:"e6"}
 ]}
];
const Q={"p1":{"t":"t1","v":[{"q":"סקר מראה שהשכר בחברה גבוה מהממוצע בענף, אבל רוב העובדים בטוחים שמשלמים להם מעט. לפי הפרק, למה זה חשוב למנהל?","a":"כי העובדים יפעלו לפי מה שהם תופסים, גם אם הנתונים מראים אחרת","w":["כי זה מראה שהסקר לא נערך כראוי, ושצריך לחזור עליו עם מדגם אחר","כי תפיסה שגויה נעלמת מעצמה אחרי שמציגים נתונים","כי שביעות הרצון של עובדים נקבעת בעיקר לפי השכר האובייקטיבי"],"e":"התנהגות נקבעת לפי המציאות הנתפסת. לכן פער בין נתונים לתפיסה הוא בעיה ניהולית אמיתית."},{"q":"איזה משפט מתאר הכי טוב את הקשר בין תפיסה למציאות, לפי הפרק?","a":"התפיסה היא פרשנות, ולכן היא עלולה להיות שונה מהותית מהמציאות","w":["התפיסה משקפת את המציאות, רק בפחות פרטים","התפיסה שונה מהמציאות רק אצל אנשים עם הטיות חריגות","התפיסה והמציאות זהות כשמדובר בעובדות מדידות כמו שכר"],"e":"תפיסה היא ארגון ופרשנות של רשמים, לכן גם לגבי עובדות אנשים יכולים לראות דברים שונים."}]},
"p2":{"t":"t1","v":[{"q":"עובד חדש נראה למנהלת ״מתנשא״ רק כי הוא מזכיר לה עמית שהיא לא סבלה. איזה גורם בתפיסה פועל כאן?","a":"התופס: הניסיון והעמדות של המנהלת","w":["המטרה: התכונות של העובד החדש","המצב: הזמן והמקום של הפגישה","המטרה: הדמיון בין העובד לעמית"],"e":"ההבדל נובע מהניסיון הקודם של המנהלת, כלומר מהתופס. הדמיון ״בא״ ממנה, לא מהעובד."},{"q":"עובד שקט בפגישה רגילה לא מושך תשומת לב. אותו עובד, כשהוא היחיד שלא מדבר בסיעור מוחות רועש, בולט מאוד. מה השתנה?","a":"המצב, שבו העובד מופיע","w":["המטרה, כי העובד שינה את התנהגותו","התופס, כי המנהל שינה את עמדותיו","המטרה, כי השתנה הרקע שלו"],"e":"העובד התנהג אותו דבר, ומי שמסתכל עליו לא השתנה. ההקשר הוא שהשתנה."},{"q":"מועמדת בולטת בראיון כי היא מדברת חזק מאוד ומרבה לצחוק. לאיזה גורם בתפיסה זה שייך?","a":"המטרה: מאפיינים של האדם הנתפס","w":["התופס: הציפיות של המראיין","המצב: שעת הראיון","התופס: מצב הרוח של המראיין"],"e":"מאפיינים כמו קול, התנהגות או מראה של מי שנתפס שייכים ל״מטרה״."}]},
"p3":{"t":"t1","v":[{"q":"שני מנהלים צופים באותו עובד שיוצא מוקדם. האחד חושב ״לא מחויב״, השנייה ״מנהל זמן טוב״. מה ההסבר הטוב ביותר לפי הפרק?","a":"תפיסה נבנית מהפרשנות של כל צופה, ולא רק מההתנהגות עצמה","w":["אחד מהם בהכרח טועה, כי יש רק פרשנות נכונה אחת","ההבדל נובע מהמטרה, כי העובד התנהג אחרת מול כל אחד","זה הבדל במצב, כי הם צפו בו בזמנים שונים"],"e":"אותו גירוי, שני תופסים, שתי פרשנויות. זו בדיוק הנקודה של הפרק."},{"q":"איזה מהבאים הוא דוגמה להשפעה של ״המצב״ על התפיסה?","a":"בדיחה שנשמעת מצחיקה בארוחת צוות נשמעת פוגענית בישיבת הנהלה","w":["מנהל עם ניסיון בסטארט־אפ רואה בכל עובד ״חסר יוזמה״","עובדת עם קול חזק בולטת יותר מאחרות","מראיין שמחפש מועמד ״כמוהו״ מתרשם ממי שדומה לו"],"e":"הבדיחה זהה, אבל ההקשר שונה. האפשרויות האחרות מתארות את התופס או את המטרה."}]},
"p4":{"t":"t1","v":[{"q":"מנהלת רוצה להבין למה הצוות שלה לא מרוצה, למרות תנאים טובים. מה הצעד הנכון ביותר לפי רוח הפרק?","a":"לברר איך העובדים תופסים את התנאים, ולא רק להציג את הנתונים","w":["להציג שוב את הנתונים, כי התפיסה תשתנה מעצמה","להתעלם, כי התנהגות נקבעת לפי התנאים האמיתיים","לשנות את התנאים בלי לשאול, כי תפיסה לא ניתנת למדידה"],"e":"אנשים מגיבים למציאות כפי שהם תופסים אותה, ולכן צריך קודם להבין את התפיסה. הצגה חוזרת של הנתונים לא תעזור, כי תפיסה לא משתנה מעצמה רק בגלל מספרים."},{"q":"מה הקשר בין תפיסה לבין קבלת החלטות, לפי הפרק?","a":"התפיסה קובעת אילו בעיות נראה, איזה מידע נחשב רלוונטי ואילו חלופות נשקול","w":["אין קשר ישיר, כי החלטות טובות מבוססות על נתונים אובייקטיביים בלבד","התפיסה משפיעה רק על השלב האחרון, כשבוחרים בין החלופות שנמצאו","התפיסה משפיעה רק כשמדובר בהחלטות אינטואיטיביות"],"e":"התפיסה משפיעה על כל שלבי ההחלטה: מה נראה לנו כבעיה, איזה מידע נחשב רלוונטי ואילו חלופות נשקול. לכן היא לא משפיעה רק על השלב האחרון של הבחירה."}]},
"a1":{"t":"t2","v":[{"q":"״היא קיבלה את הקידום כי היא עובדת קשה יותר מכולם.״ איזה ייחוס זה, ולמה?","a":"פנימי, כי הסיבה היא משהו שבשליטתה","w":["חיצוני, כי הקידום ניתן לה על ידי אחרים","חיצוני, כי הוא תלוי בהחלטת ההנהלה","פנימי, כי היא מרוצה מהתוצאה"],"e":"עבודה קשה היא מאמץ, גורם שבשליטת האדם, ולכן זה ייחוס פנימי. העובדה שההנהלה נתנה את הקידום לא הופכת את ההסבר לחיצוני: ההסבר עצמו מצביע על המאמץ שלה."},{"q":"מה בדיוק מנסה תורת הייחוס להסביר?","a":"איך אנשים מחליטים אם התנהגות של אחר נובעת ממנו או מהנסיבות","w":["איך אנשים קובעים אם התנהגות של אחר היא מוסרית או לא מוסרית","איך אנשים בוחרים בין כמה חלופות כשאין להם מידע מלא","למה אנשים זוכרים מידע שמתאים לדעה שלהם"],"e":"תורת הייחוס עוסקת בשאלה ״למה הוא עשה את זה?״: בו או בנסיבות."}]},
"a2":{"t":"t2","v":[{"q":"עובדת שתמיד עומדת בלוחות זמנים איחרה היום בהגשת דוח. איזה גורם רלוונטי כאן, ולאן הוא מוביל?","a":"ייחודיות גבוהה, ולכן ייחוס חיצוני","w":["עקביות גבוהה, ולכן ייחוס פנימי","הסכמה נמוכה, ולכן ייחוס פנימי","ייחודיות נמוכה, ולכן ייחוס חיצוני"],"e":"ההתנהגות חריגה אצלה (ייחודיות גבוהה), ולכן סביר לחפש סיבה בנסיבות."},{"q":"מכל הצוות, רק דני לא סיים את ההדרכה בזמן. מה רמת ההסכמה, ולאיזה ייחוס זה מוביל?","a":"הסכמה נמוכה, ולכן ייחוס פנימי","w":["הסכמה גבוהה, ולכן ייחוס חיצוני","ייחודיות גבוהה, ולכן ייחוס חיצוני","עקביות נמוכה, ולכן ייחוס פנימי"],"e":"אחרים באותו מצב התנהגו אחרת, לכן ההסכמה נמוכה והסיבה כנראה בו."}]},
"a3":{"t":"t2","v":[{"q":"נציג שירות צועק על לקוחות כבר חודשים, אבל רק בשיחות טלפון ולא פנים מול פנים, ושאר הנציגים לא צועקים. מה הייחוס הסביר?","a":"פנימי: עקביות גבוהה והסכמה נמוכה","w":["חיצוני: ייחודיות גבוהה מבטלת את שאר הגורמים","חיצוני: הסכמה גבוהה ועקביות נמוכה","אי אפשר לקבוע, כי הגורמים תמיד מבטלים זה את זה"],"e":"שני גורמים מצביעים על ייחוס פנימי: הוא עושה זאת לאורך זמן, ואחרים לא."},{"q":"איזה שילוב יוביל בסבירות הגבוהה ביותר לייחוס חיצוני?","a":"ייחודיות גבוהה, הסכמה גבוהה, עקביות נמוכה","w":["ייחודיות נמוכה, הסכמה נמוכה, עקביות גבוהה","ייחודיות גבוהה, הסכמה נמוכה, עקביות גבוהה","ייחודיות נמוכה, הסכמה גבוהה, עקביות גבוהה"],"e":"התנהגות חריגה אצלו, שכולם עושים במצב הזה, ושלא חוזרת: הכול מצביע על הנסיבות."}]},
"a4":{"t":"t2","v":[{"q":"מנהלת מסבירה את הירידה במכירות של הצוות ב״חוסר מוטיבציה״, למרות שבאותו רבעון נסגר סניף של לקוח גדול. איזו טעות היא עושה?","a":"טעות הייחוס הבסיסית","w":["הטיה לטובת העצמי","אפקט ההילה","הטיית עיגון"],"e":"היא מסבירה התנהגות של אחרים בגורם פנימי (מוטיבציה) ומתעלמת מנסיבות חיצוניות ברורות (לקוח שנסגר). זו טעות הייחוס הבסיסית. הטיה לטובת העצמי נוגעת להסבר של ההצלחות והכישלונות שלך, לא של אחרים."},{"q":"מה מבדיל בין טעות הייחוס הבסיסית לבין ההטיה לטובת העצמי?","a":"הראשונה נוגעת לשיפוט של אחרים, השנייה לשיפוט של עצמי","w":["הראשונה נוגעת להצלחות, והשנייה נוגעת לכישלונות","הראשונה מייחסת לנסיבות, והשנייה מייחסת לאישיות","אין הבדל, אלה שני שמות לאותה הטיה"],"e":"בטעות הבסיסית אנחנו מאשימים את האחר. בהטיה לטובת העצמי אנחנו מגינים על עצמנו."}]},
"a5":{"t":"t2","v":[{"q":"מנהל פרויקט אומר: ״השקתי בזמן כי תכננתי טוב. בפרויקט הקודם איחרנו כי הספק הכשיל אותנו.״ איזו הטיה זו?","a":"הטיה לטובת העצמי","w":["טעות הייחוס הבסיסית","הטיית חוכמה לאחר מעשה","הטיית אישוש"],"e":"הוא מייחס הצלחה לעצמו (תכנון) וכישלון לנסיבות (הספק), וזו ההטיה לטובת העצמי. טעות הייחוס הבסיסית נוגעת לשיפוט של אנשים אחרים, וכאן הוא מסביר את עצמו."},{"q":"לפי הפרק, למה הערכות ביצועים חשופות במיוחד להטיה לטובת העצמי?","a":"כי עובדים מייחסים הצלחות לעצמם וכישלונות לנסיבות, וכך מעריכים את עצמם גבוה מדי","w":["כי מנהלים נוטים להגזים בהשפעת הנסיבות כשהם מעריכים עובדים","כי ההערכה נעשית רק פעם בשנה, ולכן העובד זוכר בעיקר את החודש האחרון","כי עובדים נוטים להמעיט בהצלחות שלהם כדי לא להיראות מתרברבים"],"e":"כשעובד מעריך את עצמו, הוא נוטה לזקוף הצלחות לזכותו ולהטיל כישלונות על גורמים אחרים."}]},
"s1":{"t":"t3","v":[{"q":"עובדת מצטיינת בעבודה מול לקוחות, ולכן המנהל מדרג אותה גבוה גם בניהול תקציב, שבו היא בינונית. מה פעל כאן?","a":"אפקט ההילה","w":["אפקט הניגוד","סטריאוטיפ","תפיסה סלקטיבית"],"e":"תכונה בולטת אחת יצרה רושם כללי שהשפיע על הערכת תחומים אחרים."},{"q":"מה ההבדל בין אפקט ההילה לבין סטריאוטיפ?","a":"בהילה תכונה אחת צובעת את כל השיפוט, בסטריאוטיפ הקבוצה קובעת","w":["בהילה השיפוט תמיד חיובי, ובסטריאוטיפ השיפוט תמיד שלילי","בהילה משווים לאדם שנפגש קודם, ובסטריאוטיפ לא משווים לאף אחד","אין הבדל מהותי, שניהם נובעים מהשוואה לאחרים"],"e":"הילה יוצאת מתכונה של האדם עצמו. סטריאוטיפ יוצא מהשתייכות לקבוצה. שניהם יכולים להיות חיוביים או שליליים."}]},
"s2":{"t":"t3","v":[{"q":"מועמד ממוצע קיבל ציון נמוך כי רואיין מיד אחרי מועמדת מבריקה. מה פעל כאן?","a":"אפקט הניגוד","w":["אפקט ההילה","טעות הייחוס הבסיסית","הטיית עיגון"],"e":"הציון שלו נקבע מההשוואה למועמדת המבריקה שקדמה לו, וזה אפקט הניגוד. באפקט ההילה תכונה אחת של אותו אדם צובעת את כל השיפוט עליו, וכאן ההשפעה הגיעה מאדם אחר."},{"q":"איזה צעד יקטין הכי הרבה את אפקט הניגוד בראיונות?","a":"לדרג כל מועמד מול קריטריונים קבועים לפני שעוברים למועמד הבא","w":["לראיין את כל המועמדים ברצף באותו יום, כדי שההשוואה תהיה הוגנת","לבקש מהמראיין להתרשם מהמועמד כולו ולא מפרטים קטנים","להקדיש יותר זמן לחמש הדקות הראשונות"],"e":"אפקט הניגוד נוצר מהשוואה בין מועמדים. דירוג מול סטנדרט קבוע מצמצם אותה."}]},
"s3":{"t":"t3","v":[{"q":"מנהלת שיווק ומנהל כספים קוראים אותו דוח על ירידה ברווחים. היא רואה בעיית מיתוג, הוא רואה בעיית עלויות. מה ממחיש המקרה?","a":"תפיסה סלקטיבית","w":["אפקט ההילה","הטיית זמינות","סטריאוטיפ"],"e":"כל אחד קולט ומפרש את אותו דוח לפי התחום והרקע שלו, וזו תפיסה סלקטיבית. סטריאוטיפ היה שיפוט של אדם לפי הקבוצה שלו, ולא פרשנות של מידע."},{"q":"מה מבדיל תפיסה סלקטיבית מהטיית אישוש?","a":"סלקטיבית: הרקע קובע מה נקלט. אישוש: מחפשים תמיכה בעמדה קיימת","w":["סלקטיבית שייכת לקבלת החלטות, ואישוש שייך לשיפוט של אנשים","אין הבדל אמיתי, אלה שני שמות לאותה תופעה בתפיסה","סלקטיבית נוגעת לזיכרון של אירועים, ואישוש נוגע לרגשות כלפיהם"],"e":"תפיסה סלקטיבית היא קיצור דרך בתפיסת מצבים ואנשים. הטיית אישוש פועלת אחרי שכבר יש עמדה."}]},
"s4":{"t":"t3","v":[{"q":"מראיין מניח שמועמד בן 55 ״לא יסתדר עם טכנולוגיה״, בלי לשאול אותו. מה זה?","a":"סטריאוטיפ","w":["אפקט ההילה","אפקט הניגוד","תפיסה סלקטיבית"],"e":"המראיין שופט את המועמד לפי קבוצת הגיל שלו ולא לפי מה שהוא באמת יודע, וזה סטריאוטיפ. באפקט ההילה תכונה אחת של המועמד הייתה צובעת את השאר, אבל כאן השיפוט מגיע מהקבוצה."},{"q":"למה סטריאוטיפים מסוכנים במיוחד בארגון, לפי הפרק?","a":"כי הם מובילים להחלטות לא מדויקות ולא הוגנות על אנשים מסוימים","w":["כי הם תמיד שגויים לגבי כל אחד מחברי הקבוצה","כי הם פועלים רק כשאין למנהל מספיק זמן להכיר את העובד","כי הם נוגעים רק למאפיינים גלויים כמו מגדר וגיל"],"e":"סטריאוטיפ חוסך זמן, אבל מוביל להחלטות לא מדויקות ולא הוגנות על אדם ספציפי. הוא לא חייב להיות שגוי לגבי כל חברי הקבוצה. הבעיה היא שמחילים אותו על כל אחד מהם."}]},
"s5":{"t":"t3","v":[{"q":"מנהל הוזהר שהעובד החדש ״בעייתי״, נתן לו משימות פשוטות בלבד, והעובד אכן לא התקדם. איזה תהליך זה ממחיש?","a":"נבואה שמגשימה את עצמה","w":["אפקט ההילה של המזהיר","הטיה לטובת העצמי של המנהל","טעות האקראיות"],"e":"הציפייה הנמוכה גרמה למנהל לתת רק משימות פשוטות, והיחס הזה יצר את הביצוע הנמוך. זו נבואה שמגשימה את עצמה: הציפייה עצמה יצרה את התוצאה, ולא רק השפיעה על איך המנהל ראה אותה."},{"q":"לפי הפרק, מה מאפיין ראיונות עבודה מבחינת תפיסה?","a":"רושם ראשון נוצר מהר, ומידע שלילי בהתחלה שוקל יותר מחיובי","w":["מראיינים משנים דעה בעיקר בסוף הראיון","מידע חיובי בתחילת הראיון שוקל יותר מאשר שלילי","ראיון מובנה מבטל את כל קיצורי הדרך"],"e":"רוב המראיינים מגבשים עמדה בדקות הראשונות, ומידע שלילי מוקדם משפיע במיוחד."}]},
"d1":{"t":"t4","v":[{"q":"צוות קופץ ישר לבחירה בין שלוש הצעות של ספקים, בלי לברר מה בדיוק הבעיה. איזה שלב במודל הרציונלי דילגו עליו?","a":"הגדרת הבעיה","w":["זיהוי קריטריונים להחלטה","הערכת החלופות","יישום ההחלטה"],"e":"המודל מתחיל בהגדרת הבעיה. בלי זה אי אפשר לדעת מה הקריטריונים."},{"q":"איזו הנחה של המודל הרציונלי היא הכי פחות מציאותית בארגון?","a":"שיש למחליט מידע מלא ושהוא מזהה את כל החלופות","w":["שלמחליט יש מטרה ברורה","שאפשר להשוות בין החלופות לפי קריטריונים","שההחלטה צריכה להיות מיושמת"],"e":"במציאות המידע חלקי והיכולת לעבד אותו מוגבלת. זה הבסיס לרציונליות מוגבלת."}]},
"d2":{"t":"t4","v":[{"q":"המכירות יציבות, אבל המתחרה צמח ב-30%. לפי ההגדרה בפרק, האם יש כאן בעיה?","a":"כן, אם הרצוי הוא לשמור על נתח שוק, כי יש פער","w":["לא, כי המכירות של החברה עצמה לא ירדו","לא, כי בעיה קיימת רק כשיש ירידה במספרים של הארגון","כן, אבל רק אחרי שההנהלה כבר החליטה מה לעשות בנידון"],"e":"בעיה היא פער בין מצב נוכחי לרצוי, והתפיסה קובעת אם רואים פער כזה."},{"q":"מה ההבדל בין ״בעיה״ לבין ״החלטה״ לפי הפרק?","a":"בעיה היא פער בין מצב נוכחי לרצוי. החלטה היא בחירה בין חלופות","w":["בעיה היא תמיד מצב שלילי, והחלטה היא תמיד צעד חיובי","החלטה קודמת לבעיה במודל, כי קודם בוחרים ואז בודקים","בעיה נפתרת באינטואיציה, והחלטה מתקבלת בניתוח רציונלי"],"e":"בעיה היא פער בין המצב הנוכחי למצב הרצוי, והחלטה היא הבחירה בין חלופות לסגירת הפער. לכן הבעיה קודמת להחלטה, ולא להפך."}]},
"d3":{"t":"t4","v":[{"q":"מנהלת מחפשת ספק, בודקת שלושה, ובוחרת בשני שעומד בתקציב ובזמנים, בלי לבדוק את השלישי עד הסוף. מה זה?","a":"הסתפקות (רציונליות מוגבלת)","w":["יישום המודל הרציונלי","קבלת החלטות אינטואיטיבית","הסלמת מחויבות"],"e":"היא עוצרת בחלופה הראשונה שהיא ״מספיק טובה״ במקום לבדוק את כולן, וזו הסתפקות שנובעת מרציונליות מוגבלת. במודל הרציונלי היא הייתה בודקת את כל החלופות ובוחרת את הטובה ביותר."},{"q":"מה עמדת הפרק לגבי הסתפקות (Satisficing)?","a":"היא לא תמיד רעה, כי לפעמים העלות של ניתוח מלא גבוהה מהתועלת","w":["היא תמיד טעות, כי היא מוותרת על הפתרון הטוב ביותר","היא מתאימה רק למנהלים חסרי ניסיון שעוד לא למדו לנתח","היא בעצם שם אחר לקבלת החלטות אינטואיטיבית"],"e":"המודל הרציונלי דורש זמן, מידע ואנרגיה. לפעמים תהליך פשוט הגיוני יותר."}]},
"d4":{"t":"t4","v":[{"q":"רופאת מיון ותיקה מרגישה מיד שמטופל ״לא בסדר״, עוד לפני הבדיקות, ומתברר שצדקה. מה נכון לגבי זה לפי הפרק?","a":"זו אינטואיציה שנבנתה מניסיון, והיא יכולה להשלים ניתוח רציונלי","w":["זו הוכחה שאינטואיציה עדיפה תמיד על ניתוח מסודר","זו רציונליות מוגבלת, כי לא היה לה מידע מלא בזמן אמת","זו הטיית זמינות, ולכן אין להסתמך עליה בשום מצב"],"e":"אינטואיציה היא תהליך לא מודע שנבנה מניסיון. אצל מומחים היא משלימה ניתוח."},{"q":"מה הסכנה העיקרית בהסתמכות על אינטואיציה, לפי הפרק?","a":"קשה לדעת מתי תחושת הבטן מדויקת ומתי לא","w":["היא תמיד סותרת את הניתוח הרציונלי","היא מתאימה רק לאנשים בלי ניסיון","היא איטית מדי לרוב ההחלטות"],"e":"האינטואיציה מהירה ויכולה לעזור, אבל אין לה מנגנון מובנה לבדוק את עצמה."}]},
"b1":{"t":"t5","v":[{"q":"מנהל בטוח ב-90% שהפרויקט יסתיים בזמן. לפי הנתונים בפרק, מה סביר?","a":"שהסיכוי האמיתי קרוב יותר ל-50%","w":["שהסיכוי האמיתי אכן כ-90%","שהסיכוי האמיתי גבוה מ-90%","שאי אפשר לדעת, כי ביטחון לא קשור לדיוק"],"e":"לפי הנתונים בפרק, אנשים שבטוחים ב-90% צודקים רק בערך במחצית מהמקרים. זה ביטחון יתר, ולכן הסיכוי האמיתי נמוך בהרבה מ-90%."},{"q":"איזה מהבאים הוא הביטוי הישיר ביותר של ביטחון יתר?","a":"הערכה שהסיכוי לטעות קטן הרבה יותר ממה שהוא באמת","w":["היצמדות למספר הראשון שנאמר במשא ומתן","חיפוש מידע שתומך בהחלטה שכבר התקבלה","המשך השקעה בפרויקט למרות שברור שהוא נכשל"],"e":"ביטחון יתר הוא הערכה שהסיכוי לטעות קטן ממה שהוא באמת. היצמדות למספר הראשון היא עיגון, וחיפוש מידע תומך הוא הטיית אישוש."}]},
"b2":{"t":"t5","v":[{"q":"מוכר דירה מציין מחיר גבוה מאוד, והקונה, שיודע שזה מוגזם, מציע בכל זאת יותר ממה שתכנן. איזו הטיה זו?","a":"עיגון","w":["זמינות","אישוש","ביטחון יתר"],"e":"המספר הראשון הפך לנקודת התייחסות, והתיקון ממנו לא היה מספיק."},{"q":"מה מבדיל עיגון מהטיית אישוש?","a":"בעיגון נתקעים על מידע ראשון. באישוש מחפשים מידע שמחזק עמדה קיימת","w":["בעיגון זוכרים מידע בולט, ובאישוש נתקעים על מידע ראשון","עיגון נוגע לשיפוט אנשים, ואישוש נוגע להערכת מספרים","עיגון קורה רק אחרי ההחלטה, ואישוש קורה רק לפניה"],"e":"שתיהן הטיות מידע, אבל המנגנון שונה: נקודת התחלה מול סינון מידע."}]},
"b3":{"t":"t5","v":[{"q":"מנהלת שהחליטה לגייס מועמד מסוים מבקשת המלצות רק מהממליצים שהוא עצמו נתן. איזו הטיה זו?","a":"הטיית אישוש","w":["הטיית עיגון","הטיית זמינות","הסלמת מחויבות"],"e":"היא פונה רק למקורות שצפויים לתמוך בהחלטה שכבר קיבלה, וזו הטיית אישוש. בעיגון היא הייתה נצמדת למספר או לרושם הראשון, ולא בוחרת מקורות מידע."},{"q":"איזו פעולה תצמצם הכי הרבה הטיית אישוש?","a":"לבקש ממישהו להציג את הטיעונים נגד","w":["לאסוף עוד מידע מאותם מקורות שכבר נבדקו","לקבל את ההחלטה מהר, לפני שההטיה מתחזקת","להסתמך על תחושת הבטן של מקבל ההחלטה"],"e":"הטיית אישוש היא חיפוש מידע שמחזק את מה שכבר חושבים, ולכן הדרך הטובה נגדה היא לבקש במכוון טיעונים נגד. איסוף עוד מידע מאותם מקורות רק יחזק את ההטיה."}]},
"b4":{"t":"t5","v":[{"q":"בהערכה שנתית מנהל מדרג עובד לפי הטעות הבולטת שעשה לפני שבוע, ושוכח את 11 החודשים הטובים. איזו הטיה זו?","a":"זמינות","w":["עיגון","אפקט הניגוד","אישוש"],"e":"הטעות האחרונה טרייה ובולטת בזיכרון, ולכן היא מקבלת משקל גדול מדי. זו הטיית זמינות. בעיגון היה שיפוט שנצמד לנקודת פתיחה, לא למה שקל להיזכר בו."},{"q":"למה הטיית זמינות גורמת לטעות בהערכת סיכונים?","a":"כי מה שקל להיזכר בו נראה שכיח יותר ממה שהוא","w":["כי אנשים זוכרים בעיקר מידע חיובי ומתעלמים מסכנות","כי המספר הראשון קובע את ההערכה","כי אנשים מחפשים מידע שתומך בדעה שכבר יש להם"],"e":"אירועים טריים או דרמטיים קל לשלוף מהזיכרון, ולכן הם נראים שכיחים ממה שהם. ״המספר הראשון קובע״ הוא עיגון, הטיה אחרת."}]},
"b5":{"t":"t5","v":[{"q":"מנכ״ל שיזם מוצר כושל ממשיך להשקיע בו, למרות שמנהל חדש שהגיע הציע לעצור. למה דווקא המנכ״ל נוטה להסלמה?","a":"כי הוא אחראי לכישלון ורוצה להצדיק את ההחלטה","w":["כי יש לו יותר מידע על המוצר מאשר למנהל החדש","כי הוא סובל משנאת סיכון ולכן נמנע משינויים","כי הוא נוטה להטיית חוכמה לאחר מעשה לגבי המוצר"],"e":"הסלמת מחויבות נפוצה במיוחד אצל מי שרואה את עצמו אחראי לכישלון, כי הוא רוצה להצדיק את ההחלטה שלו. המנהל החדש לא קשור להחלטה, ולכן קל לו לעצור. ההבדל לא נובע מכך שלמנכ״ל יש יותר מידע."},{"q":"איזה מצב הוא הדוגמה הטובה ביותר להסלמת מחויבות?","a":"להוסיף תקציב לפרויקט חורג כדי ״לא לבזבז את מה שהושקע״","w":["להמשיך בפרויקט שעומד ביעדים, למרות ביקורת מבחוץ","לבחור בחלופה הראשונה שעומדת בכל הדרישות שהוגדרו","להעדיף רווח בטוח וקטן על פני השקעה מסוכנת ומשתלמת"],"e":"ההשקעה הקודמת לא אמורה לקבוע את ההחלטה הבאה, אבל אצל מי שמסלים היא כן."}]},
"b6":{"t":"t5","v":[{"q":"מנהלת מכירות בטוחה שעסקאות נסגרות טוב יותר כשהיא לובשת ״החולצה עם המזל״. איזו טעות זו?","a":"טעות האקראיות","w":["הטיית זמינות","הטיית חוכמה לאחר מעשה","ביטחון יתר"],"e":"היא מייצרת משמעות מצירוף מקרים, ומאמינה שאפשר לשלוט באירוע אקראי."},{"q":"מה הדרך שהפרק ממליץ להתמודד עם טעות האקראיות?","a":"לשאול אם לדפוס יש הסבר אמיתי, או שזה צירוף מקרים","w":["להיצמד למידע הראשוני שהתקבל ולתקן אותו בהדרגה","להגדיל את מספר החלופות לפני שמחליטים","להתמקד במטרות ולא בתוצאות של פעם קודמת"],"e":"טעות האקראיות היא ייחוס משמעות לצירוף מקרים, ולכן ההמלצה היא לבדוק אם יש לדפוס הסבר אמיתי. הגדלת מספר החלופות היא המלצה נגד הטיות אחרות, לא נגד זו."}]},
"b7":{"t":"t5","v":[{"q":"מנהל בוחר בספק מוכר עם רווח בטוח של 100,000 ₪, במקום ספק חדש עם סיכוי טוב לרווח של 200,000 ₪ ותוחלת גבוהה יותר. איזו הטיה זו?","a":"שנאת סיכון","w":["הסלמת מחויבות","הטיית עיגון","הטיית אישוש"],"e":"הוא מעדיף רווח ודאי על פני חלופה עם תוחלת גבוהה יותר, וזו שנאת סיכון. בהסלמת מחויבות הוא היה ממשיך להשקיע במשהו שנכשל, ופה אין כישלון קודם."},{"q":"לפי הפרק, מתי שנאת סיכון יכולה לפגוע בארגון?","a":"כשמוותרים על הזדמנויות משתלמות רק כי אינן ודאיות","w":["כשמנהלים ממשיכים להשקיע בפרויקט שכבר נכשל","כשמנהלים בטוחים מדי בהערכות שלהם לגבי העתיד","כשמנהלים נצמדים לתקציב של השנה שעברה בלי לבדוק"],"e":"שנאת סיכון פוגעת בארגון כשהוא מוותר על הזדמנויות משתלמות רק כי הן לא ודאיות, ועלולה לעצור חדשנות. המשך השקעה בפרויקט כושל הוא הסלמת מחויבות."}]},
"b8":{"t":"t5","v":[{"q":"אחרי שמוצר נכשל, חבר הנהלה אומר: ״היה ברור מההתחלה שזה לא יעבוד״, למרות שהצביע בעדו. איזו הטיה זו?","a":"חוכמה לאחר מעשה","w":["הטיה לטובת העצמי","טעות האקראיות","הטיית אישוש"],"e":"אחרי שהתוצאה ידועה, נראה לו שהיה אפשר לצפות אותה מראש, וזו חוכמה לאחר מעשה. הטיה לטובת העצמי הייתה מתבטאת בהטלת האשמה על אחרים, ולא בתחושה ש״ידענו מראש״."},{"q":"למה הטיית חוכמה לאחר מעשה פוגעת בלמידה של ארגון?","a":"כי היא מסתירה כמה ההחלטה הייתה באמת לא ודאית, ולכן לא לומדים ממנה","w":["כי היא גורמת לאנשים להיצמד למספר הראשון שנאמר בדיון","כי היא גורמת למנהלים להמשיך להשקיע בפרויקטים כושלים","כי היא מגבירה את הפחד מסיכון בהחלטות הבאות של הארגון"],"e":"אם נדמה ש״ידענו מראש״, לא בודקים מה באמת השתבש ולא לומדים מההחלטה. המסיח על המשך השקעה בפרויקט כושל מתאר הסלמת מחויבות."}]},
"b9":{"t":"t5","v":[{"q":"צוות הנהלה רוצה לצמצם הטיות לפני החלטה גדולה. איזה צעד מבין אלה לא מופיע בהמלצות הפרק?","a":"להחליט מהר כדי לא לתת להטיות זמן לפעול","w":["להתמקד במטרות ברורות","לחפש באופן פעיל מידע שסותר את העמדה","להגדיל את מספר החלופות שנבחנות"],"e":"הפרק ממליץ להתמקד במטרות, לחפש מידע סותר, לא לייצר משמעות מצירופי מקרים ולהגדיל את החלופות."},{"q":"למה הגדלת מספר החלופות עוזרת נגד הטיות?","a":"כי יותר אפשרויות מחלישות היצמדות לרעיון אחד","w":["כי כך אפשר לוותר על הגדרת הבעיה ולעבור ישר לפתרונות","כי היא מבטלת את הצורך לאסוף מידע על כל חלופה לעומק","כי היא מקצרת את זמן ההחלטה ומונעת מההטיות להתפתח"],"e":"כשיש רק חלופה אחת או שתיים, קל להינעל עליהן. עוד חלופות מחלישות את ההיצמדות לרעיון אחד. הגדלת החלופות לא מבטלת את הצורך לבדוק כל אחת מהן."}]},
"e1":{"t":"t6","v":[{"q":"שני מנהלים מובילים פרויקט כושל. אחד שואף הישגים, השנייה חדורת תחושת חובה. לפי הפרק, מי נוטה יותר להסלים?","a":"המנהל שואף ההישגים, כי הוא שונא להיכשל","w":["המנהלת חדורת החובה, כי היא מחויבת לפרויקט","שניהם באותה מידה","אף אחד, כי מצפוניות מונעת הסלמה"],"e":"שאפתנות מגבירה הסלמה. תחושת חובה מקטינה אותה, כי המטרה היא טובת הארגון."},{"q":"איך הערכה עצמית גבוהה משפיעה על פרשנות של כישלון?","a":"מגבירה ייחוס של הכישלון לנסיבות","w":["מגבירה לקיחת אחריות אישית על הכישלון","גורמת להרהור יתר ולניתוח חוזר של הכישלון","מפחיתה את כל ההטיות, כי האדם בטוח בעצמו"],"e":"אנשים עם הערכה עצמית גבוהה משתמשים בהטיה לטובת העצמי כדי להגן עליה."}]},
"e2":{"t":"t6","v":[{"q":"לפי הפרק, מה מאפיין הרהור יתר (Rumination)?","a":"ניתוח חוזר של בעיות, לפני ההחלטה ואחריה","w":["החלטה מהירה בלי ניתוח מקדים","היצמדות למספר הראשון שנאמר","המשך השקעה בהחלטה שכבר נכשלה"],"e":"הרהור יתר הוא חזרה שוב ושוב על הבעיה. נמצא שנשים נוטות לכך יותר."},{"q":"איזה הבדל בין המינים בקבלת החלטות מתואר בפרק?","a":"נשים נוטות יותר להרהור יתר על בעיות והחלטות","w":["גברים נוטים יותר להרהור יתר על החלטות","נשים נוטות יותר להסלמת מחויבות בפרויקטים","לא נמצאו הבדלים בין המינים בקבלת החלטות"],"e":"הפרק מציין שנשים נוטות יותר להרהור יתר, כלומר לנתח בעיות והחלטות שוב ושוב. המסיח הראשון הופך את המינים."}]},
"e3":{"t":"t6","v":[{"q":"מנהלת יודעת שספק חדש עדיף, אבל נוהל החברה מחייב לבחור מרשימה מאושרת. איזה אילוץ ארגוני זה?","a":"תקנות פורמליות","w":["תקדימים היסטוריים","מערכת תגמולים","לוחות זמנים שהמערכת כופה"],"e":"נוהל כתוב שמחייב בחירה מרשימה מאושרת הוא תקנה פורמלית שמגבילה את החלופות. תקדים היסטורי היה ״ככה עשינו בפעם הקודמת״, כלל לא כתוב."},{"q":"מנהלים נמנעים מהחלטות מסוכנות כי הבונוס שלהם תלוי רק ב״אפס תקלות״. איזה אילוץ פועל כאן?","a":"מערכת התגמולים","w":["הערכת ביצועים","תקדימים היסטוריים","תקנות פורמליות"],"e":"הבונוס תלוי ב״אפס תקלות״, ולכן מערכת התגמולים מעודדת הימנעות מסיכון. הערכת ביצועים קרובה, אבל כאן מה שמניע את ההתנהגות הוא התגמול עצמו."}]},
"e4":{"t":"t6","v":[{"q":"חברה סוגרת מפעל שמעסיק 200 עובדים, כי זה ישפר את הרווח לאלפי בעלי מניות. לפי איזה קריטריון אתי זו החלטה מוצדקת, ומה החיסרון שלו?","a":"תועלתנות, אבל היא עלולה לדרוס את הזכויות של המיעוט","w":["צדק, אבל הוא איטי ולא יעיל בארגונים גדולים","זכויות, אבל הוא פוגע ביעילות של הארגון","תועלתנות, אבל היא כמעט לא נפוצה בעסקים"],"e":"תועלתנות מחפשת את הטוב למספר הגדול ביותר, ובכך עלולה לפגוע בקבוצה קטנה."},{"q":"עובד מדווח לרשות חיצונית על הסתרת ליקויי בטיחות. איזה קריטריון אתי מצדיק להגן עליו?","a":"זכויות","w":["תועלתנות","צדק","הסתפקות"],"e":"קריטריון הזכויות מגן על חופש הביטוי ועל הליך הוגן, ולכן על חושפי שחיתויות."}]},
"e5":{"t":"t6","v":[{"q":"עובד מציע לשנות את צבע הלוגו לסגול זוהר, ״כדי לרענן״, בלי סיבה עסקית. לפי ההגדרה בפרק, האם זו יצירתיות?","a":"לא במלואה, כי הרעיון חדש אבל לא בהכרח מועיל","w":["כן, כי כל רעיון חדש הוא יצירתיות לפי הפרק","כן, כי הצעה כזו דורשת אומץ וחשיבה שונה","לא, כי יצירתיות שייכת רק לתחומי האמנות"],"e":"לפי הפרק, יצירתיות היא רעיון שהוא גם חדש וגם מועיל. הרעיון חדש, אבל בלי סיבה עסקית הוא לא בהכרח מועיל, ולכן ״כל רעיון חדש הוא יצירתיות״ שגוי."},{"q":"מה מצא המחקר על 461 אנשים לגבי יצירתיות?","a":"מעטים יצירתיים במיוחד, אבל לרובם יש פוטנציאל","w":["רוב האנשים שנבדקו נמצאו יצירתיים במיוחד","יצירתיות נמצאה רק אצל כאחוז אחד מהאנשים","נמצא שיצירתיות לא קשורה כלל למוטיבציה"],"e":"פחות מאחוז היו יצירתיים במיוחד, וכ-60% יצירתיים במידה מסוימת."}]},
"e6":{"t":"t6","v":[{"q":"מעצבת מוכשרת עם ידע רב מקבלת משימה שהיא לא מתעניינת בה, ומגישה רעיון בינוני. איזה רכיב במודל חסר כנראה?","a":"מוטיבציה פנימית למשימה","w":["מומחיות","כישורי חשיבה יצירתית","תקנות פורמליות"],"e":"יש לה מומחיות וכישורים, אבל בלי עניין במשימה היצירתיות נפגעת."},{"q":"מהנדס סקרן שאוהב לשבור מוסכמות מציע רעיונות מקוריים, אבל רובם לא ישימים כי הוא לא מכיר את התחום. איזה רכיב חסר?","a":"מומחיות","w":["מוטיבציה פנימית","כישורי חשיבה יצירתית","אינטואיציה"],"e":"מומחיות היא הבסיס. בלי ידע בתחום, רעיונות מקוריים לא הופכים למועילים."}]},
"h1":{"t":"t2","v":[{"q":"עובד מאחר רק היום, וגם רוב העובדים איחרו בגלל פקק. אבל הוא מאחר כבר חודש. איך לייחס את האיחור?","a":"ייחודיות והסכמה: נסיבות; עקביות גבוהה: הוא עצמו","w":["כל שלושת הגורמים מצביעים כאן על הנסיבות","כל שלושת הגורמים מצביעים כאן על האדם עצמו","ייחודיות מצביעה עליו עצמו, והסכמה ועקביות מצביעות על הנסיבות"],"e":"עקביות היא ההפוכה: גבוהה = פנימי. ייחודיות והסכמה גבוהות = חיצוני. כאן הסימנים מעורבים."}]},
"h2":{"t":"t2","v":[{"q":"מנהלת אומרת שהנציג נכשל כי הוא עצלן, למרות שהמתחרה הוריד מחירים. איזו הטיה זו?","a":"טעות הייחוס הבסיסית","w":["הטיה לטובת העצמי של המנהלת","אפקט ההילה","הטיית אישוש"],"e":"כששופטים אחרים מגזימים באישיות וממעיטים בנסיבות. הטיה לטובת העצמי נוגעת להצלחות ולכישלונות שלי."}]},
"h3":{"t":"t3","v":[{"q":"מראיינת פגשה מועמד חלש מאוד, ואחריו מועמד בינוני שנראה לה מצוין. מה הקיצור?","a":"אפקט הניגוד","w":["אפקט ההילה","תפיסה בררנית","סטריאוטיפ"],"e":"שיפוט ביחס למי שבא קודם. הילה = תכונה אחת צובעת את כל הרושם."}]},

a":"לחפש מידע שסותר","w":["להחליט מהר יותר","לסמוך על אינטואיציה","לבדוק פחות אפשרויות"],"e":"עוד דרכים: להתמקד במטרות ולהגדיל את מספר האפשרויות."}]},"h18":{"t":"t6","v":[{"q":"מי צפוי ליפול יותר בהסלמת מחויבות?","a":"שואף הישגים","w":["בעל תחושת חובה חזקה","בעל הערכה עצמית נמוכה","מי שמרהר הרבה"],"e":"הוא שונא להיכשל. תחושת חובה מקטינה הסלמה."}]},"h19":{"t":"t6","v":[{"q":"מנהל רוצה לפטר עובד אחד כדי לחסוך לחברה ולשמור על משרות של עשרים אחרים. איזה קריטריון אתי זה?","a":"תועלתנות","w":["זכויות","צדק","יצירתיות"],"e":"הטוב הגדול ביותר למספר הגדול ביותר. החיסרון: עלולה לדרוס זכויות של מיעוט."}]},"h20":{"t":"t6","v":[{"q":"חברה מגינה על עובדת שדיווחה החוצה על זיוף מלאי. איזה קריטריון אתי מצדיק זאת?","a":"זכויות","w":["תועלתנות","צדק","שנאת סיכון"],"e":"זכויות היסוד כוללות פרטיות, חופש ביטוי והליך הוגן."}]},"h21":{"t":"t6","v":[{"q":"מוכר מציע לצבוע את החנות בסגול זוהר. הרעיון חדש, אבל לא מועיל. האם זו יצירתיות לפי הפרק?","a":"לא, כי יצירתיות היא חדש וגם מועיל","w":["כן, כי כל רעיון חדש הוא יצירתי","כן, אם יש לו מוטיבציה פנימית","לא, כי רק מנהלים יכולים להיות יצירתיים"],"e":"לפי המודל התלת־רכיבי: מומחיות, כישורי חשיבה יצירתית ומוטיבציה פנימית."}]}};
const SUM=`<h2>סיכום: תפיסה וקבלת החלטות</h2>
<div class="key"><b>על מה מדובר?</b> שני אנשים רואים את אותו מצב ומבינים אותו אחרת לגמרי. הסיבה: אנחנו לא פועלים לפי המציאות עצמה, אלא לפי <b>איך שאנחנו תופסים אותה</b>. הפרק בנוי משני חלקים שקשורים זה לזה. בחלק הראשון: איך אנחנו <b>תופסים ושופטים אנשים</b> (למה הוא התנהג כך? איזה רושם הוא עושה?), ואיפה אנחנו טועים באופן קבוע. בחלק השני: איך אנחנו <b>מקבלים החלטות</b>, ואיך אותן טעויות תפיסה מובילות להחלטות לא טובות. בסוף: איך מחליטים באופן אתי ויצירתי.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>תפיסה</b></td><td>ארגון ופירוש של מה שקלטנו בחושים, כדי לתת לו משמעות.</td></tr>
<tr><td><b>ייחוס</b></td><td>ההסבר שנותנים להתנהגות: סיבה פנימית או חיצונית.</td></tr>
<tr><td><b>אפקט ההילה</b></td><td>תכונה אחת צובעת את כל הרושם מהאדם.</td></tr>
<tr><td><b>רציונליות מוגבלת</b></td><td>מחליטים עם מידע ויכולת מוגבלים, ובוחרים ב״מספיק טוב״.</td></tr>
<tr><td><b>הסלמת מחויבות</b></td><td>ממשיכים בהחלטה למרות ראיות שהיא שגויה.</td></tr>
<tr><td><b>יצירתיות</b></td><td>היכולת להפיק רעיונות חדשים וגם מועילים.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: רונית, מנהלת המכירות ב״עץ ודני״</h3>
<p>רונית מנהלת את צוות המכירות בחברת הרהיטים ״עץ ודני״. במהלך הסיכום נראה אותה שופטת עובדים, מראיינת מועמדים ומחליטה אם לפתוח סניף חדש. בכל שלב נראה איזה מושג מהפרק פועל עליה.</p>

<h3>1. מהי תפיסה, ולמה היא חשובה בארגון</h3>
<p><b>תפיסה</b> היא התהליך שבו אדם <b>מארגן ומפרש</b> את מה שקלט בחושים, כדי לתת לזה משמעות. מה שאנחנו תופסים יכול להיות שונה מאוד מהמציאות. לכן כמעט אין ארגון שבו כל העובדים מסכימים שהשכר וההנהלה מצוינים, גם כשזה נכון.</p>
<p>דוגמה: רונית קוראת לשני מוכרים לשיחה. אחד חושב ״כנראה רוצים לקדם אותי״, והשני חושב ״אני בצרות״. אותה הזמנה, שתי תפיסות שונות, ושתי תגובות שונות.</p>
<p><b>מה גורם להבדלים בתפיסה? שלושה מקורות:</b></p>
<ul>
<li><b>התופס עצמו:</b> העמדות, המניעים, הציפיות והניסיון שלו. מוכר שפוטר בעבר יפרש שיחה כאיום.</li>
<li><b>המטרה (מה שנתפס):</b> דברים חריגים, קרובים או בולטים מושכים תשומת לב.</li>
<li><b>המצב:</b> הזמן, המקום וההקשר. אדם בחליפה מהודרת לא יבלוט במסיבה בלילה, אבל יבלוט מאוד בשיעור בשמונה בבוקר. הוא לא השתנה, המצב השתנה.</li>
</ul>

<h3>2. תורת הייחוס: ״למה הוא עשה את זה?״</h3>
<p>כשאנחנו רואים מישהו מתנהג, אנחנו מנסים להבין <b>למה</b>. <b>תורת הייחוס</b> שואלת אם אנחנו מייחסים את ההתנהגות ל<b>סיבה פנימית</b> (משהו בו, בשליטתו) או ל<b>סיבה חיצונית</b> (הנסיבות).</p>
<p>יוסי, נהג המשלוחים של ״עץ ודני״, איחר היום ללקוח. רונית צריכה להחליט: הוא לא אחראי (פנימי), או שהיה פקק (חיצוני)? כדי להחליט, היא בודקת (בלי לשים לב) שלושה דברים:</p>
<div class="tw"><table><tr><th>גורם</th><th>השאלה של רונית</th><th>אם התשובה ״כן״ (גבוה)</th></tr>
<tr><td><b>ייחודיות</b></td><td>האם יוסי מאחר רק במשלוח הזה, או גם בדברים אחרים?</td><td>חריג אצלו ← כנראה הנסיבות (חיצוני)</td></tr>
<tr><td><b>הסכמה</b></td><td>האם גם שאר הנהגים איחרו היום?</td><td>כולם איחרו ← כנראה פקק (חיצוני)</td></tr>
<tr><td><b>עקביות</b></td><td>האם יוסי מאחר כבר שבועות?</td><td>קורה כל הזמן ← כנראה הוא (פנימי)</td></tr></table></div>
<p><b>טריק לזיכרון:</b> עקביות היא ״ההפוכה״. ייחודיות והסכמה גבוהות מצביעות על הנסיבות; עקביות גבוהה מצביעה על האדם.</p>
<p><b>שתי טעויות נפוצות בייחוס:</b></p>
<ul>
<li><b>טעות הייחוס הבסיסית:</b> כשאנחנו שופטים <b>אחרים</b>, אנחנו מגזימים באישיות וממעיטים בנסיבות. רונית בטוחה שהמכירות של מוכר מסוים ירדו כי הוא ״עצלן״, ומתעלמת מכך שהמתחרה הוריד מחירים.</li>
<li><b>הטיה לטובת העצמי:</b> כשמדובר ב<b>עצמנו</b>, ההצלחות בזכותנו והכישלונות בגלל הנסיבות. כשהצוות של רונית מצליח, זה בזכות הניהול שלה; כשהוא נכשל, זה בגלל השוק.</li>
</ul>

<h3>3. קיצורי דרך בשיפוט אנשים</h3>
<p>אין לנו זמן לבדוק לעומק כל אדם, ולכן המוח משתמש ב״קיצורי דרך״. הם חוסכים זמן, אבל גורמים לטעויות. נראה את רונית מראיינת מועמדים לתפקיד מוכר:</p>
<ul>
<li><b>תפיסה בררנית:</b> רואים בעיקר מה שמתאים לעניין ולרקע שלנו. רונית, שבאה ממכירות, שמה לב בעיקר לכישורי השכנוע של המועמד ומפספסת שהוא לא מבין ברהיטים.</li>
<li><b>אפקט ההילה:</b> תכונה אחת צובעת את כל הרושם. המועמד חייכן ונעים, ולכן היא מניחה שהוא גם אחראי ומקצועי.</li>
<li><b>אפקט הניגוד:</b> שופטים לפי מי שבא קודם. אחרי מועמד גרוע מאוד, מועמד בינוני נראה לה מצוין.</li>
<li><b>סטריאוטיפ:</b> שופטים לפי הקבוצה. ״מועמד צעיר בטח לא יציב.״</li>
</ul>
<p><b>איפה זה פוגש אותנו בארגון:</b></p>
<ul>
<li><b>ראיונות:</b> הרושם נקבע בדקות הראשונות, ומידע שלילי בהתחלה שוקל יותר. רוב המראיינים כמעט לא משנים דעה אחרי 4–5 דקות.</li>
<li><b>אפקט פיגמליון (נבואה שמגשימה את עצמה):</b> אם רונית מצפה הרבה מעובד חדש, היא משקיעה בו, נותנת לו לקוחות טובים, והוא באמת מצליח. אם היא מצפה מעט, קורה ההפך.</li>
<li><b>הערכת ביצועים:</b> כל ההטיות נכנסות להערכה, ולפעמים ההערכה מלמדת יותר על המעריך מאשר על העובד.</li>
</ul>

<h3>4. איך מקבלים החלטות: שלושה מודלים</h3>
<p>עכשיו עוברים מ״איך אנחנו תופסים״ ל״איך אנחנו מחליטים״. החיבור: התפיסה משפיעה על כל שלב בהחלטה, מה נחשב בעיה, איזה מידע נראה חשוב ואילו אפשרויות בכלל עולות לנו בראש.</p>
<p>שני מושגים: <b>בעיה</b> = פער בין המצב הקיים לרצוי. <b>החלטה</b> = בחירה בין שתי אפשרויות או יותר. הבעיה של רונית: המכירות בצפון ירדו ב־20%. ההחלטה: להוריד מחירים, להגדיל פרסום, או לפתוח סניף בחיפה.</p>
<div class="tw"><table><tr><th>מודל</th><th>מה הוא אומר</th><th>רונית</th></tr>
<tr><td><b>רציונלי</b></td><td>איך <b>צריך</b> להחליט: לאסוף את כל המידע, לבדוק את כל האפשרויות בלי הטיה, ולבחור את הטובה ביותר</td><td>הייתה צריכה לבדוק כל עיר אפשרית, כל מחיר וכל קמפיין. במציאות זה כמעט לא קורה</td></tr>
<tr><td><b>רציונליות מוגבלת</b></td><td>איך מחליטים <b>באמת</b>: היכולת לעבד מידע מוגבלת, ולכן בונים תמונה פשוטה, בודקים אפשרויות קרובות, ועוצרים בראשונה ש״מספיק טובה״ (<b>הסתפקות</b>)</td><td>היא בודקת שתי ערים קרובות ובוחרת בחיפה, כי היא ״מספיק טובה״</td></tr>
<tr><td><b>אינטואיציה</b></td><td>תהליך לא מודע, מהיר, שנבנה מניסיון רב</td><td>אחרי 15 שנה במכירות היא ״מרגישה״ שחיפה תעבוד, עוד לפני שהיא יודעת להסביר</td></tr></table></div>
<p>הסתפקות היא לא בהכרח רעה: המודל הרציונלי דורש המון זמן ומידע. ואינטואיציה יכולה להשלים ניתוח אצל אנשים מנוסים, אבל לא כדאי לסמוך עליה לבד, כי קשה לדעת מתי היא צודקת.</p>

<h3>5. הטיות בהחלטות</h3>
<p>גם אנשים חכמים טועים בהחלטות, ובאופן צפוי. יש הטיות שקשורות ל<b>מידע</b> שאנחנו אוספים, והטיות שקשורות ל<b>החלטה עצמה</b>:</p>
<p><b>הטיות במידע:</b></p>
<ul>
<li><b>ביטחון יתר:</b> אנשים שבטוחים ב־90% צודקים בערך ב־50% מהמקרים. רונית בטוחה לגמרי שחיפה תצליח.</li>
<li><b>עיגון:</b> נתקעים על המספר הראשון. במשא ומתן על שכירות בחיפה, המחיר הראשון שהמשכיר אמר קובע את כל ההמשך.</li>
<li><b>אישוש:</b> מחפשים רק מידע שמאשר את מה שכבר החלטנו. רונית קוראת רק כתבות על ״הפריחה בחיפה״.</li>
<li><b>זמינות:</b> שופטים לפי מה שקל להיזכר בו. חברה שלה פתחה חנות מצליחה בחיפה, ולכן נראה לה שזה תמיד מצליח.</li>
</ul>
<p><b>הטיות בהחלטה עצמה:</b></p>
<ul>
<li><b>הסלמת מחויבות:</b> ממשיכים בהחלטה למרות ראיות שהיא שגויה (״זורקים כסף טוב אחרי כסף רע״). הסניף מפסיד שנה, ורונית משקיעה בו עוד, כי היא מרגישה אחראית ורוצה להוכיח שצדקה.</li>
<li><b>טעות האקראיות:</b> מאמינים שאפשר לחזות דברים מקריים (״אנחנו תמיד מוכרים יותר בימי שלישי״).</li>
<li><b>שנאת סיכון:</b> מעדיפים רווח בטוח ובינוני על פני סיכון עם תוחלת גבוהה יותר.</li>
<li><b>חוכמה לאחר מעשה:</b> אחרי שהסניף נכשל, כולם ״ידעו מראש״.</li>
</ul>
<p><b>איך מצמצמים הטיות:</b> להתמקד במטרות (בלי מטרה אי אפשר לדעת מה רלוונטי), <b>לחפש בכוונה מידע שסותר</b> (הדרך היעילה ביותר נגד ביטחון יתר, אישוש וחוכמה לאחר מעשה), לא לייצר משמעות מצירופי מקרים, ולהגדיל את מספר האפשרויות שבודקים.</p>

<h3>6. מה עוד משפיע על ההחלטות: אישיות וארגון</h3>
<ul>
<li><b>שאפתנות:</b> אנשים שואפי הישגים נוטים יותר להסלמת מחויבות, כי הם שונאים להיכשל.</li>
<li><b>תחושת חובה:</b> אנשים עם תחושת חובה חזקה נוטים <b>פחות</b> להסלמה, כי הם עושים מה שטוב לארגון.</li>
<li><b>הערכה עצמית גבוהה:</b> משתמשים בהטיה לטובת העצמי כדי לשמור עליה.</li>
<li><b>מגדר:</b> נשים נוטות יותר ל<b>הרהור יתר</b>, כלומר לנתח שוב ושוב בעיות והחלטות.</li>
<li><b>אילוצי הארגון:</b> שיטת הערכת הביצועים, התגמולים, הנהלים, לוחות הזמנים והתקדימים (התקציב של השנה שעברה קובע את הנוכחי).</li>
</ul>

<h3>7. החלטות אתיות ויצירתיות</h3>
<p>רונית מגלה שמנהל המחסן מזייף מלאי. איך מחליטים מה נכון? הפרק מציג <b>שלושה קריטריונים אתיים</b>:</p>
<div class="tw"><table><tr><th>קריטריון</th><th>מה הוא אומר</th><th>יתרון / חיסרון</th></tr>
<tr><td><b>תועלתנות</b></td><td>הטוב הגדול ביותר למספר הגדול ביותר</td><td>יעילה ושולטת בעסקים, אבל עלולה לדרוס זכויות של מיעוט</td></tr>
<tr><td><b>זכויות</b></td><td>להגן על זכויות היסוד של כל אדם: פרטיות, חופש ביטוי, הליך הוגן</td><td>מגן על <b>חושפי שחיתויות</b> (מי שמדווח החוצה על התנהלות לא אתית)</td></tr>
<tr><td><b>צדק</b></td><td>לאכוף כללים בהגינות ובשוויון</td><td>למשל שכר זהה לאותו תפקיד; נפוץ באיגודים מקצועיים</td></tr></table></div>
<p><b>יצירתיות</b> היא היכולת להפיק רעיונות <b>חדשים וגם מועילים</b>. רעיון חדש שלא מועיל (לצבוע את החנות בסגול זוהר) הוא לא יצירתיות במובן של הפרק. לרוב האנשים יש פוטנציאל יצירתי: במחקר על 461 אנשים, פחות מאחוז היו יצירתיים במיוחד, אבל כ־60% היו יצירתיים במידה מסוימת. לפי <b>המודל התלת־רכיבי</b>, היצירתיות עולה ככל ששלושה רכיבים גבוהים יותר: <b>מומחיות</b> בתחום, <b>כישורי חשיבה יצירתית</b>, ו<b>מוטיבציה פנימית</b> למשימה.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. אנחנו פועלים לפי <b>התפיסה</b> שלנו, לא לפי המציאות, והתפיסה מושפעת מהתופס, מהמטרה ומהמצב.<br>
2. לפי <b>תורת הייחוס</b>, ייחודיות, הסכמה ועקביות קובעות אם נסביר התנהגות בסיבה פנימית או חיצונית; ויש טעויות קבועות (טעות הייחוס הבסיסית, הטיה לטובת העצמי).<br>
3. <b>קיצורי דרך</b> כמו תפיסה בררנית, הילה, ניגוד וסטריאוטיפ חוסכים זמן אבל מטעים, בראיונות ובהערכות; ופיגמליון משנה ביצוע בפועל.<br>
4. המודל ה<b>רציונלי</b> מתאר איך צריך להחליט; בפועל מחליטים ב<b>רציונליות מוגבלת</b> ובאינטואיציה, ונופלים ב<b>הטיות</b> צפויות.<br>
5. החלטות אתיות נשענות על <b>תועלתנות, זכויות וצדק</b>, ויצירתיות תלויה במומחיות, בכישורי חשיבה ובמוטיבציה פנימית.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לקבוע ייחוס פנימי או חיצוני לפי שלושת הגורמים.<br>
• לזהות קיצור דרך או הטיה בתרחיש.<br>
• להבחין בין המודל הרציונלי, הרציונליות המוגבלת והאינטואיציה.<br>
• לומר איך מצמצמים הטיות, ומה באישיות משפיע עליהן.<br>
• לשייך החלטה לקריטריון אתי, ולמנות את רכיבי היצירתיות.</div>
<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>עקביות גבוהה = סיבה פנימית.</b> ייחודיות והסכמה גבוהות = סיבה חיצונית. זה הכלל שהכי קל להפוך.</li>
<li><b>טעות הייחוס הבסיסית נוגעת לשיפוט אחרים</b>; ההטיה לטובת העצמי נוגעת לשיפוט עצמנו.</li>
<li><b>אפקט הילה ≠ אפקט ניגוד:</b> הילה = תכונה אחת צובעת את האדם; ניגוד = השוואה למי שבא לפניו.</li>
<li><b>פיגמליון משנה את הביצוע בפועל</b>; הטיית אישוש משנה רק את הפרשנות שלנו.</li>
<li><b>המודל הרציונלי מתאר איך צריך להחליט</b>, לא איך מחליטים בפועל (זה הרציונליות המוגבלת).</li>
<li><b>שאפתנות מגבירה הסלמה; תחושת חובה מקטינה אותה.</b></li>
</ul></div>`;

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function checkBox(t,bi){
