<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: תפיסה וקבלת החלטות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>
</head>

<script>

const I={

};
const ic=(k,cls="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${I[k]}</svg>`;

const arrowDef=id=>`<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-c"/></marker></defs>`;

const FIG={
 factors:()=>{const g=[[318,64,"התופס",["עמדות ומניעים","תחומי עניין","ניסיון וציפיות"]],[82,64,"המטרה",["חידוש, תנועה, קולות","גודל ורקע","קרבה ודמיון"]],[200,210,"המצב",["זמן","סביבת עבודה","סביבה חברתית"]]];
  return `<svg viewBox="0 0 400 262" role="img" aria-label="שלושה גורמים שמשפיעים על התפיסה">${arrowDef("fa")}

const attribTable=`<div class="tblwrap"><table class="tbl"><thead><tr><th>הגורם</th><th>גבוה ←</th><th>נמוך ←</th></tr></thead><tbody>
<tr><td><b>ייחודיות</b> ${E("Distinctiveness")}<br><span class="muted" style="font-size:.85rem">האם ההתנהגות חריגה אצלו?</span></td><td class="out">חיצוני</td><td class="in">פנימי</td></tr>
<tr><td><b>הסכמה</b> ${E("Consensus")}<br><span class="muted" style="font-size:.85rem">האם כולם מתנהגים כך באותו מצב?</span></td><td class="out">חיצוני</td><td class="in">פנימי</td></tr>
<tr><td><b>עקביות</b> ${E("Consistency")}<br><span class="muted" style="font-size:.85rem">האם הוא מתנהג כך לאורך זמן?</span></td><td class="in">פנימי</td><td class="out">חיצוני</td></tr></tbody></table></div>`;

const T=[
 {id:"t1",icon:"target",title:"מהי תפיסה",blocks:[
  {h:"העולם כפי שאנחנו רואים אותו",html:`${def("על מה הנושא",`שני אנשים רואים את אותו מצב, ומבינים אותו אחרת לגמרי. למה? כי אנחנו לא רואים את העולם כמו שהוא, אלא כמו שאנחנו מפרשים אותו. הנושא מסביר מה זו תפיסה ומה משפיע עליה.<br><b>מה נלמד כאן:</b> מהי תפיסה · שלושה גורמים שמשפיעים עליה`)}${def("מושג מפתח",`<mark>תפיסה</mark> ${E("Perception")} היא תהליך שבו אדם מארגן ומפרש את הרשמים שקלט בחושים, כדי לתת משמעות לסביבה שלו.`)}<p>מה שאנחנו תופסים יכול להיות שונה מאוד מהמציאות האובייקטיבית. נדיר למצוא ארגון שבו כל העובדים מסכימים שתנאי העבודה, השכר וההנהלה מצוינים, גם כשזה נכון.</p>${rem("למה זה חשוב בהתנהגות ארגונית? כי אנשים פועלים לפי <b>המציאות כפי שהם תופסים אותה</b>, ולא לפי המציאות עצמה.")}${ex(`שני עובדים שומעים שהמנהל קורא להם לשיחה. אחת חושבת "כנראה רוצים לקדם אותי", והשני חושב "אני בצרות". אותו גירוי, שתי תפיסות שונות.`)}`,q:"p1"},
  {h:"מה משפיע על התפיסה?",html:`<p>שני אנשים מסתכלים על אותו דבר ורואים דברים שונים. יש שלושה מקורות להבדל:</p>${fig("factors")}${ex("אדם בחליפה מהודרת במועדון במוצאי שבת לא יבלוט. אותו אדם, באותה חליפה, בשיעור בשמונה בבוקר, יבלוט מאוד. לא הוא השתנה ולא אתם השתנית, <b>המצב</b> השתנה.")}`,q:"p2"}
 ]},
 {id:"t2",icon:"question",title:"תורת הייחוס",blocks:[
  {h:"למה הוא התנהג ככה?",html:`${def("על מה הנושא",`כשמישהו מאחר לפגישה, אנחנו מיד שואלים: הוא לא אחראי, או שהיו פקקים? הנושא הזה עוסק בשאלה איך אנחנו מחליטים <b>למה</b> אנשים מתנהגים כפי שהם מתנהגים, ואיפה אנחנו טועים.<br><b>מה נלמד כאן:</b> סיבה פנימית מול חיצונית · ייחודיות, הסכמה ועקביות · טעויות בייחוס`)}<p>חפצים לא מתכוונים לשום דבר, אבל אנשים כן. לכן כשאנחנו רואים אדם מתנהג, אנחנו מנסים להבין למה.</p>${def("מושג מפתח",`<mark>תורת הייחוס</mark> ${E("Attribution theory")} מנסה לקבוע אם ההתנהגות של אדם נובעת מ<b>סיבה פנימית</b> (שבשליטתו) או מ<b>סיבה חיצונית</b> (הנסיבות).`)}${ex("עובד מאחר לעבודה. ייחוס פנימי: \"הוא בילה עד מאוחר ולא קם.\" ייחוס חיצוני: \"הייתה תאונה בכביש והכל נתקע.\"")}`,q:"a1"},
  {h:"שלושה גורמים שקובעים את הייחוס",html:`<p>כדי להחליט אם הסיבה פנימית או חיצונית, אנחנו בודקים שלושה דברים:</p>${attribTable}${ex("כולם שנסעו באותו כביש איחרו? הסכמה גבוהה, אז נייחס את האיחור לפקק (חיצוני). הוא מאחר פעמיים-שלוש בשבוע? עקביות גבוהה, אז נייחס את זה לו (פנימי).")}`,q:"a2"},
  {h:"טעויות בייחוס",html:`${tiles([["people","טעות הייחוס הבסיסית","כשאנחנו שופטים <b>אחרים</b>: מגזימים בהשפעת האישיות וממעיטים בהשפעת הנסיבות"],["target","הטיה לטובת העצמי","הצלחות שלי בזכותי (פנימי), כישלונות שלי בגלל הנסיבות (חיצוני)"]])}${ex("מנהל מכירות בטוח שהנציג שלו עצלן, ומתעלם מכך שמתחרה הוריד מחירים. זו טעות הייחוס הבסיסית.")}`,q:"a4"}
 ]},
 {id:"t3",icon:"copies",title:"קיצורי דרך בשיפוט אחרים",blocks:[
  {h:"ארבעה קיצורי דרך",html:`${def("על מה הנושא",`אין לנו זמן לבדוק לעומק כל אדם שאנחנו פוגשים, ולכן המוח משתמש ב"קיצורי דרך". הם חוסכים זמן, אבל גם גורמים לטעויות, למשל בראיון עבודה או בהערכת עובד.<br><b>מה נלמד כאן:</b> תפיסה בררנית · אפקט ההילה · אפקט הניגוד · סטריאוטיפים`)}<p>כדי לשפוט אנשים מהר, המוח משתמש בקיצורי דרך. הם חוסכים זמן, אבל גם מעוותים:</p>${tiles([["target","תפיסה סלקטיבית",`מפרשים את מה שרואים לפי תחומי העניין, הרקע והניסיון שלנו ${E("Selective perception")}`],["bulb","אפקט ההילה",`רושם כללי על אדם בגלל <b>תכונה אחת</b> ${E("Halo effect")}`],["scales","אפקט הניגוד",`שופטים אדם בהשוואה למי שפגשנו ממש לפניו ${E("Contrast effect")}`],["people","סטריאוטיפ",`שופטים אדם לפי הקבוצה שהוא שייך אליה ${E("Stereotyping")}`]])}`,q:"s1"},
  {h:"איפה זה פוגש אותנו בארגון",html:`${tiles([["hand","ראיון עבודה","רושם ראשוני נוצר בשבריר שנייה, ומידע שלילי בהתחלה שוקל יותר. רוב המראיינים כמעט לא משנים דעה אחרי 4-5 הדקות הראשונות."],["chart","ציפיות לביצועים","<b>נבואה שמגשימה את עצמה</b> (אפקט פיגמליון): מנהל שמצפה להרבה, מקבל הרבה. מצפה למעט, מקבל מעט."],["doc","הערכת ביצועים","בהערכות סובייקטיביות כל ההטיות נכנסות פנימה. לפעמים ההערכה מלמדת על המעריך יותר מאשר על העובד."]])}`,q:"s5"}
 ]},
 {id:"t4",icon:"split",title:"איך מקבלים החלטות",blocks:[
  {h:"המודל הרציונלי",html:`${def("על מה הנושא",`כל יום אנחנו מקבלים החלטות: מה לקנות, את מי לגייס, איזה פרויקט לבחור. הנושא משווה בין איך <b>צריך</b> להחליט (מודל רציונלי) לבין איך אנחנו <b>באמת</b> מחליטים.<br><b>מה נלמד כאן:</b> המודל הרציונלי · רציונליות מוגבלת · אינטואיציה`)}${def("שני מושגים",`<mark>בעיה</mark>: פער בין המצב הנוכחי למצב הרצוי. <mark>החלטה</mark>: בחירה בין שתי חלופות או יותר.`)}<p>התפיסה משפיעה על כל שלב: מה בכלל נחשב בעיה, איזה מידע רלוונטי, ואילו חלופות נראות לנו. המודל הרציונלי מתאר איך <b>צריך</b> להחליט כדי להשיג את התוצאה הטובה ביותר:</p>${fig("steps6")}${rem("המודל מניח מידע מלא, זיהוי של כל החלופות בלי הטיה, ובחירה בחלופה עם התועלת הגבוהה ביותר. במציאות, רוב ההחלטות לא נראות ככה.")}${ex(`<b>בעיה</b>: המכירות ירדו ב-20% (פער בין מה שיש למה שרוצים). <b>החלטה</b>: לבחור בין להוריד מחיר, להגדיל פרסום או לשפר את המוצר.`)}`,q:"d1"},
  {h:"רציונליות מוגבלת",html:`${def("מושג מפתח",`<mark>רציונליות מוגבלת</mark> ${E("Bounded rationality")}: היכולת שלנו לעבד מידע מוגבלת, ולכן אנחנו בונים מודלים פשוטים שתופסים רק את עיקר הבעיה.`)}<p>במקום לחפש את הפתרון המושלם, בודקים חלופות קרובות למצב הקיים, ועוצרים בראשונה שהיא "מספיק טובה". זה נקרא <mark>הסתפקות</mark> ${E("Satisficing")}.</p>${rem("הסתפקות היא לא תמיד רעה. המודל הרציונלי דורש המון מידע, זמן ואנרגיה, ולפעמים תהליך פשוט הוא דווקא ההגיוני יותר.")}${ex(`כשמחפשים דירה, לא בודקים את כל הדירות בעיר. מסתכלים על כמה מודעות, ובוחרים את הראשונה ש"מספיק טובה" (מחיר סביר, קרוב לעבודה). זו רציונליות מוגבלת.`)}`,q:"d3"},
  {h:"אינטואיציה",html:`${def("מושג מפתח",`<mark>קבלת החלטות אינטואיטיבית</mark> ${E("Intuitive decision making")}: תהליך לא מודע, שנבנה מניסיון מזוקק.`)}<p>האינטואיציה מהירה, והיא לא חייבת לעמוד בסתירה לניתוח רציונלי. אצל אנשים מנוסים, שתי הדרכים יכולות להשלים זו את זו.</p>${rem("אבל לא כדאי להסתמך עליה יותר מדי: קשה לדעת מתי תחושת הבטן צודקת ומתי לא.")}${ex(`מגייסת ותיקה שמרגישה "משהו לא בסדר" בקורות חיים, עוד לפני שהיא יודעת להסביר למה. זו אינטואיציה שנבנתה משנים של ניסיון.`)}`,q:"d4"}
 ]},
 {id:"t5",icon:"x",title:"הטיות וטעויות בהחלטות",blocks:[
  {h:"הטיות שקשורות למידע",html:`${def("על מה הנושא",`גם אנשים חכמים טועים בהחלטות, ובאופן צפוי. הנושא מציג את ההטיות הנפוצות, כדי שתזהו אותן אצלכם ואצל אחרים.<br><b>מה נלמד כאן:</b> הטיות במידע (עיגון, אישוש, זמינות) · הטיות בהחלטה עצמה · איך מצמצמים`)}${tiles([["chart","ביטחון יתר",`אנשים שבטוחים ב-90% צודקים בערך ב-50% מהמקרים ${E("Overconfidence")}`],["lock","עיגון",`נתקעים על המידע הראשון ולא מתקנים מספיק לפי מידע חדש ${E("Anchoring")}`],["check","אישוש",`מחפשים מידע שמחזק את מה שכבר החלטנו, ומזלזלים במידע שסותר ${E("Confirmation")}`],["clock","זמינות",`שופטים לפי מה שהכי קל להיזכר בו ${E("Availability")}`]])}${ex("בהתחלת משא ומתן על שכר, המספר הראשון שנאמר משמש עוגן לכל ההמשך.")}`,q:"b2"},
  {h:"הטיות שקשורות להחלטות עצמן",html:`${tiles([["cycle","הסלמת מחויבות",`נשארים בהחלטה למרות ראיות ברורות שהיא שגויה. "זורקים כסף טוב אחרי כסף רע" ${E("Escalation of commitment")}`],["question","טעות האקראיות",`מאמינים שאפשר לחזות אירועים אקראיים, למשל אמונות טפלות ${E("Randomness error")}`],["scales","שנאת סיכון",`מעדיפים רווח בטוח ובינוני על פני סיכון, גם כשהתוחלת שלו גבוהה יותר ${E("Risk aversion")}`],["pie","הטיית חוכמה לאחר מעשה",`אחרי שהתוצאה ידועה, בטוחים ש"ידענו מראש" ${E("Hindsight bias")}`]])}${rem("הסלמת מחויבות קורית במיוחד כשאדם מרגיש <b>אחראי</b> לכישלון ורוצה להוכיח שההחלטה המקורית לא הייתה טעות.")}`,q:"b5"},
  {h:"איך מצמצמים הטיות",html:`${tiles([["target","להתמקד במטרות","בלי מטרה ברורה אי אפשר לדעת איזה מידע רלוונטי ובין מה לבחור"],["question","לחפש מידע שסותר","הדרך היעילה ביותר נגד ביטחון יתר, הטיית אישוש וחוכמה לאחר מעשה"],["link","לא לייצר משמעות מצירופי מקרים","לשאול אם יש לדפוס הסבר אמיתי, או שזה סתם מקרה"],["split","להגדיל את מספר החלופות","יותר אפשרויות מגדילות את הסיכוי למצוא פתרון טוב"]])}`,q:"b9"}
 ]},
 {id:"t6",icon:"bulb",title:"השפעות, אתיקה ויצירתיות",blocks:[
  {h:"מה משפיע על ההחלטות שלנו",html:`${def("על מה הנושא",`החלטות לא נעשות בחלל ריק: האישיות שלנו, הארגון והתרבות משפיעים עליהן. בנושא נראה גם איך מחליטים באופן אתי, ומה זו יצירתיות.<br><b>מה נלמד כאן:</b> השפעות אישיות וארגוניות · שלושה קריטריונים אתיים · יצירתיות`)}<p><b>הבדלים אישיים:</b></p>${tiles([["chart","שאפתנות (חלק ממצפוניות)","אנשים שואפי הישגים נוטים יותר להסלמת מחויבות, כי הם שונאים להיכשל"],["hand","תחושת חובה","אנשים חדורי תחושת חובה נוטים פחות להסלמה, כי הם עושים מה שטוב לארגון"],["target","הערכה עצמית גבוהה","משתמשים בהטיה לטובת העצמי כדי לשמור עליה"],["cycle","מגדר והרהור יתר","נשים נוטות יותר לנתח שוב ושוב בעיות והחלטות (Rumination)"]])}<p><b>אילוצים ארגוניים:</b> הערכת ביצועים, מערכת תגמולים, תקנות פורמליות, לוחות זמנים שהמערכת כופה, ותקדימים היסטוריים (למשל, התקציב של השנה הקודמת קובע את התקציב הנוכחי).</p>`,q:"e3"},
  {h:"שלושה קריטריונים אתיים",html:`${tiles([["chart","תועלתנות",`ההחלטה הטובה היא זו שמביאה את <b>הטוב הגדול ביותר למספר הגדול ביותר</b>. שולטת בעולם העסקים ${E("Utilitarianism")}`],["id","זכויות","לכבד ולהגן על זכויות היסוד של כל אדם: פרטיות, חופש ביטוי, הליך הוגן. מגן על חושפי שחיתויות"],["scales","צדק","לאכוף כללים בהגינות ובאופן שוויוני. למשל, שכר זהה לאותו תפקיד וותק כקריטריון לפיטורים. נפוץ באיגודים מקצועיים"]])}${def("מושג נלווה",`<mark>חושפי שחיתויות</mark> ${E("Whistle-blowers")}: אנשים שמדווחים לגורמים מחוץ לארגון על התנהלות לא אתית של המעסיק.`)}${rem("לכל קריטריון יתרונות וחסרונות: תועלתנות יעילה, אבל עלולה לדרוס זכויות של מיעוטים.")}${ex(`חושפת שחיתויות: רואת חשבון שמגלה שהחברה מזייפת דוחות, ומדווחת לרשות המסים אחרי שההנהלה התעלמה.`)}`,q:"e4"},
  {h:"יצירתיות",html:`${def("מושג מפתח",`<mark>יצירתיות</mark> ${E("Creativity")}: היכולת להפיק רעיונות <b>חדשים ומועילים</b>.`)}<p>לרוב האנשים יש פוטנציאל יצירתי. במחקר על 461 אנשים, פחות מאחוז היו יצירתיים במיוחד, אבל כ-60% היו יצירתיים במידה מסוימת.</p>${fig("venn","המודל התלת-רכיבי: ככל שכל רכיב גבוה יותר, היצירתיות גבוהה יותר")}${ex(`עובד שמציע להפוך את חדר ההמתנה המשעמם בבנק לפינת קפה עם מטענים: רעיון <b>חדש</b> וגם <b>מועיל</b>. רעיון חדש שלא מועיל (לצבוע את הבנק בסגול) הוא לא יצירתיות במובן של הפרק.`)}`,q:"e6"}
 ]}
];
const Q={
p1:{t:"t1",v:[
 {q:"סקר מראה שהשכר בחברה גבוה מהממוצע בענף, אבל רוב העובדים בטוחים שמשלמים להם מעט. לפי הפרק, למה זה חשוב למנהל?",a:"כי העובדים יפעלו לפי מה שהם תופסים, גם אם הנתונים מראים אחרת",w:["כי זה מראה שהסקר לא נערך כראוי, ושצריך לחזור עליו עם מדגם אחר","כי תפיסה שגויה נעלמת מעצמה אחרי שמציגים נתונים","כי שביעות הרצון של עובדים נקבעת בעיקר לפי השכר האובייקטיבי"],e:"התנהגות נקבעת לפי המציאות הנתפסת. לכן פער בין נתונים לתפיסה הוא בעיה ניהולית אמיתית."},
 {q:"איזה משפט מתאר הכי טוב את הקשר בין תפיסה למציאות, לפי הפרק?",a:"התפיסה היא פרשנות, ולכן היא עלולה להיות שונה מהותית מהמציאות",w:["התפיסה משקפת את המציאות, רק בפחות פרטים","התפיסה שונה מהמציאות רק אצל אנשים עם הטיות חריגות","התפיסה והמציאות זהות כשמדובר בעובדות מדידות כמו שכר"],e:"תפיסה היא ארגון ופרשנות של רשמים, לכן גם לגבי עובדות אנשים יכולים לראות דברים שונים."}]},
p2:{t:"t1",v:[
 {q:"עובד חדש נראה למנהלת ״מתנשא״ רק כי הוא מזכיר לה עמית שהיא לא סבלה. איזה גורם בתפיסה פועל כאן?",a:"התופס: הניסיון והעמדות של המנהלת",w:["המטרה: התכונות של העובד החדש","המצב: הזמן והמקום של הפגישה","המטרה: הדמיון בין העובד לעמית"],e:"ההבדל נובע מהניסיון הקודם של המנהלת, כלומר מהתופס. הדמיון ״בא״ ממנה, לא מהעובד."},
 {q:"עובד שקט בפגישה רגילה לא מושך תשומת לב. אותו עובד, כשהוא היחיד שלא מדבר בסיעור מוחות רועש, בולט מאוד. מה השתנה?",a:"המצב, שבו העובד מופיע",w:["המטרה, כי העובד שינה את התנהגותו","התופס, כי המנהל שינה את עמדותיו","המטרה, כי השתנה הרקע שלו"],e:"העובד התנהג אותו דבר, ומי שמסתכל עליו לא השתנה. ההקשר הוא שהשתנה."},
 {q:"מועמדת בולטת בראיון כי היא מדברת חזק מאוד ומרבה לצחוק. לאיזה גורם בתפיסה זה שייך?",a:"המטרה: מאפיינים של האדם הנתפס",w:["התופס: הציפיות של המראיין","המצב: שעת הראיון","התופס: מצב הרוח של המראיין"],e:"מאפיינים כמו קול, התנהגות או מראה של מי שנתפס שייכים ל״מטרה״."}]},
p3:{t:"t1",v:[
 {q:"שני מנהלים צופים באותו עובד שיוצא מוקדם. האחד חושב ״לא מחויב״, השנייה ״מנהל זמן טוב״. מה ההסבר הטוב ביותר לפי הפרק?",a:"תפיסה נבנית מהפרשנות של כל צופה, ולא רק מההתנהגות עצמה",w:["אחד מהם בהכרח טועה, כי יש רק פרשנות נכונה אחת","ההבדל נובע מהמטרה, כי העובד התנהג אחרת מול כל אחד","זה הבדל במצב, כי הם צפו בו בזמנים שונים"],e:"אותו גירוי, שני תופסים, שתי פרשנויות. זו בדיוק הנקודה של הפרק."},
 {q:"איזה מהבאים הוא דוגמה להשפעה של ״המצב״ על התפיסה?",a:"בדיחה שנשמעת מצחיקה בארוחת צוות נשמעת פוגענית בישיבת הנהלה",w:["מנהל עם ניסיון בסטארט־אפ רואה בכל עובד ״חסר יוזמה״","עובדת עם קול חזק בולטת יותר מאחרות","מראיין שמחפש מועמד ״כמוהו״ מתרשם ממי שדומה לו"],e:"הבדיחה זהה, אבל ההקשר שונה. האפשרויות האחרות מתארות את התופס או את המטרה."}]},
p4:{t:"t1",v:[
 {q:"מנהלת רוצה להבין למה הצוות שלה לא מרוצה, למרות תנאים טובים. מה הצעד הנכון ביותר לפי רוח הפרק?",a:"לברר איך העובדים תופסים את התנאים, ולא רק להציג את הנתונים",w:["להציג שוב את הנתונים, כי התפיסה תשתנה מעצמה","להתעלם, כי התנהגות נקבעת לפי התנאים האמיתיים","לשנות את התנאים בלי לשאול, כי תפיסה לא ניתנת למדידה"],e:"כדי להשפיע על התנהגות צריך להבין את המציאות כפי שהיא נתפסת."},
 {q:"מה הקשר בין תפיסה לבין קבלת החלטות, לפי הפרק?",a:"התפיסה קובעת אילו בעיות נראה, איזה מידע נחשב רלוונטי ואילו חלופות נשקול",w:["אין קשר ישיר, כי החלטות טובות מבוססות על נתונים אובייקטיביים בלבד","התפיסה משפיעה רק על השלב האחרון, כשבוחרים בין החלופות שנמצאו","התפיסה משפיעה רק כשמדובר בהחלטות אינטואיטיביות"],e:"התפיסה חודרת לכל שלב: מה נחשב בעיה, מה המידע ומה האפשרויות."}]},
a1:{t:"t2",v:[
 {q:"״היא קיבלה את הקידום כי היא עובדת קשה יותר מכולם.״ איזה ייחוס זה, ולמה?",a:"פנימי, כי הסיבה היא משהו שבשליטתה",w:["חיצוני, כי הקידום ניתן לה על ידי אחרים","חיצוני, כי הוא תלוי בהחלטת ההנהלה","פנימי, כי היא מרוצה מהתוצאה"],e:"ייחוס פנימי מתייחס לגורם בשליטת האדם, כמו מאמץ או יכולת."},
 {q:"מה בדיוק מנסה תורת הייחוס להסביר?",a:"איך אנשים מחליטים אם התנהגות של אחר נובעת ממנו או מהנסיבות",w:["איך אנשים קובעים אם התנהגות של אחר היא מוסרית או לא מוסרית","איך אנשים בוחרים בין כמה חלופות כשאין להם מידע מלא","למה אנשים זוכרים מידע שמתאים לדעה שלהם"],e:"תורת הייחוס עוסקת בשאלה ״למה הוא עשה את זה?״: בו או בנסיבות."}]},
a2:{t:"t2",v:[
 {q:"עובדת שתמיד עומדת בלוחות זמנים איחרה היום בהגשת דוח. איזה גורם רלוונטי כאן, ולאן הוא מוביל?",a:"ייחודיות גבוהה, ולכן ייחוס חיצוני",w:["עקביות גבוהה, ולכן ייחוס פנימי","הסכמה נמוכה, ולכן ייחוס פנימי","ייחודיות נמוכה, ולכן ייחוס חיצוני"],e:"ההתנהגות חריגה אצלה (ייחודיות גבוהה), ולכן סביר לחפש סיבה בנסיבות."},
 {q:"מכל הצוות, רק דני לא סיים את ההדרכה בזמן. מה רמת ההסכמה, ולאיזה ייחוס זה מוביל?",a:"הסכמה נמוכה, ולכן ייחוס פנימי",w:["הסכמה גבוהה, ולכן ייחוס חיצוני","ייחודיות גבוהה, ולכן ייחוס חיצוני","עקביות נמוכה, ולכן ייחוס פנימי"],e:"אחרים באותו מצב התנהגו אחרת, לכן ההסכמה נמוכה והסיבה כנראה בו."}]},
a3:{t:"t2",v:[
 {q:"נציג שירות צועק על לקוחות כבר חודשים, אבל רק בשיחות טלפון ולא פנים מול פנים, ושאר הנציגים לא צועקים. מה הייחוס הסביר?",a:"פנימי: עקביות גבוהה והסכמה נמוכה",w:["חיצוני: ייחודיות גבוהה מבטלת את שאר הגורמים","חיצוני: הסכמה גבוהה ועקביות נמוכה","אי אפשר לקבוע, כי הגורמים תמיד מבטלים זה את זה"],e:"שני גורמים מצביעים על ייחוס פנימי: הוא עושה זאת לאורך זמן, ואחרים לא."},
 {q:"איזה שילוב יוביל בסבירות הגבוהה ביותר לייחוס חיצוני?",a:"ייחודיות גבוהה, הסכמה גבוהה, עקביות נמוכה",w:["ייחודיות נמוכה, הסכמה נמוכה, עקביות גבוהה","ייחודיות גבוהה, הסכמה נמוכה, עקביות גבוהה","ייחודיות נמוכה, הסכמה גבוהה, עקביות גבוהה"],e:"התנהגות חריגה אצלו, שכולם עושים במצב הזה, ושלא חוזרת: הכול מצביע על הנסיבות."}]},
a4:{t:"t2",v:[
 {q:"מנהלת מסבירה את הירידה במכירות של הצוות ב״חוסר מוטיבציה״, למרות שבאותו רבעון נסגר סניף של לקוח גדול. איזו טעות היא עושה?",a:"טעות הייחוס הבסיסית",w:["הטיה לטובת העצמי","אפקט ההילה","הטיית עיגון"],e:"היא שופטת אחרים, מגזימה בגורם הפנימי וממעיטה בנסיבות."},
 {q:"מה מבדיל בין טעות הייחוס הבסיסית לבין ההטיה לטובת העצמי?",a:"הראשונה נוגעת לשיפוט של אחרים, השנייה לשיפוט של עצמי",w:["הראשונה נוגעת להצלחות, והשנייה נוגעת לכישלונות","הראשונה מייחסת לנסיבות, והשנייה מייחסת לאישיות","אין הבדל, אלה שני שמות לאותה הטיה"],e:"בטעות הבסיסית אנחנו מאשימים את האחר. בהטיה לטובת העצמי אנחנו מגינים על עצמנו."}]},
a5:{t:"t2",v:[
 {q:"מנהל פרויקט אומר: ״השקתי בזמן כי תכננתי טוב. בפרויקט הקודם איחרנו כי הספק הכשיל אותנו.״ איזו הטיה זו?",a:"הטיה לטובת העצמי",w:["טעות הייחוס הבסיסית","הטיית חוכמה לאחר מעשה","הטיית אישוש"],e:"הצלחה לעצמו (פנימי), כישלון לנסיבות (חיצוני)."},
 {q:"לפי הפרק, למה הערכות ביצועים חשופות במיוחד להטיה לטובת העצמי?",a:"כי עובדים מייחסים הצלחות לעצמם וכישלונות לנסיבות, וכך מעריכים את עצמם גבוה מדי",w:["כי מנהלים נוטים להגזים בהשפעת הנסיבות כשהם מעריכים עובדים","כי ההערכה נעשית רק פעם בשנה, ולכן העובד זוכר בעיקר את החודש האחרון","כי עובדים נוטים להמעיט בהצלחות שלהם כדי לא להיראות מתרברבים"],e:"כשעובד מעריך את עצמו, הוא נוטה לזקוף הצלחות לזכותו ולהטיל כישלונות על גורמים אחרים."}]},
s1:{t:"t3",v:[
 {q:"עובדת מצטיינת בעבודה מול לקוחות, ולכן המנהל מדרג אותה גבוה גם בניהול תקציב, שבו היא בינונית. מה פעל כאן?",a:"אפקט ההילה",w:["אפקט הניגוד","סטריאוטיפ","תפיסה סלקטיבית"],e:"תכונה בולטת אחת יצרה רושם כללי שהשפיע על הערכת תחומים אחרים."},
 {q:"מה ההבדל בין אפקט ההילה לבין סטריאוטיפ?",a:"בהילה תכונה אחת צובעת את כל השיפוט, בסטריאוטיפ הקבוצה קובעת",w:["בהילה השיפוט תמיד חיובי, ובסטריאוטיפ השיפוט תמיד שלילי","בהילה משווים לאדם שנפגש קודם, ובסטריאוטיפ לא משווים לאף אחד","אין הבדל מהותי, שניהם נובעים מהשוואה לאחרים"],e:"הילה יוצאת מתכונה של האדם עצמו. סטריאוטיפ יוצא מהשתייכות לקבוצה. שניהם יכולים להיות חיוביים או שליליים."}]},
s2:{t:"t3",v:[
 {q:"מועמד ממוצע קיבל ציון נמוך כי רואיין מיד אחרי מועמדת מבריקה. מה פעל כאן?",a:"אפקט הניגוד",w:["אפקט ההילה","טעות הייחוס הבסיסית","הטיית עיגון"],e:"השיפוט הושפע מההשוואה למי שבא ממש לפניו."},
 {q:"איזה צעד יקטין הכי הרבה את אפקט הניגוד בראיונות?",a:"לדרג כל מועמד מול קריטריונים קבועים לפני שעוברים למועמד הבא",w:["לראיין את כל המועמדים ברצף באותו יום, כדי שההשוואה תהיה הוגנת","לבקש מהמראיין להתרשם מהמועמד כולו ולא מפרטים קטנים","להקדיש יותר זמן לחמש הדקות הראשונות"],e:"אפקט הניגוד נוצר מהשוואה בין מועמדים. דירוג מול סטנדרט קבוע מצמצם אותה."}]},
s3:{t:"t3",v:[
 {q:"מנהלת שיווק ומנהל כספים קוראים אותו דוח על ירידה ברווחים. היא רואה בעיית מיתוג, הוא רואה בעיית עלויות. מה ממחיש המקרה?",a:"תפיסה סלקטיבית",w:["אפקט ההילה","הטיית זמינות","סטריאוטיפ"],e:"כל אחד קולט ומפרש את המידע לפי הרקע ותחום העניין שלו."},
 {q:"מה מבדיל תפיסה סלקטיבית מהטיית אישוש?",a:"סלקטיבית: הרקע קובע מה נקלט. אישוש: מחפשים תמיכה בעמדה קיימת",w:["סלקטיבית שייכת לקבלת החלטות, ואישוש שייך לשיפוט של אנשים","אין הבדל אמיתי, אלה שני שמות לאותה תופעה בתפיסה","סלקטיבית נוגעת לזיכרון של אירועים, ואישוש נוגע לרגשות כלפיהם"],e:"תפיסה סלקטיבית היא קיצור דרך בתפיסת מצבים ואנשים. הטיית אישוש פועלת אחרי שכבר יש עמדה."}]},
s4:{t:"t3",v:[
 {q:"מראיין מניח שמועמד בן 55 ״לא יסתדר עם טכנולוגיה״, בלי לשאול אותו. מה זה?",a:"סטריאוטיפ",w:["אפקט ההילה","אפקט הניגוד","תפיסה סלקטיבית"],e:"השיפוט מבוסס על הקבוצה (גיל), לא על האדם עצמו."},
 {q:"למה סטריאוטיפים מסוכנים במיוחד בארגון, לפי הפרק?",a:"כי הם מובילים להחלטות לא מדויקות ולא הוגנות על אנשים מסוימים",w:["כי הם תמיד שגויים לגבי כל אחד מחברי הקבוצה","כי הם פועלים רק כשאין למנהל מספיק זמן להכיר את העובד","כי הם נוגעים רק למאפיינים גלויים כמו מגדר וגיל"],e:"קיצור הדרך חוסך זמן, אבל מעוות את השיפוט של אדם ספציפי."}]},
s5:{t:"t3",v:[
 {q:"מנהל הוזהר שהעובד החדש ״בעייתי״, נתן לו משימות פשוטות בלבד, והעובד אכן לא התקדם. איזה תהליך זה ממחיש?",a:"נבואה שמגשימה את עצמה",w:["אפקט ההילה של המזהיר","הטיה לטובת העצמי של המנהל","טעות האקראיות"],e:"הציפייה הנמוכה השפיעה על היחס, והיחס יצר את הביצוע הנמוך."},
 {q:"לפי הפרק, מה מאפיין ראיונות עבודה מבחינת תפיסה?",a:"רושם ראשון נוצר מהר, ומידע שלילי בהתחלה שוקל יותר מחיובי",w:["מראיינים משנים דעה בעיקר בסוף הראיון","מידע חיובי בתחילת הראיון שוקל יותר מאשר שלילי","ראיון מובנה מבטל את כל קיצורי הדרך"],e:"רוב המראיינים מגבשים עמדה בדקות הראשונות, ומידע שלילי מוקדם משפיע במיוחד."}]},
d1:{t:"t4",v:[
 {q:"צוות קופץ ישר לבחירה בין שלוש הצעות של ספקים, בלי לברר מה בדיוק הבעיה. איזה שלב במודל הרציונלי דילגו עליו?",a:"הגדרת הבעיה",w:["זיהוי קריטריונים להחלטה","הערכת החלופות","יישום ההחלטה"],e:"המודל מתחיל בהגדרת הבעיה. בלי זה אי אפשר לדעת מה הקריטריונים."},
 {q:"איזו הנחה של המודל הרציונלי היא הכי פחות מציאותית בארגון?",a:"שיש למחליט מידע מלא ושהוא מזהה את כל החלופות",w:["שלמחליט יש מטרה ברורה","שאפשר להשוות בין החלופות לפי קריטריונים","שההחלטה צריכה להיות מיושמת"],e:"במציאות המידע חלקי והיכולת לעבד אותו מוגבלת. זה הבסיס לרציונליות מוגבלת."}]},
d2:{t:"t4",v:[
 {q:"המכירות יציבות, אבל המתחרה צמח ב-30%. לפי ההגדרה בפרק, האם יש כאן בעיה?",a:"כן, אם הרצוי הוא לשמור על נתח שוק, כי יש פער",w:["לא, כי המכירות של החברה עצמה לא ירדו","לא, כי בעיה קיימת רק כשיש ירידה במספרים של הארגון","כן, אבל רק אחרי שההנהלה כבר החליטה מה לעשות בנידון"],e:"בעיה היא פער בין מצב נוכחי לרצוי, והתפיסה קובעת אם רואים פער כזה."},
 {q:"מה ההבדל בין ״בעיה״ לבין ״החלטה״ לפי הפרק?",a:"בעיה היא פער בין מצב נוכחי לרצוי. החלטה היא בחירה בין חלופות",w:["בעיה היא תמיד מצב שלילי, והחלטה היא תמיד צעד חיובי","החלטה קודמת לבעיה במודל, כי קודם בוחרים ואז בודקים","בעיה נפתרת באינטואיציה, והחלטה מתקבלת בניתוח רציונלי"],e:"קודם מזהים פער (בעיה), ואז בוחרים מה לעשות (החלטה)."}]},
d3:{t:"t4",v:[
 {q:"מנהלת מחפשת ספק, בודקת שלושה, ובוחרת בשני שעומד בתקציב ובזמנים, בלי לבדוק את השלישי עד הסוף. מה זה?",a:"הסתפקות (רציונליות מוגבלת)",w:["יישום המודל הרציונלי","קבלת החלטות אינטואיטיבית","הסלמת מחויבות"],e:"היא עוצרת בפתרון הראשון שהוא ״מספיק טוב״."},
 {q:"מה עמדת הפרק לגבי הסתפקות (Satisficing)?",a:"היא לא תמיד רעה, כי לפעמים העלות של ניתוח מלא גבוהה מהתועלת",w:["היא תמיד טעות, כי היא מוותרת על הפתרון הטוב ביותר","היא מתאימה רק למנהלים חסרי ניסיון שעוד לא למדו לנתח","היא בעצם שם אחר לקבלת החלטות אינטואיטיבית"],e:"המודל הרציונלי דורש זמן, מידע ואנרגיה. לפעמים תהליך פשוט הגיוני יותר."}]},
d4:{t:"t4",v:[
 {q:"רופאת מיון ותיקה מרגישה מיד שמטופל ״לא בסדר״, עוד לפני הבדיקות, ומתברר שצדקה. מה נכון לגבי זה לפי הפרק?",a:"זו אינטואיציה שנבנתה מניסיון, והיא יכולה להשלים ניתוח רציונלי",w:["זו הוכחה שאינטואיציה עדיפה תמיד על ניתוח מסודר","זו רציונליות מוגבלת, כי לא היה לה מידע מלא בזמן אמת","זו הטיית זמינות, ולכן אין להסתמך עליה בשום מצב"],e:"אינטואיציה היא תהליך לא מודע שנבנה מניסיון. אצל מומחים היא משלימה ניתוח."},
 {q:"מה הסכנה העיקרית בהסתמכות על אינטואיציה, לפי הפרק?",a:"קשה לדעת מתי תחושת הבטן מדויקת ומתי לא",w:["היא תמיד סותרת את הניתוח הרציונלי","היא מתאימה רק לאנשים בלי ניסיון","היא איטית מדי לרוב ההחלטות"],e:"האינטואיציה מהירה ויכולה לעזור, אבל אין לה מנגנון מובנה לבדוק את עצמה."}]},
b1:{t:"t5",v:[
 {q:"מנהל בטוח ב-90% שהפרויקט יסתיים בזמן. לפי הנתונים בפרק, מה סביר?",a:"שהסיכוי האמיתי קרוב יותר ל-50%",w:["שהסיכוי האמיתי אכן כ-90%","שהסיכוי האמיתי גבוה מ-90%","שאי אפשר לדעת, כי ביטחון לא קשור לדיוק"],e:"אנשים שבטוחים ב-90% צודקים בערך במחצית מהמקרים."},
 {q:"איזה מהבאים הוא הביטוי הישיר ביותר של ביטחון יתר?",a:"הערכה שהסיכוי לטעות קטן הרבה יותר ממה שהוא באמת",w:["היצמדות למספר הראשון שנאמר במשא ומתן","חיפוש מידע שתומך בהחלטה שכבר התקבלה","המשך השקעה בפרויקט למרות שברור שהוא נכשל"],e:"שאר התשובות מתארות עיגון, אישוש והסלמת מחויבות."}]},
b2:{t:"t5",v:[
 {q:"מוכר דירה מציין מחיר גבוה מאוד, והקונה, שיודע שזה מוגזם, מציע בכל זאת יותר ממה שתכנן. איזו הטיה זו?",a:"עיגון",w:["זמינות","אישוש","ביטחון יתר"],e:"המספר הראשון הפך לנקודת התייחסות, והתיקון ממנו לא היה מספיק."},
 {q:"מה מבדיל עיגון מהטיית אישוש?",a:"בעיגון נתקעים על מידע ראשון. באישוש מחפשים מידע שמחזק עמדה קיימת",w:["בעיגון זוכרים מידע בולט, ובאישוש נתקעים על מידע ראשון","עיגון נוגע לשיפוט אנשים, ואישוש נוגע להערכת מספרים","עיגון קורה רק אחרי ההחלטה, ואישוש קורה רק לפניה"],e:"שתיהן הטיות מידע, אבל המנגנון שונה: נקודת התחלה מול סינון מידע."}]},
b3:{t:"t5",v:[
 {q:"מנהלת שהחליטה לגייס מועמד מסוים מבקשת המלצות רק מהממליצים שהוא עצמו נתן. איזו הטיה זו?",a:"הטיית אישוש",w:["הטיית עיגון","הטיית זמינות","הסלמת מחויבות"],e:"היא מחפשת מידע שצפוי לתמוך בהחלטה שכבר התקבלה."},
 {q:"איזו פעולה תצמצם הכי הרבה הטיית אישוש?",a:"לבקש ממישהו להציג את הטיעונים נגד",w:["לאסוף עוד מידע מאותם מקורות שכבר נבדקו","לקבל את ההחלטה מהר, לפני שההטיה מתחזקת","להסתמך על תחושת הבטן של מקבל ההחלטה"],e:"הפרק ממליץ לחפש באופן פעיל מידע שסותר את העמדה."}]},
b4:{t:"t5",v:[
 {q:"בהערכה שנתית מנהל מדרג עובד לפי הטעות הבולטת שעשה לפני שבוע, ושוכח את 11 החודשים הטובים. איזו הטיה זו?",a:"זמינות",w:["עיגון","אפקט הניגוד","אישוש"],e:"המידע הטרי והבולט קל להיזכר בו, ולכן הוא שוקל יותר מדי."},
 {q:"למה הטיית זמינות גורמת לטעות בהערכת סיכונים?",a:"כי מה שקל להיזכר בו נראה שכיח יותר ממה שהוא",w:["כי אנשים זוכרים בעיקר מידע חיובי ומתעלמים מסכנות","כי המספר הראשון קובע את ההערכה","כי אנשים מחפשים מידע שתומך בדעה שכבר יש להם"],e:"אירועים דרמטיים או טריים זמינים בזיכרון, ולכן נראים שכיחים."}]},
b5:{t:"t5",v:[
 {q:"מנכ״ל שיזם מוצר כושל ממשיך להשקיע בו, למרות שמנהל חדש שהגיע הציע לעצור. למה דווקא המנכ״ל נוטה להסלמה?",a:"כי הוא אחראי לכישלון ורוצה להצדיק את ההחלטה",w:["כי יש לו יותר מידע על המוצר מאשר למנהל החדש","כי הוא סובל משנאת סיכון ולכן נמנע משינויים","כי הוא נוטה להטיית חוכמה לאחר מעשה לגבי המוצר"],e:"הסלמה נפוצה במיוחד כשהאדם רואה את עצמו אחראי לכישלון."},
 {q:"איזה מצב הוא הדוגמה הטובה ביותר להסלמת מחויבות?",a:"להוסיף תקציב לפרויקט חורג כדי ״לא לבזבז את מה שהושקע״",w:["להמשיך בפרויקט שעומד ביעדים, למרות ביקורת מבחוץ","לבחור בחלופה הראשונה שעומדת בכל הדרישות שהוגדרו","להעדיף רווח בטוח וקטן על פני השקעה מסוכנת ומשתלמת"],e:"ההשקעה הקודמת לא אמורה לקבוע את ההחלטה הבאה, אבל אצל מי שמסלים היא כן."}]},
b6:{t:"t5",v:[

    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
