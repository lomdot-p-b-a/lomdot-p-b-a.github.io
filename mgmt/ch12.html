<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: מנהיגות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>
</head>

const ic=(k,cls="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${I[k]}</svg>`;

const arrowDef=id=>`<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-c"/></marker></defs>`;

const FIG={
 fiedler:()=>{const z=[[320,"נוח מאוד","משימתי"],[200,"נוח בינוני","מכוון יחסים"],[80,"לא נוח","משימתי"]];
  return `<svg viewBox="0 0 400 200" role="img" aria-label="מודל פידלר: איזה מנהיג מתאים לאיזה מצב">
  <rect x="20" y="58" width="360" height="14" rx="7" class="f-soft"/>
  <text x="380" y="40" text-anchor="start" font-size="11.5" class="f-mut">יחסים טובים, משימה מובנית, כוח חזק</text>

const T=[
 {id:"t1",icon:"target",title:"מהי מנהיגות",blocks:[
  {h:"מנהיגות וניהול",html:`${def("על מה הנושא",`כולנו פגשנו מנהל שאף אחד לא מקשיב לו, ואדם בלי תואר שכולם הולכים אחריו. הנושא מסביר מה זו מנהיגות, ובמה היא שונה מניהול.<br><b>מה נלמד כאן:</b> מנהיגות · ניהול · ההבדל ביניהם`)}${def("מושג מפתח",`<mark>מנהיגות</mark> ${E("Leadership")}: היכולת להשפיע על קבוצה לעבר השגת חזון או מטרות.`)}<p>מקור ההשפעה יכול להיות <b>פורמלי</b>, כמו דרגה ניהולית, אבל לא כל מנהל הוא מנהיג, ולא כל מנהיג הוא מנהל. <mark>מנהיגות לא רשמית</mark>, שצומחת מתוך הקבוצה ומחוץ למבנה הפורמלי, חשובה לפעמים יותר מההשפעה הפורמלית.</p>${tiles([["bulb","מנהיגים","מאתגרים את המצב הקיים, יוצרים חזון לעתיד, ומעוררים השראה"],["doc","מנהלים","מתכננים, בונים מבנים ארגוניים, ומפקחים על הפעילות השוטפת"]])}${rem("ארגונים צריכים גם מנהיגות חזקה וגם ניהול חזק כדי להיות אפקטיביים.")}${ex(`מנהלת מחלקה יכולה לחלק משימות ולבדוק נוכחות (ניהול), אבל עדיין אף אחד לא מתלהב. עובד בלי תפקיד ניהולי שמסחף את הצוות לפרויקט חדש מפעיל מנהיגות.`)}`,q:"l1"}
 ]},
 {id:"t2",icon:"id",title:"תכונות והתנהגויות",blocks:[
  {h:"תיאוריות התכונות",html:`${def("על מה הנושא",`הניסיונות הראשונים להבין מנהיגות שאלו שתי שאלות: <b>מי</b> המנהיג (אילו תכונות יש לו), ו<b>מה</b> הוא עושה (איך הוא מתנהג).<br><b>מה נלמד כאן:</b> תיאוריות התכונות · תיאוריות ההתנהגות · מה המחקר מצא`)}${def("מושג מפתח",`<mark>תיאוריות התכונות</mark> ${E("Trait theories")}: מחפשות את התכונות האישיות שמבדילות בין מנהיגים ללא-מנהיגים. הן שלטו בתחום עד סוף שנות ה-40.`)}<p>לפי מודל <b>חמשת הגורמים הגדולים</b>:</p>${tiles([["people","מוחצנות","התכונה החשובה ביותר, אבל קשורה יותר ל<b>הופעת</b> מנהיגים מאשר לאפקטיביות שלהם"],["check","מצפוניות","קשר חזק למנהיגות: משמעת ועמידה בהתחייבויות"],["sprout","פתיחות לחוויות","קשר חזק: יצירתיות וגמישות"]])}${def("אינטליגנציה רגשית",`מרכיב מרכזי שלה הוא <mark>אמפתיה</mark>: מנהיג אמפתי חש את הצרכים של אחרים, מקשיב ומבין תגובות. לפי התומכים, בלי אינטליגנציה רגשית קשה להיות מנהיג גדול, במיוחד בדרגים גבוהים.`)}${rem("מנהיגים עם אסרטיביות גבוהה מאוד היו פחות אפקטיביים מאלה עם אסרטיביות גבוהה במידה.")}${ex(`החיפוש אחר "מנהיג נולד": חוקרים בדקו אם מנהיגים גבוהים, מוחצנים או חכמים יותר. <b>אינטליגנציה רגשית</b>: מנהל ששם לב שעובדת שקטה מהרגיל, ושואל בשקט אם הכול בסדר.`)}`,q:"l3"},
  {h:"תיאוריות ההתנהגות",html:`<p>במקום \"מי\" המנהיג, תיאוריות ההתנהגות שואלות <b>מה המנהיג עושה</b>. שני מחקרים גדולים מצאו שני ממדים דומים:</p>${tiles([["doc","מבנה יוזם (אוהיו)","הגדרת התפקיד שלו ושל העובדים: חלוקת משימות, סטנדרטים, דדליינים"],["hand","התחשבות (אוהיו)","יחסים של אמון הדדי, כבוד לרעיונות ולרגשות של העובדים"],["chart","מכוון ייצור (מישיגן)","דגש על ההיבטים הטכניים והמשימתיים של העבודה"],["people","מכוון עובדים (מישיגן)","עניין אישי בצרכי העובדים וקבלת ההבדלים ביניהם"]])}${rem("מכוון עובדים דומה להתחשבות, ומכוון ייצור דומה למבנה יוזם.")}`,q:"l5"},
  {h:"מה המחקר מצא, ומה המגבלה",html:`<p>פעם חשבו שהתוצאות של תיאוריות ההתנהגות מאכזבות. אבל סקירה של <b>160 מחקרים</b> מצאה:</p>${tiles([["hand","התחשבות","העוקבים מרוצים יותר מהעבודה, יותר מונעים ומכבדים יותר את המנהיג"],["chart","מבנה יוזם","קשור יותר לפריון גבוה של הקבוצה והארגון ולהערכות ביצוע חיוביות"]])}${def("הבדלים בין תרבויות (GLOBE)",`בברזיל עדיף מנהיג גבוה ב<b>התחשבות</b>, משתף ומכוון צוות. בצרפת רואים מנהיגים באופן ביורוקרטי יותר, ולכן <b>מבנה יוזם</b> יעבוד טוב יותר והתחשבות עלולה להזיק. בסין חשובים שני הממדים: נימוס והתחשבות, וגם אוריינטציה גבוהה לביצועים.`)}${rem("<b>סיכום התכונות וההתנהגויות:</b> מנהיגים עם תכונות מסוימות שמפגינים התחשבות ומבנה יוזם נראים יעילים יותר, אבל עוד לא ברור אם יש קשר בין התכונות להתנהגויות. וחשוב מכך, <b>המגבלה</b>: גם עם התכונות וההתנהגויות הנכונות אפשר להיכשל, כי <b>ההקשר חשוב</b>. מכאן התיאוריות המצביות.")}`,q:"l25"}
 ]},
 {id:"t3",icon:"split",title:"תיאוריות מצביות",blocks:[
  {h:"מודל פידלר",html:`${def("על מה הנושא",`מנהיג שמצליח בצבא לא בהכרח יצליח בסטארט-אפ. התיאוריות המצביות אומרות: אין סגנון אחד שהכי טוב, הכול תלוי במצב.<br><b>מה נלמד כאן:</b> מודל פידלר · תיאוריות מצביות נוספות · LMX: קבוצת פנים וקבוצת חוץ`)}${def("מושג מפתח",`<mark>מודל המצביות של פידלר</mark> ${E("Fiedler contingency model")}: ביצועי הקבוצה תלויים בהתאמה בין <b>סגנון המנהיג</b> לבין <b>מידת השליטה שהמצב נותן לו</b>.`)}<p>הסגנון נמדד בשאלון <b>LPC</b> (העמית הפחות מועדף): מי שמתאר אותו בצורה חיובית הוא <b>מכוון יחסים</b>, ומי שמתאר בשלילה הוא <b>מכוון משימה</b>. לפי פידלר, הסגנון <mark>קבוע</mark>, ולכן צריך לשנות את המצב או להחליף את המנהיג.</p>${tiles([["hand","יחסי מנהיג-חברים","אמון, ביטחון וכבוד של החברים למנהיג"],["doc","מבנה המשימה","עד כמה המשימות מוגדרות בנהלים"],["pyramid","כוח העמדה","השפעה על גיוס, פיטורים, קידום ושכר"]])}${fig("fiedler")}${ex(`מפקד במצב משבר (שליטה נמוכה) יצליח יותר אם הוא מכוון משימה ונותן הוראות ברורות. באותו צוות, בתקופה רגועה עם יחסים טובים, מנהיג מכוון יחסים עשוי להתאים יותר.`)}`,q:"l7"},
  {h:"עוד תיאוריות מצביות",html:`${tiles([["people","מנהיגות מצבית (SLT)","מתמקדת ב<b>מוכנות העוקבים</b>: עד כמה הם מסוגלים ורוצים. לא מסוגלים ולא רוצים? הוראות ברורות. מסוגלים ורוצים? כמעט לא צריך להתערב"],["link","מסלול-מטרה (האוס)","תפקיד המנהיג לפנות את הדרך למטרה. הכוונה עוזרת במשימות עמומות ומלחיצות, ותמיכה עוזרת במשימות מובנות"],["split","מודל ההשתתפות (ורום וייטון)","איך המנהיג מקבל החלטות חשוב כמו מה הוא מחליט. עץ החלטות שקובע כמה לשתף"]])}${rem("לכל התיאוריות האלה הייתה תמיכה מחקרית חלשה או מעורבת. מנהיגות מצבית אינטואיטיבית מאוד, אבל המחקר עליה מאכזב.")}`,q:"l9"},
  {h:"חילופי מנהיג-חבר (LMX)",html:`${def("מושג מפתח",`<mark>תורת LMX</mark> ${E("Leader-member exchange")}: בגלל לחץ זמן, המנהיג יוצר קשר מיוחד עם קבוצה קטנה של עוקבים: <b>קבוצת הפנים</b>. השאר שייכים ל<b>קבוצת החוץ</b>.`)}${tiles([["check","קבוצת הפנים","זוכים לאמון, ליותר תשומת לב ולהטבות. בדרך כלל דומים למנהיג"],["x","קבוצת החוץ","מקבלים פחות זמן ופחות הזדמנויות"]])}${rem("החלוקה נקבעת מוקדם ונשארת יציבה. זה מזכיר נבואה שמגשימה את עצמה: המנהיג משקיע במי שהוא מצפה שיצליח, ולכן הם באמת מצליחים.")}${ex(`המנהל מתייעץ תמיד עם שלושה עובדים ותיקים ונותן להם פרויקטים מעניינים (קבוצת הפנים). שאר העובדים מקבלים רק הוראות רשמיות (קבוצת החוץ).`)}`,q:"l11"}
 ]},
 {id:"t4",icon:"bulb",title:"כריזמה ומנהיגות מעצבת",blocks:[
  {h:"מנהיגות כריזמטית",html:`${def("על מה הנושא",`למה יש מנהיגים שאנשים מוכנים ללכת אחריהם "עד הסוף"? הנושא מציג את הגישות העכשוויות: כריזמה, ומנהיגות שמשנה את העוקבים.<br><b>מה נלמד כאן:</b> מנהיגות כריזמטית · חזון · עסקתית מול מעצבת`)}${def("מושג מפתח",`<mark>תורת המנהיגות הכריזמטית</mark> ${E("Charismatic leadership")}: עוקבים מייחסים למנהיג יכולות הרואיות או יוצאות דופן כשהם רואים התנהגויות מסוימות.`)}${tiles([["target","חזון","ויכולת לבטא אותו"],["question","לקיחת סיכון אישי","כדי להשיג את החזון"],["hand","רגישות","לצרכים של העוקבים"],["bulb","התנהגות יוצאת דופן","לא שגרתית"]])}${def("חזון",`<mark>חזון</mark>: אסטרטגיה ארוכת טווח שמחברת את ההווה לעתיד טוב יותר. <mark>הצהרת חזון</mark>: הניסוח הרשמי שלו.`)}${rem("האם נולדים כריזמטיים או לומדים? <b>גם וגם</b>: יש לזה בסיס תורשתי, אבל אפשר ללמוד התנהגויות כריזמטיות.")}${ex(`<b>חזון</b>: "בעוד חמש שנים כל משפחה בארץ תשתמש באפליקציה שלנו". זה לא יעד חודשי, אלא תמונה של עתיד טוב יותר שמחברת את העבודה היום למשהו גדול.`)}`,q:"l13"},
  {h:"עסקתית מול מעצבת",html:`${tiles([["scales","מנהיגות עסקתית (Transactional)","מכוונת לפי מטרות קיימות, באמצעות הבהרת התפקיד והמשימות"],["sprout","מנהיגות מעצבת (Transformational)","מעוררת השראה שגורמת לעוקבים להתעלות מעל האינטרס האישי לטובת הארגון"]])}${fig("range","מודל הטווח המלא: מהפסיבי והפחות אפקטיבי, למעצב והאפקטיבי ביותר")}${rem("שני הסגנונות <b>משלימים</b>. מנהיגות מעצבת בנויה מעל מנהיגות עסקתית ומוסיפה עליה. המנהיגים הטובים ביותר עושים את שתיהן.")}`,q:"l16"}
 ]},
 {id:"t5",icon:"check",title:"אותנטיות, אתיקה ואמון",blocks:[
  {h:"מנהיגות אותנטית ואתית",html:`${def("על מה הנושא",`מנהיגות טובה היא לא רק אפקטיבית, אלא גם אמינה ומוסרית. הנושא עוסק במנהיגות שבונה אמון לאורך זמן.<br><b>מה נלמד כאן:</b> מנהיגות אותנטית · מנהיגות אתית · אמון · חונכות`)}${def("מנהיגות אותנטית",`מנהיגים <mark>אותנטיים</mark> יודעים מי הם, במה הם מאמינים, ופועלים לפי הערכים שלהם בגלוי. התוצר המרכזי של מנהיגות אותנטית הוא <b>אמון</b>.`)}${tiles([["people","כריזמה חברתית (Socialized)","מנהיג שמשדר ערכים שממוקדים באחרים ולא בעצמו, ומשמש מודל להתנהגות אתית"],["hand","מנהיגות משרתת","מעבר לאינטרס האישי: התמקדות בהזדמנויות לעזור לעוקבים לצמוח ולהתפתח"]])}${ex(`מנכ"לית שאומרת לעובדים בגלוי "טעיתי בהחלטה הזו", ומתנהגת לפי הערכים שהיא מדברת עליהם גם כשזה עולה לה כסף. עובדים יסמכו עליה.`)}`,q:"l18"},
  {h:"אמון וחונכות",html:`${def("מושג מפתח",`<mark>אמון</mark> ${E("Trust")}: ציפייה חיובית שהאחר לא ינצל את המצב לטובתו.`)}${tiles([["check","יושרה","כנות ואמת. <b>המאפיין הקריטי ביותר</b>, וגם עקביות בין מה שאומרים למה שעושים"],["hand","נדיבות (Benevolence)","האדם רוצה בטובתך, גם כשהאינטרסים שלכם שונים"],["grad","יכולת","ידע וכישורים טכניים ובין-אישיים"]])}${def("חונכות",`<mark>חונך</mark> ${E("Mentor")}: עובד בכיר שתומך ומקדם עובד פחות מנוסה (חניך). החונכות משרתת גם פונקציות של קריירה וגם פונקציות פסיכולוגיות-חברתיות.`)}${ex(`<b>חונכות</b>: מהנדסת בכירה שנפגשת כל שבועיים עם מהנדס צעיר, מייעצת לו, מכירה לו אנשים חשובים ומעודדת אותו בתקופות קשות.`)}`,q:"l21"}
 ]},
 {id:"t6",icon:"question",title:"אתגרים למושג המנהיגות",blocks:[
  {h:"האם מנהיגות תמיד חשובה?",html:`${def("על מה הנושא",`האם המנהיג באמת כל כך חשוב? הנושא מציג גישות שמטילות ספק במושג המנהיגות עצמו.<br><b>מה נלמד כאן:</b> תורת הייחוס של מנהיגות · תחליפים ומנטרלים`)}${def("תורת הייחוס של מנהיגות",`לפי תורה זו, מנהיגות היא <mark>רק ייחוס</mark> שאנשים עושים לאחרים. אנחנו נוטים לייחס למנהיגים אחריות לתוצאות קיצוניות, טובות או רעות.`)}${ex("מחקר על 128 חברות גדולות מצא שתפיסת הכריזמה של המנכ\"ל לא הובילה לביצועים טובים יותר, אלא להפך: ביצועים טובים של החברה הובילו לכך שראו במנכ\"ל כריזמטי.")}${tiles([["copies","תחליפים למנהיגות","ניסיון, הכשרה, מטרות פורמליות, נהלים נוקשים וקבוצה מלוכדת יכולים להחליף את הצורך במנהיג"],["lock","מנטרלים","גורמים שמונעים מהמנהיג להשפיע, למשל אדישות לתגמולים של הארגון"]])}`,q:"l23"}
 ]},
 {id:"t7",icon:"check",title:"תרגול בסגנון המבחן",blocks:[
  {h:"מושגים מהמבחן לדוגמה",html:`<p>המבחן לדוגמה בודק גם כמה מושגים מההרצאות שלא מפורטים בפרק:</p>${tiles([["pyramid","כוח לגיטימי","כוח שנובע מהמעמד הפורמלי (מנכ\"ל מורה למנהל). לעומת מומחיות (ידע), זיקה (כריזמה) ושכנוע"],["target","מנהל מול מנהיג","מנהל: שליטה, השגת מטרות, מזעור סיכונים. מנהיג: תשוקה, חזון, לקיחת סיכונים"],["lock","מנהיג אוטוקרטי","מחליט לבד, והקבוצה עובדת בעיקר כשהוא נוכח"]])}<p>השאלה הראשונה בכל זוג לקוחה מקובץ <b>השאלות לדוגמה למבחן</b> של הקורס (עם התשובה לפי המפתח), והשנייה היא שאלה מקבילה בסגנון דומה.</p>`,q:"el1"}
 ]}

const Q={"l1":{"t":"t1","v":[{"q":"עובדת בלי תפקיד ניהולי משכנעת את הצוות לאמץ שיטת עבודה חדשה, והם מאמצים. מה נכון לפי הפרק?","a":"היא מפעילה מנהיגות לא רשמית","w":["זו לא מנהיגות, כי אין לה סמכות פורמלית","זה ניהול, כי היא שינתה את שיטת העבודה","זו מנהיגות רק אם המנהל אישר את השינוי"],"e":"מנהיגות היא השפעה על קבוצה לעבר מטרה, ויכולה לצמוח מחוץ למבנה הפורמלי."},{"q":"מה נכון לגבי הקשר בין מנהיגים למנהלים?","a":"לא כל מנהל הוא מנהיג, ולא כל מנהיג הוא מנהל","w":["כל מנהל הוא מנהיג, אבל לא כל מנהיג הוא מנהל","כל מנהיג הוא מנהל, אבל לא כל מנהל הוא מנהיג","מנהל ומנהיג הם שני שמות לאותו תפקיד"],"e":"מנהל מקבל סמכות פורמלית, אבל זה לא מבטיח שאנשים ילכו אחריו. מנהיג משפיע גם בלי תפקיד רשמי. לכן אף אחד מהשניים לא כולל את השני."}]},
"l2":{"t":"t1","v":[{"q":"מנהל מחלקה בונה תקציב, קובע נהלים ובודק שהעבודה מתבצעת לפי התוכנית. לפי ההבחנה בפרק, הוא עוסק בעיקר ב:","a":"ניהול","w":["מנהיגות מעצבת","מנהיגות כריזמטית","מנהיגות לא רשמית"],"e":"תכנון תקציב, קביעת נהלים ופיקוח על ביצוע לפי תוכנית הם פעולות של ניהול, שמייצר סדר ויציבות. מנהיגות הייתה מתבטאת בחזון ובהשראה."},{"q":"מה המסקנה של הפרק לגבי מנהיגות וניהול בארגון?","a":"ארגון צריך גם מנהיגות חזקה וגם ניהול חזק","w":["מנהיגות חשובה יותר, ולכן אפשר לוותר על ניהול","ניהול חשוב יותר, כי הוא יוצר יציבות","עדיף להפריד: מנהלים לבד ומנהיגים לבד"],"e":"הפרק מסכם שמנהיגות וניהול משלימים זה את זה: מנהיגות נותנת כיוון ושינוי, וניהול נותן סדר ויציבות. ארגון צריך את שניהם, ולא אחד על חשבון השני."}]},
"l26":{"t":"t1","v":[{"q":"מנכ״לית מציגה לעובדים תמונה של לאן החברה תגיע בעוד עשור, ומעוררת בהם התלהבות. מה היא עושה?","a":"מנהיגות: יוצרת חזון ומעוררת השראה","w":["ניהול: מתכננת ובונה מבנה ארגוני","ניהול: מפקחת על הפעילות השוטפת","מנהיגות עסקתית: מבהירה תפקידים"],"e":"יצירת חזון לטווח רחוק והתלהבות של העובדים הן מנהיגות. ניהול היה מתבטא בתכנון, במבנה ובפיקוח שוטף."},{"q":"מה מקור ההשפעה של מנהיגות לפי ההגדרה בפרק?","a":"יכול להיות פורמלי (דרגה) וגם לא רשמי","w":["רק הדרגה הניהולית הפורמלית","רק כריזמה אישית ותכונות מולדות","רק הסכמה של רוב חברי הקבוצה"],"e":"לפי ההגדרה בפרק, ההשפעה של מנהיג יכולה לבוא מדרגה פורמלית, אבל גם לצמוח מתוך הקבוצה בלי שום תפקיד רשמי. לכן ״רק הדרגה״ שגוי."}]},
"l27":{"t":"t1","v":[{"q":"למה מנהיגות לא רשמית חשובה לפעמים יותר מהשפעה פורמלית?","a":"כי היא צומחת מהקבוצה, ואנשים הולכים אחריה מרצון","w":["כי היא תמיד מגובה בסמכות לפטר ולקדם","כי היא קובעת את השכר של חברי הקבוצה","כי היא מוגדרת בנהלים הכתובים של הארגון"],"e":"מנהיגות לא רשמית צומחת מהקבוצה, ואנשים הולכים אחריה מרצון ולא בגלל חובה. היא לא מגובה בסמכות לפטר או לקדם, וזה בדיוק ההבדל."},{"q":"איזה מצב מתאר ״מנהל שאינו מנהיג״?","a":"מנהל שמצייתים לו, אבל לא הולכים אחריו מעבר לזה","w":["עובד בלי תפקיד רשמי שכל הצוות הולך אחריו בפרויקטים","מנהל שיוצר חזון ברור ומסחף את העובדים אחריו","מנהלת שמעוררת השראה ומאתגרת את המצב הקיים בארגון"],"e":"למנהל שאינו מנהיג יש סמכות, ולכן מצייתים לו, אבל אין לו השפעה מעבר לכך. עובד בלי תפקיד שכולם הולכים אחריו הוא ההפך: מנהיג שאינו מנהל."}]},
"l3":{"t":"t2","v":[{"q":"עובד מוחצן מאוד הופך מהר למנהיג הבלתי רשמי של הצוות, אבל הביצועים של הצוות לא משתפרים. מה זה ממחיש?","a":"מוחצנות קשורה יותר להופעת מנהיגים מאשר לאפקטיביות","w":["מוחצנות אינה קשורה למנהיגות בשום צורה","מצפוניות היא התכונה החשובה ביותר למנהיגים","מוחצנות פוגעת באפקטיביות של מנהיגים בצוות"],"e":"מוחצנות קשורה בעיקר להופעה של מנהיגים, למי שבולט ונבחר להוביל, ופחות לאפקטיביות שלהם. לכן העובד הפך למנהיג, אבל הצוות לא השתפר. זה לא אומר שמוחצנות פוגעת."},{"q":"איזו תכונה מחמשת הגדולים קשורה למנהיגות דרך משמעת ועמידה בהתחייבויות?","a":"מצפוניות","w":["מוחצנות","פתיחות לחוויות","נעימות"],"e":"מצפוניות קשורה חזק למנהיגות. פתיחות קשורה ליצירתיות וגמישות."}]},
"l4":{"t":"t2","v":[{"q":"מה מצאו לגבי אסרטיביות של מנהיגים?","a":"אסרטיביות גבוהה במידה עדיפה על אסרטיביות גבוהה מאוד","w":["ככל שהאסרטיביות גבוהה יותר, המנהיג אפקטיבי יותר","אסרטיביות נמוכה היא הכי אפקטיבית","אין קשר בין אסרטיביות לאפקטיביות"],"e":"מנהיגים עם אסרטיביות גבוהה במידה היו אפקטיביים יותר ממנהיגים עם אסרטיביות גבוהה מאוד. לכן ״ככל שגבוהה יותר, טוב יותר״ שגוי."},{"q":"מנהל שם לב שעובדת שקטה מהרגיל ושואל בשקט אם הכול בסדר. איזה מרכיב בא לידי ביטוי?","a":"אמפתיה, כחלק מאינטליגנציה רגשית","w":["מוחצנות, כחלק מחמשת הגדולים","מבנה יוזם, כחלק מתיאוריות ההתנהגות","כריזמה, כחלק מהגישות העכשוויות"],"e":"לשים לב לרגש של עובדת ולהגיב ברגישות זו אמפתיה, מרכיב מרכזי באינטליגנציה רגשית. התחשבות קרובה, אבל היא שייכת לתיאוריות ההתנהגות, ולא היא האפשרות שמופיעה כאן."}]},
"l5":{"t":"t2","v":[{"q":"מנהלת קובעת לוח זמנים מפורט, מגדירה מי אחראי על מה ומצפה לעמידה בסטנדרטים. לפי מחקרי אוהיו ומישיגן, היא גבוהה ב:","a":"מבנה יוזם (ומכוונות ייצור)","w":["התחשבות (ומכוונות עובדים)","מכוונות עובדים (ומבנה יוזם)","התחשבות (ומכוונות ייצור)"],"e":"לוח זמנים, חלוקת אחריות וסטנדרטים הם מבנה יוזם (אוהיו), שמקביל למכוונות ייצור (מישיגן). התחשבות הייתה עוסקת ביחסים ובצורכי העובדים."},{"q":"איזה ממד במחקרי מישיגן מקביל ל״התחשבות״ במחקרי אוהיו?","a":"מכוון עובדים","w":["מכוון ייצור","מבנה יוזם","מכוון משימה"],"e":"שני הממדים עוסקים ביחסים, באמון ובעניין בצורכי העובדים, ולכן ״התחשבות״ באוהיו מקבילה ל״מכוון עובדים״ במישיגן. מכוון ייצור מקביל למבנה יוזם."}]},
"l25":{"t":"t2","v":[{"q":"מנהל רוצה בעיקר להעלות את הפריון ואת הערכות הביצוע של הצוות. לפי הסקירה של 160 מחקרים, על איזה ממד כדאי לו להתמקד?","a":"מבנה יוזם","w":["התחשבות","מוחצנות","מנהיגות לא רשמית"],"e":"לפי הסקירה, מבנה יוזם קשור יותר לפריון ולהערכות ביצוע. התחשבות קשורה בעיקר לשביעות רצון ולמוטיבציה של העובדים."},{"q":"לפי GLOBE, באיזו מדינה התחשבות עלולה דווקא להזיק למנהיג?","a":"צרפת","w":["ברזיל","סין","ישראל"],"e":"בצרפת רואים מנהיגים באופן ביורוקרטי יותר, ולכן מבנה יוזם עדיף."}]},
"l6":{"t":"t2","v":[{"q":"חוקר מנסה לגלות אם למנהיגים מצליחים יש תכונה אישית משותפת. איזו גישה זו, ומה החיסרון שלה?","a":"תיאוריות התכונות, והן מתעלמות מההקשר","w":["תיאוריות ההתנהגות, והן מתעלמות מהתכונות","תיאוריות מצביות, והן מתעלמות מהעוקבים","תורת הייחוס, והיא מתעלמת מהמנהיג"],"e":"חיפוש תכונה אישית משותפת למנהיגים מצליחים הוא תיאוריית התכונות. החיסרון שלה הוא שהיא מתעלמת מההקשר: גם עם התכונות הנכונות אפשר להיכשל במצב הלא מתאים."},{"q":"מה היתרון של תיאוריות ההתנהגות על פני תיאוריות התכונות, מבחינה מעשית?","a":"התנהגויות אפשר ללמד, ולכן אפשר להכשיר מנהיגים","w":["הן מביאות בחשבון את המצב ואת העוקבים","הן הוכיחו שאין תכונות שקשורות למנהיגות","הן מתאימות לכל התרבויות באותה מידה"],"e":"אם מנהיגות היא מה שעושים ולא מי שאתה, אפשר ללמד את ההתנהגויות ולהכשיר מנהיגים. הן לא מביאות בחשבון את המצב: זה החיסרון שלהן, שהתיאוריות המצביות באו לתקן."}]},
"l7":{"t":"t3","v":[{"q":"מנהלת מכוונת יחסים לפי LPC מוצבת במצב משבר עם צוות עוין. לפי פידלר, מה הפתרון?","a":"לשנות את המצב או להחליף אותה, כי הסגנון שלה קבוע","w":["לשלוח אותה להשתלמות כדי שתשנה סגנון","לתת לה להמשיך, כי מכוונת יחסים מתאימה למשבר","לבקש מהצוות להסתגל לסגנון שלה"],"e":"פידלר טען שסגנון המנהיג קבוע ולא משתנה בקלות, ולכן צריך לשנות את המצב או להחליף את המנהיג. השתלמות לשינוי סגנון לא תעבוד לפי התיאוריה שלו."},{"q":"מנהל שיכול לגייס, לפטר ולקבוע שכר נהנה מ:","a":"כוח עמדה גבוה","w":["יחסי מנהיג־חברים טובים","מבנה משימה גבוה","LPC גבוה"],"e":"כוח עמדה הוא ההשפעה הפורמלית על גיוס, פיטורים, קידום ושכר. יחסי מנהיג־חברים עוסקים באמון ובכבוד של הצוות כלפיו, לא בסמכויות."}]},
"l8":{"t":"t3","v":[{"q":"לפי פידלר, באיזה מצב מנהיג מכוון יחסים יצליח יותר ממנהיג מכוון משימה?","a":"במצב של שליטה בינונית","w":["במצב נוח מאוד, עם שליטה גבוהה","במצב לא נוח, עם שליטה נמוכה","בכל מצב שבו יש משבר"],"e":"לפי פידלר, מנהיג מכוון משימה מצליח בקצוות, כשהשליטה גבוהה מאוד או נמוכה מאוד, ומכוון יחסים מצליח במצבים של שליטה בינונית."},{"q":"מנהל מתאר את העמית שהכי פחות אהב לעבוד איתו כ״נחמד ומשתף פעולה, רק לא יעיל״. לפי פידלר, מה סגנונו?","a":"מכוון יחסים","w":["מכוון משימה","מבנה יוזם","מכוון ייצור"],"e":"מי שמתאר גם את העמית הפחות מועדף באופן חיובי מקבל LPC גבוה, ולפי פידלר הוא מכוון יחסים. מי שמתאר אותו בשלילה הוא מכוון משימה."}]},
"l9":{"t":"t3","v":[{"q":"עובד ותיק ומנוסה איבד עניין בעבודה: מסוגל, אבל לא רוצה. לפי SLT, איך המנהל צריך לנהוג?","a":"לתמוך ולשתף, בלי להכתיב הוראות מפורטות","w":["לתת הוראות ברורות ולפקח עליו מקרוב","לא להתערב בכלל, כי הוא מסוגל לבד","להעביר אותו לתפקיד אחר בארגון"],"e":"לפי SLT, מי שמסוגל אבל לא רוצה צריך בעיקר תמיכה ושיתוף, לא הוראות. הוראות ופיקוח צמוד מתאימים למי שעוד לא מסוגל."},{"q":"מה נכון לגבי התמיכה המחקרית בתיאוריית המנהיגות המצבית?","a":"היא אינטואיטיבית מאוד, אבל המחקר עליה מאכזב","w":["היא נתמכה במחקרים רבים בכל התרבויות","היא לא אינטואיטיבית, אבל המחקר תומך בה","היא נבדקה רק במחקרי מעבדה"],"e":"התיאוריה המצבית אינטואיטיבית מאוד ופופולרית, אבל המחקר עליה מאכזב. לכל התיאוריות המצביות הייתה תמיכה חלשה או מעורבת."}]},
"l10":{"t":"t3","v":[{"q":"צוות מבצע משימה שגרתית ומוגדרת היטב. לפי תורת מסלול־מטרה, מה יעזור יותר?","a":"תמיכה","w":["הכוונה צמודה","הגדרת המשימה מחדש","הוראות מפורטות"],"e":"הכוונה עוזרת במשימות עמומות. במשימות מובנות היא מיותרת, ותמיכה עוזרת."},{"q":"מה תפקיד המנהיג לפי תורת מסלול־מטרה של האוס?","a":"לפנות לעוקבים את הדרך למטרה","w":["לקבוע את רמת השיתוף בכל החלטה","להתאים את הסגנון לבשלות העוקבים","ליצור קשר מיוחד עם קבוצת פנים"],"e":"לפי האוס, המנהיג מסלק מכשולים ומפנה לעוקבים את הדרך למטרה. התאמת הסגנון לבשלות העוקבים היא SLT, וקביעת רמת השיתוף היא ורום וייטון."}]},
"l11":{"t":"t3","v":[{"q":"מנהלת נותנת פרויקטים מעניינים בעיקר לעובדים שדומים לה, והם באמת מצליחים יותר. איך LMX מסבירה זאת?","a":"זה דומה לנבואה שמגשימה את עצמה: היא משקיעה במי שהיא מצפה שיצליח","w":["העובדים האלה מוכשרים יותר מלכתחילה, ולכן הם מצליחים","זה ממחיש תחליף למנהיגות, כי העובדים לא צריכים אותה","זו מנהיגות מעצבת, שמפתחת את העוקבים ומעוררת השראה"],"e":"לפי LMX, המנהלת משקיעה יותר במי שבקבוצת הפנים, וההשקעה עצמה מובילה להצלחה, בדומה לנבואה שמגשימה את עצמה. זה לא בהכרח כי הם מוכשרים יותר מלכתחילה."},{"q":"מה נכון לגבי החלוקה לקבוצת פנים וחוץ לפי LMX?","a":"היא נקבעת מוקדם ונשארת יציבה יחסית","w":["היא משתנה כל רבעון לפי הביצועים","היא נקבעת לפי הוותק בארגון","היא נקבעת בשיתוף העובדים"],"e":"החלוקה לקבוצת פנים וחוץ נקבעת מוקדם בקשר, ונוטה לא להשתנות. היא לא מתעדכנת כל רבעון לפי הביצועים."}]},
"l12":{"t":"t3","v":[{"q":"מנהל צריך להחליט על שינוי משמרות. לפי ורום וייטון, מה צריך לקבוע כמה לשתף את העובדים?","a":"מאפייני המצב, לפי עץ החלטות","w":["הסגנון הקבוע של המנהל","מוכנות העוקבים בלבד","הקשר האישי בין המנהל לכל עובד"],"e":"ורום וייטון מציעים עץ החלטות: מאפייני המצב קובעים כמה לשתף את העובדים בכל החלטה. סגנון קבוע הוא פידלר, ומוכנות העוקבים היא SLT."},{"q":"מה הרעיון המרכזי של מודל ההשתתפות של ורום וייטון?","a":"איך מחליטים חשוב כמו מה מחליטים","w":["הסגנון של המנהיג קבוע ולא משתנה","המנהיג צריך לפנות את הדרך למטרה","המנהיג יוצר קבוצת פנים וקבוצת חוץ"],"e":"הרעיון המרכזי הוא שהדרך שבה מחליטים, כלומר כמה משתפים, חשובה כמו ההחלטה עצמה. סגנון קבוע הוא פידלר, ופינוי הדרך למטרה הוא האוס."}]},
"l13":{"t":"t4","v":[{"q":"מנהל מסכן את המשכורת שלו כדי לקדם רעיון שהוא מאמין בו, ומתנהג בדרכים לא שגרתיות. העובדים רואים בו מישהו יוצא דופן. איזו תיאוריה מתארת זאת?","a":"מנהיגות כריזמטית","w":["מנהיגות עסקתית","מנהיגות משרתת","מודל פידלר"],"e":"לקיחת סיכון אישי והתנהגות לא שגרתית הן התנהגויות שגורמות לייחוס כריזמה."},{"q":"איזה מהבאים אינו מאפיין של מנהיג כריזמטי?","a":"הקפדה על נהלים וסטנדרטים","w":["רגישות לצרכים של העוקבים","לקיחת סיכון אישי","התנהגות יוצאת דופן"],"e":"הקפדה על נהלים וסטנדרטים מאפיינת מבנה יוזם ומנהיגות עסקתית, לא כריזמה. רגישות לעוקבים, לקיחת סיכון והתנהגות יוצאת דופן הם מאפיינים כריזמטיים."}]},
"l14":{"t":"t4","v":[{"q":"איזה מהבאים הוא חזון, ולא יעד?","a":"״להפוך כל מרפאה בארץ לנגישה מהבית״","w":["״להגדיל את המכירות ב-10% ברבעון״","״לגייס 20 עובדים עד דצמבר״","״להוריד את זמני ההמתנה ל-5 דקות״"],"e":"חזון הוא אסטרטגיה ארוכת טווח שמחברת את ההווה לעתיד טוב יותר."},{"q":"מה ההבדל בין חזון להצהרת חזון?","a":"חזון הוא האסטרטגיה, הצהרת החזון היא הניסוח הרשמי שלה","w":["חזון הוא לטווח קצר, הצהרת חזון לטווח ארוך","חזון נקבע על ידי העובדים, הצהרה על ידי המנהל","אין הבדל, אלה שני שמות לאותו דבר"],"e":"החזון הוא האסטרטגיה, התמונה של לאן הולכים. הצהרת החזון היא הניסוח הכתוב והרשמי שלה. אין ביניהם הבדל של טווח זמן."}]},
"l15":{"t":"t4","v":[{"q":"מנהל מגדיר לכל עובד יעדים, ומתגמל מי שעומד בהם. העובדים עושים את מה שנדרש, לא יותר. איזה סגנון זה?","a":"מנהיגות עסקתית","w":["מנהיגות מעצבת","מנהיגות כריזמטית","מנהיגות משרתת"],"e":"הגדרת יעדים ותגמול על עמידה בהם הם מנהיגות עסקתית, ולכן העובדים עושים את הנדרש ולא יותר. מנהיגות מעצבת הייתה גורמת להם להתעלות מעבר לנדרש."},{"q":"עובדים בצוות מוותרים מרצון על שעות פנאי כדי שהפרויקט יצליח, כי המנהלת גרמה להם להאמין במטרה. איזה סגנון זה?","a":"מנהיגות מעצבת","w":["מנהיגות עסקתית","מבנה יוזם","לסה־פר"],"e":"עובדים שמוותרים מרצון על אינטרס אישי כי הם מאמינים במטרה מאפיינים מנהיגות מעצבת. בעסקתית הם היו עושים בדיוק מה שמתוגמל."}]},
"l16":{"t":"t4","v":[{"q":"מה נכון לגבי מנהיגים מעצבים, לפי מודל הטווח המלא?","a":"הם עושים גם דברים של מנהיגות עסקתית, ומוסיפים עליהם","w":["הם מוותרים לגמרי על הכלים של מנהיגות עסקתית","הם עושים רק דברים שמנהיגים עסקתיים לא עושים","הם פחות אפקטיביים ממנהיגים עסקתיים לאורך זמן"],"e":"לפי מודל הטווח המלא, מנהיגות מעצבת בנויה מעל עסקתית: מנהיגים מעצבים משתמשים גם בכלים העסקתיים ומוסיפים עליהם השראה וגירוי. הם לא מוותרים עליהם."},{"q":"מנהל שלא מתערב, לא מחליט ונמנע מאחריות. איפה הוא במודל הטווח המלא?","a":"בקצה הפסיבי והפחות אפקטיבי (לסה־פר)","w":["בקצה המעצב והאפקטיבי ביותר","באמצע, כמנהיג עסקתי","מחוץ למודל, כי זו לא מנהיגות"],"e":"לסה־פר, הימנעות מהחלטה ומאחריות, הוא הקצה הפסיבי והפחות אפקטיבי במודל. הוא חלק מהמודל, כנקודת הקצה הנמוכה שלו."}]},
"l17":{"t":"t4","v":[{"q":"מנהלת מעודדת את העובדים לחשוב מחדש על הנחות ישנות ולמצוא פתרונות חדשים לבעיות מוכרות. איזו התנהגות של מנהיגות מעצבת זו?","a":"גירוי אינטלקטואלי","w":["תגמול מותנה","ניהול לפי חריגים","הבהרת תפקידים"],"e":"עידוד לחשוב מחדש על הנחות ולמצוא פתרונות חדשים הוא גירוי אינטלקטואלי, התנהגות של מנהיגות מעצבת. תגמול מותנה וניהול לפי חריגים שייכים לעסקתית."},{"q":"איזו מהבאות היא התנהגות של מנהיגות עסקתית, ולא מעצבת?","a":"תגמול מותנה בביצוע","w":["גירוי אינטלקטואלי","השראה","התחשבות אישית"],"e":"עסקתית מבוססת על החלפה: ביצוע תמורת תגמול, ולכן תגמול מותנה שייך לה. גירוי, השראה והתחשבות אישית הם התנהגויות מעצבות."}]},
"l18":{"t":"t5","v":[{"q":"מנכ״ל אומר לעובדים בגלוי ״טעיתי״ ופועל לפי הערכים שלו גם כשזה פוגע ברווח. מה התוצר המרכזי של התנהגות כזו?","a":"אמון","w":["כריזמה","סטטוס","כוח עמדה"],"e":"הודאה בטעות ופעולה לפי ערכים, גם כשזה עולה ברווח, מאפיינות מנהיגות אותנטית, והתוצר המרכזי שלה הוא אמון. כריזמה היא תכונה אחרת, לא התוצר של אותנטיות."},{"q":"מנהלת מקדישה את רוב זמנה לעזור לעובדים להתפתח ולצמוח, גם כשזה לא מקדם אותה. איזה סגנון זה?","a":"מנהיגות משרתת","w":["מנהיגות עסקתית","מנהיגות כריזמטית","מנהיגות מצבית"],"e":"מנהיגות משרתת מתמקדת בצמיחה ובהתפתחות של העוקבים, גם כשזה לא מקדם את המנהיג. מנהיגות מצבית עוסקת בהתאמת סגנון לעוקבים, לא בשירות שלהם."}]},
"l19":{"t":"t5","v":[{"q":"מה מבדיל מנהיג כריזמטי ״חברתי״ (Socialized) ממנהיג כריזמטי אחר?","a":"הערכים שהוא משדר ממוקדים באחרים ולא בעצמו","w":["הוא פחות מוחצן ופחות בולט מאחרים","הוא מקפיד יותר על נהלים וסטנדרטים","הוא נבחר בבחירות דמוקרטיות בארגון"],"e":"מנהיג כריזמטי חברתי משתמש בכריזמה לטובת אחרים, עם ערכים שממוקדים בהם ולא בו. ההבדל הוא בערכים, לא במידת המוחצנות או ההקפדה על נהלים."},{"q":"מה הקשר בין כריזמה לאתיקה לפי הפרק?","a":"כריזמה יכולה לשמש לטוב או לרע, ולכן מבחינים בכריזמה חברתית","w":["מנהיג כריזמטי תמיד מתנהג באופן אתי כלפי העוקבים","כריזמה ואתיקה סותרות זו את זו, ולכן לא מופיעות יחד","אין ביניהן קשר, כי אלה שני תחומים נפרדים במחקר"],"e":"כריזמה יכולה לשמש לטוב או לרע, ולכן מבחינים בכריזמה חברתית שממוקדת באחרים. מנהיג כריזמטי לא תמיד אתי. בדיוק בגלל זה צריך את ההבחנה."}]},
"l20":{"t":"t5","v":[{"q":"עובדת משתפת את המנהל בטעות שעשתה, כי היא בטוחה שהוא לא ינצל את זה נגדה. מה זה מבטא?","a":"אמון","w":["חוזה פסיכולוגי","כוח עמדה","קונפורמיות"],"e":"היא בטוחה שהמנהל לא ינצל את החולשה שחשפה, וזה אמון: ציפייה חיובית שהאחר לא ינצל את המצב. חוזה פסיכולוגי עוסק בציפיות הדדיות בין עובד למעסיק, לא בשיתוף פגיעות."},{"q":"מה ההגדרה של אמון לפי הפרק?","a":"ציפייה חיובית שהאחר לא ינצל את המצב לטובתו","w":["הסכם לא כתוב על ציפיות הדדיות בין הצדדים","הערכה שהאחר מוכשר ומקצועי בתחום שלו","תחושה שהאחר דומה לי בערכים ובהשקפות"],"e":"לפי הפרק, אמון הוא ציפייה חיובית שהאחר לא ינצל את המצב לטובתו. ״הסכם לא כתוב על ציפיות הדדיות״ הוא הגדרה של חוזה פסיכולוגי."}]},
"l21":{"t":"t5","v":[{"q":"מנהל מומחה מאוד בתחומו, אבל ידוע שהוא אומר דבר אחד ועושה אחר. איזה ממד של אמון חסר?","a":"יושרה","w":["יכולת","נדיבות","כריזמה"],"e":"יושרה כוללת כנות ועקביות בין מה שאומרים למה שעושים, וזה מה שחסר כאן. המומחיות שלו (יכולת) דווקא קיימת."},{"q":"מנהלת ישרה ורוצה בטובת העובדים, אבל חסרה לה הבנה מקצועית בתחום. איזה ממד של אמון נפגע?","a":"יכולת","w":["יושרה","נדיבות","אותנטיות"],"e":"היא כנה (יושרה) ורוצה בטובתם (נדיבות), אבל חסר לה ידע מקצועי, וזה ממד היכולת. נדיבות היא הרצון בטובת האחר, והוא דווקא קיים אצלה."}]},
"l22":{"t":"t5","v":[{"q":"מנהלת בכירה מכירה לעובד צעיר אנשים חשובים, ממליצה עליו לפרויקטים ומעודדת אותו בתקופות קשות. אילו פונקציות של חונכות מופיעות כאן?","a":"גם פונקציות קריירה וגם פסיכולוגיות־חברתיות","w":["רק פונקציות של קידום בקריירה","רק פונקציות פסיכולוגיות־חברתיות","אף אחת, כי זו בעצם מנהיגות עסקתית"],"e":"היכרות עם אנשים חשובים והמלצות לפרויקטים הן פונקציות קריירה, ועידוד בתקופות קשות הוא פונקציה פסיכולוגית־חברתית. לכן מופיעים כאן שני הסוגים."},{"q":"מהו חונך (Mentor)?","a":"עובד בכיר שתומך ומקדם עובד פחות מנוסה","w":["מנהל ישיר שמעריך את ביצועי העובד","עמית באותה רמה שעוזר במשימות","יועץ חיצוני שמלווה את הארגון"],"e":"חונך הוא עובד בכיר שתומך ומקדם עובד פחות מנוסה. הוא לא בהכרח הממונה הישיר, ולא עמית באותה רמה."}]},
"l23":{"t":"t6","v":[{"q":"אחרי שנה מצוינת, עיתונים מתארים את המנכ״ל כ״גאון כריזמטי״. לפי תורת הייחוס של מנהיגות, מה סביר?","a":"הביצועים הטובים גרמו לייחס לו כריזמה, ולא להפך","w":["הכריזמה שלו היא שגרמה לביצועים הטובים","אין קשר בין הביצועים לבין תפיסת הכריזמה","הכריזמה היא תכונה מולדת שהתגלתה השנה"],"e":"לפי תורת הייחוס, אחרי הצלחה בולטת אנשים מייחסים למנהיג כריזמה. המחקר על 128 חברות מצא שהביצועים מובילים לתפיסת הכריזמה, ולא הכריזמה לביצועים."},{"q":"לפי תורת הייחוס, למה מנכ״לים מפוטרים כשחברה נכשלת?","a":"כי אנשים נוטים לייחס למנהיגים אחריות לתוצאות קיצוניות","w":["כי מחקרים הוכיחו שהמנכ״ל קובע את רוב התוצאות","כי המנכ״ל אחראי באופן אישי לכל החלטה בארגון","כי זה מה שהחוק מחייב בחברות ציבוריות גדולות"],"e":"אנשים נוטים לייחס למנהיגים אחריות לתוצאות קיצוניות, טובות או רעות, ולכן מפטרים מנכ״לים בכישלון. מחקרים לא הוכיחו שהמנכ״ל קובע את רוב התוצאות."}]},
"l24":{"t":"t6","v":[{"q":"צוות אחיות מנוסה, עם נהלים ברורים וצוות מלוכד, מתפקד היטב גם כשהאחראית בחופשה. מה זה ממחיש?","a":"תחליפים למנהיגות","w":["מנטרלים של מנהיגות","בטלנות חברתית","מנהיגות לא רשמית"],"e":"ניסיון, נהלים ברורים ולכידות מייתרים את הצורך במנהיג, ולכן הם תחליפים למנהיגות. מנטרל היה מונע מהמנהיגה להשפיע גם כשהיא נוכחת."},{"q":"מה ההבדל בין תחליף למנהיגות לבין מנטרל?","a":"תחליף מייתר את המנהיג, מנטרל מונע ממנו להשפיע","w":["תחליף מונע מהמנהיג להשפיע, מנטרל מייתר אותו","שניהם מחזקים את השפעת המנהיג","אין הבדל, אלה שני שמות לאותו דבר"],"e":"תחליף מייתר את המנהיג, כי לא צריך אותו. מנטרל מונע ממנו להשפיע, גם כשצריך אותו. המסיח הראשון הופך את השניים."}]},
"l28":{"t":"t6","v":[{"q":"עובדים במשרה זמנית, שלא אכפת להם מבונוסים או מקידום. מנהלת מנסה להניע אותם בתגמולים ונכשלת. איזה גורם פועל?","a":"מנטרל של מנהיגות","w":["תחליף למנהיגות","קבוצת חוץ לפי LMX","מבנה משימה גבוה"],"e":"העובדים אדישים לתגמולים, ולכן הכלים של המנהלת לא משפיעים עליהם, וזה מנטרל של מנהיגות. תחליף היה מייתר אותה, אבל כאן היא נכשלת בניסיון להשפיע."},{"q":"מה המשותף לתורת הייחוס ולרעיון התחליפים?","a":"שתיהן מטילות ספק בחשיבות של המנהיג","w":["שתיהן טוענות שמנהיגות היא תכונה מולדת","שתיהן מדגישות את הכריזמה של המנהיג","שתיהן עוסקות בקבוצת פנים וחוץ"],"e":"גם תורת הייחוס (״המנהיגות היא בעיני המתבונן״) וגם רעיון התחליפים (״לפעמים לא צריך מנהיג״) מטילים ספק בחשיבות המנהיג. הם לא עוסקים בתכונות מולדות או בכריזמה."}]},
"l29":{"t":"t6","v":[{"q":"איזה מהבאים אינו תחליף למנהיגות לפי הפרק?","a":"כריזמה של המנהל","w":["ניסיון והכשרה של העובדים","נהלים נוקשים ומטרות פורמליות","קבוצה מלוכדת"],"e":"כריזמה היא חלק מהמנהיגות עצמה, ולכן היא לא תחליף לה. ניסיון, נהלים וקבוצה מלוכדת הם תחליפים, כי הם מייתרים את הצורך במנהיג."},{"q":"מה המסקנה מהמחקר על 128 חברות לגבי הקשר בין כריזמה לביצועים?","a":"הכיוון הפוך מהמצופה: ביצועים מובילים לתפיסת כריזמה","w":["כריזמה של המנכ״ל מובילה לביצועים טובים יותר","אין שום קשר בין ביצועים לתפיסת כריזמה","כריזמה מובילה לביצועים רק בחברות קטנות"],"e":"המחקר על 128 חברות מצא שהכיוון הפוך מהמצופה: ביצועים טובים מובילים לכך שמייחסים למנכ״ל כריזמה. זו הראיה המרכזית לתורת הייחוס."}]},
"el1":{"t":"t7","v":[{"q":"מנהל השיווק מתלונן שמנהל התפעול מסרב להיפגש איתו. המנכ\"ל מתקשר למנהל התפעול ואומר לו להיפגש עם מנהל השיווק מיד, והפגישה מתקיימת. הכוח של המנכ\"ל הוא דוגמה ל:","a":"כוח לגיטימי","w":["כוח המומחיות","כוח הזיקה / הכריזמה","כוח השכנוע הרציונלי"],"e":"המנכ״ל משפיע בזכות המעמד הפורמלי שלו בהיררכיה, וזה כוח לגיטימי. מנהל התפעול לא נענה בגלל מומחיות או הערכה אישית, אלא כי המנכ״ל הוא הממונה."},{"q":"עובדים ממלאים בקשות של מנהלת צוות כי היא נעימה ומעוררת הערכה, ולא בגלל התפקיד שלה. איזה כוח זה?","a":"כוח הזיקה","w":["כוח לגיטימי","כוח המומחיות","כוח שכנוע"],"e":"היא משפיעה בגלל שאוהבים ומעריכים אותה, ולא בגלל התפקיד, וזה כוח הזיקה. כוח לגיטימי היה נובע מהתפקיד עצמו."}]},
"el2":{"t":"t7","v":[{"q":"\"במצבים מסוימים מנהל צריך להתנהג כמאמן ולתת הדרכה ותמיכה... יש שלבים אחרים בהם המנהל צריך להרפות ולהאציל סמכויות.\" איזו תיאוריה תואמת?","a":"התיאוריה המצבית","w":["מנהיגות מתגמלת / עסקתית","הגישה האותנטית למנהיגות","גישת התכונות למנהיגות"],"e":"מעבר מאימון ותמיכה להרפיה והאצלה, לפי השלב של העובד, הוא הרעיון של התיאוריה המצבית (SLT). גישת התכונות לא מדברת על שינוי סגנון לפי המצב."},{"q":"עובדת חדשה ונלהבת, אבל בלי ניסיון. לפי התיאוריה המצבית, מה המנהל צריך לתת לה?","a":"הכוונה והדרכה ברורה","w":["האצלת סמכויות מלאה","חופש מלא בלי התערבות","בעיקר תמיכה רגשית"],"e":"היא רוצה, אבל עוד לא מסוגלת, ולכן לפי SLT היא צריכה בעיקר הכוונה והדרכה ברורה. תמיכה רגשית מתאימה יותר למי שמסוגל אבל חסר מוטיבציה."}]},
"el3":{"t":"t7","v":[{"q":"על פי הנלמד בכיתה, מה נכון בנוגע למנהיגות וניהול?","a":"האנרגיה המאפיינת את המנהל היא שליטה, ואת המנהיג תשוקה","w":["מנהיג טוב הוא בהכרח מנהל טוב","מנהל אחראי על חזון ומנהיג על השגת מטרות","המנהל לוקח סיכונים ואילו המנהיג ממזער סיכונים"],"e":"לפי ההבחנה שנלמדה: מנהיג מוביל חזון ולוקח סיכונים, מנהל אחראי להשגת מטרות ולשליטה."},{"q":"לפי ההבחנה שנלמדה בכיתה, איזה מהבאים מאפיין מנהל יותר ממנהיג?","a":"מזעור סיכונים","w":["תשוקה","חזון","לקיחת סיכונים"],"e":"מנהל: שליטה, מטרות ומזעור סיכונים. מנהיג: תשוקה, חזון וסיכון."}]},
"el4":{"t":"t7","v":[{"q":"מה נכון לגבי מנהיג מעצב?","a":"המנהיג גורם למונהגים להאמין בעצמם","w":["המנהיג גורם למונהגים להאמין בו","המנהיג מגיב לציפיות המונהגים","המנהיג גורם למונהגים לא להאמין באף אחד"],"e":"מנהיג מעצב מפתח את המונהגים ומחזק את האמונה שלהם ביכולת שלהם. ״גורם למונהגים להאמין בו״ נשמע קרוב, אבל המטרה היא האמונה שלהם בעצמם, לא בו."},{"q":"איזה משפט מתאר מנהיג מעצב?","a":"גורם לעובדים להאמין שהם מסוגלים ליותר","w":["מתגמל רק את מי שעומד ביעדים שנקבעו","מתערב רק כשמשהו משתבש בעבודה","מחליט לבד וקובע את המדיניות לכולם"],"e":"מנהיג מעצב גורם לעובדים להאמין שהם מסוגלים ליותר. מתגמל מי שעומד ביעדים הוא עסקתי, ומתערב רק כשמשהו משתבש הוא ניהול לפי חריגים."}]},
"el5":{"t":"t7","v":[{"q":"כאשר מנהל מחליט הכול לבד וקובע את מדיניות הקבוצה (מנהיג אוטוקרטי):","a":"הקבוצה מפסיקה לעבוד כשהמנהיג לא נמצא לידה","w":["הקבוצה עובדת בחוסר יעילות מוחלטת","הקבוצה מפסיקה לעבוד אחרי שהושג היעד הראשון הנמוך ביותר","הקבוצה מתנהלת ברוגע"],"e":"זו התשובה לפי מפתח המבחן לדוגמה: תחת מנהיג אוטוקרטי העבודה תלויה בנוכחותו."},{"q":"מנהל אוטוקרטי יוצא לחופשה של שבועיים. מה צפוי לקרות לפי מה שנלמד?","a":"העבודה תאט מאוד, כי הקבוצה תלויה בנוכחותו","w":["העבודה תשתפר, כי יהיה לעובדים יותר חופש","לא ישתנה כלום, כי הנהלים ברורים לכולם","הקבוצה תבחר מנהיג חדש מתוכה עד שיחזור"],"e":"בסגנון אוטוקרטי הקבוצה רגילה שהמנהיג מחליט הכל, ולכן היא עובדת בעיקר כשהוא נוכח, ובלעדיו העבודה מאטה. העובדים לא רגילים לחופש, ולכן היא לא תשתפר."}]}};

try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mgmt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
