<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>לומדות פסיכולוגיה ומנהל עסקים</title>
<meta name="description" content="לומדות אינטראקטיביות לקורסים בפסיכולוגיה ומנהל עסקים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Hub structure and motion shared by every style. Skins set tokens and surface treatment. */
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,17px);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--display);font-weight:var(--hw,700);margin:0;line-height:1.2;text-wrap:balance}
p,dl,dd{margin:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.in{max-width:1100px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* site bar */
.site{position:sticky;top:0;z-index:10;background:var(--bar-bg);color:var(--bar-ink);border-bottom:var(--bw) solid var(--bar-line);padding-top:env(safe-area-inset-top,0px)}
.site-in{display:flex;justify-content:space-between;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--mark-bg);color:var(--mark-ink);font-family:var(--display);font-size:19px;font-weight:700}
.bt{display:flex;flex-direction:column;line-height:1.15}
.bt b{font-family:var(--display);font-size:17px;font-weight:var(--hw,700)}
.bt small{font-size:.74rem;opacity:.72}
.term{font-size:.82rem;opacity:.75}
@media (max-width:520px){.term{display:none}}

main .in{padding-block:30px 64px}
.v-home,.v-course{display:flex;flex-direction:column;gap:28px}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding-block:12px 4px}
.intro h1{font-size:clamp(1.8rem,4.6vw,2.7rem);max-width:20ch}
.lede{margin-top:12px;color:var(--muted);max-width:60ch;font-size:1.02rem;line-height:1.7}
.facts{display:flex;gap:0;border:var(--bw) solid var(--line);border-radius:var(--r-card);background:var(--surface);box-shadow:var(--shadow-s);overflow:hidden}
.facts div{padding:14px 22px;display:flex;flex-direction:column;align-items:center;min-width:96px}
.facts div+div{border-inline-start:var(--bw) solid var(--line)}
.facts dt{font-family:var(--display);font-size:1.8rem;font-weight:var(--hw,700);line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.facts dd{font-size:.8rem;color:var(--muted)}
@media (max-width:760px){.intro{grid-template-columns:1fr;gap:18px}.facts{align-self:start;width:100%}.facts div{flex:1;min-width:0;padding:12px}}

/* resume */
.resume{display:grid;grid-template-columns:1fr auto;grid-template-areas:"k go" "t go" "s go";align-items:center;gap:2px 16px;background:var(--surface);border:var(--bw) solid var(--line);border-inline-start:4px solid var(--c);border-radius:var(--r-card);padding:16px 20px;box-shadow:var(--shadow-s);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.resume:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.rk{grid-area:k;font-size:.78rem;font-weight:600;color:var(--c);letter-spacing:var(--track,.02em)}
.rt{grid-area:t;font-weight:600;font-size:1.08rem;text-align:right}
.rs{grid-area:s;font-size:.85rem;color:var(--muted)}
.rgo{grid-area:go;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.rgo svg{width:20px;height:20px}

/* week */
.week{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.wtop{width:100%;background:none;border:none;display:flex;align-items:center;gap:14px;padding:16px 20px;text-align:right}
.wico{flex:none;width:48px;height:48px;border-radius:var(--r-icon);background:var(--ink);color:var(--surface);display:grid;place-items:center;position:relative;overflow:hidden}
.wico::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,var(--mgmt) 0 16.6%,var(--intro) 0 33.3%,var(--social) 0 50%,var(--dev) 0 66.6%,var(--phys) 0 83.3%,var(--mkt) 0)}
.wico svg{width:24px;height:24px}
.wtt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.wtt h2{font-size:1.35rem}
.wtt small{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
.wchev{flex:none;width:34px;height:34px;border-radius:50%;background:var(--raised);display:grid;place-items:center;color:var(--muted);transition:transform var(--dur-l) var(--ease)}
.wchev svg{width:18px;height:18px}
.week.open .wchev{transform:rotate(180deg)}
.wbody{border-top:var(--bw) solid var(--line)}
.wh{padding:12px 20px;border-bottom:var(--bw) solid var(--line)}
.wnav{display:flex;justify-content:space-between;gap:8px;align-items:center}
.wnav.center{justify-content:center;padding:12px}
.wlab{font-size:.88rem;color:var(--muted);font-weight:600}
.wnav button{height:34px;border-radius:var(--r-pill);border:var(--bw) solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:.86rem;font-weight:600;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
.wnav button:hover{border-color:var(--muted)}
.wnav svg{width:16px;height:16px}
.lessons{list-style:none;margin:0;padding:0}
.les{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:16px 20px;border-bottom:var(--bw) solid var(--line)}
.les:last-child{border-bottom:none}
.ldate{display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:start;border-radius:var(--r-btn);background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);padding:8px 0;line-height:1.15;font-variant-numeric:tabular-nums}
.ldate b{font-size:1.05rem}.ldate span{font-size:.8rem;font-weight:600}
.lmain{display:flex;flex-direction:column;gap:8px;min-width:0}
.lhd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lcourse{font-weight:700;font-size:.98rem;color:var(--ink)}
.ltop{font-size:.92rem;color:var(--muted);line-height:1.5}
.les.off .ltop,.les.off .lcourse{text-decoration:line-through;color:var(--muted)}
.les.off .ldate{opacity:.6}
.tag{font-size:.72rem;font-weight:700;border-radius:var(--r-pill);padding:2px 9px;background:var(--c);color:#fff}
.tag.warn{background:var(--bad);color:#fff}
.tag.est{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.lmods{display:flex;flex-direction:column;gap:6px}
.lmod{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:var(--raised);border-radius:var(--r-btn);padding:10px 12px}
.lmod .t{flex:1 1 240px;font-weight:600;font-size:.93rem;line-height:1.4;min-width:0;display:flex;flex-direction:column;text-align:right}
.lmod .t small{font-weight:400;font-size:.8rem;color:var(--muted)}
.lnone,.wempty{font-size:.88rem;color:var(--muted)}
.wempty{padding:20px}
.wfoot{font-size:.76rem;color:var(--muted);padding:10px 20px;border-top:var(--bw) solid var(--line);background:var(--raised)}
@media (max-width:560px){.les{grid-template-columns:48px minmax(0,1fr);gap:12px;padding:14px}.wh{padding:14px}}

/* action buttons: one vocabulary for lomda / summary / exam / podcast */
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--r-btn);font-size:.84rem;font-weight:600;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease)}
.act svg{width:16px;height:16px;color:var(--c)}
.act:hover{border-color:var(--c);color:var(--c)}
.act.main{background:var(--c);border-color:var(--c);color:#fff}
.act.main svg{color:#fff}
.act.main:hover{filter:brightness(1.08);color:#fff}

/* course grid */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:1.45rem}
.sec-h span{color:var(--muted);font-size:.88rem}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.course{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-s);padding:20px;overflow:hidden;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.course:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.cicon{width:44px;height:44px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.cicon svg{width:24px;height:24px}
.ctag{font-size:.76rem;font-weight:700;color:var(--c);letter-spacing:var(--track,.02em)}
.course h3{font-size:1.22rem;line-height:1.3}
.cstats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.cprog{display:flex;align-items:center;gap:10px;margin-top:4px}
.cprog b{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.bar{flex:1;display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:inherit}
.copen{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem;color:var(--c);margin-top:4px}
.copen svg{width:18px;height:18px;transition:transform var(--dur) var(--ease)}
.course:hover .copen svg{transform:translateX(-4px)}
.sfoot{color:var(--muted);font-size:.84rem;border-top:var(--bw) solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* course view */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
.crumbs a{font-weight:600}.crumbs a:hover{color:var(--c)}
.crumbs span:last-child{color:var(--ink);font-weight:600}
.chero{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;background:var(--chero-bg,var(--surface));color:var(--chero-ink,var(--ink));border:var(--bw) solid var(--chero-line,var(--line));border-radius:var(--r-card);padding:24px;box-shadow:var(--shadow-s)}
.chero .cicon{width:58px;height:58px}
.chero .cicon svg{width:30px;height:30px}
.ch-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.chero h1{font-size:clamp(1.6rem,4.4vw,2.3rem)}
.chero .cprog{grid-column:1/-1;margin-top:10px}
.howto{color:var(--muted);font-size:.95rem;line-height:1.7;max-width:80ch}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,34%);gap:16px 24px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card-s);padding:18px 20px;box-shadow:var(--shadow-s);transition:border-color var(--dur) var(--ease)}
.mrow:hover{border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.mr-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.mtype{font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:var(--track,.02em)}
.mname{font-family:var(--display);font-size:1.15rem;font-weight:var(--hw,700);line-height:1.35;text-align:right}
.mname[lang=en]{font-family:var(--latin,var(--body))}
.mname:hover{color:var(--c)}
.msub{font-size:.88rem;color:var(--muted)}
.mwhen{display:flex;gap:6px;align-items:flex-start;font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.45}
.mwhen svg{width:15px;height:15px;margin-top:2px;color:var(--c)}
.soon{flex:none;background:var(--c);color:#fff;border-radius:var(--r-pill);padding:0 8px;font-weight:700;font-size:.72rem}
.mr-side{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.mprog{display:flex;flex-direction:column;gap:4px}
.mprog small{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:760px){.mrow{grid-template-columns:1fr}}
.empty{display:flex;gap:10px;align-items:center;padding:18px;border:1.5px dashed var(--line);border-radius:var(--r-card-s);color:var(--muted)}
.empty svg{width:20px;height:20px;color:var(--c)}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(var(--dist))}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@media (prefers-reduced-motion:no-preference){
  .v-home>*,.v-course>*{animation:rise var(--dur-l) var(--ease) both}
  .v-home>*:nth-child(2),.v-course>*:nth-child(2){animation-delay:50ms}
  .v-home>*:nth-child(3),.v-course>*:nth-child(3){animation-delay:100ms}
  .v-home>*:nth-child(n+4),.v-course>*:nth-child(n+4){animation-delay:150ms}
  .course,.mrow{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 180ms)}
  .bar i{transform-origin:right;animation:grow 1s cubic-bezier(.2,.7,.2,1) .35s both}
  .week.swap .wbody{animation:fadein var(--dur-l) var(--ease) both}
  .week.swap .les{animation:rise var(--dur-l) var(--ease) both}
  .week.swap .les:nth-child(2){animation-delay:40ms}.week.swap .les:nth-child(3){animation-delay:80ms}.week.swap .les:nth-child(n+4){animation-delay:120ms}
}

/* Style 3 · צבעוני: the original course colours, carried with confidence; soft depth and springy motion */
:root{
  --display:"Rubik","Segoe UI",Arial,sans-serif; --body:"Rubik","Segoe UI",Arial,sans-serif; --latin:"Rubik","Segoe UI",Arial,sans-serif;
  --hw:700; --track:.02em; --fs:17.5px;
  --bg:#eef1f6; --surface:#ffffff; --raised:#f4f6fa; --ink:#111827; --muted:#596275; --line:#e2e6ee; --track-bg:#e6e9f0;
  --accent:#2457a6; --on-accent:#fff; --mark:#ffe27a;
  --good:#1f8a52; --good-soft:#e3f5eb; --bad:#c8402b; --bad-soft:#fde9e5;
  --mgmt:#2457a6; --intro:#6a46c2; --social:#d0532c; --dev:#2b8546; --phys:#b5305a; --mkt:#0e7c86;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --bar-bg:#111827; --bar-ink:#fff; --bar-line:#111827; --mark-bg:linear-gradient(135deg,#2457a6,#6a46c2); --mark-ink:#fff;
  --r-card:20px; --r-card-s:16px; --r-btn:12px; --r-icon:14px; --r-pill:999px; --r-opt:14px; --r-k:9px;
  --bw:1px; --shadow:0 1px 2px rgba(17,24,39,.05),0 12px 32px rgba(17,24,39,.07); --shadow-s:0 1px 2px rgba(17,24,39,.05),0 4px 14px rgba(17,24,39,.05);
  --dur:220ms; --dur-l:440ms; --ease:cubic-bezier(.22,1.2,.36,1); --dist:14px;
  --fab-bg:#111827; --art-bg:color-mix(in srgb,var(--accent) 8%,#fff);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1018; --surface:#141b26; --raised:#1a2330; --ink:#eef2f7; --muted:#9aa6b8; --line:#243042; --track-bg:#243042;
  --accent:#7fa6ec; --on-accent:#0b1018; --mark:rgba(255,214,77,.3);
  --good:#5fd197; --good-soft:#123222; --bad:#f08a72; --bad-soft:#3b1f1a;
  --mgmt:#7fa6ec; --intro:#ad90f2; --social:#f28a64; --dev:#6dcf8e; --phys:#f07a9e; --mkt:#4cc9d4;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a;
  --bar-bg:#070b11; --bar-line:#1a2230; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.3); --shadow-s:0 1px 2px rgba(0,0,0,.35);
  --fab-bg:#243042; --art-bg:#1a2330; color-scheme:dark}}
.mark{background:var(--mark-bg)}

/* hub */
.intro{background:var(--ink);color:#fff;border-radius:var(--r-card);padding:34px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.intro::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:linear-gradient(90deg,var(--mgmt) 0 16.6%,var(--intro) 0 33.3%,var(--social) 0 50%,var(--dev) 0 66.6%,var(--phys) 0 83.3%,var(--mkt) 0)}
.intro .lede{color:rgba(255,255,255,.75)}
.facts{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);box-shadow:none}
.facts div+div{border-color:rgba(255,255,255,.12)}
.facts dt{color:#fff}.facts dd{color:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.intro{background:#18212e}}
.course{padding:0;border:none;gap:0}
.course .cicon{position:absolute;top:18px;left:18px;background:rgba(255,255,255,.18);color:#fff}
.course .ctag{background:var(--c);color:rgba(255,255,255,.85);padding:20px 20px 4px}
.course .cstats{margin-top:14px}.course .cprog{margin-top:10px}.course .copen{margin-top:10px}
.course h3{background:var(--c);color:#fff;padding:0 20px 22px 76px;min-height:72px;display:flex;align-items:flex-end}
.course .cstats,.course .cprog,.course .copen{padding-inline:20px}
.course .copen{padding-bottom:18px}
.week{border:none}
.wh{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.lmod{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.chero{--chero-bg:var(--c);--chero-ink:#fff;--chero-line:transparent;box-shadow:var(--shadow)}
.chero .ctag{color:rgba(255,255,255,.8)}
.chero .cstats{color:rgba(255,255,255,.8)}
.chero .cicon{background:rgba(255,255,255,.16);color:#fff}
.chero .bar{background:rgba(255,255,255,.22)}.chero .bar i{background:#fff}
.mrow{border:none}
.act{border-color:color-mix(in srgb,var(--c) 30%,var(--line))}

/* module */
.mhero{border:none}
.mhero-art{border-bottom:none}
.mhero h1 .entitle,.mhero h1{color:var(--ink)}
.h1pre{color:var(--accent)}
.tool{border:none}
.trow-btn{border:none}
.card,.q{border:none}
.page .ph{font-size:1.5rem}
.opt{--opt-bg:var(--raised)}
.big{color:var(--c)}

</style>
</head>
<body>
<header class="site">
 <div class="in site-in">
  <a class="brand" href="./" id="brand" aria-label="לומדות, דף הבית"><span class="mark" aria-hidden="true">ל</span><span class="bt"><b>לומדות</b><small>פסיכולוגיה ומנהל עסקים</small></span></a>
  <span class="term">רופין · שנה א' · סמסטר א'</span>
 </div>
</header>
<main><div class="in" id="view"></div></main>
<script>
const ICON={

const ALL=COURSES.flatMap(c=>c.items.map(it=>Object.assign({course:c},it)));
function load(key){try{return JSON.parse(localStorage.getItem(key)||"null")}catch(e){return null}}
function stats(key){const s=load(key);if(!s||!s.q)return null;const v=Object.values(s.q);if(!v.some(x=>x.n))return null;return v.filter(x=>x.c>=2).length}
const pct=it=>{const m=stats(it.key);return m==null?null:Math.min(100,Math.round(100*m/it.total))};
const coursePct=c=>{const tot=c.items.reduce((a,i)=>a+i.total,0);if(!tot)return 0;return Math.round(100*c.items.reduce((a,i)=>a+(stats(i.key)||0),0)/tot)};
const soon=d=>{if(!d)return "";const t=new Date(d+"T00:00"),now=new Date();now.setHours(0,0,0,0);const n=Math.round((t-now)/864e5);return n<0||n>14?"":n===0?"היום":n===1?"מחר":`בעוד ${n} ימים`};
const view=document.getElementById("view");
const word=n=>n===0?"אין עדיין לומדות":n===1?"לומדה אחת":`${n} לומדות`;
const pods=items=>items.filter(i=>i.pod).length;
const SHORT={mgmt:"מבוא לניהול",intro:"מבוא לפסיכולוגיה",social:"פסיכולוגיה חברתית",dev:"פסיכולוגיה התפתחותית",phys:"יסודות פיזיולוגיים",mkt:"ניהול השיווק"};
const DAYS=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
let SCHED=null,wOff=0,wOpen=false;try{wOpen=localStorage.getItem("week-open")==="1"}catch(e){}
fetch("schedule.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{SCHED=d.lessons||[];renderWeek()}).catch(()=>{SCHED=[];renderWeek()});
const dm=iso=>{const [y,m,d]=iso.split("-").map(Number);return `${d}.${m}`};
const dayOf=iso=>DAYS[new Date(iso+"T00:00").getDay()];
const isoOf=t=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
function weekRange(off){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()-t.getDay()+7*off);const e=new Date(t);e.setDate(e.getDate()+6);return [isoOf(t),isoOf(e)]}
const ITEM=k=>ALL.find(i=>i.key===k)||null;
const acts=(it,f={})=>`<a class="act main" href="${it.href}${f.t?"#topic-"+f.t:""}">${ic("book")}<span>לומדה</span></a><a class="act" href="${it.href}${f.abs?"#abs":"#sum"+(f.sec?"-"+f.sec:"")}">${ic("doc")}<span>${f.abs?"תקציר":"סיכום"}</span></a><a class="act" href="${it.href}#quiz">${ic("grad")}<span>מבחן</span></a>${it.pod?`<a class="act" href="${it.href}#pod" aria-label="פודקאסט, ${it.pod} דקות">${ic("head")}<span>${it.pod} דק׳</span></a>`:""}`;
function lessonHTML(l,a,b){
  const moved=l.status==="נדחה"&&l.newDate, here=moved&&l.newDate>=a&&l.newDate<=b;
  const date=here?l.newDate:l.date, off=l.status==="בוטל"||(moved&&!here);
  let tags="";
  if(l.status==="בוטל")tags+=`<span class="tag warn">בוטל</span>`;
  else if(moved&&!here)tags+=`<span class="tag warn">נדחה ל־${dm(l.newDate)}</span>`;
  else if(here)tags+=`<span class="tag">נדחה מ־${dm(l.date)}</span>`;
  if(l.est&&!l.status)tags+=`<span class="tag est">תאריך משוער</span>`;
  const mods=l.mods.map(ITEM).filter(Boolean);
  return `<li class="les${off?" off":""}" style="--c:var(--${l.c})"><div class="ldate"><b>${dayOf(date)}</b><span>${dm(date)}</span></div><div class="lmain"><div class="lhd"><span class="lcourse">${SHORT[l.c]} · שיעור ${l.n}</span>${tags}</div>
   <div class="ltop">${l.topic}${l.note&&!l.est?` · ${l.note}`:""}</div>
   ${mods.length?`<div class="lmods">${mods.map(it=>{const f=(l.focus||{})[it.key]||{};return `<div class="lmod"><span class="t"><span${it.en?' dir="ltr" lang="en"':""}>${it.title}</span><small>${it.sub}${f.sec?` · השבוע: סעיף ${f.sec} בסיכום`:""}${f.abs?" · השבוע: רק כותרת ותקציר":""}</small></span><span class="acts">${acts(it,f)}</span></div>`}).join("")}</div>`:`<div class="lnone">אין לומדה לשיעור הזה</div>`}</div></li>`;
}
function renderWeek(){
  const box=document.getElementById("week");if(!box)return;
  const [a,b]=weekRange(wOff);
  const L=(SCHED||[]).filter(l=>(l.date>=a&&l.date<=b)||(l.newDate&&l.newDate>=a&&l.newDate<=b)).sort((x,y)=>((x.newDate>=a&&x.newDate<=b)?x.newDate:x.date).localeCompare((y.newDate>=a&&y.newDate<=b)?y.newDate:y.date));
  const live=L.filter(l=>l.status!=="בוטל"&&!(l.status==="נדחה"&&l.newDate&&!(l.newDate>=a&&l.newDate<=b))).length;
  const lab=wOff===0?"השבוע":wOff===1?"שבוע הבא":wOff===-1?"שבוע שעבר":wOff>0?`בעוד ${wOff} שבועות`:`לפני ${-wOff} שבועות`;
  box.classList.toggle("open",wOpen);
  box.innerHTML=`<button class="wtop" id="wtg" aria-expanded="${wOpen}"><span class="wico">${ic("cal")}</span><span class="wtt"><h2>מה לומדים השבוע?</h2><small><span dir="ltr">${dm(a)}–${dm(b)}</span> · ${SCHED==null?"טוען…":live?`${live} שיעורים`:"אין שיעורים"}${wOff?` · ${lab}`:""}</small></span><span class="wchev">${ic("chev")}</span></button>
   ${wOpen?`<div class="wbody"><div class="wh"><div class="wnav"><button id="wprev">${ic("arrowR")}<span>הקודם</span></button><span class="wlab">${lab}</span><button id="wnext"><span>הבא</span>${ic("arrowL")}</button></div></div>
   ${L.length?`<ol class="lessons">${L.map(l=>lessonHTML(l,a,b)).join("")}</ol>`:`<div class="wempty">${SCHED==null?"טוען את מערכת השעות…":"אין שיעורים בשבוע הזה."}</div>`}
   ${wOff?`<div class="wnav center"><button id="wnow">חזרה לשבוע הנוכחי</button></div>`:""}
   <div class="wfoot">לפי הסילבוסים. ביטולים ודחיות מתעדכנים אוטומטית מהודעות המכללה.</div></div>`:""}`;
  box.classList.remove("swap");void box.offsetWidth;box.classList.add("swap");
  box.querySelector("#wtg").onclick=()=>{wOpen=!wOpen;try{localStorage.setItem("week-open",wOpen?"1":"0")}catch(e){}renderWeek()};
  const g=(id,f)=>{const e=box.querySelector(id);if(e)e.onclick=f};
  g("#wprev",()=>{wOff--;renderWeek()});g("#wnext",()=>{wOff++;renderWeek()});g("#wnow",()=>{wOff=0;renderWeek()});
}
function lastActive(){
  let best=null;
  for(const it of ALL){const s=load(it.key);if(!s||!s.q)continue;const t=Math.max(0,...Object.values(s.q).map(x=>x.t||0));if(t&&(!best||t>best.t))best={it,t,s}}
  return best;
}
function resumeHTML(){
  const r=lastActive();if(!r)return "";
  const it=r.it,p=pct(it)||0,at=r.s.at;
  return `<a class="resume" href="${it.href}" style="--c:var(--${it.course.id})"><span class="rk">להמשיך מאיפה שעצרת</span><span class="rt"${it.en?' dir="ltr" lang="en"':""}>${it.title}</span><span class="rs">${it.course.name}${at&&at.ti!=null?` · נושא ${at.ti+1}`:""} · ${p}%</span><span class="rgo">${ic("arrowL")}</span></a>`;
}
function home(){
  const n=ALL.length,np=pods(ALL);
  view.innerHTML=`<div class="v-home">
  <section class="intro"><div class="intro-text"><h1>חובות הקריאה של הסמסטר, בלומדות קצרות וברורות</h1><p class="lede">כל קריאת חובה הפכה ללומדה: קטעים קצרים עם איורים, בדיקת הבנה אחרי כל קטע, כרטיסיות לימוד, מפת חשיבה, סיכום, פודקאסט ומבחן מסכם עם ציון. מה שטועים בו חוזר בניסוח אחר עד שהוא נקלט.</p></div>
   <dl class="facts"><div><dt>${n}</dt><dd>לומדות</dd></div><div><dt>${COURSES.length}</dt><dd>קורסים</dd></div><div><dt>${np}</dt><dd>פודקאסטים</dd></div></dl></section>
  ${resumeHTML()}
  <section id="week" class="week" aria-label="מערכת השבוע"></section>
  <section class="csec"><div class="sec-h"><h2>הקורסים</h2><span>${COURSES.length} קורסים · ${word(n)}</span></div>
  <div class="courses">${COURSES.map((c,k)=>{const p=coursePct(c);return `<a class="course" href="#${c.id}" style="--c:var(--${c.id});--i:${k}">
    <span class="cicon">${ic(c.id)}</span><span class="ctag">${c.tag}</span><h3>${c.name}</h3>
    <span class="cstats"><span>${word(c.items.length)}</span>${pods(c.items)?`<span>${pods(c.items)} פודקאסטים</span>`:""}</span>

  <footer class="sfoot"><span>ההתקדמות נשמרת במכשיר שלכם בלבד.</span><span>חומר חדש עולה במהלך הסמסטר.</span></footer></div>`;
  renderWeek();

function course(c){

  view.innerHTML=`<div class="v-course" style="--c:var(--${c.id})"><nav class="crumbs"><a href="./" id="back">הקורסים</a><span aria-hidden="true">/</span><span>${c.name}</span></nav>

   <p class="howto">בכל לומדה: קוראים קטע קצר ועונים על שאלת הבנה. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון. מהסבב השני המבחנים עוברים לשאלות הבנה על מקרים וסיפורים.</p>
   ${c.items.length?`<ol class="mlist">${sorted.map((it,k)=>{const q=pct(it),sn=soon(it.date);return `<li class="mrow" style="--i:${k}"><div class="mr-main"><span class="mtype">${it.type||"לומדת חובת קריאה"}</span>

     <div class="mr-side"><div class="mprog"><span class="bar"><i style="width:${q||0}%"></i></span><small>${q==null?"לא התחלת":q>=80?"שולט בחומר":"בתהליך"} · ${q||0}%</small></div><div class="acts">${acts(it)}</div></div></li>`}).join("")}</ol>`
   :`<div class="empty">${ic("clock")}<span>הלומדה הראשונה בקורס הזה תעלה בקרוב</span></div>`}</div>`;
  document.getElementById("back").onclick=e=>{e.preventDefault();location.hash=""};
