<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>לומדות פסיכולוגיה ומנהל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: a shelf of courses; each course lists its study modules as cards with a progress meter */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#5a6b75; --line:#dbe2e6; --accent:#0d6c74;
  --display:"Frank Ruhl Libre","David","Times New Roman",serif; --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{--bg:#10181d;--surface:#18232a;--raised:#1e2b33;--ink:#e8eef1;--muted:#9db0ba;--line:#2b3a43;--accent:#5cc6c9;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.7rem);font-weight:900}
h2{font-size:1.35rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--accent)}
header{display:flex;flex-direction:column;gap:8px}
section{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px;color:inherit;text-decoration:none;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card .t{font-family:var(--display);font-weight:700;font-size:1.2rem}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{align-self:flex-start;font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.soon{background:transparent;border:1.5px dashed var(--line);box-shadow:none;color:var(--muted)}
footer{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <span class="eyebrow">פסיכולוגיה ומנהל עסקים · רופין</span>
  <h1>לומדות פסיכולוגיה ומנהל</h1>
  <p class="muted">לומדות קצרות לכל נושא: קוראים, עונים, ממשיכים. השאלות שטועים בהן חוזרות בניסוח אחר. ההתקדמות נשמרת במכשיר שלך.</p>
 </header>
 <div id="courses"></div>
 <footer>חומר חדש מתווסף במהלך הסמסטר.</footer>
</div>
<script>
const COURSES=[
 {name:"קריאות חובה",items:[
   {title:"התופעה הארגונית",sub:"פרק 1",href:"org/ch1.html",key:"lomda-org-1",total:34}
 ]}
];
function pct(key,total){try{const s=JSON.parse(localStorage.getItem(key)||"null");if(!s||!s.q)return null;
  const m=Object.values(s.q).filter(x=>x.c>=2).length;const started=Object.values(s.q).some(x=>x.n);return started?Math.round(100*m/total):null}catch(e){return null}}
const root=document.getElementById("courses");
root.innerHTML=COURSES.map(c=>`<section><h2>${c.name}</h2><div class="grid">${c.items.map(it=>{const p=pct(it.key,it.total);
 return `<a class="card" href="${it.href}"><span class="chip">${it.sub}</span><span class="t">${it.title}</span><div class="bar"><i style="width:${p||0}%"></i></div><div class="meta"><span>${p==null?"לא התחלת":p>=80?"שולט":"בתהליך"}</span><span>${p||0}%</span></div></a>`}).join("")}
 <div class="card soon"><span class="t">בקרוב</span><span>לומדות נוספות יעלו כאן</span></div></div></section>`).join("");
</script>
</body>
</html>
