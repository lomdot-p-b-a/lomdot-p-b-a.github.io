<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>לומדות פסיכולוגיה ומנהל עסקים</title>
<meta name="description" content="לומדות אינטראקטיביות לקורסים בפסיכולוגיה ומנהל עסקים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a course shelf. Ink hero with the five course colors as a spectrum; below, one colored panel per course listing its modules */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --raised:#f6f8fa; --ink:#141c26; --muted:#4c5866; --line:#dde2e8;
  --hero:#141c26; --hero-ink:#f3f5f8; --hero-muted:#a9b4c2;
  --mgmt:#2457a6; --intro:#6a46c2; --social:#d0532c; --dev:#2b8546; --phys:#b5305a;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,28,38,.06),0 10px 30px rgba(20,28,38,.08);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141b; --surface:#171f29; --raised:#1d2733; --ink:#e9edf2; --muted:#a3afbd; --line:#2a3542;
  --hero:#1b2531; --hero-ink:#f3f5f8; --hero-muted:#a9b4c2;
  --mgmt:#7fa6ec; --intro:#ad90f2; --social:#f28a64; --dev:#6dcf8e; --phys:#f07a9e;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.6}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--mgmt);outline-offset:3px;border-radius:8px}
.in{max-width:1040px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:18px 18px;pointer-events:none}
.hero .in{position:relative;padding-block:44px 40px;display:flex;flex-direction:column;gap:16px}
.kicker{font-size:.85rem;font-weight:600;letter-spacing:.06em;color:var(--hero-muted)}
.hero h1{font-size:clamp(2.2rem,7vw,3.8rem);max-width:16ch}
.hero h1 span{display:block;color:transparent;background:linear-gradient(90deg,#ef7a9c,#f4936c,#86d39c,#9fb9f0,#b99cf5);-webkit-background-clip:text;background-clip:text}
.hero p{color:var(--hero-muted);max-width:56ch;font-weight:400}
.spectrum{display:flex;height:6px;border-radius:3px;overflow:hidden;max-width:320px;margin-top:6px}
.spectrum i{flex:1}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px;max-width:760px}
.step{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.step b{font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1;color:var(--hero-ink);opacity:.9}
.step span{font-size:.92rem;line-height:1.4}
@media (max-width:560px){.steps{grid-template-columns:1fr}}

/* courses */
main .in{padding-block:34px 56px;display:flex;flex-direction:column;gap:22px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sechead h2{font-size:1.6rem}
.sechead span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.course{--c:var(--mgmt);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.chead{background:color-mix(in srgb,var(--c) 12%,var(--surface));padding:18px 20px;display:flex;gap:14px;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--c) 20%,transparent)}
.cicon{flex:none;width:52px;height:52px;border-radius:14px;background:var(--c);color:var(--surface);display:grid;place-items:center}
.cicon svg{width:30px;height:30px}
.ctitle{display:flex;flex-direction:column;min-width:0}
.ctitle h3{font-size:1.3rem;color:var(--ink)}
.ctitle small{color:var(--c);font-weight:700;font-size:.82rem;letter-spacing:.03em}
.mods{display:flex;flex-direction:column;padding:8px 10px 12px}
.mod{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px;border-radius:12px;text-decoration:none;align-items:center}
.mod:hover{background:var(--raised)}
.mod .type{font-size:.75rem;font-weight:700;color:var(--c);letter-spacing:.03em}
.mod .name{font-weight:700;font-size:1.05rem;line-height:1.35}
.mod .go{grid-row:1 / span 3;grid-column:2;width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);display:grid;place-items:center;font-size:1.1rem}
.mod .prog{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.empty{margin:6px 12px 10px;padding:16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.92rem;display:flex;gap:10px;align-items:center}
.empty svg{width:20px;height:20px;flex:none;color:var(--c)}

/* course grid (closed) */
button.course{font:inherit;color:inherit;border:none;padding:0;text-align:right;cursor:pointer;transition:transform .15s}
button.course:hover{transform:translateY(-3px)}
.cbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px}
.cmeta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.copen{font-weight:700;color:var(--c)}
/* course view */
.cview{display:flex;flex-direction:column;gap:18px}
.back{align-self:flex-start;font:inherit;font-weight:600;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 0}
.back:hover{color:var(--ink)}
.vhead{--c:var(--mgmt);background:color-mix(in srgb,var(--c) 12%,var(--surface));border-radius:20px;padding:22px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
.vhead .cicon{width:64px;height:64px;border-radius:18px}
.vhead .cicon svg{width:36px;height:36px}
.vhead h2{font-size:clamp(1.5rem,5vw,2rem)}
.vhead small{color:var(--c);font-weight:700;font-size:.85rem}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mcard{--c:var(--mgmt);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;border-top:4px solid var(--c);transition:transform .15s}
.mcard:hover{transform:translateY(-2px)}
.mcard .type{font-size:.78rem;font-weight:700;color:var(--c);letter-spacing:.03em}
.mcard .name{font-family:var(--display);font-size:1.3rem;line-height:1.25}
.mcard .bar,.cbody .bar{flex:none}
.mcard .sub{font-size:.85rem;color:var(--muted)}
.mcard .when{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;font-weight:600;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:10px;padding:7px 10px}
.mcard .when svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--c)}
.mcard .soon{margin-inline-start:auto;flex:none;background:var(--c);color:var(--surface);border-radius:99px;padding:1px 8px;font-size:.75rem}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.course{animation:up .45s ease-out both}.course:nth-child(2){animation-delay:.05s}.course:nth-child(3){animation-delay:.1s}.course:nth-child(4){animation-delay:.15s}.course:nth-child(5){animation-delay:.2s}@keyframes up{from{transform:translateY(8px)}to{transform:none}}}
</style>
</head>

<header class="hero">
 <div class="in">

 </div>
</header>
<main>
 <div class="in" id="view"></div>
</main>

function stats(key){try{const s=JSON.parse(localStorage.getItem(key)||"null");if(!s||!s.q)return null;const v=Object.values(s.q);if(!v.some(x=>x.n))return null;return v.filter(x=>x.c>=2).length}catch(e){return null}}
const pct=it=>{const m=stats(it.key);return m==null?null:Math.round(100*m/it.total)};
const coursePct=c=>{const tot=c.items.reduce((a,i)=>a+i.total,0);if(!tot)return 0;return Math.round(100*c.items.reduce((a,i)=>a+(stats(i.key)||0),0)/tot)};
const soon=d=>{if(!d)return "";const t=new Date(d+"T00:00"),now=new Date();now.setHours(0,0,0,0);const n=Math.round((t-now)/864e5);return n<0||n>14?"":n===0?"היום":n===1?"מחר":`בעוד ${n} ימים`};
const view=document.getElementById("view");
const word=n=>n===0?"אין עדיין לומדות":n===1?"לומדה אחת":`${n} לומדות`;
function home(){
  const n=COURSES.reduce((a,c)=>a+c.items.length,0);
  view.innerHTML=`<div class="sechead"><h2>הקורסים</h2><span>${COURSES.length} קורסים · ${word(n)}</span></div>
  <div class="courses">${COURSES.map(c=>{const p=coursePct(c);return `<button class="course" style="--c:var(--${c.id})" data-id="${c.id}">
    <div class="chead"><span class="cicon">${ic(c.id)}</span><div class="ctitle"><small>${c.tag}</small><h3>${c.name}</h3></div></div>
    <div class="cbody"><div class="bar"><i style="width:${p}%"></i></div><div class="cmeta"><span>${word(c.items.length)}</span><span class="copen">${c.items.length?"פתח ←":"בקרוב"}</span></div></div></button>`}).join("")}</div>
  <footer><span>ההתקדמות נשמרת במכשיר שלכם בלבד.</span><span>חומר חדש עולה במהלך הסמסטר.</span></footer>`;
  view.querySelectorAll("button.course").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id});
}
function course(c){
  view.innerHTML=`<div class="cview"><button class="back" id="back">→ כל הקורסים</button>
   <div class="vhead" style="--c:var(--${c.id})"><span class="cicon" style="background:var(--c);color:var(--surface);display:grid;place-items:center">${ic(c.id)}</span><div class="ctitle"><small>${c.tag} · ${word(c.items.length)}</small><h2>${c.name}</h2></div></div>
   ${c.items.length?`<div class="mlist">${[...c.items].sort((a,b)=>(a.ord||99)-(b.ord||99)).map(it=>{const p=pct(it),sn=soon(it.date);return `<a class="mcard" style="--c:var(--${c.id})" href="${it.href}"><span class="type">${it.type||"לומדת חובת קריאה"}</span>${it.when?`<span class="when">${ic("cal")}<span>${it.when}</span>${sn?`<span class="soon">${sn}</span>`:""}</span>`:""}<span class="name"${it.en?' dir="ltr" lang="en" style="text-align:right;font-family:Rubik,system-ui,sans-serif;font-weight:700"':""}>${it.title}</span><span class="sub">${it.sub}</span><div class="bar"><i style="width:${p||0}%"></i></div><div class="cmeta"><span>${p==null?"לא התחלת":p>=80?"שולט":"בתהליך"}</span><span>${p||0}%</span></div></a>`}).join("")}</div>`
   :`<div class="empty" style="--c:var(--${c.id})">${ic("clock")}<span>הלומדה הראשונה בקורס הזה תעלה בקרוב</span></div>`}</div>`;
  document.getElementById("back").onclick=()=>{location.hash=""};
}
function route(){const id=location.hash.slice(1),c=COURSES.find(x=>x.id===id);c?course(c):home();window.scrollTo(0,c?document.querySelector("main").offsetTop:0)}
addEventListener("hashchange",route);route();
</script>
