<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: מבנים ארגוניים (ארגונים, פרק 4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

/* flashcards */

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(var(--dist))}to{opacity:1;transform:none}}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"pyramid",title:"יסודות: בידול וכילול",blocks:[
  {h:"מהו מבנה ארגוני",html:`${def("על מה הנושא",`איך ארגון עם אלפי עובדים לא הופך לכאוס? צריך לחלק את העבודה, ואז לחבר אותה בחזרה. זה בדיוק מה שמבנה ארגוני עושה. הנושא מציג את שני התהליכים שבבסיס כל מבנה.<br><b>מה נלמד כאן:</b> מהו מבנה · בידול · כילול · מורכבות וגמישות`)}${def("מושג מפתח",`<mark>מבנה</mark> ${E("Structure")}: סדר־דברים יציב של עצמים במרחב ובזמן. בבניין, המחיצות והפתחים מכוונים את התנועה. <b>מבנה ארגוני</b> אינו פיסי: הוא מערך שיטתי ומסודר של <b>תפקידים</b> ו<b>יחידות</b>, עם תחומי סמכות ואחריות, שקובע באופן רשמי את כיווני התנועה של אנשים וחומרים ואת קשרי הגומלין ביניהם.`)}<p>המבנה נועד להקל על הפעילות, אבל הוא לא נקבע רק משיקולים תכליתיים. משפיעים גם שיקולים <b>פוליטיים, תרבותיים, חברתיים ואישיים</b>, וארגונים נוטים לבחור תבניות "אופנתיות" ומקובלות. הנטייה הזו ל<b>התמסדות</b> היא מניע חשוב בעיצוב המבנה.</p>${rem("לפי <b>הגישה המכאנית</b> המבנה הוא אמצעי ולא מטרה, ואין מבנה אחד מיטבי לכל הארגונים. לפי <b>התיאוריה המוסדית</b>, מבנים רבים משקפים אמונות, ערכים ומיתוסים שהתמסדו, ולא בהכרח את הפתרון היעיל.")}${ex(`כמו שבבניין המסדרונות והדלתות קובעים לאן אפשר ללכת, במבנה ארגוני התפקידים והיחידות קובעים מי מדבר עם מי ומי מחליט על מה.`)}`,q:"q1"},
  {h:"בידול וכילול",html:`${def("שני תהליכים",`<mark>בידול</mark> ${E("Differentiation")}: הפרדה של משימת הארגון למשימות־משנה, ופירוקן לפעילויות שמוקבצות לתפקידים וליחידות (אגפים, חטיבות, מחלקות, מדורים). <mark>כילול</mark> ${E("Integration")}: שילוב כל המרכיבים לשלמות אחת, בעיקר באצלת סמכויות ניהול לבעלי תפקידים בראש היחידות. <b>המדרג הניהולי</b> הוא עמוד השדרה של הכילול, ולצידו תפקידי תיאום, קישור, היגוי ותזמון.`)}${fig("pyramid","הארגון כתוצאה של בידול תפקודי וכילול ניהולי (תרשים 4.1)")}${ex("בית חרושת למכוניות מחלק את המוצר למשימות־משנה: מנוע, שלדה, גוף, הילוכים, מערכת חשמל. לכל אחת יחידה, ובתוכה יחידות קטנות יותר.")}${rem("<b>יחידות מטה</b> תומכות בעובדי הקו (למשל ״ארגון ושיטות״, ״תכנון ובקרה״). <b>מינצברג</b>: המבנה הוא סכום האופנים שבהם מחלקים את העבודה למטלות נפרדות ומבטיחים את התיאום ביניהן.")}`,q:"q3"},
  {h:"מורכבות וגמישות",html:`<p><b>דרגת הבידול</b> קובעת במידה רבה את המורכבות: ככל שיש יותר יחידות ויותר דרגי ניהול, המבנה מורכב יותר (צבא: זרועות, חילות, פיקודים, אגפים). הדרגה לא שרירותית: היא נקבעת לפי הגודל, התוצרים והסביבה, ולכן מפעל עתיר ידע מורכב יותר ממפעל מזון. גם <b>דרגת הכילול</b>, עם הרבה מנהלים, תפקידי תיאום וועדות, מגדילה מורכבות (משרדי ממשלה, תהליך היתר בנייה בישראל).</p>${ex("<b>תזמורת:</b> בידול לפי סוג הכלים (מיתר, נשיפה, נקישה), לתת־קבוצות (כינורות, צ׳לו) ולדרגות (נגנים ראשונים ושניים). <b>המנצח</b> הוא הכילול, ונגנים ראשיים משמשים ראשי צוותים וחוליות קישור. והמבנה משתנה לפי היצירה.")}${rem("ארגונים משנים מבנה יותר ויותר בהתאם לסביבה, ויש הרואים ב<b>גמישות ארגונית</b> את מפתח ההישרדות. העקרונות של בידול וכילול משותפים לכל הארגונים, והביצועים תלויים בהתאמה לתנאי הסביבה.")}`,q:"q5"}
 ]},
 {id:"t2",icon:"split",title:"הקבצת מטלות לתפקידים",blocks:[
  {h:"עקרון הפישוט",html:`${def("על מה הנושא",`השלב הראשון בבניית מבנה: איך מחלקים משימה גדולה לתפקידים של אנשים. יש שתי דרכים הפוכות, ולכל אחת מחיר.<br><b>מה נלמד כאן:</b> עקרון הפישוט · ניכור בעבודה · עקרון ההתמחות`)}${def("מושג מפתח",`<mark>עקרון הפישוט</mark> ${E("Simplification")}: פירוק משימה גדולה למרכיבים פשוטים וקצרים, ש<b>אדם אחד</b> יכול לבצע שוב ושוב. צירוף כמה מטלות כאלה הוא <b>תפקיד</b> ${E("Job")}.`)}${ex("<b>אדם סמית</b> בדק ייצור סיכות: 10 פועלים לא מקצועיים שחילקו ביניהם 18 פעולות הפיקו כ־48,000 סיכות ביום, לעומת עד 20 סיכות לאומן שעושה הכול לבד.")}${tiles([["people","עובדים","במקום אומנים, עובדים שמוכשרים בקלות","כשכל עובד עושה פעולה פשוטה אחת, לא צריך אומן מומחה. אפשר להכשיר עובד חדש מהר, ולכן גם בזול.","בקו הכיסאות, עובד חדש לומד תוך יום לשייף רגליים, ולא צריך שנים כדי להפוך לנגר מומחה."],["doc","נהלים","נהלים שגרתיים במקום שיקול דעת","במקום שכל עובד יחליט בעצמו איך לעבוד, יש נוהל קבוע שאומר בדיוק מה לעשות. זה חוסך זמן וטעויות, אבל מקטין שיקול דעת.","נוהל אומר: ״שייף כל רגל 30 שניות בנייר זכוכית מספר 120״, והעובד פשוט עושה את זה."],["cycle","מעברים","מינימום מעברים בין סוגי פעולות","כשעובד לא עובר כל הזמן בין סוגי פעולות שונים, הוא לא מבזבז זמן על החלפת כלים ועל ״כניסה״ למשימה חדשה.","העובד שרק משייף לא צריך להניח את המשייפה, להרים מסור ואחר כך מברגה."],["gear","שינוע","מכונות מעבירות את החומרים, כמו בסרט הנע","מכונות מעבירות את החומרים מעמדה לעמדה, כמו בסרט נע, ולכן העובדים לא מבזבזים זמן על הליכה וסחיבה.","סרט נע מעביר כל כיסא מהניסור לשיוף ולצביעה, והעובדים נשארים במקום."]])}${def("החיסרון: ניכור",`שעמום, שחיקה, חוסר סיפוק, אובדן תחושת היצירה, קיפוח, היעדרויות, תאונות ותחלופה גבוהה = <mark>ניכור בעבודה</mark> ${E("Work alienation")}. שכר עידוד לא מספיק לפתור זאת, ולכן מחפשים חלופות שמגבירות מעורבות ואחריות.`)}`,q:"q7"},
  {h:"עקרון ההתמחות",html:`<p>לא כל משימה אפשר לפשט. במחקר, הנדסה, רפואה, הוראה, משפט, ניהול ותכנון נדרש ידע תיאורטי, הכשרה ארוכה ושיקול דעת.</p>${def("מושג מפתח",`<mark>עקרון ההתמחות</mark> ${E("Specialization")}: פיצול משימות מורכבות למשימות־משנה לפי <b>תחומי מקצוע</b>. התפקידים מורכבים, לא שגרתיים, ודורשים מיומנות ותבונת כפיים.`)}${ex("ברפואה: אף־אוזן־גרון, עיניים, שיניים. בהנדסה: אווירונאוטיקה, מכאניקה, אלקטרוניקה. באוניברסיטה: מחלקות (פיזיקה, כימיה) וחוגים (פסיכולוגיה קלינית, חברתית).")}${rem("חדשנות טכנולוגית יוצרת <b>מקצועות חדשים</b> (הנדסת תוכנה, אבטחת איכות) והתמחויות <b>בין־תחומיות</b> (חקר המוח), וארגונים מפתחים שוקי עבודה פנימיים כדי להכשיר אנשים בעצמם.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"people",title:"הקבצת תפקידים ליחידות",blocks:[
  {h:"ארבעה שיקולים",html:`${def("על מה הנושא",`אחרי שיש תפקידים, צריך לקבץ אותם ליחידות: מחלקות, אגפים. הנושא מציג את השיקולים שלפיהם מחליטים איך לקבץ.<br><b>מה נלמד כאן:</b> ארבעה שיקולים · תשומות מול תפוקות`)}<p>תפקידים מוקבצים ל<b>יחידות־משנה</b> (בצבא: כיתות, מחלקות, פלוגות, גדודים, חטיבות, אוגדות), כדי שאפשר יהיה לנהל אותם ולתאם ביניהם.</p>${tiles([["copies","דמיות (similarity)","תפקידים זהים או דומים (מלצרים, אפסנאים): ניהול יעיל, גמישות בהעברת עובדים ותקשורת טובה","מקבצים יחד עובדים שעושים את אותה עבודה. קל לנהל אותם יחד, קל להעביר עובד ממקום למקום, והם מדברים ״באותה שפה״.","כל המלצרים במסעדה גדולה נמצאים תחת אחראי משמרת אחד, שיכול להעביר מלצר לאזור עמוס."],["link","השלמה (complementariness)","תפקידים שמשלימים זה את זה (רופאים ואחיות, נהגים וכרטיסנים): תיאום ושיתוף פעולה","מקבצים יחד תפקידים שונים שצריכים זה את זה כדי לסיים את העבודה. כך התיאום ביניהם קל יותר.","במחלקה בבית חולים, רופאים ואחיות עובדים באותה יחידה, כי הטיפול בחולה דורש את שניהם יחד."],["target","קרבה (proximity)","מקום אחד (סניף, שלוחה) או אותו זמן (משמרת): חיסכון בניהול ובעלויות","מקבצים לפי מקום או זמן: מי שעובד באותו סניף, או באותה משמרת, נמצא תחת אותו מנהל. זה חוסך בניהול ובעלויות.","רשת סופרמרקטים מחלקת את העובדים לפי סניפים, ולכל סניף יש מנהל משלו."],["cart","חליפין (exchange)","לפי לקוח (צה״ל), קבוצת לקוחות (קיבוצים) או ספק (תנובה): היכרות עם הלקוח והתמחות בפלח שוק","מקבצים לפי מי שהארגון ״מתחלף״ איתו: לקוח, קבוצת לקוחות או ספק. כך העובדים מכירים היטב את הצד השני ומתמחים בו.","בבנק יש מחלקה נפרדת ללקוחות עסקיים, שמכירה את הצרכים המיוחדים שלהם."]])}${def("תשומות ותפוקות",`יש יחידות שמאורגנות לפי <b>תשומות</b> (למשל רכישת חומרי גלם) ויש לפי <b>תפוקות</b> (למשל מכירה). ארגונים גדולים משלבים, ומקימים תת־יחידות לפי תשומות בתוך יחידות לפי תפוקות.`)}${ex(`<b>תשומות מול תפוקות</b>: במפעל רהיטים, יחידה "לפי תשומות" היא מחלקת רכש העץ. יחידה "לפי תפוקות" היא חטיבת ריהוט המשרד, שמוכרת את המוצר ללקוחות.`)}`,q:"q11"}
 ]},
 {id:"t4",icon:"building",title:"תבניות לפי תשומות",blocks:[
  {h:"תפקודים, מומחיות ותהליכים",html:`${def("על מה הנושא",`הדרך הראשונה לקבץ: לפי מה שנכנס לעבודה, כלומר לפי סוג העבודה או המומחיות. שלוש תבניות.<br><b>מה נלמד כאן:</b> תפקודים · מומחיות · תהליכים`)}${fig("patterns","מפת התבניות בפרק")}${def("ארגון על בסיס תפקודים",`<mark>Functional organization</mark>: יחידות לפי תת־המערכות התפקודיות: הפקה, אחזקה, שיווק, משאבי אנוש, מחקר ופיתוח, כספים. גם בתוכן חלוקה תפקודית (אגף השיווק: מכירות, משלוחים, חוזים, פרסום, חקר שווקים).`)}${def("ארגון על בסיס מומחיות",`<mark>Professional organization</mark>: יחידות לפי מקצועות והתמחויות. כל יחידה מרכזת את המומחים בתחום. בתי חולים, מוסדות להשכלה גבוהה ומכוני מחקר (אוניברסיטה: פקולטות וחוגים).`)}${def("ארגון על בסיס תהליכים",`<mark>Process organization</mark>: יחידות לפי <b>שלבי הביצוע</b> בתהליך טורי, שבו כל שלב מוסיף לקודמו (קו הרכבה). נפוץ בטקסטיל (טוויה, אריגה, אשפרה, מתפרה), מזון וכימיקלים, וגם בשירותים כמו דואר. המחשוב גרם לבנקים לבטל תבנית זו.`)}${ex(`<b>תפקודים</b>: חברה עם אגף שיווק, אגף כספים ואגף ייצור. <b>מומחיות</b>: אוניברסיטה עם פקולטה לרפואה ופקולטה למשפטים. <b>תהליכים</b>: מפעל בגדים שבו יחידה אחת טווה, השנייה אורגת והשלישית תופרת.`)}`,q:"q13"}
 ]},
 {id:"t5",icon:"cart",title:"תבניות לפי תפוקות",blocks:[
  {h:"מוצרים, אזורים ולקוחות",html:`${def("על מה הנושא",`הדרך השנייה לקבץ: לפי מה שיוצא מהארגון, כלומר לפי התוצר, המקום או הלקוח. שלוש תבניות.<br><b>מה נלמד כאן:</b> מוצרים · אזורים · לקוחות`)}${def("ארגון על בסיס מוצרים",`<mark>Product organization</mark>: כל יחידה, לרוב <b>חטיבה</b>, מופקדת על מוצר או משפחת מוצרים, וכוללת את כל הפעילויות התפקודיות שלו (אחזקה, איכות, מכירות, כספים, משאבי אנוש, מו״פ). חטיבות עצמאיות־למחצה, למשל חטיבות מכשירי חשמל, כלי בית ורהיטים, ובתוכן קווי מוצר.`)}${def("ארגון על בסיס אזורים",`<mark>Regional organization</mark>: כל יחידה מספקת את <b>כל</b> המוצרים והשירותים לאוכלוסייה באזור מוגדר. בנקים, דואר, רשתות שיווק, משטרה, רשויות מקומיות (מרחבי צפון, מרכז ודרום עם מרפאות, בתי חולים וטיפות חלב). הסניפים עצמאיים במידה, כמו 9 הקמפוסים של אוניברסיטת קליפורניה עם הנהלה מרכזית.`)}${def("ארגון על בסיס לקוחות",`<mark>Client organization</mark>: יחידות שמתמחות ב<b>סוגי לקוחות</b> או בשווקים. פקידי שומה מתמחים בחברות או בעצמאים, בתי דין לפי סוג העבירה, אגף רווחה עם מחלקות ילדים ונוער, קשישים ומשפחות, שיקום. גם בתי כלא מקבצים כלואים לפי סוגים.`)}${ex(`<b>מוצרים</b>: חברת מזון עם חטיבת חלב וחטיבת חטיפים. <b>אזורים</b>: בנק עם מרחב צפון, מרכז ודרום. <b>לקוחות</b>: בנק עם מחלקה ללקוחות פרטיים ומחלקה לעסקים.`)}`,q:"q15"}
 ]},
 {id:"t6",icon:"copies",title:"מבנים על בסיס כפול",blocks:[
  {h:"שתי־וערב (מטריצה)",html:`${def("על מה הנושא",`מה עושים כשצריך גם מומחיות וגם מיקוד במוצר? משלבים את שתי הדרכים. הנושא מציג שני מבנים כפולים.<br><b>מה נלמד כאן:</b> שתי־וערב (מטריצה) · ארגון משולב`)}${def("מושג מפתח",`<mark>ארגון על בסיס שתי־וערב</mark> ${E("Matrix organization")}: הצלבה בו־זמנית של יחידות לפי <b>תשומות</b> (יחידות מקצועיות) עם יחידות לפי <b>תפוקות</b> (מנהלות פרויקט או תוכנית, program directory). הונהג לראשונה בסוכנות החלל האמריקנית במרוץ לירח, ונפוץ בארגונים עתירי ידע (מטוסים, מחשבים, לוויינים).`)}${fig("matrix","מבנה שתי־וערב לפי מוצרים ולפי התמחויות (לפי תרשים 4.10)")}${tiles([["target","ממונה משימתי","מגדיר לעובד מה עליו לבצע בפרויקט"],["grad","ממונה מקצועי","מנחה איך לבצע: איכות, כמות ולוח זמנים"]])}${rem("המומחים ״מושאלים״ למנהלות לזמן קצוב, בהסכמת מנהלי היחידות, ובסיום עוברים לפרויקט אחר. המערכת מתנהלת ב<b>חוזי עבודה פנימיים</b> בין ראשי המנהלות (בעלי הממון) לראשי היחידות המקצועיות (בעלי הידע).")}${ex(`מהנדסת בחברת רכב שייכת למחלקת ההנדסה (הממונה המקצועי שלה) וגם לצוות של דגם חדש (מנהל הפרויקט). יש לה שני בוסים בו־זמנית.`)}`,q:"q17"},
  {h:"ארגון משולב",html:`${def("מושג מפתח",`<mark>ארגון על בסיס משולב</mark> ${E("Combined organization")}: בארגונים גדולים (רשתות שיווק, תאגידים רב־לאומיים, ממשל, צבא ומשטרה). <b>שלא כמו המטריצה</b>, הכפילות כאן <b>קבועה</b>: יחידות לפי תשומות משולבות באורח קבוע ביחידות לפי תפוקות.`)}${ex("בצה״ל יחידות סיוע קבועות (קשר, מודיעין, רפואה, הנדסה קרבית, אספקה) נמצאות בתוך החטיבות הלוחמות, וכפופות בו־זמנית לשתי מערכות פיקוד: הקרבית והמקצועית (החיל). כך המערך הלוחם מקבל את מיטב הסיוע בלי לגייס ולהכשיר בעצמו.")}`,q:"q19"}
 ]},
 {id:"t7",icon:"link",title:"מבנים חדשניים",blocks:[
  {h:"כלאיים ורב־שכבתי",html:`${def("על מה הנושא",`מבנים חדשים שנוצרו בעשורים האחרונים, בעיקר בזכות טכנולוגיה ושיתופי פעולה בין ארגונים.<br><b>מה נלמד כאן:</b> כלאיים · רב־שכבתי · אופקי · רשתי · רשת בין־ארגונית · וירטואלי`)}${def("ארגון־כלאיים",`<mark>ארגון־כלאיים</mark> ${E("Hybrid organization")}: הסדר בין־ארגוני שמסתייע במשאבים, מבנים ומנגנוני ניהול קיימים ויוצר מבנה חדש. המטרה: לשלב את הגמישות של ארגון קטן עם יתרונות הגודל של ארגון גדול.`)}${tiles([["link","מיזוג","Merger: שני ארגונים מתאחדים","שני ארגונים מתאחדים לארגון אחד, ומשלבים את המבנים שלהם.","״עץ ודני״ ונגרייה מתחרה בעיר מתאחדות לחברה אחת בשם חדש."],["cart","רכישה","Acquisition: ארגון קונה אחר ומשלב אותו","ארגון אחד קונה ארגון אחר ומשלב אותו בתוכו.","״עץ ודני״ קונה מפעל קטן לייצור ידיות, והוא הופך למחלקה בתוך הנגרייה."],["people","מיזם משותף","Joint venture: ארגון־בן משותף","שני ארגונים (או יותר) מקימים יחד ״ארגון־בן״ חדש לפעילות משותפת, וכל אחד ממשיך להתקיים בנפרד.","״עץ ודני״ וחברת תאורה מקימות יחד חברה חדשה למטבחים חכמים."],["copies","מאגד","Consortium: כמה ארגונים פועלים יחד בנושא מסוים, לרוב זמנית","כמה ארגונים משתפים פעולה בנושא מסוים, לרוב לתקופה מוגבלת, בלי להתאחד ובלי להקים חברה.","כמה נגריות באזור מתאגדות כדי להגיש יחד הצעה למכרז גדול של עירייה."]])}<p>תאגידים ביפן מלווים ב<b>ארגוני לוויין</b> שמספקים להם בלעדית בהסכמים קבועים, בלי בעלות ובלי מדרג. בישראל יש מגמה ל״הפרטה״ של יחידות (מחשוב, הדרכה, לוגיסטיקה) לבעלות העובדים, עם חוזה ארוך טווח.</p>${def("מבנה רב־שכבתי",`<mark>Multifaceted structure</mark>: כמה תבניות במקביל. למשל תאגיד שמפוצל לתת־ארגונים לפי קווי מוצרים, בכל אחד מבנה פונקציונלי, ומערך השיווק לפי לקוחות או אזורים: לפחות שלושה סוגי מבנים יחד.`)}${ex(`<b>כלאיים</b>: שתי חברות שמקימות יחד מיזם משותף לפיתוח תרופה, ומשתמשות במעבדות ובמנהלים של שתיהן.`)}`,q:"q21"},
  {h:"אופקי ורשתי",html:`${def("ארגון אופקי",`<mark>Horizontal organization</mark>: מסגרות שיתוף פעולה <b>לרוחב</b> הארגון, שמבטלות במידה רבה את האגפים והמחלקות ואת שכבות הניהול. מבוסס על מספר קטן של <b>תהליכים</b> עיקריים, ולכל תהליך <b>״בעלים״</b> (owner). אבני הבניין: <b>צוותים רב־מקצועיים</b> שמנהלים את עצמם, נבחנים לפי ביצועים ונהנים מתמריצים קבוצתיים. כך ״פוחסים״ את הפירמידה, מבטלים יחידות מטה ומעמידים את הלקוח במרכז.`)}${def("ארגון רשתי",`<mark>Network organization</mark>: הנהלה ראשית פורסת סניפים באתרים רבים (קמעונאות, מלונות, השכרת רכב). ההנהלה מספקת מחסנים, הובלה, מחשוב ופרסום, וכל סניף הוא <b>מרכז רווח</b>. חלק מנוהלים ב<b>זכיינות</b> ${E("Franchising")}, כמו ״הולידיי אין״: מלוניות זהות שמוחכרות לזכיינים שמשלמים תמלוגים.`)}${ex(`<b>רשתי</b>: רשת בתי מלון שבה ההנהלה הראשית מספקת פרסום והזמנות, וכל מלון מנוהל כמרכז רווח עצמאי.`)}`,q:"q23"},
  {h:"רשת בין־ארגונית ווירטואלי",html:`${def("רשת בין־ארגונית",`<mark>Interorganizational network</mark>: קשרי גומלין מתמשכים בין ארגונים עצמאיים סביב משאב (הון, מידע, טכנולוגיה) או נושא, לתועלת הדדית: שיתוף פעולה, העדפה הדדית, העברת מידע ותיאום. היא לא <b>שוק</b> (סחר חופשי) ולא <b>מדרג</b> (סמכות): ״הקוטב השלישי״. לא צריכה חוזים, כל עוד אינה <b>קרטל</b> שמגביל תחרות. היא נשענת על <b>אמון</b> ו״שזורה״ (embedded) במרקם החברתי.`)}${rem(`בעסקים פועלות רשתות כאלה דרך <b>שילוב הדדי של מועצות מנהלים</b> ${E("Interlocking directories")}: אותם אנשים יושבים כדירקטורים בכמה ארגונים ומשמשים ״סיכות חיבור״.`)}${def("ארגון וירטואלי",`<mark>Virtual organization</mark>: רשת גמישה של ישויות עצמאיות מפוזרות, שחולקות ידע ומשאבים בעזרת תשתית מחשוב, בלי מגבלות זמן ומקום. מושתת על <b>יזם</b> עם רעיון, ליבה טכנית עם מעט מאוד עובדים, ומשתמשים רבים (ספקים, לקוחות) שעושים את רוב הפעולות. הגבולות המסורתיים בין הארגון לסביבה נעלמים.`)}${ex(`<b>וירטואלי</b>: חברת אופנה קטנה שיש לה רק מעצבים ואתר. הייצור במפעל בסין, המשלוחים בחברת שילוח, ושירות הלקוחות במוקד חיצוני.`)}`,q:"q25"}
 ]},
 {id:"t8",icon:"scales",title:"יתרונות וחסרונות",blocks:[
  {h:"מבנים לפי תשומות",html:`${def("על מה הנושא",`אין מבנה מושלם. הנושא משווה את היתרונות והחסרונות של כל סוג, כדי לדעת מתי לבחור בו.<br><b>מה נלמד כאן:</b> לפי תשומות · לפי תפוקות · בסיס כפול · החדשניים`)}<p>אין מבנה אחד שמתאים לכולם. שני תבחינים להשוואה: עד כמה המבנה עוזר להפיק את התוצרים <b>ביעילות</b>, ועד כמה הוא מאפשר <b>להסתגל במהירות</b> לשינויים.</p>${def("יתרון",`<b>יעילות מבנית</b> במשימות מורכבות בקנה מידה גדול ובמחזוריות גבוהה. חלוקה שיטתית מאפשרת התמחות מקצועית וצבירת ידע. חיסכון במשאבים (אין תשתיות כפולות) ותכנון כולל: <b>יתרונות הגודל הכלכליים</b>.`)}${def("חסרונות",`<b>תסמונת הניכור</b>: הזדהות־יתר עם היחידה והתנכרות לארגון, העדפת שיקולים מקצועיים (חדשנות, איכות) על מעשיים (רווחיות), ואדישות למוצר הסופי. החיכוכים בין היחידות הם <b>קונפליקט מבני</b>. ו״עקב אכילס״: <b>כושר שינוי מוגבל</b>, בגלל נהלים, התמחות מופלגת ותשתיות קבועות.`)}${rem("לכן הם עדיפים ב<b>סביבה יציבה</b> וידועה מראש, ונחותים כשצריך להגיב מהר.")}`,q:"q27"},
  {h:"מבנים לפי תפוקות",html:`${def("יתרונות",`<b>תכליתיות</b> וכושר שינוי: עובדים ומשאבים מרוכזים סביב מוצר ולקוח, רגישות לדרישות הלקוח, אחריות להצלחה ולכישלון, ומנהלים עם גישה כוללנית. העצמאות מנתקת את התלות ההדדית ומפחיתה <b>צימודים הדוקים</b> ${E("Tight couplings")}. כל חטיבה היא <b>מרכז רווח</b>, מה שמפזר סיכונים ומונע תגובת שרשרת. מתאים לאי־ודאות, תחרות וחדשנות.`)}${def("חסרונות",`<b>כפילות</b> לא יעילה של משאבים: כל חטיבה מחזיקה שיווק, חשבונאות ומשאבי אנוש משלה, ואובדים יתרונות הגודל. <b>רמה מקצועית נמוכה</b>: מעט אנשים מכל מקצוע, בלי ״מסה קריטית״. ובמבנה רב־חטיבתי ${E("Multidivisional form")}: אובדן <b>סינרגיה</b>, חטיבות שלא משתפות פעולה, מסתירות מידע ומתחרות על אותם לקוחות.`)}`,q:"q29"},
  {h:"בסיס כפול",html:`${def("יתרונות",`מלוא התועלת משני סוגי הבידול: גמישות בהקצאת כוחות, אחריות ברורה לתוצאות ושיתוף פעולה. הם מעבדים <b>מידע רב ומורכב</b> יותר מכל מבנה אחר, ולכן מתאימים לתחומים דינמיים ועתירי ידע. כושר השתנות גבוה: מקבצים ומפזרים מומחים מהר.`)}${def("חסרונות",`<b>מתח מבני</b> קבוע בין הממונים המקצועיים לממונים על הפרויקטים, מאבקים על כוח אדם, תקציב ולוחות זמנים, והתערבות מסרבלת של ההנהלה. <b>כפיפות כפולה</b>: הוראות סותרות, בעיות נאמנות, עמימות וחרדה. וגם מורכבות ועלות גבוהות. הם עובדים רק כשהתרבות, האנשים והמנהלים מתאימים.`)}${rem("בסביבה פשוטה ויציבה, מבנה כפול הוא ״תגובת־יתר״ שיוצאת בהפסד.")}`,q:"q31"},
  {h:"החדשניים וסיכום",html:`${prosTable}${def("סיכום הפרק",`המבנה הוא תוצאה של <b>בידול</b> (פישוט או התמחות) ו<b>כילול</b>. מבנים אינם טובים או גרועים כשלעצמם: המבחן הוא <b>ההתאמה</b> למאפייני הארגון ולסביבה, ב<b>יעילות</b> ${E("Efficiency")} וב<b>תכליתיות</b> ${E("Effectiveness")}, וגם בהלימה לערכים בחברה.`)}${rem("והבחירה אינה רק רציונלית: <b>עוצמה, יוקרה, הכנסה וקידום</b> משפיעים על אופן חלוקת העבודה והסמכות.")}`,q:"q33"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"חברה בוחרת מבנה מטריצה רק כי ״כל החברות המובילות עושות את זה״, למרות שאין לה צורך בו. איזו תיאוריה מסבירה זאת הכי טוב?","a":"התיאוריה המוסדית","w":["הגישה המכאנית","עקרון הפישוט","הגדרת מינצברג"],"e":"מבנים משקפים לפעמים מיתוסים ואופנות שהתמסדו, ולא את הפתרון היעיל."},{"q":"מה מבדיל מבנה ארגוני ממבנה של בניין?","a":"המבנה הארגוני אינו פיסי: הוא מערך של תפקידים ויחידות","w":["המבנה הארגוני קבוע ולא משתנה לאורך השנים","המבנה הארגוני לא מכוון את התנועה של אנשים","המבנה הארגוני נקבע רק משיקולי יעילות טהורים"],"e":"שני המבנים מכוונים את התנועה של אנשים, אבל המבנה הארגוני אינו פיסי: הוא מערך של תפקידים ויחידות. הוא גם משתנה עם הזמן, ולכן ״קבוע ולא משתנה״ שגוי."}]},
"q2":{"t":"t1","v":[{"q":"מנכ״ל מחליט להקים אגף חדש בעיקר כדי לתת למקורב שלו תפקיד בכיר. מה זה ממחיש?","a":"שיקולים אישיים ופוליטיים משפיעים על עיצוב המבנה","w":["עקרון ההתמחות בהקבצת התפקידים בארגון","כילול לפי המדרג הניהולי של החברה","בידול לפי הדרישות של הסביבה העסקית"],"e":"הקמת אגף כדי לתת תפקיד למקורב מראה ששיקולים אישיים ופוליטיים משפיעים על המבנה, ולא רק שיקולים תכליתיים. זה לא עקרון ההתמחות."},{"q":"מה עמדת הגישה המכאנית לגבי מבנה ארגוני?","a":"המבנה הוא אמצעי, ואין מבנה אחד שמתאים לכולם","w":["המבנה הוא מטרה בפני עצמה, ולא כלי","יש מבנה אחד מיטבי שמתאים לכל הארגונים","המבנה משקף בעיקר מיתוסים ואופנות שהתמסדו"],"e":"לפי הגישה המכאנית, המבנה הוא אמצעי להשגת מטרות, ואין מבנה אחד שמתאים לכל הארגונים. ״המבנה משקף מיתוסים ואופנות״ היא עמדת התיאוריה המוסדית."}]},
"q3":{"t":"t1","v":[{"q":"בית חרושת למכוניות מחלק את העבודה ליחידות מנוע, שלדה וגוף, ומעמיד מנהל בראש כל יחידה שמדווח למנהל המפעל. מה מכל זה הוא כילול?","a":"המנהלים ושרשרת הדיווח שמחברים את היחידות","w":["החלוקה ליחידות של מנוע, שלדה וגוף","פירוק המכונית למשימות־משנה נפרדות","ההקבצה של עובדים דומים יחד באותה יחידה"],"e":"בידול מפרק, כילול מחבר. המדרג הניהולי הוא עמוד השדרה של הכילול."},{"q":"מה ההבדל בין בידול לכילול?","a":"בידול מפרק את המשימה ליחידות, כילול משלב אותן לשלם","w":["בידול משלב את היחידות, כילול מפרק אותן","בידול נוגע למנהלים, כילול נוגע לעובדים","אין הבדל מהותי, אלה שני שלבים של אותו תהליך"],"e":"בידול מפרק את המשימה הכוללת ליחידות ולתפקידים, וכילול משלב אותם בחזרה לשלם מתואם. אלה שני תהליכים הפוכים ומשלימים. המסיח הראשון הופך ביניהם."}]},
"q4":{"t":"t1","v":[{"q":"בתרשים פירמידה של ארגון, מה מבטא הממד האופקי ומה האנכי?","a":"אופקי: הבידול ליחידות. אנכי: הכילול בדרגי הניהול","w":["אופקי: הכילול בדרגים. אנכי: הבידול ליחידות","שני הממדים מבטאים את הבידול ליחידות","שני הממדים מבטאים את הכילול בדרגים"],"e":"בפירמידה, הממד האופקי מבטא את הבידול ליחידות שעומדות זו לצד זו, והממד האנכי מבטא את הכילול בדרגי הניהול שמעליהן. המסיח הראשון הופך ביניהם."},{"q":"יחידה בשם ״תכנון ובקרה״ שלא מייצרת בעצמה, אלא עוזרת לעובדי הייצור. מה היא?","a":"יחידת מטה","w":["יחידת קו","יחידה לפי תפוקות","יחידת כילול עליונה"],"e":"יחידה שלא מייצרת בעצמה, אלא תומכת בעובדי הייצור, היא יחידת מטה. יחידת קו היא זו שמבצעת את העבודה העיקרית של הארגון."}]},
"q5":{"t":"t1","v":[{"q":"בתזמורת יש כינורות, צ׳לו וכלי נשיפה, ונגנים ראשונים ושניים. מה מכל אלה הוא בידול?","a":"החלוקה לפי סוג הכלי ולפי דרגות הנגנים","w":["תפקיד המנצח בתיאום הנגנים","תפקיד הנגנים הראשיים כחוליות קישור","השינוי במבנה לפי היצירה"],"e":"החלוקה לפי סוג הכלי ולפי דרגות הנגנים היא בידול, פירוק לתפקידים. המנצח והנגנים הראשיים, שמתאמים בין החלקים, הם הכילול."},{"q":"למה מפעל עתיר ידע מורכב יותר ממפעל מזון, לפי הפרק?","a":"כי דרגת הבידול תלויה בגודל, בתוצרים ובסביבה","w":["כי למפעל עתיר ידע יש יותר עובדים תמיד","כי מפעל מזון לא צריך כילול","כי דרגת הבידול נקבעת באופן שרירותי"],"e":"דרגת הבידול תלויה בגודל הארגון, בתוצרים שלו ובסביבה. למפעל עתיר ידע יש תוצרים וסביבה מורכבים יותר, ולכן יותר יחידות ודרגים. זה לא נקבע באופן שרירותי."}]},
"q6":{"t":"t1","v":[{"q":"תהליך קבלת היתר בנייה בישראל עובר ועדות, מנהלים ותפקידי תיאום רבים. מה זה ממחיש?","a":"דרגת כילול גבוהה מגדילה את המורכבות","w":["דרגת בידול נמוכה מקטינה את המורכבות","עקרון הפישוט בהקבצת תפקידים","ארגון וירטואלי בלי גבולות"],"e":"ריבוי ועדות, מנהלים ותפקידי תיאום הוא דרגת כילול גבוהה, וזה מה שהופך את התהליך למורכב. בידול נמוך היה דווקא מפשט אותו."},{"q":"מה הגדרת מינצברג למבנה?","a":"האופנים שבהם מחלקים את העבודה ומבטיחים תיאום","w":["מערך של מטרות ומדדי ביצוע","מערכת של אמונות ומיתוסים שהתמסדו","רשת של ארגונים עצמאיים שחולקים משאבים"],"e":"מינצברג מגדיר מבנה כאופנים שבהם מחלקים את העבודה (בידול) ומבטיחים תיאום (כילול). אמונות ומיתוסים שהתמסדו הם הגישה המוסדית."}]},
"q7":{"t":"t2","v":[{"q":"לפי דוגמת הסיכות של אדם סמית, מה מקור הקפיצה בתפוקה?","a":"פירוק העבודה לפעולות פשוטות שכל עובד חוזר עליהן","w":["העסקת אומנים מומחים במקום פועלים פשוטים","שיקול דעת רחב לכל עובד בכל שלב","הקמת יחידות נפרדות לפי מקצועות"],"e":"בדוגמת הסיכות, עשרה פועלים שחילקו ביניהם 18 פעולות פשוטות, וכל אחד חזר על חלקו, הפיקו אלפי סיכות ביום. מקור הקפיצה הוא הפישוט, ולא העסקת אומנים מומחים."},{"q":"מהו ״תפקיד״ (Job) לפי הפרק?","a":"צירוף של כמה מטלות שאדם אחד מבצע שוב ושוב","w":["יחידה ארגונית עם מנהל משלה","משימה מורכבת שדורשת הכשרה ארוכה","מחלקה שמרכזת עובדים בעלי מקצוע דומה"],"e":"תפקיד הוא צירוף של כמה מטלות שאדם אחד מבצע שוב ושוב. יחידה ארגונית עם מנהל משלה היא יחידה, לא תפקיד."}]},
"q8":{"t":"t2","v":[{"q":"מפעל שפישט כל עבודה לפעולה אחת קצרה מגלה עלייה בהיעדרויות, בתאונות ובתחלופה. לפי הפרק, למה בונוסים לא יפתרו זאת?","a":"כי הבעיה היא ניכור, ושכר עידוד לא מספיק נגדו","w":["כי הבונוסים יקרים מדי עבור המפעל","כי העובדים לא מבינים את שיטת הבונוס","כי הבעיה היא מחסור במומחים ובהכשרה"],"e":"היעדרויות, תאונות ותחלופה בעבודה מפושטת הם ביטויים של ניכור, ושכר עידוד לא מספיק נגדו. לכן מחפשים חלופות שמגבירות מעורבות ואחריות. העלות של הבונוסים איננה הבעיה."},{"q":"איזה מהבאים אינו מקור ליעילות של עקרון הפישוט?","a":"שיקול דעת רחב לכל עובד","w":["העסקת עובדים שמוכשרים בקלות","מינימום מעברים בין סוגי פעולות","שינוע חומרים בעזרת מכונות"],"e":"עקרון הפישוט מחליף שיקול דעת בנהלים שגרתיים, ולכן שיקול דעת רחב אינו מקור ליעילות שלו. הכשרה קלה, מעט מעברים ושינוע במכונות הם מקורות היעילות."}]},
"q9":{"t":"t2","v":[{"q":"משרד עורכי דין מחולק לצוותים של דיני משפחה, דיני עבודה ומיסוי. לפי איזה עיקרון חולקו התפקידים?","a":"עקרון ההתמחות","w":["עקרון הפישוט","עקרון הקרבה","עקרון הדמיות"],"e":"פיצול לפי תחומי מקצוע (משפחה, עבודה, מיסוי), בתפקידים מורכבים שדורשים ידע, הוא עקרון ההתמחות. פישוט היה מפרק לפעולות פשוטות שאינן דורשות ידע."},{"q":"למה אי אפשר לפשט את עבודת המהנדסת כמו שפישטו את ייצור הסיכות?","a":"כי היא דורשת ידע תיאורטי, הכשרה ארוכה ושיקול דעת","w":["כי מהנדסים מסרבים לבצע עבודה שגרתית","כי אין מספיק מהנדסים זמינים בשוק העבודה","כי עבודת הנדסה היא תמיד עבודה קבוצתית"],"e":"עבודת המהנדסת דורשת ידע תיאורטי, הכשרה ארוכה ושיקול דעת, ולכן אי אפשר לפרק אותה לפעולות פשוטות. משימות כאלה מתאימות לעקרון ההתמחות."}]},
"q10":{"t":"t2","v":[{"q":"מה ההבדל המהותי בין תפקיד לפי פישוט לתפקיד לפי התמחות?","a":"פישוט: שגרתי ופשוט. התמחות: מורכב ודורש שיקול דעת","w":["פישוט: מורכב. התמחות: שגרתי","פישוט: לפי מקצוע. התמחות: לפי שלבי עבודה","אין הבדל, שניהם יוצרים ניכור"],"e":"בפישוט התפקיד שגרתי ופשוט, ובהתמחות הוא מורכב ודורש שיקול דעת. אלה שני עקרונות הפוכים לחלוקת משימות. המסיח הראשון הופך ביניהם."},{"q":"חברה מקימה מחלקת ״אבטחת מידע״ שלא הייתה לפני עשור. מה זה ממחיש?","a":"חדשנות טכנולוגית יוצרת מקצועות חדשים","w":["עקרון הפישוט מוביל לניכור","שוק עבודה פנימי מבטל התמחות","התיאוריה המוסדית מסבירה מבנים"],"e":"מחלקה חדשה לאבטחת מידע מראה שחדשנות טכנולוגית יוצרת מקצועות והתמחויות חדשים. זה לא קשור לניכור או לתיאוריה המוסדית."}]},
"q11":{"t":"t3","v":[{"q":"נהגי אוטובוס וכרטיסנים מוקבצים יחד ביחידה אחת. איזה שיקול הקבצה זה, ומה היתרון שלו?","a":"השלמה, שמשפרת תיאום ושיתוף פעולה","w":["דמיות, שמשפרת ניהול וגמישות","קרבה, שחוסכת עלויות ניהול","חליפין, שמשפרת היכרות עם הלקוח"],"e":"נהגים וכרטיסנים ממלאים תפקידים שמשלימים זה את זה, ולכן ההקבצה היא לפי השלמה, והיתרון שלה הוא תיאום ושיתוף פעולה טובים. דמיות הייתה מקבצת תפקידים זהים."},{"q":"כל המלצרים באולם מוקבצים יחד, וכל הטבחים יחד. איזה שיקול זה, ומה היתרון?","a":"דמיות, שמאפשרת גמישות בהעברת עובדים ותקשורת טובה","w":["השלמה, שמשפרת את התיאום בין מלצרים לטבחים","קרבה, שחוסכת בעלויות ניהול","חליפין, שמתאימה ללקוחות שונים"],"e":"הקבצה של מלצרים עם מלצרים וטבחים עם טבחים היא לפי דמיות, תפקידים זהים או דומים. היתרון: גמישות בהעברת עובדים ותקשורת טובה ביניהם. השלמה הייתה מקבצת מלצר עם טבח."}]},
"q12":{"t":"t3","v":[{"q":"תנובה מקבצת יחידות לפי הקיבוצים שמספקים לה. איזה שיקול זה?","a":"חליפין (לפי ספק)","w":["קרבה (לפי מקום)","השלמה","דמיות"],"e":"הקבצה לפי הקיבוצים שמספקים לתנובה היא הקבצה לפי חליפין, במקרה הזה לפי ספק. חליפין יכול להיות גם לפי לקוח או קבוצת לקוחות."},{"q":"כל עובדי משמרת הלילה, מכל התפקידים, מוקבצים יחד. איזה שיקול זה?","a":"קרבה (לפי זמן)","w":["דמיות (תפקידים דומים)","חליפין (לפי לקוח)","השלמה (תפקידים משלימים)"],"e":"הקבצה של כל עובדי משמרת הלילה יחד, בלי קשר לתפקיד, היא הקבצה לפי קרבה בזמן. קרבה יכולה להיות לפי מקום או לפי זמן."}]},
"q35":{"t":"t3","v":[{"q":"במפעל רהיטים יש מחלקת רכש עץ וחטיבת ריהוט משרדי שמוכרת ללקוחות. מה נכון?","a":"הרכש מאורגן לפי תשומות, החטיבה לפי תפוקות","w":["הרכש לפי תפוקות, החטיבה לפי תשומות","שתיהן לפי תשומות","שתיהן לפי תפוקות"],"e":"רכש עץ עוסק במה שנכנס לארגון, ולכן מאורגן לפי תשומות. חטיבה שמוכרת ריהוט משרדי עוסקת במה שיוצא, ולכן מאורגנת לפי תפוקות."},{"q":"מה עושים ארגונים גדולים לגבי תשומות ותפוקות?","a":"מקימים תת־יחידות לפי תשומות בתוך יחידות לפי תפוקות","w":["בוחרים רק בסוג אחד ומוותרים על השני","מקימים יחידות לפי תפוקות בתוך יחידות לפי תשומות","מבטלים את שני הסוגים לטובת ארגון וירטואלי"],"e":"ארגונים גדולים משלבים את שני הבסיסים: הם מקימים יחידות לפי תפוקות, ובתוכן תת־יחידות לפי תשומות. המסיח השני הופך את הסדר."}]},
"q36":{"t":"t3","v":[{"q":"מה היתרון של הקבצה לפי קרבה?","a":"חיסכון בניהול ובעלויות","w":["היכרות טובה עם הלקוח","תיאום בין תפקידים משלימים","גמישות בהעברת עובדים דומים"],"e":"הקבצה לפי קרבה, באותו מקום או באותו זמן, חוסכת בניהול ובעלויות. היכרות עם הלקוח היא היתרון של הקבצה לפי חליפין."},{"q":"למה בכלל מקבצים תפקידים ליחידות?","a":"כדי שאפשר יהיה לנהל ולתאם","w":["כדי להגדיל את מספר העובדים","כדי לבטל את הצורך בכילול","כדי למנוע התמחות של העובדים"],"e":"מקבצים תפקידים ליחידות כדי שאפשר יהיה לנהל ולתאם אותם, כמו בצבא: כיתות, מחלקות ופלוגות. ההקבצה לא מבטלת את הצורך בכילול."}]},
"q13":{"t":"t4","v":[{"q":"בבית חולים יש מחלקות קרדיולוגיה, אורתופדיה ונוירולוגיה, וכל אחת מרכזת את המומחים בתחומה. איזו תבנית זו?","a":"מומחיות","w":["תפקודים","תהליכים","לקוחות"],"e":"מחלקות שמרכזות מומחים לפי מקצוע הן ארגון לפי מומחיות. ארגון לפי תפקודים היה מחלק לתת־מערכות, כמו ייצור, שיווק וכספים."},{"q":"מהן שלוש התבניות לפי תשומות?","a":"תפקודים, מומחיות ותהליכים","w":["מוצרים, אזורים ולקוחות","תפקודים, מוצרים ואזורים","מומחיות, לקוחות ותהליכים"],"e":"שלוש התבניות לפי תשומות הן תפקודים, מומחיות ותהליכים. מוצרים, אזורים ולקוחות הן התבניות לפי תפוקות."}]},
"q14":{"t":"t4","v":[{"q":"בשירות הדואר, יחידה אחת אוספת, שנייה ממיינת ושלישית מחלקת. איזו תבנית זו?","a":"תהליכים","w":["תפקודים","מומחיות","אזורים"],"e":"איסוף, מיון וחלוקה הם שלבים בתהליך טורי, שבו כל שלב מוסיף לקודמו, ולכן זו תבנית לפי תהליכים. ארגון לפי אזורים היה מחלק לפי מקום."},{"q":"חברת היי־טק מחולקת לאגפי פיתוח, שיווק, כספים ומשאבי אנוש. איזו תבנית זו?","a":"תפקודים","w":["מומחיות","תהליכים","מוצרים"],"e":"פיתוח, שיווק, כספים ומשאבי אנוש הם תת־מערכות תפקודיות, ולכן זו תבנית לפי תפקודים. מומחיות הייתה מחלקת לפי מקצועות."}]},
"q37":{"t":"t4","v":[{"q":"למה בנקים ביטלו את התבנית לפי תהליכים?","a":"בגלל המחשוב","w":["בגלל הצורך בקרבה ללקוח","בגלל עלות גבוהה של מומחים","בגלל מעבר לתבנית לפי אזורים"],"e":"המחשוב ייתר את החלוקה של העבודה לשלבים, ולכן בנקים ביטלו את התבנית לפי תהליכים. זה לא בגלל מעבר לתבנית לפי אזורים."},{"q":"מה מבדיל ארגון לפי מומחיות מארגון לפי תפקודים?","a":"מומחיות: לפי מקצועות. תפקודים: לפי תת־מערכות","w":["מומחיות: לפי שלבי עבודה. תפקודים: לפי לקוחות","מומחיות: לפי אזורים. תפקודים: לפי מוצרים","אין הבדל, אלה שני שמות לאותה תבנית"],"e":"שתי התבניות הן לפי תשומות, אבל על בסיס שונה: מומחיות מחלקת לפי מקצועות, ותפקודים לפי תת־מערכות. אלה לא שני שמות לאותה תבנית."}]},
"q38":{"t":"t4","v":[{"q":"באגף השיווק של חברה יש מדורי מכירות, משלוחים, חוזים, פרסום וחקר שווקים. מה זה ממחיש?","a":"חלוקה תפקודית גם בתוך יחידה תפקודית","w":["מעבר לתבנית לפי מוצרים בתוך האגף","מבנה שתי־וערב בתוך אגף השיווק","תבנית לפי תהליכים טוריים בשיווק"],"e":"גם בתוך אגף תפקודי (שיווק) יש חלוקה תפקודית נוספת: מכירות, משלוחים, חוזים, פרסום וחקר שווקים. זה לא מבנה שתי־וערב."},{"q":"באיזה תחום נפוצה במיוחד התבנית לפי תהליכים?","a":"טקסטיל, מזון וכימיקלים","w":["בתי חולים ואוניברסיטאות","בנקים ורשתות שיווק","מכוני מחקר וחברות ייעוץ"],"e":"התבנית לפי תהליכים נפוצה במיוחד בתעשיות עם קו ייצור טורי, כמו טקסטיל, מזון וכימיקלים. בתי חולים מאורגנים יותר לפי מומחיות."}]},
"q15":{"t":"t5","v":[{"q":"חברה מחולקת לחטיבת מכשירי חשמל וחטיבת רהיטים, ולכל אחת מכירות, כספים ומשאבי אנוש משלה. איזו תבנית זו?","a":"מוצרים","w":["תפקודים","אזורים","לקוחות"],"e":"חטיבות שכל אחת מופקדת על מוצר אחר, ויש בה את כל הפעילויות שלו (מכירות, כספים, משאבי אנוש), הן תבנית לפי מוצרים. תבנית תפקודית הייתה מחלקת את כל הארגון לפי פעילויות."},{"q":"משטרת ישראל מחולקת למחוזות, וכל מחוז מספק את כל השירותים באזורו. איזו תבנית זו?","a":"אזורים","w":["מוצרים","לקוחות","תהליכים"],"e":"מחוזות שכל אחד מהם מספק את כל השירותים באזור שלו הם תבנית לפי אזורים. תבנית לפי לקוחות הייתה מחלקת לפי סוגי אוכלוסייה."}]},
"q16":{"t":"t5","v":[{"q":"אגף רווחה עם מחלקות לילדים ונוער, לקשישים ולמשפחות. איזו תבנית זו?","a":"לקוחות","w":["מוצרים","אזורים","מומחיות"],"e":"מחלקות שמתמחות בסוגי אוכלוסייה (ילדים, קשישים, משפחות) הן תבנית לפי לקוחות. תבנית לפי מומחיות הייתה מחלקת לפי מקצועות המטפלים."},{"q":"מהן שלוש התבניות לפי תפוקות?","a":"מוצרים, אזורים ולקוחות","w":["תפקודים, מומחיות ותהליכים","מוצרים, תהליכים ולקוחות","אזורים, מומחיות ותפקודים"],"e":"שלוש התבניות לפי תפוקות הן מוצרים, אזורים ולקוחות. תפקודים, מומחיות ותהליכים הן תבניות לפי תשומות."}]},
"q39":{"t":"t5","v":[{"q":"מה מבדיל חטיבה בתבנית לפי מוצרים ממחלקה בתבנית לפי תפקודים?","a":"החטיבה כוללת את כל הפעילויות התפקודיות של המוצר","w":["החטיבה מרכזת מומחים ממקצוע אחד בלבד","החטיבה מבצעת רק שלב אחד בתהליך הייצור","החטיבה משרתת רק אזור גיאוגרפי מוגדר אחד"],"e":"חטיבה כוללת את כל הפעילויות התפקודיות של המוצר שלה, ולכן היא יחידה עצמאית־למחצה. מחלקה תפקודית עושה רק פעילות אחת עבור כל הארגון."},{"q":"תשעת הקמפוסים של אוניברסיטת קליפורניה, עם הנהלה מרכזית, הם דוגמה ל:","a":"ארגון לפי אזורים","w":["ארגון לפי מומחיות","ארגון לפי לקוחות","ארגון שתי־וערב"],"e":"קמפוסים שכל אחד מהם עצמאי במידה, עם הנהלה מרכזית אחת, הם ארגון לפי אזורים. זה לא ארגון שתי־וערב."}]},
"q40":{"t":"t5","v":[{"q":"בית דין מחולק לפי סוג העבירה. איזו תבנית זו?","a":"לקוחות","w":["מומחיות","תהליכים","אזורים"],"e":"חלוקה לפי סוג העבירה היא התמחות בסוגי ״לקוחות״, כלומר מקרים, ולכן זו תבנית לפי לקוחות. מומחיות הייתה מחלקת לפי תחומי ההכשרה של השופטים."},{"q":"בנק מחולק למחלקת לקוחות פרטיים ומחלקת עסקים, וגם למרחבי צפון, מרכז ודרום. אילו תבניות משולבות?","a":"לקוחות ואזורים","w":["מוצרים ותהליכים","מומחיות ותפקודים","תהליכים ולקוחות"],"e":"פרטיים ועסקים הם סוגי לקוחות, וצפון, מרכז ודרום הם אזורים, ולכן אלה שתי תבניות לפי תפוקות, משולבות יחד."}]},
"q17":{"t":"t6","v":[{"q":"בחברת לוויינים, מהנדסים ממחלקות שונות ״מושאלים״ לפרויקט לזמן קצוב, ובסיומו עוברים לפרויקט אחר. איזה מבנה זה?","a":"שתי־וערב (מטריצה)","w":["ארגון משולב","ארגון לפי מומחיות","ארגון רשתי"],"e":"מהנדסים ש״מושאלים״ ממחלקות שונות לפרויקט לזמן קצוב, וחוזרים בסיומו, הם המאפיין של מבנה שתי־וערב (מטריצה). בארגון משולב הכפילות קבועה."},{"q":"איפה הונהג לראשונה מבנה שתי־וערב?","a":"בנאס״א, במרוץ לירח","w":["בצה״ל, ביחידות הסיוע הקבועות","במפעלי הרכב של פורד בתחילת המאה","ברשתות המלונות בארצות הברית"],"e":"מבנה שתי־וערב הונהג לראשונה בנאס״א, במרוץ לירח, ומשם התפשט לארגונים עתירי ידע. הוא לא הונהג לראשונה במפעלי פורד."}]},
"q18":{"t":"t6","v":[{"q":"במטריצה, מהנדסת מקבלת מראש הפרויקט הנחיה ״לבנות את רכיב הניווט עד מרץ״, ומראש מחלקת ההנדסה הנחיה ״לעמוד בתקן האיכות״. מי מהם הממונה המקצועי?","a":"ראש מחלקת ההנדסה","w":["ראש הפרויקט","שניהם באותה מידה","אף אחד, כי זה מבנה אופקי"],"e":"הממונה המקצועי, ראש מחלקת ההנדסה, מנחה איך לעבוד: איכות, תקן ולוחות זמנים מקצועיים. ראש הפרויקט מנחה מה לבנות ומתי, ולכן הוא לא הממונה המקצועי."},{"q":"בין מי לבין מי נחתמים חוזי העבודה הפנימיים במטריצה?","a":"בין ראשי המנהלות לראשי היחידות המקצועיות","w":["בין העובדים לבין הלקוחות של הארגון","בין ההנהלה הראשית לבין הזכיינים ברשת","בין ארגונים עצמאיים שפועלים ברשת"],"e":"חוזי העבודה הפנימיים במטריצה נחתמים בין ראשי המנהלות (בעלי הממון) לבין ראשי היחידות המקצועיות (בעלי הידע), שמשאילים את המומחים."}]},
"q19":{"t":"t6","v":[{"q":"ביחידה לוחמת יש חובשים קבועים, שכפופים גם למפקד היחידה וגם לחיל הרפואה. מה מבדיל זאת ממטריצה?","a":"הכפילות קבועה, ולא זמנית לפרויקט","w":["אין כפיפות כפולה כאן","הכפילות זמנית, כמו במטריצה","החובשים כפופים רק לחיל הרפואה"],"e":"גם כאן החובשים כפופים לשני גורמים, אבל הכפילות קבועה ולא זמנית לפרויקט. לכן זה ארגון על בסיס משולב, ולא מטריצה."},{"q":"באילו ארגונים נפוץ במיוחד הארגון המשולב?","a":"ארגונים גדולים: צבא, משטרה, תאגידים","w":["סטארט־אפים קטנים וגמישים","מכוני מחקר עם פרויקטים זמניים","ארגונים וירטואליים עם ליבה קטנה"],"e":"ארגון משולב נפוץ בארגונים גדולים, כמו צבא, משטרה ותאגידים, שצריכים כפילות קבועה. מכוני מחקר עם פרויקטים זמניים מתאימים יותר למטריצה."}]},
"q20":{"t":"t6","v":[{"q":"למה מבנה שתי־וערב נפוץ בחברות מטוסים, מחשבים ולוויינים?","a":"כי הם מפתחים מוצרים מורכבים שדורשים מומחים רבים","w":["כי הן קטנות ולא צריכות היררכיה","כי המוצרים שלהן פשוטים ושגרתיים","כי הן פועלות בסביבה יציבה מאוד"],"e":"חברות מטוסים, מחשבים ולוויינים מפתחות מוצרים מורכבים שדורשים מומחים רבים, ולכן מטריצה מתאימה להן. הן לא קטנות ולא פועלות בסביבה יציבה."},{"q":"מה עושה ״מנהלת פרויקט״ במטריצה?","a":"מופקדת על מוצר ו״שואלת״ מומחים מהיחידות","w":["מכשירה מומחים חדשים לכל הארגון","קובעת את תקן האיכות לכל המקצועות","מנהלת את משאבי האנוש של הארגון"],"e":"מנהלת פרויקט במטריצה מופקדת על מוצר, ו״שואלת״ מומחים מהיחידות המקצועיות. זה הצד ״לפי תפוקות״ של המטריצה. היא לא מכשירה מומחים."}]},
"q21":{"t":"t7","v":[{"q":"שלוש חברות תרופות מתאחדות זמנית לפיתוח חיסון, ואחר כך כל אחת חוזרת לדרכה. איזה הסדר זה?","a":"מאגד (Consortium)","w":["מיזוג (Merger)","רכישה (Acquisition)","מיזם משותף (Joint venture)"],"e":"כמה ארגונים שפועלים יחד בנושא מסוים, לרוב זמנית, וכל אחד חוזר אחר כך לדרכו, הם מאגד. במיזם משותף מקימים ארגון־בן חדש."},{"q":"מה המטרה של ארגון־כלאיים?","a":"לשלב גמישות של ארגון קטן עם יתרונות גודל של גדול","w":["לבטל את כל דרגי הניהול בארגון","להעביר את כל הפעילות למיקור חוץ","לעבור ממבנה לפי תפוקות למבנה לפי תשומות"],"e":"ארגון־כלאיים הוא הסדר בין־ארגוני שמשלב את הגמישות של ארגון קטן עם יתרונות הגודל של ארגון גדול, תוך שימוש במשאבים קיימים. הוא לא מבטל את כל דרגי הניהול."}]},
"q22":{"t":"t7","v":[{"q":"תאגיד מחולק לחטיבות לפי מוצרים, בכל חטיבה מבנה תפקודי, ומערך המכירות לפי אזורים. איזה מבנה זה?","a":"רב־שכבתי","w":["שתי־וערב","משולב","אופקי"],"e":"חטיבות לפי מוצרים, מבנה תפקודי בתוך כל חטיבה, ומכירות לפי אזורים: כמה תבניות שמתקיימות יחד הן מבנה רב־שכבתי. מטריצה היא שני קווי סמכות, ולא שכבות של תבניות."},{"q":"שתי חברות מקימות יחד חברה־בת חדשה לפיתוח טכנולוגיה. איזה הסדר זה?","a":"מיזם","w":["מיזוג","רכישה","מאגד"],"e":"כששתי חברות מקימות יחד חברה־בת חדשה, זה מיזם משותף, ארגון־בן משותף. במיזוג שתי החברות הופכות לאחת."}]},
"q23":{"t":"t7","v":[{"q":"חברה מבטלת את המחלקות, ומקימה צוותים רב־מקצועיים שמנהלים את עצמם סביב תהליך ״טיפול בהזמנה״, עם ״בעלים״ לתהליך. איזה מבנה זה?","a":"אופקי","w":["רשתי","רב־שכבתי","שתי־וערב"],"e":"ביטול מחלקות והקמת צוותים רב־מקצועיים שמנהלים את עצמם סביב תהליך, עם ״בעלים״ לתהליך, הם ארגון אופקי. ארגון רשתי הוא הנהלה שפורסת סניפים."},{"q":"מה הארגון האופקי עושה לפירמידה?","a":"״פוחס״ אותה: פחות דרגי ניהול ויחידות מטה","w":["מוסיף לה דרגי ניהול","מפצל אותה לחטיבות לפי מוצרים","הופך אותה לרשת של ארגונים עצמאיים"],"e":"הארגון האופקי ״פוחס״ את הפירמידה: פחות דרגי ניהול ופחות יחידות מטה, והלקוח במרכז. הוא לא מוסיף דרגים."}]},
"q24":{"t":"t7","v":[{"q":"רשת השכרת רכב שבה ההנהלה מספקת פרסום, מחשוב והזמנות, וכל סניף הוא מרכז רווח. איזה מבנה זה?","a":"רשתי","w":["אופקי","וירטואלי","רב־שכבתי"],"e":"הנהלה ראשית שמספקת שירותים משותפים (פרסום, מחשוב, הזמנות), וסניפים באתרים רבים שכל אחד מהם מרכז רווח, הם מבנה רשתי. בווירטואלי יש ליבה קטנה וישויות מפוזרות."},{"q":"מה זה זכיינות (Franchising)?","a":"סניפים זהים שמוחכרים תמורת תמלוגים","w":["מיזוג של שני ארגונים לארגון אחד","שיתוף בדירקטורים בין כמה חברות","השאלת מומחים לפרויקט זמני"],"e":"בזכיינות מחכירים סניפים זהים לאחרים, תמורת תמלוגים, כמו ב״הולידיי אין״. זה לא מיזוג ולא השאלת מומחים."}]},
"q25":{"t":"t7","v":[{"q":"אותו אדם יושב בדירקטוריון של בנק, של חברת ביטוח ושל חברת נדל״ן, ומשמש ״סיכת חיבור״ ביניהן. איזה מנגנון זה?","a":"שילוב דירקטורים","w":["מיזם משותף","זכיינות","מאגד"],"e":"אדם שיושב בדירקטוריונים של כמה חברות ומשמש ״סיכת חיבור״ ביניהן מדגים שילוב דירקטורים, דרך שבה רשתות בין־ארגוניות פועלות בעסקים."},{"q":"למה רשת בין־ארגונית היא ״הקוטב השלישי״?","a":"כי היא לא שוק ולא מדרג","w":["כי היא שילוב של מוצרים ואזורים","כי היא השלב השלישי בהתפתחות ארגון","כי היא כוללת שלושה ארגונים לפחות"],"e":"רשת בין־ארגונית היא ״הקוטב השלישי״ כי היא לא שוק (סחר חופשי) ולא מדרג (סמכות), אלא מבוססת על אמון. זה לא קשור למספר הארגונים."}]},
"q26":{"t":"t7","v":[{"q":"מה מבדיל ארגון וירטואלי מארגון רשתי?","a":"וירטואלי: ליבה קטנה וישויות מפוזרות. רשתי: הנהלה שפורסת סניפים","w":["וירטואלי: סניפים זהים. רשתי: ליבה קטנה","וירטואלי: מבנה קבוע. רשתי: זמני","אין הבדל, אלה שני שמות לאותו מבנה"],"e":"בארגון וירטואלי יש ליבה קטנה וישויות מפוזרות, והגבולות בין הארגון לסביבה נעלמים. בארגון רשתי הנהלה ראשית פורסת סניפים. המסיח הראשון מחליף ביניהם."},{"q":"מתי רשת בין־ארגונית אסורה?","a":"כשהיא קרטל שמגביל תחרות","w":["כשאין לה חוזים כתובים","כשהיא נשענת על אמון","כשהשותפים הם חברות גדולות"],"e":"רשת בין־ארגונית לא צריכה חוזים כתובים, כל עוד היא לא קרטל שמגביל תחרות. קרטל אסור, גם אם הוא נשען על אמון."}]},
"q27":{"t":"t8","v":[{"q":"במבנה לפי תשומות, מהנדסי המו״פ מעדיפים לפתח טכנולוגיה מתקדמת גם כשהיא לא רווחית, ולא מתעניינים במוצר הסופי. איך נקראת התופעה?","a":"תסמונת הניכור","w":["אובדן סינרגיה","כפיפות כפולה","תגובת־יתר"],"e":"הזדהות־יתר עם היחידה, והעדפת שיקולים מקצועיים על פני מטרות הארגון, הן תסמונת הניכור. זה חיסרון של מבנים לפי תשומות. אובדן סינרגיה הוא חיסרון של מבנים רב־חטיבתיים."},{"q":"מה היתרון הבולט של מבנים לפי תשומות?","a":"יעילות, התמחות ויתרונות הגודל","w":["כושר שינוי מהיר","קרבה ללקוח וגישה כוללנית","פיזור סיכונים בין מרכזי רווח"],"e":"היתרון הבולט של מבנים לפי תשומות הוא יעילות, התמחות ויתרונות הגודל. כושר שינוי וקרבה ללקוח הם יתרונות של מבנים לפי תפוקות."}]},
"q28":{"t":"t8","v":[{"q":"חברה עם מבנה תפקודי נכנסת לשוק שמשתנה כל כמה חודשים. מה הבעיה הצפויה?","a":"כושר שינוי מוגבל, ״עקב אכילס״ של המבנה","w":["כפילות משאבים בין החטיבות השונות","רמה מקצועית נמוכה של העובדים","כפיפות כפולה של העובדים לשני ממונים"],"e":"כושר שינוי מוגבל הוא ״עקב אכילס״ של מבנה תפקודי, ולכן הוא יתקשה בשוק שמשתנה מהר. מבנה לפי תשומות עדיף בסביבה יציבה. כפילות משאבים היא חיסרון של מבנה לפי תפוקות."},{"q":"חברה קטנה וצומחת שמפתחת משחקי קופסה, הפיתוח דורש התמחות, ויש מעט מתחרים. איזה מבנה מתאים?","a":"מבנה פונקציונלי","w":["מבנה חטיבתי לפי מוצר","מבנה שתי־וערב","ארגון וירטואלי"],"e":"ארגון קטן, בסביבה יציבה עם מעט מתחרים, שזקוק להתמחות, מתאים למבנה פונקציונלי. מבנה חטיבתי מתאים לארגון עם כמה מוצרים או שווקים."}]},
"q29":{"t":"t8","v":[{"q":"בתאגיד עם 6 חטיבות עצמאיות, לכל אחת מחלקת שיווק, חשבונאות ומשאבי אנוש משלה. איזה חיסרון זה?","a":"כפילות משאבים","w":["תסמונת הניכור","כושר שינוי מוגבל","קונפליקט מבני"],"e":"כשלכל חטיבה יש שיווק, חשבונאות ומשאבי אנוש משלה, יש כפילות משאבים, ויתרונות הגודל אובדים. זה חיסרון של מבנה לפי תפוקות."},{"q":"בחטיבה יש רק שני אנשי כספים, בלי עמיתים מקצועיים ללמוד מהם. איזה חיסרון של מבנה לפי תפוקות זה?","a":"רמה מקצועית נמוכה","w":["תסמונת הניכור","כפיפות כפולה","תגובת־יתר"],"e":"כשבחטיבה יש רק שני אנשי כספים, אין ״מסה קריטית״ של מומחים, והרמה המקצועית נמוכה. זה חיסרון של מבנה לפי תפוקות. תסמונת הניכור שייכת למבנה לפי תשומות."}]},
"q30":{"t":"t8","v":[{"q":"חטיבה אחת בתאגיד נכשלת, ושאר החטיבות לא נפגעות. איזה יתרון זה ממחיש?","a":"מרכזי רווח עצמאיים ופיזור סיכונים","w":["יתרונות הגודל","התמחות מקצועית גבוהה","שילוב יתרונות של שני בסיסים"],"e":"כשחטיבה אחת נכשלת והאחרות לא נפגעות, רואים את היתרון של מרכזי רווח עצמאיים ופיזור סיכונים, כי אין צימודים הדוקים בין החטיבות."},{"q":"שתי חטיבות באותו תאגיד מתחרות על אותם לקוחות ומסתירות מידע זו מזו. איזה חיסרון זה?","a":"אובדן סינרגיה","w":["כפילות משאבים","תסמונת הניכור","כפיפות כפולה"],"e":"חטיבות שמתחרות על אותם לקוחות ומסתירות מידע זו מזו מאבדות את הסינרגיה, את התועלת מעבודה משותפת. זה חיסרון של מבנה רב־חטיבתי."}]},
"q31":{"t":"t8","v":[{"q":"למה מבנה כפול מתאים לתחומים דינמיים ועתירי ידע?","a":"כי הוא מעבד מידע רב ומורכב, ומקבץ ומפזר מומחים מהר","w":["כי הוא זול ופשוט יחסית לניהול","כי אין בו מתח בין הממונים השונים","כי הוא מתאים במיוחד לסביבה יציבה"],"e":"מבנה כפול מעבד מידע רב ומורכב, ומקבץ ומפזר מומחים מהר, ולכן מתאים לתחומים דינמיים ועתירי ידע. הוא לא זול ופשוט לניהול."},{"q":"עובד במבנה כפול מקבל הוראות סותרות משני ממונים ולא יודע למי להיות נאמן. איזה חיסרון זה?","a":"כפיפות כפולה","w":["תסמונת הניכור","אובדן סינרגיה","כפילות משאבים"],"e":"הוראות סותרות משני ממונים, ובעיות של נאמנות, עמימות וחרדה, הן החיסרון של כפיפות כפולה במבנה כפול. אובדן סינרגיה הוא חיסרון של מבנה רב־חטיבתי."}]},
"q32":{"t":"t8","v":[{"q":"מכולת שכונתית מאמצת מבנה שתי־וערב. מה הפרק היה אומר?","a":"זו תגובת־יתר, כי הסביבה פשוטה ויציבה","w":["זו בחירה נכונה, כי כפול תמיד עדיף","זו בחירה נכונה, כי היא מגבירה התמחות","זו טעות, כי מכולת צריכה מבנה וירטואלי"],"e":"בסביבה פשוטה ויציבה, כמו של מכולת שכונתית, מבנה כפול הוא תגובת־יתר, והמחיר שלו גבוה מהתועלת. מבנה כפול לא תמיד עדיף."},{"q":"מתי מבנה כפול מצליח?","a":"כשהתרבות, האנשים והמנהלים מתאימים","w":["תמיד, בכל ארגון ובכל סביבה","רק בארגונים קטנים ומשפחתיים","רק בסביבה יציבה וצפויה מראש"],"e":"מבנה כפול מצליח רק כשהתרבות, האנשים והמנהלים מתאימים לו. הוא לא מתאים לכל ארגון ובכל סביבה."}]},
"q33":{"t":"t8","v":[{"q":"לפי סיכום הפרק, מה המבחן של מבנה ארגוני?","a":"ההתאמה לארגון ולסביבה, ביעילות ובתכליתיות","w":["כמה הוא חדשני ועדכני","כמה דרגי ניהול יש בו","כמה הוא דומה למבנים של ארגונים מובילים"],"e":"לפי סיכום הפרק, מבנים אינם טובים או רעים כשלעצמם. המבחן הוא ההתאמה לארגון ולסביבה, ביעילות ובתכליתיות, ולא כמה המבנה חדשני."},{"q":"לקוחות חוששים לקנות מחברה שאין לה משרד, עובדים או כתובת פיזית. איזה חיסרון של איזה מבנה זה?","a":"חוסר אמון ב״רכישה עיוורת״, בארגון וירטואלי","w":["אופורטוניזם של זכיינים, בארגון רשתי","החוליה החלשה, ברשת בין־ארגונית","מחיצות חדשות, בארגון אופקי"],"e":"לקוחות חוששים מ״רכישה עיוורת״ מחברה בלי משרד ובלי כתובת פיזית. זה חוסר אמון, החיסרון של ארגון וירטואלי. אופורטוניזם של זכיינים הוא חיסרון של מבנה רשתי."}]},
"q34":{"t":"t8","v":[{"q":"ברשת בין־ארגונית, אחד השותפים לא עומד בהתחייבויות, וכל הרשת נפגעת. מה זה ממחיש?","a":"נקודת התורפה: אמון והחוליה החלשה","w":["כפיפות כפולה של העובדים","תסמונת הניכור ביחידות","כפילות משאבים בין השותפים"],"e":"רשת בין־ארגונית נשענת על אמון, ולכן כששותף אחד לא עומד בהתחייבויות, כל הרשת נפגעת. האמון והחוליה החלשה הם נקודת התורפה שלה."},{"q":"מנהל סניף ברשת מלונות מקבל החלטות שמיטיבות איתו ופוגעות ברשת, כי ההנהלה רחוקה. איזה חיסרון זה?","a":"אופורטוניזם של מנהלים רחוקים, ברשתי","w":["אובדן סינרגיה, במבנה רב־חטיבתי","תסמונת הניכור, במבנה לפי תשומות","חוסר אמון, בארגון וירטואלי"],"e":"מנהל סניף רחוק מההנהלה, שמקבל החלטות שמיטיבות איתו ופוגעות ברשת, מדגים אופורטוניזם של מנהלים רחוקים, החיסרון של מבנה רשתי."}]},
"h1":{"t":"t1","v":[{"q":"משרד ממשלתי אימץ מבנה ״אופנתי״ למרות שהוא לא מתאים לצרכיו. איזו גישה מסבירה זאת הכי טוב?","a":"התיאוריה המוסדית: מבנים משקפים מיתוסים שהתמסדו","w":["הגישה המכאנית: המבנה הוא אמצעי ליעילות","עקרון הפישוט: פירוק המשימות לחלקים פשוטים וחוזרים","מודל טיב ההתאמה: התאמה לסביבה משתנה"],"e":"לפי התיאוריה המוסדית, ארגונים בוחרים תבניות מקובלות כדי להיראות לגיטימיים, ולא בהכרח את היעילות."}]},
"h2":{"t":"t2","v":[{"q":"בית חולים צריך לחלק את העבודה בין רופאים. איזה עיקרון מתאים, ולמה לא האחר?","a":"התמחות, כי העבודה דורשת ידע תיאורטי ושיקול דעת","w":["פישוט, כי הוא מוזיל את עלות ההכשרה","פישוט, כי הוא מונע ניכור בקרב הרופאים","התמחות, כי היא דורשת פחות תיאום בין היחידות השונות"],"e":"פישוט מתאים למשימות שגרתיות. רפואה דורשת ידע והכשרה ארוכה, ולכן מפצלים לפי תחומי מקצוע."}]},
"h3":{"t":"t3","v":[{"q":"חברת אוטובוסים מקבצת נהגים וכרטיסנים לאותה יחידה. לפי איזה שיקול?","a":"השלמה: תפקידים שמשלימים זה את זה","w":["דמיות: תפקידים זהים או דומים","קרבה: אותו מקום עבודה או אותה משמרת","חליפין: לפי סוג הלקוח"],"e":"נהג וכרטיסן משלימים זה את זה, כמו רופאים ואחיות. דמיות היא למשל קבוצת מלצרים."}]},
"h4":{"t":"t4","v":[{"q":"איזה מהבאים הוא ארגון לפי תשומות?","a":"אוניברסיטה עם פקולטות לפי מקצועות","w":["בנק עם מרחבי צפון, מרכז ודרום","אגף רווחה עם מחלקה לקשישים ולילדים","חברת מזון עם חטיבת חלב וחטיבת חטיפים"],"e":"מומחיות היא בסיס לפי תשומות. אזורים, לקוחות ומוצרים הם לפי תפוקות."}]},
"h5":{"t":"t5","v":[{"q":"חברה רב־חטיבתית מגלה ששתי חטיבות שלה מתחרות על אותם לקוחות. איזה חיסרון זה ממחיש?","a":"אובדן סינרגיה במבנה לפי תפוקות","w":["תסמונת הניכור במבנה לפי תשומות","כפיפות כפולה במבנה שתי־וערב","קונפליקט מבני במבנה לפי תפקודים"],"e":"במבנה רב־חטיבתי חטיבות לא משתפות פעולה, מסתירות מידע ומתחרות. זה לצד כפילות משאבים ורמה מקצועית נמוכה."}]},
"h6":{"t":"t6","v":[{"q":"במה שונה ארגון משולב (כמו בצה״ל) מארגון שתי־וערב?","a":"הכפילות במשולב קבועה; במטריצה המומחים מושאלים לזמן קצוב","w":["במשולב אין כפיפות כפולה; במטריצה יש","המשולב מתאים לארגונים קטנים בלבד; המטריצה מתאימה לגדולים","במשולב יש רק יחידות לפי תפוקות"],"e":"בצה״ל יחידות הסיוע קבועות בתוך החטיבות וכפופות לשתי מערכות. במטריצה המומחים עוברים מפרויקט לפרויקט."}]},

]},"h10":{"t":"t4","v":[{"q":"יחידת ניסור, אחריה יחידת הרכבה, אחריה יחידת צביעה. איזה קיבוץ זה?","a":"תשומות: תהליכים","w":["תשומות: תפקודים","תפוקות: מוצרים","תפוקות: אזורים"],"e":"כל יחידה אחראית על שלב אחד, כמו קו ייצור."}]},"h11":{"t":"t5","v":[{"q":"ל״עץ ודני״ יש חטיבת מטבחים וחטיבת ריהוט משרדי, ולכל אחת ייצור, מכירות וכספים משלה. איזה קיבוץ זה?","a":"תפוקות: מוצרים","w":["תשומות: תפקודים","תשומות: מומחיות","תפוקות: לקוחות"],"e":"כל חטיבה כמו חברה קטנה בתוך החברה."}]},"h12":{"t":"t5","v":[{"q":"אגף רווחה עם מחלקת ילדים ומחלקת קשישים. לפי מה הקיבוץ?","a":"תפוקות: לקוחות","w":["תשומות: מומחיות","תפוקות: אזורים","תשומות: תהליכים"],"e":"כל סוג לקוח צריך יחס אחר."}]},"h13":{"t":"t6","v":[{"q":"המעצבת עובדת חצי שנה בפרויקט המלון, אבל נשארת שייכת למחלקת העיצוב. איזה מבנה זה?","a":"מטריצה","w":["מבנה משולב","מבנה וירטואלי","רשת בין־ארגונית"],"e":"מנהל הפרויקט קובע מה ומתי; מנהלת העיצוב דואגת לאיך. נולד בנאס״א."}]},"h14":{"t":"t6","v":[{"q":"הרופא של הגדוד יושב תמיד בגדוד, וגם שייך לחיל הרפואה. איזה מבנה זה?","a":"משולב","w":["מטריצה","כלאיים","רשתי"],"e":"במטריצה ההשאלה זמנית; במשולב השילוב קבוע."}]},"h15":{"t":"t7","v":[{"q":"״עץ ודני״, ספק העץ וחברת ההובלות עובדים יחד שנים, בלי חוזה מחייב ובלי שאחד מנהל את השני. מה זה?","a":"רשת בין־ארגונית","w":["מבנה וירטואלי","מבנה כלאיים","מבנה רשתי של זכיינות"],"e":"לא שוק ולא מדרג, אלא ״הקוטב השלישי״, שנשען על אמון."}]},"h16":{"t":"t7","v":[{"q":"מבטלים מחלקות ושכבות ניהול, ובונים צוות שאחראי ״מהזמנה ועד התקנה״. איזה מבנה זה?","a":"אופקי","w":["רב־שכבתי","כלאיים","משולב"],"e":"הצוות מנהל את עצמו, והלקוח במרכז."}]},"h17":{"t":"t7","v":[{"q":"״עץ ודני״ וחברת תאורה מקימות יחד מיזם משותף למטבחים חכמים. איזה מבנה זה?","a":"כלאיים","w":["רשתי","וירטואלי","אופקי"],"e":"גם מיזוג ורכישה שייכים לכאן."}]},"h18":{"t":"t8","v":[{"q":"מנהלי המחלקות מזדהים עם המחלקה במקום עם הארגון, ואף אחד לא מרגיש אחראי ללקוח. באיזה מבנה זה קורה?","a":"תשומות","w":["תפוקות","מטריצה","משולב"],"e":"זו ״תסמונת הניכור״. מנגד, תשומות יעיל וחסכוני."}]},"h19":{"t":"t8","v":[{"q":"מה החיסרון העיקרי של מבנה לפי תפוקות?","a":"כפילויות ועלות גבוהה","w":["קושי לשנות כיוון מהר","אף אחד לא אחראי ללקוח","שני מנהלים לכל עובד"],"e":"לכל חטיבה כספים ושיווק משלה, ומעט מומחים מכל תחום."}]},"h20":{"t":"t8","v":[{"q":"לאיזו סביבה מתאים מבנה מטריצה?","a":"עתירת ידע ומשתנה","w":["פשוטה ויציבה","קטנה ושגרתית","ממשלתית וקבועה מאוד"],"e":"בסביבה פשוטה ויציבה מטריצה היא ״תגובת יתר״."}]}};
const SUM=`<h2>סיכום: מבנה ארגוני</h2>
<div class="key"><b>על מה מדובר?</b> כשאדם אחד עושה עבודה לבד, הוא לא צריך ״מבנה״: הוא יודע מה לעשות ומתי. אבל כשעשרות או אלפי אנשים עובדים יחד, צריך להחליט <b>מי עושה מה</b>, <b>מי עובד עם מי</b> ו<b>מי מחליט</b>. התשובה לשאלות האלה היא המבנה הארגוני.<br><br>הפרק עונה על שאלה אחת גדולה: <b>איך מחלקים עבודה גדולה בין הרבה אנשים, ואחר כך מחברים אותה בחזרה לשלם אחד?</b> הוא מראה את השלבים של הבנייה, את הדרכים השונות לבנות, ואת היתרונות והחסרונות של כל דרך.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>בידול</b></td><td>לפרק את המשימה הגדולה לתפקידים וליחידות.</td></tr>
<tr><td><b>כילול</b></td><td>לחבר את החלקים כך שיעבדו יחד. המנהלים הם עמוד השדרה שלו.</td></tr>
<tr><td><b>פישוט</b></td><td>פירוק עבודה לפעולות קטנות ופשוטות, כמו בקו ייצור.</td></tr>
<tr><td><b>התמחות</b></td><td>חלוקת העבודה לפי תחומי ידע ומקצוע.</td></tr>
<tr><td><b>תשומות / תפוקות</b></td><td>קיבוץ לפי סוג העבודה / לפי התוצאה (מוצר, אזור, לקוח).</td></tr>
<tr><td><b>מטריצה / משולב</b></td><td>שני מנהלים לעובד: זמני לפרויקט / קבוע.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: נגריית ״עץ ודני״</h3>
<p>דני הוא נגר שמתחיל לבד במחסן קטן. הוא מקבל הזמנה, קונה עץ, מתכנן, מנסר, מרכיב, צובע, מוביל ללקוח וגובה כסף. הכל לבד. אין לו שום ״מבנה״, וזה לא מפריע לו.</p>
<p>אחרי כמה שנים ההזמנות מתרבות, ודני כבר לא מספיק לבד. הוא מגייס עובדים, ועכשיו הוא חייב להחליט איך מתחלקים בעבודה. נעקוב אחרי ״עץ ודני״ כשהיא גדלה מנגרייה קטנה לחברת רהיטים גדולה, ובכל שלב נראה איזה מושג מהפרק נכנס לתמונה.</p>

<h3>1. שני התהליכים שבבסיס כל מבנה: לפרק ולחבר</h3>
<p>כל מבנה ארגוני, של נגרייה או של צבא, נבנה משני תהליכים הפוכים שמשלימים זה את זה:</p>
<ul>
<li><b>בידול (לפרק):</b> לוקחים את המשימה הגדולה (״לייצר רהיטים ולמכור אותם״) ומפרקים אותה לחלקים קטנים: רכש עץ, תכנון, ייצור, מכירות, הובלה. כל חלק הופך לתפקיד של מישהו, ותפקידים דומים מתקבצים ליחידות (מחלקות).</li>
<li><b>כילול (לחבר):</b> אחרי שפירקנו, צריך לוודא שכל החלקים עובדים יחד לכיוון אחד. אחרת מחלקת המכירות מבטיחה ללקוח ארון תוך שבוע, ומחלקת הייצור בכלל לא יודעת על זה. את החיבור עושים בעיקר <b>מנהלים</b>: לכל יחידה יש מנהל, ומעליהם מנהל שמתאם ביניהם. לכן המדרג הניהולי נקרא ״עמוד השדרה של הכילול״. לצד המנהלים יש גם תפקידי תיאום וקישור, למשל אחראי לוחות זמנים שמחבר בין מכירות לייצור.</li>
</ul>
<p><b>במשפט אחד:</b> בידול = לחלק את העבודה. כילול = לדאוג שהחלקים יעבדו יחד. מינצברג אמר בדיוק את זה: מבנה הוא הדרך שבה מחלקים את העבודה למטלות, ומבטיחים את התיאום ביניהן.</p>
<p><b>מורכבות:</b> ככל שהארגון מפרק את העבודה ליותר יחידות ויותר דרגי ניהול, וככל שיש יותר מנגנוני חיבור (ועדות, מתאמים), המבנה מורכב יותר. ״עץ ודני״ עם 5 עובדים פשוטה; כשיהיו לה 500 עובדים היא תהיה מורכבת הרבה יותר.</p>
<p><b>הערה חשובה:</b> מבנה לא נבחר רק לפי מה שהכי יעיל. ארגונים מושפעים גם מאופנה (״כולם עוברים למבנה כזה, אז גם אנחנו״), מפוליטיקה פנימית ומשיקולי יוקרה. לפי <b>התיאוריה המוסדית</b>, הרבה מבנים קיימים כי הם נחשבים ״נכונים״ ומקובלים, ולא בהכרח כי הם הכי יעילים.</p>

<h3>2. שלב ראשון בבידול: ממשימות לתפקידים</h3>
<p>השאלה הראשונה של דני: איך לחלק את העבודה בין העובדים? יש שתי דרכים הפוכות, ובחירה ביניהן תלויה בסוג העבודה.</p>
<h4>דרך א: פישוט</h4>
<p>בקו הייצור של הכיסאות, דני מחליט לפרק את העבודה לפעולות קטנות ופשוטות: עובד אחד רק מנסר רגליים, אחר רק משייף, שלישי רק מבריג, רביעי רק צובע. כל אחד חוזר על אותה פעולה שוב ושוב. זה <b>עקרון הפישוט</b>.</p>
<ul>
<li><b>למה זה טוב:</b> אפשר לגייס עובדים בלי ניסיון ולהכשיר אותם תוך יום, כל אחד נהיה מהיר מאוד בפעולה שלו, ויוצאים הרבה יותר כיסאות. אדם סמית הראה את זה כבר במאה ה־18: 10 פועלים שחילקו ביניהם את ייצור הסיכות הפיקו 48,000 סיכות ביום, לעומת 20 בלבד אצל אומן שעושה הכל לבד.</li>
<li><b>המחיר:</b> העבודה משעממת וחסרת משמעות. העובד שרק משייף רגליים כל היום לא מרגיש שהוא ״בונה כיסא״. זה נקרא <b>ניכור בעבודה</b>, והוא מוביל להיעדרויות, תאונות ועזיבה. גם תוספת שכר לא פותרת את זה.</li>
</ul>
<h4>דרך ב: התמחות</h4>
<p>אבל יש עבודות שאי אפשר לפרק לפעולות פשוטות. כשדני רוצה לעצב קו רהיטים חדש, הוא צריך <b>מעצבת</b> ו<b>מהנדס</b> שמחשב עומסים. אי אפשר ללמד את זה ביום; זה דורש לימודים, ידע ושיקול דעת. כאן העבודה מחולקת לפי <b>תחומי מקצוע</b>: עיצוב, הנדסה, חשבונאות. זה <b>עקרון ההתמחות</b>, וכך עובדים גם בתי חולים (קרדיולוג, אורתופד), אוניברסיטאות ומשרדי עורכי דין.</p>
<div class="tw"><table><tr><th></th><th>פישוט</th><th>התמחות</th></tr>
<tr><td>מתאים ל</td><td>עבודה שגרתית שחוזרת על עצמה</td><td>עבודה מורכבת שדורשת ידע</td></tr>
<tr><td>ב״עץ ודני״</td><td>קו הייצור של הכיסאות</td><td>המעצבת והמהנדס</td></tr>
<tr><td>העובד</td><td>לא צריך הכשרה, עובד לפי נוהל</td><td>צריך לימודים ושיקול דעת</td></tr>
<tr><td>הבעיה</td><td>ניכור ושעמום</td><td>תלות במומחים, הכשרה ארוכה</td></tr></table></div>

<h3>3. שלב שני בבידול: מתפקידים ליחידות</h3>
<p>עכשיו יש לדני 40 עובדים בתפקידים שונים. הוא לא יכול לנהל את כולם ישירות, ולכן הוא צריך לקבץ אותם לקבוצות (יחידות), עם מנהל לכל קבוצה. השאלה: <b>את מי לשים עם מי?</b> הפרק מציע ארבעה שיקולים, וכולם מופיעים אצל דני:</p>
<ul>
<li><b>דמיות</b> (תפקידים דומים יחד): כל המשייפים באותה יחידה. קל לנהל אותם, ואם אחד חולה, אחר מחליף אותו.</li>
<li><b>השלמה</b> (תפקידים שצריכים זה את זה יחד): הנהג והסבל שמובילים ומרכיבים אצל הלקוח עובדים כצוות, כי אחד בלי השני לא מסיים את המשימה. (כמו רופא ואחות בבית חולים.)</li>
<li><b>קרבה</b> (לפי מקום או זמן): כל מי שעובד באולם התצוגה בחיפה מקובץ יחד; כל מי שעובד במשמרת לילה יחד.</li>
<li><b>חליפין</b> (לפי מי שמולו עובדים): צוות שמטפל רק בלקוחות עסקיים, כמו מלונות ומשרדים.</li>
</ul>
<p>מתוך השיקולים האלה נולדות <b>שתי משפחות של מבנים</b>. ההבדל ביניהן הוא השאלה: <b>על מה מסתכלים כשמקבצים, על מה שנכנס לעבודה או על מה שיוצא ממנה?</b></p>

<h3>4. משפחה א: קיבוץ לפי תשומות (מה שנכנס לעבודה)</h3>
<p>״תשומות״ = מה שנדרש כדי לעשות את העבודה: סוג המיומנות, הידע או שלב העבודה. מקבצים יחד אנשים שעושים <b>אותו סוג עבודה</b>. יש שלוש צורות:</p>
<ul>
<li><b>לפי תפקודים:</b> ב״עץ ודני״ יש מחלקת ייצור, מחלקת מכירות, מחלקת כספים ומחלקת משאבי אנוש. כל המוכרים יחד, כל אנשי הכספים יחד. זה המבנה הנפוץ ביותר.</li>
<li><b>לפי מומחיות:</b> כל המעצבים במחלקת עיצוב, כל המהנדסים במחלקת הנדסה. נפוץ במקומות שמבוססים על מקצועות: באוניברסיטה יש פקולטה למשפטים ופקולטה לרפואה, ובבית חולים מחלקות לפי התמחות.</li>
<li><b>לפי תהליכים:</b> כל יחידה אחראית על שלב אחד בתהליך: יחידת ניסור, אחריה יחידת הרכבה, אחריה יחידת צביעה. כמו קו ייצור, כל שלב ממשיך את הקודם.</li>
</ul>

<h3>5. משפחה ב: קיבוץ לפי תפוקות (מה שיוצא מהעבודה)</h3>
<p>״תפוקות״ = מה שהארגון מספק החוצה: המוצר, השירות, ולמי. כאן לא מקבצים לפי סוג העבודה, אלא לפי <b>התוצאה</b>. כל יחידה מקבלת את כל מה שהיא צריכה (גם ייצור, גם מכירות, גם כספים) כדי לספק תוצאה אחת מההתחלה עד הסוף. שלוש צורות:</p>
<ul>
<li><b>לפי מוצרים:</b> ״עץ ודני״ גדלה ופותחת <b>חטיבת מטבחים</b> ו<b>חטיבת ריהוט משרדי</b>. לכל חטיבה יש ייצור, מכירות וכספים משלה, והיא כמו חברה קטנה בתוך החברה.</li>
<li><b>לפי אזורים:</b> החברה פותחת <b>מרחב צפון</b> ו<b>מרחב דרום</b>, וכל מרחב מספק את כל המוצרים לאזור שלו. כך עובדים גם בנקים, רשתות שיווק והמשטרה.</li>
<li><b>לפי לקוחות:</b> יחידה ללקוחות פרטיים ויחידה ללקוחות עסקיים, כי כל סוג לקוח צריך יחס אחר. כך עובדים גם אגף רווחה (מחלקת ילדים, מחלקת קשישים) או בנק (פרטיים מול עסקים).</li>
</ul>
<p><b>הדרך לזכור:</b> שאלו ״מה משותף לאנשים ביחידה?״ אם התשובה היא ״הם עושים אותו סוג עבודה״, זה לפי תשומות. אם התשובה היא ״הם מספקים את אותה תוצאה, לאותו מוצר, אזור או לקוח״, זה לפי תפוקות.</p>
