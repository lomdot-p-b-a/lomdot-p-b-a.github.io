<!doctype html>
<html lang="he" dir="rtl">

<title>לומדת חובת קריאה: מבנים ארגוניים (ארגונים, פרק 4)</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>
</head>

 {id:"t1",icon:"pyramid",title:"יסודות: בידול וכילול",blocks:[
  {h:"מהו מבנה ארגוני",html:`${def("על מה הנושא",`איך ארגון עם אלפי עובדים לא הופך לכאוס? צריך לחלק את העבודה, ואז לחבר אותה בחזרה. זה בדיוק מה שמבנה ארגוני עושה. הנושא מציג את שני התהליכים שבבסיס כל מבנה.<br><b>מה נלמד כאן:</b> מהו מבנה · בידול · כילול · מורכבות וגמישות`)}${def("מושג מפתח",`<mark>מבנה</mark> ${E("Structure")}: סדר־דברים יציב של עצמים במרחב ובזמן. בבניין, המחיצות והפתחים מכוונים את התנועה. <b>מבנה ארגוני</b> אינו פיסי: הוא מערך שיטתי ומסודר של <b>תפקידים</b> ו<b>יחידות</b>, עם תחומי סמכות ואחריות, שקובע באופן רשמי את כיווני התנועה של אנשים וחומרים ואת קשרי הגומלין ביניהם.`)}<p>המבנה נועד להקל על הפעילות, אבל הוא לא נקבע רק משיקולים תכליתיים. משפיעים גם שיקולים <b>פוליטיים, תרבותיים, חברתיים ואישיים</b>, וארגונים נוטים לבחור תבניות "אופנתיות" ומקובלות. הנטייה הזו ל<b>התמסדות</b> היא מניע חשוב בעיצוב המבנה.</p>${rem("לפי <b>הגישה המכאנית</b> המבנה הוא אמצעי ולא מטרה, ואין מבנה אחד מיטבי לכל הארגונים. לפי <b>התיאוריה המוסדית</b>, מבנים רבים משקפים אמונות, ערכים ומיתוסים שהתמסדו, ולא בהכרח את הפתרון היעיל.")}${ex(`כמו שבבניין המסדרונות והדלתות קובעים לאן אפשר ללכת, במבנה ארגוני התפקידים והיחידות קובעים מי מדבר עם מי ומי מחליט על מה.`)}`,q:"q1"},

  {h:"מורכבות וגמישות",html:`<p><b>דרגת הבידול</b> קובעת במידה רבה את המורכבות: ככל שיש יותר יחידות ויותר דרגי ניהול, המבנה מורכב יותר (צבא: זרועות, חילות, פיקודים, אגפים). הדרגה לא שרירותית: היא נקבעת לפי הגודל, התוצרים והסביבה, ולכן מפעל עתיר ידע מורכב יותר ממפעל מזון. גם <b>דרגת הכילול</b>, עם הרבה מנהלים, תפקידי תיאום וועדות, מגדילה מורכבות (משרדי ממשלה, תהליך היתר בנייה בישראל).</p>${ex("<b>תזמורת:</b> בידול לפי סוג הכלים (מיתר, נשיפה, נקישה), לתת־קבוצות (כינורות, צ׳לו) ולדרגות (נגנים ראשונים ושניים). <b>המנצח</b> הוא הכילול, ונגנים ראשיים משמשים ראשי צוותים וחוליות קישור. והמבנה משתנה לפי היצירה.")}${rem("ארגונים משנים מבנה יותר ויותר בהתאם לסביבה, ויש הרואים ב<b>גמישות ארגונית</b> את מפתח ההישרדות. העקרונות של בידול וכילול משותפים לכל הארגונים, והביצועים תלויים בהתאמה לתנאי הסביבה.")}`,q:"q5"}

 ]},
 {id:"t4",icon:"building",title:"תבניות לפי תשומות",blocks:[
  {h:"תפקודים, מומחיות ותהליכים",html:`${def("על מה הנושא",`הדרך הראשונה לקבץ: לפי מה שנכנס לעבודה, כלומר לפי סוג העבודה או המומחיות. שלוש תבניות.<br><b>מה נלמד כאן:</b> תפקודים · מומחיות · תהליכים`)}${fig("patterns","מפת התבניות בפרק")}${def("ארגון על בסיס תפקודים",`<mark>Functional organization</mark>: יחידות לפי תת־המערכות התפקודיות: הפקה, אחזקה, שיווק, משאבי אנוש, מחקר ופיתוח, כספים. גם בתוכן חלוקה תפקודית (אגף השיווק: מכירות, משלוחים, חוזים, פרסום, חקר שווקים).`)}${def("ארגון על בסיס מומחיות",`<mark>Professional organization</mark>: יחידות לפי מקצועות והתמחויות. כל יחידה מרכזת את המומחים בתחום. בתי חולים, מוסדות להשכלה גבוהה ומכוני מחקר (אוניברסיטה: פקולטות וחוגים).`)}${def("ארגון על בסיס תהליכים",`<mark>Process organization</mark>: יחידות לפי <b>שלבי הביצוע</b> בתהליך טורי, שבו כל שלב מוסיף לקודמו (קו הרכבה). נפוץ בטקסטיל (טוויה, אריגה, אשפרה, מתפרה), מזון וכימיקלים, וגם בשירותים כמו דואר. המחשוב גרם לבנקים לבטל תבנית זו.`)}${ex(`<b>תפקודים</b>: חברה עם אגף שיווק, אגף כספים ואגף ייצור. <b>מומחיות</b>: אוניברסיטה עם פקולטה לרפואה ופקולטה למשפטים. <b>תהליכים</b>: מפעל בגדים שבו יחידה אחת טווה, השנייה אורגת והשלישית תופרת.`)}`,q:"q13"}
 ]},
 {id:"t5",icon:"cart",title:"תבניות לפי תפוקות",blocks:[
  {h:"מוצרים, אזורים ולקוחות",html:`${def("על מה הנושא",`הדרך השנייה לקבץ: לפי מה שיוצא מהארגון, כלומר לפי התוצר, המקום או הלקוח. שלוש תבניות.<br><b>מה נלמד כאן:</b> מוצרים · אזורים · לקוחות`)}${def("ארגון על בסיס מוצרים",`<mark>Product organization</mark>: כל יחידה, לרוב <b>חטיבה</b>, מופקדת על מוצר או משפחת מוצרים, וכוללת את כל הפעילויות התפקודיות שלו (אחזקה, איכות, מכירות, כספים, משאבי אנוש, מו״פ). חטיבות עצמאיות־למחצה, למשל חטיבות מכשירי חשמל, כלי בית ורהיטים, ובתוכן קווי מוצר.`)}${def("ארגון על בסיס אזורים",`<mark>Regional organization</mark>: כל יחידה מספקת את <b>כל</b> המוצרים והשירותים לאוכלוסייה באזור מוגדר. בנקים, דואר, רשתות שיווק, משטרה, רשויות מקומיות (מרחבי צפון, מרכז ודרום עם מרפאות, בתי חולים וטיפות חלב). הסניפים עצמאיים במידה, כמו 9 הקמפוסים של אוניברסיטת קליפורניה עם הנהלה מרכזית.`)}${def("ארגון על בסיס לקוחות",`<mark>Client organization</mark>: יחידות שמתמחות ב<b>סוגי לקוחות</b> או בשווקים. פקידי שומה מתמחים בחברות או בעצמאים, בתי דין לפי סוג העבירה, אגף רווחה עם מחלקות ילדים ונוער, קשישים ומשפחות, שיקום. גם בתי כלא מקבצים כלואים לפי סוגים.`)}${ex(`<b>מוצרים</b>: חברת מזון עם חטיבת חלב וחטיבת חטיפים. <b>אזורים</b>: בנק עם מרחב צפון, מרכז ודרום. <b>לקוחות</b>: בנק עם מחלקה ללקוחות פרטיים ומחלקה לעסקים.`)}`,q:"q15"}
 ]},
 {id:"t6",icon:"copies",title:"מבנים על בסיס כפול",blocks:[
  {h:"שתי־וערב (מטריצה)",html:`${def("על מה הנושא",`מה עושים כשצריך גם מומחיות וגם מיקוד במוצר? משלבים את שתי הדרכים. הנושא מציג שני מבנים כפולים.<br><b>מה נלמד כאן:</b> שתי־וערב (מטריצה) · ארגון משולב`)}${def("מושג מפתח",`<mark>ארגון על בסיס שתי־וערב</mark> ${E("Matrix organization")}: הצלבה בו־זמנית של יחידות לפי <b>תשומות</b> (יחידות מקצועיות) עם יחידות לפי <b>תפוקות</b> (מנהלות פרויקט או תוכנית, program directory). הונהג לראשונה בסוכנות החלל האמריקנית במרוץ לירח, ונפוץ בארגונים עתירי ידע (מטוסים, מחשבים, לוויינים).`)}${fig("matrix","מבנה שתי־וערב לפי מוצרים ולפי התמחויות (לפי תרשים 4.10)")}${tiles([["target","ממונה משימתי","מגדיר לעובד מה עליו לבצע בפרויקט"],["grad","ממונה מקצועי","מנחה איך לבצע: איכות, כמות ולוח זמנים"]])}${rem("המומחים ״מושאלים״ למנהלות לזמן קצוב, בהסכמת מנהלי היחידות, ובסיום עוברים לפרויקט אחר. המערכת מתנהלת ב<b>חוזי עבודה פנימיים</b> בין ראשי המנהלות (בעלי הממון) לראשי היחידות המקצועיות (בעלי הידע).")}${ex(`מהנדסת בחברת רכב שייכת למחלקת ההנדסה (הממונה המקצועי שלה) וגם לצוות של דגם חדש (מנהל הפרויקט). יש לה שני בוסים בו־זמנית.`)}`,q:"q17"},
  {h:"ארגון משולב",html:`${def("מושג מפתח",`<mark>ארגון על בסיס משולב</mark> ${E("Combined organization")}: בארגונים גדולים (רשתות שיווק, תאגידים רב־לאומיים, ממשל, צבא ומשטרה). <b>שלא כמו המטריצה</b>, הכפילות כאן <b>קבועה</b>: יחידות לפי תשומות משולבות באורח קבוע ביחידות לפי תפוקות.`)}${ex("בצה״ל יחידות סיוע קבועות (קשר, מודיעין, רפואה, הנדסה קרבית, אספקה) נמצאות בתוך החטיבות הלוחמות, וכפופות בו־זמנית לשתי מערכות פיקוד: הקרבית והמקצועית (החיל). כך המערך הלוחם מקבל את מיטב הסיוע בלי לגייס ולהכשיר בעצמו.")}`,q:"q19"}
 ]},
 {id:"t7",icon:"link",title:"מבנים חדשניים",blocks:[
  {h:"כלאיים ורב־שכבתי",html:`${def("על מה הנושא",`מבנים חדשים שנוצרו בעשורים האחרונים, בעיקר בזכות טכנולוגיה ושיתופי פעולה בין ארגונים.<br><b>מה נלמד כאן:</b> כלאיים · רב־שכבתי · אופקי · רשתי · רשת בין־ארגונית · וירטואלי`)}${def("ארגון־כלאיים",`<mark>ארגון־כלאיים</mark> ${E("Hybrid organization")}: הסדר בין־ארגוני שמסתייע במשאבים, מבנים ומנגנוני ניהול קיימים ויוצר מבנה חדש. המטרה: לשלב את הגמישות של ארגון קטן עם יתרונות הגודל של ארגון גדול.`)}${tiles([["link","מיזוג","Merger: שני ארגונים מתאחדים"],["cart","רכישה","Acquisition: ארגון קונה אחר ומשלב אותו"],["people","מיזם משותף","Joint venture: ארגון־בן משותף"],["copies","מאגד","Consortium: כמה ארגונים פועלים יחד בנושא מסוים, לרוב זמנית"]])}<p>תאגידים ביפן מלווים ב<b>ארגוני לוויין</b> שמספקים להם בלעדית בהסכמים קבועים, בלי בעלות ובלי מדרג. בישראל יש מגמה ל״הפרטה״ של יחידות (מחשוב, הדרכה, לוגיסטיקה) לבעלות העובדים, עם חוזה ארוך טווח.</p>${def("מבנה רב־שכבתי",`<mark>Multifaceted structure</mark>: כמה תבניות במקביל. למשל תאגיד שמפוצל לתת־ארגונים לפי קווי מוצרים, בכל אחד מבנה פונקציונלי, ומערך השיווק לפי לקוחות או אזורים: לפחות שלושה סוגי מבנים יחד.`)}${ex(`<b>כלאיים</b>: שתי חברות שמקימות יחד מיזם משותף לפיתוח תרופה, ומשתמשות במעבדות ובמנהלים של שתיהן.`)}`,q:"q21"},
  {h:"אופקי ורשתי",html:`${def("ארגון אופקי",`<mark>Horizontal organization</mark>: מסגרות שיתוף פעולה <b>לרוחב</b> הארגון, שמבטלות במידה רבה את האגפים והמחלקות ואת שכבות הניהול. מבוסס על מספר קטן של <b>תהליכים</b> עיקריים, ולכל תהליך <b>״בעלים״</b> (owner). אבני הבניין: <b>צוותים רב־מקצועיים</b> שמנהלים את עצמם, נבחנים לפי ביצועים ונהנים מתמריצים קבוצתיים. כך ״פוחסים״ את הפירמידה, מבטלים יחידות מטה ומעמידים את הלקוח במרכז.`)}${def("ארגון רשתי",`<mark>Network organization</mark>: הנהלה ראשית פורסת סניפים באתרים רבים (קמעונאות, מלונות, השכרת רכב). ההנהלה מספקת מחסנים, הובלה, מחשוב ופרסום, וכל סניף הוא <b>מרכז רווח</b>. חלק מנוהלים ב<b>זכיינות</b> ${E("Franchising")}, כמו ״הולידיי אין״: מלוניות זהות שמוחכרות לזכיינים שמשלמים תמלוגים.`)}${ex(`<b>רשתי</b>: רשת בתי מלון שבה ההנהלה הראשית מספקת פרסום והזמנות, וכל מלון מנוהל כמרכז רווח עצמאי.`)}`,q:"q23"},
  {h:"רשת בין־ארגונית ווירטואלי",html:`${def("רשת בין־ארגונית",`<mark>Interorganizational network</mark>: קשרי גומלין מתמשכים בין ארגונים עצמאיים סביב משאב (הון, מידע, טכנולוגיה) או נושא, לתועלת הדדית: שיתוף פעולה, העדפה הדדית, העברת מידע ותיאום. היא לא <b>שוק</b> (סחר חופשי) ולא <b>מדרג</b> (סמכות): ״הקוטב השלישי״. לא צריכה חוזים, כל עוד אינה <b>קרטל</b> שמגביל תחרות. היא נשענת על <b>אמון</b> ו״שזורה״ (embedded) במרקם החברתי.`)}${rem(`בעסקים פועלות רשתות כאלה דרך <b>שילוב הדדי של מועצות מנהלים</b> ${E("Interlocking directories")}: אותם אנשים יושבים כדירקטורים בכמה ארגונים ומשמשים ״סיכות חיבור״.`)}${def("ארגון וירטואלי",`<mark>Virtual organization</mark>: רשת גמישה של ישויות עצמאיות מפוזרות, שחולקות ידע ומשאבים בעזרת תשתית מחשוב, בלי מגבלות זמן ומקום. מושתת על <b>יזם</b> עם רעיון, ליבה טכנית עם מעט מאוד עובדים, ומשתמשים רבים (ספקים, לקוחות) שעושים את רוב הפעולות. הגבולות המסורתיים בין הארגון לסביבה נעלמים.`)}${ex(`<b>וירטואלי</b>: חברת אופנה קטנה שיש לה רק מעצבים ואתר. הייצור במפעל בסין, המשלוחים בחברת שילוח, ושירות הלקוחות במוקד חיצוני.`)}`,q:"q25"}
 ]},
 {id:"t8",icon:"scales",title:"יתרונות וחסרונות",blocks:[
  {h:"מבנים לפי תשומות",html:`${def("על מה הנושא",`אין מבנה מושלם. הנושא משווה את היתרונות והחסרונות של כל סוג, כדי לדעת מתי לבחור בו.<br><b>מה נלמד כאן:</b> לפי תשומות · לפי תפוקות · בסיס כפול · החדשניים`)}<p>אין מבנה אחד שמתאים לכולם. שני תבחינים להשוואה: עד כמה המבנה עוזר להפיק את התוצרים <b>ביעילות</b>, ועד כמה הוא מאפשר <b>להסתגל במהירות</b> לשינויים.</p>${def("יתרון",`<b>יעילות מבנית</b> במשימות מורכבות בקנה מידה גדול ובמחזוריות גבוהה. חלוקה שיטתית מאפשרת התמחות מקצועית וצבירת ידע. חיסכון במשאבים (אין תשתיות כפולות) ותכנון כולל: <b>יתרונות הגודל הכלכליים</b>.`)}${def("חסרונות",`<b>תסמונת הניכור</b>: הזדהות־יתר עם היחידה והתנכרות לארגון, העדפת שיקולים מקצועיים (חדשנות, איכות) על מעשיים (רווחיות), ואדישות למוצר הסופי. החיכוכים בין היחידות הם <b>קונפליקט מבני</b>. ו״עקב אכילס״: <b>כושר שינוי מוגבל</b>, בגלל נהלים, התמחות מופלגת ותשתיות קבועות.`)}${rem("לכן הם עדיפים ב<b>סביבה יציבה</b> וידועה מראש, ונחותים כשצריך להגיב מהר.")}`,q:"q27"},
  {h:"מבנים לפי תפוקות",html:`${def("יתרונות",`<b>תכליתיות</b> וכושר שינוי: עובדים ומשאבים מרוכזים סביב מוצר ולקוח, רגישות לדרישות הלקוח, אחריות להצלחה ולכישלון, ומנהלים עם גישה כוללנית. העצמאות מנתקת את התלות ההדדית ומפחיתה <b>צימודים הדוקים</b> ${E("Tight couplings")}. כל חטיבה היא <b>מרכז רווח</b>, מה שמפזר סיכונים ומונע תגובת שרשרת. מתאים לאי־ודאות, תחרות וחדשנות.`)}${def("חסרונות",`<b>כפילות</b> לא יעילה של משאבים: כל חטיבה מחזיקה שיווק, חשבונאות ומשאבי אנוש משלה, ואובדים יתרונות הגודל. <b>רמה מקצועית נמוכה</b>: מעט אנשים מכל מקצוע, בלי ״מסה קריטית״. ובמבנה רב־חטיבתי ${E("Multidivisional form")}: אובדן <b>סינרגיה</b>, חטיבות שלא משתפות פעולה, מסתירות מידע ומתחרות על אותם לקוחות.`)}`,q:"q29"},
  {h:"בסיס כפול",html:`${def("יתרונות",`מלוא התועלת משני סוגי הבידול: גמישות בהקצאת כוחות, אחריות ברורה לתוצאות ושיתוף פעולה. הם מעבדים <b>מידע רב ומורכב</b> יותר מכל מבנה אחר, ולכן מתאימים לתחומים דינמיים ועתירי ידע. כושר השתנות גבוה: מקבצים ומפזרים מומחים מהר.`)}${def("חסרונות",`<b>מתח מבני</b> קבוע בין הממונים המקצועיים לממונים על הפרויקטים, מאבקים על כוח אדם, תקציב ולוחות זמנים, והתערבות מסרבלת של ההנהלה. <b>כפיפות כפולה</b>: הוראות סותרות, בעיות נאמנות, עמימות וחרדה. וגם מורכבות ועלות גבוהות. הם עובדים רק כשהתרבות, האנשים והמנהלים מתאימים.`)}${rem("בסביבה פשוטה ויציבה, מבנה כפול הוא ״תגובת־יתר״ שיוצאת בהפסד.")}`,q:"q31"},
  {h:"החדשניים וסיכום",html:`${prosTable}${def("סיכום הפרק",`המבנה הוא תוצאה של <b>בידול</b> (פישוט או התמחות) ו<b>כילול</b>. מבנים אינם טובים או גרועים כשלעצמם: המבחן הוא <b>ההתאמה</b> למאפייני הארגון ולסביבה, ב<b>יעילות</b> ${E("Efficiency")} וב<b>תכליתיות</b> ${E("Effectiveness")}, וגם בהלימה לערכים בחברה.`)}${rem("והבחירה אינה רק רציונלית: <b>עוצמה, יוקרה, הכנסה וקידום</b> משפיעים על אופן חלוקת העבודה והסמכות.")}`,q:"q33"}
 ]}
];
const Q={
q1:{t:"t1",v:[
 {q:"חברה בוחרת מבנה מטריצה רק כי ״כל החברות המובילות עושות את זה״, למרות שאין לה צורך בו. איזו תיאוריה מסבירה זאת הכי טוב?",a:"התיאוריה המוסדית",w:["הגישה המכאנית","עקרון הפישוט","הגדרת מינצברג"],e:"מבנים משקפים לפעמים מיתוסים ואופנות שהתמסדו, ולא את הפתרון היעיל."},
 {q:"מה מבדיל מבנה ארגוני ממבנה של בניין?",a:"המבנה הארגוני אינו פיסי: הוא מערך של תפקידים ויחידות",w:["המבנה הארגוני קבוע ולא משתנה לאורך השנים","המבנה הארגוני לא מכוון את התנועה של אנשים","המבנה הארגוני נקבע רק משיקולי יעילות טהורים"],e:"שניהם מכוונים תנועה, אבל הארגוני עשוי מתפקידים ויחידות."}]},
q2:{t:"t1",v:[
 {q:"מנכ״ל מחליט להקים אגף חדש בעיקר כדי לתת למקורב שלו תפקיד בכיר. מה זה ממחיש?",a:"שיקולים אישיים ופוליטיים משפיעים על עיצוב המבנה",w:["עקרון ההתמחות בהקבצת התפקידים בארגון","כילול לפי המדרג הניהולי של החברה","בידול לפי הדרישות של הסביבה העסקית"],e:"המבנה לא נקבע רק משיקולים תכליתיים."},
 {q:"מה עמדת הגישה המכאנית לגבי מבנה ארגוני?",a:"המבנה הוא אמצעי, ואין מבנה אחד שמתאים לכולם",w:["המבנה הוא מטרה בפני עצמה, ולא כלי","יש מבנה אחד מיטבי שמתאים לכל הארגונים","המבנה משקף בעיקר מיתוסים ואופנות שהתמסדו"],e:"השאר סותרים את הגישה, או מתארים את התיאוריה המוסדית."}]},
q3:{t:"t1",v:[
 {q:"בית חרושת למכוניות מחלק את העבודה ליחידות מנוע, שלדה וגוף, ומעמיד מנהל בראש כל יחידה שמדווח למנהל המפעל. מה מכל זה הוא כילול?",a:"המנהלים ושרשרת הדיווח שמחברים את היחידות",w:["החלוקה ליחידות של מנוע, שלדה וגוף","פירוק המכונית למשימות־משנה נפרדות","ההקבצה של עובדים דומים יחד באותה יחידה"],e:"בידול מפרק, כילול מחבר. המדרג הניהולי הוא עמוד השדרה של הכילול."},
 {q:"מה ההבדל בין בידול לכילול?",a:"בידול מפרק את המשימה ליחידות, כילול משלב אותן לשלם",w:["בידול משלב את היחידות, כילול מפרק אותן","בידול נוגע למנהלים, כילול נוגע לעובדים","אין הבדל מהותי, אלה שני שלבים של אותו תהליך"],e:"שני תהליכים הפוכים ומשלימים."}]},
q4:{t:"t1",v:[
 {q:"בתרשים פירמידה של ארגון, מה מבטא הממד האופקי ומה האנכי?",a:"אופקי: הבידול ליחידות. אנכי: הכילול בדרגי הניהול",w:["אופקי: הכילול בדרגים. אנכי: הבידול ליחידות","שני הממדים מבטאים את הבידול ליחידות","שני הממדים מבטאים את הכילול בדרגים"],e:"היחידות זו לצד זו, ודרגי הניהול זה מעל זה."},
 {q:"יחידה בשם ״תכנון ובקרה״ שלא מייצרת בעצמה, אלא עוזרת לעובדי הייצור. מה היא?",a:"יחידת מטה",w:["יחידת קו","יחידה לפי תפוקות","יחידת כילול עליונה"],e:"יחידות מטה תומכות בעובדי הקו."}]},
q5:{t:"t1",v:[
 {q:"בתזמורת יש כינורות, צ׳לו וכלי נשיפה, ונגנים ראשונים ושניים. מה מכל אלה הוא בידול?",a:"החלוקה לפי סוג הכלי ולפי דרגות הנגנים",w:["תפקיד המנצח בתיאום הנגנים","תפקיד הנגנים הראשיים כחוליות קישור","השינוי במבנה לפי היצירה"],e:"המנצח והנגנים הראשיים הם הכילול."},
 {q:"למה מפעל עתיר ידע מורכב יותר ממפעל מזון, לפי הפרק?",a:"כי דרגת הבידול תלויה בגודל, בתוצרים ובסביבה",w:["כי למפעל עתיר ידע יש יותר עובדים תמיד","כי מפעל מזון לא צריך כילול","כי דרגת הבידול נקבעת באופן שרירותי"],e:"התוצרים והסביבה המורכבים דורשים יותר יחידות ודרגים."}]},
q6:{t:"t1",v:[
 {q:"תהליך קבלת היתר בנייה בישראל עובר ועדות, מנהלים ותפקידי תיאום רבים. מה זה ממחיש?",a:"דרגת כילול גבוהה מגדילה את המורכבות",w:["דרגת בידול נמוכה מקטינה את המורכבות","עקרון הפישוט בהקבצת תפקידים","ארגון וירטואלי בלי גבולות"],e:"ריבוי מנהלים וועדות הופך את הארגון למורכב."},
 {q:"מה הגדרת מינצברג למבנה?",a:"האופנים שבהם מחלקים את העבודה ומבטיחים תיאום",w:["מערך של מטרות ומדדי ביצוע","מערכת של אמונות ומיתוסים שהתמסדו","רשת של ארגונים עצמאיים שחולקים משאבים"],e:"גם כאן: חלוקה (בידול) ותיאום (כילול)."}]},
q7:{t:"t2",v:[
 {q:"לפי דוגמת הסיכות של אדם סמית, מה מקור הקפיצה בתפוקה?",a:"פירוק העבודה לפעולות פשוטות שכל עובד חוזר עליהן",w:["העסקת אומנים מומחים במקום פועלים פשוטים","שיקול דעת רחב לכל עובד בכל שלב","הקמת יחידות נפרדות לפי מקצועות"],e:"10 פועלים שחילקו 18 פעולות הפיקו אלפי סיכות ביום."},
 {q:"מהו ״תפקיד״ (Job) לפי הפרק?",a:"צירוף של כמה מטלות שאדם אחד מבצע שוב ושוב",w:["יחידה ארגונית עם מנהל משלה","משימה מורכבת שדורשת הכשרה ארוכה","מחלקה שמרכזת עובדים בעלי מקצוע דומה"],e:"מטלות פשוטות שמצורפות יחד לתפקיד."}]},
q8:{t:"t2",v:[
 {q:"מפעל שפישט כל עבודה לפעולה אחת קצרה מגלה עלייה בהיעדרויות, בתאונות ובתחלופה. לפי הפרק, למה בונוסים לא יפתרו זאת?",a:"כי הבעיה היא ניכור, ושכר עידוד לא מספיק נגדו",w:["כי הבונוסים יקרים מדי עבור המפעל","כי העובדים לא מבינים את שיטת הבונוס","כי הבעיה היא מחסור במומחים ובהכשרה"],e:"לכן מחפשים חלופות שמגבירות מעורבות ואחריות."},
 {q:"איזה מהבאים אינו מקור ליעילות של עקרון הפישוט?",a:"שיקול דעת רחב לכל עובד",w:["העסקת עובדים שמוכשרים בקלות","מינימום מעברים בין סוגי פעולות","שינוע חומרים בעזרת מכונות"],e:"הפישוט מחליף שיקול דעת בנהלים שגרתיים."}]},
q9:{t:"t2",v:[
 {q:"משרד עורכי דין מחולק לצוותים של דיני משפחה, דיני עבודה ומיסוי. לפי איזה עיקרון חולקו התפקידים?",a:"עקרון ההתמחות",w:["עקרון הפישוט","עקרון הקרבה","עקרון הדמיות"],e:"פיצול לפי תחומי מקצוע, בתפקידים מורכבים."},
 {q:"למה אי אפשר לפשט את עבודת המהנדסת כמו שפישטו את ייצור הסיכות?",a:"כי היא דורשת ידע תיאורטי, הכשרה ארוכה ושיקול דעת",w:["כי מהנדסים מסרבים לבצע עבודה שגרתית","כי אין מספיק מהנדסים זמינים בשוק העבודה","כי עבודת הנדסה היא תמיד עבודה קבוצתית"],e:"משימות כאלה מתאימות לעקרון ההתמחות."}]},
q10:{t:"t2",v:[
 {q:"מה ההבדל המהותי בין תפקיד לפי פישוט לתפקיד לפי התמחות?",a:"פישוט: שגרתי ופשוט. התמחות: מורכב ודורש שיקול דעת",w:["פישוט: מורכב. התמחות: שגרתי","פישוט: לפי מקצוע. התמחות: לפי שלבי עבודה","אין הבדל, שניהם יוצרים ניכור"],e:"שני עקרונות הפוכים לחלוקת משימות."},
 {q:"חברה מקימה מחלקת ״אבטחת מידע״ שלא הייתה לפני עשור. מה זה ממחיש?",a:"חדשנות טכנולוגית יוצרת מקצועות חדשים",w:["עקרון הפישוט מוביל לניכור","שוק עבודה פנימי מבטל התמחות","התיאוריה המוסדית מסבירה מבנים"],e:"טכנולוגיה יוצרת התמחויות חדשות ובין־תחומיות."}]},
q11:{t:"t3",v:[
 {q:"נהגי אוטובוס וכרטיסנים מוקבצים יחד ביחידה אחת. איזה שיקול הקבצה זה, ומה היתרון שלו?",a:"השלמה, שמשפרת תיאום ושיתוף פעולה",w:["דמיות, שמשפרת ניהול וגמישות","קרבה, שחוסכת עלויות ניהול","חליפין, שמשפרת היכרות עם הלקוח"],e:"תפקידים שמשלימים זה את זה."},
 {q:"כל המלצרים באולם מוקבצים יחד, וכל הטבחים יחד. איזה שיקול זה, ומה היתרון?",a:"דמיות, שמאפשרת גמישות בהעברת עובדים ותקשורת טובה",w:["השלמה, שמשפרת את התיאום בין מלצרים לטבחים","קרבה, שחוסכת בעלויות ניהול","חליפין, שמתאימה ללקוחות שונים"],e:"תפקידים זהים או דומים."}]},
q12:{t:"t3",v:[
 {q:"תנובה מקבצת יחידות לפי הקיבוצים שמספקים לה. איזה שיקול זה?",a:"חליפין (לפי ספק)",w:["קרבה (לפי מקום)","השלמה","דמיות"],e:"חליפין יכול להיות לפי לקוח, קבוצת לקוחות או ספק."},
 {q:"כל עובדי משמרת הלילה, מכל התפקידים, מוקבצים יחד. איזה שיקול זה?",a:"קרבה (לפי זמן)",w:["דמיות (תפקידים דומים)","חליפין (לפי לקוח)","השלמה (תפקידים משלימים)"],e:"קרבה יכולה להיות לפי מקום או לפי זמן."}]},
q35:{t:"t3",v:[
 {q:"במפעל רהיטים יש מחלקת רכש עץ וחטיבת ריהוט משרדי שמוכרת ללקוחות. מה נכון?",a:"הרכש מאורגן לפי תשומות, החטיבה לפי תפוקות",w:["הרכש לפי תפוקות, החטיבה לפי תשומות","שתיהן לפי תשומות","שתיהן לפי תפוקות"],e:"תשומות = מה שנכנס. תפוקות = מה שיוצא."},
 {q:"מה עושים ארגונים גדולים לגבי תשומות ותפוקות?",a:"מקימים תת־יחידות לפי תשומות בתוך יחידות לפי תפוקות",w:["בוחרים רק בסוג אחד ומוותרים על השני","מקימים יחידות לפי תפוקות בתוך יחידות לפי תשומות","מבטלים את שני הסוגים לטובת ארגון וירטואלי"],e:"שילוב שני הבסיסים."}]},
q36:{t:"t3",v:[
 {q:"מה היתרון של הקבצה לפי קרבה?",a:"חיסכון בניהול ובעלויות",w:["היכרות טובה עם הלקוח","תיאום בין תפקידים משלימים","גמישות בהעברת עובדים דומים"],e:"כולם באותו מקום או באותו זמן."},
 {q:"למה בכלל מקבצים תפקידים ליחידות?",a:"כדי שאפשר יהיה לנהל ולתאם",w:["כדי להגדיל את מספר העובדים","כדי לבטל את הצורך בכילול","כדי למנוע התמחות של העובדים"],e:"כמו בצבא: כיתות, מחלקות, פלוגות."}]},
q13:{t:"t4",v:[
 {q:"בבית חולים יש מחלקות קרדיולוגיה, אורתופדיה ונוירולוגיה, וכל אחת מרכזת את המומחים בתחומה. איזו תבנית זו?",a:"מומחיות",w:["תפקודים","תהליכים","לקוחות"],e:"ארגון על בסיס מומחיות מרכז מומחים לפי מקצוע."},
 {q:"מהן שלוש התבניות לפי תשומות?",a:"תפקודים, מומחיות ותהליכים",w:["מוצרים, אזורים ולקוחות","תפקודים, מוצרים ואזורים","מומחיות, לקוחות ותהליכים"],e:"מוצרים, אזורים ולקוחות הן תבניות לפי תפוקות."}]},
q14:{t:"t4",v:[
 {q:"בשירות הדואר, יחידה אחת אוספת, שנייה ממיינת ושלישית מחלקת. איזו תבנית זו?",a:"תהליכים",w:["תפקודים","מומחיות","אזורים"],e:"כל שלב מוסיף לקודמו, בתהליך טורי."},
 {q:"חברת היי־טק מחולקת לאגפי פיתוח, שיווק, כספים ומשאבי אנוש. איזו תבנית זו?",a:"תפקודים",w:["מומחיות","תהליכים","מוצרים"],e:"יחידות לפי תת־המערכות התפקודיות."}]},
q37:{t:"t4",v:[
 {q:"למה בנקים ביטלו את התבנית לפי תהליכים?",a:"בגלל המחשוב",w:["בגלל הצורך בקרבה ללקוח","בגלל עלות גבוהה של מומחים","בגלל מעבר לתבנית לפי אזורים"],e:"המחשוב ייתר את חלוקת העבודה לשלבים."},
 {q:"מה מבדיל ארגון לפי מומחיות מארגון לפי תפקודים?",a:"מומחיות: לפי מקצועות. תפקודים: לפי תת־מערכות",w:["מומחיות: לפי שלבי עבודה. תפקודים: לפי לקוחות","מומחיות: לפי אזורים. תפקודים: לפי מוצרים","אין הבדל, אלה שני שמות לאותה תבנית"],e:"שתיהן לפי תשומות, אבל על בסיס שונה."}]},
q38:{t:"t4",v:[
 {q:"באגף השיווק של חברה יש מדורי מכירות, משלוחים, חוזים, פרסום וחקר שווקים. מה זה ממחיש?",a:"חלוקה תפקודית גם בתוך יחידה תפקודית",w:["מעבר לתבנית לפי מוצרים בתוך האגף","מבנה שתי־וערב בתוך אגף השיווק","תבנית לפי תהליכים טוריים בשיווק"],e:"גם בתוך אגף תפקודי יש חלוקה תפקודית."},
 {q:"באיזה תחום נפוצה במיוחד התבנית לפי תהליכים?",a:"טקסטיל, מזון וכימיקלים",w:["בתי חולים ואוניברסיטאות","בנקים ורשתות שיווק","מכוני מחקר וחברות ייעוץ"],e:"תעשיות עם קו ייצור טורי."}]},
q15:{t:"t5",v:[
 {q:"חברה מחולקת לחטיבת מכשירי חשמל וחטיבת רהיטים, ולכל אחת מכירות, כספים ומשאבי אנוש משלה. איזו תבנית זו?",a:"מוצרים",w:["תפקודים","אזורים","לקוחות"],e:"כל חטיבה מופקדת על מוצר וכוללת את כל הפעילויות שלו."},
 {q:"משטרת ישראל מחולקת למחוזות, וכל מחוז מספק את כל השירותים באזורו. איזו תבנית זו?",a:"אזורים",w:["מוצרים","לקוחות","תהליכים"],e:"כל יחידה משרתת אוכלוסייה באזור מוגדר."}]},
q16:{t:"t5",v:[
 {q:"אגף רווחה עם מחלקות לילדים ונוער, לקשישים ולמשפחות. איזו תבנית זו?",a:"לקוחות",w:["מוצרים","אזורים","מומחיות"],e:"יחידות שמתמחות בסוגי לקוחות."},

q39:{t:"t5",v:[

const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mgmt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
