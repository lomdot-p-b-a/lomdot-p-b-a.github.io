<!doctype html>
<html lang="he" dir="rtl">

<title>לומדת חובת קריאה: מבנים ארגוניים (ארגונים, פרק 4)</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>
</head>

const T=[
 {id:"t1",icon:"pyramid",title:"יסודות: בידול וכילול",blocks:[
  {h:"מהו מבנה ארגוני",html:`${def("מושג מפתח",`<mark>מבנה</mark> ${E("Structure")}: סדר־דברים יציב של עצמים במרחב ובזמן. בבניין, המחיצות והפתחים מכוונים את התנועה. <b>מבנה ארגוני</b> אינו פיסי: הוא מערך שיטתי ומסודר של <b>תפקידים</b> ו<b>יחידות</b>, עם תחומי סמכות ואחריות, שקובע באופן רשמי את כיווני התנועה של אנשים וחומרים ואת קשרי הגומלין ביניהם.`)}<p>המבנה נועד להקל על הפעילות, אבל הוא לא נקבע רק משיקולים תכליתיים. משפיעים גם שיקולים <b>פוליטיים, תרבותיים, חברתיים ואישיים</b>, וארגונים נוטים לבחור תבניות "אופנתיות" ומקובלות. הנטייה הזו ל<b>התמסדות</b> היא מניע חשוב בעיצוב המבנה.</p>${rem("לפי <b>הגישה המכאנית</b> המבנה הוא אמצעי ולא מטרה, ואין מבנה אחד מיטבי לכל הארגונים. לפי <b>התיאוריה המוסדית</b>, מבנים רבים משקפים אמונות, ערכים ומיתוסים שהתמסדו, ולא בהכרח את הפתרון היעיל.")}`,q:"q1"},
  {h:"בידול וכילול",html:`${def("שני תהליכים",`<mark>בידול</mark> ${E("Differentiation")}: הפרדה של משימת הארגון למשימות־משנה, ופירוקן לפעילויות שמוקבצות לתפקידים וליחידות (אגפים, חטיבות, מחלקות, מדורים). <mark>כילול</mark> ${E("Integration")}: שילוב כל המרכיבים לשלמות אחת, בעיקר באצלת סמכויות ניהול לבעלי תפקידים בראש היחידות. <b>המדרג הניהולי</b> הוא עמוד השדרה של הכילול, ולצידו תפקידי תיאום, קישור, היגוי ותזמון.`)}${fig("pyramid","הארגון כתוצאה של בידול תפקודי וכילול ניהולי (תרשים 4.1)")}${ex("בית חרושת למכוניות מחלק את המוצר למשימות־משנה: מנוע, שלדה, גוף, הילוכים, מערכת חשמל. לכל אחת יחידה, ובתוכה יחידות קטנות יותר.")}${rem("<b>יחידות מטה</b> תומכות בעובדי הקו (למשל ״ארגון ושיטות״, ״תכנון ובקרה״). <b>מינצברג</b>: המבנה הוא סכום האופנים שבהם מחלקים את העבודה למטלות נפרדות ומבטיחים את התיאום ביניהן.")}`,q:"q3"},
  {h:"מורכבות וגמישות",html:`<p><b>דרגת הבידול</b> קובעת במידה רבה את המורכבות: ככל שיש יותר יחידות ויותר דרגי ניהול, המבנה מורכב יותר (צבא: זרועות, חילות, פיקודים, אגפים). הדרגה לא שרירותית: היא נקבעת לפי הגודל, התוצרים והסביבה, ולכן מפעל עתיר ידע מורכב יותר ממפעל מזון. גם <b>דרגת הכילול</b>, עם הרבה מנהלים, תפקידי תיאום וועדות, מגדילה מורכבות (משרדי ממשלה, תהליך היתר בנייה בישראל).</p>${ex("<b>תזמורת:</b> בידול לפי סוג הכלים (מיתר, נשיפה, נקישה), לתת־קבוצות (כינורות, צ׳לו) ולדרגות (נגנים ראשונים ושניים). <b>המנצח</b> הוא הכילול, ונגנים ראשיים משמשים ראשי צוותים וחוליות קישור. והמבנה משתנה לפי היצירה.")}${rem("ארגונים משנים מבנה יותר ויותר בהתאם לסביבה, ויש הרואים ב<b>גמישות ארגונית</b> את מפתח ההישרדות. העקרונות של בידול וכילול משותפים לכל הארגונים, והביצועים תלויים בהתאמה לתנאי הסביבה.")}`,q:"q5"}
 ]},
 {id:"t2",icon:"split",title:"הקבצת מטלות לתפקידים",blocks:[
  {h:"עקרון הפישוט",html:`${def("מושג מפתח",`<mark>עקרון הפישוט</mark> ${E("Simplification")}: פירוק משימה גדולה למרכיבים פשוטים וקצרים, ש<b>אדם אחד</b> יכול לבצע שוב ושוב. צירוף כמה מטלות כאלה הוא <b>תפקיד</b> ${E("Job")}.`)}${ex("<b>אדם סמית</b> בדק ייצור סיכות: 10 פועלים לא מקצועיים שחילקו ביניהם 18 פעולות הפיקו כ־48,000 סיכות ביום, לעומת עד 20 סיכות לאומן שעושה הכול לבד.")}${tiles([["people","עובדים","במקום אומנים, עובדים שמוכשרים בקלות"],["doc","נהלים","נהלים שגרתיים במקום שיקול דעת"],["cycle","מעברים","מינימום מעברים בין סוגי פעולות"],["gear","שינוע","מכונות מעבירות את החומרים, כמו בסרט הנע"]])}${def("החיסרון: ניכור",`שעמום, שחיקה, חוסר סיפוק, אובדן תחושת היצירה, קיפוח, היעדרויות, תאונות ותחלופה גבוהה = <mark>ניכור בעבודה</mark> ${E("Work alienation")}. שכר עידוד לא מספיק לפתור זאת, ולכן מחפשים חלופות שמגבירות מעורבות ואחריות.`)}`,q:"q7"},
  {h:"עקרון ההתמחות",html:`<p>לא כל משימה אפשר לפשט. במחקר, הנדסה, רפואה, הוראה, משפט, ניהול ותכנון נדרש ידע תיאורטי, הכשרה ארוכה ושיקול דעת.</p>${def("מושג מפתח",`<mark>עקרון ההתמחות</mark> ${E("Specialization")}: פיצול משימות מורכבות למשימות־משנה לפי <b>תחומי מקצוע</b>. התפקידים מורכבים, לא שגרתיים, ודורשים מיומנות ותבונת כפיים.`)}${ex("ברפואה: אף־אוזן־גרון, עיניים, שיניים. בהנדסה: אווירונאוטיקה, מכאניקה, אלקטרוניקה. באוניברסיטה: מחלקות (פיזיקה, כימיה) וחוגים (פסיכולוגיה קלינית, חברתית).")}${rem("חדשנות טכנולוגית יוצרת <b>מקצועות חדשים</b> (הנדסת תוכנה, אבטחת איכות) והתמחויות <b>בין־תחומיות</b> (חקר המוח), וארגונים מפתחים שוקי עבודה פנימיים כדי להכשיר אנשים בעצמם.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"people",title:"הקבצת תפקידים ליחידות",blocks:[
  {h:"ארבעה שיקולים",html:`<p>תפקידים מוקבצים ל<b>יחידות־משנה</b> (בצבא: כיתות, מחלקות, פלוגות, גדודים, חטיבות, אוגדות), כדי שאפשר יהיה לנהל אותם ולתאם ביניהם.</p>${tiles([["copies","דמיות (similarity)","תפקידים זהים או דומים (מלצרים, אפסנאים): ניהול יעיל, גמישות בהעברת עובדים ותקשורת טובה"],["link","השלמה (complementariness)","תפקידים שמשלימים זה את זה (רופאים ואחיות, נהגים וכרטיסנים): תיאום ושיתוף פעולה"],["target","קרבה (proximity)","מקום אחד (סניף, שלוחה) או אותו זמן (משמרת): חיסכון בניהול ובעלויות"],["cart","חליפין (exchange)","לפי לקוח (צה״ל), קבוצת לקוחות (קיבוצים) או ספק (תנובה): היכרות עם הלקוח והתמחות בפלח שוק"]])}${def("תשומות ותפוקות",`יש יחידות שמאורגנות לפי <b>תשומות</b> (למשל רכישת חומרי גלם) ויש לפי <b>תפוקות</b> (למשל מכירה). ארגונים גדולים משלבים, ומקימים תת־יחידות לפי תשומות בתוך יחידות לפי תפוקות.`)}`,q:"q11"}
 ]},
 {id:"t4",icon:"building",title:"תבניות לפי תשומות",blocks:[
  {h:"תפקודים, מומחיות ותהליכים",html:`${fig("patterns","מפת התבניות בפרק")}${def("ארגון על בסיס תפקודים",`<mark>Functional organization</mark>: יחידות לפי תת־המערכות התפקודיות: הפקה, אחזקה, שיווק, משאבי אנוש, מחקר ופיתוח, כספים. גם בתוכן חלוקה תפקודית (אגף השיווק: מכירות, משלוחים, חוזים, פרסום, חקר שווקים).`)}${def("ארגון על בסיס מומחיות",`<mark>Professional organization</mark>: יחידות לפי מקצועות והתמחויות. כל יחידה מרכזת את המומחים בתחום. בתי חולים, מוסדות להשכלה גבוהה ומכוני מחקר (אוניברסיטה: פקולטות וחוגים).`)}${def("ארגון על בסיס תהליכים",`<mark>Process organization</mark>: יחידות לפי <b>שלבי הביצוע</b> בתהליך טורי, שבו כל שלב מוסיף לקודמו (קו הרכבה). נפוץ בטקסטיל (טוויה, אריגה, אשפרה, מתפרה), מזון וכימיקלים, וגם בשירותים כמו דואר. המחשוב גרם לבנקים לבטל תבנית זו.`)}`,q:"q13"}
 ]},
 {id:"t5",icon:"cart",title:"תבניות לפי תפוקות",blocks:[
  {h:"מוצרים, אזורים ולקוחות",html:`${def("ארגון על בסיס מוצרים",`<mark>Product organization</mark>: כל יחידה, לרוב <b>חטיבה</b>, מופקדת על מוצר או משפחת מוצרים, וכוללת את כל הפעילויות התפקודיות שלו (אחזקה, איכות, מכירות, כספים, משאבי אנוש, מו״פ). חטיבות עצמאיות־למחצה, למשל חטיבות מכשירי חשמל, כלי בית ורהיטים, ובתוכן קווי מוצר.`)}${def("ארגון על בסיס אזורים",`<mark>Regional organization</mark>: כל יחידה מספקת את <b>כל</b> המוצרים והשירותים לאוכלוסייה באזור מוגדר. בנקים, דואר, רשתות שיווק, משטרה, רשויות מקומיות (מרחבי צפון, מרכז ודרום עם מרפאות, בתי חולים וטיפות חלב). הסניפים עצמאיים במידה, כמו 9 הקמפוסים של אוניברסיטת קליפורניה עם הנהלה מרכזית.`)}${def("ארגון על בסיס לקוחות",`<mark>Client organization</mark>: יחידות שמתמחות ב<b>סוגי לקוחות</b> או בשווקים. פקידי שומה מתמחים בחברות או בעצמאים, בתי דין לפי סוג העבירה, אגף רווחה עם מחלקות ילדים ונוער, קשישים ומשפחות, שיקום. גם בתי כלא מקבצים כלואים לפי סוגים.`)}`,q:"q15"}
 ]},
 {id:"t6",icon:"copies",title:"מבנים על בסיס כפול",blocks:[
  {h:"שתי־וערב (מטריצה)",html:`${def("מושג מפתח",`<mark>ארגון על בסיס שתי־וערב</mark> ${E("Matrix organization")}: הצלבה בו־זמנית של יחידות לפי <b>תשומות</b> (יחידות מקצועיות) עם יחידות לפי <b>תפוקות</b> (מנהלות פרויקט או תוכנית, program directory). הונהג לראשונה בסוכנות החלל האמריקנית במרוץ לירח, ונפוץ בארגונים עתירי ידע (מטוסים, מחשבים, לוויינים).`)}${fig("matrix","מבנה שתי־וערב לפי מוצרים ולפי התמחויות (לפי תרשים 4.10)")}${tiles([["target","ממונה משימתי","מגדיר לעובד מה עליו לבצע בפרויקט"],["grad","ממונה מקצועי","מנחה איך לבצע: איכות, כמות ולוח זמנים"]])}${rem("המומחים ״מושאלים״ למנהלות לזמן קצוב, בהסכמת מנהלי היחידות, ובסיום עוברים לפרויקט אחר. המערכת מתנהלת ב<b>חוזי עבודה פנימיים</b> בין ראשי המנהלות (בעלי הממון) לראשי היחידות המקצועיות (בעלי הידע).")}`,q:"q17"},
  {h:"ארגון משולב",html:`${def("מושג מפתח",`<mark>ארגון על בסיס משולב</mark> ${E("Combined organization")}: בארגונים גדולים (רשתות שיווק, תאגידים רב־לאומיים, ממשל, צבא ומשטרה). <b>שלא כמו המטריצה</b>, הכפילות כאן <b>קבועה</b>: יחידות לפי תשומות משולבות באורח קבוע ביחידות לפי תפוקות.`)}${ex("בצה״ל יחידות סיוע קבועות (קשר, מודיעין, רפואה, הנדסה קרבית, אספקה) נמצאות בתוך החטיבות הלוחמות, וכפופות בו־זמנית לשתי מערכות פיקוד: הקרבית והמקצועית (החיל). כך המערך הלוחם מקבל את מיטב הסיוע בלי לגייס ולהכשיר בעצמו.")}`,q:"q19"}
 ]},
 {id:"t7",icon:"link",title:"מבנים חדשניים",blocks:[
  {h:"כלאיים ורב־שכבתי",html:`${def("ארגון־כלאיים",`<mark>ארגון־כלאיים</mark> ${E("Hybrid organization")}: הסדר בין־ארגוני שמסתייע במשאבים, מבנים ומנגנוני ניהול קיימים ויוצר מבנה חדש. המטרה: לשלב את הגמישות של ארגון קטן עם יתרונות הגודל של ארגון גדול.`)}${tiles([["link","מיזוג","Merger: שני ארגונים מתאחדים"],["cart","רכישה","Acquisition: ארגון קונה אחר ומשלב אותו"],["people","מיזם משותף","Joint venture: ארגון־בן משותף"],["copies","מאגד","Consortium: כמה ארגונים פועלים יחד בנושא מסוים, לרוב זמנית"]])}<p>תאגידים ביפן מלווים ב<b>ארגוני לוויין</b> שמספקים להם בלעדית בהסכמים קבועים, בלי בעלות ובלי מדרג. בישראל יש מגמה ל״הפרטה״ של יחידות (מחשוב, הדרכה, לוגיסטיקה) לבעלות העובדים, עם חוזה ארוך טווח.</p>${def("מבנה רב־שכבתי",`<mark>Multifaceted structure</mark>: כמה תבניות במקביל. למשל תאגיד שמפוצל לתת־ארגונים לפי קווי מוצרים, בכל אחד מבנה פונקציונלי, ומערך השיווק לפי לקוחות או אזורים: לפחות שלושה סוגי מבנים יחד.`)}`,q:"q21"},
  {h:"אופקי ורשתי",html:`${def("ארגון אופקי",`<mark>Horizontal organization</mark>: מסגרות שיתוף פעולה <b>לרוחב</b> הארגון, שמבטלות במידה רבה את האגפים והמחלקות ואת שכבות הניהול. מבוסס על מספר קטן של <b>תהליכים</b> עיקריים, ולכל תהליך <b>״בעלים״</b> (owner). אבני הבניין: <b>צוותים רב־מקצועיים</b> שמנהלים את עצמם, נבחנים לפי ביצועים ונהנים מתמריצים קבוצתיים. כך ״פוחסים״ את הפירמידה, מבטלים יחידות מטה ומעמידים את הלקוח במרכז.`)}${def("ארגון רשתי",`<mark>Network organization</mark>: הנהלה ראשית פורסת סניפים באתרים רבים (קמעונאות, מלונות, השכרת רכב). ההנהלה מספקת מחסנים, הובלה, מחשוב ופרסום, וכל סניף הוא <b>מרכז רווח</b>. חלק מנוהלים ב<b>זכיינות</b> ${E("Franchising")}, כמו ״הולידיי אין״: מלוניות זהות שמוחכרות לזכיינים שמשלמים תמלוגים.`)}`,q:"q23"},
  {h:"רשת בין־ארגונית ווירטואלי",html:`${def("רשת בין־ארגונית",`<mark>Interorganizational network</mark>: קשרי גומלין מתמשכים בין ארגונים עצמאיים סביב משאב (הון, מידע, טכנולוגיה) או נושא, לתועלת הדדית: שיתוף פעולה, העדפה הדדית, העברת מידע ותיאום. היא לא <b>שוק</b> (סחר חופשי) ולא <b>מדרג</b> (סמכות): ״הקוטב השלישי״. לא צריכה חוזים, כל עוד אינה <b>קרטל</b> שמגביל תחרות. היא נשענת על <b>אמון</b> ו״שזורה״ (embedded) במרקם החברתי.`)}${rem(`בעסקים פועלות רשתות כאלה דרך <b>שילוב הדדי של מועצות מנהלים</b> ${E("Interlocking directories")}: אותם אנשים יושבים כדירקטורים בכמה ארגונים ומשמשים ״סיכות חיבור״.`)}${def("ארגון וירטואלי",`<mark>Virtual organization</mark>: רשת גמישה של ישויות עצמאיות מפוזרות, שחולקות ידע ומשאבים בעזרת תשתית מחשוב, בלי מגבלות זמן ומקום. מושתת על <b>יזם</b> עם רעיון, ליבה טכנית עם מעט מאוד עובדים, ומשתמשים רבים (ספקים, לקוחות) שעושים את רוב הפעולות. הגבולות המסורתיים בין הארגון לסביבה נעלמים.`)}`,q:"q25"}
 ]},
 {id:"t8",icon:"scales",title:"יתרונות וחסרונות",blocks:[
  {h:"מבנים לפי תשומות",html:`<p>אין מבנה אחד שמתאים לכולם. שני תבחינים להשוואה: עד כמה המבנה עוזר להפיק את התוצרים <b>ביעילות</b>, ועד כמה הוא מאפשר <b>להסתגל במהירות</b> לשינויים.</p>${def("יתרון",`<b>יעילות מבנית</b> במשימות מורכבות בקנה מידה גדול ובמחזוריות גבוהה. חלוקה שיטתית מאפשרת התמחות מקצועית וצבירת ידע. חיסכון במשאבים (אין תשתיות כפולות) ותכנון כולל: <b>יתרונות הגודל הכלכליים</b>.`)}${def("חסרונות",`<b>תסמונת הניכור</b>: הזדהות־יתר עם היחידה והתנכרות לארגון, העדפת שיקולים מקצועיים (חדשנות, איכות) על מעשיים (רווחיות), ואדישות למוצר הסופי. החיכוכים בין היחידות הם <b>קונפליקט מבני</b>. ו״עקב אכילס״: <b>כושר שינוי מוגבל</b>, בגלל נהלים, התמחות מופלגת ותשתיות קבועות.`)}${rem("לכן הם עדיפים ב<b>סביבה יציבה</b> וידועה מראש, ונחותים כשצריך להגיב מהר.")}`,q:"q27"},
  {h:"מבנים לפי תפוקות",html:`${def("יתרונות",`<b>תכליתיות</b> וכושר שינוי: עובדים ומשאבים מרוכזים סביב מוצר ולקוח, רגישות לדרישות הלקוח, אחריות להצלחה ולכישלון, ומנהלים עם גישה כוללנית. העצמאות מנתקת את התלות ההדדית ומפחיתה <b>צימודים הדוקים</b> ${E("Tight couplings")}. כל חטיבה היא <b>מרכז רווח</b>, מה שמפזר סיכונים ומונע תגובת שרשרת. מתאים לאי־ודאות, תחרות וחדשנות.`)}${def("חסרונות",`<b>כפילות</b> לא יעילה של משאבים: כל חטיבה מחזיקה שיווק, חשבונאות ומשאבי אנוש משלה, ואובדים יתרונות הגודל. <b>רמה מקצועית נמוכה</b>: מעט אנשים מכל מקצוע, בלי ״מסה קריטית״. ובמבנה רב־חטיבתי ${E("Multidivisional form")}: אובדן <b>סינרגיה</b>, חטיבות שלא משתפות פעולה, מסתירות מידע ומתחרות על אותם לקוחות.`)}`,q:"q29"},
  {h:"בסיס כפול",html:`${def("יתרונות",`מלוא התועלת משני סוגי הבידול: גמישות בהקצאת כוחות, אחריות ברורה לתוצאות ושיתוף פעולה. הם מעבדים <b>מידע רב ומורכב</b> יותר מכל מבנה אחר, ולכן מתאימים לתחומים דינמיים ועתירי ידע. כושר השתנות גבוה: מקבצים ומפזרים מומחים מהר.`)}${def("חסרונות",`<b>מתח מבני</b> קבוע בין הממונים המקצועיים לממונים על הפרויקטים, מאבקים על כוח אדם, תקציב ולוחות זמנים, והתערבות מסרבלת של ההנהלה. <b>כפיפות כפולה</b>: הוראות סותרות, בעיות נאמנות, עמימות וחרדה. וגם מורכבות ועלות גבוהות. הם עובדים רק כשהתרבות, האנשים והמנהלים מתאימים.`)}${rem("בסביבה פשוטה ויציבה, מבנה כפול הוא ״תגובת־יתר״ שיוצאת בהפסד.")}`,q:"q31"},
  {h:"החדשניים וסיכום",html:`${prosTable}${def("סיכום הפרק",`המבנה הוא תוצאה של <b>בידול</b> (פישוט או התמחות) ו<b>כילול</b>. מבנים אינם טובים או גרועים כשלעצמם: המבחן הוא <b>ההתאמה</b> למאפייני הארגון ולסביבה, ב<b>יעילות</b> ${E("Efficiency")} וב<b>תכליתיות</b> ${E("Effectiveness")}, וגם בהלימה לערכים בחברה.`)}${rem("והבחירה אינה רק רציונלית: <b>עוצמה, יוקרה, הכנסה וקידום</b> משפיעים על אופן חלוקת העבודה והסמכות.")}`,q:"q33"}
 ]}
];
const Q={
q1:{t:"t1",v:[
 {q:"מהו מבנה ארגוני לפי הפרק?",a:"מערך שיטתי של תפקידים ויחידות עם תחומי סמכות ואחריות, שקובע קשרי גומלין",w:["הבניין שבו הארגון פועל","רשימת העובדים בארגון","התקציב השנתי"],e:"המבנה הארגוני אינו פיסי, אבל גם הוא מכוון תנועה ופעולה."},
 {q:"לפי התיאוריה המוסדית, מה משקפים מבנים ארגוניים רבים?",a:"אמונות, ערכים ומיתוסים שהתמסדו, ולא בהכרח את הפתרון היעיל",w:["רק את הצרכים התפקודיים","את רצון העובדים","את גודל הבניין"],e:"לפי הגישה המכאנית, המבנה הוא אמצעי להשגת מטרות."}]},
q2:{t:"t1",v:[

 {q:"מה עמדת הגישה המכאנית לגבי מבנה מיטבי?",a:"אין מבנה אחד מיטבי שמתאים לכל הארגונים",w:["יש מבנה אחד נכון לכולם","המבנה הוא מטרה בפני עצמה","המבנה לא חשוב"],e:"המבנה הוא אמצעי, ולכן הוא תלוי בנסיבות."}]},
q3:{t:"t1",v:[
 {q:"מהו בידול?",a:"פירוק משימת הארגון למשימות־משנה והקבצתן לתפקידים ויחידות",w:["שילוב כל היחידות לשלמות אחת","קביעת שכר העובדים","סגירת יחידות"],e:"כילול הוא התהליך המשלים: שילוב לשלמות."},
 {q:"מהו עמוד השדרה של הכילול?",a:"המדרג הניהולי",w:["יחידת הייצור","מחלקת השיווק","הלקוחות"],e:"לצידו תפקידי תיאום, קישור, היגוי ותזמון."}]},
q4:{t:"t1",v:[
 {q:"בתרשים הפירמידה, מה מבטא הממד האנכי?",a:"את ממד הכילול: דרגי הניהול מהעובדים ועד המנהל הכללי",w:["את ממד הבידול","את מספר המוצרים","את גודל השוק"],e:"הממד האופקי הוא ממד הבידול: ייצור, אחזקה, שיווק, סיוע."},
 {q:"מה תפקידן של יחידות מטה?",a:"לתמוך בעובדי הקו, למשל ״ארגון ושיטות״ או ״תכנון ובקרה״",w:["לייצר את המוצר","למכור ללקוחות","לנהל את הארגון כולו"],e:"הן מסייעות בביצוע מטלות התכנון, התיאום והתזמון."}]},
q5:{t:"t1",v:[
 {q:"בדוגמת התזמורת, מי מבצע את הכילול?",a:"המנצח, בעזרת המנהל המוסיקלי והנגנים הראשיים",w:["כל נגן בעצמו","הקהל","המלחין"],e:"הבידול הוא החלוקה לפי כלים, תת־קבוצות ודרגות."},
 {q:"מה קובע את דרגת הבידול של ארגון?",a:"גודלו, תוצריו והסביבה שבה הוא פועל",w:["רצון המנכ״ל בלבד","מקרה","מספר הקומות בבניין"],e:"לכן מפעל עתיר ידע מורכב יותר ממפעל מזון."}]},
q6:{t:"t1",v:[
 {q:"איך מגדיר מינצברג מבנה ארגוני?",a:"סכום האופנים שבהם מחלקים את העבודה למטלות ומבטיחים תיאום ביניהן",w:["רשימת הנהלים","מספר המנהלים","היחס בין הכנסות להוצאות"],e:"שוב: בידול וכילול."},
 {q:"מה הקשר בין דרגת הכילול למורכבות?",a:"ריבוי מנהלים, דרגים, תפקידי תיאום וועדות הופך את הארגון למורכב יותר",w:["כילול מפשט תמיד את הארגון","אין קשר","כילול קיים רק בארגונים קטנים"],e:"דוגמה: תהליך אישור היתר בנייה בישראל."}]},
q7:{t:"t2",v:[
 {q:"מה מראה הדוגמה של אדם סמית על ייצור סיכות?",a:"שפירוק לפעולות פשוטות בין עובדים מגדיל מאוד את התפוקה",w:["שאומן אחד מייצר יותר מעשרה פועלים","שאין טעם בחלוקת עבודה","שמכונות לא נחוצות"],e:"כ־48,000 סיכות ביום לעשרה פועלים, מול עד 20 לאומן."},
 {q:"מהו תפקיד (job) לפי הפרק?",a:"צירוף של כמה מטלות קשורות שמבוצעות שוב ושוב בידי אדם אחד",w:["כל העבודה בארגון","יחידה של כמה עובדים","מקצוע אקדמי"],e:"כך פועל עקרון הפישוט."}]},
q8:{t:"t2",v:[

 {q:"מה מהבאים אינו מקור ליעילות של עקרון הפישוט?",a:"שיקול דעת רחב לכל עובד",w:["עובדים שמוכשרים בקלות","נהלים שגרתיים","שינוע במכונות"],e:"הפישוט מחליף שיקול דעת בנהלים שגרתיים."}]},
q9:{t:"t2",v:[
 {q:"מתי מתאים עקרון ההתמחות במקום עקרון הפישוט?",a:"במשימות מורכבות שדורשות ידע תיאורטי, הכשרה ארוכה ושיקול דעת",w:["בקו הרכבה פשוט","בכל משימה שגרתית","כשרוצים עובדים זולים"],e:"כמו ברפואה, הנדסה ומשפט."},
 {q:"בית חולים מחולק למחלקות אף־אוזן־גרון, עיניים ושיניים. לפי איזה עיקרון?",a:"עקרון ההתמחות",w:["עקרון הפישוט","עקרון הקרבה","עקרון החליפין"],e:"פיצול לפי תחומי מקצוע."}]},
q10:{t:"t2",v:[
 {q:"איך שונים תפקידים לפי עקרון ההתמחות מתפקידים לפי עקרון הפישוט?",a:"הם מורכבים, לא שגרתיים ודורשים שיקול דעת",w:["הם פשוטים וחוזרים","הם לא דורשים הכשרה","אין הבדל"],e:"עובדים מקצועיים שהוכשרו מחוץ לארגון."},
 {q:"מה יוצרת חדשנות טכנולוגית מבחינת התמחויות?",a:"מקצועות חדשים והתמחויות בין־תחומיות",w:["ביטול כל ההתמחויות","חזרה לאומנות","פחות צורך בידע"],e:"למשל הנדסת תוכנה וחקר המוח."}]},
q11:{t:"t3",v:[
 {q:"מלצרים, אפסנאים ומפעילי מכונות מוקבצים כל קבוצה ביחידה משלה. איזה שיקול זה?",a:"דמיות",w:["השלמה","קרבה","חליפין"],e:"תפקידים דומים: ניהול יעיל, גמישות ותקשורת."},
 {q:"רופאים ואחיות באותה מחלקה. איזה שיקול הקבצה זה?",a:"השלמה",w:["דמיות","קרבה","חליפין"],e:"תפקידים שמשלימים זה את זה: תיאום ושיתוף פעולה."}]},
q12:{t:"t3",v:[
 {q:"יחידה שמרכזת את כל התפקידים שמשרתים לקוח אחד, כמו צה״ל. איזה שיקול זה?",a:"חליפין",w:["דמיות","השלמה","קרבה"],e:"היכרות קרובה עם הלקוח וצרכיו."},
 {q:"סניף שמרכז את כל בעלי התפקידים באזור אחד. איזה שיקול זה?",a:"קרבה",w:["השלמה","חליפין","דמיות"],e:"חיסכון בניהול ובעלויות העברה. גם משמרות הן קרבה בזמן."}]},
q13:{t:"t4",v:[
 {q:"מהן שלוש התבניות לפי תשומות?",a:"תפקודים, מומחיות ותהליכים",w:["מוצרים, אזורים ולקוחות","מטריצה ומשולב","כלאיים, אופקי ורשתי"],e:"מוצרים, אזורים ולקוחות הן תבניות לפי תפוקות."},
 {q:"אוניברסיטה מחולקת לפקולטות וחוגים. איזו תבנית זו?",a:"ארגון על בסיס מומחיות",w:["ארגון על בסיס תהליכים","ארגון על בסיס לקוחות","ארגון על בסיס אזורים"],e:"כל יחידה מרכזת מומחים בתחום מקצועי."}]},
q14:{t:"t4",v:[
 {q:"מפעל טקסטיל מחולק לטוויה, אריגה, אשפרה ומתפרה. איזו תבנית זו?",a:"ארגון על בסיס תהליכים",w:["ארגון על בסיס תפקודים","ארגון על בסיס מוצרים","ארגון על בסיס מומחיות"],e:"יחידות לפי שלבי הביצוע בתהליך טורי."},
 {q:"חברה מחולקת לאגפי ייצור, שיווק, כספים, משאבי אנוש ומו״פ. איזו תבנית זו?",a:"ארגון על בסיס תפקודים",w:["ארגון על בסיס מוצרים","ארגון על בסיס תהליכים","ארגון על בסיס לקוחות"],e:"לפי תת־המערכות התפקודיות."}]},
q15:{t:"t5",v:[
 {q:"מה מאפיין ארגון על בסיס מוצרים?",a:"כל חטיבה מופקדת על מוצר וכוללת את כל הפעילויות התפקודיות שלו",w:["כל יחידה מבצעת שלב אחד בתהליך","היחידות לפי מקצועות","אין חטיבות"],e:"החטיבות עצמאיות־למחצה."},
 {q:"בנק עם סניפים, כשכל סניף מספק את כל השירותים לתושבי האזור. איזו תבנית זו?",a:"ארגון על בסיס אזורים",w:["ארגון על בסיס תהליכים","ארגון על בסיס מומחיות","ארגון על בסיס מוצרים"],e:"כמו דואר, משטרה ורשתות שיווק."}]},
q16:{t:"t5",v:[
 {q:"פקידי שומה שמתמחים בחברות או בעצמאים. איזו תבנית זו?",a:"ארגון על בסיס לקוחות",w:["ארגון על בסיס אזורים","ארגון על בסיס תפקודים","ארגון על בסיס תהליכים"],e:"יחידות לפי סוגי לקוחות."},
 {q:"מהן שלוש התבניות לפי תפוקות?",a:"מוצרים, אזורים ולקוחות",w:["תפקודים, מומחיות ותהליכים","מטריצה, משולב ורשתי","פישוט, התמחות ודמיות"],e:"הן מכוונות לתוצרים או לשווקים."}]},
q17:{t:"t6",v:[
 {q:"מהו ארגון על בסיס שתי־וערב?",a:"הצלבה בו־זמנית של יחידות לפי תשומות עם יחידות לפי תפוקות",w:["ארגון לפי אזורים בלבד","ארגון ללא מנהלים","שילוב קבוע של יחידות סיוע ביחידות ביצוע"],e:"השילוב הקבוע הוא הארגון המשולב."},
 {q:"מי הנהיג לראשונה את מבנה שתי־וערב?",a:"סוכנות החלל האמריקנית, בתקופת המרוץ לירח",w:["צה״ל","תנובה","אדם סמית"],e:"מאז הוא נפוץ בארגונים עתירי ידע."}]},
q18:{t:"t6",v:[
 {q:"במבנה שתי־וערב, למי כפוף כל עובד בפרויקט?",a:"לממונה משימתי ולממונה מקצועי",w:["רק למנכ״ל","לממונה אחד בלבד","ללקוח"],e:"המשימתי קובע מה לבצע, המקצועי איך."},
 {q:"איך מתנהל הקשר בין מנהלות הפרויקטים ליחידות המקצועיות?",a:"בחוזי עבודה פנימיים בין בעלי הממון לבעלי הידע",w:["בפקודות של המנכ״ל","בלי שום הסדר","בתחרות חופשית בשוק"],e:"החוזים מפרטים מפרטים טכניים, לוחות זמנים ועלויות."}]},
q19:{t:"t6",v:[
 {q:"מה מבדיל ארגון משולב ממבנה שתי־וערב?",a:"בארגון המשולב הכפילות קבועה ולא זמנית",w:["אין בו יחידות מקצועיות","הוא מתאים רק לארגונים קטנים","אין בו כפיפות כפולה"],e:"יחידות לפי תשומות משולבות באורח קבוע ביחידות לפי תפוקות."},
 {q:"יחידות קשר, רפואה ומודיעין קבועות בתוך חטיבה לוחמת, וכפופות גם לחיל המקצועי. איזה מבנה זה?",a:"ארגון על בסיס משולב",w:["ארגון רשתי","ארגון וירטואלי","ארגון על בסיס תהליכים"],e:"כך הלוחמים מקבלים סיוע בלי לגייס ולהכשיר בעצמם."}]},
q20:{t:"t6",v:[
 {q:"מהן ״מנהלות פרויקט״ במבנה שתי־וערב?",a:"יחידות שכל אחת מופקדת על הפקת מוצר מסוים ומעסיקה זמנית מומחים מהיחידות המקצועיות",w:["יחידות קבועות של מומחים","מחלקות כספים","סניפים אזוריים"],e:"בסיום הפרויקט המומחים עוברים לפרויקט אחר."},
 {q:"באילו ארגונים נפוץ מבנה שתי־וערב?",a:"בארגונים עתירי ידע שמפתחים מוצרים מורכבים",w:["במכולות שכונתיות","בארגונים פשוטים ויציבים","במשפחות"],e:"מטוסים, מחשבים, טילים, לוויינים."}]},
q21:{t:"t7",v:[
 {q:"מה המטרה של ארגון־כלאיים?",a:"לשלב את הגמישות של ארגון קטן עם יתרונות הגודל של ארגון גדול",w:["לבטל את כל המנהלים","לעבוד רק באינטרנט","לייצר מוצר אחד"],e:"זה הסדר בין־ארגוני שמסתייע במשאבים קיימים."},
 {q:"כמה ארגונים מתחברים יחד לפעול בנושא מסוים, לרוב זמנית. מה זה?",a:"מאגד (consortium)",w:["מיזוג","רכישה","ארגון רשתי"],e:"נפוץ בתאגידי היי־טק וביצרני מטוסים."}]},
q22:{t:"t7",v:[
 {q:"מהו מבנה רב־שכבתי?",a:"כמה תבניות ארגוניות שמתקיימות יחד באותו ארגון",w:["מבנה עם הרבה קומות","מבנה של צבא בלבד","ארגון בלי יחידות"],e:"למשל קווי מוצר, בתוכם מבנה פונקציונלי, ושיווק לפי אזורים."},
 {q:"מהו מיזם משותף (joint venture)?",a:"שני ארגונים או יותר מקימים יחד ארגון־בן",w:["ארגון אחד קונה אחר","שני ארגונים מתאחדים לגמרי","ארגון מפטר עובדים"],e:"זה אחד מטיפוסי ארגון־הכלאיים."}]},
q23:{t:"t7",v:[
 {q:"מה אבני הבניין של ארגון אופקי?",a:"צוותים רב־מקצועיים שמנהלים את עצמם סביב תהליכים",w:["אגפים ומחלקות","סניפים אזוריים","זכיינים"],e:"לכל תהליך יש ״בעלים״ (owner)."},
 {q:"מה עושה הארגון האופקי לפירמידה הארגונית?",a:"״פוחס״ אותה: פחות דרגי ניהול ויחידות מטה",w:["מגביה אותה","מכפיל אותה","לא משנה אותה"],e:"כך מתקצר המרחק בין ההנהלה לקו הביצוע."}]},
q24:{t:"t7",v:[
 {q:"רשת מלונות שבה כל מלונית מוחכרת לזכיין שמשלם תמלוגים. איזה מבנה זה?",a:"ארגון רשתי בשיטת זכיינות",w:["ארגון אופקי","מבנה שתי־וערב","ארגון על בסיס תהליכים"],e:"כמו ״הולידיי אין״."},
 {q:"בארגון רשתי, מה מעמדו של כל סניף?",a:"מרכז רווח שפועל לפי מדיניות ההנהלה הראשית",w:["יחידה בלי אחריות כספית","ארגון עצמאי לגמרי","מחלקת מטה"],e:"ההנהלה מספקת מחסנים, הובלה, מחשוב ופרסום."}]},
q25:{t:"t7",v:[
 {q:"למה רשת בין־ארגונית נקראת ״הקוטב השלישי״?",a:"כי היא לא שוק (סחר חופשי) ולא מדרג (סמכות)",w:["כי יש בה שלושה ארגונים","כי היא בקוטב הצפוני","כי היא שלישית בגודלה"],e:"היא נשענת על יחסים מתמשכים ואמון."},
 {q:"מהו ״שילוב הדדי של מועצות מנהלים״?",a:"אותם אנשים מכהנים כדירקטורים בכמה ארגונים ומשמשים ״סיכות חיבור״",w:["מיזוג בין חברות","מכירת מניות","מינוי מנכ״ל משותף"],e:"כך פועלות רשתות בין־ארגוניות במגזר העסקי."}]},
q26:{t:"t7",v:[
 {q:"מה מאפיין ארגון וירטואלי?",a:"רשת גמישה של ישויות מפוזרות, עם ליבה קטנה, שפועלת בעזרת מחשוב",w:["בניין גדול עם הרבה עובדים","מדרג ניהולי עמוק","מפעל ייצור"],e:"הגבולות בין הארגון לסביבה נעלמים."},
 {q:"מתי רשת בין־ארגונית אסורה?",a:"כשהיא קרטל שמגביל את התחרות בניגוד לחוק",w:["תמיד","אף פעם","כשאין לה חוזים"],e:"רשתות לא צריכות חוזים רשמיים, כל עוד אינן קרטל."}]},
q27:{t:"t8",v:[
 {q:"מהו היתרון הבולט של מבנים לפי תשומות?",a:"יעילות, התמחות מקצועית ויתרונות הגודל",w:["כושר שינוי מהיר","קרבה ללקוח","פיזור סיכונים"],e:"אלה יתרונות של מבנים לפי תפוקות."},
 {q:"מה היא ״תסמונת הניכור״ במבנים לפי תשומות?",a:"הזדהות־יתר עם היחידה, העדפת שיקולים מקצועיים ואדישות למוצר הסופי",w:["עזיבת עובדים לחברה אחרת","שכר נמוך","עודף מנהלים"],e:"היא מתבטאת בפגמים, באיחורים ובתיאום לקוי."}]},
q28:{t:"t8",v:[
 {q:"מהו ״עקב אכילס״ של מבנים לפי תשומות?",a:"כושר שינוי מוגבל",w:["עלות גבוהה של כפילויות","רמה מקצועית נמוכה","חוסר אמון של לקוחות"],e:"לכן הם עדיפים בסביבה יציבה."},
 {q:"חברת ״מטריקס״ קטנה וצומחת, מפתחת משחקי קופסה, הפיתוח דורש התמחות, ויש מעט מתחרים. לפי הפרק, איזה מבנה מתאים?",a:"מבנה פונקציונלי",w:["מבנה חטיבתי לפי לקוח","מבנה כלאיים","מבנה מטריציוני"],e:"זו שאלה מהמבחן לדוגמה. חברה קטנה עם מוצר אחד בסביבה יציבה: תשומות (תפקודים) נותנות יעילות והתמחות."}]},
q29:{t:"t8",v:[
 {q:"מהו החיסרון העיקרי של מבנים לפי תפוקות?",a:"כפילות לא יעילה של משאבים",w:["כושר שינוי מוגבל","תסמונת הניכור","מתח מבני בין שני ממונים"],e:"כל חטיבה מחזיקה שיווק, חשבונאות ומשאבי אנוש משלה."},
 {q:"למה במבנה לפי תפוקות קשה לשמור על רמה מקצועית גבוהה?",a:"כי בכל חטיבה יש מעט אנשים מכל מקצוע, בלי ״מסה קריטית״",w:["כי אין שם עובדים","כי אין מנהלים","כי הם לא מקבלים שכר"],e:"לכן קשה להם להתחרות באיכות עם מבנים לפי תשומות."}]},
q30:{t:"t8",v:[
 {q:"מה מאפשרת העצמאות של חטיבות במבנה לפי תפוקות?",a:"מרכזי רווח נפרדים ופיזור סיכונים",w:["שיתוף פעולה מלא בין חטיבות","חיסכון במשאבים","התמחות עמוקה"],e:"כשחטיבה אחת נכשלת, אין תגובת שרשרת."},
 {q:"מה הבעיה של מבנה רב־חטיבתי מבחינת שיתוף פעולה?",a:"אובדן סינרגיה: חטיבות מסתירות מידע ואף מתחרות על אותם לקוחות",w:["החטיבות תמיד משתפות","אין בעיה","החטיבות מתמזגות"],e:"כל חטיבה רוצה לזקוף לזכותה את ההישגים."}]},
q31:{t:"t8",v:[
 {q:"מה היתרון של מבנים על בסיס כפול בעיבוד מידע?",a:"הם מסוגלים לקלוט ולעבד מידע רב ומורכב יותר מכל מבנה אחר",w:["הם לא צריכים מידע","הם מעבדים מעט מידע","אין להם יתרון"],e:"לכן הם מתאימים לתחומים דינמיים ועתירי ידע."},
 {q:"מהם החסרונות של מבנה על בסיס כפול?",a:"מתח מבני בין הממונים, כפיפות כפולה ומורכבות גבוהה",w:["כושר שינוי מוגבל","אין התמחות","מעט מידע"],e:"הכפיפות הכפולה יוצרת הוראות סותרות, עמימות וחרדה."}]},
q32:{t:"t8",v:[
 {q:"מתי מבנה כפול הוא ״תגובת־יתר״?",a:"בסביבה פשוטה ויציבה",w:["בסביבה דינמית","בארגון עתיר ידע","בתאגיד רב־לאומי"],e:"המורכבות שלו מוצדקת רק כשהסביבה מורכבת."},
 {q:"איך מבנה על בסיס כפול מתמודד עם שינויים?",a:"מקבץ ומפזר מומחים במהירות ומקים מנהלות מיוחדות לפרויקטים",w:["הוא לא משתנה","הוא סוגר יחידות","הוא מעביר הכול לזכיינים"],e:"העובדים רגילים לעבור מנושא לנושא ולקבל ממונים מתחלפים."}]},
q33:{t:"t8",v:[
 {q:"לפי סיכום הפרק, מה המבחן של מבנה ארגוני?",a:"ההתאמה למאפייני הארגון ולסביבה, ביעילות ובתכליתיות",w:["כמה הוא חדשני","כמה הוא זול","כמה מנהלים יש בו"],e:"מבנים אינם טובים או גרועים כשלעצמם."},
 {q:"מה החיסרון העיקרי של ארגון וירטואלי?",a:"חוסר אמון של לקוחות ב״רכישה עיוורת״ מארגון עלום",w:["עודף עובדים","מדרג ניהולי כבד","עלות בניינים"],e:"היתרון: מעט עובדים ומנהלים וחיסכון."}]},
q34:{t:"t8",v:[
 {q:"מהי נקודת התורפה של רשתות בין־ארגוניות?",a:"האמון ההדדי, ורגישות לחוליה החלשה",w:["עודף חוזים","מדרג ניהולי","חוסר במידע"],e:"שותף עלול לנצל את מה שצבר ולהתחרות בבני בריתו."},
 {q:"מה מסכן ארגון רשתי שפועל בזכיינות?",a:"נטייה אופורטוניסטית של זכיינים ומנהלים רחוקים להיטיב עם עצמם",w:["חוסר גמישות","עודף ריכוזיות","אי־יכולת להתאים למקום"],e:"ההנהלה המרכזית רחוקה ותרומתה פחות מורגשת."}]}
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mgmt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  if(blk.q)slot.appendChild(qCard(blk.q,next,"בדיקה קצרה"));
  else{const b=document.createElement("button");b.className="primary";b.textContent="המשך";b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
