<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: התופעה הארגונית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>
</head>

<script>

const I={

};
const ic=(k,cls="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${I[k]}</svg>`;

const arrowDef=id=>`<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-c"/></marker></defs>`;

const FIG={
 society:()=>{const n=[["בית ספר",88,46],["צבא",200,26],["בנק",312,46],["קופת חולים",332,148],["מקום עבודה",200,206],["רשות המסים",68,148]];
  return `<svg viewBox="0 0 400 228" role="img" aria-label="אדם במרכז, מחובר לשישה ארגונים">${n.map(([t,x,y])=>`<line x1="200" y1="118" x2="${x}" y2="${y}" class="s-line" stroke-dasharray="4 4"/>`).join("")}
  <circle cx="200" cy="118" r="44" class="f-soft"/><circle cx="200" cy="118" r="32" class="f-c"/>

const T=[
 {id:"t1",icon:"building",title:"ארגונים בחברה המודרנית",blocks:[
  {h:"ארגונים הם לא המצאה חדשה",html:`${def("על מה הפרק",`הפרק שואל שאלה פשוטה: <b>מה זה ארגון, ולמה יש כל כך הרבה ממנו בחיים שלנו?</b> חשבו על יום רגיל: התעוררתם לחשמל של חברת החשמל, נסעתם באוטובוס של חברת תחבורה, למדתם במכללה וקניתם בסופר. כל אלה ארגונים. הפרק מסביר מה משותף לכולם ואיך הם בנויים.`)}<p>כבר בתרבויות העתיקות, במצרים, ביוון, ברומא ובסין, פעלו ארגונים ממלכתיים: גבו מסים, אכפו חוקים, ניהלו מלחמות ובנו בהיקף ענק, כמו הפירמידות. מאוחר יותר צמחו חברות סחר, פרלמנטים, אוניברסיטאות ומפלגות.</p>${fig("timeline")}<p>אבל בחברה המודרנית יש ארגונים <mark>בהיקף שלא היה כמותו</mark>. ריבוי הארגונים הוא אחד המאפיינים הבולטים שלה.</p>${rem("הארגון הוותיק שהפרק מזכיר: הכנסייה הקתולית, שפועלת ברחבי העולם יותר מאלף שנה.")}`,q:"q2"},
  {h:"החברה הארגונית",html:`<p>ארבעה גורמים הובילו להתפשטות הארגונים:</p>${tiles([["building","עיור","אנשים עברו לערים גדולות"],["grad","השכלה","גידול עצום ביודעי קרוא וכתוב"],["gear","מדע וטכנולוגיה","המהפכה המדעית"],["pie","כלכלת כסף","מסחר במקום ייצור עצמי"]])}<p>היום כמעט כל הייצור, החינוך, הבריאות והפוליטיקה מתנהלים בתוך ארגונים, וכל אחד מאיתנו מחובר לכמה ארגונים במקביל.</p>${fig("society","אדם אחד, הרבה ארגונים בו-זמנית")}${def("מושג מפתח","<mark>חברה ארגונית</mark>: חברה שבה רוב הפעילות הכלכלית, החברתית והפוליטית מתבצעת בתוך ארגונים.")}${ex("פעם אדם גידל את האוכל שלו, ריפא בעזרת סבתא ולמד בבית. היום האוכל מגיע מחברות מזון, הטיפול מקופת חולים והלימודים ממוסד חינוכי. זו חברה ארגונית.")}`,q:"q1"},
  {h:"שני הפנים של ארגונים",html:`<div class="tiles"><div class="tile" style="--c:var(--good)">${ic("check")}<b>התועלת</b><span>בלי ארגונים אין סופרמרקט, בית חולים, בית ספר, חשמל או תחבורה.</span></div><div class="tile" style="--c:var(--bad)">${ic("x")}<b>הביקורת</b><span>ניכור, עריצות וביורוקרטיה. ארגונים הופכים לשליטים לא-אנושיים.</span></div></div>${def("דימוי מהפרק","<mark>הגולם קם על יוצרו</mark>: הארגונים שבני אדם יצרו כדי לשרת אותם, קובעים את גורלם ואת איכות חייהם.")}${rem("הפרק משווה למדע ולטכנולוגיה: גם הם משפרים את רמת החיים, ובמקביל מואשמים בזיהום ובאבטלה.")}`,q:"q3"}
 ]},
 {id:"t2",icon:"people",title:"מה הם ארגונים",blocks:[
  {h:"איך מגדירים ארגון?",html:`<p><b>פתיח:</b> כולנו מזהים ארגון כשאנחנו רואים אותו (בנק, צבא, בית חולים), אבל קשה להגדיר בדיוק מה הופך קבוצת אנשים לארגון. למשל, למה בית חולים הוא ארגון ומשפחה לא? בנושא הזה נראה כמה הגדרות, ומה מייחד ארגונים.</p><p>אין הגדרה אחת מוסכמת. שתי הגדרות קלאסיות:</p>${who("ב","ברנרד","1938","מערכת של <mark>פעילויות מתואמות במודע</mark> של שני אנשים או יותר.")}${who("א","אציוני","1964","יחידות חברתיות שנבנו במכוון כדי <mark>להשיג מטרות מסוימות</mark>.")}<p>ההגדרות שונות כי הן נשענות על גישות תיאורטיות שונות:</p>${tiles([["gear","הגישה המכנית","ארגון הוא כלי שתוכנן להשגת מטרות מוגדרות"],["sprout","הגישה האורגנית","התאגדות שלחבריה אינטרס משותף בהישרדותה"],["scales","הגישה הפוליטית","קואליציה של בעלי עניין שמנהלים משא ומתן על המטרות"]])}${ex("אותו בית חולים בשלוש העדשות: <b>מכנית</b> – מכונה שנבנתה לרפא חולים. <b>אורגנית</b> – \"יצור חי\" שהעובדים בו רוצים שימשיך להתקיים. <b>פוליטית</b> – זירה שבה רופאים, אחיות, הנהלה ומשרד הבריאות מתמקחים על מה חשוב יותר.")}`,q:"q5"},
  {h:"ההגדרה של הספר",html:`${def("ההגדרה שהספר מאמץ","ארגון הוא <mark>מערכת חברתית העוסקת בהפקה מתמשכת של מוצרים ושירותים</mark>, באמצעות מחזורי פעילות תכליתית, תוך <mark>חליפין עם הסביבה</mark>.")}${ex("מאפייה: <b>מערכת חברתית</b> (אופים, קופאים, מנהל) שעוסקת ב<b>הפקה מתמשכת</b> (לחם כל יום, לא פעם אחת), דרך <b>מחזורי פעילות</b> (לשה, אפייה, מכירה, שוב מחר), ו<b>בחליפין עם הסביבה</b> (קונה קמח מספקים, מוכרת לחם ללקוחות).")}<p>שימו לב מה ההגדרה <b>לא</b> מניחה: היא לא מייחסת לארגון מטרות, ולא מזהה את הארגון עם האנשים שבו. מה שהיא כן כוללת: פעילות יצרנית, המשכיות, תוצרים ופתיחות לסביבה.</p><p><b>אז מה נחשב ארגון?</b></p>${yn(["בנק","בית חולים","צבא","מפלגה","אגודת ספורט","בית סוהר"],["משפחה","מעמד חברתי","קבוצה אתנית"])}`,q:"q6"},
  {h:"מה מייחד ארגונים (חלק א)",html:`${tiles([["gear","מערכות מלאכותיות","נוצרו בתכנון מכוון, לא בתהליך טבעי כמו קהילות. קיימים רק כל עוד מישהו מפעיל אותם."],["people","פעולות, לא אנשים","מה שמגדיר ארגון הוא מערך התפקידים. לא משנה מי מאייש אותם."],["id","זהות נפרדת","שם, סמלים, מעמד משפטי, חשבונאות, וגבול ברור בין מי שבפנים למי שבחוץ."]])}${ex("מנהל בנק פורש, מישהו אחר נכנס לתפקיד, והבנק ממשיך כרגיל. הארגון הוא התפקידים, לא האנשים.")}`,q:"q9"},
  {h:"מה מייחד ארגונים (חלק ב)",html:`${tiles([["clock","המשכיות","בניגוד להתקהלות חולפת, ארגון ממשיך אחרי שמשימה הסתיימה ואחרי שהמייסדים עזבו."],["pie","מעורבות חלקית","כל אחד שייך לארגונים רבים, ולכן משקיע בכל אחד רק חלק מעצמו (segmental)."],["factory","יחידות יצרניות","ארגון קיים כל עוד יש ביקוש לתוצרים שלו. בלי ביקוש, הבסיס לקיומו נשמט."]])}${ex("בית ספר עזוב או קניון נטוש: ארגונים שהביקוש לתוצרים שלהם נעלם. ו<b>מעורבות חלקית</b>: אותו אדם הוא עובד בבנק בבוקר, סטודנט במכללה בערב וחבר בקבוצת כדורגל בשבת. הוא נותן לכל ארגון רק חלק מעצמו.")}${rem("מידת המעורבות תלויה בתפקיד ובחשיבותו: מנהל סניף מעורב בעסקי הבנק יותר מפקיד.")}`,q:"q10"}
 ]},
 {id:"t3",icon:"cycle",title:"ארגונים כמערכות",blocks:[
  {h:"מה זו מערכת?",html:`<p><b>פתיח:</b> בנושא הזה מסתכלים על ארגון כמו על גוף חי: יש לו חלקים שעובדים יחד, והוא \"נושם\" מהסביבה שלו. ההסתכלות הזו עוזרת להבין למה ארגון לא יכול להתקיים לבד, בלי לקוחות, ספקים ועובדים מבחוץ.</p>${def("מושג מפתח","<mark>מערכת</mark> היא מכלול של חלקים שקשורים זה לזה ופועלים יחד כשלם. שעון הוא מערכת, ולא ערימה של קפיצים בקופסה.")}<p>תורת המערכות של <b>ברטלנפי</b> מבחינה בין שני סוגים:</p>${fig("openclosed")}<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>מערכת סגורה</th><th>מערכת פתוחה</th></tr></thead><tbody>
<tr><td><b>קשר עם הסביבה</b></td><td class="out">מנותקת, לא מקבלת ולא נותנת</td><td class="in">מקבלת קלט ומוציאה פלט כל הזמן</td></tr>
<tr><td><b>מאיפה האנרגיה</b></td><td>רק ממה שיש בתוכה</td><td>מתחדשת מבחוץ</td></tr>
<tr><td><b>מה קורה לאורך זמן</b></td><td class="out">מתבלה ונעצרת</td><td class="in">יכולה להמשיך להתקיים ולהשתנות</td></tr>
<tr><td><b>דוגמה</b></td><td>שעון מכני שלא מכוונים, ונעצר כשהקפיץ נגמר</td><td>גוף האדם: אוכל ונושם, ומוציא פסולת וחום</td></tr></tbody></table></div>
<p>ארגונים הם <mark>מערכות פתוחות</mark>: הם מתקיימים רק בזכות חליפין מתמשכים עם הסביבה.</p>${ex("מסעדה שתפסיק לקנות מצרכים (קלט) או שלקוחות יפסיקו להגיע (פלט) תיסגר תוך ימים. היא לא יכולה להתקיים \"סגורה\" על עצמה.")}`,q:"q13"},
  {h:"קלט, המרה, פלט",html:`<p>כל ארגון קולט משאבים מהסביבה, ממיר אותם, ומחזיר לסביבה מוצרים ושירותים.</p>${fig("ipo")}${who("כ","כץ וקאהן","1966","המרת <mark>תשומות לתפוקות</mark> היא המאפיין המשותף לכל הארגונים.")}${def("מושג מפתח","<mark>מנגנוני בקרה ומשוב</mark> מזהים שינויים או תקלות ומייצבים את המערכת לפני שתתפרק. כמו תרמוסטט, גלאי עשן או בקרת איכות.")}`,q:"q14"},
  {h:"חמש תת-המערכות",html:`<p>לפי כץ וקאהן, בכל ארגון פועלות חמש תת-מערכות:</p>${fig("subsystems")}${tiles([["factory","הפקה","המרת התשומות לתוצרים העיקריים"],["hand","אחזקה","שמירה על העובדים, הציוד והמבנים"],["cart","חליפין","הקשר עם הסביבה: רכש ושיווק"],["bulb","הסתגלות","התאמה לשינויים: מחקר ופיתוח, תכנון"],["target","ניהול","קביעת מטרות, הקצאת משאבים, תיאום"]])}`,q:"q16"},
  {h:"מחזורי פעילות",html:`<p>כל תת-מערכת בנויה מ<mark>מחזורי פעילות</mark>: סדרות של פעולות שחוזרות על עצמן. הדוגמה מהפרק היא תשלום משכורות:</p>${fig("payroll")}<p>הפעולות האלה מתבצעות בתוך תפקידים מוגדרים, ביחידות ארגוניות.</p>`,q:"q20"}
 ]},
 {id:"t4",icon:"pyramid",title:"תכונות הארגון והביורוקרטיה",blocks:[
  {h:"הדגם האידיאלי של ובר",html:`<p><b>פתיח:</b> כשאומרים \"ביורוקרטיה\" רובנו חושבים על תורים וטפסים. אבל בנושא הזה המילה מקבלת משמעות אחרת: היא מתארת <b>איך ארגון גדול בנוי ופועל</b>. נכיר את הסוציולוג מקס ובר, ואת שמונה התכונות שאפשר למדוד בכל ארגון.</p>${who("ו","מקס ובר","סוציולוג","ניסח <mark>דגם אידיאלי</mark> של ארגון מורכב וכינה אותו <mark>ביורוקרטיה</mark>.")}${def("במילים פשוטות",`ובר שאל: איך נראה ארגון שעובד <b>רק לפי כללים והיגיון</b>, בלי העדפות אישיות? התשובה היא <b>ביורוקרטיה</b>: ארגון שבו לכל אחד יש תפקיד מוגדר, הכול כתוב בנהלים, יש סולם ברור של מי מנהל את מי, ומחליטים לפי חוקים ולא לפי \"מי מכיר את מי\".`)}${ex("בבנק, הפקיד לא מחליט לתת הלוואה כי הלקוח נחמד לו. יש נוהל כתוב, טופס, תנאים, ומנהל שמאשר. הפקיד יכול להתחלף, והתהליך יישאר אותו דבר. זו ביורוקרטיה במובן של ובר.")}${def("ולמה \"אידיאלי\"?","\"אידיאלי\" כאן לא אומר <b>טוב</b> או <b>רצוי</b>. הוא אומר <b>טהור</b>: תיאור מוקצן שמשמש <b>סרגל להשוואה</b>. כמו ציור של \"עץ\" בספר לימוד: אף עץ אמיתי לא נראה בדיוק כך, אבל הציור עוזר לבדוק כמה עץ מסוים דומה לו. כך גם אין ארגון שבו כל התכונות מתקיימות במלואן.")}<p>למילה ביורוקרטיה יש שתי משמעויות סותרות, ורוב הארגונים נמצאים איפשהו באמצע:</p>${spectrum("במדע: התארגנות תכליתית ויעילה","ביום-יום: מסורבל ומסואב",1)}<p><b>מפת הנושא: שמונה התכונות של ארגון</b>. לפי הדגם, אפשר לתאר כל ארגון לפי שמונה תכונות. קודם נראה את כולן, ובקטעים הבאים נסביר כל אחת:</p>${tiles([["doc","1. רשמיות","כמה דברים כתובים ומחייבים"],["split","2. חלוקת עבודה","פירוק העבודה למשימות"],["pyramid","3. מדרג סמכות","מי מנהל את מי"],["target","4. ריכוזיות","איפה מתקבלות ההחלטות"],["grad","5. מקצועיות","כמה ידע מיוחד נדרש"],["copies","6. תקנון","כמה התהליכים אחידים"],["link","7. תיאום","איך מחברים את החלקים"],["hand","8. שיתוף פעולה","למה אנשים מצייתים ועובדים יחד"]])}`,q:"q21"},
  {h:"רשמיות, חלוקת עבודה ומדרג",html:`${tiles([["doc","רשמיות","זכויות, חובות ופעולות כתובים ומחייבים: נהלים, טפסים, הגדרות תפקיד"],["split","חלוקת עבודה","פירוק העבודה למשימות, שיוצר התמחות"]])}${rem("רשמיות גבוהה יותר בארגונים <b>גדולים, ציבוריים וותיקים</b>.")}<p><b>מדרג סמכות</b> נראה כמו פירמידה:</p>${fig("pyramid")}`,q:"q23"},
  {h:"ריכוזיות, מקצועיות ותקנון",html:`<p><b>ריכוזיות:</b> כמה מזכות קבלת ההחלטות נשארת בראש הארגון.</p>${ex("ברשת קפה <b>ריכוזית</b>, ההנהלה הראשית קובעת את התפריט והמחירים לכל הסניפים. ברשת <b>מבוזרת</b>, כל מנהל סניף יכול להוסיף מנה או לקבוע מבצע.")}${spectrum("ריכוזי: ההחלטות למעלה","מבוזר: ההחלטות מואצלות למנהלים",0)}${tiles([["grad","מקצועיות","ידע מיוחד מהכשרה, כולל אתיקה מקצועית. גבוהה במכוני מחקר ובתי חולים."],["copies","תקנון","אחידות בתהליכים. גבוה בייצור המוני ובבנקים, נמוך בתיאטרון."]])}`,q:"q26"},
  {h:"תיאום ושיתוף פעולה",html:`${tiles([["link","תיאום","כל יחידה עושה רק חלק, וצריך לחבר את החלקים לשלם. קשה במיוחד בארגונים מבוזרים ורב-לאומיים."],["hand","שיתוף פעולה","מבוסס בעיקר על <b>ציות לכללים ולמרות הממונים</b>. לא תמיד רצוני: בבתי כלא הוא נכפה."]])}${rem("זהו, עברנו על כל שמונה התכונות. בכל ארגון אמיתי כל תכונה נמצאת ברמה אחרת: יש ארגון רשמי מאוד ומבוזר, ויש ארגון לא רשמי וריכוזי.")}`,q:"q29"}
 ]},
 {id:"t5",icon:"chart",title:"ארגונים לעומת יחידים",blocks:[
  {h:"למה צריך ארגונים?",html:`<p><b>פתיח:</b> השאלה כאן היא למה בכלל צריך ארגונים. למה לא שכל אחד יעבוד לבד ויקנה וימכור בשוק? הפרק מראה שיש בעיות שארגון פותר הרבה יותר טוב מאדם בודד.</p><p>הפרק מציין שלוש בעיות שארגונים פותרים טוב יותר מיחידים, משפחות או קהילות:</p>${tiles([["factory","ייצור המוני","חלוקת עבודה, טכנולוגיה ומומחיות מוזילות ייצור"],["question","אי-ודאות","עסקאות מורכבות שהשוק לא מצליח לווסת"],["data","עיבוד מידע","יותר מידע ממה שאדם אחד יכול לעבד"]])}${ex("יצרן יחיד מפיק כמויות קטנות במחיר גבוה. מפעל עם פס ייצור מספק ביקוש של מיליונים.")}`,q:"q31"},
  {h:"אי-ודאות ומידע",html:`${def("מה זו אי-ודאות?",`<mark>אי-ודאות</mark> היא מצב שבו <b>אי אפשר לדעת מראש מה יקרה</b>: אם הספק יספק בזמן, אם המחיר יעלה, אם הקונה ישלם. בעסקה פשוטה, כמו קניית לחם, אין כמעט אי-ודאות: משלמים ומקבלים מיד. בעסקה מורכבת וארוכה יש הרבה אי-ודאות.`)}${ex("נניח שאתם צריכים לבנות בית. אפשר לשכור כל פעם מישהו אחר מהשוק: היום קבלן ליסודות, מחר חשמלאי. אבל אולי החשמלאי לא יגיע, יעלה מחיר באמצע, או יעשה עבודה גרועה. <b>חברת בנייה</b> (ארגון) מעסיקה את כולם קבוע, מתאמת ביניהם ולוקחת על עצמה את הסיכון. כך היא מקטינה את אי-הוודאות.")}${def("עסקאות מותנות","בעסקאות מורכבות, כמו רכישות עתידיות, חוזים ארוכים או אשראי גדול, <mark>מנגנון המחירים מאבד את כושר הוויסות</mark>: המחיר לבדו לא יכול להבטיח שכל צד יעמוד בהתחייבות. ארגונים <b>מפזרים סיכונים</b> ונהנים מ<b>יתרונות לגודל</b>.")}${who("א","ארו, ויליאמסון","1974, 1975","הסבירו למה ארגונים עדיפים על השוק בתנאי אי-ודאות.")}${who("ס","סיימון","1957","יכולתו של אדם לאסוף ולעבד מידע <mark>מוגבלת</mark>. ארגון מאגם מידע ממקורות רבים ומנצל מומחים.")}${ex("רופא אחד לא יכול לזכור את כל הרפואה. בבית חולים יש קרדיולוג, רדיולוג ומעבדה, וכל אחד מביא מידע מהתחום שלו. הארגון \"חושב\" יותר ממה שאדם אחד יכול.")}`,q:"q33"},
  {h:"סיכום הפרק",html:`<p>ארגונים צמחו יחד עם התיעוש, העיור וכלכלת השוק. הם <mark>מערכות חברתיות תכליתיות</mark> שמפיקות מוצרים ושירותים בחליפין עם הסביבה.</p>${def("אבל","ארגונים <b>אינם מושלמים</b>: יש בהם חיכוכים, מאבקי כוח, אבטלה סמויה וניצול לרעה של סמכויות. דווקא זה מבדיל אותם ממכונות.")}${rem("למה זה חשוב לכם: הבנת ארגונים שימושית בניהול, שיווק, מינהל ציבורי ופעילות פוליטית.")}`,q:"q34"}
 ]},
 {id:"t6",icon:"check",title:"תרגול בסגנון המבחן",blocks:[
  {h:"מושגים מהמבחן לדוגמה",html:`<p>שני מושגים מההרצאות שמופיעים במבחן לדוגמה:</p>${tiles([["target","מטרות תפעוליות","ספציפיות וניתנות למדידה, למשל יעד מספרי עם תאריך"],["pyramid","חוק הברזל של האוליגרכיה","מיכלס: בכל ארגון הכוח מתרכז בידי מעטים בראשו"]])}${rem("כדאי להכיר גם את המסיחים: <b>חוק פרקינסון</b> (העבודה מתרחבת לפי הזמן שהוקצב), <b>עקרון פיטר</b> (מתקדמים עד לדרגת חוסר היכולת) ו<b>היפוך מטרות</b> (הכלל הופך למטרה).")}<p>השאלה הראשונה בכל זוג לקוחה מקובץ <b>השאלות לדוגמה למבחן</b> של הקורס (עם התשובה לפי המפתח), והשנייה היא שאלה מקבילה בסגנון דומה.</p>`,q:"eo1"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"סבא שלך גידל את האוכל שלו, ולמד מהוריו. את קונה בסופר ולומדת במכללה. מה ההבדל הזה ממחיש?","a":"המעבר לחברה ארגונית","w":["המעבר מארגונים ממלכתיים לפרטיים","העלייה ברמת ההשכלה בלבד","המעבר מכלכלת כסף לייצור עצמי"],"e":"בחברה ארגונית רוב הפעילות (אוכל, לימודים, בריאות) עוברת דרך ארגונים, וזה ההבדל בין הסבא לנכדה. זה לא ״המעבר מכלכלת כסף לייצור עצמי״: הכיוון הפוך, ייצור עצמי הוחלף בקנייה בכסף."},{"q":"מה מבדיל את החברה המודרנית מתרבויות עתיקות כמו מצרים ורומא, מבחינת ארגונים?","a":"ההיקף והריבוי של הארגונים, שלא היה כמותו","w":["רק בחברה המודרנית יש ארגונים","בתרבויות העתיקות לא היו מסים וצבאות","בחברה המודרנית יש רק ארגונים פרטיים"],"e":"ארגונים היו גם במצרים וברומא: הם גבו מסים, ניהלו צבאות ובנו פירמידות. מה שחדש בחברה המודרנית הוא ההיקף והריבוי שלהם, ולכן ״רק בחברה המודרנית יש ארגונים״ שגוי."}]},
"q2":{"t":"t1","v":[{"q":"איזה מהבאים אינו גורם להתפשטות הארגונים לפי הפרק?","a":"מעבר מכלכלת כסף לייצור עצמי","w":["עיור: מעבר לערים גדולות","גידול במספר יודעי קרוא וכתוב","המהפכה המדעית והטכנולוגית"],"e":"ארבעת הגורמים הם עיור, השכלה, מדע וטכנולוגיה, וכלכלת כסף. הכיוון במסיח הפוך: היה מעבר מייצור עצמי לכלכלת כסף, ולא להפך."},{"q":"איך עיור תרם להתפשטות ארגונים?","a":"ריכוז אנשים בערים יצר צורך ובסיס לשירותים מאורגנים","w":["הוא הקטין את הצורך בארגונים ממלכתיים גדולים","הוא החזיר אנשים רבים לייצור עצמי של מזון","הוא הוריד את רמת ההשכלה בקרב תושבי הערים"],"e":"כשאנשים התרכזו בערים, הם כבר לא גידלו אוכל בעצמם, ונוצר צורך בשירותים מאורגנים (אספקה, תחבורה, חינוך). לכן עיור הגדיל את הצורך בארגונים ולא החזיר אנשים לייצור עצמי."}]},
"q3":{"t":"t1","v":[{"q":"עובד מרגיש שהחברה קובעת לו מתי לקום, מה ללבוש ומתי לחופש, למרות שהיא הוקמה כדי לשרת אנשים. איזה דימוי מהפרק מתאר זאת?","a":"הגולם קם על יוצרו","w":["הדגם האידיאלי של ובר","חוק הברזל של האוליגרכיה","מעורבות חלקית בארגון"],"e":"״הגולם קם על יוצרו״: ארגונים שבני אדם יצרו כדי לשרת אותם, מתחילים לקבוע את גורלם. זה לא חוק הברזל של מיכלס, שעוסק בריכוז כוח בידי מעטים בראש הארגון."},{"q":"למה הפרק משווה ארגונים למדע ולטכנולוגיה?","a":"כי גם הם משפרים את החיים, ובמקביל מואשמים בנזקים","w":["כי שניהם נוצרו בתקופה המודרנית בלבד","כי שניהם מבוססים על חלוקת עבודה מפורטת","כי שניהם מערכות סגורות שלא תלויות בסביבה"],"e":"גם מדע וטכנולוגיה משפרים את רמת החיים, ובמקביל מואשמים בזיהום ובאבטלה. כך גם ארגונים: תועלת עצומה לצד ביקורת. ההשוואה לא עוסקת במועד שבו נוצרו."}]},
"q35":{"t":"t1","v":[{"q":"איזה ארגון ותיק מוזכר בפרק כדוגמה לארגון שפועל יותר מאלף שנה?","a":"הכנסייה הקתולית","w":["האימפריה הרומית","הפרלמנט הבריטי","האוניברסיטה הראשונה באירופה"],"e":"הפרק מביא את הכנסייה הקתולית, שפועלת ברחבי העולם יותר מאלף שנה, כדוגמה לארגון ותיק. האימפריה הרומית אכן הייתה ארגון ממלכתי עתיק, אבל היא לא פועלת עד היום."},{"q":"איזו ביקורת על ארגונים מוזכרת בפרק?","a":"ניכור, עריצות וביורוקרטיה","w":["חוסר יעילות בייצור המוני","היעדר חלוקת עבודה","תלות מוגזמת בשוק החופשי"],"e":"לצד התועלת, הפרק מזכיר את הביקורת: ארגונים יוצרים ניכור, עריצות וביורוקרטיה. ״חוסר יעילות בייצור המוני״ שגוי, כי דווקא ייצור המוני הוא אחד היתרונות של ארגונים."}]},
"q4":{"t":"t2","v":[{"q":"שני חברים מתכננים יחד טיול, מחלקים ביניהם מי מזמין מלון ומי שוכר רכב. לפי ההגדרה של ברנרד בלבד, האם זה ארגון?","a":"כן, כי יש פעילות מתואמת במודע של שני אנשים","w":["לא, כי אין להם מטרה כתובה ומוגדרת","לא, כי הם רק שניים ולא קבוצה גדולה","כן, כי יש להם זהות משפטית נפרדת"],"e":"ברנרד מגדיר ארגון כמערכת של פעילויות מתואמות במודע של שני אנשים או יותר, ושני החברים עושים בדיוק את זה. ההגדרה שלו לא דורשת מטרה כתובה, ולכן ״אין להם מטרה מוגדרת״ לא פוסל אותם."},{"q":"מה ההבדל בין ההגדרה של ברנרד לזו של אציוני?","a":"ברנרד: תיאום פעילויות. אציוני: מטרות שלשמן נבנה","w":["ברנרד מדגיש מטרות, אציוני מדגיש תיאום","ברנרד מדגיש חליפין עם הסביבה, אציוני פוליטיקה","אין הבדל, שתיהן אומרות את אותו דבר"],"e":"ברנרד שם במרכז את התיאום בין פעילויות, ואציוני את המטרות שלשמן נבנתה היחידה החברתית. המסיח הופך את השניים."}]},
"q5":{"t":"t2","v":[{"q":"חוקרת מתארת בית חולים כזירה שבה רופאים, אחיות והנהלה מתמקחים על סדרי עדיפויות. באיזו גישה היא משתמשת?","a":"הפוליטית","w":["המכנית","האורגנית","המערכתית"],"e":"הגישה הפוליטית רואה בארגון קואליציה של בעלי עניין שמתמקחים על המטרות, בדיוק כמו בתיאור. הגישה האורגנית הייתה מדגישה את הרצון המשותף של כולם שהארגון ימשיך להתקיים."},{"q":"עובדים בעמותה ממשיכים להילחם על קיומה גם כשהמטרה המקורית שלה כבר הושגה. איזו גישה מסבירה זאת הכי טוב?","a":"הגישה האורגנית","w":["הגישה המכנית","הגישה הפוליטית","ההגדרה של ברנרד"],"e":"הגישה האורגנית רואה בארגון התאגדות שלחבריה אינטרס משותף בהישרדותה, ולכן העובדים נאבקים על קיומה גם אחרי שהמטרה הושגה. הגישה המכנית הייתה צופה שכלי שמטרתו הושגה פשוט ייסגר."}]},
"q6":{"t":"t2","v":[{"q":"מאפייה קונה קמח מספקים ומוכרת לחם ללקוחות כל יום. איזה רכיב בהגדרת הספר זה ממחיש בעיקר?","a":"חליפין עם הסביבה","w":["מערכת חברתית","מטרות ארגוניות","זהות משפטית"],"e":"קנייה מספקים ומכירה ללקוחות הן תשומות ותפוקות, כלומר חליפין עם הסביבה. ״מטרות ארגוניות״ שגוי, כי הגדרת הספר בכוונה לא מייחסת לארגון מטרות."},{"q":"מה הגדרת הספר אינה מניחה, בניגוד להגדרות אחרות?","a":"שלארגון יש מטרות משלו","w":["שהארגון מפיק מוצרים או שירותים","שהארגון פועל באופן מתמשך","שהארגון מקיים קשר עם הסביבה"],"e":"הגדרת הספר כוללת הפקה, המשכיות ופתיחות לסביבה, אבל לא מייחסת לארגון מטרות משלו ולא מזהה אותו עם האנשים שבו. שלושת המסיחים הם בדיוק מה שההגדרה כן כוללת."}]},
"q7":{"t":"t2","v":[{"q":"איזה מהבאים כן ייחשב ארגון לפי הגדרת הספר?","a":"אגודת ספורט","w":["משפחה","מעמד חברתי","קבוצה אתנית"],"e":"אגודת ספורט נוצרה במכוון ומפיקה באופן מתמשך שירות (אימונים, משחקים). משפחה, מעמד וקבוצה אתנית נוצרו בתהליך טבעי, ולכן אינם ארגונים לפי ההגדרה."},{"q":"למה משפחה אינה נחשבת ארגון לפי הגדרת הספר?","a":"כי היא לא נוצרה במכוון להפקה מתמשכת","w":["כי אין בה יותר משני אנשים בדרך כלל","כי אין בה תיאום בין החברים השונים","כי אין לה שם, סמלים ומעמד משפטי"],"e":"משפחה היא תוצר של התפתחות טבעית ולא מערכת שתוכננה להפיק מוצרים או שירותים. מספר האנשים לא קובע, כי גם לפי ברנרד מספיקים שניים."}]},
"q8":{"t":"t2","v":[{"q":"מה הכוונה ש״ארגונים הם מערכות מלאכותיות״?","a":"הם נוצרו בתכנון, וקיימים כל עוד מישהו מפעיל אותם","w":["הם מבוססים על טכנולוגיה ולא על אנשים","הם לא באמת קיימים, אלא רק בדמיון","הם תמיד מנוהלים על ידי מחשבים ומערכות"],"e":"ארגונים נוצרו בתכנון מכוון, בשונה מקהילות שהתפתחו בטבעיות, והם קיימים רק כל עוד מישהו מפעיל אותם. ״מלאכותי״ כאן לא קשור לטכנולוגיה או למחשבים."},{"q":"קהילה כפרית התפתחה לאורך דורות, וחברת היי־טק הוקמה לפני שנתיים. מה ההבדל ביניהן לפי הפרק?","a":"החברה נוצרה בתכנון מכוון, הקהילה בהתפתחות טבעית","w":["הקהילה גדולה וותיקה יותר, ולכן רק היא ארגון","החברה צעירה מדי, ולכן היא עוד לא נחשבת ארגון","אין הבדל, כי שתיהן מערכות מלאכותיות"],"e":"ההבדל הוא באופן ההיווצרות: החברה תוכננה, והקהילה התפתחה לאורך דורות. הגיל והגודל לא קובעים אם משהו הוא ארגון."}]},
"q9":{"t":"t2","v":[{"q":"בתוך עשר שנים התחלפו כל העובדים בחברת תחבורה, אבל היא ממשיכה לפעול באותה צורה. מה זה ממחיש?","a":"הארגון מוגדר על ידי התפקידים, לא על ידי האנשים","w":["לחברה יש מעורבות חלקית של העובדים","החברה פועלת כמו מערכת סגורה ויציבה","החברה בנויה לפי הגישה הפוליטית"],"e":"ארגון הוא מערך של תפקידים, ולכן הוא ממשיך לפעול גם כשכל האנשים התחלפו. מעורבות חלקית מתארת משהו אחר: כל אדם נותן לכל ארגון רק חלק מעצמו."},{"q":"ממה מורכב ארגון בראש ובראשונה, לפי הפרק?","a":"ממערך של פעולות ותפקידים","w":["מקבוצת אנשים עם מטרה משותפת","ממבנה פיזי ומשאבים","ממערכת של נהלים כתובים"],"e":"לפי הפרק, מה שמגדיר ארגון הוא מערך הפעולות והתפקידים, ולא מי שמאייש אותם. ״קבוצת אנשים עם מטרה משותפת״ שגוי פעמיים: ההגדרה לא מזהה ארגון עם אנשים ולא מייחסת לו מטרות."}]},
"q10":{"t":"t2","v":[{"q":"מנהלת סניף בבנק מעורבת בעסקי הבנק הרבה יותר מפקיד צעיר באותו סניף. לפי הפרק, מה מסביר זאת?","a":"המעורבות תלויה בתפקיד ובחשיבותו","w":["לפקיד יש מעורבות מלאה בארגון אחר","המנהלת שייכת לפחות ארגונים","המעורבות תלויה בגיל של העובד"],"e":"מידת המעורבות החלקית תלויה בתפקיד ובחשיבותו: למנהלת יש תפקיד מרכזי יותר בבנק. גיל העובד לא מוזכר כגורם."},{"q":"מה הסיבה שאדם נותן לכל ארגון רק חלק מעצמו?","a":"כי הוא שייך לארגונים רבים במקביל","w":["כי ארגונים לא רוצים מחויבות מלאה","כי החוק מגביל את שעות העבודה","כי ארגונים הם מערכות סגורות"],"e":"כל אדם שייך לארגונים רבים במקביל (עבודה, לימודים, ספורט), ולכן לכל אחד הוא נותן רק חלק מעצמו (segmental). הסיבה היא ריבוי השייכויות, לא מגבלה בחוק."}]},
"q11":{"t":"t2","v":[{"q":"חברה שייצרה מצלמות פילם רואה את הביקוש נעלם. לפי הפרק, מה יקרה לה?","a":"היא תיעלם, אלא אם תפיק תוצרים חדשים שיש להם ביקוש","w":["היא תמשיך להתקיים בזכות הזהות הנפרדת שלה","היא תמשיך, כי ארגון קיים גם בלי ביקוש","היא תהפוך למערכת סגורה ותשרוד"],"e":"ארגון קיים כל עוד יש ביקוש לתוצרים שלו, ולכן בלי ביקוש הבסיס לקיומו נשמט, אלא אם יפיק תוצרים חדשים. זהות נפרדת (שם וסמלים) לא מספיקה כדי לשרוד."},{"q":"לפי הפרק, מה מעיד על כך שהתוצרים של ארגון מועילים?","a":"הביקוש להם בסביבה","w":["מספר העובדים שמייצרים אותם","הרווח של בעלי המניות","ההחלטה של ההנהלה הבכירה"],"e":"הביקוש בסביבה הוא המבחן לכך שהתוצרים מועילים: אם אנשים קונים או משתמשים, יש בהם תועלת. מספר העובדים מעיד רק על גודל הארגון."}]},
"q12":{"t":"t2","v":[{"q":"איזה מהבאים אינו מסמן את הזהות הנפרדת של ארגון?","a":"מספר העובדים שלו","w":["השם והסמלים שלו","המעמד המשפטי שלו","הגבול בין מי שבפנים למי שבחוץ"],"e":"זהות נפרדת מתבטאת בשם, בסמלים, במעמד משפטי, בחשבונאות ובגבול בין פנים לחוץ. מספר העובדים הוא גודל, לא סימן זהות."},{"q":"מה מבדיל ארגון מהפגנה גדולה, שגם בה יש תיאום וגם מטרה?","a":"הארגון ממשיך להתקיים גם אחרי שהמשימה הסתיימה","w":["בארגון משתתפים הרבה יותר אנשים","בהפגנה אין מטרה ברורה ומשותפת","בהפגנה אין שום קשר עם הסביבה"],"e":"הפגנה מתפרקת כשהמשימה נגמרת, וארגון ממשיך להתקיים גם אחרי שמשימה הסתיימה ואחרי שהמייסדים עזבו. גם בהפגנה יש מטרה, ולכן זה לא ההבדל."}]},
"q13":{"t":"t3","v":[{"q":"מסעדה מפסיקה לקנות מצרכים. תוך ימים היא נסגרת. איזה מושג זה ממחיש?","a":"ארגון הוא מערכת פתוחה שתלויה בחליפין עם הסביבה","w":["ארגון הוא מערכת סגורה שמתבלה עם הזמן","הארגון איבד את מנגנוני הבקרה והמשוב שלו","הארגון איבד את תת־מערכת הניהול שלו"],"e":"ארגון הוא מערכת פתוחה: הוא חי מחליפין מתמשכים עם הסביבה, ובלי קלט הוא נסגר. מערכת סגורה מתבלה לאט מבפנים, ואילו כאן הסגירה נגרמה מניתוק מהסביבה."},{"q":"שעון מכני שלא מכוונים נעצר כשהקפיץ נגמר. למה הוא דוגמה למערכת סגורה?","a":"כי הוא פועל רק על האנרגיה שבתוכו, בלי קלט מבחוץ","w":["כי יש לו חלקים שעובדים יחד כשלם","כי יש לו מנגנון בקרה פנימי שמייצב אותו","כי הוא מפיק פלט לסביבה (מראה את השעה)"],"e":"מערכת סגורה פועלת רק על האנרגיה שבתוכה ולא מתחדשת מבחוץ, ולכן השעון נעצר. גם למערכת פתוחה יש חלקים שעובדים יחד, ולכן זה לא מה שהופך אותו לסגור."}]},
"q14":{"t":"t3","v":[{"q":"בבית ספר, מה הוא שלב ״ההמרה״?","a":"תהליך ההוראה והלמידה בכיתות","w":["רישום התלמידים בתחילת השנה","בוגרים שיוצאים לאוניברסיטה","התקציב שמגיע ממשרד החינוך"],"e":"ההמרה היא התהליך שהופך תשומות לתפוקות, ובבית ספר זו ההוראה והלמידה. רישום ותקציב הם קלט, ובוגרים הם הפלט."},{"q":"לפי כץ וקאהן, מה המשותף לכל הארגונים?","a":"המרת תשומות לתפוקות","w":["מבנה היררכי של סמכות","מטרות כתובות ומוגדרות","ריכוזיות בקבלת החלטות"],"e":"כץ וקאהן ראו בהמרת תשומות לתפוקות את המאפיין המשותף לכל הארגונים. היררכיה ומטרות כתובות לא קיימות בכל ארגון באותה מידה."}]},
"q15":{"t":"t3","v":[{"q":"מפעל בודק כל מוצר עשירי, ואם יש פגם עוצר את הקו לתיקון. מה זה?","a":"מנגנון בקרה ומשוב","w":["תת־מערכת הסתגלות","מחזור פעילות של חליפין","תת־מערכת אחזקה"],"e":"בדיקה, זיהוי פגם ועצירה לתיקון הם מנגנון בקרה ומשוב, שמייצב את המערכת. תת־מערכת הסתגלות עוסקת בשינויים בסביבה, לא בתקלות בתוך קו הייצור."},{"q":"מה תפקידם של מנגנוני בקרה ומשוב?","a":"לזהות תקלות ולייצב את המערכת","w":["להמיר את התשומות לתפוקות","לקבוע את המטרות של הארגון","לקנות חומרי גלם מהסביבה"],"e":"מנגנוני בקרה ומשוב מזהים סטייה ומחזירים את המערכת לאיזון, כמו תרמוסטט. ההמרה עצמה היא תפקיד ההפקה, לא הבקרה."}]},
"q16":{"t":"t3","v":[{"q":"מחלקת משאבי אנוש שמכשירה עובדים ומחלקת תחזוקה שמתקנת מכונות שייכות לאותה תת־מערכת. איזו?","a":"אחזקה","w":["הפקה","חליפין","הסתגלות"],"e":"גם הכשרת עובדים וגם תיקון מכונות שומרים על המשאבים של הארגון (אנשים וציוד), וזו תת־מערכת האחזקה. הפקה הייתה הייצור עצמו."},{"q":"מה מבדיל את תת־מערכת האחזקה מתת־מערכת ההפקה?","a":"אחזקה שומרת על המשאבים, הפקה ממירה אותם","w":["אחזקה מוכרת תוצרים, הפקה קונה חומרים","אחזקה מתכננת שינויים, הפקה מבצעת אותם","אחזקה קובעת מטרות, הפקה מתאמת"],"e":"אחזקה שומרת על העובדים, הציוד והמבנים, והפקה ממירה את המשאבים לתוצרים. תכנון שינויים שייך להסתגלות, לא לאחזקה."}]},
"q17":{"t":"t3","v":[{"q":"צוות שמנהל משא ומתן עם ספקים וצוות שמפרסם את המוצר שייכים לאותה תת־מערכת. איזו?","a":"חליפין","w":["הסתגלות","ניהול","אחזקה"],"e":"רכש מספקים ושיווק ללקוחות הם הקשר השוטף עם הסביבה, כלומר תת־מערכת החליפין. הסתגלות עוסקת בתכנון לשינויים עתידיים, לא בעסקאות שוטפות."},{"q":"מה מבדיל את תת־מערכת החליפין מתת־מערכת ההסתגלות?","a":"חליפין: קשר שוטף עם הסביבה. הסתגלות: התאמה לשינויים בה","w":["חליפין מתכננת שינויים, הסתגלות קונה ומוכרת","חליפין שומרת על העובדים, הסתגלות על הציוד","אין הבדל, שתיהן עוסקות בסביבה באותה דרך"],"e":"שתיהן פונות החוצה, אבל חליפין מנהלת את הקשר השוטף (קנייה ומכירה), והסתגלות מתכננת התאמה לשינויים בסביבה. המסיח הראשון הופך ביניהן."}]},
"q18":{"t":"t3","v":[{"q":"חברה מקימה צוות שבודק טרנדים בשוק ומתכנן מוצרים לחמש השנים הבאות. לאיזו תת־מערכת הוא שייך?","a":"הסתגלות","w":["חליפין","הפקה","ניהול"],"e":"מחקר טרנדים ותכנון מוצרים לעתיד הם התאמה לשינויים בסביבה, כלומר הסתגלות. חליפין עוסקת במכירה השוטפת, לא בתכנון לחמש שנים."},{"q":"מה יקרה לארגון בלי תת־מערכת הסתגלות?","a":"הוא יתקשה להתאים את עצמו לשינויים בסביבה","w":["הוא לא יוכל לקנות חומרי גלם","הוא לא יוכל לשלם משכורות","הוא לא יוכל להמיר תשומות לתפוקות"],"e":"בלי הסתגלות הארגון ימשיך לפעול היום, אבל יתקשה להתאים את עצמו כשהסביבה תשתנה. קניית חומרי גלם ותשלום משכורות שייכים לחליפין ולאחזקה, ולכן ימשיכו לפעול."}]},
"q19":{"t":"t3","v":[{"q":"בבית חולים, איזו פעילות שייכת לתת־מערכת הניהול?","a":"החלטה על חלוקת התקציב בין המחלקות","w":["טיפול בחולים במחלקה הפנימית","קניית ציוד רפואי מספקים","תיקון מכשיר רנטגן שהתקלקל"],"e":"חלוקת תקציב בין מחלקות היא הקצאת משאבים ותיאום, וזה תפקיד הניהול. קניית ציוד מספקים היא חליפין, ותיקון מכשיר הוא אחזקה."},{"q":"באוניברסיטה, ההוראה והמחקר שייכים לתת־מערכת:","a":"הפקה","w":["אחזקה","חליפין","ניהול"],"e":"הוראה ומחקר הם התוצרים העיקריים של האוניברסיטה, ולכן הם שייכים להפקה. אחזקה הייתה, למשל, תחזוקת הבניינים או הכשרת הסגל."}]},
"q20":{"t":"t3","v":[{"q":"בכל חודש בנק אוסף הלוואות, מחשב ריבית, ושולח חיובים ללקוחות. מה זה?","a":"מחזור פעילות","w":["מנגנון בקרה ומשוב","תת־מערכת הסתגלות","מערכת סגורה"],"e":"מחזור פעילות הוא סדרה של פעולות שחוזרת על עצמה, כמו הסבב החודשי של הבנק. מנגנון בקרה היה מזהה טעויות בחיובים ומתקן אותן."},{"q":"מה היחס בין מחזורי פעילות לתת־מערכות?","a":"תת־מערכות בנויות ממחזורי פעילות","w":["מחזורי פעילות בנויים מתת־מערכות","אין ביניהם קשר","הם שני שמות לאותו דבר"],"e":"מחזורי הפעילות הם אבני הבניין, ותת־המערכות בנויות מהם. המסיח הראשון הופך את היחס."}]},
"q21":{"t":"t4","v":[{"q":"למה ובר קרא לדגם שלו ״אידיאלי״?","a":"כי זה תיאור טהור ומוקצן שמשמש סרגל להשוואה","w":["כי זה הארגון הטוב והרצוי ביותר","כי זה מתאר את רוב הארגונים במציאות","כי זה ארגון שאין בו בעיות"],"e":"״אידיאלי״ אצל ובר פירושו טהור ומוקצן, ולא ״טוב״ או ״רצוי״. הדגם משמש סרגל להשוואה, ואין ארגון אמיתי שתואם אותו במלואו."},{"q":"חוקרת בודקת כמה בית חולים מסוים דומה לביורוקרטיה של ובר. איך היא משתמשת בדגם?","a":"כסרגל להשוות אליו את בית החולים","w":["כתיאור מדויק של איך בית החולים צריך להיראות","כהמלצה לשנות את בית החולים","כהוכחה שבית החולים יעיל"],"e":"החוקרת משתמשת בדגם כסרגל: היא בודקת עד כמה בית החולים מתקרב לדגם הטהור. הדגם לא אומר איך בית החולים ״צריך״ להיראות."}]},
"q22":{"t":"t4","v":[{"q":"סטודנטית אומרת ״הביורוקרטיה במשרד הפנים נוראית״, ומרצה אומר ״ביורוקרטיה היא ארגון יעיל״. מה מסביר את הסתירה?","a":"למילה יש משמעות מדעית ומשמעות יומיומית","w":["המרצה טועה, ביורוקרטיה תמיד מסורבלת","הסטודנטית טועה, ביורוקרטיה תמיד יעילה","המשמעות השתנתה מאז ובר"],"e":"במובן המדעי (ובר), ביורוקרטיה היא התארגנות תכליתית ויעילה. במובן היומיומי זו מילה נרדפת לסרבול. שניהם צודקים, כל אחד במובן אחר."},{"q":"מה המשמעות של ״ביורוקרטיה״ במובן של ובר?","a":"ארגון שפועל לפי כללים והיגיון, בלי העדפות אישיות","w":["ארגון מסורבל ואיטי שמלא בטפסים ובתורים","ארגון ממשלתי בלבד, ולא ארגון פרטי","ארגון קטן שבו כל אחד עושה את כל העבודה"],"e":"ובר התכוון לארגון שפועל לפי כללים כתובים והיגיון, בלי העדפות אישיות. ״מסורבל ואיטי״ הוא המובן היומיומי, לא המדעי."}]},
"q23":{"t":"t4","v":[{"q":"באיזה ארגון צפויה רשמיות גבוהה ביותר?","a":"רשות מסים ממשלתית שפועלת 70 שנה","w":["סטארט־אפ פרטי שהוקם לפני שנה","להקת תיאטרון קטנה ועצמאית","חנות משפחתית שכונתית"],"e":"רשמיות גבוהה צפויה בארגונים גדולים, ציבוריים וותיקים, כמו רשות מסים בת 70. סטארט־אפ צעיר הוא בדיוק ההפך: קטן, פרטי וחדש."},{"q":"לפקיד בעירייה יש הגדרת תפקיד כתובה, טפסים לכל פעולה ונהלים מחייבים. איזו תכונה גבוהה?","a":"רשמיות","w":["מקצועיות","ריכוזיות","תיאום"],"e":"הגדרות תפקיד כתובות, טפסים ונהלים מחייבים הם רשמיות. תקנון היה אחידות בביצוע, ופה הדגש הוא על הכתיבה וההתחייבות."}]},
"q24":{"t":"t4","v":[{"q":"במסעדה אחד חותך ירקות, שני מטגן ושלישי מסדר בצלחת. איזו תכונה זו?","a":"חלוקת עבודה","w":["תקנון","מדרג סמכות","ריכוזיות"],"e":"פירוק העבודה למשימות נפרדות, שכל אחד מבצע חלק, הוא חלוקת עבודה. תקנון הוא שכל אחד מבצע את חלקו באותה דרך בדיוק בכל פעם, וזה לא מה שמתואר."},{"q":"מה התוצאה הישירה של חלוקת עבודה?","a":"התמחות, וצורך בתיאום בין החלקים","w":["ריכוזיות גבוהה יותר בקבלת החלטות","פחות צורך בנהלים כתובים","מעורבות מלאה של כל העובדים"],"e":"חלוקת עבודה יוצרת התמחות, אבל גם צורך לחבר את החלקים, כלומר תיאום. היא לא מורידה את הצורך בנהלים, ולפעמים אף מגדילה אותו."}]},
"q25":{"t":"t4","v":[{"q":"בשני ארגונים יש חמישה דרגים. באחד המנכ״ל מחליט הכול, בשני כל מנהל מחליט בתחומו. במה הם שונים?","a":"בריכוזיות, לא במדרג הסמכות","w":["במדרג הסמכות, לא בריכוזיות","גם במדרג וגם בריכוזיות","ברשמיות ובתקנון"],"e":"מספר הדרגים זהה, ולכן מדרג הסמכות זהה. ההבדל הוא איפה מתקבלות ההחלטות, וזו ריכוזיות."},{"q":"איך נראה מדרג סמכות?","a":"פירמידה: מעטים עם סמכות רחבה בראש, רבים עם מוגבלת בבסיס","w":["קו ישר: לכולם אותה סמכות","פירמידה הפוכה: רבים למעלה, מעטים למטה","רשת: כל אחד מדווח לכמה ממונים"],"e":"מדרג סמכות בנוי כפירמידה: מעטים בראש עם סמכות רחבה, ורבים בבסיס עם סמכות מוגבלת. ״רשת עם כמה ממונים״ מתאר מבנה מטריציוני, לא את ההיררכיה של ובר."}]},
"q26":{"t":"t4","v":[{"q":"ברשת חנויות, כל מנהל סניף קובע לבד מבצעים, שעות פתיחה וגיוס עובדים. מה רמת הריכוזיות?","a":"נמוכה (ביזור)","w":["גבוהה","בינונית","אי אפשר לדעת בלי לדעת כמה דרגים יש"],"e":"כשמנהלי הסניפים מחליטים בעצמם, סמכות ההחלטה מבוזרת, כלומר ריכוזיות נמוכה. מספר הדרגים לא נדרש, כי ריכוזיות לא נמדדת לפיו."},{"q":"מה מתארת ריכוזיות?","a":"כמה מזכות ההחלטה נשארת בראש הארגון","w":["כמה דרגים יש בארגון","כמה נהלים כתובים יש בו","כמה עובדים יש לכל מנהל"],"e":"ריכוזיות מתארת כמה מזכות ההחלטה נשארת בראש הארגון. מספר הדרגים הוא מדרג הסמכות, תכונה אחרת."}]},

  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mgmt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
