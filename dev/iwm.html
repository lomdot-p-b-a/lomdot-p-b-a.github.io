  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"brain",title:"הרקע: מודלים פנימיים עובדים",blocks:[
  {h:"מה הציע בולבי",html:`${def("על מה הנושא",`בולבי טען שתינוקות בונים בראש "מודל" של איך ההורה יגיב אליהם. הנושא מסביר את הרעיון, ואת השאלה שאף אחד עוד לא בדק ישירות.<br><b>מה נלמד כאן:</b> מודל פנימי עובד · הפער במחקר`)}<p>לפני כחצי מאה הציע ג'ון בולבי שלבני אדם יש <mark>מערכת התנהגותית אינסטינקטיבית של היקשרות</mark> ${E("Attachment behavioral system")}. לפי בולבי, המערכת הזו מלווה ב<b>מודלים פנימיים עובדים</b> של העולם החברתי, שנבנים מתוך הניסיון של התינוק עם המטפל שלו (Bowlby, 1958, 1969/1982).</p>${def("מושג מפתח",`<mark>מודל פנימי עובד</mark> ${E("Internal working model")}: ייצוג מנטלי של קשרים חברתיים, שנבנה מהחוויה של התינוק עם המטפל. כלומר, מה התינוק "מצפה" שיקרה כשהוא זקוק למטפל.`)}${rem(`לפי ההנחה, המודלים האלה מתווכים, לפחות בחלקם, את השימוש של התינוק במטפל כ<b>חיץ מפני לחץ</b> ${E("Buffer against stress")}, ובהמשך גם את יכולות הוויסות העצמי והכישורים החברתיים.`)}${ex(`תינוקת שבכל פעם שהיא בוכה, אמא מגיעה ומרגיעה אותה. היא לומדת "כשאני צריכה, מישהו בא". זה המודל הפנימי שלה. תינוקת שאיש לא מגיב לבכי שלה לומדת ציפייה הפוכה.`)}`,q:"q1"},
  {h:"מה כבר ידענו",html:`<p>מאות מחקרים מצאו שתינוקות שהכי קל להם לחפש תמיכה ולקבל אותה מהמטפל, כלומר תינוקות עם <mark>היקשרות בטוחה</mark> ${E("Secure attachment")}:</p>${tiles([["hand","טיפול רגיש","בסבירות גבוהה יותר קיבלו טיפול רגיש ומגיב"],["sprout","יתרונות לאורך זמן","עם הזמן הם מראים יתרונות רגשיים־חברתיים (Cassidy & Shaver, 1999)"],["people","בגיל מבוגר יותר","אצל ילדים גדולים ומבוגרים, ביטחון בהיקשרות קשור לייצוגים של קשרים חברתיים"]])}${def("הפער שהמאמר בא לסגור",`עד המחקר הזה <b>אף מחקר לא בדק ישירות</b> מודלים פנימיים עובדים <b>בינקות</b>. כלומר, הייתה הנחה תיאורטית, אבל לא עדות ישירה שהמודלים כבר קיימים אצל תינוקות.`)}`,q:"q3"}
 ]},
 {id:"t2",icon:"flask",title:"השיטה: איך בודקים מה תינוק מצפה",blocks:[
  {h:"משתתפים ומדידת ההיקשרות",html:`${def("על מה הנושא",`איך בודקים ציפייה של תינוק שעוד לא מדבר? הנושא מסביר את השיטה: קודם מסווגים את התינוקות, ואז מודדים כמה זמן הם מסתכלים על סרטונים.<br><b>מה נלמד כאן:</b> המצב הזר · שיטת ההרגלה · הסרטונים · מהימנות`)}${tiles([["people","21 תינוקות","10 בטוחים ו-11 לא בטוחים"],["clock","גיל 12 עד 16 חודשים","ממוצע 403 ימים, 13 בנות"],["check","המצב הזר","סוג ההיקשרות נקבע לפי המצב הזר (Ainsworth et al., 1978)"]])}${def("מושג מפתח",`<mark>המצב הזר</mark> ${E("Strange Situation")}: הליך מעבדה שבו התינוק נפרד מהאם ונפגש איתה שוב, ולפי התגובות שלו מסווגים את ההיקשרות כ<b>בטוחה</b> או <b>לא בטוחה</b> (נמנעת או חרדה־אמביוולנטית).`)}`,q:"q5"},
  {h:"שיטת ההרגלה החזותית",html:`<p>החוקרים השתמשו ב<mark>שיטת ההרגלה החזותית</mark> ${E("Visual habituation technique")}. התינוק צופה שוב ושוב באותו אירוע, עד שהעניין שלו יורד. אחר כך מציגים לו אירועי מבחן ומודדים כמה זמן הוא מסתכל.</p>${rem(`<b>ההיגיון:</b> תינוקות מסתכלים זמן רב יותר על מה ש<b>מפתיע</b> אותם, כלומר על מה שלא תואם את הציפיות שלהם. לכן זמן ההסתכלות מלמד על מה שהתינוק <b>מצפה</b> שיקרה.`)}${def("ההשערה",`תינוקות <b>בטוחים</b> יסתכלו זמן רב יותר על מטפל <b>שלא מגיב</b> (לא צפוי בעיניהם), ביחס למטפל <b>שמגיב</b> (צפוי), וזאת בהשוואה לתינוקות לא בטוחים.`)}${ex(`תינוקות מסתכלים יותר זמן על משהו שמפתיע אותם, כמו שאנחנו בוהים בקוסם שגרם למטבע להיעלם. לכן זמן ההסתכלות מראה מה התינוק <b>לא</b> ציפה שיקרה.`)}`,q:"q7"},
  {h:"הסרטונים",html:`<p>כדי לבדוק כמה <b>מופשטת וכללית</b> החשיבה של התינוקות על "דמויות", השתמשו ב<b>דמויות גאומטריות מונפשות</b> ולא בבני אדם.</p>${fig("stim","סרטון ההרגלה ושני אירועי המבחן")}<p><b>ההרגלה:</b> שתי אליפסות, "אם" גדולה ו"ילד" קטן, בתחתית מדרון תלול. האם עולה עד מישור בחצי הדרך, ואז הילד מתחיל לבכות (פעימות, קפיצות קטנות וקול בכי אמיתי של תינוק). הסרטון חזר עד שזמן ההסתכלות ירד <b>לחצי</b> מהזמן ההתחלתי.</p><p><b>המבחן:</b> שתי תוצאות, כל אחת פעמיים. <mark>היענות</mark>: האם חוזרת לילד. <mark>חוסר היענות</mark>: האם ממשיכה לעלות ומתרחקת. הסדר אוזן בין התינוקות.</p>`,q:"q9"},
  {h:"מהימנות הקידוד",html:`${tiles([["check","המצב הזר","קודד על ידי המחברת השלישית בלי לדעת את התוצאות. קודדת שנייה בדקה 10 מפגשים: 90% הסכמה, קאפה .83"],["clock","זמני הסתכלות","נמדדו בזמן אמת על ידי צופה שלא ידע את סוג ההיקשרות ואת האירוע. צופה שני בדק 13 תינוקות: 93% הסכמה, קאפה .82"]])}${rem("הקודדים לא ידעו את סוג ההיקשרות ולא ידעו איזה אירוע מוצג. זה מונע הטיה של הקודד לטובת ההשערה.")}`,q:"q11"}
 ]},

 ]},
 {id:"t4",icon:"bulb",title:"המשמעות",blocks:[
  {h:"מה המחקר מראה",html:`${def("על מה הנושא",`מה המחקר מוכיח, ולמה הוא פותח "חלון" חדש לחקר ההיקשרות?<br><b>מה נלמד כאן:</b> המסקנה · חלון חדש`)}${def("המסקנה",`זו <b>עדות חיובית ישירה</b> לכך שחוויות ההיקשרות האישיות של התינוק משתקפות ב<b>ייצוגים מנטליים מופשטים</b> של אינטראקציות חברתיות. כלומר, המודלים הפנימיים העובדים של בולבי קיימים כבר בינקות.`)}<p>התינוקות הבטוחים "ציפו" שהאם תחזור לילד הבוכה, ולכן הופתעו כשהיא המשיכה לעלות. הלא בטוחים לא הראו את הציפייה הזו, ואפילו הסתכלו יותר כשהאם <b>כן</b> חזרה.</p>${rem("הציפייה הופיעה גם כשהדמויות היו <b>אליפסות</b>. זה מראה שהייצוג לא קשור רק לאם הספציפית, אלא הוא כללי ומופשט.")}`,q:"q17"},
  {h:"חלון חדש",html:`<p>לפי המחברות, השיטה הזו פותחת <b>חלון חדש</b> אל המודלים הפנימיים העובדים. היא מאפשרת לעקוב אחרי המודלים <b>כבר כשהם מתחילים להיווצר</b>, עוד לפני הגיל שבו אפשר להשתמש במדדים ההתנהגותיים הקיימים.</p>${ex("בלשון המאמר: זו דרך \"להציץ אל תוך הנפש שהחוויה הזו השאירה בה את חותמה\".")}${tiles([["target","מה נבדק","ציפיות התינוק לגבי תגובת המטפל"],["chart","איך","זמן הסתכלות על אירוע צפוי מול לא צפוי"],["brain","מה נמצא","ייצוג מופשט שתואם את סוג ההיקשרות"]])}`,q:"q19"}
 ]}

const Q={"q1":{"t":"t1","v":[{"q":"פעוט שאמא שלו תמיד מגיבה, מצפה שגם הגננת תעזור לו. לפי בולבי, מה מכוון את הציפייה?","a":"מודל פנימי עובד","w":["מזג מולד","התניה קלאסית","חרדת זרים"],"e":"לפי בולבי, הניסיון עם אמא שתמיד מגיבה בונה מודל פנימי עובד: ציפייה שאנשים קרובים יעזרו. המודל הזה מכוון את הציפייה גם כלפי הגננת. זה לא מזג מולד."},{"q":"מהו ״מודל פנימי עובד״?","a":"ייצוג מנטלי של קשרים, מבוסס על הניסיון עם המטפל","w":["רשימת כללים שההורים מלמדים במילים מפורשות","תכונה מולדת שלא תלויה בשום ניסיון חברתי","זיכרון מדויק של אירוע אחד מסוים בילדות"],"e":"מודל פנימי עובד הוא ייצוג מנטלי של קשרים חברתיים, שנבנה מהניסיון עם המטפל. הוא לא נלמד ככללים מילוליים, ולא נובע מתכונה מולדת."}]},
"q2":{"t":"t1","v":[{"q":"תינוק לחוץ פונה לאמא ונרגע. לפי המאמר, מה מתווך המודל הפנימי בגיל הזה?","a":"שימוש במטפל כחיץ מפני לחץ","w":["כישורים חברתיים עם בני גיל","ויסות עצמי בלי עזרת מבוגר","הבנה של חוקים חברתיים"],"e":"לפי המאמר, בינקות המודלים הפנימיים העובדים מתווכים את השימוש במטפל כחיץ מפני לחץ: התינוק פונה אליו ונרגע. כישורים חברתיים עם בני גיל מגיעים מאוחר יותר."},{"q":"ומה מתווך אותו מודל בשלב מאוחר יותר?","a":"ויסות עצמי וכישורים חברתיים","w":["רק את הקשר עם האם עצמה","רק תגובות של פחד מזרים","רק את ההתפתחות המוטורית"],"e":"בשלב מאוחר יותר, אותם מודלים מתווכים יכולות ויסות עצמי וכישורים חברתיים, כלומר ההשפעה שלהם נמשכת הרבה מעבר לקשר עם האם."}]},
"q3":{"t":"t1","v":[{"q":"תינוק שקל לו לחפש ולקבל תמיכה. מה הכי סביר לגבי הטיפול שקיבל?","a":"טיפול רגיש ומגיב","w":["טיפול חודרני וממריץ","טיפול לא עקבי","טיפול מרוחק ושקט"],"e":"תינוקות שקל להם לחפש ולקבל תמיכה קיבלו, בסבירות גבוהה יותר, טיפול רגיש ומגיב. טיפול חודרני מוביל דווקא להימנעות."},{"q":"איזה פער מחקרי המאמר בא לסגור?","a":"לא נבדקו ישירות מודלים פנימיים בינקות","w":["לא נבדק המצב הזר אצל תינוקות","לא נמצא קשר בין טיפול להיקשרות","לא נבדקו תינוקות לא בטוחים"],"e":"עד המחקר הזה, אף מחקר לא בדק ישירות מודלים פנימיים עובדים בינקות, אלא רק הסיק עליהם מהתנהגות. זה הפער שהמאמר בא לסגור."}]},
"q4":{"t":"t1","v":[{"q":"אצל ילדים גדולים ומבוגרים, למה נמצא קשור ביטחון בהיקשרות?","a":"לייצוגים של קשרים חברתיים","w":["למנת המשכל ולהישגים","לגובה ולמשקל בגיל הזה","להעדפות מוזיקליות שונות"],"e":"אצל ילדים גדולים ומבוגרים נמצא שביטחון בהיקשרות קשור לייצוגים של קשרים חברתיים. המאמר בודק אם הקשר הזה קיים כבר בינקות."},{"q":"מה נמצא במחקרי אורך על תינוקות בטוחים?","a":"יתרונות רגשיים־חברתיים","w":["יתרונות מוטוריים בלבד","אין שום הבדל לאורך זמן","יותר בעיות התנהגות"],"e":"מחקרי אורך מצאו שלתינוקות עם היקשרות בטוחה יש לאורך זמן יתרונות רגשיים־חברתיים. היתרונות אינם רק מוטוריים."}]},

"q6":{"t":"t2","v":[{"q":"מה החלוקה בין הקבוצות במחקר?","a":"10 בטוחים ו-11 לא בטוחים","w":["15 בטוחים ו-6 לא בטוחים","5 בטוחים ו-16 לא בטוחים","21 בטוחים בלי קבוצת השוואה"],"e":"במחקר היו 10 תינוקות בטוחים ו-11 לא בטוחים, שתי קבוצות קטנות."},{"q":"מה הגיל הממוצע של התינוקות במחקר?","a":"כ-403 ימים","w":["כ-200 ימים","כ-600 ימים","כ-1,000 ימים"],"e":"הגיל הממוצע של התינוקות היה כ-403 ימים, כלומר קצת יותר משנה."}]},
"q7":{"t":"t2","v":[{"q":"תינוק מביט זמן רב בכדור ש״מרחף״ באוויר. על איזה עיקרון מבוססת השיטה?","a":"מביטים יותר במה שמפר ציפייה","w":["מביטים יותר במה שמוכר","מביטים יותר במה שצבעוני","מביטים יותר במה שזז מהר"],"e":"שיטת ההרגלה החזותית מבוססת על כך שתינוקות מביטים זמן רב יותר במה שמפר את הציפיות שלהם, כמו כדור ש״מרחף״. הם לא מביטים יותר במה שמוכר להם."},{"q":"מה הייתה ההשערה?","a":"בטוחים יביטו יותר במטפל שלא מגיב","w":["לא בטוחים יביטו יותר בכל אירוע","בטוחים יביטו יותר במטפל שמגיב","לא יהיה הבדל בין הקבוצות"],"e":"ההשערה הייתה שתינוקות בטוחים יביטו יותר במטפל שלא מגיב, כי זה מפר את הציפייה שלהם. הם לא אמורים להביט יותר במטפל שמגיב."}]},
"q8":{"t":"t2","v":[{"q":"למה מטפל שלא מגיב אמור להפתיע דווקא תינוק בטוח?","a":"הוא למד שהמטפל מגיב בעת צורך","w":["הוא רגיל לאירועים מפתיעים","הוא לא מבין מה קורה בסרט","הוא מעדיף דמויות גאומטריות"],"e":"תינוק בטוח למד מניסיונו שהמטפל מגיב כשהוא זקוק לו, ולכן מטפל שלא מגיב מפר את הציפייה שלו. זה לא קשור לאירועים מפתיעים באופן כללי."},{"q":"התינוק הביט 20 שניות בהתחלה. מתי יפסיקו להציג את סרטון ההרגלה?","a":"כשיביט פחות מ-10 שניות","w":["אחרי 20 הצגות בדיוק","כשיתחיל לבכות","כשיביט יותר מ-20 שניות"],"e":"מפסיקים להציג את סרטון ההרגלה כשזמן ההסתכלות יורד לחצי מהזמן ההתחלתי. אם בהתחלה התינוק הביט 20 שניות, מפסיקים כשהוא מביט פחות מ-10."}]},
"q9":{"t":"t2","v":[{"q":"למה השתמשו בדמויות גאומטריות ולא באמא האמיתית?","a":"לבדוק כמה כללית ומופשטת החשיבה","w":["כי צילום של אמהות היה יקר מדי","כי תינוקות מפחדים מפנים לא מוכרות","כי צורות מצחיקות ומעניינות תינוקות"],"e":"השתמשו בדמויות גאומטריות (אליפסות) כדי לבדוק כמה החשיבה של התינוקות כללית ומופשטת, ולא קשורה לאמא ספציפית. הסיבה לא הייתה עלות הצילום."},{"q":"מה קורה בסרטון ההרגלה?","a":"האם עולה, והילד שלמטה בוכה","w":["האם והילד עולים יחד","הילד עולה, והאם בוכה למטה","שניהם יורדים מהמדרון יחד"],"e":"בסרטון ההרגלה האליפסה הגדולה (״האם״) עולה לחצי המדרון, והקטנה (״הילד״) שנשארה למטה מתחילה ״לבכות״. זה מצב של מצוקה שדורש תגובה."}]},
"q10":{"t":"t2","v":[{"q":"באירוע המבחן, האליפסה הגדולה חוזרת לקטנה. איזה אירוע זה?","a":"היענות","w":["חוסר היענות","הרגלה","בסיס בטוח"],"e":"כשהאליפסה הגדולה חוזרת אל הקטנה, זה אירוע ההיענות: האם חוזרת אל הילד הבוכה."},{"q":"באירוע המבחן, האליפסה הגדולה ממשיכה לעלות. איזה אירוע זה?","a":"חוסר היענות","w":["היענות","הרגלה","חרדת פרידה"],"e":"כשהאליפסה הגדולה ממשיכה לעלות ומתרחקת מהקטנה, זה אירוע חוסר ההיענות. היענות הייתה חזרה אליה."}]},
"q11":{"t":"t2","v":[{"q":"מה הייתה ההסכמה בין הקודדים בסיווג המצב הזר?","a":"90%, קאפה .83","w":["60%, קאפה .40","100%, קאפה 1","75%, קאפה .55"],"e":"ההסכמה בין הקודדים בסיווג המצב הזר הייתה 90%, עם קאפה של .83. זו מהימנות גבוהה."},{"q":"המודד של זמני ההסתכלות לא ידע מי בטוח ומי לא. מה זה מונע?","a":"הטיה לטובת ההשערה","w":["השפעה של סדר ההצגה","הבדלים בין בנים לבנות","עייפות של התינוקות"],"e":"מודד שלא יודע איזה תינוק בטוח ואיזה לא, לא יכול להטות, גם בלי כוונה, את המדידה לטובת ההשערה. זו מדידה ״עיוורת״."}]},
"q12":{"t":"t2","v":[{"q":"חצי מהתינוקות ראו קודם היענות, וחצי קודם חוסר היענות. מה המטרה?","a":"לנטרל השפעה של סדר ההצגה","w":["לבדוק את השערת המחקר","להגדיל את המדגם","להפחית את זמן הניסוי"],"e":"חצי מהתינוקות ראו קודם היענות, וחצי קודם חוסר היענות, כדי לנטרל השפעה אפשרית של סדר ההצגה. זה לא נועד להגדיל את המדגם."},{"q":"כמה פעמים הוצגה כל תוצאת מבחן?","a":"פעמיים","w":["פעם אחת","שלוש פעמים","עשר פעמים"],"e":"כל תוצאת מבחן הוצגה פעמיים, כלומר היו ארבעה ניסיונות מבחן."}]},
"q13":{"t":"t3","v":[{"q":"על איזה אירוע הביטו התינוקות הבטוחים יותר?","a":"חוסר היענות","w":["היענות","הרגלה","לא היה הבדל"],"e":"התינוקות הבטוחים הביטו יותר באירוע של חוסר היענות (10.2 שניות), כי הוא הפר את הציפייה שלהם שהמטפל יגיב."},{"q":"על איזה אירוע הביטו התינוקות הלא בטוחים יותר?","a":"היענות","w":["חוסר היענות","הרגלה","לא היה הבדל"],"e":"התינוקות הלא בטוחים הביטו יותר באירוע ההיענות (8.0 שניות). דווקא ההיענות הייתה פחות צפויה בעיניהם."}]},
"q14":{"t":"t3","v":[{"q":"האם נמצאה השפעה של מין התינוק או של סדר ההצגה?","a":"לא","w":["כן, רק של המין","כן, רק של הסדר","כן, של שניהם"],"e":"לא נמצאה השפעה של מין התינוק או של סדר ההצגה, ולכן הם לא מסבירים את התוצאות."},{"q":"מה היה זמן ההסתכלות של הבטוחים בשלושת ניסיונות ההרגלה האחרונים?","a":"כ-5.9 שניות","w":["כ-10.2 שניות","כ-20 שניות","כ-1 שנייה"],"e":"בשלושת ניסיונות ההרגלה האחרונים הביטו התינוקות הבטוחים כ-5.9 שניות. זה הבסיס להשוואה עם ניסיונות המבחן."}]},
"q15":{"t":"t3","v":[{"q":"מה הראה ניתוח השונות המעורב?","a":"אינטראקציה בין סוג ההיקשרות לאירוע","w":["אפקט עיקרי של סוג ההיקשרות בלבד","אפקט עיקרי של האירוע בלבד","אף אפקט לא היה מובהק"],"e":"ניתוח השונות המעורב מצא אינטראקציה מובהקת בין סוג ההיקשרות לסוג האירוע: הכיוון היה הפוך בין שתי הקבוצות. לא נמצא אפקט עיקרי של הקבוצה בלבד."},{"q":"תלמיד טוען: ״הבטוחים פשוט מביטים יותר בכל דבר״. מה התוצאות אומרות?","a":"אין לזה תמיכה, אין הבדל כללי","w":["זה נכון, יש אפקט כללי של הקבוצה","זה נכון, אבל רק בשלב ההרגלה","אי אפשר לדעת את זה מהנתונים"],"e":"לא היה הבדל כללי בזמן ההסתכלות בין הקבוצות, רק אינטראקציה, ולכן הטענה שהבטוחים ״פשוט מביטים יותר בכל דבר״ לא נתמכת."}]},
"q16":{"t":"t3","v":[{"q":"כמה מתוך 10 התינוקות הבטוחים הביטו יותר בחוסר היענות?","a":"7","w":["10","3","5"],"e":"7 מתוך 10 התינוקות הבטוחים הביטו יותר בחוסר היענות: רובם, אבל לא כולם."},{"q":"מה נמצא לגבי תת־הסוגים של היקשרות לא בטוחה?","a":"נמנעים וחרדים לא נבדלו","w":["הנמנעים הביטו יותר","החרדים הביטו יותר","לא נבדקו בכלל"],"e":"התינוקות הנמנעים והחרדים לא נבדלו זה מזה, אולי בגלל המדגם הקטן. לא נמצא שאחד מהסוגים הביט יותר."}]},
"q17":{"t":"t4","v":[{"q":"מה המסקנה המרכזית של המחקר?","a":"חוויות ההיקשרות מתבטאות בייצוגים כבר בינקות","w":["אין קשר בין היקשרות לייצוגים בינקות","היקשרות נקבעת בגנים בלבד","תינוקות לא מבינים דמויות מונפשות"],"e":"המסקנה המרכזית היא שחוויות ההיקשרות משתקפות כבר בינקות בייצוגים מנטליים מופשטים של אינטראקציות חברתיות. המחקר לא בדק גנים."},{"q":"מה תרם המחקר לתיאוריה של בולבי?","a":"עדות ישירה למודלים פנימיים בינקות","w":["הפרכה של רעיון המודלים הפנימיים","הוכחה שאין שלבים בהתפתחות ההיקשרות","הסבר גנטי להבדלים בהיקשרות"],"e":"המחקר נתן עדות חיובית וישירה לקיום מודלים פנימיים עובדים בינקות, וכך תמך בתיאוריה של בולבי. הוא לא הפריך אותה."}]},
"q18":{"t":"t4","v":[{"q":"למה חשוב שהתוצאה התקבלה עם אליפסות?","a":"הייצוג כללי ולא קשור לאם ספציפית","w":["כי אליפסות זולות לצילום","כי תינוקות אוהבים צורות","כי בני אדם מפחידים תינוקות"],"e":"מכיוון שהתוצאה התקבלה עם אליפסות ולא עם אנשים, הייצוג של התינוקות כללי ומופשט, ולא קשור רק לאם הספציפית שלהם."},{"q":"תינוקות לא בטוחים הביטו יותר בהיענות. מה הפירוש?","a":"היענות הפתיעה אותם","w":["הם העדיפו את אירוע ההיענות","הם לא הבינו את הסרט","הם התעייפו מחוסר ההיענות"],"e":"תינוקות לא בטוחים הביטו יותר בהיענות, כי היא הפתיעה אותם: היענות של האם הייתה פחות צפויה בעיניהם. זה לא אומר שהעדיפו אותה."}]},
"q19":{"t":"t4","v":[{"q":"איזה ״חלון חדש״ פותחת השיטה?","a":"לחקור מודלים פנימיים כבר כשהם נוצרים","w":["לחקור היקשרות בבגרות בלבד, לא בינקות","להחליף את המצב הזר לגמרי בשיטה חדשה","לנבא את מנת המשכל כבר בגיל שנה"],"e":"השיטה מאפשרת לעקוב אחרי המודלים הפנימיים כבר כשהם נוצרים, לפני שאפשר למדוד אותם בהתנהגות. זה ה״חלון החדש״ שהיא פותחת."},{"q":"מה המשתנה התלוי במחקר?","a":"זמן ההסתכלות על אירועי המבחן","w":["סוג ההיקשרות של כל תינוק","סוג האירוע שהוצג בסרטון","המין של התינוק במחקר"],"e":"המשתנה התלוי, מה שנמדד, הוא זמן ההסתכלות של התינוק על אירועי המבחן. סוג ההיקשרות וסוג האירוע הם המשתנים הבלתי תלויים."}]},
"q20":{"t":"t4","v":[{"q":"מה המשתנים הבלתי תלויים במחקר?","a":"סוג ההיקשרות וסוג האירוע","w":["זמן ההסתכלות וגיל התינוק","זמן ההסתכלות בלבד","מין התינוק וסדר ההצגה"],"e":"המשתנים הבלתי תלויים הם סוג ההיקשרות (בטוח או לא) וסוג האירוע (היענות או לא), במערך 2×2. זמן ההסתכלות הוא המשתנה התלוי."},{"q":"מה מבדיל את המחקר ממחקרי היקשרות קודמים?","a":"הוא בדק ישירות את ציפיות התינוק","w":["הוא השתמש במצב הזר לראשונה","הוא בדק מבוגרים ולא תינוקות","הוא בדק רק התנהגות ולא ייצוג"],"e":"מחקרים קודמים בדקו בעיקר התנהגות. המחקר הזה בדק ישירות את הציפיות, כלומר הייצוגים, של התינוק עצמו. המצב הזר לא היה חדש."}]},

<h3>הדוגמה שתלווה אותנו: שני תינוקות</h3>
<p>מיה בת שנה. בכל פעם שהיא בוכה, אמא שלה מגיעה ומרגיעה. היא לומדת: ״כשאני צריכה, מישהו בא״. רון בן שנה. לפעמים מגיעים אליו ולפעמים לא, או שמגיעים בכעס. הוא לומד ציפייה אחרת. בואו נראה מה קרה כשהשניים צפו באותו סרטון.</p>

<h3>1. הרקע: מה בולבי הציע ומה חסר</h3>
<p>לפי בולבי, לבני אדם יש <b>מערכת היקשרות</b> מולדת, ולצידה נבנים <b>מודלים פנימיים עובדים</b>: ייצוגים בראש של קשרים, שנבנים מהניסיון עם המטפל. המודלים האלה אמורים להסביר איך התינוק משתמש במטפל כ<b>חיץ מפני לחץ</b> (מקור להרגעה), ובהמשך גם את היכולת להרגיע את עצמו ואת הכישורים החברתיים.</p>
<p><b>מה כבר היה ידוע:</b> תינוקות עם היקשרות בטוחה קיבלו בדרך כלל טיפול רגיש, ומראים יתרונות רגשיים וחברתיים לאורך זמן. ואצל ילדים גדולים ומבוגרים, ביטחון קשור לאיך הם מייצגים קשרים בראש.</p>
<p><b>הפער:</b> אף אחד לא בדק <b>ישירות</b> שהמודלים האלה כבר קיימים <b>בינקות</b>. זו הייתה הנחה תיאורטית בלבד.</p>

<h3>2. השיטה: איך שואלים תינוק מה הוא מצפה</h3>
<p><b>שלב 1: מי בטוח ומי לא.</b> 21 תינוקות בני 12–16 חודשים עברו את <b>המצב הזר</b> (פרידה ואיחוד עם האם במעבדה). 10 סווגו כבטוחים (כמו מיה) ו־11 כלא בטוחים (כמו רון; 6 נמנעים ו־5 חרדים).</p>
<p><b>שלב 2: שיטת ההרגלה.</b> ההיגיון: תינוקות מסתכלים יותר זמן על מה ש<b>מפתיע</b> אותם, כמו שאנחנו בוהים בקוסם שהעלים מטבע. לכן זמן ההסתכלות מלמד מה הם <b>ציפו</b> שיקרה.</p>
<p><b>שלב 3: הסרטון.</b> במקום אנשים, הראו <b>צורות מצוירות</b>: אליפסה גדולה (״אם״) ואליפסה קטנה (״ילד״) בתחתית מדרון. ה״אם״ מטפסת עד חצי הדרך, וה״ילד״ מתחיל ״לבכות״ (מקפץ, עם קול בכי אמיתי של תינוק). הסרטון חזר עד שהתינוקות התרגלו והסתכלו פחות. ואז הראו שני סופים:</p>
<ul>
<li><b>היענות:</b> ה״אם״ חוזרת אל ה״ילד״.</li>
<li><b>חוסר היענות:</b> ה״אם״ ממשיכה לטפס ומתרחקת.</li>
</ul>
<p><b>למה צורות ולא אנשים?</b> כדי לבדוק אם הציפייה <b>כללית ומופשטת</b>, כלומר ״כך מתנהגים מי שדואגים לך״, ולא רק ״כך אמא שלי מתנהגת״.</p>
<p><b>ההשערה:</b> מיה, שרגילה שבאים אליה, תופתע מה״אם״ שלא חוזרת ותסתכל עליה יותר. אצל רון זה לא יקרה.</p>
<p><b>כדי שהתוצאות יהיו אמינות:</b> מי שמדד את זמני ההסתכלות <b>לא ידע</b> איזה תינוק בטוח ואיזה סוף מוצג (כך הוא לא יכול להטות את המדידה), קודד שני בדק חלק מהנתונים והתאים מאוד, והסדר של שני הסופים התחלף בין תינוקות.</p>

<h3>3. התוצאות</h3>

<li>אצל הבטוחים ההבדל בין הסופים מובהק: 7 מתוך 10 הסתכלו יותר על האם שלא חוזרת. אצל הלא בטוחים, 7 מתוך 11 הראו את הדפוס ההפוך.</li>
<li>הנמנעים והחרדים לא נבדלו זה מזה. ולא הייתה השפעה של מין או של סדר ההצגה.</li>
</ul>

<h3>4. מה זה אומר</h3>
<ul>
<li><b>המודלים של בולבי קיימים כבר בינקות.</b> מיה ״ציפתה״ שהאם תחזור, ולכן הופתעה כשלא חזרה. רון לא ציפה לזה, ואפילו הסתכל יותר כשהאם <b>כן</b> חזרה, כנראה כי זה היה פחות צפוי בעיניו.</li>
<li><b>הציפייה מופשטת:</b> היא הופיעה מול אליפסות, כלומר זה ייצוג כללי של ״איך קשרים עובדים״, לא רק זיכרון של אמא ספציפית.</li>
<li><b>חלון חדש למחקר:</b> השיטה מאפשרת לבדוק את המודלים כשהם רק נוצרים, לפני שיש לתינוק מילים או התנהגויות שאפשר למדוד.</li>

<p><b>נקודות לביקורת</b> (לחשיבה שלכם, לא מהמאמר): המדגם קטן מאוד (21), מחקר מתאמי (לא מוכיח שהניסיון <b>גרם</b> לציפייה), וההסקה מזמן הסתכלות היא עקיפה.</p>

  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#sum"&&typeof SUM!=="undefined")summary();else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
</body>
