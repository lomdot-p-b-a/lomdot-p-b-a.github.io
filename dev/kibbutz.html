const T=[
 {id:"t1",icon:"leaf",title:"מבוא: ניסוי של הטבע",blocks:[
  {h:"על מה המאמר",html:`<p>המאמר משלב מחקרים על <b>היקשרות</b> של ילדים שגדלו בקיבוץ עם סקירה <b>חברתית־היסטורית</b> של היחסים בין המשפחה לקולקטיב. הוא משתמש ב<mark>תורת המערכות</mark> ${E("Systems theory")} כדי להעריך את השינויים בגידול הילדים, ומתמקד ב<mark>לינה המשותפת</mark> ${E("Communal sleeping")}: ילדים ותינוקות שישנו בלילה רחוק מההורים.</p>${tiles([["link","היקשרות","להורים ולמטפלות"],["copies","העברה בין־דורית","של דפוסי היקשרות"],["grad","כשירות בבית הספר","בהמשך החיים"]])}${def("הטענה המרכזית",`הלינה המשותפת הייתה <b>"ניסוי חברתי של הטבע"</b> ייחודי, שמנקודת המבט של תורת ההיקשרות <b>נועד להיפסק</b>, כי הוא בגד בצורכי ההיקשרות הבסיסיים של רוב ההורים והילדים.`)}`,q:"q1"},
  {h:"למה זה מבחן חזק לתורת ההיקשרות",html:`<p>הרעיונות של בולבי על סיכונים התפתחותיים נולדו מעבודה עם ילדים בסביבות של מחסור וטיפול מקוטע. אבל בסביבות כאלה (ילדים שעברו התעללות, יתומים) יש גם גורמי סיכון נוספים, כמו <b>מצב חברתי־כלכלי נמוך</b> ו<b>בריאות לקויה</b>, וקשה להפריד ביניהם.</p>${def("מבחן מחמיר יותר",`לבדוק היקשרות אצל ילדים <b>רגילים ובריאים</b>, ממשפחות <b>מתפקדות</b>, שחוו תנאי גידול <b>מקוטעים</b>. זה בדיוק הקיבוץ עם הלינה המשותפת, "ניסוי חברתי של הטבע" (Beit-Hallahmi & Rabin, 1977).`)}${rem("הלינה המשותפת יצרה לילדים רגילים סביבה שדומה יותר ל<b>מוסד</b> מאשר לבית: מעט מבוגרים שאינם הורים, שמטפלים בהרבה ילדים, בסביבה מאורגנת מאוד. וזה בקהילות שתוארו כמכוונות מאוד לילדים.")}`,q:"q3"},
  {h:"מהו קיבוץ",html:`${tiles([["leaf","ניסוי אוטופי","אחד הניסויים האוטופיים המעטים שהצליחו ליצור דרך חיים וגידול ילדים שונה לגמרי, במשך 80 עד 90 שנה"],["people","קהילה שיתופית","שיתופית, דמוקרטית, רב־דורית, 400 עד 900 איש בממוצע. כיום רק כ-1.5% מהאוכלוסייה היהודית בישראל"],["factory","כלכלה","בעבר חקלאית ומבודדת בתנאים קשים מאוד. היום תעשייה וחקלאות, ורמת חיים משביעת רצון"]])}<p>כל קיבוץ אוטונומי כלכלית וחברתית, אבל שייך לתנועה הקיבוצית המאוחדת. אחרי <b>משבר כלכלי גדול בשנות ה-80</b> חלו שינויים בכל תחומי החיים בקיבוץ (Ben-Rafael, 1999).</p>${rem("המאמר <b>לא</b> מנסה לסכם את כל החינוך הקיבוצי. הוא מתמקד בלינה המשותפת, שהייתה נהוגה כ-60 עד 70 שנה עד שהקיבוצים ביטלו אותה בשנות ה-90.")}`,q:"q5"}
 ]},
 {id:"t2",icon:"building",title:"היסטוריה: עלייתה ונפילתה של הלינה המשותפת",blocks:[
  {h:"החלוצים והקולקטיב",html:`<p>החלוצים היו צעירים אידיאליסטים שדחו את התרבות של יהודי מזרח אירופה ורצו ליצור חברה חדשה על בסיס <b>סוציאליסטי וציוני</b>: עבודה פיזית, ייצור, עצמאות לאומית ואישית ושוויון מלא.</p>${def("המתח בין הקולקטיב למשפחה",`המשפחה נתפסה כ<b>כוח מתחרה</b> שעלול להחליש את ההזדהות עם הקולקטיב ואת השליטה הלא פורמלית שלו בחברים (Talmon, 1972).`)}${tiles([["building","בית הלבנים היחיד","הילדים גרו בבניין הלבנים היחיד בקיבוץ ומעולם לא רעבו, בזמן שהמבוגרים גרו באוהלים והאוכל שלהם הוקצב"],["target","מטרות הקולקטיב","להחליש אינדיבידואליזם, לבטל אי־שוויון מגדרי, ולגדל יהודי חדש: בריא, חסון, יצרני וחברתי"]])}`,q:"q7"},
  {h:"\"הורה קולקטיבי\"",html:`<p>הקהילה נתפסה כ<mark>"הורה קולקטיבי"</mark> ${E("Collective parent")} שמחויב ישירות לכל צורכי הילד, בלי תיווך של המשפחה: אוכל, ביגוד, טיפול רפואי ורווחה נפשית. כל ילד היה במובן מסוים "ילד של הקיבוץ".</p>${yn(["לא הייתה אידיאולוגיה לבטל את המשפחה","במובן הנפשי המשפחה תמיד הייתה נוכחת"],["המגבלות על ההורות שיקפו חוסר אמון ביכולת ההורים לגדל ילדים"])}${rem(`פרשנויות <b>פסיכואנליטיות</b>, שהדגישו את ההשפעה ה"פתוגנית" האפשרית של ההורים, שימשו להצדקת חלוקת הטיפול בין הורים למטפלות ולמגורים הנפרדים של הילדים.`)}`,q:"q9"},
  {h:"בית הילדים והלילה",html:`<p>בתי הילדים תפקדו כמו <b>בית</b> כמעט בכל דבר: שם הילדים בילו את רוב הזמן, אכלו, התרחצו וישנו. היה שטח למשחק ולמידה, פינת אוכל, מקלחות וחדרי שינה לשלושה או ארבעה ילדים.</p>${tiles([["people","זמן משפחה","בדירת ההורים, אחר הצהריים והערב (בערך 4 עד 8)"],["moon","שתי שומרות לילה","אחראיות על כל ילדי הקיבוץ מתחת לגיל 12, דרך אינטרקום וסיבובים"],["clock","תורנות שבועית","רבות מהשומרות לא היו מוכרות לילדים, והן התחלפו כל שבוע"]])}${rem("ההורים השכיבו את הילדים, אבל בלילה נשארו רק השומרות. אולי זה הספיק לבטיחות, אבל השאיר לילדים <b>תחושת ביטחון שברירית ומוגבלת</b>: התורנות השבועית כמעט מנעה היענות רגישה לצורכי הילדים.")}`,q:"q11"},
  {h:"מאיפה זה הגיע",html:`${def("נתון חשוב",`רבות מהתרבויות נוהגות ב<b>טיפול מרובה</b> ${E("Multiple caregiving")}, אבל בדגימה עולמית של <b>183 חברות</b> אף אחת לא נהגה ששתינוקות וילדים צעירים ישנו רחוק מההורים (Barry & Paxton, 1971).`)}<p>על הלינה המשותפת התווכחו כבר בשנים 1920 עד 1930, ו<b>ארבעת הקיבוצים הראשונים</b> תמיד נשארו עם לינה משפחתית. היא הפכה לנורמה רק מאוחר יותר, עם עולים סוציאליסטים נלהבים שהעדיפו את טובת הקולקטיב על צורכי הפרט והמשפחה (Dror, 2001).</p>${rem("הלינה המשותפת חיזקה את הנטייה הקולקטיבית כי הקטינה מאוד את ההשפעה של המשפחה, והייתה לה השפעה מזיקה במיוחד על <b>המעורבות של האמהות</b> (Dar, 1998).")}`,q:"q13"},
  {h:"הנפילה",html:`<p>אחרי כ-20 שנה שבהן עמדו במרכז נושאים לאומיים ושל הישרדות, בשנות ה-50 נשמעו ספקות קולניים, יחד עם עלייה ב<mark>מגמות משפחתיות</mark> ${E("Familism")}. ההורים לקחו יותר חלק בטיפול, ויותר קיבוצים עברו ללינה משפחתית.</p>${def("הסוף",`התהליך הגיע לשיאו ב<b>מלחמת המפרץ (1991)</b>, כשכמעט כל הקיבוצים שעוד נהגו בלינה משותפת עברו מרצונם ללינה משפחתית.`)}${tiles([["building","שגשוג כלכלי","שיפור בדירות המשפחה"],["leaf","היחלשות האידיאולוגיה","אצל החברים הצעירים (Lavi, 1990)"],["lock","צורך בפרטיות","ובאינטימיות, והגנה מפני לחץ הקולקטיב (Nathan, 1999)"],["people","נשים","השקיעו יותר באמהות, והיו <b>המובילות</b> של המאבק לשינוי הלינה"]])}${rem("עם המגמות המשפחתיות, המאבק לשוויון בין גברים לנשים נדחק לרקע.")}`,q:"q15"}
 ]},
 {id:"t3",icon:"cycle",title:"מבט מערכתי: יציבות ושינוי",blocks:[
  {h:"עקרונות תורת המערכות",html:`${def("מערכת",`שלם מאורגן של רכיבים תלויים זה בזה, עם דפוסי השפעה <b>הדדיים</b>. מערכות נוטות לשמור על <mark>יציבות והומאוסטזיס</mark> ${E("Homeostasis")}, אבל יכולות להיות <b>פתוחות לשינוי</b> בתגובה למידע חדש. הן מווסתות את עצמן דרך המשחק בין שני התהליכים (Minuchin, 1985).`)}<p>אפשר לראות את התפתחות החינוך הקיבוצי כמשחק הדדי בין <b>רציפות לשינוי</b>, שמופיע גם בקונפליקט בין שימור המסורת הקיבוצית לבין עידוד חדשנות ורפורמה חברתית.</p>`,q:"q17"},
  {h:"הקיבוץ כמערכת פתוחה",html:`<p>עוד לפני שאיכות הטיפול הלא אימהי נעשתה נושא מקצועי, היו שיפורים מבניים: סביבה פיזית איכותית, <b>קבוצות קטנות</b> ויחס טוב בין מטפלת לילדים. אחרי מלחמת העולם השנייה ומלחמת העצמאות, הדרישה של האמהות לקחת חלק גדול יותר התחברה לשינויים פנימיים ולתיאוריות פסיכולוגיות על נזקי <b>חסך אימהי</b>.</p>${tiles([["sprout","מבית החולים הביתה","התינוקות הובאו לבית ההורים ולא לבית התינוקות"],["people","ביקורים וזמן משפחה","ביקורי הורים התקבלו בברכה, וזמן המשפחה הוארך עד ההשכבה"],["clock","ארוחות וסופי שבוע","ארוחת ערב בחדר האוכל, וסופי שבוע וחגים עם המשפחה"]])}${def("הומאוסטזיס",`הקצב <b>האיטי</b> של השינויים (20 עד 50 שנה) מעיד על נטיות הומאוסטטיות. לפי Kaffman (1993), הגדלת זמן המשפחה הייתה <b>פשרה</b> שנועדה לבלום את הדרישה ללינה משפחתית ולשמור על הלינה הנפרדת.`)}`,q:"q19"},
  {h:"מפסיכואנליזה להיקשרות",html:`<p>כדי לשמר את הנורמות, התמקדו באופן <b>בררני</b> במושגים פסיכואנליטיים, כמו הגנה על הילדים מההשלכות של <b>תסביך אדיפוס</b>. הופעת <mark>תורת ההיקשרות</mark> סימנה את תחילת השינוי (Berman, 1988).</p>${rem("תורת ההיקשרות הדגישה את חשיבות הקשר המוקדם בין הורה לילד כבסיס להתפתחות האישיות. לכן כבר לא היה מוצדק לראות בילדים מי שצריך להגן עליהם מפני ה\"פתולוגיה\" של ההורים.")}${def("גבולות חדשים",`במקום <b>תת־מערכות נפרדות</b> של מבוגרים ושל ילדים, שבהן כל המבוגרים חולקים אחריות לכל הילדים, הקיבוץ התארגן מחדש ב<b>משפחות</b>: תת־מערכות של הורים וילדים יחד.`)}`,q:"q21"}
 ]},
 {id:"t4",icon:"link",title:"מבט של תורת ההיקשרות",blocks:[
  {h:"עקרונות תורת ההיקשרות",html:`${def("קשר היקשרות",`קשר ארוך טווח שמתפתח בשנה הראשונה, כלפי <b>אנשים ספציפיים</b> שמטפלים בילד. הביטחון שלו תלוי ב<b>איכות הטיפול</b> (Bowlby, 1982).`)}${tiles([["check","תגובה רגישה","תגובה רגישה לאותות ולצרכים יוצרת ביטחון בזמינות המטפל → היקשרות בטוחה"],["x","דחייה וחוסר עקביות","דחייה וטיפול לא עקבי קשורים להיקשרות לא בטוחה (Ainsworth, 1978)"],["copies","העברה בין־דורית","רגישות האם היא המנגנון שדרכו ההיקשרות עוברת מדור לדור (van IJzendoorn, 1995)"]])}${rem("אופי ההיענות של האם נקבע לפי ה<b>מודלים הפנימיים העובדים</b> שלה. אמהות עם מודלים לא בטוחים נוטות לאסטרטגיות הורות פחות יעילות.")}`,q:"q23"},
  {h:"לא רק רגישות",html:`<p>מערכת ההיקשרות של התינוק ומערכת הטיפול של המבוגר <b>משלימות</b> זו את זו. מטא־אנליזה (De Wolff & van IJzendoorn, 1997) מצאה שרגישות האם <b>מרכזית</b> לביטחון, אבל היא לא הגורם היחיד.</p>${def("Belsky (1999)",`כדי להבין מה תורם לביטחון, צריך לבחון גם גורמים <b>מחוץ</b> לקשר הורה־ילד: את מערכת הטיפול בהקשר של תמיכות וסיכונים אישיים, משפחתיים וחברתיים.`)}`,q:"q25"},
  {h:"תמיכות ומכשולים בלינה המשותפת",html:`${tiles([["check","תמיכות","תחושת שיתוף באחריות עם מבוגרים אחרים, וערכים ברורים לגבי גידול ילדים. שימושי להורים חסרי ניסיון בלי הדרכה ממבוגרים (Oppenheim, 1998)"],["x","מכשולים","בלילה התינוקות היו עם מבוגרים לא מוכרים שלא יכלו להגיב מהר. בגלל התורנות השבועית לא יכלו להיווצר קשרים יציבים"]])}${def("ביטחון מורגש",`הילדים אולי היו <b>מוגנים</b> בבית הילדים, אבל <mark>הביטחון המורגש</mark> ${E("Felt security")} שלהם היה שברירי, עם מעט אמון בזמינות ההורים (Sroufe & Fleeson, 1986).`)}${ex("זיכרונות אוטוביוגרפיים תיארו את הלילות כקשים. מחקרים מצאו אצל ילדים בלינה משותפת <b>תקופות שינה רציפות קצרות יותר</b> ו<b>יעילות שינה נמוכה יותר</b> לעומת ילדי קיבוץ בלינה משפחתית.")}`,q:"q27"},
  {h:"ההורים",html:`<p>גם הורים רבים חוו תסכול וכאב בגלל הפרידה מהילדים. הם היו צריכים לאזן בין <b>שתי מטרות מתחרות</b>: הקושי שהם ראו אצל הילדים, מול הדרישות של הקולקטיב והאידיאולוגיה החינוכית שלו.</p>${tiles([["moon","לקחו הביתה","חלק מההורים לקחו את הילדים לישון בבית"],["building","ביקרו הרבה","ביקרו בבית הילדים לעתים קרובות"],["people","ישנו שם","או אפילו ישנו בעצמם בבית הילדים כל הלילה"]])}${rem("הצעדים האלה הם עדות ל<b>דומיננטיות ולחוסן</b> של מערכת הטיפול ההורית, גם בהקשר לא נוח.")}${def("אוניברסליות",`ילדים בכל תרבות נוטים להיקשר. אבל האוניברסליות לא אומרת חוסר רגישות לתרבות: הפרספקטיבה האבולוציונית מאפשרת התאמות לנישה התרבותית (Hinde & Stevenson-Hinde, 1990; Sagi, 1990).`)}`,q:"q29"}
 ]},
 {id:"t5",icon:"chart",title:"מחקרי ההיקשרות לאם",blocks:[
  {h:"האם בכלל נוצרה היקשרות?",html:`<p>מחקרים מוקדמים מצאו שהגידול הקולקטיבי <b>לא פגע בעוצמת ההיקשרות</b> להורים, ורק אפשר לילדים ליצור קשרים נוספים (Fox, 1977). אבל השיטות אז לא אפשרו לבדוק ביטחון.</p>${def("Sagi et al. (1985)",`בעזרת <mark>המצב הזר</mark> נמצא שרק <b>59%</b> מתינוקות הקיבוץ בלינה משותפת היו בטוחים עם האם, לעומת <b>65% עד 70%</b> בדגימות נורמטיביות בעולם.`)}${rem("המסקנה: טיפול מרובה <b>לא מונע</b> יצירת היקשרות ולא בהכרח מהווה גורם סיכון. אבל שיעור הלא בטוחים הגבוה הצריך לברר מה גורם לביטחון ולחוסר ביטחון.")}`,q:"q31"},
  {h:"הלינה היא הגורם",html:`<p>מחקר <b>מעין־ניסויי</b> (Sagi et al., 1994) השווה זוגות אם־תינוק מקיבוצים עם לינה משותפת וקיבוצים עם לינה משפחתית:</p>${fig("rates","אחוז התינוקות הבטוחים עם האם")}${def("שלילת הסברים חלופיים",`הקבוצות היו <b>דומות</b> באקולוגיה של בית הילדים ביום, בחרדת הפרידה של האם, במזג התינוק ובמשחק אם־תינוק. לכן הסיקו ש<b>סידור הלינה</b> אחראי לשיעור הגבוה של חוסר ביטחון.`)}${rem("ההסבר: <b>היענות לא עקבית</b>. ביום מטפלים מוכרים וזמינים, ובלילה אדם לא מוכר שיכולת ההיענות שלו מוגבלת. היענות לא עקבית היא גורם מוכר להיקשרות <b>אמביוולנטית</b>.")}`,q:"q33"},
  {h:"הסתייגויות",html:`${tiles([["chart","אמביוולנטי מול נמנע","בין הלא בטוחים בקיבוץ היו יותר אמביוולנטיים ופחות נמנעים מהממוצע העולמי, אבל זה מאפיין תינוקות <b>ישראלים</b> בכלל ולא רק קיבוץ"],["check","כמחצית בטוחים","כ-50% מהתינוקות בלינה משותפת היו בטוחים למרות התנאים"],["people","מבוגרים","מחקר על סגנון היקשרות בדיווח עצמי לא מצא קשר בין לינה משותפת או משפחתית לסגנון בבגרות (Sharabany et al., 2001)"]])}${rem("לכן היה צורך להבין תהליכים <b>ספציפיים</b> יותר: גורמים אצל האם, אצל התינוק, ובאינטראקציה ביניהם.")}`,q:"q35"},
  {h:"העברה בין־דורית",html:`<p><mark>העברה בין־דורית</mark> ${E("Intergenerational transmission")}: הייצוגים של ההורה לגבי חוויות ההיקשרות שלו משפיעים על ההורות שלו ועל ההיקשרות של הילד אליו. במחקרים במערב (וגם ביפן) נמצאה <b>כ-75% התאמה</b> בין סיווג התינוק לסיווג ההורה.</p>${sleepTable}${def("הממצא",`האמהות היו <b>אוטונומיות</b> (בטוחות) בשיעור דומה בשני סוגי הקיבוצים, אבל ההעברה הייתה <b>חלשה</b> בלינה המשותפת: 40% לעומת 76%. כלומר ההעברה של המודל הפנימי של ההורה להורות שלו <b>הופרעה</b> (Sagi et al., 1997).`)}${rem("אבל אי אפשר להסיק מכאן סיבתיות: מספר האמהות הבטוחות עם תינוקות לא בטוחים היה דומה למספר האמהות הלא בטוחות עם תינוקות בטוחים. לכן בדקו את האינטראקציה עצמה.")}`,q:"q37"},
  {h:"אינטראקציה אם־תינוק",html:`<p>אחרי שהלינה המשותפת בוטלה, אי אפשר היה לאסוף נתונים חדשים. לכן <b>קודדו מחדש</b> נתוני משחק ישנים בעזרת <mark>סולמות הזמינות הרגשית</mark> ${E("Emotional Availability Scales")} (Aviezer et al., 1999).</p>${tiles([["check","תקשורת מתגמלת","ייצוג בטוח של האם וביטחון של התינוק היו קשורים לתקשורת מתגמלת יותר"],["split","בלי הבדל בממוצע","לא היה הבדל בזמינות הרגשית בין שני סוגי הקיבוצים"],["x","הקשר נעלם","רגישות האם הייתה קשורה לביטחון התינוק <b>רק</b> בלינה המשפחתית"]])}${def("הפירוש",`האמהות בלינה המשותפת לא היו פחות רגישות ולא פחות אוטונומיות. כנראה ש<b>חוסר הנגישות בלילה גבר</b> על האינטראקציות ביום עם אם רגישה, ושינה את המשמעות של הרגישות. הסביבה פעלה כ<b>חיץ</b> שהקטין את השפעת הרגישות (Cowan, 1997), ואולי גם יצרה לחץ הורי.`)}`,q:"q39"}
 ]},
 {id:"t6",icon:"people",title:"אבות ומטפלות",blocks:[
  {h:"הקשר לאבות",html:`<p>Sagi et al. (1985) בדקו גם את הקשר לאבות ולמטפלות. שיעור הבטוחים עם <b>האב</b> היה <mark>67%</mark>, לא נמוך מאוכלוסיות אחרות, ובלי קשר לביטחון עם האם.</p>${tiles([["check","לינה לא פגעה","הלינה המשותפת לא יצרה בעיה מיוחדת לקשר עם האב"],["split","בלי העדפה","האמהות והאבות התנהגו שונה, אבל התינוקות <b>לא העדיפו</b> הורה אחד"],["clock","יותר זמן","אבות בקיבוץ בילו יותר זמן עם התינוקות מאבות עירוניים, אבל לא היו מטפלים מקצועיים"]])}${rem("האבות היו \"מיוחסים\": היה להם זמן פנאי עם הילדים בתרבות שהעריכה מעורבות אבהית בלי לתת להם אחריות ראשית, בזמן שהמעורבות של האמהות צומצמה. החינוך הקולקטיבי תמך יותר בקשר <b>אב־ילד</b> והיה <b>עמום</b> לגבי קשר <b>אם־ילד</b>.")}`,q:"q41"},
  {h:"אחרי המעבר ללינה משפחתית",html:`<p>עם המעבר ללינה משפחתית המשפחה עברה ממודל אידיאולוגי של <b>שוויון מגדרי</b> למודל <b>מסורתי</b>: האם מבטאת חום והאב הופך לדמות סמכותית.</p>${def("הקושי של האבות",`לאבות שגדלו בעצמם בלינה משותפת היה קשה: מודלי הסמכות שלהם היו <b>המטפלות</b> ולא האבות שלהם. לכן התקשו להיות סמכותיים והביעו יותר רגשות שליליים כלפי הילדים (Plotnick, 1998).`)}`,q:"q43"},
  {h:"הקשר למטפלת בבית התינוקות",html:`${tiles([["chart","53% בטוחים","הכי נמוך, אבל דומה לשיעורים במחקרים אחרים על מטפלות"],["check","7 מתוך 83","רק 7 תינוקות היו לא בטוחים עם האם, האב <b>וגם</b> המטפלת. כלומר כמעט לכולם היה לפחות קשר בטוח אחד"],["copies","75% התאמה","כשאותה מטפלת טיפלה בשני ילדים, הסיווג שלהם היה תואם ב-75%"]])}${def("התאמה בין ילדים",`ההסבר: הייצוגים של המבוגר לגבי היקשרות מתבטאים בטיפול שלו, ולכן הוא יוצר קשרים דומים עם ילדים שונים. מחקר נוסף (Sagi et al., 1995) מצא שההתאמה הזו קיימת <b>רק בלינה המשפחתית</b>, והרבה פחות בלינה המשותפת.`)}${rem("כלומר הטיפול בלילה השפיע לא רק על הקשר לאם, אלא גם על <b>העקביות</b> של הקשרים עם המטפלות.")}`,q:"q45"}
 ]},
 {id:"t7",icon:"grad",title:"השלכות לטווח ארוך",blocks:[
  {h:"גן הילדים",html:`<p>Oppenheim, Sagi & Lamb (1988) בדקו כישורים רגשיים־חברתיים בגיל <b>5</b>. המנבא החזק ביותר היה <mark>היקשרות בטוחה למטפלת</mark> בינקות: הילד היה אמפתי, דומיננטי, עצמאי, מכוון הישגים ובעל התנהגות תכליתית.</p>${def("ספציפיות לתחום",`לא נמצא קשר לביטחון עם ההורים. הפירוש: השפעת ההיקשרות <b>ספציפית לתחום</b>. תפקוד בהקשר מסוים (בית הילדים) מנובא הכי טוב על ידי קשר שנוצר בהקשר דומה (קשר עם המטפלת בבית התינוקות).`)}`,q:"q47"},
  {h:"ארבעה מודלים",html:`<p>בסביבה של טיפול מרובה, איך מתארגנים המודלים הפנימיים של הילד? הוצעו ארבעה מודלים (van IJzendoorn, Sagi & Lambermon, 1992):</p>${fig("models")}${tiles([["target","מונוטרופיה","רק דמות אחת, בדרך כלל האם, חשובה (Bowlby, 1951)"],["pyramid","היררכיה","דמות אחת (האם) הכי חשובה, והאחרים משניים ומשמשים בסיס בטוח כשהיא לא שם"],["split","עצמאות","הילד יוצר קשרים עם כמה מטפלים, וכל אחד פועל בתחום שבו הם היו יחד"],["link","אינטגרציה","ברשת של קשרים, קשרים בטוחים מפצים על לא בטוחים, והיעדר כל קשר בטוח הוא הקשה ביותר"]])}${def("הממצא",`<b>הרשת המורחבת</b> (אם, אב ומטפלת) ניבאה הכי טוב תפקוד מתקדם בהמשך, יותר מהרשת המשפחתית או מהקשר לאם לבד. ילדים בלי אף קשר בטוח תפקדו הכי נמוך. זו תמיכה במודל <mark>האינטגרציה</mark>.`)}`,q:"q49"},
  {h:"גיל ההתבגרות המוקדם",html:`<p>ייצוגי היקשרות נוטים להיות יציבים, אבל יכולים להשתנות בעקבות <b>שינויים בסביבת הטיפול</b> או התפתחות (כמו חשיבה פורמלית). במעקב אחרי המדגם של 1985 נמצאו בין הינקות לגיל ההתבגרות:</p>${tiles([["x","גירושי הורים","17%"],["building","עזיבת הקיבוץ","11%"],["moon","סוף הלינה המשותפת","50%, עד גיל 6"]])}${def("מבחן חרדת הפרידה",`${E("SAT")} בודק אסטרטגיות התמודדות, הבעה פתוחה של פגיעות וארגון התשובות לתמונות של פרידה. רוב הילדים הראו התמודדות מסתגלת, אבל <b>לא הייתה רציפות</b> בייצוגים במשך 10 השנים מאז הינקות. ייתכן שהסיבה היא האירועים שקרו בינתיים.`)}`,q:"q51"},
  {h:"בגרות רגשית בבית הספר",html:`<p>שתי השערות מתחרות: (1) הנזק של הלינה המשותפת בולט בעיקר <b>בינקות</b>. (2) הנזק <b>לא מוגבל</b> לינקות, וחשיפה ממושכת קשורה להסתגלות נמוכה יותר בהמשך.</p>${def("התוצאה",`ההסתגלות לבית הספר (לפי המורים) הייתה קשורה לייצוגים, להיקשרות בינקות ולשינויים בסביבת הטיפול, מעבר ל-IQ ולכשירות העצמית. התמיכה הייתה ב<b>השערה 2</b>: מי שהיה בלינה משותפת <b>אחרי</b> הילדות המוקדמת דורג <b>פחות בוגר רגשית</b> בבית הספר. הנזק <b>מצטבר</b>.`)}${rem("עוד ממצא: הורים לילדים בלינה משותפת, שהילדים שלהם התמודדו פחות טוב במבחן הפרידה, נטו לראות בשינויים הרבים בטיפול השפעה <b>חיובית</b>. ייתכן שההורים היו \"עיוורים\" במידה מסוימת לקשיים, עוד סימן לכך שהלינה הפריעה ליחסי הורה־ילד.")}`,q:"q53"}
 ]},
 {id:"t8",icon:"bulb",title:"סיכום ולקחים",blocks:[

q22:{t:"t3",v:[
 {q:"באיזה מושג פסיכואנליטי השתמשו כדי לשמר את הנורמות הקולקטיביות?",a:"הגנה על הילדים מההשלכות של תסביך אדיפוס",w:["מודלים פנימיים עובדים","ביטחון מורגש","בסיס בטוח"],e:"שימוש בררני בפסיכואנליזה (Liban & Goldman, 2000)."},
 {q:"למה תורת ההיקשרות ערערה על ההצדקה להפריד בין ילדים להורים?",a:"כי היא הדגישה את הקשר המוקדם בין הורה לילד כבסיס להתפתחות האישיות",w:["כי היא טענה שהורים מזיקים","כי היא דרשה לינה משותפת","כי היא עסקה רק במבוגרים"],e:"כבר לא היה מוצדק להגן על הילדים מההורים."}]},
q23:{t:"t4",v:[
 {q:"לפי תורת ההיקשרות, מה גורם להיקשרות בטוחה?",a:"תגובה רגישה של המטפל לאותות ולצרכים של התינוק",w:["דחייה ועקביות נמוכה","מספר רב של מטפלים","שינה רחוק מההורים"],e:"(Ainsworth, 1978)."},
 {q:"מהו המנגנון שדרכו ההיקשרות עוברת מדור לדור לפי המודל?",a:"רגישות האם",w:["הגנטיקה","הלינה המשותפת","המזג של התינוק"],e:"(van IJzendoorn, 1995)."}]},
q25:{t:"t4",v:[
 {q:"מה מצאה המטא־אנליזה של De Wolff ו-van IJzendoorn (1997)?",a:"רגישות האם מרכזית לביטחון, אבל היא לא הגורם היחיד",w:["רגישות האם היא הגורם היחיד","אין קשר בין רגישות לביטחון","רק האב משפיע"],e:"לכן צריך לבחון גם גורמים אחרים."},
 {q:"לפי Belsky (1999), מה צריך לבחון כדי להבין את מה שתורם לביטחון?",a:"גם גורמים מחוץ לקשר הורה־ילד: תמיכות וסיכונים אישיים, משפחתיים וחברתיים",w:["רק את רגישות האם","רק את מזג התינוק","רק את הגנטיקה"],e:"מערכת הטיפול בהקשר שלה."}]},
q27:{t:"t4",v:[
 {q:"איזו תמיכה נתנה הלינה המשותפת להורים?",a:"תחושת שיתוף באחריות עם מבוגרים אחרים וערכים ברורים לגידול ילדים",w:["שינה טובה יותר לילדים","יותר זמן עם הילדים בלילה","מטפלת קבועה לכל ילד"],e:"(Oppenheim, 1998)."},
 {q:"מה מצאו מחקרים על השינה של ילדים בלינה משותפת?",a:"תקופות שינה רציפות קצרות יותר ויעילות שינה נמוכה יותר",w:["שינה ארוכה וטובה יותר","אין הבדל","יותר חלומות"],e:"לעומת ילדי קיבוץ בלינה משפחתית."}]},
q28:{t:"t4",v:[
 {q:"מה ההבדל בין \"מוגנים\" לבין \"ביטחון מורגש\" אצל ילדי הלינה המשותפת?",a:"הם היו מוגנים פיזית, אבל הביטחון המורגש שלהם היה שברירי",w:["הם לא היו מוגנים","הביטחון המורגש היה גבוה","אין הבדל בין המושגים"],e:"(Sroufe & Fleeson, 1986)."},
 {q:"למה התינוקות בלינה המשותפת לא יכלו ליצור קשר יציב עם שומרות הלילה?",a:"בגלל התורנות השבועית של השומרות",w:["כי השומרות היו האמהות","כי השומרות היו קבועות","כי לא היו שומרות"],e:"המבוגרים בלילה היו לרוב לא מוכרים."}]},
q29:{t:"t4",v:[
 {q:"איך פיצו חלק מההורים על הלינה המשותפת?",a:"לקחו את הילדים לישון בבית, ביקרו הרבה, או ישנו בבית הילדים",w:["העבירו את הילדים לעיר","שכרו מטפלת פרטית","לא עשו דבר"],e:"עדות לחוסן של מערכת הטיפול ההורית."},
 {q:"מה הקשר בין אוניברסליות ההיקשרות לבין תרבות?",a:"ילדים נוטים להיקשר בכל תרבות, אבל יש התאמות לנישה התרבותית",w:["ההיקשרות זהה לחלוטין בכל תרבות","אין היקשרות בתרבויות קולקטיביות","התרבות קובעת אם תהיה היקשרות"],e:"(Hinde & Stevenson-Hinde, 1990; Sagi, 1990)."}]},
q30:{t:"t4",v:[
 {q:"אילו שתי מטרות מתחרות עמדו בפני הורים בלינה המשותפת?",a:"הקושי שראו אצל הילדים, מול הדרישות של הקולקטיב והאידיאולוגיה שלו",w:["עבודה ולימודים","בריאות וכסף","חינוך דתי וחילוני"],e:"(Solomon & George, 1996)."},
 {q:"מה מראים צעדי הפיצוי של ההורים לפי המאמר?",a:"את הדומיננטיות והחוסן של מערכת הטיפול ההורית",w:["שהלינה המשותפת הייתה טובה","שההורים לא אהבו את הילדים","שהמטפלות הצליחו"],e:"גם בהקשר לא נוח."}]},
q31:{t:"t5",v:[
 {q:"מה מצאו Sagi ועמיתיו (1985) לגבי תינוקות בלינה משותפת?",a:"59% היו בטוחים עם האם, לעומת 65% עד 70% בעולם",w:["90% היו בטוחים","אף אחד לא היה בטוח","השיעור היה זהה לעולם"],e:"שיעור נמוך מהנורמה."},
 {q:"מה הסיקו מכך שרוב התינוקות בלינה משותפת כן יצרו היקשרות?",a:"שטיפול מרובה לא מונע יצירת היקשרות ולא בהכרח מהווה גורם סיכון",w:["שהלינה המשותפת מועילה","שאין צורך באם","שהמטפלות חשובות יותר מהאם"],e:"אבל השיעור הגבוה של לא בטוחים דרש הסבר."}]},
q33:{t:"t5",v:[
 {q:"מה מצא המחקר המעין־ניסויי (Sagi et al., 1994)?",a:"48% בטוחים בלינה משותפת לעומת 80% בלינה משפחתית",w:["80% בלינה משותפת ו-48% במשפחתית","אין הבדל בין הקבוצות","שתי הקבוצות 59%"],e:"80% דומה לתינוקות עירוניים בישראל ובעולם."},
 {q:"למה הסיקו שסידור הלינה הוא שגרם להבדל?",a:"כי הקבוצות היו דומות ביום, בחרדת הפרידה של האם, במזג ובמשחק אם־תינוק",w:["כי השתמשו בשיבוץ אקראי","כי האמהות דיווחו כך","כי לא בדקו גורמים אחרים"],e:"כך נשללו הסברים חלופיים."}]},
q34:{t:"t5",v:[
 {q:"איזה סוג היקשרות מתאים להיענות לא עקבית לפי איינסוורת'?",a:"אמביוולנטית",w:["נמנעת","בטוחה","מאורגנת"],e:"ביום מטפלים מוכרים, בלילה אדם לא מוכר."},
 {q:"מה יצר אצל התינוקות בלינה משותפת היענות לא עקבית?",a:"הניגוד בין מטפלים מוכרים וזמינים ביום לאדם לא מוכר בלילה",w:["אמהות לא רגישות","מטפלות קשוחות","מחסור באוכל"],e:"זה ההסבר של החוקרים."}]},
q35:{t:"t5",v:[
 {q:"מה נכון לגבי עודף האמביוולנטיים בקרב תינוקות הקיבוץ הלא בטוחים?",a:"זה מאפיין תינוקות ישראלים בכלל ולא רק קיבוץ",w:["זה ייחודי לקיבוץ","זה קיים רק בלינה משפחתית","לא היו אמביוולנטיים"],e:"(Sagi et al., 1985; Scher & Mayseless, 2000)."},
 {q:"מה מצא מחקר על סגנון היקשרות של מבוגרים שגדלו בקיבוץ (Sharabany et al., 2001)?",a:"לא נמצא קשר בין לינה משותפת או משפחתית לסגנון ההיקשרות בבגרות",w:["כל מי שגדל בלינה משותפת לא בטוח","מי שגדל בלינה משותפת בטוח יותר","המחקר לא הושלם"],e:"זו אחת הסיבות לחפש מנגנונים ספציפיים יותר."}]},
q36:{t:"t5",v:[
 {q:"כמה מהתינוקות בלינה משותפת היו בכל זאת בטוחים?",a:"כ-50%",w:["כ-10%","כ-90%","אף אחד"],e:"למרות התנאים הקשים."},
 {q:"מה עשו החוקרים אחרי שראו שכמחצית מהתינוקות בטוחים?",a:"חיפשו גורמים ספציפיים יותר אצל האם, התינוק והאינטראקציה",w:["הפסיקו את המחקר","הכריזו שאין בעיה","בדקו רק את המטפלות"],e:"ומכאן המחקרים על העברה ואינטראקציה."}]},
q37:{t:"t5",v:[
 {q:"מה נמצא לגבי העברה בין־דורית בלינה המשותפת?",a:"היא הייתה חלשה: 40% התאמה לעומת 76% בלינה משפחתית",w:["היא הייתה חזקה יותר","היא הייתה זהה","היא לא נבדקה"],e:"(Sagi et al., 1997)."},
 {q:"האם אמהות בלינה המשותפת היו פחות אוטונומיות (בטוחות) לפי ה-AAI?",a:"לא, 65% לעומת 72%, שיעור דומה",w:["כן, הרבה פחות","כן, אף אחת לא הייתה אוטונומית","הן היו אוטונומיות יותר"],e:"ההבדל היה בהעברה, לא בייצוג של האם."}]},
q38:{t:"t5",v:[
 {q:"למה ממצא ההעברה החלשה לא מאפשר מסקנה סיבתית על חוסר הביטחון?",a:"כי מספר האמהות הבטוחות עם תינוקות לא בטוחים היה דומה למספר הלא בטוחות עם תינוקות בטוחים",w:["כי לא היה מספיק משתתפים","כי לא השתמשו ב-AAI","כי כל התינוקות היו בטוחים"],e:"לכן בדקו את האינטראקציה."},
 {q:"מה שיעור ההתאמה בין דורות שנמצא במחקרים במערב?",a:"כ-75%",w:["כ-25%","כ-50%","100%"],e:"וגם במחקר יפני."}]},
q39:{t:"t5",v:[
 {q:"איך נבדקה האינטראקציה אם־תינוק אחרי שהלינה המשותפת בוטלה?",a:"קידוד מחדש של נתוני משחק ישנים בסולמות הזמינות הרגשית",w:["ניסוי חדש עם לינה משותפת","שאלונים לילדים","ראיונות עם מטפלות"],e:"אי אפשר היה לאסוף נתונים חדשים."},
 {q:"מה נמצא לגבי רגישות האם וביטחון התינוק?",a:"הם היו קשורים רק בלינה המשפחתית, ולא בלינה המשותפת",w:["הם היו קשורים בשתי הקבוצות","הם לא היו קשורים בשתי הקבוצות","הם היו קשורים רק בלינה המשותפת"],e:"וזה למרות שהאמהות היו רגישות באותה מידה."}]},
q40:{t:"t5",v:[
 {q:"איך מסבירים שרגישות האם לא הייתה קשורה לביטחון בלינה המשותפת?",a:"חוסר הנגישות של האם בלילה גבר על האינטראקציות ביום ושינה את המשמעות של הרגישות",w:["האמהות לא היו רגישות","התינוקות לא אהבו את האמהות","לא נמדדה רגישות"],e:"הסביבה פעלה כחיץ (Cowan, 1997)."},
 {q:"למה הסבר של \"רגישות נמוכה של האם\" לא מתאים לפי המאמר?",a:"כי אמהות התינוקות בלינה משותפת לא היו פחות רגישות ולא פחות אוטונומיות",w:["כי לא בדקו אמהות","כי כל האמהות היו לא רגישות","כי הרגישות לא קשורה להיקשרות"],e:"לכן צריך הסבר ברמת הסביבה."}]},
q41:{t:"t6",v:[
 {q:"מה היה שיעור הבטוחים עם האב בלינה המשותפת?",a:"67%, לא נמוך מאוכלוסיות אחרות",w:["30%","48%","90%"],e:"ובלי קשר לביטחון עם האם."},
 {q:"מה נמצא לגבי העדפה של תינוקות הקיבוץ להורה מסוים?",a:"הם לא העדיפו הורה אחד, בניגוד לתינוקות בתרבויות אחרות",w:["הם העדיפו את האם","הם העדיפו את האב","הם העדיפו את המטפלת"],e:"(Sagi, Lamb, Shoham et al., 1985)."}]},
q42:{t:"t6",v:[
 {q:"למה אבות בקיבוץ היו \"מיוחסים\" לפי המאמר?",a:"היה להם זמן פנאי עם הילדים בתרבות שהעריכה מעורבות אבהית בלי לתת להם אחריות ראשית",w:["כי הם היו מטפלים מקצועיים","כי הם לא עבדו","כי הילדים גרו איתם"],e:"בזמן שמעורבות האמהות צומצמה."},
 {q:"על איזה קשר החינוך הקולקטיבי היה \"עמום\" לפי המאמר?",a:"על הקשר אם־ילד",w:["על הקשר אב־ילד","על הקשר עם המטפלת","על הקשר בין ילדים"],e:"והוא תמך יותר בקשר אב־ילד."}]},
q43:{t:"t6",v:[
 {q:"איזה מודל משפחתי הופיע אחרי המעבר ללינה משפחתית?",a:"מודל מסורתי: האם מבטאת חום והאב דמות סמכותית",w:["מודל של שוויון מגדרי מלא","מודל שבו המטפלת סמכותית","מודל בלי סמכות"],e:"מעבר מהמודל האידיאולוגי."},
 {q:"למה אבות שגדלו בעצמם בלינה משותפת התקשו בתפקיד הסמכותי?",a:"כי מודלי הסמכות שלהם היו המטפלות ולא האבות שלהם",w:["כי הם לא רצו ילדים","כי הם עבדו רחוק","כי הנשים סירבו"],e:"והם הביעו יותר רגשות שליליים (Plotnick, 1998)."}]},
q45:{t:"t6",v:[
 {q:"מה היה שיעור הבטוחים עם המטפלת?",a:"53%, הנמוך ביותר, אבל דומה למחקרים אחרים על מטפלות",w:["80%","67%","20%"],e:"(Goossens & van IJzendoorn, 1990)."},
 {q:"כמה תינוקות היו לא בטוחים עם האם, האב וגם המטפלת?",a:"7 מתוך 83",w:["40 מתוך 83","אף אחד","כולם"],e:"כמעט לכולם היה קשר בטוח אחד לפחות."}]},
q46:{t:"t6",v:[
 {q:"מה נמצא כשאותה מטפלת טיפלה בשני ילדים?",a:"75% התאמה בסיווג ההיקשרות שלהם",w:["אין שום התאמה","100% התאמה תמיד","התאמה רק אצל בנים"],e:"הייצוגים של המבוגר מתבטאים בטיפול שלו."},
 {q:"מה מצא המחקר של Sagi et al. (1995) על ההתאמה בין ילדים של אותה מטפלת?",a:"היא קיימת בלינה המשפחתית והרבה פחות בלינה המשותפת",w:["היא גבוהה יותר בלינה המשותפת","היא זהה בשתי הקבוצות","היא לא קיימת בכלל"],e:"הטיפול בלילה השפיע גם על עקביות הקשרים עם המטפלות."}]},
q47:{t:"t7",v:[
 {q:"מה ניבא הכי טוב כישורים רגשיים־חברתיים בגן (גיל 5)?",a:"היקשרות בטוחה למטפלת בינקות",w:["היקשרות בטוחה לאם","היקשרות בטוחה לאב","IQ בגיל שנה"],e:"(Oppenheim, Sagi & Lamb, 1988)."},
 {q:"מה המשמעות של \"ספציפיות לתחום\" בהקשר של מחקר הגן?",a:"תפקוד בהקשר מסוים מנובא הכי טוב על ידי קשר שנוצר בהקשר דומה",w:["כל קשר מנבא כל תחום","רק הקשר לאם חשוב","תחום הלימודים לא קשור להיקשרות"],e:"הגן דומה לבית הילדים, שם נוצר הקשר עם המטפלת."}]},
q49:{t:"t7",v:[
 {q:"מה טוען מודל האינטגרציה?",a:"ברשת של קשרים, קשרים בטוחים מפצים על לא בטוחים, והיעדר כל קשר בטוח הוא הקשה ביותר",w:["רק האם חשובה","האם ראשית והשאר משניים","כל קשר פועל רק בתחום שלו"],e:"זה המודל שקיבל תמיכה."},
 {q:"איזה ממצא תמך במודל האינטגרציה?",a:"הרשת המורחבת (אם, אב ומטפלת) ניבאה הכי טוב תפקוד מתקדם",w:["הקשר לאם לבד ניבא הכי טוב","אף קשר לא ניבא תפקוד","רק הקשר לאב ניבא"],e:"ילדים בלי אף קשר בטוח תפקדו הכי נמוך."}]},
q50:{t:"t7",v:[
 {q:"מה טוען מודל המונוטרופיה?",a:"רק דמות אחת, בדרך כלל האם, היא דמות היקשרות חשובה",w:["כל המטפלים חשובים באותה מידה","קשרים בטוחים מפצים על לא בטוחים","כל קשר פועל בתחום שלו"],e:"(Bowlby, 1951)."},
 {q:"מה טוען מודל ההיררכיה?",a:"דמות אחת הכי חשובה, והאחרים משמשים בסיס בטוח משני כשהיא לא שם",w:["אין דמות מרכזית","רק המטפלת חשובה","הקשרים לא משפיעים זה על זה"],e:"(Bowlby, 1982)."}]},
q51:{t:"t7",v:[
 {q:"מה מצא מבחן חרדת הפרידה (SAT) בגיל ההתבגרות המוקדם?",a:"התמודדות מסתגלת ברובה, אבל בלי רציפות בייצוגים מאז הינקות",w:["רציפות מלאה מאז הינקות","כל הילדים חרדים מאוד","המבחן לא הושלם"],e:"ייתכן שבגלל אירועים שקרו בינתיים."},
 {q:"כמה מהילדים עברו את סוף הלינה המשותפת עד גיל 6?",a:"50%",w:["17%","11%","90%"],e:"17% חוו גירושים ו-11% עזבו את הקיבוץ."}]},
q53:{t:"t7",v:[
 {q:"איזו השערה נתמכה לגבי ההשפעה ארוכת הטווח של הלינה המשותפת?",a:"הנזק לא מוגבל לינקות: חשיפה אחרי הילדות המוקדמת קשורה לבגרות רגשית נמוכה בבית הספר",w:["הנזק קיים רק בינקות","אין שום השפעה ארוכת טווח","הלינה המשותפת שיפרה את ההישגים"],e:"הנזק מצטבר."},
 {q:"מה מעיד הממצא על הורים שראו בשינויים בטיפול השפעה חיובית?",a:"ייתכן שההורים היו \"עיוורים\" במידה מסוימת לקשיים של הילדים",w:["שהשינויים באמת היו טובים","שהילדים התמודדו מצוין","שההורים לא השתתפו"],e:"עוד סימן להפרעה ביחסי הורה־ילד."}]},
q55:{t:"t8",v:[
 {q:"מה המאמר מדגיש לגבי היקף המסקנות שלו?",a:"הן נוגעות רק ללינה המשותפת, לא לחינוך הקיבוצי כולו",w:["הן נוגעות לכל חינוך קולקטיבי","הן נוגעות לכל המוסדות","הן נוגעות רק לאבות"],e:"זו הסתייגות מפורשת במאמר."},
 {q:"מה הזהיר בולבי אחרי ביקורו בקיבוצים בשנות ה-50?",a:"שהשיטה, אף שאינה טיפול מוסדי, עלולה ליצור יותר חוסר ביטחון בהיקשרות",w:["שהשיטה מושלמת","שאין צורך באמהות","שהקיבוצים צריכים להיסגר"],e:"(Bowlby, 1953)."}]},
q57:{t:"t8",v:[
 {q:"למה הלינה המשותפת היא לא חסך אימהי לפי המאמר?",a:"כי אף ילד שנבדק לא סווג כחסר היקשרות, אלא שהיחסים עם האם הסתבכו",w:["כי האמהות ישנו עם הילדים","כי כל הילדים היו בטוחים","כי לא היו אמהות בקיבוץ"],e:"היא סיבכה את יחסי האם והתינוק."},
 {q:"מה הראה סיום הלינה המשותפת לפי המאמר?",a:"את גבולות ההסתגלות של הורים וילדים להסדרי טיפול מלאכותיים",w:["שהקיבוץ נכשל כלכלית","שאין צורך בתורת ההיקשרות","שילדים מסתגלים לכל הסדר"],e:"הלינה המשותפת לא התקיימה באף תרבות אחרת."}]},
q58:{t:"t8",v:[
 {q:"למה לפי המאמר תינוקות פגיעים יותר בלינה משותפת פיתחו היקשרות חרדה?",a:"חוסר הנגישות של האם בלילה לא פוצה על ידי המפגשים ביום עם אם רגישה",w:["האמהות שלהם לא היו רגישות","הם לא ראו את האמהות בכלל","המטפלות היו קשוחות"],e:"זה ההסבר בסיכום."},
 {q:"מה אולי מנע מהורים רבים לנקוט צעדי פיצוי?",a:"מעמד הנורמה של הלינה המשותפת",w:["מחסור בכסף","איסור חוקי","חוסר עניין בילדים"],e:"הנורמה הקהילתית הקשתה."}]},
q59:{t:"t8",v:[
 {q:"מה הלקח לגבי העברה בין־דורית של הורות?",a:"היא נקטעה פעמיים, והורות קשה מכדי \"להמציא\" אותה מחדש בכל דור",w:["אין צורך במודלים הוריים","הורות נלמדת רק מספרים","ההעברה התחזקה בקיבוץ"],e:"פעם כשהלינה הונהגה ופעם כשבוטלה."},
 {q:"מה \"השורה התחתונה\" של המאמר?",a:"הניסוי נועד להיכשל כי הפעיל ציוויים חברתיים־תרבותיים שמנוגדים לצרכים אנושיים בסיסיים",w:["הניסוי הצליח ונגמר מסיבות כלכליות","הניסוי נכשל בגלל המטפלות","הניסוי עדיין נמשך"],e:"כך מסתיים המאמר."}]},
q60:{t:"t8",v:[
 {q:"מה המאמר מציע לחקור בהקשר של תרבות, סיכון וחוסן?",a:"מנהגים שבהם הצרכים הרגשיים של ילדים מתעוררים אבל לא מקבלים מענה",w:["רק קיבוצים","רק מוסדות","רק ילדים מבוגרים"],e:"(Oppenheim, 1998)."},
 {q:"מה עדיין לא ברור לגבי כמחצית הילדים שהיו בטוחים למרות הלינה?",a:"אם זה בזכות היכולת של חלק מהאמהות להעניק תחושת הגנה, או בזכות מערכת התמיכה",w:["אם הם באמת היו בטוחים","אם הם גרו בקיבוץ","אם הם השתתפו במחקר"],e:"המאמר קורא למחקר נוסף בתרבויות אחרות."}]}
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  if(blk.q)slot.appendChild(qCard(blk.q,next,"בדיקה קצרה"));
  else{const b=document.createElement("button");b.className="primary";b.textContent="המשך";b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
