const T=[
 {id:"t1",icon:"leaf",title:"מבוא: ניסוי של הטבע",blocks:[
  {h:"על מה המאמר",html:`${def("על מה הנושא",`בקיבוצים, תינוקות ישנו בלילה בבית ילדים ולא אצל ההורים. המאמר רואה בזה "ניסוי של הטבע" שבוחן את תורת ההיקשרות.<br><b>מה נלמד כאן:</b> הטענה המרכזית · מבחן מחמיר · מהו קיבוץ`)}<p>המאמר משלב מחקרים על <b>היקשרות</b> של ילדים שגדלו בקיבוץ עם סקירה <b>חברתית־היסטורית</b> של היחסים בין המשפחה לקולקטיב. הוא משתמש ב<mark>תורת המערכות</mark> ${E("Systems theory")} כדי להעריך את השינויים בגידול הילדים, ומתמקד ב<mark>לינה המשותפת</mark> ${E("Communal sleeping")}: ילדים ותינוקות שישנו בלילה רחוק מההורים.</p>${tiles([["link","היקשרות","להורים ולמטפלות"],["copies","העברה בין־דורית","של דפוסי היקשרות"],["grad","כשירות בבית הספר","בהמשך החיים"]])}${def("הטענה המרכזית",`הלינה המשותפת הייתה <b>"ניסוי חברתי של הטבע"</b> ייחודי, שמנקודת המבט של תורת ההיקשרות <b>נועד להיפסק</b>, כי הוא בגד בצורכי ההיקשרות הבסיסיים של רוב ההורים והילדים.`)}`,q:"q1"},
  {h:"למה זה מבחן חזק לתורת ההיקשרות",html:`<p>הרעיונות של בולבי על סיכונים התפתחותיים נולדו מעבודה עם ילדים בסביבות של מחסור וטיפול מקוטע. אבל בסביבות כאלה (ילדים שעברו התעללות, יתומים) יש גם גורמי סיכון נוספים, כמו <b>מצב חברתי־כלכלי נמוך</b> ו<b>בריאות לקויה</b>, וקשה להפריד ביניהם.</p>${def("מבחן מחמיר יותר",`לבדוק היקשרות אצל ילדים <b>רגילים ובריאים</b>, ממשפחות <b>מתפקדות</b>, שחוו תנאי גידול <b>מקוטעים</b>. זה בדיוק הקיבוץ עם הלינה המשותפת, "ניסוי חברתי של הטבע" (Beit-Hallahmi & Rabin, 1977).`)}${rem("הלינה המשותפת יצרה לילדים רגילים סביבה שדומה יותר ל<b>מוסד</b> מאשר לבית: מעט מבוגרים שאינם הורים, שמטפלים בהרבה ילדים, בסביבה מאורגנת מאוד. וזה בקהילות שתוארו כמכוונות מאוד לילדים.")}`,q:"q3"},
  {h:"מהו קיבוץ",html:`${tiles([["leaf","ניסוי אוטופי","אחד הניסויים האוטופיים המעטים שהצליחו ליצור דרך חיים וגידול ילדים שונה לגמרי, במשך 80 עד 90 שנה"],["people","קהילה שיתופית","שיתופית, דמוקרטית, רב־דורית, 400 עד 900 איש בממוצע. כיום רק כ-1.5% מהאוכלוסייה היהודית בישראל"],["factory","כלכלה","בעבר חקלאית ומבודדת בתנאים קשים מאוד. היום תעשייה וחקלאות, ורמת חיים משביעת רצון"]])}<p>כל קיבוץ אוטונומי כלכלית וחברתית, אבל שייך לתנועה הקיבוצית המאוחדת. אחרי <b>משבר כלכלי גדול בשנות ה-80</b> חלו שינויים בכל תחומי החיים בקיבוץ (Ben-Rafael, 1999).</p>${rem("המאמר <b>לא</b> מנסה לסכם את כל החינוך הקיבוצי. הוא מתמקד בלינה המשותפת, שהייתה נהוגה כ-60 עד 70 שנה עד שהקיבוצים ביטלו אותה בשנות ה-90.")}`,q:"q5"}
 ]},
 {id:"t2",icon:"building",title:"היסטוריה: עלייתה ונפילתה של הלינה המשותפת",blocks:[
  {h:"החלוצים והקולקטיב",html:`${def("על מה הנושא",`איך נוצרה הלינה המשותפת, ואיך היא נעלמה? הנושא עובר על ההיסטוריה שלה.<br><b>מה נלמד כאן:</b> הקולקטיב מול המשפחה · הורה קולקטיבי · בית הילדים · הנפילה`)}<p>החלוצים היו צעירים אידיאליסטים שדחו את התרבות של יהודי מזרח אירופה ורצו ליצור חברה חדשה על בסיס <b>סוציאליסטי וציוני</b>: עבודה פיזית, ייצור, עצמאות לאומית ואישית ושוויון מלא.</p>${def("המתח בין הקולקטיב למשפחה",`המשפחה נתפסה כ<b>כוח מתחרה</b> שעלול להחליש את ההזדהות עם הקולקטיב ואת השליטה הלא פורמלית שלו בחברים (Talmon, 1972).`)}${tiles([["building","בית הלבנים היחיד","הילדים גרו בבניין הלבנים היחיד בקיבוץ ומעולם לא רעבו, בזמן שהמבוגרים גרו באוהלים והאוכל שלהם הוקצב"],["target","מטרות הקולקטיב","להחליש אינדיבידואליזם, לבטל אי־שוויון מגדרי, ולגדל יהודי חדש: בריא, חסון, יצרני וחברתי"]])}`,q:"q7"},
  {h:"\"הורה קולקטיבי\"",html:`<p>הקהילה נתפסה כ<mark>"הורה קולקטיבי"</mark> ${E("Collective parent")} שמחויב ישירות לכל צורכי הילד, בלי תיווך של המשפחה: אוכל, ביגוד, טיפול רפואי ורווחה נפשית. כל ילד היה במובן מסוים "ילד של הקיבוץ".</p>${yn(["לא הייתה אידיאולוגיה לבטל את המשפחה","במובן הנפשי המשפחה תמיד הייתה נוכחת"],["המגבלות על ההורות שיקפו חוסר אמון ביכולת ההורים לגדל ילדים"])}${rem(`פרשנויות <b>פסיכואנליטיות</b>, שהדגישו את ההשפעה ה"פתוגנית" האפשרית של ההורים, שימשו להצדקת חלוקת הטיפול בין הורים למטפלות ולמגורים הנפרדים של הילדים.`)}`,q:"q9"},
  {h:"בית הילדים והלילה",html:`<p>בתי הילדים תפקדו כמו <b>בית</b> כמעט בכל דבר: שם הילדים בילו את רוב הזמן, אכלו, התרחצו וישנו. היה שטח למשחק ולמידה, פינת אוכל, מקלחות וחדרי שינה לשלושה או ארבעה ילדים.</p>${tiles([["people","זמן משפחה","בדירת ההורים, אחר הצהריים והערב (בערך 4 עד 8)"],["moon","שתי שומרות לילה","אחראיות על כל ילדי הקיבוץ מתחת לגיל 12, דרך אינטרקום וסיבובים"],["clock","תורנות שבועית","רבות מהשומרות לא היו מוכרות לילדים, והן התחלפו כל שבוע"]])}${rem("ההורים השכיבו את הילדים, אבל בלילה נשארו רק השומרות. אולי זה הספיק לבטיחות, אבל השאיר לילדים <b>תחושת ביטחון שברירית ומוגבלת</b>: התורנות השבועית כמעט מנעה היענות רגישה לצורכי הילדים.")}`,q:"q11"},
  {h:"מאיפה זה הגיע",html:`${def("נתון חשוב",`רבות מהתרבויות נוהגות ב<b>טיפול מרובה</b> ${E("Multiple caregiving")}, אבל בדגימה עולמית של <b>183 חברות</b> אף אחת לא נהגה ששתינוקות וילדים צעירים ישנו רחוק מההורים (Barry & Paxton, 1971).`)}<p>על הלינה המשותפת התווכחו כבר בשנים 1920 עד 1930, ו<b>ארבעת הקיבוצים הראשונים</b> תמיד נשארו עם לינה משפחתית. היא הפכה לנורמה רק מאוחר יותר, עם עולים סוציאליסטים נלהבים שהעדיפו את טובת הקולקטיב על צורכי הפרט והמשפחה (Dror, 2001).</p>${rem("הלינה המשותפת חיזקה את הנטייה הקולקטיבית כי הקטינה מאוד את ההשפעה של המשפחה, והייתה לה השפעה מזיקה במיוחד על <b>המעורבות של האמהות</b> (Dar, 1998).")}`,q:"q13"},
  {h:"הנפילה",html:`<p>אחרי כ-20 שנה שבהן עמדו במרכז נושאים לאומיים ושל הישרדות, בשנות ה-50 נשמעו ספקות קולניים, יחד עם עלייה ב<mark>מגמות משפחתיות</mark> ${E("Familism")}. ההורים לקחו יותר חלק בטיפול, ויותר קיבוצים עברו ללינה משפחתית.</p>${def("הסוף",`התהליך הגיע לשיאו ב<b>מלחמת המפרץ (1991)</b>, כשכמעט כל הקיבוצים שעוד נהגו בלינה משותפת עברו מרצונם ללינה משפחתית.`)}${tiles([["building","שגשוג כלכלי","שיפור בדירות המשפחה"],["leaf","היחלשות האידיאולוגיה","אצל החברים הצעירים (Lavi, 1990)"],["lock","צורך בפרטיות","ובאינטימיות, והגנה מפני לחץ הקולקטיב (Nathan, 1999)"],["people","נשים","השקיעו יותר באמהות, והיו <b>המובילות</b> של המאבק לשינוי הלינה"]])}${rem("עם המגמות המשפחתיות, המאבק לשוויון בין גברים לנשים נדחק לרקע.")}`,q:"q15"}
 ]},
 {id:"t3",icon:"cycle",title:"מבט מערכתי: יציבות ושינוי",blocks:[
  {h:"עקרונות תורת המערכות",html:`${def("על מה הנושא",`הקיבוץ כמערכת: למה השינוי היה כל כך איטי, ואיך הוא בסוף קרה?<br><b>מה נלמד כאן:</b> מערכת · מערכת פתוחה · הומאוסטזיס · גבולות חדשים`)}${def("מערכת",`שלם מאורגן של רכיבים תלויים זה בזה, עם דפוסי השפעה <b>הדדיים</b>. מערכות נוטות לשמור על <mark>יציבות והומאוסטזיס</mark> ${E("Homeostasis")}, אבל יכולות להיות <b>פתוחות לשינוי</b> בתגובה למידע חדש. הן מווסתות את עצמן דרך המשחק בין שני התהליכים (Minuchin, 1985).`)}<p>אפשר לראות את התפתחות החינוך הקיבוצי כמשחק הדדי בין <b>רציפות לשינוי</b>, שמופיע גם בקונפליקט בין שימור המסורת הקיבוצית לבין עידוד חדשנות ורפורמה חברתית.</p>${ex(`<b>מערכת</b>: כמו משפחה. אם אבא מאבד את העבודה, זה משפיע על אמא, על הילדים ועל מצב הרוח של כולם. אי אפשר להבין חלק אחד בלי האחרים.`)}`,q:"q17"},
  {h:"הקיבוץ כמערכת פתוחה",html:`<p>עוד לפני שאיכות הטיפול הלא אימהי נעשתה נושא מקצועי, היו שיפורים מבניים: סביבה פיזית איכותית, <b>קבוצות קטנות</b> ויחס טוב בין מטפלת לילדים. אחרי מלחמת העולם השנייה ומלחמת העצמאות, הדרישה של האמהות לקחת חלק גדול יותר התחברה לשינויים פנימיים ולתיאוריות פסיכולוגיות על נזקי <b>חסך אימהי</b>.</p>${tiles([["sprout","מבית החולים הביתה","התינוקות הובאו לבית ההורים ולא לבית התינוקות"],["people","ביקורים וזמן משפחה","ביקורי הורים התקבלו בברכה, וזמן המשפחה הוארך עד ההשכבה"],["clock","ארוחות וסופי שבוע","ארוחת ערב בחדר האוכל, וסופי שבוע וחגים עם המשפחה"]])}${def("הומאוסטזיס",`הקצב <b>האיטי</b> של השינויים (20 עד 50 שנה) מעיד על נטיות הומאוסטטיות. לפי Kaffman (1993), הגדלת זמן המשפחה הייתה <b>פשרה</b> שנועדה לבלום את הדרישה ללינה משפחתית ולשמור על הלינה הנפרדת.`)}${ex(`<b>הומאוסטזיס</b>: כמו מזגן שמחזיר את החדר לאותה טמפרטורה. גם אם יש לחץ לשינוי, המערכת "מושכת" חזרה למצב המוכר.`)}`,q:"q19"},
  {h:"מפסיכואנליזה להיקשרות",html:`<p>כדי לשמר את הנורמות, התמקדו באופן <b>בררני</b> במושגים פסיכואנליטיים, כמו הגנה על הילדים מההשלכות של <b>תסביך אדיפוס</b>. הופעת <mark>תורת ההיקשרות</mark> סימנה את תחילת השינוי (Berman, 1988).</p>${rem("תורת ההיקשרות הדגישה את חשיבות הקשר המוקדם בין הורה לילד כבסיס להתפתחות האישיות. לכן כבר לא היה מוצדק לראות בילדים מי שצריך להגן עליהם מפני ה\"פתולוגיה\" של ההורים.")}${def("גבולות חדשים",`במקום <b>תת־מערכות נפרדות</b> של מבוגרים ושל ילדים, שבהן כל המבוגרים חולקים אחריות לכל הילדים, הקיבוץ התארגן מחדש ב<b>משפחות</b>: תת־מערכות של הורים וילדים יחד.`)}`,q:"q21"}
 ]},
 {id:"t4",icon:"link",title:"מבט של תורת ההיקשרות",blocks:[
  {h:"עקרונות תורת ההיקשרות",html:`${def("על מה הנושא",`מה תורת ההיקשרות הייתה צופה? הנושא מציג את העקרונות שלה, ומה בלינה המשותפת עזר או הפריע.<br><b>מה נלמד כאן:</b> קשר היקשרות · מעבר לרגישות · ביטחון מורגש · אוניברסליות`)}${def("קשר היקשרות",`קשר ארוך טווח שמתפתח בשנה הראשונה, כלפי <b>אנשים ספציפיים</b> שמטפלים בילד. הביטחון שלו תלוי ב<b>איכות הטיפול</b> (Bowlby, 1982).`)}${tiles([["check","תגובה רגישה","תגובה רגישה לאותות ולצרכים יוצרת ביטחון בזמינות המטפל → היקשרות בטוחה"],["x","דחייה וחוסר עקביות","דחייה וטיפול לא עקבי קשורים להיקשרות לא בטוחה (Ainsworth, 1978)"],["copies","העברה בין־דורית","רגישות האם היא המנגנון שדרכו ההיקשרות עוברת מדור לדור (van IJzendoorn, 1995)"]])}${rem("אופי ההיענות של האם נקבע לפי ה<b>מודלים הפנימיים העובדים</b> שלה. אמהות עם מודלים לא בטוחים נוטות לאסטרטגיות הורות פחות יעילות.")}`,q:"q23"},
  {h:"לא רק רגישות",html:`<p>מערכת ההיקשרות של התינוק ומערכת הטיפול של המבוגר <b>משלימות</b> זו את זו. מטא־אנליזה (De Wolff & van IJzendoorn, 1997) מצאה שרגישות האם <b>מרכזית</b> לביטחון, אבל היא לא הגורם היחיד.</p>${def("Belsky (1999)",`כדי להבין מה תורם לביטחון, צריך לבחון גם גורמים <b>מחוץ</b> לקשר הורה־ילד: את מערכת הטיפול בהקשר של תמיכות וסיכונים אישיים, משפחתיים וחברתיים.`)}`,q:"q25"},
  {h:"תמיכות ומכשולים בלינה המשותפת",html:`${tiles([["check","תמיכות","תחושת שיתוף באחריות עם מבוגרים אחרים, וערכים ברורים לגבי גידול ילדים. שימושי להורים חסרי ניסיון בלי הדרכה ממבוגרים (Oppenheim, 1998)"],["x","מכשולים","בלילה התינוקות היו עם מבוגרים לא מוכרים שלא יכלו להגיב מהר. בגלל התורנות השבועית לא יכלו להיווצר קשרים יציבים"]])}${def("ביטחון מורגש",`הילדים אולי היו <b>מוגנים</b> בבית הילדים, אבל <mark>הביטחון המורגש</mark> ${E("Felt security")} שלהם היה שברירי, עם מעט אמון בזמינות ההורים (Sroufe & Fleeson, 1986).`)}${ex("זיכרונות אוטוביוגרפיים תיארו את הלילות כקשים. מחקרים מצאו אצל ילדים בלינה משותפת <b>תקופות שינה רציפות קצרות יותר</b> ו<b>יעילות שינה נמוכה יותר</b> לעומת ילדי קיבוץ בלינה משפחתית.")}${ex(`<b>ביטחון מורגש</b>: תינוק יכול להיות מוגן לגמרי בפועל (יש שומרת לילה), ועדיין לא <b>להרגיש</b> בטוח, כי מי שהוא סומך עליה לא שם כשהוא מתעורר.`)}`,q:"q27"},
  {h:"ההורים",html:`<p>גם הורים רבים חוו תסכול וכאב בגלל הפרידה מהילדים. הם היו צריכים לאזן בין <b>שתי מטרות מתחרות</b>: הקושי שהם ראו אצל הילדים, מול הדרישות של הקולקטיב והאידיאולוגיה החינוכית שלו.</p>${tiles([["moon","לקחו הביתה","חלק מההורים לקחו את הילדים לישון בבית"],["building","ביקרו הרבה","ביקרו בבית הילדים לעתים קרובות"],["people","ישנו שם","או אפילו ישנו בעצמם בבית הילדים כל הלילה"]])}${rem("הצעדים האלה הם עדות ל<b>דומיננטיות ולחוסן</b> של מערכת הטיפול ההורית, גם בהקשר לא נוח.")}${def("אוניברסליות",`ילדים בכל תרבות נוטים להיקשר. אבל האוניברסליות לא אומרת חוסר רגישות לתרבות: הפרספקטיבה האבולוציונית מאפשרת התאמות לנישה התרבותית (Hinde & Stevenson-Hinde, 1990; Sagi, 1990).`)}`,q:"q29"}
 ]},
 {id:"t5",icon:"chart",title:"מחקרי ההיקשרות לאם",blocks:[
  {h:"האם בכלל נוצרה היקשרות?",html:`${def("על מה הנושא",`הממצאים על הקשר לאם: כמה ילדים היו בטוחים, והאם הלינה היא הסיבה.<br><b>מה נלמד כאן:</b> Sagi 1985 · שלילת הסברים חלופיים · העברה בין־דורית · אינטראקציה`)}<p>מחקרים מוקדמים מצאו שהגידול הקולקטיבי <b>לא פגע בעוצמת ההיקשרות</b> להורים, ורק אפשר לילדים ליצור קשרים נוספים (Fox, 1977). אבל השיטות אז לא אפשרו לבדוק ביטחון.</p>${def("Sagi et al. (1985)",`בעזרת <mark>המצב הזר</mark> נמצא שרק <b>59%</b> מתינוקות הקיבוץ בלינה משותפת היו בטוחים עם האם, לעומת <b>65% עד 70%</b> בדגימות נורמטיביות בעולם.`)}${rem("המסקנה: טיפול מרובה <b>לא מונע</b> יצירת היקשרות ולא בהכרח מהווה גורם סיכון. אבל שיעור הלא בטוחים הגבוה הצריך לברר מה גורם לביטחון ולחוסר ביטחון.")}`,q:"q31"},
  {h:"הלינה היא הגורם",html:`<p>מחקר <b>מעין־ניסויי</b> (Sagi et al., 1994) השווה זוגות אם־תינוק מקיבוצים עם לינה משותפת וקיבוצים עם לינה משפחתית:</p>${fig("rates","אחוז התינוקות הבטוחים עם האם")}${def("שלילת הסברים חלופיים",`הקבוצות היו <b>דומות</b> באקולוגיה של בית הילדים ביום, בחרדת הפרידה של האם, במזג התינוק ובמשחק אם־תינוק. לכן הסיקו ש<b>סידור הלינה</b> אחראי לשיעור הגבוה של חוסר ביטחון.`)}${rem("ההסבר: <b>היענות לא עקבית</b>. ביום מטפלים מוכרים וזמינים, ובלילה אדם לא מוכר שיכולת ההיענות שלו מוגבלת. היענות לא עקבית היא גורם מוכר להיקשרות <b>אמביוולנטית</b>.")}`,q:"q33"},
  {h:"הסתייגויות",html:`${tiles([["chart","אמביוולנטי מול נמנע","בין הלא בטוחים בקיבוץ היו יותר אמביוולנטיים ופחות נמנעים מהממוצע העולמי, אבל זה מאפיין תינוקות <b>ישראלים</b> בכלל ולא רק קיבוץ"],["check","כמחצית בטוחים","כ-50% מהתינוקות בלינה משותפת היו בטוחים למרות התנאים"],["people","מבוגרים","מחקר על סגנון היקשרות בדיווח עצמי לא מצא קשר בין לינה משותפת או משפחתית לסגנון בבגרות (Sharabany et al., 2001)"]])}${rem("לכן היה צורך להבין תהליכים <b>ספציפיים</b> יותר: גורמים אצל האם, אצל התינוק, ובאינטראקציה ביניהם.")}`,q:"q35"},
  {h:"העברה בין־דורית",html:`<p><mark>העברה בין־דורית</mark> ${E("Intergenerational transmission")}: הייצוגים של ההורה לגבי חוויות ההיקשרות שלו משפיעים על ההורות שלו ועל ההיקשרות של הילד אליו. במחקרים במערב (וגם ביפן) נמצאה <b>כ-75% התאמה</b> בין סיווג התינוק לסיווג ההורה.</p>${sleepTable}${def("הממצא",`האמהות היו <b>אוטונומיות</b> (בטוחות) בשיעור דומה בשני סוגי הקיבוצים, אבל ההעברה הייתה <b>חלשה</b> בלינה המשותפת: 40% לעומת 76%. כלומר ההעברה של המודל הפנימי של ההורה להורות שלו <b>הופרעה</b> (Sagi et al., 1997).`)}${rem("אבל אי אפשר להסיק מכאן סיבתיות: מספר האמהות הבטוחות עם תינוקות לא בטוחים היה דומה למספר האמהות הלא בטוחות עם תינוקות בטוחים. לכן בדקו את האינטראקציה עצמה.")}`,q:"q37"},
  {h:"אינטראקציה אם־תינוק",html:`<p>אחרי שהלינה המשותפת בוטלה, אי אפשר היה לאסוף נתונים חדשים. לכן <b>קודדו מחדש</b> נתוני משחק ישנים בעזרת <mark>סולמות הזמינות הרגשית</mark> ${E("Emotional Availability Scales")} (Aviezer et al., 1999).</p>${tiles([["check","תקשורת מתגמלת","ייצוג בטוח של האם וביטחון של התינוק היו קשורים לתקשורת מתגמלת יותר"],["split","בלי הבדל בממוצע","לא היה הבדל בזמינות הרגשית בין שני סוגי הקיבוצים"],["x","הקשר נעלם","רגישות האם הייתה קשורה לביטחון התינוק <b>רק</b> בלינה המשפחתית"]])}${def("הפירוש",`האמהות בלינה המשותפת לא היו פחות רגישות ולא פחות אוטונומיות. כנראה ש<b>חוסר הנגישות בלילה גבר</b> על האינטראקציות ביום עם אם רגישה, ושינה את המשמעות של הרגישות. הסביבה פעלה כ<b>חיץ</b> שהקטין את השפעת הרגישות (Cowan, 1997), ואולי גם יצרה לחץ הורי.`)}`,q:"q39"}
 ]},
 {id:"t6",icon:"people",title:"אבות ומטפלות",blocks:[
  {h:"הקשר לאבות",html:`${def("על מה הנושא",`מה עם האבות והמטפלות?<br><b>מה נלמד כאן:</b> אבות · אחרי המעבר · המטפלת`)}<p>Sagi et al. (1985) בדקו גם את הקשר לאבות ולמטפלות. שיעור הבטוחים עם <b>האב</b> היה <mark>67%</mark>, לא נמוך מאוכלוסיות אחרות, ובלי קשר לביטחון עם האם.</p>${tiles([["check","לינה לא פגעה","הלינה המשותפת לא יצרה בעיה מיוחדת לקשר עם האב"],["split","בלי העדפה","האמהות והאבות התנהגו שונה, אבל התינוקות <b>לא העדיפו</b> הורה אחד"],["clock","יותר זמן","אבות בקיבוץ בילו יותר זמן עם התינוקות מאבות עירוניים, אבל לא היו מטפלים מקצועיים"]])}${rem("האבות היו \"מיוחסים\": היה להם זמן פנאי עם הילדים בתרבות שהעריכה מעורבות אבהית בלי לתת להם אחריות ראשית, בזמן שהמעורבות של האמהות צומצמה. החינוך הקולקטיבי תמך יותר בקשר <b>אב־ילד</b> והיה <b>עמום</b> לגבי קשר <b>אם־ילד</b>.")}`,q:"q41"},
  {h:"אחרי המעבר ללינה משפחתית",html:`<p>עם המעבר ללינה משפחתית המשפחה עברה ממודל אידיאולוגי של <b>שוויון מגדרי</b> למודל <b>מסורתי</b>: האם מבטאת חום והאב הופך לדמות סמכותית.</p>${def("הקושי של האבות",`לאבות שגדלו בעצמם בלינה משותפת היה קשה: מודלי הסמכות שלהם היו <b>המטפלות</b> ולא האבות שלהם. לכן התקשו להיות סמכותיים והביעו יותר רגשות שליליים כלפי הילדים (Plotnick, 1998).`)}`,q:"q43"},
  {h:"הקשר למטפלת בבית התינוקות",html:`${tiles([["chart","53% בטוחים","הכי נמוך, אבל דומה לשיעורים במחקרים אחרים על מטפלות"],["check","7 מתוך 83","רק 7 תינוקות היו לא בטוחים עם האם, האב <b>וגם</b> המטפלת. כלומר כמעט לכולם היה לפחות קשר בטוח אחד"],["copies","75% התאמה","כשאותה מטפלת טיפלה בשני ילדים, הסיווג שלהם היה תואם ב-75%"]])}${def("התאמה בין ילדים",`ההסבר: הייצוגים של המבוגר לגבי היקשרות מתבטאים בטיפול שלו, ולכן הוא יוצר קשרים דומים עם ילדים שונים. מחקר נוסף (Sagi et al., 1995) מצא שההתאמה הזו קיימת <b>רק בלינה המשפחתית</b>, והרבה פחות בלינה המשותפת.`)}${rem("כלומר הטיפול בלילה השפיע לא רק על הקשר לאם, אלא גם על <b>העקביות</b> של הקשרים עם המטפלות.")}`,q:"q45"}
 ]},
 {id:"t7",icon:"grad",title:"השלכות לטווח ארוך",blocks:[
  {h:"גן הילדים",html:`${def("על מה הנושא",`מה זה עשה לילדים כשגדלו? מגן הילדים ועד בית הספר.<br><b>מה נלמד כאן:</b> גן · ארבעה מודלים · גיל ההתבגרות · בית הספר`)}<p>Oppenheim, Sagi & Lamb (1988) בדקו כישורים רגשיים־חברתיים בגיל <b>5</b>. המנבא החזק ביותר היה <mark>היקשרות בטוחה למטפלת</mark> בינקות: הילד היה אמפתי, דומיננטי, עצמאי, מכוון הישגים ובעל התנהגות תכליתית.</p>${def("ספציפיות לתחום",`לא נמצא קשר לביטחון עם ההורים. הפירוש: השפעת ההיקשרות <b>ספציפית לתחום</b>. תפקוד בהקשר מסוים (בית הילדים) מנובא הכי טוב על ידי קשר שנוצר בהקשר דומה (קשר עם המטפלת בבית התינוקות).`)}`,q:"q47"},
  {h:"ארבעה מודלים",html:`<p>בסביבה של טיפול מרובה, איך מתארגנים המודלים הפנימיים של הילד? הוצעו ארבעה מודלים (van IJzendoorn, Sagi & Lambermon, 1992):</p>${fig("models")}${tiles([["target","מונוטרופיה","רק דמות אחת, בדרך כלל האם, חשובה (Bowlby, 1951)"],["pyramid","היררכיה","דמות אחת (האם) הכי חשובה, והאחרים משניים ומשמשים בסיס בטוח כשהיא לא שם"],["split","עצמאות","הילד יוצר קשרים עם כמה מטפלים, וכל אחד פועל בתחום שבו הם היו יחד"],["link","אינטגרציה","ברשת של קשרים, קשרים בטוחים מפצים על לא בטוחים, והיעדר כל קשר בטוח הוא הקשה ביותר"]])}${def("הממצא",`<b>הרשת המורחבת</b> (אם, אב ומטפלת) ניבאה הכי טוב תפקוד מתקדם בהמשך, יותר מהרשת המשפחתית או מהקשר לאם לבד. ילדים בלי אף קשר בטוח תפקדו הכי נמוך. זו תמיכה במודל <mark>האינטגרציה</mark>.`)}`,q:"q49"},
  {h:"גיל ההתבגרות המוקדם",html:`<p>ייצוגי היקשרות נוטים להיות יציבים, אבל יכולים להשתנות בעקבות <b>שינויים בסביבת הטיפול</b> או התפתחות (כמו חשיבה פורמלית). במעקב אחרי המדגם של 1985 נמצאו בין הינקות לגיל ההתבגרות:</p>${tiles([["x","גירושי הורים","17%"],["building","עזיבת הקיבוץ","11%"],["moon","סוף הלינה המשותפת","50%, עד גיל 6"]])}${def("מבחן חרדת הפרידה",`${E("SAT")} בודק אסטרטגיות התמודדות, הבעה פתוחה של פגיעות וארגון התשובות לתמונות של פרידה. רוב הילדים הראו התמודדות מסתגלת, אבל <b>לא הייתה רציפות</b> בייצוגים במשך 10 השנים מאז הינקות. ייתכן שהסיבה היא האירועים שקרו בינתיים.`)}`,q:"q51"},
  {h:"בגרות רגשית בבית הספר",html:`<p>שתי השערות מתחרות: (1) הנזק של הלינה המשותפת בולט בעיקר <b>בינקות</b>. (2) הנזק <b>לא מוגבל</b> לינקות, וחשיפה ממושכת קשורה להסתגלות נמוכה יותר בהמשך.</p>${def("התוצאה",`ההסתגלות לבית הספר (לפי המורים) הייתה קשורה לייצוגים, להיקשרות בינקות ולשינויים בסביבת הטיפול, מעבר ל-IQ ולכשירות העצמית. התמיכה הייתה ב<b>השערה 2</b>: מי שהיה בלינה משותפת <b>אחרי</b> הילדות המוקדמת דורג <b>פחות בוגר רגשית</b> בבית הספר. הנזק <b>מצטבר</b>.`)}${rem("עוד ממצא: הורים לילדים בלינה משותפת, שהילדים שלהם התמודדו פחות טוב במבחן הפרידה, נטו לראות בשינויים הרבים בטיפול השפעה <b>חיובית</b>. ייתכן שההורים היו \"עיוורים\" במידה מסוימת לקשיים, עוד סימן לכך שהלינה הפריעה ליחסי הורה־ילד.")}`,q:"q53"}
 ]},
 {id:"t8",icon:"bulb",title:"סיכום ולקחים",blocks:[
  {h:"המחיר",html:`${def("על מה הנושא",`המחיר, ההבחנה החשובה, והלקחים לטיפול בילדים היום.<br><b>מה נלמד כאן:</b> המחיר · סיבוך ולא חסך · לקחים`)}<p>המאמר מתאר תהליך <b>בלתי נמנע</b>: ההורים, שהסכימו שהקולקטיב ייקח מהם את "חלק הארי" של הסמכות, <b>החזירו לעצמם</b> את הזכויות ההוריות. כבר בולבי (1953), שביקר בקיבוצים, הזהיר שהשיטה עלולה ליצור יותר חוסר ביטחון.</p>${tiles([["x","יותר חוסר ביטחון","שיעור גבוה יותר של היקשרות לא בטוחה לאם"],["link","אין העברה","אין העברה בין־דורית ואין קשר בין רגישות האם לביטחון התינוק"],["people","ניתוק הורים","פער בין התמודדות החרדה של המתבגרים לבין ההערכה החיובית של ההורים"],["grad","בגרות רגשית","דירוג נמוך יותר במורים: קושי להתמודד עם תסכול, אולי כי לא היה תיווך הורי כשנדרש"]])}${rem("<b>שימו לב:</b> המסקנות נוגעות <b>רק ללינה המשותפת</b>, לא לחינוך הקיבוצי כולו.")}`,q:"q55"},
  {h:"לא חסך, אלא סיבוך",html:`${def("הבחנה חשובה",`אף ילד שנבדק <b>לא סווג כחסר היקשרות</b>. לכן לינה משותפת <b>אינה</b> חסך אימהי. היא <b>סיבכה מאוד</b> את יחסי האם והתינוק.`)}<p>תינוקות פגיעים יותר חוו חוסר נגישות של האם בלילה, שלא פוצה על ידי המפגשים ביום עם אם רגישה, והתוצאה הייתה היקשרות חרדה. מעמד הנורמה של הלינה המשותפת אולי <b>מנע</b> מהרבה הורים לנקוט צעדי פיצוי.</p>${rem("הלינה המשותפת לא התקיימה באופן טבעי באף תרבות אחרת. הסיום שלה הראה את <b>גבולות ההסתגלות</b> של הורים וילדים להסדרי טיפול מלאכותיים. בתחילה הדרך היחידה להתנגד הייתה לעזוב את הקיבוץ, ואחר כך חוסר שביעות הרצון הפך ל<b>זרז</b> לשינוי חברתי.")}`,q:"q57"},
  {h:"לקחים לטיפול מודרני",html:`${tiles([["copies","העברה שנקטעה פעמיים","פעם כשהלינה הונהגה (ניתוק מהמשפחה של העבר) ופעם כשבוטלה. בשתי הפעמים להורים לא היו מודלים הוריים. הורות קשה מכדי \"להמציא\" אותה מחדש בכל דור"],["leaf","תרבות, סיכון וחוסן","צריך לחקור מנהגים שבהם הצרכים הרגשיים של ילדים מתעוררים אבל לא מקבלים מענה. טיפול חלופי איכותי ומאמצי פיצוי של האם יכולים למתן את הנזק"],["cycle","מערכת פתוחה","הקיבוץ הגיב לאתגרים פנימיים וחיצוניים. נורמות איבדו תוקף כשהחברים התבגרו וחוו מלחמות, וצרכים אנושיים שהודחקו עלו"]])}${def("השורה התחתונה",`בשנות ה-90 הסתיים "ניסוי חברתי של הטבע" ש<b>נועד להיכשל</b>, כי הוא הפעיל ציוויים חברתיים־תרבותיים <b>שמנוגדים לצרכים אנושיים בסיסיים</b>.`)}`,q:"q59"}
 ]}
];

 {q:"מה כלל בית הילדים?",a:"משחק, למידה, אוכל ושינה בחדרים משותפים",w:["רק חדרי שינה, בלי שום פעילות אחרת","רק כיתות לימוד, בלי חדרי שינה","מטבח משותף להורים ולילדים יחד"],e:"3–4 ילדים בחדר."}]},
q13:{t:"t2",v:[
 {q:"מה מצאה הדגימה של 183 חברות (Barry & Paxton, 1971)?",a:"באף חברה תינוקות לא ישנו רחוק מההורים",w:["בכמחצית מהחברות תינוקות ישנו רחוק","בכל החברות תינוקות ישנו רחוק מההורים","רק בחברות אירופיות ישנו רחוק מההורים"],e:"הקיבוץ חריג."},
 {q:"מה היה המצב בארבעת הקיבוצים הראשונים?",a:"הם נשארו תמיד עם לינה משפחתית",w:["הם הנהיגו לינה משותפת ראשונים","הם עברו ללינה משותפת ב-1950","הם התפרקו בגלל הלינה"],e:"לא כל הקיבוצים."}]},
q14:{t:"t2",v:[
 {q:"מי הפכו את הלינה המשותפת לנורמה?",a:"עולים סוציאליסטים נלהבים",w:["פסיכולוגים ואנשי חינוך מהעיר","האמהות שחיו בקיבוץ","מוסדות ממשלת ישראל"],e:"העדיפו את הקולקטיב."},
 {q:"על מי השפיעה הלינה המשותפת לרעה במיוחד?",a:"על מעורבות האמהות",w:["על מעורבות האבות","על המטפלות","על הסבים"],e:"הצמצום הגדול."}]},
q15:{t:"t2",v:[
 {q:"מה האירוע שבזמנו עברו כמעט כל הקיבוצים שנותרו ללינה משפחתית?",a:"מלחמת המפרץ, 1991",w:["מלחמת ששת הימים, 1967","מלחמת יום כיפור, 1973","קום המדינה, 1948"],e:"הילדים נשארו בבית."},
 {q:"מי הובילו את המאבק לשינוי הלינה המשותפת?",a:"הנשים",w:["הגברים","הילדים","המטפלות"],e:"האמהות."}]},
q16:{t:"t2",v:[
 {q:"איזה מהבאים לא מוזכר כגורם שתמך במגמות המשפחתיות?",a:"גידול באוכלוסיית הקיבוצים",w:["המשבר הכלכלי","היחלשות האידיאולוגיה","השפעת תורת ההיקשרות"],e:"לא מוזכר."},
 {q:"מה קרה למאבק לשוויון מגדרי עם עליית המגמות המשפחתיות?",a:"הוא נדחק לרקע",w:["הוא התחזק מאוד","הוא הצליח לגמרי","הוא לא היה קיים"],e:"מחיר לא צפוי."}]},
q17:{t:"t3",v:[
 {q:"הקיבוץ שינה את הסדרי הלינה רק אחרי עשרות שנים. איך תורת המערכות תסביר את האיטיות?",a:"נטייה ליציבות (הומאוסטזיס)",w:["פתיחות גבוהה לשינוי","היעדר רכיבים תלויים","השפעה של תסביך אדיפוס"],e:"מול פתיחות לשינוי."},
 {q:"מהי מערכת לפי תורת המערכות?",a:"שלם של רכיבים תלויים שמשפיעים זה על זה",w:["אוסף של יחידים בלי קשר ביניהם","מבנה קבוע שלא משתנה לעולם","רכיב אחד שקובע לבדו את כל השאר"],e:"השפעות הדדיות."}]},
q19:{t:"t3",v:[
 {q:"איזה שינוי מראה שהקיבוץ היה מערכת פתוחה?",a:"הבאת תינוקות הביתה מבית החולים",w:["שימור הלינה המשותפת שנים רבות","התנגדות עזה לכל שינוי","הקמת בתי ילדים נוספים"],e:"וגם הארכת זמן המשפחה."},
 {q:"מה מעיד על הנטיות ההומאוסטטיות של הקיבוץ?",a:"השינויים נמשכו 20 עד 50 שנה",w:["השינויים קרו בתוך שנה אחת","לא היו שינויים בכלל בקיבוץ","כל השינויים קרו בבת אחת"],e:"קצב איטי."}]},
q20:{t:"t3",v:[
 {q:"לפי Kaffman (1993), למה הוגדל זמן המשפחה?",a:"כפשרה לבלימת הדרישה ללינה משפחתית",w:["כדי לעודד ולחזק את הלינה המשותפת","בגלל הוראה רשמית של משרד החינוך","כי המטפלות ביקשו לעבוד פחות שעות"],e:"פשרה הומאוסטטית."},
 {q:"איזה שיפור קרה בטיפול הקיבוצי עוד לפני שהנושא נעשה מקצועי?",a:"קבוצות קטנות ויחס טוב מטפלת־ילדים",w:["ביטול מוחלט של הלינה המשותפת","הכנסת ההורים לבתי הילדים","העסקת פסיכולוגים בכל קיבוץ"],e:"וסביבה פיזית איכותית."}]},
q21:{t:"t3",v:[
 {q:"מה סימן את תחילת השינוי בחינוך הקיבוצי?",a:"הופעת תורת ההיקשרות",w:["הופעת הפסיכואנליזה","מלחמת יום כיפור","הקמת המדינה"],e:"ערעור על ההצדקה."},
 {q:"איך השתנו הגבולות בין מבוגרים לילדים בקיבוץ?",a:"ממערכות נפרדות למשפחות משותפות",w:["ממשפחות משותפות למערכות נפרדות","הם לא השתנו כלל","הם נעלמו לגמרי"],e:"הורים וילדים יחד."}]},
q22:{t:"t3",v:[
 {q:"באיזה מושג פסיכואנליטי השתמשו כדי לשמר את הנורמות?",a:"הגנה מפני תסביך אדיפוס",w:["בסיס בטוח ומגן לילד","מודל עבודה פנימי של הילד","חרדת זרים של תינוקות"],e:"הפרדה ״מגינה״."},
 {q:"למה תורת ההיקשרות ערערה על ההפרדה?",a:"הקשר המוקדם להורה בסיס לאישיות",w:["כי היא התמקדה בעיקר בגנים","כי היא התמקדה בבית הספר","כי היא התנגדה להעסקת מטפלות"],e:"קשר הורה־ילד."}]},
q23:{t:"t4",v:[
 {q:"לפי תורת ההיקשרות, מה גורם להיקשרות בטוחה?",a:"תגובה רגישה לאותות של התינוק",w:["כמות הזמן שהאם נמצאת בבית","המזג המולד של התינוק עצמו","מספר המטפלים שיש בסביבה"],e:"רגישות המטפל."},
 {q:"מה המנגנון המרכזי להעברת ההיקשרות מדור לדור, לפי המודל?",a:"רגישות האם",w:["גנים משותפים","מזג התינוק","תמיכת הקהילה"],e:"הורה בטוח, רגיש, תינוק בטוח."}]},
q25:{t:"t4",v:[
 {q:"מה מצאה המטא־אנליזה של De Wolff ו-van IJzendoorn (1997)?",a:"רגישות האם מרכזית, אך לא הגורם היחיד",w:["רגישות האם היא הגורם היחיד לביטחון","רגישות האם לא קשורה כלל לביטחון","רק המזג של התינוק קובע את הביטחון"],e:"צריך גורמים נוספים."},
 {q:"לפי Belsky (1999), מה צריך לבחון כדי להבין ביטחון?",a:"גם גורמים מחוץ לקשר הורה־ילד",w:["רק את רגישות האם לתינוק","רק את הגנים של התינוק","רק את המזג של האב"],e:"תמיכות וסיכונים."}]},
q27:{t:"t4",v:[
 {q:"איזו תמיכה נתנה הלינה המשותפת להורים?",a:"שיתוף באחריות וערכים ברורים",w:["זמן רב יותר עם הילדים בלילה","הכשרה פסיכולוגית מקצועית","שכר גבוה יותר להורים"],e:"לצד הקשיים."},
 {q:"מה נמצא לגבי השינה של ילדים בלינה משותפת?",a:"שינה רציפה קצרה ויעילות נמוכה",w:["שינה ארוכה ויעילה יותר מבבית","אין הבדל בשינה בין הסידורים","פחות התעוררויות בלילה מבבית"],e:"עדות לעקה."}]},
q28:{t:"t4",v:[
 {q:"ילדי הלינה המשותפת היו מוגנים פיזית. מה עם הביטחון המורגש שלהם?",a:"הוא היה שברירי",w:["הוא היה גבוה מאוד","הוא היה זהה לילדי עיר","הוא לא נבדק"],e:"מוגנים ≠ בטוחים."},
 {q:"למה תינוקות לא יכלו ליצור קשר יציב עם שומרות הלילה?",a:"בגלל התורנות השבועית",w:["כי השומרות היו קשוחות","כי השומרות היו זרות לקיבוץ","כי הילדים ישנו כל הלילה"],e:"החלפה מתמדת."}]},
q29:{t:"t4",v:[
 {q:"איך פיצו חלק מההורים על הלינה המשותפת?",a:"לקחו לישון בבית או ביקרו הרבה",w:["עברו לגור בעיר הסמוכה","השאירו את הילדים אצל הסבים","שכרו מטפלת פרטית לבית"],e:"או ישנו בבית הילדים."},
 {q:"מה הקשר בין אוניברסליות ההיקשרות לתרבות?",a:"נקשרים בכל תרבות, עם התאמות לנישה",w:["ההיקשרות קיימת רק בתרבות המערבית","התרבות קובעת אם תהיה היקשרות","אין שום השפעה לתרבות על ההיקשרות"],e:"אוניברסלי ומותאם."}]},
q30:{t:"t4",v:[
 {q:"אמא רואה את בנה בוכה כשהיא מחזירה אותו לבית הילדים, אבל הקיבוץ מצפה שתשאיר אותו. מה הקונפליקט?",a:"מצוקת הילד מול דרישות הקולקטיב",w:["הקריירה שלה מול זמן הפנאי","האב מול הסבים","המטפלת מול שומרת הלילה"],e:"מטרות מתחרות."},
 {q:"מה מראים צעדי הפיצוי של ההורים?",a:"את החוסן של מערכת הטיפול ההורית",w:["שההורים התנגדו לקיבוץ","שהלינה הייתה טובה לילדים","שההורים לא היו קשורים לילדים"],e:"דומיננטיות ההורות."}]},
q31:{t:"t5",v:[
 {q:"מה מצאו Sagi ועמיתיו (1985)?",a:"59% בטוחים עם האם, פחות מהממוצע",w:["90% בטוחים עם האם, יותר מהממוצע","20% בטוחים עם האם, נמוך מאוד","בדיוק כמו הממוצע העולמי"],e:"לעומת 65–70%."},
 {q:"רוב התינוקות בלינה משותפת יצרו היקשרות כלשהי. מה הסיקו מזה?",a:"טיפול מרובה לא מונע היקשרות",w:["שהלינה המשותפת מועילה לילדים","שאין צורך אמיתי בהורים","שהאם לא חשובה בכלל לתינוק"],e:"ולא בהכרח גורם סיכון."}]},
q33:{t:"t5",v:[
 {q:"מה מצא המחקר המעין־ניסויי (Sagi et al., 1994)?",a:"48% בטוחים בלינה משותפת, 80% במשפחתית",w:["80% בטוחים בלינה משותפת, 48% במשפחתית","אין הבדל בין שני סוגי הלינה","שתי הקבוצות היו בטוחות ב-60%"],e:"הבדל גדול."},
 {q:"למה הסיקו שסידור הלינה גרם להבדל?",a:"הקבוצות היו דומות בכל השאר",w:["כי היה שיבוץ אקראי מלא","כי המדגם היה ענק","כי ההורים בחרו לבד"],e:"יום, מזג, משחק, חרדת פרידה."}]},
q34:{t:"t5",v:[
 {q:"תינוק שהאם זמינה לו לפעמים ולפעמים לא. איזו היקשרות צפויה לפי איינסוורת'?",a:"אמביוולנטית",w:["נמנעת","בטוחה","חסרת ארגון"],e:"היענות לא עקבית."},
 {q:"מה יצר היענות לא עקבית בלינה המשותפת?",a:"מטפלים מוכרים ביום וזר בלילה",w:["אמהות לא רגישות בשעות היום","מטפלות קשוחות במיוחד בלילה","מעט מדי שעות שינה לתינוקות"],e:"ניגוד יום–לילה."}]},
q35:{t:"t5",v:[
 {q:"בין התינוקות הלא בטוחים בקיבוץ היו הרבה אמביוולנטיים. מה נכון לגבי זה?",a:"זה מאפיין גם תינוקות ישראלים אחרים",w:["זה ייחודי רק לקיבוץ","זה נובע מגנים של הקיבוצניקים","זה נמצא רק אצל בנים"],e:"מאפיין ישראלי."},
 {q:"מה מצאו Sharabany ועמיתים (2001) על מבוגרים שגדלו בקיבוץ?",a:"אין קשר בין סוג הלינה להיקשרות בבגרות",w:["לינה משותפת יצרה הימנעות בבגרות","לינה משפחתית יצרה חרדה בבגרות","כולם היו לא בטוחים בבגרות"],e:"אין המשכיות ישירה."}]},
q36:{t:"t5",v:[
 {q:"כמה מהתינוקות בלינה משותפת היו בכל זאת בטוחים?",a:"כמחצית",w:["כמעט כולם","כרבע","כמעט אף אחד"],e:"כ-50%."},
 {q:"מה עשו החוקרים אחרי שראו שכמחצית בטוחים?",a:"חיפשו גורמים באם, בתינוק ובאינטראקציה",w:["הסיקו שהלינה לא משפיעה בכלל","הפסיקו את המחקר באמצע","בדקו מעכשיו רק את המטפלות"],e:"מה מבחין ביניהם."}]},
q37:{t:"t5",v:[
 {q:"אמא בטוחה (לפי AAI) בלינה משותפת. מה הסיכוי שהתינוק שלה יהיה בטוח, לעומת לינה משפחתית?",a:"נמוך יותר, ההעברה חלשה",w:["גבוה יותר, ההעברה חזקה","זהה, כמו בלינה משפחתית","אפסי, בכל מקרה"],e:"40% לעומת 76%."},
 {q:"האם אמהות בלינה המשותפת היו פחות אוטונומיות לפי ה-AAI?",a:"לא, השיעורים דומים",w:["כן, הרבה פחות אוטונומיות","כן, מעט פחות אוטונומיות","הן כלל לא נבדקו ב-AAI"],e:"65% לעומת 72%."}]},
q38:{t:"t5",v:[
 {q:"למה ממצא ההעברה החלשה לא מאפשר מסקנה סיבתית?",a:"אי־התאמות היו בשני הכיוונים במידה דומה",w:["כי המדגם היה גדול מדי לניתוח","כי לא נמדד AAI אצל האמהות","כי כל האמהות היו בטוחות"],e:"לא רק אם בטוחה–תינוק לא בטוח."},
 {q:"מה שיעור ההתאמה בין דורות במחקרים במערב?",a:"כ-75%",w:["כ-40%","כ-25%","כ-95%"],e:"גבוה."}]},
q39:{t:"t5",v:[
 {q:"איך נבדקה האינטראקציה אם־תינוק אחרי ביטול הלינה?",a:"קידוד מחדש של נתוני משחק ישנים",w:["תצפיות חדשות במשפחות","ראיונות עם המבוגרים היום","שאלונים למטפלות"],e:"סולמות זמינות רגשית."},
 {q:"מה נמצא לגבי רגישות האם וביטחון התינוק?",a:"קשורים רק בלינה המשפחתית",w:["קשורים רק בלינה המשותפת","קשורים בשתי הלינות","לא קשורים באף אחת"],e:"הלילה שינה את המשמעות."}]},
q40:{t:"t5",v:[
 {q:"אמא רגישה מאוד ביום, אבל התינוק שלה לא בטוח. מה ההסבר במאמר?",a:"חוסר הנגישות בלילה גבר על היום",w:["האם לא באמת רגישה כמו שנראה","התינוק נולד עם מזג קשה במיוחד","המטפלת פגעה בקשר עם האם"],e:"משמעות הרגישות השתנתה."},
 {q:"למה ״רגישות נמוכה של האם״ לא מסבירה את הממצאים?",a:"האמהות לא היו פחות רגישות",w:["כי לא נמדדה רגישות","כי האבות היו רגישים יותר","כי אין קשר בין רגישות לביטחון"],e:"ולא פחות אוטונומיות."}]},
q41:{t:"t6",v:[
 {q:"מה היה שיעור הבטוחים עם האב בלינה המשותפת?",a:"כ-67%, לא נמוך מאוכלוסיות אחרות",w:["כ-30%, נמוך מאוד מהממוצע","כ-90%, גבוה מאוד מהממוצע","כ-48%, בדיוק כמו עם האם"],e:"שונה מהאם."},

const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);

  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");

    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
