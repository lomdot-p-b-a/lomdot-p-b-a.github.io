const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"sprout",title:"רגשות בסיסיים",blocks:[
  {h:"אוטונומיה וקריאת רגשות של תינוקות",html:`${def("על מה הנושא",`עוד לפני שהם מדברים, תינוקות מרגישים ומבטאים רגשות. הנושא מציג את הרגשות הבסיסיים, ומתי כל אחד מופיע.<br><b>מה נלמד כאן:</b> רגשות בסיסיים · שמחה וחיוך חברתי · כעס ועצב · פחד וחרדת זרים`)}${def("סוף הדיון באריקסון",`בשנה השנייה, <b>אוטונומיה</b> מתפתחת כשההורים נותנים הדרכה ובחירות הגיוניות, לא מבקרים כשהפעוט נכשל (שירותים, כפית, סידור) ומגיבים בסבלנות לעמידתו על שלו (״עוד חמש דקות משחק״). שליטת יתר או חוסר שליטה מובילים ל<b>בושה וספק</b>. הורות חמה וציפיות סבירות בונות <b>אמון בסיסי ואוטונומיה</b>, ובלעדיהן נזרעים זרעים לקשיים בהמשך.`)}<p>רגשות מארגנים יחסים חברתיים, חקירה וגילוי העצמי. לפי <b>גישת המערכות הדינמיות</b> הם חלק מהמערכת המתפתחת: מפיחים בה אנרגיה ונעשים מורכבים יותר.</p><p>תינוקות לא מתארים רגשות, ולכן הרמז המהימן ביותר הוא <b>הבעות הפנים</b> (בכל התרבויות מקשרים הבעות לרגשות באותה דרך). אבל צריך זהירות:</p>${tiles([["x","לא תמיד יש הבעה","על הצוק החזותי ילדים נמנעים בלי להראות פחד בפנים"],["hand","ערוצים אחרים","תינוקות עיוורים מביעים רגש בתנועות אצבעות, וכשמראים זאת להורים הם מגיבים ביותר הדדיות"],["question","תגובה אחת, הרבה רגשות","חיוך יכול לבטא שמחה, מבוכה, בוז או ברכה"]])}${rem("לכן חוקרים מסתכלים על <b>כמה רמזים יחד</b>, קול, פנים ומחוות, ואיך הם משתנים במצבים שונים.")}`,q:"q1"},
  {h:"רגשות בסיסיים ושמחה",html:`${def("רגשות בסיסיים",`<mark>רגשות בסיסיים</mark> ${E("Basic emotions")}: אושר, עניין, הפתעה, פחד, כעס, עצב וגועל. אוניברסליים ובעלי היסטוריה אבולוציונית. בהתחלה יש רק שני מצבים כלליים: <b>משיכה</b> לגירוי נעים ו<b>התרחקות</b> מגירוי לא נעים. בהדרגה הם הופכים לאותות מאורגנים (קמרס צילמה את בתה: הבעות כעס ועצב הופיעו קודם סביב בכי, ורק עם הגיל התחברו למחסום ולכישלון).`)}${def("חיוך חברתי",`בשבועות הראשונים יילודים מחייכים כשהם שבעים, בשנת REM ולמגע וקול עדינים. בסוף החודש הראשון למראות דינמיים. בין <b>6 ל־10 שבועות</b> (כך במקור האנגלי ובתרשים 7.1; בנוסח העברי נכתב ״חודשים״) מופיע <mark>חיוך חברתי</mark> ${E("Social smile")}: חיוך רחב לתקשורת של ההורה. <b>צחוק</b> מופיע בגיל 3 עד 4 חודשים ומשקף עיבוד מהיר יותר.`)}${fig("nso","אצל הנאסו בקמרון, שמעריכים רוגע ולא מעודדים הבעת רגשות, החיוך החברתי מתעכב")}${rem("בסוף השנה הראשונה החיוך הוא <b>אות חברתי מכוון</b>: חיוך רחב להורה, מאופק לזר, פתוח במשחק. בני 8 עד 10 חודשים עוצרים משחק כדי לשתף מבוגר בהנאה.")}${ex(`<b>חיוך חברתי</b>: בגיל 6–10 שבועות התינוק מחייך כשהוא רואה פנים של אדם, לא רק כשהוא שבע. הורים מרגישים שהוא "מחייך אליהם" בפעם הראשונה.`)}`,q:"q3"},
  {h:"כעס ועצב",html:`${def("כעס",`מגיל 4 עד 6 חודשים ועד השנה השנייה הכעס גובר בתדירות ובעוצמה, ובמצבים רבים יותר: לוקחים חפץ, מגבילים ידיים, ההורה יוצא, משכיבים לישון. <b>למה?</b> ההתנהגות נעשית מכוונת (רוצים לשלוט בתוצאות), מזהים טוב יותר מי גרם, וההורים מציבים יותר גבולות כשהתינוק זוחל.`)}${rem("הכעס <b>מסתגל</b>: מאפשר להגן על עצמך או להתגבר על מכשול, ומניע את המטפל להקל ולא לעזוב שוב מהר.")}${def("עצב",`פחות שכיח מכעס. מופיע בעיקר כשהתינוק מאבד מטפל מוכר ואוהב (גרייס אחרי האימוץ) או כשהאינטראקציה עם ההורה משתבשת קשות.`)}${ex("ניסויי <b>פנים קפואות</b>: הורים לבני 2 עד 7 חודשים עברו פתאום להבעה חסרת תגובה. התינוקות ניסו פנים, תנועות וקולות כדי להחזיר את ההורה, וכשלא הצליחו הסיטו מבט, קימטו מצח ובכו. אותה תגובה אצל אמריקנים, קנדים וסינים: נראה שזו תגובה מולדת. כך מגיבים גם תינוקות להורים בדיכאון, ואם זה נמשך ההתפתחות כולה נפגעת.")}`,q:"q5"},
  {h:"פחד וחרדת זרים",html:`${def("חרדת זרים",`הפחד מופיע במחצית השנייה של השנה הראשונה. ההבעה השכיחה: <mark>חרדת זרים</mark> ${E("Stranger anxiety")}. היא <b>לא תמיד</b> מופיעה, ותלויה במזג, בניסיון עם זרים ובמצב: זר שמרים תינוק במקום חדש מעורר פחד, וזר שיושב בשקט כשההורה קרוב מעורר סקרנות. חום, צעצוע, משחק מוכר והתקרבות איטית מפחיתים אותה.`)}${tiles([["people","אפה (קונגו)","תמותת אימהות גבוהה, תינוקות עוברים בין מבוגרים מהלידה: כמעט אין חרדת זרים","בתרבות שבה תינוקות עוברים בין מבוגרים רבים מהלידה, כמעט אין חרדת זרים. זה מראה שהתרבות משפיעה על הרגש.","תינוק שמוכר לו שכל יום מחזיקים אותו אנשים שונים, לא נבהל מאדם חדש."],["lock","קיבוצים בישראל","קהילות מבודדות שפגיעות לטרור: חשדנות כלפי זרים, וחרדת זרים גבוהה בהרבה מבעיר","בקהילה מבודדת שחוששת מזרים, תינוקות מראים חרדת זרים חזקה יותר. גם כאן התרבות משפיעה.","תינוק שגדל בקהילה סגורה בוכה מהר יותר כשמגיע מבקר שהוא לא מכיר."]])}${def("בסיס בטוח",`הפחד מרסן את החקירה של תינוק שרק התחיל לנוע. התינוק משתמש במטפל כ<mark>בסיס בטוח</mark> ${E("Secure base")}: יוצא לחקור וחוזר לתמיכה. ההתנהגות מול זר היא <b>איזון</b> בין התקרבות להימנעות.`)}${rem("חרדת הזרים פוחתת כשהקוגניציה מאפשרת להבחין בין מאיים ללא מאיים, וכשיש יותר אסטרטגיות התמודדות.")}${ex(`<b>חרדת זרים</b>: תינוקת בת 8 חודשים שהייתה הולכת לכל אחד, פתאום בוכה כשדודה שלא מכירה מנסה להרים אותה. <b>בסיס בטוח</b>: אותה תינוקת זוחלת לחקור את החדר, ומדי פעם חוזרת לגעת באמא.`)}`,q:"q7"}

 {id:"t2",icon:"people",title:"הבנת רגשות וויסות",blocks:[
  {h:"הבנת רגשות הזולת",html:`${def("על מה הנושא",`מעבר להרגיש: התינוק לומד להבין רגשות של אחרים, להרגיש רגשות מורכבים כמו בושה, ולהרגיע את עצמו.<br><b>מה נלמד כאן:</b> הירמזות חברתית · רגשות של מודעות עצמית · ויסות עצמי רגשי`)}<p>בהתחלה תינוקות מתאימים את הרגש שלהם לזה של המטפל: אולי <b>הדבקה רגשית</b> ${E("Emotional contagion")} אוטומטית, ואולי התניה אופרנטית (חיוך מביא תגובה). בגיל <b>3 חודשים</b> הם רגישים למבנה ולתזמון של אינטראקציה פנים אל פנים ומצפים לתגובה. לפי חלק מהחוקרים, מכאן מתחילים לראות אחרים <b>״כמוני״</b>.</p><p>ב־4 עד 5 חודשים מבחינים בין רגש חיובי לשלילי בקול ואחר כך בפנים, ובאמצע השנה מתאימים פנים לקול (מביטים יותר בפנים שמחות עם קול שמח). מגיל 7 חודשים גלי המוח (ERP) דומים למבוגרים.</p>${def("הירמזות חברתית",`<mark>הירמזות חברתית</mark> ${E("Social referencing")}: מגיל 8 עד 10 חודשים, חיפוש פעיל של מידע רגשי מאדם מהימן במצב לא ברור. הבעות ההורה משפיעות על הזהירות מזר, משחק בצעצוע חדש וחציית הצוק החזותי. <b>הקול</b> משפיע יותר מהפנים לבד: הוא מעביר רגש ומילים, והתינוק לא צריך להסתובב.`)}${ex("<b>ברוקולי וקרקרים:</b> אישה הראתה הנאה מאוכל אחד וגועל מהשני. בני <b>14</b> חודשים נתנו לה את מה שהם אוהבים (בדרך כלל קרקרים). בני <b>18</b> חודשים נתנו את מה שהיא אהבה, גם אם הם לא. הם מבינים שלאחר יש העדפות שונות.")}`,q:"q9"},
  {h:"רגשות של מודעות עצמית",html:`${def("מושג מפתח",`<mark>רגשות של מודעות עצמית</mark> ${E("Self-conscious emotions")}: אשמה, בושה, מבוכה, קנאה וגאווה. כל אחד כרוך בפגיעה או בחיזוק של תחושת העצמי. אשמה: פגעתי ורוצה לתקן. בושה ומבוכה: רוצה ״להיעלם״. גאווה: מספר לאחרים ולוקח אתגרים.`)}<p>הם מופיעים ב<b>אמצע השנה השנייה</b> (18 עד 24 חודשים), כשהמודעות לעצמי כנפרד מתגבשת: השפלת עיניים, הרכנת ראש, הסתרת פנים. קייטלין בת 22 חודשים החזירה לגרייס צעצוע שחטפה וטפחה על גבה. גאווה וקנאה מופיעות בערך בגיל שנתיים.</p>${rem("מלבד מודעות עצמית צריך <b>הדרכה של מבוגר</b> (״בוא נראה כמה רחוק תזרוק!״, ״תתבייש!״). והמצבים משתנים בין תרבויות: במערב גאווה על הישג אישי, ובסין וביפן תשומת לב להצלחה אישית מעוררת מבוכה, ואי־דאגה לזולת מעוררת בושה גדולה.")}${ex(`פעוט בן שנתיים ששבר כוס, מסתיר את הפנים ומסתכל לרצפה. זו בושה: הוא כבר מבין שיש לו "עצמי" ושאחרים שופטים אותו.`)}`,q:"q11"},
  {h:"ויסות עצמי רגשי",html:`${def("מושג מפתח",`<mark>ויסות עצמי רגשי</mark> ${E("Emotional self-regulation")}: אסטרטגיות להתאמת המצב הרגשי לעוצמה נוחה שמאפשרת להשיג מטרות. הוא דורש <b>בקרה שדורשת מאמץ</b>, שמשתפרת בזכות התפתחות הקורטקס הקדם־מצחי ותמיכת מטפלים.`)}${tiles([["moon","חודשים ראשונים","מוצפים בקלות, תלויים בהרגעה של המטפל: הרמה, נענוע, ליטוף, דיבור רך"],["clock","2 עד 6 חודשים","סיבולת לגרייה גדלה. ב־4 עד 6 חודשים מסיטים קשב מאירוע לא נעים ומרגיעים את עצמם"],["hand","המחצית השנייה","מאותתים למטפל שצריך עזרה. זחילה והליכה מאפשרות להתקרב או להתרחק"],["phone","השנה השנייה","מילים לרגשות. אבל התפרצויות זעם עדיין שכיחות, בעיקר בעייפות ורעב","בשנה השנייה ילדים מתחילים לתת שמות לרגשות, וזה עוזר לווסת אותם. אבל עדיין קשה להם, ולכן התפרצויות זעם שכיחות, במיוחד כשהם עייפים או רעבים.","נועם אומר ״אני כועס״, אבל כשהוא רעב ועייף בסוף יום, הוא עדיין נשכב על הרצפה ובוכה."]])}${rem("הורים ש״קוראים״ את התינוק ומגיבים באהדה: תינוקות פחות נרגנים, יותר מרוצים וקל להרגיע. הורים חסרי סבלנות שמתערבים רק כשהתינוק כבר נסער מחזקים מעבר מהיר למצוקה, ומבני מוח שבולמים עקה עלולים לא להתפתח כראוי.")}${def("תרבות ומגדר",`הורים מעודדים מוקדם דיכוי רגשות שליליים, ו<b>בנים</b> מקבלים יותר תרגול כזה (הם מתקשים יותר). מבוגרים סינים ויפנים מעודדים פחות הבעה עזה, ובסוף השנה תינוקותיהם מחייכים, צוחקים ובוכים פחות. פעוטות שהוריהם אוהדים אבל <b>מציבים גבולות</b> ומציעים חלופות לומדים לווסת כעס טוב יותר.`)}${ex(`תינוק שמוצץ אצבע כדי להירגע, או פעוטה שמפנה את המבט מכלב מפחיד. אלה אסטרטגיות ויסות מוקדמות.`)}`,q:"q13"}
 ]},
 {id:"t3",icon:"pie",title:"מזג: מבנה ומדידה",blocks:[
  {h:"מהו מזג: מחקר ניו יורק",html:`${def("על מה הנושא",`יש תינוקות רגועים ויש תינוקות שבוכים מכל דבר. ההבדל הזה נקרא מזג. הנושא מסביר מהו, ואיך מודדים אותו.<br><b>מה נלמד כאן:</b> מזג · שלושה סוגי ילדים · בקרה שדורשת מאמץ · ביישן מול חברותי`)}${def("מושג מפתח",`<mark>מזג</mark> ${E("Temperament")}: הבדלים בין־אישיים יציבים ומוקדמים ב<b>תגובתיות</b> (מהירות ועוצמת העוררות הרגשית, הקשב והפעילות) וב<b>ויסות עצמי</b>. הוא אבן הפינה של האישיות.`)}<p>ב־1956 התחילו <b>תומס וצ׳ס</b> את מחקר האורך של ניו יורק (141 ילדים מינקות לבגרות). המזג יכול להגדיל סיכון לקשיים או להגן מפני בית לחוץ, וההורות יכולה לשנות אותו. מתשעה ממדים עלו שלושה טיפוסים:</p>${fig("types")}${tiles([["check","ילד נוח","Easy child: שגרה סדירה מהר, עליז, מסתגל בקלות","תינוק שנכנס מהר לשגרה קבועה, בדרך כלל עליז, ומסתגל בקלות לדברים חדשים.","תינוקת שישנה ואוכלת בשעות קבועות, ומחייכת גם לאורחים חדשים."],["x","ילד קשה","Difficult child: לא סדיר, איטי לקבל חדש, תגובות שליליות ועזות","תינוק שלא נכנס לשגרה קבועה, מקבל דברים חדשים לאט, ומגיב בעוצמה ובשלילה. הוא בסיכון הגבוה ביותר לקשיים בהמשך.","תינוק שמתעורר בשעות שונות כל לילה, וצורח כשמחליפים לו בגדים או מכניסים מזון חדש."],["clock","מתחמם לאט","Slow-to-warm-up: לא פעיל, תגובות מתונות, מצב רוח שלילי, מסתגל לאט","תינוק שקט ולא פעיל, שמגיב בעדינות, ולרוב במצב רוח קצת שלילי. הוא מסתגל לחדש, אבל לאט.","בגן חדש הוא עומד בצד כמה ימים, ורק אחרי שבוע מתחיל לשחק עם הילדים."]])}${rem("הילד ה<b>קשה</b> בסיכון גבוה לבעיות הסתגלות, גם הסתגרות חרדתית וגם תוקפנות. המתחמם לאט מראה פחות בעיות בהתחלה, אבל בגן ובבית הספר עלול להיות מפוחד ומכונס כשמצפים לתגובות מהירות.")}${ex(`<b>קל</b>: תינוק שאוכל וישן בשעות קבועות ומחייך לזרים. <b>קשה</b>: תינוק בלי שגרה שבוכה בעוצמה מכל שינוי. <b>איטי להתחמם</b>: תינוק שבהתחלה נרתע מהגן החדש, אבל אחרי שבוע מסתדר.`)}`,q:"q15"},
  {h:"המודל של רוטבארט ובקרה שדורשת מאמץ",html:`<p>המודל המשפיע ביותר היום. שישה ממדים, עם הבחנה בין <b>מצוקה מפחד</b> ל<b>מצוקה מרוגז</b> (תסכול), ובלי ממדים רחבים מדי כמו סדירות או עוצמה. שלושה רכיבים: <b>רגש</b>, <b>קשב</b> ו<b>פעולה</b>, ועוד ממד ויסות.</p>${rothTable}${def("בקרה שדורשת מאמץ",`<mark>בקרה שדורשת מאמץ</mark> ${E("Effortful control")}: היכולת לדכא באופן רצוני תגובה דומיננטית כדי לתכנן ולבצע תגובה מסתגלת יותר. גם בסין וגם בארה״ב היא מנבאת התמדה, הישגים, בשלות מוסרית (דאגה והתנצלות) ושיתוף פעולה, חלוקה ועזרה.`)}${tiles([["doc","דיווחי הורים","קל, מבוסס על היכרות עמוקה, תואם במידה מסוימת לתצפיות, וחשוב להבנת איך ההורים רואים את הילד. אבל עלול להיות מוטה","דרך למדוד מזג: שואלים את ההורים. זה קל, וההורים מכירים את הילד היטב, אבל הם לא תמיד אובייקטיביים.","אמא של נועם מספרת שהוא ״תמיד רגוע״, גם כשבתצפית רואים שהוא נבהל מהר."],["target","תצפיות","פחות סובייקטיביות ומאפשרות מדדים ביולוגיים. אבל קשה ללכוד אירועים נדירים בבית, ובמעבדה ילד מפוחד עלול לא לסיים","צפייה בהתנהגות של התינוק פחות תלויה בדעה של ההורים, ומאפשרת גם מדידות ביולוגיות. אבל בבית קשה לתפוס אירועים נדירים, ובמעבדה תינוק מפוחד עלול לא לשתף פעולה.","חוקרת צופה בנועם במעבדה כשמראים לו צעצוע חדש, ומודדת גם את הדופק שלו."]])}${ex(`<b>בקרה שדורשת מאמץ</b>: ילדה שרוצה לפתוח את המתנה, אבל מחכה כי אמרו לה שקודם שרים. היא עוצרת את הדחף בכוח הרצון.`)}`,q:"q17"},
  {h:"ביישנות וחברותיות",html:`${def("שני קצוות",`<mark>ילד מאופק או ביישן</mark> ${E("Inhibited, shy child")}: מגיב שלילית לחדש ומתרחק. <mark>ילד פתוח או חברותי</mark> ${E("Uninhibited, sociable child")}: מגיב בחיוב ומתקרב.`)}${ex("<b>לארי ומיטש</b> אצל קגן: בגיל 4 חודשים לארי כיווץ שרירים ובכה מול מובייל, ומיטש חייך. כפעוטות לארי ייבב והתכנס מול רובוטים וזרים, ומיטש צחק וניגש. בגיל 4.5 לארי שמר מרחק מילדים זרים, ומיטש התיידד מהר.")}<p>קגן מצא שכ־<b>20%</b> מבני 4 חודשים מוטרדים בקלות מחידושים, ו־<b>40%</b> נהנים מהם. רק <b>20% עד 25%</b> מהקצוות שמרו על הסגנון עם ההתבגרות: עם הזמן הקיצוניות פחתה.</p>${tiles([["brain","אמיגדלה","אצל ביישנים חידוש מעורר אותה ואת המערכת הסימפתטית. מבוגרים שהיו מאופקים מראים יותר פעילות בה מול פנים זרות","אצל תינוקות ביישנים, כל דבר חדש מפעיל חזק את האמיגדלה ואת מערכת העוררות של הגוף. גם במבוגרים שהיו ביישנים בילדות, האמיגדלה מגיבה חזק יותר לפנים לא מוכרות.","כשאורח חדש נכנס, הדופק של תינוק ביישן עולה, והוא נצמד לאמא."],["chart","גוף","קצב לב גבוה, יותר קורטיזול, אישונים מורחבים, לחץ דם ואצבעות קרות"],["copies","קורטקס","יותר פעילות EEG באונה המצחית הימנית (רגש שלילי) אצל ביישנים, ההפך אצל חברותיים"]])}${rem("לפי קגן רוב הקיצוניים יורשים נטייה, אבל תרומת הגנים <b>מוגבלת</b>. חום ותמיכה מפחיתים תגובתיות, הורות קרה או <b>מגוננת יתר</b> מעצימה חרדה, ודרישה מתונה לגשת לחדש עוזרת. ביישנות מתמשכת מגבירה סיכון לחרדה, דיכאון ופוביה חברתית.")}`,q:"q19"}
 ]},
 {id:"t4",icon:"scales",title:"יציבות, תורשה וטיב התאמה",blocks:[
  {h:"יציבות המזג",html:`${def("על מה הנושא",`האם המזג קבוע לכל החיים? ומה מכריע, הגנים או הסביבה? הנושא מסתיים ברעיון החשוב: לא המזג עצמו קובע, אלא ההתאמה בינו לבין הסביבה.<br><b>מה נלמד כאן:</b> יציבות · גנים וסביבה · גמישות · טיב ההתאמה`)}<p>ילדים עם ציונים קיצוניים נוטים להגיב דומה גם שנים אחר כך, לפעמים עד הבגרות. אבל באופן כללי היציבות <b>נמוכה</b> בינקות ובגיל הרך, ו<b>מתונה</b> מגיל הגן. יש ילדים שלא משתנים, ורבים שכן.</p>${def("למה לא יציב יותר",`המזג עצמו <b>מתפתח</b>. רוב התינוקות בוכים הרבה בחודשים הראשונים ונרגעים עם הוויסות. ומשמעות הפעילות מתהפכת: בהתחלה תינוק פעיל ומתפתל הוא לא נינוח, ותינוק שקט קשוב. כשמתחילים לזחול, הפעיל הוא החוקר הסקרן, והלא פעיל אולי מפוחד.`)}${rem("לכן ניבוי טוב יותר <b>אחרי גיל 3</b>. בין 2.5 ל־3 יש קפיצה בבקרה שדורשת מאמץ (המתנה לפרס, לחישה, ״המלך אמר״), כנראה בזכות התפתחות הקורטקס הקדם־מצחי. פעוטות חששנים מקבלים אחר כך ציונים מעט גבוהים בבקרה, ונרגנים נמוכים יותר. ילדים שליליים עם הורים <b>סבלניים ותומכים</b> מרוויחים הכי הרבה.")}`,q:"q21"},
  {h:"השפעות גנטיות וסביבתיות",html:`<p>תאומים זהים דומים יותר בתכונות מזג ואישיות. בערך <b>מחצית</b> מההבדלים מיוחסים לגנים: השפעה מתונה. גם הסביבה חזקה: תת־תזונה ובתי יתומים דלים משאירים ילדים מוסחים, מפוחדים וחלשים בוויסות.</p>${def("הבדלים אתניים",`תינוקות סינים ויפנים פחות פעילים, נרגנים וקולניים, נרגעים בקלות, אבל גם חשדניים יותר מול זרים. אולי יש שורש גנטי, אבל גם <b>מתאם בין גנים לסביבה</b>: אימהות יפניות רואות בתינוק יצור עצמאי שצריך ללמוד לסמוך עליהן דרך מגע קרוב, ואמריקניות רוצות לגמול מתלות. אסיאתיות עדינות ומנחמות, אמריקניות פעילות ומילוליות.`)}${def("הבדלי מגדר",`בנים פעילים, נועזים ונרגזים יותר בתסכול, ומעט אימפולסיביים (יותר פציעות). בנות דאגניות וביישניות יותר, עם יתרון ב<b>בקרה שדורשת מאמץ</b> (שיתוף פעולה, הצלחה בבית הספר). וההורים מחזקים: בנים לפעילות, בנות לפנייה לעזרה וקרבה.`)}`,q:"q23"},
  {h:"גנים, רגישות ואחאים",html:`<p><b>גן 5-HTTLPR קצר</b> (כרומוזום 17) פוגע בתפקוד הסרוטונין ומגדיל סיכון למצב רוח רע, פחד וקשיי ויסות. אבל:</p>${tiles([["x","הורות גרועה","פעוטות עם הגן נעשו נרגנים יותר ככל שחרדת האם גברה, ותגובתיים יותר לחוסר רגישות, עד תוקפנות והתנגדות בבית הספר","פעוטות עם נטייה גנטית מסוימת רגישים במיוחד לסביבה. כשההורות לחוצה או לא רגישה, הם נעשים נרגנים ותוקפניים יותר מאחרים.","ילד כזה, שאמא שלו חרדה מאוד, מתחיל להתנגד ולהתפרץ בגן."],["check","הורות טובה","עם חום ותמיכה, הוויסות שלהם השתווה לבעלי סיכון נמוך, והם התקדמו יותר בלמידה ובחברה","אותם פעוטות רגישים מרוויחים במיוחד מהורות חמה ותומכת: הוויסות שלהם משתווה לילדים בלי הסיכון, והם מתקדמים יפה.","אותו ילד, עם הורים חמים וסבלניים, לומד להירגע ומשתלב היטב בגן."]])}${def("גמישות",`הם בעלי <b>גמישות</b> ${E("Plasticity")} מוקדמת גבוהה: רגישים להורות טובה וגם לגרועה. לכן הם מגיבים טוב במיוחד להתערבות. ילדים בלי הגן כמעט לא הושפעו מאיכות ההורות.`)}${rem("<b>אחאים:</b> הורים רואים יותר הבדלים בין ילדיהם ממה שצופים רואים. תאומים לא זהים, שחוקרים דירגו דומים במידה מתונה, ההורים תיארו כהפוכים (ביישן וחברותי). ההדגשה הזו משפיעה על ההורות, וכל ילד מעורר תגובות שמתאימות לה.")}${ex(`<b>גמישות</b>: ילד רגיש במיוחד הוא כמו סחלב: בסביבה קשה הוא נפגע יותר מאחרים, אבל עם הורות טובה הוא פורח יותר מכולם.`)}`,q:"q25"},
  {h:"מודל טיב ההתאמה",html:`${def("מושג מפתח",`<mark>מודל טיב ההתאמה</mark> ${E("Goodness-of-fit model")} של תומס וצ׳ס: יצירת סביבת גידול שמכירה במזג של הילד ובה בעת מעודדת תפקוד מסתגל יותר.`)}${ex("ילד <b>קשה</b> מקבל פחות טיפול רגיש, אחר כך משמעת כועסת ומענישה, הוא מתנגד, ההורים לחוצים יותר, כופים ולא עקביים, לפעמים נכנעים ומתגמלים אי־ציות. כך הסגנון הנרגן <b>מתחזק</b>. הורות חיובית ורגישה, עם ציפיות ברורות וגבולות, מפחיתה את הקשיים עד גיל 2 עד 3.")}<p>הורות טובה לילד קשה תלויה גם ב<b>תנאי חיים</b>: בריאות נפשית, נישואים טובים ומצב כלכלי. תינוקות רוסים בזמן משבר כלכלי הראו יותר רגשות שליליים.</p>${def("גם התרבות קובעת",`בסין בעבר ביישנות נחשבה חיובית, ובשנחאי ב־1990 היא נקשרה ליכולת, קבלה ומנהיגות. עם כלכלת השוק המתאמים נחלשו (1998) ו<b>התהפכו</b> (2002), כמו במערב. בכפר עדיין מעריכים ביישנות.`)}${rem("עדיף להתאים מוקדם. אולי חוסר ההתאמה בין ההתערבות של ונסה לבין המזג הפעיל של טימי תרם לקפיצות שלו מפעילות לפעילות. הורים לא אחראים לכל תכונה, אבל יכולים להפוך סביבה שמעצימה בעיות לסביבה שבנויה על <b>נקודות החוזק</b>.")}`,q:"q27"}
 ]},
 {id:"t5",icon:"link",title:"היקשרות: תיאוריות",blocks:[
  {h:"האכלה? הניסוי של הארלו",html:`${def("על מה הנושא",`למה תינוקות נקשרים להורים? הנושא מציג את התשובות התיאורטיות, מהקוף של הארלו ועד בולבי.<br><b>מה נלמד כאן:</b> היקשרות · הניסוי של הארלו · התיאוריה האתולוגית · מודל עבודה פנימי`)}${def("היקשרות",`<mark>היקשרות</mark> ${E("Attachment")}: הקשר החם והחזק לאנשים מיוחדים, שבו אנו נהנים מהאינטראקציה ומתנחמים בקרבתם בעת עקה. במחצית השנייה של השנה הראשונה תינוקות נקשרים למי שנענה לצרכיהם.`)}<p>פרויד טען ראשון שהקשר לאם הוא יסוד לכל היחסים. <b>הגישה הפסיכואנליטית</b> והביהביוריסטית ראו בהאכלה את ההקשר העיקרי (ביהביוריזם: החיוך והליטוף מתקשרים לסיפוק הרעב).</p>${ex("<b>הארלו</b> (שנות ה־50): קופי רזוס עם ״אימהות חלופיות״ התרפקו על אם מבד מגבת, אף שאם מחוטי תיל החזיקה את הבקבוק. גם תינוקות נקשרים לאב, אחאים וסבים שכמעט לא מאכילים, ולשמיכות ודובים.")}${rem("שתי הגישות גם נותנות מעט תשומת לב ל<b>מאפייני התינוק</b>. לכן היום מקובלת התיאוריה האתולוגית.")}`,q:"q29"},
  {h:"התיאוריה האתולוגית של בולבי",html:`${def("מושג מפתח",`<mark>התיאוריה האתולוגית של ההיקשרות</mark> ${E("Ethological theory of attachment")}: הקשר הוא תגובה מתפתחת שמקדמת <b>הישרדות</b>. בולבי, בהשראת ההטבעה של לורנץ, טען שיש מערכת מולדת שמשאירה את ההורה קרוב להגנה ולתמיכה בחקירה. ההאכלה אינה הבסיס.`)}${fig("bowlby")}${tiles([["sprout","1. טרום־היקשרות","לפיתה, חיוך, בכי ומבט. מזהים ריח, קול ופנים של האם, אבל לא מתנגדים להישאר עם זר"],["hand","2. בהתהוות","מגיבים אחרת למוכר (טימי צחק ונרגע מהר יותר עם אמו). תחושת אמון, אבל עוד לא מוחים בפרידה"],["lock","3. חד־משמעית","Separation anxiety: מוחים כשהמטפל יוצא, עולה בין 6 ל־15 חודשים, תלוי במזג ובמצב. עוקבים, מטפסים, בסיס בטוח"],["people","4. יחסים הדדיים","מבינים מה משפיע על יציאה וחזרה, המחאה פוחתת, משא ומתן (קייטלין: ״תקריאו לי סיפור קודם״)"]])}${ex(`תינוק שבוכה כשאמא יוצאת מהחדר ונרגע כשהיא חוזרת. לפי בולבי זו לא "פינוק", אלא מנגנון הישרדות: להישאר קרוב למי שמגן עליך.`)}`,q:"q31"},
  {h:"מודל עבודה פנימי",html:`${def("מושג מפתח",`<mark>מודל עבודה פנימי</mark> ${E("Internal working model")}: מתוך ארבעת השלבים בונים קשר מתמשך שמשמש בסיס בטוח גם כשההורים לא כאן. זו מערכת ציפיות: האם דמות ההיקשרות זמינה, האם תתמוך במצוקה, ואיך העצמי מתנהל מולה. הוא נעשה חלק מהאישיות ומדריך את כל היחסים העתידיים.`)}${ex("בני 12 עד 16 חודשים ראו סרטון: צורה גדולה (״מטפל״) מטפסת במדרון וצורה קטנה (״ילד״) ״בוכה״. בעלי <b>היקשרות בטוחה</b> הביטו יותר כשהמטפל המשיך לטפס ולא חזר, כי זה הפר את הציפייה שלהם. בעלי היקשרות <b>לא בטוחה</b> לא הבחינו בין האירועים (תרשים 7.3).")}${rem("המודל ממשיך להתעדכן עם הגיל, דרך יחסים עם ההורים, מבוגרים אחרים, אחאים וחברים.")}`,q:"q33"}
 ]},
 {id:"t6",icon:"data",title:"מדידת ההיקשרות",blocks:[
  {h:"המצב הזר וארבעת הדפוסים",html:`${def("על מה הנושא",`איך יודעים אם תינוק קשור בצורה בטוחה? הנושא מציג את שיטות המדידה ואת ארבעת הדפוסים.<br><b>מה נלמד כאן:</b> המצב הזר · ארבעה דפוסי היקשרות · Q-Sort · יציבות ותרבות`)}${def("מושג מפתח",`<mark>המצב הזר</mark> ${E("Strange Situation")} של <b>איינסוורת׳</b>: הטכניקה הרווחת בגיל שנה עד שנתיים. שמונה אפיזודות קצרות של פרידה ואיחוד בחדר לא מוכר עם זר. התגובה ל<b>איחוד</b> מגדירה במידה רבה את איכות ההיקשרות.`)}${ssTable}${tiles([["check","בטוחה","Secure: ההורה בסיס בטוח. אולי בוכים בפרידה (כי מעדיפים את ההורה), שמחים בבירור בשובו והבכי פוחת מיד","התינוק משתמש בהורה כבסיס: יוצא לחקור וחוזר אליו. אולי בוכה כשההורה יוצא, אבל שמח מאוד כשהוא חוזר ונרגע מהר.","נועם בוכה כשאמא יוצאת מהחדר, וכשהיא חוזרת הוא רץ אליה, נרגע תוך דקה וחוזר לשחק."],["x","לא בטוחה־נמנעת","Avoidant: לא מגיבים להורה, לא מוטרדים ביציאה, מגיבים לזר כמו להורה, נמנעים ממנו באיחוד ולא מתרפקים","התינוק כמעט לא מגיב להורה: לא מוטרד כשהוא יוצא, ומתעלם ממנו או נמנע ממנו כשהוא חוזר.","כשאמא חוזרת לחדר, התינוק ממשיך לשחק ולא מסתכל עליה."],["cycle","לא בטוחה־מתנגדת","Resistant: מחפשים קרבה ולא חוקרים, מצוקה ביציאה, ובאיחוד היצמדות עם כעס והתנגדות, לא נרגעים","התינוק נצמד להורה ולא חוקר. הוא במצוקה כשההורה יוצא, וכשהוא חוזר, התינוק גם נצמד וגם כועס ומתנגד, ולא נרגע.","כשאמא חוזרת, התינוקת מבקשת שתרים אותה, ואז בועטת בה ובוכה בלי להירגע."],["question","חסרת ארגון וכיוון","Disorganized/disoriented: הכי לא בטוחה. התנהגות סותרת ומבולבלת: מסיטים מבט כשמוחזקים, קופאים, צועקים פתאום","סוג ההיקשרות הכי פחות בטוח: התינוק מתנהג באופן סותר ומבולבל, למשל מתקרב להורה אבל מסיט מבט, או קופא פתאום.","כשאבא חוזר, התינוק זוחל לעברו, ופתאום עוצר וקופא עם מבט ריק."]])}${fig("ssp","שכיחות הדפוסים במשפחות ממעמד בינוני בצפון אמריקה. במעמד נמוך פחות בטוחים")}${ex(`במעבדה, אמא יוצאת מהחדר ומשאירה את הפעוט עם זרה. כשהיא חוזרת, החוקרים מסתכלים בעיקר על דבר אחד: איך הפעוט מגיב לאיחוד.`)}`,q:"q35"},
  {h:"Q-Sort, יציבות ותרבות",html:`${def("שאלון Q-Sort",`<mark>שאלון היקשרות מסוג Q-Sort</mark>: לגילים 1 עד 5, מבוסס על תצפית בבית. ממיינים 90 התנהגויות לתשע קטגוריות ומחשבים רמת ביטחון. מכסה יותר התנהגויות ואולי משקף טוב יותר את היום־יום. אבל דורש זמן רב, מיון של צופה מומחה (מיוני הורים לא תואמים למצב הזר), ולא מבחין בין סוגי חוסר הביטחון.`)}<p><b>יציבות:</b> הממצאים מגוונים. ההיקשרות נשארת בטוחה ויציבה במעמד בינוני עם תנאים נאותים. ילדים עוברים לביטחון כשהאם מסתגלת היטב ויש תמיכה. במשפחות עניות לחוצות היא לרוב מתרחקת מביטחון. בטוחים יציבים יותר, וחסרת ארגון היא יוצאת דופן: יציבה מאוד או מנבאת חוסר ביטחון אחר בהמשך.</p>${tiles([["people","גרמניה","יותר נמנעים: ההורים מעריכים עצמאות ומעודדים לא להיצמד"],["hand","הדוגון (מאלי)","אף תינוק לא נמנע: האם תמיד זמינה ומניקה בתגובה למצוקה"],["lock","יפן וקיבוצים","יותר מתנגדים, אבל אולי לא חוסר ביטחון אמיתי: ביפן כמעט לא משאירים תינוק עם אחרים, ובקיבוץ זרים מפחידים"]])}${rem("למרות ההבדלים, ההיקשרות ה<b>בטוחה</b> היא הדפוס השכיח ביותר בכל החברות שנחקרו.")}`,q:"q37"}
 ]},
 {id:"t7",icon:"gear",title:"מה משפיע על היקשרות בטוחה",blocks:[
  {h:"זמינות של מטפל קבוע",html:`${def("על מה הנושא",`מה גורם להיקשרות בטוחה? הנושא עובר על ארבעה גורמים: האם יש מטפל קבוע, איך הוא מטפל, מי התינוק, ומה קורה במשפחה.<br><b>מה נלמד כאן:</b> מטפל קבוע · טיפול רגיש · סנכרון · מזג · מודלי ההורים · מסגרות יום`)}<p>ארבעה גורמים נחקרו: <b>זמינות מוקדמת</b> של מטפל קבוע, <b>איכות הטיפול</b>, <b>מאפייני התינוק</b> וה<b>הקשר המשפחתי</b>.</p>${ex("במוסד עם יחס צוות טוב וצעצועים רבים, אבל תחלופה עצומה: עד גיל 4.5 ילד טופל בידי כ־<b>50</b> מטפלים. רבים אומצו אחרי גיל 4 ורובם נקשרו להורים המאמצים, אבל היו יותר קשיים: רצון מופרז לתשומת לב, ״ידידותיות יתר״ עם זרים, אי־חזרה להורה בחרדה ומעט חברים.")}${def("בתי יתומים דלים",`ילדים מבתי יתומים במזרח אירופה נקשרים להורים המאמצים, אבל עם שיעורים גבוהים של חוסר ביטחון, חברותיות לא מבחינה או עצב והסתגרות, ובעיות מתמשכות (קשב, דיכאון, תוקפנות). כבר ב־7 חודשים יש ירידה ב־ERP להבעות רגש, ו<b>אמיגדלה</b> גדולה מהרגיל קשורה להבנת רגשות וויסות גרועים.`)}${rem("התפתחות רגשית תקינה מלאה תלויה בקשר הדוק עם מטפל <b>מוקדם</b> בחיים.")}`,q:"q39"},
  {h:"איכות הטיפול",html:`${def("טיפול רגיש",`<mark>טיפול רגיש</mark> ${E("Sensitive caregiving")}: תגובה מהירה, עקבית ומותאמת, והחזקה עדינה. קשור במידה מסוימת להיקשרות בטוחה, באימהות ביולוגיות ומאמצות ובתרבויות שונות. אימהות לבטוחים מתייחסות לתינוק <b>כבעל מחשבות ורגשות</b> (״אתה באמת אוהב את הנדנדה!״).`)}${def("סנכרון אינטראקטיבי",`<mark>סנכרון אינטראקטיבי (מהדהד)</mark> ${E("Interactional synchrony")}: ״ריקוד רגשי״ שבו המטפל מגיב מיד, בקצב ובהתאמה, ושניהם מתאימים מצבים רגשיים, בעיקר חיוביים. תיאום <b>מתון</b> מנבא ביטחון טוב יותר מתיאום ״הדוק״: מטפל רגוע מקבל אי־התאמות ומתקן אותן.`)}${tiles([["leaf","הגוסי (קניה)","מעט חיבוקים ומשחק, אבל מענה לצרכים, ורוב התינוקות בטוחים: הביטחון תלוי בטיפול קשוב, לא באינטראקציה רציפה","גם בלי הרבה חיבוקים ומשחק, רוב התינוקות היו בטוחים. מה שחשוב הוא שהמבוגר יענה לצרכים של התינוק.","אמא שלא משחקת הרבה עם התינוק, אבל ניגשת מיד כשהוא רעב או בוכה."],["hand","פוארטו ריקו","כיוון פיזי והגבלה קשורים לביטחון שם, אבל במערב נחשבים מתערבים ומנבאים חוסר ביטחון"]])}${rem("<b>נמנעים</b>: טיפול חודרני ועודף גרייה, וההימנעות היא בריחה. <b>מתנגדים</b>: טיפול לא עקבי, לא נענה, אבל מתערב כשהתינוק חוקר. <b>חסרי ארגון</b>: התעללות והזנחה, דיכאון, טראומה ואובדן אצל ההורה, והתנהגות מאיימת או מפחידה: ההורה גם מנחם וגם מפחיד.")}${ex(`<b>טיפול רגיש</b>: התינוק בוכה, ואבא בודק אם הוא רעב, עייף או צריך חיבוק. <b>סנכרון</b>: אמא ותינוק "משחקים בתורות": היא מחייכת, הוא מגרגר, היא עונה בקול, כמו ריקוד.`)}`,q:"q41"},
  {h:"מאפייני התינוק",html:`<p>היקשרות היא יחסי גומלין, ולכן גם התינוק משפיע. פגות, סיבוכי לידה ומחלה דורשים הרבה, ובמשפחות לחוצות קשורים לחוסר ביטחון. במחקר אחד, פגות <b>יחד עם</b> סיכון כלכלי או נפשי של האם (ולא פגות לבדה) הפחיתה רגישות וניבאה חוסר ביטחון בגיל שנה. תינוקות בסיכון עם הורים פנויים וסבלניים מתפתחים בביטחון.</p>${def("מזג וגנים",`תינוקות תגובתיים רגשית בסיכון גבוה יותר, ותינוקות לא מאורגנים ב־NBAS בסיכון לחוסר ארגון. אבל שוב <b>גן־סביבה</b>: גן 5-HTTLPR קצר מגדיל סיכון לחוסר ארגון רק עם אם לא מגיבה, ו־<b>DRD4 7-repeat</b> קשור לחוסר ארגון רק כשהאם חוותה אובדן לא פתור או טראומה.`)}${rem("בתאומים, להיקשרות <b>אין תורשתיות</b>. ושני שלישים מהאחאים מפתחים אותו דפוס אף שהמזג שונה: רוב ההורים מתאימים את הטיפול לכל ילד. התערבויות שמלמדות רגישות ומשמעת יעילה הפחיתו קורטיזול והתנהגות הרסנית בפעוטות עם DRD4.")}`,q:"q43"},
  {h:"הקשר משפחתי ומסגרות יום",html:`${ex("טימי: הוריו התגרשו אחרי לידתו, ונסה חרדה עבדה 50 שעות בשבוע ושמרטפית לקחה אותו לרוב. ביום הולדתו הראשון הוא <b>התעלם</b> ממנה כשבאה. גירושים, קשיים כלכליים ובעיות נפשיות פוגעים ברגישות ובאקלים המשפחתי, ותמיכה חברתית מגינה. בזכות ג׳ינט ועצות הפסיכולוג, בגיל שנתיים היחסים השתפרו.")}${def("מודלי העבודה של ההורים",`כששואלים הורים על ילדותם: מי שמדבר באופן <b>אובייקטיבי ומאוזן</b>, בלי קשר אם החוויות היו טובות, נוטה לילד בטוח ולהורות רגישה. מי שמבטל את חשיבות היחסים או מתאר אותם בכעס ובלבול נוטה לילד לא בטוח. אבל אלה <b>זיכרונות משוחזרים</b>: מה שקובע הוא היכולת לקבל חוויות שליליות ולהביט בהורים בהבנה ובסליחה, יותר מההיסטוריה עצמה.`)}${def("מסגרות יום",`טיפול לא הורי <b>כשלעצמו</b> לא פוגע בהיקשרות (NICHD, יותר מ־1,300 תינוקות). איכות ההורות משפיעה יותר. חוסר ביטחון עולה בשילוב סיכונים: טיפול לא רגיש בבית ובמעון, שעות רבות או כמה מסגרות. מעל <b>30 שעות</b> בשבוע קשורות ליותר בעיות מוחצנות בגיל 4.5 עד 5, אבל טיפול איכותי מגן, ובאוסטרליה ובנורווגיה אין קשר כזה. הפתרון: מסגרות איכותיות, חופשת לידה ומשרה חלקית.`)}${rem("אפשר להבין היקשרות במלואה רק מנקודת מבט של <b>מערכות אקולוגיות</b>.")}`,q:"q45"}
 ]},
 {id:"t8",icon:"people",title:"היקשרויות מרובות והמשך",blocks:[
  {h:"אבות",html:`${def("על מה הנושא",`תינוקות נקשרים לא רק לאמא. הנושא מציג עוד דמויות היקשרות, ומה ההיקשרות המוקדמת מנבאת בהמשך החיים.<br><b>מה נלמד כאן:</b> אבות · סבים ואחאים · היקשרות והתפתחות מאוחרת`)}<p>בולבי האמין שיש העדפה לדמות אחת, אבל התיאוריה שלו מתארת <b>היקשרויות מרובות</b>. בני שנה במצוקה בוחרים בדרך כלל באם, וההעדפה פוחתת בשנה השנייה. טיפול רגיש של האב מנבא היקשרות בטוחה אליו.</p>${tiles([["hand","אימהות","יותר טיפול פיזי והבעת אהבה. משחק עדין: צעצועים, דיבור, ״קוקו״"],["target","אבות","יותר משחק, פיזי וממריץ עם פרצי התלהבות, בעיקר עם בנים. כשהוא רגיש, עוזר לווסת רגשות ומכין לסביבות חדשות","אבות נוטים למשחק פיזי ומלהיב יותר. כשהאב רגיש, המשחק הזה עוזר לילד ללמוד לווסת רגשות ולהתמודד עם מצבים חדשים.","אבא של נועם מקפיץ אותו באוויר, ועוצר כשהוא רואה שנועם מתחיל להיבהל."]])}${def("שינוי בזמן",`בסקר בארה״ב, אבות מתחת לגיל 29 מקדישים <b>85%</b> מהזמן שאימהות מקדישות (מעט יותר מ־4 שעות ביום עבודה), כמעט פי שניים מלפני 30 שנה. כשליש מהנשים העובדות אומרות שבן הזוג שותף שווה. אבות היספנים מקדישים יותר זמן.`)}${def("חום אבהי",`בתרבויות רבות, מעורבות אוהבת של האב מנבאת כישורים קוגניטיביים, רגשיים וחברתיים <b>כמו</b> חום האם, ולפעמים יותר. אצל <b>האקה</b> במרכז אפריקה אבות נמצאים במרחק יד מהתינוק יותר ממחצית היום, כי הזוגות משתפים פעולה באופן יוצא דופן. גם במערב, נישואים מאושרים קשורים למעורבות אבהית רבה יותר.`)}${ex(`אבות נוטים יותר למשחק פיזי מלהיב, כמו לזרוק לאוויר ולהשתולל, ואמהות יותר לטיפול ולמשחק רגוע. שניהם בונים היקשרות.`)}`,q:"q47"},
  {h:"סבים ואחאים",html:`${def("סבים כמטפלים עיקריים",`כ־2.4 מיליון ילדים בארה״ב (4% עד 5%) גרים עם סבים בלי ההורים: <mark>משפחות שדילגו על דור</mark> ${E("Skipped-generation families")}. בדרך כלל בגלל בעיות של ההורים (חומרים, התעללות, מחלת נפש, הורות בהתבגרות). הילדים מגיעים עם קשיים, ההורים לפעמים מפריעים, יש עומס כלכלי ורגשי. ובכל זאת נוצרת <b>היקשרות משמעותית</b> שמגינה על הילדים, והסבים זקוקים לתמיכה.`)}<p><b>אחאים:</b> 80% מהילדים גדלים עם אח לפחות. תינוק חדש קשה לילד בגיל הגן: תובענות, היצמדות, פחות היקשרות בטוחה (בעיקר מעל גיל שנתיים או כשהאם לחוצה). אבל גם אהבה ודאגה, ובסוף השנה התינוק נרגע ליד האח ובהמשך פונה אליו לנחמה.</p>${tiles([["clock","זמן מיוחד","בילוי עם הילד הגדול, בעזרת בן הזוג","כשנולד אח, עוזר לילד הגדול לקבל זמן מיוחד רק בשבילו, לפעמים בעזרת בן הזוג.","כשאמא עם התינוקת, אבא לוקח את נועם לגינה, רק שניהם."],["bulb","סבלנות","תגובה סבלנית להתנהגות לא הולמת, והזדמנויות לגאווה בעזרה","כשהילד הגדול מתנהג לא יפה אחרי לידת אח, עוזר להגיב בסבלנות, ולתת לו הזדמנויות להרגיש גאה כשהוא עוזר.","נועם מביא חיתול לתינוקת, ואמא אומרת ״איזה אח גדול ועוזר אתה״."],["phone","להסביר","לדבר על רצונות התינוק: ״הוא מנסה להגיע לרעשן״","עוזר לדבר עם הילד הגדול על מה שהתינוק רוצה ומרגיש, כדי שיבין אותו ויתחבר אליו.","״תראה, היא מנסה להגיע לרעשן. אולי תביא לה אותו?״"],["link","זוגיות","תמיכה הדדית ופתרון בעיות יחד מסייעים להתמודד עם קנאה","כשנולד אח חדש, גם הקשר בין ההורים משפיע. הורים שתומכים זה בזה עוזרים לילד הגדול להתמודד עם הקנאה.","ההורים של נועם מתחלקים: אחד מטפל בתינוקת, והשני מבלה זמן מיוחד עם נועם."]])}${rem("גם מזג משפיע (יותר קונפליקט אם אח לחוץ או פעיל מאוד), וחום אימהי לשני הילדים קשור לאינטראקציה חיובית ביניהם, וקשיחות לטינה.")}`,q:"q49"},
  {h:"מקבוצת השווים להתפתחות מאוחרת",html:`<p><b>חברות מוקדמת:</b> בגיל 6 חודשים מביטים, מחייכים ומושיטים יד לבני גילם. בסוף השנה יש לפעמים פעולה הדדית. בין שנה לשנתיים מבינים שלאחר כוונות ורגשות משלו, ויש יותר אינטראקציה מתואמת: חיקוי, רדיפה, השלכה משותפת. בגיל שנתיים משתמשים במילים (״בואי נשחק תופסת״). קשר חם עם ההורים ומסגרת איכותית בקבוצה קטנה מקדמים זאת.</p>${def("היקשרות והתפתחות מאוחרת",`במחקר אורך, ילדים בטוחים בינקות היו בגן גבוהים יותר בהערכה עצמית, מיומנויות חברתיות ואמפתיה, בגיל 11 עם חברויות טובות יותר, ובבגרות עם יותר תמיכה, קשרים רומנטיים יציבים והשכלה. אבל במחקרים אחרים <b>לא תמיד</b>.`)}${rem(`ההסבר: <b>המשכיות הטיפול</b> ${E("Continuity of caregiving")}. בטוחים עם הורות רגישה בהמשך קיבלו את הציונים הגבוהים, לא בטוחים עם הורות לא רגישה הנמוכים, והאחרים באמצע. לא בטוחים שאימותיהם השתפרו הראו <b>הבראה</b>, כמו בחוסן. ההיקשרות הבטוחה מתחילה ״ברגל ימין״, אבל השפעתה <b>מותנית</b> ביחסים העתידיים.`)}`,q:"q51"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"פעוט מתעקש לנעול לבד נעליים ונכשל. מה יקדם אוטונומיה, לפי אריקסון?","a":"סבלנות ובחירה הגיונית בין שתי אפשרויות","w":["לנעול לו מהר כדי לחסוך לו תסכול","להסביר לו שהוא עוד קטן מדי לזה","לתת לו לנסות לבד בלי שום הדרכה"],"e":"לפי אריקסון, אוטונומיה מתפתחת כשנותנים לפעוט הדרכה ובחירות הגיוניות, ומגלים סבלנות כשהוא נכשל או עומד על שלו. כשעושים בשבילו, מונעים ממנו להתנסות."},{"q":"מהו הרמז המהימן ביותר לרגשות של תינוקות?","a":"הבעות הפנים","w":["קצב הלב","טון הבכי","תנועות הידיים"],"e":"הבעות הפנים הן הרמז המהימן ביותר לרגשות של תינוקות, ולכן הן הכלי העיקרי במחקר. קצב הלב פחות ספציפי לרגש."}]},
"q2":{"t":"t1","v":[{"q":"תינוק מחייך גם כשהוא מתוח וגם כשהוא שמח. מה זה מלמד?","a":"אין קשר קבוע בין הבעה לרגש","w":["שהוא עוד לא מרגיש רגשות","שהחיוך שלו הוא רפלקס בלבד","שהוא מסתיר רגשות מכוונה"],"e":"תינוק יכול לחייך גם כשהוא מתוח וגם כשהוא שמח, כלומר אין קשר קבוע בין הבעה לרגש: אותה הבעה יכולה לבטא רגשות שונים. זה לא אומר שהוא לא מרגיש."},{"q":"תינוקות עיוורים מביעים רגש בתנועות אצבעות. מה קרה כשהראו זאת להורים?","a":"ההורים הגיבו ביותר הדדיות","w":["ההורים לא שינו את התגובות","ההורים הגיבו בפחות מגע","התינוקות הפסיקו להזיז אצבעות"],"e":"כשהראו להורים של תינוקות עיוורים שהם מביעים רגש בתנועות אצבעות, ההורים התחילו להגיב ביותר הדדיות. הם לא הגיבו בפחות מגע."}]},
"q3":{"t":"t1","v":[{"q":"תינוק בן 3 שבועות מחייך בשינה. האם זה חיוך חברתי?","a":"לא, חיוך חברתי מופיע בגיל 6–10 שבועות","w":["כן, כל חיוך של תינוק הוא חברתי","כן, אם ההורה רואה את החיוך","לא, חיוך חברתי מופיע רק בגיל שנה"],"e":"חיוך חברתי הוא חיוך רחב בתגובה לתקשורת של ההורה, ומופיע בגיל 6 עד 10 שבועות. חיוך בשינה בגיל 3 שבועות אינו חברתי."},{"q":"למה החיוך החברתי של תינוקות הנאסו בקמרון מתעכב?","a":"אמהות מעריכות רוגע ומשחקות פחות פנים אל פנים","w":["תינוקות שם מתפתחים לאט יותר באופן כללי","האמהות שם לא מחייכות לתינוקות כלל","יש שם פחות מבוגרים בסביבת התינוק"],"e":"אמהות הנאסו בקמרון מעריכות רוגע ומשחקות פחות משחקי פנים אל פנים, ולכן החיוך החברתי של התינוקות מתעכב. זו השפעה תרבותית, ולא בגלל שהאמהות לא מחייכות."}]},
"q4":{"t":"t1","v":[{"q":"בן 4 חודשים צוחק כשאבא עושה ״אני אוכל לך את הבטן״. מה הצחוק משקף?","a":"עיבוד מידע מהיר","w":["רפלקס של מגע בבטן","פחד שמתבטא בצחוק","חיקוי של צחוק האב"],"e":"צחוק מופיע בגיל 3 עד 4 חודשים, ומשקף עיבוד מידע מהיר יותר מחיוך: התינוק צריך לקלוט את ההפתעה במשחק. זה לא רפלקס."},{"q":"מה קיים אצל יילודים לפני שהרגשות מתבהרים?","a":"משיכה לנעים והתרחקות מלא נעים","w":["שמחה, כעס ופחד ברורים כבר מהלידה","רק מצוקה כללית, בלי שום משיכה","רגשות של מודעות עצמית בסיסיים"],"e":"לפני שהרגשות מתבהרים, ליילודים יש שני מצבים כלליים: משיכה לגירוי נעים והתרחקות מגירוי לא נעים. רגשות בסיסיים ברורים מופיעים רק בהמשך."}]},
"q5":{"t":"t1","v":[{"q":"בת 6 חודשים כועסת כשאמא לוקחת ממנה את המפתחות. למה הכעס גובר בגיל הזה?","a":"היא מזהה מי חסם את מטרתה","w":["היא עייפה יותר בגיל הזה","היא עוד לא מבינה מה קרה","הכעס הוא רפלקס של יילודים"],"e":"מגיל 4 עד 6 חודשים ההתנהגות נעשית מכוונת, והתינוקת מזהה מי חסם את המטרה שלה, ולכן הכעס גובר. גם ההורים מציבים יותר גבולות. זה לא בגלל עייפות."},{"q":"בניסוי הפנים הקפואות, מה עשו תינוקות כשלא הצליחו להחזיר את ההורה?","a":"הסיטו מבט, קימטו מצח ובכו","w":["המשיכו לחייך כרגיל להורה","פנו מיד לאדם אחר בחדר","נרדמו מעייפות אחרי דקה"],"e":"בניסוי הפנים הקפואות, כשלא הצליחו להחזיר את ההורה לתקשורת, התינוקות הסיטו מבט, קימטו מצח ובכו. הם לא המשיכו לחייך."}]},
"q6":{"t":"t1","v":[{"q":"תינוקת שהמטפלת האהובה עליה עזבה, נעשית שקטה ומנותקת. איזה רגש הכי סביר?","a":"עצב","w":["כעס","פחד מזרים","בושה"],"e":"עצב מופיע לעתים קרובות כשמאבדים מטפל מוכר ואוהב, ולכן תינוקת שהמטפלת שלה עזבה ונעשית שקטה ומנותקת מביעה כנראה עצב. אין כאן כעס או פחד מזרים."},{"q":"למה הכעס נחשב רגש מסתגל אצל תינוקות גדולים?","a":"הוא עוזר להתגבר על מכשולים ולגייס עזרה","w":["הוא מרחיק את המטפלים מהתינוק","הוא מסמן בעיה התפתחותית מוקדמת","הוא מפחית את הצורך של התינוק במגע"],"e":"כעס עוזר לתינוקות גדולים להגן על עצמם, להתגבר על מכשולים ולהניע את המטפל להקל, ולכן הוא רגש מסתגל. הוא לא מרחיק את המטפלים."}]},
"q7":{"t":"t1","v":[{"q":"שני תינוקות בני 10 חודשים פוגשים זר. אחד בוכה, השני מחייך. מה יכול להסביר זאת?","a":"מזג, ניסיון קודם עם זרים והמצב","w":["רק הגיל המדויק של כל אחד","רק המין של התינוק","רק כמה זמן הזר נשאר"],"e":"חרדת זרים תלויה במזג, בניסיון קודם עם זרים ובמצב הנוכחי, ולכן שני תינוקות באותו גיל יכולים להגיב אחרת. היא לא תלויה רק בגיל."},{"q":"למה אצל שבט האפה כמעט אין חרדת זרים?","a":"התינוקות עוברים בין מבוגרים רבים","w":["כי התינוקות שם לא מפחדים בכלל","כי אין שם זרים כלל","כי האמהות לא עוזבות לעולם"],"e":"אצל שבט האפה תינוקות עוברים בין מבוגרים רבים כבר מהלידה, ולכן כמעט אין אצלם חרדת זרים. זה לא שאין שם זרים."}]},
"q8":{"t":"t1","v":[{"q":"פעוט בגן שעשועים מתרחק לשחק, חוזר לגעת באבא, ושוב יוצא. מה האב משמש?","a":"בסיס בטוח","w":["דמות זרה","הירמזות חברתית","מודל עבודה"],"e":"מטפל מוכר שממנו הפעוט יוצא לחקור, ואליו הוא חוזר לתמיכה, הוא בסיס בטוח. הירמזות חברתית היא חיפוש מידע רגשי אצל מבוגר במצב לא ברור."},{"q":"מה נמצא אצל תינוקות בקיבוצים לגבי חרדת זרים?","a":"היא הייתה גבוהה יותר מבעיר","w":["היא הייתה נמוכה יותר מבעיר","לא הייתה בכלל","זהה לתינוקות בעיר"],"e":"אצל תינוקות בקיבוצים בישראל נמצאה חרדת זרים גבוהה בהרבה מאשר בעיר. היא לא הייתה נמוכה יותר."}]},
"q9":{"t":"t2","v":[{"q":"בת 12 חודשים מגיעה לצעצוע מוזר, מביטה באמא, וזו אומרת ״אוי!״ בפחד. מה היא עושה?","a":"הירמזות","w":["חרדת זרים","בסיס בטוח","ויסות עצמי"],"e":"התינוקת מביטה באמא כדי להבין איך להגיב לצעצוע מוזר, ומקבלת ממנה מידע רגשי. זו הירמזות חברתית: חיפוש מידע רגשי מאדם מהימן במצב לא ברור."},{"q":"מה השפיע יותר בהירמזות חברתית?","a":"קול, לבד או עם פנים","w":["פנים לבד, בלי קול","מגע של ההורה","תנועות הידיים בלבד"],"e":"בהירמזות חברתית, הקול, לבד או עם הפנים, השפיע יותר מהפנים לבד. לכן המסיח ״פנים לבד״ שגוי."}]},
"q10":{"t":"t2","v":[{"q":"אישה הראתה שהיא אוהבת ברוקולי ולא קרקרים. בן 18 חודשים מעדיף קרקרים. מה ייתן לה?","a":"ברוקולי","w":["קרקרים","את שניהם","כלום"],"e":"פעוטות בני 18 חודשים נתנו לאישה את המאכל שהיא הראתה שהיא אוהבת (ברוקולי), גם אם הם עצמם העדיפו קרקרים. הם מבינים שלאחר יש העדפות משלו."},{"q":"בגיל 3 חודשים, מה מתחילים תינוקות לצפות מהשותף לאינטראקציה?","a":"שיגיב להם","w":["שיחייך תמיד","שיתעלם מהם","שיאכיל אותם"],"e":"בגיל 3 חודשים תינוקות מתחילים לצפות שהשותף יגיב בהתאם למבטים, לחיוכים ולקולות שלהם. לכן הם מוטרדים כשהפנים ״קופאות״."}]},
"q11":{"t":"t2","v":[{"q":"איזה מהבאים אינו רגש של מודעות עצמית?","a":"פחד","w":["בושה","גאווה","קנאה"],"e":"אשמה, בושה, מבוכה, קנאה וגאווה הם רגשות של מודעות עצמית. פחד הוא רגש בסיסי, שמופיע כבר בשנה הראשונה."},{"q":"מתי מופיעים רגשות של מודעות עצמית?","a":"באמצע השנה השנייה","w":["בחודשים הראשונים","בסוף השנה הראשונה","רק בגיל הגן"],"e":"רגשות של מודעות עצמית מופיעים באמצע השנה השנייה, כשהמודעות לעצמי מתגבשת. בחודשים הראשונים מופיעים רק רגשות בסיסיים."}]},
"q12":{"t":"t2","v":[{"q":"פעוט שבר כוס. מה עוד נדרש, מלבד מודעות עצמית, כדי שירגיש אשמה?","a":"הדרכה של מבוגר","w":["רק גיל מבוגר יותר","רק אוצר מילים רחב","רק עונש על המעשה"],"e":"מעבר למודעות עצמית, פעוטות צריכים הדרכה של מבוגר מתי להרגיש גאווה, בושה או אשמה. הגיל לבדו לא מספיק."},{"q":"ילד יפני שמתגאה בפומבי בהצלחה אישית. מה צפוי?","a":"מבוכה","w":["גאווה, כמו במערב","אדישות מהסביבה","שבחים רבים מהמורים"],"e":"במערב מתגאים בהישג אישי, אבל בסין וביפן הדגשה של הצלחה אישית מעוררת מבוכה, ולכן ילד יפני שמתגאה בפומבי צפוי להרגיש מבוכה ולא גאווה."}]},
"q13":{"t":"t2","v":[{"q":"בן 3 חודשים נסער, וההורה מרים, מנענע ומדבר ברכות. מה זה מדגים?","a":"ויסות בעזרת מטפל","w":["ויסות עצמי עצמאי","הירמזות חברתית","בקרה שדורשת מאמץ"],"e":"בחודשים הראשונים תינוקות מווסתים בעיקר בעזרת המטפל: הרמה, נענוע, ליטוף ודיבור רך. ויסות עצמי עצמאי מתפתח רק בהמשך."},{"q":"מהו ויסות עצמי רגשי?","a":"התאמת הרגש לעוצמה שמאפשרת להשיג מטרות","w":["דיכוי מלא של כל רגש שלילי שעולה","ביטוי חופשי של כל רגש בלי שליטה","הבנה של הרגשות של אנשים אחרים"],"e":"ויסות עצמי רגשי הוא אסטרטגיות להתאים את המצב הרגשי לעוצמה נוחה, שמאפשרת להשיג מטרות. זה לא דיכוי מלא של רגשות."}]},
"q14":{"t":"t2","v":[{"q":"הורים שמתערבים רק כשהתינוק כבר צורח. מה צפוי?","a":"התינוק יעבור מהר למצוקה, וקשה יותר להרגיע","w":["התינוק ילמד להירגע לבד עם הזמן","התינוק יבכה פחות ככל שיגדל","אין לכך השפעה על התינוק בכלל"],"e":"כשהורים מתערבים רק אחרי שהתינוק כבר נסער מאוד, הם מחזקים מעבר מהיר למצוקה, וקשה יותר להרגיע אותו. הוא לא ילמד מזה להירגע לבד."},{"q":"למה בנים מקבלים יותר עידוד לדכא רגשות שליליים?","a":"הם מתקשים יותר בוויסות רגשות שליליים","w":["הם מרגישים פחות רגשות שליליים","הם מבקשים זאת מההורים","זה נדרש בחוק החינוך"],"e":"בנים מתקשים יותר בוויסות רגשות שליליים, ולכן מקבלים יותר עידוד לדכא אותם. זה לא בגלל שהם מרגישים פחות רגשות שליליים."}]},
"q15":{"t":"t3","v":[{"q":"מהו מזג?","a":"הבדלים מוקדמים ויציבים בתגובתיות ובוויסות","w":["רגש חולף שמשתנה מרגע לרגע","דפוס שנלמד רק מההורים","סוג ההיקשרות של התינוק להורה"],"e":"מזג הוא הבדלים בין־אישיים יציבים ומוקדמים בתגובתיות ובוויסות העצמי. הוא לא רגש חולף, ולא דפוס שנלמד רק מההורים."},{"q":"במחקר ניו יורק, איזה אחוז היו ״ילדים נוחים״?","a":"40%","w":["10%","15%","65%"],"e":"במחקר ניו יורק כ-40% היו ״ילדים נוחים״, 10% ״ילדים קשים״ ו-15% ״מתחממים לאט״. השאר לא סווגו."}]},
"q16":{"t":"t3","v":[{"q":"תינוק שאוכל וישן בזמנים לא צפויים, בוכה בעוצמה ומתקשה עם דברים חדשים. מה הוא לפי תומס וצ'ס?","a":"ילד קשה","w":["ילד מתחמם לאט","ילד נוח","ילד חסר ארגון"],"e":"שגרה לא סדירה, קבלה איטית של דברים חדשים ותגובות שליליות ועזות מאפיינות ילד קשה לפי תומס וצ׳ס. מתחמם לאט מגיב בעוצמה נמוכה."},{"q":"ילד שקט ואיטי להתחמם נראה בסדר בבית. מתי יתחילו קשיים?","a":"בגן ובבית הספר","w":["כבר בגיל שלושה חודשים","רק בגיל ההתבגרות","לעולם לא יופיעו"],"e":"ילד מתחמם לאט מתחיל להראות קשיים בגן ובבית הספר, כשמצפים ממנו לתגובות מהירות ופעילות. בבית הוא עשוי להיראות בסדר."}]},
"q17":{"t":"t3","v":[{"q":"ילד מצליח לחכות לתורו למרות שהוא רוצה מאוד לחטוף. איזה ממד של רוטבארט זה?","a":"בקרה שדורשת מאמץ","w":["רמת פעילות","מצוקה מרוגז","רגשיות חיובית"],"e":"היכולת לדכא באופן רצוני תגובה דומיננטית (לחטוף) כדי לבצע תגובה מסתגלת יותר (לחכות) היא בקרה שדורשת מאמץ. מצוקה מרוגז היא הרגש עצמו."},{"q":"מה ייחודי במודל של רוטבארט לעומת תומס וצ'ס?","a":"הוא מפריד בין מצוקה מפחד למצוקה מרוגז","w":["הוא מחלק את הילדים לשלושה סוגים","הוא מתבסס רק על תצפיות במעבדה","הוא לא כולל שום ממד של ויסות"],"e":"המודל של רוטבארט ייחודי בכך שהוא מבחין בין מצוקה מפחד למצוקה מרוגז, ומוסיף בקרה שדורשת מאמץ. החלוקה לשלושה סוגי ילדים היא של תומס וצ׳ס."}]},
"q18":{"t":"t3","v":[{"q":"מה היתרון של דיווחי הורים על המזג?","a":"היכרות עמוקה עם הילד במצבים רבים","w":["הם אובייקטיביים לגמרי ולא מוטים","הם מודדים מדדים גופניים מדויקים","הם לא מושפעים מציפיות ההורים"],"e":"היתרון של דיווחי הורים הוא שהם קלים, ומבוססים על היכרות עמוקה עם הילד במצבים רבים. החיסרון הוא שהם עלולים להיות מוטים."},{"q":"ילדה ביישנית מגיעה למעבדה ובוכה כל הזמן. מה הבעיה בשיטה?","a":"היא לא תסיים את המפגש","w":["אין בעיה בשיטה","המעבדה מודדת רק פעילות","ההורים מתערבים במדידה"],"e":"ילד מפוחד עלול להיות מוטרד מדי במקום הזר, ולא לסיים את המפגש במעבדה. זה החיסרון של תצפית מעבדה במחקר על מזג."}]},
"q19":{"t":"t3","v":[{"q":"איזה אחוז מבני 4 חודשים מצא קגן שמוטרדים בקלות מחידושים?","a":"כ-20%","w":["כ-5%","כ-50%","כ-70%"],"e":"קגן מצא שכ-20% מבני 4 חודשים מוטרדים בקלות מחידושים, ילדים ״מעוכבים״. זה לא רוב הילדים."},{"q":"איזה מבנה במוח קשור לתגובה החזקה של ילדים ביישנים לחדש?","a":"האמיגדלה","w":["ההיפוקמפוס","המוח הקטן","קליפת הראייה"],"e":"האמיגדלה קשורה לתגובת הפחד של ילדים ביישנים לדברים חדשים. היפוקמפוס קשור לזיכרון."}]},
"q20":{"t":"t3","v":[{"q":"איזה מדד גופני צפוי אצל ילד ביישן?","a":"קורטיזול גבוה יותר","w":["קצב לב נמוך יותר","אישונים מכווצים","אצבעות חמות"],"e":"אצל ילדים ביישנים יש יותר קורטיזול, קצב לב גבוה יותר, אישונים מורחבים ואצבעות קרות, כלומר עוררות גופנית. קצב הלב לא נמוך יותר."},{"q":"איזו הורות מעצימה ביישנות?","a":"קרה, מענישה או מגוננת מדי","w":["חמה ומעודדת בהדרגה","הורות שמציבה אתגרים קטנים","הורות סבלנית ותומכת"],"e":"הורות קרה, מענישה או מגוננת יתר על המידה מעצימה ביישנות, כי היא מונעת מהילד להתמודד. עידוד הדרגתי ואתגרים קטנים עוזרים לו."}]},
"q21":{"t":"t4","v":[{"q":"תינוק פעיל מאוד בגיל 6 חודשים. מה אפשר לומר על המזג שלו בגיל 5?","a":"לא הרבה, היציבות בינקות נמוכה","w":["בוודאות יהיה ילד היפראקטיבי","בוודאות יהיה ילד רגוע","המזג שלו לא ישתנה בכלל"],"e":"היציבות של המזג בינקות נמוכה, ולכן אי אפשר לנבא הרבה מרמת הפעילות בגיל 6 חודשים לגבי גיל 5. היציבות מתונה רק מגיל הגן."},{"q":"אחרי שתינוק מתחיל לזחול, מה עשויה להעיד רמת פעילות נמוכה?","a":"פחד","w":["סקרנות","שובבות","עייפות"],"e":"אחרי שהתינוק מתחיל לזחול, רמת פעילות גבוהה מאפיינת את החוקר הסקרן, ורמה נמוכה עשויה להעיד על פחד. משמעות הפעילות משתנה עם הגיל."}]},
"q22":{"t":"t4","v":[{"q":"למה ניבוי המזג טוב יותר אחרי גיל 3?","a":"הסגנונות מגובשים, ויש קפיצה בבקרה","w":["כי הילד כבר מדבר במשפטים","כי ההורים מפסיקים להשפיע","כי המוח מפסיק להתפתח בגיל 3"],"e":"אחרי גיל 3 סגנונות התגובה כבר מגובשים, ויש קפיצה בבקרה שדורשת מאמץ, ולכן הניבוי טוב יותר. זה לא בגלל שההורים מפסיקים להשפיע."},{"q":"מי מרוויחים הכי הרבה מהורים סבלניים ותומכים?","a":"ילדים חששנים, נרגנים או שליליים","w":["ילדים נוחים ושמחים","ילדים פעילים וסקרנים","כל הילדים באותה מידה"],"e":"ילדים עם מזג חששן, נרגן או שלילי מרוויחים הכי הרבה מהורים סבלניים ותומכים. השפעת ההורות עליהם חזקה במיוחד."}]},
"q23":{"t":"t4","v":[{"q":"איזה חלק מההבדלים במזג מיוחס לגנים?","a":"כמחצית","w":["כמעט הכל","כעשירית","אף חלק"],"e":"בערך מחצית מההבדלים במזג ובאישיות מיוחסים לגנים, לפי מחקרי תאומים. הגנים לא קובעים כמעט הכל."},{"q":"תינוקות סינים ויפנים רגועים יותר. איך מסבירים זאת?","a":"אולי גנים, וגם פרקטיקות תרבותיות","w":["רק גנים, בלי השפעה של תרבות","רק תרבות, בלי השפעה של גנים","תזונה שונה בלבד, לא גנים או תרבות"],"e":"הרוגע של תינוקות סינים ויפנים אולי קשור לגנים, אבל גם לאמונות ולפרקטיקות תרבותיות של מגע עדין וריסון רגשות. אי אפשר לייחס אותו רק לאחד מהם."}]},
"q24":{"t":"t4","v":[{"q":"באיזה תחום יש לבנות יתרון במזג?","a":"בקרה שדורשת מאמץ","w":["רמת פעילות","רגשיות חיובית","מצוקה מרוגז"],"e":"לבנות יש יתרון בבקרה שדורשת מאמץ. בנים נוטים לרמת פעילות גבוהה יותר."},{"q":"אמא מעודדת את בנה לטפס ואת בתה לבקש עזרה. מה זה עושה?","a":"מחזק הבדלי מגדר במזג","w":["מקטין הבדלי מגדר","לא משפיע על המזג","מתאים רק לילד הבכור"],"e":"כשהורים מעודדים בנים לפעילות ובנות לפנייה לעזרה ולקרבה, הם מחזקים את הבדלי המגדר במזג. הם לא מקטינים אותם."}]},
"q25":{"t":"t4","v":[{"q":"ילד עם גרסה קצרה של 5-HTTLPR. מה צפוי לו?","a":"רגישות גבוהה גם לטוב וגם לרע","w":["סיכון גבוה רק בהורות גרועה","חוסן מלא לכל השפעה","רגישות רק להורות טובה"],"e":"ילדים עם גרסה קצרה של הגן 5-HTTLPR רגישים במיוחד לסביבה: הם נפגעים יותר מהורות גרועה, אבל גם מרוויחים יותר מהורות טובה. הרגישות היא בשני הכיוונים."},{"q":"הורים משווים בין שני ילדיהם. מה נמצא?","a":"הם רואים יותר הבדלים מצופים חיצוניים","w":["הם רואים פחות הבדלים מצופים חיצוניים","הם רואים בדיוק כמו צופים חיצוניים","הם לא רואים הבדלים בין הילדים כלל"],"e":"כשהורים משווים בין ילדיהם, הם נוטים לראות יותר הבדלים ממה שצופים חיצוניים רואים. הם מגזימים בהבדלים, ולא ממעיטים בהם."}]},
"q26":{"t":"t4","v":[{"q":"בני שנה ממשפחות עניות, עם גנוטיפ בסיכון והורות לא רגישה. מה קרה?","a":"יותר כעס, ובהמשך יותר תוקפנות","w":["לא היה הבדל מקבוצת הביקורת","הם נעשו שקטים ומופנמים יותר","הם השתפרו עם הזמן לבד"],"e":"אצל בני שנה ממשפחות עניות, עם גנוטיפ בסיכון והורות לא רגישה, נמצאה תגובתיות כועסת גבוהה יותר, ובהמשך יותר תוקפנות והתנגדות. זה שילוב של גן וסביבה."},{"q":"מה המשמעות של ״גמישות״ בהקשר של 5-HTTLPR?","a":"רגישות גבוהה לסביבה, לטוב ולרע","w":["יכולת להסתגל לכל מצב בלי נזק","חוסר רגישות להשפעת ההורים","נטייה קבועה לחרדה ודיכאון"],"e":"״גמישות״ כאן פירושה רגישות גבוהה להשפעות הסביבה, לטוב ולרע. זה לא חוסן מפני כל השפעה."}]},
"q27":{"t":"t4","v":[{"q":"לילד קשה ומתנגד יש הורים רגועים, עקביים ומבינים. מה יחזה מודל טיב ההתאמה?","a":"סיכוי טוב לתפקוד מסתגל","w":["בעיות התנהגות בטוחות","שהמזג ישתנה לגמרי","שההורים יישחקו בהכרח"],"e":"לפי מודל טיב ההתאמה, סביבה שמכירה במזג של הילד, ובה בעת מעודדת תפקוד מסתגל, נותנת לו סיכוי טוב. מזג קשה עם הורים רגועים ועקביים לא מוביל בהכרח לבעיות."},{"q":"איך נוצר מעגל שלילי בין ילד קשה להורים?","a":"משמעת כועסת, התנגדות ויותר כפייה","w":["הורים מוותרים והילד נרגע","ילד מתבודד וההורים מתרחקים","ההורים משבחים והילד מתמרד"],"e":"מעגל שלילי נוצר כשמשמעת כועסת מעוררת התנגדות של הילד, וההתנגדות מובילה ליותר לחץ, כפייה וחוסר עקביות. כך כל צד מחמיר את השני."}]},
"q28":{"t":"t4","v":[{"q":"בשנחאי, מה קרה לקשר בין ביישנות להסתגלות בין 1990 ל-2002?","a":"הוא התהפך מחיובי לשלילי","w":["הוא התהפך משלילי לחיובי","הוא נשאר חיובי לאורך כל השנים","הוא נעלם לגמרי ולא חזר"],"e":"בשנחאי, בין 1990 ל-2002, הקשר בין ביישנות להסתגלות נחלש ואז התהפך: מחיובי לשלילי, כמו במערב, בעקבות שינוי ערכים בחברה. המסיח הראשון הופך את הכיוון."},{"q":"באילו תנאים קשה יותר להעניק הורות טובה לילד קשה?","a":"מצוקה כלכלית, נישואים רעים ובעיות נפשיות","w":["כשיש לילד אחים רבים בבית","כשההורים עובדים מהבית","כשהילד הולך לגן פרטי"],"e":"קשה יותר להעניק הורות טובה לילד קשה כשיש מצוקה כלכלית, נישואים לא טובים או בעיות נפשיות אצל ההורים. מספר האחים אינו הגורם."}]},
"q29":{"t":"t5","v":[{"q":"קופי הארלו נצמדו לאם הבד, אף שאם התיל החזיקה את הבקבוק. מה זה מערער?","a":"שהיקשרות נובעת מהאכלה","w":["שהקופים צריכים מזון","שיש היקשרות בכלל","שמגע לא חשוב"],"e":"קופי הארלו נצמדו לאם מבד, אף שאם מחוטי תיל החזיקה את הבקבוק, וזה מערער את הרעיון שהיקשרות נובעת מהאכלה. נחמת המגע חשובה יותר."},{"q":"מה הבעיה בהסברים הפסיכואנליטי והביהביוריסטי להיקשרות?","a":"הם מתעלמים ממאפייני התינוק","w":["הם מתמקדים יותר מדי בתינוק","הם לא מזכירים את האם","הם מבוססים על מחקרי קופים"],"e":"ההסברים הפסיכואנליטי והביהביוריסטי מתמקדים בהאכלה ובמטפל, ומתעלמים כמעט ממאפייני התינוק. הם לא מתמקדים יותר מדי בתינוק."}]},
"q30":{"t":"t5","v":[{"q":"פעוט נבהל מרעם ורץ לאבא, ונרגע לידו. מה זה?","a":"היקשרות","w":["חרדת זרים","הירמזות חברתית","מזג נוח"],"e":"פעוט שרץ לאבא כשהוא נבהל ונרגע לידו מראה היקשרות: קשר חם שבו מתנחמים בקרבה בעת עקה. חרדת זרים היא פחד מאנשים לא מוכרים."},{"q":"תינוק קשור מאוד לשמיכה שלו. מה זה מראה?","a":"שנקשרים לא רק למי שמאכיל","w":["שההיקשרות לאם לא בטוחה","שיש לו בעיה התפתחותית","שהוא לא קשור לאף אדם"],"e":"תינוקות נקשרים לא רק למי שמאכיל אותם, אלא גם לאב, לאחים, לסבים ולחפצים רכים כמו שמיכה. זה לא סימן לבעיה."}]},
"q31":{"t":"t5","v":[{"q":"לפי בולבי, מה התפקיד של ההיקשרות?","a":"לשמור את ההורה קרוב להישרדות ולחקירה","w":["להבטיח שהתינוק יקבל מספיק מזון","ללמד את התינוק שפה ותקשורת","לפתח את המזג המולד של התינוק"],"e":"לפי בולבי, ההיקשרות היא מערכת מולדת שמשאירה את ההורה קרוב לתינוק, לשם הישרדות, הגנה ותמיכה בחקירה. היא לא נועדה רק להבטיח מזון."},{"q":"בת 10 חודשים בוכה כשאמא יוצאת, ומשתמשת בה כבסיס. באיזה שלב היא?","a":"היקשרות חד־משמעית","w":["טרום־היקשרות","היקשרות בהתהוות","יחסים הדדיים"],"e":"חרדת פרידה ושימוש במטפל כבסיס בטוח מאפיינים את שלב ההיקשרות החד־משמעית, בגיל 6–8 עד 18–24 חודשים. בטרום־היקשרות אין עדיין התנגדות לזר."}]},
"q32":{"t":"t5","v":[{"q":"תינוק בן 4 שבועות נשאר בשמחה עם בייביסיטר זרה. באיזה שלב הוא?","a":"טרום־היקשרות","w":["היקשרות חד־משמעית","יחסים הדדיים","היקשרות לא בטוחה"],"e":"בשלב טרום־ההיקשרות אותות מולדים מקרבים מבוגרים לתינוק, אבל אין לו עדיין התנגדות להישאר עם זר. לכן הוא נשאר בשמחה עם בייביסיטר."},{"q":"בן שנתיים מוחה פחות כשאמא אומרת ״אחזור אחרי ארוחת צהריים״. למה?","a":"שפה וייצוג עוזרים להבין מתי תחזור","w":["הוא כבר לא קשור אליה כמו קודם","הוא פשוט התרגל לפרידות","הוא מפחד לבכות לידה"],"e":"בשלב היחסים ההדדיים, ייצוג ושפה מאפשרים לפעוט להבין לאן ההורה הולך ומתי יחזור, ולכן המחאה על הפרידה פוחתת. זה לא שהוא כבר לא קשור."}]},
"q33":{"t":"t5","v":[{"q":"ילד מצפה שאנשים קרובים יעזרו לו כשיתקשה. איך בולבי יקרא לציפייה הזו?","a":"מודל עבודה","w":["בסיס בטוח","מזג נוח","ויסות עצמי"],"e":"מערכת ציפיות לגבי הזמינות והתמיכה של דמויות ההיקשרות, שמדריכה יחסים עתידיים, היא מודל עבודה פנימי. בסיס בטוח הוא התפקיד של המטפל עצמו."},{"q":"בסרטון ״המטפל״ לא חזר אל ״הילד הבוכה״. מי הביטו בו יותר?","a":"פעוטות עם היקשרות בטוחה","w":["פעוטות עם היקשרות נמנעת","פעוטות עם היקשרות מתנגדת","לא היה הבדל"],"e":"פעוטות עם היקשרות בטוחה הביטו יותר כש״המטפל״ לא חזר אל ״הילד הבוכה״, כי זה הפר את הציפייה שלהם. פעוטות לא בטוחים הופתעו פחות."}]},
"q34":{"t":"t5","v":[{"q":"ילד עם היקשרות לא בטוחה בינקות פוגש מורה חמה ויציבה. מה עשוי לקרות למודל העבודה שלו?","a":"הוא עשוי להתעדכן","w":["הוא נקבע סופית בינקות","הוא יחמיר בגלל המורה","אין לו קשר ליחסים אחרים"],"e":"מודל העבודה הפנימי לא נקבע סופית בינקות, אלא ממשיך להתעדכן ביחסים עם הורים, אחאים, חברים ומורים. לכן מורה חמה ויציבה עשויה לעדכן אותו."},{"q":"מאיזו השראה בא בולבי לתיאוריה שלו?","a":"מחקרי ההטבעה של לורנץ","w":["מניסויי הכלבים של פבלוב","מתיאוריית השלבים של פיאז'ה","מניסויי הבובה של בנדורה"],"e":"בולבי קיבל השראה ממחקרי ההטבעה של לורנץ באפרוחי ברווזים. פבלוב עסק בהתניה, לא בהיקשרות."}]},
"q35":{"t":"t6","v":[{"q":"במצב הזר, אילו רגעים הכי חשובים לקביעת סוג ההיקשרות?","a":"רגעי האיחוד עם ההורה","w":["רגעי המשחק עם הזר","רגעי הכניסה לחדר","רגעי המשחק לבד"],"e":"איכות ההיקשרות במצב הזר נקבעת במידה רבה לפי התגובה לאיחוד עם ההורה. ההתנהגות מול הזר חשובה פחות."},{"q":"אמא חוזרת, והתינוק ממשיך לשחק בלי להביט ונוקשה כשמרימים אותו. איזו היקשרות?","a":"לא בטוחה־נמנעת","w":["לא בטוחה־מתנגדת","בטוחה","חסרת ארגון"],"e":"תינוק שלא מביט בהורה באיחוד ולא מתרפק כשמרימים אותו מראה היקשרות לא בטוחה־נמנעת. בהיקשרות מתנגדת הוא היה מחפש קרבה וגם כועס."}]},
"q36":{"t":"t6","v":[{"q":"תינוק ניגש לאמא באיחוד, אבל עם מבט מוסט, ואז קופא במקום. איזו היקשרות?","a":"חסרת ארגון וכיוון","w":["לא בטוחה־נמנעת","לא בטוחה־מתנגדת","בטוחה"],"e":"התנהגות סותרת ומבולבלת באיחוד, כמו התקרבות עם מבט מוסט ואז קפיאה, מאפיינת היקשרות חסרת ארגון וכיוון, הדפוס הכי לא בטוח."},{"q":"כמה מהתינוקות במעמד בינוני בצפון אמריקה בעלי היקשרות בטוחה?","a":"כ-60%","w":["כ-30%","כ-90%","כ-15%"],"e":"כ-60% מהתינוקות במשפחות ממעמד בינוני בצפון אמריקה בעלי היקשרות בטוחה. זו ההתפלגות הנפוצה."}]},
"q37":{"t":"t6","v":[{"q":"מה חיסרון של שאלון ה-Q-Sort?","a":"לא מבחין בין סוגי חוסר הביטחון","w":["לא מתאים לתצפית בבית","לא מתאים לפעוטות בכלל","לא בודק ביטחון בהיקשרות"],"e":"שאלון ה-Q-Sort דורש זמן רב וצופה מומחה, ולא מבחין בין סוגי חוסר הביטחון. הוא כן מתאים לתצפית בבית."},{"q":"תינוקות יפנים מראים יותר היקשרות מתנגדת במצב הזר. למה?","a":"כמעט לא משאירים אותם עם אחרים","w":["הם פחות קשורים לאמא שלהם","האמהות שם פחות רגישות","יש להם מזג קשה יותר מלידה"],"e":"תינוקות יפנים כמעט לא נשארים עם אחרים, ולכן המצב הזר מלחיץ אותם במיוחד, והם מראים יותר היקשרות מתנגדת. זה לא בגלל שהם פחות קשורים לאם."}]},
"q38":{"t":"t6","v":[{"q":"תינוקות גרמנים מראים יותר היקשרות נמנעת. מה הסבר אפשרי?","a":"ההורים מעודדים עצמאות","w":["ההורים מזניחים אותם","הם גדלים בלי אבות","הם נולדים בשלים יותר"],"e":"היקשרות נמנעת שכיחה יותר אצל תינוקות גרמנים, אולי כי ההורים מעודדים עצמאות ולא ״להיצמד״. זה לא מעיד על הזנחה."},{"q":"באילו משפחות ההיקשרות בדרך כלל יציבה?","a":"מעמד בינוני עם תנאים נאותים","w":["משפחות עם הרבה ילדים","משפחות עם הורה יחיד","משפחות שעוברות דירה הרבה"],"e":"ההיקשרות נשארת בדרך כלל יציבה ובטוחה במשפחות ממעמד בינוני, עם תנאי חיים נאותים ומעט מעברי חיים."}]},
"q39":{"t":"t7","v":[{"q":"ילד מאומץ מבית יתומים מתחבק עם כל זר בפארק. מה זה?","a":"״ידידותיות יתר״","w":["היקשרות בטוחה","מזג נוח","הירמזות חברתית"],"e":"ילדים שגדלו במוסד ואומצו מאוחר נקשרו להורים המאמצים, אבל עם יותר קשיים, כמו ״ידידותיות יתר״ עם זרים, כלומר קושי בהיקשרות סלקטיבית. זו לא היקשרות בטוחה."},{"q":"מה נמצא במוחם של ילדים מאומצים אחרי שהייה ארוכה במוסד?","a":"אמיגדלה גדולה מהרגיל","w":["אמיגדלה קטנה מהרגיל","אונות מצח גדולות","אין הבדל במוח"],"e":"במוחם של ילדים מאומצים אחרי שהייה ממושכת במוסד נמצאה אמיגדלה גדולה מהרגיל, שקשורה להבנת רגשות וויסות רגשי גרועים. היא לא קטנה מהרגיל."}]},
"q40":{"t":"t7","v":[{"q":"איזה גורם לא נחקר כמשפיע על היקשרות בטוחה?","a":"מספר הצעצועים בבית","w":["זמינות מטפל קבוע","איכות הטיפול","מאפייני התינוק"],"e":"ארבעת הגורמים שנחקרו כמשפיעים על היקשרות בטוחה הם זמינות מטפל קבוע, איכות הטיפול, מאפייני התינוק וההקשר המשפחתי. מספר הצעצועים אינו אחד מהם."},{"q":"מה המסקנה ממחקרי בתי היתומים?","a":"צריך קשר הדוק עם מטפל מוקדם","w":["האכלה מספיקה להתפתחות","אימוץ מאוחר לא משפיע","גנים קובעים את ההיקשרות"],"e":"מחקרי בתי היתומים מראים שהתפתחות רגשית תקינה תלויה בקשר הדוק עם מטפל, מוקדם בחיים. האכלה לבדה לא מספיקה."}]},
"q41":{"t":"t7","v":[{"q":"אמא מגיבה לבכי מהר ובעקביות, ומחזיקה בעדינות. איזה טיפול זה?","a":"טיפול רגיש","w":["טיפול חודרני","טיפול מתאם יתר","טיפול נמנע"],"e":"תגובה מהירה, עקבית ומותאמת לתינוק, והחזקה עדינה, הן טיפול רגיש, שמנבא היקשרות בטוחה. טיפול חודרני מגרה גם כשהתינוק מסיט מבט."},{"q":"איזה תיאום בין מבוגר לתינוק מנבא הכי טוב היקשרות בטוחה?","a":"מתון, עם תיקון אי־התאמות","w":["מושלם בכל רגע ורגע","נמוך מאוד, כמעט בלי תיאום","גבוה ככל האפשר, בלי טעויות"],"e":"תיאום מתון, שבו המבוגר מקבל אי־התאמות ומתקן אותן, מנבא הכי טוב היקשרות בטוחה. תיאום מושלם בכל רגע אינו נדרש, ואפילו פחות טוב."}]},
"q42":{"t":"t7","v":[{"q":"אמהות הגוסי כמעט לא משחקות עם תינוקותיהן, ובכל זאת רובם בטוחים. למה?","a":"הטיפול קשוב לצרכים","w":["הגנים שלהם שונים","יש להם מזג נוח","הם גדלים עם סבים"],"e":"אמהות הגוסי כמעט לא משחקות עם התינוקות, אבל הטיפול שלהן קשוב לצרכים, ולכן רוב התינוקות בטוחים. ביטחון לא דורש אינטראקציה רציפה."},{"q":"אמא מגרה כל הזמן ומתעלמת כשהתינוק מסיט מבט. איזו היקשרות צפויה?","a":"נמנעת","w":["מתנגדת","בטוחה","חסרת ארגון"],"e":"עודף גרייה וחודרנות, למשל המשך גירוי כשהתינוק מסיט מבט, מאפיינים תינוקות עם היקשרות נמנעת. היענות לא עקבית מאפיינת דווקא היקשרות מתנגדת."}]},
"q43":{"t":"t7","v":[{"q":"פג ממשפחה יציבה עם אם בריאה נפשית. מה צפוי לגבי ביטחון ההיקשרות?","a":"סיכוי טוב להיקשרות בטוחה","w":["היקשרות לא בטוחה בגלל הפגות","היקשרות חסרת ארגון","בעיות רק בגיל ההתבגרות"],"e":"פגות לבדה לא מנבאת חוסר ביטחון, אלא רק יחד עם סיכון כלכלי או נפשי של האם. לכן פג ממשפחה יציבה עם אם בריאה צפוי להיקשרות בטוחה."},{"q":"מה נמצא בתאומים לגבי תורשתיות ההיקשרות?","a":"אין לה תורשתיות","w":["תורשתיות גבוהה מאוד","תורשתיות של כמחצית","תורשתיות רק אצל בנים"],"e":"מחקרי תאומים לא מצאו להיקשרות תורשתיות, בניגוד למזג. היא נקבעת בעיקר בטיפול."}]},

"q45":{"t":"t7","v":[{"q":"אמא שעברה ילדות קשה מספרת עליה באופן מאוזן ושקול. מה צפוי לתינוק?","a":"היקשרות בטוחה","w":["היקשרות לא בטוחה","היקשרות חסרת ארגון","אין דרך לנבא"],"e":"הורים לילדים בטוחים מדברים על ילדותם באופן אובייקטיבי ומאוזן, בלי קשר לאיכות החוויות עצמן. לכן גם אם שעברה ילדות קשה, אבל עיבדה אותה, צפויה לגדל תינוק בטוח."},{"q":"מה הראה מחקר NICHD על מסגרות יום והיקשרות?","a":"רק שילוב סיכונים מגדיל חוסר ביטחון","w":["כל מסגרת פוגעת בהיקשרות","מסגרת משפרת תמיד את ההיקשרות","אין קשר בכלל בין הדברים"],"e":"מחקר NICHD מצא שטיפול לא הורי לא פוגע כשלעצמו, אבל שילוב של סיכונים בבית ובמסגרת מגדיל את חוסר הביטחון. מסגרת לא פוגעת בכל מקרה."}]},

"q48":{"t":"t8","v":[{"q":"מה מנבא חום אבהי לפי מחקרים בתרבויות שונות?","a":"כישורים כמו חום אימהי, ולפעמים יותר","w":["רק כישורים מוטוריים וגופניים","פחות ממה שמנבא חום אימהי, תמיד","שום דבר שמחקרים הצליחו למצוא"],"e":"מחקרים בתרבויות שונות מצאו שחום אבהי מנבא כישורים קוגניטיביים, רגשיים וחברתיים, כמו חום אימהי, ולפעמים אף יותר. הוא לא מנבא ״פחות״."},{"q":"מה קשור למעורבות אבהית רבה יותר במערב?","a":"נישואים מאושרים ושיתוף פעולה","w":["שכר גבוה של האב בעבודה","מספר רב של ילדים במשפחה","מגורים קרובים לבית הסבים"],"e":"במערב, נישואים מאושרים ושיתוף פעולה עם בת הזוג קשורים למעורבות אבהית רבה יותר. שכר גבוה של האב לא נמצא קשור לכך."}]},
"q49":{"t":"t8","v":[{"q":"ילדה גדלה אצל סבתה, בלי ההורים. איך נקראת המשפחה?","a":"משפחה מדלגת דור","w":["משפחה מורחבת","משפחה חד־הורית","משפחה מאמצת"],"e":"משפחה שבה ילדים גדלים אצל סבים, בלי ההורים, היא משפחה שדילגה על דור. משפחה מורחבת כוללת גם את ההורים."},{"q":"בן 4 שקיבל אח חדש נעשה תובעני ונצמד. איך לפרש זאת?","a":"תגובה שכיחה, לצד אהבה לתינוק","w":["סימן להיקשרות לא בטוחה","סימן לבעיה רגשית חמורה","סימן שהוא שונא את האח החדש"],"e":"ילדים בגיל הגן מגיבים להולדת אח לעתים בתובענות ובהיצמדות, אבל גם באהבה ובדאגה לתינוק. זו תגובה שכיחה, ולא סימן לבעיה רגשית חמורה."}]},
"q50":{"t":"t8","v":[{"q":"מה יעזור לילד הגדול להסתגל לאח החדש?","a":"זמן מיוחד איתו והסבר על התינוק","w":["להתעלם מהתנהגות התובענית","להרחיק אותו מהתינוק","לשלוח אותו לסבים לחודש"],"e":"זמן מיוחד עם הילד הגדול, סבלנות, הסבר על הצרכים של התינוק וזוגיות תומכת עוזרים לו להסתגל. הרחקה מהתינוק לא עוזרת."},{"q":"מה מקשה על סבים שמגדלים נכדים?","a":"קשיי הילדים ועומס כלכלי","w":["שהם צעירים מדי","שאין להם ניסיון בגידול","שהנכדים לא אוהבים אותם"],"e":"סבים שמגדלים נכדים מתמודדים עם קשיי הילדים, הפרעה מצד ההורים, עומס כלכלי ופחות זמן פנוי. ניסיון בגידול ילדים יש להם."}]},
