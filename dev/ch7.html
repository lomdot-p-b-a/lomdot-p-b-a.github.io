}

  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}

p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}

mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}

.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}

.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}

.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}

.fig svg{display:block;width:100%;height:auto}

.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}

.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}

const T=[
 {id:"t1",icon:"sprout",title:"רגשות בסיסיים",blocks:[
  {h:"אוטונומיה וקריאת רגשות של תינוקות",html:`${def("על מה הנושא",`עוד לפני שהם מדברים, תינוקות מרגישים ומבטאים רגשות. הנושא מציג את הרגשות הבסיסיים, ומתי כל אחד מופיע.<br><b>מה נלמד כאן:</b> רגשות בסיסיים · שמחה וחיוך חברתי · כעס ועצב · פחד וחרדת זרים`)}${def("סוף הדיון באריקסון",`בשנה השנייה, <b>אוטונומיה</b> מתפתחת כשההורים נותנים הדרכה ובחירות הגיוניות, לא מבקרים כשהפעוט נכשל (שירותים, כפית, סידור) ומגיבים בסבלנות לעמידתו על שלו (״עוד חמש דקות משחק״). שליטת יתר או חוסר שליטה מובילים ל<b>בושה וספק</b>. הורות חמה וציפיות סבירות בונות <b>אמון בסיסי ואוטונומיה</b>, ובלעדיהן נזרעים זרעים לקשיים בהמשך.`)}<p>רגשות מארגנים יחסים חברתיים, חקירה וגילוי העצמי. לפי <b>גישת המערכות הדינמיות</b> הם חלק מהמערכת המתפתחת: מפיחים בה אנרגיה ונעשים מורכבים יותר.</p><p>תינוקות לא מתארים רגשות, ולכן הרמז המהימן ביותר הוא <b>הבעות הפנים</b> (בכל התרבויות מקשרים הבעות לרגשות באותה דרך). אבל צריך זהירות:</p>${tiles([["x","לא תמיד יש הבעה","על הצוק החזותי ילדים נמנעים בלי להראות פחד בפנים"],["hand","ערוצים אחרים","תינוקות עיוורים מביעים רגש בתנועות אצבעות, וכשמראים זאת להורים הם מגיבים ביותר הדדיות"],["question","תגובה אחת, הרבה רגשות","חיוך יכול לבטא שמחה, מבוכה, בוז או ברכה"]])}${rem("לכן חוקרים מסתכלים על <b>כמה רמזים יחד</b>, קול, פנים ומחוות, ואיך הם משתנים במצבים שונים.")}`,q:"q1"},
  {h:"רגשות בסיסיים ושמחה",html:`${def("רגשות בסיסיים",`<mark>רגשות בסיסיים</mark> ${E("Basic emotions")}: אושר, עניין, הפתעה, פחד, כעס, עצב וגועל. אוניברסליים ובעלי היסטוריה אבולוציונית. בהתחלה יש רק שני מצבים כלליים: <b>משיכה</b> לגירוי נעים ו<b>התרחקות</b> מגירוי לא נעים. בהדרגה הם הופכים לאותות מאורגנים (קמרס צילמה את בתה: הבעות כעס ועצב הופיעו קודם סביב בכי, ורק עם הגיל התחברו למחסום ולכישלון).`)}${def("חיוך חברתי",`בשבועות הראשונים יילודים מחייכים כשהם שבעים, בשנת REM ולמגע וקול עדינים. בסוף החודש הראשון למראות דינמיים. בין <b>6 ל־10 שבועות</b> (כך במקור האנגלי ובתרשים 7.1; בנוסח העברי נכתב ״חודשים״) מופיע <mark>חיוך חברתי</mark> ${E("Social smile")}: חיוך רחב לתקשורת של ההורה. <b>צחוק</b> מופיע בגיל 3 עד 4 חודשים ומשקף עיבוד מהיר יותר.`)}${fig("nso","אצל הנאסו בקמרון, שמעריכים רוגע ולא מעודדים הבעת רגשות, החיוך החברתי מתעכב")}${rem("בסוף השנה הראשונה החיוך הוא <b>אות חברתי מכוון</b>: חיוך רחב להורה, מאופק לזר, פתוח במשחק. בני 8 עד 10 חודשים עוצרים משחק כדי לשתף מבוגר בהנאה.")}${ex(`<b>חיוך חברתי</b>: בגיל 6–10 שבועות התינוק מחייך כשהוא רואה פנים של אדם, לא רק כשהוא שבע. הורים מרגישים שהוא "מחייך אליהם" בפעם הראשונה.`)}`,q:"q3"},
  {h:"כעס ועצב",html:`${def("כעס",`מגיל 4 עד 6 חודשים ועד השנה השנייה הכעס גובר בתדירות ובעוצמה, ובמצבים רבים יותר: לוקחים חפץ, מגבילים ידיים, ההורה יוצא, משכיבים לישון. <b>למה?</b> ההתנהגות נעשית מכוונת (רוצים לשלוט בתוצאות), מזהים טוב יותר מי גרם, וההורים מציבים יותר גבולות כשהתינוק זוחל.`)}${rem("הכעס <b>מסתגל</b>: מאפשר להגן על עצמך או להתגבר על מכשול, ומניע את המטפל להקל ולא לעזוב שוב מהר.")}${def("עצב",`פחות שכיח מכעס. מופיע בעיקר כשהתינוק מאבד מטפל מוכר ואוהב (גרייס אחרי האימוץ) או כשהאינטראקציה עם ההורה משתבשת קשות.`)}${ex("ניסויי <b>פנים קפואות</b>: הורים לבני 2 עד 7 חודשים עברו פתאום להבעה חסרת תגובה. התינוקות ניסו פנים, תנועות וקולות כדי להחזיר את ההורה, וכשלא הצליחו הסיטו מבט, קימטו מצח ובכו. אותה תגובה אצל אמריקנים, קנדים וסינים: נראה שזו תגובה מולדת. כך מגיבים גם תינוקות להורים בדיכאון, ואם זה נמשך ההתפתחות כולה נפגעת.")}`,q:"q5"},
  {h:"פחד וחרדת זרים",html:`${def("חרדת זרים",`הפחד מופיע במחצית השנייה של השנה הראשונה. ההבעה השכיחה: <mark>חרדת זרים</mark> ${E("Stranger anxiety")}. היא <b>לא תמיד</b> מופיעה, ותלויה במזג, בניסיון עם זרים ובמצב: זר שמרים תינוק במקום חדש מעורר פחד, וזר שיושב בשקט כשההורה קרוב מעורר סקרנות. חום, צעצוע, משחק מוכר והתקרבות איטית מפחיתים אותה.`)}${tiles([["people","אפה (קונגו)","תמותת אימהות גבוהה, תינוקות עוברים בין מבוגרים מהלידה: כמעט אין חרדת זרים"],["lock","קיבוצים בישראל","קהילות מבודדות שפגיעות לטרור: חשדנות כלפי זרים, וחרדת זרים גבוהה בהרבה מבעיר"]])}${def("בסיס בטוח",`הפחד מרסן את החקירה של תינוק שרק התחיל לנוע. התינוק משתמש במטפל כ<mark>בסיס בטוח</mark> ${E("Secure base")}: יוצא לחקור וחוזר לתמיכה. ההתנהגות מול זר היא <b>איזון</b> בין התקרבות להימנעות.`)}${rem("חרדת הזרים פוחתת כשהקוגניציה מאפשרת להבחין בין מאיים ללא מאיים, וכשיש יותר אסטרטגיות התמודדות.")}${ex(`<b>חרדת זרים</b>: תינוקת בת 8 חודשים שהייתה הולכת לכל אחד, פתאום בוכה כשדודה שלא מכירה מנסה להרים אותה. <b>בסיס בטוח</b>: אותה תינוקת זוחלת לחקור את החדר, ומדי פעם חוזרת לגעת באמא.`)}`,q:"q7"}
 ]},
 {id:"t2",icon:"people",title:"הבנת רגשות וויסות",blocks:[
  {h:"הבנת רגשות הזולת",html:`${def("על מה הנושא",`מעבר להרגיש: התינוק לומד להבין רגשות של אחרים, להרגיש רגשות מורכבים כמו בושה, ולהרגיע את עצמו.<br><b>מה נלמד כאן:</b> הירמזות חברתית · רגשות של מודעות עצמית · ויסות עצמי רגשי`)}<p>בהתחלה תינוקות מתאימים את הרגש שלהם לזה של המטפל: אולי <b>הדבקה רגשית</b> ${E("Emotional contagion")} אוטומטית, ואולי התניה אופרנטית (חיוך מביא תגובה). בגיל <b>3 חודשים</b> הם רגישים למבנה ולתזמון של אינטראקציה פנים אל פנים ומצפים לתגובה. לפי חלק מהחוקרים, מכאן מתחילים לראות אחרים <b>״כמוני״</b>.</p><p>ב־4 עד 5 חודשים מבחינים בין רגש חיובי לשלילי בקול ואחר כך בפנים, ובאמצע השנה מתאימים פנים לקול (מביטים יותר בפנים שמחות עם קול שמח). מגיל 7 חודשים גלי המוח (ERP) דומים למבוגרים.</p>${def("הירמזות חברתית",`<mark>הירמזות חברתית</mark> ${E("Social referencing")}: מגיל 8 עד 10 חודשים, חיפוש פעיל של מידע רגשי מאדם מהימן במצב לא ברור. הבעות ההורה משפיעות על הזהירות מזר, משחק בצעצוע חדש וחציית הצוק החזותי. <b>הקול</b> משפיע יותר מהפנים לבד: הוא מעביר רגש ומילים, והתינוק לא צריך להסתובב.`)}${ex("<b>ברוקולי וקרקרים:</b> אישה הראתה הנאה מאוכל אחד וגועל מהשני. בני <b>14</b> חודשים נתנו לה את מה שהם אוהבים (בדרך כלל קרקרים). בני <b>18</b> חודשים נתנו את מה שהיא אהבה, גם אם הם לא. הם מבינים שלאחר יש העדפות שונות.")}`,q:"q9"},
  {h:"רגשות של מודעות עצמית",html:`${def("מושג מפתח",`<mark>רגשות של מודעות עצמית</mark> ${E("Self-conscious emotions")}: אשמה, בושה, מבוכה, קנאה וגאווה. כל אחד כרוך בפגיעה או בחיזוק של תחושת העצמי. אשמה: פגעתי ורוצה לתקן. בושה ומבוכה: רוצה ״להיעלם״. גאווה: מספר לאחרים ולוקח אתגרים.`)}<p>הם מופיעים ב<b>אמצע השנה השנייה</b> (18 עד 24 חודשים), כשהמודעות לעצמי כנפרד מתגבשת: השפלת עיניים, הרכנת ראש, הסתרת פנים. קייטלין בת 22 חודשים החזירה לגרייס צעצוע שחטפה וטפחה על גבה. גאווה וקנאה מופיעות בערך בגיל שנתיים.</p>${rem("מלבד מודעות עצמית צריך <b>הדרכה של מבוגר</b> (״בוא נראה כמה רחוק תזרוק!״, ״תתבייש!״). והמצבים משתנים בין תרבויות: במערב גאווה על הישג אישי, ובסין וביפן תשומת לב להצלחה אישית מעוררת מבוכה, ואי־דאגה לזולת מעוררת בושה גדולה.")}${ex(`פעוט בן שנתיים ששבר כוס, מסתיר את הפנים ומסתכל לרצפה. זו בושה: הוא כבר מבין שיש לו "עצמי" ושאחרים שופטים אותו.`)}`,q:"q11"},
  {h:"ויסות עצמי רגשי",html:`${def("מושג מפתח",`<mark>ויסות עצמי רגשי</mark> ${E("Emotional self-regulation")}: אסטרטגיות להתאמת המצב הרגשי לעוצמה נוחה שמאפשרת להשיג מטרות. הוא דורש <b>בקרה שדורשת מאמץ</b>, שמשתפרת בזכות התפתחות הקורטקס הקדם־מצחי ותמיכת מטפלים.`)}${tiles([["moon","חודשים ראשונים","מוצפים בקלות, תלויים בהרגעה של המטפל: הרמה, נענוע, ליטוף, דיבור רך"],["clock","2 עד 6 חודשים","סיבולת לגרייה גדלה. ב־4 עד 6 חודשים מסיטים קשב מאירוע לא נעים ומרגיעים את עצמם"],["hand","המחצית השנייה","מאותתים למטפל שצריך עזרה. זחילה והליכה מאפשרות להתקרב או להתרחק"],["phone","השנה השנייה","מילים לרגשות. אבל התפרצויות זעם עדיין שכיחות, בעיקר בעייפות ורעב"]])}${rem("הורים ש״קוראים״ את התינוק ומגיבים באהדה: תינוקות פחות נרגנים, יותר מרוצים וקל להרגיע. הורים חסרי סבלנות שמתערבים רק כשהתינוק כבר נסער מחזקים מעבר מהיר למצוקה, ומבני מוח שבולמים עקה עלולים לא להתפתח כראוי.")}${def("תרבות ומגדר",`הורים מעודדים מוקדם דיכוי רגשות שליליים, ו<b>בנים</b> מקבלים יותר תרגול כזה (הם מתקשים יותר). מבוגרים סינים ויפנים מעודדים פחות הבעה עזה, ובסוף השנה תינוקותיהם מחייכים, צוחקים ובוכים פחות. פעוטות שהוריהם אוהדים אבל <b>מציבים גבולות</b> ומציעים חלופות לומדים לווסת כעס טוב יותר.`)}${ex(`תינוק שמוצץ אצבע כדי להירגע, או פעוטה שמפנה את המבט מכלב מפחיד. אלה אסטרטגיות ויסות מוקדמות.`)}`,q:"q13"}
 ]},
 {id:"t3",icon:"pie",title:"מזג: מבנה ומדידה",blocks:[
  {h:"מהו מזג: מחקר ניו יורק",html:`${def("על מה הנושא",`יש תינוקות רגועים ויש תינוקות שבוכים מכל דבר. ההבדל הזה נקרא מזג. הנושא מסביר מהו, ואיך מודדים אותו.<br><b>מה נלמד כאן:</b> מזג · שלושה סוגי ילדים · בקרה שדורשת מאמץ · ביישן מול חברותי`)}${def("מושג מפתח",`<mark>מזג</mark> ${E("Temperament")}: הבדלים בין־אישיים יציבים ומוקדמים ב<b>תגובתיות</b> (מהירות ועוצמת העוררות הרגשית, הקשב והפעילות) וב<b>ויסות עצמי</b>. הוא אבן הפינה של האישיות.`)}<p>ב־1956 התחילו <b>תומס וצ׳ס</b> את מחקר האורך של ניו יורק (141 ילדים מינקות לבגרות). המזג יכול להגדיל סיכון לקשיים או להגן מפני בית לחוץ, וההורות יכולה לשנות אותו. מתשעה ממדים עלו שלושה טיפוסים:</p>${fig("types")}${tiles([["check","ילד נוח","Easy child: שגרה סדירה מהר, עליז, מסתגל בקלות"],["x","ילד קשה","Difficult child: לא סדיר, איטי לקבל חדש, תגובות שליליות ועזות"],["clock","מתחמם לאט","Slow-to-warm-up: לא פעיל, תגובות מתונות, מצב רוח שלילי, מסתגל לאט"]])}${rem("הילד ה<b>קשה</b> בסיכון גבוה לבעיות הסתגלות, גם הסתגרות חרדתית וגם תוקפנות. המתחמם לאט מראה פחות בעיות בהתחלה, אבל בגן ובבית הספר עלול להיות מפוחד ומכונס כשמצפים לתגובות מהירות.")}${ex(`<b>קל</b>: תינוק שאוכל וישן בשעות קבועות ומחייך לזרים. <b>קשה</b>: תינוק בלי שגרה שבוכה בעוצמה מכל שינוי. <b>איטי להתחמם</b>: תינוק שבהתחלה נרתע מהגן החדש, אבל אחרי שבוע מסתדר.`)}`,q:"q15"},
  {h:"המודל של רוטבארט ובקרה שדורשת מאמץ",html:`<p>המודל המשפיע ביותר היום. שישה ממדים, עם הבחנה בין <b>מצוקה מפחד</b> ל<b>מצוקה מרוגז</b> (תסכול), ובלי ממדים רחבים מדי כמו סדירות או עוצמה. שלושה רכיבים: <b>רגש</b>, <b>קשב</b> ו<b>פעולה</b>, ועוד ממד ויסות.</p>${rothTable}${def("בקרה שדורשת מאמץ",`<mark>בקרה שדורשת מאמץ</mark> ${E("Effortful control")}: היכולת לדכא באופן רצוני תגובה דומיננטית כדי לתכנן ולבצע תגובה מסתגלת יותר. גם בסין וגם בארה״ב היא מנבאת התמדה, הישגים, בשלות מוסרית (דאגה והתנצלות) ושיתוף פעולה, חלוקה ועזרה.`)}${tiles([["doc","דיווחי הורים","קל, מבוסס על היכרות עמוקה, תואם במידה מסוימת לתצפיות, וחשוב להבנת איך ההורים רואים את הילד. אבל עלול להיות מוטה"],["target","תצפיות","פחות סובייקטיביות ומאפשרות מדדים ביולוגיים. אבל קשה ללכוד אירועים נדירים בבית, ובמעבדה ילד מפוחד עלול לא לסיים"]])}${ex(`<b>בקרה שדורשת מאמץ</b>: ילדה שרוצה לפתוח את המתנה, אבל מחכה כי אמרו לה שקודם שרים. היא עוצרת את הדחף בכוח הרצון.`)}`,q:"q17"},
  {h:"ביישנות וחברותיות",html:`${def("שני קצוות",`<mark>ילד מאופק או ביישן</mark> ${E("Inhibited, shy child")}: מגיב שלילית לחדש ומתרחק. <mark>ילד פתוח או חברותי</mark> ${E("Uninhibited, sociable child")}: מגיב בחיוב ומתקרב.`)}${ex("<b>לארי ומיטש</b> אצל קגן: בגיל 4 חודשים לארי כיווץ שרירים ובכה מול מובייל, ומיטש חייך. כפעוטות לארי ייבב והתכנס מול רובוטים וזרים, ומיטש צחק וניגש. בגיל 4.5 לארי שמר מרחק מילדים זרים, ומיטש התיידד מהר.")}<p>קגן מצא שכ־<b>20%</b> מבני 4 חודשים מוטרדים בקלות מחידושים, ו־<b>40%</b> נהנים מהם. רק <b>20% עד 25%</b> מהקצוות שמרו על הסגנון עם ההתבגרות: עם הזמן הקיצוניות פחתה.</p>${tiles([["brain","אמיגדלה","אצל ביישנים חידוש מעורר אותה ואת המערכת הסימפתטית. מבוגרים שהיו מאופקים מראים יותר פעילות בה מול פנים זרות"],["chart","גוף","קצב לב גבוה, יותר קורטיזול, אישונים מורחבים, לחץ דם ואצבעות קרות"],["copies","קורטקס","יותר פעילות EEG באונה המצחית הימנית (רגש שלילי) אצל ביישנים, ההפך אצל חברותיים"]])}${rem("לפי קגן רוב הקיצוניים יורשים נטייה, אבל תרומת הגנים <b>מוגבלת</b>. חום ותמיכה מפחיתים תגובתיות, הורות קרה או <b>מגוננת יתר</b> מעצימה חרדה, ודרישה מתונה לגשת לחדש עוזרת. ביישנות מתמשכת מגבירה סיכון לחרדה, דיכאון ופוביה חברתית.")}`,q:"q19"}
 ]},
 {id:"t4",icon:"scales",title:"יציבות, תורשה וטיב התאמה",blocks:[
  {h:"יציבות המזג",html:`${def("על מה הנושא",`האם המזג קבוע לכל החיים? ומה מכריע, הגנים או הסביבה? הנושא מסתיים ברעיון החשוב: לא המזג עצמו קובע, אלא ההתאמה בינו לבין הסביבה.<br><b>מה נלמד כאן:</b> יציבות · גנים וסביבה · גמישות · טיב ההתאמה`)}<p>ילדים עם ציונים קיצוניים נוטים להגיב דומה גם שנים אחר כך, לפעמים עד הבגרות. אבל באופן כללי היציבות <b>נמוכה</b> בינקות ובגיל הרך, ו<b>מתונה</b> מגיל הגן. יש ילדים שלא משתנים, ורבים שכן.</p>${def("למה לא יציב יותר",`המזג עצמו <b>מתפתח</b>. רוב התינוקות בוכים הרבה בחודשים הראשונים ונרגעים עם הוויסות. ומשמעות הפעילות מתהפכת: בהתחלה תינוק פעיל ומתפתל הוא לא נינוח, ותינוק שקט קשוב. כשמתחילים לזחול, הפעיל הוא החוקר הסקרן, והלא פעיל אולי מפוחד.`)}${rem("לכן ניבוי טוב יותר <b>אחרי גיל 3</b>. בין 2.5 ל־3 יש קפיצה בבקרה שדורשת מאמץ (המתנה לפרס, לחישה, ״המלך אמר״), כנראה בזכות התפתחות הקורטקס הקדם־מצחי. פעוטות חששנים מקבלים אחר כך ציונים מעט גבוהים בבקרה, ונרגנים נמוכים יותר. ילדים שליליים עם הורים <b>סבלניים ותומכים</b> מרוויחים הכי הרבה.")}`,q:"q21"},
  {h:"השפעות גנטיות וסביבתיות",html:`<p>תאומים זהים דומים יותר בתכונות מזג ואישיות. בערך <b>מחצית</b> מההבדלים מיוחסים לגנים: השפעה מתונה. גם הסביבה חזקה: תת־תזונה ובתי יתומים דלים משאירים ילדים מוסחים, מפוחדים וחלשים בוויסות.</p>${def("הבדלים אתניים",`תינוקות סינים ויפנים פחות פעילים, נרגנים וקולניים, נרגעים בקלות, אבל גם חשדניים יותר מול זרים. אולי יש שורש גנטי, אבל גם <b>מתאם בין גנים לסביבה</b>: אימהות יפניות רואות בתינוק יצור עצמאי שצריך ללמוד לסמוך עליהן דרך מגע קרוב, ואמריקניות רוצות לגמול מתלות. אסיאתיות עדינות ומנחמות, אמריקניות פעילות ומילוליות.`)}${def("הבדלי מגדר",`בנים פעילים, נועזים ונרגזים יותר בתסכול, ומעט אימפולסיביים (יותר פציעות). בנות דאגניות וביישניות יותר, עם יתרון ב<b>בקרה שדורשת מאמץ</b> (שיתוף פעולה, הצלחה בבית הספר). וההורים מחזקים: בנים לפעילות, בנות לפנייה לעזרה וקרבה.`)}`,q:"q23"},
  {h:"גנים, רגישות ואחאים",html:`<p><b>גן 5-HTTLPR קצר</b> (כרומוזום 17) פוגע בתפקוד הסרוטונין ומגדיל סיכון למצב רוח רע, פחד וקשיי ויסות. אבל:</p>${tiles([["x","הורות גרועה","פעוטות עם הגן נעשו נרגנים יותר ככל שחרדת האם גברה, ותגובתיים יותר לחוסר רגישות, עד תוקפנות והתנגדות בבית הספר"],["check","הורות טובה","עם חום ותמיכה, הוויסות שלהם השתווה לבעלי סיכון נמוך, והם התקדמו יותר בלמידה ובחברה"]])}${def("גמישות",`הם בעלי <b>גמישות</b> ${E("Plasticity")} מוקדמת גבוהה: רגישים להורות טובה וגם לגרועה. לכן הם מגיבים טוב במיוחד להתערבות. ילדים בלי הגן כמעט לא הושפעו מאיכות ההורות.`)}${rem("<b>אחאים:</b> הורים רואים יותר הבדלים בין ילדיהם ממה שצופים רואים. תאומים לא זהים, שחוקרים דירגו דומים במידה מתונה, ההורים תיארו כהפוכים (ביישן וחברותי). ההדגשה הזו משפיעה על ההורות, וכל ילד מעורר תגובות שמתאימות לה.")}${ex(`<b>גמישות</b>: ילד רגיש במיוחד הוא כמו סחלב: בסביבה קשה הוא נפגע יותר מאחרים, אבל עם הורות טובה הוא פורח יותר מכולם.`)}`,q:"q25"},
  {h:"מודל טיב ההתאמה",html:`${def("מושג מפתח",`<mark>מודל טיב ההתאמה</mark> ${E("Goodness-of-fit model")} של תומס וצ׳ס: יצירת סביבת גידול שמכירה במזג של הילד ובה בעת מעודדת תפקוד מסתגל יותר.`)}${ex("ילד <b>קשה</b> מקבל פחות טיפול רגיש, אחר כך משמעת כועסת ומענישה, הוא מתנגד, ההורים לחוצים יותר, כופים ולא עקביים, לפעמים נכנעים ומתגמלים אי־ציות. כך הסגנון הנרגן <b>מתחזק</b>. הורות חיובית ורגישה, עם ציפיות ברורות וגבולות, מפחיתה את הקשיים עד גיל 2 עד 3.")}<p>הורות טובה לילד קשה תלויה גם ב<b>תנאי חיים</b>: בריאות נפשית, נישואים טובים ומצב כלכלי. תינוקות רוסים בזמן משבר כלכלי הראו יותר רגשות שליליים.</p>${def("גם התרבות קובעת",`בסין בעבר ביישנות נחשבה חיובית, ובשנחאי ב־1990 היא נקשרה ליכולת, קבלה ומנהיגות. עם כלכלת השוק המתאמים נחלשו (1998) ו<b>התהפכו</b> (2002), כמו במערב. בכפר עדיין מעריכים ביישנות.`)}${rem("עדיף להתאים מוקדם. אולי חוסר ההתאמה בין ההתערבות של ונסה לבין המזג הפעיל של טימי תרם לקפיצות שלו מפעילות לפעילות. הורים לא אחראים לכל תכונה, אבל יכולים להפוך סביבה שמעצימה בעיות לסביבה שבנויה על <b>נקודות החוזק</b>.")}`,q:"q27"}
 ]},
 {id:"t5",icon:"link",title:"היקשרות: תיאוריות",blocks:[
  {h:"האכלה? הניסוי של הארלו",html:`${def("על מה הנושא",`למה תינוקות נקשרים להורים? הנושא מציג את התשובות התיאורטיות, מהקוף של הארלו ועד בולבי.<br><b>מה נלמד כאן:</b> היקשרות · הניסוי של הארלו · התיאוריה האתולוגית · מודל עבודה פנימי`)}${def("היקשרות",`<mark>היקשרות</mark> ${E("Attachment")}: הקשר החם והחזק לאנשים מיוחדים, שבו אנו נהנים מהאינטראקציה ומתנחמים בקרבתם בעת עקה. במחצית השנייה של השנה הראשונה תינוקות נקשרים למי שנענה לצרכיהם.`)}<p>פרויד טען ראשון שהקשר לאם הוא יסוד לכל היחסים. <b>הגישה הפסיכואנליטית</b> והביהביוריסטית ראו בהאכלה את ההקשר העיקרי (ביהביוריזם: החיוך והליטוף מתקשרים לסיפוק הרעב).</p>${ex("<b>הארלו</b> (שנות ה־50): קופי רזוס עם ״אימהות חלופיות״ התרפקו על אם מבד מגבת, אף שאם מחוטי תיל החזיקה את הבקבוק. גם תינוקות נקשרים לאב, אחאים וסבים שכמעט לא מאכילים, ולשמיכות ודובים.")}${rem("שתי הגישות גם נותנות מעט תשומת לב ל<b>מאפייני התינוק</b>. לכן היום מקובלת התיאוריה האתולוגית.")}`,q:"q29"},
  {h:"התיאוריה האתולוגית של בולבי",html:`${def("מושג מפתח",`<mark>התיאוריה האתולוגית של ההיקשרות</mark> ${E("Ethological theory of attachment")}: הקשר הוא תגובה מתפתחת שמקדמת <b>הישרדות</b>. בולבי, בהשראת ההטבעה של לורנץ, טען שיש מערכת מולדת שמשאירה את ההורה קרוב להגנה ולתמיכה בחקירה. ההאכלה אינה הבסיס.`)}${fig("bowlby")}${tiles([["sprout","1. טרום־היקשרות","לפיתה, חיוך, בכי ומבט. מזהים ריח, קול ופנים של האם, אבל לא מתנגדים להישאר עם זר"],["hand","2. בהתהוות","מגיבים אחרת למוכר (טימי צחק ונרגע מהר יותר עם אמו). תחושת אמון, אבל עוד לא מוחים בפרידה"],["lock","3. חד־משמעית","Separation anxiety: מוחים כשהמטפל יוצא, עולה בין 6 ל־15 חודשים, תלוי במזג ובמצב. עוקבים, מטפסים, בסיס בטוח"],["people","4. יחסים הדדיים","מבינים מה משפיע על יציאה וחזרה, המחאה פוחתת, משא ומתן (קייטלין: ״תקריאו לי סיפור קודם״)"]])}${ex(`תינוק שבוכה כשאמא יוצאת מהחדר ונרגע כשהיא חוזרת. לפי בולבי זו לא "פינוק", אלא מנגנון הישרדות: להישאר קרוב למי שמגן עליך.`)}`,q:"q31"},
  {h:"מודל עבודה פנימי",html:`${def("מושג מפתח",`<mark>מודל עבודה פנימי</mark> ${E("Internal working model")}: מתוך ארבעת השלבים בונים קשר מתמשך שמשמש בסיס בטוח גם כשההורים לא כאן. זו מערכת ציפיות: האם דמות ההיקשרות זמינה, האם תתמוך במצוקה, ואיך העצמי מתנהל מולה. הוא נעשה חלק מהאישיות ומדריך את כל היחסים העתידיים.`)}${ex("בני 12 עד 16 חודשים ראו סרטון: צורה גדולה (״מטפל״) מטפסת במדרון וצורה קטנה (״ילד״) ״בוכה״. בעלי <b>היקשרות בטוחה</b> הביטו יותר כשהמטפל המשיך לטפס ולא חזר, כי זה הפר את הציפייה שלהם. בעלי היקשרות <b>לא בטוחה</b> לא הבחינו בין האירועים (תרשים 7.3).")}${rem("המודל ממשיך להתעדכן עם הגיל, דרך יחסים עם ההורים, מבוגרים אחרים, אחאים וחברים.")}`,q:"q33"}
 ]},
 {id:"t6",icon:"data",title:"מדידת ההיקשרות",blocks:[
  {h:"המצב הזר וארבעת הדפוסים",html:`${def("על מה הנושא",`איך יודעים אם תינוק קשור בצורה בטוחה? הנושא מציג את שיטות המדידה ואת ארבעת הדפוסים.<br><b>מה נלמד כאן:</b> המצב הזר · ארבעה דפוסי היקשרות · Q-Sort · יציבות ותרבות`)}${def("מושג מפתח",`<mark>המצב הזר</mark> ${E("Strange Situation")} של <b>איינסוורת׳</b>: הטכניקה הרווחת בגיל שנה עד שנתיים. שמונה אפיזודות קצרות של פרידה ואיחוד בחדר לא מוכר עם זר. התגובה ל<b>איחוד</b> מגדירה במידה רבה את איכות ההיקשרות.`)}${ssTable}${tiles([["check","בטוחה","Secure: ההורה בסיס בטוח. אולי בוכים בפרידה (כי מעדיפים את ההורה), שמחים בבירור בשובו והבכי פוחת מיד"],["x","לא בטוחה־נמנעת","Avoidant: לא מגיבים להורה, לא מוטרדים ביציאה, מגיבים לזר כמו להורה, נמנעים ממנו באיחוד ולא מתרפקים"],["cycle","לא בטוחה־מתנגדת","Resistant: מחפשים קרבה ולא חוקרים, מצוקה ביציאה, ובאיחוד היצמדות עם כעס והתנגדות, לא נרגעים"],["question","חסרת ארגון וכיוון","Disorganized/disoriented: הכי לא בטוחה. התנהגות סותרת ומבולבלת: מסיטים מבט כשמוחזקים, קופאים, צועקים פתאום"]])}${fig("ssp","שכיחות הדפוסים במשפחות ממעמד בינוני בצפון אמריקה. במעמד נמוך פחות בטוחים")}${ex(`במעבדה, אמא יוצאת מהחדר ומשאירה את הפעוט עם זרה. כשהיא חוזרת, החוקרים מסתכלים בעיקר על דבר אחד: איך הפעוט מגיב לאיחוד.`)}`,q:"q35"},
  {h:"Q-Sort, יציבות ותרבות",html:`${def("שאלון Q-Sort",`<mark>שאלון היקשרות מסוג Q-Sort</mark>: לגילים 1 עד 5, מבוסס על תצפית בבית. ממיינים 90 התנהגויות לתשע קטגוריות ומחשבים רמת ביטחון. מכסה יותר התנהגויות ואולי משקף טוב יותר את היום־יום. אבל דורש זמן רב, מיון של צופה מומחה (מיוני הורים לא תואמים למצב הזר), ולא מבחין בין סוגי חוסר הביטחון.`)}<p><b>יציבות:</b> הממצאים מגוונים. ההיקשרות נשארת בטוחה ויציבה במעמד בינוני עם תנאים נאותים. ילדים עוברים לביטחון כשהאם מסתגלת היטב ויש תמיכה. במשפחות עניות לחוצות היא לרוב מתרחקת מביטחון. בטוחים יציבים יותר, וחסרת ארגון היא יוצאת דופן: יציבה מאוד או מנבאת חוסר ביטחון אחר בהמשך.</p>${tiles([["people","גרמניה","יותר נמנעים: ההורים מעריכים עצמאות ומעודדים לא להיצמד"],["hand","הדוגון (מאלי)","אף תינוק לא נמנע: האם תמיד זמינה ומניקה בתגובה למצוקה"],["lock","יפן וקיבוצים","יותר מתנגדים, אבל אולי לא חוסר ביטחון אמיתי: ביפן כמעט לא משאירים תינוק עם אחרים, ובקיבוץ זרים מפחידים"]])}${rem("למרות ההבדלים, ההיקשרות ה<b>בטוחה</b> היא הדפוס השכיח ביותר בכל החברות שנחקרו.")}`,q:"q37"}
 ]},
 {id:"t7",icon:"gear",title:"מה משפיע על היקשרות בטוחה",blocks:[
  {h:"זמינות של מטפל קבוע",html:`${def("על מה הנושא",`מה גורם להיקשרות בטוחה? הנושא עובר על ארבעה גורמים: האם יש מטפל קבוע, איך הוא מטפל, מי התינוק, ומה קורה במשפחה.<br><b>מה נלמד כאן:</b> מטפל קבוע · טיפול רגיש · סנכרון · מזג · מודלי ההורים · מסגרות יום`)}<p>ארבעה גורמים נחקרו: <b>זמינות מוקדמת</b> של מטפל קבוע, <b>איכות הטיפול</b>, <b>מאפייני התינוק</b> וה<b>הקשר המשפחתי</b>.</p>${ex("במוסד עם יחס צוות טוב וצעצועים רבים, אבל תחלופה עצומה: עד גיל 4.5 ילד טופל בידי כ־<b>50</b> מטפלים. רבים אומצו אחרי גיל 4 ורובם נקשרו להורים המאמצים, אבל היו יותר קשיים: רצון מופרז לתשומת לב, ״ידידותיות יתר״ עם זרים, אי־חזרה להורה בחרדה ומעט חברים.")}${def("בתי יתומים דלים",`ילדים מבתי יתומים במזרח אירופה נקשרים להורים המאמצים, אבל עם שיעורים גבוהים של חוסר ביטחון, חברותיות לא מבחינה או עצב והסתגרות, ובעיות מתמשכות (קשב, דיכאון, תוקפנות). כבר ב־7 חודשים יש ירידה ב־ERP להבעות רגש, ו<b>אמיגדלה</b> גדולה מהרגיל קשורה להבנת רגשות וויסות גרועים.`)}${rem("התפתחות רגשית תקינה מלאה תלויה בקשר הדוק עם מטפל <b>מוקדם</b> בחיים.")}`,q:"q39"},
  {h:"איכות הטיפול",html:`${def("טיפול רגיש",`<mark>טיפול רגיש</mark> ${E("Sensitive caregiving")}: תגובה מהירה, עקבית ומותאמת, והחזקה עדינה. קשור במידה מסוימת להיקשרות בטוחה, באימהות ביולוגיות ומאמצות ובתרבויות שונות. אימהות לבטוחים מתייחסות לתינוק <b>כבעל מחשבות ורגשות</b> (״אתה באמת אוהב את הנדנדה!״).`)}${def("סנכרון אינטראקטיבי",`<mark>סנכרון אינטראקטיבי (מהדהד)</mark> ${E("Interactional synchrony")}: ״ריקוד רגשי״ שבו המטפל מגיב מיד, בקצב ובהתאמה, ושניהם מתאימים מצבים רגשיים, בעיקר חיוביים. תיאום <b>מתון</b> מנבא ביטחון טוב יותר מתיאום ״הדוק״: מטפל רגוע מקבל אי־התאמות ומתקן אותן.`)}${tiles([["leaf","הגוסי (קניה)","מעט חיבוקים ומשחק, אבל מענה לצרכים, ורוב התינוקות בטוחים: הביטחון תלוי בטיפול קשוב, לא באינטראקציה רציפה"],["hand","פוארטו ריקו","כיוון פיזי והגבלה קשורים לביטחון שם, אבל במערב נחשבים מתערבים ומנבאים חוסר ביטחון"]])}${rem("<b>נמנעים</b>: טיפול חודרני ועודף גרייה, וההימנעות היא בריחה. <b>מתנגדים</b>: טיפול לא עקבי, לא נענה, אבל מתערב כשהתינוק חוקר. <b>חסרי ארגון</b>: התעללות והזנחה, דיכאון, טראומה ואובדן אצל ההורה, והתנהגות מאיימת או מפחידה: ההורה גם מנחם וגם מפחיד.")}${ex(`<b>טיפול רגיש</b>: התינוק בוכה, ואבא בודק אם הוא רעב, עייף או צריך חיבוק. <b>סנכרון</b>: אמא ותינוק "משחקים בתורות": היא מחייכת, הוא מגרגר, היא עונה בקול, כמו ריקוד.`)}`,q:"q41"},
  {h:"מאפייני התינוק",html:`<p>היקשרות היא יחסי גומלין, ולכן גם התינוק משפיע. פגות, סיבוכי לידה ומחלה דורשים הרבה, ובמשפחות לחוצות קשורים לחוסר ביטחון. במחקר אחד, פגות <b>יחד עם</b> סיכון כלכלי או נפשי של האם (ולא פגות לבדה) הפחיתה רגישות וניבאה חוסר ביטחון בגיל שנה. תינוקות בסיכון עם הורים פנויים וסבלניים מתפתחים בביטחון.</p>${def("מזג וגנים",`תינוקות תגובתיים רגשית בסיכון גבוה יותר, ותינוקות לא מאורגנים ב־NBAS בסיכון לחוסר ארגון. אבל שוב <b>גן־סביבה</b>: גן 5-HTTLPR קצר מגדיל סיכון לחוסר ארגון רק עם אם לא מגיבה, ו־<b>DRD4 7-repeat</b> קשור לחוסר ארגון רק כשהאם חוותה אובדן לא פתור או טראומה.`)}${rem("בתאומים, להיקשרות <b>אין תורשתיות</b>. ושני שלישים מהאחאים מפתחים אותו דפוס אף שהמזג שונה: רוב ההורים מתאימים את הטיפול לכל ילד. התערבויות שמלמדות רגישות ומשמעת יעילה הפחיתו קורטיזול והתנהגות הרסנית בפעוטות עם DRD4.")}`,q:"q43"},
  {h:"הקשר משפחתי ומסגרות יום",html:`${ex("טימי: הוריו התגרשו אחרי לידתו, ונסה חרדה עבדה 50 שעות בשבוע ושמרטפית לקחה אותו לרוב. ביום הולדתו הראשון הוא <b>התעלם</b> ממנה כשבאה. גירושים, קשיים כלכליים ובעיות נפשיות פוגעים ברגישות ובאקלים המשפחתי, ותמיכה חברתית מגינה. בזכות ג׳ינט ועצות הפסיכולוג, בגיל שנתיים היחסים השתפרו.")}${def("מודלי העבודה של ההורים",`כששואלים הורים על ילדותם: מי שמדבר באופן <b>אובייקטיבי ומאוזן</b>, בלי קשר אם החוויות היו טובות, נוטה לילד בטוח ולהורות רגישה. מי שמבטל את חשיבות היחסים או מתאר אותם בכעס ובלבול נוטה לילד לא בטוח. אבל אלה <b>זיכרונות משוחזרים</b>: מה שקובע הוא היכולת לקבל חוויות שליליות ולהביט בהורים בהבנה ובסליחה, יותר מההיסטוריה עצמה.`)}${def("מסגרות יום",`טיפול לא הורי <b>כשלעצמו</b> לא פוגע בהיקשרות (NICHD, יותר מ־1,300 תינוקות). איכות ההורות משפיעה יותר. חוסר ביטחון עולה בשילוב סיכונים: טיפול לא רגיש בבית ובמעון, שעות רבות או כמה מסגרות. מעל <b>30 שעות</b> בשבוע קשורות ליותר בעיות מוחצנות בגיל 4.5 עד 5, אבל טיפול איכותי מגן, ובאוסטרליה ובנורווגיה אין קשר כזה. הפתרון: מסגרות איכותיות, חופשת לידה ומשרה חלקית.`)}${rem("אפשר להבין היקשרות במלואה רק מנקודת מבט של <b>מערכות אקולוגיות</b>.")}`,q:"q45"}
 ]},
 {id:"t8",icon:"people",title:"היקשרויות מרובות והמשך",blocks:[
  {h:"אבות",html:`${def("על מה הנושא",`תינוקות נקשרים לא רק לאמא. הנושא מציג עוד דמויות היקשרות, ומה ההיקשרות המוקדמת מנבאת בהמשך החיים.<br><b>מה נלמד כאן:</b> אבות · סבים ואחאים · היקשרות והתפתחות מאוחרת`)}<p>בולבי האמין שיש העדפה לדמות אחת, אבל התיאוריה שלו מתארת <b>היקשרויות מרובות</b>. בני שנה במצוקה בוחרים בדרך כלל באם, וההעדפה פוחתת בשנה השנייה. טיפול רגיש של האב מנבא היקשרות בטוחה אליו.</p>${tiles([["hand","אימהות","יותר טיפול פיזי והבעת אהבה. משחק עדין: צעצועים, דיבור, ״קוקו״"],["target","אבות","יותר משחק, פיזי וממריץ עם פרצי התלהבות, בעיקר עם בנים. כשהוא רגיש, עוזר לווסת רגשות ומכין לסביבות חדשות"]])}${def("שינוי בזמן",`בסקר בארה״ב, אבות מתחת לגיל 29 מקדישים <b>85%</b> מהזמן שאימהות מקדישות (מעט יותר מ־4 שעות ביום עבודה), כמעט פי שניים מלפני 30 שנה. כשליש מהנשים העובדות אומרות שבן הזוג שותף שווה. אבות היספנים מקדישים יותר זמן.`)}${def("חום אבהי",`בתרבויות רבות, מעורבות אוהבת של האב מנבאת כישורים קוגניטיביים, רגשיים וחברתיים <b>כמו</b> חום האם, ולפעמים יותר. אצל <b>האקה</b> במרכז אפריקה אבות נמצאים במרחק יד מהתינוק יותר ממחצית היום, כי הזוגות משתפים פעולה באופן יוצא דופן. גם במערב, נישואים מאושרים קשורים למעורבות אבהית רבה יותר.`)}${ex(`אבות נוטים יותר למשחק פיזי מלהיב, כמו לזרוק לאוויר ולהשתולל, ואמהות יותר לטיפול ולמשחק רגוע. שניהם בונים היקשרות.`)}`,q:"q47"},
  {h:"סבים ואחאים",html:`${def("סבים כמטפלים עיקריים",`כ־2.4 מיליון ילדים בארה״ב (4% עד 5%) גרים עם סבים בלי ההורים: <mark>משפחות שדילגו על דור</mark> ${E("Skipped-generation families")}. בדרך כלל בגלל בעיות של ההורים (חומרים, התעללות, מחלת נפש, הורות בהתבגרות). הילדים מגיעים עם קשיים, ההורים לפעמים מפריעים, יש עומס כלכלי ורגשי. ובכל זאת נוצרת <b>היקשרות משמעותית</b> שמגינה על הילדים, והסבים זקוקים לתמיכה.`)}<p><b>אחאים:</b> 80% מהילדים גדלים עם אח לפחות. תינוק חדש קשה לילד בגיל הגן: תובענות, היצמדות, פחות היקשרות בטוחה (בעיקר מעל גיל שנתיים או כשהאם לחוצה). אבל גם אהבה ודאגה, ובסוף השנה התינוק נרגע ליד האח ובהמשך פונה אליו לנחמה.</p>${tiles([["clock","זמן מיוחד","בילוי עם הילד הגדול, בעזרת בן הזוג"],["bulb","סבלנות","תגובה סבלנית להתנהגות לא הולמת, והזדמנויות לגאווה בעזרה"],["phone","להסביר","לדבר על רצונות התינוק: ״הוא מנסה להגיע לרעשן״"],["link","זוגיות","תמיכה הדדית ופתרון בעיות יחד מסייעים להתמודד עם קנאה"]])}${rem("גם מזג משפיע (יותר קונפליקט אם אח לחוץ או פעיל מאוד), וחום אימהי לשני הילדים קשור לאינטראקציה חיובית ביניהם, וקשיחות לטינה.")}`,q:"q49"},
  {h:"מקבוצת השווים להתפתחות מאוחרת",html:`<p><b>חברות מוקדמת:</b> בגיל 6 חודשים מביטים, מחייכים ומושיטים יד לבני גילם. בסוף השנה יש לפעמים פעולה הדדית. בין שנה לשנתיים מבינים שלאחר כוונות ורגשות משלו, ויש יותר אינטראקציה מתואמת: חיקוי, רדיפה, השלכה משותפת. בגיל שנתיים משתמשים במילים (״בואי נשחק תופסת״). קשר חם עם ההורים ומסגרת איכותית בקבוצה קטנה מקדמים זאת.</p>${def("היקשרות והתפתחות מאוחרת",`במחקר אורך, ילדים בטוחים בינקות היו בגן גבוהים יותר בהערכה עצמית, מיומנויות חברתיות ואמפתיה, בגיל 11 עם חברויות טובות יותר, ובבגרות עם יותר תמיכה, קשרים רומנטיים יציבים והשכלה. אבל במחקרים אחרים <b>לא תמיד</b>.`)}${rem(`ההסבר: <b>המשכיות הטיפול</b> ${E("Continuity of caregiving")}. בטוחים עם הורות רגישה בהמשך קיבלו את הציונים הגבוהים, לא בטוחים עם הורות לא רגישה הנמוכים, והאחרים באמצע. לא בטוחים שאימותיהם השתפרו הראו <b>הבראה</b>, כמו בחוסן. ההיקשרות הבטוחה מתחילה ״ברגל ימין״, אבל השפעתה <b>מותנית</b> ביחסים העתידיים.`)}`,q:"q51"}
 ]}
];

q5:{t:"t1",v:[
 {q:"בת 6 חודשים כועסת כשאמא לוקחת ממנה את המפתחות. למה הכעס גובר בגיל הזה?",a:"היא מזהה מי חסם את מטרתה",w:["היא עייפה יותר בגיל הזה","היא עוד לא מבינה מה קרה","הכעס הוא רפלקס של יילודים"],e:"התנהגות מכוונת וגבולות."},
 {q:"בניסוי הפנים הקפואות, מה עשו תינוקות כשלא הצליחו להחזיר את ההורה?",a:"הסיטו מבט, קימטו מצח ובכו",w:["המשיכו לחייך כרגיל להורה","פנו מיד לאדם אחר בחדר","נרדמו מעייפות אחרי דקה"],e:"מצוקה ועצב."}]},
q6:{t:"t1",v:[
 {q:"תינוקת שהמטפלת האהובה עליה עזבה, נעשית שקטה ומנותקת. איזה רגש הכי סביר?",a:"עצב",w:["כעס","פחד מזרים","בושה"],e:"אובדן מטפל מוכר."},
 {q:"למה הכעס נחשב רגש מסתגל אצל תינוקות גדולים?",a:"הוא עוזר להתגבר על מכשולים ולגייס עזרה",w:["הוא מרחיק את המטפלים מהתינוק","הוא מסמן בעיה התפתחותית מוקדמת","הוא מפחית את הצורך של התינוק במגע"],e:"מניע את המטפל להקל."}]},
q7:{t:"t1",v:[
 {q:"שני תינוקות בני 10 חודשים פוגשים זר. אחד בוכה, השני מחייך. מה יכול להסביר זאת?",a:"מזג, ניסיון קודם עם זרים והמצב",w:["רק הגיל המדויק של כל אחד","רק המין של התינוק","רק כמה זמן הזר נשאר"],e:"חרדת זרים משתנה."},
 {q:"למה אצל שבט האפה כמעט אין חרדת זרים?",a:"התינוקות עוברים בין מבוגרים רבים",w:["כי התינוקות שם לא מפחדים בכלל","כי אין שם זרים כלל","כי האמהות לא עוזבות לעולם"],e:"כבר מהלידה."}]},
q8:{t:"t1",v:[
 {q:"פעוט בגן שעשועים מתרחק לשחק, חוזר לגעת באבא, ושוב יוצא. מה האב משמש?",a:"בסיס בטוח",w:["דמות זרה","הירמזות חברתית","מודל עבודה"],e:"יוצא לחקור וחוזר."},
 {q:"מה נמצא אצל תינוקות בקיבוצים לגבי חרדת זרים?",a:"היא הייתה גבוהה יותר מבעיר",w:["היא הייתה נמוכה יותר מבעיר","לא הייתה בכלל","זהה לתינוקות בעיר"],e:"בהשוואה לתינוקות בעיר."}]},
q9:{t:"t2",v:[
 {q:"בת 12 חודשים מגיעה לצעצוע מוזר, מביטה באמא, וזו אומרת ״אוי!״ בפחד. מה היא עושה?",a:"הירמזות",w:["חרדת זרים","בסיס בטוח","ויסות עצמי"],e:"מידע רגשי ממבוגר מהימן."},
 {q:"מה השפיע יותר בהירמזות חברתית?",a:"קול, לבד או עם פנים",w:["פנים לבד, בלי קול","מגע של ההורה","תנועות הידיים בלבד"],e:"הקול חזק במיוחד."}]},
q10:{t:"t2",v:[
 {q:"אישה הראתה שהיא אוהבת ברוקולי ולא קרקרים. בן 18 חודשים מעדיף קרקרים. מה ייתן לה?",a:"ברוקולי",w:["קרקרים","את שניהם","כלום"],e:"מבין שלאחר העדפות משלו."},
 {q:"בגיל 3 חודשים, מה מתחילים תינוקות לצפות מהשותף לאינטראקציה?",a:"שיגיב להם",w:["שיחייך תמיד","שיתעלם מהם","שיאכיל אותם"],e:"לכן מוטרדים בפנים קפואות."}]},
q11:{t:"t2",v:[
 {q:"איזה מהבאים אינו רגש של מודעות עצמית?",a:"פחד",w:["בושה","גאווה","קנאה"],e:"פחד הוא רגש בסיסי."},
 {q:"מתי מופיעים רגשות של מודעות עצמית?",a:"באמצע השנה השנייה",w:["בחודשים הראשונים","בסוף השנה הראשונה","רק בגיל הגן"],e:"עם גיבוש המודעות לעצמי."}]},
q12:{t:"t2",v:[
 {q:"פעוט שבר כוס. מה עוד נדרש, מלבד מודעות עצמית, כדי שירגיש אשמה?",a:"הדרכה של מבוגר",w:["רק גיל מבוגר יותר","רק אוצר מילים רחב","רק עונש על המעשה"],e:"תלוי בהדרכה."},
 {q:"ילד יפני שמתגאה בפומבי בהצלחה אישית. מה צפוי?",a:"מבוכה",w:["גאווה, כמו במערב","אדישות מהסביבה","שבחים רבים מהמורים"],e:"הבדלים תרבותיים."}]},
q13:{t:"t2",v:[
 {q:"בן 3 חודשים נסער, וההורה מרים, מנענע ומדבר ברכות. מה זה מדגים?",a:"ויסות בעזרת מטפל",w:["ויסות עצמי עצמאי","הירמזות חברתית","בקרה שדורשת מאמץ"],e:"בחודשים הראשונים."},
 {q:"מהו ויסות עצמי רגשי?",a:"התאמת הרגש לעוצמה שמאפשרת להשיג מטרות",w:["דיכוי מלא של כל רגש שלילי שעולה","ביטוי חופשי של כל רגש בלי שליטה","הבנה של הרגשות של אנשים אחרים"],e:"אסטרטגיות התאמה."}]},
q14:{t:"t2",v:[
 {q:"הורים שמתערבים רק כשהתינוק כבר צורח. מה צפוי?",a:"התינוק יעבור מהר למצוקה, וקשה יותר להרגיע",w:["התינוק ילמד להירגע לבד עם הזמן","התינוק יבכה פחות ככל שיגדל","אין לכך השפעה על התינוק בכלל"],e:"מחזקים מצוקה."},
 {q:"למה בנים מקבלים יותר עידוד לדכא רגשות שליליים?",a:"הם מתקשים יותר בוויסות רגשות שליליים",w:["הם מרגישים פחות רגשות שליליים","הם מבקשים זאת מההורים","זה נדרש בחוק החינוך"],e:"ההורים מגיבים לקושי."}]},
q15:{t:"t3",v:[
 {q:"מהו מזג?",a:"הבדלים מוקדמים ויציבים בתגובתיות ובוויסות",w:["רגש חולף שמשתנה מרגע לרגע","דפוס שנלמד רק מההורים","סוג ההיקשרות של התינוק להורה"],e:"בסיס האישיות."},
 {q:"במחקר ניו יורק, איזה אחוז היו ״ילדים נוחים״?",a:"40%",w:["10%","15%","65%"],e:"10% קשים, 15% מתחממים לאט."}]},
q16:{t:"t3",v:[
 {q:"תינוק שאוכל וישן בזמנים לא צפויים, בוכה בעוצמה ומתקשה עם דברים חדשים. מה הוא לפי תומס וצ'ס?",a:"ילד קשה",w:["ילד מתחמם לאט","ילד נוח","ילד חסר ארגון"],e:"שגרה לא סדירה ותגובות עזות."},
 {q:"ילד שקט ואיטי להתחמם נראה בסדר בבית. מתי יתחילו קשיים?",a:"בגן ובבית הספר",w:["כבר בגיל שלושה חודשים","רק בגיל ההתבגרות","לעולם לא יופיעו"],e:"כשמצפים לתגובות מהירות."}]},
q17:{t:"t3",v:[
 {q:"ילד מצליח לחכות לתורו למרות שהוא רוצה מאוד לחטוף. איזה ממד של רוטבארט זה?",a:"בקרה שדורשת מאמץ",w:["רמת פעילות","מצוקה מרוגז","רגשיות חיובית"],e:"דיכוי רצוני של תגובה."},
 {q:"מה ייחודי במודל של רוטבארט לעומת תומס וצ'ס?",a:"הוא מפריד בין מצוקה מפחד למצוקה מרוגז",w:["הוא מחלק את הילדים לשלושה סוגים","הוא מתבסס רק על תצפיות במעבדה","הוא לא כולל שום ממד של ויסות"],e:"וגם בקרה שדורשת מאמץ."}]},
q18:{t:"t3",v:[
 {q:"מה היתרון של דיווחי הורים על המזג?",a:"היכרות עמוקה עם הילד במצבים רבים",w:["הם אובייקטיביים לגמרי ולא מוטים","הם מודדים מדדים גופניים מדויקים","הם לא מושפעים מציפיות ההורים"],e:"אבל עלולים להיות מוטים."},
 {q:"ילדה ביישנית מגיעה למעבדה ובוכה כל הזמן. מה הבעיה בשיטה?",a:"היא לא תסיים את המפגש",w:["אין בעיה בשיטה","המעבדה מודדת רק פעילות","ההורים מתערבים במדידה"],e:"חיסרון של תצפית מעבדה."}]},
q19:{t:"t3",v:[
 {q:"איזה אחוז מבני 4 חודשים מצא קגן שמוטרדים בקלות מחידושים?",a:"כ-20%",w:["כ-5%","כ-50%","כ-70%"],e:"ילדים מעוכבים."},
 {q:"איזה מבנה במוח קשור לתגובה החזקה של ילדים ביישנים לחדש?",a:"האמיגדלה",w:["ההיפוקמפוס","המוח הקטן","קליפת הראייה"],e:"תגובת פחד."}]},
q20:{t:"t3",v:[
 {q:"איזה מדד גופני צפוי אצל ילד ביישן?",a:"קורטיזול גבוה יותר",w:["קצב לב נמוך יותר","אישונים מכווצים","אצבעות חמות"],e:"עוררות גופנית."},
 {q:"איזו הורות מעצימה ביישנות?",a:"קרה, מענישה או מגוננת מדי",w:["חמה ומעודדת בהדרגה","הורות שמציבה אתגרים קטנים","הורות סבלנית ותומכת"],e:"הגנת יתר מונעת התמודדות."}]},
q21:{t:"t4",v:[
 {q:"תינוק פעיל מאוד בגיל 6 חודשים. מה אפשר לומר על המזג שלו בגיל 5?",a:"לא הרבה, היציבות בינקות נמוכה",w:["בוודאות יהיה ילד היפראקטיבי","בוודאות יהיה ילד רגוע","המזג שלו לא ישתנה בכלל"],e:"מתונה רק מגיל הגן."},
 {q:"אחרי שתינוק מתחיל לזחול, מה עשויה להעיד רמת פעילות נמוכה?",a:"פחד",w:["סקרנות","שובבות","עייפות"],e:"משמעות הפעילות משתנה."}]},
q22:{t:"t4",v:[
 {q:"למה ניבוי המזג טוב יותר אחרי גיל 3?",a:"הסגנונות מגובשים, ויש קפיצה בבקרה",w:["כי הילד כבר מדבר במשפטים","כי ההורים מפסיקים להשפיע","כי המוח מפסיק להתפתח בגיל 3"],e:"בקרה שדורשת מאמץ."},
 {q:"מי מרוויחים הכי הרבה מהורים סבלניים ותומכים?",a:"ילדים חששנים, נרגנים או שליליים",w:["ילדים נוחים ושמחים","ילדים פעילים וסקרנים","כל הילדים באותה מידה"],e:"השפעה חזקה על מזג קשה."}]},
q23:{t:"t4",v:[
 {q:"איזה חלק מההבדלים במזג מיוחס לגנים?",a:"כמחצית",w:["כמעט הכל","כעשירית","אף חלק"],e:"מחקרי תאומים."},
 {q:"תינוקות סינים ויפנים רגועים יותר. איך מסבירים זאת?",a:"אולי גנים, וגם פרקטיקות תרבותיות",w:["רק גנים, בלי השפעה של תרבות","רק תרבות, בלי השפעה של גנים","תזונה שונה בלבד, לא גנים או תרבות"],e:"מגע עדין וריסון רגשות."}]},
q24:{t:"t4",v:[
 {q:"באיזה תחום יש לבנות יתרון במזג?",a:"בקרה שדורשת מאמץ",w:["רמת פעילות","רגשיות חיובית","מצוקה מרוגז"],e:"הבדל מגדרי."},
 {q:"אמא מעודדת את בנה לטפס ואת בתה לבקש עזרה. מה זה עושה?",a:"מחזק הבדלי מגדר במזג",w:["מקטין הבדלי מגדר","לא משפיע על המזג","מתאים רק לילד הבכור"],e:"עידוד שונה לפי מגדר."}]},
q25:{t:"t4",v:[
 {q:"ילד עם גרסה קצרה של 5-HTTLPR. מה צפוי לו?",a:"רגישות גבוהה גם לטוב וגם לרע",w:["סיכון גבוה רק בהורות גרועה","חוסן מלא לכל השפעה","רגישות רק להורות טובה"],e:"גמישות."},
 {q:"הורים משווים בין שני ילדיהם. מה נמצא?",a:"הם רואים יותר הבדלים מצופים חיצוניים",w:["הם רואים פחות הבדלים מצופים חיצוניים","הם רואים בדיוק כמו צופים חיצוניים","הם לא רואים הבדלים בין הילדים כלל"],e:"הגזמת הבדלים."}]},
q26:{t:"t4",v:[
 {q:"בני שנה ממשפחות עניות, עם גנוטיפ בסיכון והורות לא רגישה. מה קרה?",a:"יותר כעס, ובהמשך יותר תוקפנות",w:["לא היה הבדל מקבוצת הביקורת","הם נעשו שקטים ומופנמים יותר","הם השתפרו עם הזמן לבד"],e:"גן × סביבה."},
 {q:"מה המשמעות של ״גמישות״ בהקשר של 5-HTTLPR?",a:"רגישות גבוהה לסביבה, לטוב ולרע",w:["יכולת להסתגל לכל מצב בלי נזק","חוסר רגישות להשפעת ההורים","נטייה קבועה לחרדה ודיכאון"],e:"לא רק פגיעות."}]},
q27:{t:"t4",v:[
 {q:"לילד קשה ומתנגד יש הורים רגועים, עקביים ומבינים. מה יחזה מודל טיב ההתאמה?",a:"סיכוי טוב לתפקוד מסתגל",w:["בעיות התנהגות בטוחות","שהמזג ישתנה לגמרי","שההורים יישחקו בהכרח"],e:"התאמה בין סביבה למזג."},
 {q:"איך נוצר מעגל שלילי בין ילד קשה להורים?",a:"משמעת כועסת, התנגדות ויותר כפייה",w:["הורים מוותרים והילד נרגע","ילד מתבודד וההורים מתרחקים","ההורים משבחים והילד מתמרד"],e:"וחוסר עקביות."}]},
q28:{t:"t4",v:[
 {q:"בשנחאי, מה קרה לקשר בין ביישנות להסתגלות בין 1990 ל-2002?",a:"הוא התהפך מחיובי לשלילי",w:["הוא התהפך משלילי לחיובי","הוא נשאר חיובי לאורך כל השנים","הוא נעלם לגמרי ולא חזר"],e:"כמו במערב, עם שינוי ערכים."},
 {q:"באילו תנאים קשה יותר להעניק הורות טובה לילד קשה?",a:"מצוקה כלכלית, נישואים רעים ובעיות נפשיות",w:["כשיש לילד אחים רבים בבית","כשההורים עובדים מהבית","כשהילד הולך לגן פרטי"],e:"עקה משפחתית."}]},
q29:{t:"t5",v:[
 {q:"קופי הארלו נצמדו לאם הבד, אף שאם התיל החזיקה את הבקבוק. מה זה מערער?",a:"שהיקשרות נובעת מהאכלה",w:["שהקופים צריכים מזון","שיש היקשרות בכלל","שמגע לא חשוב"],e:"נחמת מגע."},
 {q:"מה הבעיה בהסברים הפסיכואנליטי והביהביוריסטי להיקשרות?",a:"הם מתעלמים ממאפייני התינוק",w:["הם מתמקדים יותר מדי בתינוק","הם לא מזכירים את האם","הם מבוססים על מחקרי קופים"],e:"מתמקדים בהאכלה."}]},
q30:{t:"t5",v:[
 {q:"פעוט נבהל מרעם ורץ לאבא, ונרגע לידו. מה זה?",a:"היקשרות",w:["חרדת זרים","הירמזות חברתית","מזג נוח"],e:"נחמה בקרבה בעת עקה."},
 {q:"תינוק קשור מאוד לשמיכה שלו. מה זה מראה?",a:"שנקשרים לא רק למי שמאכיל",w:["שההיקשרות לאם לא בטוחה","שיש לו בעיה התפתחותית","שהוא לא קשור לאף אדם"],e:"גם לאב, לאחים ולחפצים."}]},

     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
