<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>
<style>:root{--accent:#2b8546}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#6dcf8e}}:root[data-theme="dark"]{--accent:#6dcf8e}</style>

 {id:"t1",icon:"people",title:"המשפחה כמערכת",blocks:[
  {h:"הסביבה: מערך רב־שכבתי",html:`<p>הסביבה מורכבת לא פחות מהתורשה: <b>שכבות של השפעות</b> שמשתלבות זו בזו, ויכולות לקדם רווחה גופנית ונפשית או לפגוע בה.</p><p>כשסטודנטים מתבקשים לרשום מה השפיע עליהם, הם מציינים בעיקר את <b>המשפחה</b> (ההקשר הראשון והממושך ביותר), ואחריה חברים, שכנים, בית ספר וארגונים קהילתיים ודתיים.</p>${fig("layers","ההקשרים שבהם עוסק הפרק, לפי תיאוריית המערכות האקולוגיות של ברונפנברנר")}${def("ההקשר שכמעט לא שמים לב אליו",`<mark>מערכת המאקרו</mark>: האקלים החברתי הרחב, כלומר <b>הערכים והתוכניות</b> שתומכים בהתפתחות הילדים ומגינים עליה. כל משפחה צריכה עזרה: דיור ובריאות בני־השגה, שכונות בטוחות, בתי ספר טובים, מתקני פנאי ושירותים שמאפשרים להורים לעמוד גם בעבודה וגם במשפחה.`)}${rem("המסר של הפרק: הסביבה, כמו התורשה, יכולה <b>לקדם</b> את ההתפתחות או <b>לסכן</b> אותה.")}`,q:"q1"},
  {h:"השפעות ישירות ודו־כיווניות",html:`<p>אין הקשר במערכת המיקרו שמשתווה למשפחה בעוצמה ובהיקף. היא מפגישה את הילד עם העולם הפיזי, יוצרת קשרים ייחודיים (ההיקשרות להורים ולאחים נמשכת לרוב כל החיים ומשמשת <b>מודל</b> ליחסים אחרים), ובה לומדים שפה, מיומנויות וערכים. בכל התרבויות, קשרי משפחה חמים מנבאים בריאות גופנית ונפשית, ובידוד או ניכור מההורים קשורים לבעיות.</p>${def("המשפחה כמערכת",`חוקרים רואים במשפחה <b>רשת של יחסים עם תלות הדדית</b>. יש <mark>השפעות דו־כיווניות</mark>: ההתנהגות של כל אחד משפיעה על האחרים, באופן ישיר ובאופן עקיף.`)}${fig("famsys")}${ex("במרכול: <b>דני, בן 4</b>, מבקש מסטיק. אימו מסרבת בחום, מסבירה שהכסף נחוץ לדגנים שבחרו, ונותנת לו להחזיק אותם. <b>מג, בת 3</b>, מפרקת בננות ומושיטה יד לשוקולד. אימה צועקת, חוטפת וסוטרת על ידה, ומג מתחילה ליילל.")}<p>המחקר מראה: הורים <b>חמים אך תקיפים</b> → הילד נענה → ההורה ממשיך בחום. הורים <b>נוקשים וחסרי סבלנות</b> → הילד מסרב ומתמרד → ההורה מגביר ענישה → הילד פרוע עוד יותר. כל צד משמר את הדפוס של האחר.</p>`,q:"q3"},

  {h:"הסתגלות לשינוי",html:`<p>זו <b>מערכת הכרונו</b>: הכוחות במשפחה משתנים כל הזמן, כי כל אחד מסתגל להתפתחות של האחרים.</p>${ex("בחודשים הראשונים ההורים עסוקים בהאכלה, חיתולים, רחצה וחיבוקים. בן שנה כבר מצביע, קורא לחפצים בשמם ומחטט בארונות, וההורים עוברים ל<b>פחות טיפול פיזי ויותר דיבור, משחק ומשמעת</b>. זה בתורו מקדם את המיומנויות שלו.")}<p>גם <b>התפתחות ההורים</b> משפיעה. העימותים בתחילת ההתבגרות לא נובעים רק מהחתירה של המתבגר לעצמאות: ההורים מגיעים לגיל העמידה ובוחנים מחדש את מחויבויותיהם. המתבגר דוחף ל<b>אוטונומיה</b>, ההורה דוחף ל<b>קרבה</b>, והחיכוך נפתר בהדרגה. אין יחידה חברתית אחרת שנדרשת להסתגל לשינויים כה גדולים.</p>${rem("גם רוח התקופה: פחות ילודה, יותר גירושים, יותר תפקידים לנשים, קבלה רבה יותר של הומוסקסואליות והורות מאוחרת יותר הביאו למשפחות <b>קטנות ומגוונות</b> יותר: הורים יחידים, נשואים בשנית, הורים הומואים ולסביות, ושני הורים עובדים.")}`,q:"q7"},
  {h:"מהו מעמד סוציו־אקונומי",html:`${def("מושג מפתח",`<mark>מעמד סוציו־אקונומי</mark> ${E("SES, Socioeconomic status")}: מדד שמשלב שלושה משתנים קשורים אך לא חופפים: <b>שנות השכלה</b>, <b>יוקרת העיסוק ורמת המיומנות</b> שהוא דורש (יחד: מעמד חברתי), ו<b>הכנסה</b> (מעמד כלכלי).`)}${fig("ses")}<p><b>עיתוי וגודל משפחה:</b> אנשים בעבודות כפיים מקצועיות וחצי־מקצועיות (פועלי בניין, נהגי משאיות, שומרים) מתחתנים ומביאים ילדים מוקדם יותר, ויותר ילדים, מאשר אנשים בעיסוקים מקצועיים וטכניים.</p>${tiles([["check","SES נמוך","מאפיינים חיצוניים: צייתנות, נימוס, סדר וניקיון"],["brain","SES גבוה יותר","תכונות פסיכולוגיות: סקרנות, שמחת חיים, הכוונה עצמית, בגרות קוגניטיבית וחברתית"]])}`,q:"q9"},
  {h:"SES בתוך הבית",html:`<p><b>במעמד גבוה יותר</b> ההורים מדברים יותר עם תינוקות וילדי גן, קוראים להם יותר ונותנים יותר חופש לחקור. עם ילדים גדולים ומתבגרים הם מפגינים יותר חום, מסבירים ומשבחים מילולית, מציבים יעדים גבוהים יותר ונותנים לילד להחליט יותר. <b>בבתים ממעמד נמוך</b> נפוצים יותר פקודות ("כי אמרתי לך"), ביקורת וענישה גופנית.</p>${def("למה",`<b>השכלה</b> היא גורם מרכזי: שנים של לימוד מלמדות לחשוב ברעיונות מופשטים, ומכאן ההשקעה בהתפתחות הקוגניטיבית והחברתית של הילד. בנוסף, הורים ממעמד נמוך חווים <b>חוסר אונים</b> מחוץ לבית (בעבודה הם נשמעים לכללים של אחרים) ומשחזרים את זה בבית, הפעם כבעלי הסמכות. <b>עקה</b> גבוהה תורמת למשמעת כופה. להורים ממעמד גבוה יותר יש יותר שליטה בחייהם, והם מקנים לילדים מיומנויות של החלטה עצמאית ושכנוע.`)}${rem("כבר <b>מהשנה השנייה</b>, SES גבוה יותר קשור להתפתחות קוגניטיבית ושפתית טובה יותר ולפחות בעיות התנהגות, ואחר כך להצלחה בבית הספר ולהשכלה גבוהה יותר.")}`,q:"q11"}
 ]},
 {id:"t3",icon:"grad",title:"השכלה של בנות ברחבי תבל",blocks:[
  {h:"מלאלה והמספרים",html:`${who("מ","מלאלה יוספזאי","פקיסטאן","ב־2009, בגיל 11, כתבה בשם בדוי בלוג לבי־בי־סי על החיים תחת הטליבאן, שאסרו לעתים על בנות ללמוד. באוקטובר 2012 צלף מהטליבאן עלה על אוטובוס התלמידים ופצע אותה אנושות. היא החלימה בטיפול באנגליה.")}<p>בעקבות זאת: עצומה של האו״ם, "אני מלאלה", שדרשה שכל הילדים יירשמו לבית ספר עד סוף 2015, ו<b>חוק חינוך החובה הראשון בפקיסטאן</b> (2012), שהבטיח חינוך חינם לגילים 5 עד 16. ב־2014 קיבלה מלאלה את פרס נובל לשלום.</p>${rem("עדיין כ־<b>57 מיליון</b> ילדים בגיל בית ספר יסודי וכ־<b>71 מיליון</b> בגיל חטיבת הביניים לא לומדים, ורובם בנות מבתים עניים. כמעט <b>שני שלישים</b> מ־775 מיליון המבוגרים שאינם יודעים קרוא וכתוב הם נשים.")}`,q:"q13"},
  {h:"מחקר ארבע המדינות",html:`<p>במקסיקו, נפאל, ונצואלה וזמביה בדקו איך השפה והאוריינות של האם משפיעות על בריאות המשפחה, על האינטראקציה עם הילד ועל האוריינות של הילדים. ממוצע הלימוד של האימהות: מ־5 שנים (נפאל) עד 8 (זמביה). הממצאים היו <b>זהים</b> בכל המדינות, בכפר ובעיר.</p>${tiles([["doc","בריאות","הבנה טובה יותר של מסרי בריאות ברדיו ובטלוויזיה, הסבר טוב יותר לאנשי מקצוע. רפואה מונעת: ביקורים לפני לידה, חיסונים, תזונה. תכנון משפחה: דחיית נישואים, פחות ילדים ובמרווחים"],["people","אינטראקציה","יותר תגובות מילוליות לקולות של התינוק, ובהמשך אוצר מילים גדול יותר לילדים"],["grad","אוריינות (נפאל)","בלי קשר להכנסה ולהשכלת האב: יותר הקניית כישורים, חומרי קריאה בבית, דוגמה אישית וציפיות גבוהות"]])}${def("המנגנון",`הכישורים המילוליים והקוגניטיביים ש<b>האוריינות</b> משפרת הם שהסבירו את הקשר. גם מעט שנות לימוד בבתי ספר חלשים שינו את התנהגות האם.`)}${rem("לפי האו״ם, השכלת בנות היא האמצעי היעיל נגד עוני, תמותת אימהות וילדים, מחלות ואי־שוויון. מחסומים: אמונות על תפקידי מגדר, הצורך בעזרת הבת בבית, ובעיקר <b>שכר לימוד</b> (לעתים שליש מהכנסת משפחה ענייה), ואז שולחים רק בנים. כשמבטלים את שכר הלימוד, מסבירים את התועלת ויוצרים עבודה לנשים, רוב ההורים שולחים את הבנות.")}`,q:"q15"}
 ]},
 {id:"t4",icon:"chart",title:"אמידות ועוני",blocks:[
  {h:"אמידות",html:`<p>למרות השכלה וכסף, הורים אמידים לא תמיד מקיימים הורות שמקדמת התפתחות. במחקרים של לותר על צעירים מפרברים עשירים, כבר ב<b>כיתה ז</b> עד <b>10%</b> סבלו מבעיות חמורות שהחריפו בתיכון: ציונים נמוכים, יותר אלכוהול וסמים מבני נוער ממעמד נמוך, הסתבכות עם החוק, וחרדה ודיכאון.</p>${def("רמז חשוב",`רק אצל האמידים (ולא במעמד הנמוך) השימוש בחומרים היה <b>במתאם עם חרדה ודיכאון</b>. כלומר נראה שהם לקחו סמים כדי להקל על הסבל, נוהג שמנבא שימוש קבוע.`)}<p><b>למה?</b> פחות קרבה רגשית, פחות השגחה ופחות תוצאות להתנהגות שלילית. הורים אמידים עסוקים בקריירה ובחיי חברה, ו<b>לא נגישים כמעט כמו הורים עניים</b>. הם גם דורשים הישגים מוגזמים ומבקרים כשהילד לא מושלם. מתבגרים שהוריהם מעריכים הישגים יותר מאופי סובלים יותר.</p>${fig("dinner","ארוחת ערב עם ההורים לעתים קרובות קשורה לפחות בעיות (תרשים 2.7)")}${rem("ארוחת ערב עם ההורים מגינה גם על אמידים וגם על בני מעמד נמוך, אפילו כשמחזיקים קבועים היבטים אחרים של ההורות. גם חיבה, קבלה ופיקוח מנבאים הסתגלות טובה.")}`,q:"q17"},
  {h:"עוני: ההיקף",html:`${ex("<b>קיילי, בת 10</b> (סרט של PBS): \"אנחנו לא מקבלים שלוש ארוחות ביום\". היא גרה עם אחיה טיילר ועם אמה, שסובלת מדיכאון ומחרדה ולא עובדת. כשנגמר הכסף עברו לחדר במלונית ומסרו את הכלב. אין לה חברים, מקום לשחק, ספרים או חוגים, ואת עתידה היא רואה \"ברחוב, בארגז קרטון\".")}${tiles([["pie","כ־15%","מהאמריקנים עניים (46 מיליון). הכי פגיעים: הורים צעירים (25 ומטה) לילדים קטנים, ומבוגרים שגרים לבד"],["people","22% מהילדים","כ־14.5 מיליון, מתחת לקו העוני הפדרלי (כ־23,500 דולר לשנה למשפחה של ארבע נפשות)"],["chart","לפי קבוצה","ילדים היספנים 32%, ממוצא אמריקני־ילידי 34%, ממוצא אפריקני 38%. אימהות לבד עם ילדי גן: קרוב ל־50%"]])}<p><b>סיבות:</b> אבטלה, גירושים, הורות בגיל ההתבגרות ומחסור בתוכניות ממשלתיות. בארה״ב שיעור העוני של ילדים הוא הגבוה בכל מדינות המערב, וכמעט <b>10%</b> חיים ב<b>עוני מרוד</b> (פחות מחצי מקו העוני). ברוב מדינות צפון ומרכז אירופה עוני הילדים מתחת ל־10% כבר עשרות שנים.</p>${fig("povrank","עוני ילדים ב־20 מדינות מפותחות (תרשים 2.8): ארה\"ב אחרונה")}${rem("הערה לגבי ישראל: 18% מהתושבים עניים. בקרב ילדים 23.8%, לעומת ממוצע OECD של 13.5%, ורק בטורקיה יותר (נתוני ביטוח לאומי, 2017).")}`,q:"q19"},
  {h:"מה העוני עושה",html:`${rem("ככל שהעוני <b>מוקדם, עמוק וממושך</b> יותר, הנזק גדול יותר: בריאות לקויה לכל החיים, פערים קבועים בקוגניציה ובהישגים, נשירה, מחלות נפש, אימפולסיביות, תוקפנות והתנהגות אנטי־חברתית.")}<p><b>גורמי העקה</b> מחלישים בהדרגה את המשפחה: מכונית מתקלקלת, קצבה אובדת, ניתוק חשמל או מים חמים, מזון לא בטוח. במשבר בני המשפחה נעשים מדוכאים, רגזנים ומוסחים, יש יותר אינטראקציות עוינות, וההתפתחות נפגעת. זה חמור במיוחד אצל <b>הורה יחיד</b>, ובדיור ירוד ובשכונות מסוכנות שמפחיתים את התמיכה החברתית.</p>${def("היעדר דיור",`בארה״ב <b>2.5 עד 3.5 מיליון</b> איש בשנה. רובם מבוגרים לבד, רבים עם מחלת נפש קשה, אבל כ־<b>40%</b> הם ילדים ובני נוער. שתי סיבות: פחות דיור בר־השגה בתמיכת המדינה ויותר עוני. רוב המשפחות הן אימהות לילדים מתחת לגיל 5. לילדים: עיכובים התפתחותיים ומצוקה רגשית. 25% עד 30% מהם בגיל בית ספר לא לומדים, ומי שלומד מצליח פחות מילדים עניים אחרים (היעדרויות, מעברים בין מקלטים, בעיות בריאות ורגש).`)}`,q:"q21"},
  {h:"התערבויות נגד השפעות העוני",html:`<p>למרות הפערים, <b>ילדים רבים ממשפחות עניות מסתדרים יפה</b> (גורמי החוסן מפרק 1).</p>${ex("משפחות עניות עם ילדים מגיל הגן עד ההתבגרות חולקו <b>באקראי</b> לקבוצת התערבות או ביקורת. ההתערבות: <b>14 שעות</b> הכשרה להורים בהתמודדות עם עקה, פתרון בעיות יום־יומיות, תקשורת חיובית והורות חיובית. התוצאות: ניהול עקה טוב יותר, פחות לחץ כלכלי, יחסים חמים יותר, פחות דיכאון אצל ההורים, ופחות הפנמה והחצנה אצל הילדים, וזה נשמר גם <b>18 חודשים</b> אחרי.")}${rem("יש התערבויות שמכוונות להורות ויש שמכוונות ישירות לכישורי הילדים. כי ילדים עניים חווים מצוקות רבות, יותר תוכניות הן <b>רבות־ממדים</b>: מטפלות בו זמנית במשפחה, בהורות ובילד.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"building",title:"מעבר למשפחה: שכונות ובתי ספר",blocks:[
  {h:"שכונות",html:`<p>אלה מערכות <b>אקסו ומזו</b>: הקשרים בין המשפחה לקהילה. בשכונות עניות הסדר מופר: מעברי דירה, גנים הרוסים, אין מרכזים קהילתיים. נפוצות אלימות במשפחה, התעללות והזנחה, ובעיות התנהגות ועבריינות. בכפר העני (כמו אצל קיילי) בולטים <b>בידוד</b> ומחסור בשירותים. מנגד, קשרים הדוקים עם חברים, קרובים, פעילויות לנוער ובית תפילה מפחיתים עקה.</p>${ex("משפחות ממעמד נמוך קיבלו <b>באקראי</b> שוברים למעבר מדיור ציבורי לשכונות אמידות יותר. הילדים שעברו לשכונה עם פחות עוני היו <b>בריאים יותר גופנית ונפשית</b> והצליחו יותר בבית הספר.")}${def("למי זה חשוב יותר",`משאבי השכונה משפיעים יותר על <b>צעירים במצוקה כלכלית</b>. משפחות אמידות יכולות להסיע לחוגים ולבתי ספר רחוקים. בשכונות עניות, תוכניות אחרי בית הספר (אמנות, מוזיקה, ספורט, תנועות נוער) עם מבוגרים מיטיבים קשורות להישגים טובים יותר ופחות בעיות, וארגונים שכונתיים מקדמים ביטחון עצמי, הישגים ושאיפות.`)}${rem("אבל בשכונות מסוכנות יש מעט פעילויות, והגעה אליהן קשה. הורים לחוצים מדרבנים פחות. במחקר גדול, הילדים מהבתים הכי פחות מדרבנים ומהשכונות הכי כאוטיות השתתפו הכי פחות: <b>הנזקקים ביותר החמיצו הכי הרבה</b>.")}`,q:"q25"},
  {h:"תמיכה חברתית מהקהילה",html:`<p>קשרי משפחה ושכונה מפחיתים את העקה של ההורות בעיקר דרך <b>תמיכה חברתית</b>, בארבע דרכים:</p>${tiles([["id","ערך עצמי של ההורים","שכנים וקרובים שמקשיבים ועוזרים, וההורים מגיבים לילד ברגישות"],["link","מידע ושירותים","עצות על עבודה, דיור, טיפול בילדים ופעילויות במחיר סביר"],["scales","בקרה ומודלים","עידוד ודוגמה לשיטות חינוך יעילות, והרחקה משיטות לא יעילות"],["hand","עזרה ישירה","מבוגרים נוספים שמשפיעים בחום, ממתנים הורות לא יעילה ומתערבים כשנער מבריז"]])}${def("״התחלות טובות יותר, עתיד טוב יותר״",`${E("Better Beginnings, Better Futures")}: מערך תוכניות קהילתיות במימון ממשלתי באונטריו שבקנדה, למניעת כישלון ועבריינות. המוצלחת ביותר התבססה על <b>בית ספר יסודי</b>: העשרה בכיתה ובקיץ, ביקורי בית סדירים אצל ההורים, מידע על משאבים ועידוד מעורבות. בהערכות בכיתות ג, ו ו־ט: תפקוד משפחה, הורות, הישגים והסתגלות חברתית טובים יותר, ופחות בעיות רגש והתנהגות, בהשוואה לשכונות עניות בלי התוכנית.`)}`,q:"q27"},
  {h:"בתי ספר",html:`<p>בניגוד למשפחה ולשכונה, בית הספר הוא <b>מוסד פורמלי</b> שנועד להעביר ידע וכישורים. בארה״ב: כ־6 שעות ביום, 5 ימים בשבוע, 36 שבועות בשנה, בסך הכול כ־<b>14,000 שעות</b> עד סוף התיכון, ועוד יותר כשמתחילים בגן "בסגנון בית ספר".</p>${tiles([["building","סביבה פיזית","גודל בית הספר, מספר ילדים בכיתה, מרחב ללמידה ולמשחק"],["bulb","תפיסה חינוכית","לומדים פסיביים, לומדים פעילים וסקרנים, או שותפים בהנחיית מומחים"],["people","חיי חברה","שיתוף או תחרות, לימוד משותף של רקעים שונים, בטיחות או אלימות"]])}${def("קשר הורים ובית ספר",`מעורבות של הורים (פעילויות, אסיפות) קשורה ל<b>הישגים טובים יותר</b>. הורים ממעמד גבוה, שהרקע שלהם דומה לזה של המורים, מתקשרים ומבקרים יותר. הורים ממעמד נמוך וממיעוטים לא מרגישים בנוח והעקה מתישה אותם, ולכן על בית הספר <b>להשקיע מאמץ מיוחד</b> בהם.`)}${rem("בבתי ספר שבהם הורים רבים מעורבים מאוד ההישגים טובים במיוחד. כשחינוך טוב הוא מאמץ משותף של מורים, מנהלנים והקהילה, ההשפעה חזקה יותר ומגיעה ליותר תלמידים.")}`,q:"q29"}
 ]},
 {id:"t6",icon:"link",title:"ההקשר התרבותי",blocks:[
  {h:"ערכים ומנהגים של התרבות",html:`<p>זו <b>מערכת המאקרו</b>. התרבות מעצבת את המשפחה, בית הספר והקהילה, אבל רבים לא מודעים למורשת שלהם עד שהם רואים מנהגים של תרבות אחרת.</p>${ex("\"מי אחראי לגדל ילדים קטנים?\" סטודנטים אמריקנים עונים: \"מי שמחליט להביא תינוק צריך להיות מוכן לטפל בו\", \"אנשים לא אוהבים שמתערבים להם במשפחה\".")}${def("ההשקפה האמריקנית",`הטיפול בילדים, החינוך והתשלום עליהם הם אחריות <b>של ההורים בלבד</b>. לכך היסטוריה ארוכה של <b>עצמאות, אי־תלות ופרטיות</b> כערכים מרכזיים. זו אחת הסיבות שהציבור לא מיהר לתמוך בהטבות ממשלתיות לכל המשפחות (טיפול איכותי בילדים, חופשה בתשלום), ושילדים רבים עניים אף שהוריהם עובדים.`)}`,q:"q31"},
  {h:"תרבויות משנה והמשפחה המורחבת",html:`${def("תרבות משנה",`<mark>תרבות משנה</mark> ${E("Subculture")}: קבוצה שחולקת את רוב הערכים של התרבות הכללית אבל יש לה אמונות, מנהגים וסמלים משלה (לפי גיל, מגדר, מוצא, דת ועוד). העורכות מעדיפות את המונח על "תת־תרבות", שעלול לרמוז על נחיתות.`)}${def("משק בית של משפחה מורחבת",`<mark>משק בית ובו משפחה מורחבת</mark> ${E("Extended-family household")}: הורה וילד גרים יחד עם קרוב משפחה מבוגר אחד או יותר. אצל משפחות ממוצא אפריקני זו מסורת מרכזית ששורשיה באפריקה (זוגות צעירים גרים עם המשפחה הגדולה), הגיעה בתקופת העבדות ומאז <b>מגינה מפני עוני וגזענות</b>.`)}${tiles([["people","תמיכה","חלוקת משאבים ועזרה בגידול. אימהות מתבגרות עם קשר חם למשפחה המורחבת מסיימות תיכון ועובדות יותר"],["check","הורות יעילה","אצל אימהות יחידניות: אינטראקציה חיובית יותר, והילדים מצליחים יותר בלימודים ובחברה ופחות אנטי־חברתיים"],["grad","הנחלת התרבות","יותר שיתוף פעולה וערכים מוסריים ודתיים. סבים מעבירים את המורשת, ומפגשים משפחתיים מחברים לשורשים"]])}<p>משפחות מורחבות מעורבות מאפיינות גם תרבויות משנה <b>אסיאתיות, אמריקניות־ילידיות והיספניות</b>: הסבים מדריכים את הצעירים, המבוגרים מקבלים תמיכה, ויש השקעה רבה בילדים ובקשישים. במשפחות היספניות הסבים שותפים לגידול <b>אפילו יותר</b> מאשר במשפחות אפריקניות־אמריקניות.</p>${def("פמיליזם",`<mark>פמיליזם</mark> ${E("Familism")}: האידיאל ההיספני שמציב במרכז קשרי משפחה הדוקים והרמוניים, מגע תכוף ומענה לצורכי המשפחה. ההורות הבין־דורית מתאימה לו, ולכן כולם נשכרים.`)}`,q:"q33"},
  {h:"קולקטיביזם ואינדיווידואליזם",html:`${tiles([["people","קולקטיביזם","מטרות הקבוצה לפני האישיות. תלות הדדית: הרמוניה חברתית, מחויבות ואחריות לזולת, שיתוף פעולה"],["target","אינדיווידואליזם","עיסוק בצרכים האישיים: חקירה, תגליות, הישגים ובחירה אישית ביחסים"]])}${def("הסתייגות",`זו ההבחנה הנפוצה ביותר בהשוואה בין תרבויות, אבל היא <b>שנויה במחלוקת</b>: שתי קבוצות הערכים קיימות ברוב התרבויות, והערכים מורכבים ושונים בעוד היבטים רבים.`)}${rem("ובכל זאת, יש הבדלים עקביים בין מדינות: <b>ארה\"ב אינדיווידואליסטית יותר</b> מרוב מדינות מערב אירופה, שנוטות לקולקטיביזם. לזה השפעה גדולה על הדרך שבה מדינה מגינה על ילדים ומשפחות.")}`,q:"q35"}
 ]},
 {id:"t7",icon:"scales",title:"מדיניות ציבורית והתפתחות הילד",blocks:[
  {h:"מהי מדיניות ציבורית",html:`${def("מושג מפתח",`<mark>מדיניות ציבורית</mark> ${E("Public policy")}: חוקים ותוכניות ממשלתיות שנועדו לשפר תנאים קיימים. למשל, כשעוני ומחוסרי בית מתרבים: דיור מוזל, סיוע במשכנתא, העלאת שכר המינימום והקצבאות. כשילדים נכשלים בלימודים: יותר כסף לבתי ספר והכשרת מורים טובה יותר.`)}<p>בארה״ב המדיניות לטובת ילדים <b>בפיגור</b> לעומת מדינות מפותחות אחרות (טבלה 2.5, מקום 1 = הטוב ביותר):</p>${policyTable}${rem("חוק <b>הטיפול בר־ההשגה</b> (2010) הרחיב ביטוח בריאות לכל הילדים ממשפחות מעוטות הכנסה, אבל ההרחבה למבוגרים הושארה למדינות, ו־19 סירבו (14 לפי נתוני 2019). הורים לא מבוטחים לא יודעים לרשום את ילדיהם, ולכן כ־11% מהילדים הזכאים (יותר מ־5 מיליון) לא מכוסים. גם הטיפול בילדים: מעט מסגרות בנות־השגה, ורבות לא עומדות בתקן.")}<p>עוד: אכיפה רופפת של מזונות מחמירה עוני אצל אימהות גרושות, צעירים שלא הולכים למכללה יוצאים בלי הכשרה מקצועית, ו־8% מבני 16 עד 24 נשרו מהתיכון בלי תעודה.</p>`,q:"q37"},
  {h:"למה זה קשה",html:`${tiles([["lock","ערכי התרבות","אי־תלות ופרטיות גורמים לממשלה להסס להתערב במשפחה"],["pie","עלות","תוכניות טובות יקרות ומתחרות על משאבי המדינה"],["x","אין לילדים קול","הם לא מצביעים ולא יכולים להגן על האינטרסים שלהם, ותלויים ברצון הטוב של אחרים"]])}${ex("מדיניות הרווחה בארה״ב, שמחזירה מקבלי קצבאות לעבודה (הפחתה או הפסקה אחרי 24 חודשים), עוזרת כשהיא <b>מחלצת מעוני</b>: פחות עקה לאם, הורות טובה יותר, שיפור קוגניטיבי ופחות בעיות התנהגות. אבל כשהעבודה היא בשכר נמוך מאוד שמנציח את העוני, ההורות נעשית מחמירה וכופה וההסתגלות של הילדים גרועה.")}${rem("בלי אנשים שנלחמים על זכויות הילדים, מדיניות שנועדה לפתור בעיה חברתית עלולה להשאיר אותם במצוקה או אפילו להרע את מצבם.")}`,q:"q39"},
  {h:"מבט אל העתיד",html:`<p>שני נימוקים למדיניות שמקדמת ילדים: <b>ילדים הם העתיד</b> (ההורים, העובדים והאזרחים של מחר) והנימוק <b>ההומניטרי</b> (אלה זכויות האדם הבסיסיות שלהם).</p>${def("האמנה בדבר זכויות הילד",`${E("Convention on the Rights of the Child")}: ניסחה עצרת האו״ם ב־<b>1989</b>, הסכם מחייב בין מדינות. בין הזכויות: בריאות ברמה הגבוהה האפשרית, רמת חיים נאותה, חינוך חינם וחובה, חיי משפחה עם הבנה ואהבה, הגנה מהתעללות והזנחה, וחופש מחשבה, מצפון ודת. לפי הספר, ארה״ב היא אחת משתי המדינות היחידות שלא אשררו אותה (השנייה סומליה). המתנגדים טוענים שהיא תעביר את נטל הגידול מהמשפחה למדינה. <b>ישראל אשררה ב־1991</b>.`)}${tiles([["hand","הקרן להגנה על ילדים","Children's Defense Fund, הקימה מריאן רייט אדלמן ב־1973: מחקר, חינוך ציבורי, פעולה משפטית, הצעות חוק, עדויות ודוחות"],["data","המרכז הלאומי לילדים בעוני","NCCP: מעביר ממצאי מחקר למעצבי מדיניות"],["id","בישראל","המועצה הלאומית לשלום הילד, מ־1980: משפט, מחקר, הדרכה ונציב פניות ציבור"]])}${rem("גם <b>חוקרים</b> עובדים יותר עם סוכנויות בקהילה ובממשלה, ומפיצים ממצאים בדוחות, באתרים ובתקשורת. כך הם יוצרים <b>תחושת בהילות</b> שמדרבנת את החברה לפעול.")}`,q:"q41"}
 ]}
];
const Q={
q1:{t:"t1",v:[
 {q:"איזה הקשר סביבתי סטודנטים כמעט לא מזכירים כשהם מתארים מה השפיע עליהם?",a:"מערכת המאקרו: הערכים והתוכניות של החברה",w:["המשפחה","החברים","בית הספר"],e:"השפעתה נרחבת כל כך שכמעט לא חושבים עליה."},
 {q:"מהי מערכת המאקרו לפי הפרק?",a:"האקלים החברתי הרחב: ערכים ותוכניות שתומכים בהתפתחות הילדים ומגינים עליה",w:["הקשר בין הבית לבית הספר","המשפחה הגרעינית","מקום העבודה של ההורים בלבד"],e:"למשל דיור ובריאות בני־השגה, שכונות בטוחות ובתי ספר טובים."}]},
q2:{t:"t1",v:[
 {q:"מה המסר הכללי של הפרק על הסביבה?",a:"הסביבה, כמו התורשה, יכולה לקדם את ההתפתחות או לסכן אותה",w:["הסביבה חשובה רק בינקות","התורשה תמיד חזקה יותר מהסביבה","הסביבה משפיעה רק על התפתחות גופנית"],e:"ולכן הפרקים הבאים חוזרים להקשרים האלה בכל גיל."},
 {q:"למה המשפחה מופיעה ראשונה ברשימות של הסטודנטים?",a:"כי היא ההקשר הראשון והממושך ביותר של ההתפתחות",w:["כי אין להם חברים","כי בית הספר לא משפיע","כי כך ביקשו מהם"],e:"אחריה מופיעים חברים, שכנים, בית ספר וארגונים קהילתיים ודתיים."}]},
q3:{t:"t1",v:[
 {q:"מה מתאר המונח \"השפעות דו־כיווניות\" במשפחה?",a:"ההתנהגות של כל בן משפחה משפיעה על האחרים, ולהפך",w:["רק ההורים משפיעים על הילדים","רק הילדים משפיעים על ההורים","השפעה של שני ההורים יחד על הילד"],e:"המשפחה היא רשת יחסים עם תלות הדדית."},
 {q:"מה קרה בדוגמה של מג (בת 3) במרכול, ומה היא ממחישה?",a:"האם צעקה וסטרה, מג התחילה ליילל: דפוס נוקשה שמשמר התנהגות פרועה",w:["האם הסבירה בחום ומג נרגעה","מג קיבלה את השוקולד","האב התערב"],e:"נוקשות מובילה לסירוב, ואז ההורה מגביר ענישה."}]},
q4:{t:"t1",v:[
 {q:"מה נמצא במחקרים כשההורים חמים אך תקיפים?",a:"הילדים נוטים להיענות, וההורים ממשיכים לנהוג בחום",w:["הילדים מתמרדים","אין קשר להתנהגות הילדים","ההורים מגבירים ענישה"],e:"כמו אצל דני ואמו במרכול."},
 {q:"מה קורה לפי המחקר כשההורים נוקשים וחסרי סבלנות?",a:"הילדים מסרבים ומתמרדים, ההורים מגבירים ענישה, והילדים פרועים עוד יותר",w:["הילדים נענים מהר יותר","ההורים מתרככים מיד","אין השפעה לטווח ארוך"],e:"כל צד משמר את הדפוס של האחר."}]},
q5:{t:"t1",v:[
 {q:"מהי \"הורות משותפת\" (coparenting)?",a:"מצב שבו כל הורה תומך בהתנהגויות ההוריות של האחר",w:["שני הורים שגרים בבתים נפרדים","הורה ומטפלת שמחלקים את הזמן","גידול ילד על ידי סבים"],e:"היא קשורה לזוגיות חמה ותורמת לה בחזרה."},
 {q:"איך זוגיות עוינת משפיעה על ההורות, לפי הפרק?",a:"ההורים מפריעים זה לזה, נענים פחות לילד ומבקרים ומענישים יותר",w:["אין לה השפעה על הילד","ההורים משקיעים יותר בילד כפיצוי","הילד תמיד מתחזק ממנה"],e:"זו השפעה עקיפה, של צד שלישי."}]},
q6:{t:"t1",v:[
 {q:"איך מגיבים בעיקר בנות ובנים לסכסוך כרוני ולא פתור בין ההורים?",a:"בנות בעיקר בהפנמה (דאגה ופחד), בנים בעיקר בהחצנה (כעס ותוקפנות)",w:["בנות בהחצנה, בנים בהפנמה","שני המינים לא מושפעים","שניהם רק בהישגים לימודיים"],e:"הפגיעה עוברת דרך ערעור הביטחון הרגשי."},
 {q:"איך סבים וסבתות יכולים להשפיע בעקיפין על התפתחות הנכדים?",a:"בעצות להורים, במודל לגידול ילדים ובעזרה כספית",w:["רק בחום ישיר כלפי הילד","הם לא יכולים להשפיע בעקיפין","רק בכך שהם גרים רחוק"],e:"אבל סכסוך בינם לבין ההורים עלול לפגוע בתקשורת עם הילדים."}]},
q7:{t:"t2",v:[
 {q:"איך משתנה התנהגות ההורים כשהתינוק מגיע לגיל שנה?",a:"פחות טיפול פיזי, ויותר דיבור, משחק ומשמעת",w:["יותר האכלה וחיתולים","פחות זמן בכלל עם הילד","אין שינוי"],e:"וזה בתורו מקדם את המיומנויות של הילד. זו מערכת הכרונו."},
 {q:"לפי הפרק, למה רבים העימותים בתחילת ההתבגרות?",a:"המתבגר דוחף לאוטונומיה, וההורים בגיל העמידה דוחפים לקרבה",w:["רק בגלל הורמונים","כי ההורים מאבדים עניין בילד","כי המתבגר רוצה יותר קרבה"],e:"ההורים בוחנים מחדש את מחויבויותיהם כי הילד יעזוב בקרוב."}]},
q8:{t:"t2",v:[
 {q:"אילו שינויים חברתיים הפכו את המשפחות לקטנות ומגוונות יותר?",a:"פחות ילודה, יותר גירושים, יותר תפקידים לנשים, קבלת הומוסקסואליות והורות מאוחרת",w:["עלייה בשיעור הילודה","ירידה בגירושים","מעבר לחיים בכפר"],e:"והתוצאה: הורים יחידים, נשואים בשנית, הורים הומואים ולסביות ושני הורים עובדים."},
 {q:"מה מיוחד במשפחה בהשוואה ליחידות חברתיות אחרות, לפי הפרק?",a:"שום יחידה אחרת לא נדרשת להסתגל לשינויים כה גדולים בתוכה",w:["היא לא משתנה לאורך החיים","היא תמיד יציבה","היא מושפעת רק מהמאקרו"],e:"הכוחות בה דינמיים ומשתנים כל הזמן."}]},
q9:{t:"t2",v:[
 {q:"מהם שלושת הרכיבים של מעמד סוציו־אקונומי?",a:"שנות השכלה, יוקרת העיסוק ורמת המיומנות שלו, והכנסה",w:["גיל, מגדר ומוצא","מספר ילדים, דיור ושכונה","השכלה, דת ומקום מגורים"],e:"יוקרה ומיומנות מודדות מעמד חברתי, הכנסה מודדת מעמד כלכלי."},
 {q:"מה מודדת ההכנסה בתוך מדד ה־SES?",a:"את המעמד הכלכלי",w:["את המעמד החברתי","את רמת ההשכלה","את יוקרת העיסוק"],e:"שלושת המשתנים קשורים אך לא חופפים."}]},
q10:{t:"t2",v:[
 {q:"אילו תכונות מדגישים הורים ממעמד נמוך כשהם נשאלים מה ירצו בילדיהם?",a:"מאפיינים חיצוניים: צייתנות, נימוס, סדר וניקיון",w:["סקרנות והכוונה עצמית","שמחת חיים ובגרות קוגניטיבית","יצירתיות ועצמאות"],e:"הורים ממעמד גבוה יותר מדגישים תכונות פסיכולוגיות."},
 {q:"מה נכון לגבי עיתוי וגודל המשפחה לפי SES?",a:"בעבודות כפיים מתחתנים ומביאים ילדים מוקדם יותר, ויותר ילדים",w:["בעיסוקים מקצועיים מביאים יותר ילדים","אין קשר בין SES לגודל המשפחה","בעבודות כפיים מביאים ילדים מאוחר יותר"],e:"למשל פועלי בניין, נהגי משאיות ושומרים."}]},
q11:{t:"t2",v:[
 {q:"מה הגורם שתורם במידה רבה להבדלים בגידול הילדים בין המעמדות?",a:"ההשכלה של ההורים",w:["מספר החדרים בבית","מזג האוויר","מספר הסבים"],e:"שנות לימוד מלמדות לחשוב ברעיונות מופשטים ולהשקיע בהתפתחות הילד."},
 {q:"איך מסביר הפרק את השימוש הרב יותר במשמעת כופה אצל הורים ממעמד נמוך?",a:"חוסר אונים בעבודה שמשוחזר בבית, ועקה גבוהה",w:["חוסר אהבה לילדים","הוראות של בית הספר","הם פשוט צעירים יותר"],e:"בבית הם בעלי הסמכות, כמו האנשים שקובעים להם בעבודה."}]},
q12:{t:"t2",v:[
 {q:"ממתי SES גבוה יותר קשור להתפתחות קוגניטיבית ושפתית טובה יותר?",a:"כבר מהשנה השנייה לחיים",w:["רק מגיל ההתבגרות","רק מכיתה א","רק בבגרות"],e:"ובהמשך: הצלחה בבית הספר והשכלה גבוהה יותר."},
 {q:"מה מאפיין הורים ממעמד גבוה יותר עם ילדים גדולים ומתבגרים?",a:"יותר חום, הסברים ושבחים, יעדים גבוהים ונתינת יותר החלטות לילד",w:["יותר פקודות וענישה גופנית","פחות דיבור עם הילד","פחות יעדים אקדמיים"],e:"פקודות, ביקורת וענישה גופנית נפוצות יותר במעמד נמוך."}]},
q13:{t:"t3",v:[
 {q:"מה הייתה אחת התוצאות של המאבק של מלאלה יוספזאי?",a:"חוק חינוך החובה הראשון בפקיסטאן, שהבטיח חינוך חינם לגילים 5 עד 16",w:["סגירת בתי ספר לבנות","ביטול הלימודים בבריטניה","הקמת אוניברסיטה בנפאל"],e:"החוק אושר ב־2012, ובעקבות עצומת האו\"ם \"אני מלאלה\"."},
 {q:"איזה חלק מהמבוגרים שאינם יודעים קרוא וכתוב בעולם הם נשים?",a:"כמעט שני שלישים",w:["כעשירית","כמחצית בדיוק","כרבע"],e:"מתוך כ־775 מיליון מבוגרים."}]},
q14:{t:"t3",v:[
 {q:"מי הם רוב הילדים בגיל בית ספר שאינם לומדים בעולם?",a:"בנות מבתים עניים",w:["בנים מבתים אמידים","ילדים בערים גדולות בלבד","ילדים מאירופה"],e:"כ־57 מיליון בגיל היסודי וכ־71 מיליון בגיל חטיבת הביניים."},
 {q:"מה כתבה מלאלה ב־2009, כשהייתה בת 11?",a:"בלוג בשם בדוי לבי־בי־סי על החיים תחת הטליבאן",w:["ספר לימוד לבנות","מכתב לנשיא ארה\"ב","עצומה לאו\"ם"],e:"העצומה \"אני מלאלה\" באה מאוחר יותר. ב־2014 קיבלה פרס נובל לשלום."}]},
q15:{t:"t3",v:[
 {q:"מה הסביר את הקשר בין השכלת האם לבין הבריאות והאינטראקציה עם הילד, במחקר ארבע המדינות?",a:"כישורי האוריינות של האם",w:["הכנסת המשפחה","השכלת האב","מספר הילדים"],e:"הכישורים המילוליים והקוגניטיביים שהאוריינות משפרת."},
 {q:"מה נמצא לגבי אימהות משכילות יותר ואוצר המילים של ילדיהן?",a:"הן הגיבו יותר מילולית לקולות התינוק, ולילדים היה אוצר מילים גדול יותר",w:["לא נמצא קשר","הילדים דיברו פחות","רק בזמביה נמצא קשר"],e:"הממצאים היו זהים בכל ארבע המדינות."}]},
q16:{t:"t3",v:[
 {q:"מהו המחסום הגדול ביותר לשליחת בנות לבית הספר, לפי התיבה?",a:"שכר לימוד, שלעתים מגיע לשליש מהכנסת משפחה ענייה",w:["חוסר עניין של הבנות","מחסור במורים בלבד","מרחק מהעיר"],e:"אז ההורים שולחים רק בנים. כשמבטלים אותו, רובם שולחים גם בנות."},
 {q:"מה נמצא בנפאל לגבי אימהות משכילות, גם בלי קשר להכנסה ולהשכלת האב?",a:"הן הקנו כישורים אקדמיים, העשירו את הבית בחומרי קריאה והחזיקו ציפיות גבוהות",w:["הן עבדו פחות","הן שלחו את הילדים לפנימיות","לא נמצא הבדל"],e:"והתמיכה הזו ניבאה את ההתקדמות של הילדים בשפה ובאוריינות."}]},
q17:{t:"t4",v:[
 {q:"מה מצאה לותר אצל צעירים מפרברים עשירים?",a:"כבר בכיתה ז עד 10% סבלו מבעיות חמורות, כמו סמים, חרדה ודיכאון",w:["הם תמיד מסתגלים טוב יותר","אין להם בעיות כלל","הבעיות נעלמות בתיכון"],e:"הבעיות אף החריפו בתיכון."},
 {q:"מה מרמז המתאם בין סמים לחרדה ודיכאון, שנמצא רק אצל מתבגרים אמידים?",a:"שהם לקחו סמים כדי להקל על הסבל",w:["שהסמים לא מזיקים","שאין להם לחץ","שהם עושים זאת בגלל עוני"],e:"נוהג שמנבא שימוש קבוע בסמים."}]},
q18:{t:"t4",v:[
 {q:"מה מגן גם על מתבגרים אמידים וגם על בני מעמד נמוך, לפי תרשים 2.7?",a:"ארוחת ערב עם ההורים לעתים קרובות",w:["חוגים רבים ככל האפשר","דמי כיס גבוהים","טלפון חכם"],e:"גם כשמחזיקים קבועים היבטים אחרים של ההורות."},
 {q:"למה רבים מבני הנוער האמידים מתקשים?",a:"פחות קרבה והשגחה, ודרישות מוגזמות להישגים",w:["כי אין להם כסף","כי ההורים מבלים איתם יותר מדי","כי הם לומדים פחות"],e:"מתבגרים שהוריהם מעריכים הישגים יותר מאופי סובלים יותר."}]},
q19:{t:"t4",v:[
 {q:"איזה אחוז מהילדים בארה\"ב חיים מתחת לקו העוני הפדרלי, לפי הפרק?",a:"כ־22%",w:["כ־5%","כ־50%","כ־2%"],e:"כ־14.5 מיליון ילדים."},
 {q:"מהו \"עוני מרוד\" בארה\"ב, ובאיזה שיעור הוא קיים?",a:"פחות מחצי מקו העוני, וכמעט 10% מהילדים",w:["פחות מקו העוני, 50% מהילדים","הכנסה של אפס, 1% מהילדים","כל משפחה בלי רכב"],e:"בצפון ומרכז אירופה עוני ילדים מתחת ל־10% ועוני קיצוני נדיר."}]},
q20:{t:"t4",v:[
 {q:"באיזו קבוצה שיעור העוני קרוב ל־50%?",a:"אימהות שמגדלות לבדן ילדים בגיל הגן",w:["כלל האמריקנים","מבוגרים נשואים","ילדים בצפון אירופה"],e:"שיעורים גבוהים גם בקרב מיעוטים: 32%, 34%, 38%."},
 {q:"מה נכון לגבי עוני ילדים בישראל לפי ההערה בספר?",a:"23.8% מהילדים עניים, לעומת ממוצע OECD של 13.5%",w:["ישראל היא בעלת העוני הנמוך ב־OECD","אין עוני ילדים בישראל","השיעור זהה לממוצע OECD"],e:"רק בטורקיה השיעור גבוה יותר."}]},
q21:{t:"t4",v:[
 {q:"אילו מאפייני עוני מגדילים את הנזק להתפתחות?",a:"עוני מוקדם, עמוק וממושך יותר",w:["עוני שמתחיל בגיל ההתבגרות","עוני קצר וקל","רק עוני בעיר"],e:"נזקים: בריאות, פערים קוגניטיביים, נשירה, מחלות נפש ותוקפנות."},
 {q:"איך גורמי העקה של העוני משפיעים על המשפחה?",a:"בני המשפחה נעשים מדוכאים ורגזנים, ויש יותר אינטראקציות עוינות",w:["הם מקרבים את בני המשפחה","אין להם השפעה","הם משפרים את ההורות"],e:"חמור במיוחד אצל הורה יחיד ובשכונות מסוכנות."}]},
q22:{t:"t4",v:[
 {q:"איזה חלק ממחוסרי הדיור בארה\"ב הם ילדים ובני נוער?",a:"כ־40%",w:["כ־5%","כ־90%","אין ילדים מחוסרי דיור"],e:"מתוך 2.5 עד 3.5 מיליון איש בשנה."},
 {q:"מהן שתי הסיבות העיקריות לעלייה במספר מחוסרי הדיור?",a:"פחות דיור בר־השגה בתמיכה ממשלתית, ויותר עוני",w:["יותר הגירה ויותר ילודה","מחלות ומלחמות","מעבר לכפרים"],e:"רוב המשפחות מחוסרות הבית הן אימהות לילדים מתחת לגיל 5."}]},
q23:{t:"t4",v:[
 {q:"מה כללה ההתערבות להורים עניים שתוארה בפרק?",a:"14 שעות הכשרה בהתמודדות עם עקה, פתרון בעיות, תקשורת והורות חיובית",w:["מענק כספי חד־פעמי","מעבר דירה","טיפול תרופתי"],e:"המשפחות חולקו באקראי לקבוצת התערבות או ביקורת."},
 {q:"מה היו תוצאות ההתערבות לחיזוק משפחות עניות?",a:"פחות דיכאון ולחץ אצל ההורים, ופחות הפנמה והחצנה אצל הילדים, גם אחרי 18 חודשים",w:["לא היה שום שינוי","השיפור נעלם אחרי שבוע","רק הציונים השתפרו"],e:"ההורים גם דיווחו על יחסים חמים יותר עם הילדים."}]},
q24:{t:"t4",v:[
 {q:"למה יותר ויותר תוכניות לילדים עניים הן רבות־ממדים?",a:"כי ילדים עניים חווים מצוקות רבות, ולכן מטפלים בו זמנית במשפחה, בהורות ובילד",w:["כי הן זולות יותר","כי ילד אחד צריך רק דבר אחד","כי כך דורש החוק"],e:"חלק מההתערבויות מכוונות להורות וחלק ישירות לכישורי הילדים."},

      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  if(blk.q)slot.appendChild(qCard(blk.q,next,"בדיקה קצרה"));
  else{const b=document.createElement("button");b.className="primary";b.textContent="המשך";b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
