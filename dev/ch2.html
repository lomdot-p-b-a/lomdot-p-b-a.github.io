 {id:"t1",icon:"people",title:"המשפחה כמערכת",blocks:[
  {h:"הסביבה: מערך רב־שכבתי",html:`${def("על מה הנושא",`הילד לא גדל לבד: הוא חלק ממשפחה, והמשפחה עצמה היא מערכת שבה כל אחד משפיע על כולם. הנושא מסביר איך ההשפעות האלה עובדות.<br><b>מה נלמד כאן:</b> מערך רב־שכבתי · השפעות ישירות ודו־כיווניות · השפעות עקיפות · הורות משותפת`)}<p>הסביבה מורכבת לא פחות מהתורשה: <b>שכבות של השפעות</b> שמשתלבות זו בזו, ויכולות לקדם רווחה גופנית ונפשית או לפגוע בה.</p><p>כשסטודנטים מתבקשים לרשום מה השפיע עליהם, הם מציינים בעיקר את <b>המשפחה</b> (ההקשר הראשון והממושך ביותר), ואחריה חברים, שכנים, בית ספר וארגונים קהילתיים ודתיים.</p>${fig("layers","ההקשרים שבהם עוסק הפרק, לפי תיאוריית המערכות האקולוגיות של ברונפנברנר")}${def("ההקשר שכמעט לא שמים לב אליו",`<mark>מערכת המאקרו</mark>: האקלים החברתי הרחב, כלומר <b>הערכים והתוכניות</b> שתומכים בהתפתחות הילדים ומגינים עליה. כל משפחה צריכה עזרה: דיור ובריאות בני־השגה, שכונות בטוחות, בתי ספר טובים, מתקני פנאי ושירותים שמאפשרים להורים לעמוד גם בעבודה וגם במשפחה.`)}${rem("המסר של הפרק: הסביבה, כמו התורשה, יכולה <b>לקדם</b> את ההתפתחות או <b>לסכן</b> אותה.")}${ex(`<b>מערכת המאקרו</b>: במדינה שבה יש חופשת לידה ארוכה ומעונות מסובסדים, הורים פחות לחוצים ויש להם יותר זמן לילדים.`)}`,q:"q1"},
  {h:"השפעות ישירות ודו־כיווניות",html:`<p>אין הקשר במערכת המיקרו שמשתווה למשפחה בעוצמה ובהיקף. היא מפגישה את הילד עם העולם הפיזי, יוצרת קשרים ייחודיים (ההיקשרות להורים ולאחים נמשכת לרוב כל החיים ומשמשת <b>מודל</b> ליחסים אחרים), ובה לומדים שפה, מיומנויות וערכים. בכל התרבויות, קשרי משפחה חמים מנבאים בריאות גופנית ונפשית, ובידוד או ניכור מההורים קשורים לבעיות.</p>${def("המשפחה כמערכת",`חוקרים רואים במשפחה <b>רשת של יחסים עם תלות הדדית</b>. יש <mark>השפעות דו־כיווניות</mark>: ההתנהגות של כל אחד משפיעה על האחרים, באופן ישיר ובאופן עקיף.`)}${fig("famsys")}${ex("במרכול: <b>דני, בן 4</b>, מבקש מסטיק. אימו מסרבת בחום, מסבירה שהכסף נחוץ לדגנים שבחרו, ונותנת לו להחזיק אותם. <b>מג, בת 3</b>, מפרקת בננות ומושיטה יד לשוקולד. אימה צועקת, חוטפת וסוטרת על ידה, ומג מתחילה ליילל.")}<p>המחקר מראה: הורים <b>חמים אך תקיפים</b> → הילד נענה → ההורה ממשיך בחום. הורים <b>נוקשים וחסרי סבלנות</b> → הילד מסרב ומתמרד → ההורה מגביר ענישה → הילד פרוע עוד יותר. כל צד משמר את הדפוס של האחר.</p>`,q:"q3"},
  {h:"השפעות עקיפות: צד שלישי",html:`<p>היחסים בין כל שניים במשפחה מושפעים ממי שנמצא סביבם. ברונפנברנר קרא לזה <mark>השפעות של צד שלישי</mark> ${E("Third party")}, והן יכולות לעודד את ההתפתחות או לבלום אותה.</p>${def("הורות משותפת",`<mark>הורות משותפת</mark> ${E("Coparenting")}: כל הורה תומך בהתנהגויות ההוריות של האחר. כשהזוגיות חמה, ההורים חמים יותר, משבחים ומדרבנים יותר ונוזפים פחות. כשהזוגיות מתוחה ועוינת, הם מפריעים זה לזה, נענים פחות לילד, ומבקרים, כועסים ומענישים יותר.`)}${tiles([["moon","הפנמה","בעיקר אצל בנות: דאגה, פחד, ניסיונות לתקן את היחסים בין ההורים","המצוקה ״נשארת בפנים״: הילד דואג, פוחד ועצוב, אבל כלפי חוץ הוא לפעמים נראה שקט. לכן קל לפספס אותה.","ההורים של נועם רבים הרבה. אחותו הגדולה לא מתפרצת, אבל מתחילה לדאוג כל הזמן, לא נרדמת בלילה ומנסה ״לפייס״ בין אמא לאבא."],["target","החצנה","בעיקר אצל בנים: כעס ותוקפנות","המצוקה ״יוצאת החוצה״ דרך ההתנהגות: כעס, תוקפנות והתפרצויות. את זה רואים מיד, ולכן לפעמים חושבים שזו ״בעיית משמעת״ ולא מצוקה.","בתקופה שההורים של נועם רבים, הוא מתחיל להרביץ לילדים בגן ולזרוק צעצועים כשלא נותנים לו משהו."]])}${rem("ילדים שחשופים באופן <b>כרוני</b> לסכסוך כועס ולא פתור בין ההורים נפגעים בביטחון הרגשי. הקשיים שלהם עלולים לשבש עוד יותר את הזוגיות.")}<p><b>סבים וסבתות</b> יכולים לעזור ישירות (חום כלפי הילד) ובעקיפין (עצות להורים, מודל לגידול ילדים, עזרה כספית). אבל סכסוך בין ההורים לסבים עלול לפגוע בתקשורת בין ההורים לילדים.</p>${ex(`<b>צד שלישי</b>: אבא שתומך באמא ומחמיא לה על הטיפול בתינוק. האמא רגועה יותר, ולכן סבלנית יותר עם התינוק. האבא השפיע על התינוק דרך האמא.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"cycle",title:"משפחה משתנה ומעמד סוציו־אקונומי",blocks:[
  {h:"הסתגלות לשינוי",html:`${def("על מה הנושא",`משפחות משתנות כל הזמן, ויש להן מקום בסולם החברתי. הנושא מסביר מהו מעמד סוציו־אקונומי, ואיך הוא נכנס לתוך הבית.<br><b>מה נלמד כאן:</b> הסתגלות לשינוי · מעמד סוציו־אקונומי (SES) · SES והורות`)}<p>זו <b>מערכת הכרונו</b>: הכוחות במשפחה משתנים כל הזמן, כי כל אחד מסתגל להתפתחות של האחרים.</p>${ex("בחודשים הראשונים ההורים עסוקים בהאכלה, חיתולים, רחצה וחיבוקים. בן שנה כבר מצביע, קורא לחפצים בשמם ומחטט בארונות, וההורים עוברים ל<b>פחות טיפול פיזי ויותר דיבור, משחק ומשמעת</b>. זה בתורו מקדם את המיומנויות שלו.")}<p>גם <b>התפתחות ההורים</b> משפיעה. העימותים בתחילת ההתבגרות לא נובעים רק מהחתירה של המתבגר לעצמאות: ההורים מגיעים לגיל העמידה ובוחנים מחדש את מחויבויותיהם. המתבגר דוחף ל<b>אוטונומיה</b>, ההורה דוחף ל<b>קרבה</b>, והחיכוך נפתר בהדרגה. אין יחידה חברתית אחרת שנדרשת להסתגל לשינויים כה גדולים.</p>${rem("גם רוח התקופה: פחות ילודה, יותר גירושים, יותר תפקידים לנשים, קבלה רבה יותר של הומוסקסואליות והורות מאוחרת יותר הביאו למשפחות <b>קטנות ומגוונות</b> יותר: הורים יחידים, נשואים בשנית, הורים הומואים ולסביות, ושני הורים עובדים.")}`,q:"q7"},
  {h:"מהו מעמד סוציו־אקונומי",html:`${def("מושג מפתח",`<mark>מעמד סוציו־אקונומי</mark> ${E("SES, Socioeconomic status")}: מדד שמשלב שלושה משתנים קשורים אך לא חופפים: <b>שנות השכלה</b>, <b>יוקרת העיסוק ורמת המיומנות</b> שהוא דורש (יחד: מעמד חברתי), ו<b>הכנסה</b> (מעמד כלכלי).`)}${fig("ses")}<p><b>עיתוי וגודל משפחה:</b> אנשים בעבודות כפיים מקצועיות וחצי־מקצועיות (פועלי בניין, נהגי משאיות, שומרים) מתחתנים ומביאים ילדים מוקדם יותר, ויותר ילדים, מאשר אנשים בעיסוקים מקצועיים וטכניים.</p>${tiles([["check","SES נמוך","מאפיינים חיצוניים: צייתנות, נימוס, סדר וניקיון","הורים במעמד כלכלי־חברתי נמוך מדגישים יותר צייתנות וסדר. לפי הספר, אחת הסיבות היא שבעבודה שלהם הם רגילים לציית להוראות, וזה עובר הביתה, וגם הלחץ בחיים גדול יותר.","אבא שעובד במפעל עם הוראות קבועות אומר לבנו ״כי אמרתי״, במקום להסביר למה צריך לסדר את החדר."],["brain","SES גבוה יותר","תכונות פסיכולוגיות: סקרנות, שמחת חיים, הכוונה עצמית, בגרות קוגניטיבית וחברתית","הורים במעמד כלכלי־חברתי גבוה מדגישים תכונות ״פנימיות״, כמו סקרנות, שמחת חיים, הכוונה עצמית ובגרות. הם מדברים עם הילד יותר, מסבירים ומשבחים.","אמא של נועם שואלת אותו ״למה אתה חושב שהעלים נופלים?״, במקום לומר לו ״כי ככה זה״."]])}${ex(`שתי משפחות עם אותה הכנסה: באחת ההורים אקדמאים ובשנייה לא. ה־SES שלהן שונה, כי הוא משלב <b>השכלה, יוקרת מקצוע והכנסה</b>.`)}`,q:"q9"},
  {h:"SES בתוך הבית",html:`<p><b>במעמד גבוה יותר</b> ההורים מדברים יותר עם תינוקות וילדי גן, קוראים להם יותר ונותנים יותר חופש לחקור. עם ילדים גדולים ומתבגרים הם מפגינים יותר חום, מסבירים ומשבחים מילולית, מציבים יעדים גבוהים יותר ונותנים לילד להחליט יותר. <b>בבתים ממעמד נמוך</b> נפוצים יותר פקודות ("כי אמרתי לך"), ביקורת וענישה גופנית.</p>${def("למה",`<b>השכלה</b> היא גורם מרכזי: שנים של לימוד מלמדות לחשוב ברעיונות מופשטים, ומכאן ההשקעה בהתפתחות הקוגניטיבית והחברתית של הילד. בנוסף, הורים ממעמד נמוך חווים <b>חוסר אונים</b> מחוץ לבית (בעבודה הם נשמעים לכללים של אחרים) ומשחזרים את זה בבית, הפעם כבעלי הסמכות. <b>עקה</b> גבוהה תורמת למשמעת כופה. להורים ממעמד גבוה יותר יש יותר שליטה בחייהם, והם מקנים לילדים מיומנויות של החלטה עצמאית ושכנוע.`)}${rem("כבר <b>מהשנה השנייה</b>, SES גבוה יותר קשור להתפתחות קוגניטיבית ושפתית טובה יותר ולפחות בעיות התנהגות, ואחר כך להצלחה בבית הספר ולהשכלה גבוהה יותר.")}${ex(`הורה עם השכלה גבוהה נוטה לשאול את הילד "למה לדעתך זה קרה?" במקום רק לתת הוראות. כך הילד מתרגל לחשוב ולהסביר.`)}`,q:"q11"}
 ]},
 {id:"t3",icon:"grad",title:"השכלה של בנות ברחבי תבל",blocks:[
  {h:"מלאלה והמספרים",html:`${def("על מה הנושא",`דוגמה עולמית לכוח של ההשכלה: מה קורה לילדים כשאמהות לומדות לקרוא.<br><b>מה נלמד כאן:</b> מלאלה · מחקר ארבע המדינות · המנגנון: אוריינות`)}${who("מ","מלאלה יוספזאי","פקיסטאן","ב־2009, בגיל 11, כתבה בשם בדוי בלוג לבי־בי־סי על החיים תחת הטליבאן, שאסרו לעתים על בנות ללמוד. באוקטובר 2012 צלף מהטליבאן עלה על אוטובוס התלמידים ופצע אותה אנושות. היא החלימה בטיפול באנגליה.")}<p>בעקבות זאת: עצומה של האו״ם, "אני מלאלה", שדרשה שכל הילדים יירשמו לבית ספר עד סוף 2015, ו<b>חוק חינוך החובה הראשון בפקיסטאן</b> (2012), שהבטיח חינוך חינם לגילים 5 עד 16. ב־2014 קיבלה מלאלה את פרס נובל לשלום.</p>${rem("עדיין כ־<b>57 מיליון</b> ילדים בגיל בית ספר יסודי וכ־<b>71 מיליון</b> בגיל חטיבת הביניים לא לומדים, ורובם בנות מבתים עניים. כמעט <b>שני שלישים</b> מ־775 מיליון המבוגרים שאינם יודעים קרוא וכתוב הם נשים.")}`,q:"q13"},
  {h:"מחקר ארבע המדינות",html:`<p>במקסיקו, נפאל, ונצואלה וזמביה בדקו איך השפה והאוריינות של האם משפיעות על בריאות המשפחה, על האינטראקציה עם הילד ועל האוריינות של הילדים. ממוצע הלימוד של האימהות: מ־5 שנים (נפאל) עד 8 (זמביה). הממצאים היו <b>זהים</b> בכל המדינות, בכפר ובעיר.</p>${tiles([["doc","בריאות","הבנה טובה יותר של מסרי בריאות ברדיו ובטלוויזיה, הסבר טוב יותר לאנשי מקצוע. רפואה מונעת: ביקורים לפני לידה, חיסונים, תזונה. תכנון משפחה: דחיית נישואים, פחות ילדים ובמרווחים","השכלה של אמהות משפיעה על בריאות הילדים: אמא שלמדה לקרוא מבינה מסרים של בריאות, מגיעה לבדיקות ומחסנת. לפי הספר, זה נמצא בארבע מדינות שונות.","אמא שלמדה לקרוא שומעת ברדיו על חיסון חדש לילדים, מבינה את ההסבר, ולוקחת את הבת שלה לטיפת חלב."],["people","אינטראקציה","יותר תגובות מילוליות לקולות של התינוק, ובהמשך אוצר מילים גדול יותר לילדים"],["grad","אוריינות (נפאל)","בלי קשר להכנסה ולהשכלת האב: יותר הקניית כישורים, חומרי קריאה בבית, דוגמה אישית וציפיות גבוהות","השכלה של האם קשורה ליותר הקניית כישורים לילד: ספרים בבית, דוגמה אישית וציפיות גבוהות. זה נמצא גם בלי קשר להכנסה ולהשכלה של האב.","אמא שקוראת בעצמה ספרים מול נועם, ומקריאה לו כל ערב, מעבירה לו את האהבה לקריאה."]])}${def("המנגנון",`הכישורים המילוליים והקוגניטיביים ש<b>האוריינות</b> משפרת הם שהסבירו את הקשר. גם מעט שנות לימוד בבתי ספר חלשים שינו את התנהגות האם.`)}${rem("לפי האו״ם, השכלת בנות היא האמצעי היעיל נגד עוני, תמותת אימהות וילדים, מחלות ואי־שוויון. מחסומים: אמונות על תפקידי מגדר, הצורך בעזרת הבת בבית, ובעיקר <b>שכר לימוד</b> (לעתים שליש מהכנסת משפחה ענייה), ואז שולחים רק בנים. כשמבטלים את שכר הלימוד, מסבירים את התועלת ויוצרים עבודה לנשים, רוב ההורים שולחים את הבנות.")}${ex(`אמא שלמדה לקרוא יכולה לקרוא את ההוראות על התרופה של הילד, ולהבין את מה שהרופא אומר. כך האוריינות שלה משפרת את הבריאות שלו.`)}`,q:"q15"}
 ]},
 {id:"t4",icon:"chart",title:"אמידות ועוני",blocks:[
  {h:"אמידות",html:`${def("על מה הנושא",`שני הקצוות של הסולם: גם לעוני וגם לאמידות יש מחיר לילדים. הנושא מציג את שניהם, ומה אפשר לעשות.<br><b>מה נלמד כאן:</b> אמידות · עוני · היעדר דיור · התערבויות`)}<p>למרות השכלה וכסף, הורים אמידים לא תמיד מקיימים הורות שמקדמת התפתחות. במחקרים של לותר על צעירים מפרברים עשירים, כבר ב<b>כיתה ז</b> עד <b>10%</b> סבלו מבעיות חמורות שהחריפו בתיכון: ציונים נמוכים, יותר אלכוהול וסמים מבני נוער ממעמד נמוך, הסתבכות עם החוק, וחרדה ודיכאון.</p>${def("רמז חשוב",`רק אצל האמידים (ולא במעמד הנמוך) השימוש בחומרים היה <b>במתאם עם חרדה ודיכאון</b>. כלומר נראה שהם לקחו סמים כדי להקל על הסבל, נוהג שמנבא שימוש קבוע.`)}<p><b>למה?</b> פחות קרבה רגשית, פחות השגחה ופחות תוצאות להתנהגות שלילית. הורים אמידים עסוקים בקריירה ובחיי חברה, ו<b>לא נגישים כמעט כמו הורים עניים</b>. הם גם דורשים הישגים מוגזמים ומבקרים כשהילד לא מושלם. מתבגרים שהוריהם מעריכים הישגים יותר מאופי סובלים יותר.</p>${fig("dinner","ארוחת ערב עם ההורים לעתים קרובות קשורה לפחות בעיות (תרשים 2.7)")}${rem("ארוחת ערב עם ההורים מגינה גם על אמידים וגם על בני מעמד נמוך, אפילו כשמחזיקים קבועים היבטים אחרים של ההורות. גם חיבה, קבלה ופיקוח מנבאים הסתגלות טובה.")}${ex(`מתבגר בבית אמיד שההורים שלו עובדים עד מאוחר ומצפים לציונים מושלמים. יש לו הכול חוץ מזמן איתם, ובגלל הלחץ הוא בסיכון לחרדה ולשימוש בחומרים.`)}`,q:"q17"},
  {h:"עוני: ההיקף",html:`${ex("<b>קיילי, בת 10</b> (סרט של PBS): \"אנחנו לא מקבלים שלוש ארוחות ביום\". היא גרה עם אחיה טיילר ועם אמה, שסובלת מדיכאון ומחרדה ולא עובדת. כשנגמר הכסף עברו לחדר במלונית ומסרו את הכלב. אין לה חברים, מקום לשחק, ספרים או חוגים, ואת עתידה היא רואה \"ברחוב, בארגז קרטון\".")}${tiles([["pie","כ־15%","מהאמריקנים עניים (46 מיליון). הכי פגיעים: הורים צעירים (25 ומטה) לילדים קטנים, ומבוגרים שגרים לבד"],["people","22% מהילדים","כ־14.5 מיליון, מתחת לקו העוני הפדרלי (כ־23,500 דולר לשנה למשפחה של ארבע נפשות)","כחמישית מהילדים בארה״ב חיים מתחת לקו העוני. המספר מראה שעוני הוא לא תופעה שולית, אלא חלק גדול מהאוכלוסייה.","בכיתה של 25 ילדים, בממוצע חמישה גדלים במשפחה שחיה בעוני."],["chart","לפי קבוצה","ילדים היספנים 32%, ממוצא אמריקני־ילידי 34%, ממוצא אפריקני 38%. אימהות לבד עם ילדי גן: קרוב ל־50%"]])}<p><b>סיבות:</b> אבטלה, גירושים, הורות בגיל ההתבגרות ומחסור בתוכניות ממשלתיות. בארה״ב שיעור העוני של ילדים הוא הגבוה בכל מדינות המערב, וכמעט <b>10%</b> חיים ב<b>עוני מרוד</b> (פחות מחצי מקו העוני). ברוב מדינות צפון ומרכז אירופה עוני הילדים מתחת ל־10% כבר עשרות שנים.</p>${fig("povrank","עוני ילדים ב־20 מדינות מפותחות (תרשים 2.8): ארה\"ב אחרונה")}${rem("הערה לגבי ישראל: 18% מהתושבים עניים. בקרב ילדים 23.8%, לעומת ממוצע OECD של 13.5%, ורק בטורקיה יותר (נתוני ביטוח לאומי, 2017).")}`,q:"q19"},
  {h:"מה העוני עושה",html:`${rem("ככל שהעוני <b>מוקדם, עמוק וממושך</b> יותר, הנזק גדול יותר: בריאות לקויה לכל החיים, פערים קבועים בקוגניציה ובהישגים, נשירה, מחלות נפש, אימפולסיביות, תוקפנות והתנהגות אנטי־חברתית.")}<p><b>גורמי העקה</b> מחלישים בהדרגה את המשפחה: מכונית מתקלקלת, קצבה אובדת, ניתוק חשמל או מים חמים, מזון לא בטוח. במשבר בני המשפחה נעשים מדוכאים, רגזנים ומוסחים, יש יותר אינטראקציות עוינות, וההתפתחות נפגעת. זה חמור במיוחד אצל <b>הורה יחיד</b>, ובדיור ירוד ובשכונות מסוכנות שמפחיתים את התמיכה החברתית.</p>${def("היעדר דיור",`בארה״ב <b>2.5 עד 3.5 מיליון</b> איש בשנה. רובם מבוגרים לבד, רבים עם מחלת נפש קשה, אבל כ־<b>40%</b> הם ילדים ובני נוער. שתי סיבות: פחות דיור בר־השגה בתמיכת המדינה ויותר עוני. רוב המשפחות הן אימהות לילדים מתחת לגיל 5. לילדים: עיכובים התפתחותיים ומצוקה רגשית. 25% עד 30% מהם בגיל בית ספר לא לומדים, ומי שלומד מצליח פחות מילדים עניים אחרים (היעדרויות, מעברים בין מקלטים, בעיות בריאות ורגש).`)}${ex(`משפחה שעוברת דירה שלוש פעמים בשנה כי אין כסף לשכירות. בכל פעם הילד מחליף בית ספר וחברים, וההורים מותשים מדאגה.`)}`,q:"q21"},
  {h:"התערבויות נגד השפעות העוני",html:`<p>למרות הפערים, <b>ילדים רבים ממשפחות עניות מסתדרים יפה</b> (גורמי החוסן מפרק 1).</p>${ex("משפחות עניות עם ילדים מגיל הגן עד ההתבגרות חולקו <b>באקראי</b> לקבוצת התערבות או ביקורת. ההתערבות: <b>14 שעות</b> הכשרה להורים בהתמודדות עם עקה, פתרון בעיות יום־יומיות, תקשורת חיובית והורות חיובית. התוצאות: ניהול עקה טוב יותר, פחות לחץ כלכלי, יחסים חמים יותר, פחות דיכאון אצל ההורים, ופחות הפנמה והחצנה אצל הילדים, וזה נשמר גם <b>18 חודשים</b> אחרי.")}${rem("יש התערבויות שמכוונות להורות ויש שמכוונות ישירות לכישורי הילדים. כי ילדים עניים חווים מצוקות רבות, יותר תוכניות הן <b>רבות־ממדים</b>: מטפלות בו זמנית במשפחה, בהורות ובילד.")}`,q:"q23"}
 ]},
 {id:"t5",icon:"building",title:"מעבר למשפחה: שכונות ובתי ספר",blocks:[
  {h:"שכונות",html:`${def("על מה הנושא",`מחוץ לבית יש עוד שני מקומות שמעצבים את הילד: השכונה ובית הספר.<br><b>מה נלמד כאן:</b> שכונות · תמיכה קהילתית · בתי ספר וקשר עם ההורים`)}<p>אלה מערכות <b>אקסו ומזו</b>: הקשרים בין המשפחה לקהילה. בשכונות עניות הסדר מופר: מעברי דירה, גנים הרוסים, אין מרכזים קהילתיים. נפוצות אלימות במשפחה, התעללות והזנחה, ובעיות התנהגות ועבריינות. בכפר העני (כמו אצל קיילי) בולטים <b>בידוד</b> ומחסור בשירותים. מנגד, קשרים הדוקים עם חברים, קרובים, פעילויות לנוער ובית תפילה מפחיתים עקה.</p>${ex("משפחות ממעמד נמוך קיבלו <b>באקראי</b> שוברים למעבר מדיור ציבורי לשכונות אמידות יותר. הילדים שעברו לשכונה עם פחות עוני היו <b>בריאים יותר גופנית ונפשית</b> והצליחו יותר בבית הספר.")}${def("למי זה חשוב יותר",`משאבי השכונה משפיעים יותר על <b>צעירים במצוקה כלכלית</b>. משפחות אמידות יכולות להסיע לחוגים ולבתי ספר רחוקים. בשכונות עניות, תוכניות אחרי בית הספר (אמנות, מוזיקה, ספורט, תנועות נוער) עם מבוגרים מיטיבים קשורות להישגים טובים יותר ופחות בעיות, וארגונים שכונתיים מקדמים ביטחון עצמי, הישגים ושאיפות.`)}${rem("אבל בשכונות מסוכנות יש מעט פעילויות, והגעה אליהן קשה. הורים לחוצים מדרבנים פחות. במחקר גדול, הילדים מהבתים הכי פחות מדרבנים ומהשכונות הכי כאוטיות השתתפו הכי פחות: <b>הנזקקים ביותר החמיצו הכי הרבה</b>.")}`,q:"q25"},
  {h:"תמיכה חברתית מהקהילה",html:`<p>קשרי משפחה ושכונה מפחיתים את העקה של ההורות בעיקר דרך <b>תמיכה חברתית</b>, בארבע דרכים:</p>${tiles([["id","ערך עצמי של ההורים","שכנים וקרובים שמקשיבים ועוזרים, וההורים מגיבים לילד ברגישות"],["link","מידע ושירותים","עצות על עבודה, דיור, טיפול בילדים ופעילויות במחיר סביר"],["scales","בקרה ומודלים","עידוד ודוגמה לשיטות חינוך יעילות, והרחקה משיטות לא יעילות"],["hand","עזרה ישירה","מבוגרים נוספים שמשפיעים בחום, ממתנים הורות לא יעילה ומתערבים כשנער מבריז"]])}${def("״התחלות טובות יותר, עתיד טוב יותר״",`${E("Better Beginnings, Better Futures")}: מערך תוכניות קהילתיות במימון ממשלתי באונטריו שבקנדה, למניעת כישלון ועבריינות. המוצלחת ביותר התבססה על <b>בית ספר יסודי</b>: העשרה בכיתה ובקיץ, ביקורי בית סדירים אצל ההורים, מידע על משאבים ועידוד מעורבות. בהערכות בכיתות ג, ו ו־ט: תפקוד משפחה, הורות, הישגים והסתגלות חברתית טובים יותר, ופחות בעיות רגש והתנהגות, בהשוואה לשכונות עניות בלי התוכנית.`)}${ex(`מרכז קהילתי בשכונה שמציע חוגים, ביקורי בית לאמהות צעירות ושיעורי עזר. ההורים מקבלים תמיכה, והילדים מקום בטוח אחרי בית הספר.`)}`,q:"q27"},
  {h:"בתי ספר",html:`<p>בניגוד למשפחה ולשכונה, בית הספר הוא <b>מוסד פורמלי</b> שנועד להעביר ידע וכישורים. בארה״ב: כ־6 שעות ביום, 5 ימים בשבוע, 36 שבועות בשנה, בסך הכול כ־<b>14,000 שעות</b> עד סוף התיכון, ועוד יותר כשמתחילים בגן "בסגנון בית ספר".</p>${tiles([["building","סביבה פיזית","גודל בית הספר, מספר ילדים בכיתה, מרחב ללמידה ולמשחק","התנאים הפיזיים של בית הספר משפיעים על הלמידה: כמה גדול בית הספר, כמה ילדים יש בכיתה, והאם יש מקום ללמוד ולשחק.","בכיתה של 20 ילדים המורה מספיקה לשים לב לכל ילד. בכיתה של 40 ילדים, ילד שקט שמתקשה יכול ״להיעלם״."],["bulb","תפיסה חינוכית","לומדים פסיביים, לומדים פעילים וסקרנים, או שותפים בהנחיית מומחים","כל בית ספר מחזיק ברעיון לגבי מה תפקיד התלמיד: לשבת ולהקשיב (פסיבי), לחקור ולשאול (פעיל), או לעבוד יחד עם המורה כשותף.","בכיתה אחת המורה מכתיבה והתלמידים מעתיקים. בכיתה אחרת התלמידים יוצאים לחצר למדוד צמחים ובונים בעצמם את המסקנות."],["people","חיי חברה","שיתוף או תחרות, לימוד משותף של רקעים שונים, בטיחות או אלימות","האווירה החברתית בבית הספר היא חלק מההתפתחות: האם מעודדים שיתוף או תחרות, האם ילדים מרקעים שונים לומדים יחד, והאם המקום בטוח.","בית ספר שמחלק את התלמידים לקבוצות עבודה מעורבות, ומטפל מיד באלימות בהפסקות, יוצר סביבה שבה ילדים מרגישים בטוחים לשאול."]])}${def("קשר הורים ובית ספר",`מעורבות של הורים (פעילויות, אסיפות) קשורה ל<b>הישגים טובים יותר</b>. הורים ממעמד גבוה, שהרקע שלהם דומה לזה של המורים, מתקשרים ומבקרים יותר. הורים ממעמד נמוך וממיעוטים לא מרגישים בנוח והעקה מתישה אותם, ולכן על בית הספר <b>להשקיע מאמץ מיוחד</b> בהם.`)}${rem("בבתי ספר שבהם הורים רבים מעורבים מאוד ההישגים טובים במיוחד. כשחינוך טוב הוא מאמץ משותף של מורים, מנהלנים והקהילה, ההשפעה חזקה יותר ומגיעה ליותר תלמידים.")}`,q:"q29"}
 ]},
 {id:"t6",icon:"link",title:"ההקשר התרבותי",blocks:[
  {h:"ערכים ומנהגים של התרבות",html:`${def("על מה הנושא",`השכבה הרחבה ביותר: התרבות. הנושא מראה איך ערכים של חברה שלמה משפיעים על איך מגדלים ילדים.<br><b>מה נלמד כאן:</b> ערכי התרבות · תרבות משנה · משפחה מורחבת ופמיליזם · קולקטיביזם מול אינדיווידואליזם`)}<p>זו <b>מערכת המאקרו</b>. התרבות מעצבת את המשפחה, בית הספר והקהילה, אבל רבים לא מודעים למורשת שלהם עד שהם רואים מנהגים של תרבות אחרת.</p>${ex("\"מי אחראי לגדל ילדים קטנים?\" סטודנטים אמריקנים עונים: \"מי שמחליט להביא תינוק צריך להיות מוכן לטפל בו\", \"אנשים לא אוהבים שמתערבים להם במשפחה\".")}${def("ההשקפה האמריקנית",`הטיפול בילדים, החינוך והתשלום עליהם הם אחריות <b>של ההורים בלבד</b>. לכך היסטוריה ארוכה של <b>עצמאות, אי־תלות ופרטיות</b> כערכים מרכזיים. זו אחת הסיבות שהציבור לא מיהר לתמוך בהטבות ממשלתיות לכל המשפחות (טיפול איכותי בילדים, חופשה בתשלום), ושילדים רבים עניים אף שהוריהם עובדים.`)}`,q:"q31"},
  {h:"תרבויות משנה והמשפחה המורחבת",html:`${def("תרבות משנה",`<mark>תרבות משנה</mark> ${E("Subculture")}: קבוצה שחולקת את רוב הערכים של התרבות הכללית אבל יש לה אמונות, מנהגים וסמלים משלה (לפי גיל, מגדר, מוצא, דת ועוד). העורכות מעדיפות את המונח על "תת־תרבות", שעלול לרמוז על נחיתות.`)}${def("משק בית של משפחה מורחבת",`<mark>משק בית ובו משפחה מורחבת</mark> ${E("Extended-family household")}: הורה וילד גרים יחד עם קרוב משפחה מבוגר אחד או יותר. אצל משפחות ממוצא אפריקני זו מסורת מרכזית ששורשיה באפריקה (זוגות צעירים גרים עם המשפחה הגדולה), הגיעה בתקופת העבדות ומאז <b>מגינה מפני עוני וגזענות</b>.`)}${tiles([["people","תמיכה","חלוקת משאבים ועזרה בגידול. אימהות מתבגרות עם קשר חם למשפחה המורחבת מסיימות תיכון ועובדות יותר","משפחה מורחבת (סבים, דודים) יכולה לחלוק משאבים ולעזור בגידול הילדים. זה עוזר במיוחד לאמהות צעירות או יחידניות.","סבתא של נועם גרה קרוב ואוספת אותו מהגן כל יום, וכך אמא שלו יכולה לעבוד."],["check","הורות יעילה","אצל אימהות יחידניות: אינטראקציה חיובית יותר, והילדים מצליחים יותר בלימודים ובחברה ופחות אנטי־חברתיים"],["grad","הנחלת התרבות","יותר שיתוף פעולה וערכים מוסריים ודתיים. סבים מעבירים את המורשת, ומפגשים משפחתיים מחברים לשורשים"]])}<p>משפחות מורחבות מעורבות מאפיינות גם תרבויות משנה <b>אסיאתיות, אמריקניות־ילידיות והיספניות</b>: הסבים מדריכים את הצעירים, המבוגרים מקבלים תמיכה, ויש השקעה רבה בילדים ובקשישים. במשפחות היספניות הסבים שותפים לגידול <b>אפילו יותר</b> מאשר במשפחות אפריקניות־אמריקניות.</p>${def("פמיליזם",`<mark>פמיליזם</mark> ${E("Familism")}: האידיאל ההיספני שמציב במרכז קשרי משפחה הדוקים והרמוניים, מגע תכוף ומענה לצורכי המשפחה. ההורות הבין־דורית מתאימה לו, ולכן כולם נשכרים.`)}${ex(`<b>משפחה מורחבת</b>: סבתא שגרה עם המשפחה, מבשלת ומטפלת בנכדים כשההורים בעבודה. <b>פמיליזם</b>: ארוחת שבת שבה כל בני הדודים מגיעים, וההחלטות החשובות מתקבלות יחד.`)}`,q:"q33"},
  {h:"קולקטיביזם ואינדיווידואליזם",html:`${tiles([["people","קולקטיביזם","מטרות הקבוצה לפני האישיות. תלות הדדית: הרמוניה חברתית, מחויבות ואחריות לזולת, שיתוף פעולה","השאלה המרכזית היא ״מה טוב למשפחה או לקבוצה?״. חשובים ההרמוניה, האחריות לזולת והעזרה ההדדית. הספר מסייג שההבחנה הזו שנויה במחלוקת.","ילדה מוותרת על חוג שהיא אוהבת, כי צריך שמישהו יעזור בבית עם האחים הקטנים, וזה נראה לה טבעי."],["target","אינדיווידואליזם","עיסוק בצרכים האישיים: חקירה, תגליות, הישגים ובחירה אישית ביחסים","השאלה המרכזית היא ״מה טוב לי?״. חשובים הביטוי העצמי, העצמאות וההישגים האישיים.","הורים מעודדים את הבן לבחור בעצמו חוג, גם אם זה אומר שכל ערב הם צריכים להסיע אותו."]])}${def("הסתייגות",`זו ההבחנה הנפוצה ביותר בהשוואה בין תרבויות, אבל היא <b>שנויה במחלוקת</b>: שתי קבוצות הערכים קיימות ברוב התרבויות, והערכים מורכבים ושונים בעוד היבטים רבים.`)}${rem("ובכל זאת, יש הבדלים עקביים בין מדינות: <b>ארה\"ב אינדיווידואליסטית יותר</b> מרוב מדינות מערב אירופה, שנוטות לקולקטיביזם. לזה השפעה גדולה על הדרך שבה מדינה מגינה על ילדים ומשפחות.")}<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>קולקטיביזם</th><th>אינדיווידואליזם</th></tr></thead><tbody><tr><td><b>מה במרכז</b></td><td>הקבוצה והקשרים</td><td>האדם היחיד</td></tr><tr><td><b>מטרות</b></td><td>טובת המשפחה והקהילה</td><td>מטרות אישיות</td></tr><tr><td><b>מה מלמדים ילדים</b></td><td>לעזור, להתחשב, לציית</td><td>לבטא את עצמם, להיות עצמאיים</td></tr><tr><td><b>דוגמה</b></td><td>סין, יפן, מקסיקו</td><td>ארה"ב, מערב אירופה</td></tr></tbody></table></div>`,q:"q35"}
 ]},
 {id:"t7",icon:"scales",title:"מדיניות ציבורית והתפתחות הילד",blocks:[
  {h:"מהי מדיניות ציבורית",html:`${def("על מה הנושא",`איך המדינה יכולה לעזור לילדים? הנושא עוסק בחוקים ובתוכניות שנועדו לשפר את חייהם, ולמה זה קשה.<br><b>מה נלמד כאן:</b> מדיניות ציבורית · הקשיים · אמנת זכויות הילד`)}${def("מושג מפתח",`<mark>מדיניות ציבורית</mark> ${E("Public policy")}: חוקים ותוכניות ממשלתיות שנועדו לשפר תנאים קיימים. למשל, כשעוני ומחוסרי בית מתרבים: דיור מוזל, סיוע במשכנתא, העלאת שכר המינימום והקצבאות. כשילדים נכשלים בלימודים: יותר כסף לבתי ספר והכשרת מורים טובה יותר.`)}<p>בארה״ב המדיניות לטובת ילדים <b>בפיגור</b> לעומת מדינות מפותחות אחרות (טבלה 2.5, מקום 1 = הטוב ביותר):</p>${policyTable}${rem("חוק <b>הטיפול בר־ההשגה</b> (2010) הרחיב ביטוח בריאות לכל הילדים ממשפחות מעוטות הכנסה, אבל ההרחבה למבוגרים הושארה למדינות, ו־19 סירבו (14 לפי נתוני 2019). הורים לא מבוטחים לא יודעים לרשום את ילדיהם, ולכן כ־11% מהילדים הזכאים (יותר מ־5 מיליון) לא מכוסים. גם הטיפול בילדים: מעט מסגרות בנות־השגה, ורבות לא עומדות בתקן.")}<p>עוד: אכיפה רופפת של מזונות מחמירה עוני אצל אימהות גרושות, צעירים שלא הולכים למכללה יוצאים בלי הכשרה מקצועית, ו־8% מבני 16 עד 24 נשרו מהתיכון בלי תעודה.</p>${ex(`חוק חינוך חינם מגיל 3, או תוכנית ממשלתית שנותנת ארוחה חמה בבית הספר.`)}`,q:"q37"},
  {h:"למה זה קשה",html:`${tiles([["lock","ערכי התרבות","אי־תלות ופרטיות גורמים לממשלה להסס להתערב במשפחה","בתרבות שמקדשת אי־תלות ופרטיות, הממשלה מהססת ״להיכנס״ למשפחה, ולכן יש פחות תמיכה ציבורית בהורים ובילדים.","מדינה שבה ההחלטה על מעון יום וחופשת לידה נשארת ״עניין פרטי של המשפחה״, ולכן ההורים מממנים הכול בעצמם."],["pie","עלות","תוכניות טובות יקרות ומתחרות על משאבי המדינה","תוכניות טובות לילדים עולות הרבה כסף, והן מתחרות על אותו תקציב של המדינה עם צרכים אחרים. זו אחת הסיבות שקשה לקדם אותן.","עירייה צריכה לבחור אם להשקיע במעונות יום איכותיים או בתיקון כבישים."],["x","אין לילדים קול","הם לא מצביעים ולא יכולים להגן על האינטרסים שלהם, ותלויים ברצון הטוב של אחרים"]])}${ex("מדיניות הרווחה בארה״ב, שמחזירה מקבלי קצבאות לעבודה (הפחתה או הפסקה אחרי 24 חודשים), עוזרת כשהיא <b>מחלצת מעוני</b>: פחות עקה לאם, הורות טובה יותר, שיפור קוגניטיבי ופחות בעיות התנהגות. אבל כשהעבודה היא בשכר נמוך מאוד שמנציח את העוני, ההורות נעשית מחמירה וכופה וההסתגלות של הילדים גרועה.")}${rem("בלי אנשים שנלחמים על זכויות הילדים, מדיניות שנועדה לפתור בעיה חברתית עלולה להשאיר אותם במצוקה או אפילו להרע את מצבם.")}`,q:"q39"},
  {h:"מבט אל העתיד",html:`<p>שני נימוקים למדיניות שמקדמת ילדים: <b>ילדים הם העתיד</b> (ההורים, העובדים והאזרחים של מחר) והנימוק <b>ההומניטרי</b> (אלה זכויות האדם הבסיסיות שלהם).</p>${def("האמנה בדבר זכויות הילד",`${E("Convention on the Rights of the Child")}: ניסחה עצרת האו״ם ב־<b>1989</b>, הסכם מחייב בין מדינות. בין הזכויות: בריאות ברמה הגבוהה האפשרית, רמת חיים נאותה, חינוך חינם וחובה, חיי משפחה עם הבנה ואהבה, הגנה מהתעללות והזנחה, וחופש מחשבה, מצפון ודת. לפי הספר, ארה״ב היא אחת משתי המדינות היחידות שלא אשררו אותה (השנייה סומליה). המתנגדים טוענים שהיא תעביר את נטל הגידול מהמשפחה למדינה. <b>ישראל אשררה ב־1991</b>.`)}${tiles([["hand","הקרן להגנה על ילדים","Children's Defense Fund, הקימה מריאן רייט אדלמן ב־1973: מחקר, חינוך ציבורי, פעולה משפטית, הצעות חוק, עדויות ודוחות","ארגון אמריקאי שפועל כדי לשפר את מצב הילדים בכמה דרכים יחד: מחקר, הסברה לציבור, צעדים משפטיים והצעות חוק.","הארגון מפרסם דוח על עוני של ילדים, ומשתמש בו כדי לשכנע חברי פרלמנט לתמוך בחוק."],["data","המרכז הלאומי לילדים בעוני","NCCP: מעביר ממצאי מחקר למעצבי מדיניות"],["id","בישראל","המועצה הלאומית לשלום הילד, מ־1980: משפט, מחקר, הדרכה ונציב פניות ציבור","בישראל פועלת המועצה הלאומית לשלום הילד, שעוסקת במשפט, במחקר ובהדרכה, ומטפלת בפניות של הציבור.","הורה שנתקל בפגיעה בזכויות של ילד יכול לפנות לנציב הפניות של המועצה."]])}${rem("גם <b>חוקרים</b> עובדים יותר עם סוכנויות בקהילה ובממשלה, ומפיצים ממצאים בדוחות, באתרים ובתקשורת. כך הם יוצרים <b>תחושת בהילות</b> שמדרבנת את החברה לפעול.")}`,q:"q41"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"סטודנטים מתארים מה השפיע עליהם: הורים, חברים, מורים. איזה הקשר הם כמעט לא מזכירים?","a":"את מערכת המאקרו","w":["את מערכת המיקרו","את הקשר עם האחים","את בית הספר שלמדו בו"],"e":"סטודנטים מזכירים את מי שהם פוגשים ישירות (מיקרו), אבל כמעט לא את מערכת המאקרו: הערכים, החוקים והתוכניות של החברה. היא ״שקופה״, כי היא רחוקה מהחוויה היומיומית."},{"q":"מהי מערכת המאקרו, לפי הפרק?","a":"האקלים החברתי: ערכים ותוכניות שתומכים בילדים","w":["הקשרים בין הבית לבית הספר ובין שניהם","מקום העבודה של ההורים והשפעתו על הבית","הקשר הישיר והיומיומי בין ההורה לילד"],"e":"מערכת המאקרו היא האקלים החברתי: ערכים, חוקים ותוכניות שתומכים בילדים. הקשרים בין הבית לבית הספר הם מערכת המזו."}]},
"q2":{"t":"t1","v":[{"q":"מה המסר הכללי של הפרק על הסביבה?","a":"היא יכולה לקדם את ההתפתחות או לסכן אותה","w":["היא פחות חשובה מהתורשה ברוב התחומים","היא משפיעה בעיקר בשנים הראשונות בלבד","היא קובעת את ההתפתחות בלי קשר לתורשה"],"e":"הפרק מראה שהסביבה, כמו התורשה, יכולה לקדם את ההתפתחות או לסכן אותה. הוא לא טוען שהיא פחות חשובה מהתורשה או קובעת לבד."},{"q":"למה המשפחה מופיעה ראשונה ברשימות של הסטודנטים?","a":"כי היא ההקשר הראשון והממושך ביותר","w":["כי היא ההקשר היחיד שחשוב","כי חברים לא משפיעים כלל","כי בית הספר משפיע רק בעקיפין"],"e":"המשפחה היא ההקשר הראשון והממושך ביותר בחיי הילד, ולכן היא מופיעה ראשונה. זה לא אומר שהיא ההקשר היחיד שחשוב."}]},
"q3":{"t":"t1","v":[{"q":"ילדה בת 3 מתפרצת במרכול, האם צועקת, והילדה מתפרצת עוד יותר. מה זה ממחיש?","a":"השפעות דו־כיווניות שמשמרות דפוס שלילי","w":["השפעה של ערכי מערכת המאקרו על ההורה","השפעה עקיפה של צד שלישי על הקשר","השפעה של שינויים לאורך זמן (כרונו)"],"e":"ההתפרצות של הילדה מעוררת צעקה, והצעקה מגבירה את ההתפרצות: כל צד מחזק את השני. אלה השפעות דו־כיווניות שמשמרות דפוס שלילי, בתוך מערכת המיקרו."},{"q":"מה מתאר המונח ״השפעות דו־כיווניות״ במשפחה?","a":"כל בן משפחה משפיע על האחרים, ולהפך","w":["ההורים משפיעים על הילד, אבל לא להפך","הילד משפיע על ההורים, אבל לא להפך","רק הסבים משפיעים על כל בני המשפחה"],"e":"השפעות דו־כיווניות פירושן שכל בן משפחה משפיע על האחרים, וגם מושפע מהם. ההשפעה אינה רק מההורה לילד."}]},
"q4":{"t":"t1","v":[{"q":"אב חם אך תקיף מבקש מהבן לסדר את החדר, והבן נענה. מה צפוי להמשך?","a":"האב ימשיך בחום, והבן ימשיך להיענות","w":["האב יעבור לענישה כדי לשמור על סמכות","הבן יתחיל להתמרד כדי לבדוק גבולות","שניהם יתרחקו זה מזה עם הזמן"],"e":"התגובה החיובית של הבן מחזקת את החום של האב, והחום מעודד את הבן להמשיך להיענות. זה מעגל חיובי של השפעות דו־כיווניות."},{"q":"מה קורה כשההורים נוקשים וחסרי סבלנות?","a":"הילדים מתמרדים, וההורים מחריפים את הענישה","w":["הילדים נענים מהר יותר מתוך פחד מעונש","הילדים נעשים שקטים, ואז ההורים מתרככים","אין השפעה ניכרת על התנהגות הילדים"],"e":"הורים נוקשים וחסרי סבלנות מעוררים התמרדות, וההתמרדות מובילה לענישה חמורה יותר. זה מעגל שלילי. הילדים לא נענים מהר יותר."}]},
"q5":{"t":"t1","v":[{"q":"אמא אומרת לילד ״תשאל את אבא, הוא יודע״, ואבא מגבה את ההחלטות שלה. מה זה?","a":"הורות משותפת","w":["השפעה עקיפה של הסבים","משמעת כופה","השפעה של מערכת האקסו"],"e":"כשכל הורה תומך בהחלטות ובהורות של השני, זו הורות משותפת. השפעה של מערכת האקסו הייתה מגיעה ממסגרת שהילד לא חלק ממנה, כמו מקום העבודה."},{"q":"איך זוגיות עוינת משפיעה על ההורות?","a":"ההורים מפריעים זה לזה ומענישים יותר","w":["ההורים מקדישים יותר זמן לילד","ההורים נעשים מתירנים יותר","אין השפעה על ההורות"],"e":"בזוגיות עוינת ההורים מפריעים זה לזה, מענישים יותר ונענים פחות לילד. ההורים לא נעשים מתירנים יותר ולא מקדישים יותר זמן."}]},
"q6":{"t":"t1","v":[{"q":"ילדה מגיבה לסכסוך מתמשך בין ההורים בדאגה ופחד, ואחיה בכעס ותוקפנות. מה זה מדגים?","a":"בנות נוטות להפנמה, בנים להחצנה","w":["בנות נוטות להחצנה, בנים להפנמה","שני המינים מגיבים אותו דבר","רק בנים מושפעים מסכסוך"],"e":"מול סכסוך מתמשך בין ההורים, בנות נוטות לתגובות מופנמות (דאגה ופחד), ובנים לתגובות מוחצנות (כעס ותוקפנות). המסיח הראשון הופך ביניהם."},{"q":"איך סבים וסבתות משפיעים בעקיפין על הנכדים?","a":"דרך עצות, דוגמה ועזרה כספית להורים","w":["רק דרך מגורים משותפים עם המשפחה","רק דרך טיפול יומיומי בנכדים עצמם","הם לא משפיעים, רק ישירות כשהם שם"],"e":"סבים משפיעים בעקיפין, דרך ההורים: עצות, דוגמה ועזרה כספית. ההשפעה שלהם לא מוגבלת למגורים משותפים או לטיפול יומיומי."}]},
"q7":{"t":"t2","v":[{"q":"מה משתנה בהתנהגות ההורים כשהתינוק מגיע לגיל שנה?","a":"פחות טיפול פיזי, יותר דיבור ומשמעת","w":["יותר טיפול פיזי ופחות דיבור עם הילד","פחות משחק משותף ויותר זמן של שינה","אין שינוי משמעותי עד גיל שלוש בערך"],"e":"כשהתינוק גדל, ההורים עוברים מטיפול פיזי ליותר דיבור ומשמעת. ההורות משתנה יחד עם הילד, ולא נשארת קבועה עד גיל שלוש."},{"q":"למה רבים העימותים בתחילת ההתבגרות?","a":"המתבגר רוצה עצמאות, וההורים רוצים קרבה","w":["ההורים רוצים עצמאות, המתבגר קרבה","המתבגר עוזב את הבית","ההורים מפסיקים להתעניין"],"e":"בתחילת ההתבגרות המתבגר רוצה עצמאות וההורים רוצים לשמור על קרבה, ולכן העימותים רבים. המסיח הראשון הופך את הצרכים."}]},
"q8":{"t":"t2","v":[{"q":"אילו שינויים הפכו את המשפחות לקטנות ומגוונות יותר?","a":"פחות ילודה, יותר גירושים והורות מאוחרת","w":["יותר ילודה, פחות גירושים והורות מוקדמת","פחות עבודה של נשים ויותר משפחות גדולות","הורות מוקדמת יותר וגירושים נדירים יותר"],"e":"פחות ילודה, יותר גירושים והורות מאוחרת הפכו את המשפחות לקטנות ומגוונות יותר. לצד זה, הקבלה של הומוסקסואליות התרחבה."},{"q":"מה מיוחד במשפחה לעומת יחידות חברתיות אחרות?","a":"היא נדרשת להסתגל לשינויים גדולים בתוכה","w":["היא לא משתנה מהותית לאורך השנים","היא מושפעת בעיקר מהחוק ומהמדינה","היא יחידה זמנית שמתפרקת בהתבגרות"],"e":"משפחה צריכה להסתגל כל הזמן לשינויים גדולים בתוכה: הילדים גדלים, וגם ההורים מתבגרים. היא לא יחידה קבועה שלא משתנה."}]},
"q9":{"t":"t2","v":[{"q":"מהם שלושת רכיבי המעמד הסוציו־אקונומי?","a":"השכלה, יוקרת עיסוק והכנסה","w":["הכנסה, מגורים ומספר ילדים","השכלה, דת ומוצא","גיל, מין והכנסה"],"e":"שלושת רכיבי המעמד הסוציו־אקונומי (SES) הם השכלה, יוקרת עיסוק והכנסה. מקום מגורים ומספר ילדים אינם רכיבים שלו."},{"q":"שתי משפחות עם אותה הכנסה: באחת ההורים רופאים, בשנייה סוחרים. במה הן שונות?","a":"ברכיבים אחרים של ה-SES","w":["ב-SES, כי ההכנסה זהה","במעמד הכלכלי בלבד","הן לא שונות כלל"],"e":"ל-SES יש שלושה רכיבים. גם כשההכנסה זהה, המשפחות שונות בהשכלה וביוקרת העיסוק, ולכן ה-SES שלהן לא זהה."}]},
"q10":{"t":"t2","v":[{"q":"אילו תכונות מדגישים הורים ממעמד נמוך כשהם נשאלים מה ירצו בילדיהם?","a":"צייתנות, נימוס, סדר וניקיון","w":["סקרנות, אושר ויצירתיות","עצמאות ושליטה עצמית","הישגים ותחרותיות"],"e":"הורים ממעמד נמוך מדגישים תכונות חיצוניות: צייתנות, נימוס, סדר וניקיון. הורים ממעמד גבוה מדגישים סקרנות, אושר ועצמאות."},{"q":"מה נכון לגבי עיתוי וגודל המשפחה לפי SES?","a":"בעבודות כפיים מביאים ילדים מוקדם ויותר","w":["בעבודות כפיים מביאים פחות ילדים","במעמד גבוה מביאים ילדים מוקדם","אין הבדל לפי מעמד"],"e":"במשפחות שבהן ההורים עובדים בעבודות כפיים, נוטים להביא ילדים מוקדם יותר ויותר ילדים. במעמד גבוה מביאים ילדים מאוחר ופחות."}]},
"q11":{"t":"t2","v":[{"q":"מה הגורם שתורם הכי הרבה להבדלים בגידול הילדים בין המעמדות?","a":"השכלת ההורים","w":["גובה ההכנסה","מספר הילדים","מקום המגורים"],"e":"השכלת ההורים היא הגורם שתורם הכי הרבה להבדלים בגידול הילדים בין המעמדות, כי השכלה מלמדת לחשוב ברעיונות מופשטים. גובה ההכנסה תורם פחות."},{"q":"למה הורים ממעמד נמוך משתמשים יותר במשמעת כופה?","a":"עקה גבוהה, וחוסר אונים מהעבודה שמשוחזר בבית","w":["כי הם פחות קשורים רגשית לילדיהם","כי זו הנורמה שהחוק מעודד במעמד הזה","כי ילדיהם מתנהגים גרוע יותר מלכתחילה"],"e":"במעמד נמוך העקה גבוהה, וחוסר האונים שחווים בעבודה עובר גם לבית. לכן משתמשים יותר במשמעת כופה. זה לא בגלל שהם אוהבים פחות את ילדיהם."}]},
"q12":{"t":"t2","v":[{"q":"ממתי SES גבוה קשור להתפתחות שפתית טובה יותר?","a":"כבר מהשנה השנייה","w":["רק מגיל בית הספר","רק בגיל ההתבגרות","רק בבגרות"],"e":"הקשר בין SES גבוה להתפתחות שפתית טובה יותר מופיע כבר מהשנה השנייה, כלומר ההשפעה מתחילה מוקדם, ולא רק בבית הספר."},{"q":"מה מאפיין הורים ממעמד גבוה עם ילדים גדולים?","a":"יותר חום והסברים, ויותר החלטות לילד","w":["יותר ענישה, פחות הסברים ופחות חום","פחות זמן משותף ופחות שבחים לילד","פחות ציפיות להישגים ויותר חופש"],"e":"הורים ממעמד גבוה לילדים גדולים יותר מגלים יותר חום והסברים, ונותנים לילד יותר מקום בהחלטות. הם גם מציבים יעדים גבוהים, ולא פחות ציפיות."}]},
"q13":{"t":"t3","v":[{"q":"מה הייתה אחת התוצאות של המאבק של מלאלה יוספזאי?","a":"חוק חינוך חובה ראשון בפקיסטאן","w":["סגירת בתי ספר לבנים באזור סוואט","ביטול לימודי המתמטיקה לבנות בכפרים","הגבלת חינוך החובה לגיל 10 בלבד"],"e":"אחת התוצאות של המאבק של מלאלה הייתה חוק חינוך החובה הראשון בפקיסטאן, חינוך חינם לגילים 5 עד 16. המאבק לא הגביל את החינוך."},{"q":"איזה חלק מהמבוגרים שאינם יודעים קרוא וכתוב בעולם הם נשים?","a":"כמעט שני שלישים","w":["כמחצית בערך","כרבע בערך","כמעט כולם"],"e":"כמעט שני שלישים מהמבוגרים בעולם שאינם יודעים קרוא וכתוב הם נשים. זה פער מגדרי גדול, יותר ממחצית."}]},
"q14":{"t":"t3","v":[{"q":"מי הם רוב הילדים בגיל בית ספר שלא לומדים בעולם?","a":"בנות מבתים עניים","w":["בנים מבתים עניים","בנות מבתים עשירים","ילדים מערים גדולות"],"e":"רוב הילדים בגיל בית ספר שלא לומדים הם בנות מבתים עניים: שילוב של מגדר ועוני. בנים מבתים עניים לומדים יותר מאחיותיהם."},{"q":"מה כתבה מלאלה כשהייתה בת 11?","a":"בלוג בשם בדוי על החיים תחת הטליבאן","w":["ספר זיכרונות שפורסם בשמה האמיתי","מכתב פתוח לאו״ם על זכויות בנות","הצעת חוק שהוגשה לפרלמנט בפקיסטאן"],"e":"בגיל 11 מלאלה כתבה בלוג לבי־בי־סי, בשם בדוי, על החיים תחת הטליבאן. היא לא כתבה בשמה האמיתי, כי זה היה מסוכן."}]},
"q15":{"t":"t3","v":[{"q":"במחקר ארבע המדינות, מה הסביר את הקשר בין השכלת האם לבריאות הילד?","a":"כישורי האוריינות של האם","w":["ההכנסה הכוללת של המשפחה","גודל המשפחה ומספר האחים","הגיל של האם בלידה הראשונה"],"e":"במחקר ארבע המדינות, כישורי האוריינות של האם, היכולת שלה לקרוא ולהבין, הסבירו את הקשר בין השכלתה לבריאות הילד. ההסבר לא היה ההכנסה של המשפחה."},{"q":"מה נמצא לגבי אמהות משכילות ואוצר המילים של ילדיהן?","a":"הן הגיבו יותר מילולית, ולילדים היה אוצר מילים גדול","w":["אין הבדל באוצר המילים בין הקבוצות","לילדים שלהן היה אוצר מילים קטן יותר","הן דיברו פחות עם התינוקות, אבל קראו יותר"],"e":"אמהות משכילות הגיבו יותר מילולית לקולות של התינוקות, ולילדים שלהן היה אוצר מילים גדול יותר. הן לא דיברו פחות עם התינוקות."}]},
"q16":{"t":"t3","v":[{"q":"מהו המחסום הגדול ביותר לשליחת בנות לבית הספר?","a":"שכר לימוד יקר","w":["מחסור במורות","מרחק מבית הספר","חוסר עניין של הבנות"],"e":"שכר לימוד יקר, שלפעמים מגיע לשליש מהכנסת המשפחה, הוא המחסום הגדול ביותר לשליחת בנות לבית הספר. המרחק לא היה המחסום העיקרי."},{"q":"מה נמצא בנפאל לגבי אמהות משכילות, גם בלי קשר להכנסה?","a":"הן העשירו את הבית והחזיקו ציפיות גבוהות","w":["הן עבדו יותר שעות מחוץ לבית","ילדיהן למדו פחות שנים בבית הספר","הן נישאו מאוחר יותר, וזה כל ההבדל"],"e":"בנפאל, גם בלי קשר להכנסה, אמהות משכילות העשירו את הבית, החזיקו ציפיות גבוהות והקנו לילדיהן כישורים אקדמיים. ההשפעה לא הסתכמה בגיל הנישואין."}]},
"q17":{"t":"t4","v":[{"q":"מה מצאה לותר אצל צעירים מפרברים עשירים?","a":"כבר בכיתה ז עד 10% עם בעיות חמורות","w":["כמעט אין אצלם בעיות רגשיות או סמים","פחות בעיות מאשר אצל בני מעמד נמוך","בעיות מופיעות רק מגיל 18 ומעלה"],"e":"לותר מצאה שכבר בכיתה ז עד 10% מהצעירים בפרברים עשירים סובלים מבעיות חמורות: סמים, חרדה ודיכאון. עושר לא מגן מפני בעיות רגשיות."},{"q":"אצל מתבגרים אמידים בלבד, שימוש בסמים היה קשור לחרדה ודיכאון. מה זה מרמז?","a":"שהסמים שימשו להקלה על הסבל","w":["שהסמים גרמו לעושר","שהחרדה לא קשורה לסמים","שאין להם בעיות אמיתיות"],"e":"אצל מתבגרים אמידים בלבד, השימוש בסמים היה קשור לחרדה ולדיכאון, וזה מרמז שהם השתמשו בסמים כדי להקל על הסבל, כ״תרופה עצמית״."}]},
"q18":{"t":"t4","v":[{"q":"מה מגן גם על מתבגרים אמידים וגם על בני מעמד נמוך?","a":"ארוחות ערב משותפות עם ההורים","w":["דמי כיס גבוהים","חוגים רבים אחרי הלימודים","בית ספר פרטי"],"e":"ארוחות ערב משותפות עם ההורים מגנות גם על מתבגרים אמידים וגם על בני מעמד נמוך, כי הן זמן משפחתי קבוע. עושר או חוגים לא מחליפים אותן."},{"q":"למה רבים מהנוער האמיד מתקשים?","a":"פחות קרבה והשגחה, ולחץ מוגזם להישגים","w":["חוסר במשאבים חומריים בבית ובשכונה","בתי ספר גרועים עם מורים לא מקצועיים","יותר מדי זמן משותף עם ההורים"],"e":"רבים מהנוער האמיד מתקשים בגלל פחות קרבה והשגחה מצד ההורים, ולחץ מוגזם להישגים. הבעיה איננה מחסור במשאבים חומריים."}]},
"q19":{"t":"t4","v":[{"q":"איזה אחוז מהילדים בארה״ב חיים מתחת לקו העוני?","a":"כ-22%","w":["כ-5%","כ-50%","כ-10%"],"e":"כ-22% מהילדים בארה״ב חיים מתחת לקו העוני. זה נתון גבוה למדינה עשירה."},{"q":"מהו ״עוני מרוד״?","a":"הכנסה מתחת לחצי מקו העוני","w":["הכנסה מעט מתחת לקו העוני","הכנסה בדיוק על קו העוני","הכנסה של משפחה בלי עבודה"],"e":"עוני מרוד הוא הכנסה מתחת לחצי מקו העוני. כמעט 10% מהילדים בארה״ב חיים בעוני כזה."}]},
"q20":{"t":"t4","v":[{"q":"באיזו קבוצה שיעור העוני קרוב ל-50%?","a":"אמהות יחידות עם ילדים בגיל הגן","w":["משפחות עם שני הורים עובדים","קשישים שגרים לבד","זוגות צעירים בלי ילדים"],"e":"שיעור העוני קרוב ל-50% אצל אמהות יחידות עם ילדים בגיל הגן, וזו הקבוצה הפגיעה ביותר. משפחות עם שני הורים עובדים רחוקות מזה."},{"q":"מה נכון לגבי עוני ילדים בישראל, לפי ההערה בספר?","a":"גבוה בהרבה מממוצע OECD","w":["נמוך מממוצע OECD","שווה לממוצע OECD","נמוך בהרבה מארה״ב"],"e":"לפי ההערה בספר, עוני הילדים בישראל גבוה בהרבה מממוצע OECD: 23.8% לעומת 13.5%."}]},
"q21":{"t":"t4","v":[{"q":"שני ילדים עניים: אחד בעוני קצר בגיל 12, השני בעוני ממושך מלידה. מי בסיכון גבוה יותר?","a":"השני, כי העוני מוקדם וממושך","w":["הראשון, כי הוא מבוגר יותר","שניהם באותה מידה","אף אחד, כי עוני לא משפיע"],"e":"עוני מוקדם, עמוק וממושך מזיק יותר, ולכן הילד שחי בעוני מלידה נמצא בסיכון גבוה יותר. גיל מבוגר יותר בתחילת העוני דווקא מקטין את הסיכון."},{"q":"איך העוני משפיע על המשפחה?","a":"עקה מובילה לדיכאון ולאינטראקציות עוינות","w":["הוא מחזק את הקשר בין בני המשפחה","הוא לא משפיע על איכות ההורות","הוא מקטין סכסוכים כי יש פחות על מה לריב"],"e":"העוני יוצר עקה, העקה מובילה לדיכאון אצל ההורים, ובני המשפחה נעשים רגזנים ועוינים זה לזה. העוני לא מחזק את הקשר המשפחתי."}]},
"q22":{"t":"t4","v":[{"q":"איזה חלק ממחוסרי הדיור בארה״ב הם ילדים ובני נוער?","a":"כ-40%","w":["כ-5%","כ-80%","כ-15%"],"e":"כ-40% ממחוסרי הדיור בארה״ב הם ילדים ובני נוער. זה נתון מדאיג, הרבה יותר מ-5%."},{"q":"מהן שתי הסיבות העיקריות לעלייה במחוסרי הדיור?","a":"פחות דיור בר־השגה ויותר עוני","w":["יותר גירושים ויותר אבטלה","פחות עבודה ויותר הגירה","יותר מחלות ויותר אלכוהול"],"e":"שתי הסיבות העיקריות לעלייה במחוסרי הדיור הן מחסור בדיור בר־השגה ויותר עוני, כלומר גורמים של מדיניות וכלכלה."}]},
"q23":{"t":"t4","v":[{"q":"מה כללה ההתערבות להורים עניים שתוארה בפרק?","a":"הכשרה בהתמודדות עם עקה ובהורות חיובית","w":["מענק כספי חד־פעמי לכל משפחה","מעבר דירה לשכונה עם פחות עוני","טיפול תרופתי לדיכאון של ההורים"],"e":"ההתערבות כללה 14 שעות הכשרה להורים בהתמודדות עם עקה ובהורות חיובית. היא לא כללה מענק כספי."},{"q":"מה היו תוצאות ההתערבות?","a":"פחות דיכאון להורים ופחות בעיות לילדים","w":["אין שינוי אצל ההורים או הילדים","שיפור רק אצל ההורים, לא אצל הילדים","שיפור רק אצל הילדים, לא אצל ההורים"],"e":"ההתערבות הפחיתה את הדיכאון של ההורים ואת הבעיות של הילדים, וההשפעה נשמרה גם אחרי 18 חודשים. היא שיפרה את שניהם, ולא רק אחד מהם."}]},
"q24":{"t":"t4","v":[{"q":"למה תוכניות לילדים עניים הן רבות־ממדים?","a":"כי הם חווים מצוקות רבות במקביל","w":["כי זה זול יותר","כי ילדים עניים לא צריכים עזרה","כי חוק מחייב זאת"],"e":"ילדים עניים חווים מצוקות רבות במקביל, במשפחה, בהורות ובילד עצמו, ולכן תוכניות לעזרה להם צריכות להיות רבות־ממדים. הסיבה איננה שזה זול יותר."},{"q":"מה הפרק אומר על ילדים רבים ממשפחות עניות?","a":"רבים מסתדרים יפה בזכות גורמי חוסן","w":["כמעט כולם נכשלים בבית הספר","אף אחד מהם לא מצליח בבגרות","הם לא מושפעים מהעוני בכלל"],"e":"עוני מגדיל את הסיכון, אבל לא קובע גורל: רבים מהילדים ממשפחות עניות מסתדרים יפה, בזכות גורמי חוסן."}]},
"q25":{"t":"t5","v":[{"q":"משפחות עניות קיבלו שוברים למעבר לשכונות עם פחות עוני. מה נמצא?","a":"הילדים היו בריאים יותר והצליחו יותר","w":["הילדים התקשו בהסתגלות ונכשלו","לא היה שום שינוי","רק ההורים הרוויחו מהמעבר"],"e":"ילדים שעברו לשכונות עם פחות עוני היו בריאים יותר והצליחו יותר. זה מראה שהשכונה עצמה משפיעה על ההתפתחות."},{"q":"על מי משאבי השכונה משפיעים יותר?","a":"על צעירים במצוקה כלכלית","w":["על צעירים מבתים עשירים","על מבוגרים בלבד","על כולם באותה מידה"],"e":"משאבי השכונה משפיעים יותר על צעירים במצוקה כלכלית, שזקוקים להם יותר. צעירים מבתים עשירים מקבלים הרבה מהמשאבים בבית."}]},
"q26":{"t":"t5","v":[{"q":"ילדים מהבתים והשכונות הכאוטיים ביותר השתתפו הכי פחות בחוגים. מה המסקנה?","a":"הנזקקים ביותר מחמיצים הכי הרבה","w":["חוגים לא מעניינים ילדים עניים","חוגים יקרים מדי לכולם","אין קשר בין שכונה להשתתפות"],"e":"דווקא הילדים מהבתים והשכונות הכאוטיים ביותר, שהכי צריכים פעילות מסודרת, השתתפו הכי פחות בחוגים. הנזקקים ביותר מחמיצים הכי הרבה, והפער מתרחב."},{"q":"מה מאפיין קהילות כפריות עניות במיוחד?","a":"בידוד והיעדר שירותי תמיכה","w":["צפיפות, רעש ומחסור במרחב","הרבה פשיעה ואלימות ברחוב","עודף שירותים שאינם מתואמים"],"e":"בקהילות כפריות עניות יש בידוד והיעדר שירותי תמיכה, ולכן קשה להגיע לעזרה. צפיפות ורעש מאפיינים יותר שכונות עירוניות."}]},
"q27":{"t":"t5","v":[{"q":"איזו מהן היא דרך שבה הקהילה תומכת בהורים?","a":"נגישות למידע ולשירותים","w":["קביעת כללי משמעת בבית","בחירת חברים לילדים","החלטה על גודל המשפחה"],"e":"הקהילה תומכת בהורים דרך נגישות למידע ולשירותים: עבודה, דיור וטיפול בילדים. כללי המשמעת בבית נקבעים בתוך המשפחה, ולא בקהילה."},{"q":"על מה התבססה התוכנית המוצלחת ביותר במיזם הקנדי?","a":"על בית ספר יסודי, עם ביקורי בית","w":["על בית חולים מקומי ומרפאה","על מרכז ספורט קהילתי גדול","על חנות מכולת קהילתית בזול"],"e":"התוכנית המוצלחת ביותר במיזם הקנדי התבססה על בית ספר יסודי, עם העשרה וביקורי בית. היא לא התבססה על בית חולים או על מרכז ספורט."}]},
"q28":{"t":"t5","v":[{"q":"שכן רואה נער מבריז ומתקשר להוריו. מה זה מדגים?","a":"מבוגרים בשכונה עוזרים ישירות לילדים","w":["התערבות לא רצויה בפרטיות המשפחה","השפעה של ערכי מערכת המאקרו","משמעת כופה מצד מבוגר זר"],"e":"שכן שמתקשר להורים של נער שמבריז מדגים איך מבוגרים בשכונה עוזרים ישירות לילדים: בהשגחה, כמודלים וביחס חם. זו לא משמעת כופה."},{"q":"מה הייתה מטרת המיזם הקנדי באונטריו?","a":"למנוע את השלכות העוני","w":["להגדיל את מספר בתי הספר","לבנות דיור חדש","להפחית מסים למשפחות"],"e":"מטרת המיזם הקנדי באונטריו הייתה למנוע את ההשלכות של העוני, כמו כישלון בבית הספר ועבריינות. הוא לא נועד לבנות דיור או להפחית מסים."}]},
"q29":{"t":"t5","v":[{"q":"כמה שעות מבלה ילד אמריקני בבית הספר עד סוף התיכון?","a":"כ-14,000","w":["כ-1,400","כ-140,000","כ-4,000"],"e":"עד סוף התיכון, ילד אמריקני מבלה כ-14,000 שעות בבית הספר, ולכן לבית הספר יש השפעה עצומה."},{"q":"באילו תחומים נבדלים בתי ספר זה מזה, לפי הפרק?","a":"סביבה פיזית, תפיסה חינוכית וחיי חברה","w":["רק בתקציב ובציוד","רק בגודל הכיתות","רק בשעות הלימודים"],"e":"בתי ספר נבדלים בשלושה תחומים: הסביבה הפיזית, התפיסה החינוכית וחיי החברה. ההבדלים לא מסתכמים בתקציב."}]},
"q30":{"t":"t5","v":[{"q":"למה הורים ממעמד נמוך מעורבים פחות בבית הספר?","a":"הם לא מרגישים בנוח שם, ומותשים מעקה","w":["כי לא אכפת להם מהלימודים של הילדים","כי בתי הספר לא מאפשרים להם להגיע","כי הילדים מבקשים מהם שלא יבואו"],"e":"הורים ממעמד נמוך פחות מעורבים בבית הספר כי הם לא מרגישים בו בנוח, ומותשים מגורמי עקה יומיומיים. זה לא כי לא אכפת להם מהילדים."},{"q":"מה נמצא לגבי בתי ספר עם הרבה מעורבות הורים?","a":"ההישגים בהם טובים במיוחד","w":["ההישגים בהם נמוכים","אין קשר להישגים","יש בהם יותר בעיות משמעת"],"e":"בבתי ספר עם הרבה מעורבות הורים ההישגים טובים במיוחד. מעורבות של הורים מועילה לילדים."}]},
"q31":{"t":"t6","v":[{"q":"מהי ההשקפה הרווחת בארה״ב לגבי גידול ילדים קטנים?","a":"זו אחריות של ההורים בלבד","w":["זו אחריות של המדינה","זו אחריות של הקהילה","זו אחריות של בית הספר"],"e":"בארה״ב רווחת ההשקפה שגידול ילדים קטנים הוא אחריות ההורים בלבד, מתוך ערכים של עצמאות ופרטיות. המדינה לא נתפסת כאחראית."},{"q":"מה אחת ההשלכות של ההשקפה האמריקנית?","a":"תמיכה חלשה בהטבות כמו חופשת לידה בתשלום","w":["חופשת לידה ארוכה בתשלום לכל ההורים","מעונות יום חינם לכל הילדים","ביטוח בריאות אוניברסלי לכל המשפחות"],"e":"בגלל ההשקפה האמריקנית, התמיכה בהטבות כמו חופשת לידה בתשלום חלשה. אין בארה״ב חופשת לידה ארוכה לכולם."}]},
"q32":{"t":"t6","v":[{"q":"למה רבים מאיתנו לא מודעים למורשת התרבותית שלנו?","a":"כי רואים אותה רק מול תרבות אחרת","w":["כי היא כמעט לא משפיעה עלינו","כי היא נשכחת אחרי הילדות","כי לרוב האנשים אין מורשת כזו"],"e":"קשה לראות את המורשת התרבותית שלנו מבפנים, כי היא נראית לנו טבעית. רואים אותה רק בהשוואה לתרבות אחרת. זה לא אומר שאין לנו מורשת."},{"q":"באיזו מערכת של ברונפנברנר עוסק ״ההקשר התרבותי״?","a":"מאקרו","w":["מיקרו","מזו","אקסו"],"e":"ההקשר התרבותי, ערכים ומנהגים של החברה, שייך למערכת המאקרו של ברונפנברנר. מיקרו הוא הסביבה הקרובה של הילד."}]},
"q33":{"t":"t6","v":[{"q":"קהילה שחולקת את רוב ערכי החברה, אבל שומרת על מנהגים משלה. מה זה?","a":"תרבות משנה","w":["תרבות דומיננטית","מערכת מאקרו","תרבות קולקטיביסטית"],"e":"קהילה שחולקת את רוב ערכי החברה, אבל שומרת על מנהגים משלה, היא תרבות משנה, למשל קהילה אתנית. התרבות הדומיננטית היא של רוב החברה."},{"q":"מהו ״פמיליזם״?","a":"האידיאל ההיספני של קשרי משפחה הדוקים","w":["העדפה של משפחה גרעינית קטנה ועצמאית","עצמאות מוקדמת של הילדים מהמשפחה","גידול ילדים בידי הקהילה ולא ההורים"],"e":"פמיליזם הוא האידיאל ההיספני של קשרי משפחה הדוקים: מגע תכוף ומענה לצורכי המשפחה. הוא לא מעדיף משפחה גרעינית קטנה."}]},
"q34":{"t":"t6","v":[{"q":"אם מתבגרת שגרה עם סבתה ודודתה מסיימת תיכון ועובדת. מה הספר היה אומר?","a":"קשר חם למשפחה המורחבת עוזר","w":["זה מקרה חריג ולא מייצג","המשפחה המורחבת מפריעה","היא הייתה מצליחה גם לבד"],"e":"הספר היה מציין שקשר חם עם המשפחה המורחבת, כמו סבתא ודודה, עוזר לאמהות מתבגרות להצליח. זה לא מקרה חריג."},{"q":"מאיפה מגיעה מסורת המשפחה המורחבת האפריקנית־אמריקנית?","a":"מהמורשת האפריקנית","w":["מהתרבות האירופית","מחוקי ארה״ב","מהתרבות האסיאתית"],"e":"מסורת המשפחה המורחבת האפריקנית־אמריקנית מגיעה מהמורשת האפריקנית, שבה זוגות צעירים גרים עם המשפחה. היא לא מגיעה מהתרבות האירופית."}]},
"q35":{"t":"t6","v":[{"q":"תרבות שבה מטרות המשפחה קודמות לרצונות האישיים. איזו תרבות זו?","a":"קולקטיביסטית","w":["אינדיווידואליסטית","תרבות משנה","תרבות דומיננטית"],"e":"בתרבות קולקטיביסטית מטרות המשפחה והקבוצה קודמות לרצונות האישיים, עם דגש על תלות הדדית והרמוניה. אינדיווידואליסטית היא ההפך."},{"q":"למה ההבחנה בין קולקטיביזם לאינדיווידואליזם שנויה במחלוקת?","a":"כי שני סוגי הערכים קיימים ברוב התרבויות","w":["כי אין הבדל אמיתי בין תרבויות","כי היא נבדקה רק בארה״ב ובאירופה","כי היא חדשה מדי ועוד לא נבדקה"],"e":"ההבחנה שנויה במחלוקת, כי ברוב התרבויות קיימים שני סוגי הערכים יחד. זה לא אומר שאין הבדל בין תרבויות."}]},
"q36":{"t":"t6","v":[{"q":"איך ארה״ב משתווה למערב אירופה בממד הקולקטיביזם?","a":"אינדיווידואליסטית יותר","w":["קולקטיביסטית יותר","דומה מאוד למערב אירופה","לא נבדקה בהקשר הזה"],"e":"ארה״ב אינדיווידואליסטית יותר ממערב אירופה, עם דגש על עצמאות. היא לא קולקטיביסטית יותר."},{"q":"באילו תרבויות משנה נוספות יש משפחות מורחבות מעורבות?","a":"אסיאתיות, ילידיות והיספניות","w":["רק אירופיות","רק אפריקניות","באף תרבות אחרת"],"e":"משפחות מורחבות מעורבות קיימות גם בתרבויות משנה אסיאתיות, ילידיות והיספניות, ולא רק בתרבות האפריקנית־אמריקנית."}]},
"q37":{"t":"t7","v":[{"q":"מדינה מחוקקת חוק שמבטיח ארוחה חמה בכל בית ספר. מה זה?","a":"מדיניות ציבורית","w":["תרבות משנה","הורות משותפת","מערכת מזו"],"e":"חוק שמבטיח ארוחה חמה בכל בית ספר הוא מדיניות ציבורית: חוקים ותוכניות ממשלתיות לקידום רווחת ילדים. תרבות משנה היא קהילה, לא חוק."},{"q":"מה מראה טבלה 2.5 לגבי ארה״ב?","a":"היא לא בין המובילות באף מדד","w":["היא מובילה בכל המדדים","היא מובילה במדדי בריאות","היא מובילה במדדי חינוך"],"e":"טבלה 2.5 מראה שארה״ב לא נמצאת בין המדינות המובילות באף אחד ממדדי הבריאות ורווחת הילדים. היא לא מובילה בשום מדד."}]},
"q38":{"t":"t7","v":[{"q":"למה כ-11% מהילדים הזכאים לביטוח בריאות בארה״ב לא מכוסים?","a":"הורים לא מבוטחים לא יודעים איך לרשום","w":["כי ההורים מעדיפים לא לבטח","כי הביטוח יקר מדי למשפחות","כי הם לא אזרחים ולא זכאים"],"e":"כ-11% מהילדים הזכאים לביטוח בריאות בארה״ב לא מבוטחים, כי ההורים שלהם, שאינם מבוטחים בעצמם, לא יודעים איך לרשום אותם. זה פער מידע, ולא חוסר רצון."},{"q":"מה עשה חוק הטיפול בר־ההשגה (2010)?","a":"הרחיב ביטוח לכל ילדי משפחות מעוטות הכנסה","w":["ביטל את ביטוח הבריאות הציבורי","ביטח רק מבוגרים עובדים","ביטח רק קשישים וגמלאים"],"e":"חוק הטיפול בר־ההשגה (2010) הרחיב את ביטוח הבריאות לכל ילדי המשפחות מעוטות ההכנסה, והשאיר את הביטוח למבוגרים להחלטת המדינות."}]},
"q39":{"t":"t7","v":[{"q":"למה ילדים ״נעלמים״ בקלות בקביעת מדיניות?","a":"כי הם לא מצביעים","w":["כי הם לא חשובים","כי אין עליהם נתונים","כי ההורים מתנגדים"],"e":"ילדים לא מצביעים ולא יכולים להגן על האינטרסים שלהם, ולכן בקלות ״נעלמים״ בקביעת מדיניות. זה לא אומר שהם לא חשובים."},{"q":"מתי מעבר מרווחה לעבודה מזיק לילדים?","a":"כשהשכר נמוך מאוד ומנציח עוני","w":["תמיד, בכל מצב ובכל שכר","אף פעם, עבודה תמיד עדיפה","רק כשההורה העובד הוא גבר"],"e":"מעבר מרווחה לעבודה מזיק לילדים כשהשכר נמוך מאוד ומנציח את העוני. כשהעבודה משפרת את המצב הכלכלי, הוא דווקא עוזר. זה לא מזיק בכל מצב."}]},
"q40":{"t":"t7","v":[{"q":"אם יחידה עוברת מרווחה לעבודה שמשפרת את מצבה הכלכלי. מה צפוי לילדים?","a":"פחות בעיות התנהגות ושיפור קוגניטיבי","w":["יותר בעיות בגלל היעדרות האם מהבית","אין שינוי ניכר אצל הילדים","הידרדרות בלימודים בשנה הראשונה"],"e":"כשהעבודה משפרת את המצב הכלכלי, יש פחות עקה והורות טובה יותר, ולכן פחות בעיות התנהגות ושיפור קוגניטיבי אצל הילדים. היעדרות האם לא מזיקה במקרה הזה."},{"q":"למה ניסיונות לסייע לילדים בארה״ב נתקלים בקושי?","a":"ערכי פרטיות גורמים לממשלה להסס","w":["אין מספיק כסף לתוכניות","אין חוקרים שעוסקים בתחום","הילדים עצמם מסרבים לעזרה"],"e":"ערכי פרטיות גורמים לממשלת ארה״ב להסס להתערב במשפחה, ולכן ניסיונות לעזור לילדים נתקלים בקושי. הבעיה איננה מחסור בחוקרים."}]},
"q41":{"t":"t7","v":[{"q":"מה מבטיחה האמנה בדבר זכויות הילד?","a":"בריאות, חינוך חינם והגנה מהתעללות","w":["זכות הצבעה לילדים מגיל 12","פטור מלימודים לילדים עובדים","זכות לעבוד בשכר מגיל 10"],"e":"האמנה בדבר זכויות הילד (1989, עצרת האו״ם) מבטיחה לילדים בריאות, חינוך חינם והגנה מהתעללות. היא לא נותנת להם זכות הצבעה."},{"q":"מה מעמדה של ארה״ב לגבי האמנה?","a":"אחת משתי המדינות שלא אשררו אותה","w":["הראשונה שאשררה את האמנה","היא זו שניסחה את האמנה","היא אשררה רק חלק מהסעיפים"],"e":"ארה״ב היא אחת משתי המדינות היחידות שלא אשררו את האמנה בדבר זכויות הילד. זה נתון מפתיע."}]},
"q42":{"t":"t7","v":[{"q":"מה עושה הקרן להגנה על ילדים?","a":"מחקר, חינוך, פעולה משפטית והצעות חוק","w":["מפעילה בתי ספר לילדים עניים","מעניקה אזרחות לילדי מהגרים","מגדלת ילדים במוסדות שלה"],"e":"הקרן להגנה על ילדים עוסקת בסינגור: מחקר, חינוך הציבור, פעולה משפטית והצעות חוק. היא לא מפעילה בתי ספר."},{"q":"איך חוקרים תורמים היום למדיניות לטובת ילדים?","a":"משתפים פעולה עם סוכנויות ומפיצים ממצאים","w":["מתמודדים בעצמם בבחירות","מחליטים בעצמם על תקציבים","כותבים את החוקים בעצמם"],"e":"חוקרים תורמים היום למדיניות כשהם משתפים פעולה עם סוכנויות ומפיצים ממצאים בדוחות, באתרים ובתקשורת. הם לא כותבים בעצמם את החוקים."}]},
"h1":{"t":"t1","v":[{"q":"אב מחמיא לאם על הטיפול בתינוק, היא רגועה יותר וסבלנית יותר עם התינוק. איך נקראת ההשפעה של האב?","a":"השפעה עקיפה של צד שלישי","w":["השפעה דו־כיוונית ישירה בין האב לתינוק","השפעת מערכת המאקרו","השפעה של מערכת האקסו"],"e":"האב משפיע על התינוק דרך האם. ברונפנברנר קרא לזה השפעת צד שלישי; כך פועלת גם הורות משותפת."}]},
"h2":{"t":"t1","v":[{"q":"ילדים שחשופים לסכסוך כרוני בין ההורים מגיבים לעתים בדאגה וניסיונות לתקן, ולעתים בכעס. מה הדפוס הטיפוסי לפי מגדר?","a":"בנות נוטות להפנמה, בנים להחצנה","w":["בנים נוטים להפנמה, ובנות נוטות להחצנה","שני המינים נוטים בעיקר להחצנה","שני המינים נוטים בעיקר להפנמה"],"e":"הפנמה (דאגה, פחד) שכיחה יותר אצל בנות; החצנה (כעס, תוקפנות) אצל בנים."}]},
"h3":{"t":"t2","v":[{"q":"למה, לפי הפרק, השכלת ההורים היא רכיב מרכזי ב־SES?","a":"היא מלמדת חשיבה מופשטת שמובילה להשקעה בהתפתחות הילד","w":["היא קובעת לבדה את הכנסת המשפחה ואת מעמדה","היא מקטינה את מספר הילדים במשפחה ולכן גם את העומס על ההורים","היא מגדילה את הזמן הפנוי של ההורים עם הילד"],"e":"שנות לימוד מלמדות לחשוב ברעיונות, ומכאן ההשקעה בהתפתחות קוגניטיבית וחברתית. גם תחושת שליטה בחיים משפיעה."}]},
"h4":{"t":"t3","v":[{"q":"במחקר ארבע המדינות, מה מחזק את הטענה שאוריינות האם היא הגורם ולא העושר?","a":"הקשר נשמר גם כשהחזיקו קבועות הכנסה והשכלת האב","w":["הממצאים הופיעו רק בערים ולא בכפרים","רק אמהות עם 12 שנות לימוד ומעלה הראו השפעה על הילדים","הקשר נמצא רק במדינה אחת מתוך ארבע"],"e":"בנפאל, בלי קשר להכנסה ולהשכלת האב. הממצאים היו זהים בכפר ובעיר, ואפילו מעט שנות לימוד השפיעו."}]},
"h5":{"t":"t4","v":[{"q":"במחקרי לותר, איזה ממצא נמצא רק אצל בני נוער אמידים?","a":"שימוש בחומרים היה במתאם עם חרדה ודיכאון","w":["שימוש בחומרים היה גבוה יותר מאשר אצל בני נוער עניים","ארוחות משותפות הגנו מפני בעיות","ציפיות להישגים היו גבוהות"],"e":"המתאם מרמז ששימוש בחומרים שימש כתרופה עצמית לסבל, נוהג שמנבא שימוש קבוע."}]},
"h6":{"t":"t5","v":[{"q":"מה הפרדוקס שעלה במחקר על השתתפות בפעילויות אחרי בית הספר בשכונות עניות?","a":"דווקא הנזקקים ביותר השתתפו הכי פחות","w":["הפעילויות דווקא פגעו בהישגים הלימודיים של המשתתפים","הפעילויות עזרו רק לילדים אמידים","ההורים העניים דרבנו יותר מהאמידים"],"e":"הילדים מהבתים הכי פחות מדרבנים ומהשכונות הכי כאוטיות השתתפו הכי פחות, למרות שהם היו מרוויחים הכי הרבה."}]},
"h7":{"t":"t6","v":[{"q":"למה ההבחנה בין קולקטיביזם לאינדיווידואליזם שנויה במחלוקת?","a":"שתי קבוצות הערכים קיימות ברוב התרבויות","w":["אין הבדלים עקביים בכלל בין מדינות שונות","היא נבדקה רק בארה״ב ובסין, ולא במקומות אחרים","היא מתאימה רק לתרבויות משנה ולא למדינות"],"e":"היא הנפוצה בהשוואות, אבל הערכים מעורבים בכל תרבות. ובכל זאת יש הבדלים עקביים, כמו ארה״ב מול מערב אירופה."}]},
"h8":{"t":"t7","v":[{"q":"מה מבין הבאים אינו אחת הסיבות שהפרק מציין לקושי לקדם מדיניות לטובת ילדים בארה״ב?","a":"מחקרים לא מצאו שמדיניות משפיעה","w":["ערכי אי־תלות ופרטיות","עלות גבוהה של תוכניות טובות לילדים","לילדים אין קול פוליטי משלהם"],"e":"שלוש הסיבות: ערכי התרבות, עלות, וחוסר קול. המחקר דווקא מראה שמדיניות שמחלצת מעוני עוזרת."}]}};
const H={"h1":{"t":"t1","v":[{"q":"אבא של שירה מחמיא לאמא שלה על הסבלנות שלה. אמא מרגישה מוערכת, ובערב משחקת עם שירה בסבלנות רבה מהרגיל. איזו השפעה זו?","a":"השפעה עקיפה (צד שלישי): אבא השפיע על שירה דרך אמא","w":["השפעה ישירה: אבא השפיע על שירה בעצמו, בלי שום מתווך","השפעה דו־כיוונית: שירה השפיעה על אבא, והוא השפיע עליה","השפעה של מערכת המאקרו: ערכי החברה השפיעו על המשפחה"],"e":"לפי ברונפנברנר, היחס בין שני אנשים מושפע ממי שנמצא סביבם. אבא לא דיבר עם שירה, אבל שינה את ההורות של אמא."},{"q":"סבתא נותנת להורים של יונתן עזרה כספית ועצות, ובזכות זה הם פחות לחוצים ויותר חמים איתו. איזו השפעה של סבתא זו?","a":"השפעה עקיפה: היא עוזרת ליונתן דרך ההורים שלו","w":["השפעה ישירה: היא נותנת ליונתן חום ותשומת לב בעצמה","השפעה דו־כיוונית: יונתן משפיע על סבתא, והיא עליו","השפעה של מערכת הכרונו: המשפחה משתנה עם הזמן"],"e":"סבים משפיעים ישירות (חום לנכד) ובעקיפין (עצות, עזרה כספית להורים). כאן ההשפעה עוברת דרך ההורים."}]},"h2":{"t":"t1","v":[{"q":"בסופר, ילד בן 3 צורח כשאמא לא קונה לו ממתק. אמא צועקת עליו, הוא צורח חזק יותר, והיא מגבירה את העונש. מה מתאר המקרה?","a":"השפעה דו־כיוונית במעגל שלילי: כל צד מחריף את השני","w":["השפעה עקיפה: אדם שלישי בסופר השפיע על שניהם","השפעה חד־כיוונית: רק ההורה משפיע על הילד, לא להפך","השפעה של מעמד: לחץ כלכלי גורם לאמא לא לקנות"],"e":"במשפחה כמערכת, ההתנהגות של כל צד מחזקת את של השני. במקרה של מג מהספר, נוצר מעגל של צעקות ועונשים."}]},"h3":{"t":"t1","v":[{"q":"הורים של נער מתווכחים בקולי קולות כמעט כל ערב, והוויכוחים לא נפתרים. הנער מתחיל להתפרץ בבית הספר ולהכות ילדים. איך מתאר הפרק את התגובה שלו?","a":"החצנה של מצוקה, תגובה שכיחה יותר בבנים לסכסוך כרוני","w":["הפנמה של מצוקה, תגובה שכיחה יותר בבנים לסכסוך כרוני","החצנה של מצוקה, תגובה שכיחה יותר בבנות לסכסוך כרוני","אישור התנהגותי, כי הוא מתנהג כמו שההורים מצפים"],"e":"סכסוך כרוני פוגע בביטחון הרגשי. בנות מגיבות יותר בהפנמה (פחד, דאגה), ובנים יותר בהחצנה (כעס, תוקפנות)."}]},"h4":{"t":"t2","v":[{"q":"שתי משפחות מרוויחות בדיוק אותו סכום. באחת שני ההורים מורים עם תואר שני, ובשנייה ההורים עובדים בעבודות שלא דורשות השכלה. האם הן באותו SES?","a":"לא, כי SES משלב גם השכלה ויוקרת עיסוק","w":["כן, כי SES נקבע לפי ההכנסה של המשפחה בלבד","כן, כי שתי המשפחות גרות כנראה באותה שכונה","לא, כי SES נקבע רק לפי שנות ההשכלה של האם"],"e":"SES משלב שלושה רכיבים: שנות השכלה, יוקרת העיסוק והכנסה. לכן הכנסה זהה לא אומרת מעמד זהה."}]},"h5":{"t":"t2","v":[{"q":"ילד שפך מיץ. הורה אחד אומר ״תנקה עכשיו, כמה פעמים אמרתי לך״, והשני שואל ״מה קרה? איך אפשר להחזיק את הכוס אחרת?״. מה הספר מנבא על ההבדל?","a":"הסגנון השני, השכיח ב־SES גבוה, מקדם שפה וחשיבה","w":["הסגנון הראשון, השכיח ב־SES גבוה, מקדם משמעת וחשיבה","שני הסגנונות שקולים, כי שניהם מבטאים אהבה לילד","הסגנון השני מזיק, כי הוא מוותר על גבולות ברורים"],"e":"ב־SES גבוה ההורים מדברים, מסבירים ושואלים יותר. זה קשור כבר בשנה השנייה לשפה ולחשיבה טובות יותר."}]},"h6":{"t":"t2","v":[{"q":"לפי הפרק, למה הורים ב־SES נמוך נוטים להדגיש צייתנות ונימוס?","a":"בעבודה הם רגילים לציית, וזה עובר לגידול הילדים","w":["כי הם אוהבים את הילדים שלהם פחות מהורים אמידים","כי חוקי המדינה דורשים מהם חינוך קפדני יותר","כי הילדים שלהם מתנהגים מלכתחילה גרוע יותר"],"e":"ההסבר בספר: תנאי העבודה (ציות לאחרים, חוסר שליטה) ולחץ בחיים משתקפים בהורות. אין כאן שאלה של אהבה."}]},"h7":{"t":"t3","v":[{"q":"במחקר בארבע מדינות, החוקרים השוו אמהות עם אוריינות שונה, אבל עם אותה הכנסה ואותה השכלה של האב. למה זה חשוב?","a":"כך הם הראו שהאוריינות של האם עצמה מסבירה את ההבדלים","w":["כך הם הראו שההכנסה היא הגורם המרכזי בבריאות הילדים","כך הם הראו שהשכלת האב חשובה יותר מזו של האם","כך הם יכלו לבחור רק משפחות עניות למחקר"],"e":"החזקת הכנסה והשכלת אב קבועות מוציאה אותן כהסברים אפשריים. מה שנשאר הוא הכישורים שהאוריינות נותנת לאם."}]},"h8":{"t":"t3","v":[{"q":"במדינה ענייה משפחה עם בן ובת יכולה לשלם שכר לימוד רק לילד אחד. לפי הפרק, מה צפוי, ומה ההשלכה לדור הבא?","a":"ישלחו את הבן, וילדי הבת יפסידו בבריאות ובחינוך","w":["ישלחו את הבת, כי בנות מצליחות יותר בלימודים","ישלחו את הבן, ובדור הבא לא תהיה לזה שום השפעה","יחלקו את הכסף, וכך שניהם ילמדו חצי שנה"],"e":"שכר לימוד הוא המחסום העיקרי, ובגללו משפחות עניות שולחות רק בנים. אמהות עם אוריינות מחסנות יותר ומדברות יותר עם הילדים."}]},"h9":{"t":"t4","v":[{"q":"נער מפרבר עשיר, עם חוגים וטלפון חדש, מתחיל לשתות ולהשתמש בסמים. ההורים עובדים עד מאוחר ודורשים ציונים מושלמים. איך מסביר זאת הפרק?","a":"לחץ להישגים והורים לא נגישים; הסמים ״תרופה עצמית״","w":["כסף רב מאפשר לקנות סמים, וזה ההסבר העיקרי לשימוש","נוער עשיר משתעמם יותר, ולכן מחפש ריגושים מסוכנים","הוא מחקה נוער עני מהשכונות הסמוכות לפרבר"],"e":"לפי מחקרי לותר, אצל נוער אמיד השימוש בסמים היה קשור לחרדה ודיכאון. ההורים עסוקים ולא זמינים, והדרישות גבוהות."}]},"h10":{"t":"t4","v":[{"q":"משפחה ענייה: האוטו התקלקל, החשמל נותק בגלל חוב, והאב איבד משמרות. האם צועקת על הילדים יותר מבעבר. איך מסביר זאת הפרק?","a":"לחצים מצטברים פוגעים במצב הרוח של ההורה, ודרכו בהורות","w":["העוני פוגע בילדים ישירות, בלי קשר להתנהגות ההורים","הורים עניים מעדיפים מלכתחילה סגנון חינוך נוקשה","הילדים במשפחות עניות מתנהגים גרוע יותר, וזה מעצבן"],"e":"העוני פועל בעיקר דרך הלחץ על ההורים: לחצים מצטברים ← הורה מדוכא ועוין ← הורות פוגענית."}]},"h11":{"t":"t4","v":[{"q":"שתי משפחות, אחת ענייה ואחת עשירה, רוצות להגן על הילדים מבעיות התנהגות. מה הפרק ממליץ שיעבוד אצל שתיהן?","a":"ארוחת ערב משותפת קבועה, שמבטאת הורה נגיש ומעורב","w":["חוגים רבים אחרי בית הספר, כדי שהילד יהיה עסוק","מעבר לשכונה עשירה יותר, כדי להתרחק מהשפעות רעות","מעקב קפדני אחרי הציונים, עם עונש על כל ירידה"],"e":"ארוחות משותפות קשורות לפחות בעיות גם אצל עניים וגם אצל אמידים, יחד עם חיבה, קבלה והשגחה."}]},"h12":{"t":"t5","v":[{"q":"משפחות קיבלו בהגרלה שוברים לעבור לשכונה פחות ענייה, והילדים שעברו היו בריאים יותר והצליחו יותר. למה דווקא ההגרלה חשובה?","a":"כך ההבדל נובע מהשכונה ולא מהבדלים בין המשפחות","w":["היא מבטיחה שרק המשפחות העניות ביותר יעברו דירה","היא מבטיחה שכל המשפחות יסכימו להשתתף במחקר","היא מבטיחה שהילדים לא יידעו שהם משתתפים במחקר"],"e":"בלי הגרלה, אולי רק משפחות מסוג מסוים היו בוחרות לעבור. ההגרלה הופכת את זה לניסוי, ואז אפשר להסיק סיבתיות."}]},"h13":{"t":"t5","v":[{"q":"עירייה פתחה מתנ״ס חינמי עם חוגים בשכונה ענייה. אחרי שנה מתברר שהילדים שהכי זקוקים לחוגים כמעט לא מגיעים. מה זה מדגים?","a":"את הפרדוקס בפרק: הנזקקים ביותר משתתפים הכי פחות","w":["שמשאבי שכונה לא משפיעים על התפתחות של ילדים עניים","שילדים עניים מעדיפים מלכתחילה לא להשתתף בחוגים","שמתנ״ס עוזר רק לילדים ממשפחות אמידות יותר"],"e":"משאבי שכונה חשובים במיוחד לילדים עניים, אבל דווקא הם משתתפים הכי מעט. לכן צריך לחשוב איך להגיע אליהם."}]},"h14":{"t":"t5","v":[{"q":"אמא של רועי מדברת עם המחנכת שלו כל שבוע, ומגיעה לכל אסיפת הורים. לאיזו שכבה של ברונפנברנר שייך הקשר הזה, ומה הוא מנבא?","a":"מזו (קשר בית־בית ספר); קשור להישגים טובים","w":["מערכת המיקרו (הבית בלבד); הוא קשור לשקט בבית","מערכת האקסו (עבודת האם); הוא קשור לפחות לחץ","מערכת המאקרו (ערכי החברה); הוא קשור לחוקים"],"e":"מזו = הקשרים בין סביבות קרובות של הילד. מעורבות של הורים בבית הספר קשורה להישגים טובים יותר."}]},"h15":{"t":"t6","v":[{"q":"אמא צעירה ויחידנית גרה עם הסבתא, שעוזרת בגידול התינוק ומעבירה לו את המסורת המשפחתית. איך הפרק מתאר מבנה כזה?","a":"משק בית של משפחה מורחבת, שמחלק משאבים ומגן מפני לחצים","w":["משפחה גרעינית קלאסית, שבה יש דור אחד של מבוגרים בבית","תרבות משנה, שהערכים שלה מנוגדים לחלוטין לחברה","מבנה שמזיק להתפתחות, כי הסבתא מתערבת בחינוך"],"e":"משק בית מורחב (ילד, הורה וקרוב מבוגר) נפוץ בכמה קבוצות ומסייע במיוחד לאמהות צעירות או יחידניות."}]},"h16":{"t":"t6","v":[{"q":"נערה אומרת ״אני אלמד רפואה כי זה מה שיעזור למשפחה שלי״. חברה שלה אומרת ״אלמד אמנות כי זה מה שמבטא אותי״. איזה הבדל בערכים מתואר?","a":"קולקטיביזם (מטרות המשפחה) מול אינדיווידואליזם (מטרות אישיות)","w":["אינדיווידואליזם (מטרות המשפחה) מול קולקטיביזם (מטרות אישיות)","תרבות משנה מול תרבות רוב, לפי הערכים של כל אחת","SES גבוה מול SES נמוך, לפי המקצוע שבחרו"],"e":"קולקטיביזם = מטרות הקבוצה קודמות. אינדיווידואליזם = ביטוי עצמי ועצמאות. הספר מציין שההבחנה שנויה במחלוקת, כי ברוב התרבויות יש את שניהם."}]},"h17":{"t":"t7","v":[{"q":"פוליטיקאי אומר: ״אין טעם להשקיע בתוכניות לילדים, הם לא מצביעים״. לאיזו סיבה בפרק זה מתאים?","a":"לילדים אין קול פוליטי, ולכן קשה לקדם בשבילם","w":["ערכי התרבות מתנגדים לכל תמיכה במשפחות","תוכניות לילדים זולות מכדי שיעניינו פוליטיקאים","ילדים מקבלים כבר את כל מה שהם צריכים מהבית"],"e":"הספר מונה שלוש סיבות: ערכי התרבות (לא להתערב במשפחה), העלות, ולילדים אין קול כי הם לא מצביעים."}]},"h18":{"t":"t7","v":[{"q":"רפורמה החזירה אמהות לעבודה. אצל משפחות שיצאו מעוני הילדים השתפרו, אבל אצל אמהות שעבדו בשכר נמוך מאוד הם נפגעו. מה הלקח?","a":"מדיניות עוזרת רק כשהיא מקלה; לחץ נוסף פוגע בהורות","w":["עבודה של אמהות תמיד פוגעת בילדים, בכל רמת שכר","כל מדיניות שמגדילה הכנסה תמיד תעזור לילדים","הילדים נפגעו כי האמהות פשוט רצו לעבוד פחות"],"e":"כשהעבודה הוציאה מעוני, זה עזר. כשהשכר היה נמוך מאוד, האמהות היו מותשות וההורות נעשתה קשוחה."}]}};
const SUM=`<h2>סיכום: פרק 2 - ההקשרים הסביבתיים של ההתפתחות</h2>
<div class="key"><b>למה הפרק הזה חשוב בפסיכולוגיה התפתחותית?</b> אחת השאלות הגדולות של התחום היא מה מעצב את הילד: <b>התורשה</b> או <b>הסביבה</b>. החלק הראשון של פרק 2 עוסק בגנים. החלק שלנו (עמ׳ 92–111) עוסק בצד השני, הסביבה, ומראה שהיא <b>מורכבת לא פחות מהתורשה</b>: היא מערך של שכבות שמשתלבות זו בזו. המסר המרכזי של הספר: <b>הסביבה, כמו התורשה, יכולה לקדם את ההתפתחות או לסכן אותה.</b><br><br>
<b>השאלה של הפרק במשפט אחד:</b> איך כל שכבה בסביבה של הילד, מהמשפחה ועד המדינה, משפיעה על ההתפתחות שלו?<br><br>
<b>הפרק בנוי כמו מסע מהשכבה הקרובה לרחוקה:</b><br>
① <b>המשפחה</b> (סעיף 1): ההקשר הראשון והחזק ביותר.<br>
② <b>המעמד הכלכלי־חברתי של המשפחה</b> (סעיפים 2–3): איך השכלה, עבודה והכנסה ״נכנסות הביתה״, ומה קורה בשני הקצוות, עוני ואמידות.<br>
③ <b>מה שמחוץ לבית</b> (סעיף 4): השכונה ובית הספר.<br>
④ <b>התרבות והמדינה</b> (סעיפים 5–6): ערכים, חוקים ותוכניות שמשפיעים על כל הילדים.<br>
<b>הקשר לשיעור:</b> בשיעור של 17.11 עושים עבודה בקבוצות: ניתוח מקרה לפי התיאוריה של ברונפנברנר. הסיכום הזה בנוי בדיוק כדי שתדעו לעשות את זה.</div>

<h3>מילון לפני שמתחילים: השכבות של ברונפנברנר</h3>
<p>בפרק 1 הכרנו את <b>תיאוריית המערכות האקולוגיות</b> של ברונפנברנר. הרעיון: הילד נמצא במרכז של כמה מעגלים, כמו בצל, וכל מעגל משפיע עליו. הפרק הזה ״נכנס״ לכל אחד מהמעגלים. כדי לא להתבלבל, הנה כל אחד עם דוגמה:</p>
<div class="tw"><table><tr><th>שכבה</th><th>מה היא בפשטות</th><th>דוגמה</th></tr>
<tr><td><b>מיקרו</b></td><td>הסביבות שהילד נמצא בהן <b>בעצמו</b>, פנים מול פנים</td><td>הבית, הגן, החברים</td></tr>
<tr><td><b>מזו</b></td><td>הקשרים <b>בין</b> הסביבות הקרובות</td><td>אמא שמדברת עם הגננת</td></tr>
<tr><td><b>אקסו</b></td><td>סביבות שהילד <b>לא</b> נמצא בהן, אבל הן משפיעות עליו</td><td>מקום העבודה של אבא, הקהילה, השכונה</td></tr>
<tr><td><b>מאקרו</b></td><td>ה״אקלים״ הרחב: ערכים, חוקים ותוכניות של החברה</td><td>חוק חינוך חינם, ערכי התרבות</td></tr>
<tr><td><b>כרונו</b></td><td><b>הזמן</b>: הכול משתנה, הילד, המשפחה והחברה</td><td>לידה של אח, מעבר דירה, גירושים</td></tr></table></div>
<div class="tw"><table><tr><th>עוד מילים</th><th>מה זה אומר</th></tr>
<tr><td><b>SES</b></td><td>מעמד כלכלי־חברתי (סוציו־אקונומי): שילוב של השכלה, סוג העבודה והכנסה.</td></tr>
<tr><td><b>הפנמה</b></td><td>מצוקה ש״נשארת בפנים״: דאגה, פחד, עצב.</td></tr>
<tr><td><b>החצנה</b></td><td>מצוקה ש״יוצאת החוצה״: כעס, תוקפנות, התפרצויות.</td></tr>
<tr><td><b>מדיניות ציבורית</b></td><td>חוקים ותוכניות של המדינה שנועדו לשפר את חיי האזרחים.</td></tr></table></div>

<h3>הדוגמה שתלווה אותנו: המשפחה של נועם</h3>
<p><b>נועם</b> (דמות בדויה להמחשה), בן 4, גר עם אמא ואבא. אבא עובד שעות ארוכות, אמא במשרה חלקית, וסבתא גרה קרוב ועוזרת. נעבור עם המשפחה הזו דרך כל השכבות.</p>

<h3>1. המשפחה כמערכת (מיקרו)</h3>
<p>הספר פותח בתרגיל: נסו להיזכר מי ומה השפיעו הכי הרבה על הילדות שלכם. רוב הסטודנטים כותבים דברים שקשורים למשפחה. זה לא מפתיע: <b>המשפחה היא ההקשר הראשון והממושך ביותר</b> של ההתפתחות. שם הילד לומד שפה, מיומנויות וערכים, והקשר להורים הוא ״מודל״ לכל הקשרים שיבואו אחר כך.</p>
<p>החוקרים רואים במשפחה <b>מערכת</b>: רשת של אנשים שכל אחד מהם משפיע על כל האחרים. יש בה שני סוגי השפעה:</p>
<h4>א. השפעות ישירות ודו־כיווניות</h4>
<p><b>מה הרעיון:</b> לא רק ההורה משפיע על הילד. גם הילד משפיע על ההורה. וכל צד ״מחזק״ את ההתנהגות של השני, כך שנוצר מעגל.</p>
<div class="ex"><b>הדוגמה מהספר, בקופה בסופרמרקט:</b><br>
<b>מעגל חיובי:</b> דני (4) מבקש מסטיק. אמא מסרבת בחום, מסבירה למה, ונותנת לו להחזיק את קופסת הדגנים. דני נרגע ומשתף פעולה, ולכן אמא ממשיכה בחום. <b>החום שלה גרם לשיתוף הפעולה שלו, ושיתוף הפעולה שלו גרם לה להמשיך בחום.</b><br>
<b>מעגל שלילי:</b> מג (3) מושיטה יד לשוקולד. אמא צועקת וסוטרת על היד. מג בוכה ומתמרדת, ואמא מגבירה את העונש. <b>כל צד מחריף את השני.</b><br>
<b>מהיומיום:</b> מתבגר שעונה בגסות, והורה שמגיב בצעקות. ההורה בטוח ש״הילד חצוף״, והילד בטוח ש״אבא תמיד צועק״. בפועל שניהם מזינים את המעגל.</div>
<h4>ב. השפעות עקיפות (״צד שלישי״)</h4>
<p><b>מה הרעיון:</b> הקשר בין שני אנשים במשפחה מושפע ממי שנמצא סביבם. אדם יכול להשפיע על הילד <b>דרך</b> מישהו אחר.</p>
<div class="ex"><b>אצל נועם:</b> אבא מחמיא לאמא על איך שהיא מטפלת בנועם. אמא מרגישה מוערכת ורגועה יותר, ולכן סבלנית יותר עם נועם. אבא השפיע על נועם בלי לדבר איתו בכלל, <b>דרך</b> אמא.<br>
<b>הורות משותפת:</b> כשההורים תומכים זה בזה, ההורות של שניהם חמה יותר. כשיש עוינות בזוגיות, הם מפריעים זה לזה, ושניהם מענישים יותר.</div>
<p><b>כשיש סכסוך:</b> ילדים שחשופים לריבים קבועים ולא פתורים בין ההורים נפגעים בתחושת הביטחון שלהם. בנות מגיבות יותר ב<b>הפנמה</b> (דאגה, פחד), ובנים יותר ב<b>החצנה</b> (כעס, תוקפנות).</p>
<p><b>סבים:</b> עוזרים <b>ישירות</b> (חום לנכד, שמירה עליו) ו<b>בעקיפין</b> (עצות להורים, עזרה כספית). אבל סכסוך עם הסבים פוגע במשפחה.</p>
<h4>ג. המשפחה כל הזמן משתנה (כרונו)</h4>
<div class="ex"><b>הילד משתנה, וההורים משתנים איתו:</b> כשנועם היה תינוק, ההורים בעיקר האכילו והחליפו חיתולים. כשהתחיל ללכת ולהצביע על דברים, הם עברו לדבר איתו, לשחק ולהציב גבולות, וזה קידם אותו עוד יותר.<br>
<b>גם ההורים מתפתחים:</b> כשהילד מתבגר, ההורים בגיל העמידה. הוא דוחף לעצמאות, והם רוצים קרבה.<br>
<b>וגם החברה משתנה:</b> משפחות נעשו קטנות ומגוונות יותר: הורים יחידים, משפחות שבהן ההורים נישאו בשנית, הורים חד־מיניים, ושני הורים שעובדים.</div>

<h3>2. המעמד הכלכלי־חברתי (SES): איך המעמד נכנס הביתה</h3>
<p>מהמשפחה עצמה עוברים לשאלה שמשפיעה על כל מה שקורה בה: <b>המעמד</b> שלה. SES הוא לא רק כסף. הוא משלב שלושה דברים:</p>
<div class="ex">① <b>השכלה</b>: כמה שנים ההורים למדו.<br>
② <b>יוקרת העיסוק</b>: איזו עבודה הם עושים וכמה מיומנות היא דורשת.<br>
③ <b>הכנסה</b>: כמה הם מרוויחים.<br>
<b>למה זה חשוב:</b> שתי משפחות יכולות להרוויח אותו סכום ובכל זאת להיות במעמד שונה. למשל, זוג מורים עם תואר שני, וזוג שמרוויח אותו דבר בעבודה שלא דורשת השכלה.</div>
<p><b>הרעיון המרכזי:</b> המעמד משפיע על הילד בעיקר <b>דרך ההורות</b>, כלומר דרך מה שההורים רוצים מהילד ואיך הם מדברים איתו:</p>
<div class="tw"><table><tr><th></th><th>SES נמוך</th><th>SES גבוה</th></tr>
<tr><td><b>מה ההורים מדגישים</b></td><td>תכונות ״חיצוניות״: צייתנות, נימוס, ניקיון</td><td>תכונות ״פנימיות״: סקרנות, עצמאות, בגרות</td></tr>
<tr><td><b>איך הם מדברים</b></td><td>יותר פקודות (״כי אמרתי״), ביקורת וענישה גופנית</td><td>יותר שיחה, קריאה, הסברים ושבחים</td></tr>
<tr><td><b>למה</b></td><td>בעבודה הם רגילים לציית להוראות, וזה עובר הביתה; יותר לחץ בחיים</td><td>ההשכלה מלמדת לחשוב בצורה מופשטת; יותר שליטה בחיים</td></tr></table></div>
<div class="ex"><b>דוגמה שממחישה את הטבלה:</b> ילד שופך מיץ על השולחן.<br>
הורה אחד אומר: ״כמה פעמים אמרתי לך להיזהר? תנקה עכשיו.״<br>
הורה אחר אומר: ״אוי, מה קרה? איך אפשר להחזיק את הכוס כדי שזה לא יקרה שוב?״<br>
שני ההורים אוהבים את הילד. אבל הראשון מלמד אותו בעיקר לציית, והשני מלמד אותו לחשוב ולהסביר. לפי הספר, כבר <b>בשנה השנייה לחיים</b> SES גבוה קשור לשפה ולחשיבה טובות יותר ולפחות בעיות התנהגות, ובהמשך להצלחה בבית הספר.</div>
<div class="ex"><b>דוגמה עולמית מהספר: השכלת בנות.</b> מלאלה יוספזאי נורתה ב־2012 בידי הטליבאן כי נאבקה על הזכות של בנות ללמוד, ובעקבות זאת פקיסטן חוקקה חוק חינוך חובה.<br>
<b>המחקר:</b> בארבע מדינות (מקסיקו, נפאל, ונצואלה, זמביה) נמצא שאמהות שלמדו לקרוא מבינות טוב יותר מסרים של בריאות, מחסנות את הילדים, מדברות יותר עם התינוק, והילדים שלהן קוראים טוב יותר.<br>
<b>למה המחקר משכנע:</b> החוקרים השוו משפחות עם <b>אותה הכנסה ואותה השכלה של האב</b>. כך הם הראו שדווקא <b>האוריינות של האם</b> היא שעושה את ההבדל.<br>
<b>המחסום העיקרי בעולם:</b> שכר לימוד. משפחות עניות שולחות לבית הספר רק את הבנים.</div>

<h3>3. שני הקצוות: עוני ואמידות</h3>
<p>מה שמפתיע בסעיף הזה: לשני הקצוות של הסולם יש מחיר.</p>
<h4>עוני</h4>
<p><b>מה הרעיון:</b> העוני פוגע בעיקר דרך <b>הלחץ</b> שהוא יוצר אצל ההורים. ככל שהוא מתחיל מוקדם יותר, עמוק יותר ונמשך יותר זמן, הנזק לילד גדול יותר: בבריאות, בהישגים ובהתנהגות.</p>
<div class="ex"><b>איך זה עובד, צעד אחרי צעד:</b> האוטו מתקלקל ← אין כסף לתקן ← קשה להגיע לעבודה ← חשבון החשמל לא שולם והחשמל מנותק. הלחצים <b>מצטברים</b>, ההורה מותש ומדוכא, ומגיב לילד בכעס ובעוינות. כלומר העוני לא ״פוגע בילד ישירות״, אלא עובר דרך ההורה. קשה במיוחד להורה יחיד, ויש גם משפחות בלי דיור: בערך 40% מחסרי הבית בארצות הברית הם ילדים.<br>
<b>נתונים:</b> בארצות הברית כ־22% מהילדים עניים, השיעור הגבוה ביותר מבין 20 מדינות מפותחות. בישראל: 23.8% מהילדים, לעומת 13.5% בממוצע ה־OECD.</div>
<h4>אמידות</h4>
<p><b>מה הרעיון:</b> כסף לא מגן אוטומטית. במחקרים של <b>לותר</b> על נערים מפרברים עשירים, כבר בכיתה ז׳ לכ־10% היו בעיות חמורות: יותר אלכוהול וסמים מאשר אצל נוער עני, ויותר חרדה ודיכאון.</p>
<div class="ex"><b>למה?</b> ההורים עסוקים בקריירה ולא נגישים, ובאותו זמן דורשים הישגים מושלמים. הילד מרגיש לחץ ובדידות. אצל הנערים האלה השימוש בסמים היה קשור לחרדה ולדיכאון, ולכן החוקרים חושבים שהסמים הם מעין <b>״תרופה עצמית״</b> לסבל.<br>
<b>מהיומיום:</b> ילד שיש לו חוגים כל יום, טלפון חדש וחדר משלו, אבל אף אחד לא שואל אותו בערב איך עבר היום.</div>
<h4>מה מגן בשני הקצוות</h4>
<div class="ex"><b>ארוחת ערב משותפת:</b> נמצא שילדים שאוכלים בקביעות ארוחת ערב עם ההורים, גם עניים וגם אמידים, סובלים מפחות בעיות. הארוחה עצמה היא סמל: זמן קבוע שבו ההורים <b>נגישים</b>, מתעניינים ומשגיחים. יחד איתה מגנים חיבה, קבלה והשגחה.<br>
<b>תוכניות שעובדות:</b> 14 שעות הדרכה להורים עניים על התמודדות עם לחץ שיפרו את ההורות והפחיתו בעיות אצל הילדים, גם אחרי 18 חודשים. ההמלצה: תוכניות <b>רב־ממדיות</b>, שעוזרות למשפחה, להורות ולילד ביחד.</div>

<h3>4. מחוץ לבית: השכונה ובית הספר (אקסו ומזו)</h3>
<p>יוצאים מהבית אל הסביבה הקרובה. גם כאן הרעיון הוא שהסביבה יכולה לתמוך במשפחה או להכביד עליה.</p>
<h4>השכונה</h4>
<div class="ex"><b>הניסוי:</b> משפחות קיבלו <b>בהגרלה</b> שוברים לעבור לשכונה פחות ענייה. הילדים שעברו היו בריאים יותר והצליחו יותר בלימודים. בגלל ההגרלה, אפשר להסיק שהשכונה היא שגרמה להבדל.<br>
<b>משאבים בשכונה:</b> חוגים, תנועות נוער ומתנ״ס חשובים <b>במיוחד לילדים עניים</b>, כי משפחה אמידה יכולה פשוט להסיע את הילד לחוג רחוק.<br>
<b>הפרדוקס:</b> דווקא הילדים שהכי צריכים את הפעילויות האלה משתתפים בהן הכי פחות.</div>
<h4>תמיכה חברתית מהקהילה</h4>
<p>קהילה תומכת מקלה על ההורים בארבע דרכים: מחזקת את הערך העצמי שלהם, נותנת מידע ושירותים, נותנת דוגמה וגבולות להורות, ועוזרת ישירות.</p>
<div class="ex"><b>אצל נועם:</b> סבתא שגרה קרוב עושה כמה מאלה: מרגיעה את אמא (ערך עצמי), מייעצת לה (מידע), ושומרת על נועם כשצריך (עזרה ישירה).<br>
<b>תוכנית קהילתית מהספר:</b> ״התחלות טובות יותר, עתיד טוב יותר״ בקנדה. התוכנית התבססה על בתי ספר יסודיים בשכונות עניות, ושיפרה את התפקוד וההישגים של הילדים עד כיתה ט׳.</div>
<h4>בית הספר</h4>
<p>עד סוף התיכון ילד מבלה בבית הספר כ־14,000 שעות. משפיעים הגודל, התפיסה החינוכית והאווירה, ובעיקר <b>הקשר בין ההורים לבית הספר</b>. זו דוגמה טובה לשכבת ה<b>מזו</b>: לא הבית לבד ולא בית הספר לבד, אלא הקשר ביניהם. מעורבות של הורים קשורה להישגים טובים יותר. הורים ממעמד נמוך ומקבוצות מיעוט מרגישים פחות בנוח בבית הספר, ולכן בית הספר צריך לעשות מאמץ מיוחד לחבר אותם.</p>

<h3>5. התרבות (מאקרו)</h3>
<p>עכשיו לשכבה הרחבה ביותר. הספר אומר שזה ההקשר שסטודנטים <b>כמעט אף פעם לא מזכירים</b> כשהם חושבים על מה השפיע עליהם, כי הוא בכל מקום ולכן לא מורגש. כמו אוויר.</p>
<ul>
<li><b>ערכים משפיעים על מדיניות:</b> בארצות הברית רואים גידול ילדים כ<b>אחריות פרטית</b> של ההורים, בגלל ערכי עצמאות ופרטיות. לכן הציבור שם לא ממהר לתמוך בהטבות לכל המשפחות.</li>
<li><b>תרבות משנה:</b> קבוצה ששותפה לרוב הערכים של החברה, אבל יש לה גם מנהגים משלה. העורכות של הספר מעדיפות את המונח על ״תת־תרבות״, שנשמע נחות.</li>
<li><b>משפחה מורחבת:</b> בית שבו גרים יחד ילד, הורה וקרוב מבוגר, למשל סבתא. נפוץ אצל אפרו־אמריקנים, היספנים ואסיאתים. היתרונות: חלוקת משאבים, עזרה לאמהות צעירות או יחידניות, והעברת המורשת. אצל היספנים זה קשור ל<b>פמיליזם</b>: האידיאל של משפחה מלוכדת שעומדת במרכז החיים.</li>
</ul>
<div class="ex"><b>קולקטיביזם מול אינדיווידואליזם:</b><br>
<b>קולקטיביזם</b> = מטרות הקבוצה קודמות: לעזור, להתחשב, לשמור על ההרמוניה. ״מה טוב למשפחה?״<br>
<b>אינדיווידואליזם</b> = המטרות האישיות קודמות: לבטא את עצמך, להיות עצמאי. ״מה טוב לי?״<br>
<b>הסתייגות של הספר:</b> ההבחנה הזו <b>שנויה במחלוקת</b>, כי ברוב התרבויות יש את שני סוגי הערכים. ובכל זאת, ארצות הברית אינדיווידואליסטית יותר ממערב אירופה, וזה משפיע על המדיניות שלה.</div>

<h3>6. מדיניות ציבורית: מה המדינה עושה</h3>
<p>הערכים של התרבות מתורגמים לחוקים ולתוכניות. <b>מדיניות ציבורית</b> = מה שהמדינה עושה כדי לשפר את המצב: דיור מוזל, שכר מינימום, תקציב לחינוך. לפי הספר ארצות הברית מפגרת אחרי מדינות מפותחות אחרות: היא במקום האחרון בעוני ילדים ובהריונות של מתבגרות, ובערך 11% מהילדים שזכאים לביטוח בריאות לא מכוסים.</p>
<div class="ex"><b>למה קשה לקדם מדיניות לילדים? שלוש סיבות:</b><br>
① <b>ערכי התרבות:</b> ״לא מתערבים במשפחה״.<br>
② <b>עלות:</b> תוכניות כאלה יקרות.<br>
③ <b>לילדים אין קול:</b> הם לא מצביעים בבחירות, ולכן לפוליטיקאים יש פחות תמריץ לדאוג להם.<br>
<b>כמה זה מורכב, דוגמה מהספר:</b> רפורמה ברווחה החזירה אמהות לעבודה. כשהעבודה הוציאה את המשפחה מעוני, זה עזר. אבל כשהשכר היה נמוך מאוד, האמהות היו מותשות, ההורות נעשתה קשוחה, והילדים נפגעו.</div>
<p><b>האמנה בדבר זכויות הילד</b> (האו״ם, 1989) מבטיחה לילדים בריאות, חינוך חינם והגנה מהתעללות. לפי הספר ארצות הברית לא אשררה אותה; ישראל אשררה אותה ב־1991. ארגונים שנאבקים על זכויות ילדים: הקרן להגנה על ילדים בארצות הברית, ובישראל המועצה הלאומית לשלום הילד.</p>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הסיפור של הפרק בחמישה משפטים:</b><br>
1. הסביבה של הילד היא מערך של <b>שכבות</b>, והיא יכולה לקדם או לסכן את ההתפתחות, בדיוק כמו התורשה.<br>
2. <b>המשפחה</b> היא מערכת: ההשפעות בה <b>דו־כיווניות</b> (ילד והורה משפיעים זה על זה) ו<b>עקיפות</b> (אדם משפיע על הילד דרך מישהו אחר), והיא משתנה כל הזמן.<br>
3. <b>המעמד</b> (השכלה, עבודה, הכנסה) משפיע בעיקר <b>דרך ההורות</b>. גם עוני וגם אמידות יכולים לפגוע, ומה שמגן הוא הורה נגיש ומעורב.<br>
4. <b>השכונה, הקהילה ובית הספר</b> יכולים לתמוך בהורים ובילד, אבל דווקא הנזקקים משתמשים בהם הכי פחות.<br>
5. <b>התרבות והמדיניות</b> קובעות כמה עזרה משפחות מקבלות. ארצות הברית רואה בגידול ילדים עניין פרטי, ולכן מפגרת אחרי מדינות אחרות.<br><br>
<b>מה צריך לדעת לעשות במבחן ובשיעור:</b><br>
• לנתח מקרה של ילד לפי ברונפנברנר: לזהות מה שייך למיקרו, למזו, לאקסו, למאקרו ולכרונו.<br>
• לזהות השפעה דו־כיוונית או עקיפה בתיאור של משפחה.<br>
• להסביר מה זה SES ולמה הוא לא רק הכנסה, ואיך הוא משפיע דרך ההורות.<br>
• להסביר איך עוני ואמידות פוגעים, ומה מגן.<br>
• להסביר למה מחקר ארבע המדינות ומחקר ההגרלה של השכונה משכנעים.<br>
• להסביר קולקטיביזם ואינדיווידואליזם ולמה קשה לקדם מדיניות לילדים.</div>

<h3>מלכודות נפוצות במבחן</h3>
<div class="trap"><ul>
<li><b>SES הוא לא רק הכנסה.</b> הוא משלב השכלה, יוקרת עיסוק והכנסה.</li>
<li><b>השפעה של צד שלישי היא עקיפה:</b> אבא משפיע על נועם <b>דרך</b> אמא.</li>
<li><b>השפעה דו־כיוונית</b> = גם הילד משפיע על ההורה, לא רק ההפך.</li>
<li><b>הפנמה שכיחה יותר בבנות, החצנה בבנים.</b></li>
<li><b>אמידות לא מגינה אוטומטית</b>; הורים אמידים יכולים להיות לא נגישים.</li>
<li><b>ארוחות משותפות מגינות בשני הקצוות</b>, אצל עניים ואצל אמידים.</li>
<li><b>במחקר ארבע המדינות</b> השוו משפחות עם אותה הכנסה ואותה השכלת אב, ולכן אוריינות האם היא שהסבירה את ההבדל.</li>
<li><b>הנזקקים ביותר משתתפים הכי פחות</b> בפעילויות אחרי בית הספר.</li>

const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
