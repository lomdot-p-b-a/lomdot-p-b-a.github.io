.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}

const T=[
 {id:"t1",icon:"clock",title:"האם הניסיון המוקדם חשוב יותר?",blocks:[
  {h:"תקציר הפרק",html:`${def("על מה הנושא",`האם מה שקורה בשנים הראשונות משפיע יותר ממה שקורה אחר כך? הנושא מציג את השאלה ואת שני המושגים המרכזיים.<br><b>מה נלמד כאן:</b> השערת הניסיון המוקדם · תקופה רגישה · תקופה קריטית`)}<p>הפרק סוקר <mark>תקופות רגישות</mark> ${E("Sensitive periods")} בהתפתחות המוח, על סמך המחקר על ילדים שגדלו ב<b>מוסדות</b>. תקופות רגישות הן זמנים שבהם חוויות משפיעות <b>באופן ייחודי</b> על התפתחות המעגלים העצביים.</p>${tiles([["brain","הערכת חסר","בבני אדם מסיקים על תקופות רגישות מהתנהגויות מורכבות, ולכן <b>מעריכים בחסר</b> כמה תקופות רגישות יש ברמת המעגלים"],["check","4 עד 6 חודשים","גידול במוסד שמוגבל ל-4 עד 6 החודשים הראשונים לא נמצא קשור לעלייה מובהקת בסיכון לנזק ארוך טווח, ברוב התחומים"],["target","\"מוקדם יותר עדיף\"","מעבר לזה, העדויות לתקופות רגישות פחות משכנעות. לכן הכלל הסביר כיום הוא \"כמה שיותר מוקדם, יותר טוב\""]])}`,q:"q1"},
  {h:"השערת הניסיון המוקדם",html:`<p>מחלוקת ותיקה בפסיכולוגיה: האם החוויות של השנים הראשונות <b>חשובות באופן ייחודי</b>, או שהן שקולות לחוויות בתקופות מאוחרות יותר?</p>${def("מושג מפתח",`<mark>השערת הניסיון המוקדם</mark> ${E("Early experience hypothesis")}: כ-3 השנים הראשונות חשובות יותר, בגלל השינויים העמוקים במוח שקורים בהן (Sheridan & Nelson, 2009). אחרי ש"היסודות" העצביים נבנו בדרך מסוימת, קשה יותר לתקן אותם.`)}<p>מחקרים רבים מצאו קשר חזק בין חוויות טיפול קשות מוקדמות לקשיי הסתגלות בהמשך. אבל O'Connor & Parfitt (2009) ציינו שמעט מחקרים <b>בדקו</b> את ההשערה באמת.</p>${rem("<b>למה קשה לבדוק?</b> סביבת הטיפול של רוב הילדים <b>רציפה</b>: מי שגדל בסביבה טובה ממשיך בה. צריך מחקרים שבהם ילדים צעירים עוברים <b>שינוי משמעותי</b> בתנאי הטיפול, ואז משווים את התפקוד בסביבה החדשה לזה שבסביבה המקורית.")}${ex(`השאלה היא כמו לשאול אם היסודות של בית חשובים יותר מהקומות העליונות. אם היסודות עקומים, האם אפשר לתקן אחר כך, או שכל הבית יישאר עקום?`)}`,q:"q3"},
  {h:"תקופה רגישה מול תקופה קריטית",html:`<p>המוח מסוגל להסתגל לחוויות שונות, אבל לגמישות הזו יש מגבלות. קנודסן (Knudsen, 2004) הבחין בין שני מושגים:</p>${tiles([["clock","תקופה רגישה",`${E("Sensitive period")} זמן מוגבל בהתפתחות שבו ההשפעה של החוויה <b>חזקה במיוחד</b>`],["lock","תקופה קריטית",`${E("Critical period")} זמן שבו חוויות מסוימות <b>הכרחיות</b> להתפתחות תקינה ויוצרות שינוי <b>קבוע</b> במעגלים העצביים`]])}${rem("בבני אדם כמעט אין עדויות לתקופות קריטיות, לפחות מעבר להתפתחות התפיסתית. לכן הפרק עוסק ב<b>תקופות רגישות</b>. השאלה המרכזית: כמה זמן התקופה \"פתוחה\" לשינוי, ומתי היא נסגרת והופכת לעמידה יחסית לחוויות חדשות.")}${ex(`<b>קריטית</b>: כמו חלון שנסגר לגמרי. אם חתלתול לא רואה כלום בשבועות הראשונים, הראייה לא תתפתח. <b>רגישה</b>: כמו חלון שנסגר חלקית. ללמוד שפה שנייה קל מאוד בילדות, ואפשר גם בבגרות, אבל קשה יותר.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"brain",title:"תקופות רגישות ברמת המעגל העצבי",blocks:[
  {h:"למה דווקא ילדים ממוסדות",html:`${def("על מה הנושא",`תקופות רגישות קיימות ברמה של מעגלים במוח. הנושא מסביר למה ילדים ממוסדות הם מקרה מבחן, ולמה קשה למדוד את ההשפעה.<br><b>מה נלמד כאן:</b> ילדים ממוסדות · מה קורה במעגל · פיצוי · החוויה שלפני המוסד`)}<p>ילדים במוסדות גדלים לעתים קרובות ב<b>מחסור חברתי וחומרי</b>. כשהם עוברים אחר כך לסביבה שונה מאוד, אפשר לחקור את המעבר כ"התערבות". מכיוון שהמעבר קורה ב<b>גילים שונים</b>, זה מאפשר לבחון את השערת התקופה הרגישה.</p>${def("אבל זהירות",`קנודסן הדגיש שתקופות רגישות הן <b>תכונות של מעגלים עצביים</b>, לא של התנהגויות. אנחנו מסיקים עליהן מכישורים והתנהגויות, וזו מגבלה חשובה.`)}`,q:"q7"},
  {h:"מה קורה במעגל",html:`${tiles([["sprout","לפני הפעלה חזקה","המעגל במצב שמעודד שינוי: הסינפסות המעוררות חלשות, וההשפעות המעכבות מוגבלות"],["lock","אחרי הפעלה חוזרת","הסינפסה מתייצבת לפי הקלט שקיבלה, והתקופה הרגישה של המעגל <b>נסגרת</b>"],["clock","בלי מספיק קלט","היעדר הפעלה או הפעלה מועטה עלולים בהתחלה <b>להאריך</b> את התקופה הרגישה"]])}<p>מעגלים כאילו "מצפים" לרמות ולסוגים מסוימים של קלט. גם אחרי שהתקופה נגמרת עדיין אפשר לשנות משהו, אבל זה דורש <b>יותר אנרגיה</b>. מידת הגמישות שונה ממעגל למעגל, והסינפסה גמישה יותר לחוויות מוקדמות.</p>`,q:"q9"},
  {h:"למה מעריכים בחסר",html:`<p>התנהגויות מורכבות כמו <b>IQ, היקשרות ופסיכופתולוגיה</b> הן כנראה תוצאה רחוקה של <b>הרבה</b> תקופות רגישות של מעגלים שונים, שפועלות יחד.</p>${def("פיצוי",`המוח בנוי כך שמעגלים ברמה גבוהה יכולים <mark>לפצות</mark> במידה מסוימת על עיבוד לא תקין ברמות נמוכות. לכן ניתוח של התנהגות מורכבת כנראה <b>מעריך בחסר</b> את ההשפעה של תקופות רגישות.`)}${rem("יש מעגלים שלא מושפעים מחוויה, ויש כאלה שנשארים פתוחים לחוויה כמעט ללא הגבלה. רוב המחקרים קצרי טווח, ורק מחקרי אורך ארוכים יכולים לגלות אם עוד אפשר ללמוד ולהשתנות.")}`,q:"q11"},
  {h:"החוויה שלפני המוסד",html:`<p>גם החוויה <b>שלפני</b> המוסד, כולל התקופה <b>שלפני הלידה</b>, רחוקה מלהיות טיפוסית.</p>${ex("ברומניה, לפני הרפורמות ברווחה, רוב הילדים במוסדות ננטשו בלידה, שהו בבית חולים ליולדות ורק אז הועברו למוסד. לרבות מהאמהות היה טיפול טרום־לידתי מועט ותזונה דלה, וייתכן שנחשפו לניקוטין, אלכוהול או חומרים אחרים.")}${rem("כל אחד מהגורמים האלה מעלה סיכון, והם הופיעו לרוב יחד, כך שהסיכון <b>המצטבר</b> גדול עוד יותר. בניגוד למחקר בבעלי חיים, שבו אפשר לתזמן הפרעה בדיוק, כאן הגידול במוסד מגיע בדרך כלל אחרי חוויות חריגות קודמות.")}`,q:"q13"}
 ]},
 {id:"t3",icon:"flask",title:"איך חוקרים את זה",blocks:[
  {h:"קבוצות השוואה",html:`${def("על מה הנושא",`איך חוקרים את זה בלי לפגוע בילדים? הנושא מציג את קבוצות ההשוואה, ואת סוגי ההתערבות.<br><b>מה נלמד כאן:</b> קבוצות השוואה · המחקר האידיאלי · שלושה סוגי התערבות`)}${tiles([["people","ילדים ממשפחות דומות למאמצות","לא בודק תקופות רגישות אחרי הלידה, אבל נותן מדד לרמה אופטימלית"],["check","ילדים שהיו נכנסים למוסד","אילו לא היה אירוע חיצוני (כמו שינוי מדיניות). זו ההשוואה <b>הטובה ביותר</b>, אבל קשה למצוא אותה"],["split","מאומצים מוקדם מול מאוחר","קירוב סביר, אבל עלולה להיות <b>הטיית בחירה</b>"]])}`,q:"q15"},
  {h:"המחקר האידיאלי (שלא ייעשה)",html:`<p>מחקר אידיאלי היה מתחיל בהערכה מקיפה של הרבה ילדים <b>בזמן</b> השהות במוסד, ועוקב אחריהם לאורך זמן:</p>${tiles([["clock","גיל ההתערבות","קבוצת ההתערבות משתנה באופן שיטתי בגיל שבו מקבלים טיפול משופר"],["building","קבוצת ביקורת","ממשיכה בטיפול הרגיל במוסד שנים רבות"],["sprout","גיל הכניסה","משנים גם את הגיל שבו נכנסים למוסד, וכוללים ילדים שהיו מיועדים למוסד ושובצו בסביבה טובה מהלידה"]])}${rem("מסיבות <b>אתיות ומעשיות</b> מחקר כזה לא ייעשה לעולם בבני אדם. לכן בוחנים מחקרים שיש בהם חלק מהמאפיינים האלה, ומסיקים מהדפוס של התוצאות.")}`,q:"q17"},
  {h:"שלושה סוגי התערבות",html:`${interTable}<p>במחקרים האלה נמצאו בדרך כלל <b>השפעות גדולות</b> לכל שלושת סוגי ההתערבות. אבל הקשר בין <b>התזמון</b> לתוצאות נבדק בדרכים שונות, והתוצאות שונות לפי התחום.</p>`,q:"q19"}
 ]},
 {id:"t4",icon:"chart",title:"מה נמצא לגבי תזמון",blocks:[
  {h:"אין השפעה להתערבות",html:`${def("על מה הנושא",`מה המחקרים מצאו לגבי התזמון: האם משנה מתי הילד יצא מהמוסד?<br><b>מה נלמד כאן:</b> אין השפעה · השפעה בלי תזמון · גילאי חיתוך · BEIP`)}<p>ב-BEIP לא נמצא הבדל ב<b>היקף הראש</b>, ולא הייתה השפעה על <b>הפרעות מוחצנות</b> (ADHD, מרד מתריס).</p>${tiles([["x","הסבר 1","ההתערבות (אומנה איכותית) פשוט לא יעילה לתחומים האלה. אולי התערבות חזקה או ממוקדת יותר הייתה מצליחה"],["lock","הסבר 2","התקופה הרגישה כבר <b>נסגרה</b>: הגיל המוקדם ביותר לאומנה היה 6 חודשים, והממוצע 22 חודשים"]])}${def("השוואה ל-ERA",`ב-ERA ילדים שאומצו <b>לפני 6 חודשים</b> לא הראו עלייה בסימני חוסר קשב/פעלתנות יתר. ההבדל: אולי המשפחות המאמצות היו טובות יותר מהאומנה, או שהתקופה הרגישה לקשב מוקדמת מהגיל שבו התחילה ההתערבות ב-BEIP.`)}`,q:"q21"},
  {h:"יש השפעה, אין תזמון",html:`<p>ב-BEIP ההתערבות <b>הפחיתה הפרעות מופנמות</b>, שיפרה את <b>התגובתיות הרגשית</b> והגדילה רכיבים של <b>פוטנציאלים מעוררים</b> ${E("ERP")} (P1, N170, P400), אבל <b>בלי</b> השפעה של הגיל.</p>${rem("פירוש אפשרי: בטווח הגילים שבו התחילה ההתערבות (6 עד 31 חודשים) התקופות הרגישות של ההתנהגויות האלה עוד היו <b>פתוחות מספיק</b> כדי לאפשר החלמה חלקית או מלאה.")}`,q:"q23"},
  {h:"ממצאים מתאמיים",html:`<p>במחקרים רבים <b>משך המחסור</b> (הזמן במוסד, לפי גיל האימוץ) נמצא <b>במתאם</b> עם התוצאות:</p>${tiles([["chart","ERA בגיל 6","IQ, סימנים של \"כמו־אוטיזם\", חוסר קשב ו<b>היקשרות לא מרוסנת</b> (התנהגות לא מבחינה) קשורים ליניארית לזמן במוסד"],["people","מאומצים בין־ארציים","גיל האימוץ ומשך המיסוד קשורים לגישה לא מרוסנת לזרים (Bruce et al., 2009)"],["brain","BEIP","ככל שהשיבוץ באומנה מוקדם יותר: יותר עוצמת EEG בגיל 42 חודשים, ויותר סיכוי להיקשרות טיפוסית"]])}${rem("המתאמים מראים ש<b>ההחלמה קשה יותר ככל שהילד מבוגר</b>, אבל לא מלמדים הרבה על תקופות רגישות. הסיבות: חסך חושי עשוי להאריך את פתיחת התקופה, תהליכי פיצוי עשויים להסתיר את סגירתה, ויש פיצוי ברמות גבוהות במוח.")}`,q:"q25"},
  {h:"גילאי חיתוך",html:`<p><mark>גיל חיתוך</mark> ${E("Age cut point")}: גיל שאחריו ההחלמה מקשיים מוקדמים נעשית קשה יותר באופן מובהק. זה נראה כמו <b>תקופה רגישה התנהגותית</b>. אבל צריך לבדוק <b>כמה</b> גילאי חיתוך, כדי לוודא שהקשר לא פשוט ליניארי.</p>${ex("Smyke et al. (2010): ילדים שהועברו לאומנה לפני 24 חודשים היו בסבירות גבוהה יותר עם היקשרות מאורגנת. זה נראה כמו תקופה רגישה של 24 חודשים. אבל אותה תוצאה הופיעה גם לפני 30, 28, 26, 22, 20 ו-18 חודשים, כלומר קשר <b>ליניארי</b> ולא גיל חיתוך אמיתי.")}${fig("cutoffs","גילאי החיתוך שנמצאו בתחומים שונים")}`,q:"q27"},
  {h:"מאומצים מוקדם",html:`${tiles([["leaf","פרויקט האימוץ הרומני (קנדה)","שאומצו לפני 4 חודשים התפתחו טוב יותר מהמאוחרים, ובדומה לילדים קנדים שלא אומצו (Ames, 1997)"],["check","ERA: לפני 6 חודשים","דומים לילדים שלא חוו מוסד ב-IQ, תפקוד ניהולי, כמו־אוטיזם וחוסר קשב, וגם ב\"פגיעה כוללת\""],["people","מטא־אנליזה (2008)","שאומצו לפני 12 חודשים היו בטוחים בהיקשרות כמו ילדים שלא אומצו. הגנה רחבה, אבל לא מלאה"]])}${def("BEIP",`שיבוץ לאומנה בין 7 ל-33 חודשים. מי ששובץ <b>לפני 24 חודשים</b> היה במצב טוב יותר ב-IQ, עוצמת EEG, קוהרנטיות EEG וביטחון בהיקשרות. ב<b>שפה</b>: מי ששובץ לפני 15 חודשים הגיע לשפה תקינה, ואחרי 15 חודשים היה עיכוב.`)}`,q:"q29"}
 ]},
 {id:"t5",icon:"pyramid",title:"פונקציית מדרגה",blocks:[
  {h:"ליניארי או מדרגה",html:`${def("על מה הנושא",`האם הנזק עולה בהדרגה עם כל חודש במוסד, או קופץ בבת אחת אחרי גיל מסוים?<br><b>מה נלמד כאן:</b> ליניארי מול מדרגה · הממצאים · מה אפשר להסיק`)}<p>הרבה מחקרים היו קטנים או עם טווח גילאים מוגבל, וחילקו את הגיל לשתיים או לשלוש. לכן הצורה של הקשר בין זמן במוסד לתוצאה לא נבדקה היטב. כמה מחקרים כן בדקו, ומצאו <mark>פונקציית מדרגה</mark> ${E("Step function")}:</p>${fig("step")}${def("פונקציית מדרגה",`ליקויים <b>לא מופיעים</b> אצל מי שאומץ לפני גיל מסוים, <b>מופיעים</b> אחריו, ו<b>לא מחמירים</b> עם חשיפה ארוכה יותר למוסד. היא מופיעה בעיקר כשבודקים את הילדים בגיל מבוגר יותר.`)}${ex(`<b>ליניארי</b>: כמו רמפה, כל חודש נוסף במוסד מוסיף עוד קצת נזק. <b>מדרגה</b>: כמו מדרגה, עד גיל מסוים אין נזק, ואחריו הנזק קופץ בבת אחת.`)}`,q:"q31"},
  {h:"הממצאים",html:`${tiles([["chart","ERA","בגיל 6 נמצא קשר ליניארי, אבל בגיל 11 ו-15 נמצאה מדרגה ב-<b>6 חודשים</b>. חשיפה ארוכה יותר לא הייתה קשורה לתוצאות גרועות יותר"],["people","מוסדות של מחסור רגשי־חברתי","שיעורים גבוהים של בעיות התנהגות רק אצל מי שאומץ ב-<b>18 חודשים</b> ומעלה, ורק כשנבדקו בגיל 12 ומעלה"],["brain","תפקוד ניהולי","מדרגה דומה ב-18 חודשים בדיווח הורים, בלי החמרה בגילי אימוץ מאוחרים יותר"]])}${ex("מחקר על מאומצים מרומניה של שנות ה-90 מצא דווקא עלייה בבעיות אחרי 6 חודשים, ושהבעיות <b>כן</b> גדלו עם חשיפה ארוכה יותר, בניגוד ל-ERA.")}`,q:"q33"},
  {h:"מה אפשר להסיק",html:`${tiles([["clock","תקופה של כ-18 חודשים","תואם תקופה רגישה התנהגותית בערך ב-18 החודשים הראשונים. מי שעוזב לפני 6 חודשים, כנראה בלי השלכות ארוכות"],["question","גיל או משך?","אי אפשר לשלול שמה שקובע הוא <b>משך</b> החשיפה ולא הגיל. יש מעט מדי ילדים שנכנסים למוסד בגיל 18 חודשים"],["building","חומרת המוסד","מוסדות של מחסור כולל וקשה פוגעים מוקדם יותר ויותר מאשר מוסדות שחסר בהם בעיקר קשר רגשי־חברתי"]])}${rem("הדמיון בין הקבוצות מצביע על <b>גורם משותף</b>: מחסור באינטראקציות רגשיות־חברתיות עם המטפלים. (הסביבה הרגשית במוסדות ברומניה בשנות ה-90 הייתה קשה עוד יותר מזו שבסנט פטרסבורג.)")}`,q:"q35"}
 ]},
 {id:"t6",icon:"sprout",title:"חוויות מאוחרות: פיצוי והשפעות רדומות",blocks:[
  {h:"פיצוי: ה-IQ בגיל 8",html:`${def("על מה הנושא",`מה קורה אחרי שהילד יוצא? הנושא מציג שני תהליכים הפוכים: פיצוי, ונזק שמופיע רק מאוחר יותר.<br><b>מה נלמד כאן:</b> פיצוי · המחיר · השפעות רדומות · הפרעה או מומחיות`)}<p>ב-BEIP נמצאה השפעה ברורה של תזמון על IQ. אבל במעקב בגיל 8 הפער בין קבוצת הטיפול הרגיל לקבוצת האומנה <b>הצטמצם</b> ולא היה מובהק.</p>${tiles([["chart","למה הפער קטן","לא כי קבוצת האומנה ירדה, אלא כי קבוצת הטיפול הרגיל <b>עלתה</b>: רובם כבר לא היו במוסד (חזרו להורים, אומצו או עברו לאומנה ממשלתית)"],["building","מי שנשאר במוסד","מי שעוד היה במוסד בגיל 8 היה עם IQ נמוך באופן מובהק"],["check","אומנת BEIP","הילדים באומנה האיכותית היו עם ה-IQ הגבוה ביותר"]])}${rem("בגיל 8 <b>תזמון</b> השיבוץ כבר לא היה קשור ל-IQ. זה תואם <mark>תהליכי פיצוי</mark>: מסלולים חלופיים להתנהגות מורכבת כמו אינטליגנציה.")}${ex(`<b>פיצוי</b>: כמו נהג שהכביש הראשי חסום ומוצא דרך עוקפת. הוא מגיע, אבל בדרך אחרת וארוכה יותר.`)}`,q:"q37"},
  {h:"באיזה מחיר?",html:`${def("המסלול היעיל ביותר",`קנודסן, הקמן, קמרון ושונקוף (2006): החוויה המוקדמת חשובה לא כי היא יוצרת את המסלול <b>היחיד</b> לתוצאה טובה, אלא כי היא יוצרת את המסלול <b>היעיל ביותר</b>.`)}<p>פיצוי מאוחר יקר יותר באנרגיה, בגלל המבנה ההיררכי של המוח. ברמת המדיניות הוא דורש יותר משאבים, ומוכר יותר ויותר כ<b>פחות יעיל והרבה יותר יקר</b>.</p>`,q:"q39"},
  {h:"השפעות רדומות",html:`<p><mark>השפעות רדומות</mark> ${E("Sleeper effects")}: תוצאות שמופיעות הרבה אחרי החוויה. חוויות מוקדמות בונות בסיס עצבי ליכולות שמופיעות מאוחר.</p>${ex("Maurer et al. (2007): ילדים שנולדו עם קטרקט שחסם כל קלט חזותי מובנה. הקטרקט הוסר בגיל חודש עד שנה. היה \"שיקום\" מהיר והם נראו תקינים שנים, אבל מאוחר יותר נמצאו ליקויים ב<b>רגישות לניגודיות בתדר גבוה</b> וב<b>עיבוד הוליסטי של פנים</b>, יכולות שמתפתחות מאוחר.")}${tiles([["building","מחסור קשה (רומניה)","בעיות כבר בגיל מוקדם, בערך בגיל 6"],["clock","מחסור רגשי־חברתי","בעיות התנהגות וליקויי תפקוד ניהולי הופיעו רק בגיל 12 ומעלה"]])}${rem("כלומר המוסד לא רק מלמד התנהגויות שמתאימות למוסד. חוויה מוקדמת חסרה <b>לא מפתחת</b> כישורים בסיסיים, שנעשים חשובים יותר במשימות מאוחרות, כמו הדרישות והלחצים של גיל ההתבגרות.")}`,q:"q41"},
  {h:"הפרעה או מומחיות?",html:`<p>במחקר של מאורר, מחסור חזותי מוקדם הגביל את היכולת להפוך ל<b>מומחה</b> לעיבוד פנים. אולי גם מחסור חברתי מגביל סוגים מסוימים של <mark>מומחיות</mark> ${E("Expertise")}.</p>${def("דוגמה מ-IQ",`עם יותר זמן במוסד יש יותר ילדים עם IQ של <b>שתי סטיות תקן מתחת לממוצע</b>. אבל בולט גם ש<b>נעלמים</b> הילדים עם IQ מעל הממוצע וגבוה (Loman et al., 2009).`)}${rem("גיל ההתבגרות דורש כישורים מתוחכמים ומווסתים. ייתכן שזה זמן שבו מחסור מוקדם יגביל מומחיות, כמו השפעה רדומה. אולי יש <b>תקופות רגישות לכשירות</b> ולא רק להפרעה, וזה כיוון מחקר חדש.")}`,q:"q43"}
 ]},
 {id:"t7",icon:"check",title:"מסקנות ראשוניות",blocks:[
  {h:"מסקנות 1 עד 4",html:`${def("על מה הנושא",`המסקנות של הפרק, בשמונה נקודות.<br><b>מה נלמד כאן:</b> מסקנות 1–4 · מסקנות 5–8`)}<ol><li><b>מגבלות מחקר:</b> קשה להבין תקופות רגישות ברמת המעגלים בבני אדם, בגלל בעיות אתיות של שינוי סביבות קשות ומגבלות טכניות ברזולוציה של מדידת המוח.</li><li><b>הערכת חסר:</b> כשמסיקים מהתנהגויות מורכבות, מעריכים בחסר את התקופות הרגישות ברמת המעגלים.</li><li><b>היעדר תזמון:</b> בהרבה התנהגויות אין עדות להשפעת התזמון. זה לא אומר שאין תקופה רגישה, אבל אי אפשר להסיק עד שנוכל לחקור את המוח.</li><li><b>4 עד 6 חודשים:</b> ברוב התחומים, מוסד שמוגבל ל-4 עד 6 החודשים הראשונים לא מעלה את שיעור הנזק ארוך הטווח. החריגים קשורים יותר לתחום הרגשי־חברתי מאשר הקוגניטיבי.</li></ol>`,q:"q45"},
  {h:"מסקנות 5 עד 8",html:`<ol start="5"><li><b>18 עד 24 חודשים:</b> חשיפה למוסד חסר בתקופה הזו קשורה להתפתחות פחות טובה. אבל עוד לא הפרידו בין הגיל לבין משך החשיפה, והתוצאות תלויות בגורמים שלפני המוסד, בחומרת המוסד, בגיל הבדיקה, בתחום ובמדדים.</li><li><b>מומחיות:</b> צריך לבדוק תקופות רגישות למומחיות ולא רק להתנהגויות לא מסתגלות.</li><li><b>מתודולוגיה:</b> דגימה, מדדים, מערך וניתוח משתנים בין המחקרים. מסוכן להסיק ממחקר אחד, אבל אפשר לנצל נתונים קיימים כדי לבדוק השערות על תזמון.</li><li><b>המלצה:</b> לקליניקה ולמדיניות, הכלל <mark>"כמה שיותר מוקדם, יותר טוב"</mark> לטיפול משופר הוא מסקנה סבירה. ניסיון להיות מדויקים יותר מוקדם מדי לפי מצב המדע.</li></ol>`,q:"q47"}
 ]}
];
const Q={
q1:{t:"t1",v:[
 {q:"לפי הפרק, מהן תקופות רגישות?",a:"זמנים שבהם חוויות משפיעות באופן ייחודי על התפתחות המעגלים העצביים",w:["זמנים שבהם הילד רגיש במיוחד לביקורת","שלבים קבועים שבהם כל הילדים לומדים אותו דבר","תקופות שבהן אסור לחשוף את הילד לגירויים"],e:"ההגדרה בתקציר הפרק."},
 {q:"למה, לפי הפרק, אנחנו מעריכים בחסר את מספר התקופות הרגישות בבני אדם?",a:"כי מסיקים עליהן מהתנהגויות מורכבות ולא ישירות מהמעגלים העצביים",w:["כי אין תקופות רגישות בבני אדם","כי רוב המחקרים נעשו על מבוגרים","כי המוח לא משתנה אחרי הלידה"],e:"מאחורי כל התנהגות מורכבת יש הרבה תקופות רגישות של מעגלים."}]},
q2:{t:"t1",v:[
 {q:"מה נמצא לגבי גידול במוסד שמוגבל ל-4 עד 6 החודשים הראשונים?",a:"ברוב התחומים הוא לא קשור לעלייה מובהקת בסיכון לנזק ארוך טווח",w:["הוא גורם לנזק קבוע בכל התחומים","הוא משפר את ההתפתחות","הוא פוגע רק ב-IQ"],e:"מעבר לגיל הזה העדויות פחות חד־משמעיות."},
 {q:"איזה כלל מעשי הפרק ממליץ עליו?",a:"\"כמה שיותר מוקדם, יותר טוב\" לטיפול משופר",w:["\"לחכות עד גיל 3\" לפני כל התערבות","\"עדיף להשאיר במוסד עד שנתיים\"","\"הגיל לא משנה כלל\""],e:"זו המסקנה הסבירה לפי מצב המדע."}]},
q3:{t:"t1",v:[
 {q:"מה טוענת השערת הניסיון המוקדם?",a:"כ-3 השנים הראשונות חשובות יותר בגלל השינויים העמוקים במוח בתקופה הזו",w:["רק החוויות בגיל ההתבגרות קובעות","כל התקופות בחיים חשובות באותה מידה","חוויות מוקדמות נשכחות ולכן לא משפיעות"],e:"אחרי ש\"היסודות\" נבנו, קשה יותר לתקן אותם."},
 {q:"למה קשה לבדוק את השערת הניסיון המוקדם?",a:"כי סביבת הטיפול של רוב הילדים רציפה, ולכן צריך מקרים של שינוי משמעותי בטיפול",w:["כי אין מחקרים על תינוקות","כי אי אפשר למדוד התפתחות","כי כל הילדים גדלים במוסדות"],e:"מי שגדל בסביבה טובה בדרך כלל ממשיך בה."}]},
q4:{t:"t1",v:[
 {q:"מה ציינו O'Connor ו-Parfitt (2009)?",a:"שמעט מחקרים באמת בדקו את השערת הניסיון המוקדם",w:["שההשערה הוכחה סופית","שאין קשר בין טיפול מוקדם להסתגלות","שתקופות קריטיות נפוצות בבני אדם"],e:"למרות הקשר החזק שנמצא בין קשיים מוקדמים לקשיי הסתגלות."},
 {q:"למה מחקרי התערבות אצל ילדים ממוסדות מעניינים את החוקרים?",a:"כי הם מאפשרים לבדוק אם ומתי \"מאוחר מדי\" לתקן, ואם זה שונה בין תחומים",w:["כי הם זולים במיוחד","כי ילדים במוסדות לא חוו מחסור","כי אין בהם צורך בקבוצת השוואה"],e:"התזמון של ההתערבות עשוי להשפיע על התוצאה."}]},
q5:{t:"t1",v:[
 {q:"לפי קנודסן, מה ההבדל בין תקופה רגישה לתקופה קריטית?",a:"ברגישה ההשפעה חזקה במיוחד, ובקריטית החוויה הכרחית להתפתחות תקינה ויוצרת שינוי קבוע",w:["אין ביניהן הבדל","קריטית מתרחשת רק אצל מבוגרים","רגישה היא תקופה שבה אין השפעה לחוויה"],e:"קנודסן, 2004."},
 {q:"למה הפרק מתמקד בתקופות רגישות ולא קריטיות?",a:"כי בבני אדם כמעט אין עדויות לתקופות קריטיות, מלבד בהתפתחות התפיסתית",w:["כי תקופות קריטיות קלות יותר למדידה","כי תקופות קריטיות קיימות רק בגיל ההתבגרות","כי קנודסן לא הגדיר תקופה קריטית"],e:"לכן מדברים על \"פתיחה\" ו\"סגירה\" של תקופות רגישות."}]},
q6:{t:"t1",v:[
 {q:"מה השאלה המרכזית לגבי תקופה רגישה מנקודת המבט של התפתחות המוח?",a:"כמה זמן היא נשארת פתוחה לשינוי, ומתי היא נסגרת ונעשית עמידה יחסית לחוויות",w:["כמה גדול המוח בסוף התקופה","האם היא קיימת אצל בעלי חיים","מה הגנים שגורמים לה"],e:"זו השאלה שמחקרי התזמון מנסים לענות עליה."},
 {q:"איזה משפט נכון לגבי המוח לפי הפרק?",a:"הוא מסוגל להסתגל לחוויות שונות, אבל לגמישות הזו יש מגבלות",w:["הוא לא משתנה אחרי הלידה","הוא גמיש באותה מידה בכל גיל","הוא משתנה רק בעקבות גנים"],e:"המגבלות מתוארות במונחים של תקופות רגישות או קריטיות."}]},
q7:{t:"t2",v:[
 {q:"למה ילדים ממוסדות מאפשרים לבחון את השערת התקופה הרגישה?",a:"כי המעבר שלהם לסביבה שונה מאוד קורה בגילים שונים",w:["כי כולם יוצאים מהמוסד באותו גיל","כי הם לא חוו מחסור","כי במוסדות אין מטפלים"],e:"המעבר נחקר כ\"התערבות\" שמתרחשת בגילים שונים."},
 {q:"מה הדגיש קנודסן לגבי תקופות רגישות?",a:"שהן תכונות של מעגלים עצביים ולא של התנהגויות",w:["שהן תכונות של המשפחה","שאפשר למדוד אותן ישירות בשאלון","שהן זהות אצל כל הילדים"],e:"וזו מגבלה כשמסיקים עליהן מהתנהגות."}]},
q8:{t:"t2",v:[
 {q:"באילו תנאים גדלים לעתים קרובות ילדים במוסדות לפי הפרק?",a:"מחסור חברתי וחומרי",w:["עודף גירויים","משפחה מורחבת","טיפול אישי של מטפלת קבועה"],e:"(Social and material privation)."},
 {q:"מה המשמעות של הטענה שמסיקים על תקופות רגישות \"מכישורים והתנהגויות\"?",a:"שהמסקנות על המעגלים העצביים הן עקיפות ולכן מוגבלות",w:["שאין צורך לחקור את המוח","שהתנהגות זהה למעגל עצבי","שהמסקנות תמיד מדויקות"],e:"קנודסן מזהיר מפני הסקה ישירה."}]},
q9:{t:"t2",v:[
 {q:"באיזה מצב נמצא מעגל עצבי לפני שהופעל בעוצמה?",a:"מצב שמעודד שינוי: סינפסות מעוררות חלשות והשפעות מעכבות מוגבלות",w:["מצב קבוע שלא ניתן לשנות","מצב שבו הוא כבר מתייצב","מצב שבו הוא לא מגיב לשום קלט"],e:"הפעלה חזקה וחוזרת משנה את התנאים האלה."},
 {q:"מה קורה לתקופה הרגישה של מעגל כשאין מספיק קלט?",a:"בהתחלה היא עלולה להתארך",w:["היא נסגרת מיד","היא מתחילה מחדש","היא הופכת לתקופה קריטית"],e:"מעגלים \"מצפים\" לקלט מסוים."}]},
q10:{t:"t2",v:[
 {q:"מה נכון לגבי שינוי במעגל אחרי שהתקופה הרגישה נגמרה?",a:"עדיין אפשר לשנות משהו, אבל זה דורש יותר אנרגיה",w:["אי אפשר לשנות דבר","השינוי קל יותר מקודם","השינוי קורה רק בשינה"],e:"גם אחרי הסגירה נשארת יכולת מסוימת לשינוי."},
 {q:"מה קורה לסינפסה אחרי הפעלה חזקה וחוזרת של המעגל?",a:"היא מתייצבת לפי הקלט שקיבלה, והתקופה הרגישה נסגרת",w:["היא נעלמת","היא נעשית גמישה יותר","היא מפסיקה להעביר מידע"],e:"זה המנגנון של סגירת התקופה."}]},
q11:{t:"t2",v:[
 {q:"למה ניתוח של התנהגות מורכבת מעריך בחסר את ההשפעה של תקופות רגישות?",a:"כי מעגלים ברמה גבוהה יכולים לפצות על עיבוד לא תקין ברמות נמוכות",w:["כי התנהגויות מורכבות לא קשורות למוח","כי יש רק תקופה רגישה אחת","כי המדידה של IQ לא מהימנה"],e:"הפיצוי מסתיר את ההשפעה ברמה הנמוכה."},
 {q:"מה נדרש כדי לדעת אם עוד אפשר ללמוד ולהשתנות בהתנהגות מסוימת?",a:"מחקרי אורך ארוכי טווח",w:["מחקר חתך קצר","שאלון להורים","בדיקה אחת בגיל שנה"],e:"רוב המחקרים קצרי טווח, וזו בעיה."}]},
q12:{t:"t2",v:[
 {q:"לפי הפרק, התנהגויות כמו IQ, היקשרות ופסיכופתולוגיה הן:",a:"תוצאה רחוקה של הרבה תקופות רגישות של מעגלים שפועלות יחד",w:["תוצאה של תקופה רגישה אחת","תכונות שלא קשורות למוח","תוצאה ישירה של גנים בלבד"],e:"יש היררכיה של מעגלים מאחורי כל התנהגות כזו."},
 {q:"איך מתוארים מעגלים שונים מבחינת הפתיחות לחוויה?",a:"יש מעגלים שלא מושפעים מחוויה, ויש שנשארים פתוחים כמעט ללא הגבלה",w:["כולם נסגרים בגיל שנה","כולם פתוחים לתמיד","כולם נסגרים בלידה"],e:"מידת הגמישות שונה ממעגל למעגל."}]},
q13:{t:"t2",v:[
 {q:"מה היה המצב של רוב הילדים במוסדות ברומניה לפני הרפורמות?",a:"הם ננטשו בלידה, שהו בבית חולים ליולדות ואז הועברו למוסד",w:["הם גדלו בבית עד גיל 3","הם אומצו מיד אחרי הלידה","הם עברו לאומנה ממשלתית"],e:"והאמהות קיבלו לעתים טיפול טרום־לידתי מועט."},
 {q:"למה החוויה שלפני המוסד מסבכת את המחקר?",a:"כי גורמי סיכון קודמים (גם לפני הלידה) מופיעים יחד ומגדילים את הסיכון המצטבר",w:["כי היא תמיד טובה מאוד","כי אין לה השפעה","כי אפשר לתזמן אותה בדיוק"],e:"בניגוד למחקר בבעלי חיים שבו אפשר לתזמן הפרעה בדיוק."}]},
q14:{t:"t2",v:[
 {q:"אילו גורמים טרום־לידתיים מוזכרים בפרק?",a:"טיפול טרום־לידתי מועט, תזונה דלה וחשיפה אפשרית לניקוטין או אלכוהול",w:["רק גנטיקה","עודף משקל של האם","שינה מרובה בהיריון"],e:"כל אחד מהם מעלה סיכון."},
 {q:"מה מבדיל בין מחקר בבעלי חיים למחקר על ילדים ממוסדות?",a:"בבעלי חיים אפשר לתזמן הפרעה בדיוק, ובילדים המוסד בא אחרי חוויות חריגות קודמות",w:["בבעלי חיים אין תקופות רגישות","בילדים אפשר לשבץ למוסד באקראי","אין הבדל"],e:"זו מגבלה מרכזית של המחקר בבני אדם."}]},
q15:{t:"t3",v:[
 {q:"מהי קבוצת ההשוואה הטובה ביותר לפי הפרק?",a:"ילדים שהיו נכנסים למוסד אילולא אירוע חיצוני, כמו שינוי מדיניות",w:["ילדים ממשפחות דומות למשפחות המאמצות","ילדים מבוגרים יותר מאותו מוסד","ילדים שגדלו במוסד כל חייהם"],e:"זו ההשוואה הטובה ביותר, אבל קשה למצוא אותה."},
 {q:"מה הבעיה בהשוואה בין ילדים שאומצו מוקדם לילדים שאומצו מאוחר?",a:"היא עלולה לכלול הטיית בחירה",w:["היא לא מאפשרת שום מסקנה","היא דורשת שיבוץ אקראי","אין בה בעיה"],e:"זה קירוב, לא השוואה אידיאלית."}]},
q16:{t:"t3",v:[
 {q:"מה נותנת השוואה לילדים ממשפחות דומות למשפחות המאמצות?",a:"מדד לרמה התפתחותית אופטימלית, אבל לא בדיקה של תקופות רגישות אחרי הלידה",w:["בדיקה מלאה של תקופות רגישות","מידע על החוויה במוסד","שום מידע"],e:"כי ההבדלים עשויים לנבוע גם מלפני הלידה."},
 {q:"למה בחירת קבוצת ההשוואה חשובה במיוחד במחקר על ילדים ממוסדות?",a:"בגלל הקושי להשוות בין הקבוצות במצוקה שלפני הלידה",w:["כי אין ילדים שאומצו","כי כל המוסדות זהים","כי אי אפשר למדוד IQ"],e:"זה ממשיך את הבעיה של החוויה שלפני המוסד."}]},
q17:{t:"t3",v:[
 {q:"מה מאפיין את המחקר האידיאלי שהפרק מתאר?",a:"שינוי שיטתי בגיל קבלת הטיפול המשופר, וקבוצת ביקורת שנשארת במוסד שנים",w:["שיבוץ כל הילדים לאומנה מהלידה","בדיקה אחת בלבד בגיל שנה","שאלון רטרוספקטיבי למבוגרים"],e:"וגם שינוי בגיל הכניסה למוסד."},
 {q:"למה המחקר האידיאלי לא ייעשה?",a:"מסיבות אתיות ומעשיות",w:["כי הוא זול מדי","כי אין מוסדות בעולם","כי התוצאות כבר ידועות"],e:"לכן לומדים מהדפוס של מחקרים חלקיים."}]},
q18:{t:"t3",v:[
 {q:"איזו קבוצה נוספת היה כולל המחקר האידיאלי?",a:"ילדים שהיו מיועדים למוסד ושובצו בסביבה טובה כבר מהלידה",w:["ילדים בני 10 שנכנסים למוסד","מבוגרים שגדלו במוסד","ילדים ממדינות שונות בלי קשר למוסד"],e:"זה מאפשר השוואה מלאה של גיל הכניסה והיציאה."},
 {q:"מה עושים החוקרים במקום המחקר האידיאלי?",a:"בוחנים מחקרים שיש בהם חלק מהמאפיינים ומסיקים מהדפוס של התוצאות",w:["מוותרים על חקר התזמון","עורכים ניסויים בילדים","מסתמכים רק על בעלי חיים"],e:"כך הפרק בנוי."}]},
q19:{t:"t3",v:[
 {q:"מה מיוחד במחקר BEIP?",a:"שיבוץ אקראי לטיפול רגיל במוסד או לאומנה, אחרי הערכה מוקדמת",w:["אימוץ לבריטניה","שינוי מבני בצוות המוסד","מעקב אחרי ילדים קנדים"],e:"השיבוץ האקראי מאפשר מסקנות סיבתיות."},
 {q:"מה עשה פרויקט סנט פטרסבורג?",a:"השווה טיפול רגיל, שינוי מבני בצוות והדרכה בלבד, בשלושה בתי תינוקות",w:["העביר ילדים לאומנה באקראי","בדק ילדים שאומצו לבריטניה","בדק רק את גיל הכניסה למוסד"],e:"שיפור המוסד עצמו במקום להוציא ממנו."}]},
q20:{t:"t3",v:[
 {q:"באילו גילים אומצו הילדים מרומניה במחקר ERA?",a:"לפני 6 חודשים, בין 6 ל-24 חודשים, ובין 24 ל-42 חודשים",w:["רק לפני 6 חודשים","בין שנתיים לחמש","אחרי גיל 3 בלבד"],e:"והושוו לילדים שאומצו בבריטניה לפני 6 חודשים."},
 {q:"מה היתרון של מחקר ERA?",a:"הוא בודק את הניגוד הגדול ביותר בסביבות הטיפול, במעקב מינקות ועד ההתבגרות",w:["יש בו שיבוץ אקראי","הוא משפר את המוסד עצמו","הוא נמשך שנה אחת"],e:"ממוסדות קשים לבתים מבוססים בבריטניה."}]},
q21:{t:"t4",v:[
 {q:"באילו תחומים לא נמצאה השפעה של האומנה ב-BEIP?",a:"היקף הראש והפרעות מוחצנות כמו ADHD",w:["IQ ושפה","היקשרות","עוצמת EEG"],e:"שתי פרשנויות: התערבות לא יעילה, או תקופה רגישה שנסגרה."},
 {q:"מה הגיל המוקדם והממוצע לשיבוץ באומנה ב-BEIP?",a:"מוקדם 6 חודשים, ממוצע 22 חודשים",w:["מוקדם חודש, ממוצע 6 חודשים","מוקדם שנה, ממוצע 4 שנים","כולם שובצו בלידה"],e:"לכן ייתכן שחלק מהתקופות כבר נסגרו."}]},
q22:{t:"t4",v:[
 {q:"מה נמצא ב-ERA לגבי ילדים שאומצו לפני 6 חודשים, בתחום הקשב?",a:"לא הייתה עלייה בסימני חוסר קשב/פעלתנות יתר",w:["הייתה עלייה גדולה","כולם אובחנו עם ADHD","זה לא נבדק"],e:"בניגוד לתוצאות ב-BEIP."},
 {q:"איך אפשר להסביר את ההבדל בין ERA ל-BEIP בתחום הקשב?",a:"אולי המשפחות המאמצות היו טובות יותר, או שהתקופה הרגישה לקשב מוקדמת יותר",w:["ב-ERA לא בדקו קשב","ב-BEIP כל הילדים היו בני שנה","אין הבדל בין המחקרים"],e:"שתי הפרשנויות מופיעות בפרק."}]},
q23:{t:"t4",v:[
 {q:"אילו תוצאות השתפרו ב-BEIP בלי השפעה של הגיל?",a:"הפרעות מופנמות, תגובתיות רגשית ורכיבי ERP",w:["IQ ושפה","היקף הראש","ADHD"],e:"השפעה של ההתערבות, אבל בלי השפעת תזמון."},
 {q:"איך מפרשים השפעה של התערבות בלי השפעה של תזמון?",a:"בטווח הגילים של ההתערבות התקופות הרגישות עוד היו פתוחות מספיק להחלמה",w:["ההתערבות לא עבדה","התקופות כבר נסגרו","הגיל לא נמדד"],e:"ההתערבות התחילה בין 6 ל-31 חודשים."}]},
q24:{t:"t4",v:[
 {q:"מה הם P1, N170 ו-P400 שמוזכרים בפרק?",a:"רכיבים של פוטנציאלים מעוררים (ERP) שהשתפרו בעקבות האומנה",w:["סוגי הפרעות התנהגות","שאלונים להורים","שמות של מוסדות"],e:"Moulson et al., 2009."},
 {q:"באיזה טווח גילים התחילה ההתערבות ב-BEIP לפי הפרשנות בפרק?",a:"6 עד 31 חודשים",w:["0 עד 3 חודשים","3 עד 6 שנים","12 עד 15 שנים"],e:"בטווח הזה חלק מהתקופות עוד היו פתוחות."}]},
q25:{t:"t4",v:[
 {q:"מה נמצא ב-ERA בגיל 6 לגבי משך השהות במוסד?",a:"IQ, סימני כמו־אוטיזם, חוסר קשב והיקשרות לא מרוסנת קשורים ליניארית לזמן במוסד",w:["אין קשר לזמן במוסד","רק השפה קשורה לזמן במוסד","ככל שהזמן ארוך יותר התוצאות טובות יותר"],e:"זה ממצא מתאמי."},
 {q:"מה מלמדים הממצאים המתאמיים לפי הפרק?",a:"שההחלמה קשה יותר ככל שהילד מבוגר, אבל לא הרבה על תקופות רגישות",w:["שתקופות רגישות הוכחו","שאין קשר בין גיל להחלמה","שכל הילדים מחלימים לגמרי"],e:"מתאם ליניארי לא מראה תקופה מוגדרת."}]},
q26:{t:"t4",v:[
 {q:"מה נמצא ב-BEIP לגבי עוצמת EEG?",a:"ככל שהשיבוץ באומנה מוקדם יותר, העוצמה בגיל 42 חודשים גבוהה יותר וקרובה לילדים שלא היו במוסד",w:["אין קשר לגיל השיבוץ","שיבוץ מאוחר שיפר את ה-EEG","EEG לא נמדד"],e:"Marshall et al., 2008."},
 {q:"איזו סיבה מוזכרת לכך שמתאמים לא מלמדים הרבה על תקופות רגישות?",a:"תהליכי פיצוי עשויים להסתיר את סגירת התקופה",w:["המתאמים תמיד שגויים","אין מספיק משתתפים במחקרים","הילדים לא נבדקו"],e:"וגם: חסך חושי עשוי להאריך את פתיחת התקופה."}]},
q27:{t:"t4",v:[
 {q:"מהו \"גיל חיתוך\"?",a:"גיל שאחריו ההחלמה מקשיים מוקדמים נעשית קשה יותר באופן מובהק",w:["הגיל שבו ילד נכנס למוסד","הגיל שבו מסתיים המחקר","הגיל שבו ילד מתחיל לדבר"],e:"זה נראה כמו תקופה רגישה התנהגותית."},
 {q:"מה הראה הניתוח של Smyke et al. (2010) לגבי 24 חודשים?",a:"התוצאה הופיעה גם בגילי חיתוך אחרים, ולכן מדובר בקשר ליניארי ולא בגיל חיתוך אמיתי",w:["24 חודשים הוא גיל חיתוך אמיתי","אין קשר בין גיל השיבוץ להיקשרות","רק אחרי 30 חודשים יש השפעה"],e:"לכן צריך לבדוק כמה גילאי חיתוך."}]},
q28:{t:"t4",v:[
 {q:"למה צריך לבדוק כמה גילאי חיתוך ולא רק אחד?",a:"כדי לוודא שהקשר לא פשוט ליניארי",w:["כדי להגדיל את המדגם","כי כך דורשת האתיקה","כי גיל אחד תמיד מובהק"],e:"אם כל גיל חיתוך מובהק, זה קשר ליניארי."},
 {q:"מה מצא Smyke et al. (2010) לגבי שיבוץ באומנה לפני 24 חודשים?",a:"היקשרות מאורגנת בסבירות גבוהה יותר מאשר לא טיפוסית",w:["היקשרות לא טיפוסית בסבירות גבוהה יותר","אין השפעה על היקשרות","כל הילדים היו בטוחים"],e:"אבל גם בגילים אחרים נמצאה אותה תוצאה."}]},
q29:{t:"t4",v:[
 {q:"באיזה גיל נמצא גיל חיתוך לשפה ב-BEIP?",a:"15 חודשים",w:["6 חודשים","24 חודשים","36 חודשים"],e:"לפני 15 חודשים: שפה תקינה. אחרי: עיכוב."},
 {q:"באילו תחומים ב-BEIP שיבוץ לפני 24 חודשים נתן יתרון מובהק?",a:"IQ, עוצמת EEG, קוהרנטיות EEG וביטחון בהיקשרות",w:["היקף הראש ו-ADHD","רק שפה","רק התנהגות"],e:"השיבוץ היה בין 7 ל-33 חודשים."}]},
q30:{t:"t4",v:[
 {q:"מה מצאה המטא־אנליזה של ואן דן דריס ועמיתיה (2008)?",a:"ילדים שאומצו לפני 12 חודשים היו בטוחים בהיקשרות כמו ילדים שלא אומצו",w:["כל המאומצים לא בטוחים","אין הבדל לפי גיל האימוץ","רק שאומצו אחרי שנה היו בטוחים"],e:"הגנה רחבה, אבל לא מלאה."},
 {q:"מה מצא ERA לגבי ילדים שאומצו מרומניה לפני 6 חודשים?",a:"הם היו דומים לילדים שלא חוו מוסד ב-IQ, תפקוד ניהולי, כמו־אוטיזם וחוסר קשב",w:["הם היו בפיגור בכל התחומים","הם היו טובים יותר מילדים בריטים","לא נבדקו"],e:"תחומים שהחוקרים כינו \"ספציפיים למחסור\"."}]},
q31:{t:"t5",v:[
 {q:"מהי פונקציית מדרגה בהקשר הזה?",a:"ליקויים לא מופיעים לפני גיל מסוים, מופיעים אחריו, ולא מחמירים עם חשיפה ארוכה יותר",w:["ליקויים גדלים בהדרגה עם כל חודש במוסד","ליקויים נעלמים עם הגיל","ליקויים מופיעים רק לפני גיל מסוים"],e:"בשונה מקשר ליניארי."},
 {q:"מתי נוטה להופיע פונקציית המדרגה?",a:"כשבודקים את הילדים בגיל מבוגר יותר",w:["כשבודקים מיד אחרי האימוץ","רק אצל ילדים שלא היו במוסד","רק במחקרים קטנים"],e:"למשל ERA בגיל 11 ו-15."}]},
q32:{t:"t5",v:[
 {q:"למה לפי הפרק צורת הקשר בין זמן במוסד לתוצאה לא נבדקה היטב?",a:"מדגמים קטנים, טווח גילים מוגבל וחלוקה של הגיל לשתיים או לשלוש",w:["כי אין עניין בשאלה","כי כל המחקרים היו ניסויים","כי הגיל לא נמדד"],e:"כך אי אפשר לראות את הצורה המלאה."},
 {q:"מה ההבדל בין קשר ליניארי לפונקציית מדרגה?",a:"בליניארי כל חודש נוסף מחמיר, ובמדרגה יש קפיצה בגיל מסוים ואחריה אין החמרה",w:["אין הבדל","במדרגה אין שום השפעה","בליניארי יש רק קפיצה אחת"],e:"ראו את התרשים."}]},
q33:{t:"t5",v:[
 {q:"מה מצא ERA בגיל 11 ו-15?",a:"פונקציית מדרגה ב-6 חודשים, בלי החמרה עם חשיפה ארוכה יותר",w:["קשר ליניארי","שום השפעה של המוסד","מדרגה ב-24 חודשים"],e:"בגיל 6 נמצא קשר ליניארי."},
 {q:"מה נמצא אצל מאומצים ממוסדות של מחסור רגשי־חברתי?",a:"שיעורים גבוהים של בעיות רק אצל מי שאומץ ב-18 חודשים ומעלה ונבדק בגיל 12 ומעלה",w:["בעיות כבר מגיל 6 חודשים","אין בעיות בכלל","בעיות רק אצל מי שאומץ לפני 6 חודשים"],e:"Merz & McCall, 2010."}]},
q34:{t:"t5",v:[
 {q:"מה מצא מחקר המאומצים מרומניה של שנות ה-90, בניגוד ל-ERA?",a:"שהבעיות גדלו עם חשיפה ארוכה יותר למוסד",w:["שאין שום בעיות","שהמדרגה ב-18 חודשים","שהבעיות נעלמו בגיל 12"],e:"זה סותר את ממצא המדרגה של ERA."},
 {q:"באיזה גיל נמצאה מדרגה בתפקוד ניהולי לפי דיווח הורים?",a:"18 חודשים",w:["6 חודשים","12 חודשים","36 חודשים"],e:"Merz & McCall, 2011."}]},
q35:{t:"t5",v:[
 {q:"מה הגורם המשותף שהפרק מציע לכל הקבוצות?",a:"מחסור באינטראקציות רגשיות־חברתיות עם המטפלים",w:["תזונה לקויה","חוסר בצעצועים","בעיות גנטיות"],e:"הדמיון בצורת המדרגה ובתחומים מצביע על כך."},
 {q:"למה אי אפשר לקבוע בוודאות שמה שקובע הוא הגיל ולא משך החשיפה?",a:"כי יש מעט מדי ילדים שנכנסים למוסד בגיל 18 חודשים",w:["כי לא מדדו גיל","כי כל הילדים נכנסו בגיל שנה","כי משך החשיפה תמיד זהה"],e:"בדרך כלל הכניסה בלידה, ולכן גיל ומשך חופפים."}]},
q36:{t:"t5",v:[
 {q:"איך משפיעה חומרת המוסד לפי הפרק?",a:"מוסדות של מחסור כולל וקשה פוגעים מוקדם יותר וביותר בעיות",w:["אין השפעה לחומרה","מוסדות קשים פוגעים פחות","רק מוסדות רגשיים פוגעים"],e:"למשל רומניה של שנות ה-90 מול סנט פטרסבורג."},
 {q:"מה תואם לפי הפרק את תוצאות המדרגה?",a:"תקופה רגישה התנהגותית בערך ב-18 החודשים הראשונים",w:["תקופה קריטית בגיל 5","אין שום תקופה רגישה","תקופה רגישה בגיל ההתבגרות בלבד"],e:"ומי שעוזב לפני 6 חודשים, כנראה בלי השלכות ארוכות."}]},
q37:{t:"t6",v:[
 {q:"למה הפער ב-IQ בין הקבוצות ב-BEIP הצטמצם בגיל 8?",a:"כי ה-IQ של קבוצת הטיפול הרגיל עלה, כשרובם כבר לא היו במוסד",w:["כי ה-IQ של קבוצת האומנה ירד","כי הילדים נבחנו בשפה אחרת","כי חלק מהילדים לא נבדקו"],e:"הם חזרו להורים, אומצו או עברו לאומנה ממשלתית."},
 {q:"מי היו עם ה-IQ הגבוה ביותר בגיל 8 ב-BEIP?",a:"הילדים באומנה האיכותית של BEIP",w:["הילדים שנשארו במוסד","הילדים שחזרו להורים","לא היה הבדל"],e:"ומי שנשאר במוסד היה עם IQ נמוך באופן מובהק."}]},
q38:{t:"t6",v:[
 {q:"מה נמצא לגבי תזמון השיבוץ וה-IQ בגיל 8?",a:"התזמון כבר לא היה קשור ל-IQ",w:["התזמון היה החשוב ביותר","רק מי ששובץ לפני שנה הצליח","ה-IQ לא נמדד"],e:"זה תואם תהליכי פיצוי."},
 {q:"מה מראים תהליכי פיצוי?",a:"שיש מסלולים חלופיים להתנהגות מורכבת כמו אינטליגנציה",w:["שחוויה מוקדמת לא חשובה","שאי אפשר להחלים","שכל ילד מגיע לאותו IQ"],e:"אצל בני אדם הגיוני שיהיו מסלולים חלופיים."}]},
q39:{t:"t6",v:[
 {q:"לפי קנודסן ועמיתיו (2006), למה החוויה המוקדמת חשובה?",a:"כי היא יוצרת את המסלול היעיל ביותר לתוצאה טובה",w:["כי היא יוצרת את המסלול היחיד","כי אחריה אי אפשר ללמוד","כי היא קובעת את הגנים"],e:"לא המסלול היחיד, אלא היעיל ביותר."},
 {q:"למה פיצוי מאוחר יקר יותר?",a:"בגלל המבנה ההיררכי של המוח, ולכן הוא דורש יותר אנרגיה ומשאבים",w:["כי הוא לא אפשרי","כי ילדים מבוגרים לא לומדים","כי הוא תמיד נכשל"],e:"ומוכר כפחות יעיל ויקר יותר."}]},
q40:{t:"t6",v:[
 {q:"מה המשמעות של פיצוי מאוחר ברמת המדיניות לפי הפרק?",a:"הוא דורש יותר משאבים ומוכר כפחות יעיל והרבה יותר יקר",w:["הוא זול יותר מהתערבות מוקדמת","אין לו משמעות למדיניות","הוא תמיד מוצלח"],e:"לכן עדיף להתערב מוקדם."},
 {q:"מה הקשר בין \"מסלול יעיל\" לבין המלצת הפרק?",a:"התערבות מוקדמת משתמשת במסלול היעיל, ולכן \"כמה שיותר מוקדם, יותר טוב\"",w:["אין קשר","המסלול היעיל נוצר בגיל ההתבגרות","עדיף לחכות לפיצוי"],e:"פיצוי אפשרי, אבל במחיר גבוה."}]},
q41:{t:"t6",v:[
 {q:"מהן \"השפעות רדומות\"?",a:"תוצאות שמופיעות הרבה אחרי החוויה שגרמה להן",w:["השפעות שנעלמות אחרי השינה","השפעות שמופיעות מיד ונעלמות","השפעות של תרופות"],e:"החוויה בונה בסיס ליכולת שמופיעה מאוחר."},
 {q:"מה מצאו Maurer ועמיתיו אצל ילדים שנולדו עם קטרקט?",a:"אחרי שיקום מהיר, נמצאו מאוחר יותר ליקויים ברגישות לניגודיות ובעיבוד הוליסטי של פנים",w:["הם לא השתקמו כלל","לא היו להם שום ליקויים","הליקויים נעלמו בגיל ההתבגרות"],e:"יכולות שמתפתחות מאוחר בהתפתחות תקינה."}]},
q42:{t:"t6",v:[
 {q:"מתי הופיעו בעיות אצל ילדים ממוסדות של מחסור רגשי־חברתי (לא כולל)?",a:"רק בגיל 12 ומעלה",w:["כבר בגיל שנה","בגיל 6","בכלל לא"],e:"השפעה רדומה."},
 {q:"מה מלמדות ההשפעות הרדומות על המוסד?",a:"חוויה חסרה לא מפתחת כישורים בסיסיים שנעשים חשובים יותר מאוחר",w:["המוסד רק מלמד התנהגויות שמתאימות למוסד","אין למוסד השפעה ארוכה","הבעיות נעלמות בהתבגרות"],e:"למשל בדרישות וללחצים של גיל ההתבגרות."}]},
q43:{t:"t6",v:[
 {q:"מה נמצא לגבי IQ ככל שהזמן במוסד ארוך יותר?",a:"יותר IQ נמוך מאוד, וגם נעלמים הילדים עם IQ מעל הממוצע",w:["רק ירידה קלה בממוצע","אין שינוי","יותר ילדים עם IQ גבוה"],e:"Loman et al., 2009."},
 {q:"מה הכיוון החדש למחקר שהפרק מציע?",a:"לבדוק תקופות רגישות לכשירות ולמומחיות, ולא רק להפרעה",w:["להפסיק לחקור מוסדות","לחקור רק בעלי חיים","לבדוק רק IQ"],e:"השאלה עשויה לקבל תשובות שונות."}]},
q44:{t:"t6",v:[
 {q:"מה מלמד המחקר של מאורר על \"מומחיות\"?",a:"מחסור חזותי מוקדם הגביל את היכולת להפוך למומחה לעיבוד פנים",w:["מחסור חזותי משפר מומחיות","אין קשר בין ראייה למומחיות","מומחיות נקבעת רק בגיל מבוגר"],e:"ומכאן השאלה על מחסור חברתי."},
 {q:"למה גיל ההתבגרות עשוי לחשוף מגבלות של מחסור מוקדם?",a:"כי החיים הרגשיים, החברתיים והלימודיים נעשים מורכבים ודורשים כישורים מתוחכמים ומווסתים",w:["כי בגיל ההתבגרות המוח מפסיק להתפתח","כי מתבגרים לא לומדים","כי אין בו דרישות חדשות"],e:"זו השפעה רדומה אפשרית."}]},
q45:{t:"t7",v:[
 {q:"למה קשה להבין תקופות רגישות ברמת המעגל בבני אדם?",a:"בעיות אתיות בשינוי סביבות קשות ומגבלות טכניות ברזולוציה של מדידת המוח",w:["כי אין מעגלים עצביים בבני אדם","כי לא מעניין לחקור את זה","כי כל הילדים זהים"],e:"מסקנה 1."},
 {q:"מה המשמעות של היעדר השפעת תזמון בהתנהגות מסוימת?",a:"זה לא אומר שאין תקופה רגישה, אבל אי אפשר להסיק עד שנחקור את המוח",w:["שאין תקופה רגישה בוודאות","שההתערבות לא עבדה","שהגיל לא נמדד"],e:"מסקנה 3."}]},
q46:{t:"t7",v:[
 {q:"לפי מסקנה 4, באיזה תחום נמצאים רוב החריגים לכלל של 4 עד 6 חודשים?",a:"התחום הרגשי־חברתי",w:["התחום הקוגניטיבי","התחום המוטורי","התחום הפיזי"],e:"החריגים קשורים יותר לתחום הרגשי־חברתי."},
 {q:"מה אומרת מסקנה 2?",a:"כשמסיקים מהתנהגויות מורכבות, מעריכים בחסר את התקופות הרגישות ברמת המעגלים",w:["אין תקופות רגישות","התנהגויות מורכבות קלות למדידה","יש תקופה רגישה אחת לכל התנהגות"],e:"הרבה תקופות של מעגלים עומדות מאחורי כל התנהגות."}]},
q47:{t:"t7",v:[
 {q:"מה אומרת מסקנה 5 לגבי 18 עד 24 החודשים הראשונים?",a:"חשיפה למוסד חסר בתקופה הזו קשורה להתפתחות פחות טובה, אבל גיל ומשך עוד לא הופרדו",w:["אין השפעה בתקופה הזו","רק אחרי 24 חודשים יש השפעה","גיל ומשך הופרדו לגמרי"],e:"והתוצאות תלויות בגורמים רבים."},
 {q:"מה ההמלצה לקליניקה ולמדיניות לפי מסקנה 8?",a:"\"כמה שיותר מוקדם, יותר טוב\", כי ניסיון להיות מדויקים יותר מוקדם מדי",w:["להמתין לגיל 18 חודשים","לקבוע גיל חיתוך אחד לכל התחומים","לוותר על התערבות אחרי שנה"],e:"זו מסקנת הפרק."}]},
q48:{t:"t7",v:[
 {q:"לפי מסקנה 5, באיזה גיל נמצא גיל חיתוך לשפה?",a:"15 חודשים",w:["6 חודשים","24 חודשים","18 חודשים"],e:"שפה הבעתית והבנתית."},
 {q:"מה מסקנה 7 אומרת על הספרות?",a:"היא מוגבלת מתודולוגית, ומסוכן להסיק ממחקר אחד",w:["היא מושלמת","אין בה מחקרי אורך","היא מבוססת רק על בעלי חיים"],e:"אבל אפשר לנצל נתונים קיימים לבדיקת השערות."}]}
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  if(blk.q)slot.appendChild(qCard(blk.q,next,"בדיקה קצרה"));
  else{const b=document.createElement("button");b.className="primary";b.textContent="המשך";b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
