<tr><td><b>שיפור הטיפול בתוך המוסד</b></td><td>סנט פטרסבורג: טיפול רגיל, שינוי מבני בצוות, או הדרכה בלבד, בשלושה בתי תינוקות</td><td>משפרים את המוסד עצמו במקום להוציא ממנו את הילד</td></tr></tbody></table></div>`;

const T=[
 {id:"t1",icon:"clock",title:"האם הניסיון המוקדם חשוב יותר?",blocks:[
  {h:"תקציר הפרק",html:`${def("על מה הנושא",`האם מה שקורה בשנים הראשונות משפיע יותר ממה שקורה אחר כך? הנושא מציג את השאלה ואת שני המושגים המרכזיים.<br><b>מה נלמד כאן:</b> השערת הניסיון המוקדם · תקופה רגישה · תקופה קריטית`)}<p>הפרק סוקר <mark>תקופות רגישות</mark> ${E("Sensitive periods")} בהתפתחות המוח, על סמך המחקר על ילדים שגדלו ב<b>מוסדות</b>. תקופות רגישות הן זמנים שבהם חוויות משפיעות <b>באופן ייחודי</b> על התפתחות המעגלים העצביים.</p>${tiles([["brain","הערכת חסר","בבני אדם מסיקים על תקופות רגישות מהתנהגויות מורכבות, ולכן <b>מעריכים בחסר</b> כמה תקופות רגישות יש ברמת המעגלים"],["check","4 עד 6 חודשים","גידול במוסד שמוגבל ל-4 עד 6 החודשים הראשונים לא נמצא קשור לעלייה מובהקת בסיכון לנזק ארוך טווח, ברוב התחומים"],["target","\"מוקדם יותר עדיף\"","מעבר לזה, העדויות לתקופות רגישות פחות משכנעות. לכן הכלל הסביר כיום הוא \"כמה שיותר מוקדם, יותר טוב\""]])}`,q:"q1"},
  {h:"השערת הניסיון המוקדם",html:`<p>מחלוקת ותיקה בפסיכולוגיה: האם החוויות של השנים הראשונות <b>חשובות באופן ייחודי</b>, או שהן שקולות לחוויות בתקופות מאוחרות יותר?</p>${def("מושג מפתח",`<mark>השערת הניסיון המוקדם</mark> ${E("Early experience hypothesis")}: כ-3 השנים הראשונות חשובות יותר, בגלל השינויים העמוקים במוח שקורים בהן (Sheridan & Nelson, 2009). אחרי ש"היסודות" העצביים נבנו בדרך מסוימת, קשה יותר לתקן אותם.`)}<p>מחקרים רבים מצאו קשר חזק בין חוויות טיפול קשות מוקדמות לקשיי הסתגלות בהמשך. אבל O'Connor & Parfitt (2009) ציינו שמעט מחקרים <b>בדקו</b> את ההשערה באמת.</p>${rem("<b>למה קשה לבדוק?</b> סביבת הטיפול של רוב הילדים <b>רציפה</b>: מי שגדל בסביבה טובה ממשיך בה. צריך מחקרים שבהם ילדים צעירים עוברים <b>שינוי משמעותי</b> בתנאי הטיפול, ואז משווים את התפקוד בסביבה החדשה לזה שבסביבה המקורית.")}${ex(`השאלה היא כמו לשאול אם היסודות של בית חשובים יותר מהקומות העליונות. אם היסודות עקומים, האם אפשר לתקן אחר כך, או שכל הבית יישאר עקום?`)}`,q:"q3"},
  {h:"תקופה רגישה מול תקופה קריטית",html:`<p>המוח מסוגל להסתגל לחוויות שונות, אבל לגמישות הזו יש מגבלות. קנודסן (Knudsen, 2004) הבחין בין שני מושגים:</p>${tiles([["clock","תקופה רגישה",`${E("Sensitive period")} זמן מוגבל בהתפתחות שבו ההשפעה של החוויה <b>חזקה במיוחד</b>`],["lock","תקופה קריטית",`${E("Critical period")} זמן שבו חוויות מסוימות <b>הכרחיות</b> להתפתחות תקינה ויוצרות שינוי <b>קבוע</b> במעגלים העצביים`]])}${rem("בבני אדם כמעט אין עדויות לתקופות קריטיות, לפחות מעבר להתפתחות התפיסתית. לכן הפרק עוסק ב<b>תקופות רגישות</b>. השאלה המרכזית: כמה זמן התקופה \"פתוחה\" לשינוי, ומתי היא נסגרת והופכת לעמידה יחסית לחוויות חדשות.")}${ex(`<b>קריטית</b>: כמו חלון שנסגר לגמרי. אם חתלתול לא רואה כלום בשבועות הראשונים, הראייה לא תתפתח. <b>רגישה</b>: כמו חלון שנסגר חלקית. ללמוד שפה שנייה קל מאוד בילדות, ואפשר גם בבגרות, אבל קשה יותר.`)}`,q:"q5"}
 ]},
 {id:"t2",icon:"brain",title:"תקופות רגישות ברמת המעגל העצבי",blocks:[
  {h:"למה דווקא ילדים ממוסדות",html:`${def("על מה הנושא",`תקופות רגישות קיימות ברמה של מעגלים במוח. הנושא מסביר למה ילדים ממוסדות הם מקרה מבחן, ולמה קשה למדוד את ההשפעה.<br><b>מה נלמד כאן:</b> ילדים ממוסדות · מה קורה במעגל · פיצוי · החוויה שלפני המוסד`)}<p>ילדים במוסדות גדלים לעתים קרובות ב<b>מחסור חברתי וחומרי</b>. כשהם עוברים אחר כך לסביבה שונה מאוד, אפשר לחקור את המעבר כ"התערבות". מכיוון שהמעבר קורה ב<b>גילים שונים</b>, זה מאפשר לבחון את השערת התקופה הרגישה.</p>${def("אבל זהירות",`קנודסן הדגיש שתקופות רגישות הן <b>תכונות של מעגלים עצביים</b>, לא של התנהגויות. אנחנו מסיקים עליהן מכישורים והתנהגויות, וזו מגבלה חשובה.`)}`,q:"q7"},
  {h:"מה קורה במעגל",html:`${tiles([["sprout","לפני הפעלה חזקה","המעגל במצב שמעודד שינוי: הסינפסות המעוררות חלשות, וההשפעות המעכבות מוגבלות"],["lock","אחרי הפעלה חוזרת","הסינפסה מתייצבת לפי הקלט שקיבלה, והתקופה הרגישה של המעגל <b>נסגרת</b>"],["clock","בלי מספיק קלט","היעדר הפעלה או הפעלה מועטה עלולים בהתחלה <b>להאריך</b> את התקופה הרגישה"]])}<p>מעגלים כאילו "מצפים" לרמות ולסוגים מסוימים של קלט. גם אחרי שהתקופה נגמרת עדיין אפשר לשנות משהו, אבל זה דורש <b>יותר אנרגיה</b>. מידת הגמישות שונה ממעגל למעגל, והסינפסה גמישה יותר לחוויות מוקדמות.</p>`,q:"q9"},
  {h:"למה מעריכים בחסר",html:`<p>התנהגויות מורכבות כמו <b>IQ, היקשרות ופסיכופתולוגיה</b> הן כנראה תוצאה רחוקה של <b>הרבה</b> תקופות רגישות של מעגלים שונים, שפועלות יחד.</p>${def("פיצוי",`המוח בנוי כך שמעגלים ברמה גבוהה יכולים <mark>לפצות</mark> במידה מסוימת על עיבוד לא תקין ברמות נמוכות. לכן ניתוח של התנהגות מורכבת כנראה <b>מעריך בחסר</b> את ההשפעה של תקופות רגישות.`)}${rem("יש מעגלים שלא מושפעים מחוויה, ויש כאלה שנשארים פתוחים לחוויה כמעט ללא הגבלה. רוב המחקרים קצרי טווח, ורק מחקרי אורך ארוכים יכולים לגלות אם עוד אפשר ללמוד ולהשתנות.")}`,q:"q11"},
  {h:"החוויה שלפני המוסד",html:`<p>גם החוויה <b>שלפני</b> המוסד, כולל התקופה <b>שלפני הלידה</b>, רחוקה מלהיות טיפוסית.</p>${ex("ברומניה, לפני הרפורמות ברווחה, רוב הילדים במוסדות ננטשו בלידה, שהו בבית חולים ליולדות ורק אז הועברו למוסד. לרבות מהאמהות היה טיפול טרום־לידתי מועט ותזונה דלה, וייתכן שנחשפו לניקוטין, אלכוהול או חומרים אחרים.")}${rem("כל אחד מהגורמים האלה מעלה סיכון, והם הופיעו לרוב יחד, כך שהסיכון <b>המצטבר</b> גדול עוד יותר. בניגוד למחקר בבעלי חיים, שבו אפשר לתזמן הפרעה בדיוק, כאן הגידול במוסד מגיע בדרך כלל אחרי חוויות חריגות קודמות.")}`,q:"q13"}
 ]},
 {id:"t3",icon:"flask",title:"איך חוקרים את זה",blocks:[
  {h:"קבוצות השוואה",html:`${def("על מה הנושא",`איך חוקרים את זה בלי לפגוע בילדים? הנושא מציג את קבוצות ההשוואה, ואת סוגי ההתערבות.<br><b>מה נלמד כאן:</b> קבוצות השוואה · המחקר האידיאלי · שלושה סוגי התערבות`)}${tiles([["people","ילדים ממשפחות דומות למאמצות","לא בודק תקופות רגישות אחרי הלידה, אבל נותן מדד לרמה אופטימלית"],["check","ילדים שהיו נכנסים למוסד","אילו לא היה אירוע חיצוני (כמו שינוי מדיניות). זו ההשוואה <b>הטובה ביותר</b>, אבל קשה למצוא אותה"],["split","מאומצים מוקדם מול מאוחר","קירוב סביר, אבל עלולה להיות <b>הטיית בחירה</b>"]])}`,q:"q15"},
  {h:"המחקר האידיאלי (שלא ייעשה)",html:`<p>מחקר אידיאלי היה מתחיל בהערכה מקיפה של הרבה ילדים <b>בזמן</b> השהות במוסד, ועוקב אחריהם לאורך זמן:</p>${tiles([["clock","גיל ההתערבות","קבוצת ההתערבות משתנה באופן שיטתי בגיל שבו מקבלים טיפול משופר"],["building","קבוצת ביקורת","ממשיכה בטיפול הרגיל במוסד שנים רבות"],["sprout","גיל הכניסה","משנים גם את הגיל שבו נכנסים למוסד, וכוללים ילדים שהיו מיועדים למוסד ושובצו בסביבה טובה מהלידה"]])}${rem("מסיבות <b>אתיות ומעשיות</b> מחקר כזה לא ייעשה לעולם בבני אדם. לכן בוחנים מחקרים שיש בהם חלק מהמאפיינים האלה, ומסיקים מהדפוס של התוצאות.")}`,q:"q17"},
  {h:"שלושה סוגי התערבות",html:`${interTable}<p>במחקרים האלה נמצאו בדרך כלל <b>השפעות גדולות</b> לכל שלושת סוגי ההתערבות. אבל הקשר בין <b>התזמון</b> לתוצאות נבדק בדרכים שונות, והתוצאות שונות לפי התחום.</p>`,q:"q19"}
 ]},
 {id:"t4",icon:"chart",title:"מה נמצא לגבי תזמון",blocks:[
  {h:"אין השפעה להתערבות",html:`${def("על מה הנושא",`מה המחקרים מצאו לגבי התזמון: האם משנה מתי הילד יצא מהמוסד?<br><b>מה נלמד כאן:</b> אין השפעה · השפעה בלי תזמון · גילאי חיתוך · BEIP`)}<p>ב-BEIP לא נמצא הבדל ב<b>היקף הראש</b>, ולא הייתה השפעה על <b>הפרעות מוחצנות</b> (ADHD, מרד מתריס).</p>${tiles([["x","הסבר 1","ההתערבות (אומנה איכותית) פשוט לא יעילה לתחומים האלה. אולי התערבות חזקה או ממוקדת יותר הייתה מצליחה"],["lock","הסבר 2","התקופה הרגישה כבר <b>נסגרה</b>: הגיל המוקדם ביותר לאומנה היה 6 חודשים, והממוצע 22 חודשים"]])}${def("השוואה ל-ERA",`ב-ERA ילדים שאומצו <b>לפני 6 חודשים</b> לא הראו עלייה בסימני חוסר קשב/פעלתנות יתר. ההבדל: אולי המשפחות המאמצות היו טובות יותר מהאומנה, או שהתקופה הרגישה לקשב מוקדמת מהגיל שבו התחילה ההתערבות ב-BEIP.`)}`,q:"q21"},
  {h:"יש השפעה, אין תזמון",html:`<p>ב-BEIP ההתערבות <b>הפחיתה הפרעות מופנמות</b>, שיפרה את <b>התגובתיות הרגשית</b> והגדילה רכיבים של <b>פוטנציאלים מעוררים</b> ${E("ERP")} (P1, N170, P400), אבל <b>בלי</b> השפעה של הגיל.</p>${rem("פירוש אפשרי: בטווח הגילים שבו התחילה ההתערבות (6 עד 31 חודשים) התקופות הרגישות של ההתנהגויות האלה עוד היו <b>פתוחות מספיק</b> כדי לאפשר החלמה חלקית או מלאה.")}`,q:"q23"},
  {h:"ממצאים מתאמיים",html:`<p>במחקרים רבים <b>משך המחסור</b> (הזמן במוסד, לפי גיל האימוץ) נמצא <b>במתאם</b> עם התוצאות:</p>${tiles([["chart","ERA בגיל 6","IQ, סימנים של \"כמו־אוטיזם\", חוסר קשב ו<b>היקשרות לא מרוסנת</b> (התנהגות לא מבחינה) קשורים ליניארית לזמן במוסד"],["people","מאומצים בין־ארציים","גיל האימוץ ומשך המיסוד קשורים לגישה לא מרוסנת לזרים (Bruce et al., 2009)"],["brain","BEIP","ככל שהשיבוץ באומנה מוקדם יותר: יותר עוצמת EEG בגיל 42 חודשים, ויותר סיכוי להיקשרות טיפוסית"]])}${rem("המתאמים מראים ש<b>ההחלמה קשה יותר ככל שהילד מבוגר</b>, אבל לא מלמדים הרבה על תקופות רגישות. הסיבות: חסך חושי עשוי להאריך את פתיחת התקופה, תהליכי פיצוי עשויים להסתיר את סגירתה, ויש פיצוי ברמות גבוהות במוח.")}`,q:"q25"},
  {h:"גילאי חיתוך",html:`<p><mark>גיל חיתוך</mark> ${E("Age cut point")}: גיל שאחריו ההחלמה מקשיים מוקדמים נעשית קשה יותר באופן מובהק. זה נראה כמו <b>תקופה רגישה התנהגותית</b>. אבל צריך לבדוק <b>כמה</b> גילאי חיתוך, כדי לוודא שהקשר לא פשוט ליניארי.</p>${ex("Smyke et al. (2010): ילדים שהועברו לאומנה לפני 24 חודשים היו בסבירות גבוהה יותר עם היקשרות מאורגנת. זה נראה כמו תקופה רגישה של 24 חודשים. אבל אותה תוצאה הופיעה גם לפני 30, 28, 26, 22, 20 ו-18 חודשים, כלומר קשר <b>ליניארי</b> ולא גיל חיתוך אמיתי.")}${fig("cutoffs","גילאי החיתוך שנמצאו בתחומים שונים")}`,q:"q27"},
  {h:"מאומצים מוקדם",html:`${tiles([["leaf","פרויקט האימוץ הרומני (קנדה)","שאומצו לפני 4 חודשים התפתחו טוב יותר מהמאוחרים, ובדומה לילדים קנדים שלא אומצו (Ames, 1997)"],["check","ERA: לפני 6 חודשים","דומים לילדים שלא חוו מוסד ב-IQ, תפקוד ניהולי, כמו־אוטיזם וחוסר קשב, וגם ב\"פגיעה כוללת\""],["people","מטא־אנליזה (2008)","שאומצו לפני 12 חודשים היו בטוחים בהיקשרות כמו ילדים שלא אומצו. הגנה רחבה, אבל לא מלאה"]])}${def("BEIP",`שיבוץ לאומנה בין 7 ל-33 חודשים. מי ששובץ <b>לפני 24 חודשים</b> היה במצב טוב יותר ב-IQ, עוצמת EEG, קוהרנטיות EEG וביטחון בהיקשרות. ב<b>שפה</b>: מי ששובץ לפני 15 חודשים הגיע לשפה תקינה, ואחרי 15 חודשים היה עיכוב.`)}`,q:"q29"}
 ]},
 {id:"t5",icon:"pyramid",title:"פונקציית מדרגה",blocks:[
  {h:"ליניארי או מדרגה",html:`${def("על מה הנושא",`האם הנזק עולה בהדרגה עם כל חודש במוסד, או קופץ בבת אחת אחרי גיל מסוים?<br><b>מה נלמד כאן:</b> ליניארי מול מדרגה · הממצאים · מה אפשר להסיק`)}<p>הרבה מחקרים היו קטנים או עם טווח גילאים מוגבל, וחילקו את הגיל לשתיים או לשלוש. לכן הצורה של הקשר בין זמן במוסד לתוצאה לא נבדקה היטב. כמה מחקרים כן בדקו, ומצאו <mark>פונקציית מדרגה</mark> ${E("Step function")}:</p>${fig("step")}${def("פונקציית מדרגה",`ליקויים <b>לא מופיעים</b> אצל מי שאומץ לפני גיל מסוים, <b>מופיעים</b> אחריו, ו<b>לא מחמירים</b> עם חשיפה ארוכה יותר למוסד. היא מופיעה בעיקר כשבודקים את הילדים בגיל מבוגר יותר.`)}${ex(`<b>ליניארי</b>: כמו רמפה, כל חודש נוסף במוסד מוסיף עוד קצת נזק. <b>מדרגה</b>: כמו מדרגה, עד גיל מסוים אין נזק, ואחריו הנזק קופץ בבת אחת.`)}`,q:"q31"},
  {h:"הממצאים",html:`${tiles([["chart","ERA","בגיל 6 נמצא קשר ליניארי, אבל בגיל 11 ו-15 נמצאה מדרגה ב-<b>6 חודשים</b>. חשיפה ארוכה יותר לא הייתה קשורה לתוצאות גרועות יותר"],["people","מוסדות של מחסור רגשי־חברתי","שיעורים גבוהים של בעיות התנהגות רק אצל מי שאומץ ב-<b>18 חודשים</b> ומעלה, ורק כשנבדקו בגיל 12 ומעלה"],["brain","תפקוד ניהולי","מדרגה דומה ב-18 חודשים בדיווח הורים, בלי החמרה בגילי אימוץ מאוחרים יותר"]])}${ex("מחקר על מאומצים מרומניה של שנות ה-90 מצא דווקא עלייה בבעיות אחרי 6 חודשים, ושהבעיות <b>כן</b> גדלו עם חשיפה ארוכה יותר, בניגוד ל-ERA.")}`,q:"q33"},
  {h:"מה אפשר להסיק",html:`${tiles([["clock","תקופה של כ-18 חודשים","תואם תקופה רגישה התנהגותית בערך ב-18 החודשים הראשונים. מי שעוזב לפני 6 חודשים, כנראה בלי השלכות ארוכות"],["question","גיל או משך?","אי אפשר לשלול שמה שקובע הוא <b>משך</b> החשיפה ולא הגיל. יש מעט מדי ילדים שנכנסים למוסד בגיל 18 חודשים"],["building","חומרת המוסד","מוסדות של מחסור כולל וקשה פוגעים מוקדם יותר ויותר מאשר מוסדות שחסר בהם בעיקר קשר רגשי־חברתי"]])}${rem("הדמיון בין הקבוצות מצביע על <b>גורם משותף</b>: מחסור באינטראקציות רגשיות־חברתיות עם המטפלים. (הסביבה הרגשית במוסדות ברומניה בשנות ה-90 הייתה קשה עוד יותר מזו שבסנט פטרסבורג.)")}`,q:"q35"}
 ]},
 {id:"t6",icon:"sprout",title:"חוויות מאוחרות: פיצוי והשפעות רדומות",blocks:[
  {h:"פיצוי: ה-IQ בגיל 8",html:`${def("על מה הנושא",`מה קורה אחרי שהילד יוצא? הנושא מציג שני תהליכים הפוכים: פיצוי, ונזק שמופיע רק מאוחר יותר.<br><b>מה נלמד כאן:</b> פיצוי · המחיר · השפעות רדומות · הפרעה או מומחיות`)}<p>ב-BEIP נמצאה השפעה ברורה של תזמון על IQ. אבל במעקב בגיל 8 הפער בין קבוצת הטיפול הרגיל לקבוצת האומנה <b>הצטמצם</b> ולא היה מובהק.</p>${tiles([["chart","למה הפער קטן","לא כי קבוצת האומנה ירדה, אלא כי קבוצת הטיפול הרגיל <b>עלתה</b>: רובם כבר לא היו במוסד (חזרו להורים, אומצו או עברו לאומנה ממשלתית)"],["building","מי שנשאר במוסד","מי שעוד היה במוסד בגיל 8 היה עם IQ נמוך באופן מובהק"],["check","אומנת BEIP","הילדים באומנה האיכותית היו עם ה-IQ הגבוה ביותר"]])}${rem("בגיל 8 <b>תזמון</b> השיבוץ כבר לא היה קשור ל-IQ. זה תואם <mark>תהליכי פיצוי</mark>: מסלולים חלופיים להתנהגות מורכבת כמו אינטליגנציה.")}${ex(`<b>פיצוי</b>: כמו נהג שהכביש הראשי חסום ומוצא דרך עוקפת. הוא מגיע, אבל בדרך אחרת וארוכה יותר.`)}`,q:"q37"},
  {h:"באיזה מחיר?",html:`${def("המסלול היעיל ביותר",`קנודסן, הקמן, קמרון ושונקוף (2006): החוויה המוקדמת חשובה לא כי היא יוצרת את המסלול <b>היחיד</b> לתוצאה טובה, אלא כי היא יוצרת את המסלול <b>היעיל ביותר</b>.`)}<p>פיצוי מאוחר יקר יותר באנרגיה, בגלל המבנה ההיררכי של המוח. ברמת המדיניות הוא דורש יותר משאבים, ומוכר יותר ויותר כ<b>פחות יעיל והרבה יותר יקר</b>.</p>`,q:"q39"},
  {h:"השפעות רדומות",html:`<p><mark>השפעות רדומות</mark> ${E("Sleeper effects")}: תוצאות שמופיעות הרבה אחרי החוויה. חוויות מוקדמות בונות בסיס עצבי ליכולות שמופיעות מאוחר.</p>${ex("Maurer et al. (2007): ילדים שנולדו עם קטרקט שחסם כל קלט חזותי מובנה. הקטרקט הוסר בגיל חודש עד שנה. היה \"שיקום\" מהיר והם נראו תקינים שנים, אבל מאוחר יותר נמצאו ליקויים ב<b>רגישות לניגודיות בתדר גבוה</b> וב<b>עיבוד הוליסטי של פנים</b>, יכולות שמתפתחות מאוחר.")}${tiles([["building","מחסור קשה (רומניה)","בעיות כבר בגיל מוקדם, בערך בגיל 6"],["clock","מחסור רגשי־חברתי","בעיות התנהגות וליקויי תפקוד ניהולי הופיעו רק בגיל 12 ומעלה"]])}${rem("כלומר המוסד לא רק מלמד התנהגויות שמתאימות למוסד. חוויה מוקדמת חסרה <b>לא מפתחת</b> כישורים בסיסיים, שנעשים חשובים יותר במשימות מאוחרות, כמו הדרישות והלחצים של גיל ההתבגרות.")}`,q:"q41"},
  {h:"הפרעה או מומחיות?",html:`<p>במחקר של מאורר, מחסור חזותי מוקדם הגביל את היכולת להפוך ל<b>מומחה</b> לעיבוד פנים. אולי גם מחסור חברתי מגביל סוגים מסוימים של <mark>מומחיות</mark> ${E("Expertise")}.</p>${def("דוגמה מ-IQ",`עם יותר זמן במוסד יש יותר ילדים עם IQ של <b>שתי סטיות תקן מתחת לממוצע</b>. אבל בולט גם ש<b>נעלמים</b> הילדים עם IQ מעל הממוצע וגבוה (Loman et al., 2009).`)}${rem("גיל ההתבגרות דורש כישורים מתוחכמים ומווסתים. ייתכן שזה זמן שבו מחסור מוקדם יגביל מומחיות, כמו השפעה רדומה. אולי יש <b>תקופות רגישות לכשירות</b> ולא רק להפרעה, וזה כיוון מחקר חדש.")}`,q:"q43"}
 ]},
 {id:"t7",icon:"check",title:"מסקנות ראשוניות",blocks:[
  {h:"מסקנות 1 עד 4",html:`${def("על מה הנושא",`המסקנות של הפרק, בשמונה נקודות.<br><b>מה נלמד כאן:</b> מסקנות 1–4 · מסקנות 5–8`)}<ol><li><b>מגבלות מחקר:</b> קשה להבין תקופות רגישות ברמת המעגלים בבני אדם, בגלל בעיות אתיות של שינוי סביבות קשות ומגבלות טכניות ברזולוציה של מדידת המוח.</li><li><b>הערכת חסר:</b> כשמסיקים מהתנהגויות מורכבות, מעריכים בחסר את התקופות הרגישות ברמת המעגלים.</li><li><b>היעדר תזמון:</b> בהרבה התנהגויות אין עדות להשפעת התזמון. זה לא אומר שאין תקופה רגישה, אבל אי אפשר להסיק עד שנוכל לחקור את המוח.</li><li><b>4 עד 6 חודשים:</b> ברוב התחומים, מוסד שמוגבל ל-4 עד 6 החודשים הראשונים לא מעלה את שיעור הנזק ארוך הטווח. החריגים קשורים יותר לתחום הרגשי־חברתי מאשר הקוגניטיבי.</li></ol>`,q:"q45"},
  {h:"מסקנות 5 עד 8",html:`<ol start="5"><li><b>18 עד 24 חודשים:</b> חשיפה למוסד חסר בתקופה הזו קשורה להתפתחות פחות טובה. אבל עוד לא הפרידו בין הגיל לבין משך החשיפה, והתוצאות תלויות בגורמים שלפני המוסד, בחומרת המוסד, בגיל הבדיקה, בתחום ובמדדים.</li><li><b>מומחיות:</b> צריך לבדוק תקופות רגישות למומחיות ולא רק להתנהגויות לא מסתגלות.</li><li><b>מתודולוגיה:</b> דגימה, מדדים, מערך וניתוח משתנים בין המחקרים. מסוכן להסיק ממחקר אחד, אבל אפשר לנצל נתונים קיימים כדי לבדוק השערות על תזמון.</li><li><b>המלצה:</b> לקליניקה ולמדיניות, הכלל <mark>"כמה שיותר מוקדם, יותר טוב"</mark> לטיפול משופר הוא מסקנה סבירה. ניסיון להיות מדויקים יותר מוקדם מדי לפי מצב המדע.</li></ol>`,q:"q47"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"לפי הפרק, ברמה של מה מוגדרות תקופות רגישות?","a":"מעגלים עצביים","w":["התנהגויות מורכבות","תכונות אישיות","שלבי גיל כלליים"],"e":"לפי הפרק, תקופות רגישות מוגדרות ברמת המעגלים העצביים: זמנים שבהם חוויות משפיעות באופן ייחודי על התפתחות המעגל. התנהגויות מורכבות הן תוצאה רחוקה של מעגלים רבים."},{"q":"למה אנחנו כנראה מעריכים בחסר את מספר התקופות הרגישות בבני אדם?","a":"מסיקים עליהן מהתנהגות, לא מהמעגלים","w":["כי אין תקופות רגישות בבני אדם","כי המחקר מתמקד רק בבעלי חיים","כי בודקים רק מבוגרים, לא ילדים"],"e":"אנחנו מסיקים על תקופות רגישות מהתנהגויות מורכבות ולא ישירות מהמעגלים העצביים, ולכן מעריכים את מספרן בחסר. זה לא אומר שאין תקופות רגישות בבני אדם."}]},
"q2":{"t":"t1","v":[{"q":"תינוק היה במוסד עד גיל 5 חודשים ואומץ למשפחה טובה. מה הכי סביר לפי הפרק?","a":"אין סיכון מוגבר ניכר ברוב התחומים","w":["נזק קבוע וניכר בכל התחומים","סיכון גבוה במיוחד ב-IQ בהמשך","פגיעה קשה בשפה, אך לא בשאר"],"e":"לפי הפרק, גידול במוסד שמוגבל ל-4 עד 6 החודשים הראשונים לא קשור ברוב התחומים לעלייה מובהקת בסיכון לנזק ארוך טווח. אין נזק קבוע בכל התחומים."},{"q":"איזה כלל מעשי הפרק ממליץ עליו?","a":"״כמה שיותר מוקדם, יותר טוב״","w":["״לחכות לגיל שנתיים לפחות״","״הגיל לא משנה, רק האיכות״","״להתערב רק אחרי גיל שלוש״"],"e":"הכלל המעשי של הפרק הוא ״כמה שיותר מוקדם, יותר טוב״: לתת טיפול משופר מוקדם ככל האפשר. אין המלצה לחכות לגיל מסוים."}]},
"q3":{"t":"t1","v":[{"q":"מה טוענת השערת הניסיון המוקדם?","a":"3 השנים הראשונות חשובות במיוחד","w":["כל הגילים חשובים באותה מידה","רק גיל ההתבגרות קובע","החוויות לא משפיעות על המוח"],"e":"השערת הניסיון המוקדם טוענת ש-3 השנים הראשונות חשובות יותר, בגלל השינויים העמוקים במוח בתקופה הזו. היא לא טוענת שכל הגילים שווים."},{"q":"למה קשה לבדוק את השערת הניסיון המוקדם אצל רוב הילדים?","a":"הסביבה שלהם רציפה ולא משתנה","w":["אין כלים למדוד את המוח","ההורים לא משתפים פעולה","יש יותר מדי משתנים גנטיים"],"e":"סביבת הטיפול של רוב הילדים רציפה ולא משתנה, ולכן קשה לבדוק את ההשערה. צריך מקרים של שינוי משמעותי בטיפול, כמו מעבר ממוסד למשפחה."}]},
"q4":{"t":"t1","v":[{"q":"מה ציינו O'Connor ו-Parfitt (2009)?","a":"מעט מחקרים באמת בדקו את ההשערה","w":["שההשערה הופרכה לחלוטין במחקרים","שההשערה הוכחה מעבר לכל ספק","שאין צורך במחקרים נוספים בתחום"],"e":"O'Connor ו-Parfitt ציינו שמעט מחקרים באמת בדקו את השערת הניסיון המוקדם. הם לא טענו שהיא הוכחה או הופרכה."},{"q":"למה ילדים ממוסדות מעניינים את החוקרים?","a":"אפשר לבדוק אם ומתי ״מאוחר מדי״ לתקן","w":["כי הם מדגם גדול וזול לבדיקה","כי הם מייצגים את כלל הילדים","כי אין להם גורמי סיכון קודמים"],"e":"מחקרי התערבות אצל ילדים ממוסדות מאפשרים לבדוק אם ומתי ״מאוחר מדי״ לתקן, ואם זה שונה בין תחומים. הם לא מייצגים את כלל הילדים, וזה דווקא חיסרון שלהם."}]},
"q5":{"t":"t1","v":[{"q":"חוויה שבלעדיה המערכת לא תתפתח תקין, והשינוי קבוע. איזו תקופה זו לפי קנודסן?","a":"קריטית","w":["רגישה","רדומה","מפצה"],"e":"לפי קנודסן, בתקופה קריטית החוויה הכרחית להתפתחות תקינה, והשינוי קבוע. בתקופה רגישה ההשפעה חזקה במיוחד, אבל לא הכרחית ולא בהכרח קבועה."},{"q":"למה הפרק מתמקד בתקופות רגישות ולא קריטיות?","a":"כמעט אין עדויות לקריטיות בבני אדם","w":["כי קריטיות פשוטות מדי למחקר","כי רגישות קיימות רק בבעלי חיים","כי קריטיות נגמרות לפני הלידה"],"e":"בבני אדם כמעט אין עדויות לתקופות קריטיות, מלבד בהתפתחות התפיסתית, ולכן הפרק מתמקד בתקופות רגישות. זה לא כי תקופות קריטיות ״פשוטות מדי״."}]},
"q6":{"t":"t1","v":[{"q":"מה השאלה המרכזית לגבי תקופה רגישה, מנקודת המבט של המוח?","a":"כמה זמן היא פתוחה ומתי נסגרת","w":["האם היא קיימת בכלל","באיזה מין היא חזקה יותר","האם היא תורשתית"],"e":"השאלה המרכזית מנקודת המבט של המוח היא כמה זמן התקופה הרגישה נשארת פתוחה לשינוי, ומתי היא נסגרת ונעשית עמידה יחסית לחוויות. השאלה לא היא אם היא קיימת."},{"q":"איזה משפט נכון לגבי המוח, לפי הפרק?","a":"הוא גמיש, אבל לגמישות יש מגבלות","w":["הוא קבוע מהלידה ולא משתנה","הוא גמיש בלי שום מגבלה","הוא משתנה רק בבגרות"],"e":"לפי הפרק, המוח מסוגל להסתגל לחוויות שונות, אבל לגמישות הזו יש מגבלות. הוא לא קבוע מהלידה, וגם לא גמיש בלי גבול."}]},
"q7":{"t":"t2","v":[{"q":"למה ילדים ממוסדות מאפשרים לבחון את השערת התקופה הרגישה?","a":"הם עוברים לסביבה טובה בגילים שונים","w":["כולם עוברים לסביבה חדשה באותו גיל","הם לא עוברים לסביבה אחרת לעולם","הם גדלים במשפחות הביולוגיות שלהם"],"e":"ילדים ממוסדות עוברים לסביבה שונה מאוד בגילים שונים, וזה מאפשר לבדוק אם לגיל המעבר יש השפעה. כלומר, יש כאן ״ניסוי טבעי״ בתזמון."},{"q":"מה הדגיש קנודסן לגבי תקופות רגישות?","a":"הן תכונה של מעגלים, לא של התנהגויות","w":["הן תכונה של התנהגות, לא של מעגלים","הן קיימות רק בילדות המאוחרת","הן נקבעות רק לפי גיל כרונולוגי"],"e":"קנודסן הדגיש שתקופות רגישות הן תכונות של מעגלים עצביים, ולא של התנהגויות. המסיח הראשון הופך את זה."}]},

"q9":{"t":"t2","v":[{"q":"מעגל שעוד לא הופעל בעוצמה. מה המצב שלו?","a":"סינפסות חלשות ומעט עיכוב, פתוח לשינוי","w":["סינפסות חזקות ועיכוב רב, ולכן נעול","סינפסות חזקות מאוד, בלי שום עיכוב","אין בו עדיין סינפסות בכלל, רק תאים"],"e":"לפני שמעגל הופעל בעוצמה, הסינפסות המעוררות בו חלשות וההשפעות המעכבות מוגבלות, ולכן הוא במצב שמעודד שינוי. סינפסות חזקות ועיכוב רב מאפיינים מעגל שכבר התייצב."},{"q":"מעגל לא קיבל מספיק קלט בזמן הצפוי. מה קורה לתקופה הרגישה בהתחלה?","a":"היא עלולה להתארך","w":["היא נסגרת מיד","היא מתקצרת","היא נעלמת לגמרי"],"e":"כשאין מספיק קלט, התקופה הרגישה של המעגל עלולה בהתחלה להתארך, כי המעגל ממשיך ״לחכות״ לקלט. היא לא נסגרת מיד."}]},
"q10":{"t":"t2","v":[{"q":"התקופה הרגישה של מעגל נגמרה. האם אפשר עוד לשנות אותו?","a":"כן, אבל זה דורש יותר אנרגיה","w":["לא, הוא נעול לגמרי","כן, באותה קלות כמו קודם","רק בעזרת תרופות"],"e":"גם אחרי שהתקופה הרגישה נגמרה, עדיין אפשר לשנות משהו במעגל, אבל זה דורש יותר אנרגיה. המעגל לא ננעל לגמרי."},{"q":"מה קורה אחרי הפעלה חזקה וחוזרת של המעגל?","a":"הסינפסות מתייצבות והתקופה נסגרת","w":["הסינפסות נחלשות והתקופה נפתחת","המעגל מאבד את כל הקשרים","התקופה הרגישה מתארכת"],"e":"אחרי הפעלה חזקה וחוזרת של המעגל, הסינפסות מתייצבות לפי הקלט שקיבלו, והתקופה הרגישה נסגרת. הן לא נחלשות."}]},
"q11":{"t":"t2","v":[{"q":"ילד עם עיבוד ראייה פגום ברמה נמוכה מזהה פנים כמעט רגיל. מה זה מדגים?","a":"פיצוי של מעגלים ברמה גבוהה","w":["שלא הייתה פגיעה מלכתחילה","תקופה קריטית שכבר נסגרה","השפעה רדומה של המוסד"],"e":"מעגלים ברמה גבוהה יכולים לפצות על עיבוד לא תקין ברמות הנמוכות, ולכן הפגיעה לא נראית בהתנהגות המורכבת. זה פיצוי, ולא היעדר פגיעה."},{"q":"מה נדרש כדי לדעת אם עוד אפשר להשתנות בהתנהגות מסוימת?","a":"מחקרי אורך ארוכי טווח","w":["מדידה אחת בגיל שנה","שאלון חד־פעמי להורים","בדיקה גנטית של הילד"],"e":"כדי לדעת אם עדיין אפשר ללמוד ולהשתנות בהתנהגות מסוימת, צריך מחקרי אורך ארוכי טווח. מדידה אחת לא מספיקה."}]},

"q13":{"t":"t2","v":[{"q":"מה היה המסלול האופייני של ילדים במוסדות ברומניה לפני הרפורמות?","a":"ננטשו בלידה, בית חולים ואז מוסד","w":["גדלו בבית עד גיל 3 ואז מוסד","אומצו מיד אחרי הלידה","עברו בין משפחות אומנה"],"e":"לפני הרפורמות, רוב הילדים במוסדות ברומניה ננטשו בלידה, שהו בבית חולים ליולדות, ואז הועברו למוסד."},{"q":"למה החוויות שלפני המוסד מסבכות את המחקר?","a":"גורמי סיכון קודמים מצטברים","w":["כי הן משפרות את התוצאות","כי אין עליהן שום מידע","כי הן זהות אצל כל הילדים"],"e":"גורמי סיכון קודמים, גם לפני הלידה, מופיעים יחד ומגדילים את הסיכון המצטבר. לכן קשה לבודד את ההשפעה של המוסד עצמו."}]},
"q14":{"t":"t2","v":[{"q":"איזה מהבאים אינו גורם טרום־לידתי שמוזכר בפרק?","a":"שיבוץ אקראי לאומנה","w":["תזונה דלה","טיפול טרום־לידתי מועט","חשיפה אפשרית לאלכוהול"],"e":"הפרק מזכיר גורמים טרום־לידתיים כמו טיפול טרום־לידתי מועט, תזונה דלה וחשיפה אפשרית לניקוטין או לאלכוהול. שיבוץ אקראי לאומנה הוא חלק מהמחקר BEIP."},{"q":"מה מבדיל מחקר בבעלי חיים ממחקר על ילדים ממוסדות?","a":"בבעלי חיים אפשר לתזמן הפרעה בדיוק","w":["בילדים אפשר לתזמן בדיוק","בבעלי חיים אין תקופות רגישות","אין הבדל משמעותי ביניהם"],"e":"בבעלי חיים אפשר לתזמן הפרעה בדיוק, ובילדים המוסד בא אחרי חוויות חריגות קודמות. לכן קשה יותר להסיק על התזמון אצל ילדים."}]},
"q15":{"t":"t3","v":[{"q":"מה קבוצת ההשוואה הטובה ביותר, לפי הפרק?","a":"ילדים שהיו נכנסים למוסד בלי שינוי מדיניות","w":["ילדים ממשפחות עשירות באותה מדינה","ילדים שגדלו במוסד כל חייהם","ילדים ממשפחות מאמצות במדינה אחרת"],"e":"קבוצת ההשוואה הטובה ביותר היא ילדים שהיו נכנסים למוסד אילולא אירוע חיצוני, כמו שינוי מדיניות. הם דומים לילדי המוסד בגורמי הסיכון הקודמים."},{"q":"משווים ילדים שאומצו מוקדם לכאלה שאומצו מאוחר. מה הסכנה?","a":"הטיית בחירה","w":["השפעה של סדר","אפקט פלצבו","הטיית זיכרון"],"e":"השוואה בין ילדים שאומצו מוקדם לילדים שאומצו מאוחר עלולה לכלול הטיית בחירה: אולי אימצו מוקדם דווקא ילדים בריאים יותר."}]},
"q16":{"t":"t3","v":[{"q":"מה נותנת השוואה לילדים ממשפחות דומות למשפחות המאמצות?","a":"רמה אופטימלית, לא בדיקת תקופות","w":["בדיקה ישירה של תקופות רגישות","קבוצת ביקורת מושלמת בכל מובן","מדד למצוקה שלפני הלידה"],"e":"השוואה לילדים ממשפחות דומות למשפחות המאמצות נותנת מדד לרמה התפתחותית אופטימלית, אבל לא בודקת תקופות רגישות אחרי הלידה."},{"q":"למה בחירת קבוצת ההשוואה חשובה במיוחד כאן?","a":"קשה להשוות מצוקה שלפני הלידה","w":["כי המדגמים גדולים מאוד","כי אין משתנים מתערבים","כי כל הילדים זהים בסיכון"],"e":"קשה להשוות בין הקבוצות במצוקה שלפני הלידה, ולכן בחירת קבוצת ההשוואה חשובה במיוחד. המדגמים דווקא לא גדולים."}]},
"q17":{"t":"t3","v":[{"q":"מה מאפיין את המחקר האידיאלי שהפרק מתאר?","a":"תזמון שיטתי של טיפול וקבוצה שנשארת במוסד","w":["מדגם גדול מאוד בלי קבוצת ביקורת","בדיקה של כל הילדים בגיל אחד בלבד","תצפית טבעית בלי שום התערבות"],"e":"המחקר האידיאלי היה משנה באופן שיטתי את הגיל שבו מקבלים טיפול משופר, וכולל קבוצת ביקורת שנשארת במוסד שנים. אין בו ויתור על קבוצת ביקורת."},{"q":"למה המחקר האידיאלי לא ייעשה?","a":"מסיבות אתיות ומעשיות","w":["כי אין כסף לממן","כי אין ילדים במוסדות","כי אין כלים למדוד"],"e":"המחקר האידיאלי לא ייעשה מסיבות אתיות ומעשיות: אי אפשר להשאיר ילד במוסד לשם מחקר."}]},
"q18":{"t":"t3","v":[{"q":"איזו קבוצה נוספת היה כולל המחקר האידיאלי?","a":"ילדים ששובצו בסביבה טובה מהלידה","w":["ילדים שגדלו בבית הביולוגי","ילדים מבוגרים יותר במוסד","ילדים ממוסד במדינה אחרת"],"e":"המחקר האידיאלי היה כולל גם קבוצה של ילדים שהיו מיועדים למוסד, ושובצו בסביבה טובה כבר מהלידה. כך יש נקודת השוואה ללא חשיפה למוסד."},{"q":"מה עושים החוקרים במקום המחקר האידיאלי?","a":"מסיקים מהדפוס בכמה מחקרים חלקיים","w":["מוותרים על שאלת התזמון לגמרי","מסתמכים על מחקר אחד בלבד","בודקים רק בעלי חיים במעבדה"],"e":"במקום המחקר האידיאלי, החוקרים בוחנים כמה מחקרים שיש בכל אחד חלק מהמאפיינים, ומסיקים מהדפוס הכולל של התוצאות. לא מסתמכים על מחקר אחד."}]},
"q19":{"t":"t3","v":[{"q":"ילדים ממוסד ברומניה הוגרלו להישאר במוסד או לעבור לאומנה. איזה מחקר זה?","a":"BEIP","w":["ERA","סנט פטרסבורג","מאורר"],"e":"ב-BEIP הוגרלו ילדים ממוסד לטיפול רגיל במוסד או לאומנה, אחרי הערכה מוקדמת. זה השיבוץ האקראי שמייחד אותו."},{"q":"מה עשה פרויקט סנט פטרסבורג?","a":"שינה את המוסד עצמו והשווה בין בתים","w":["הוציא ילדים לאומנה באופן אקראי","בדק מאומצים מרומניה באנגליה","בדק ילדים שנולדו עם קטרקט"],"e":"פרויקט סנט פטרסבורג שינה את המוסדות עצמם: השווה טיפול רגיל, שינוי מבני בצוות והדרכה בלבד, בשלושה בתי תינוקות. הוא לא הוציא ילדים לאומנה."}]},
"q20":{"t":"t3","v":[{"q":"ילד אומץ מרומניה לאנגליה בגיל 30 חודשים. לאיזו קבוצה ב-ERA הוא שייך?","a":"24–42 חודשים","w":["לפני 6 חודשים","6–24 חודשים","אחרי 42 חודשים"],"e":"במחקר ERA הילדים אומצו מרומניה בשלוש קבוצות גיל: לפני 6 חודשים, בין 6 ל-24 חודשים, ובין 24 ל-42 חודשים. גיל 30 חודשים שייך לקבוצה האחרונה."},{"q":"מה היתרון של מחקר ERA?","a":"ניגוד חד בין סביבות, ומעקב ארוך","w":["שיבוץ אקראי לאומנה או למוסד","מדגם רק של ילדים שלא היו במוסד","בדיקות מוח מפורטות בכל שלב"],"e":"ERA בודק את הניגוד הגדול ביותר בין סביבות טיפול, מוסד קשה מול אימוץ, במעקב מינקות ועד ההתבגרות. שיבוץ אקראי הוא המאפיין של BEIP."}]},
"q21":{"t":"t4","v":[{"q":"באיזה תחום לא נמצאה השפעה של האומנה ב-BEIP?","a":"ADHD והיקף הראש","w":["IQ ושפה","היקשרות","הפרעות מופנמות"],"e":"ב-BEIP לא נמצאה השפעה של האומנה על היקף הראש ועל הפרעות מוחצנות כמו ADHD. ב-IQ ובשפה כן נמצאה השפעה."},{"q":"מה הגיל הממוצע לשיבוץ באומנה ב-BEIP?","a":"כ-22 חודשים","w":["כ-6 חודשים","כ-42 חודשים","כ-12 חודשים"],"e":"ב-BEIP הגיל המוקדם ביותר לשיבוץ באומנה היה 6 חודשים, והממוצע כ-22 חודשים."}]},
"q22":{"t":"t4","v":[{"q":"ב-ERA, ילדים שאומצו לפני 6 חודשים לא הראו עלייה בחוסר קשב, וב-BEIP האומנה לא עזרה בקשב. מה הסבר אפשרי?","a":"התקופה הרגישה לקשב מוקדמת מ-BEIP","w":["קשב לא מושפע מסביבה כלל","ERA פשוט טעה במדידה","BEIP בדק ילדים מבוגרים מדי לבדיקה"],"e":"ב-ERA ילדים שאומצו לפני 6 חודשים לא הראו עלייה בחוסר קשב, וב-BEIP, שבו השיבוץ היה מאוחר יותר, האומנה לא עזרה בקשב. ייתכן שהתקופה הרגישה לקשב מוקדמת מהגיל שבו התחיל BEIP, או שהמשפחות המאמצות היו טובות יותר."},{"q":"מה נמצא ב-ERA לגבי קשב אצל מי שאומץ לפני 6 חודשים?","a":"לא הייתה עלייה בסימני חוסר קשב","w":["עלייה חדה בחוסר קשב","עלייה קלה בחוסר קשב","הקשב לא נבדק בכלל"],"e":"ב-ERA, ילדים שאומצו לפני 6 חודשים לא הראו עלייה בסימני חוסר קשב או פעלתנות יתר. הם היו דומים לביקורת."}]},
"q23":{"t":"t4","v":[{"q":"ב-BEIP הפרעות מופנמות השתפרו באומנה, אבל בלי קשר לגיל השיבוץ. מה המסקנה?","a":"התקופה עוד הייתה פתוחה בטווח הנבדק","w":["אין שום תקופה רגישה לתחום הזה","האומנה לא עזרה בתחום הזה בכלל","הגיל קובע את כל התוצאה בתחום"],"e":"שיפור בהפרעות מופנמות בלי קשר לגיל השיבוץ מרמז שבטווח הגילים של ההתערבות (6 עד 31 חודשים) התקופה הרגישה עוד הייתה פתוחה מספיק להחלמה. זה לא אומר שאין תקופה רגישה."},{"q":"אילו תוצאות השתפרו ב-BEIP בלי השפעה של הגיל?","a":"הפרעות מופנמות ו-ERP","w":["IQ ושפה","ADHD והיקף ראש","היקשרות ו-EEG"],"e":"ב-BEIP השתפרו הפרעות מופנמות, תגובתיות רגשית ורכיבי ERP, בלי קשר לגיל השיבוץ. IQ ושפה היו קשורים לגיל."}]},
"q24":{"t":"t4","v":[{"q":"מה הם P1, N170 ו-P400?","a":"רכיבי ERP שהשתפרו באומנה","w":["מבחני IQ שבוצעו ב-BEIP","קבוצות גיל ב-ERA","סוגי היקשרות במצב הזר"],"e":"P1, N170 ו-P400 הם רכיבים של פוטנציאלים מעוררים (ERP), מדדים של פעילות המוח, שהשתפרו בעקבות האומנה. הם לא מבחני IQ."},{"q":"מה טווח הגילים של תחילת ההתערבות ב-BEIP?","a":"6–31 חודשים","w":["0–6 חודשים","24–42 חודשים","3–6 שנים"],"e":"לפי הפרשנות בפרק, ההתערבות ב-BEIP התחילה בגילים 6 עד 31 חודשים."}]},
"q25":{"t":"t4","v":[{"q":"ב-ERA בגיל 6, ככל שהזמן במוסד ארוך יותר, ה-IQ נמוך יותר. מה אפשר להסיק מזה?","a":"שההחלמה קשה יותר עם הגיל, לא יותר","w":["שיש גיל חיתוך ברור ומובהק","שאין שום תקופה רגישה ל-IQ","שהמוסד משפר את ה-IQ עם הזמן"],"e":"קשר ליניארי בין משך השהות במוסד ל-IQ מראה שההחלמה קשה יותר ככל שהילד מבוגר יותר, אבל לא מלמד הרבה על תקופות רגישות. אין כאן גיל חיתוך ברור."},{"q":"מה מלמדים הממצאים המתאמיים לפי הפרק?","a":"ההחלמה קשה יותר ככל שהילד מבוגר","w":["בדיוק מתי נסגרת כל תקופה","שאין השפעה לזמן במוסד","שהגיל לא משנה בכלל להחלמה"],"e":"לפי הפרק, הממצאים המתאמיים מראים שההחלמה קשה יותר ככל שהילד מבוגר יותר, אבל לא מלמדים הרבה על תקופות רגישות."}]},
"q26":{"t":"t4","v":[{"q":"מה נמצא ב-BEIP לגבי עוצמת EEG?","a":"שיבוץ מוקדם, עוצמה קרובה לנורמה","w":["שיבוץ מאוחר, עוצמה גבוהה","אין קשר לגיל השיבוץ","עוצמה נמוכה אצל כל הילדים"],"e":"ב-BEIP, ככל שהשיבוץ באומנה היה מוקדם יותר, עוצמת ה-EEG בגיל 42 חודשים הייתה גבוהה יותר וקרובה לזו של ילדים שלא היו במוסד."},{"q":"למה מתאמים לא מלמדים הרבה על תקופות רגישות?","a":"פיצוי עשוי להסתיר את סגירת התקופה","w":["כי אין בכלל מתאמים בנתונים","כי המדגמים גדולים מדי לניתוח","כי התוצאות אקראיות לגמרי"],"e":"תהליכי פיצוי עשויים להסתיר את סגירת התקופה הרגישה, ולכן מתאמים בהתנהגות לא מלמדים הרבה עליה. הסיבה איננה שאין מתאמים."}]},
"q27":{"t":"t4","v":[{"q":"מהו ״גיל חיתוך״?","a":"גיל שאחריו ההחלמה קשה יותר באופן מובהק","w":["הגיל שבו הילד נכנס למוסד","הגיל שבו מסתיים המחקר","הגיל הממוצע לאימוץ בקבוצה"],"e":"גיל חיתוך הוא גיל שאחריו ההחלמה מקשיים מוקדמים נעשית קשה יותר באופן מובהק. זה לא הגיל שבו הילד נכנס למוסד."},{"q":"Smyke מצאה הבדל ב-24 חודשים, אבל גם בגילים אחרים. מה המסקנה?","a":"זה קשר ליניארי, לא גיל חיתוך","w":["24 חודשים הוא גיל חיתוך אמיתי","אין קשר בין גיל לתוצאה","יש כמה תקופות קריטיות"],"e":"Smyke מצאה הבדל ב-24 חודשים, אבל גם בגילי חיתוך אחרים. לכן מדובר כנראה בקשר ליניארי, ולא בגיל חיתוך אמיתי."}]},
"q28":{"t":"t4","v":[{"q":"למה צריך לבדוק כמה גילאי חיתוך ולא רק אחד?","a":"לוודא שהקשר לא פשוט ליניארי","w":["כדי להגדיל את המדגם","כדי לבחור את הגיל הנוח","כדי לחסוך בזמן המחקר"],"e":"בקשר ליניארי, כל חיתוך יראה הבדל. לכן צריך לבדוק כמה גילאי חיתוך, ולא רק אחד, כדי לוודא שלא מדובר בקשר ליניארי פשוט. המטרה לא להגדיל את המדגם."},{"q":"מה מצאה Smyke לגבי שיבוץ באומנה לפני 24 חודשים?","a":"יותר היקשרות מאורגנת","w":["יותר היקשרות חסרת ארגון","אין הבדל בהיקשרות","פחות היקשרות בטוחה"],"e":"Smyke מצאה שילדים ששובצו באומנה לפני 24 חודשים נטו יותר להיקשרות מאורגנת, ופחות להיקשרות לא טיפוסית."}]},
"q29":{"t":"t4","v":[{"q":"באיזה גיל נמצא גיל חיתוך לשפה ב-BEIP?","a":"15 חודשים","w":["6 חודשים","24 חודשים","42 חודשים"],"e":"ב-BEIP נמצא גיל חיתוך של 15 חודשים לשפה."},{"q":"איזה תחום אינו בין אלה ששיבוץ לפני 24 חודשים נתן בהם יתרון ב-BEIP?","a":"ADHD","w":["IQ","קוהרנטיות EEG","ביטחון בהיקשרות"],"e":"ב-BEIP שיבוץ לפני 24 חודשים נתן יתרון מובהק ב-IQ, בעוצמת EEG, בקוהרנטיות EEG ובביטחון בהיקשרות. ADHD לא הושפע מהאומנה בכלל."}]},
"q30":{"t":"t4","v":[{"q":"מה מצאה המטא־אנליזה של ואן דן דריס (2008)?","a":"שאומצו לפני 12 חודשים בטוחים כמו כולם","w":["שכל המאומצים לא בטוחים בהיקשרות","שמי שאומץ מאוחר בטוח יותר","שאין השפעה לגיל האימוץ בכלל"],"e":"המטא־אנליזה של ואן דן דריס (2008) מצאה שילדים שאומצו לפני 12 חודשים היו בטוחים בהיקשרות כמו ילדים שלא אומצו. לא כל המאומצים לא בטוחים."},{"q":"מה מצא ERA לגבי מי שאומץ לפני 6 חודשים?","a":"דומים לילדים בלי מוסד בתחומים רבים","w":["פגיעה קשה וקבועה ב-IQ","יותר סימנים של כמו־אוטיזם","בעיות קשב חמורות מהממוצע"],"e":"ERA מצא שילדים שאומצו מרומניה לפני 6 חודשים היו דומים לילדים שלא חוו מוסד ב-IQ, בתפקוד ניהולי, בסימני כמו־אוטיזם ובחוסר קשב."}]},
"q31":{"t":"t5","v":[{"q":"ילדים שאומצו לפני 6 חודשים תקינים, אחרי 6 חודשים לא, והפגיעה לא גדלה עם זמן נוסף. מה זה?","a":"פונקציית מדרגה","w":["קשר ליניארי","השפעה רדומה","פיצוי מאוחר"],"e":"תקינים לפני 6 חודשים, פגועים אחרי, בלי החמרה עם זמן נוסף: זו פונקציית מדרגה, קפיצה בגיל מסוים ואז מישור. בקשר ליניארי כל חודש נוסף היה מחמיר."},{"q":"מתי נוטה להופיע פונקציית המדרגה?","a":"כשבודקים בגיל מבוגר יותר","w":["כשבודקים מיד אחרי האימוץ","כשבודקים רק תינוקות","בכל גיל באותה מידה"],"e":"פונקציית המדרגה נוטה להופיע כשבודקים את הילדים בגיל מבוגר יותר, כמו ב-ERA בגיל 11 ו-15. מיד אחרי האימוץ היא לא נראית."}]},
"q32":{"t":"t5","v":[{"q":"מה ההבדל בין קשר ליניארי לפונקציית מדרגה?","a":"בליניארי כל חודש מחמיר, במדרגה יש קפיצה","w":["אין הבדל אמיתי בין שני הדפוסים","במדרגה כל חודש נוסף מחמיר","בליניארי יש קפיצה אחת בגיל מסוים"],"e":"בקשר ליניארי כל חודש נוסף במוסד מחמיר את התוצאה. בפונקציית מדרגה יש קפיצה בגיל מסוים, ואחריה אין החמרה נוספת. המסיחים מחליפים ביניהם."},{"q":"למה צורת הקשר לא נבדקה היטב בעבר?","a":"מדגמים קטנים וחלוקה גסה של הגיל","w":["כי לא היו ילדים במוסדות לבדוק","כי אין סטטיסטיקה מתאימה לזה","כי החוקרים לא התעניינו בשאלה"],"e":"צורת הקשר לא נבדקה היטב בגלל מדגמים קטנים, טווח גילים מוגבל וחלוקה של הגיל לשתיים או לשלוש קבוצות בלבד."}]},
"q33":{"t":"t5","v":[{"q":"מה מצא ERA בגיל 11 ו-15?","a":"מדרגה ב-6 חודשים, בלי החמרה","w":["קשר ליניארי עם הזמן במוסד","מדרגה ב-24 חודשים בדיוק","שום קשר בין גיל לתוצאה"],"e":"ERA מצא בגיל 11 ו-15 פונקציית מדרגה ב-6 חודשים, בלי החמרה עם חשיפה ארוכה יותר. לא קשר ליניארי, ולא מדרגה ב-24 חודשים."},{"q":"מאומצים ממוסדות של מחסור רגשי־חברתי. אצל מי נמצאו בעיות רבות?","a":"מי שאומץ ב-18 חודשים ונבדק בגיל 12+","w":["כל מי שאומץ, בלי קשר לגיל","מי שאומץ לפני גיל 6 חודשים","מי שנבדק בגיל 4, בכל גיל אימוץ"],"e":"במוסדות של מחסור רגשי־חברתי, שיעורים גבוהים של בעיות נמצאו רק אצל מי שאומץ בגיל 18 חודשים ומעלה ונבדק בגיל 12 ומעלה. ההשפעה תלויה גם בגיל האימוץ וגם בגיל הבדיקה."}]},
"q34":{"t":"t5","v":[{"q":"מה מצא מחקר המאומצים מרומניה של שנות ה-90, בניגוד ל-ERA?","a":"הבעיות גדלו עם זמן נוסף במוסד","w":["פונקציית מדרגה ב-6 חודשים","אין קשר לזמן במוסד","שיפור עם זמן במוסד"],"e":"מחקר המאומצים מרומניה של שנות ה-90 מצא, בניגוד ל-ERA, שהבעיות גדלו עם חשיפה ארוכה יותר למוסד, כלומר קשר ליניארי."},{"q":"באיזה גיל נמצאה מדרגה בתפקוד ניהולי לפי דיווח הורים?","a":"18 חודשים","w":["6 חודשים","12 חודשים","36 חודשים"],"e":"בתפקוד ניהולי, לפי דיווח ההורים, נמצאה מדרגה ב-18 חודשים."}]},
"q35":{"t":"t5","v":[{"q":"מה הגורם המשותף שהפרק מציע לכל הקבוצות?","a":"מחסור באינטראקציות רגשיות־חברתיות","w":["מחסור במזון ובתזונה","מחסור בצעצועים ובגירויים","מחסור בטיפול רפואי בסיסי"],"e":"הגורם המשותף שהפרק מציע לכל הקבוצות הוא מחסור באינטראקציות רגשיות־חברתיות עם המטפלים. לא מחסור במזון."},{"q":"למה אי אפשר לקבוע אם קובע הגיל או משך החשיפה?","a":"מעט ילדים נכנסים למוסד ב-18 חודשים","w":["כי אין מספיק כסף למחקר","כי כולם נכנסים בגיל 18 חודשים","כי משך החשיפה לא נמדד"],"e":"מעט מדי ילדים נכנסים למוסד בגיל 18 חודשים, ולכן הגיל ומשך החשיפה חופפים, ואי אפשר להפריד ביניהם. משך החשיפה כן נמדד."}]},
"q36":{"t":"t5","v":[{"q":"מוסד אחד עם מחסור כולל וקשה, ואחר עם מחסור רגשי בלבד. איפה הפגיעה תופיע מוקדם יותר?","a":"במוסד עם המחסור הכולל","w":["במוסד עם המחסור הרגשי","באותו גיל בשניהם","באף אחד מהם"],"e":"מוסדות של מחסור כולל וקשה פוגעים מוקדם יותר וגורמים ליותר בעיות. לכן במוסד עם מחסור כולל הפגיעה תופיע מוקדם יותר מאשר במוסד עם מחסור רגשי בלבד."},{"q":"מה תואם את תוצאות המדרגה, לפי הפרק?","a":"תקופה רגישה של כ-18 חודשים ראשונים","w":["תקופה קריטית בשבוע הראשון לחיים","היעדר מוחלט של תקופה רגישה","תקופה רגישה רק בגיל ההתבגרות"],"e":"תוצאות המדרגה תואמות תקופה רגישה התנהגותית בערך ב-18 החודשים הראשונים. אין כאן תקופה קריטית בשבוע הראשון."}]},
"q37":{"t":"t6","v":[{"q":"ב-BEIP בגיל 8, הפער ב-IQ בין הקבוצות הצטמצם. למה?","a":"ה-IQ של קבוצת הטיפול הרגיל עלה","w":["ה-IQ של קבוצת האומנה ירד","המבחן הוחלף במבחן אחר","הילדים באומנה חזרו למוסד"],"e":"ב-BEIP בגיל 8 הפער ב-IQ הצטמצם, כי ה-IQ של קבוצת הטיפול הרגיל עלה, כשרובם כבר לא היו במוסד. ה-IQ של קבוצת האומנה לא ירד."},{"q":"למי היה ה-IQ הגבוה ביותר בגיל 8 ב-BEIP?","a":"לילדים באומנה של BEIP","w":["לילדים שנשארו במוסד","לילדים באומנה ממשלתית","לא היו הבדלים"],"e":"בגיל 8 ב-BEIP, ה-IQ הגבוה ביותר היה אצל הילדים באומנה האיכותית של BEIP. לא אצל מי שנשארו במוסד."}]},
"q38":{"t":"t6","v":[{"q":"בגיל 8 תזמון השיבוץ כבר לא קשור ל-IQ. מה זה מרמז?","a":"קיים פיצוי במסלולים חלופיים","w":["אין תקופה רגישה לאינטליגנציה","הנתונים הקודמים היו שגויים","IQ לא נמדד בגיל 8"],"e":"כשתזמון השיבוץ כבר לא קשור ל-IQ בגיל 8, זה מרמז על פיצוי: יש מסלולים חלופיים להגיע לאותה התנהגות. זה לא אומר שאין תקופה רגישה לאינטליגנציה."},{"q":"מה מראים תהליכי פיצוי?","a":"יש מסלולים חלופיים להתנהגות מורכבת","w":["שהמוח לא גמיש בכלל אחרי גיל שנה","שהפגיעה המוקדמת תמיד קבועה","שאין הבדל בין מסלולים שונים"],"e":"תהליכי פיצוי מראים שיש מסלולים חלופיים להתנהגות מורכבת, כמו אינטליגנציה. הם לא מראים שהפגיעה תמיד קבועה."}]},
"q39":{"t":"t6","v":[{"q":"לפי קנודסן (2006), למה החוויה המוקדמת חשובה?","a":"היא יוצרת את המסלול היעיל ביותר","w":["רק היא משפיעה על המוח","היא קובעת את הגנים עצמם","אחריה אין שום גמישות במוח"],"e":"לפי קנודסן ועמיתיו (2006), החוויה המוקדמת חשובה כי היא יוצרת את המסלול היעיל ביותר לתוצאה טובה. זה לא אומר שאחריה אין גמישות."},{"q":"למה פיצוי מאוחר יקר יותר?","a":"המבנה ההיררכי של המוח דורש יותר משאבים","w":["כי ילדים מבוגרים פחות משתפים פעולה","כי הטיפול המאוחר פחות מקצועי","כי המוח הבוגר לא משתנה בכלל"],"e":"בגלל המבנה ההיררכי של המוח, פיצוי מאוחר דורש יותר אנרגיה ומשאבים, ולכן יקר יותר. זה לא בגלל שהטיפול המאוחר פחות מקצועי."}]},
"q40":{"t":"t6","v":[{"q":"משרד רווחה שוקל לדחות אימוץ ״כי ממילא אפשר לפצות אחר כך״. מה הפרק היה אומר?","a":"פיצוי מאוחר יקר ופחות יעיל","w":["זו החלטה סבירה לגמרי","אין הבדל בין מוקדם למאוחר","פיצוי מאוחר יעיל יותר"],"e":"לפי הפרק, פיצוי מאוחר דורש יותר משאבים, פחות יעיל ויקר יותר. לכן אין להצדיק דחיית אימוץ בטענה שאפשר לפצות אחר כך. ״כמה שיותר מוקדם״."},{"q":"מה הקשר בין ״מסלול יעיל״ להמלצת הפרק?","a":"התערבות מוקדמת משתמשת במסלול היעיל","w":["אין שום קשר בין שני הרעיונות","מסלול יעיל נוצר רק בגיל מאוחר","המסלול היעיל לא משנה דבר בפועל"],"e":"התערבות מוקדמת משתמשת במסלול היעיל, ולכן ההמלצה היא ״כמה שיותר מוקדם, יותר טוב״. שני הרעיונות קשורים ישירות."}]},
"q41":{"t":"t6","v":[{"q":"ילד שקטרקט שלו תוקן מוקדם רואה טוב, אבל בגיל 10 מתקשה בזיהוי פנים. מה זה?","a":"השפעה רדומה","w":["פיצוי מאוחר","פונקציית מדרגה","גיל חיתוך"],"e":"תוצאה שמופיעה הרבה אחרי החוויה שגרמה לה, כמו קושי בזיהוי פנים שנים אחרי תיקון הקטרקט, היא השפעה רדומה. פונקציית מדרגה היא צורה של קשר בין גיל לתוצאה."},{"q":"מה מצאו מאורר ועמיתיו אצל ילדים שנולדו עם קטרקט?","a":"ליקויים מאוחרים בעיבוד פנים הוליסטי","w":["שום ליקוי אחרי השיקום המהיר","עיוורון קבוע ומלא בשתי העיניים","ליקוי בשמיעה, לא בראייה"],"e":"מאורר ועמיתיו מצאו שאחרי שיקום מהיר, ילדים שנולדו עם קטרקט הראו מאוחר יותר ליקויים ברגישות לניגודיות ובעיבוד הוליסטי של פנים."}]},
"q42":{"t":"t6","v":[{"q":"מתי הופיעו בעיות אצל ילדים ממוסדות של מחסור רגשי־חברתי?","a":"רק בגיל 12 ומעלה","w":["כבר בגיל שנה","בגיל 4","בגיל 6 בלבד"],"e":"אצל ילדים ממוסדות של מחסור רגשי־חברתי (לא כולל), הבעיות הופיעו רק בגיל 12 ומעלה. זו השפעה רדומה."},{"q":"מה מלמדות ההשפעות הרדומות על המוסד?","a":"לא פותחו כישורים שנדרשים מאוחר יותר","w":["הנזק נעלם עם הזמן לגמרי","אין לו השפעה ארוכת טווח","ההשפעה שלו תמיד מיידית"],"e":"השפעות רדומות מלמדות שחוויה חסרה לא מפתחת כישורים בסיסיים, שנעשים חשובים רק מאוחר יותר. הנזק לא נעלם עם הזמן, אלא מתגלה."}]},
"q43":{"t":"t6","v":[{"q":"מה נמצא לגבי IQ ככל שהזמן במוסד ארוך יותר?","a":"יותר IQ נמוך מאוד ופחות IQ גבוה","w":["רק ממוצע נמוך, בלי שינוי בפיזור","יותר ילדים עם IQ גבוה מאוד","אין קשר לזמן במוסד"],"e":"ככל שהזמן במוסד ארוך יותר, יש יותר ילדים עם IQ נמוך מאוד, וגם נעלמים הילדים עם IQ מעל הממוצע. לא רק הממוצע יורד."},{"q":"איזה כיוון מחקר חדש הפרק מציע?","a":"תקופות רגישות לכשירות ומומחיות","w":["רק תקופות רגישות להפרעות","מחקר רק על בעלי חיים","מחקר רק על מבוגרים"],"e":"הפרק מציע לבדוק תקופות רגישות לכשירות ולמומחיות, ולא רק להפרעה. זה כיוון חדש למחקר."}]},
"q44":{"t":"t6","v":[{"q":"מה מלמד המחקר של מאורר על ״מומחיות״?","a":"מחסור מוקדם הגביל מומחיות בעיבוד פנים","w":["מחסור מוקדם לא משפיע על מומחיות","מומחיות נקבעת רק בבגרות","מומחיות היא תורשתית בלבד"],"e":"המחקר של מאורר מראה שמחסור חזותי מוקדם הגביל את היכולת להפוך למומחה בעיבוד פנים. המומחיות לא נקבעת רק בבגרות."},{"q":"למה גיל ההתבגרות עשוי לחשוף מגבלות של מחסור מוקדם?","a":"הדרישות נעשות מורכבות יותר","w":["כי ההורמונים מוחקים את הלמידה","כי המוח מפסיק להתפתח","כי מתבגרים לא נבדקים"],"e":"בגיל ההתבגרות החיים הרגשיים, החברתיים והלימודיים נעשים מורכבים, ודורשים כישורים מתוחכמים ומווסתים. לכן מגבלות של מחסור מוקדם עלולות להיחשף רק אז."}]},

"q48":{"t":"t7","v":[{"q":"לפי מסקנה 5, באיזה גיל נמצא גיל חיתוך לשפה?","a":"15 חודשים","w":["6 חודשים","24 חודשים","36 חודשים"],"e":"לפי מסקנה 5, גיל החיתוך לשפה הוא 15 חודשים, לפי BEIP."},{"q":"מה אומרת מסקנה 7 על הספרות?","a":"היא מוגבלת, ומסוכן להסיק ממחקר אחד","w":["היא מלאה ומספקת","היא מבוססת על ניסויים מושלמים","אין בה מחקרים על ילדים"],"e":"מסקנה 7 אומרת שהספרות מוגבלת מבחינה מתודולוגית, ולכן מסוכן להסיק ממחקר אחד בלבד."}]}};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
