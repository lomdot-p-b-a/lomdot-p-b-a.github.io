const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}

 {id:"t1",icon:"sprout",title:"התחום, התחומים והתקופות",blocks:[
  {h:"מהי התפתחות הילד",html:`${def("על מה הנושא",`לפני שמתחילים, צריך מפה: מה התחום חוקר, באילו היבטים של הילד הוא מתמקד, ולאילו גילים הוא מחלק את החיים.<br><b>מה נלמד כאן:</b> התפתחות הילד · שלושה תחומי התפתחות · תקופות ההתפתחות · בגרות בהתהוות`)}${def("מושג מפתח",`<mark>התפתחות הילד</mark> ${E("Child development")}: תחום חקר שמוקדש להבנת <b>הקבוע והמשתנה</b> מההתעברות ועד גיל ההתבגרות. הוא חלק משדה רחב יותר, <mark>מדע ההתפתחות</mark> ${E("Developmental science")}, שכולל את כל השינויים לאורך החיים.`)}<p>את המחקר הניעו לא רק סקרנות מדעית אלא גם <b>לחצים חברתיים</b> לשפר את חיי הילדים: החינוך הציבורי, רופאי ילדים, עובדים סוציאליים והורים שביקשו עצות.</p>${rem("התחום <b>בין־תחומי</b>: פסיכולוגיה, סוציולוגיה, אנתרופולוגיה, ביולוגיה ומדע העצב, יחד עם חינוך, רפואה, בריאות הציבור ועבודה סוציאלית.")}${ex(`חוקרת שבודקת למה תינוקות מתחילים ללכת בסביבות גיל שנה, ולמה יש מי שהולך בגיל 9 חודשים ויש מי שבגיל 15. היא חוקרת גם את <b>הקבוע</b> (כמעט כולם הולכים) וגם את <b>המשתנה</b> (מתי ואיך).`)}`,q:"q1"},

  {h:"תקופות ההתפתחות",html:`${fig("periods")}${tiles([["sprout","טרום לידה","9 חודשים, השינויים המהירים ביותר"],["hand","ינקות וגיל רך","שינויים דרמטיים בגוף ובמוח, תחילת השפה וקשרים ראשונים"],["copies","ילדות מוקדמת","משחקי דמיון, שליטה עצמית, חשיבה ושפה מואצות","בגילים 2 עד 6 המשחק הופך לדמיוני, הילד לומד לשלוט בעצמו, והחשיבה והשפה מתפתחות מהר מאוד.","נועם משחק ״כאילו״ שהקופסה היא מכונית, ולומד לחכות לתורו במגלשה."],["grad","ילדות","משחקים עם כללים, קריאה וכתיבה, הבנת עצמי, מוסר וחברות","בגילים 6 עד 11 המשחקים כוללים חוקים, הילד לומד לקרוא ולכתוב, מבין את עצמו טוב יותר, ומפתח מוסר וחברויות.","בגיל 8 נועם משחק כדורגל עם חוקים ברורים, ומתעצבן כשמישהו ״מרמה״."],["id","התבגרות","בשלות מינית, חשיבה מופשטת, עצמאות מהמשפחה","בגילים 11 עד 18 הגוף מבשיל מינית, החשיבה נעשית מופשטת, והמתבגר מתרחק בהדרגה מהמשפחה ובונה עצמאות.","בגיל 15 נועם מתווכח עם ההורים על צדק ופוליטיקה, ומעדיף לבלות עם החברים."]])}${def("בגרות בהתהוות",`<mark>בגרות בהתהוות</mark> ${E("Emerging adulthood")}: מגיל 18 ועד אמצע או סוף שנות ה-20. צעירים במדינות מתועשות כבר עברו את ההתבגרות, אבל עוד לא לקחו על עצמם תפקידי בוגרים, ובוחנים אפשרויות באהבה, בקריירה ובערכים.`)}${ex(`<b>בגרות בהתהוות</b>: סטודנטית בת 23 שעדיין גרה אצל ההורים, מחליפה תחום לימודים ועוד לא יודעת איפה תגור. היא כבר לא מתבגרת, אבל גם לא מרגישה "מבוגרת" לגמרי.`)}`,q:"q5"}

 {id:"t2",icon:"question",title:"תיאוריות וסוגיות יסוד",blocks:[
  {h:"מהי תיאוריה",html:`${def("על מה הנושא",`תיאוריה היא כמו "משקפיים" שדרכם מסתכלים על הילד. הנושא מסביר מה זו תיאוריה, ואת שלוש השאלות הגדולות שכל תיאוריה עונה עליהן אחרת.<br><b>מה נלמד כאן:</b> מהי תיאוריה · רציפה מול בלתי רציפה · מסלול אחד מול מסלולים רבים · תורשה מול סביבה`)}${def("מושג מפתח",`<mark>תיאוריה</mark> ${E("Theory")}: מערכת מסודרת ומשולבת של היגדים ש<b>מתארת</b>, <b>מסבירה</b> ו<b>מנבאת</b> התנהגות.`)}${ex("תיאוריה טובה של היקשרות צריכה לתאר איך תינוקות בני 6 עד 8 חודשים מחפשים נחמה אצל מבוגר מוכר, להסביר למה הם מפתחים את הרצון הזה, ולנבא את ההשלכות על מערכות יחסים בעתיד.")}${tiles([["copies","ארגון","תיאוריות מארגנות את התצפיות ונותנות להן משמעות","בלי תיאוריה, התצפיות הן אוסף של פרטים מפוזרים. התיאוריה מחברת אותם לתמונה אחת שאפשר להבין.","חוקרת רואה שתינוקות בוכים כשההורה יוצא ונרגעים כשהוא חוזר. תיאוריה מחברת את התצפיות לרעיון אחד: קשר בין התינוק להורה."],["check","יישום","תיאוריה שאומתה היא בסיס לשיפור חיי הילדים","תיאוריה שנבדקה ונמצאה נכונה עוזרת לדעת מה לעשות בפועל, כדי לשפר את חיי הילדים: בהורות, בחינוך ובמדיניות.","אם מחקרים מראים שקריאה משותפת מפתחת שפה, אפשר לבנות תוכנית שמעודדת הורים לקרוא לילדים."]])}${rem(`ההבדל בין תיאוריה לאמונה: תיאוריה תלויה ב<mark>אימות מדעי</mark> ${E("Scientific verification")}, כלומר בבדיקה בשיטות מחקר מקובלות, וממצאים שעומדים במבחן הזמן.`)}`,q:"q7"},
  {h:"סוגיה 1: רציפה או בלתי רציפה?",html:`${fig("contin")}${tiles([["chart","רציפה","ההבדל בין ילד למבוגר הוא בכמות ובמורכבות. מוסיפים בהדרגה מיומנויות מאותו סוג","לפי גישה זו, ילד ״לומד עוד ועוד מאותו דבר״: ההבדל בינו לבין מבוגר הוא בכמות. ההתפתחות דומה לעלייה בשיפוע חלק.","הזיכרון של נועם משתפר בהדרגה: בכל שנה הוא זוכר קצת יותר פרטים."],["pyramid","בלתי רציפה","דרכים חדשות לגמרי להבין את העולם מופיעות בנקודות זמן מסוימות","לפי גישה זו, יש ״קפיצות״: בנקודות מסוימות מופיעה דרך חדשה לגמרי לחשוב, כמו לעלות במדרגות.","בגיל מסוים נועם פתאום מבין שכמות המים לא משתנה כשמוזגים אותם לכוס צרה וגבוהה. זו דרך חשיבה חדשה, לא רק ״יותר״ ממה שהיה."]])}${def("שלבים",`<mark>שלבים</mark> ${E("Stages")}: שינויים <b>איכותיים</b> בחשיבה, ברגש ובהתנהגות שמאפיינים תקופות מוגדרות. כמו טיפוס במדרגות: שינוי מהיר במעבר, ואז \"ישורת\".`)}${ex(`<b>רציפה</b>: כמו עץ שגדל עוד קצת כל שנה. <b>בלתי רציפה</b>: כמו פרפר, שעובר משלב זחל לגולם ואז לפרפר. כל שלב שונה לגמרי מהקודם.`)}`,q:"q9"},
  {h:"סוגיות 2 ו-3",html:`${def("מסלול אחד או מסלולים מרובים?",`תיאוריות שלבים מניחות שכל בני האדם עוברים <b>אותו רצף</b>. אבל ילדים גדלים ב<mark>הקשרים</mark> ${E("Contexts")} שונים, שילובים ייחודיים של נסיבות אישיות וסביבתיות, שיכולים להוביל ל<b>מסלולים שונים</b>.`)}${def("תורשה או סביבה?",`<mark>מחלוקת תורשה–סביבה</mark> ${E("Nature-nurture")}: האם הגנים או העולם הפיזי והחברתי משפיעים יותר על ההתפתחות?`)}${tiles([["lock","יציבות","מי שגבוה או נמוך בתכונה יישאר כך. מדגישים תורשה או חוויות מוקדמות שקשה לשנות","לפי גישה זו, ילד שגבוה או נמוך בתכונה נשאר כך. החוויות המוקדמות או התורשה קובעות, וקשה לשנות אחר כך.","״הוא היה ביישן כתינוק, אז הוא יהיה ביישן גם כמבוגר.״"],["sprout","גמישות","ההתפתחות פתוחה לשינוי לאורך כל החיים בעקבות חוויות. <mark>Plasticity</mark>","לפי גישה זו, ההתפתחות פתוחה לשינוי לאורך כל החיים, בעקבות חוויות חדשות.","ילדה ביישנת שמצאה חוג תיאטרון מתאים נעשית בטוחה יותר בעצמה בגיל 12."]])}${ex(`<b>תורשה או סביבה</b>: ילד מוכשר במוזיקה. האם כי נולד עם כישרון (תורשה), או כי גדל בבית שבו כולם מנגנים (סביבה)? רוב החוקרים היום יגידו: שניהם יחד.`)}`,q:"q11"},
  {h:"נקודת מבט מאוזנת",html:`<p>עם השנים העמדות התמתנו. היום רבים סבורים ש:</p>${yn(["יש שינויים רציפים <b>וגם</b> בלתי רציפים","יש מאפיינים אוניברסליים לצד ייחודיים לפרט ולהקשר","תורשה וסביבה <b>שזורות</b> זו בזו, וכל אחת משפיעה על הפוטנציאל של השנייה"],[])}${rem("<b>למה זה חשוב בפועל?</b> מי שמאמין בתורשה לא ישקיע בחוויות. מי שמאמין בחוויות מוקדמות יתערב מוקדם. מי שמאמין בסביבה לאורך כל החיים יעזור בכל גיל.")}`,q:"q13"}
 ]},
 {id:"t3",icon:"hand",title:"חוסן נפשי",blocks:[
  {h:"ג'ון וגרי",html:`${def("על מה הנושא",`למה יש ילדים שגדלים בתנאים קשים ובכל זאת מצליחים? הנושא מסביר מהו חוסן, ומה מגן על ילדים.<br><b>מה נלמד כאן:</b> חוסן · ארבעה גורמי הגנה`)}<p>שני חברים גדלו בשכונה מוזנחת, חוו סכסוכים וגירושים של ההורים, נשרו מהתיכון והסתבכו עם המשטרה. בגיל 30, ג'ון היה בכלא, מובטל ומכור. גרי סיים תיכון, למד מכונאות, ניהל מוסך, התחתן וקנה בית.</p>${def("מושג מפתח",`<mark>חוסן</mark> ${E("Resilience")}: היכולת להסתגל ביעילות מול גורמים שמאיימים על ההתפתחות. גורמי סיכון כמו עוני, משפחה שלילית, גירושים, מחלות נפש וסמים יוצרים נטייה לבעיות.`)}${ex(`<b>חוסן</b>: ילד שגדל עם הורה מכור, אבל בזכות סבתא שתמכה בו ומורה שהאמינה בו, הצליח בלימודים ובנה משפחה יציבה.`)}`,q:"q15"},
  {h:"ארבעה גורמי הגנה",html:`${tiles([["id","מאפיינים אישיים","אינטליגנציה, כישרונות מוערכים, ונטייה להיות קליל, חברותי ומווסת. גרי ציפה בשמחה לשכונה חדשה, ג'ון נעשה חרד וזועם","חלק מהחוסן בא מהילד עצמו: אינטליגנציה, כישרונות שהסביבה מעריכה, ומזג קליל וחברותי שיודע להירגע. מאפיינים כאלה עוזרים להתמודד עם קשיים.","שני ילדים עוברים לשכונה חדשה: אחד מתרגש ומחפש חברים, והשני נעשה חרד וכועס. אותו שינוי, תגובה שונה."],["hand","יחסים חמים עם הורה","חום, ציפיות מותאמות, פיקוח וסביבה מאורגנת"],["people","תמיכה מחוץ למשפחה","קשר עם מבוגר בעל מסוגלות: סבא, דודה, מורה. לגרי היה סבא שהקשיב לו","גם כשהמשפחה מתקשה, קשר קרוב עם מבוגר אחר שמאמין בילד יכול להגן עליו ולעזור לו להתמודד.","להורים של נועם קשה בתקופה מסוימת, אבל המורה שלו מקשיבה לו ומעודדת אותו, וזה עוזר לו להחזיק מעמד."],["building","משאבים בקהילה","בתי ספר טובים, שירותים, פעילויות פנאי ותנועות נוער. גרי התנדב בבניית דיור","מה שיש בסביבה מחוץ לבית, כמו בית ספר טוב ופעילויות פנאי, נותן לילד מקום להצליח ולהרגיש שייך.","נועם מצטרף לתנועת נוער, ושם הוא מוצא חברים ותחושת ערך."]])}${rem("החוסן מדגים את הקשר המורכב בין <b>תורשה לסביבה</b>. כשמצטברים גורמי סיכון רבים, קשה לגבור עליהם. לכן צריך גם לחזק את הילד וגם להפחית את הסיכונים בסביבה.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"building",title:"ויגוצקי וברונפנברנר",blocks:[
  {h:"ויגוצקי: הצד החברתי־תרבותי",html:`${def("על מה הנושא",`שתי תיאוריות שאומרות: אי אפשר להבין ילד בלי הסביבה שלו. ויגוצקי מתמקד בתרבות ובאנשים סביב הילד, וברונפנברנר בכל השכבות שעוטפות אותו.<br><b>מה נלמד כאן:</b> ויגוצקי · המערכות האקולוגיות · מיקרו, מזו, אקסו, מאקרו, כרונו`)}<p>לפי ויגוצקי, תרבויות שונות מלמדות ילדים דרך <b>מטלות שונות</b>, והאינטראקציה החברתית סביב המטלות מפתחת מיומנויות שחשובות באותה תרבות.</p>${ex("בנות מזינקנטן במקסיקו לומדות אריגה מורכבת ממבוגרים מומחים. ילדים בברזיל שמוכרים ממתקים מפתחים מתמטיקה מתוחכמת, גם עם מעט בית ספר.")}${rem("<b>ביקורת:</b> ויגוצקי הזניח את הצד <b>הביולוגי</b>, והדגיש פחות את היכולת של ילדים לעצב את התפתחותם. ממשיכיו מדגישים שילדים משתתפים באופן פעיל ואף משנים את המנהגים.")}`,q:"q19"},
  {h:"תיאוריית המערכות האקולוגיות",html:`${def("מושג מפתח",`<mark>תיאוריית המערכות האקולוגיות</mark> ${E("Ecological systems theory")} של ברונפנברנר: הילד מתפתח בתוך מערכת מורכבת של יחסים, ברבדים רבים של הסביבה. מכיוון שגם נטיות ביולוגיות משתתפות, הוא קרא לה <b>מודל ביואקולוגי</b>.`)}${fig("eco")}${ex(`לחשוב על הילד כמו על הנקודה במרכז של כמה עיגולים: המשפחה והגן קרובים אליו, מקום העבודה של ההורים רחוק יותר, וחוקי המדינה והתרבות עוטפים את הכול.`)}`,q:"q21"},
  {h:"הרבדים",html:`${tiles([["id","מיקרו","הסביבה המיידית. היחסים <b>דו־כיווניים</b>: גם הילד משפיע על המבוגר. גם <b>צד שלישי</b> משפיע (תמיכה בין ההורים משפרת את ההורות)","הסביבה הקרובה ביותר, שבה הילד נמצא בעצמו: הבית, הגן, החברים. ההשפעה הולכת לשני הכיוונים: גם הילד משפיע על ההורים.","כשנועם חייכן, ההורים מחייכים אליו יותר, ואז הוא מחייך עוד יותר."],["link","מזו","<b>קשרים בין</b> מערכות מיקרו: בית, בית ספר, מעון. למשל מעורבות ההורים בבית הספר","הקשרים בין הסביבות הקרובות של הילד, למשל בין הבית לגן. כשהן מחוברות, הילד מרוויח.","הגננת מספרת לאמא של נועם שהוא מתקשה עם חבר, ואמא משוחחת איתו על זה בבית."],["building","אקסו","מסגרות שהילד <b>לא נמצא בהן</b> אבל משפיעות עליו: עבודת ההורים, שירותים בקהילה, רשת חברתית","מסגרות שהילד לא נמצא בהן בעצמו, אבל הן משפיעות עליו דרך ההורים: מקום העבודה שלהם, שירותים בקהילה, והחברים שלהם.","אבא של נועם עובד שעות ארוכות, ולכן חוזר עייף ומשחק איתו פחות."],["scales","מאקרו","ערכים, חוקים, מנהגים ומשאבים. למשל חופשת לידה ותקנים לטיפול בילדים","השכבה הרחבה: ערכים, חוקים ומנהגים של החברה. היא משפיעה על כל השכבות האחרות.","במדינה עם חופשת לידה ארוכה, ההורים של נועם יכולים להיות איתו יותר בחודשים הראשונים."],["clock","כרונו","ממד הזמן: אירועים כמו לידת אח או גירושים, ו<b>העיתוי</b> שלהם","ממד הזמן: אירועים שקורים בחיים, ובאיזה גיל הם קורים. אותו אירוע משפיע אחרת בגיל אחר.","לידת אחות כשנועם בן 2 משפיעה עליו אחרת מאשר אם היא הייתה נולדת כשהוא בן 10."]])}${rem("לפי ברונפנברנר, לא הסביבה לבד ולא הנטיות הפנימיות לבד קובעות את ההתפתחות. הילד והסביבה הם <b>רשת של השפעות</b> תלויות זו בזו.")}`,q:"q23"},
  {h:"כאוס במשפחה",html:`<p>חיי משפחה מסודרים (ארוחות, שעת שינה, שיעורי בית) תומכים בקשר חם ומעורב. <b>כאוס</b> קבוע פוגע בהתפתחות.</p>${tiles([["check","ארוחות משפחתיות","קשורות לשפה והישגים טובים, פחות בעיות התנהגות, ובהתבגרות פחות סיכונים, אלכוהול וסמים","זמן קבוע שבו המשפחה יושבת יחד הוא הזדמנות לשיחה ולקשר. הוא קשור לתוצאות טובות אצל ילדים ובני נוער.","בכל ערב נועם ומשפחתו אוכלים יחד ומספרים מה היה ביום."],["x","אבל לא כל ארוחה","ארוחות מתוחות, עם משמעת לא עקבית ותקשורת עוינת, קשורות לקשיי הסתגלות"],["building","כוח האקסו","שעות נסיעה, שמרטפות לא אמינה ולחץ בעבודה מסכנים את השגרה"]])}${ex("מעון יום אחד הציע להורים להזמין ארוחת ערב בריאה וזולה שחיכתה להם במעון, כדי להפוך את ארוחת הערב המשפחתית לשגרה.")}`,q:"q25"}
 ]},
 {id:"t5",icon:"cycle",title:"מערכות דינמיות והשוואה",blocks:[
  {h:"ההתפתחות כמערכת דינמית",html:`${def("על מה הנושא",`תיאוריה חדשה שרואה בהתפתחות מערכת שכל חלק בה משפיע על האחרים. אחר כך: השוואה בין כל התיאוריות.<br><b>מה נלמד כאן:</b> מערכות דינמיות · השוואה בין תיאוריות · עמדה אקלקטית`)}${def("מושג מפתח",`<mark>גישת המערכות הדינמיות</mark> ${E("Dynamic systems perspective")}: הנפש, הגוף והעולם הפיזי והחברתי של הילד יוצרים <b>מערכת אחת משולבת</b>, בתנועה מתמדת. שינוי בחלק אחד (צמיחת המוח, הסביבה) משבש את המערכת, והילד <b>מארגן מחדש</b> את ההתנהגות בדרך מורכבת ויעילה יותר.`)}${rem("ההתפתחות דומה ל<b>רשת של סיבים</b> שמסתעפים לכיוונים רבים, ולא לקו אחד. גם כשילדים רוכשים את אותה מיומנות (הליכה, דיבור), כל אחד עושה זאת בדרכו.")}${ex("במעבר לגיל ההתבגרות התקשורת בין הורה למתבגר נעשתה לא יציבה כמה שנים, ואז, כשמצאו דרכים בוגרות יותר, המערכת התארגנה מחדש וחזרה להיות צפויה וחיובית.")}`,q:"q27"},
  {h:"השוואה בין תיאוריות",html:`${tiles([["brain","פסיכואנליטית","בלתי רציפה (שלבים), מסלול יחיד, תורשה וסביבה. חוויות מוקדמות קובעות","לפי הגישה הזו, ההתפתחות עוברת בשלבים, אצל כולם באותו מסלול, והחוויות המוקדמות בילדות קובעות את מה שיבוא אחר כך.","לפי הגישה, קשיים בקשר עם ההורים בשנים הראשונות ישפיעו על האישיות גם בבגרות."],["copies","ביהביוריזם ולמידה חברתית","רציפה, מסלולים רבים, דגש על סביבה (התניה וחיקוי)"],["cycle","מערכות דינמיות","רציפה וגם בלתי רציפה, מסלולים מרובים, תורשה וסביבה. חוויות מוקדמות ומאוחרות","לפי הגישה הזו, הילד, הגוף והסביבה משפיעים כל הזמן זה על זה, ולכן כל ילד יכול להגיע לאותה יכולת בדרך שונה. גם חוויות מוקדמות וגם מאוחרות חשובות.","שני תינוקות לומדים ללכת: אחד מתחיל בזחילה, והשני מדלג על זחילה ונעמד ישר, וכל אחד מוצא את הדרך שלו."]])}${def("עמדה אקלקטית",`כל גישה תרמה למה שאנחנו יודעים, ולכן סביר שבסוף תגבשו עמדה <mark>אקלקטית</mark> (מלקטת), שמשלבת כמה תיאוריות.`)}${ex(`<b>עמדה אקלקטית</b>: כמו שף שלוקח מתכון מכל מטבח את מה שהכי טוב. כך החוקר לוקח מכל תיאוריה את מה שהכי מסביר.`)}`,q:"q29"}
 ]},
 {id:"t6",icon:"doc",title:"שיטות מחקר נפוצות",blocks:[
  {h:"תצפיות",html:`${def("על מה הנושא",`איך בכלל חוקרים ילדים? הנושא מציג את הדרכים לאסוף מידע: לצפות בהם, לשאול אותם, או להעמיק במקרה אחד.<br><b>מה נלמד כאן:</b> תצפית נטורליסטית ומובנית · ריאיון קליני ומובנה · חקר מקרה · אתנוגרפיה`)}${def("תצפית נטורליסטית",`<mark>תצפית נטורליסטית</mark> ${E("Naturalistic observation")}: צופים בהתנהגות בסביבה הטבעית. למשל, איך ילדים בגן מגיבים לבכי של חבר. נמצא קשר בין רגישות המטפלים לתגובות האכפתיות של הילדים.`)}${def("תצפית מובנית",`<mark>תצפית מובנית</mark> ${E("Structured observation")}: יוצרים במעבדה מצב שמעורר את ההתנהגות, כך שלכולם הזדמנות שווה. למשל, בובה שהרגל שלה \"נושרת\" כשהילד מרים אותה, כדי לבדוק חרטה ואכפתיות.`)}${ex("מצלמות ומיקרופונים חשפו שבריונות קורה בקצב של 2.4 מקרים לשעה בכיתה ו-4.5 במגרש, ושהמורים התערבו רק ב-15% עד 18% מהזמן.")}`,q:"q31"},
  {h:"דיווח עצמי וחקר מקרה",html:`${def("ריאיון קליני",`<mark>ריאיון קליני</mark> ${E("Clinical interview")}: שיחה גמישה שמבררת את השקפת הנחקר, כמו פיאז'ה ששאל ילד מאיפה בא החלום.`)}${def("ריאיון מובנה",`<mark>ריאיון מובנה</mark> ${E("Structured interview")}, שאלונים ומבחנים: כולם נשאלים אותן שאלות. כשהורים קיבלו רשימה, 62% בחרו \"לחשוב בכוחות עצמם\", אבל בריאיון פתוח רק 5% חשבו על זה.`)}${def("חקר מקרה",`<mark>השיטה הקלינית</mark> ${E("Case study")}: מידע רב על ילד אחד, מראיונות, תצפיות ומבחנים. מתאימה לקבוצות קטנות ומיוחדות, כמו <b>ילדי פלא</b>. אצל חלקם היו קרובי משפחה עם אוטיזם, וההשערה היא שיש תכונה גנטית משותפת של קשב רב לפרטים.`)}${ex(`<b>ריאיון קליני</b>: "ספר לי, למה לדעתך הירח זז כשאתה הולך?", ואז ממשיכים לפי מה שהילד עונה. <b>ריאיון מובנה</b>: כל ילד מקבל בדיוק את אותן 10 שאלות, באותו סדר.`)}`,q:"q33"},
  {h:"אתנוגרפיה וסיכום",html:`${def("מושג מפתח",`<mark>אתנוגרפיה</mark> ${E("Ethnography")}: שיטה תיאורית מהאנתרופולוגיה. החוקר חי חודשים או שנים בקהילה, ב<b>תצפית משתתפת</b>, כדי להבין את ערכיה ותהליכיה. למשל, הורים הינדים מעודדים ילדים לתקשר עם דמויות \"בלתי נראות\", והורים נוצרים פונדמנטליסטים מרתיעים מזה.`)}${methodsTable}${ex(`חוקרת שגרה שנה בכפר בגואטמלה, משתתפת בחיי היומיום ומתעדת איך ילדים לומדים לארוג מהאמהות שלהם.`)}`,q:"q35"},
  {h:"נוער מהגרים",html:`<p>כמעט לרבע מהילדים בארה\"ב יש הורים שנולדו בארץ אחרת. בניגוד להנחה הרווחת, רבים מהם <b>מסתגלים היטב</b>: הישגים טובים לא פחות, פחות עבריינות, סמים ואלכוהול, והערכה עצמית חיובית.</p>${tiles([["people","ערכי משפחה","ההורים רואים בהשכלה דרך להצלחה, והילדים רואים בהצלחה דרך לגמול להורים","במשפחות מסוימות ההשכלה נתפסת כדרך להצליח, וההצלחה של הילד נתפסת כדרך לגמול להורים. זה מניע את הילד ללמוד.","ההורים של נועם עבדו קשה כדי שיוכל ללמוד, והוא רוצה להצליח כדי שיהיו גאים בו."],["building","קהילה אתנית","מבוגרים בקהילה מעודדים ומפקחים יחד"],["x","עדיין קשיים","שפה, בידוד, דעות קדומות ומתח בין ערכי הבית לתרבות החדשה. ההסתגלות משתנה לפי מוצא ומשאבים"]])}`,q:"q37"}
 ]},
 {id:"t7",icon:"flask",title:"מערכי מחקר כלליים",blocks:[
  {h:"המערך המתאמי",html:`${def("על מה הנושא",`אחרי שאוספים מידע, צריך תוכנית מחקר. שני מערכים עיקריים: אחד מראה קשר, והשני מראה סיבה ותוצאה.<br><b>מה נלמד כאן:</b> מערך מתאמי · מקדם מתאם · מערך ניסויי · ניסויי שדה וטבעיים`)}${def("מושג מפתח",`<mark>מערך מתאמי</mark> ${E("Correlational design")}: אוספים מידע בלי לשנות את חוויות הנחקרים, ובודקים קשרים בין מאפיינים להתנהגות.`)}${rem("<b>המגבלה:</b> אי אפשר להסיק <b>סיבה ותוצאה</b>. אם הורות קשורה לאינטליגנציה, ייתכן שההורות משפיעה, שהילד החכם מעורר הורות חיובית, או ש<b>משתנה שלישי</b> (כמו רעש בבית) משפיע על שניהם.")}${ex(`חוקרים מוצאים שילדים שקוראים להם יותר סיפורים יודעים יותר מילים. זה קשר, אבל אולי הורים שקוראים יותר גם מדברים יותר. לכן אי אפשר לדעת מה הסיבה.`)}`,q:"q39"},
  {h:"מקדם המתאם",html:`${def("מושג מפתח",`<mark>מקדם מתאם</mark> ${E("Correlation coefficient")}: מספר בין 1- ל-1+. <b>הגודל</b> מבטא את עוצמת הקשר, ו<b>הסימן</b> את הכיוון.`)}${fig("corr")}${ex("מתאם של 0.55+ בין דיבור האם לאוצר המילים של הפעוט: מתון וחיובי. מתאם של 0.42- בין דיבור חריף של אימהות לציות: ככל שהאם חריפה יותר, הילדה מצייתת פחות. ו-0.52+ ו-0.52- חזקים <b>באותה מידה</b>.")}`,q:"q41"},
  {h:"המערך הניסויי",html:`${def("מושג מפתח",`<mark>מערך ניסויי</mark> ${E("Experimental design")}: מאפשר להסיק <b>סיבה ותוצאה</b>. החוקר עושה מניפולציה ב<mark>משתנה בלתי תלוי</mark> (הסיבה) ובודק את ההשפעה על <mark>משתנה תלוי</mark> (התוצאה).`)}${ex("ילדים צפו במבוגרים שמתווכחים. בתנאי \"כעס פתור\" המבוגרים התנצלו והתפשרו. כשצפו בסכסוך נוסף, 42% מהם הראו ירידה במצוקה, לעומת 10% בתנאי \"כעס לא פתור\".")}${tiles([["cycle","הקצאה מקרית","כמו הגרלה, כדי שמאפייני הנחקרים יתחלקו שווה בין התנאים","מחלקים את המשתתפים לקבוצות בהגרלה, כדי שלא יהיה הבדל בין הקבוצות מראש. כך, אם יש הבדל בסוף, הוא נובע מהטיפול.","מגרילים אילו ילדים יקבלו תוכנית קריאה חדשה ואילו לא, כדי שבשתי הקבוצות יהיו ילדים חזקים וחלשים באותה מידה."],["scales","התאמה","מודדים מראש מאפיין חשוב ומחלקים שווה בין הקבוצות","כשאי אפשר לסמוך רק על המזל בחלוקה, מודדים מראש מאפיין שיכול להשפיע על התוצאה, ודואגים שיהיה שווה בשתי הקבוצות.","לפני ניסוי על שיטת לימוד, החוקרים בודקים את רמת הקריאה של הילדים, ומחלקים כך שבכל קבוצה יהיו ילדים חזקים וחלשים באותה מידה."]])}<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>מערך מתאמי</th><th>מערך ניסויי</th></tr></thead><tbody><tr><td><b>מה החוקר עושה</b></td><td>רק מודד, לא משנה כלום</td><td>משנה משתנה אחד (בלתי תלוי)</td></tr><tr><td><b>חלוקה לקבוצות</b></td><td>אין</td><td>אקראית</td></tr><tr><td><b>מה אפשר להסיק</b></td><td>יש קשר</td><td>סיבה ותוצאה</td></tr></tbody></table></div>`,q:"q43"},
  {h:"ניסויי שדה וניסויים טבעיים",html:`${tiles([["building","ניסוי שדה","הקצאה מקרית בסביבה טבעית. למשל ביקורי בית עם יועצת להורים: ההורות השתפרה, וזה ניבא פחות בעיות התנהגות","ניסוי עם הגרלה, אבל בסביבה הטבעית של הנחקרים ולא במעבדה. כך התוצאה קרובה יותר לחיים האמיתיים.","מגרילים משפחות שיקבלו ביקורי בית של יועצת הורים, ובודקים אחר כך אם ההורות השתפרה."],["copies","ניסוי טבעי (דמוי ניסוי)","משווים קבוצות שכבר קיימות (בתי ספר, משפחות), שנבחרו כדי להיות דומות. <b>בלי הקצאה מקרית</b>, ולכן פחות מדויק","כשאי אפשר לחלק אנשים לקבוצות, משווים קבוצות שכבר קיימות במציאות. כיוון שאין חלוקה מקרית, ייתכן שהקבוצות שונות גם בדברים אחרים.","משווים ילדים משני בתי ספר דומים, שרק באחד מהם יש תוכנית חדשה."]])}`,q:"q45"}
 ]},
 {id:"t8",icon:"clock",title:"מערכים התפתחותיים ואתיקה",blocks:[
  {h:"מחקר אורך",html:`${def("על מה הנושא",`כדי לחקור <b>שינוי</b> לאורך הגיל צריך מערכים מיוחדים. כל אחד חוסך משהו ומשלם על זה במשהו אחר. בסוף: איך שומרים על הילדים במחקר.<br><b>מה נלמד כאן:</b> מחקר אורך · מחקר רוחב · מחקר משלב · מיקרו־גנטי · אתיקה`)}${def("מושג מפתח",`<mark>מחקר אורך</mark> ${E("Longitudinal design")}: חוקרים את אותם נחקרים שוב ושוב לאורך זמן.`)}${ex("במחקר הייעוץ בברקלי (מ-1928): ילדים מתפרצים וביישנים נשארו כך במידה מתונה, בגלל \"אפקט כדור השלג\": הם עוררו תגובות של כעס או התעלמות שחיזקו את הנטייה. גברים מתפרצים התקשו בעבודה. גברים ביישנים התחתנו מאוחר יותר. נשים ביישניות אז לא הראו בעיות, כי זה היה מקובל.")}${tiles([["x","דגימה מוטית","מי שמתנדב למחקר ארוך שונה מהאחרים"],["x","נשירה סלקטיבית","מי שנשאר שונה ממי שעזב","במחקר שעוקב לאורך שנים, חלק מהמשתתפים עוזבים, ומי שנשאר שונה ממי שעזב. לכן התוצאות לא מייצגות את כולם.","במחקר של עשר שנים, דווקא המשפחות שעברו קשיים עוזבות, ומי שנשאר הן בעיקר משפחות יציבות."],["x","השפעות תרגול","לומדים להיבחן"],["x","אפקט עוקבה","השפעת התקופה ההיסטורית. היום ביישנות קשורה להסתגלות נמוכה גם אצל נשים","אנשים שנולדו באותה תקופה חווים יחד אירועים היסטוריים ותרבותיים. לכן ממצא מתקופה אחת לא תמיד נכון לתקופה אחרת.","פעם ביישנות אצל בנות נחשבה טבעית ולא הזיקה. היום היא קשורה לקשיי הסתגלות גם אצל נשים."]])}`,q:"q47"},
  {h:"רוחב, משלב ומיקרו־גנטי",html:`${def("מחקר רוחב",`<mark>מחקר רוחב</mark> ${E("Cross-sectional design")}: קבוצות בגילים שונים נבדקות <b>באותו זמן</b>. למשל, יחסי אחאים נעשו שוויוניים יותר ופחות קרובים בגיל ההתבגרות. אבל אין מידע על השינוי <b>ברמת הפרט</b>.`)}${fig("seq","מערך משלב: כל עוקבה במעקב של 3 שנים מכסה 5 שנות התפתחות")}${def("מערך מיקרו־גנטי",`<mark>מערך מיקרו־גנטי</mark> ${E("Microgenetic design")}: מציגים מטלה חדשה ועוקבים אחרי הרכישה שלה במפגשים צפופים. רואים את השינוי <b>בזמן שהוא קורה</b>.`)}${designTable}${ex(`<b>רוחב</b>: באותו יום בודקים ילדים בני 5, 8 ו־11. <b>מיקרו־גנטי</b>: נותנים לילדה פאזל חדש ועוקבים אחריה כל יום במשך שבועיים, כדי לראות בדיוק איך היא לומדת.`)}`,q:"q49"},
  {h:"אתיקה במחקר על ילדים",html:`<p>ילדים פגיעים יותר ומתקשים להבין מה פירוש ההשתתפות. זכויותיהם:</p>${tiles([["lock","הגנה מפגיעה","גופנית ונפשית. בספק, להתייעץ או לוותר"],["doc","הסכמה מדעת","של ההורים ושל הילד. מגיל 7 בערך, גם הסכמת הילד. אפשר לפרוש בכל רגע","לפני מחקר, ההורים מסכימים אחרי שהסבירו להם בדיוק מה יקרה. מגיל 7 בערך גם הילד צריך להסכים, ומותר לו להפסיק בכל רגע.","ילדה בת 9 מתחילה משימה במחקר, אומרת שהיא לא רוצה להמשיך, והחוקרת עוצרת מיד."],["id","פרטיות","הסתרת הזהות"],["check","מידע וטיפול","לקבל את התוצאות, ולקבוצת הביקורת טיפול מועיל בסוף"]])}${def("הטעיה ושיחת הבהרה",`<b>ועדות סקירה מוסדיות</b> (IRB) מאזנות בין מחיר לתועלת. כשיש הטעיה, עורכים <mark>שיחת הבהרה</mark> ${E("Debriefing")}, אבל ילדים קטנים עלולים לא להבין ולאבד אמון במבוגרים. לכן הטעיה מותרת רק כשהסכנה מינימלית.`)}`,q:"q51"}
 ]}

const Q={"q1":{"t":"t1","v":[{"q":"חוקרת בודקת איך זיכרון משתנה מגיל 70 עד 90. לאיזה תחום שייך המחקר?","a":"מדע ההתפתחות, ולא התפתחות הילד","w":["התפתחות הילד, כי מדובר בשינוי","התפתחות הילד, כי מדובר בזיכרון","אף אחד מהם, כי זה מחקר רפואי"],"e":"התפתחות הילד עוסקת בתקופה מההתעברות ועד גיל ההתבגרות, ולכן מחקר על גילאי 70 עד 90 שייך למדע ההתפתחות, שעוסק בכל מהלך החיים. העובדה שמדובר בשינוי לא הופכת אותו להתפתחות הילד."},{"q":"מה חוקר תחום התפתחות הילד?","a":"את הקבוע והמשתנה מההתעברות ועד ההתבגרות","w":["רק את מה שמשתנה מלידה ועד גיל שנתיים","רק את מה שקבוע לאורך כל החיים","את השינויים מהבגרות ועד הזקנה"],"e":"התפתחות הילד חוקרת גם את מה שקבוע וגם את מה שמשתנה, מההתעברות ועד ההתבגרות. הוא לא עוסק רק בשינוי, ולא רק בשנתיים הראשונות."}]},

"q11":{"t":"t2","v":[{"q":"שני ילדים עם אותה אישיות גדלים בכפר ובעיר, ומתפתחים אחרת. איזה מושג מסביר זאת?","a":"הקשרים שונים, מסלולים שונים","w":["תורשה זהה מובילה לתוצאה זהה","שלבים אוניברסליים לכל הילדים","יציבות של תכונות לאורך החיים"],"e":"אותה אישיות, הקשרים שונים (כפר ועיר), מסלולי התפתחות שונים: נסיבות אישיות וסביבתיות מובילות למסלולים שונים. זה לא תומך בשלבים אוניברסליים."},{"q":"מה עומד במרכז מחלוקת תורשה–סביבה?","a":"האם גנים או סביבה משפיעים יותר","w":["האם ההתפתחות רציפה או לא","האם תכונות יציבות לאורך זמן","האם יש מסלול אחד לכל הילדים"],"e":"מחלוקת תורשה–סביבה (nature–nurture) עוסקת בשאלה אם הגנים או הסביבה משפיעים יותר. השאלה על רציפות היא סוגיה אחרת."}]},
"q12":{"t":"t2","v":[{"q":"חוקר טוען שילד ביישן בגיל 3 יהיה ביישן גם בגיל 30. איזו עמדה זו?","a":"יציבות","w":["גמישות","אי־רציפות","הקשרים מרובים"],"e":"הטענה שמי שביישן בגיל 3 יהיה ביישן גם בגיל 30 היא עמדת היציבות: מי שגבוה בתכונה יישאר כך. גמישות היא ההפך: אפשר להשתנות."},{"q":"מהי גמישות (plasticity)?","a":"היכולת להשתנות בעקבות חוויות","w":["היכולת לזכור חוויות מוקדמות","היכולת לעבור בין שלבים מהר","היכולת לרשת תכונות מההורים"],"e":"גמישות היא היכולת להשתנות בעקבות חוויות, לאורך כל החיים. היא לא היכולת לזכור חוויות מוקדמות."}]},
"q13":{"t":"t2","v":[{"q":"יועצת בונה תכנית לנוער בסיכון לנשירה. מה עמדתה בסוגיית יציבות מול גמישות?","a":"גמישות","w":["יציבות","רציפות","תורשה"],"e":"תכנית לנוער בסיכון מניחה שאפשר לשנות גם בגיל ההתבגרות, ולכן היועצת מחזיקה בעמדת הגמישות. עמדת היציבות הייתה מניחה שכבר מאוחר מדי."},{"q":"מי שמאמין שחוויות מוקדמות קובעות הכול, מה צפוי לעשות?","a":"להתערב כמה שיותר מוקדם","w":["לחכות לגיל ההתבגרות","להתמקד רק בגנטיקה","לא להתערב בכלל"],"e":"מי שמאמין שחוויות מוקדמות קובעות הכל יתערב כמה שיותר מוקדם, כי לדעתו אחר כך יהיה קשה לשנות. הוא לא יחכה לגיל ההתבגרות."}]},
"q14":{"t":"t2","v":[{"q":"מהי ״נקודת המבט המאוזנת״ של רוב החוקרים היום?","a":"שתי הגישות נכונות בחלקן","w":["ההתפתחות רציפה בלבד, בלי שלבים","הסביבה קובעת כמעט את הכול","התורשה קובעת כמעט את הכול"],"e":"רוב החוקרים היום מחזיקים בעמדה מאוזנת: לשתי הגישות יש צדק חלקי, והעמדות הקיצוניות התמתנו. הם לא טוענים שהסביבה קובעת את הכל."},{"q":"מה נכון לגבי השפעת חוויות מוקדמות ומאוחרות, לפי הספר?","a":"משתנה מתחום לתחום ומאדם לאדם","w":["מוקדמות חשובות תמיד יותר","מאוחרות חשובות תמיד יותר","לשתיהן אין השפעה מוכחת"],"e":"לפי הספר, ההשפעה של חוויות מוקדמות ומאוחרות משתנה מתחום לתחום ומאדם לאדם, ואין תשובה אחת. מוקדמות לא תמיד חשובות יותר."}]},
"q15":{"t":"t3","v":[{"q":"ילדה שגדלה בעוני ובאלימות מצליחה בלימודים ובונה חיים יציבים. מה היא מדגימה?","a":"חוסן","w":["גמישות מוחית","יציבות","אפקט עוקבה"],"e":"הסתגלות טובה למרות גורמי סיכון קשים, כמו עוני ואלימות, היא חוסן. גמישות מוחית היא יכולת של המוח להשתנות, ולא הצלחה מול סיכון."},{"q":"מה היה ההבדל בין ג׳ון לגרי בגיל 30?","a":"ג׳ון היה בכלא ומכור, וגרי הקים משפחה","w":["שניהם הצליחו באותה מידה בחיים","גרי היה בכלא, וג׳ון הקים משפחה","שניהם התקשו באותה מידה בחיים"],"e":"בגיל 30 ג׳ון היה בכלא ומכור, וגרי הקים משפחה, למרות שגדלו עם אותם גורמי סיכון. זו דוגמה לכך שאותם גורמים יכולים להוביל לתוצאות שונות."}]},
"q16":{"t":"t3","v":[{"q":"איזה מהבאים אינו גורם סיכון?","a":"קשר חם עם סבא","w":["עוני","סכסוך בין ההורים","מעברי דירה רבים"],"e":"קשר חם עם סבא הוא גורם הגנה, לא גורם סיכון. עוני, סכסוך בין ההורים ומעברי דירה רבים הם גורמי סיכון."},{"q":"מאיזה סוג מחקרים נלקחה ההשראה לחקר החוסן?","a":"מחקרי אורך על עקה","w":["ניסויי מעבדה קצרים","סקרים בנקודת זמן אחת","מחקרים על בעלי חיים"],"e":"ההשראה לחקר החוסן הגיעה ממחקרי אורך על עקה, שעקבו אחרי ילדים לאורך שנים. סקרים בנקודת זמן אחת לא יכולים להראות התפתחות."}]},
"q17":{"t":"t3","v":[{"q":"נער בסיכון מוצא מאמן כדורגל שמאמין בו ומלווה אותו. איזה גורם הגנה זה?","a":"תמיכה חברתית מחוץ למשפחה","w":["מאפיינים אישיים של הילד","קשר חם עם הורה","הזדמנויות בקהילה בלבד"],"e":"מאמן שמאמין בנער ומלווה אותו הוא תמיכה חברתית מחוץ למשפחה, אחד מארבעת גורמי ההגנה. קשר חם עם הורה היה תמיכה מתוך המשפחה."},{"q":"איך הגיבו ג׳ון וגרי למעברי דירה?","a":"ג׳ון חרד, גרי שמח","w":["שניהם נעשו חרדים וכועסים","שניהם שמחו על חברים חדשים","גרי נעשה חרד, וג׳ון שמח"],"e":"ג׳ון הגיב למעברי הדירה בחרדה, וגרי שמח על הזדמנויות חדשות. כלומר, המזג השונה שלהם הגיב אחרת לאותו גורם. המסיח האחרון הופך ביניהם."}]},
"q18":{"t":"t3","v":[{"q":"מה צריכה התערבות לחיזוק חוסן לכלול?","a":"חיזוק הילד והפחתת סיכונים","w":["רק חיזוק של יכולות הילד","רק הפחתה של הסיכונים בסביבה","רק עבודה עם ההורים בבית"],"e":"התערבות לחיזוק חוסן צריכה לפעול בשני כיוונים: לחזק את הילד ולהפחית את הסיכונים בסביבה. התמקדות רק באחד מהם לא מספיקה."},{"q":"איך מחקר החוסן קשור למחלוקת תורשה–סביבה?","a":"הוא מראה שתורשה וסביבה פועלות יחד","w":["הוא מוכיח שהתורשה קובעת את הכול","הוא מוכיח שהסביבה קובעת את הכול","הוא לא קשור כלל למחלוקת הזו"],"e":"מחקר החוסן מראה שתורשה (מזג) וסביבה (תמיכה, סיכון) פועלות יחד בקשרים מורכבים. הוא לא מוכיח שאחת מהן קובעת הכל."}]},
"q19":{"t":"t4","v":[{"q":"ילדה לומדת לארוג ליד אמה, שמראה לה, מתקנת אותה ומשאירה לה יותר ויותר. איזו גישה מסבירה זאת?","a":"של ויגוצקי","w":["המערכות הדינמיות","הביהביוריזם","המערכות האקולוגיות"],"e":"למידה דרך אינטראקציה עם מבוגר מנוסה סביב מטלה של התרבות, עם עזרה שהולכת ופוחתת, היא הגישה של ויגוצקי. ביהביוריזם היה מתמקד בחיזוקים, לא באינטראקציה."},{"q":"מה הביקורת על ויגוצקי?","a":"הוא הזניח את הצד הביולוגי","w":["הוא התעלם מהתרבות ומהחברה","הוא התמקד רק בגנטיקה ובביולוגיה","הוא לא חקר ילדים בכלל"],"e":"הביקורת על ויגוצקי היא שהזניח את הצד הביולוגי, כי שם דגש על הסביבה החברתית והתרבותית. הוא לא התעלם מהתרבות, אלא בדיוק להפך."}]},
"q20":{"t":"t4","v":[{"q":"ילדים בברזיל שמוכרים ממתקים מפתחים מתמטיקה מתוחכמת. מה זה מדגים?","a":"כל תרבות מפתחת חוזקות ייחודיות","w":["שכל הילדים מתפתחים באותו קצב","שמתמטיקה היא כישרון מולד","שבית הספר מיותר"],"e":"ילדים שמוכרים ממתקים מפתחים מתמטיקה מתוחכמת דרך פעילות בתרבות שלהם, ולכן כל תרבות מפתחת חוזקות ייחודיות. זה לא אומר שבית הספר מיותר."},{"q":"לפי התיאורטיקנים בני זמננו, מה היחס בין היחיד לחברה?","a":"שניהם משפיעים זה על זה","w":["החברה חשובה יותר מהיחיד","היחיד חשוב יותר מהחברה","אין ביניהם קשר של ממש"],"e":"לפי התיאורטיקנים בני זמננו, היחיד והחברה משפיעים זה על זה, ביחס דו־כיווני. אף אחד מהם לא ״חשוב יותר״."}]},
"q21":{"t":"t4","v":[{"q":"למה ברונפנברנר קרא לגישה שלו ״ביואקולוגית״?","a":"כי גם נטיות ביולוגיות משתתפות בהתפתחות","w":["כי היא עוסקת רק בביולוגיה של הילד","כי היא נחקרה בעיקר על בעלי חיים","כי היא התעלמה מהסביבה של הילד"],"e":"ברונפנברנר הוסיף ״ביו״ לגישה האקולוגית, כי גם הנטיות הביולוגיות של הילד משתתפות בהתפתחות, לצד הסביבה. הוא לא התעלם מהסביבה."},{"q":"איך ברונפנברנר ראה את הסביבה?","a":"כמעגלים גדלים שקשורים זה לזה","w":["כגורם אחד ופשוט","כמשהו שלא משפיע על הילד","כקו ישר של שלבים"],"e":"ברונפנברנר ראה את הסביבה כמעגלים גדלים שקשורים זה לזה: מיקרו, מזו, אקסו, מאקרו וכרונו. היא לא גורם אחד ופשוט."}]},
"q22":{"t":"t4","v":[{"q":"תינוק עם מזג קשה גורם לאמו להיות פחות סבלנית, וזה מחמיר את הבכי. מה זה מדגים?","a":"יחסים דו־כיווניים","w":["השפעה של מערכת המאקרו","השפעה של צד שלישי","השפעה של מערכת הכרונו"],"e":"התינוק משפיע על האם, והתגובה שלה משפיעה עליו בחזרה. אלה יחסים דו־כיווניים במערכת המיקרו. המאקרו הוא רמת הערכים והחוקים, וזה לא מה שמתואר."},{"q":"מה תפקיד ״צד שלישי״ במערכת המיקרו?","a":"הוא משפיע על הקשר בין שניים","w":["הוא מחליף את אחד ההורים בבית","הוא שופט את ההתנהגות של הילד","הוא קובע את חוקי המדינה"],"e":"״צד שלישי״ הוא מי שמשפיע על הקשר בין שניים, למשל הורים שתומכים זה בזה ובכך משפרים את הקשר של כל אחד עם הילד. הוא לא מחליף הורה."}]},
"q23":{"t":"t4","v":[{"q":"מורה ואם נפגשים לתאם תכנית לילד. לאיזו מערכת שייך הקשר ביניהם?","a":"מזו","w":["מיקרו","אקסו","מאקרו"],"e":"מערכת המזו כוללת את הקשרים בין מסגרות המיקרו של הילד, כמו הקשר בין הבית לבית הספר. כל אחת מהמסגרות לבדה היא מיקרו."},{"q":"לחץ בעבודה של האב משפיע על הילד, למרות שהילד לא שם. לאיזו מערכת שייך מקום העבודה?","a":"אקסו","w":["מיקרו","מזו","כרונו"],"e":"מקום העבודה של האב הוא מסגרת שהילד לא חלק ממנה, ובכל זאת משפיעה עליו, ולכן הוא שייך למערכת האקסו. מזו היא קשר בין שתי מסגרות שהילד חלק מהן."}]},
"q24":{"t":"t4","v":[{"q":"חוק שמחייב חופשת לידה בשכר שייך למערכת:","a":"מאקרו","w":["אקסו","מזו","מיקרו"],"e":"חוק שמחייב חופשת לידה בשכר משקף ערכים וחוקים של החברה, ולכן שייך למערכת המאקרו. מקום העבודה עצמו הוא אקסו, אבל החוק הוא מאקרו."},{"q":"ילד שהוריו התגרשו כשהיה בן 3 מושפע אחרת מילד שהוריו התגרשו כשהיה בן 15. איזו מערכת זו?","a":"כרונו","w":["מאקרו","מזו","אקסו"],"e":"ההבדל בין גירושים בגיל 3 לגירושים בגיל 15 הוא ממד הזמן והעיתוי, וזו מערכת הכרונו. המאקרו עוסק בערכים ובחוקים, לא בתזמון."}]},
"q25":{"t":"t4","v":[{"q":"משפחה אוכלת יחד כל ערב, אבל הארוחות מלאות צעקות. מה הספר היה אומר?","a":"ארוחה כזו קשורה לקשיי הסתגלות","w":["כל ארוחה משפחתית מועילה, בכל מצב","הצעקות לא משנות כלום לילדים","זה עדיף על ארוחה שקטה ומרוחקת"],"e":"לפי הספר, האיכות של הארוחה חשובה, ולא רק התדירות. ארוחות מלאות צעקות קשורות לקשיי הסתגלות. לכן לא כל ארוחה משפחתית מועילה."},{"q":"במה קשורות ארוחות משפחתיות קבועות וחיוביות?","a":"בהישגים טובים ובפחות סיכון","w":["רק בבריאות גופנית טובה","רק במשקל תקין של הילד","בשום תוצאה מוכחת"],"e":"ארוחות משפחתיות קבועות וחיוביות קשורות להישגים טובים יותר ולפחות התנהגויות סיכון, כמו פחות סמים ואלכוהול, ולא רק לבריאות גופנית."}]},
"q26":{"t":"t4","v":[{"q":"איך מערכת האקסו יכולה ליצור כאוס במשפחה?","a":"נסיעות ארוכות ולחץ בעבודה פוגעים בשגרה","w":["חוקי המדינה משתנים מהר מדי","הילד עובר בית ספר באמצע שנה","המורים בכיתה מתחלפים הרבה"],"e":"נסיעות ארוכות ולחץ בעבודה של ההורים (אקסו) פוגעים בשגרה המשפחתית ויוצרים כאוס. הילד לא נמצא שם, אבל מושפע. חוקי המדינה שייכים למאקרו."},{"q":"מה עשה מעון יום אחד כדי לעזור למשפחות?","a":"הציע ארוחת ערב לקחת","w":["האריך את שעות הפעילות","ביטל את שכר הלימוד","הציע ייעוץ זוגי להורים"],"e":"המעון הציע ארוחת ערב לקחת הביתה, וכך הקטין את הכאוס המשפחתי. זו התערבות שמקלה על הורים עמוסים."}]},
"q27":{"t":"t5","v":[{"q":"תינוק מתחיל לזחול, ופתאום חוזר להתעורר בלילה ולחפש קרבה. איך הגישה הדינמית מסבירה זאת?","a":"שינוי בחלק אחד מארגן מחדש את הכול","w":["התינוק חוזר לשלב קודם לצמיתות","זו בעיה רפואית שדורשת טיפול מיוחד","זו השפעה ישירה של מערכת המאקרו"],"e":"לפי גישת המערכות הדינמיות, שינוי בחלק אחד, כמו זחילה, מערער את כל המערכת ומארגן אותה מחדש, ולכן מופיעים זמנית קשיים אחרים. זו לא נסיגה קבועה."},{"q":"איך גישת המערכות הדינמיות מציירת את ההתפתחות?","a":"כרשת מסתעפת","w":["כמדרגות קבועות","כקו ישר ופשוט","כמעגל סגור"],"e":"גישת המערכות הדינמיות מציירת את ההתפתחות כרשת מסתעפת, עם מסלולים מרובים. מדרגות קבועות הן הציור של תיאוריות השלבים."}]},
"q28":{"t":"t5","v":[{"q":"לפי מחקרי המערכות הדינמיות, מה קרה לתקשורת הורה–מתבגר?","a":"התערערה ואז התייצבה","w":["השתפרה בהדרגה ובקביעות","נפגעה לצמיתות ולא התאוששה","לא השתנתה כלל לאורך השנים"],"e":"תקשורת הורה–מתבגר התערערה בתחילת ההתבגרות, ואז התייצבה ברמה חדשה. זה ארגון מחדש של המערכת, ולא נזק קבוע."},{"q":"שני ילדים לומדים ללכת. לפי הגישה הדינמית, מה נכון?","a":"כל אחד מגיע לזה בדרכו הייחודית","w":["שניהם עוברים בדיוק אותם צעדים","אחד לומד ממוצא גנטי, השני מהסביבה","שניהם לומדים באותו גיל בדיוק"],"e":"לפי הגישה הדינמית, כל ילד מגיע לאותה מיומנות בדרך הייחודית שלו, לפי השילוב של הגוף, המטרות והסביבה שלו. הם לא עוברים בדיוק אותם צעדים."}]},
"q29":{"t":"t5","v":[{"q":"מה עמדת הגישה הפסיכואנליטית בסוגיית הרציפות?","a":"בלתי רציפה: שלבים","w":["רציפה: שינוי הדרגתי","שתיהן באותה מידה","לא מתייחסת לסוגיה"],"e":"הגישה הפסיכואנליטית מחזיקה בעמדה בלתי רציפה, עם שלבים פסיכו־סקסואליים (פרויד) או פסיכו־חברתיים (אריקסון). היא לא רואה בהתפתחות שינוי הדרגתי."},{"q":"מה עמדת הביהביוריזם בסוגיית תורשה–סביבה?","a":"דגש על הסביבה","w":["דגש על התורשה","שתיהן באותה מידה","לא מתייחס לסוגיה"],"e":"הביהביוריזם שם דגש על הסביבה: התנהגות נלמדת דרך התניה וחיקוי. הוא לא שם דגש על התורשה."}]},
"q30":{"t":"t5","v":[{"q":"סטודנטית משתמשת בפיאז׳ה להבין חשיבה, ובברונפנברנר להבין משפחה. איזו עמדה זו?","a":"אקלקטית","w":["רציפה","ביהביוריסטית","פסיכואנליטית"],"e":"שימוש בכמה תיאוריות, כל אחת להיבט אחר, הוא עמדה אקלקטית. רוב החוקרים היום עובדים כך, ולא נצמדים לתיאוריה אחת."},{"q":"מה עמדת המערכות הדינמיות לגבי חוויות מוקדמות ומאוחרות?","a":"שתיהן חשובות","w":["רק מוקדמות חשובות","רק מאוחרות חשובות","אף אחת לא חשובה"],"e":"לפי גישת המערכות הדינמיות, גם חוויות מוקדמות וגם חוויות מאוחרות חשובות, כי המערכת משתנה כל הזמן. אף אחת מהן לא קובעת לבד."}]},
"q31":{"t":"t6","v":[{"q":"חוקרת יושבת בגן ורושמת כמה פעמים ילדים חולקים צעצועים. מה החוזק של השיטה?","a":"רואים ישירות התנהגות יומיומית","w":["לכל ילד הזדמנות שווה להראות התנהגות","אפשר להסיק סיבה ותוצאה","הילדים לא יודעים שצופים בהם"],"e":"בתצפית נטורליסטית רואים ישירות איך ילדים מתנהגים ביומיום, בסביבה הטבעית שלהם. היא לא נותנת לכל ילד הזדמנות שווה, וזו המגבלה שלה."},{"q":"מה המגבלה של תצפית נטורליסטית?","a":"לא לכולם יש הזדמנות שווה","w":["היא לא מתאימה לילדים קטנים","היא יקרה מאוד לביצוע","היא מבוססת על דיווח עצמי"],"e":"בתצפית נטורליסטית לא לכולם יש הזדמנות שווה להראות את ההתנהגות, כי המצבים לא זהים. לכן משתמשים לפעמים בתצפית מובנית."}]},
"q32":{"t":"t6","v":[{"q":"למה במחקר הבובה שהרגל שלה נשרה השתמשו בתצפית מובנית?","a":"כדי שכל הילדים יעמדו באותו מצב","w":["כדי שהילדים לא ידעו שצופים","כדי לחסוך בזמן","כדי לבדוק את ההורים"],"e":"בתצפית מובנית החוקר יוצר את אותו מצב (בובה שהרגל שלה נשרה) לכל הילדים, וכך לכל אחד יש הזדמנות שווה להראות תגובה. המטרה לא הייתה להסתיר את הצפייה."},{"q":"מה גילה מחקר הבריונות עם מצלמות ומיקרופונים?","a":"בריונות שכיחה, ומורים התערבו רק לעתים","w":["בריונות נדירה מאוד","מורים התערבו כמעט תמיד","בריונות קורה רק מחוץ לבית הספר"],"e":"מחקר הבריונות מצא שבריונות שכיחה בבית הספר, ושמורים התערבו בה רק לעתים רחוקות. הוא נעשה בתצפית נטורליסטית."}]},
"q33":{"t":"t6","v":[{"q":"פיאז׳ה שואל ילד ״למה הירח זז?״ וממשיך לשאול לפי מה שהילד עונה. איזו שיטה זו?","a":"ריאיון קליני","w":["ריאיון מובנה","תצפית מובנית","שאלון"],"e":"שאלות גמישות, שמשתנות לפי מה שהילד עונה, הן ריאיון קליני. בריאיון מובנה שואלים את כולם אותן שאלות באותו סדר."},{"q":"מה המגבלה של הריאיון הקליני?","a":"קשה להשוות בין נחקרים","w":["הוא לא נותן מידע עשיר","הוא מתאים רק למבוגרים","הוא דורש מעבדה מיוחדת"],"e":"בריאיון קליני כל ילד נשאל שאלות אחרות, ולכן קשה להשוות בין נחקרים. בנוסף, דיווח של נחקרים לא תמיד מדויק. הוא דווקא נותן מידע עשיר."}]},
"q34":{"t":"t6","v":[{"q":"כשהורים קיבלו רשימה, 62% בחרו ״לחשוב בכוחות עצמם״, ובריאיון פתוח רק 5%. מה זה מדגים?","a":"החלופות משפיעות על התשובות","w":["ריאיון פתוח מדויק יותר תמיד","הורים משקרים בריאיון מובנה","אין הבדל אמיתי בין השיטות"],"e":"כשהחלופות הוצגו ברשימה, 62% בחרו בה, וכשהשאלה הייתה פתוחה רק 5% העלו אותה בעצמם. כלומר, החלופות משפיעות על התשובות. זה לא אומר שההורים משקרים."},{"q":"למה השיטה הקלינית (חקר מקרה) מתאימה לחקר ילדי פלא?","a":"כי הם קבוצה קטנה ומיוחדת","w":["כי הם לא משתפים פעולה","כי הם צריכים טיפול רגשי","כי הם כבר מבוגרים"],"e":"ילדי פלא הם קבוצה קטנה ומיוחדת, ואין מספיק מקרים לסקר, ולכן חוקרים אותם לעומק בחקר מקרה. זה לא בגלל שהם לא משתפים פעולה."}]},
"q35":{"t":"t6","v":[{"q":"חוקר חי שנה בכפר ומשתתף בחיי היומיום. מה המגבלה העיקרית?","a":"הטיה של החוקר, וקושי להכליל","w":["אין מידע עשיר","הילדים לא מתנהגים טבעי","אי אפשר לצפות בהתנהגות"],"e":"באתנוגרפיה החוקר משתתף בחיי היומיום, ולכן עלול להיות מוטה, וקשה להכליל ממנה. זו מגבלה משותפת לאתנוגרפיה ולחקר מקרה. השיטה דווקא נותנת מידע עשיר."},{"q":"מהי אתנוגרפיה?","a":"תצפית משתתפת בתרבות לאורך זמן","w":["שאלון ארוך לכל המשפחות","ניסוי במעבדה עם ילדים","ריאיון אחד עם מנהיג הקהילה"],"e":"אתנוגרפיה היא תצפית משתתפת בתרבות לאורך זמן, כדי להבין ערכים ותהליכים. היא לא שאלון ולא ניסוי."}]},
"q36":{"t":"t6","v":[{"q":"מה מצאו חוקרי ילדי פלא אצל חלק מהם?","a":"קרובי משפחה עם אוטיזם","w":["כולם גדלו בעוני קשה","כולם למדו בבתי ספר פרטיים","לאף אחד מהם לא היו אחים"],"e":"החוקרים מצאו שלחלק מילדי הפלא יש קרובי משפחה עם אוטיזם, ולכן ייתכן שיש תכונה גנטית משותפת. לא נמצא שכולם גדלו בעוני."},{"q":"לפי אתנוגרפיה, מה ההבדל בין הורים הינדים לנוצרים פונדמנטליסטים לגבי חברים דמיוניים?","a":"הינדים מעודדים, פונדמנטליסטים מרתיעים","w":["שניהם מעודדים","שניהם מרתיעים","הינדים מרתיעים, פונדמנטליסטים מעודדים"],"e":"הורים הינדים מעודדים חברים דמיוניים, כי הם קשורים לאמונה בגלגול נשמות, ונוצרים פונדמנטליסטים מרתיעים מהם. כך ערכי התרבות משפיעים. המסיח האחרון הופך ביניהם."}]},
"q37":{"t":"t6","v":[{"q":"מה נמצא לגבי נוער ממשפחות מהגרים בארה״ב?","a":"רבים מסתגלים היטב","w":["רובם נושרים מהלימודים","רובם מעורבים בפשיעה","הם מסתגלים פחות מכולם"],"e":"המחקר מצא שרבים מבני הנוער ממשפחות מהגרים בארה״ב מסתגלים היטב: מצליחים בלימודים ומעורבים פחות בהתנהגויות סיכון. הם לא מסתגלים פחות מכולם."},{"q":"מה תורם להצלחה של נוער מהגרים, חוץ מהכנסה?","a":"ערכי משפחה וקשר לקהילה האתנית","w":["ניתוק מהתרבות המקורית","הורים עם השכלה גבוהה בלבד","מגורים בשכונה עשירה"],"e":"מעבר להכנסה, ערכי משפחה חזקים וקשר לקהילה האתנית תורמים להצלחה שלהם. ניתוק מהתרבות המקורית דווקא לא עוזר."}]},
"q38":{"t":"t6","v":[{"q":"למה נוער מהגרים רואה בהצלחה בלימודים דבר חשוב במיוחד?","a":"כדרך לגמול להורים על הקשיים","w":["כי זה מה שהחוק דורש","כי הם רוצים לעזוב את המשפחה","כי זה מבטיח אזרחות"],"e":"נוער מהגרים רואה בהצלחה בלימודים דרך לגמול להורים על הקשיים שעברו, וזה ביטוי של מחויבות למשפחה. הם לא רוצים לעזוב את המשפחה."},{"q":"איזה קושי עדיין קיים אצל נוער מהגרים?","a":"שפה, בידוד ודעות קדומות","w":["ציונים נמוכים בכל המקצועות","חוסר עניין בלימודים","יחסים גרועים עם ההורים"],"e":"למרות ההצלחה, לנוער מהגרים עדיין יש קשיים: שפה, בידוד ודעות קדומות. היחסים עם ההורים לא תוארו כגרועים."}]},
"q39":{"t":"t7","v":[{"q":"חוקר מוצא שילדים שצופים יותר בטלוויזיה אלימים יותר. מה לא ניתן להסיק?","a":"שהטלוויזיה גורמת לאלימות","w":["שיש קשר בין המשתנים","שכדאי לחקור עוד","שהקשר הוא חיובי"],"e":"מחקר מתאמי מראה קשר בין המשתנים, אבל לא מוכיח שאחד גורם לשני: מתאם אינו סיבתיות. ייתכן שילדים אלימים בוחרים לצפות יותר, או שמשתנה שלישי משפיע על שניהם."},{"q":"מה מאפיין מערך מתאמי?","a":"בודקים קשרים בלי לשנות דבר","w":["משנים משתנה ובודקים את התוצאה","מחלקים את הילדים באקראי לקבוצות","עוקבים אחרי אותם ילדים שנים"],"e":"במערך מתאמי בודקים קשרים בין משתנים בלי לשנות שום דבר, בלי מניפולציה. שינוי של משתנה ובדיקת התוצאה הם ניסוי."}]},
"q40":{"t":"t7","v":[{"q":"נמצא קשר בין הורות חמה לאינטליגנציה. איזה הסבר הוא ״משתנה שלישי״?","a":"גורם בבית שמשפיע גם על ההורות וגם על האינטליגנציה","w":["הורות חמה מעלה אינטליגנציה","ילדים חכמים גורמים להורים להיות חמים","אין קשר בכלל"],"e":"״משתנה שלישי״ הוא גורם שמשפיע גם על ההורות וגם על האינטליגנציה, ולכן יוצר קשר ביניהן בלי שאחת גורמת לשנייה. ״ילדים חכמים גורמים להורים להיות חמים״ הוא הסבר של כיוון הפוך, לא של משתנה שלישי."},{"q":"למה חוקרים משתמשים במערך מתאמי למרות המגבלה?","a":"כי לפעמים אסור לתמרן","w":["כי הוא מוכיח סיבה ותוצאה","כי הוא תמיד זול יותר מניסוי","כי אין לו מגבלות בכלל"],"e":"לפעמים אסור לתמרן משתנה, כמו התעללות, ולכן חוקרים משתמשים במערך מתאמי למרות המגבלה. הוא לא מוכיח סיבה ותוצאה."}]},
"q41":{"t":"t7","v":[{"q":"איזה מתאם חזק יותר: 0.52+ או 0.52-?","a":"שניהם באותה עוצמה","w":["0.52+ חזק יותר","0.52- חזק יותר","אי אפשר לדעת"],"e":"עוצמת המתאם נקבעת לפי הגודל המוחלט שלו, והסימן מבטא רק את הכיוון. לכן 0.52+ ו-0.52- חזקים באותה מידה."},{"q":"מה מבטא הגודל של מקדם המתאם?","a":"את עוצמת הקשר","w":["את כיוון הקשר","את הסיבתיות","את גודל המדגם"],"e":"גודל המקדם מבטא את עוצמת הקשר, והסימן (פלוס או מינוס) מבטא את הכיוון שלו. המקדם לא מבטא סיבתיות."}]},
"q42":{"t":"t7","v":[{"q":"ככל שילדים ישנים פחות, הציונים שלהם נמוכים יותר. איזה מתאם זה?","a":"חיובי","w":["שלילי","אפס","הפוך"],"e":"כששני המשתנים זזים באותו כיוון, פחות שינה ופחות ציונים, המתאם חיובי. מתאם שלילי היה מתאר משתנה אחד שעולה כשהשני יורד."},{"q":"ככל שהורים צועקים יותר, הילד מציית פחות. איזה מתאם זה?","a":"שלילי","w":["חיובי","אפס","מושלם"],"e":"כשמשתנה אחד עולה (צעקות) והשני יורד (ציות), המתאם שלילי. במתאם חיובי השניים היו זזים באותו כיוון."}]},
"q43":{"t":"t7","v":[{"q":"במחקר, ילדים ראו מבוגרים שכועסים ואז משלימים או לא משלימים. מהו המשתנה הבלתי תלוי?","a":"איך הכעס מסתיים","w":["מצוקת הילדים","גיל הילדים","מספר המבוגרים"],"e":"המשתנה הבלתי תלוי הוא מה שהחוקר משנה, כאן האופן שבו הכעס מסתיים (פיוס או לא). מצוקת הילדים היא המשתנה התלוי, מה שנמדד."},{"q":"מה נמצא במחקר על כעס פתור?","a":"ילדים שראו פיוס נרגעו יותר","w":["לא נמצא הבדל בין הקבוצות","ילדים שראו כעס פתור נלחצו יותר","כל הילדים הגיבו באותה מצוקה"],"e":"ילדים שראו פיוס בסוף הכעס נרגעו יותר, וזו השפעה של המשתנה הבלתי תלוי. הם לא נלחצו יותר."}]},
"q44":{"t":"t7","v":[{"q":"למה משתמשים בהקצאה מקרית?","a":"כדי שמאפייני הנחקרים יתחלקו שווה","w":["כדי לחסוך בזמן","כדי לבחור את הנחקרים הטובים","כדי להגדיל את המדגם"],"e":"הקצאה מקרית מחלקת את הנחקרים לקבוצות באקראי, וכך המאפיינים שלהם מתחלקים שווה בין הקבוצות. זו שליטה במשתנים חלופיים. המטרה לא הייתה לחסוך זמן."},{"q":"מהי ״התאמה״ (matching) בניסוי?","a":"חלוקה שווה של מאפיין חשוב","w":["בחירה של נחקרים זהים","השוואה לנורמות קיימות","הקצאה לפי בקשת ההורים"],"e":"התאמה היא חלוקה שווה של מאפיין חשוב בין הקבוצות, למשל גיל או מין. היא משלימה את ההקצאה המקרית. היא לא בחירה של נחקרים זהים."}]},
"q45":{"t":"t7","v":[{"q":"חוקרים משווים ילדים שנולדו לפני ואחרי שנפתח מרכז קהילתי בעיר. איזה ניסוי זה?","a":"ניסוי טבעי","w":["ניסוי שדה","ניסוי מעבדה","מחקר מתאמי טהור"],"e":"החוקרים לא הקצו בעצמם, אלא השוו קבוצות שכבר נוצרו בגלל אירוע בעולם (פתיחת המרכז), ולכן זה ניסוי טבעי. בניסוי שדה יש הקצאה מקרית בסביבה טבעית."},{"q":"מה הראה ניסוי השדה עם ביקורי הבית?","a":"ההורות השתפרה, והבעיות ירדו","w":["ההתערבות לא השפיעה בכלל","ההתערבות דווקא הזיקה","רק ההורים השתנו, לא הילדים"],"e":"בניסוי השדה, עם הקצאה מקרית בסביבה טבעית, ביקורי הבית שיפרו את ההורות והפחיתו את בעיות הילדים. ההתערבות לא הזיקה."}]},
"q46":{"t":"t7","v":[{"q":"למה ניסויים טבעיים פחות מדויקים מניסויים אמיתיים?","a":"כי אין בהם הקצאה מקרית","w":["כי הם נעשים במעבדה","כי אין בהם השוואה","כי הם קצרים מדי"],"e":"בניסוי טבעי אין הקצאה מקרית, כי הקבוצות קיימות מראש, ולכן ייתכנו ביניהן הבדלים נוספים. הוא לא נערך במעבדה."},{"q":"מה החיסרון של ניסוי במעבדה?","a":"קשה להכליל לעולם","w":["אי אפשר להסיק סיבתיות","אין בו שליטה במשתנים","הוא תמיד לא אתי"],"e":"החיסרון של ניסוי במעבדה הוא שהתנאים מלאכותיים, ולכן קשה להכליל את הממצאים לעולם האמיתי. בניסוי מעבדה דווקא אפשר להסיק סיבתיות."}]},
"q47":{"t":"t8","v":[{"q":"חוקרים בודקים אותם 200 ילדים בגיל 5, 10 ו-15. איזה מערך זה?","a":"מחקר אורך","w":["מחקר רוחב","מערך משלב","מערך מיקרו־גנטי"],"e":"בדיקה של אותם נחקרים בגילים שונים לאורך זמן היא מחקר אורך. במחקר רוחב בודקים קבוצות שונות בגילים שונים, באותו זמן."},{"q":"ילד נוח לכעוס מעורר תגובות כועסות אצל אחרים, וזה מגביר את הכעס שלו. איך נקרא הדפוס?","a":"אפקט כדור השלג","w":["אפקט עוקבה","נשירה סלקטיבית","אפקט תרגול"],"e":"התנהגות שמעוררת תגובות מהסביבה, שמחזקות אותה עוד יותר, היא אפקט כדור השלג. זה נמצא במחקר הייעוץ בברקלי. אפקט עוקבה הוא השפעה של התקופה."}]},
"q48":{"t":"t8","v":[{"q":"במחקר אורך, ילדים ממשפחות במצוקה עוזבים יותר מהאחרים. איזו בעיה זו?","a":"נשירה סלקטיבית","w":["אפקט עוקבה","אפקט תרגול","הטיית החוקר"],"e":"כשמי שעוזב את המחקר שונה ממי שנשאר, כאן משפחות במצוקה, זו נשירה סלקטיבית, ומי שנשאר כבר לא מייצג את כולם. אפקט עוקבה הוא השפעה של התקופה ההיסטורית."},{"q":"מתבגרים שגדלו בתקופת מלחמה שונים מאלה שגדלו בתקופת שגשוג. מה זה?","a":"אפקט עוקבה","w":["נשירה סלקטיבית","אפקט כדור השלג","אפקט תרגול"],"e":"הבדלים בין דורות שגדלו בתקופות היסטוריות שונות, כמו מלחמה ושגשוג, הם אפקט עוקבה. נשירה סלקטיבית עוסקת במי שעוזב את המחקר."}]},
"q49":{"t":"t8","v":[{"q":"מה המגבלה של מחקר רוחב?","a":"אין מידע על שינוי אצל כל ילד","w":["הוא לוקח שנים רבות לביצוע","יש בו נשירה סלקטיבית","יש בו אפקט תרגול חזק"],"e":"במחקר רוחב בודקים קבוצות שונות בגילים שונים, ולכן אין מידע על השינוי אצל כל ילד לאורך זמן. נשירה ואפקט תרגול הם בעיות של מחקר אורך."},{"q":"איך מערך משלב חושף אפקט עוקבה?","a":"משווים בני גיל מדורות שונים","w":["בודקים את אותם ילדים שוב ושוב","בודקים לעומק רק ילד אחד","מבטלים את קבוצת הביקורת"],"e":"במערך משלב משווים בני אותו גיל מדורות שונים, וכך אפשר לראות אם יש הבדל שנובע מהתקופה, כלומר אפקט עוקבה. זה שילוב של אורך ורוחב."}]},
"q50":{"t":"t8","v":[{"q":"חוקרת נותנת לילדה פאזל חדש ועוקבת אחריה כל יום במשך שבועיים. איזה מערך זה?","a":"מיקרו־גנטי","w":["מחקר אורך רגיל","מחקר רוחב","מערך משלב"],"e":"מפגשים צפופים לאורך זמן קצר, כדי לראות איך השינוי קורה בזמן שהוא קורה, הם מערך מיקרו־גנטי. מחקר אורך רגיל עוקב לאורך שנים, ולא ברצף צפוף."},{"q":"מה הקושי במערך המיקרו־גנטי?","a":"הוא אינטנסיבי ולא צפוי","w":["אין בו מידע על שינוי","יש בו אפקט עוקבה","הוא לא אתי"],"e":"המערך המיקרו־גנטי אינטנסיבי, כי הוא דורש מפגשים רבים, ולא צפוי, כי לא יודעים מתי השינוי יקרה. הוא דווקא נותן מידע מפורט על שינוי."}]},
"q51":{"t":"t8","v":[{"q":"ילד בן 8 משתתף במחקר. ההורים הסכימו. מה עוד נדרש?","a":"גם ההסכמה של הילד עצמו","w":["אישור של המורה","אישור של בית המשפט","שום דבר נוסף"],"e":"מגיל 7 בערך צריך גם את ההסכמה של הילד עצמו, ולא רק של ההורים. אישור של מורה או של בית משפט אינו נדרש."},{"q":"ילד מספר במחקר שפוגעים בו. מה מותר לחוקר?","a":"לפנות למבוגר, אם הוסבר מראש","w":["לשמור את המידע בסוד תמיד","לפרסם את המידע במאמר","לשאול ישירות את הפוגע"],"e":"החוקר רשאי לפנות למבוגר אחראי כשילד מספר שפוגעים בו, אם הסביר זאת לילד מראש. השקיפות מראש היא מה שמאפשר זאת."}]},
"q52":{"t":"t8","v":[{"q":"למה הטעיה במחקר עם ילדים קטנים בעייתית במיוחד?","a":"הם עלולים לא להבין את ההבהרה ולאבד אמון","w":["כי הטעיה אסורה תמיד בכל מחקר","כי הורים אף פעם לא מסכימים לזה","כי זה לא משפיע על התוצאות"],"e":"ילדים קטנים עלולים לא להבין את ההבהרה שאחרי ההטעיה, ולאבד אמון במבוגרים. לכן הטעיה מותרת רק כשהסכנה מינימלית. היא לא אסורה תמיד."},{"q":"מה תפקיד ועדת הסקירה המוסדית (IRB)?","a":"לאזן בין נזק לתועלת","w":["לממן את המחקר","לבחור את הנחקרים","לפרסם את התוצאות"],"e":"ועדת הסקירה המוסדית (IRB) בוחנת את המחקר ומאזנת בין הנזק האפשרי לנחקרים לבין התועלת שלו. היא לא מממנת את המחקר."}]},
"h1":{"t":"t1","v":[{"q":"פעוטה שמתחילה ללכת מגלה מקומות חדשים, וההורים מגיבים בהתלהבות ובמשחק. מה הדוגמה ממחישה?","a":"התחומים הגופני, הקוגניטיבי והרגשי־חברתי משפיעים זה על זה","w":["ההתפתחות הגופנית קודמת תמיד להתפתחות הקוגניטיבית והרגשית","ההתפתחות בתקופת הינקות היא בעיקר גופנית","השפעת ההורים מוגבלת לתחום הרגשי־חברתי"],"e":"הליכה (גופני) מאפשרת חקירה (קוגניטיבי), והתגובות של ההורים (רגשי־חברתי) מחזקות אותה. התחומים לא נפרדים."}]},
"h2":{"t":"t2","v":[{"q":"חוקר שמאמין ביציבות ובחשיבות של חוויות מוקדמות יציע כנראה...","a":"להשקיע בהתערבות בגיל צעיר מאוד","w":["להתערב באותה מידה בכל גיל","לא להתערב כלל, כי לפי גישתו הכל תורשתי","להתערב בעיקר בגיל ההתבגרות"],"e":"לעמדה בסוגיות יש השלכה מעשית: מי שמדגיש חוויות מוקדמות יתערב מוקדם; מי שמדגיש גמישות יעזור בכל גיל."}]},
"h3":{"t":"t3","v":[{"q":"שני ילדים גדלו באותה שכונה קשה. לאחד היה סבא שהקשיב לו ותנועת נוער. איזה גורם הגנה לא מופיע בתיאור הזה?","a":"מאפיינים אישיים של הילד","w":["תמיכה מחוץ למשפחה","משאבים בקהילה","קשר עם מבוגר בעל מסוגלות"],"e":"סבא = מבוגר תומך מחוץ למשפחה; תנועת נוער = משאב קהילתי. מאפיינים אישיים (מזג, אינטליגנציה) לא מתוארים כאן."}]},
"h4":{"t":"t4","v":[{"q":"אם עובדת במקום עם שעות ארוכות ולחץ, ובבית יש פחות ארוחות משותפות. באיזה רובד של ברונפנברנר נמצא מקור ההשפעה?","a":"אקסו: מסגרת שהילד לא נמצא בה אבל משפיעה עליו","w":["מזו: קשר בין שתי מערכות מיקרו שבהן הילד נמצא","מאקרו: ערכים וחוקים של התרבות","כרונו: אירוע שקורה בזמן מסוים"],"e":"מקום העבודה של ההורה הוא אקסו. ההשפעה עוברת לשגרת המשפחה (מיקרו)."}]},
"h5":{"t":"t5","v":[{"q":"איזו גישה רואה את ההתפתחות גם כרציפה וגם כבלתי רציפה, עם מסלולים מרובים?","a":"מערכות דינמיות","w":["הגישה הפסיכואנליטית","הביהביוריזם","תיאוריות שלבים של פיאז׳ה"],"e":"מערכות דינמיות: שינוי בחלק משבש, והמערכת מתארגנת מחדש. פסיכואנליטית = שלבים ומסלול יחיד; ביהביוריזם = רציפה."}]},
"h6":{"t":"t6","v":[{"q":"חוקרת רוצה ללמוד איך בריונות קורית בהפסקה, בלי להתערב. מה היתרון ומה המחיר של השיטה המתאימה?","a":"תצפית נטורליסטית: התנהגות אמיתית, אבל בלי שליטה בתנאים","w":["תצפית מובנית: תנאים זהים לכולם, אבל התנהגות פחות טבעית במעבדה","ריאיון קליני: גמישות, אבל קשה להשוות","אתנוגרפיה: תמונה מלאה, אבל דורשת חיים בקהילה"],"e":"בסביבה הטבעית רואים התנהגות אמיתית (כמו מחקר המצלמות במגרש), אבל לא לכל ילד יש אותה הזדמנות להפגין אותה."}]},
"h7":{"t":"t7","v":[{"q":"נמצא מתאם של 0.45- בין שעות מסך לבין ציונים. מה המסקנה הנכונה?","a":"קשר מתון ושלילי, בלי אפשרות להסיק סיבתיות","w":["קשר חלש מאוד, ולכן אין משמעות לממצא","שעות מסך גורמות לירידה בציונים של ילדים בגיל הזה","קשר חיובי וחזק בין שני המשתנים שנמדדו"],"e":"הגודל מבטא עוצמה (מתונה), הסימן כיוון (שלילי). מערך מתאמי לא מאפשר להסיק סיבה: אולי משתנה שלישי."}]},
"h8":{"t":"t8","v":[{"q":"חוקר בדק ב־2020 ילדים בני 6, 9 ו־12, ומצא שבני 12 שונים מאוד. למה קשה לדעת אם זה גיל או משהו אחר?","a":"אפקט עוקבה: הקבוצות גדלו בתקופות שונות","w":["נשירה סלקטיבית: חלק מהילדים עזבו את המחקר באמצע","השפעות תרגול: הם נבחנו כמה פעמים","דגימה מוטית: רק מתנדבים השתתפו"],"e":"במחקר רוחב הקבוצות שונות גם בתקופה ההיסטורית שבה גדלו. נשירה ותרגול הן בעיות של מחקר אורך."}]}};
const H={"h1":{"t":"t1","v":[{"q":"תינוקת מתחילה לזחול, ובעקבות זה מגלה חפצים חדשים בבית, וההורים מגיבים בהתלהבות ומשחקים איתה. מה המקרה מדגים?","a":"שלושת תחומי ההתפתחות משפיעים זה על זה","w":["התפתחות בלתי רציפה, כי הזחילה היא קפיצה לשלב חדש","השפעה של מערכת האקסו, כי ההורים עובדים מחוץ לבית","חוסן, כי התינוקת מסתגלת היטב למרות קושי"],"e":"הזחילה (גופני) פותחת עולם חדש (קוגניטיבי), ומשנה את התגובות של ההורים (רגשי־חברתי). התחומים לא נפרדים."},{"q":"בן 24 עדיין גר עם ההורים, מחליף עבודות ובודק אם הוא רוצה ללמוד, אבל כבר לא מרגיש מתבגר. לאיזו תקופה הוא שייך לפי הספר?","a":"בגרות בהתהוות: לפני קבלת תפקידי בוגרים","w":["התבגרות מאוחרת: הוא עדיין תלוי בהוריו כלכלית","בגרות מוקדמת: הוא כבר לא מתבגר ולכן הוא בוגר","ילדות מאוחרת: הוא עדיין לא עצמאי מבחינה רגשית"],"e":"בגרות בהתהוות (18 עד סוף שנות ה־20 בערך) היא תקופה שבה בוחנים אפשרויות באהבה, בעבודה ובערכים, לפני שמתחייבים לתפקידי בוגרים."}]},"h2":{"t":"t2","v":[{"q":"חוקר טוען: ״ילדים עוברים בדיוק אותם שלבים, באותו סדר, בכל העולם״. איזו עמדה הוא מביע בשתי סוגיות יסוד?","a":"התפתחות בלתי רציפה (שלבים), ומסלול אחד לכל הילדים","w":["התפתחות רציפה (הדרגתית), ומסלולים רבים לפי הקשר","התפתחות בלתי רציפה (שלבים), ומסלולים רבים לפי הקשר","התפתחות רציפה (הדרגתית), ומסלול אחד לכל הילדים"],"e":"״שלבים״ = בלתי רציף. ״אותו סדר בכל העולם״ = מסלול אחד."}]},"h3":{"t":"t2","v":[{"q":"הורה אומר: ״אין טעם לשלוח אותו לחוגים, הכול כבר כתוב בגנים שלו״. מה עמדתו, ומה נובע ממנה?","a":"תורשה, ולכן יציבות: הוא לא יראה טעם להתערב","w":["סביבה, ולכן גמישות: הוא ישקיע בהתערבות מוקדמת","תורשה, ולכן גמישות: הוא יתערב רק בגיל מאוחר","סביבה, ולכן יציבות: הוא יתערב רק בגיל מוקדם"],"e":"מי שמדגיש תורשה מדגיש בדרך כלל גם יציבות, ולכן פחות מאמין בהתערבות. העמדה בסוגיה קובעת את המעשים."},{"q":"מה העמדה המקובלת היום, לפי הספר, בשאלה ״תורשה או סביבה״?","a":"הן שזורות זו בזו, וקשה להפריד ביניהן","w":["התורשה קובעת, והסביבה רק מאפשרת לה להתבטא","הסביבה קובעת, והתורשה משפיעה רק בינקות","כל אחת קובעת חצי, ואפשר למדוד כמה מכל אחת"],"e":"הספר מציג נקודת מבט מאוזנת: יש שינוי רציף וגם בשלבים, מאפיינים אוניברסליים וגם ייחודיים, ותורשה וסביבה פועלות יחד."}]},"h4":{"t":"t3","v":[{"q":"שני אחים גדלו בבית עם הורים מכורים. אחד מהם הצליח בלימודים והקים משפחה, והשני לא. מה ככל הנראה עזר לאח שהצליח, לפי הספר?","a":"גורמי הגנה, כמו מבוגר תומך מחוץ למשפחה ומזג קליל","w":["מזל, כי חוסן לא קשור למאפיינים או לסביבה","גנים טובים יותר, כי חוסן הוא תכונה תורשתית בלבד","חוסר מודעות, כי הוא לא הבין כמה המצב קשה"],"e":"ארבעה גורמי הגנה: מאפיינים אישיים, קשר חם עם הורה, תמיכה מחוץ למשפחה, ומשאבים בקהילה. כמו הסבא של גרי."}]},"h5":{"t":"t3","v":[{"q":"לפי הספר, מה קורה כשגורמי סיכון מצטברים, ומה צריך לעשות?","a":"קשה לגבור עליהם, ולכן צריך גם לחזק את הילד וגם להקטין סיכונים","w":["מספיק לחזק את הילד, כי חוסן גובר על כל כמות של סיכונים","מספיק להקטין סיכונים, כי ילדים לא יכולים לפתח חוסן בעצמם","אין מה לעשות, כי ריבוי סיכונים קובע את התוצאה מראש"],"e":"חוסן הוא לא ״חומה״. כשהסיכונים רבים, צריך לפעול בשני הכיוונים: לחזק את הילד ולצמצם את הסיכונים סביבו."}]},"h6":{"t":"t4","v":[{"q":"ילדים בברזיל שמוכרים ממתקים ברחוב מפתחים חשבון מתוחכם בלי הרבה בית ספר. לאיזו תיאוריה זה מתאים?","a":"ויגוצקי: התרבות מלמדת דרך מטלות שחשובות בה","w":["ברונפנברנר: מערכת המאקרו קובעת את תוכנית הלימודים","מערכות דינמיות: הגוף והמוח התארגנו מחדש","ביהביוריזם: הם קיבלו חיזוק על כל מכירה"],"e":"לפי ויגוצקי, כל תרבות מטפחת יכולות דרך פעילויות שחשובות בה, בעזרת אחרים. הביקורת: הוא הזניח את הצד הביולוגי."}]},"h7":{"t":"t4","v":[{"q":"אמא של נועה פוטרה מהעבודה, וכתוצאה מכך יש פחות כסף ויותר מתח בבית. נועה לא הייתה במקום העבודה של אמא. באיזו שכבה של ברונפנברנר התחיל השינוי?","a":"אקסו: מקום שהילד לא נמצא בו, ומשפיע עליו","w":["מערכת המיקרו: הבית שבו נועה נמצאת כל יום","מערכת המזו: הקשר בין הבית לבין הגן","מערכת המאקרו: חוקי העבודה במדינה"],"e":"אקסו = סביבה שהילד לא נמצא בה. השינוי שם (פיטורים) חלחל לבית (מיקרו)."},{"q":"אחות קטנה נולדה כשנועם היה בן שנתיים, וזה שינה את כל השגרה בבית. איזו שכבה של ברונפנברנר מתארת את זה?","a":"מערכת הכרונו: אירועים לאורך זמן והעיתוי שלהם","w":["מערכת המיקרו: נועם והאחות נמצאים באותו בית","מערכת המזו: הקשר בין נועם לבין האחות","מערכת האקסו: ההורים עסוקים יותר עם התינוקת"],"e":"כרונו = ממד הזמן. אירוע כמו לידת אח, והגיל שבו הוא קורה, משנים את ההתפתחות."}]},"h8":{"t":"t5","v":[{"q":"כשתינוק מתחיל ללכת, ההתנהגות שלו ״משתבשת״ לזמן מה, ואחר כך מתארגנת ברמה גבוהה יותר. איזו גישה מתארת את זה?","a":"מערכות דינמיות: שינוי בחלק מארגן מחדש הכול","w":["ויגוצקי: מבוגר עוזר לתינוק לעבור לשלב הבא","פסיכואנליטית: התינוק עובר לשלב התפתחותי חדש","ביהביוריזם: ההליכה מקבלת חיזוק מההורים"],"e":"בגישת המערכות הדינמיות גוף, מוח וסביבה הם מערכת אחת. כל ילד מגיע לאותה מיומנות בדרך שלו, כמו ״רשת של סיבים״."}]},"h9":{"t":"t6","v":[{"q":"חוקרת רוצה לדעת איך ילדים מגיבים לחבר שנפגע, אבל זה קורה רק לפעמים בגן. היא בונה במעבדה מצב שבו בובה ״נשברת״ כשהילד מרים אותה. איזו שיטה זו, ולמה בחרה בה?","a":"תצפית מובנית, כי כך לכל ילד יש הזדמנות שווה להגיב","w":["תצפית נטורליסטית, כי התגובות בגן הן הכי אמיתיות","ריאיון קליני, כי אפשר לשאול כל ילד שאלות המשך","חקר מקרה, כי אפשר לחקור לעומק ילד אחד בלבד"],"e":"בתצפית בגן לא לכל ילד יש הזדמנות שווה. בתצפית מובנית התנאים זהים לכולם, אבל אולי ההתנהגות שונה מהיומיום."}]},"h10":{"t":"t6","v":[{"q":"חוקר מראיין ילד ושואל שאלות המשך לפי מה שהילד עונה, כמו שעשה פיאז׳ה. מה היתרון והחיסרון של השיטה?","a":"עומק וחשיבה טבעית, אבל קשה להשוות","w":["קל להשוות בין ילדים, אבל התשובות שטחיות","מקבלים מידע על כל התרבות, אבל אי אפשר להכליל","התנאים זהים לכולם, אבל ההתנהגות לא טבעית"],"e":"זה ריאיון קליני: גמיש ועמוק, אבל כל ילד נשאל אחרת. בריאיון מובנה ההפך: קל להשוות, אבל שטחי."}]},"h11":{"t":"t7","v":[{"q":"חוקרת מצאה שילדים שמקריאים להם יותר יודעים יותר מילים. מה היא יכולה להסיק?","a":"שיש קשר, אבל לא שהקריאה היא הסיבה","w":["שהקריאה גורמת לאוצר מילים גדול יותר","שילדים עם אוצר מילים גדול מבקשים יותר סיפורים","שהורים שמדברים הרבה גורמים לשני הדברים"],"e":"זה מערך מתאמי. אולי הקריאה עוזרת, אולי ילדים סקרנים מבקשים יותר, ואולי משתנה שלישי משפיע על שניהם."},{"q":"חוקר מגריל משפחות: חצי מקבלות ביקורי בית של אחות, וחצי לא. אחרי שנה הוא משווה את הילדים. איזה מערך זה?","a":"ניסוי שדה: יש הגרלה, אבל בסביבה הטבעית","w":["ניסוי טבעי: משווים קבוצות בסביבה הטבעית בלי הגרלה","מערך מתאמי: מודדים קשר בלי לשנות שום דבר","מחקר אורך: עוקבים אחרי אותם ילדים לאורך זמן"],"e":"ההגרלה הופכת אותו לניסוי, ולכן אפשר להסיק סיבה. הסביבה הטבעית (הבית) הופכת אותו לניסוי שדה."}]},"h12":{"t":"t7","v":[{"q":"מקדם המתאם בין שעות מסך לשעות שינה הוא 0.52−, ובין שעות קריאה לציונים 0.30+. איזה קשר חזק יותר?","a":"בין מסך לשינה, כי 0.52 גדול מ־0.30","w":["הקשר בין קריאה לציונים, כי מתאם חיובי תמיד חזק יותר","הם שווים, כי הסימנים מאזנים זה את זה","אי אפשר להשוות, כי אחד חיובי והשני שלילי"],"e":"הגודל (בלי הסימן) מראה עוצמה. 0.52− חזק בדיוק כמו 0.52+, רק בכיוון הפוך: יותר מסך, פחות שינה."}]},"h13":{"t":"t8","v":[{"q":"חוקרים השוו באותה שנה ילדים בני 5, 8 ו־11 ומצאו הבדלים בשימוש בטכנולוגיה. מה הבעיה העיקרית בפירוש?","a":"אפקט עוקבה: ההבדל אולי מהדור, לא מהגיל","w":["נשירה: חלק מהילדים עזבו את המחקר באמצע","תרגול: הילדים התרגלו למבחנים עם הזמן","מתנדבים: רק משפחות מסוימות הסכימו להשתתף"],"e":"זה מחקר רוחב. הוא מהיר, אבל לא מראה שינוי אצל ילד מסוים, וההבדלים עלולים לנבוע מהתקופה שבה כל קבוצה גדלה."},{"q":"מחקר שעוקב אחרי אותם ילדים מגיל 2 עד 18 מגלה שבסופו נשארו רק חצי מהמשתתפים. איזו בעיה זו, ולמה היא מסוכנת?","a":"נשירה: מי שנשאר עלול להיות שונה ממי שעזב","w":["אפקט עוקבה: הילדים גדלו בתקופה היסטורית שונה","תרגול: הילדים זכרו את המבחנים מהפעם הקודמת","הטעיה: הילדים לא ידעו מה באמת נבדק"],"e":"נשירה היא בעיה של מחקר אורך. אם, למשל, עזבו בעיקר משפחות במצוקה, המדגם שנשאר כבר לא מייצג."}]},"h14":{"t":"t8","v":[{"q":"נשים ביישניות שנולדו בשנות ה־20 לא סבלו מבעיות, אבל היום ביישנות קשורה לקשיים גם אצל נשים. מה זה מדגים?","a":"אפקט עוקבה: התקופה משנה את משמעות התכונה","w":["נשירה: הנשים הביישניות עזבו את מחקר האורך","תרגול: הנשים התרגלו לשאלות על ביישנות","חוסן: הנשים הביישניות פיתחו גורמי הגנה"],"e":"זה ממחקר האורך בברקלי. בתקופה שבה ביישנות נשית הייתה מקובלת, היא לא פגעה. כלומר הדור משנה את התוצאה."}]},"h15":{"t":"t8","v":[{"q":"חוקר רוצה להטעות ילדים בני 5 בניסוי, ולהסביר להם בסוף. למה הספר מזהיר דווקא לגבי ילדים צעירים?","a":"הם עלולים לא להבין ולאבד אמון במבוגרים","w":["הם לא מסוגלים לתת הסכמה מדעת בשום מקרה","אסור לחקור ילדים מתחת לגיל 7 בכלל","הם תמיד מגלים את ההטעיה ומשנים את התשובות"],"e":"הטעיה מותרת רק בסכנה מינימלית, עם שיחת הבהרה. אצל ילדים קטנים ההבהרה עלולה לא לעבוד. ומגיל 7 בערך מבקשים גם את הסכמת הילד."}]}};
const SUM=`<h2>סיכום: פרק 1 - היסטוריה, תיאוריה ואסטרטגיות מחקר</h2>
<div class="key"><b>על מה מדובר?</b> זה פרק המבוא של הקורס, והוא נותן <b>מפה</b> לכל השאר. הוא עונה על שלוש שאלות:<br>1. <b>מה חוקרים</b> בהתפתחות הילד? (אילו תחומים ואילו גילים)<br>2. <b>איך מסבירים</b> התפתחות? (תיאוריות, ושלוש שאלות יסוד שכל תיאוריה עונה עליהן אחרת)<br>3. <b>איך בודקים</b> את ההסברים? (שיטות ומערכי מחקר, ומה מותר מבחינה אתית)<br>כמעט כל מושג בפרק יחזור בפרקים הבאים, אז שווה להבין אותו טוב.</div>

<div class="key"><b>מה מתוך הפרק בחומר (לפי מיקוד הקריאה):</b> עמ׳ 3–13 (התחום, התקופות ושלוש סוגיות היסוד), עמ׳ 34–40 (ויגוצקי, ברונפנברנר, מערכות דינמיות והשוואה בין תיאוריות), ועמ׳ 42–64 (שיטות ומערכי מחקר ואתיקה). ההיסטוריה והתיאוריות של אמצע המאה (פרויד, פיאז׳ה וכו׳, עמ׳ 13–34) <b>לא</b> במיקוד.<br>
<b>יעדי הלמידה של הספר לחלקים האלה:</b> לתאר את התחום ואת החלוקה לתחומים ולתקופות; לזהות את שלוש סוגיות היסוד; לזהות את העמדה של כל תיאוריה בסוגיות האלה; לתאר שיטות מחקר; להבחין בין מערך מתאמי לניסויי; לתאר מערכים לחקר התפתחות, עם החוזקות והמגבלות; ולהכיר את סוגיות האתיקה.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>תיאוריה</b></td><td>הסבר מסודר שמתאר התנהגות, מסביר אותה ומנבא אותה, ושאפשר לבדוק במחקר.</td></tr>
<tr><td><b>רציף / בלתי רציף</b></td><td>רציף = שינוי הדרגתי, ״עוד מאותו דבר״. בלתי רציף = קפיצות לשלבים חדשים.</td></tr>
<tr><td><b>הקשר</b></td><td>השילוב הייחודי של נסיבות אישיות וסביבתיות שבהן ילד גדל.</td></tr>
<tr><td><b>פלסטיות</b></td><td>גמישות: היכולת להשתנות בעקבות חוויות.</td></tr>
<tr><td><b>חוסן</b></td><td>היכולת להסתגל היטב למרות קשיים וסיכונים.</td></tr>
<tr><td><b>מתאם</b></td><td>קשר בין שני משתנים, בלי לדעת מי גורם למי.</td></tr>
<tr><td><b>הקצאה מקרית</b></td><td>חלוקה של משתתפים לקבוצות בהגרלה, כך שהקבוצות יהיו דומות.</td></tr>
<tr><td><b>עוקבה</b></td><td>קבוצת אנשים שנולדו באותה תקופה וגדלו באותו עולם. ״דור״.</td></tr></table></div>

<h3>הדוגמה שתלווה אותנו: נועם</h3>
<p>נועם נולד לאחרונה. בכל הקורס נעקוב אחריו: בפרק הזה נשאל איך חוקרים היו בוחנים את ההתפתחות שלו, ובפרקים הבאים נראה את המשפחה שלו, את הלמידה שלו בינקות, ואת ההיקשרות שלו להורים.</p>

<h3>1. מה התחום חוקר</h3>
<p><b>התפתחות הילד</b> חוקרת מה <b>קבוע</b> ומה <b>משתנה</b> מההתעברות ועד ההתבגרות. כמעט כל הילדים מתחילים ללכת (קבוע), אבל אחד הולך בגיל 9 חודשים ואחר בגיל 15 (משתנה). זה חלק משדה רחב יותר, <b>מדע ההתפתחות</b>, שעוסק בשינויים לאורך כל החיים. התחום בין־תחומי (פסיכולוגיה, ביולוגיה, סוציולוגיה, חינוך, רפואה), והמחקר בו נדחף גם מצורך מעשי: הורים, מורים ורופאים רצו לדעת איך לעזור לילדים.</p>
<p><b>שלושה תחומי התפתחות</b>, שמשפיעים זה על זה:</p>
<ul>
<li><b>גופני:</b> גוף, מוח, חושים, מוטוריקה ובריאות.</li>
<li><b>קוגניטיבי:</b> קשב, זיכרון, חשיבה, שפה ויצירתיות.</li>
<li><b>רגשי־חברתי:</b> רגשות, הבנה עצמית, קשרים עם אחרים ומוסר.</li>
</ul>
<p>כשנועם יתחיל לזחול (גופני), הוא יגלה עולם חדש (קוגניטיבי), וההורים יגיבו בהתלהבות ובמשחק (רגשי־חברתי). שלושת התחומים עובדים יחד.</p>
<p><b>התקופות:</b> טרום לידה (השינוי המהיר ביותר) ← ינקות וגיל רך ← ילדות מוקדמת ← ילדות ← התבגרות ← <b>בגרות בהתהוות</b> (בערך 18 עד סוף שנות ה־20, במדינות מתועשות: כבר לא מתבגרים, אבל עוד לא לקחו על עצמם תפקידי בוגרים, ובוחנים אפשרויות באהבה, בעבודה ובערכים).</p>

<h3>2. מה זו תיאוריה, ושלוש שאלות היסוד</h3>
<p><b>תיאוריה</b> = מערכת מסודרת של טענות שמ<b>תארת</b>, מ<b>סבירה</b> ו<b>מנבאת</b> התנהגות. תיאוריה טובה של היקשרות, למשל, תתאר איך נועם יחפש נחמה אצל אמא בגיל 6–8 חודשים, תסביר למה, ותנבא איך זה ישפיע על הקשרים שלו בעתיד. ההבדל מאמונה: תיאוריה צריכה <b>אימות מדעי</b>, בדיקה בשיטות מקובלות.</p>
<p>כל תיאוריה עונה (במפורש או לא) על שלוש שאלות. אפשר לחשוב עליהן כשלושה ״מתגים״:</p>
<div class="tw"><table><tr><th>השאלה</th><th>צד א</th><th>צד ב</th></tr>
<tr><td><b>1. איך נראה השינוי?</b></td><td><b>רציף</b>: עוד ועוד מאותו דבר, כמו עץ שגדל קצת כל שנה</td><td><b>בלתי רציף</b>: <b>שלבים</b>, קפיצות לדרך חשיבה חדשה לגמרי, כמו זחל שהופך לפרפר</td></tr>
<tr><td><b>2. מסלול אחד או רבים?</b></td><td>כל הילדים עוברים אותו רצף</td><td>מסלולים שונים לפי <b>הקשרים</b> (שילוב ייחודי של נסיבות אישיות וסביבתיות)</td></tr>
<tr><td><b>3. מה משפיע יותר?</b></td><td><b>תורשה</b>: ומכאן <b>יציבות</b>, מי שגבוה בתכונה יישאר גבוה</td><td><b>סביבה</b>: ומכאן <b>גמישות (פלסטיות)</b>, אפשר להשתנות לאורך החיים</td></tr></table></div>
<p><b>למה זה חשוב בפועל?</b> העמדה קובעת מתי ואם להתערב. מי שמאמין בתורשה לא ישקיע בסביבה; מי שמאמין שהחוויות המוקדמות קובעות יתערב מוקדם; מי שמאמין בגמישות יעזור בכל גיל.</p>
<p><b>העמדה היום מאוזנת:</b> יש שינויים רציפים וגם בלתי רציפים, יש מאפיינים אוניברסליים לצד ייחודיים, ותורשה וסביבה <b>שזורות</b> זו בזו. אם נועם יהיה מוכשר במוזיקה, כנראה זה גם כישרון מולד וגם בית שבו כולם מנגנים.</p>

<h3>3. חוסן: למה יש ילדים שמצליחים למרות הכל</h3>
<p>שני חברים, ג׳ון וגרי, גדלו באותה שכונה קשה, עם הורים שהתגרשו, ושניהם נשרו מהתיכון. בגיל 30 ג׳ון היה בכלא, וגרי ניהל מוסך והקים משפחה. <b>חוסן</b> = היכולת להסתגל היטב למרות גורמי סיכון (עוני, משפחה קשה, גירושים, מחלות נפש). ארבעה <b>גורמי הגנה</b> מסבירים את ההבדל:</p>
<ol>
<li><b>מאפיינים אישיים:</b> אינטליגנציה, כישרון, מזג קליל וחברותי. גרי ציפה בשמחה לשכונה חדשה; ג׳ון נעשה חרד וזועם.</li>
<li><b>קשר חם עם הורה</b>, עם ציפיות מותאמות ופיקוח.</li>
<li><b>תמיכה מחוץ למשפחה:</b> מבוגר משמעותי (לגרי היה סבא שהקשיב לו).</li>
<li><b>משאבים בקהילה:</b> בית ספר טוב, תנועות נוער, פעילויות.</li>
</ol>
<p>חוסן מדגים שוב את השילוב של תורשה וסביבה. וכשגורמי הסיכון מצטברים, קשה לגבור עליהם, ולכן צריך גם לחזק את הילד וגם להקטין את הסיכונים סביבו.</p>

<h3>4. תיאוריות שמדגישות את הסביבה</h3>
<p><b>ויגוצקי (חברתי־תרבותי):</b> כל תרבות מלמדת את הילדים שלה דרך מטלות שחשובות בה, ובעזרת מבוגרים. בנות במקסיקו לומדות אריגה מורכבת ממבוגרות; ילדים בברזיל שמוכרים ממתקים ברחוב מפתחים מתמטיקה מתוחכמת בלי הרבה בית ספר. ביקורת: הזניח את הצד הביולוגי ואת היכולת של הילד לעצב את ההתפתחות שלו.</p>
<p><b>ברונפנברנר (המערכות האקולוגיות, ״ביואקולוגית״):</b> הילד נמצא במרכז של כמה עיגולים, כמו בצל, וכל שכבה משפיעה עליו. נראה את השכבות של נועם:</p>
<div class="tw"><table><tr><th>שכבה</th><th>מה זה</th><th>אצל נועם</th></tr>
<tr><td><b>מיקרו</b></td><td>הסביבה הקרובה. היחסים <b>דו־כיווניים</b>: גם הילד משפיע על המבוגר</td><td>ההורים, הגן. נועם בוכה הרבה, וזה משפיע על הסבלנות של אמא</td></tr>
<tr><td><b>מזו</b></td><td>הקשרים <b>בין</b> הסביבות הקרובות</td><td>הקשר בין ההורים לגננת</td></tr>
<tr><td><b>אקסו</b></td><td>מקומות שהילד <b>לא</b> נמצא בהם, אבל משפיעים עליו</td><td>מקום העבודה של אבא: אם הוא עובד עד מאוחר, אין ארוחת ערב משותפת</td></tr>
<tr><td><b>מאקרו</b></td><td>ערכים, חוקים ומשאבים של החברה</td><td>חופשת לידה, מעונות מסובסדים</td></tr>
<tr><td><b>כרונו</b></td><td>ממד הזמן: אירועים ו<b>העיתוי</b> שלהם</td><td>לידת אחות כשנועם בן שנתיים</td></tr></table></div>
<p>דוגמה מהפרק לשכבות שפועלות יחד: <b>כאוס במשפחה</b>. שגרה (ארוחות, שעת שינה) תומכת בהתפתחות, וארוחות משפחתיות קשורות לשפה טובה ולפחות סיכונים בהתבגרות, אבל רק אם הן לא מתוחות. ולחץ בעבודה של ההורים (אקסו) עלול לפרק את השגרה (מיקרו).</p>
<p><b>מערכות דינמיות:</b> גוף, מוח וסביבה הם מערכת אחת בתנועה. כששינוי בחלק אחד ״משבש״ את המערכת (נועם מתחיל ללכת, או מגיע להתבגרות), היא <b>מתארגנת מחדש</b> ברמה מורכבת יותר. ההתפתחות דומה ל<b>רשת של סיבים</b>, לא לקו אחד: כל ילד מגיע לאותה מיומנות בדרך שלו.</p>
<p><b>השוואה בין גישות</b> לפי שלוש שאלות היסוד:</p>
<div class="tw"><table><tr><th>גישה</th><th>רציף?</th><th>מסלול</th><th>תורשה / סביבה</th></tr>
<tr><td>פסיכואנליטית</td><td>שלבים</td><td>אחד</td><td>שתיהן; החוויות המוקדמות קובעות</td></tr>
<tr><td>ביהביוריזם ולמידה חברתית</td><td>רציף</td><td>רבים</td><td>סביבה (התניה, חיקוי)</td></tr>
<tr><td>מערכות דינמיות</td><td>גם וגם</td><td>רבים</td><td>שתיהן; מוקדם ומאוחר</td></tr></table></div>
<p>המסקנה: כל גישה תרמה משהו, ולכן כנראה תגבשו <b>עמדה אקלקטית</b> שלוקחת מכל אחת את מה שמסביר הכי טוב.</p>

<h3>5. איך אוספים מידע: שיטות</h3>
<p>נניח שחוקרת רוצה ללמוד איך ילדים בגן של נועם מגיבים כשחבר בוכה. אילו אפשרויות יש לה?</p>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>תצפית נטורליסטית</b></b><br><b>מה עושים:</b> צופים בגן עצמו<br><b>חוזק:</b> התנהגות אמיתית<br><b>מגבלה:</b> אין שליטה; לא לכל ילד יש הזדמנות שווה</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>תצפית מובנית</b></b><br><b>מה עושים:</b> יוצרים מצב במעבדה (בובה ש״נשברת״ כשהילד מרים אותה)<br><b>חוזק:</b> תנאים זהים לכולם; אפשר לחקור דברים נדירים<br><b>מגבלה:</b> אולי לא כמו ביומיום</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>ריאיון קליני</b></b><br><b>מה עושים:</b> שיחה גמישה שממשיכה לפי התשובות (כמו פיאז׳ה)<br><b>חוזק:</b> עומק, קרוב לחשיבה הטבעית<br><b>מגבלה:</b> קשה להשוות; דיווח לא מדויק</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>ריאיון מובנה / שאלון</b></b><br><b>מה עושים:</b> כולם עונים על אותן שאלות<br><b>חוזק:</b> השוואה, יעילות<br><b>מגבלה:</b> שטחי; האפשרויות המוכנות משנות תשובות</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>חקר מקרה</b></b><br><b>מה עושים:</b> הרבה מידע על ילד אחד<br><b>חוזק:</b> עומק; טוב לקבוצות נדירות (ילדי פלא)<br><b>מגבלה:</b> הטיית חוקר; אי אפשר להכליל</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>אתנוגרפיה</b></b><br><b>מה עושים:</b> החוקרת חיה בקהילה חודשים (״תצפית משתתפת״)<br><b>חוזק:</b> תמונה מלאה של תרבות<br><b>מגבלה:</b> הטיית ערכים; אי אפשר להכליל</div>
<p>דוגמה להשפעת השאלון: כשהורים קיבלו רשימה, 62% בחרו ״שהילד יחשוב בכוחות עצמו״ כדבר חשוב; כשנשאלו שאלה פתוחה, רק 5% חשבו על זה.</p>

<h3>6. איך מתכננים מחקר: מה מותר להסיק</h3>
<p><b>מערך מתאמי:</b> מודדים בלי לשנות כלום ובודקים קשר. החוקרת מוצאת שילדים שמקריאים להם יותר יודעים יותר מילים. אבל <b>אי אפשר להסיק סיבה</b>: אולי הקריאה עוזרת, אולי ילדים סקרנים מבקשים יותר סיפורים, ואולי <b>משתנה שלישי</b> (הורים שמדברים הרבה) משפיע על שניהם.</p>
<p><b>מקדם מתאם</b> הוא מספר בין 1- ל־1+. <b>הגודל</b> אומר כמה הקשר חזק, <b>הסימן</b> אומר את הכיוון. 0.52- חזק בדיוק כמו 0.52+; פשוט הכיוון הפוך (כשאחד עולה, השני יורד).</p>
<p><b>מערך ניסויי:</b> החוקרת <b>משנה</b> משהו (<b>משתנה בלתי תלוי</b>, הסיבה) ומודדת את התוצאה (<b>משתנה תלוי</b>), ומחלקת את הילדים לקבוצות ב<b>הקצאה מקרית</b> (הגרלה), כדי שהקבוצות יהיו דומות. רק כך אפשר להסיק <b>סיבה ותוצאה</b>. דוגמה: ילדים שראו מבוגרים מתווכחים ואז מתפייסים נבהלו פחות מוויכוח הבא (42%) מילדים שראו ויכוח בלי פיוס (10%).</p>
<ul>
<li><b>ניסוי שדה:</b> הגרלה, אבל בסביבה הטבעית (ביקורי בית להורים).</li>
<li><b>ניסוי טבעי:</b> משווים קבוצות שכבר קיימות, <b>בלי הגרלה</b>, ולכן פחות מדויק.</li>
</ul>
<div class="ex"><b>איך מזהים את סוג המחקר, בשלוש שאלות:</b><br>
① <b>״האם החוקר שינה משהו בעצמו?״</b> לא, רק מדד ← <b>מערך מתאמי</b>. אי אפשר להסיק סיבה.<br>
② אם כן: <b>״האם המשתתפים חולקו לקבוצות בהגרלה?״</b> כן ← <b>ניסוי</b> (במעבדה), או <b>ניסוי שדה</b> אם זה קרה בסביבה הטבעית. אפשר להסיק סיבה.<br>
③ <b>״השוו קבוצות שכבר היו קיימות, בלי הגרלה?״</b> ← <b>ניסוי טבעי</b>. פחות מדויק, כי הקבוצות עלולות להיות שונות גם בדברים אחרים.<br>
<b>דוגמה:</b> חוקרת משווה ילדים שגדלו בעיר לילדים שגדלו בקיבוץ. היא לא הגרילה מי יגדל איפה ← ניסוי טבעי.</div>
<p><b>מערכים שמיועדים לחקור שינוי עם הגיל:</b></p>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>אורך</b></b><br><b>מה עושים:</b> בודקים את אותם ילדים שוב ושוב לאורך שנים<br><b>חוזק:</b> רואים שינוי אצל כל ילד, וקשר בין מוקדם למאוחר<br><b>מגבלה:</b> יקר; מי שמתנדב שונה מאחרים; <b>נשירה</b> של חלק; <b>תרגול</b> במבחנים; <b>אפקט עוקבה</b></div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>רוחב</b></b><br><b>מה עושים:</b> באותו יום בודקים ילדים בני 5, 8 ו־11<br><b>חוזק:</b> מהיר וזול<br><b>מגבלה:</b> אין מידע על שינוי אצל ילד מסוים; אפקט עוקבה</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>משלב</b></b><br><b>מה עושים:</b> כמה עוקבות, כל אחת במעקב אורך קצר<br><b>חוזק:</b> משלב את שניהם וחושף אפקט עוקבה<br><b>מגבלה:</b> אותן בעיות, אבל אפשר לזהות אותן</div>
<div class="ex" style="margin:8px 0"><b style="font-size:1.05em"><b>מיקרו־גנטי</b></b><br><b>מה עושים:</b> מעקב צפוף אחרי רכישת מיומנות חדשה (פאזל חדש כל יום במשך שבועיים)<br><b>חוזק:</b> רואים את השינוי בזמן שהוא קורה<br><b>מגבלה:</b> אינטנסיבי; תרגול; קשה לתזמן</div>
<p><b>אפקט עוקבה</b> = השפעה של התקופה ההיסטורית שבה גדלו. דוגמה ממחקר האורך בברקלי (מ־1928): נשים ביישניות אז לא סבלו מבעיות, כי ביישנות נשית הייתה מקובלת; היום ביישנות קשורה לקשיים גם אצל נשים.</p>

<h3>7. אתיקה במחקר על ילדים</h3>
<ul>
<li><b>הגנה מפגיעה</b> גופנית ונפשית; בספק, מתייעצים או מוותרים.</li>
<li><b>הסכמה מדעת</b> של ההורים, ומגיל 7 בערך גם של הילד. מותר לפרוש בכל רגע.</li>
<li><b>פרטיות</b>, ו<b>זכות לקבל את התוצאות</b>; גם קבוצת הביקורת מקבלת בסוף טיפול מועיל.</li>
<li><b>הטעיה</b> מותרת רק כשהסכנה מינימלית, ואחריה <b>שיחת הבהרה</b>. אבל ילדים קטנים עלולים לא להבין ולאבד אמון במבוגרים. ועדות (IRB) מאזנות בין מחיר לתועלת.</li>
</ul>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>הפרק בחמישה משפטים:</b><br>
1. התפתחות הילד חוקרת מה <b>קבוע</b> ומה <b>משתנה</b> בשלושה <b>תחומים</b> (גופני, קוגניטיבי, רגשי־חברתי) ולאורך כמה <b>תקופות</b>.<br>
2. כל תיאוריה נוקטת עמדה בשלוש <b>סוגיות יסוד</b>: רציף או בשלבים, מסלול אחד או רבים, תורשה או סביבה. והעמדה קובעת מתי ואיך מתערבים.<br>
3. <b>חוסן</b> מראה ששילוב של תכונות הילד ותמיכה מהסביבה יכול לגבור על סיכונים.<br>
4. גישות חדשות מדגישות את הסביבה ואת הדינמיקה: <b>ויגוצקי</b> (תרבות ומבוגרים), <b>ברונפנברנר</b> (שכבות של סביבה), ו<b>מערכות דינמיות</b> (התארגנות מחדש).<br>
5. בודקים את התיאוריות ב<b>שיטות</b> ו<b>מערכי מחקר</b> שונים, ולכל אחד חוזקות ומגבלות. רק ניסוי עם הקצאה מקרית מוכיח סיבה. וכל מחקר בילדים כפוף לכללי אתיקה.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• לשייך דוגמה לתחום התפתחות ולתקופה.<br>
• לזהות את העמדה של משפט או תיאוריה בשלוש סוגיות היסוד.<br>
• להסביר חוסן ואת ארבעת גורמי ההגנה.<br>
• לנתח מקרה לפי השכבות של ברונפנברנר.<br>
• לזהות שיטת מחקר ומערך מחקר מתיאור, ולציין חוזק ומגבלה.<br>
• להסביר אפקט עוקבה, נשירה ותרגול, ולדעת באיזה מערך כל אחד פוגע.<br>
• להכיר את כללי האתיקה במחקר על ילדים.</div>

<li><b>ניסוי טבעי = בלי הגרלה</b>; ניסוי שדה = עם הגרלה, בסביבה טבעית.</li>

  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;

     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
      ${CONFIG.podcast?`<button class="review-btn" id="pod"><span aria-hidden="true">🎧</span><span>פודקאסט${CONFIG.podcast.min?` · ${CONFIG.podcast.min} דק׳`:""}</span></button>`:""}
     </div>
     ${CONFIG.podcast?`<div id="podbox" class="podbox" hidden><p class="muted">פודקאסט שנוצר ב־Gemini Notebook מקריאת החובה. כמו כל סיכום אוטומטי, הוא עלול לטעות, והקריאה עצמה קובעת.</p><div class="podframe"></div></div>`:""}
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
