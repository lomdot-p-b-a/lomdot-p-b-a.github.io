<style>
/* Layout: a study notebook. Home = illustrated cover + topic cards; topic = one reading card at a time, with a highlighter for key terms and drawn figures */
:root{
  --bg:#eef2f4; --surface:#ffffff; --raised:#f7f9fa; --ink:#15222a; --muted:#4c5b66; --line:#dbe2e6;
  --accent:#2457a6; --mark:#ffe27a; --good:#23855a; --good-soft:#e2f4ea; --bad:#c2452d; --bad-soft:#fbe6e1;
  --t1:#d35d36; --t2:#3667cf; --t3:#0e8a7c; --t4:#8448c9; --t5:#b9800c; --t6:#2a7fa6; --t7:#b4436c; --t8:#5a6b2e;
  --display:"Suez One","Frank Ruhl Libre","David",serif;
  --body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --shadow:0 1px 2px rgba(21,34,42,.06),0 8px 24px rgba(21,34,42,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181d; --surface:#18232a; --raised:#1e2b33; --ink:#e8eef1; --muted:#9db0ba; --line:#2b3a43;
  --accent:#7fa6ec; --mark:rgba(255,214,77,.32); --good:#5fd197; --good-soft:#173528; --bad:#f08a72; --bad-soft:#3b211b;
  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:500;line-height:1.75;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 2px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.ghost{background:transparent;border:none;color:var(--muted);padding:6px 2px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent);color:var(--surface);margin-bottom:6px}.entitle{display:inline;unicode-bidi:isolate;font-family:Rubik,system-ui,sans-serif;font-weight:800}.hetitle{margin:4px 0 0;font-weight:700;font-size:1.05rem}.cite{text-align:right;margin:4px 0 0;font-size:.85rem;color:var(--muted)}.cite a{color:var(--accent)}
.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */
.cover{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}
.cover-art svg{display:block;width:100%;height:auto;max-height:230px}
.cover-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
.cover h1{font-size:clamp(2rem,6vw,2.6rem);font-weight:900}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat-text{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:160px}
.stat-text b{font-size:1.05rem}
.review-btn{display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.actions button{justify-content:center}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.opt[aria-disabled]{cursor:default}
.opt .k svg{width:16px;height:16px}
.trows{display:flex;flex-direction:column;gap:10px;width:100%}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,30%) auto;gap:10px;align-items:center;width:100%}
.trow .tt{font-family:inherit;font-size:1rem;font-weight:600;line-height:1.35}
.trow .bar i{background:var(--c)}
.trow .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:left}
.card.rev{align-items:stretch}
.tag{align-self:flex-start;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raised)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.low{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:color-mix(in srgb,var(--mark) 45%,var(--raised))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{--c:var(--accent);text-align:right;padding:0;overflow:hidden;border:none;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard .band{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.tcard .band svg{width:44px;height:44px}
.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard .t{font-weight:700;font-size:1.05rem;line-height:1.35}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

/* topic */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--c)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tt{font-size:1.6rem;font-weight:900}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;color:var(--c)}
.fig{background:var(--raised);border-radius:14px;padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));border-radius:14px;padding:14px 16px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.15rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:32px;height:32px;color:var(--c)}
.tile b{font-size:.98rem}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.45}
.ex{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:99px;font-size:.88rem;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{flex:none;width:22px;height:22px;color:var(--c)}

/* question */
.q{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;line-height:1.45;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1.5px solid transparent}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c)}
.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}
.big{font-family:var(--display);font-size:3.4rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
</style>

<tr><td><b>ריאיון קליני</b></td><td class="in">גמיש, קרוב לחשיבה הטבעית, הרבה מידע בזמן קצר</td><td class="out">דיווח לא מדויק. קשה להשוות בין נחקרים</td></tr>
<tr><td><b>ריאיון מובנה, שאלונים, מבחנים</b></td><td class="in">השוואה בין נחקרים, יעיל, מציג חלופות</td><td class="out">פחות מעמיק. עדיין דיווח לא מדויק</td></tr>

 {id:"t1",icon:"sprout",title:"התחום, התחומים והתקופות",blocks:[
  {h:"מהי התפתחות הילד",html:`${def("על מה הנושא",`לפני שמתחילים, צריך מפה: מה התחום חוקר, באילו היבטים של הילד הוא מתמקד, ולאילו גילים הוא מחלק את החיים.<br><b>מה נלמד כאן:</b> התפתחות הילד · שלושה תחומי התפתחות · תקופות ההתפתחות · בגרות בהתהוות`)}${def("מושג מפתח",`<mark>התפתחות הילד</mark> ${E("Child development")}: תחום חקר שמוקדש להבנת <b>הקבוע והמשתנה</b> מההתעברות ועד גיל ההתבגרות. הוא חלק משדה רחב יותר, <mark>מדע ההתפתחות</mark> ${E("Developmental science")}, שכולל את כל השינויים לאורך החיים.`)}<p>את המחקר הניעו לא רק סקרנות מדעית אלא גם <b>לחצים חברתיים</b> לשפר את חיי הילדים: החינוך הציבורי, רופאי ילדים, עובדים סוציאליים והורים שביקשו עצות.</p>${rem("התחום <b>בין־תחומי</b>: פסיכולוגיה, סוציולוגיה, אנתרופולוגיה, ביולוגיה ומדע העצב, יחד עם חינוך, רפואה, בריאות הציבור ועבודה סוציאלית.")}${ex(`חוקרת שבודקת למה תינוקות מתחילים ללכת בסביבות גיל שנה, ולמה יש מי שהולך בגיל 9 חודשים ויש מי שבגיל 15. היא חוקרת גם את <b>הקבוע</b> (כמעט כולם הולכים) וגם את <b>המשתנה</b> (מתי ואיך).`)}`,q:"q1"},
  {h:"שלושה תחומי התפתחות",html:`${tiles([["hand","גופני","ממדי הגוף, מערכות הגוף, תפיסה, מוטוריקה ובריאות"],["brain","קוגניטיבי","קשב, זיכרון, ידע, פתרון בעיות, דמיון, יצירתיות ושפה"],["people","רגשי־חברתי","תקשורת רגשית, הבנה עצמית, כישורים בין־אישיים, חברויות ומוסר"]])}${rem("התחומים <b>לא נפרדים</b>: הם חופפים ומשפיעים זה על זה. למשל, יכולות מוטוריות חדשות כמו זחילה והליכה (גופני) עוזרות לתינוק להבין את סביבתו (קוגניטיבי), והמבוגרים מגיבים בעוד גירויים ועונג (רגשי־חברתי).")}${ex(`ילדה שלומדת לרכוב על אופניים: השרירים והשיווי משקל (גופני), ההבנה איך לבלום (קוגניטיבי), והגאווה כשאבא מוחא כפיים (רגשי־חברתי). שלושת התחומים פועלים יחד.`)}`,q:"q3"},
  {h:"תקופות ההתפתחות",html:`${fig("periods")}${tiles([["sprout","טרום לידה","9 חודשים, השינויים המהירים ביותר"],["hand","ינקות וגיל רך","שינויים דרמטיים בגוף ובמוח, תחילת השפה וקשרים ראשונים"],["copies","ילדות מוקדמת","משחקי דמיון, שליטה עצמית, חשיבה ושפה מואצות"],["grad","ילדות","משחקים עם כללים, קריאה וכתיבה, הבנת עצמי, מוסר וחברות"],["id","התבגרות","בשלות מינית, חשיבה מופשטת, עצמאות מהמשפחה"]])}${def("בגרות בהתהוות",`<mark>בגרות בהתהוות</mark> ${E("Emerging adulthood")}: מגיל 18 ועד אמצע או סוף שנות ה-20. צעירים במדינות מתועשות כבר עברו את ההתבגרות, אבל עוד לא לקחו על עצמם תפקידי בוגרים, ובוחנים אפשרויות באהבה, בקריירה ובערכים.`)}${ex(`<b>בגרות בהתהוות</b>: סטודנטית בת 23 שעדיין גרה אצל ההורים, מחליפה תחום לימודים ועוד לא יודעת איפה תגור. היא כבר לא מתבגרת, אבל גם לא מרגישה "מבוגרת" לגמרי.`)}`,q:"q5"}

  {h:"מהי תיאוריה",html:`${def("על מה הנושא",`תיאוריה היא כמו "משקפיים" שדרכם מסתכלים על הילד. הנושא מסביר מה זו תיאוריה, ואת שלוש השאלות הגדולות שכל תיאוריה עונה עליהן אחרת.<br><b>מה נלמד כאן:</b> מהי תיאוריה · רציפה מול בלתי רציפה · מסלול אחד מול מסלולים רבים · תורשה מול סביבה`)}${def("מושג מפתח",`<mark>תיאוריה</mark> ${E("Theory")}: מערכת מסודרת ומשולבת של היגדים ש<b>מתארת</b>, <b>מסבירה</b> ו<b>מנבאת</b> התנהגות.`)}${ex("תיאוריה טובה של היקשרות צריכה לתאר איך תינוקות בני 6 עד 8 חודשים מחפשים נחמה אצל מבוגר מוכר, להסביר למה הם מפתחים את הרצון הזה, ולנבא את ההשלכות על מערכות יחסים בעתיד.")}${tiles([["copies","ארגון","תיאוריות מארגנות את התצפיות ונותנות להן משמעות"],["check","יישום","תיאוריה שאומתה היא בסיס לשיפור חיי הילדים"]])}${rem(`ההבדל בין תיאוריה לאמונה: תיאוריה תלויה ב<mark>אימות מדעי</mark> ${E("Scientific verification")}, כלומר בבדיקה בשיטות מחקר מקובלות, וממצאים שעומדים במבחן הזמן.`)}`,q:"q7"},
  {h:"סוגיה 1: רציפה או בלתי רציפה?",html:`${fig("contin")}${tiles([["chart","רציפה","ההבדל בין ילד למבוגר הוא בכמות ובמורכבות. מוסיפים בהדרגה מיומנויות מאותו סוג"],["pyramid","בלתי רציפה","דרכים חדשות לגמרי להבין את העולם מופיעות בנקודות זמן מסוימות"]])}${def("שלבים",`<mark>שלבים</mark> ${E("Stages")}: שינויים <b>איכותיים</b> בחשיבה, ברגש ובהתנהגות שמאפיינים תקופות מוגדרות. כמו טיפוס במדרגות: שינוי מהיר במעבר, ואז \"ישורת\".`)}${ex(`<b>רציפה</b>: כמו עץ שגדל עוד קצת כל שנה. <b>בלתי רציפה</b>: כמו פרפר, שעובר משלב זחל לגולם ואז לפרפר. כל שלב שונה לגמרי מהקודם.`)}`,q:"q9"},
  {h:"סוגיות 2 ו-3",html:`${def("מסלול אחד או מסלולים מרובים?",`תיאוריות שלבים מניחות שכל בני האדם עוברים <b>אותו רצף</b>. אבל ילדים גדלים ב<mark>הקשרים</mark> ${E("Contexts")} שונים, שילובים ייחודיים של נסיבות אישיות וסביבתיות, שיכולים להוביל ל<b>מסלולים שונים</b>.`)}${def("תורשה או סביבה?",`<mark>מחלוקת תורשה–סביבה</mark> ${E("Nature-nurture")}: האם הגנים או העולם הפיזי והחברתי משפיעים יותר על ההתפתחות?`)}${tiles([["lock","יציבות","מי שגבוה או נמוך בתכונה יישאר כך. מדגישים תורשה או חוויות מוקדמות שקשה לשנות"],["sprout","גמישות","ההתפתחות פתוחה לשינוי לאורך כל החיים בעקבות חוויות. <mark>Plasticity</mark>"]])}${ex(`<b>תורשה או סביבה</b>: ילד מוכשר במוזיקה. האם כי נולד עם כישרון (תורשה), או כי גדל בבית שבו כולם מנגנים (סביבה)? רוב החוקרים היום יגידו: שניהם יחד.`)}`,q:"q11"},
  {h:"נקודת מבט מאוזנת",html:`<p>עם השנים העמדות התמתנו. היום רבים סבורים ש:</p>${yn(["יש שינויים רציפים <b>וגם</b> בלתי רציפים","יש מאפיינים אוניברסליים לצד ייחודיים לפרט ולהקשר","תורשה וסביבה <b>שזורות</b> זו בזו, וכל אחת משפיעה על הפוטנציאל של השנייה"],[])}${rem("<b>למה זה חשוב בפועל?</b> מי שמאמין בתורשה לא ישקיע בחוויות. מי שמאמין בחוויות מוקדמות יתערב מוקדם. מי שמאמין בסביבה לאורך כל החיים יעזור בכל גיל.")}`,q:"q13"}
 ]},
 {id:"t3",icon:"hand",title:"חוסן נפשי",blocks:[
  {h:"ג'ון וגרי",html:`${def("על מה הנושא",`למה יש ילדים שגדלים בתנאים קשים ובכל זאת מצליחים? הנושא מסביר מהו חוסן, ומה מגן על ילדים.<br><b>מה נלמד כאן:</b> חוסן · ארבעה גורמי הגנה`)}<p>שני חברים גדלו בשכונה מוזנחת, חוו סכסוכים וגירושים של ההורים, נשרו מהתיכון והסתבכו עם המשטרה. בגיל 30, ג'ון היה בכלא, מובטל ומכור. גרי סיים תיכון, למד מכונאות, ניהל מוסך, התחתן וקנה בית.</p>${def("מושג מפתח",`<mark>חוסן</mark> ${E("Resilience")}: היכולת להסתגל ביעילות מול גורמים שמאיימים על ההתפתחות. גורמי סיכון כמו עוני, משפחה שלילית, גירושים, מחלות נפש וסמים יוצרים נטייה לבעיות.`)}${ex(`<b>חוסן</b>: ילד שגדל עם הורה מכור, אבל בזכות סבתא שתמכה בו ומורה שהאמינה בו, הצליח בלימודים ובנה משפחה יציבה.`)}`,q:"q15"},
  {h:"ארבעה גורמי הגנה",html:`${tiles([["id","מאפיינים אישיים","אינטליגנציה, כישרונות מוערכים, ונטייה להיות קליל, חברותי ומווסת. גרי ציפה בשמחה לשכונה חדשה, ג'ון נעשה חרד וזועם"],["hand","יחסים חמים עם הורה","חום, ציפיות מותאמות, פיקוח וסביבה מאורגנת"],["people","תמיכה מחוץ למשפחה","קשר עם מבוגר בעל מסוגלות: סבא, דודה, מורה. לגרי היה סבא שהקשיב לו"],["building","משאבים בקהילה","בתי ספר טובים, שירותים, פעילויות פנאי ותנועות נוער. גרי התנדב בבניית דיור"]])}${rem("החוסן מדגים את הקשר המורכב בין <b>תורשה לסביבה</b>. כשמצטברים גורמי סיכון רבים, קשה לגבור עליהם. לכן צריך גם לחזק את הילד וגם להפחית את הסיכונים בסביבה.")}`,q:"q17"}
 ]},
 {id:"t4",icon:"building",title:"ויגוצקי וברונפנברנר",blocks:[
  {h:"ויגוצקי: הצד החברתי־תרבותי",html:`${def("על מה הנושא",`שתי תיאוריות שאומרות: אי אפשר להבין ילד בלי הסביבה שלו. ויגוצקי מתמקד בתרבות ובאנשים סביב הילד, וברונפנברנר בכל השכבות שעוטפות אותו.<br><b>מה נלמד כאן:</b> ויגוצקי · המערכות האקולוגיות · מיקרו, מזו, אקסו, מאקרו, כרונו`)}<p>לפי ויגוצקי, תרבויות שונות מלמדות ילדים דרך <b>מטלות שונות</b>, והאינטראקציה החברתית סביב המטלות מפתחת מיומנויות שחשובות באותה תרבות.</p>${ex("בנות מזינקנטן במקסיקו לומדות אריגה מורכבת ממבוגרים מומחים. ילדים בברזיל שמוכרים ממתקים מפתחים מתמטיקה מתוחכמת, גם עם מעט בית ספר.")}${rem("<b>ביקורת:</b> ויגוצקי הזניח את הצד <b>הביולוגי</b>, והדגיש פחות את היכולת של ילדים לעצב את התפתחותם. ממשיכיו מדגישים שילדים משתתפים באופן פעיל ואף משנים את המנהגים.")}`,q:"q19"},
  {h:"תיאוריית המערכות האקולוגיות",html:`${def("מושג מפתח",`<mark>תיאוריית המערכות האקולוגיות</mark> ${E("Ecological systems theory")} של ברונפנברנר: הילד מתפתח בתוך מערכת מורכבת של יחסים, ברבדים רבים של הסביבה. מכיוון שגם נטיות ביולוגיות משתתפות, הוא קרא לה <b>מודל ביואקולוגי</b>.`)}${fig("eco")}${ex(`לחשוב על הילד כמו על הנקודה במרכז של כמה עיגולים: המשפחה והגן קרובים אליו, מקום העבודה של ההורים רחוק יותר, וחוקי המדינה והתרבות עוטפים את הכול.`)}`,q:"q21"},
  {h:"הרבדים",html:`${tiles([["id","מיקרו","הסביבה המיידית. היחסים <b>דו־כיווניים</b>: גם הילד משפיע על המבוגר. גם <b>צד שלישי</b> משפיע (תמיכה בין ההורים משפרת את ההורות)"],["link","מזו","<b>קשרים בין</b> מערכות מיקרו: בית, בית ספר, מעון. למשל מעורבות ההורים בבית הספר"],["building","אקסו","מסגרות שהילד <b>לא נמצא בהן</b> אבל משפיעות עליו: עבודת ההורים, שירותים בקהילה, רשת חברתית"],["scales","מאקרו","ערכים, חוקים, מנהגים ומשאבים. למשל חופשת לידה ותקנים לטיפול בילדים"],["clock","כרונו","ממד הזמן: אירועים כמו לידת אח או גירושים, ו<b>העיתוי</b> שלהם"]])}${rem("לפי ברונפנברנר, לא הסביבה לבד ולא הנטיות הפנימיות לבד קובעות את ההתפתחות. הילד והסביבה הם <b>רשת של השפעות</b> תלויות זו בזו.")}`,q:"q23"},
  {h:"כאוס במשפחה",html:`<p>חיי משפחה מסודרים (ארוחות, שעת שינה, שיעורי בית) תומכים בקשר חם ומעורב. <b>כאוס</b> קבוע פוגע בהתפתחות.</p>${tiles([["check","ארוחות משפחתיות","קשורות לשפה והישגים טובים, פחות בעיות התנהגות, ובהתבגרות פחות סיכונים, אלכוהול וסמים"],["x","אבל לא כל ארוחה","ארוחות מתוחות, עם משמעת לא עקבית ותקשורת עוינת, קשורות לקשיי הסתגלות"],["building","כוח האקסו","שעות נסיעה, שמרטפות לא אמינה ולחץ בעבודה מסכנים את השגרה"]])}${ex("מעון יום אחד הציע להורים להזמין ארוחת ערב בריאה וזולה שחיכתה להם במעון, כדי להפוך את ארוחת הערב המשפחתית לשגרה.")}`,q:"q25"}
 ]},
 {id:"t5",icon:"cycle",title:"מערכות דינמיות והשוואה",blocks:[
  {h:"ההתפתחות כמערכת דינמית",html:`${def("על מה הנושא",`תיאוריה חדשה שרואה בהתפתחות מערכת שכל חלק בה משפיע על האחרים. אחר כך: השוואה בין כל התיאוריות.<br><b>מה נלמד כאן:</b> מערכות דינמיות · השוואה בין תיאוריות · עמדה אקלקטית`)}${def("מושג מפתח",`<mark>גישת המערכות הדינמיות</mark> ${E("Dynamic systems perspective")}: הנפש, הגוף והעולם הפיזי והחברתי של הילד יוצרים <b>מערכת אחת משולבת</b>, בתנועה מתמדת. שינוי בחלק אחד (צמיחת המוח, הסביבה) משבש את המערכת, והילד <b>מארגן מחדש</b> את ההתנהגות בדרך מורכבת ויעילה יותר.`)}${rem("ההתפתחות דומה ל<b>רשת של סיבים</b> שמסתעפים לכיוונים רבים, ולא לקו אחד. גם כשילדים רוכשים את אותה מיומנות (הליכה, דיבור), כל אחד עושה זאת בדרכו.")}${ex("במעבר לגיל ההתבגרות התקשורת בין הורה למתבגר נעשתה לא יציבה כמה שנים, ואז, כשמצאו דרכים בוגרות יותר, המערכת התארגנה מחדש וחזרה להיות צפויה וחיובית.")}`,q:"q27"},
  {h:"השוואה בין תיאוריות",html:`${tiles([["brain","פסיכואנליטית","בלתי רציפה (שלבים), מסלול יחיד, תורשה וסביבה. חוויות מוקדמות קובעות"],["copies","ביהביוריזם ולמידה חברתית","רציפה, מסלולים רבים, דגש על סביבה (התניה וחיקוי)"],["cycle","מערכות דינמיות","רציפה וגם בלתי רציפה, מסלולים מרובים, תורשה וסביבה. חוויות מוקדמות ומאוחרות"]])}${def("עמדה אקלקטית",`כל גישה תרמה למה שאנחנו יודעים, ולכן סביר שבסוף תגבשו עמדה <mark>אקלקטית</mark> (מלקטת), שמשלבת כמה תיאוריות.`)}${ex(`<b>עמדה אקלקטית</b>: כמו שף שלוקח מתכון מכל מטבח את מה שהכי טוב. כך החוקר לוקח מכל תיאוריה את מה שהכי מסביר.`)}`,q:"q29"}
 ]},
 {id:"t6",icon:"doc",title:"שיטות מחקר נפוצות",blocks:[
  {h:"תצפיות",html:`${def("על מה הנושא",`איך בכלל חוקרים ילדים? הנושא מציג את הדרכים לאסוף מידע: לצפות בהם, לשאול אותם, או להעמיק במקרה אחד.<br><b>מה נלמד כאן:</b> תצפית נטורליסטית ומובנית · ריאיון קליני ומובנה · חקר מקרה · אתנוגרפיה`)}${def("תצפית נטורליסטית",`<mark>תצפית נטורליסטית</mark> ${E("Naturalistic observation")}: צופים בהתנהגות בסביבה הטבעית. למשל, איך ילדים בגן מגיבים לבכי של חבר. נמצא קשר בין רגישות המטפלים לתגובות האכפתיות של הילדים.`)}${def("תצפית מובנית",`<mark>תצפית מובנית</mark> ${E("Structured observation")}: יוצרים במעבדה מצב שמעורר את ההתנהגות, כך שלכולם הזדמנות שווה. למשל, בובה שהרגל שלה \"נושרת\" כשהילד מרים אותה, כדי לבדוק חרטה ואכפתיות.`)}${ex("מצלמות ומיקרופונים חשפו שבריונות קורה בקצב של 2.4 מקרים לשעה בכיתה ו-4.5 במגרש, ושהמורים התערבו רק ב-15% עד 18% מהזמן.")}`,q:"q31"},
  {h:"דיווח עצמי וחקר מקרה",html:`${def("ריאיון קליני",`<mark>ריאיון קליני</mark> ${E("Clinical interview")}: שיחה גמישה שמבררת את השקפת הנחקר, כמו פיאז'ה ששאל ילד מאיפה בא החלום.`)}${def("ריאיון מובנה",`<mark>ריאיון מובנה</mark> ${E("Structured interview")}, שאלונים ומבחנים: כולם נשאלים אותן שאלות. כשהורים קיבלו רשימה, 62% בחרו \"לחשוב בכוחות עצמם\", אבל בריאיון פתוח רק 5% חשבו על זה.`)}${def("חקר מקרה",`<mark>השיטה הקלינית</mark> ${E("Case study")}: מידע רב על ילד אחד, מראיונות, תצפיות ומבחנים. מתאימה לקבוצות קטנות ומיוחדות, כמו <b>ילדי פלא</b>. אצל חלקם היו קרובי משפחה עם אוטיזם, וההשערה היא שיש תכונה גנטית משותפת של קשב רב לפרטים.`)}${ex(`<b>ריאיון קליני</b>: "ספר לי, למה לדעתך הירח זז כשאתה הולך?", ואז ממשיכים לפי מה שהילד עונה. <b>ריאיון מובנה</b>: כל ילד מקבל בדיוק את אותן 10 שאלות, באותו סדר.`)}`,q:"q33"},
  {h:"אתנוגרפיה וסיכום",html:`${def("מושג מפתח",`<mark>אתנוגרפיה</mark> ${E("Ethnography")}: שיטה תיאורית מהאנתרופולוגיה. החוקר חי חודשים או שנים בקהילה, ב<b>תצפית משתתפת</b>, כדי להבין את ערכיה ותהליכיה. למשל, הורים הינדים מעודדים ילדים לתקשר עם דמויות \"בלתי נראות\", והורים נוצרים פונדמנטליסטים מרתיעים מזה.`)}${methodsTable}${ex(`חוקרת שגרה שנה בכפר בגואטמלה, משתתפת בחיי היומיום ומתעדת איך ילדים לומדים לארוג מהאמהות שלהם.`)}`,q:"q35"},
  {h:"נוער מהגרים",html:`<p>כמעט לרבע מהילדים בארה\"ב יש הורים שנולדו בארץ אחרת. בניגוד להנחה הרווחת, רבים מהם <b>מסתגלים היטב</b>: הישגים טובים לא פחות, פחות עבריינות, סמים ואלכוהול, והערכה עצמית חיובית.</p>${tiles([["people","ערכי משפחה","ההורים רואים בהשכלה דרך להצלחה, והילדים רואים בהצלחה דרך לגמול להורים"],["building","קהילה אתנית","מבוגרים בקהילה מעודדים ומפקחים יחד"],["x","עדיין קשיים","שפה, בידוד, דעות קדומות ומתח בין ערכי הבית לתרבות החדשה. ההסתגלות משתנה לפי מוצא ומשאבים"]])}`,q:"q37"}
 ]},
 {id:"t7",icon:"flask",title:"מערכי מחקר כלליים",blocks:[
  {h:"המערך המתאמי",html:`${def("על מה הנושא",`אחרי שאוספים מידע, צריך תוכנית מחקר. שני מערכים עיקריים: אחד מראה קשר, והשני מראה סיבה ותוצאה.<br><b>מה נלמד כאן:</b> מערך מתאמי · מקדם מתאם · מערך ניסויי · ניסויי שדה וטבעיים`)}${def("מושג מפתח",`<mark>מערך מתאמי</mark> ${E("Correlational design")}: אוספים מידע בלי לשנות את חוויות הנחקרים, ובודקים קשרים בין מאפיינים להתנהגות.`)}${rem("<b>המגבלה:</b> אי אפשר להסיק <b>סיבה ותוצאה</b>. אם הורות קשורה לאינטליגנציה, ייתכן שההורות משפיעה, שהילד החכם מעורר הורות חיובית, או ש<b>משתנה שלישי</b> (כמו רעש בבית) משפיע על שניהם.")}${ex(`חוקרים מוצאים שילדים שקוראים להם יותר סיפורים יודעים יותר מילים. זה קשר, אבל אולי הורים שקוראים יותר גם מדברים יותר. לכן אי אפשר לדעת מה הסיבה.`)}`,q:"q39"},
  {h:"מקדם המתאם",html:`${def("מושג מפתח",`<mark>מקדם מתאם</mark> ${E("Correlation coefficient")}: מספר בין 1- ל-1+. <b>הגודל</b> מבטא את עוצמת הקשר, ו<b>הסימן</b> את הכיוון.`)}${fig("corr")}${ex("מתאם של 0.55+ בין דיבור האם לאוצר המילים של הפעוט: מתון וחיובי. מתאם של 0.42- בין דיבור חריף של אימהות לציות: ככל שהאם חריפה יותר, הילדה מצייתת פחות. ו-0.52+ ו-0.52- חזקים <b>באותה מידה</b>.")}`,q:"q41"},
  {h:"המערך הניסויי",html:`${def("מושג מפתח",`<mark>מערך ניסויי</mark> ${E("Experimental design")}: מאפשר להסיק <b>סיבה ותוצאה</b>. החוקר עושה מניפולציה ב<mark>משתנה בלתי תלוי</mark> (הסיבה) ובודק את ההשפעה על <mark>משתנה תלוי</mark> (התוצאה).`)}${ex("ילדים צפו במבוגרים שמתווכחים. בתנאי \"כעס פתור\" המבוגרים התנצלו והתפשרו. כשצפו בסכסוך נוסף, 42% מהם הראו ירידה במצוקה, לעומת 10% בתנאי \"כעס לא פתור\".")}${tiles([["cycle","הקצאה מקרית","כמו הגרלה, כדי שמאפייני הנחקרים יתחלקו שווה בין התנאים"],["scales","התאמה","מודדים מראש מאפיין חשוב ומחלקים שווה בין הקבוצות"]])}<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>מערך מתאמי</th><th>מערך ניסויי</th></tr></thead><tbody><tr><td><b>מה החוקר עושה</b></td><td>רק מודד, לא משנה כלום</td><td>משנה משתנה אחד (בלתי תלוי)</td></tr><tr><td><b>חלוקה לקבוצות</b></td><td>אין</td><td>אקראית</td></tr><tr><td><b>מה אפשר להסיק</b></td><td>יש קשר</td><td>סיבה ותוצאה</td></tr></tbody></table></div>`,q:"q43"},
  {h:"ניסויי שדה וניסויים טבעיים",html:`${tiles([["building","ניסוי שדה","הקצאה מקרית בסביבה טבעית. למשל ביקורי בית עם יועצת להורים: ההורות השתפרה, וזה ניבא פחות בעיות התנהגות"],["copies","ניסוי טבעי (דמוי ניסוי)","משווים קבוצות שכבר קיימות (בתי ספר, משפחות), שנבחרו כדי להיות דומות. <b>בלי הקצאה מקרית</b>, ולכן פחות מדויק"]])}`,q:"q45"}
 ]},
 {id:"t8",icon:"clock",title:"מערכים התפתחותיים ואתיקה",blocks:[
  {h:"מחקר אורך",html:`${def("על מה הנושא",`כדי לחקור <b>שינוי</b> לאורך הגיל צריך מערכים מיוחדים. כל אחד חוסך משהו ומשלם על זה במשהו אחר. בסוף: איך שומרים על הילדים במחקר.<br><b>מה נלמד כאן:</b> מחקר אורך · מחקר רוחב · מחקר משלב · מיקרו־גנטי · אתיקה`)}${def("מושג מפתח",`<mark>מחקר אורך</mark> ${E("Longitudinal design")}: חוקרים את אותם נחקרים שוב ושוב לאורך זמן.`)}${ex("במחקר הייעוץ בברקלי (מ-1928): ילדים מתפרצים וביישנים נשארו כך במידה מתונה, בגלל \"אפקט כדור השלג\": הם עוררו תגובות של כעס או התעלמות שחיזקו את הנטייה. גברים מתפרצים התקשו בעבודה. גברים ביישנים התחתנו מאוחר יותר. נשים ביישניות אז לא הראו בעיות, כי זה היה מקובל.")}${tiles([["x","דגימה מוטית","מי שמתנדב למחקר ארוך שונה מהאחרים"],["x","נשירה סלקטיבית","מי שנשאר שונה ממי שעזב"],["x","השפעות תרגול","לומדים להיבחן"],["x","אפקט עוקבה","השפעת התקופה ההיסטורית. היום ביישנות קשורה להסתגלות נמוכה גם אצל נשים"]])}`,q:"q47"},
  {h:"רוחב, משלב ומיקרו־גנטי",html:`${def("מחקר רוחב",`<mark>מחקר רוחב</mark> ${E("Cross-sectional design")}: קבוצות בגילים שונים נבדקות <b>באותו זמן</b>. למשל, יחסי אחאים נעשו שוויוניים יותר ופחות קרובים בגיל ההתבגרות. אבל אין מידע על השינוי <b>ברמת הפרט</b>.`)}${fig("seq","מערך משלב: כל עוקבה במעקב של 3 שנים מכסה 5 שנות התפתחות")}${def("מערך מיקרו־גנטי",`<mark>מערך מיקרו־גנטי</mark> ${E("Microgenetic design")}: מציגים מטלה חדשה ועוקבים אחרי הרכישה שלה במפגשים צפופים. רואים את השינוי <b>בזמן שהוא קורה</b>.`)}${designTable}${ex(`<b>רוחב</b>: באותו יום בודקים ילדים בני 5, 8 ו־11. <b>מיקרו־גנטי</b>: נותנים לילדה פאזל חדש ועוקבים אחריה כל יום במשך שבועיים, כדי לראות בדיוק איך היא לומדת.`)}`,q:"q49"},
  {h:"אתיקה במחקר על ילדים",html:`<p>ילדים פגיעים יותר ומתקשים להבין מה פירוש ההשתתפות. זכויותיהם:</p>${tiles([["lock","הגנה מפגיעה","גופנית ונפשית. בספק, להתייעץ או לוותר"],["doc","הסכמה מדעת","של ההורים ושל הילד. מגיל 7 בערך, גם הסכמת הילד. אפשר לפרוש בכל רגע"],["id","פרטיות","הסתרת הזהות"],["check","מידע וטיפול","לקבל את התוצאות, ולקבוצת הביקורת טיפול מועיל בסוף"]])}${def("הטעיה ושיחת הבהרה",`<b>ועדות סקירה מוסדיות</b> (IRB) מאזנות בין מחיר לתועלת. כשיש הטעיה, עורכים <mark>שיחת הבהרה</mark> ${E("Debriefing")}, אבל ילדים קטנים עלולים לא להבין ולאבד אמון במבוגרים. לכן הטעיה מותרת רק כשהסכנה מינימלית.`)}`,q:"q51"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"חוקרת בודקת איך זיכרון משתנה מגיל 70 עד 90. לאיזה תחום שייך המחקר?","a":"מדע ההתפתחות, ולא התפתחות הילד","w":["התפתחות הילד, כי מדובר בשינוי","התפתחות הילד, כי מדובר בזיכרון","אף אחד מהם, כי זה מחקר רפואי"],"e":"התפתחות הילד עוסקת בתקופה מההתעברות ועד גיל ההתבגרות, ולכן מחקר על גילאי 70 עד 90 שייך למדע ההתפתחות, שעוסק בכל מהלך החיים. העובדה שמדובר בשינוי לא הופכת אותו להתפתחות הילד."},{"q":"מה חוקר תחום התפתחות הילד?","a":"את הקבוע והמשתנה מההתעברות ועד ההתבגרות","w":["רק את מה שמשתנה מלידה ועד גיל שנתיים","רק את מה שקבוע לאורך כל החיים","את השינויים מהבגרות ועד הזקנה"],"e":"התפתחות הילד חוקרת גם את מה שקבוע וגם את מה שמשתנה, מההתעברות ועד ההתבגרות. הוא לא עוסק רק בשינוי, ולא רק בשנתיים הראשונות."}]},
"q2":{"t":"t1","v":[{"q":"מה, חוץ מסקרנות מדעית, הניע את המחקר בתחום?","a":"לחצים חברתיים לשפר את חיי הילדים","w":["דרישה של חברות מסחריות למוצרים","תחרות בין מדינות על הישגים","רצון להוכיח שילדים זהים למבוגרים"],"e":"לצד הסקרנות המדעית, לחצים חברתיים לשפר את חיי הילדים הניעו את המחקר, ולכן הוא נועד גם ליישום. זה לא נבע מדרישה של חברות מסחריות."},{"q":"למה התחום נחשב בין־תחומי?","a":"חוקרים ממדעים שונים ואנשי מקצוע עובדים בו יחד","w":["כי הוא נלמד רק בפקולטות לרפואה ולסיעוד","כי הוא לא נשען על מחקר אמפירי מסודר","כי הוא עוסק רק בילדים עם קשיים מיוחדים"],"e":"בתחום עובדים יחד חוקרים ממדעים שונים (פסיכולוגיה, סוציולוגיה, ביולוגיה, חינוך) ואנשי מקצוע, ולכן הוא בין־תחומי. הוא דווקא נשען על מחקר אמפירי."}]},
"q3":{"t":"t1","v":[{"q":"תינוק מתחיל ללכת, וכך פוגש יותר אנשים ומדבר יותר. מה זה מדגים?","a":"שתחומי ההתפתחות משפיעים זה על זה","w":["שהתחום הגופני חשוב יותר מהאחרים","שהתפתחות קוגניטיבית מתחילה בהליכה","שכל תחום מתפתח בנפרד"],"e":"הליכה (גופני) מובילה לפגישה עם יותר אנשים (חברתי) ולדיבור (קוגניטיבי), כלומר תחומי ההתפתחות משפיעים זה על זה. הם לא מתפתחים בנפרד."},{"q":"מהם שלושת תחומי ההתפתחות?","a":"גופני, קוגניטיבי וחברתי","w":["גופני, מוסרי ולימודי","שפתי, מוטורי ורגשי","גנטי, סביבתי ותרבותי"],"e":"שלושת תחומי ההתפתחות הם גופני, קוגניטיבי ורגשי־חברתי, והם משפיעים זה על זה. מוסר ולימודים אינם תחומים נפרדים בחלוקה הזו."}]},
"q4":{"t":"t1","v":[{"q":"ילדה בת 9 לומדת להבין שחברה יכולה להרגיש עצובה גם כשהיא מחייכת. לאיזה תחום זה שייך?","a":"רגשי־חברתי","w":["קוגניטיבי","גופני","מוטורי"],"e":"הבנה של רגשות של אחרים, כמו עצב מאחורי חיוך, שייכת לתחום הרגשי־חברתי. זו לא רק חשיבה מופשטת, ולכן היא לא בתחום הקוגניטיבי."},{"q":"זיכרון, קשב ושפה שייכים לתחום:","a":"הקוגניטיבי","w":["הרגשי־חברתי","הגופני","המוסרי"],"e":"זיכרון, קשב ושפה הם יכולות חשיבה, ולכן שייכים לתחום הקוגניטיבי. הבנת רגשות שייכת לתחום הרגשי־חברתי."}]},
"q5":{"t":"t1","v":[{"q":"באיזו תקופה השינויים בהתפתחות מהירים ביותר?","a":"בתקופה שלפני הלידה","w":["בינקות ובפעוטות","בגיל ההתבגרות","בילדות המאוחרת"],"e":"השינויים המהירים ביותר קורים בתקופה שלפני הלידה: מתא אחד לתינוק שלם. גם בינקות השינויים מהירים, אבל לא כמו לפני הלידה."},{"q":"מה טווח הגילים של ״הילדות״ (middle childhood)?","a":"6 עד 11","w":["2 עד 6","11 עד 18","0 עד 2"],"e":"״הילדות״ (middle childhood) היא גילאי 6 עד 11, שנות בית הספר היסודי. גילאי 2 עד 6 הם ילדות מוקדמת."}]},
"q6":{"t":"t1","v":[{"q":"סטודנט בן 24 גר עם הוריו, מחליף מקצועות ולא מרגיש מבוגר. איך נקראת התקופה שלו?","a":"בגרות בהתהוות","w":["גיל ההתבגרות","ילדות מאוחרת","בגרות מוקדמת מלאה"],"e":"מגיל 18 ועד אמצע או סוף שנות ה-20 צעירים רבים עוד לא מרגישים מבוגרים: גרים עם ההורים ומחפשים כיוון. זו בגרות בהתהוות. גיל ההתבגרות מסתיים בסביבות 18."},{"q":"באיזו תקופה משחקי דמיון מגיעים לשיאם?","a":"ילדות מוקדמת (2–6)","w":["ינקות (0 עד 2)","ילדות (6 עד 11)","גיל ההתבגרות (11–18)"],"e":"משחקי דמיון, משחק ״בכאילו״, מגיעים לשיאם בילדות המוקדמת (2 עד 6). בגיל בית הספר המשחק נעשה מאורגן יותר, עם כללים."}]},
"q7":{"t":"t2","v":[{"q":"סבתא אומרת: ״ילדים צריכים להיות קשוחים, אז לא מחבקים.״ למה זו לא תיאוריה מדעית?","a":"כי היא לא נבדקה באימות מדעי","w":["כי היא לא עוסקת בילדים","כי היא קצרה מדי","כי היא לא מנבאת דבר"],"e":"תיאוריה מדעית תלויה באימות במחקר, ואמונה של סבתא לא נבדקה כך. היא דווקא מנבאת משהו (ילד קשוח), ולכן זה לא מה שפוסל אותה."},{"q":"מה תיאוריה עושה?","a":"מתארת, מסבירה ומנבאת","w":["רק מתארת את ההתנהגות","רק מנבאת את ההתנהגות","קובעת חוקים להורים"],"e":"תיאוריה היא מערכת מסודרת של היגדים שמתארת, מסבירה ומנבאת התנהגות. היא לא רק מתארת, ולא קובעת חוקים להורים."}]},
"q8":{"t":"t2","v":[{"q":"למה יש בתחום תיאוריות רבות ושונות?","a":"כי ילדים מורכבים, ואין תיאוריה אחת לכל דבר","w":["כי החוקרים לא מסכימים על שום דבר","כי כל מדינה מפתחת תיאוריה משלה","כי התיאוריות הישנות הוכחו כשגויות"],"e":"ילדים מורכבים, ואין תיאוריה אחת שמסבירה הכל, ולכן כל תיאוריה מאירה היבט אחר. זה לא בגלל שהחוקרים לא מסכימים על שום דבר."},{"q":"למה תיאוריות חשובות?","a":"הן נותנות משמעות לתצפיות ובסיס ליישום","w":["הן מחליפות את הצורך במחקר","הן תמיד נכונות לכל הילדים","הן קובעות מה הורים חייבים לעשות"],"e":"תיאוריות נותנות משמעות לתצפיות, כי הן מארגנות אותן, ומשמשות בסיס ליישום. הן לא מחליפות את המחקר, ולא נכונות לכל הילדים תמיד."}]},
"q9":{"t":"t2","v":[{"q":"חוקר טוען שילד בן 4 חושב כמו מבוגר, רק עם פחות ידע. איזו עמדה זו?","a":"רציפה","w":["בלתי רציפה","מסלולים מרובים","יציבות"],"e":"הטענה שילד חושב כמו מבוגר, רק עם פחות ידע, היא עמדה רציפה: ההבדל בכמות ולא באיכות. בעמדה בלתי רציפה החשיבה של הילד שונה באיכותה."},{"q":"מהם ״שלבים״ בתיאוריה התפתחותית?","a":"שינויים איכותיים שמאפיינים תקופות","w":["תוספת הדרגתית של אותה מיומנות","הבדלים בין תרבויות","מבחנים שקובעים את רמת הילד"],"e":"שלבים הם שינויים איכותיים שמאפיינים תקופות, שינוי באופן החשיבה. תוספת הדרגתית של אותה מיומנות היא דווקא תפיסה רציפה."}]},
"q10":{"t":"t2","v":[{"q":"לפי תיאוריות השלבים, איך מתרחש השינוי?","a":"קפיצה בין שלבים ואז יציבות","w":["בהדרגה ובקצב קבוע לאורך זמן","באקראי, בלי סדר או דפוס","רק בגיל ההתבגרות ולא לפני"],"e":"לפי תיאוריות השלבים, השינוי קורה בקפיצה משלב לשלב, ואחריה יש תקופה של יציבות, כמו מדרגות. הוא לא קורה בהדרגה ובקצב קבוע."},{"q":"אם שואלת אם פעוטה שמשחקת ״בכאילו״ חושבת כמוה. איזו סוגיה היא מעלה?","a":"רציפה או בלתי רציפה","w":["תורשה או סביבה","יציבות או גמישות","מסלול אחד או רבים"],"e":"השאלה אם הפעוטה חושבת כמו מבוגרת, או חושבת באופן שונה באיכותו, היא סוגיית רציפות מול אי־רציפות. היא לא עוסקת בתורשה."}]},
"q11":{"t":"t2","v":[{"q":"שני ילדים עם אותה אישיות גדלים בכפר ובעיר, ומתפתחים אחרת. איזה מושג מסביר זאת?","a":"הקשרים שונים, מסלולים שונים","w":["תורשה זהה מובילה לתוצאה זהה","שלבים אוניברסליים לכל הילדים","יציבות של תכונות לאורך החיים"],"e":"אותה אישיות, הקשרים שונים (כפר ועיר), מסלולי התפתחות שונים: נסיבות אישיות וסביבתיות מובילות למסלולים שונים. זה לא תומך בשלבים אוניברסליים."},{"q":"מה עומד במרכז מחלוקת תורשה–סביבה?","a":"האם גנים או סביבה משפיעים יותר","w":["האם ההתפתחות רציפה או לא","האם תכונות יציבות לאורך זמן","האם יש מסלול אחד לכל הילדים"],"e":"מחלוקת תורשה–סביבה (nature–nurture) עוסקת בשאלה אם הגנים או הסביבה משפיעים יותר. השאלה על רציפות היא סוגיה אחרת."}]},
"q12":{"t":"t2","v":[{"q":"חוקר טוען שילד ביישן בגיל 3 יהיה ביישן גם בגיל 30. איזו עמדה זו?","a":"יציבות","w":["גמישות","אי־רציפות","הקשרים מרובים"],"e":"הטענה שמי שביישן בגיל 3 יהיה ביישן גם בגיל 30 היא עמדת היציבות: מי שגבוה בתכונה יישאר כך. גמישות היא ההפך: אפשר להשתנות."},{"q":"מהי גמישות (plasticity)?","a":"היכולת להשתנות בעקבות חוויות","w":["היכולת לזכור חוויות מוקדמות","היכולת לעבור בין שלבים מהר","היכולת לרשת תכונות מההורים"],"e":"גמישות היא היכולת להשתנות בעקבות חוויות, לאורך כל החיים. היא לא היכולת לזכור חוויות מוקדמות."}]},
"q13":{"t":"t2","v":[{"q":"יועצת בונה תכנית לנוער בסיכון לנשירה. מה עמדתה בסוגיית יציבות מול גמישות?","a":"גמישות","w":["יציבות","רציפות","תורשה"],"e":"תכנית לנוער בסיכון מניחה שאפשר לשנות גם בגיל ההתבגרות, ולכן היועצת מחזיקה בעמדת הגמישות. עמדת היציבות הייתה מניחה שכבר מאוחר מדי."},{"q":"מי שמאמין שחוויות מוקדמות קובעות הכול, מה צפוי לעשות?","a":"להתערב כמה שיותר מוקדם","w":["לחכות לגיל ההתבגרות","להתמקד רק בגנטיקה","לא להתערב בכלל"],"e":"מי שמאמין שחוויות מוקדמות קובעות הכל יתערב כמה שיותר מוקדם, כי לדעתו אחר כך יהיה קשה לשנות. הוא לא יחכה לגיל ההתבגרות."}]},
"q14":{"t":"t2","v":[{"q":"מהי ״נקודת המבט המאוזנת״ של רוב החוקרים היום?","a":"שתי הגישות נכונות בחלקן","w":["ההתפתחות רציפה בלבד, בלי שלבים","הסביבה קובעת כמעט את הכול","התורשה קובעת כמעט את הכול"],"e":"רוב החוקרים היום מחזיקים בעמדה מאוזנת: לשתי הגישות יש צדק חלקי, והעמדות הקיצוניות התמתנו. הם לא טוענים שהסביבה קובעת את הכל."},{"q":"מה נכון לגבי השפעת חוויות מוקדמות ומאוחרות, לפי הספר?","a":"משתנה מתחום לתחום ומאדם לאדם","w":["מוקדמות חשובות תמיד יותר","מאוחרות חשובות תמיד יותר","לשתיהן אין השפעה מוכחת"],"e":"לפי הספר, ההשפעה של חוויות מוקדמות ומאוחרות משתנה מתחום לתחום ומאדם לאדם, ואין תשובה אחת. מוקדמות לא תמיד חשובות יותר."}]},
"q15":{"t":"t3","v":[{"q":"ילדה שגדלה בעוני ובאלימות מצליחה בלימודים ובונה חיים יציבים. מה היא מדגימה?","a":"חוסן","w":["גמישות מוחית","יציבות","אפקט עוקבה"],"e":"הסתגלות טובה למרות גורמי סיכון קשים, כמו עוני ואלימות, היא חוסן. גמישות מוחית היא יכולת של המוח להשתנות, ולא הצלחה מול סיכון."},{"q":"מה היה ההבדל בין ג׳ון לגרי בגיל 30?","a":"ג׳ון היה בכלא ומכור, וגרי הקים משפחה","w":["שניהם הצליחו באותה מידה בחיים","גרי היה בכלא, וג׳ון הקים משפחה","שניהם התקשו באותה מידה בחיים"],"e":"בגיל 30 ג׳ון היה בכלא ומכור, וגרי הקים משפחה, למרות שגדלו עם אותם גורמי סיכון. זו דוגמה לכך שאותם גורמים יכולים להוביל לתוצאות שונות."}]},
"q16":{"t":"t3","v":[{"q":"איזה מהבאים אינו גורם סיכון?","a":"קשר חם עם סבא","w":["עוני","סכסוך בין ההורים","מעברי דירה רבים"],"e":"קשר חם עם סבא הוא גורם הגנה, לא גורם סיכון. עוני, סכסוך בין ההורים ומעברי דירה רבים הם גורמי סיכון."},{"q":"מאיזה סוג מחקרים נלקחה ההשראה לחקר החוסן?","a":"מחקרי אורך על עקה","w":["ניסויי מעבדה קצרים","סקרים בנקודת זמן אחת","מחקרים על בעלי חיים"],"e":"ההשראה לחקר החוסן הגיעה ממחקרי אורך על עקה, שעקבו אחרי ילדים לאורך שנים. סקרים בנקודת זמן אחת לא יכולים להראות התפתחות."}]},
"q17":{"t":"t3","v":[{"q":"נער בסיכון מוצא מאמן כדורגל שמאמין בו ומלווה אותו. איזה גורם הגנה זה?","a":"תמיכה חברתית מחוץ למשפחה","w":["מאפיינים אישיים של הילד","קשר חם עם הורה","הזדמנויות בקהילה בלבד"],"e":"מאמן שמאמין בנער ומלווה אותו הוא תמיכה חברתית מחוץ למשפחה, אחד מארבעת גורמי ההגנה. קשר חם עם הורה היה תמיכה מתוך המשפחה."},{"q":"איך הגיבו ג׳ון וגרי למעברי דירה?","a":"ג׳ון חרד, גרי שמח","w":["שניהם נעשו חרדים וכועסים","שניהם שמחו על חברים חדשים","גרי נעשה חרד, וג׳ון שמח"],"e":"ג׳ון הגיב למעברי הדירה בחרדה, וגרי שמח על הזדמנויות חדשות. כלומר, המזג השונה שלהם הגיב אחרת לאותו גורם. המסיח האחרון הופך ביניהם."}]},
"q18":{"t":"t3","v":[{"q":"מה צריכה התערבות לחיזוק חוסן לכלול?","a":"חיזוק הילד והפחתת סיכונים","w":["רק חיזוק של יכולות הילד","רק הפחתה של הסיכונים בסביבה","רק עבודה עם ההורים בבית"],"e":"התערבות לחיזוק חוסן צריכה לפעול בשני כיוונים: לחזק את הילד ולהפחית את הסיכונים בסביבה. התמקדות רק באחד מהם לא מספיקה."},{"q":"איך מחקר החוסן קשור למחלוקת תורשה–סביבה?","a":"הוא מראה שתורשה וסביבה פועלות יחד","w":["הוא מוכיח שהתורשה קובעת את הכול","הוא מוכיח שהסביבה קובעת את הכול","הוא לא קשור כלל למחלוקת הזו"],"e":"מחקר החוסן מראה שתורשה (מזג) וסביבה (תמיכה, סיכון) פועלות יחד בקשרים מורכבים. הוא לא מוכיח שאחת מהן קובעת הכל."}]},
"q19":{"t":"t4","v":[{"q":"ילדה לומדת לארוג ליד אמה, שמראה לה, מתקנת אותה ומשאירה לה יותר ויותר. איזו גישה מסבירה זאת?","a":"של ויגוצקי","w":["המערכות הדינמיות","הביהביוריזם","המערכות האקולוגיות"],"e":"למידה דרך אינטראקציה עם מבוגר מנוסה סביב מטלה של התרבות, עם עזרה שהולכת ופוחתת, היא הגישה של ויגוצקי. ביהביוריזם היה מתמקד בחיזוקים, לא באינטראקציה."},{"q":"מה הביקורת על ויגוצקי?","a":"הוא הזניח את הצד הביולוגי","w":["הוא התעלם מהתרבות ומהחברה","הוא התמקד רק בגנטיקה ובביולוגיה","הוא לא חקר ילדים בכלל"],"e":"הביקורת על ויגוצקי היא שהזניח את הצד הביולוגי, כי שם דגש על הסביבה החברתית והתרבותית. הוא לא התעלם מהתרבות, אלא בדיוק להפך."}]},
"q20":{"t":"t4","v":[{"q":"ילדים בברזיל שמוכרים ממתקים מפתחים מתמטיקה מתוחכמת. מה זה מדגים?","a":"כל תרבות מפתחת חוזקות ייחודיות","w":["שכל הילדים מתפתחים באותו קצב","שמתמטיקה היא כישרון מולד","שבית הספר מיותר"],"e":"ילדים שמוכרים ממתקים מפתחים מתמטיקה מתוחכמת דרך פעילות בתרבות שלהם, ולכן כל תרבות מפתחת חוזקות ייחודיות. זה לא אומר שבית הספר מיותר."},{"q":"לפי התיאורטיקנים בני זמננו, מה היחס בין היחיד לחברה?","a":"שניהם משפיעים זה על זה","w":["החברה חשובה יותר מהיחיד","היחיד חשוב יותר מהחברה","אין ביניהם קשר של ממש"],"e":"לפי התיאורטיקנים בני זמננו, היחיד והחברה משפיעים זה על זה, ביחס דו־כיווני. אף אחד מהם לא ״חשוב יותר״."}]},
"q21":{"t":"t4","v":[{"q":"למה ברונפנברנר קרא לגישה שלו ״ביואקולוגית״?","a":"כי גם נטיות ביולוגיות משתתפות בהתפתחות","w":["כי היא עוסקת רק בביולוגיה של הילד","כי היא נחקרה בעיקר על בעלי חיים","כי היא התעלמה מהסביבה של הילד"],"e":"ברונפנברנר הוסיף ״ביו״ לגישה האקולוגית, כי גם הנטיות הביולוגיות של הילד משתתפות בהתפתחות, לצד הסביבה. הוא לא התעלם מהסביבה."},{"q":"איך ברונפנברנר ראה את הסביבה?","a":"כמעגלים גדלים שקשורים זה לזה","w":["כגורם אחד ופשוט","כמשהו שלא משפיע על הילד","כקו ישר של שלבים"],"e":"ברונפנברנר ראה את הסביבה כמעגלים גדלים שקשורים זה לזה: מיקרו, מזו, אקסו, מאקרו וכרונו. היא לא גורם אחד ופשוט."}]},
"q22":{"t":"t4","v":[{"q":"תינוק עם מזג קשה גורם לאמו להיות פחות סבלנית, וזה מחמיר את הבכי. מה זה מדגים?","a":"יחסים דו־כיווניים","w":["השפעה של מערכת המאקרו","השפעה של צד שלישי","השפעה של מערכת הכרונו"],"e":"התינוק משפיע על האם, והתגובה שלה משפיעה עליו בחזרה. אלה יחסים דו־כיווניים במערכת המיקרו. המאקרו הוא רמת הערכים והחוקים, וזה לא מה שמתואר."},{"q":"מה תפקיד ״צד שלישי״ במערכת המיקרו?","a":"הוא משפיע על הקשר בין שניים","w":["הוא מחליף את אחד ההורים בבית","הוא שופט את ההתנהגות של הילד","הוא קובע את חוקי המדינה"],"e":"״צד שלישי״ הוא מי שמשפיע על הקשר בין שניים, למשל הורים שתומכים זה בזה ובכך משפרים את הקשר של כל אחד עם הילד. הוא לא מחליף הורה."}]},
"q23":{"t":"t4","v":[{"q":"מורה ואם נפגשים לתאם תכנית לילד. לאיזו מערכת שייך הקשר ביניהם?","a":"מזו","w":["מיקרו","אקסו","מאקרו"],"e":"מערכת המזו כוללת את הקשרים בין מסגרות המיקרו של הילד, כמו הקשר בין הבית לבית הספר. כל אחת מהמסגרות לבדה היא מיקרו."},{"q":"לחץ בעבודה של האב משפיע על הילד, למרות שהילד לא שם. לאיזו מערכת שייך מקום העבודה?","a":"אקסו","w":["מיקרו","מזו","כרונו"],"e":"מקום העבודה של האב הוא מסגרת שהילד לא חלק ממנה, ובכל זאת משפיעה עליו, ולכן הוא שייך למערכת האקסו. מזו היא קשר בין שתי מסגרות שהילד חלק מהן."}]},
"q24":{"t":"t4","v":[{"q":"חוק שמחייב חופשת לידה בשכר שייך למערכת:","a":"מאקרו","w":["אקסו","מזו","מיקרו"],"e":"חוק שמחייב חופשת לידה בשכר משקף ערכים וחוקים של החברה, ולכן שייך למערכת המאקרו. מקום העבודה עצמו הוא אקסו, אבל החוק הוא מאקרו."},{"q":"ילד שהוריו התגרשו כשהיה בן 3 מושפע אחרת מילד שהוריו התגרשו כשהיה בן 15. איזו מערכת זו?","a":"כרונו","w":["מאקרו","מזו","אקסו"],"e":"ההבדל בין גירושים בגיל 3 לגירושים בגיל 15 הוא ממד הזמן והעיתוי, וזו מערכת הכרונו. המאקרו עוסק בערכים ובחוקים, לא בתזמון."}]},
"q25":{"t":"t4","v":[{"q":"משפחה אוכלת יחד כל ערב, אבל הארוחות מלאות צעקות. מה הספר היה אומר?","a":"ארוחה כזו קשורה לקשיי הסתגלות","w":["כל ארוחה משפחתית מועילה, בכל מצב","הצעקות לא משנות כלום לילדים","זה עדיף על ארוחה שקטה ומרוחקת"],"e":"לפי הספר, האיכות של הארוחה חשובה, ולא רק התדירות. ארוחות מלאות צעקות קשורות לקשיי הסתגלות. לכן לא כל ארוחה משפחתית מועילה."},{"q":"במה קשורות ארוחות משפחתיות קבועות וחיוביות?","a":"בהישגים טובים ובפחות סיכון","w":["רק בבריאות גופנית טובה","רק במשקל תקין של הילד","בשום תוצאה מוכחת"],"e":"ארוחות משפחתיות קבועות וחיוביות קשורות להישגים טובים יותר ולפחות התנהגויות סיכון, כמו פחות סמים ואלכוהול, ולא רק לבריאות גופנית."}]},
"q26":{"t":"t4","v":[{"q":"איך מערכת האקסו יכולה ליצור כאוס במשפחה?","a":"נסיעות ארוכות ולחץ בעבודה פוגעים בשגרה","w":["חוקי המדינה משתנים מהר מדי","הילד עובר בית ספר באמצע שנה","המורים בכיתה מתחלפים הרבה"],"e":"נסיעות ארוכות ולחץ בעבודה של ההורים (אקסו) פוגעים בשגרה המשפחתית ויוצרים כאוס. הילד לא נמצא שם, אבל מושפע. חוקי המדינה שייכים למאקרו."},{"q":"מה עשה מעון יום אחד כדי לעזור למשפחות?","a":"הציע ארוחת ערב לקחת","w":["האריך את שעות הפעילות","ביטל את שכר הלימוד","הציע ייעוץ זוגי להורים"],"e":"המעון הציע ארוחת ערב לקחת הביתה, וכך הקטין את הכאוס המשפחתי. זו התערבות שמקלה על הורים עמוסים."}]},
"q27":{"t":"t5","v":[{"q":"תינוק מתחיל לזחול, ופתאום חוזר להתעורר בלילה ולחפש קרבה. איך הגישה הדינמית מסבירה זאת?","a":"שינוי בחלק אחד מארגן מחדש את הכול","w":["התינוק חוזר לשלב קודם לצמיתות","זו בעיה רפואית שדורשת טיפול מיוחד","זו השפעה ישירה של מערכת המאקרו"],"e":"לפי גישת המערכות הדינמיות, שינוי בחלק אחד, כמו זחילה, מערער את כל המערכת ומארגן אותה מחדש, ולכן מופיעים זמנית קשיים אחרים. זו לא נסיגה קבועה."},{"q":"איך גישת המערכות הדינמיות מציירת את ההתפתחות?","a":"כרשת מסתעפת","w":["כמדרגות קבועות","כקו ישר ופשוט","כמעגל סגור"],"e":"גישת המערכות הדינמיות מציירת את ההתפתחות כרשת מסתעפת, עם מסלולים מרובים. מדרגות קבועות הן הציור של תיאוריות השלבים."}]},
"q28":{"t":"t5","v":[{"q":"לפי מחקרי המערכות הדינמיות, מה קרה לתקשורת הורה–מתבגר?","a":"התערערה ואז התייצבה","w":["השתפרה בהדרגה ובקביעות","נפגעה לצמיתות ולא התאוששה","לא השתנתה כלל לאורך השנים"],"e":"תקשורת הורה–מתבגר התערערה בתחילת ההתבגרות, ואז התייצבה ברמה חדשה. זה ארגון מחדש של המערכת, ולא נזק קבוע."},{"q":"שני ילדים לומדים ללכת. לפי הגישה הדינמית, מה נכון?","a":"כל אחד מגיע לזה בדרכו הייחודית","w":["שניהם עוברים בדיוק אותם צעדים","אחד לומד ממוצא גנטי, השני מהסביבה","שניהם לומדים באותו גיל בדיוק"],"e":"לפי הגישה הדינמית, כל ילד מגיע לאותה מיומנות בדרך הייחודית שלו, לפי השילוב של הגוף, המטרות והסביבה שלו. הם לא עוברים בדיוק אותם צעדים."}]},
"q29":{"t":"t5","v":[{"q":"מה עמדת הגישה הפסיכואנליטית בסוגיית הרציפות?","a":"בלתי רציפה: שלבים","w":["רציפה: שינוי הדרגתי","שתיהן באותה מידה","לא מתייחסת לסוגיה"],"e":"הגישה הפסיכואנליטית מחזיקה בעמדה בלתי רציפה, עם שלבים פסיכו־סקסואליים (פרויד) או פסיכו־חברתיים (אריקסון). היא לא רואה בהתפתחות שינוי הדרגתי."},{"q":"מה עמדת הביהביוריזם בסוגיית תורשה–סביבה?","a":"דגש על הסביבה","w":["דגש על התורשה","שתיהן באותה מידה","לא מתייחס לסוגיה"],"e":"הביהביוריזם שם דגש על הסביבה: התנהגות נלמדת דרך התניה וחיקוי. הוא לא שם דגש על התורשה."}]},
"q30":{"t":"t5","v":[{"q":"סטודנטית משתמשת בפיאז׳ה להבין חשיבה, ובברונפנברנר להבין משפחה. איזו עמדה זו?","a":"אקלקטית","w":["רציפה","ביהביוריסטית","פסיכואנליטית"],"e":"שימוש בכמה תיאוריות, כל אחת להיבט אחר, הוא עמדה אקלקטית. רוב החוקרים היום עובדים כך, ולא נצמדים לתיאוריה אחת."},{"q":"מה עמדת המערכות הדינמיות לגבי חוויות מוקדמות ומאוחרות?","a":"שתיהן חשובות","w":["רק מוקדמות חשובות","רק מאוחרות חשובות","אף אחת לא חשובה"],"e":"לפי גישת המערכות הדינמיות, גם חוויות מוקדמות וגם חוויות מאוחרות חשובות, כי המערכת משתנה כל הזמן. אף אחת מהן לא קובעת לבד."}]},
"q31":{"t":"t6","v":[{"q":"חוקרת יושבת בגן ורושמת כמה פעמים ילדים חולקים צעצועים. מה החוזק של השיטה?","a":"רואים ישירות התנהגות יומיומית","w":["לכל ילד הזדמנות שווה להראות התנהגות","אפשר להסיק סיבה ותוצאה","הילדים לא יודעים שצופים בהם"],"e":"בתצפית נטורליסטית רואים ישירות איך ילדים מתנהגים ביומיום, בסביבה הטבעית שלהם. היא לא נותנת לכל ילד הזדמנות שווה, וזו המגבלה שלה."},{"q":"מה המגבלה של תצפית נטורליסטית?","a":"לא לכולם יש הזדמנות שווה","w":["היא לא מתאימה לילדים קטנים","היא יקרה מאוד לביצוע","היא מבוססת על דיווח עצמי"],"e":"בתצפית נטורליסטית לא לכולם יש הזדמנות שווה להראות את ההתנהגות, כי המצבים לא זהים. לכן משתמשים לפעמים בתצפית מובנית."}]},
"q32":{"t":"t6","v":[{"q":"למה במחקר הבובה שהרגל שלה נשרה השתמשו בתצפית מובנית?","a":"כדי שכל הילדים יעמדו באותו מצב","w":["כדי שהילדים לא ידעו שצופים","כדי לחסוך בזמן","כדי לבדוק את ההורים"],"e":"בתצפית מובנית החוקר יוצר את אותו מצב (בובה שהרגל שלה נשרה) לכל הילדים, וכך לכל אחד יש הזדמנות שווה להראות תגובה. המטרה לא הייתה להסתיר את הצפייה."},{"q":"מה גילה מחקר הבריונות עם מצלמות ומיקרופונים?","a":"בריונות שכיחה, ומורים התערבו רק לעתים","w":["בריונות נדירה מאוד","מורים התערבו כמעט תמיד","בריונות קורה רק מחוץ לבית הספר"],"e":"מחקר הבריונות מצא שבריונות שכיחה בבית הספר, ושמורים התערבו בה רק לעתים רחוקות. הוא נעשה בתצפית נטורליסטית."}]},
"q33":{"t":"t6","v":[{"q":"פיאז׳ה שואל ילד ״למה הירח זז?״ וממשיך לשאול לפי מה שהילד עונה. איזו שיטה זו?","a":"ריאיון קליני","w":["ריאיון מובנה","תצפית מובנית","שאלון"],"e":"שאלות גמישות, שמשתנות לפי מה שהילד עונה, הן ריאיון קליני. בריאיון מובנה שואלים את כולם אותן שאלות באותו סדר."},{"q":"מה המגבלה של הריאיון הקליני?","a":"קשה להשוות בין נחקרים","w":["הוא לא נותן מידע עשיר","הוא מתאים רק למבוגרים","הוא דורש מעבדה מיוחדת"],"e":"בריאיון קליני כל ילד נשאל שאלות אחרות, ולכן קשה להשוות בין נחקרים. בנוסף, דיווח של נחקרים לא תמיד מדויק. הוא דווקא נותן מידע עשיר."}]},
"q34":{"t":"t6","v":[{"q":"כשהורים קיבלו רשימה, 62% בחרו ״לחשוב בכוחות עצמם״, ובריאיון פתוח רק 5%. מה זה מדגים?","a":"החלופות משפיעות על התשובות","w":["ריאיון פתוח מדויק יותר תמיד","הורים משקרים בריאיון מובנה","אין הבדל אמיתי בין השיטות"],"e":"כשהחלופות הוצגו ברשימה, 62% בחרו בה, וכשהשאלה הייתה פתוחה רק 5% העלו אותה בעצמם. כלומר, החלופות משפיעות על התשובות. זה לא אומר שההורים משקרים."},{"q":"למה השיטה הקלינית (חקר מקרה) מתאימה לחקר ילדי פלא?","a":"כי הם קבוצה קטנה ומיוחדת","w":["כי הם לא משתפים פעולה","כי הם צריכים טיפול רגשי","כי הם כבר מבוגרים"],"e":"ילדי פלא הם קבוצה קטנה ומיוחדת, ואין מספיק מקרים לסקר, ולכן חוקרים אותם לעומק בחקר מקרה. זה לא בגלל שהם לא משתפים פעולה."}]},
"q35":{"t":"t6","v":[{"q":"חוקר חי שנה בכפר ומשתתף בחיי היומיום. מה המגבלה העיקרית?","a":"הטיה של החוקר, וקושי להכליל","w":["אין מידע עשיר","הילדים לא מתנהגים טבעי","אי אפשר לצפות בהתנהגות"],"e":"באתנוגרפיה החוקר משתתף בחיי היומיום, ולכן עלול להיות מוטה, וקשה להכליל ממנה. זו מגבלה משותפת לאתנוגרפיה ולחקר מקרה. השיטה דווקא נותנת מידע עשיר."},{"q":"מהי אתנוגרפיה?","a":"תצפית משתתפת בתרבות לאורך זמן","w":["שאלון ארוך לכל המשפחות","ניסוי במעבדה עם ילדים","ריאיון אחד עם מנהיג הקהילה"],"e":"אתנוגרפיה היא תצפית משתתפת בתרבות לאורך זמן, כדי להבין ערכים ותהליכים. היא לא שאלון ולא ניסוי."}]},
"q36":{"t":"t6","v":[{"q":"מה מצאו חוקרי ילדי פלא אצל חלק מהם?","a":"קרובי משפחה עם אוטיזם","w":["כולם גדלו בעוני קשה","כולם למדו בבתי ספר פרטיים","לאף אחד מהם לא היו אחים"],"e":"החוקרים מצאו שלחלק מילדי הפלא יש קרובי משפחה עם אוטיזם, ולכן ייתכן שיש תכונה גנטית משותפת. לא נמצא שכולם גדלו בעוני."},{"q":"לפי אתנוגרפיה, מה ההבדל בין הורים הינדים לנוצרים פונדמנטליסטים לגבי חברים דמיוניים?","a":"הינדים מעודדים, פונדמנטליסטים מרתיעים","w":["שניהם מעודדים","שניהם מרתיעים","הינדים מרתיעים, פונדמנטליסטים מעודדים"],"e":"הורים הינדים מעודדים חברים דמיוניים, כי הם קשורים לאמונה בגלגול נשמות, ונוצרים פונדמנטליסטים מרתיעים מהם. כך ערכי התרבות משפיעים. המסיח האחרון הופך ביניהם."}]},
"q37":{"t":"t6","v":[{"q":"מה נמצא לגבי נוער ממשפחות מהגרים בארה״ב?","a":"רבים מסתגלים היטב","w":["רובם נושרים מהלימודים","רובם מעורבים בפשיעה","הם מסתגלים פחות מכולם"],"e":"המחקר מצא שרבים מבני הנוער ממשפחות מהגרים בארה״ב מסתגלים היטב: מצליחים בלימודים ומעורבים פחות בהתנהגויות סיכון. הם לא מסתגלים פחות מכולם."},{"q":"מה תורם להצלחה של נוער מהגרים, חוץ מהכנסה?","a":"ערכי משפחה וקשר לקהילה האתנית","w":["ניתוק מהתרבות המקורית","הורים עם השכלה גבוהה בלבד","מגורים בשכונה עשירה"],"e":"מעבר להכנסה, ערכי משפחה חזקים וקשר לקהילה האתנית תורמים להצלחה שלהם. ניתוק מהתרבות המקורית דווקא לא עוזר."}]},
"q38":{"t":"t6","v":[{"q":"למה נוער מהגרים רואה בהצלחה בלימודים דבר חשוב במיוחד?","a":"כדרך לגמול להורים על הקשיים","w":["כי זה מה שהחוק דורש","כי הם רוצים לעזוב את המשפחה","כי זה מבטיח אזרחות"],"e":"נוער מהגרים רואה בהצלחה בלימודים דרך לגמול להורים על הקשיים שעברו, וזה ביטוי של מחויבות למשפחה. הם לא רוצים לעזוב את המשפחה."},{"q":"איזה קושי עדיין קיים אצל נוער מהגרים?","a":"שפה, בידוד ודעות קדומות","w":["ציונים נמוכים בכל המקצועות","חוסר עניין בלימודים","יחסים גרועים עם ההורים"],"e":"למרות ההצלחה, לנוער מהגרים עדיין יש קשיים: שפה, בידוד ודעות קדומות. היחסים עם ההורים לא תוארו כגרועים."}]},

"q40":{"t":"t7","v":[{"q":"נמצא קשר בין הורות חמה לאינטליגנציה. איזה הסבר הוא ״משתנה שלישי״?","a":"גורם בבית שמשפיע גם על ההורות וגם על האינטליגנציה","w":["הורות חמה מעלה אינטליגנציה","ילדים חכמים גורמים להורים להיות חמים","אין קשר בכלל"],"e":"״משתנה שלישי״ הוא גורם שמשפיע גם על ההורות וגם על האינטליגנציה, ולכן יוצר קשר ביניהן בלי שאחת גורמת לשנייה. ״ילדים חכמים גורמים להורים להיות חמים״ הוא הסבר של כיוון הפוך, לא של משתנה שלישי."},{"q":"למה חוקרים משתמשים במערך מתאמי למרות המגבלה?","a":"כי לפעמים אסור לתמרן","w":["כי הוא מוכיח סיבה ותוצאה","כי הוא תמיד זול יותר מניסוי","כי אין לו מגבלות בכלל"],"e":"לפעמים אסור לתמרן משתנה, כמו התעללות, ולכן חוקרים משתמשים במערך מתאמי למרות המגבלה. הוא לא מוכיח סיבה ותוצאה."}]},

"q43":{"t":"t7","v":[{"q":"במחקר, ילדים ראו מבוגרים שכועסים ואז משלימים או לא משלימים. מהו המשתנה הבלתי תלוי?","a":"איך הכעס מסתיים","w":["מצוקת הילדים","גיל הילדים","מספר המבוגרים"],"e":"המשתנה הבלתי תלוי הוא מה שהחוקר משנה, כאן האופן שבו הכעס מסתיים (פיוס או לא). מצוקת הילדים היא המשתנה התלוי, מה שנמדד."},{"q":"מה נמצא במחקר על כעס פתור?","a":"ילדים שראו פיוס נרגעו יותר","w":["לא נמצא הבדל בין הקבוצות","ילדים שראו כעס פתור נלחצו יותר","כל הילדים הגיבו באותה מצוקה"],"e":"ילדים שראו פיוס בסוף הכעס נרגעו יותר, וזו השפעה של המשתנה הבלתי תלוי. הם לא נלחצו יותר."}]},
"q44":{"t":"t7","v":[{"q":"למה משתמשים בהקצאה מקרית?","a":"כדי שמאפייני הנחקרים יתחלקו שווה","w":["כדי לחסוך בזמן","כדי לבחור את הנחקרים הטובים","כדי להגדיל את המדגם"],"e":"הקצאה מקרית מחלקת את הנחקרים לקבוצות באקראי, וכך המאפיינים שלהם מתחלקים שווה בין הקבוצות. זו שליטה במשתנים חלופיים. המטרה לא הייתה לחסוך זמן."},{"q":"מהי ״התאמה״ (matching) בניסוי?","a":"חלוקה שווה של מאפיין חשוב","w":["בחירה של נחקרים זהים","השוואה לנורמות קיימות","הקצאה לפי בקשת ההורים"],"e":"התאמה היא חלוקה שווה של מאפיין חשוב בין הקבוצות, למשל גיל או מין. היא משלימה את ההקצאה המקרית. היא לא בחירה של נחקרים זהים."}]},
"q45":{"t":"t7","v":[{"q":"חוקרים משווים ילדים שנולדו לפני ואחרי שנפתח מרכז קהילתי בעיר. איזה ניסוי זה?","a":"ניסוי טבעי","w":["ניסוי שדה","ניסוי מעבדה","מחקר מתאמי טהור"],"e":"החוקרים לא הקצו בעצמם, אלא השוו קבוצות שכבר נוצרו בגלל אירוע בעולם (פתיחת המרכז), ולכן זה ניסוי טבעי. בניסוי שדה יש הקצאה מקרית בסביבה טבעית."},{"q":"מה הראה ניסוי השדה עם ביקורי הבית?","a":"ההורות השתפרה, והבעיות ירדו","w":["ההתערבות לא השפיעה בכלל","ההתערבות דווקא הזיקה","רק ההורים השתנו, לא הילדים"],"e":"בניסוי השדה, עם הקצאה מקרית בסביבה טבעית, ביקורי הבית שיפרו את ההורות והפחיתו את בעיות הילדים. ההתערבות לא הזיקה."}]},
"q46":{"t":"t7","v":[{"q":"למה ניסויים טבעיים פחות מדויקים מניסויים אמיתיים?","a":"כי אין בהם הקצאה מקרית","w":["כי הם נעשים במעבדה","כי אין בהם השוואה","כי הם קצרים מדי"],"e":"בניסוי טבעי אין הקצאה מקרית, כי הקבוצות קיימות מראש, ולכן ייתכנו ביניהן הבדלים נוספים. הוא לא נערך במעבדה."},{"q":"מה החיסרון של ניסוי במעבדה?","a":"קשה להכליל לעולם","w":["אי אפשר להסיק סיבתיות","אין בו שליטה במשתנים","הוא תמיד לא אתי"],"e":"החיסרון של ניסוי במעבדה הוא שהתנאים מלאכותיים, ולכן קשה להכליל את הממצאים לעולם האמיתי. בניסוי מעבדה דווקא אפשר להסיק סיבתיות."}]},
"q47":{"t":"t8","v":[{"q":"חוקרים בודקים אותם 200 ילדים בגיל 5, 10 ו-15. איזה מערך זה?","a":"מחקר אורך","w":["מחקר רוחב","מערך משלב","מערך מיקרו־גנטי"],"e":"בדיקה של אותם נחקרים בגילים שונים לאורך זמן היא מחקר אורך. במחקר רוחב בודקים קבוצות שונות בגילים שונים, באותו זמן."},{"q":"ילד נוח לכעוס מעורר תגובות כועסות אצל אחרים, וזה מגביר את הכעס שלו. איך נקרא הדפוס?","a":"אפקט כדור השלג","w":["אפקט עוקבה","נשירה סלקטיבית","אפקט תרגול"],"e":"התנהגות שמעוררת תגובות מהסביבה, שמחזקות אותה עוד יותר, היא אפקט כדור השלג. זה נמצא במחקר הייעוץ בברקלי. אפקט עוקבה הוא השפעה של התקופה."}]},
"q48":{"t":"t8","v":[{"q":"במחקר אורך, ילדים ממשפחות במצוקה עוזבים יותר מהאחרים. איזו בעיה זו?","a":"נשירה סלקטיבית","w":["אפקט עוקבה","אפקט תרגול","הטיית החוקר"],"e":"כשמי שעוזב את המחקר שונה ממי שנשאר, כאן משפחות במצוקה, זו נשירה סלקטיבית, ומי שנשאר כבר לא מייצג את כולם. אפקט עוקבה הוא השפעה של התקופה ההיסטורית."},{"q":"מתבגרים שגדלו בתקופת מלחמה שונים מאלה שגדלו בתקופת שגשוג. מה זה?","a":"אפקט עוקבה","w":["נשירה סלקטיבית","אפקט כדור השלג","אפקט תרגול"],"e":"הבדלים בין דורות שגדלו בתקופות היסטוריות שונות, כמו מלחמה ושגשוג, הם אפקט עוקבה. נשירה סלקטיבית עוסקת במי שעוזב את המחקר."}]},

const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const pools=T.map(t=>shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar("מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div><div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
