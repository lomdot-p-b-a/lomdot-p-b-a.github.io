const T=[
 {id:"t1",icon:"phone",title:"מבוא: הורים מחוברים",blocks:[
  {h:"תקציר",html:`<p>הסקירה מתארת איך <b>הסחת הדעת</b> של הורים בגלל המכשיר הנייד, בזמן טיפול בילדים, משפיעה על הקשר הורה־ילד. נסקרה ספרות שפורסמה עד נובמבר 2016, ונמצאו <mark>27 מקורות</mark>.</p>${tiles([["phone","חיבור מתמיד","החיבור הקבוע והלחץ החברתי להגיב מהר מגבירים את השימוש והתלות בטלפון"],["x","פחות רגישות","הורים שמשתמשים בטלפון בזמן אינטראקציה פחות רגישים ומגיבים, במילים ובלי מילים"],["target","התנהגות מסוכנת","ילדים מנסים למשוך תשומת לב בהתנהגויות מסוכנות, אולי קשור לעלייה בפציעות"],["people","קונפליקט","הורים וילדים מודאגים מהשימוש, והוא תורם לקונפליקטים במשפחה"]])}`,q:"q1"},
  {h:"המכשירים בחיינו",html:`<p>הבעלות על מחשבים שולחניים, קוראים אלקטרוניים ונגני MP3 ירדה, אבל הבעלות על מכשירים ניידים ממשיכה לעלות בארה"ב:</p>${tiles([["phone","טלפון נייד","95% מהמבוגרים (53% בשנת 2000)"],["phone","סמארטפון","77% (35% בשנת 2011)"],["doc","טאבלט","51% (3% בשנת 2010)"]])}<p>סמארטפון וטאבלט משלבים טלפון עם <b>מחשב נייד</b> וגישה לאינטרנט. יש כבר מבוגרים "סמארטפון בלבד" (13% ב-2015). חיבור כזה מאפשר להיות <b>זמין כל הזמן</b>, וכך נוצרות אינספור הזדמנויות להסחה.</p>${def("מושג מפתח",`<mark>השערת ההחלפה</mark> ${E("Displacement hypothesis")}: הזמן שמבלים עם טכנולוגיה או מדיה עלול <b>לבוא על חשבון</b> קשרים משמעותיים בין הורה לילד ולהקטין אותם.`)}`,q:"q3"},
  {h:"למה זה חשוב להתפתחות",html:`<p>ידוע היטב שהתנהגות ההורה ואיכות האינטראקציה <b>מעצבות</b> את התפתחות הילד. אינטראקציה עם <b>רגישות והיענות</b> גבוהות מגבירה את הסיכוי שהתינוק יראה במטפל <mark>בסיס בטוח</mark> ויפתח היקשרות בטוחה (Ainsworth, 1979).</p>${rem("כמה מחקרים בסקירה מציעים שהשימוש במכשיר עלול לפגוע <b>בעקיפין</b> בהיקשרות ובהתפתחות, אבל <b>אין עדיין מחקרי אורך</b> שבדקו את החשש הזה.")}${def("מה למדנו מטלוויזיה",`השימוש של ילדים בטלוויזיה משקף את השימוש של ההורים. טלוויזיה ברקע מפחיתה תגובות של הורים ואת מספר המילים שנאמרות, וקשורה להתפתחות שפה פחות טובה. אבל <b>צפייה משותפת</b> של הורה וילד יכולה להגביר אינטראקציה ולתרום להתפתחות החברתית.`)}`,q:"q5"},
  {h:"שאלות הסקירה",html:`<p>רוב המחקר על הסחה מטלפונים עוסק ב<b>נהיגה</b> ובשימוש בטלפון במפגשים פנים אל פנים. בתקשורת היה הרבה עיסוק בהורים "מחוברים", ועכשיו גם המחקר מתחיל לבדוק את זה. הסקירה מוסיפה על סקירות קודמות שעסקו באינטרנט ובטכנולוגיה ישנה, לפני עידן הסמארטפון.</p>${rqTable}`,q:"q7"}
 ]},
 {id:"t2",icon:"flask",title:"השיטה",blocks:[
  {h:"איך חיפשו",html:`<p>החיפוש שילב מונחים על <b>הורים, ילדים, מכשירים ניידים ואינטראקציה</b> (למשל: היקשרות, הסחה, היענות, השגחה). חיפשו מאמרים באנגלית מינואר 2000 עד דצמבר 2016, במאגרים אקדמיים (Academic Search Complete, ProQuest, ScienceDirect, Web of Science) ובמנועי חיפוש כלליים (Google Scholar, Google).</p>${yn(["שימוש הורים במכשיר בזמן אינטראקציה","השגחה על ילדים","השלכות על הקשר הורה־ילד"],["שימוש של ילדים ומתבגרים במכשירים","מכשירים להסחת ילדים בטיפולים רפואיים","מעקב אחר מצב רפואי ותרופות"])}${rem("כי הנושא חדש והחיפוש מקיף, נכללו גם <b>הרצאות בכנסים, עבודות דוקטורט ועבודות מאסטר</b>.")}`,q:"q9"},
  {h:"מה נמצא",html:`${fig("flow","שלבי האיסוף וסוגי המקורות")}<p>מאמרים נבחרו לפי התקציר, ואם היו רלוונטיים נקרא הטקסט המלא. מתוך 27: 22 מארה"ב, 2 מכמה מדינות דוברות אנגלית, 1 מקנדה ו-1 מניו זילנד.</p>`,q:"q11"}
 ]},
 {id:"t3",icon:"clock",title:"RQ1: איך הורים משתמשים במכשיר",blocks:[
  {h:"מי משתמש וכמה",html:`<p>במשקי בית עם ילדים יש יותר טכנולוגיה ויותר מכשירים ניידים. הורים מורידים אפליקציות יותר מאשר מי שאינם הורים (48% מול 33%), ו-57% מהם מורידים אפליקציות <b>לילדים</b>. הורים משתמשים יותר ברשתות חברתיות. אבל ידוע מעט על השימוש <b>בנוכחות</b> הילדים.</p>${def("הגדרות",`<b>Radesky et al. (2014)</b>: רמת השימוש היא "המידה שבה מוקד הקשב והמעורבות של המטפל הוא המכשיר ולא הילד". <b>Blackman (2015)</b>: <mark>הסחת מסך הורית</mark> ${E("PSD")} היא רגעים שבהם ההורה מוסח מהתנהגויות של תפקיד ההורה בגלל מכשיר עם מסך. לא כולל פעילות משותפת מול מסך, או מסך שפשוט דולק ברקע.`)}`,q:"q13"},
  {h:"איפה וכמה זמן",html:`<p>"הורות מחוברת" נחקרה בארוחות, בהאכלת תינוקות ובמשחק, במקומות ציבוריים, ברכב, בחופשה ובבית. אבל מעט מחקרים מדדו ישירות כמה זמן ההורים מוסחים.</p>${tiles([["chart","35%","מהמבוגרים בארה\"ב משתמשים לעתים קרובות בטלפון בזמן משחק עם הילדים (Qualcomm, 2013)"],["clock","חצי שעה עד 7.5 שעות","ביום על המכשיר, מהן 0 עד 5 שעות ליד הילדים (Blackman, 2015)"],["phone","75%","מההורים משתמשים לפחות 3 פעמים ביום בזמן השגחה ישירה (Ante-Contreras, 2016)"]])}${rem("חלק מההורים לא חושבים שהשימוש פוגע ביכולת להשגיח. אחרים אומרים שליד הילדים הם משתמשים פחות, ואפילו מכבים את הטלפון או משאירים אותו בבית.")}`,q:"q15"},
  {h:"עבודה, משפחה וציפייה לזמינות",html:`<p>המכשיר מאפשר לנהל כמה תפקידים יחד: הורות, עבודה וחברה. זמינות מתמדת דרך מייל, הודעות ורשתות יצרה <b>ציפייה להגיב מיד</b>. משתמשים מדווחים על תלונות מעמיתים ומבני משפחה כשהם מגיבים לאט.</p>${def("מתח עבודה־משפחה",`הורים עובדים חוששים לפספס תוכן מהעבודה, ולכן המכשיר זמין גם בזמן משפחה. נוצר מאבק מתמיד על <b>איזון</b>: לרצות להיות זמינים לעבודה 24/7, וגם לרצות להיות <b>לא זמינים</b>, כלומר נוכחים, למשפחה.`)}`,q:"q17"},
  {h:"נהיגה",html:`${tiles([["phone","מעל 80%","מההורים דיווחו על שימוש בטלפון בנהיגה עם ילדים ברכב (Roney et al., 2013)"],["clock","ברמזור","עם ילדים ברכב גולשים ושולחים הודעות יותר כשעומדים ברמזור מאשר בנסיעה"],["people","גיל 2 עד 7","הסחות שקשורות לילד (לפתוח חטיף, להרים צעצוע) הכי שכיחות בגילים האלה (Macy et al., 2014)"]])}<p>השימוש ברכב עם ילדים <b>נמוך יותר</b> מאשר בנהיגה לבד או עם מבוגר, אבל הוא מסכן את הילדים ומשמש <b>מודל</b> לנהיגה לא בטוחה. הרצון לשמש דוגמה עשוי להפחית את השימוש ליד מתבגרים שמתקרבים לגיל נהיגה.</p>`,q:"q19"},
  {h:"גבולות וארוחות",html:`<p>הורים מנסים להציב גבולות לעצמם: זמנים בלי טלפון, לכבות מדי פעם, לבדוק רק כמה דחופה הודעה, או רק שימוש קצר. אחרים משתמשים רק לפעילות שמתאימה למקום, כמו צילום בגן השעשועים. ובכל זאת קשה להתנתק.</p>${def("ארוחות",`הכלל הנפוץ: <b>אין טלפונים ליד השולחן</b>. הורים וילדים מסכימים שהחשוב ביותר הוא שההורה <b>נוכח</b>. שימוש בארוחה נתפס כפחות מקובל כשיש ילדים צעירים. למרות זאת הורים עונים לטלפון, ומתבגרים נוזפים בהם על <b>הסטנדרט הכפול</b>.`)}${rem("טלפונים גם מאפשרים <b>הפסקה</b> מאינטראקציה. הורים משתמשים בהם כדי <b>להישאר מחוברים</b> לילדים המתבגרים, אבל כדי <b>להתנתק</b> מילדים צעירים ולהתחבר למבוגרים אחרים ברשתות.")}`,q:"q21"}
 ]},
 {id:"t4",icon:"scales",title:"RQ2: מה ההורים מרגישים",blocks:[
  {h:"מתחים ואשמה",html:`<p>העמדות של ההורים <b>מורכבות</b>: גם חיוביות וגם שליליות. בראיונות עם 35 הורים (Radesky et al., 2016) עלו שלושה מתחים:</p>${tiles([["brain","קוגניטיבי","מורכבות ועייפות מניהול תפקידים בעבודה, בבית ובחברה יחד עם המדיה"],["x","רגשי","קונפליקט במשפחה ואשמה על השימוש"],["people","הורה־ילד","הפרעה לזמן עם הילדים"]])}<p>הורים רבים מכירים בכך שהמכשיר מסיח, ודואגים שהם לא הורים טובים אם הם לא נוכחים לגמרי. אמהות דיווחו שהתראות מפריעות למשחק ומכבידות על <b>ההורות המשותפת</b> ${E("Coparenting")}.</p>${def("אשמה ושיפוטיות",`חלק מההורים מרגישים <b>אשמה</b> על כל שימוש ליד הילדים, אולי כי הורים אחרים או בני משפחה שופטים אותם. בגן השעשועים <b>27%</b> מההורים המוסחים הרגישו שהורים אחרים שופטים אותם.`)}`,q:"q23"},
  {h:"הצד החיובי",html:`${tiles([["check","65%","מההורים חושבים שהטלפון הופך אותם להורים טובים יותר (Qualcomm, 2013)"],["target","השגחה","מעקב אחרי הילדים ואחרי השימוש שלהם ברשתות"],["bulb","מידע ותמיכה","גישה למידע הורי, עצות ותמיכה"],["people","ניהול המשפחה","רשתות חברתיות שומרות על קשר ועוזרות לתכנן מפגשים משפחתיים"]])}${rem("אבל גם מידע הורי זמין ותקשורת רציפה עלולים להיות בעיה, אם הם <b>מפריעים לאינטראקציה</b> או מסכנים את בטיחות הילד.")}`,q:"q25"}
 ]},
 {id:"t5",icon:"people",title:"RQ3: איך הילדים מגיבים",blocks:[
  {h:"מתחרים בטלפון",html:`<p>ילדים <b>שמים לב</b> כשההורים מוסחים, ומתחרים במכשיר על תשומת הלב. בארוחות במסעדות מזון מהיר, ילדים צעירים הוטרדו בעיקר מ<b>בדיקות קצרות וחוזרות</b> ומ<b>שקיעה מתמשכת</b> במסך. ילדים גדולים יותר שעסקו במשהו אחר לא נראו מוטרדים.</p>${def("סימן מדאיג",`חלק מהילדים <b>לא ניסו בכלל</b> למשוך את תשומת הלב של ההורה כשההורה היה בטלפון כל הארוחה. זה עשוי להעיד על <mark>הרגלה</mark> לחוסר ההיענות של ההורה, וצריך לחקור את זה.`)}`,q:"q27"},
  {h:"הניסוי במגרש הבייסבול",html:`<p>Stupica (2016) בדקה ילדים בני 3 עד 12 שרצו סביב בסיס. ההורים התבקשו להיות <b>זמינים ומגיבים</b>, או <b>לא זמינים</b> (עסוקים בטלפון). כל ילד חווה את שני המצבים, בסדר מאוזן ואקראי.</p>${tiles([["check","הורה קשוב","הילדים רצו מהר יותר"],["x","הורה בטלפון","הילדים רצו לאט יותר ונטו יותר למעוד או ליפול"],["x","הורה קשוב אבל קשוח","גם תגובות קשות במקום תומכות הורידו את הביצוע"]])}`,q:"q29"},
  {h:"בטיחות",html:`<p>ידוע שילדים בלי השגחה עושים דברים <b>מסוכנים</b> כדי למשוך תשומת לב, והורים מוסחים פחות מזהירים אותם. במקומות ציבוריים ילדים זחלו מתחת לשולחנות או עמדו על כיסאות. ילדים <b>צעירים</b> בסיכון גבוה יותר.</p>${tiles([["chart","פציעות","העלייה בבעלות על טלפונים ו\"עיוורון הקשב\" של ההורים עשויים להיות קשורים לעלייה בפציעות של ילדים"],["clock","אמבטיה","הורים השאירו ילדים מתחת לגיל 5 לבד 1 עד 5 דקות באמבטיה כדי לענות לטלפון או לבשל (Simon et al., 2003)"],["leaf","חוף הים","רבע מההורים היו מוסחים, ומהם 27% בטלפון. ייתכן שזה קשור לעלייה בטביעות (Moran, 2010)"]])}${def("בגן השעשועים",`הורים הודו שהם שמים לב פחות לסביבה כשהם בטלפון. ובכל זאת היו בטוחים ביכולת שלהם להשגיח. כששאלו אותם מה הילד עושה עכשיו, הם נעשו <b>מתגוננים</b> או ענו תשובות כלליות (Hiniker et al., 2015).`)}`,q:"q31"}
 ]},
 {id:"t6",icon:"link",title:"RQ4: ההשפעה על הקשר הורה־ילד",blocks:[
  {h:"פחות תקשורת",html:`<p>כשההורים שקועים במכשיר, היכולת שלהם לשים לב לילד מוגבלת. Radesky et al. (2014) מצאו שאמהות מוסחות דיברו ותקשרו בלי מילים <b>פחות</b> עם ילדים בני 6 בזמן ארוחה.</p>${ex("ההפרעה הייתה הכי גדולה כשהוצג <b>מאכל חדש ולא מוכר</b>: הילדים קיבלו פחות עידוד מהאמהות המוסחות, וניסו את המאכל החדש פחות.")}`,q:"q33"},
  {h:"תגובות לילד",html:`<p>הורים מוסחים <b>איטיים יותר</b> להגיב לניסיונות של הילד לחזור לקשר, ו<b>פחות רגישים</b> בתגובה. חלק התעלמו בהתחלה ובסוף הגיבו.</p>${tiles([["check","לפעמים חיובית","יש תגובות חיוביות"],["x","נזיפה","לפעמים נזיפה, אולי בלי להרים את העיניים מהמסך"],["hand","פיזית","הורה שבעט ברגל של הילד מתחת לשולחן, ואם שדחפה ילד שהרים לה את הפנים מהמכשיר"]])}${def("חוסר תגובה",`יש הורים שלא הגיבו בכלל, וזה קרה גם אצל הורים שדיברו עם מבוגר אחר. יש שהעמידו פנים שהם עסוקים במכשיר כדי שבן הזוג יטפל בילד. מצד שני, אחרי הסחה יש הורים שנעשו <b>קשובים יותר</b>, אפילו יותר מלפני.`)}`,q:"q35"},
  {h:"תלוי מה עושים בטלפון",html:`<p>צריך לבדוק <b>איזו פעילות</b> ההורה עושה. Boles & Roberts (2008): ההורים הגיבו פחות בכל ההסחות, אבל היו <b>הכי פחות קשובים חזותית</b> מול המחשב, לעומת שיחת טלפון או טלוויזיה.</p>${rem("Radesky et al. (2014): הורים שרק <b>דיברו</b> בטלפון שמרו יותר על קשר עין עם הילד מהורים שהקלידו או גללו כל הזמן.")}`,q:"q37"},
  {h:"האכלת תינוקות",html:`<p>האכלה היא זמן של קשר עמוק בין אם לתינוק.</p>${tiles([["doc","Golen & Ventura (2015a)","אמהות הוסחו בעיקר מטלוויזיה, ורק 4% מהזמן משיחה בטלפון. אבל לא נבדקו הודעות, משחקים ורשתות"],["chart","Golen & Ventura (2015b)","יותר מ-75% מהזמן האמהות עשו משהו אחר (בעיקר שיחה עם אדם אחר או שינה). אמהות מוסחות היו פחות רגישות לסימני שובע, ולכן בסיכון להאכלת יתר, שקשורה להשמנת ילדים"]])}`,q:"q39"},
  {h:"המכשיר כמרגיע",html:`<p>הורים גם <b>נותנים</b> לילד מכשיר כדי להעסיק אותו (למשל בזמן הכנת ארוחה) או כדי להרגיע אותו. ילדים עם <b>קשיים רגשיים־חברתיים</b> מקבלים טלפון להרגעה יותר מילדים אחרים (ראיונות עם 144 הורים).</p>${rem("יש חשש לגבי היכולת של הילד להעסיק את עצמו ולפתח <b>ויסות עצמי</b>, אבל המחקר עוד לא בדק את זה. צריך מחקרי אורך על ההשפעה על ההתפתחות ועל ההיקשרות.")}`,q:"q41"},
  {h:"קונפליקט ו\"שרנטינג\"",html:`<p>המכשירים עלולים להקטין חוויות הוריות חיוביות. במשפחות רבות הטלפון הפך ל<b>מקור לקונפליקט</b>. הורים מתעצבנים כשהילדים שקועים בטלפון, וגם ילדים מתעצבנים על ההורים. ילדים נוזפים בהורים שמפרים את הכללים ומבקשים שיכבו את הטלפון.</p>${def("מושג מפתח",`<mark>שרנטינג</mark> ${E("Sharenting")}: הורים משתפים תמונות או סיפורים על הילדים ברשתות <b>בלי רשות</b> הילדים. מתבגרים כועסים ונבוכים, וזה עלול להוביל לקונפליקט. מצד שני, בזמן קונפליקט משפחתי יש ילדים שבורחים לרשתות החברתיות.`)}`,q:"q43"}
 ]},
 {id:"t7",icon:"bulb",title:"מסקנות ומחקר עתידי",blocks:[
  {h:"הנושאים המרכזיים",html:`${tiles([["phone","שקיעה במכשיר","רמת הקליטה של ההורה במכשיר"],["target","בטיחות","בטיחות הילדים כשההורים מוסחים"],["scales","עמדות סותרות","עמדות מעורבות של הורים לגבי השימוש"],["x","פחות היענות","ירידה בהיענות וברגישות להורה מוסח"]])}<p>גם עבודות לא אמפיריות תומכות במגמות האלה, אבל התוצאות האמפיריות מראות מגוון רחב של תגובות. השילוב של מכשירים בחיים מורכב, עם יתרונות וגם סיבוכים להורות.</p>`,q:"q45"},
  {h:"מה הילדים אומרים",html:`<p>כמעט לא נחקר מה <b>הילדים</b> מרגישים. סקרים לא אמפיריים מתחילים לבדוק את זה:</p>${fig("stats","מה ילדים והורים אומרים (סקרים לא אמפיריים)")}${rem("ילדים אמרו שישמחו אם ההורים <b>יאבדו את הטלפון</b>, כי אז ישימו לב אליהם. 28% מההורים הרגישו שהם לא מדגימים שימוש נכון. מתבגרים הרגישו <b>נפגעים</b>, אבל היססו לספר להורים.")}`,q:"q47"},
  {h:"פערים במחקר",html:`${tiles([["clock","מדידת זמן","רק 2 מתוך 27 מחקרים מדדו ישירות שימוש ליד הילדים, ובדיווח עצמי רטרוספקטיבי. אירוני, אבל אפליקציית מעקב הייתה מדויקת יותר. אפשר גם מניפולציה ניסויית"],["question","למה משתמשים","עבודה, אישי או משפחה? איזו פעילות מסיחה הכי הרבה? אילו גורמים של ההורה והילד משפיעים?"],["check","הצד החיובי","כמעט לא נבדק איך מכשירים יכולים לחזק קשר, ומה ההשפעה של שימוש או צפייה משותפים"]])}`,q:"q49"},
  {h:"הנחיות להורים",html:`<p>המטרה האולטימטיבית: הנחיות <b>מועילות ומציאותיות</b>. יש הנחיות לשימוש של ילדים (האקדמיה האמריקאית לרפואת ילדים), אבל כמעט אין להורים. ההמלצות: להימנע משימוש בארוחות ובמשחק, לצפות במדיה <b>יחד</b> עם הילדים, ותוכנית מדיה משפחתית.</p>${def("למה \"פשוט לכבות\" לא עובד",`התקשורת ממליצה לכבות את המכשיר, אבל בגלל המורכבות והאפשרות להתמכרות, זה <b>לא מציאותי</b>. המכשירים משולבים בעבודה, בבית ובפנאי. גם להניח את הטלפון על השולחן לא עוזר: נוכחות של טלפון, גם בלי שימוש, פוגעת בקרבה ובאיכות השיחה (Przybylski & Weinstein, 2013).`)}${rem("הנחיה ברורה אחת: <b>להגביל את השימוש ליד הילדים</b>. זה קשה להורים שעובדים מהבית, אבל הם עדיין נוכחים פיזית יותר. ובכל זאת ילדים עלולים לחוות אותם כ<b>לא זמינים רגשית</b>.")}`,q:"q51"},
  {h:"מגבלות",html:`${tiles([["x","חיפוש","ייתכן שפוספסו מאמרים בגלל מונחי החיפוש והמאגרים"],["clock","טכנולוגיה משתנה","כל אפליקציה ושדרוג יוצרים הזדמנויות חדשות, וקשה למחקר להתעדכן"],["people","הכללה","מדגמים קטנים, אין נתוני אורך, וחלק לא עברו ביקורת עמיתים"]])}${def("המסקנה",`צריך עוד מחקר על <b>איך</b> הורים משתמשים בטלפון ליד ילדים ועל ההשלכות לאיכות ולכמות האינטראקציה ולהתפתחות: לבדוק את השערת ההחלפה, עמדות ילדים, השפעה על היקשרות, השפעת השימוש של ההורים על השימוש של הילדים, ומדד אחיד לשימוש.`)}`,q:"q53"}
 ]}
];

 {q:"מה מצא Lauricella et al. (2015) לגבי זמן המסך של ילדים?",a:"הוא קשור לגיל הילד, לעמדות ההורים כלפי טכנולוגיה ולזמן המסך של ההורים",w:["הוא לא קשור להורים","הוא קשור רק לבית הספר","הוא קבוע בכל הגילים"],e:"ולכן צריך לחקור גורמים של ההורה והילד."}]},
q51:{t:"t7",v:[
 {q:"למה ההמלצה \"פשוט לכבות את הטלפון\" לא מציאותית לפי הסקירה?",a:"כי המכשירים משולבים בעבודה, בבית ובפנאי, ויש אפשרות להתמכרות",w:["כי אין לזה השפעה","כי ילדים מבקשים שלא","כי זה אסור"],e:"הנחיות צריכות להכיר בתועלת של המכשירים."},

 {q:"מה עלול לקרות להורים שעובדים מהבית לפי הסקירה?",a:"הם נוכחים פיזית, אבל הילדים עלולים לחוות אותם כלא זמינים רגשית",w:["הם תמיד זמינים רגשית","הילדים לא שמים לב","אין להם קשיים"],e:"אם השימוש מפריע לאינטראקציה."}]},

 {q:"איזו מגבלה של הסקירה קשורה לטכנולוגיה?",a:"הטכנולוגיה משתנה מהר, וקשה למחקר להתעדכן",w:["הטכנולוגיה לא משתנה","אין מספיק טלפונים","הטלפונים יקרים"],e:"כל אפליקציה ושדרוג יוצרים הזדמנויות חדשות."},
 {q:"למה אי אפשר להכליל מהממצאים לפי הכותבות?",a:"מדגמים קטנים, אין נתוני אורך, וחלק מהמקורות לא עברו ביקורת עמיתים",w:["כי כל המחקרים נעשו בישראל","כי היו מדגמים ענקיים","כי כל המחקרים זהים"],e:"ובכל זאת הם נותנים תובנות חשובות."}]}
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  if(blk.q)slot.appendChild(qCard(blk.q,next,"בדיקה קצרה"));
  else{const b=document.createElement("button");b.className="primary";b.textContent="המשך";b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
