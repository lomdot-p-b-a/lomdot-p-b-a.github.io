<style>

h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}

button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}

button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}

/* flashcards */
.fc-stage{perspective:1400px}
.fc{display:grid;width:100%;padding:0;border:none;background:none;box-shadow:none;border-radius:var(--r-card);transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.2,.4,1)}

.fc-face{grid-area:1/1;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:32px 28px;border-radius:var(--r-card);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow)}
.fc-front{background:var(--c);color:#fff}

.fc-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 14px;font-size:.95rem;line-height:1.7}

.fc-actions{min-height:56px;display:flex;justify-content:center;align-items:center}

/* questions */

.opt .k{flex:none;width:28px;height:28px;border-radius:var(--r-k);background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c,var(--accent));transition:inherit}

.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}

.fb{display:grid;grid-template-rows:1fr;border-radius:var(--r-card-s);border-inline-start:3px solid;font-size:.96rem}

/* results */
.score{align-items:stretch}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}

.f-mut{fill:var(--muted)}

svg text{font-family:var(--body)}

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(var(--dist))}to{opacity:1;transform:none}}
@keyframes inFwd{from{opacity:0;transform:translateX(calc(var(--dist) * -2))}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(calc(var(--dist) * 2))}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}

@media (prefers-reduced-motion:no-preference){
  .enter.up>*{animation:rise var(--dur-l) var(--ease) both}

  .enter.fwd .card,.enter.fwd .q,.enter.fwd #slot{animation:inFwd var(--dur-l) var(--ease) both}
  .enter.back .card,.enter.back .q,.enter.back #slot{animation:inBack var(--dur-l) var(--ease) both}
  .enter.back.mod-home>*{animation:rise var(--dur-l) var(--ease) both}
  .enter .tool,.enter .tlist li,.card.rev{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + 120ms)}
  .enter .opt:not([aria-disabled]){animation:rise var(--dur) var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 140ms)}
  .answered .opt.right{animation:pop .4s var(--ease)}

}

const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"phone",title:"מבוא: הורים מחוברים",blocks:[
  {h:"תקציר",html:`${def("על מה הנושא",`הורים מסתכלים בטלפון ליד הילדים כל הזמן. הסקירה שואלת מה זה עושה להורים, לילדים ולקשר ביניהם.<br><b>מה נלמד כאן:</b> השערת ההחלפה · מה למדנו מטלוויזיה · ארבע שאלות הסקירה`)}<p>הסקירה מתארת איך <b>הסחת הדעת</b> של הורים בגלל המכשיר הנייד, בזמן טיפול בילדים, משפיעה על הקשר הורה־ילד. נסקרה ספרות שפורסמה עד נובמבר 2016, ונמצאו <mark>27 מקורות</mark>.</p>${tiles([["phone","חיבור מתמיד","החיבור הקבוע והלחץ החברתי להגיב מהר מגבירים את השימוש והתלות בטלפון","הטלפון תמיד זמין, ויש לחץ חברתי לענות מהר. זה גורם להורים להשתמש בו יותר, ולהרגיש תלויים בו.","אבא של נועם מרגיש שהוא חייב לענות להודעה מהעבודה מיד, גם באמצע ארוחת הערב."],["x","פחות רגישות","הורים שמשתמשים בטלפון בזמן אינטראקציה פחות רגישים ומגיבים, במילים ובלי מילים","הורה שעסוק בטלפון בזמן שהוא עם הילד שם פחות לב לאותות שלו, ומגיב פחות, גם במילים וגם בלי מילים.","נועם מראה לאבא ציור, ואבא אומר ״יפה״ בלי להרים את העיניים מהמסך."],["target","התנהגות מסוכנת","ילדים מנסים למשוך תשומת לב בהתנהגויות מסוכנות, אולי קשור לעלייה בפציעות"],["people","קונפליקט","הורים וילדים מודאגים מהשימוש, והוא תורם לקונפליקטים במשפחה","גם ההורים וגם הילדים מודאגים מהשימוש בטלפון, והוא הופך לנושא למריבות בבית.","נועם כועס שאבא בטלפון, ואבא כועס שנועם רוצה עוד זמן מסך."]])}`,q:"q1"},
  {h:"המכשירים בחיינו",html:`<p>הבעלות על מחשבים שולחניים, קוראים אלקטרוניים ונגני MP3 ירדה, אבל הבעלות על מכשירים ניידים ממשיכה לעלות בארה"ב:</p>${tiles([["phone","טלפון נייד","95% מהמבוגרים (53% בשנת 2000)","כמעט כל המבוגרים מחזיקים טלפון נייד, והשימוש עלה מאוד תוך כמה שנים. לכן ההשפעה על ההורות רחבה.","כמעט כל ההורים בגן של נועם מחזיקים טלפון."],["phone","סמארטפון","77% (35% בשנת 2011)","רוב המבוגרים מחזיקים סמארטפון, עם גישה לאינטרנט ולאפליקציות. זה מגדיל את הסיכוי להסחת דעת.","אבא של נועם יכול לקרוא חדשות ולענות למיילים בכל רגע."],["doc","טאבלט","51% (3% בשנת 2010)","השימוש בטאבלטים במשפחות קפץ מאוד תוך כמה שנים: מ־3% בשנת 2010 ל־51%. זה מראה כמה מהר המסכים נכנסו לבית.","לפני כמה שנים לא היה טאבלט בבית של נועם, והיום יש שניים."]])}<p>סמארטפון וטאבלט משלבים טלפון עם <b>מחשב נייד</b> וגישה לאינטרנט. יש כבר מבוגרים "סמארטפון בלבד" (13% ב-2015). חיבור כזה מאפשר להיות <b>זמין כל הזמן</b>, וכך נוצרות אינספור הזדמנויות להסחה.</p>${def("מושג מפתח",`<mark>השערת ההחלפה</mark> ${E("Displacement hypothesis")}: הזמן שמבלים עם טכנולוגיה או מדיה עלול <b>לבוא על חשבון</b> קשרים משמעותיים בין הורה לילד ולהקטין אותם.`)}${ex(`<b>השערת ההחלפה</b>: כל שעה שאבא גולל בטלפון היא שעה שהוא לא משחק עם הילד. הזמן לא מתווסף, הוא "נלקח" ממשהו אחר.`)}`,q:"q3"},
  {h:"למה זה חשוב להתפתחות",html:`<p>ידוע היטב שהתנהגות ההורה ואיכות האינטראקציה <b>מעצבות</b> את התפתחות הילד. אינטראקציה עם <b>רגישות והיענות</b> גבוהות מגבירה את הסיכוי שהתינוק יראה במטפל <mark>בסיס בטוח</mark> ויפתח היקשרות בטוחה (Ainsworth, 1979).</p>${rem("כמה מחקרים בסקירה מציעים שהשימוש במכשיר עלול לפגוע <b>בעקיפין</b> בהיקשרות ובהתפתחות, אבל <b>אין עדיין מחקרי אורך</b> שבדקו את החשש הזה.")}${def("מה למדנו מטלוויזיה",`השימוש של ילדים בטלוויזיה משקף את השימוש של ההורים. טלוויזיה ברקע מפחיתה תגובות של הורים ואת מספר המילים שנאמרות, וקשורה להתפתחות שפה פחות טובה. אבל <b>צפייה משותפת</b> של הורה וילד יכולה להגביר אינטראקציה ולתרום להתפתחות החברתית.`)}`,q:"q5"},
  {h:"שאלות הסקירה",html:`<p>רוב המחקר על הסחה מטלפונים עוסק ב<b>נהיגה</b> ובשימוש בטלפון במפגשים פנים אל פנים. בתקשורת היה הרבה עיסוק בהורים "מחוברים", ועכשיו גם המחקר מתחיל לבדוק את זה. הסקירה מוסיפה על סקירות קודמות שעסקו באינטרנט ובטכנולוגיה ישנה, לפני עידן הסמארטפון.</p>${rqTable}`,q:"q7"}
 ]},
 {id:"t2",icon:"flask",title:"השיטה",blocks:[
  {h:"איך חיפשו",html:`${def("על מה הנושא",`זו סקירת ספרות: איך חיפשו את המחקרים, ומה נמצא.<br><b>מה נלמד כאן:</b> החיפוש · המחקרים שנכללו`)}<p>החיפוש שילב מונחים על <b>הורים, ילדים, מכשירים ניידים ואינטראקציה</b> (למשל: היקשרות, הסחה, היענות, השגחה). חיפשו מאמרים באנגלית מינואר 2000 עד דצמבר 2016, במאגרים אקדמיים (Academic Search Complete, ProQuest, ScienceDirect, Web of Science) ובמנועי חיפוש כלליים (Google Scholar, Google).</p>${yn(["שימוש הורים במכשיר בזמן אינטראקציה","השגחה על ילדים","השלכות על הקשר הורה־ילד"],["שימוש של ילדים ומתבגרים במכשירים","מכשירים להסחת ילדים בטיפולים רפואיים","מעקב אחר מצב רפואי ותרופות"])}${rem("כי הנושא חדש והחיפוש מקיף, נכללו גם <b>הרצאות בכנסים, עבודות דוקטורט ועבודות מאסטר</b>.")}`,q:"q9"},
  {h:"מה נמצא",html:`${fig("flow","שלבי האיסוף וסוגי המקורות")}<p>מאמרים נבחרו לפי התקציר, ואם היו רלוונטיים נקרא הטקסט המלא. מתוך 27: 22 מארה"ב, 2 מכמה מדינות דוברות אנגלית, 1 מקנדה ו-1 מניו זילנד.</p>`,q:"q11"}
 ]},
 {id:"t3",icon:"clock",title:"RQ1: איך הורים משתמשים במכשיר",blocks:[
  {h:"מי משתמש וכמה",html:`${def("על מה הנושא",`השאלה הראשונה: איך, איפה ומתי הורים משתמשים בטלפון ליד הילדים.<br><b>מה נלמד כאן:</b> רמת השימוש · מקומות וזמנים · עבודה ומשפחה · נהיגה · גבולות וארוחות`)}<p>במשקי בית עם ילדים יש יותר טכנולוגיה ויותר מכשירים ניידים. הורים מורידים אפליקציות יותר מאשר מי שאינם הורים (48% מול 33%), ו-57% מהם מורידים אפליקציות <b>לילדים</b>. הורים משתמשים יותר ברשתות חברתיות. אבל ידוע מעט על השימוש <b>בנוכחות</b> הילדים.</p>${def("הגדרות",`<b>Radesky et al. (2014)</b>: רמת השימוש היא "המידה שבה מוקד הקשב והמעורבות של המטפל הוא המכשיר ולא הילד". <b>Blackman (2015)</b>: <mark>הסחת מסך הורית</mark> ${E("PSD")} היא רגעים שבהם ההורה מוסח מהתנהגויות של תפקיד ההורה בגלל מכשיר עם מסך. לא כולל פעילות משותפת מול מסך, או מסך שפשוט דולק ברקע.`)}`,q:"q13"},
  {h:"איפה וכמה זמן",html:`<p>"הורות מחוברת" נחקרה בארוחות, בהאכלת תינוקות ובמשחק, במקומות ציבוריים, ברכב, בחופשה ובבית. אבל מעט מחקרים מדדו ישירות כמה זמן ההורים מוסחים.</p>${tiles([["chart","35%","מהמבוגרים בארה\"ב משתמשים לעתים קרובות בטלפון בזמן משחק עם הילדים (Qualcomm, 2013)","כשליש מהמבוגרים בארה״ב משתמשים בטלפון לעתים קרובות בזמן שהם משחקים עם הילדים.","בזמן משחק קופסה, אבא של נועם בודק את הטלפון כמה פעמים."],["clock","חצי שעה עד 7.5 שעות","ביום על המכשיר, מהן 0 עד 5 שעות ליד הילדים (Blackman, 2015)"],["phone","75%","מההורים משתמשים לפחות 3 פעמים ביום בזמן השגחה ישירה (Ante-Contreras, 2016)","שלושה מכל ארבעה הורים משתמשים בטלפון לפחות שלוש פעמים ביום בזמן שהם אמורים להשגיח על הילדים.","בגן השעשועים, רוב ההורים על הספסל מסתכלים בטלפון."]])}${rem("חלק מההורים לא חושבים שהשימוש פוגע ביכולת להשגיח. אחרים אומרים שליד הילדים הם משתמשים פחות, ואפילו מכבים את הטלפון או משאירים אותו בבית.")}`,q:"q15"},
  {h:"עבודה, משפחה וציפייה לזמינות",html:`<p>המכשיר מאפשר לנהל כמה תפקידים יחד: הורות, עבודה וחברה. זמינות מתמדת דרך מייל, הודעות ורשתות יצרה <b>ציפייה להגיב מיד</b>. משתמשים מדווחים על תלונות מעמיתים ומבני משפחה כשהם מגיבים לאט.</p>${def("מתח עבודה־משפחה",`הורים עובדים חוששים לפספס תוכן מהעבודה, ולכן המכשיר זמין גם בזמן משפחה. נוצר מאבק מתמיד על <b>איזון</b>: לרצות להיות זמינים לעבודה 24/7, וגם לרצות להיות <b>לא זמינים</b>, כלומר נוכחים, למשפחה.`)}`,q:"q17"},
  {h:"נהיגה",html:`${tiles([["phone","מעל 80%","מההורים דיווחו על שימוש בטלפון בנהיגה עם ילדים ברכב (Roney et al., 2013)","רוב גדול מההורים דיווחו שהשתמשו בטלפון בזמן נהיגה עם הילדים ברכב. זה נושא בטיחות שחוזר בסקירה.","אבא של נועם קורא הודעה ברמזור, כשנועם יושב מאחור."],["clock","ברמזור","עם ילדים ברכב גולשים ושולחים הודעות יותר כשעומדים ברמזור מאשר בנסיעה","הורים משתמשים בטלפון בזמן נהיגה עם ילדים, בעיקר כשעוצרים. זה מראה כמה קשה להתנתק.","אבא של נועם עוצר ברמזור ומיד בודק הודעות."],["people","גיל 2 עד 7","הסחות שקשורות לילד (לפתוח חטיף, להרים צעצוע) הכי שכיחות בגילים האלה (Macy et al., 2014)"]])}<p>השימוש ברכב עם ילדים <b>נמוך יותר</b> מאשר בנהיגה לבד או עם מבוגר, אבל הוא מסכן את הילדים ומשמש <b>מודל</b> לנהיגה לא בטוחה. הרצון לשמש דוגמה עשוי להפחית את השימוש ליד מתבגרים שמתקרבים לגיל נהיגה.</p>`,q:"q19"},
  {h:"גבולות וארוחות",html:`<p>הורים מנסים להציב גבולות לעצמם: זמנים בלי טלפון, לכבות מדי פעם, לבדוק רק כמה דחופה הודעה, או רק שימוש קצר. אחרים משתמשים רק לפעילות שמתאימה למקום, כמו צילום בגן השעשועים. ובכל זאת קשה להתנתק.</p>${def("ארוחות",`הכלל הנפוץ: <b>אין טלפונים ליד השולחן</b>. הורים וילדים מסכימים שהחשוב ביותר הוא שההורה <b>נוכח</b>. שימוש בארוחה נתפס כפחות מקובל כשיש ילדים צעירים. למרות זאת הורים עונים לטלפון, ומתבגרים נוזפים בהם על <b>הסטנדרט הכפול</b>.`)}${rem("טלפונים גם מאפשרים <b>הפסקה</b> מאינטראקציה. הורים משתמשים בהם כדי <b>להישאר מחוברים</b> לילדים המתבגרים, אבל כדי <b>להתנתק</b> מילדים צעירים ולהתחבר למבוגרים אחרים ברשתות.")}`,q:"q21"}
 ]},
 {id:"t4",icon:"scales",title:"RQ2: מה ההורים מרגישים",blocks:[
  {h:"מתחים ואשמה",html:`${def("על מה הנושא",`השאלה השנייה: מה ההורים עצמם מרגישים לגבי זה.<br><b>מה נלמד כאן:</b> מתח ואשמה · הצד החיובי`)}<p>העמדות של ההורים <b>מורכבות</b>: גם חיוביות וגם שליליות. בראיונות עם 35 הורים (Radesky et al., 2016) עלו שלושה מתחים:</p>${tiles([["brain","קוגניטיבי","מורכבות ועייפות מניהול תפקידים בעבודה, בבית ובחברה יחד עם המדיה","אחד מסוגי המתח שהורים תיארו: עייפות וקושי לנהל בבת אחת עבודה, בית, חברים ומדיה.","אבא של נועם מרגיש מותש מלענות למיילים, לנהל את קבוצת ההורים בגן ולשחק עם נועם, כל זה באותה שעה."],["x","רגשי","קונפליקט במשפחה ואשמה על השימוש","סוג שני של מתח: ויכוחים במשפחה על השימוש בטלפון, ותחושת אשמה של ההורה.","אמא של נועם מעירה לאבא על הטלפון בארוחה, והוא מרגיש אשם."],["people","הורה־ילד","הפרעה לזמן עם הילדים","סוג שלישי של מתח: הטלפון מפריע לזמן המשותף עם הילד.","נועם מבקש שאבא ישחק איתו, ואבא אומר ״עוד רגע, רק מסיים הודעה״."]])}<p>הורים רבים מכירים בכך שהמכשיר מסיח, ודואגים שהם לא הורים טובים אם הם לא נוכחים לגמרי. אמהות דיווחו שהתראות מפריעות למשחק ומכבידות על <b>ההורות המשותפת</b> ${E("Coparenting")}.</p>${def("אשמה ושיפוטיות",`חלק מההורים מרגישים <b>אשמה</b> על כל שימוש ליד הילדים, אולי כי הורים אחרים או בני משפחה שופטים אותם. בגן השעשועים <b>27%</b> מההורים המוסחים הרגישו שהורים אחרים שופטים אותם.`)}`,q:"q23"},
  {h:"הצד החיובי",html:`${tiles([["check","65%","מההורים חושבים שהטלפון הופך אותם להורים טובים יותר (Qualcomm, 2013)","רוב ההורים, בערך שני שלישים, חושבים שהטלפון דווקא הופך אותם להורים טובים יותר, למשל בהשגחה, במידע ובתיאום.","אבא של נועם מרגיש שבזכות הטלפון הוא יודע מתי הגננת מבקשת משהו, ולא מפספס."],["target","השגחה","מעקב אחרי הילדים ואחרי השימוש שלהם ברשתות","אחד היתרונות שהורים ציינו: הטלפון עוזר לעקוב אחרי הילדים ואחרי מה שהם עושים ברשתות.","הורים של מתבגרת רואים באפליקציה איפה היא נמצאת בערב."],["bulb","מידע ותמיכה","גישה למידע הורי, עצות ותמיכה","הצד החיובי: הטלפון נותן להורים גישה למידע ולעצות, וגם לתמיכה מהורים אחרים.","אבא של נועם מוצא באינטרנט עצה איך להתמודד עם התקפי זעם."],["people","ניהול המשפחה","רשתות חברתיות שומרות על קשר ועוזרות לתכנן מפגשים משפחתיים"]])}${rem("אבל גם מידע הורי זמין ותקשורת רציפה עלולים להיות בעיה, אם הם <b>מפריעים לאינטראקציה</b> או מסכנים את בטיחות הילד.")}`,q:"q25"}
 ]},
 {id:"t5",icon:"people",title:"RQ3: איך הילדים מגיבים",blocks:[
  {h:"מתחרים בטלפון",html:`${def("על מה הנושא",`השאלה השלישית: איך הילדים מגיבים כשההורה בטלפון.<br><b>מה נלמד כאן:</b> מתחרים בטלפון · מגרש הבייסבול · בטיחות`)}<p>ילדים <b>שמים לב</b> כשההורים מוסחים, ומתחרים במכשיר על תשומת הלב. בארוחות במסעדות מזון מהיר, ילדים צעירים הוטרדו בעיקר מ<b>בדיקות קצרות וחוזרות</b> ומ<b>שקיעה מתמשכת</b> במסך. ילדים גדולים יותר שעסקו במשהו אחר לא נראו מוטרדים.</p>${def("סימן מדאיג",`חלק מהילדים <b>לא ניסו בכלל</b> למשוך את תשומת הלב של ההורה כשההורה היה בטלפון כל הארוחה. זה עשוי להעיד על <mark>הרגלה</mark> לחוסר ההיענות של ההורה, וצריך לחקור את זה.`)}`,q:"q27"},
  {h:"הניסוי במגרש הבייסבול",html:`<p>Stupica (2016) בדקה ילדים בני 3 עד 12 שרצו סביב בסיס. ההורים התבקשו להיות <b>זמינים ומגיבים</b>, או <b>לא זמינים</b> (עסוקים בטלפון). כל ילד חווה את שני המצבים, בסדר מאוזן ואקראי.</p>${tiles([["check","הורה קשוב","הילדים רצו מהר יותר","בניסוי ״מגרש הבייסבול״, כשההורה הסתכל על הילד, הילדים רצו מהר יותר.","כשאבא מסתכל, נועם רץ בכל הכוח כדי שאבא יראה."],["x","הורה בטלפון","הילדים רצו לאט יותר ונטו יותר למעוד או ליפול","כשההורה היה עסוק בטלפון, הילדים רצו לאט יותר ונפלו יותר. זה מראה שתשומת הלב של ההורה משפיעה גם על התנועה והבטיחות.","כשאבא בטלפון, נועם רץ לאט, מסתכל אחורה, ומועד."],["x","הורה קשוב אבל קשוח","גם תגובות קשות במקום תומכות הורידו את הביצוע"]])}`,q:"q29"},
  {h:"בטיחות",html:`<p>ידוע שילדים בלי השגחה עושים דברים <b>מסוכנים</b> כדי למשוך תשומת לב, והורים מוסחים פחות מזהירים אותם. במקומות ציבוריים ילדים זחלו מתחת לשולחנות או עמדו על כיסאות. ילדים <b>צעירים</b> בסיכון גבוה יותר.</p>${tiles([["chart","פציעות","העלייה בבעלות על טלפונים ו\"עיוורון הקשב\" של ההורים עשויים להיות קשורים לעלייה בפציעות של ילדים","העלייה בשימוש בטלפונים, ו״עיוורון הקשב״ של הורים שעסוקים בהם, עשויים להיות קשורים לעלייה בפציעות של ילדים. זה קשר, ולא בהכרח סיבה.","הורה שקורא הודעה בגן השעשועים לא רואה שהילד מטפס למקום מסוכן."],["clock","אמבטיה","הורים השאירו ילדים מתחת לגיל 5 לבד 1 עד 5 דקות באמבטיה כדי לענות לטלפון או לבשל (Simon et al., 2003)","הורים השאירו ילדים קטנים לבד באמבטיה לכמה דקות כדי לענות לטלפון. זו דוגמה למצב שבו הסחה קצרה יכולה להיות מסוכנת.","גם דקה אחת לבד באמבטיה מסוכנת לילד בן שנתיים."],["leaf","חוף הים","רבע מההורים היו מוסחים, ומהם 27% בטלפון. ייתכן שזה קשור לעלייה בטביעות (Moran, 2010)","בתצפית, חלק מההורים בחוף היו מוסחים, וחלקם בגלל הטלפון. זה עלול לסכן את הילדים.","אבא של נועם קורא הודעה, ולא רואה שנועם נכנס עמוק למים."]])}${def("בגן השעשועים",`הורים הודו שהם שמים לב פחות לסביבה כשהם בטלפון. ובכל זאת היו בטוחים ביכולת שלהם להשגיח. כששאלו אותם מה הילד עושה עכשיו, הם נעשו <b>מתגוננים</b> או ענו תשובות כלליות (Hiniker et al., 2015).`)}`,q:"q31"}
 ]},
 {id:"t6",icon:"link",title:"RQ4: ההשפעה על הקשר הורה־ילד",blocks:[
  {h:"פחות תקשורת",html:`${def("על מה הנושא",`השאלה הרביעית: מה זה עושה לקשר בין ההורה לילד.<br><b>מה נלמד כאן:</b> פחות תקשורת · תגובות לילד · המכשיר כמרגיע · שרנטינג`)}<p>כשההורים שקועים במכשיר, היכולת שלהם לשים לב לילד מוגבלת. Radesky et al. (2014) מצאו שאמהות מוסחות דיברו ותקשרו בלי מילים <b>פחות</b> עם ילדים בני 6 בזמן ארוחה.</p>${ex("ההפרעה הייתה הכי גדולה כשהוצג <b>מאכל חדש ולא מוכר</b>: הילדים קיבלו פחות עידוד מהאמהות המוסחות, וניסו את המאכל החדש פחות.")}`,q:"q33"},
  {h:"תגובות לילד",html:`<p>הורים מוסחים <b>איטיים יותר</b> להגיב לניסיונות של הילד לחזור לקשר, ו<b>פחות רגישים</b> בתגובה. חלק התעלמו בהתחלה ובסוף הגיבו.</p>${tiles([["check","לפעמים חיובית","יש תגובות חיוביות"],["x","נזיפה","לפעמים נזיפה, אולי בלי להרים את העיניים מהמסך"],["hand","פיזית","הורה שבעט ברגל של הילד מתחת לשולחן, ואם שדחפה ילד שהרים לה את הפנים מהמכשיר","במקרים קיצוניים, הורים שהיו עסוקים בטלפון הגיבו לילד בכעס ואפילו באלימות פיזית קלה, כשהוא ניסה למשוך את תשומת הלב שלהם.","אמא שדוחפת ילד שמנסה להרים את הפנים שלה מהמסך."]])}${def("חוסר תגובה",`יש הורים שלא הגיבו בכלל, וזה קרה גם אצל הורים שדיברו עם מבוגר אחר. יש שהעמידו פנים שהם עסוקים במכשיר כדי שבן הזוג יטפל בילד. מצד שני, אחרי הסחה יש הורים שנעשו <b>קשובים יותר</b>, אפילו יותר מלפני.`)}`,q:"q35"},
  {h:"תלוי מה עושים בטלפון",html:`<p>צריך לבדוק <b>איזו פעילות</b> ההורה עושה. Boles & Roberts (2008): ההורים הגיבו פחות בכל ההסחות, אבל היו <b>הכי פחות קשובים חזותית</b> מול המחשב, לעומת שיחת טלפון או טלוויזיה.</p>${rem("Radesky et al. (2014): הורים שרק <b>דיברו</b> בטלפון שמרו יותר על קשר עין עם הילד מהורים שהקלידו או גללו כל הזמן.")}`,q:"q37"},
  {h:"האכלת תינוקות",html:`<p>האכלה היא זמן של קשר עמוק בין אם לתינוק.</p>${tiles([["doc","Golen & Ventura (2015a)","אמהות הוסחו בעיקר מטלוויזיה, ורק 4% מהזמן משיחה בטלפון. אבל לא נבדקו הודעות, משחקים ורשתות"],["chart","Golen & Ventura (2015b)","יותר מ-75% מהזמן האמהות עשו משהו אחר (בעיקר שיחה עם אדם אחר או שינה). אמהות מוסחות היו פחות רגישות לסימני שובע, ולכן בסיכון להאכלת יתר, שקשורה להשמנת ילדים"]])}`,q:"q39"},
  {h:"המכשיר כמרגיע",html:`<p>הורים גם <b>נותנים</b> לילד מכשיר כדי להעסיק אותו (למשל בזמן הכנת ארוחה) או כדי להרגיע אותו. ילדים עם <b>קשיים רגשיים־חברתיים</b> מקבלים טלפון להרגעה יותר מילדים אחרים (ראיונות עם 144 הורים).</p>${rem("יש חשש לגבי היכולת של הילד להעסיק את עצמו ולפתח <b>ויסות עצמי</b>, אבל המחקר עוד לא בדק את זה. צריך מחקרי אורך על ההשפעה על ההתפתחות ועל ההיקשרות.")}`,q:"q41"},
  {h:"קונפליקט ו\"שרנטינג\"",html:`<p>המכשירים עלולים להקטין חוויות הוריות חיוביות. במשפחות רבות הטלפון הפך ל<b>מקור לקונפליקט</b>. הורים מתעצבנים כשהילדים שקועים בטלפון, וגם ילדים מתעצבנים על ההורים. ילדים נוזפים בהורים שמפרים את הכללים ומבקשים שיכבו את הטלפון.</p>${def("מושג מפתח",`<mark>שרנטינג</mark> ${E("Sharenting")}: הורים משתפים תמונות או סיפורים על הילדים ברשתות <b>בלי רשות</b> הילדים. מתבגרים כועסים ונבוכים, וזה עלול להוביל לקונפליקט. מצד שני, בזמן קונפליקט משפחתי יש ילדים שבורחים לרשתות החברתיות.`)}${ex(`<b>שרנטינג</b>: אמא שמעלה לאינסטגרם תמונה של הילד בוכה באמבטיה עם הכיתוב "עוד בוקר רגיל". הילד לא נשאל אם הוא מסכים.`)}`,q:"q43"}
 ]},
 {id:"t7",icon:"bulb",title:"מסקנות ומחקר עתידי",blocks:[
  {h:"הנושאים המרכזיים",html:`${def("על מה הנושא",`סיכום, מה הילדים אומרים, ומה עוד לא ידוע.<br><b>מה נלמד כאן:</b> הנושאים המרכזיים · פערים · הנחיות להורים · מגבלות`)}${tiles([["phone","שקיעה במכשיר","רמת הקליטה של ההורה במכשיר"],["target","בטיחות","בטיחות הילדים כשההורים מוסחים","אחד הנושאים שמדאיגים: כשההורים מוסחים, הם פחות מפקחים על הילדים.","נועם מטפס על מגלשה גבוהה בזמן שאבא מסתכל בטלפון."],["scales","עמדות סותרות","עמדות מעורבות של הורים לגבי השימוש"],["x","פחות היענות","ירידה בהיענות וברגישות להורה מוסח"]])}<p>גם עבודות לא אמפיריות תומכות במגמות האלה, אבל התוצאות האמפיריות מראות מגוון רחב של תגובות. השילוב של מכשירים בחיים מורכב, עם יתרונות וגם סיבוכים להורות.</p>`,q:"q45"},
  {h:"מה הילדים אומרים",html:`<p>כמעט לא נחקר מה <b>הילדים</b> מרגישים. סקרים לא אמפיריים מתחילים לבדוק את זה:</p>${fig("stats","מה ילדים והורים אומרים (סקרים לא אמפיריים)")}${rem("ילדים אמרו שישמחו אם ההורים <b>יאבדו את הטלפון</b>, כי אז ישימו לב אליהם. 28% מההורים הרגישו שהם לא מדגימים שימוש נכון. מתבגרים הרגישו <b>נפגעים</b>, אבל היססו לספר להורים.")}`,q:"q47"},
  {h:"פערים במחקר",html:`${tiles([["clock","מדידת זמן","רק 2 מתוך 27 מחקרים מדדו ישירות שימוש ליד הילדים, ובדיווח עצמי רטרוספקטיבי. אירוני, אבל אפליקציית מעקב הייתה מדויקת יותר. אפשר גם מניפולציה ניסויית"],["question","למה משתמשים","עבודה, אישי או משפחה? איזו פעילות מסיחה הכי הרבה? אילו גורמים של ההורה והילד משפיעים?"],["check","הצד החיובי","כמעט לא נבדק איך מכשירים יכולים לחזק קשר, ומה ההשפעה של שימוש או צפייה משותפים","רוב המחקרים בדקו נזקים. כמעט לא נבדק איך טלפונים יכולים דווקא לחזק את הקשר, למשל כשצופים יחד.","נועם ואבא צופים יחד בסרטון על דינוזאורים ומדברים עליו."]])}`,q:"q49"},
  {h:"הנחיות להורים",html:`<p>המטרה האולטימטיבית: הנחיות <b>מועילות ומציאותיות</b>. יש הנחיות לשימוש של ילדים (האקדמיה האמריקאית לרפואת ילדים), אבל כמעט אין להורים. ההמלצות: להימנע משימוש בארוחות ובמשחק, לצפות במדיה <b>יחד</b> עם הילדים, ותוכנית מדיה משפחתית.</p>${def("למה \"פשוט לכבות\" לא עובד",`התקשורת ממליצה לכבות את המכשיר, אבל בגלל המורכבות והאפשרות להתמכרות, זה <b>לא מציאותי</b>. המכשירים משולבים בעבודה, בבית ובפנאי. גם להניח את הטלפון על השולחן לא עוזר: נוכחות של טלפון, גם בלי שימוש, פוגעת בקרבה ובאיכות השיחה (Przybylski & Weinstein, 2013).`)}${rem("הנחיה ברורה אחת: <b>להגביל את השימוש ליד הילדים</b>. זה קשה להורים שעובדים מהבית, אבל הם עדיין נוכחים פיזית יותר. ובכל זאת ילדים עלולים לחוות אותם כ<b>לא זמינים רגשית</b>.")}`,q:"q51"},
  {h:"מגבלות",html:`${tiles([["x","חיפוש","ייתכן שפוספסו מאמרים בגלל מונחי החיפוש והמאגרים","אחת המגבלות של הסקירה: ייתכן שפוספסו מאמרים בגלל המילים שבהן חיפשו ובגלל המאגרים שבחרו.","אם מחקר חשוב השתמש במונח אחר, כמו ״טכנופרנס״, אולי הוא לא נמצא בחיפוש."],["clock","טכנולוגיה משתנה","כל אפליקציה ושדרוג יוצרים הזדמנויות חדשות, וקשה למחקר להתעדכן","הטכנולוגיה משתנה מהר, והמחקר מתקשה לעמוד בקצב. מה שנבדק לפני כמה שנים עשוי להיות כבר לא רלוונטי.","מחקר על הודעות טקסט יוצא, ובינתיים כולם כבר משתמשים באפליקציה חדשה."],["people","הכללה","מדגמים קטנים, אין נתוני אורך, וחלק לא עברו ביקורת עמיתים"]])}${def("המסקנה",`צריך עוד מחקר על <b>איך</b> הורים משתמשים בטלפון ליד ילדים ועל ההשלכות לאיכות ולכמות האינטראקציה ולהתפתחות: לבדוק את השערת ההחלפה, עמדות ילדים, השפעה על היקשרות, השפעת השימוש של ההורים על השימוש של הילדים, ומדד אחיד לשימוש.`)}`,q:"q53"}
 ]}
];
const Q={"q1":{"t":"t1","v":[{"q":"כמה מקורות נכללו בסקירה, ועד מתי פורסמו?","a":"27, עד נובמבר 2016","w":["18, עד דצמבר 2010","50, עד ינואר 2020","9, עד יוני 2014"],"e":"הסקירה כללה 27 מקורות שפורסמו עד נובמבר 2016. זו סקירה מצומצמת יחסית."},{"q":"אב מרגיש שעליו לענות מיד לכל הודעה בווטסאפ. מה, לפי הסקירה, מגביר את התלות הזו?","a":"חיבור מתמיד ולחץ חברתי להגיב מהר","w":["שעמום בזמן הטיפול בילדים בבית","מחסור בזמן פנוי בשעות העבודה","רצון להסתיר דברים מבני המשפחה"],"e":"לפי הסקירה, החיבור המתמיד, יחד עם הלחץ החברתי להגיב מהר, מגבירים את השימוש והתלות בטלפון. הסיבה איננה שעמום."}]},
"q2":{"t":"t1","v":[{"q":"אמא גוללת בטלפון והילדה מושכת בשרוולה. מה צפוי לפי הסקירה?","a":"תגובה פחות רגישה ומגיבה","w":["תגובה מהירה וחמה יותר","אין הבדל בתגובה שלה","תגובה רגישה, אבל מאוחרת"],"e":"לפי הסקירה, הורים שמשתמשים בטלפון בזמן אינטראקציה עם הילד פחות רגישים ומגיבים לבקשות שלו לתשומת לב, במילים ובלי מילים."},{"q":"ילד מטפס על גדר כדי שאבא יסתכל עליו מהטלפון. עם מה הסקירה קושרת זאת?","a":"עלייה בפציעות ילדים","w":["שיפור במיומנויות מוטוריות","עלייה בביטחון העצמי","ירידה בזמן המסך של הילד"],"e":"ילדים שמנסים למשוך את תשומת הלב של הורה מוסח עלולים להתנהג באופן מסוכן, ולכן הסקירה קושרת את השימוש לעלייה בפציעות ילדים."}]},
"q3":{"t":"t1","v":[{"q":"הורה שעובר שעה בטלפון במקום לשחק עם הילד. איזו השערה מתארת זאת?","a":"השערת ההחלפה","w":["השערת הפיצוי","השערת ההרגלה","השערת הניסיון המוקדם"],"e":"השערת ההחלפה טוענת שהזמן עם טכנולוגיה עלול לבוא על חשבון קשרים משמעותיים, כמו הקשר בין הורה לילד. שעה בטלפון במקום משחק היא בדיוק זה."},{"q":"כמה מהמבוגרים בארה״ב היו בעלי סמארטפון לפי הסקירה?","a":"77%","w":["35%","51%","95%"],"e":"לפי הנתונים בסקירה, 77% מהמבוגרים בארה״ב היו בעלי סמארטפון."}]},
"q4":{"t":"t1","v":[{"q":"מה מבדיל סמארטפון מטלפון נייד רגיל?","a":"שילוב של מחשב וגישה לאינטרנט","w":["רק מצלמה טובה וחדה יותר","רק מסך גדול ובהיר יותר","רק סוללה שמחזיקה זמן רב"],"e":"סמארטפון משלב טלפון עם מחשב נייד וגישה לאינטרנט, ולא רק מצלמה או מסך טובים יותר. זה מה שהופך אותו למסיח."},{"q":"מה קרה לבעלות על טאבלט בארה״ב מאז 2010?","a":"עלתה מ-3% ל-51%","w":["ירדה מ-51% ל-3%","נשארה כ-20%","עלתה מ-30% ל-35%"],"e":"הבעלות על טאבלט בארה״ב עלתה מ-3% ב-2010 ל-51% בזמן הסקירה. זה זינוק."}]},
"q5":{"t":"t1","v":[{"q":"למה הכותבות חוששות שהסחת טלפון תפגע בהיקשרות?","a":"היקשרות נשענת על היענות רגישה","w":["היקשרות נשענת על זמן מסך","היקשרות נקבעת בגנים","היקשרות נוצרת רק בגן"],"e":"היקשרות בטוחה נבנית מאינטראקציה רגישה ומגיבה, שבה התינוק רואה במטפל בסיס בטוח. לכן הסחה בטלפון, שפוגעת בהיענות, עלולה לפגוע בהיקשרות."},{"q":"מה חסר במחקר על שימוש ההורים בטלפון והיקשרות?","a":"מחקרי אורך","w":["מחקרים איכותניים","סקרים להורים","תצפיות בפארקים"],"e":"חסרים מחקרי אורך שיבדקו לאורך זמן את החשש שהשימוש של ההורים בטלפון פוגע בהיקשרות. מחקרים איכותניים כבר יש."}]},
"q6":{"t":"t1","v":[{"q":"טלוויזיה דולקת ברקע בזמן משחק. מה נמצא?","a":"פחות מילים מההורים ושפה חלשה יותר","w":["יותר מילים מההורים ושפה עשירה","אין השפעה על האינטראקציה","שיפור בריכוז של הילדים"],"e":"מחקר על טלוויזיה ברקע מצא פחות תגובות של ההורים ופחות מילים, וקשר להתפתחות שפה פחות טובה. אין שיפור בריכוז."},{"q":"מתי טלוויזיה יכולה דווקא לתרום לאינטראקציה?","a":"בצפייה משותפת","w":["כשהיא דולקת ברקע","כשהילד צופה לבד","כשההורה צופה לבד"],"e":"טלוויזיה יכולה לתרום לאינטראקציה בצפייה משותפת של הורה וילד, כשהיא נקודת מגע ושיחה. כשהיא דולקת ברקע היא מסיחה."}]},
"q7":{"t":"t1","v":[{"q":"״איך מגיבים הילדים לשימוש של ההורים בטלפון?״ איזו שאלת מחקר זו?","a":"RQ3","w":["RQ1","RQ2","RQ4"],"e":"RQ3 בסקירה היא השאלה איך הילדים מגיבים לשימוש של ההורים בטלפון בזמן אינטראקציה. RQ1 עוסקת באופן השימוש של ההורים."},{"q":"במה עסק רוב המחקר על הסחה מטלפונים לפני הסקירה?","a":"בנהיגה ובמפגשים בין מבוגרים","w":["בילדים ובמתבגרים בלבד","בהורים ובילדים בתוך הבית","בשימוש במקום העבודה בלבד"],"e":"לפני הסקירה, רוב המחקר על הסחה מטלפונים עסק בנהיגה ובשימוש בטלפון במפגשים פנים אל פנים בין מבוגרים. השימוש של הורים ליד ילדים כמעט לא נחקר."}]},
"q9":{"t":"t2","v":[{"q":"למה נכללו בסקירה גם עבודות דוקטורט והרצאות בכנסים?","a":"כי הנושא חדש ויש מעט מאמרים","w":["כי הן איכותיות יותר ממאמרים","כי כך מחייבים כללי הסקירה","כי מאמרים לא היו נגישים"],"e":"הנושא חדש ויש עליו מעט מאמרים, ולכן נכללו גם הרצאות בכנסים, עבודות דוקטורט ועבודות מאסטר. הן לא נכללו כי הן איכותיות יותר."},{"q":"מחקר על כמה שעות מתבגרים משחקים בטלפון. האם ייכלל בסקירה?","a":"לא, שימוש של ילדים לא נכלל","w":["כן, כל מחקר על טלפונים נכלל","כן, אם פורסם אחרי 2010","לא, כי הוא איכותני"],"e":"שימוש של ילדים ומתבגרים במכשירים לא נכלל בסקירה, כי היא עוסקת רק בשימוש של ההורים. לכן מחקר על מתבגרים שמשחקים בטלפון לא ייכלל."}]},
"q10":{"t":"t2","v":[{"q":"באיזה טווח שנים חיפשו מאמרים?","a":"2000–2016","w":["1990–2010","2010–2020","2005–2015"],"e":"החיפוש כלל מאמרים מינואר 2000 עד דצמבר 2016."},{"q":"איך נבחרו המאמרים לסקירה?","a":"לפי תקציר, ואז קריאה מלאה","w":["רק לפי הכותרת של המאמר","לפי מספר הציטוטים שקיבל","לפי שנת הפרסום של המאמר"],"e":"המאמרים נבחרו בשני שלבים: לפי התקציר, ואם היו רלוונטיים, נקרא הטקסט המלא. לא לפי הכותרת בלבד."}]},
"q11":{"t":"t2","v":[{"q":"מאיפה הגיעו 9 המקורות הנוספים?","a":"מרשימות המקורות של 18 הראשונים","w":["מחיפוש חדש בגוגל סקולר","מפניות ישירות לחוקרים בתחום","מספרי לימוד על התפתחות"],"e":"9 המקורות הנוספים הגיעו מחיפוש ברשימות המקורות ובציטוטים של 18 המאמרים הראשונים. לא מחיפוש חדש."},{"q":"מה החלוקה של שיטות המחקר בין 27 המקורות?","a":"11 איכותניים, 11 כמותיים, 5 משולבים","w":["20 כמותיים ו-7 איכותניים","27 כמותיים, בלי איכותניים","15 איכותניים ו-12 משולבים"],"e":"בין 27 המקורות היו 11 מחקרים איכותניים, 11 כמותיים ו-5 משולבים, כלומר מגוון שיטות."}]},
"q12":{"t":"t2","v":[{"q":"למה ייתכן שהממצאים של סקירה כזו לא מכלילים היטב?","a":"חלק מהמקורות לא עברו ביקורת עמיתים","w":["כי כל המקורות היו ניסויים מבוקרים","כי המדגמים היו גדולים מדי לניתוח","כי כולם נערכו באותה מדינה ובאותה שנה"],"e":"חלק מהמקורות, כמו הרצאות ועבודות, לא עברו ביקורת עמיתים, ולכן קשה להכליל מהממצאים. המדגמים דווקא היו קטנים."},{"q":"מה היתרון בשילוב מחקרים איכותניים וכמותיים?","a":"גם מדידה וגם הבנה של החוויה","w":["חוסך את הצורך בקריאה מלאה","מבטל את הצורך במחקר המשך","מבטיח שכל הממצאים יסכימו"],"e":"שילוב של מחקרים איכותניים וכמותיים נותן גם מדידה וגם הבנה של החוויה של ההורים והילדים, כלומר תמונה רחבה יותר."}]},
"q13":{"t":"t3","v":[{"q":"אבא מקליד הודעת עבודה ולא שם לב שהילד קורא לו. איך Blackman תקרא לזה?","a":"הסחת מסך הורית","w":["השערת ההחלפה","עיוורון קשב חזותי","שרנטינג"],"e":"Blackman (2015) הגדירה הסחת מסך הורית כרגעים שבהם ההורה מוסח מהתנהגויות תפקיד ההורה בגלל מכשיר עם מסך. אב שמקליד ולא שומע את הילד עושה בדיוק זאת."},{"q":"כמה מההורים שמורידים אפליקציות מורידים אותן לילדים?","a":"57%","w":["15%","35%","90%"],"e":"57% מההורים שמורידים אפליקציות מורידים אותן גם לילדים שלהם."}]},
"q14":{"t":"t3","v":[{"q":"איך הגדירו Radesky ועמיתיה את רמת השימוש במכשיר?","a":"כמה הקשב של המטפל מופנה למכשיר","w":["כמה דקות ביום ההורה בטלפון","כמה אפליקציות יש להורה","כמה הודעות ההורה שולח"],"e":"Radesky ועמיתיה הגדירו את רמת השימוש במכשיר כמידה שבה מוקד הקשב והמעורבות של המטפל הוא המכשיר, ולא הילד. לא לפי מספר הדקות."},{"q":"איזה מהבאים לא נחשב הסחת מסך הורית לפי Blackman?","a":"מסך שדולק ברקע","w":["גלילה בפייסבוק בארוחה","הקלדת מייל בפארק","שיחת וידאו במשחק"],"e":"לפי Blackman, מסך שדולק ברקע אינו הסחת מסך הורית, כי צריך שהקשב של ההורה יוסט מהילד אל המכשיר. גלילה, הקלדה ושיחת וידאו כן מסיטות אותו."}]},
"q15":{"t":"t3","v":[{"q":"כמה מהמבוגרים בארה״ב דיווחו על שימוש תכוף בטלפון בזמן משחק עם הילדים?","a":"35%","w":["5%","57%","80%"],"e":"35% מהמבוגרים בארה״ב דיווחו על שימוש תכוף בטלפון בזמן משחק עם הילדים (Qualcomm, 2013)."},{"q":"מה מצאה Ante-Contreras (2016)?","a":"75% השתמשו 3+ פעמים ביום בהשגחה","w":["כמעט אף הורה לא השתמש בהשגחה","רק אבות השתמשו בזמן השגחה","השימוש היה רק בסופי שבוע"],"e":"Ante-Contreras (2016) מצאה ש-75% מההורים השתמשו בטלפון לפחות 3 פעמים ביום בזמן השגחה ישירה על הילדים. זה שימוש נפוץ מאוד."}]},
"q16":{"t":"t3","v":[{"q":"בתצפיות במסעדות, חלק מהמטפלים היו עסוקים במכשיר לאורך כל הארוחה. ומה דיווחו הורים אחרים?","a":"שהם משתדלים להשתמש פחות ליד הילדים","w":["שהם משתמשים יותר ליד הילדים מאשר לבד","שהם לא שמים לב בכלל לשימוש שלהם","שהשימוש בטלפון עוזר להם להקשיב"],"e":"בתצפיות, חלק מהמטפלים היו עסוקים במכשיר כל הזמן, ואילו הורים אחרים דיווחו שהם משתדלים להשתמש פחות ליד הילדים. כלומר, יש מגוון התנהגויות."},{"q":"מה עושים חלק מההורים כדי לא להיות מוסחים ליד הילדים?","a":"מכבים או משאירים את הטלפון בבית","w":["נותנים את הטלפון לילדים לשחק","קונים טלפון נוסף רק לעבודה","מתקינים עוד אפליקציות הורות"],"e":"חלק מההורים מכבים את הטלפון או משאירים אותו בבית כדי לא להיות מוסחים ליד הילדים. זו הגבלה עצמית."}]},
"q17":{"t":"t3","v":[{"q":"מה יוצרת הזמינות המתמדת דרך מייל, הודעות ורשתות?","a":"ציפייה להגיב מיד","w":["ציפייה להגיב פעם ביום","הקלה בלחץ בעבודה","פחות קשר עם חברים"],"e":"הזמינות המתמדת דרך מייל, הודעות ורשתות חברתיות יוצרת ציפייה להגיב מיד. זה מגביר את הלחץ."},{"q":"אמא עובדת מרגישה ״קרועה״ בין הבוס לילדים. איזה מתח זה?","a":"זמינות 24/7 לעבודה מול נוכחות למשפחה","w":["רצון לפרטיות מול רצון לפרסם","רצון לחסוך כסף מול לקנות מכשיר","רצון לנוח מול רצון לעבוד"],"e":"הורים עובדים מתארים מתח בין הרצון להיות זמינים לעבודה 24/7 לבין הרצון להיות נוכחים למשפחה."}]},
"q19":{"t":"t3","v":[{"q":"כמה מההורים דיווחו על שימוש בטלפון בנהיגה עם ילדים ברכב?","a":"מעל 80%","w":["פחות מ-10%","כ-35%","כ-50%"],"e":"מעל 80% מההורים דיווחו על שימוש בטלפון בזמן נהיגה עם ילדים ברכב."},{"q":"באילו גילים של הילדים הכי שכיחות הסחות בזמן נהיגה?","a":"2–7","w":["0–1","10–14","15–18"],"e":"הסחות שקשורות לילד בזמן נהיגה שכיחות במיוחד בגילי 2 עד 7."}]},

"q21":{"t":"t3","v":[{"q":"מה הכלל הנפוץ במשפחות לגבי ארוחות?","a":"בלי טלפונים ליד השולחן","w":["טלפונים מותרים רק להורים","טלפונים רק לשיחות חשובות","אין שום כללים בנושא"],"e":"הכלל הנפוץ במשפחות הוא שאין טלפונים ליד שולחן האוכל."},{"q":"מתבגרת נוזפת באבא שבודק מיילים בארוחה. על מה היא מוחה?","a":"על הסטנדרט הכפול","w":["על כך שהוא עובד יותר מדי","על כך שאין לה טלפון","על כך שהאוכל לא טעים"],"e":"מתבגרים נוזפים בהורים בגלל הסטנדרט הכפול: ההורים משתמשים בטלפון בארוחה, למרות שהכלל חל על כולם."}]},
"q22":{"t":"t3","v":[{"q":"איך שונה שימוש ההורים בטלפון לפי גיל הילד?","a":"מתחברים למתבגרים, ומתנתקים מקטנים","w":["מתנתקים ממתבגרים, ומתחברים לקטנים","אין הבדל לפי גיל הילד","משתמשים רק ליד מתבגרים"],"e":"הורים משתמשים בטלפון כדי להישאר מחוברים למתבגרים, ולעומת זאת, כדי להתנתק מילדים צעירים ולהתחבר למבוגרים. המסיח הראשון הופך ביניהם."},{"q":"איזה מהבאים לא מוזכר כדרך של הורים להגביל את השימוש?","a":"למסור את הטלפון לילד","w":["לכבות את הטלפון","להשאיר אותו בבית","לקבוע אזורים בלי טלפון"],"e":"מסירת הטלפון לילד לא מוזכרת כדרך להגביל את השימוש של ההורה. כיבוי, השארה בבית ואזורים בלי טלפון כן מוזכרים."}]},
"q23":{"t":"t4","v":[{"q":"אמא מתארת שקשה לה לעבור מהמייל לשאלה של הילד. איזה מתח זה לפי Radesky (2016)?","a":"קוגניטיבי","w":["רגשי","הורה־ילד","כלכלי"],"e":"Radesky ועמיתים (2016) זיהו שלושה מתחים: קוגניטיבי, רגשי והורה־ילד. קושי לעבור מהמייל לשאלה של הילד הוא מתח קוגניטיבי, של מעבר בין משימות."},{"q":"כמה מההורים המוסחים בגן השעשועים הרגישו שהורים אחרים שופטים אותם?","a":"27%","w":["5%","57%","80%"],"e":"27% מההורים המוסחים בגן השעשועים הרגישו שהורים אחרים שופטים אותם."}]},
"q24":{"t":"t4","v":[{"q":"מה דיווחו אמהות על התראות בטלפון בהקשר של הורות משותפת?","a":"הן מפריעות ומכבידות על הקשר עם בן הזוג","w":["הן משפרות את התיאום עם בן הזוג בהורות","הן לא משפיעות על הקשר הזוגי בכלל","הן עוזרות לחלק את הטיפול בילד בצורה הוגנת"],"e":"אמהות דיווחו שהתראות בטלפון מפריעות למשחק עם הילד ומכבידות על הקשר עם בן הזוג בהורות המשותפת. הן לא משפרות את התיאום."},{"q":"ממה עשויה לנבוע האשמה של הורים על שימוש בטלפון?","a":"משיפוטיות של הורים אחרים","w":["מהוראות של רופא הילדים","מכללים במקום העבודה","מחוק מפורש של המדינה"],"e":"האשמה של הורים על השימוש בטלפון עשויה לנבוע משיפוטיות של הורים אחרים או של בני משפחה."}]},
"q25":{"t":"t4","v":[{"q":"כמה מההורים חושבים שהטלפון הופך אותם להורים טובים יותר?","a":"65%","w":["10%","27%","90%"],"e":"65% מההורים חושבים שהטלפון הופך אותם להורים טובים יותר (Qualcomm, 2013)."},{"q":"אמא מחפשת בגוגל מה לעשות כשלתינוק יש חום. איך היא תתאר את הטלפון?","a":"כמקור למידע ולתמיכה הורית","w":["כהסחה שפוגעת בהורות","כמכשיר שמבודד אותה","כמקור לשיפוטיות כלפיה"],"e":"חיפוש מידע על חום אצל תינוק הוא שימוש חיובי בטלפון: גישה למידע הורי, עצות ותמיכה. ההורים לא רואים בו רק הסחה."}]},
"q26":{"t":"t4","v":[{"q":"מה עולה מהשאלה מה ההורים מרגישים לגבי השימוש?","a":"תחושות מעורבות של תועלת ואשמה","w":["רק תחושות חיוביות ונוחות","רק תחושות של אשמה ובושה","אדישות מוחלטת לכל הנושא"],"e":"ההורים מדווחים על תחושות מעורבות: גם תועלת (מידע ותמיכה) וגם אשמה ושיפוטיות. התחושות לא רק חיוביות ולא רק שליליות."},{"q":"איזה מתח מבין השלושה של Radesky עוסק בקשר עצמו עם הילד?","a":"מתח הורה־ילד","w":["מתח קוגניטיבי","מתח רגשי","מתח כלכלי"],"e":"המתח הורה־ילד, אחד משלושת המתחים של Radesky, עוסק בקשר עצמו עם הילד: עימותים וגבולות סביב השימוש. מתח קוגניטיבי עוסק במעבר בין משימות."}]},
"q27":{"t":"t5","v":[{"q":"מה הטריד במיוחד ילדים צעירים בארוחות במסעדות מזון מהיר?","a":"בדיקות חוזרות ושקיעה ממושכת במסך","w":["שיחה של ההורה עם המלצר במסעדה","האוכל שהגיע באיחור לשולחן","ילדים אחרים שישבו בשולחן הסמוך"],"e":"בארוחות במסעדות מזון מהיר, ילדים צעירים הוטרדו במיוחד מבדיקות קצרות וחוזרות של הטלפון, ומשקיעה מתמשכת במסך."},{"q":"ילד בן 4 כבר לא מנסה למשוך את תשומת הלב של אמא שבטלפון. מה זה עשוי להעיד?","a":"הרגלה לחוסר היענות","w":["ויסות עצמי מצוין","אדישות מולדת","היקשרות בטוחה מאוד"],"e":"ילד שכבר לא מנסה למשוך את תשומת הלב של ההורה עשוי להעיד על הרגלה לחוסר ההיענות שלו, וזה מדאיג. זה לא ויסות עצמי."}]},
"q28":{"t":"t5","v":[{"q":"מה נמצא לגבי ילדים גדולים יותר בארוחות?","a":"חלקם לא הוטרדו, כי עסקו בדבר אחר","w":["כולם הוטרדו מאוד מההורה בטלפון","כולם השתמשו בטלפון בעצמם","הם עזבו את השולחן ויצאו לשחק"],"e":"חלק מהילדים הגדולים יותר בארוחות לא נראו מוטרדים, כי עסקו בדבר אחר, כמו צעצוע או שיחה."},{"q":"האם נחקר ישירות מה ילדים חושבים על השימוש של ההורים בזמן אינטראקציה?","a":"לא, לפי הכותבות","w":["כן, בהרבה מחקרים","כן, רק אצל מתבגרים","כן, רק אצל פעוטות"],"e":"לפי הכותבות, עוד לא היה מחקר שבדק ישירות מה ילדים חושבים על השימוש של ההורים בזמן אינטראקציה. זה פער מחקרי."}]},
"q29":{"t":"t5","v":[{"q":"במחקר של Stupica, ילדים רצו בין בסיסים בבייסבול. מה קרה כשההורה היה בטלפון?","a":"הם רצו לאט יותר ומעדו יותר","w":["הם רצו מהר יותר מבדרך כלל","לא היה שום הבדל בביצוע","הם סירבו להמשיך לשחק בכלל"],"e":"Stupica (2016) מצאה שכשההורים היו בטלפון, הילדים רצו לאט יותר בין הבסיסים, ונטו יותר למעוד וליפול."},{"q":"כל ילד חווה גם הורה קשוב וגם הורה בטלפון, בסדר אקראי. איזה מערך זה?","a":"מדידות חוזרות","w":["מערך בין־נבדקי","מחקר מתאמי","מחקר אורך"],"e":"כל ילד חווה את שני המצבים, הורה קשוב והורה בטלפון, בסדר מאוזן ואקראי. זה מערך של מדידות חוזרות, ולא מערך בין־נבדקי."}]},

"q41":{"t":"t6","v":[{"q":"אילו ילדים מקבלים טלפון להרגעה יותר מאחרים?","a":"ילדים עם קשיים רגשיים־חברתיים","w":["ילדים רגועים במיוחד","ילדים בכורים במשפחה","ילדים שגרים בעיר גדולה"],"e":"ילדים עם קשיים רגשיים־חברתיים מקבלים טלפון להרגעה יותר מאחרים. זה עלול ליצור מעגל בעייתי."},{"q":"הורים נותנים לילד טאבלט בכל פעם שהוא בוכה. מה החשש?","a":"פגיעה בפיתוח ויסות עצמי","w":["שיפור בכישורי שפה","פגיעה בראייה בלבד","שיפור ביכולת להעסיק את עצמו"],"e":"נתינת מכשיר לילד בכל פעם שהוא בוכה עלולה לפגוע ביכולת שלו להעסיק את עצמו ובפיתוח ויסות עצמי. הוא לומד שהמכשיר מרגיע, ולא הוא עצמו."}]},
"q43":{"t":"t6","v":[{"q":"אמא מעלה לאינסטגרם תמונות מביכות של בתה בלי לשאול. מה המונח?","a":"שרנטינג","w":["עיוורון קשב","הסחת מסך","השערת ההחלפה"],"e":"״שרנטינג״ הוא שיתוף של תמונות או סיפורים על הילדים ברשתות, בלי רשות הילדים. העלאת תמונות מביכות בלי לשאול היא בדיוק זה."},{"q":"מה עושים חלק מהילדים בזמן קונפליקט משפחתי?","a":"מתנתקים דרך הרשתות החברתיות","w":["מתקשרים לשוטרים","בורחים מהבית לחברים","מספרים למורה בבית הספר"],"e":"לפי הסקירה, חלק מהילדים מתנתקים מהמשפחה דרך הרשתות החברתיות בזמן קונפליקט משפחתי."}]},
"q44":{"t":"t6","v":[{"q":"מה עושים ילדים כשההורים מפרים את כללי השימוש בבית?","a":"נוזפים ומבקשים שיכבו את הטלפון","w":["מתעלמים מזה לגמרי","מפרים את הכללים בעצמם","מספרים לסבים ולסבתות"],"e":"כשהורים מפרים את כללי השימוש בבית, ילדים נוזפים בהם ומבקשים שיכבו את הטלפון ויקדישו זמן למשפחה. הם לא מתעלמים."},{"q":"מה עלול לקרות לחוויה ההורית כשמכשירים באים על חשבון האינטראקציה?","a":"פחות חוויות הוריות חיוביות","w":["יותר חוויות הוריות חיוביות","אין השפעה על ההורים","ההורים ירגישו בטוחים יותר"],"e":"כשמכשירים באים על חשבון האינטראקציה עם הילד, ההורים עלולים לחוות פחות חוויות הוריות חיוביות. המחיר הוא גם להורים, לא רק לילדים."}]},
"q45":{"t":"t7","v":[{"q":"איזה מהבאים לא עלה כנושא מרכזי בסקירה?","a":"שיפור בהישגים הלימודיים","w":["מתח בין עבודה למשפחה","הסחה בזמן השגחה","תגובות הילדים"],"e":"שיפור בהישגים הלימודיים של הילדים לא היה נושא מרכזי בסקירה, ולא נבדק. מתח בין עבודה למשפחה, הסחה בזמן השגחה ותגובות הילדים כן היו."},{"q":"מה מראות התוצאות האמפיריות לפי המסקנות?","a":"מגוון רחב של תגובות ועמדות","w":["תגובה אחידה אצל כל ההורים","רק השפעות חיוביות על המשפחה","רק השפעות שליליות על הילדים"],"e":"לפי המסקנות, התוצאות האמפיריות מראות מגוון רחב של תגובות ועמדות כלפי השימוש, ולא תגובה אחידה."}]},
"q47":{"t":"t7","v":[{"q":"כמה מהילדים בסקר AVG אמרו שהם מרגישים לא חשובים כשההורה בטלפון?","a":"32%","w":["5%","52%","80%"],"e":"32% מהילדים בסקר AVG אמרו שהם מרגישים לא חשובים כשההורה בטלפון, כשליש."},{"q":"ילד אומר: ״הלוואי שאמא תאבד את הטלפון״. למה, לפי הסקר?","a":"כי אז היא תשים לב אליו","w":["כי הוא רוצה את הטלפון","כי הטלפון רועש מדי","כי הוא מקנא בחברים"],"e":"ילדים אמרו שישמחו אם ההורים יאבדו את הטלפון, כי אז ישימו לב אליהם. זה ביטוי לצורך בקשב."}]},
"q48":{"t":"t7","v":[{"q":"מה הרגישו מתבגרים כשההורים היו בטלפון במקום להקשיב?","a":"נפגעים, אבל היססו לספר","w":["אדישים לגמרי לזה","שמחים על הפרטיות","כועסים, ואמרו מיד"],"e":"מתבגרים הרגישו נפגעים כשההורים היו בטלפון במקום להקשיב להם, אבל היססו לספר להורים. הם לא היו אדישים."},{"q":"כמה מההורים בסקר AVG אמרו שהם בודקים את הטלפון יותר מדי?","a":"52%","w":["10%","32%","90%"],"e":"52% מההורים בסקר AVG אמרו שהם בודקים את הטלפון יותר מדי. כלומר, הם מודעים לבעיה."}]},
"q49":{"t":"t7","v":[{"q":"כמה מתוך 27 המחקרים מדדו ישירות את שימוש ההורים ליד הילדים?","a":"2, בדיווח עצמי","w":["כל ה-27","כ-15","אף אחד"],"e":"רק 2 מתוך 27 המחקרים מדדו ישירות את השימוש של ההורים ליד הילדים, וגם הם בדיווח עצמי רטרוספקטיבי."},{"q":"איך הכותבות מציעות לשפר את דיוק המדידה?","a":"אפליקציית מעקב או ניסוי","w":["יותר שאלונים להורים","ראיונות עם הסבים","שאלות לגננות"],"e":"הכותבות מציעות לשפר את הדיוק בעזרת אפליקציית מעקב, או מניפולציה ניסויית של השימוש, במקום דיווח עצמי."}]},
"q50":{"t":"t7","v":[{"q":"איזה צד של השימוש כמעט לא נחקר?","a":"איך מכשירים מחזקים את הקשר","w":["איך מכשירים מסיחים","כמה זמן הורים בטלפון","מה ילדים עושים בטלפון"],"e":"כמעט לא נחקר איך מכשירים יכולים לחזק את הקשר הורה־ילד, כלומר הצד החיובי. רוב המחקר עסק בהסחה."},{"q":"מה מצאו Lauricella ועמיתים (2015) לגבי זמן המסך של ילדים?","a":"הוא קשור גם לזמן המסך של ההורים","w":["הוא לא קשור להורים בכלל","הוא קשור רק לגיל של הילד","הוא קשור רק למין של הילד"],"e":"Lauricella ועמיתים (2015) מצאו שזמן המסך של ילדים קשור לגיל הילד, לעמדות ההורים כלפי טכנולוגיה, ולזמן המסך של ההורים עצמם."}]},
"q51":{"t":"t7","v":[{"q":"למה ״פשוט לכבות את הטלפון״ לא מציאותי?","a":"המכשירים שזורים בעבודה ובבית","w":["כי טלפונים לא באמת נכבים","כי הילדים מתנגדים לכך בתוקף","כי זה אסור לפי החוק"],"e":"המכשירים משולבים בעבודה, בבית ובפנאי, ויש גם אפשרות להתמכרות, ולכן ההמלצה ״פשוט לכבות את הטלפון״ לא מציאותית."},{"q":"זוג משוחח, והטלפון מונח כבוי על השולחן. מה מצאו Przybylski ו-Weinstein?","a":"עצם הנוכחות פוגעת באיכות השיחה","w":["אין השפעה כשהוא לא בשימוש","השיחה משתפרת","רק טלפון דולק משפיע"],"e":"Przybylski ו-Weinstein (2013) מצאו שעצם הנוכחות של טלפון, גם בלי שימוש, פוגעת בקרבה ובאיכות השיחה."}]},
"q52":{"t":"t7","v":[{"q":"מה ההנחיה הברורה להורים לפי הסקירה?","a":"להגביל את השימוש ליד הילדים","w":["להפסיק להשתמש לגמרי","לתת לילדים טלפון משלהם","להשתמש רק בלילה"],"e":"ההנחיה הברורה להורים היא להגביל את השימוש בטלפון ליד הילדים. לא להפסיק לגמרי."},{"q":"אמא עובדת מהבית, נמצאת בחדר עם הילד אבל מול המחשב. מה עלול הילד לחוות?","a":"אמא נוכחת אך לא זמינה רגשית","w":["אמא זמינה לו בכל רגע","אמא שנעדרת פיזית מהבית","אין לכך שום השפעה עליו"],"e":"הורים שעובדים מהבית נוכחים פיזית, אבל הילדים עלולים לחוות אותם כלא זמינים רגשית. נוכחות אינה זמינות."}]},
"q53":{"t":"t7","v":[{"q":"איזו מגבלה של הסקירה קשורה לטכנולוגיה?","a":"היא משתנה מהר מהמחקר","w":["היא לא נגישה לחוקרים","היא יקרה מדי למחקר","היא לא השתנתה כלל"],"e":"הטכנולוגיה משתנה מהר, וקשה למחקר להתעדכן בקצב שלה. זו מגבלה של הסקירה."},{"q":"למה אי אפשר להכליל מהממצאים?","a":"מדגמים קטנים ובלי נתוני אורך","w":["מדגמים גדולים מדי","כל המחקרים נערכו בישראל","כל המחקרים היו ניסויים"],"e":"אי אפשר להכליל מהממצאים, כי המדגמים קטנים, אין נתוני אורך, וחלק מהמקורות לא עברו ביקורת עמיתים."}]},
"h1":{"t":"t1","v":[{"q":"מה מבין הבאים אינו נחשב ״הסחת מסך הורית״ (PSD) לפי בלקמן?","a":"הורה וילד שצופים יחד בסרטון","w":["הורה שבודק הודעות בזמן ארוחה","הורה שגולל ברשת בזמן משחק בגן","הורה שעונה למייל בזמן האכלה"],"e":"PSD = רגעים שבהם ההורה מוסח מתפקיד ההורה. פעילות משותפת מול מסך, או מסך שדולק ברקע, לא נכללים."}]},
"h2":{"t":"t1","v":[{"q":"מה המחקר על טלוויזיה מלמד על השערת ההחלפה?","a":"טלוויזיה ברקע מזיקה, אבל צפייה משותפת יכולה לעזור","w":["כל חשיפה למסך פוגעת בשפה, בלי קשר לאופן הצפייה","צפייה משותפת פוגעת בשפה יותר מטלוויזיה ברקע","טלוויזיה לא משפיעה בכלל על האינטראקציה בין הורה לילד"],"e":"ההשפעה תלויה באופן השימוש: מסך שמחליף אינטראקציה פוגע; מסך משותף יכול להגביר אינטראקציה."}]},
"h3":{"t":"t3","v":[{"q":"הורים בגן השעשועים היו בטוחים ביכולת שלהם להשגיח תוך כדי שימוש בטלפון. מה קרה כשנשאלו מה הילד עושה?","a":"נעשו מתגוננים או ענו תשובות כלליות","w":["ענו בדיוק, מה שאישש את הביטחון שלהם","הניחו מיד את הטלפון והלכו לילד","ענו שהילד משחק עם הורה אחר"],"e":"פער בין הביטחון העצמי ליכולת בפועל. הורים גם הודו שהם שמים לב פחות לסביבה."}]},
"h4":{"t":"t4","v":[{"q":"מה מבין הבאים מראה שלעמדות ההורים כלפי הטלפון יש גם צד חיובי?","a":"רובם חושבים שהטלפון עוזר להשגחה, למידע ולארגון המשפחה","w":["רובם לא מרגישים שום אשמה על השימוש בטלפון ליד הילדים","רובם משתמשים פחות בטלפון כשהילדים לידם","רובם מכבים את הטלפון בזמן ארוחות משפחתיות"],"e":"65% חושבים שהטלפון הופך אותם להורים טובים יותר. במקביל יש מתחים ואשמה."}]},
"h5":{"t":"t5","v":[{"q":"בניסוי הבייסבול כל ילד חווה גם הורה קשוב וגם הורה בטלפון. מה היתרון של המערך הזה?","a":"כל ילד הוא הביקורת של עצמו","w":["אפשר להשוות בין ילדים בגילים שונים מאוד","אין צורך לאזן את סדר המצבים בין הילדים","הוא מראה השפעה לטווח ארוך על הקשר"],"e":"מערך תוך־נבדקי עם סדר מאוזן ואקראי. הממצא: עם הורה בטלפון רצו לאט יותר ונפלו יותר."}]},
"h6":{"t":"t5","v":[{"q":"חלק מהילדים לא ניסו בכלל למשוך את תשומת לב ההורה שהיה בטלפון כל הארוחה. למה זה מדאיג?","a":"זה עשוי להעיד על הרגלה לחוסר היענות של ההורה","w":["זה מעיד שהילדים היו עסוקים במסכים משלהם בזמן הארוחה","זה מעיד שהילדים לא רעבים","זה מעיד שההורה הציב גבולות ברורים"],"e":"החוקרים מציינים שזה עשוי להעיד שהילד התרגל לכך שההורה לא מגיב, ושצריך לחקור זאת."}]},
"h7":{"t":"t6","v":[{"q":"איזו פעילות בטלפון פגעה הכי פחות בקשר העין עם הילד?","a":"שיחה טלפונית","w":["הקלדת הודעות","גלילה ברשת","עבודה מול מחשב"],"e":"רדסקי: הורים שרק דיברו שמרו יותר על קשר עין. בולס ורוברטס: הכי פחות קשובים חזותית מול המחשב."}]},
"h8":{"t":"t7","v":[{"q":"למה ההמלצה ״פשוט להניח את הטלפון על השולחן בלי להשתמש״ לא מספיקה?","a":"עצם הנוכחות של טלפון פוגעת בקרבה ובאיכות השיחה","w":["כי ההורים לא מצליחים לעמוד בה לאורך זמן","כי הילדים מבקשים לשחק בטלפון שמונח לידם","כי ההתראות ממשיכות להישמע ולהסיח את הדעת של ההורה"],"e":"פשיבילסקי ווינשטיין: טלפון נוכח, גם בלי שימוש, פוגע בקרבה. ההנחיה הברורה: להגביל שימוש ליד ילדים."}]},

const SUM=`<h2>סיכום: השפעת השימוש של הורים במכשירים ניידים על האינטראקציה עם הילד (סקירת ספרות)</h2>
<div class="key"><b>על מה מדובר?</b> הורים בודקים את הטלפון ליד הילדים כל הזמן: בארוחה, בגן השעשועים, באוטו. המאמר הוא <b>סקירת ספרות</b>: הוא אוסף 27 מחקרים ומקורות (עד 2016) ומסדר אותם סביב ארבע שאלות: <b>איך</b> הורים משתמשים בטלפון ליד ילדים, מה הם <b>מרגישים</b> לגבי זה, איך <b>הילדים מגיבים</b>, ומה זה עושה ל<b>קשר</b>. התמונה שעולה: הורים מוסחים מגיבים לאט יותר ופחות ברגישות, ילדים נאבקים על תשומת לב (לפעמים בהתנהגות מסוכנת), אבל יש גם תועלת. והמחקר עוד בחיתוליו: מדגמים קטנים, כמעט בלי מדידה ישירה ובלי מעקב לאורך זמן.</div>

<h3>מילון לפני שמתחילים</h3>
<div class="tw"><table><tr><th>מילה</th><th>מה זה אומר בפשטות</th></tr>
<tr><td><b>סקירת ספרות</b></td><td>מאמר שלא אוסף נתונים חדשים, אלא מסדר ומסכם מחקרים קיימים.</td></tr>
<tr><td><b>השערת ההחלפה</b></td><td>זמן מסך בא על חשבון משהו אחר, למשל זמן עם הילד.</td></tr>
<tr><td><b>הסחת מסך הורית</b></td><td>רגעים שבהם ההורה מוסח מתפקיד ההורה בגלל מסך.</td></tr>
<tr><td><b>היענות ורגישות</b></td><td>כמה מהר ונכון ההורה מגיב לאותות של הילד.</td></tr>
<tr><td><b>שרנטינג</b></td><td>שיתוף תמונות או סיפורים על הילד ברשתות בלי לשאול אותו.</td></tr>
<tr><td><b>מחקר אורך</b></td><td>מחקר שעוקב אחרי אותם אנשים לאורך זמן.</td></tr></table></div>
<h3>הדוגמה שתלווה אותנו: אבא של נועם בארוחת ערב</h3>
<p>נועם (מהפרקים בספר), עכשיו בן 4, יושב לארוחת ערב. אבא שלו מחכה להודעה חשובה מהעבודה, והטלפון מונח ליד הצלחת. נחזור לרגע הזה בכל אחת מארבע השאלות.</p>

<h3>1. הרקע: למה זה מעניין</h3>
<ul>
<li>בארה״ב 77% מהמבוגרים עם סמארטפון ו־51% עם טאבלט, לעומת אחוזים בודדים עשור קודם. אנחנו <b>זמינים כל הזמן</b>, ולכן אפשר להיות מוסחים כל הזמן.</li>
<li><b>השערת ההחלפה:</b> הזמן מול מסך לא ״מתווסף״, הוא <b>בא על חשבון</b> משהו אחר, למשל זמן עם הילד. כל דקה שאבא גולל היא דקה שהוא לא מדבר עם נועם.</li>
<li><b>למה זה חשוב להתפתחות:</b> לפי תורת ההיקשרות, תגובה רגישה ומהירה של ההורה בונה ביטחון. אם הטלפון פוגע בה, הוא עלול לפגוע בעקיפין בהיקשרות. (אבל עוד אין מחקרי אורך שבדקו את זה.)</li>
<li><b>מה למדנו מטלוויזיה:</b> טלוויזיה שדולקת <b>ברקע</b> מפחיתה את מספר המילים והתגובות של ההורים, וקשורה לשפה פחות טובה. אבל צפייה <b>משותפת</b> של הורה וילד דווקא יכולה להגביר שיחה. כלומר, לא המסך עצמו קובע, אלא <b>איך</b> משתמשים בו.</li>
</ul>
<p>שתי הגדרות: <b>רמת שימוש</b> = עד כמה הקשב של ההורה מופנה למכשיר ולא לילד. <b>הסחת מסך הורית</b> = רגעים שבהם ההורה מוסח מתפקיד ההורה בגלל מסך. <b>לא</b> כולל צפייה משותפת או מסך שסתם דולק ברקע.</p>

<h3>2. ארבע השאלות של הסקירה</h3>
<h4>שאלה 1: איך הורים משתמשים בטלפון ליד ילדים?</h4>
<ul>
<li>35% משתמשים בו לעתים קרובות בזמן משחק עם הילד; 75% לפחות 3 פעמים ביום בזמן שהם משגיחים.</li>
<li><b>מתח בין עבודה למשפחה:</b> הטלפון מאפשר לנהל כמה תפקידים יחד, ויצר <b>ציפייה לענות מיד</b>. אבא של נועם מחכה להודעה כי בעבודה מצפים שיענה מהר. הורים נקרעים בין לרצות להיות זמינים לעבודה לבין לרצות להיות <b>נוכחים</b> למשפחה.</li>
<li><b>נהיגה:</b> מעל 80% מההורים דיווחו שהשתמשו בטלפון בזמן נהיגה עם ילדים ברכב, במיוחד ברמזורים.</li>
<li><b>גבולות:</b> הכלל הנפוץ: ״בלי טלפונים ליד השולחן״. אבל הורים מפרים אותו, ומתבגרים מעירים להם על <b>הסטנדרט הכפול</b>. מעניין: עם מתבגרים הורים משתמשים בטלפון כדי <b>להתחבר</b> אליהם; עם ילדים קטנים, כדי <b>להתנתק</b> מהם לרגע ולהתחבר למבוגרים.</li>
</ul>
<h4>שאלה 2: מה ההורים מרגישים?</h4>
<p>רגשות <b>מעורבים</b>. בראיונות עם 35 הורים עלו שלושה מתחים: <b>קוגניטיבי</b> (עייפות מלנהל כמה תפקידים יחד), <b>רגשי</b> (אשמה, וויכוחים במשפחה) ו<b>הורה־ילד</b> (הטלפון מפריע לזמן עם הילד). חלק מרגישים שהורים אחרים שופטים אותם. מצד שני, <b>65%</b> חושבים שהטלפון הופך אותם להורים <b>טובים יותר</b>: הוא עוזר להשגיח, לקבל מידע ועצות, ולתאם את חיי המשפחה.</p>
<h4>שאלה 3: איך הילדים מגיבים?</h4>
<ul>
<li>ילדים <b>מתחרים בטלפון</b> על תשומת הלב. מה הכי הטריד ילדים קטנים: <b>בדיקות קצרות וחוזרות</b>, ושקיעה ארוכה במסך.</li>
<li><b>סימן מדאיג:</b> חלק מהילדים בכלל <b>לא ניסו</b> למשוך את תשומת לב ההורה שהיה בטלפון כל הארוחה. אולי הם כבר התרגלו לכך שלא מגיבים להם.</li>
<li><b>ניסוי ״מגרש הבייסבול״:</b> ילדים בני 3–12 רצו סביב בסיס, כשההורה פעם קשוב ופעם בטלפון (כל ילד עבר את שני המצבים, כך שכל ילד היה ״ביקורת של עצמו״). כשההורה היה בטלפון, הילדים רצו לאט יותר ונפלו יותר.</li>
<li><b>בטיחות:</b> ילדים שלא משגיחים עליהם עושים דברים מסוכנים כדי למשוך תשומת לב, והורים מוסחים פחות מזהירים. הורים השאירו ילדים קטנים לבד באמבטיה כדי לענות לטלפון; בחוף, רבע מההורים היו מוסחים. ובגן השעשועים הורים היו בטוחים שהם משגיחים טוב, אבל כששאלו אותם מה הילד עושה עכשיו, ענו בכלליות או נעשו מתגוננים.</li>
</ul>
<h4>שאלה 4: מה זה עושה לקשר?</h4>
<ul>
<li><b>פחות תקשורת:</b> אמהות מוסחות דיברו פחות עם הילדים בארוחה, במיוחד כשהוגש <b>מאכל חדש</b>: הילדים קיבלו פחות עידוד וניסו אותו פחות.</li>
<li><b>תגובה איטית ופחות רגישה:</b> כשנועם מנסה להראות לאבא משהו, אבא מגיב באיחור, לפעמים בנזיפה בלי להרים את העיניים מהמסך, ולפעמים בכלל לא. (אבל יש הורים שאחרי ההסחה נעשים <b>יותר</b> קשובים.)</li>
<li><b>תלוי מה עושים בטלפון:</b> הורים ש<b>דיברו</b> בטלפון שמרו יותר על קשר עין עם הילד מהורים ש<b>הקלידו או גללו</b>.</li>
<li><b>האכלת תינוקות:</b> אמהות מוסחות היו פחות רגישות לסימנים שהתינוק שבע, ולכן בסיכון להאכלת יתר.</li>
<li><b>המכשיר כמרגיע:</b> הורים נותנים לילד טלפון כדי להעסיק או להרגיע אותו, במיוחד לילדים עם קשיים רגשיים. החשש: הילד לא ילמד להרגיע את עצמו. (עוד לא נבדק.)</li>
<li><b>קונפליקט ו״שרנטינג״:</b> הטלפון הפך למקור לוויכוחים בבית. <b>שרנטינג</b> = הורה שמשתף תמונות או סיפורים על הילד ברשתות <b>בלי לשאול אותו</b>. מתבגרים כועסים ונבוכים.</li>
</ul>

<h3>3. מסקנות והמלצות</h3>
<p>שלושה נושאים חוזרים: <b>שקיעה במכשיר</b>, <b>בטיחות</b> ו<b>עמדות מעורבות</b>, ומעליהם <b>ירידה בהיענות וברגישות</b> של ההורה. מה הילדים אומרים? בסקרים (לא מחקריים) ילדים אמרו שהיו שמחים אם ההורים יאבדו את הטלפון, ומתבגרים הרגישו נפגעים אבל לא סיפרו.</p>
<p><b>מה להמליץ להורים?</b> ״פשוט לכבות את הטלפון״ לא מציאותי, כי הוא חלק מהעבודה ומהחיים. וגם להניח אותו על השולחן לא עוזר: <b>עצם הנוכחות</b> של טלפון, גם בלי שימוש, פוגעת בקרבה ובאיכות השיחה. ההמלצות: לא בארוחות ובמשחק, לצפות במדיה יחד עם הילד, ותוכנית מדיה משפחתית. וההנחיה הברורה: <b>להגביל את השימוש ליד הילדים</b>. אצל נועם: לשים את הטלפון בחדר אחר בזמן הארוחה.</p>

<h3>4. מה עוד לא ידוע (מגבלות)</h3>
<ul>
<li>רק <b>2 מתוך 27</b> מחקרים מדדו ישירות כמה זמן הורים משתמשים ליד הילדים, וגם אלה לפי מה שההורים זכרו (אפליקציית מעקב הייתה מדויקת יותר).</li>
<li>לא נבדק: באיזו פעילות בטלפון מדובר, למה משתמשים (עבודה או פנאי), מה הילדים מרגישים, והצד החיובי (איך טלפון יכול לחבר).</li>
<li>מדגמים קטנים, רובם מארה״ב, חלק בלי ביקורת עמיתים, ו<b>אין מחקרי אורך</b>. והטכנולוגיה משתנה מהר מהמחקר.</li>
</ul>

<h3>השורה התחתונה: מה רוצים ממך</h3>
<div class="key"><b>המאמר בחמישה משפטים:</b><br>
1. זו <b>סקירת ספרות</b> של 27 מקורות, סביב ארבע שאלות: שימוש, רגשות ההורים, תגובות הילדים, והקשר.<br>
2. הורים משתמשים בטלפון ליד הילדים הרבה, גם בנהיגה, בגלל <b>מתח בין עבודה למשפחה</b>, והרגשות שלהם <b>מעורבים</b>: אשמה, אבל גם תועלת (65%).<br>
3. ילדים <b>מתחרים</b> בטלפון על תשומת לב, לפעמים בהתנהגות מסוכנת, והורים מוסחים משגיחים פחות טוב.<br>
4. הורה מוסח מדבר פחות ומגיב <b>לאט ופחות ברגישות</b>; שיחה בטלפון פוגעת פחות מהקלדה וגלילה.<br>
5. ההמלצה היא <b>להגביל</b> את השימוש ליד הילדים, אבל המחקר בחיתוליו: מדגמים קטנים, מדידה עקיפה, <b>בלי מחקרי אורך</b>.<br><br>
<b>מה צריך לדעת לעשות במבחן:</b><br>
• להסביר את השערת ההחלפה ואת הקשר לתורת ההיקשרות.<br>
• להגדיר הסחת מסך הורית, ולדעת מה לא נכלל בה.<br>
• לתאר ממצאים מכל אחת מארבע השאלות, כולל ניסוי ״מגרש הבייסבול״.<br>
• להסביר למה ״פשוט לכבות״ לא מציאותי, ומה ממליצים במקום.<br>
• למנות את המגבלות של המחקר בתחום.</div>
