}

  --t1:#f08a64; --t2:#7ea4f5; --t3:#4fcab9; --t4:#b58cf0; --t5:#e8b445; --t6:#6cc0e6; --t7:#ef8fb2; --t8:#b8cc7a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}

.eyebrow{font-size:.8rem;letter-spacing:.05em;font-weight:600;color:var(--c,var(--muted))}

/* home */

.cover-art{background:var(--raised);border-bottom:1px solid var(--line);padding:8px 8px 0}

.tcard .n{font-family:var(--display);font-size:2rem;font-weight:900;line-height:1;opacity:.85}
.tcard .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}

.opt.right{background:var(--good-soft);border-color:var(--good);opacity:1}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:12px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:22px;height:22px;margin-top:2px}
.fb.ok{background:var(--good-soft)} .fb.ok svg{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no svg{color:var(--bad)}
.fb strong{display:block}

@media (prefers-reduced-motion:no-preference){.fade{animation:f .3s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
h1,h2,h3,.big,.tcard .n,.who .av{font-weight:400}
.card p,.def p,.tile span,.ex p{font-weight:500}
.qtext{font-weight:700}
.tile b,.who b{font-weight:700}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap{overflow-x:auto}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}

  {h:"התניה אופרנטית",html:`${def("התניה אופרנטית",`<mark>התניה אופרנטית</mark> ${E("Operant conditioning")}: התינוק <b>פועל</b> על הסביבה, והגירויים שבאים אחרי ההתנהגות משנים את הסיכוי שתחזור. <mark>גורם מחזק</mark> ${E("Reinforcer")} מגדיל את ההתנהגות (נוזל מתוק מחזק מציצה). <mark>עונש</mark> ${E("Punishment")}: הסרת גירוי רצוי או הצגת גירוי לא נעים כדי להפחית התנהגות (נוזל חמוץ גורם להפסיק למצוץ).`)}${tiles([["hand","יילודים","מוצצים מהר יותר מפטמה שמשמיעה קולות ומראות מעניינים: צורות, מוזיקה, קולות אנושיים"],["moon","פגים","הידקו מגע עם דובון ש״נושם״ בקצב שלהם, והרפו מדובון שלא נשם"],["gear","מובייל","תינוקות בני 2 עד 6 חודשים שהרגל שלהם קשורה למובייל בועטים במרץ כדי להזיז אותו"]])}${rem("התניה אופרנטית היא כלי חזק לבדוק מה תינוקות <b>תופסים ומעדיפים</b>, ואת הזיכרון והקטגוריות שלהם (המובייל). היא חשובה גם <b>ליחסים חברתיים</b>: התינוק מביט ומחייך, המבוגר מחייך בחזרה, וכל אחד מחזק את השני. זה תורם להיקשרות.")}${ex(`תינוק שגילה שכשהוא מחייך, אבא מחייך אליו בחזרה ומדבר אליו. הוא מחייך יותר ויותר. התוצאה הנעימה (חיזוק) הגבירה את ההתנהגות.`)}<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>התניה קלאסית</th><th>התניה אופרנטית</th></tr></thead><tbody><tr><td><b>מה התינוק לומד</b></td><td>ששני גירויים באים יחד</td><td>שלמעשה שלו יש תוצאה</td></tr><tr><td><b>התינוק</b></td><td>סביל: מגיב</td><td>פעיל: עושה משהו</td></tr><tr><td><b>מה קורה קודם</b></td><td>הגירוי לפני התגובה</td><td>ההתנהגות לפני התוצאה</td></tr><tr><td><b>דוגמה</b></td><td>ליטוף ← יניקה</td><td>חיוך ← אבא מחייך</td></tr></tbody></table></div>`,q:"q3"}

 {id:"t2",icon:"brain",title:"התרגלות וחיקוי",blocks:[
  {h:"התרגלות והחלמה",html:`${def("על מה הנושא",`עוד שתי דרכים שבהן תינוקות לומדים: להתעלם ממה שכבר מוכר ולהתעניין בחדש, ולהעתיק את מה שאחרים עושים.<br><b>מה נלמד כאן:</b> התרגלות והחלמה · חיקוי · נוירוני מראה`)}${def("מושגי מפתח",`<mark>התרגלות</mark> ${E("Habituation")}: ירידה הדרגתית בעוצמת התגובה לגירוי שחוזר שוב ושוב (מבט, קצב לב, נשימה ופעילות מוח יורדים). <mark>החלמה</mark> ${E("Recovery")}: כשמופיע גירוי חדש, התגובה חוזרת לרמה גבוהה. כך הקשב מתמקד במה שפחות מוכר.`)}${fig("habit","שימוש בהתרגלות לחקר הזיכרון (תרשים 5.10)")}<p>החלמה לגירוי חדש, <mark>העדפת החדש</mark> ${E("Novelty preference")}, בודקת <b>זיכרון קרוב</b>. ככל שהזמן מההתרגלות מתארך, התינוקות עוברים ל<mark>העדפת המוכר</mark> ${E("Familiarity preference")}, וכך אפשר לבדוק <b>זיכרון רחוק</b>, אפילו של שבועות וחודשים. השיטה משמשת גם בפגים, ואפילו בעוברים בשליש האחרון (קצב לב וגלי מוח).</p>${rem("עם הגיל תינוקות מתרגלים ומחלימים <b>מהר יותר</b>: הם מעבדים מידע ביעילות. אבל הממצאים לא חד־משמעיים: כשהתגובה יורדת ואז חוזרת, לא ברור לגמרי <b>מה התינוק באמת יודע</b> על הגירוי.")}${ex(`תינוק מסתכל על בובה חדשה, ואחרי דקה מאבד עניין (התרגלות). מראים לו בובה אחרת, והוא שוב מסתכל בעניין (החלמה). כך יודעים שהוא מבחין בין השתיים.`)}`,q:"q5"},
  {h:"חיקוי: המחלוקת",html:`${def("חיקוי",`<mark>חיקוי</mark> ${E("Imitation")}: העתקת התנהגות של אדם אחר. מלצוף ומור (1977) הראו יילודים שמחקים הוצאת לשון ופתיחת פה, בתרבויות רבות. גם שימפנזים יילודים מחקים.`)}${tiles([["x","הספקנים","יש מחקרים שלא שחזרו. תנועות פה ולשון מתרבות כמעט לכל גירוי מעניין (מוזיקה, אורות), אז ״החיקוי״ הוא אולי תגובת חקר. בגיל 2 עד 3 חודשים קשה יותר לגרום לחיקוי, אז אולי זה רפלקס אוטומטי שחולף"],["check","התומכים","יילודים מחקים במאמץ ובהחלטיות גם אחרי השהיה. החיקוי לא נעלם: תינוקות גדולים יותר קודם מנסים החלפת מבטים, חיוך והמייה, אבל כשמבוגר חוזר על תנועה שוב ושוב הם מחקים"]])}${rem("לפי <b>מלצוף</b>, החיקוי של יילודים דומה לזה של ילדים ומבוגרים: <b>ניסיון פעיל</b> להתאים את תנועות הגוף שהם מרגישים לתנועות שהם רואים.")}${ex(`אבא מוציא לשון לתינוק בן כמה ימים, והתינוק מוציא לשון בחזרה.`)}`,q:"q7"},
  {h:"נוירוני מראה ותפקיד החיקוי",html:`${def("נוירוני מראה",`<mark>נוירוני מראה</mark> ${E("Mirror neurons")}: תאים באזורים מוטוריים של הקורטקס אצל פרימטים, שיורים <b>באותה צורה</b> כשרואים או שומעים פעולה וכשמבצעים אותה. אצל בני אדם הם נחשבים לבסיס של חיקוי, שיתוף אמפתי ברגשות והבנת כוונות.`)}${ex("בהדמיה (אינפרא־אדום) נמצא שאצל בני 6 חודשים ומבוגרים אותם אזורים מוטוריים הופעלו כשצפו באדם מקיש על קופסה שקופץ ממנה צעצוע וכשביצעו פעולה בעצמם, אבל <b>לא</b> כשצפו בכדור שמתנדנד לבד כמו מטוטלת.")}<p>הדעה של מלצוף עדיין שנויה במחלוקת: יש שטוענים שלומדים לחקות <b>בהדרגה</b> מהתנסות חברתית. כולם מסכימים שכדי להיות חקיינים מיומנים צריך הרבה הזדמנויות לראות את עצמך, לראות תגובות של אחרים ולשחק משחקי חיקוי. כנראה מערכות המראה פועלות מהלידה אבל מתפתחות זמן רב.</p>${rem("החיקוי הוא כלי למידה חזק: התינוק חווה אחרים <b>״כמוני״</b> ולומד על עצמו, המבוגרים יכולים ללמד אותו להתנהג כראוי, והמשחק ההדדי מחזק את הקשר הורה־ילד.")}`,q:"q9"}
 ]},
 {id:"t3",icon:"hand",title:"התפתחות מוטורית כמערכת",blocks:[
  {h:"הרצף והמשמעות החברתית",html:`${def("על מה הנושא",`ישיבה, זחילה, הליכה: כולם עוברים את זה, אבל לא כולם באותו סדר ובאותו זמן. הנושא מסביר למה, דרך גישת המערכות הדינמיות.<br><b>מה נלמד כאן:</b> מוטוריקה גסה ועדינה · מערכות דינמיות · מחקר מיקרו־גנטי`)}<p>מיומנויות מוטוריות משנות את העולם של התינוק: ישיבה נותנת נקודת מבט חדשה, הושטת יד מאפשרת ללמוד על חפצים, ותנועה עצמאית מכפילה את החקירה. הן משנות גם את <b>היחסים</b>: כשקייטלין התחילה לזחול ההורים התחילו לומר ״לא״, וכשהלכה הגיעה ״בחינת הרצונות״ הראשונה. מצד שני, הולכים מתחילים יוזמים יותר קשר, והורים מגיבים ביותר דיבור, חיבה ומשחק.</p>${def("שני סוגים",`<mark>מוטוריקה גסה</mark> ${E("Gross-motor")}: תנועה בסביבה, כמו זחילה, עמידה והליכה. <mark>מוטוריקה עדינה</mark> ${E("Fine-motor")}: תנועות קטנות, כמו הושטת יד ואחיזה.`)}${motorTable}${rem("טווחי הגיל רחבים: יש הבדלים אישיים גדולים ב<b>קצב</b>. תינוק שמאחר בהושטה לא בהכרח יאחר בזחילה. דואגים רק אם <b>הרבה</b> מיומנויות מתאחרות מאוד.")}${ex(`<b>מוטוריקה גסה</b>: זחילה, עמידה, הליכה. <b>מוטוריקה עדינה</b>: לתפוס כפית, להעביר קוביה מיד ליד.`)}`,q:"q11"},
  {h:"תיאוריית המערכות הדינמיות",html:`<p>פעם חשבו שאבני הדרך הן יכולות נפרדות ומולדות שמופיעות בסדר קבוע לפי לוח זמנים של בשילה. זה נשלל. היום: המיומנויות <b>מתואמות</b>, כל אחת בנויה על קודמות ותורמת לחדשות, וכל ילד מגיע אליהן בדרכו (גרייס, ששכבה בערסל בקמבודיה, נעמדה והלכה <b>לפני</b> שזחלה).</p>${def("מושג מפתח",`<mark>תיאוריית המערכות הדינמיות של ההתפתחות המוטורית</mark> ${E("Dynamic systems theory")}: שליטה מוטורית היא רכישת <b>מערכות פעולה</b> מורכבות יותר ויותר. יכולות נפרדות משתלבות: בעיטות, נדנוד על ארבע והושטה יוצרים זחילה, וזחילה, עמידה וצעידה יוצרות הליכה.`)}${fig("dyn","כל מיומנות חדשה היא תוצר משותף של ארבעה גורמים")}${rem("מה מאיץ שינוי משתנה עם הגיל: בהתחלה <b>גדילת המוח והגוף</b>, ואחר כך <b>מטרות</b> התינוק ו<b>תמיכה מהסביבה</b>. גם הסביבה הפיזית: תינוקות עם מדרגות בבית לומדים לזחול עליהן מוקדם יותר, ועל הירח היו מעדיפים לקפץ.")}${ex(`כמו שהליכה של תינוק לא "נדלקת" בגיל מסוים, אלא נבנית מחיבור של כמה דברים: שרירים חזקים מספיק, שיווי משקל, רצון להגיע לצעצוע, ורצפה שמאפשרת לנסות.`)}`,q:"q13"},
  {h:"המערכת בפעולה",html:`<p>מיומנות חדשה <b>מעודנים</b> בהדרגה (״זחילת בטן״ של קייטלין), ותינוקות נעים קדימה ואחורה בין ביצוע ואי־ביצוע. מיומנות ישנה יכולה להיעשות פחות יציבה זמנית (ישיבה בתחילת ההליכה): <b>אובדן יציבות</b> הוא שלב הכרחי במעבר למצב יציב יותר.</p>${tiles([["clock","תרגול","פעוטות שלומדים ללכת מתאמנים 6 שעות ביום ויותר, הולכים מעל 3 ק״מ, ונופלים 32 פעמים בשעה בממוצע, כמעט בלי לבכות"],["question","פתרון בעיות","מחליקים בשיפוע, מסתובבים בפתח צר. כשהנפילה מכאיבה הם נסוגים ומקשיבים לאם (״קדימה״ או ״עצור״)"],["copies","שילוב","הליכה משחררת ידיים לנשיאה, ובאופן מפתיע תינוקות נושאי חפצים נופלים פחות"]])}${def("רגליים תחילה",`במחקר מיקרו־גנטי (גאלוויי ות׳לן) תינוקות הושיטו <b>רגליים</b> לצעצוע כבר בגיל <b>8 שבועות</b>, חודש לפני הידיים. הסיבה: מפרק הירך מגביל פחות מהכתף. הסדר תלוי באנטומיה, בסביבה ובמאמץ, לא בתוכנית קבועה מראש.`)}${rem("לכן הגנטיקה יכולה רק <b>לשרטט בקווים כלליים</b> את ההתפתחות המוטורית: המיומנויות נבנות מרכיבים רבים, ויש מסלולים שונים לאותה מיומנות.")}`,q:"q15"}
 ]},
 {id:"t4",icon:"leaf",title:"תרבות והושטת יד",blocks:[
  {h:"שונות תרבותית",html:`${def("על מה הנושא",`התרבות משפיעה גם על מתי ילדים הולכים. ומיומנות אחת חשובה במיוחד: היכולת להושיט יד ולתפוס.<br><b>מה נלמד כאן:</b> שונות תרבותית · קדם־הושטה · הושטה ואחיזה`)}${ex("<b>דניס</b> צפה בתינוקות בבתי יתומים באיראן ששכבו על הגב בעריסות בלי צעצועים. רובם לא נעו לבד עד גיל שנתיים, וכשנעו הם התקדמו <b>בישיבה</b> ולא בזחילה. לכן נתקלו ברהיטים ברגליים ולא בידיים, ופחות נעמדו. עד גיל 3 עד 4 רק 15% הלכו לבד.")}${tiles([["x","לא מעודדים","אימהות ביפן חושבות שזה מיותר. בזינקנטן (מקסיקו) ואצל הגוסי (קניה) תינוק שהולך לפני שיודע להתרחק מאש ומנול נחשב מסוכן"],["check","מעודדים","הקיפסיגיס (קניה) ומוצא אינדיאני בג׳מייקה: מושיבים בבורות עם שמיכות, מקפיצים ומתרגלים את רפלקס הצעידה. התינוקות יושבים והולכים מוקדם יותר, ולעתים מדלגים על הזחילה"]])}${rem("במערב משכיבים לישון על הגב (נגד מוות בעריסה), וזה מפחית ״זמן בטן״ ומעכב גלגול, ישיבה וזחילה. השכבה קבועה על הבטן <b>בשעות הערות</b> מונעת את העיכוב.")}`,q:"q17"},
  {h:"הושטת יד ואחיזה",html:`<p>הושטת יד חשובה כנראה במיוחד להתפתחות הקוגניטיבית: בתפיסה, היפוך ושחרור חפצים לומדים על מראה, קול ומגע.</p>${fig("reach","מתנועות גסות לשליטה עדינה (תרשים 5.14)")}${def("קדם־הושטה",`<mark>קדם־הושטה</mark> ${E("Prereaching")}: חבטות לא מתואמות של יילודים לעבר חפץ, שלרוב לא נוגעות בו. היא נעלמת בערך ב<b>7 שבועות</b>, וב־3 עד 4 חודשים חוזרת הושטה מכוונת שהולכת ומדייקת.`)}<p>בגיל 5 עד 6 חודשים מושיטים יד גם <b>בחושך</b>: ההושטה נשלטת בעיקר על ידי <mark>פרופריוספציה</mark> ${E("Proprioception")}, תחושת התנועה והמיקום בגוף, והראייה מתפנה להתאמות עדינות. בגיל 4 חודשים מכוונים לפני חפץ נע, ב־7 חודשים מושיטים יד אחת. <mark>אחיזה אלנרית</mark> ${E("Ulnar grasp")}, אצבעות שנסגרות לכף היד, מחליפה את רפלקס האחיזה. ב־4 עד 5 חודשים שתי הידיים עובדות יחד ומעבירים מיד ליד, ובסוף השנה <mark>אחיזת פינצטה</mark> ${E("Pincer grasp")}: אגודל ואצבע מורה (צימוקים, כפתורים).</p>${rem("בין 8 ל־11 חודשים ההושטה כבר שולטת, והקשב עובר <b>למה שקורה לפני ואחרי</b>: מושיטים מהר יותר כשמתכוונים לזרוק מאשר להפיל בזהירות, ומחפשים צעצוע מוסתר.")}${ex(`<b>קדם־הושטה</b>: יילוד שמניף יד לכיוון צעצוע ונוגע בו כמעט במקרה. רק בגיל 3–4 חודשים ההושטה הופכת מכוונת ומדויקת.`)}`,q:"q19"},
  {h:"ניסיון מוקדם והושטת יד",html:`${tiles([["people","הקונג (בוצוואנה)","נישאים על המותן, אוחזים בשרשראות של האם ומשחקים בתכשיטים: הושטה ואחיזה מתקדמות"],["clock","מאלי ואוגנדה","חצי יום ויותר בישיבה או עמידה, שמקלות על ההושטה: מיומנויות ידיים מוקדם יותר מבמערב"]])}${ex("במחקר של וייט והלד (1966) תינוקות במוסד עם גרייה <b>מתונה</b> (צורות פשוטות ואז מובייל) הושיטו יד <b>6 שבועות</b> לפני תינוקות בלי גרייה. קבוצה עם גרייה <b>מרובה</b> (מגיני מיטה מעוצבים ומוביילים מוקדם) הושיטה מוקדם מהקבוצה בלי גרייה, אבל הסיטה מבט, בכתה הרבה, והתקדמה <b>פחות</b> מהקבוצה המתונה.")}${rem("יותר גרייה אינה בהכרח טובה יותר. לדחוף תינוקות מעבר למוכנות שלהם עלול <b>לפגוע</b> בהתפתחות מיומנויות חשובות.")}`,q:"q21"}
 ]},
 {id:"t5",icon:"phone",title:"שמיעה ותפיסת דיבור",blocks:[
  {h:"מוזיקה, דיבור וכוונון",html:`${def("על מה הנושא",`מה תינוק שומע ואיך הוא מבין דיבור? הנושא מתחיל בהבדל בין תחושה לתפיסה, ואז מראה איך התינוק מתכוונן לשפה שלו.<br><b>מה נלמד כאן:</b> תחושה מול תפיסה · הצרה תפיסתית · למידה סטטיסטית`)}${def("תחושה ותפיסה",`<mark>תחושה</mark> ${E("Sensation")}: תהליך סביל, מה שהקולטנים מזהים. <mark>תפיסה</mark> ${E("Perception")}: פעילה, ארגון ופירוש של מה שקולטים.`)}<p>טימי בן השנה דרש את השיר שהוא אוהב: תינוקות מתחילים <b>לארגן קולות בדפוסים</b>. בגיל 4 עד 7 חודשים מעדיפים מינואטים של מוצרט עם הפסקות במקומות הגיוניים, ב־6 עד 7 חודשים מבחינים בדפוסי קצב, מעדיפים שירי משחק גבוהים ושירי ערש נמוכים, ובסוף השנה מזהים מנגינה גם בסולם אחר.</p><p><b>דיבור:</b> הבחנה בצלילים מפעילה אצל תינוקות גם אזורים <b>מוטוריים</b>, אולי הכנה להשמעה. בגיל 5 חודשים רגישים להדגשת הברות בשפת האם, וב־6 עד 8 חודשים ״מסננים״ צלילים שלא קיימים בשפתם.</p>${fig("narrow","אפקט ההצרה התפיסתית")}${def("אפקט ההצרה התפיסתית",`<mark>אפקט ההצרה התפיסתית</mark> ${E("Perceptual narrowing effect")}: רגישות שמתכווננת עם הגיל למידע שנתקלים בו הכי הרבה. בגיל 6 חודשים מבחינים בין פני קופים ובין פני בני אדם, ובגיל 9 רק בין בני אדם (גם פני כבשים: 4 עד 6 חודשים כן, 9 עד 11 לא). בני 6 חודשים מזהים שינוי במקצב מערבי ולא מערבי (בלקני), ובני 12 רק במערבי.`)}${rem("זו כנראה <b>תקופה רגישה</b> במחצית השנייה של השנה: הלמידה מהירה ו<b>הפיכה בקלות</b>. כמה שבועות עם דובר שפה זרה או מוזיקה לא מערבית מחזירים את הרגישות לבני 12 חודשים, ותרגול שמות אישיים לפני קופים (״קרלוס״) שומר עליה בגיל 9 חודשים. אצל מבוגרים תרגול דומה כמעט לא עוזר.")}${ex(`<b>תחושה</b>: האוזן קולטת צליל. <b>תפיסה</b>: התינוק מבין שזה הקול של אמא. <b>הצרה תפיסתית</b>: תינוק עברי בן 6 חודשים מבחין בין צלילים ביפנית, ובגיל שנה כבר לא, כי הוא "מתמחה" בצלילים של העברית.`)}`,q:"q23"},
  {h:"למידה סטטיסטית",html:`<p>בהמשך תינוקות מתמקדים ביחידות גדולות: מזהים מילים מוכרות ומעדיפים דיבור עם גבולות משפטים ברורים. ב־7 עד 9 חודשים מחלקים את שטף הדיבור ליחידות דמויות מילים.</p>${def("מושג מפתח",`<mark>כישורי למידה סטטיסטית</mark> ${E("Statistical learning capacity")}: ניתוח שטף הדיבור לפי רצפים שחוזרים. הברות שמופיעות יחד לעתים קרובות שייכות כנראה לאותה מילה, והברות שמופיעות יחד לעתים רחוקות מסמנות גבול.`)}${ex("בגיל 5 חודשים, אחרי דקה אחת של הברות סתמיות (כשישים מילים), תינוקות מבחינים בין זוג הברות בתוך מילה (pretty) לבין זוג שחוצה גבול (ty#ba). בני 7 עד 8 חודשים משתמשים בהדגשה הראשונה (hap-py) כסימן למילה, ובני 10 חודשים מזהים גם מילים שמתחילות בהברה חלשה (surprise).")}${tiles([["copies","חוקי סדר","בני 7 חודשים מבחינים בין מבנה ABA (ga ti ga) לבין ABB (wo fee fee): בסיס לדקדוק. זה עובד גם בגירויים חזותיים ומוזיקליים"],["grad","ניבוי","ככל שבני 10 חודשים מזהים מילים מהר יותר (ERP), אוצר המילים שלהם בגיל שנתיים גדול יותר"]])}${rem("למידה סטטיסטית קיימת כבר בשבועות הראשונים ומתרחבת גם לראייה. גם המבוגרים עוזרים: דיבור שכולל מילה בודדת וגם אותה מילה במשפט (״כלבלב!״, ״את רואה את הכלבלב?״) עוזר לזהות אותה אחר כך.")}`,q:"q25"}
 ]},
 {id:"t6",icon:"target",title:"ראייה ותפיסת עומק",blocks:[
  {h:"חדות, סריקה ורמזי עומק",html:`${def("על מה הנושא",`הראייה היא החוש הכי פחות מפותח בלידה. הנושא עוסק בהתפתחות שלה, ובעיקר בהבנה של מרחק ועומק.<br><b>מה נלמד כאן:</b> חדות וסריקה · תפיסת עומק והצוק החזותי · תנועה עצמאית`)}<p>הראייה משתנה מאוד ב־6 עד 8 החודשים הראשונים: מיקוד כמו של מבוגר בגיל חודשיים, ראיית צבעים כמו מבוגר בגיל 4 חודשים. <b>חדות הראייה</b> מגיעה ל־20/80 בגיל 6 חודשים (6/24 במטרים) ולרמת מבוגר (20/20) בערך בגיל 4 שנים. סריקה ומעקב משתפרים, ו<b>סריקה מקדמת תפיסה, ותפיסה מקדמת סריקה</b>.</p>${def("הצוק החזותי",`<mark>תפיסת עומק</mark> ${E("Depth perception")}: שיפוט המרחק בין אובייקטים ומאיתנו. ב<mark>צוק החזותי</mark> ${E("Visual cliff")} של גיבסון ווק, שולחן זכוכית עם צד ״רדוד״ וצד ״עמוק״, תינוקות זוחלים חצו את הרדוד ורובם נמנעו מהעמוק. אבל זה לא מסביר <b>מתי</b> תפיסת העומק מופיעה ואיך היא קשורה לזחילה.`)}${fig("depth","סדר הופעת רמזי העומק")}${rem("<b>תנועה</b>: בני 3 עד 4 שבועות ממצמצים מול חפץ שמתקרב. <b>דו־עיניים</b>: המוח ממזג שתי תמונות שונות. <b>רמזי תמונה</b>: מה שאמנים משתמשים בו (קווים נסוגים, מרקם, חפיפה, הצללה). הסדר קשור כנראה למוטוריקה: שליטה בראש עוזרת לשני הראשונים, והתהפכות וחקירת משטחים עוזרות לרמזי התמונה.")}${ex(`<b>הצוק החזותי</b>: משטח זכוכית שמתחתיו נראה "צוק". תינוקות שכבר זוחלים מסרבים לזחול מעליו, גם כשאמא קוראת להם מהצד השני.`)}`,q:"q27"},
  {h:"תנועה עצמאית ותפיסת עומק",html:`<p>טימי בן 6 החודשים ״בלי פחד״: זוחל לקצה המיטה. ככל שיש <b>יותר ניסיון בזחילה</b> (בלי קשר למתי התחילו), יותר תינוקות מסרבים לחצות את הצד העמוק.</p>${def("לומדים מחדש בכל תנוחה",`אובדן השליטה שונה בכל תנוחה, ולכן לומדים <b>בנפרד</b> לכל אחת. בני 9 חודשים שיושבים היטב ורק התחילו לזחול נמנעו מלהתכופף מעבר למדף <b>בישיבה</b>, אבל <b>בזחילה</b> התקדמו לקצה גם כשהמרחק היה גדול. הולכים מתחילים הולכים שוב ושוב על מדף שעלולים ליפול ממנו.`)}${ex("בגשרים מעל אזור עמוק: עם הניסיון ניסו לחצות גשרים צרים יותר. <b>הולכים</b> העריכו טוב יותר את הסיכון מ<b>זוחלים</b>, שלא ראו איפה לשים את הרגליים האחוריות. הולך מיומן בן 14 חודשים הסתובב הצידה כדי לעבור.")}${rem("זחילה מקדמת גם הבנה תלת־ממדית: זוחלים מנוסים זוכרים מיקום חפצים ומוצאים חפצים מוסתרים טוב יותר. כמו שאנחנו שמים לב לדרך יותר כשאנחנו נוהגים מאשר כשמסיעים אותנו. זחילה מקדמת אפילו <b>ארגון חדש של המוח</b> (EEG).")}`,q:"q29"}
 ]},
 {id:"t7",icon:"copies",title:"תפיסת תבנית ופנים",blocks:[
  {h:"תבנית: ניגוד ושילוב",html:`${def("על מה הנושא",`במה תינוקות מעדיפים להסתכל, ולמה? הנושא מסביר איך הם קולטים תבניות, ואיך מזהים פנים.<br><b>מה נלמד כאן:</b> רגישות לניגוד · תפיסת תבנית · תפיסת פנים`)}<p>גם יילודים מעדיפים גירוי עם תבנית על פני גירוי חלק. בני 3 שבועות מביטים יותר בלוח עם מעט משבצות גדולות, ובני 8 ו־14 שבועות מעדיפים לוח עם משבצות רבות.</p>${def("רגישות לניגוד",`<mark>רגישות לניגוד</mark> ${E("Contrast sensitivity")}: אם תינוקות רגישים לניגוד בין תבניות, הם מעדיפים את זו עם <b>יותר ניגודיות</b> (הבדל באור בין אזורים סמוכים). בשבועות הראשונים הראייה החלשה גורמת ללוח המורכב להיראות אפור ומטושטש, ולכן הלוח עם המשבצות הגדולות נראה בעל ניגוד גדול יותר. בגיל חודשיים הם כבר רואים פרטים עדינים ומעדיפים מורכב.`)}${tiles([["target","שבועות ראשונים","מגיבים לחלקים נפרדים, נועצים מבט בקצוות בעלי ניגוד ומתקשים להסיט מבט"],["copies","2 עד 3 חודשים","סורקים בקפידה את החלקים הפנימיים"],["check","בערך 4 חודשים","מחברים לשלם: רואים גבולות סובייקטיביים (ריבוע שלא באמת מצויר) ו״מרחיבים גבולות״ של תצלום"]])}${rem("ידע על אובייקטים ופעולות עוזר לתפוס תבניות: בני 9 חודשים מביטים יותר באורות נעים שמסודרים כמו <b>אדם הולך</b>, ובני 12 חודשים מזהים אופנוע בציור שחסרים בו <b>שני שלישים</b>.")}${ex(`תינוק בן חודש יעדיף להסתכל על לוח שחמט עם משבצות גדולות ולא על לוח עם משבצות קטנות, כי בעיניו הקטנות נראות כמו כתם אפור.`)}`,q:"q31"},
  {h:"תפיסת פנים",html:`<p>יילודים מעדיפים פנים ותבניות פשוטות דמויות פנים <b>זקופות</b> על פני הפוכות, ועוקבים אחריהן רחוק יותר. הם מעדיפים <b>עיניים פקוחות ומבט ישיר</b>, ואפילו פנים שמבוגרים מחשיבים <b>מושכות</b> (אולי מקור להטיה חברתית).</p>${tiles([["sprout","יכולת מולדת","התכווננות מולדת לבני המין, כמו אצל בעלי חיים"],["copies","העדפה כללית","כל תבנית עם רוב האלמנטים הבולטים מאוזנים בחלק העליון, כמו ״עיניים״"],["cycle","ניסיון","חשיפה מרובה לפנים ״מחווטת״ את המוח"]])}<p>יילודים לא מבחינים בין פנים מסובכות לתבנית מסובכת אחרת, ומזהים את האם בעיקר לפי <b>קווי המתאר</b>. בגיל חודשיים מעדיפים ציור מסובך של פנים ואת תווי הפנים של האם, ב־3 חודשים מבחינים בין שני זרים דומים, ב־5 חודשים מבדילים הבעות חיוביות משליליות, וב־7 חודשים מבחינים בשמחה, הפתעה, עצב, פחד וכעס.</p>${rem("ניסיון יוצר <b>הטיות</b>: בגיל 3 חודשים מעדיפים פני נשים (אבל אם המטפל העיקרי גבר, פני גברים). חשיפה בעיקר לגזע אחד: ב־3 עד 6 חודשים מעדיפים אותו, וב־6 עד 9 חודשים ההבחנה בין פני גזעים אחרים נחלשת. חשיפה לגיוון (בפעוטון, בספרים) <b>מונעת</b> את ההטיה.")}`,q:"q33"}
 ]},
 {id:"t8",icon:"link",title:"אובייקטים, רב־חושיות ותיאוריה",blocks:[
  {h:"קביעות וזהות של אובייקט",html:`${def("על מה הנושא",`הנושא האחרון מחבר הכול: איך תינוקות מבינים שחפץ נשאר אותו חפץ, מחברים בין החושים, ומה התיאוריה שמסבירה את כל התפיסה.<br><b>מה נלמד כאן:</b> קביעויות · תפיסה רב־חושית · תיאוריית ההבחנה · מזמינות`)}${def("קביעויות",`<mark>קביעות הגודל</mark> ${E("Size constancy")}: תפיסת גודל קבוע למרות שינוי בגודל על הרשתית. <mark>קביעות הצורה</mark> ${E("Shape constancy")}: אותו דבר לצורה. שתיהן קיימות כבר <b>בשבוע הראשון</b>: יילודים שהתרגלו לקובייה קטנה במרחקים שונים החלימו לקובייה גדולה יותר, גם כשהשליכה תמונה באותו גודל.`)}${ex("מקל נע מאחורי קופסה: בגיל <b>חודשיים</b> תינוקות מבינים שזה מקל אחד שלם (מביטים יותר במקל שבור). הם צריכים תנועה, רקע עם מרקם וקופסה קטנה. עד גיל 4 חודשים, שני חפצים שנוגעים ונעים יחד נתפסים כאחד.")}<p>עם הזמן מסתמכים פחות על תנועה ויותר על <b>צורה, צבע ומרקם</b> (4.5 חודשים, וחשיפה קודמת עוזרת). בגיל 4 חודשים תופסים מסלול של כדור מאחורי מסך כרציף, וב־5 חודשים מביטים מראש למקום שבו האובייקט יופיע, גם במסלול מפותל. מ־4 עד 11 חודשים: בהתחלה צריך שינוי בשני מאפיינים כדי להבין שזה אובייקט אחר, ובסוף השנה מספיק אחד.</p>${rem("זהות האובייקט נרכשת בהדרגה במהלך השנה הראשונה. בפרק 6: <b>קביעות האובייקט</b>, ההבנה שהוא ממשיך להתקיים כשהוא מוסתר.")}`,q:"q35"},
  {h:"תפיסה רב־חושית",html:`${def("מושגי מפתח",`<mark>תפיסה רב־חושית</mark> ${E("Intermodal perception")}: הבנת המידע מכמה <b>אופנויות</b> חושיות כשלם אחד. היא נשענת על <mark>תכונות חושיות אמודליות</mark> ${E("Amodal sensory properties")}: מידע שלא שייך לחוש אחד, כמו קצב, מקצב, משך, עוצמה, בו־זמניות (ראייה ושמיעה), מרקם וצורה (ראייה ומגע).`)}${tiles([["hand","יילודים","מזהים במראה גליל שנגעו בו, ולומדים בחשיפה אחת קשר בין צעצוע לקולו"],["people","2 עד 6 חודשים","מתאימים פנים לקול לפי סנכרון שפתיים, רגש, גיל ומגדר. ב־6 חודשים זוכרים צמד פנים־קול של זרים"],["bulb","סדר","קודם יחסים אמודליים (קצב משותף), ואחר כך צמדים ספציפיים (פנים מסוימות וקול מסוים, חפץ ושמו)"]])}<p>בהתחלה זה עוזר לא להתבלבל: שמים לב לאירוע אחד (תיפוף) בלי שפרטים לא רלוונטיים (צבע הפטיש) יסיחו. גם בעולם החברתי: בני 3 עד 4 חודשים צריכים <b>קול ומראה יחד</b> כדי להבחין ברגש, ורק אחר כך מבחינים בקול לבד (5 חודשים) ובפנים לבד (7 חודשים).</p>${ex("בני 3 חודשים שהחזיקו <b>גליל</b> בזמן שבעטו כדי לסובב מובייל של גלילים למדו הכי מהר. מי שהחזיקו <b>קובייה</b> (מידע לא תואם) למדו לאט. והורים שאומרים ״בובה״ תוך כדי הנעת הבובה ונגיעה בתינוק עוזרים לו לזכור את המילה.")}`,q:"q37"},
  {h:"תיאוריית ההבחנה ומזמינות",html:`${def("תיאוריית ההבחנה",`<mark>תיאוריית ההבחנה</mark> ${E("Differentiation theory")} של אלינור וג׳יימס גיבסון: תינוקות מחפשים באופן פעיל <mark>מאפיינים קבועים</mark> ${E("Invariant features")} בעולם שמשתנה כל הזמן. ״להבחין״ = לנתח, לפרק: עם הזמן מזהים עוד ועוד מאפיינים קבועים.`)}${tiles([["copies","תבנית","קודם המאפיינים הבולטים, אחר כך היחסים הקבועים בין החלקים"],["phone","דיבור","סדירויות, מילים, סדר מילים, הדגשות"],["link","רב־חושיות","קודם קצב ומקצב, אחר כך צמדי קול־פנים"],["target","עומק ואובייקט","רגישות לתנועה קודמת לזיהוי מאפיינים דקים"]])}${def("מזמינות",`<mark>מזמינות</mark> ${E("Affordance")}: אפשרויות הפעולה שמצב מציע לאורגניזם עם כישורים מוטוריים מסוימים. בזכות התנועה בסביבה התינוק מבין מה אפשר לאחוז, ללחוץ או ללטף, ואיזה משטח בטוח. כך הפעולות <b>מכוונות לעתיד</b> ולא גישוש באפלה.`)}${ex("זוחל חדש מחליק במדרון עם הראש קדימה, ופעוט שהולך חודש ניגש בזהירות (תרשים 5.22). אבל מה שנלמד בזחילה <b>לא עובר</b> להליכה, כי כל תנוחה מזמנת פעולה אחרת.")}${rem("יש חוקרים שמוסיפים נקודת מבט <b>קוגניטיבית</b>: תינוקות גם מעניקים משמעות ויוצרים קטגוריות (פנים מוכרות כמקור לחיבה). רבים משלבים: בשנה הראשונה יש מעבר מ<b>תפיסתי לקוגניטיבי</b>.")}`,q:"q39"}
 ]}
];

q4:{t:"t1",v:[

q7:{t:"t2",v:[

q14:{t:"t3",v:[

 {q:"מה מאיץ את השינוי המוטורי בשבועות הראשונים, ומה בהמשך?",a:"בהתחלה גדילת המוח והגוף, ובהמשך מטרות התינוק ותמיכה מהסביבה",w:["תמיד רק הגנים","בהתחלה מטרות, בהמשך גדילה","רק עידוד ההורים"],e:"הגורמים המאיצים משתנים עם הגיל."}]},
q15:{t:"t3",v:[
 {q:"למה תינוקות הושיטו ״רגליים תחילה״ במחקר של גאלוויי ות׳לן?",a:"כי מפרק הירך מגביל פחות מהכתף, ולכן קל יותר לשלוט ברגליים",w:["כי הידיים שלהם היו קשורות","כי הם לא ראו את הצעצוע","כי כך לימדו אותם"],e:"הסדר תלוי באנטומיה, בסביבה ובמאמץ, לא בתוכנית קבועה."},
 {q:"מה מפתיע בתינוקות שמתחילים ללכת ונושאים חפצים?",a:"הם נופלים פחות מאשר כשהידיים ריקות",w:["הם נופלים הרבה יותר","הם מפסיקים ללכת","אין הבדל"],e:"הנשיאה עוזרת למקד קשב ולייצב."}]},
q16:{t:"t3",v:[
 {q:"מה משמעות הירידה הזמנית ביציבות הישיבה כשתינוק מתחיל ללכת?",a:"אובדן יציבות הוא שלב הכרחי במעבר למצב יציב יותר",w:["שהוא מאבד את היכולת לשבת לתמיד","שהוא חולה","שאין קשר בין מיומנויות"],e:"לפי תיאוריית המערכות הדינמיות."},
 {q:"כמה פעמים בשעה נופלים פעוטות שלומדים ללכת, בממוצע?",a:"32 פעמים, ורק לעתים נדירות בוכים",w:["פעם אחת","100 פעמים","אף פעם"],e:"הם מתאמנים 6 שעות ויותר ביום."}]},
q17:{t:"t4",v:[
 {q:"מה מצא דניס בבתי היתומים באיראן?",a:"תינוקות בלי גרייה נעו בישיבה ולא בזחילה, ועד גיל 3 עד 4 רק 15% הלכו לבד",w:["כולם הלכו בגיל שנה","הם זחלו מוקדם במיוחד","לא היה הבדל מהממוצע"],e:"הם שכבו על הגב בעריסות בלי צעצועים."},
 {q:"למה בזינקנטן ואצל הגוסי לא מעודדים התקדמות מוטורית מהירה?",a:"תינוק שהולך לפני שיודע להתרחק מאש ומנול נחשב מסוכן",w:["כי אין שם רצפה","כי מאמינים שהליכה מזיקה ללב","כי אין להם זמן"],e:"גם אימהות ביפן חושבות שעידוד כזה מיותר."}]},
q18:{t:"t4",v:[
 {q:"מה מאפיין את גידול התינוקות אצל הקיפסיגיס בקניה?",a:"מאמנים אותם לשבת וללכת, ולכן הם יושבים והולכים מוקדם יותר ולעתים מדלגים על זחילה",w:["משאירים אותם בעריסה","מונעים מהם ללכת","מלמדים אותם לזחול לפני הכול"],e:"מושיבים אותם בבורות עם שמיכות ומתרגלים את רפלקס הצעידה."},
 {q:"מה החיסרון של השכבה לישון על הגב, ואיך מתמודדים?",a:"פחות ״זמן בטן״ מעכב אבני דרך, וזמן בטן בשעות הערות מונע את העיכוב",w:["אין חיסרון","זה גורם למוות בעריסה","צריך להשכיב לישון על הבטן"],e:"השכבה על הגב בשינה נועדה להגן מפני מוות בעריסה."}]},
q19:{t:"t4",v:[
 {q:"מהי קדם־הושטה?",a:"חבטות לא מתואמות של יילודים לעבר חפץ, שלרוב לא נוגעות בו",w:["אחיזת פינצטה","הושטה בחושך","העברת חפץ מיד ליד"],e:"היא נעלמת בערך ב־7 שבועות."},
 {q:"מה מראה ההושטה בחושך בגיל 5 עד 6 חודשים?",a:"שההושטה נשלטת בעיקר על ידי פרופריוספציה ולא צריכה ראייה",w:["שתינוקות רואים בחושך","שהם לא מושיטים יד בכלל","שהראייה היא העיקר"],e:"כך הראייה מתפנה להתאמות עדינות."}]},
q20:{t:"t4",v:[
 {q:"מהי אחיזת פינצטה ומתי מופיעה?",a:"אחיזה בין האגודל לאצבע המורה, בסוף השנה הראשונה",w:["אצבעות שנסגרות לכף היד, ביילודים","הושטת רגל, בגיל 8 שבועות","אחיזה בשתי ידיים, בגיל 4 חודשים"],e:"כך אפשר להרים צימוקים ולסובב כפתורים."},
 {q:"מהי אחיזה אלנרית?",a:"תנועה מגושמת שבה האצבעות נסגרות לתוך כף היד",w:["אחיזה מדויקת באגודל ובאצבע","הושטה מכוונת","העברה מיד ליד"],e:"היא מחליפה את רפלקס האחיזה של היילוד."}]},
q21:{t:"t4",v:[
 {q:"מה קרה לתינוקות שקיבלו גרייה מרובה במחקר של וייט והלד?",a:"הם הסיטו מבט, בכו הרבה והתקדמו פחות בהושטה מהקבוצה עם גרייה מתונה",w:["הם הושיטו יד הכי מוקדם","לא היה להם שום שינוי","הם התקדמו כמו המתונה"],e:"יותר גרייה אינה בהכרח טובה יותר."},
 {q:"למה הושטת היד של תינוקות הקונג מתקדמת?",a:"הם נישאים על המותן ומשחקים בשרשראות ובתכשיטים של האם",w:["כי הם שוכבים רוב היום","כי אין להם צעצועים","כי הם לא יונקים"],e:"ניסיון מוקדם משפיע על ההושטה."}]},
q22:{t:"t4",v:[
 {q:"במה מתמקדים תינוקות בני 8 עד 11 חודשים כשההושטה כבר שולטת?",a:"במה שקורה לפני ואחרי השגת החפץ, למשל מושיטים מהר יותר כשמתכוונים לזרוק",w:["בלימוד ההושטה מחדש","רק בהסתכלות על הידיים","בזחילה בלבד"],e:"הם גם מתחילים לחפש צעצוע מוסתר."},
 {q:"מה עוזר לתינוקות במאלי ובאוגנדה לפתח מיומנויות ידיים מוקדם?",a:"הם מבלים חצי יום ויותר בישיבה או עמידה, שמקלות על הושטה",w:["הם שוכבים על הגב רוב היום","יש להם הרבה מוביילים","הם לא נוגעים בחפצים"],e:"במערב תינוקות מבלים יותר זמן בשכיבה."}]},
q23:{t:"t5",v:[
 {q:"מהו אפקט ההצרה התפיסתית?",a:"רגישות שמתכווננת עם הגיל למידע שנתקלים בו הכי הרבה",w:["ירידה בחדות הראייה","הרחבה של כל היכולות","שכחה של שפת האם"],e:"למשל בגיל 9 חודשים מבחינים רק בין פני בני אדם ולא בין פני קופים."},
 {q:"מה קורה ליכולת להבחין בשינויי מקצב במוזיקה לא מערבית בגיל 12 חודשים?",a:"היא נעלמת, אבל כמה שבועות של האזנה יכולים להחזיר אותה",w:["היא משתפרת","היא לא קיימת מעולם","היא נשארת קבועה"],e:"בגיל 6 חודשים הם עוד מזהים שינויים בשני הסוגים."}]},
q24:{t:"t5",v:[
 {q:"מה ההבדל בין תחושה לתפיסה?",a:"תחושה היא קליטה סבילה בקולטנים, תפיסה היא ארגון ופירוש פעילים",w:["אין הבדל","תפיסה סבילה ותחושה פעילה","תחושה קיימת רק במבוגרים"],e:"בפרק 4 דובר על תחושה, כאן על תפיסה."},
 {q:"מה מעיד על כך שהרגישות בתקופה הרגישה של ה״כוונון״ היא ייחודית לינקות?",a:"מבוגרים שמתרגלים באופן דומה משתפרים רק במעט",w:["מבוגרים משתפרים יותר מתינוקות","תינוקות לא לומדים כלל","אין הבדל בין הגילים"],e:"במחצית השנייה של השנה הראשונה הלמידה מהירה והפיכה."}]},
q25:{t:"t5",v:[
 {q:"איך עוזרת למידה סטטיסטית לזהות מילים?",a:"הברות שמופיעות יחד לעתים קרובות שייכות כנראה לאותה מילה",w:["התינוק שואל את ההורים","כל הברה היא מילה","התינוק סופר את המילים בקול"],e:"הברות שמופיעות יחד לעתים רחוקות מסמנות גבול מילה."},
 {q:"במחקר עם מילות תפל, מה הבחינו בני 7 חודשים?",a:"בין מבנה ABA לבין מבנה ABB",w:["בין שפות שונות","בין קול גבר וקול אישה","בין מילים ארוכות לקצרות"],e:"זה בסיס להבנת חוקי סדר ודקדוק."}]},
q26:{t:"t5",v:[
 {q:"מה מנבא זיהוי מהיר של מילים בשטף הדיבור בגיל 10 חודשים?",a:"אוצר מילים גדול יותר בגיל שנתיים",w:["הליכה מוקדמת","ראייה טובה יותר","פחות בכי"],e:"זה נמדד ב־ERP."},
 {q:"איזה דיבור של מבוגרים עוזר לתינוקות לזהות מילים?",a:"שילוב של מילה בודדת ושל אותה מילה בתוך משפט",w:["רק משפטים ארוכים","דיבור בשפה זרה","שתיקה"],e:"למשל ״כלבלב!״ ו״את רואה את הכלבלב?״."}]},
q27:{t:"t6",v:[
 {q:"מה הראו מחקרי הצוק החזותי?",a:"שרוב התינוקות הזוחלים נמנעים מהצד העמוק",w:["שכל התינוקות חוצים את הצד העמוק","שתינוקות לא רואים זכוכית","שתפיסת עומק מופיעה בגיל 5"],e:"אבל הם לא מסבירים מתי תפיסת העומק מופיעה."},
 {q:"מהו רמז העומק הראשון שתינוקות רגישים אליו?",a:"תנועה",w:["רמזי תמונה","רמזים דו־עיניים","צבע"],e:"בני 3 עד 4 שבועות ממצמצים מול חפץ מתקרב."}]},
q28:{t:"t6",v:[
 {q:"מתי מופיעה רגישות לרמזי עומק של תמונות (פרספקטיבה, חפיפה, הצללה)?",a:"מגיל 3 עד 4 חודשים, ועוד יותר בין 5 ל־7 חודשים",w:["מהלידה","רק בגיל שנתיים","אף פעם"],e:"אחרי תנועה ורמזים דו־עיניים."},
 {q:"מתי חדות הראייה מגיעה לרמה של מבוגרים?",a:"בערך בגיל 4 שנים",w:["בגיל חודשיים","בגיל 6 חודשים","בגיל 18"],e:"בגיל 6 חודשים היא בערך 20/80."}]},
q29:{t:"t6",v:[
 {q:"מה קובע אם תינוק יסרב לחצות את הצד העמוק של הצוק?",a:"כמות הניסיון בזחילה, בלי קשר למתי התחיל לזחול",w:["רק הגיל","מין התינוק","צבע הבד"],e:"ניסיון בתנועה עצמאית משפר תפיסת עומק."},
 {q:"למה תינוקות צריכים ללמוד בנפרד להימנע מנפילה בכל תנוחה?",a:"כי אובדן השליטה בגוף שונה בכל תנוחה",w:["כי הם שוכחים מהר","כי הראייה שלהם משתנה","כי ההורים לא מלמדים"],e:"מה שנלמד בישיבה לא עובר אוטומטית לזחילה."}]},
q30:{t:"t6",v:[
 {q:"מי העריכו טוב יותר את הסיכון בגשרים צרים, זוחלים או הולכים?",a:"הולכים, כי זוחלים התקשו לראות איפה לשים את הרגליים האחוריות",w:["זוחלים","אין הבדל","אף אחד לא ניסה"],e:"הולך מיומן בן 14 חודשים הסתובב הצידה כדי לעבור."},
 {q:"מה עוד מקדמת זחילה מלבד תפיסת עומק?",a:"זיכרון מיקום חפצים, מציאת חפצים מוסתרים וארגון חדש של המוח",w:["רק את שרירי הרגליים","את חדות הראייה בלבד","שום דבר"],e:"כמו שאנחנו לומדים דרך טוב יותר כשאנחנו נוהגים."}]},
q31:{t:"t7",v:[
 {q:"למה בני 3 שבועות מעדיפים לוח עם משבצות גדולות?",a:"בגלל הראייה החלשה, הלוח המורכב נראה להם אפור, והגדול נראה בעל ניגוד רב יותר",w:["כי הם לא אוהבים פרטים","כי הם מעדיפים צבע","כי הם עוד לא רואים בכלל"],e:"זה עיקרון הרגישות לניגוד."},
 {q:"מה מעיד על כך שבני 4 חודשים מחברים תבנית לשלם?",a:"הם רואים גבולות סובייקטיביים, כמו ריבוע שלא באמת מצויר",w:["הם מביטים רק בקצוות","הם לא מבחינים בתבניות","הם מעדיפים לוח חלק"],e:"הם גם ״מרחיבים גבולות״ של תצלום."}]},
q32:{t:"t7",v:[
 {q:"מה מזהים בני 12 חודשים בציור שחסרים בו שני שלישים?",a:"אופנוע",w:["פנים של אם","מכונית","שום דבר"],e:"ידע על אובייקטים עוזר לתפיסת תבניות."},
 {q:"במה מביטים בני 9 חודשים זמן רב יותר?",a:"באורות נעים שמסודרים כמו אדם הולך, יותר מגרסה מבולבלת",w:["בגרסה ההפוכה","במסך שחור","בלוח חלק"],e:"הרגישות לצורה סובייקטיבית מגיעה רחוק יותר."}]},
q33:{t:"t7",v:[
 {q:"אילו פנים מעדיפים יילודים?",a:"פנים זקופות, עם עיניים פקוחות ומבט ישיר",w:["פנים הפוכות","פנים עם עיניים עצומות","אין להם העדפה"],e:"הם גם עוקבים רחוק יותר אחרי תבנית דמוית פנים."},
 {q:"באיזה גיל תינוקות מבדילים בין הבעות חיוביות לשליליות?",a:"בגיל 5 חודשים",w:["מהלידה","בגיל שנתיים","בגיל 3 שבועות"],e:"בגיל 7 חודשים מבחינים בטווח רחב יותר של רגשות."}]},
q34:{t:"t7",v:[
 {q:"למה בני 3 חודשים מעדיפים בדרך כלל פני נשים?",a:"כי הם מבלים יותר זמן עם נשים, ואם המטפל העיקרי גבר הם מעדיפים פני גברים",w:["כי זה מולד ולא משתנה","כי נשים מחייכות יותר","כי הם לא רואים גברים"],e:"ניסיון יוצר הטיות מוקדמות."},
 {q:"מה מונע את ההטיה לפני בני הגזע של התינוק?",a:"חשיפה תכופה לבני גזעים אחרים, גם בתמונות בספרים",w:["שום דבר לא מונע","גיל מבוגר יותר בלבד","פחות זמן עם ההורים"],e:"בלי חשיפה, ב־6 עד 9 חודשים ההבחנה בפני גזעים אחרים נחלשת."}]},
q35:{t:"t8",v:[
 {q:"מהי קביעות הגודל, ומתי היא קיימת?",a:"תפיסת גודל קבוע למרות שינוי בגודל על הרשתית, כבר בשבוע הראשון",w:["זיכרון של חפץ מוסתר, בגיל שנה","העדפה לחפצים גדולים, בגיל 6 חודשים","מדידת חפצים, בגיל שנתיים"],e:"יילודים החלימו לקובייה גדולה יותר שהשליכה תמונה באותו גודל."},
 {q:"מה הראה ניסוי המקל שנע מאחורי קופסה?",a:"שבגיל חודשיים תינוקות מבינים שזה מקל אחד שלם",w:["שתינוקות חושבים שזה שני מקלות","שאין להם עניין במקלות","שרק בגיל שנה מבינים"],e:"הם הביטו יותר במקל השבור, שהיה חדש להם."}]},
q36:{t:"t8",v:[
 {q:"על מה מסתמכים תינוקות קטנים בהתחלה כדי לזהות אובייקטים, ועל מה בהמשך?",a:"בהתחלה על תנועה וארגון במרחב, בהמשך על צורה, צבע ומרקם",w:["בהתחלה על צבע, בהמשך על תנועה","רק על קול","רק על מגע"],e:"עד גיל 4 חודשים שני חפצים שנעים יחד נתפסים כאחד."},
 {q:"מה מראות תנועות העיניים של בני 5 חודשים כשכדור עובר מאחורי מסך?",a:"הם מביטים מראש למקום שבו הכדור יופיע",w:["הם מפסיקים להסתכל","הם מביטים אחורה","הם בוכים"],e:"גם במסלול מפותל ובמהירויות שונות."}]},
q37:{t:"t8",v:[
 {q:"מהן תכונות חושיות אמודליות?",a:"מידע שלא שייך לחוש אחד, כמו קצב, משך, עוצמה ובו־זמניות",w:["צבע בלבד","מידע מחוש הריח בלבד","תכונות שתינוקות לא יכולים לתפוס"],e:"למשל המראה והקול של כדור מוקפץ באותו קצב."},
 {q:"מה מבינים יילודים אחרי שנגעו בגליל?",a:"הם מזהים את מראהו ומבחינים בינו לבין צורה אחרת",w:["הם לא מבינים כלום","רק את צבעו","רק את קולו"],e:"תפיסה רב־חושית מרשימה כבר מהלידה."}]},
q38:{t:"t8",v:[
 {q:"במחקר המובייל עם בני 3 חודשים, מי למדו הכי מהר לבעוט?",a:"אלה שהחזיקו גליל בזמן שראו מובייל של גלילים",w:["אלה שהחזיקו קובייה","אלה שלא החזיקו כלום","כולם באותו קצב"],e:"מידע אמודלי מותאם מאיץ למידה."},
 {q:"מה צריכים בני 3 עד 4 חודשים כדי להבחין בין רגש חיובי לשלילי אצל מבוגר?",a:"קול ומראה יחד",w:["רק את הקול","רק את הפנים","אף אחד מהם"],e:"אחר כך בקול לבד (5 חודשים) ובפנים לבד (7 חודשים)."}]},
q39:{t:"t8",v:[
 {q:"מה טוענת תיאוריית ההבחנה של גיבסון?",a:"תינוקות מחפשים באופן פעיל מאפיינים קבועים בעולם שמשתנה",w:["תינוקות סבילים לגמרי","התפיסה נקבעת רק בגנים","תינוקות לא מבחינים בדבר"],e:"״להבחין״ = לנתח: עם הזמן מזהים עוד ועוד מאפיינים קבועים."},
 {q:"מהי מזמינות (affordance)?",a:"אפשרויות הפעולה שמצב מציע לאורגניזם עם כישורים מוטוריים מסוימים",w:["העדפה לפנים מוכרות","רפלקס מולד","גודל החפץ על הרשתית"],e:"למשל איזה משטח בטוח לחצות ומה אפשר לאחוז."}]},
q40:{t:"t8",v:[
 {q:"זוחל למד להימנע ממדרון מסוכן. האם הוא יימנע ממנו גם כשיתחיל ללכת?",a:"לא בהכרח, כי כל תנוחה מזמנת פעולה אחרת וצריך ללמוד מחדש",w:["כן, תמיד","הוא כבר לא יפחד מכלום","הוא יפסיק ללכת"],e:"מה שנלמד בזחילה לא עובר להליכה."},
 {q:"איך משלבים חוקרים רבים את הגישה התפיסתית והקוגניטיבית?",a:"רואים בשנה הראשונה מעבר מהתמקדות בתפיסתי להתמקדות בקוגניטיבי",w:["דוחים את שתיהן","בוחרים רק בתפיסתית","טוענים שאין הבדל"],e:"הגישה הקוגניטיבית מוסיפה משמעות וקטגוריות."}]}
};
for(const t of T) t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div><div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");
  const started=T.filter(topicStarted);
  const total=Math.round(100*allIds.filter(mastered).length/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     <p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר עם שאלות גם מנושאים קודמים.</p>
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0?"עוד לא התחלת":total>=80?"אתה שולט בחומר":"בדרך"}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
     </div>
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#dev" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  document.querySelector("#rev svg").style.cssText="width:20px;height:20px";
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=topicPct(t),b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=!topicStarted(t)?"לא התחלת":p>=80?"שולט":"בתהליך";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    b.onclick=()=>topic(i,0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${blk.html}</article><div id="slot"></div></div>`;
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;save();quiz(ti)}};
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>t.qids),now=Date.now();
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function done(r,n,ti){
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
