:root[data-theme="dark"]{

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

.tt{font-size:1.6rem;font-weight:900}

.spectrum .dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}

.about{margin:.6rem 0 0;line-height:1.65}.about b{color:var(--ink,inherit)}

  {h:"הגדרה, ותפקיד המותג לצרכן ולעסק",html:`${def("על מה הנושא",`למה אנשים משלמים יותר על מוצר עם שם מסוים? הנושא מגדיר מותג, ומסביר מה הוא נותן לצרכנים ולעסקים.<br><b>מה נלמד כאן:</b> ניהול מותגים אסטרטגי · הגדרת מותג · תפקיד המותג · מיתוג`)}${ex("בלומדה נלווה את <b>אורי</b>, מנהל המותג של ״נוף״, מותג מים מינרליים שרוצה לגדול.")}<p>הפתיחה של הפרק: Gatorade, שהמכירות שלה צנחו בכמיליארד דולר. פפסיקו החזירה את המותג לשורשים, הספורטאים, עם שלושה קווים (לפני, במהלך ואחרי האימון) לשלושה שווקים, והסיסמה ״לנצח מבפנים״.</p><p><b>ניהול מותגים אסטרטגי</b> כולל <b>ארבעה שלבים</b>: זיהוי וביסוס המיצוב; תכנון וביצוע השיווק; מדידה ופרשנות של הביצועים; הצמחה ושימור של ערך המותג.</p>${def("מושג מפתח",`<mark>מותג</mark> ${E("Brand")}, לפי איגוד השיווק האמריקני: ״שם, מונח, סימן, סמל או עיצוב, או צירוף שלהם, שנועד לזהות את הסחורות או השירותים של מוכר ולבדל אותם מאלה של המתחרים״. ההבדלים יכולים להיות <b>תפקודיים ומוחשיים</b>, או <b>סמליים, רגשיים ובלתי מוחשיים</b>.`)}<div class="tw"><table><tr><th>מה המותג נותן לצרכן</th><th>מה המותג נותן לעסק</th></tr><tr><td>מזהה את היצרן, ומאפשר לייחס לו אחריות<br>מפשט את ההחלטה ומפחית סיכון<br>יכול לקבל משמעות אישית ולהיות חלק מהזהות</td><td>מפשט ניהול מלאי ורשומות<br>הגנה משפטית: <b>סימן מסחרי רשום</b>, פטנטים וזכויות יוצרים<br>נאמנות: ביקוש צפוי, <b>מחסומי כניסה</b>, ונכונות לשלם <b>20%–25% יותר</b></td></tr></table></div>${rem("מתחרים יכולים להעתיק תהליך ייצור ועיצוב, אבל לא את הרושם שהשאירו שנים של חוויות חיוביות. לכן מיתוג הוא כלי חזק ליתרון תחרותי.")}${def("מושג מפתח",`<mark>מיתוג</mark> ${E("Branding")}: הקניית עוצמת מותג למוצרים ולשירותים. המהות: <b>יצירת הבדלים</b>. מלמדים את הצרכנים <b>״מי״</b> המוצר (שם ומרכיבי מותג), <b>למה</b> הוא משמש, ו<b>למה</b> זה צריך לעניין אותם. אפשר למתג מוצר, שירות, חנות, אדם, מקום, ארגון או רעיון.`)}`,q:"e1"}
 ]},
 {id:"t2",icon:"chart",title:"ערך מותג",blocks:[
  {h:"ערך מותג מבוסס לקוח",html:`${def("על מה הנושא",`כמה שווה מותג, ואיך הוא נוצר בראש של הלקוחות.<br><b>מה נלמד כאן:</b> ערך מותג · ערך מותג מבוסס לקוח ושלושת המרכיבים · ידע מותג · הבטחת מותג · שלושה מודלים`)}${def("מושג מפתח",`<mark>ערך מותג</mark> ${E("Brand equity")}: הערך המוסף שניתן למוצרים ולשירותים. הוא מתבטא באופן שבו צרכנים חושבים, מרגישים ופועלים כלפי המותג, וגם במחיר, בנתח השוק וברווחיות.`)}${def("מושג מפתח",`<mark>ערך מותג מבוסס לקוח</mark> ${E("Customer-based brand equity")}: ההשפעה הדיפרנציאלית של הידע על המותג על תגובות הצרכן לשיווק שלו. <b>חיובי</b>: מגיבים טוב יותר כשהמותג מזוהה. <b>שלילי</b>: מגיבים פחות טוב באותן נסיבות.`)}<p><b>שלושה מרכיבים</b>:</p><ol><li>ערך המותג נובע מ<b>הבדלים בתגובות</b>. בלי הבדלים, המוצר הוא מצרך כללי, ומתחרים בו לפי מחיר.</li><li>ההבדלים נובעים מ<b>ידע המותג</b>: המחשבות, הרגשות, הדימויים, החוויות והאמונות. צריך אסוציאציות <b>חזקות, חיוביות וייחודיות</b>.</li><li>ערך המותג מתבטא ב<b>תפיסות, העדפות והתנהגות</b> כלפי כל היבטי השיווק.</li></ol>${ex("במבחן טעימה עיוור, ״נוף״ מקבלת ציון כמו כל מים אחרים. כשהבקבוק גלוי, הציון עולה. זה ערך מותג מבוסס לקוח חיובי.")}<p><b>יתרונות של מותג חזק</b> (טבלה 8.1), למשל: תפיסת ביצועים טובה יותר, יותר נאמנות, פחות פגיעות לפעולות של מתחרים, מרווחים גבוהים יותר, תגובה <b>קשיחה</b> להעלאת מחיר ו<b>גמישה</b> להוזלה, יותר תמיכה מהסוחרים, תקשורת יעילה יותר, הזדמנויות לרישוי, וגיוס ושימור עובדים.</p>${def("מושג מפתח",`<mark>הבטחת מותג</mark> ${E("Brand promise")}: החזון של המשווק לגבי מה שהמותג צריך להיות ולעשות בשביל הצרכנים. אבל הצרכנים מחליטים לאן המותג יכול להתקדם: הרחבה כמו דגני הבוקר של Cracker Jack נכשלה כי נראתה להם לא מתאימה.`)}`,q:"e2"},
  {h:"שלושה מודלים של ערך מותג",html:`${tiles([["pyramid","מעריך נכס מותג (BAV)","של Young & Rubicam: ארבעה עמודי תווך","<b>בידול נמרץ</b>, <b>רלוונטיות</b>, <b>הערכה</b> ו<b>ידע</b>. בידול ורלוונטיות יחד הם <b>חוזק המותג</b> (מדד מוביל, צמיחה עתידית). הערכה וידע יחד הם <b>שיעור הקומה</b> (מדד שוטף, ערך נוכחי).",""],["chart","BrandZ ודינמיקת המיתוג","של Millward Brown ו־WPP","אסוציאציות <b>משמעותיות, שונות ובולטות</b> בונות נטייה מוקדמת לקנות. שלושה מדדי תוצאה: <b>עוצמה</b> (ניבוי נתח המכירות), <b>תוספת מחיר</b> (Premium) ו<b>פוטנציאל</b> (הסיכוי להצמיח נתח ערך).",""],["pyramid","מודל תהודת המותג","פירמידה של ארבעה שלבים ושש ״לבנים״","1. <b>זהות</b> (מי אתה?): בולטות. 2. <b>משמעות</b> (מה אתה?): ביצועים ועולם דימויים. 3. <b>תגובה</b> (מה איתך?): שיפוטים ורגשות. 4. <b>תהודה</b> (מה בינינו?): נאמנות גבוהה ופעילה. הצד השמאלי הוא הנתיב <b>הרציונלי</b>, והימני <b>הרגשי</b>.",""]])}<div class="tw"><table><tr><th>ב־BAV</th><th>הדפוס</th></tr><tr><td><b>מותג חדש חזק</b></td><td>בידול ואנרגיה גבוהים יותר מרלוונטיות. הערכה וידע עדיין נמוכים</td></tr><tr><td><b>מותג מוביל</b></td><td>גבוה בכל ארבעת המרכיבים. החוזק גדול משיעור הקומה</td></tr><tr><td><b>מותג דועך</b></td><td>ידע גבוה, הערכה נמוכה יותר, ורלוונטיות ובידול נמוכים עוד יותר</td></tr></table></div>`,q:"e3"}
 ]},
 {id:"t3",icon:"gear",title:"בניית ערך מותג",blocks:[
  {h:"שלושה מנועי ערך ומרכיבי המותג",html:`${def("על מה הנושא",`איך בונים בפועל ערך מותג: מה בוחרים, מה עושים, ובמה נעזרים.<br><b>מה נלמד כאן:</b> שלושה מנועי ערך · מרכיבי מותג ושישה תבחינים · מגע עם מותג · אסוציאציות משניות · מיתוג פנימי`)}<p>בונים ערך מותג על ידי יצירת מבני ידע נכונים אצל הצרכנים הנכונים. יש <b>שלושה מנועי ערך מותג</b>:</p><ol><li><b>מרכיבי המותג</b>: שם, אתר, סמליל, סמל, דמות, דובר, סיסמה, זמריר, אריזה ושילוט. מיקרוסופט בחרה ב־Bing, שם קצר, זכיר ופעיל.</li><li><b>המוצר, השירות ופעילויות השיווק</b> שמלוות אותם.</li><li><b>אסוציאציות שמועברות בעקיפין</b>, מזיקה לישות אחרת: אדם, מקום או דבר. הוודקה 42BELOW קרויה על שם קו הרוחב של ניו זילנד, ומנצלת את ״הטוהר״ שלה.</li></ol>${def("מושג מפתח",`<mark>מרכיבי מותג</mark> ${E("Brand elements")}: אמצעים שאפשר לרשום כסימן מסחרי, ושמזהים ומבדלים את המותג. <b>המבחן</b>: מה הצרכנים היו חושבים על המוצר אם זה הדבר היחיד שהיו יודעים עליו? למשל, מהשם Toughbook מצפים לעמידות.`)}<div class="tw"><table><tr><th>לבניית המותג</th><th>להגנת המותג</th></tr><tr><td><b>זכיר</b>: קל לזכור ולזהות (Tide)</td><td><b>בר־העברה</b>: מתאים למוצרים, קטגוריות ושווקים חדשים (Amazon.com)</td></tr><tr><td><b>משמעותי</b>: אמין ומרמז על הקטגוריה (DieHard)</td><td><b>ניתן להתאמה</b>: אפשר לעדכן (הסמליל של Shell)</td></tr><tr><td><b>מתחבב</b>: מושך או משעשע (Pinterest)</td><td><b>בר־הגנה</b>: מוגן משפטית ומפני תחרות (Yahoo!)</td></tr></table></div>${rem("ככל שהתועלות של המותג <b>פחות מוחשיות</b>, חשוב יותר שהמרכיבים יבטאו את המאפיינים הלא מוחשיים. למשל, חברות ביטוח משתמשות בסמלים של עוצמה, כמו סלע גיברלטר של Prudential.")}`,q:"e4"},
  {h:"שיווק הוליסטי, אסוציאציות משניות ומיתוג פנימי",html:`${def("מושג מפתח",`<mark>מגע עם מותג</mark> ${E("Brand contact")}: כל חוויה, חיובית או שלילית, שנושאת מידע על המותג, על הקטגוריה או על השוק. תצפית, פה לאוזן, שיחה עם עובד, אתר, תשלום. צריך להשקיע בהן לא פחות מאשר בפרסומות.`)}${def("מושג מפתח",`<mark>שיווק משולב</mark> ${E("Integrated marketing")}: שילוב והתאמה של פעילויות שיווק כדי למקסם את ההשפעה של כל אחת ושל כולן יחד. מעריכים אותן לפי ההשפעה על המודעות ועל האסוציאציות והתדמית.`)}<p><b>מינוף אסוציאציות משניות</b>: ״לקחת בהשאלה״ ערך, על ידי זיקה למשהו שכבר יש לו משמעות בזיכרון. המקורות (איור 8.4): החברה, ארץ המוצא, ערוצים, מותגים אחרים, דמויות ברישיון, דוברים, אירועים, מטרות חברתיות ומקורות צד שלישי (פרסים, ביקורות).</p><div class="tw"><table><tr><th>יתרון</th><th>סיכון</th></tr><tr><td>דרך <b>חסכונית ויעילה</b> לחזק מותג</td><td>כל דבר רע שקורה לישות האחרת, כמו שערורייה של מישהו שנותן חסות, נקשר גם למותג</td></tr></table></div>${ex("״נוף״ נותנת חסות למרתון העירוני. אם יתגלה שהמרתון מזהם את הפארק, גם ״נוף״ תיפגע.")}${def("מושג מפתח",`<mark>מיתוג פנימי</mark> ${E("Internal branding")}: פעילויות ותהליכים שמיידעים את העובדים על המותג ונותנים להם השראה, כי הם יכולים לעזור לערך המותג, או להזיק לו. משווקים הוליסטיים מכשירים גם את המפיצים והסוכנים.`)}`,q:"e5"}
 ]},
 {id:"t4",icon:"scales",title:"מדידה וניהול של ערך מותג",blocks:[
  {h:"ביקורת, מעקב והערכת מותג",html:`${def("על מה הנושא",`איך יודעים אם המותג חזק, כמה הוא שווה בכסף, ומה עושים כשהוא נחלש.<br><b>מה נלמד כאן:</b> מדידה עקיפה וישירה · ביקורת ומעקב · הערכת מותג בחמישה שלבים · חיזוק והחייאה`)}<div class="tw"><table><tr><th>גישה</th><th>מה מודדים</th></tr><tr><td><b>עקיפה</b></td><td>את <b>המקורות</b> לערך המותג: מבני ידע המותג של הצרכנים</td></tr><tr><td><b>ישירה</b></td><td>את <b>ההשפעה בפועל</b> של ידע המותג על התגובה לשיווק</td></tr></table></div>${tiles([["check","ביקורת מותג","Brand audit: להבין את המקורות לערך","סדרה ממוקדת של נהלים להערכת בריאות המותג, לחשוף את מקורות הערך ולהציע דרכים לשפר ולמנף. כדאי לעשות באופן קבוע.",""],["clock","מחקרי מעקב מותג","Brand tracking: להבין איך זה משתנה לאורך זמן","משתמשים בביקורות כתשומה, ואוספים נתונים כמותיים לאורך זמן. עוזרים בהחלטות היומיומיות.",""]])}${def("מושג מפתח",`<mark>הערכת מותג</mark> ${E("Brand valuation")}: אומדן <b>הערך הפיננסי</b> של המותג. זה לא אותו דבר כמו ערך מותג. בחברות ידועות, ערך המותג הוא לרוב יותר ממחצית משווי השוק.`)}<p><b>המודל של Interbrand</b> בחמישה שלבים:</p><ol><li><b>פילוח שוק</b>: ההבדלים בין קבוצות הלקוחות.</li><li><b>ניתוח פיננסי</b>: תחזית הכנסות, פחות עלויות, מסים וחיוב על ההון, עד ל<b>הכנסות כלכליות</b>.</li><li><b>חקר שוק</b>: איזה חלק מההכנסות נובע מהמותג, כלומר <b>הכנסות למותג</b>.</li><li><b>חוזק המותג</b>: מה הסיכוי שההכנסות יתממשו, ומכאן <b>שיעור ההנחה</b>.</li><li><b>ערך המותג</b>: הערך הנוכחי הנקי (NPV) של הכנסות המותג.</li></ol>`,q:"e6"},
  {h:"חיזוק המותג והחייאה",html:`<p>פעולות שיווק קצרות טווח משנות את הידע על המותג, ולכן משפיעות על ההצלחה של הפעולות בעתיד.</p>${tiles([["check","חיזוק המותג","Reinforcement: מסר עקבי ורצוף","מה המותג מייצג, אילו תועלות וצרכים, ואיך הוא הופך את המוצרים לעדיפים. המותג צריך להיות בתנועה קדימה, עם הצעות חדשות. לא משנים עמדה מוצלחת, אבל צריך הרבה שינויים <b>טקטיים</b>. כשחייבים לשנות, שומרים על מקורות הערך.",""],["cycle","החייאת המותג","Revitalization: להחזיר מותג לחיים","קאדילק, פיאט ופולקסווגן התאוששו. קודם מבינים מה היה מקור הערך: האם האסוציאציות החיוביות נחלשו? נוספו שליליות? אחר כך מחליטים אם לשמור על המיצוב או לבנות חדש.",""]])}<p>יש <b>רצף</b> של אסטרטגיות החייאה:</p><div class="tw"><table><tr><th>״בחזרה למקורות״</th><th>״המצאה מחדש״</th></tr><tr><td>כשהבעיה בתוכנית השיווקית, שלא מקיימת את הבטחת המותג</td><td>כשהמיצוב כבר לא מעשי</td></tr></table></div>${rem("האתגר: לשנות מספיק כדי למשוך לקוחות חדשים, אבל לא מספיק כדי להרחיק את הוותיקים. החייאה כמעט תמיד מתחילה <b>במוצר עצמו</b>.")}${ex("Gatorade מדגימה ״חזרה למקורות״: חזרה לספורטאים, שבשבילם המשקה נוצר.")}`,q:"e7"}
 ]},
 {id:"t5",icon:"copies",title:"אסטרטגיית מיתוג",blocks:[
  {h:"מיתוג מוצרים חדשים והחלטות מיתוג",html:`${def("על מה הנושא",`כשעסק משיק מוצר חדש, איך הוא יקרא לו? ואיך מנהלים כמה מותגים יחד?<br><b>מה נלמד כאן:</b> מונחי מיתוג · שלוש אסטרטגיות שמות · בית מותגים מול בית ממותג · תיק מותגים · הרחבות מותג`)}${def("מושג מפתח",`<mark>אסטרטגיית מיתוג</mark> ${E("Branding strategy")}, או ארכיטקטורת המותג: המספר והאופי של מרכיבי המיתוג. למוצר חדש יש <b>שלוש אפשרויות</b>: מרכיבים חדשים, מרכיבים קיימים, או שילוב.`)}<div class="tw"><table><tr><th>מושג (טבלה 8.3)</th><th>הגדרה</th></tr><tr><td><b>הרחבת מותג</b></td><td>מותג קיים משיק מוצר חדש</td></tr><tr><td><b>תת־מותג</b></td><td>מותג חדש משולב במותג קיים</td></tr><tr><td><b>מותג אב</b></td><td>המותג הקיים שמוליד את ההרחבה או את תת־המותג</td></tr><tr><td><b>מותג משפחה</b></td><td>מותג אב שמתקשר להרבה מוצרים דרך הרחבות</td></tr><tr><td><b>הרחבת קו</b></td><td>מוצר חדש <b>באותה קטגוריה</b> שמותג האב משרת</td></tr><tr><td><b>הרחבת קטגוריה</b></td><td>מוצר חדש <b>בקטגוריה אחרת</b></td></tr><tr><td><b>קו מותג</b></td><td>כל המוצרים תחת שם מותג אחד</td></tr><tr><td><b>תמהיל מותג</b></td><td>כל קווי המותג של מוכר מסוים</td></tr><tr><td><b>גרסאות ממותגות</b></td><td>קווים ייחודיים לקמעונאי או לערוץ מסוים</td></tr><tr><td><b>מוצר ברישוי</b></td><td>שם מותג של חברה אחת על מוצר של חברה אחרת</td></tr></table></div>${ex("״נוף״ משיקה מים בטעם לימון: הרחבת קו. ״נוף״ משיקה קרם לחות: הרחבת קטגוריה.")}<p><b>שלוש אסטרטגיות שמות</b>:</p><ul><li><b>שמות נפרדים</b>: אם מוצר נכשל, המוניטין של החברה לא נפגע.</li><li><b>שם משפחה אחד</b> (GE): עלויות פיתוח נמוכות, ושם טוב עוזר למוצר החדש.</li><li><b>תת־מיתוג</b> (Kellogg's Rice Krispies): שם החברה נותן הכשר, והשם הפרטי נותן זהות.</li></ul><div class="tw"><table><tr><th>בית מותגים</th><th>תת־מיתוג</th><th>בית ממותג</th></tr><tr><td>שמות נפרדים</td><td>באמצע הרצף</td><td>שם התאגיד כ״מטרייה״. כדאי שיהיה <b>מוצר דגל</b> שמייצג את המותג</td></tr></table></div>`,q:"e8"},
  {h:"תיק מותגים והרחבות מותג",html:`${def("מושג מפתח",`<mark>תיק מותגים</mark> ${E("Brand portfolio")}: כל המותגים וקווי המותג שהעסק מוכר בקטגוריה או בפלח. העיקרון: <b>למקסם כיסוי שוק</b> בלי להתעלם מאף לקוח, ו<b>למזער חפיפה</b> כדי שהמותגים לא יתחרו זה בזה.`)}${tiles([["x","מאגפים (״לוחמים״)","Flankers: מול מותגי המתחרים, כדי להגן על מותג הדגל","לא אטרקטיבי מדי, כדי שלא יגזול מכירות מהיקרים. לא זול מדי, כדי שלא יקרין עליהם לרעה.",""],["pie","פרות חולבות","Cash cows: מחזיקים בהם גם כשהמכירות יורדות","יש להם מספיק לקוחות, והם רווחיים גם בלי תמיכה שיווקית.",""],["cart","רמת כניסה בקצה הנמוך","Low-end entry level: מותג זול שמושך לקוחות","קמעונאים אוהבים מותגים ״מייצרי תנועה״, כי הם מושכים לקוחות למותג יקר יותר.",""],["grad","יוקרת הקצה העליון","High-end prestige: מותג יקר שמוסיף יוקרה","מוסיף יוקרה ואמינות לכל התיק.",""]])}<p><b>הרחבות מותג</b>: 80%–90% מהמוצרים החדשים בכל שנה הם הרחבות.</p><div class="tw"><table><tr><th>יתרונות</th><th>חסרונות</th></tr><tr><td><b>1. קבלת המוצר החדש</b>: ציפיות חיוביות מפחיתות סיכון; קל יותר לשכנע קמעונאים; הפרסום מתמקד רק במוצר; חיסכון בהשקה (מותג חדש יכול לעלות יותר מ־100 מיליון דולר), בשם ובאריזה.<br><b>2. משוב חיובי</b>: מבהירות את משמעות המותג, משפרות נאמנות, מעוררות עניין, ומרחיבות כיסוי שוק</td><td><b>דילול מותג</b>: השם מזוהה פחות עם מוצר כלשהו, והצרכנים מעריכים אותו פחות. הרחבות שלא מוצאות חן עלולות לבלבל ולתסכל (״איזו גרסה נכונה לי?״). קמעונאים עלולים לפסול מוצרים כשאין מקום על המדף</td></tr></table></div>`,q:"e9"}
 ]},
 {id:"t6",icon:"doc",title:"מיתוג רכיבים ואריזה (פרק 9)",blocks:[
  {h:"מיתוג משותף, מיתוג רכיבים ואריזה",html:`${def("על מה הנושא",`עמוד 212 מפרק 9: מה קורה כשמחברים שני מותגים, ומה תפקיד האריזה.<br><b>מה נלמד כאן:</b> חסרונות המיתוג המשותף · מיתוג רכיבים וארבע דרישות · מיתוג עצמי · אריזה`)}<p><b>מיתוג משותף</b>: הקריאה מתחילה בסוף הדיון. מיתוג משותף יכול ללמד על צרכנים ועל איך חברות אחרות ניגשות אליהם. ה<b>חסרונות</b>: סיכון וחוסר שליטה. הציפיות גבוהות, וביצועים מאכזבים פוגעים <b>בשני המותגים</b>. הצרכנים גם עלולים להרגיש פחות בטוחים במה שהם יודעים על המותג.</p>${def("מושג מפתח",`<mark>מיתוג רכיבים</mark> ${E("Ingredient branding")}: מקרה מיוחד של מיתוג משותף. בונים ערך מותג לחומרים, לרכיבים או לחלקים שנמצאים בתוך מוצרים ממותגים אחרים. למוצר מארח עם מותג חלש, רכיב ממותג נותן בידול ואיתות לאיכות.`)}<p><b>מיתוג עצמי</b> של רכיבים: העסק ממתג ומגן על רכיב משלו. רשת Westin מפרסמת את ״המיטה השמיימית״ שלה.</p><p><b>ארבע דרישות להצלחה</b>:</p><ol><li>הצרכנים מאמינים שהרכיב <b>מהותי</b> לביצועים של המוצר הסופי.</li><li>הם משוכנעים ש<b>לא כל הרכיבים זהים</b>, ושהרכיב הזה עדיף.</li><li><b>סמל או סמליל</b> בולט מסמן שהרכיב בפנים, כמו ״חותמת הכשר״.</li><li>תוכנית מתואמת של <b>״משיכה ודחיפה״</b>, עם תמיכה של כל הערוצים.</li></ol>${ex("בקבוקי ״נוף״ מסומנים ״עם מסנן X״. אם הצרכנים מאמינים שהמסנן עושה הבדל, הם יחפשו אותו גם במוצרים אחרים.")}${def("מושג מפתח",`<mark>אריזה</mark> ${E("Packaging")}: עיצוב וייצור המכל של המוצר. יש משווקים שרואים בה <b>״ה־P החמישי״</b>, אבל רובם רואים באריזה ובתיוג חלק מאסטרטגיית המוצר. עד <b>שלוש שכבות</b>: אריזה ראשית, בתוך אריזה משנית, בתוך אריזת משלוח.`)}`,q:"e10"}
 ]},
 {id:"t7",icon:"cycle",title:"מחזור חיי המוצר (פרק 9)",blocks:[
  {h:"השלבים, ושלב ההצגה",html:`${def("על מה הנושא",`מוצרים לא חיים לנצח. האסטרטגיה צריכה להשתנות כשהמוצר עובר שלבים.<br><b>מה נלמד כאן:</b> ארבע הנחות · ארבעה שלבים · יתרון החלוץ · צמיחה, בגרות ודעיכה · ביקורת`)}${def("מושג מפתח",`<mark>מחזור חיי המוצר</mark> ${E("Product life cycle, PLC")}: כשאומרים שלמוצר יש מחזור חיים, קובעים <b>ארבעה דברים</b>: (א) אורך החיים מוגבל; (ב) המכירות עוברות שלבים, ולכל אחד אתגרים משלו; (ג) הרווחים עולים ויורדים; (ד) בכל שלב צריך אסטרטגיה שונה בשיווק, מימון, ייצור, רכש ומשאבי אנוש.`)}<p>רוב העקומות הן <b>עקומות פעמון</b> (איור 9.5):</p><div class="tw"><table><tr><th></th><th>הצגה</th><th>צמיחה</th><th>בגרות</th><th>דעיכה</th></tr><tr><td><b>מכירות</b></td><td>נמוכות</td><td>עולות מהר</td><td>שיא</td><td>יורדות</td></tr><tr><td><b>עלות ללקוח</b></td><td>גבוהה</td><td>ממוצעת</td><td>נמוכה</td><td>נמוכה</td></tr><tr><td><b>רווחים</b></td><td>שליליים</td><td>עולים</td><td>גבוהים</td><td>יורדים</td></tr><tr><td><b>לקוחות</b></td><td>חדשנים</td><td>מאמצים מקדימים</td><td>רוב אמצעי</td><td>מאמצים מאחרים</td></tr></table></div><p><b>שלב ההצגה</b>: המכירות גדלות לאט, כי לוקח זמן לפתור בעיות, למלא את צנרת המלאי ולהתקבל. הרווחים שליליים או נמוכים, והקידום בשיא, כדי ליידע, לעודד התנסות ולהבטיח הפצה.</p>${tiles([["x","למה חלוצים נכשלים","שנארס חקר 28 ענפים שבהם החקיינים עלו על החדשנים","מוצר לא מעובד עד הסוף, מיצוב שגוי, השקה לפני שיש ביקוש, עלויות פיתוח גבוהות, חוסר משאבים מול מתחרים גדולים, וחוסר מקצועיות או שאננות בהנהלה. החקיינים הצליחו במחיר נמוך, בשיפורים מתמידים או בעוצמה שיווקית.",""],["check","מה בונה הובלה לטווח ארוך","טליס וגולדר: חמישה גורמים","חזון לכיבוש שוק ההמונים, התמדה, חדשנות בלתי נלאית, מחויבות פיננסית ומינוף נכסים. בחברות אינטרנט, מי שהרוויחו מתנועה מהירה נכנסו ראשונים לשווקים גדולים, בנו מחסומי כניסה ושלטו ברכיבים חיוניים.",""]])}`,q:"e11"},
  {h:"צמיחה, בגרות, דעיכה וביקורת",html:`<p><b>שלב הצמיחה</b>: המכירות נוסקות, מתחרים נכנסים, המחירים מתייצבים או יורדים מעט. המכירות עולות מהר יותר מהוצאות השיווק, ולכן הרווחים גדלים. כדי להמשיך לצמוח: לשפר איכות, להוסיף תכונות, דגמים ו<b>מוצרים מאגפים</b>, להיכנס לשווקים וערוצים חדשים, לעבור מתקשורת של <b>מודעות</b> לתקשורת של <b>העדפה ונאמנות</b>, ולהוריד מחירים. העסק מוותר על רווח מרבי עכשיו, בשביל נתח שוק ורווחים גדולים בשלב הבא.</p><p><b>שלב הבגרות</b>: רוב המוצרים נמצאים בו, והוא בדרך כלל הארוך ביותר. <b>שלוש דרכים</b> לשנות את המהלך:</p>${tiles([["people","שינוי השוק","יותר משתמשים, או יותר שימוש","להמיר לא משתמשים, להיכנס לפלחים חדשים, למשוך לקוחות של מתחרים. או לשכנע קיימים להשתמש בהזדמנויות נוספות, בכמות גדולה יותר או בדרכים חדשות.","״נוף״ משכנעת לשתות מים גם בארוחת הערב."],["gear","שינוי המוצר","שיפור איכות, תכונות או סגנון","",""],["chart","שינוי התוכנית השיווקית","מחיר, הפצה, ובמיוחד תקשורת","",""]])}<p><b>שלב הדעיכה</b>: בגלל טכנולוגיה, שינוי טעם או תחרות זרה. התוצאה: עודף כושר ייצור, הוזלות ושחיקת רווחים. יש שנסוגים, ויש שמצמצמים מוצרים, פלחים, ערוצים ותקציב. החזקת מוצר חלש עולה ביוקר.</p><div class="tw"><table><tr><th>מצב</th><th>מה לעשות</th></tr><tr><td>ענף לא אטרקטיבי, תחרות חזקה</td><td><b>כיווץ בררני</b></td></tr><tr><td>מתחרה חזק בענף אטרקטיבי</td><td><b>הגדלת השקעות</b></td></tr><tr><td><b>קציר</b></td><td>קיצוץ הדרגתי בעלויות, תוך ניסיון לשמור על המכירות</td></tr><tr><td><b>נטישה</b></td><td>מוצר עם הפצה ומוניטין טובים אפשר למכור לעסק אחר</td></tr></table></div>${rem("<b>ביקורת על התפיסה</b>: ההבדלים בין מוצרים גדולים מכדי להכליל, ונדיר לדעת באיזה שלב המוצר נמצא. מה שנראה כבגרות יכול להיות רק הפסקה לפני צמיחה. ויש שטוענים שהדפוס <b>מגשים את עצמו</b>, ושיווק טוב יכול להביא לצמיחה מתמשכת.")}`,q:"e12"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין חלקי הקריאה: ערך מותג, אסטרטגיית מיתוג ומחזור חיי המוצר.`)}${rem("טיפ: הרחבת <b>קו</b> נשארת באותה קטגוריה. הרחבת <b>קטגוריה</b> יוצאת ממנה.")}`,q:"ex"}

<li><b>ערך מותג מבוסס לקוח</b>: ההשפעה הדיפרנציאלית של ידע המותג. שלושה מרכיבים: הבדלים בתגובות; <b>ידע מותג</b> (אסוציאציות חזקות, חיוביות וייחודיות); תפיסות, העדפות והתנהגות.</li>
<li><b>טבלה 8.1</b>: נאמנות, פחות פגיעות, מרווחים, תגובה קשיחה להעלאת מחיר וגמישה להוזלה, תמיכת סוחרים, רישוי ועוד.</li>
<li><b>הבטחת מותג</b>: החזון של המשווק. הצרכנים מחליטים לאן המותג יכול להתקדם (Cracker Jack).</li>
<li><b>מודלים</b>: <b>BAV</b> (בידול נמרץ, רלוונטיות, הערכה, ידע; חוזק מול שיעור קומה; דפוסי מותג חדש, מוביל ודועך); <b>BrandZ</b> (אסוציאציות משמעותיות, שונות ובולטות; עוצמה, תוספת מחיר, פוטנציאל); <b>תהודת המותג</b> (זהות ← משמעות ← תגובה ← תהודה; רציונלי משמאל, רגשי מימין).</li>
</ul>
<h3>3. בניית ערך מותג</h3>
<ul>
<li><b>שלושה מנועים</b>: מרכיבי המותג (Bing); המוצר והשיווק; אסוציאציות עקיפות (42BELOW).</li>
<li><b>מרכיבי מותג</b>: המבחן הוא מה חושבים מהמרכיב לבדו (Toughbook). שישה תבחינים: לבנייה, זכיר, משמעותי, מתחבב; להגנה, בר־העברה, ניתן להתאמה, בר־הגנה.</li>
<li><b>מגע עם מותג</b>: כל חוויה עם מידע. <b>שיווק משולב</b>: פעילויות שמחזקות זו את זו.</li>
<li><b>אסוציאציות משניות</b> (איור 8.4): חסכוניות, אבל מסוכנות אם הישות האחרת נפגעת.</li>
<li><b>מיתוג פנימי</b>: לחבר את העובדים, ואת המפיצים, למותג.</li>
</ul>
<h3>4. מדידה וניהול</h3>
<ul>
<li>מדידה <b>עקיפה</b> (מקורות) ו<b>ישירה</b> (השפעה). <b>ביקורת מותג</b> (מקורות הערך) ו<b>מעקב מותג</b> (לאורך זמן).</li>
<li><b>הערכת מותג</b> (ערך כספי). Interbrand: פילוח ← ניתוח פיננסי (הכנסות כלכליות) ← חקר שוק (הכנסות למותג) ← חוזק המותג (שיעור הנחה) ← NPV.</li>
<li><b>חיזוק</b>: מסר עקבי, תנועה קדימה, שינויים טקטיים. <b>החייאה</b>: להבין את מקור הערך; רצף מ״חזרה למקורות״ (התוכנית לא מקיימת את ההבטחה) עד ״המצאה מחדש״ (המיצוב לא מעשי). מתחילה במוצר.</li>
</ul>
<h3>5. אסטרטגיית מיתוג</h3>
<ul>
<li><b>טבלה 8.3</b>: הרחבת מותג, תת־מותג, מותג אב, מותג משפחה, הרחבת קו (אותה קטגוריה), הרחבת קטגוריה (קטגוריה אחרת), קו מותג, תמהיל מותג, גרסאות ממותגות, מוצר ברישוי.</li>
<li><b>שלוש אסטרטגיות שמות</b>: נפרדים (כישלון לא פוגע במוניטין); שם משפחה אחד (GE, עלות נמוכה); תת־מיתוג (Kellogg's Rice Krispies). <b>בית מותגים</b> מול <b>בית ממותג</b> (עם מוצר דגל).</li>
<li><b>תיק מותגים</b>: כיסוי מרבי, חפיפה מזערית. תפקידים: מאגפים, פרות חולבות, רמת כניסה בקצה הנמוך, יוקרת הקצה העליון.</li>
<li><b>הרחבות</b> (80%–90% מהמוצרים החדשים). יתרונות: קבלה (ציפיות, קמעונאים, חיסכון) ומשוב חיובי. חסרונות: <b>דילול מותג</b>, בלבול, מקום על המדף.</li>
</ul>
<h3>6. מיתוג רכיבים ואריזה (פרק 9)</h3>
<ul>
<li><b>מיתוג משותף</b>, חסרונות: סיכון, חוסר שליטה, פגיעה בשני המותגים.</li>
<li><b>מיתוג רכיבים</b>: ערך מותג לרכיב בתוך מוצר אחר. מיתוג עצמי (Westin). ארבע דרישות: מהותי, לא כל הרכיבים זהים, סמל בולט, משיכה ודחיפה.</li>
<li><b>אריזה</b>: לעתים ״ה־P החמישי״. עד שלוש שכבות: ראשית, משנית, משלוח.</li>
</ul>
<h3>7. מחזור חיי המוצר (פרק 9)</h3>
<ul>
<li><b>ארבע הנחות</b>: חיים מוגבלים, שלבים, רווחים משתנים, אסטרטגיה שונה בכל שלב.</li>
<li><b>הצגה</b>: מכירות איטיות, רווחים שליליים, קידום בשיא. חלוצים נכשלים (שנארס) מול גורמי הובלה (טליס וגולדר).</li>
<li><b>צמיחה</b>: מכירות נוסקות, מתחרים נכנסים, רווחים עולים. מוצרים מאגפים, ערוצים חדשים, ממודעות להעדפה.</li>
<li><b>בגרות</b>: הארוך ביותר. שינוי השוק, המוצר או התוכנית.</li>
<li><b>דעיכה</b>: כיווץ בררני, הגדלת השקעה, <b>קציר</b> או <b>נטישה</b>.</li>
<li><b>ביקורת</b>: קשה להכליל ולדעת את השלב, והדפוס מגשים את עצמו.</li>
</ul>
<div class="key"><b>השורה התחתונה: מה רוצים ממך</b><br>להגדיר מותג וערך מותג מבוסס לקוח; להכיר את שלושת המודלים; לסווג תבחין של מרכיב מותג; להבחין בין ביקורת, מעקב והערכה; לזהות במקרה סוג הרחבה, אסטרטגיית שמות ותפקיד בתיק; למנות את דרישות מיתוג הרכיבים; ולהתאים מאפיינים ואסטרטגיות לכל שלב במחזור החיים.</div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
