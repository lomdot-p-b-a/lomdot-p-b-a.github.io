  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"pie",title:"תמהיל התקשורת השיווקית",blocks:[
  {h:"שמונת הכלים ומה מאפיין כל אחד",html:`${def("על מה הנושא",`לעסק יש תקציב תקשורת אחד, ושמונה כלים לחלק אותו ביניהם. הנושא מציג את הכלים, ואיך בוחרים ביניהם.<br><b>מה נלמד כאן:</b> שמונת הכלים · שלושה גורמים לבחירה · מדידה · תקשורת שיווקית משולבת`)}${ex("בלומדה נלווה את <b>עדי</b>, מנהלת השיווק של ״פלא״, מותג גלידות שמשיק טעם חדש.")}<p>עסקים מחפשים כל הזמן להחליף כלי אחד בכלי יעיל יותר, למשל חלק מאנשי המכירות בפרסום ובדיוור. בגלל היכולת להחליף, צריך <b>תיאום</b> בין הפונקציות.</p><div class="tw"><table><tr><th>כלי</th><th>מה מאפיין אותו</th></tr><tr><td><b>פרסום</b></td><td>מגיע לקונים מפוזרים. בונה תדמית לטווח ארוך, או מניע מכירה מהירה. נוכחות מתמדת והבלטה דרמטית</td></tr><tr><td><b>קידום מכירות</b></td><td>קופונים, תחרויות ומתנות לתגובה חזקה ומהירה. מושך תשומת לב, נותן תמריץ, ומזמין לקנות עכשיו</td></tr><tr><td><b>אירועים וחוויות</b></td><td>רלוונטיים, הצרכן מעורב אישית. מכירה ״רכה״ ועקיפה</td></tr><tr><td><b>יחסי ציבור ודוברות</b></td><td>אמינות גבוהה, מגיעים למי שנמנע מפרסום, מספרים סיפור</td></tr><tr><td><b>שיווק מקוון וברשתות</b></td><td>עתיר מידע או בידור, אפשר לעדכן לפי התגובה, ומהיר</td></tr><tr><td><b>שיווק בניידים</b></td><td>רגיש לזמן ולמיקום, ומגיע בזמן ההחלטה</td></tr><tr><td><b>שיווק ישיר ובמסדי נתונים</b></td><td>מותאם אישית, קורא לפעולה, ותומך בתקשורת אחרת</td></tr><tr><td><b>מכירה אישית</b></td><td>הכי יעילה <b>בשלבים המאוחרים</b>: העדפה, שכנוע ופעולה. מותאמת לפרט, מבוססת יחסים ומכוונת לתגובה</td></tr></table></div>`,q:"e1"},
  {h:"שלושה גורמים בבחירת התמהיל",html:`<p><b>1. סוג השוק</b>: לצרכנים מוציאים יותר על קידום מכירות ופרסום. לעסקים, יותר על מכירה אישית. אבל גם בשוק העסקי הפרסום חשוב (מציג, מסביר, מזכיר, מייצר ״מובילים״ ומחזק ביטחון). ובשוק הצרכנים, אנשי מכירות משכנעים מפיצים להחזיק יותר מלאי ומדף.</p><p><b>2. שלב המוכנות של הקונה</b> (איור 14.4):</p><div class="tw"><table><tr><th>שלב</th><th>הכלי היעיל ביותר</th></tr><tr><td><b>מודעות</b> ו<b>הבנה</b></td><td>פרסום ויחסי ציבור</td></tr><tr><td><b>שכנוע</b></td><td>מכירה אישית</td></tr><tr><td><b>הזמנה</b> (סגירה)</td><td>מכירה אישית וקידום מכירות</td></tr><tr><td><b>הזמנה חוזרת</b></td><td>מכירה אישית וקידום מכירות, ופחות פרסום תזכורת</td></tr></table></div><p>פעילויות מקוונות יכולות להשפיע בכל השלבים.</p><p><b>3. השלב במחזור חיי המוצר</b>:</p><ul><li><b>הצגה</b>: פרסום, אירועים ויחסי ציבור. אחריהם מכירה אישית להפצה, וקידום מכירות ושיווק ישיר להתנסות.</li><li><b>צמיחה</b>: הביקוש ממשיך מעצמו, בזכות פה לאוזן ושיווק הידודי.</li><li><b>בגרות</b>: אירועים, פרסום ומכירה אישית חשובים יותר.</li><li><b>דעיכה</b>: קידום מכירות נשאר חשוב, השאר פוחתים.</li></ul>${ex("״פלא״ משיקה טעם חדש. עדי מתחילה בפרסום ובאירוע השקה כדי לבנות מודעות, ומוסיפה טעימות בסופר כדי שינסו.")}`,q:"e2"},
  {h:"מדידה ותקשורת שיווקית משולבת",html:`<p><b>מדידה</b>: שואלים את קהל המטרה אם זיהו את המסר או נזכרו בו, כמה פעמים ראו, מה זכרו, איך הרגישו, ומה העמדות לפני ואחרי. ואוספים גם <b>מדדים התנהגותיים</b>: כמה קנו, אהבו ודיברו על המוצר.</p>${def("מושג מפתח",`<mark>תקשורת שיווקית משולבת</mark> ${E("Integrated marketing communications, IMC")}, לפי איגוד הפרסום האמריקני: תהליך תכנון שמבטיח שכל המגעים של לקוח עם המותג יהיו <b>רלוונטיים</b> לו ו<b>עקביים לאורך זמן</b>. מטרתו בהירות, עקביות והשפעה מרבית.`)}<p><b>תיאום ערוצים</b>: משלבים ערוצים אישיים ולא אישיים במסעות <b>רב־כליים ורב־שלביים</b>. פרסום מייעל מבצעים ופניות מקוונות, ומודעות ועמדות שהפרסום יוצר עוזרות למכירה הישירה. כתובת אתר במודעה ועל האריזה שולחת אנשים לעוד מידע ולחנויות.</p><p><b>היתרונות</b>: יותר עקביות במסר, ערך מותג, והשפעה על המכירות. היא מכריחה את ההנהלה לחשוב על כל המגעים, ומטילה על מישהו את האחריות לאחד את התדמית והמסרים. המטרה: הלקוחות הנכונים, המסר הנכון, בזמן ובמקום הנכונים.</p>`,q:"e3"}
 ]},
 {id:"t2",icon:"cart",title:"פרסום וקידום מכירות",blocks:[
  {h:"נתח קול, וקידום מכירות מול פרסום",html:`${def("על מה הנושא",`כמה להוציא על פרסום, ומה עושה קידום מכירות שפרסום לא עושה.<br><b>מה נלמד כאן:</b> נתח הוצאות ונתח קול · מדידת השפעה על מכירות · קידום מכירות · זיקת צרכן־מוצר · יעדים וכלים · תוכנית והערכה`)}<p><b>האם מוציאים מספיק על פרסום?</b> לפי איור 15.2, <b>נתח ההוצאות לפרסום</b> מייצר <b>נתח קול</b> (החלק של העסק מכל הפרסום למוצר), שכובש <b>נתח בתודעה ובלב</b>, ובסוף <b>נתח שוק</b>. את ההשפעה על המכירות מודדים בגישה <b>היסטורית</b> (מתאם סטטיסטי בין הוצאות ומכירות בעבר) או ב<b>ניסויים</b>.</p>${def("מושג מפתח",`<mark>קידום מכירות</mark> ${E("Sales promotion")}: כלי תמריץ, רובם קצרי טווח, לעורר קנייה מהירה או גדולה יותר אצל צרכנים או סוחרים. <b>הפרסום נותן סיבה לקנות, וקידום המכירות נותן תמריץ.</b>`)}<div class="tw"><table><tr><th>בונה זיקת צרכן־מוצר</th><th>לא בונה זיקה</th></tr><tr><td>מעביר מסר דרך המבצע, ובונה ערך מותג: <b>דוגמיות</b>, פרסים למתמידים, מתנות שקשורות למוצר. מקדונלד׳ס וסטארבקס מחלקות דוגמיות</td><td>מארזים בהוזלה, מתנות לא קשורות, תחרויות והגרלות, החזר כספי, הנחות לסוחרים</td></tr></table></div><ul><li>בשווקים שבהם <b>המוצרים דומים</b>: תגובה גבוהה בטווח הקצר, אבל כמעט בלי גידול קבוע בנתח.</li><li>בשווקים עם <b>הבדלים</b> בין מותגים: המבצעים יכולים לשנות נתחים לצמיתות.</li><li>צרכנים גם <b>אוגרים</b>: קונים מוקדם או יותר. אחרי המבצע המכירות עלולות לצלול.</li><li>תחום שצומח מהר: <b>קופונים דיגיטליים</b> (זולים, קלים לעדכון, ופדיון גבוה יותר).</li></ul>`,q:"e4"},
  {h:"יעדים וכלים לצרכנים",html:`<p><b>ההחלטות</b>: יעדים, כלים, תוכנית, יישום ובקרה, והערכה. היעדים נגזרים מיעדי התקשורת, שנגזרים מיעדי השיווק.</p><div class="tw"><table><tr><th>יעדים מול...</th><th>דוגמאות</th></tr><tr><td><b>צרכנים</b></td><td>לקנות יותר או יחידות גדולות; התנסות של לא משתמשים; למשוך ״מחליפי מותגים״ מהמתחרים</td></tr><tr><td><b>קמעונאים</b></td><td>להחזיק פריטים חדשים ויותר מלאי; קנייה מחוץ לעונה; תגובה למבצעי מתחרים; נאמנות; חנויות חדשות</td></tr><tr><td><b>אנשי מכירות</b></td><td>לתמוך במוצר חדש; לחפש לקוחות חדשים; למכור מחוץ לעונה</td></tr></table></div><p><b>כלים לצרכנים</b> (טבלה 15.2):</p><ul><li><b>דוגמיות</b>: כמות חינם.</li><li><b>תלושים</b>: חיסכון נקוב ברכישה.</li><li><b>החזר כספי או זיכוי</b>: הנחה <b>אחרי</b> הקנייה, לפי הוכחת קנייה.</li><li><b>מבצעי הוזלה</b>: אריזה במחיר מוזל (שניים באחד), או <b>מארז בהנחה</b> של מוצרים קשורים (משחה ומברשת).</li><li><b>מתנות</b>: צמודה לאריזה, חינם בדואר, או <b>במכירת חיסול</b> (במחיר נמוך).</li><li><b>תוכניות למתמידים</b>, <b>פרסי נאמנות</b>.</li><li><b>תחרויות, הגרלות ומשחקים</b>: בתחרות שופטים בוחרים תשובה; בהגרלה רק נרשמים; במשחק מקבלים משהו בכל קנייה.</li><li><b>התנסות חינם</b>, <b>אחריות</b>.</li><li><b>קידום מקושר</b> (שני מותגים יחד), <b>קידום צולב</b> (מותג אחד מפרסם מותג שלא מתחרה בו).</li><li><b>תצוגות והדגמות</b> בנקודת המכירה.</li></ul>${rem("קידום מכירות יכול להיות <b>ביוזמת היצרן</b> (למשל החזר כספי בענף הרכב) או <b>ביוזמת הקמעונאי</b> (הוזלות ותלושי הרשת).")}`,q:"e5"},
  {h:"כלים לסוחרים ולעסקים, ויישום",html:`<p>יצרנים מקדמים מכירות אצל <b>סוחרים</b> כדי ש(א) יחזיקו את המותג; (ב) יחזיקו יותר מלאי; (ג) יקדמו אותו בפרסום, תצוגה והוזלה; (ד) ״ידחפו״ אותו. הכלים (טבלה 15.3):</p>${tiles([["chart","הנחה","Price-off","הנחה ממחיר המחירון על כל ארגז שנרכש בתקופה מסוימת.",""],["hand","זיכוי","Allowance","תשלום תמורת הבלטה: <b>זיכוי לפרסום</b> או <b>זיכוי לתצוגה</b>.",""],["cart","סחורות חינם","Free goods","כמות נוספת למי שקונה כמות מסוימת או מקדם גודל מסוים.",""]])}<p><b>לעסקים ולאנשי המכירות</b> (טבלה 15.4):</p><ul><li><b>תערוכות וכנסים</b>: משווקים עסקיים מוציאים עליהם עד 35% מתקציב הקידום. חשובות לעסקים חדשים, אבל <b>העלות ליצירת קשר היא הגבוהה ביותר</b>.</li><li><b>תחרויות מכירה</b> לאנשי מכירות וסוכנים.</li><li><b>מוצרים פרסומיים מיוחדים</b>: עטים, לוחות שנה, מחזיקי מפתחות עם שם החברה.</li></ul><p><b>פיתוח התוכנית</b>: גודל התמריץ, תנאי השתתפות, משך, אמצעי הפצה, תזמון ותקציב. <b>העלות</b> = עלות מנהלית + (עלות התמריץ × היחידות שיימכרו). בתלושים, רק חלק קטן יפדו.</p><p><b>יישום</b>: <b>זמן היערכות</b> (ההכנות), ו<b>זמן המכירה</b>, מההשקה עד ש־95% מהסחורה אצל הצרכנים. <b>הערכה</b>: נתוני מכירות וסורקים, סקרי צרכנים, וניסויים.</p>`,q:"e6"}
 ]},
 {id:"t3",icon:"people",title:"אירועים, חוויות ויחסי ציבור",blocks:[
  {h:"יעדי אירועים והחלטות על חסות",html:`${def("על מה הנושא",`איך מותג נכנס לרגעים המיוחדים של הלקוחות, ואיך מנהלים את היחסים עם הציבור.<br><b>מה נלמד כאן:</b> אווירה · שמונה יעדי אירועים · החלטות על חסות · שיווק חווייתי · יחסי ציבור · יחסי ציבור שיווקיים`)}<p>אירועים וחוויות בחסות העסק מעמיקים את היחסים עם שוק המטרה. <b>אווירה</b> היא ״סביבה ארוזה״ שמחזקת נטייה לקנות, כמו נברשות ושיש במלון יוקרה.</p><p><b>שמונה יעדים</b> לחסות על אירועים:</p><ol><li><b>הזדהות עם שוק מטרה</b> או סגנון חיים (Old Spice בכדורסל המכללות).</li><li><b>מודעות</b> לשם החברה או המוצר (מקדונלד׳ס וקסטרול במונדיאל).</li><li><b>אסוציאציות לתדמית המותג</b> (טויוטה טונדרה וטורנירי דיג).</li><li><b>חיזוק התדמית התאגידית</b> (ויזה והאולימפיאדה).</li><li><b>חוויות ותחושות</b> (אאודי באיירונמן 2).</li><li><b>מחויבות לקהילה</b>: שיווק הקשור למטרה חברתית.</li><li><b>בידור לקוחות ותגמול עובדים</b>.</li><li><b>קישור למסחור וקידום מכירות</b>: תחרויות, הגרלות.</li></ol>${rem("החסרונות: קשה לחזות את התוצאות, ואין שליטה. ויש צרכנים שמתרעמים על המסחור.")}<p><b>החלטות</b>: (1) <b>בחירת אירוע</b> שמתאים ליעדים ולשוק, עם תדמית רצויה. אידיאלי: ייחודי, בלי יותר מדי נותני חסות. (2) <b>תוכנית</b>: על פעילויות השיווק הנלוות כדאי להוציא <b>פי שניים או שלושה</b> מההוצאה על החסות עצמה. (3) <b>מדידה</b>: <b>צד ההיצע</b> (היקף הכיסוי, כמה שניות המותג נראה) מול <b>צד הביקוש</b> (ההשפעה על הידע של הצרכנים).</p><p><b>שיווק חווייתי</b>: מקשר את המוצר לחוויות ייחודיות. לפי סקר, ארבעה מכל חמישה מרגישים שאירוע חי מעסיק אותם יותר מכל תקשורת אחרת.</p>`,q:"e7"},
  {h:"יחסי ציבור ויחסי ציבור שיווקיים",html:`${def("מושג מפתח",`<mark>ציבור</mark> ${E("Public")}: כל קבוצה עם עניין, או השפעה, על יכולת העסק להשיג את יעדיו. <b>יחסי ציבור</b> (PR): תוכניות לקידום התדמית או להגנה עליה.`)}<p>מחלקת יחסי ציבור טובה גם <b>מייעצת</b> להנהלה לאמץ תוכניות חיוביות ולוותר על דפוסים מפוקפקים, כדי שלא תהיה סיבה לפרסום שלילי. <b>חמישה תפקידים</b>: קשרי עיתונות; יחסי ציבור למוצר; תקשורת לתאגיד; <b>שתדלנות</b> מול מחוקקים; ייעוץ להנהלה.</p>${def("מושג מפתח",`<mark>יחסי ציבור שיווקיים</mark> ${E("Marketing public relations, MPR")}: משרתים את מחלקת השיווק. פעם קראו להם <b>פרסום פומבי</b>, שמשיג <b>שטח מערכתי</b> ולא שטח פרסומי בתשלום. אבל התפקיד שלהם רחב יותר.`)}<div class="tw"><table><tr><th>משימה</th><th>דוגמה מהספר</th></tr><tr><td>השקת מוצרים חדשים</td><td>Silly Bandz</td></tr><tr><td>מיצוב מחדש של מוצר בוגר</td><td>I Love New York</td></tr><tr><td>עניין בקטגוריה</td><td>ביצים, חלב, תה ומיץ תפוזים</td></tr><tr><td>השפעה על קבוצות ייחודיות</td><td>אירועים שכונתיים של מקדונלד׳ס</td></tr><tr><td>הגנה על מוצרים במשבר</td><td>טויוטה</td></tr><tr><td>בניית תדמית תאגידית</td><td>הנאומים של סטיב ג׳ובס</td></tr></table></div><p>עם הירידה בכוח הפרסום להמונים, יחסי ציבור שיווקיים יכולים להיות <b>יעילים כלכלית יותר מפרסום</b>, אבל צריך לתכנן אותם יחד איתו. ההחלטות: יעדים, מסרים וכלים, יישום והערכה.</p>`,q:"e8"}
 ]},
 {id:"t4",icon:"doc",title:"שיווק מקוון",blocks:[
  {h:"ערוצים, יתרונות וחסרונות, ואתרים",html:`${def("על מה הנושא",`הערוצים הדיגיטליים צומחים הכי מהר. הנושא מציג את השיווק המקוון וכליו.<br><b>מה נלמד כאן:</b> בתשלום, בבעלות ושיתופי · יתרונות וחסרונות · 7 מרכיבי אתר · מיקרו־אתר · חיפוש, SEO, תצוגה ודואר`)}<p>הפתיחה של פרק 16: פפסי, עם ״Dewmocracy״ שבה הצרכנים בחרו טעם חדש, ותחרות הפרסומת של דוריטוס לסופרבול. השאלה היא לא רק ״איך נגיע ללקוחות״, אלא גם ״איך הם יגיעו אלינו, וזה לזה״.</p><div class="tw"><table><tr><th>ערוצים</th><th>מה זה</th></tr><tr><td><b>בתשלום</b></td><td>פרסום, תקשורת ויחסי ציבור, וקידום מכירות</td></tr><tr><td><b>בבעלות</b></td><td>בעיקר התקשורת המקוונת של העסק</td></tr><tr><td><b>שיתופיים</b></td><td>מה שמרוויחים <b>בלי תשלום ישיר</b>: כתבות, בלוגים ושיחות ברשתות</td></tr></table></div><div class="tw"><table><tr><th>יתרונות</th><th>חסרונות</th></tr><tr><td>מסרים מותאמים לתחומי עניין; קל למדוד (יוניקים, קליקים, זמן); <b>מיקום בהקשר</b> (באתרים קשורים); פרסומות לפי מילות חיפוש, בדיוק כשמתחילים לקנות</td><td>הצרכנים מסננים; קליקים מזויפים; אובדן שליטה, פריצה והשחתה</td></tr></table></div><p>היתרונות לרוב עדיפים, וכמחצית מזמן המדיה של אמריקנים מוקדש לעולם המקוון.</p><p><b>שבעה מרכיבים של אתר יעיל</b> (רייפורט וג׳וורסקי): <b>הקשר</b> (מתווה ועיצוב), <b>תוכן</b>, <b>קהילה</b>, <b>התאמה אישית</b>, <b>תקשורת</b>, <b>קישור</b> לאתרים אחרים, ו<b>מסחר</b>. המבקרים שופטים לפי קלות שימוש ואטרקטיביות.</p>${def("מושג מפתח",`<mark>מיקרו־אתר</mark> ${E("Microsite")}: דף או כמה דפים שמשלימים את האתר הראשי. מתאים למוצרים שהעניין בהם נמוך, כמו ביטוח: חברה מציבה מיקרו־אתר עם ייעוץ, באתר למכירת רכב משומש.`)}`,q:"e9"},
  {h:"פרסומות חיפוש, תצוגה ודואר אלקטרוני",html:`${tiles([["question","קישור ממומן","Paid search, Pay-per-click: פרסומת שמופיעה ליד תוצאות החיפוש","המשווק מציע תשלום על מונחי חיפוש. המיקום נקבע לפי ההצעה ולפי הרלוונטיות. <b>משלמים רק על הקלקה</b>, ומי שכבר מחפש הוא לקוח מבטיח.",""],["chart","טיוב מנועי חיפוש","SEO: להופיע גבוה בתוצאות הלא ממומנות","מונחים <b>רחבים</b> טובים לבניית מותג, מונחים <b>ספציפיים</b> (דגם מסוים) טובים ל״מובילים״ ומכירות. להדגיש את המונחים באתר, ולהתאים את ההצעה לכל מילה לפי התשואה.",""],["copies","פרסומות תצוגה","Display ads, דגלונים: תיבות קטנות באתרים רלוונטיים","קהל גדול יותר עולה יותר. רק כ־5% מהזמן ברשת הוא חיפוש, ולכן לתצוגה יש פוטנציאל. <b>פרסומות בין־תאיות</b> קופצות בין דפים, ונתפסות כפולשניות.",""],["doc","דואר אלקטרוני","בשבריר מעלות השיווק הישיר","הערכה: תורם לרכישות פי שלושה לפחות מפרסומות ברשתות, וערך ההזמנה גבוה ב־17%. אבל הצרכנים מוצפים ומסננים. צריך להיות בזמן, ממוקד ורלוונטי. Gilt Groupe שולחת יותר מ־3,000 גרסאות.",""]])}${ex("עדי קונה את מונח החיפוש ״גלידה טבעונית״, ומשלמת רק כשמישהו לוחץ. במקביל היא שולחת מייל עם טעם חדש רק למי שקנה טבעוני בעבר.")}`,q:"e10"}
 ]},
 {id:"t5",icon:"phone",title:"רשתות, מפה לאוזן וניידים",blocks:[
  {h:"רשתות חברתיות",html:`${def("מושג מפתח",`<mark>רשת חברתית</mark> ${E("Social media")}: כלים שבהם צרכנים משתפים מלל, תמונות, שמע ווידאו, ביניהם ועם עסקים. היא נותנת למותג <b>קול ונוכחות ציבורית</b>, מחזקת תקשורת אחרת בזול, ומעודדת חדשנות ורלוונטיות.`)}<p><b>שלוש פלטפורמות</b>:</p><ul><li><b>קהילות ופורומים</b>: חלקם של צרכנים, חלקם במימון עסקים. המידע זורם לשני הכיוונים ונותן תובנות.</li><li><b>בלוגים</b>: מחברים אנשים עם עניין משותף ומולידים מנהיגי דעה. ועדת הסחר מחייבת בלוגרים לחשוף קשרים עם משווקים. ויש צרכנים שמשתמשים בהם כדי ״לנקום״.</li><li><b>רשתות חברתיות</b>: פייסבוק, לינקדאין (אנשי מקצוע), טוויטר (140 תווים).</li></ul>${rem("ברשתות קשה יותר למשוך תשומת לב ולשכנע, כי אנשים באים להתחבר זה עם זה. ופרסומות עלולות להופיע ליד תוכן פוגעני. לכן עסקים גם <b>משתתפים</b> בקבוצות, ודף פייסבוק נעשה הכרחי.")}<p><b>מגבלות</b>: הרשת החברתית היא כמעט אף פעם לא המקור היחיד. היא פחות טובה למשיכת משתמשים חדשים. לפי DDB, יש הבדלים גדולים: נושאי תקשורת, צדקה ואופנה ״חברתיים״, מוצרי צריכה פחות. ורק <b>מעטים</b> רוצים ״שיחה״ עם מותג, ורק חלק מהזמן.</p>`,q:"e11"},
  {h:"שיווק מפה לאוזן ושיווק בניידים",html:`<p>בניגוד לדעה המקובלת, לפי קלר ופיי, <b>90%</b> מהפרסום מפה לאוזן מתרחש <b>מחוץ לרשת</b>: 75% פנים אל פנים ו־15% בטלפון. ופה לאוזן ופרסום קשורים: הפרסום מניע את השיחה.</p>${def("מושג מפתח",`<mark>שיווק ויראלי</mark> ${E("Viral marketing")}: פה לאוזן מקוון, שמעודד צרכנים להעביר ברשת תוכן שהעסק פיתח.`)}<ul><li>להיות ״חדיש ומפתיע״ כמעט לא משפיע על שיחות פנים אל פנים. מדברים על מותגים <b>בולטים</b> שקל להיזכר בהם.</li><li>צרכנים מפיצים ביוזמתם <b>חוויות חיוביות</b> שלהם. שלילי הם מעבירים בעיקר כששמעו על חוויות של אחרים.</li><li>רוב התוכן לא הופך ויראלי: רק <b>4%</b> מגיעים ליותר מאדם אחד מעבר לנמען.</li><li><b>ביקורות</b> של לקוחות: לפי נילסן, המקור השני באמינותו, אחרי המלצת חברים ומשפחה.</li></ul>${ex("P&G רשמה יותר מחצי מיליון אימהות ל־Vocalpoint. לאימהות האלה יש קבוצות גדולות: הן מדברות עם 25 עד 30 נשים ביום, לעומת 5 בממוצע.")}<p><b>צעדים לבאזז חיובי</b>: לזהות <b>משפיענים</b> ולהשקיע בהם; לתת להם <b>דוגמאות</b> (שברולט וולט למשתמשים עם ציון Klout גבוה); לעבוד דרך משפיענים בקהילה (Fiesta Movement של פורד); לעודד המלצות; ולספק מידע שרוצים להעביר. <b>מדידה</b>: למשל, דופונט מודדת טווח, מהירות ונתח קול. פפסי הקימה ״מרכז בקרת משימה״ לגייטורייד.</p><p><b>שיווק בניידים</b>: ״המסך השלישי״. ב־2014 לשישה מכל עשרה אמריקנים היה טלפון חכם, והם בילו בו יותר מברדיו, מגזינים ועיתונים יחד. <b>יישומונים</b> מוסיפים נוחות וערך, ועוזרים לתוכניות נאמנות. <b>הצעות מבוססות מיקום</b> ללקוחות שהסכימו (Sonic Corp. שלחה הנחה כשהלקוח קרוב למסעדה). העיצוב: פשוט ותמציתי, מלל ב־50% מהמסך לכל היותר, וקריאה לפעולה בולטת.</p>`,q:"e12"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין כלי התקשורת, קידום המכירות, האירועים והדיגיטל.`)}${rem("טיפ: פרסום = <b>סיבה</b> לקנות. קידום מכירות = <b>תמריץ</b> לקנות עכשיו.")}`,q:"ex"}

const SUM=`<h2>סיכום: תקשורת שיווקית - המונים ודיגיטל</h2>
<div class="key"><b>על מה הקריאה?</b> פרק 14 עמ' 326–329, פרק 15 עמ' 340–347 ופרק 16 עמ' 352–362, לפי הסילבוס של שיעור 12: בחירת תמהיל התקשורת ותקשורת משולבת; קידום מכירות, אירועים ויחסי ציבור; ושיווק מקוון, רשתות, מפה לאוזן וניידים.</div>
<h3>1. תמהיל התקשורת (פרק 14)</h3>
<ul>
<li><b>שמונה כלים</b>: פרסום (מפוזרים, תדמית או מכירה מהירה); קידום מכירות (תמריץ ותגובה מהירה); אירועים וחוויות (מעורבות, ״רך״); יחסי ציבור (אמינות); מקוון ורשתות (מידע, עדכון, מהירות); ניידים (זמן ומיקום); ישיר ומסדי נתונים (אישי, קריאה לפעולה); מכירה אישית (שלבים מאוחרים).</li>
<li><b>שלושה גורמים</b>: <b>סוג השוק</b> (צרכנים: קידום ופרסום; עסקים: מכירה אישית); <b>מוכנות הקונה</b> (מודעות והבנה: פרסום ויח״צ; שכנוע: מכירה אישית; הזמנה: מכירה אישית וקידום); <b>מחזור החיים</b> (הצגה: פרסום, אירועים, יח״צ; צמיחה: פה לאוזן; בגרות: אירועים, פרסום, מכירה; דעיכה: קידום מכירות).</li>

</ul>
<h3>2. פרסום וקידום מכירות (פרק 15)</h3>
<ul>
<li>נתח הוצאות ← <b>נתח קול</b> ← נתח בתודעה ובלב ← נתח שוק. מדידה היסטורית או בניסויים.</li>
<li><b>קידום מכירות</b>: תמריץ קצר טווח (פרסום: סיבה). <b>זיקת צרכן־מוצר</b> (דוגמיות, פרסים, מתנות קשורות) מול כלים שלא בונים זיקה. בשוק דומה: אפקט קצר. בשוק מבודל: יכול לשנות נתחים. אגירה. קופונים דיגיטליים.</li>
<li><b>יעדים</b> מול צרכנים, קמעונאים ואנשי מכירות.</li>

<li><b>לסוחרים</b> (15.3): הנחה, זיכוי (פרסום, תצוגה), סחורות חינם. <b>לעסקים</b> (15.4): תערוכות (עלות קשר הגבוהה ביותר), תחרויות מכירה, מוצרים פרסומיים.</li>
<li><b>תוכנית</b>: עלות מנהלית + תמריץ × יחידות. <b>זמן היערכות</b> ו<b>זמן מכירה</b> (עד 95%). הערכה: נתונים, סקרים, ניסויים.</li>
</ul>

<li><b>החלטות</b>: בחירת אירוע; תוכנית (פי 2–3 לפעילויות נלוות); מדידה בצד ההיצע (כיסוי) או הביקוש (ידע).</li>
<li><b>שיווק חווייתי</b>: קישור לחוויות ייחודיות.</li>
<li><b>יחסי ציבור</b>: חמישה תפקידים: עיתונות, מוצר, תאגיד, שתדלנות, ייעוץ. <b>יחסי ציבור שיווקיים</b>: מעבר ל״פרסום פומבי״ (שטח מערכתי). השקה, מיצוב מחדש, עניין בקטגוריה, קבוצות ייחודיות, משבר, תדמית. לעתים יעילים יותר מפרסום.</li>
</ul>
<h3>4. שיווק מקוון (פרק 16)</h3>
<ul>
<li>ערוצים <b>בתשלום</b>, <b>בבעלות</b> ו<b>שיתופיים</b>. יתרונות: התאמה, מדידה, מיקום בהקשר, חיפוש. חסרונות: סינון, קליקים מזויפים, אובדן שליטה.</li>
<li><b>שבעה מרכיבי אתר</b>: הקשר, תוכן, קהילה, התאמה אישית, תקשורת, קישור, מסחר. <b>מיקרו־אתר</b>.</li>
<li><b>קישור ממומן</b> (תשלום לפי הקלקה), <b>SEO</b> (רחב למותג, ספציפי למכירות), <b>תצוגה</b>, <b>בין־תאיות</b>, <b>דואר אלקטרוני</b>.</li>
</ul>
<h3>5. רשתות, מפה לאוזן וניידים</h3>
<ul>
<li><b>פלטפורמות</b>: קהילות ופורומים, בלוגים, רשתות. קשה לשכנע ברשת. כמעט אף פעם לא מקור יחיד. מעטים רוצים ״שיחה״ עם מותג.</li>
<li><b>מפה לאוזן</b>: 90% מחוץ לרשת. <b>שיווק ויראלי</b>. רק 4% מהתוכן מתפשט. מדברים על מותגים בולטים. ביקורות: מקור שני באמינותו. Vocalpoint. צעדים: משפיענים, דוגמאות, קהילה, הפניות, מידע לשיתוף. מדידה ומעקב.</li>
<li><b>ניידים</b>: ״המסך השלישי״. יישומונים, נאמנות, הצעות לפי מיקום (Sonic). עיצוב פשוט ותמציתי.</li>
</ul>
<div class="key"><b>השורה התחתונה: מה רוצים ממך</b><br>להכיר את מאפייני שמונת הכלים; להתאים כלי לסוג שוק, לשלב מוכנות ולשלב במחזור החיים; להסביר IMC; להבחין בין פרסום לקידום מכירות ולזהות כלי קידום לצרכנים, לסוחרים ולעסקים; למנות יעדי חסות ותפקידי יחסי ציבור; להבחין בין ערוצים בתשלום, בבעלות ושיתופיים ובין כלי השיווק המקוון; ולתאר עובדות מפתח על פה לאוזן.</div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
      ${CONFIG.podcast?`<button class="review-btn" id="pod"><span aria-hidden="true">🎧</span><span>פודקאסט${CONFIG.podcast.min?` · ${CONFIG.podcast.min} דק׳`:""}</span></button>`:""}
     </div>
     ${CONFIG.podcast?`<div id="podbox" class="podbox" hidden><p class="muted">פודקאסט שנוצר ב־Gemini Notebook מקריאת החובה. כמו כל סיכום אוטומטי, הוא עלול לטעות, והקריאה עצמה קובעת.</p><div class="podframe"></div></div>`:""}
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mkt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}{const pb=app.querySelector("#pod");if(pb)pb.onclick=()=>{const bx=app.querySelector("#podbox");bx.hidden=!bx.hidden;const f=bx.querySelector(".podframe");if(!bx.hidden&&!f.firstChild)f.innerHTML=`<iframe src="https://drive.google.com/file/d/${CONFIG.podcast.id}/preview" allow="autoplay" title="פודקאסט" loading="lazy"></iframe>`}}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="ck"></div><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  checkBox(t,bi);
  scrollTo(0,0);
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;
  const show=i=>{const v=list[i],opts=shuffle([v.a,...v.w]);
    host.innerHTML=`<div class="q ckq fade"><span class="eyebrow">בדיקת הבנה · שאלה ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="muted cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? עלו לטקסט וקראו שוב לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");
        const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
        fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}${ok?"":" <b>כדאי לחזור לטקסט למעלה ולקרוא שוב.</b>"}</div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.textContent=`לשאלה ${i+2} ←`;nx.style.alignSelf="flex-start";
          nx.onclick=()=>{const y=scrollY;show(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="muted";d.style.margin="0";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע (${r} מתוך ${list.length} נכון).`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };show(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb){pb.click();const bx=document.querySelector("#podbox");if(bx)bx.scrollIntoView({block:"center"})}}else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
</html>
