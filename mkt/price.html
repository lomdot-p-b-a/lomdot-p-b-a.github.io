:root[data-theme="dark"]{

      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"brain",title:"איך צרכנים תופסים מחירים",blocks:[
  {h:"ספי מחיר, מחירי ייחוס, איכות וסיומת",html:`${def("על מה הנושא",`המחיר הוא לא רק מספר. הצרכנים מפרשים אותו. הנושא מסביר איך הם עושים את זה.<br><b>מה נלמד כאן:</b> סף תחתון ועליון · מחירי ייחוס · מחיר כמדד לאיכות · סיומת מחיר · לשדרג, לשנמך ולהחליף`)}${ex("בלומדה נלווה את <b>שני</b>, מנהלת התמחור של ״קליק״, חברה שמייצרת אוזניות.")}<p>לצרכנים יכול להיות <b>סף מחיר תחתון</b>: מתחתיו המחיר מאותת על איכות נחותה. ו<b>סף מחיר עליון</b>: מעליו הם לא יקנו, כי המוצר לא מצדיק את ההוצאה.</p><p><b>שלושה נושאי מפתח</b> בתפיסת מחירים:</p>${tiles([["scales","מחירי ייחוס","Reference prices: משווים למחיר שזוכרים או שמוצג","מעטים זוכרים מחירים מדויקים. משווים ל<b>מחיר ייחוס פנימי</b> שבזיכרון, או ל<b>חיצוני</b> כמו ״המחיר הרגיל״. משווקים מציגים מחיר מומלץ גבוה, מחיר מקורי או מחיר של מתחרה. פירוק המחיר ליחידות קטנות גורם לו להיראות זול יותר.","500 דולר לשנתיים מוצגים כ״פחות מ־50 דולר לחודש״."],["check","היקשים ממחיר על איכות","המחיר כמדד לאיכות","יעיל במיוחד במוצרי סטטוס: בשמים, מכוניות יקרות ובגדי מעצבים. כשיש מידע על האיכות האמיתית, המחיר פחות חשוב. במוצרי מותרות, מחיר גבוה יכול דווקא להעלות ביקוש, כי מעטים יכולים להרשות לעצמם.",""],["chart","סיומת מחיר","מעבדים מחירים ״משמאל לימין״","פריט ב־299 דולר נתפס בטווח ה־200, ולא ה־300. סיומת ״9״ משדרת גם הוזלה או מציאה, ולכן מי שרוצה תדמית יוקרתית צריך להימנע ממנה.",""]])}<p><b>מתי קובעים מחיר?</b> כשמפתחים מוצר חדש, כשנכנסים לערוץ או לאזור חדש, ובמכרזים. טווח של כמה נקודות מחיר מאפשר לכסות יותר מהשוק.</p>`,q:"e1"},
  {h:"לשדרג, לשנמך ולהחליף",html:`<p>בהארה השיווקית, סילברסטיין ופיסקה מתארים צרכני ביניים ש<b>״משדרגים״</b> ל<b>״מותרות חדשים״</b>: איכות, טעם ושאפתנות גבוהים, אבל לא מחוץ להישג יד. שלושה סוגים:</p><div class="tw"><table><tr><th>סוג</th><th>דוגמה</th></tr><tr><td><b>סופר־פרמיום נגישים</b>: תוספת מחיר גדולה, אבל עדיין פריט זול יחסית</td><td>צ׳יפס גורמה של Kettle</td></tr><tr><td><b>הרחבות קו של ״מותרות ישנים״</b> במורד השוק</td><td>C-class של מרצדס</td></tr><tr><td><b>״יוקרה להמונים״</b> (Masstige): בין מותגי הביניים למותרות</td><td>Kiehl's</td></tr></table></div><p>כדי לשדרג במקום אחד, צרכנים רבים <b>״משנמכים״</b> במקום אחר, וקונים מוצרים כלליים בחנויות הוזלה. השפל הגביר את זה. הדפוסים נשארו גם כשהמצב השתפר, יחד עם <b>״החלפה״</b>: קטגוריה אחת במקום אחרת, כמו מערכת בידור ביתית במקום מכונית חדשה.</p>${ex("לקוח קונה אוזניות יוקרה של ״קליק״, ובשביל זה קונה מותג פרטי של הסופר במקום חטיפים ממותגים.")}`,q:"e2"}
 ]},
 {id:"t2",icon:"target",title:"שלבים 1–2: יעד וביקוש",blocks:[
  {h:"ששת השלבים, ויעדי ההמחרה",html:`${def("על מה הנושא",`קביעת מחיר היא תהליך של שישה שלבים. הנושא עוסק בשניים הראשונים: מה רוצים להשיג, וכמה הלקוחות יקנו בכל מחיר.<br><b>מה נלמד כאן:</b> ששת השלבים · חמישה יעדים · חדירה מול גריפה · רגישות למחיר · גמישות`)}<p><b>ששת השלבים</b> (טבלה 11.1): 1. בחירת יעד · 2. קביעת הביקוש · 3. אומדן עלויות · 4. ניתוח המתחרים · 5. בחירת שיטה · 6. בחירת המחיר הסופי.</p><p><b>חמישה יעדים</b>:</p><ul><li><b>הישרדות</b>: כשיש עודף כושר ייצור, תחרות עזה או שינוי ברצונות. מספיק שהמחיר יכסה עלויות משתנות וחלק מהקבועות.</li><li><b>מקסום רווח שוטף</b>: בוחרים את המחיר עם הרווח, התזרים או התשואה המרביים. הסיכון: מתעלמים ממשתנים אחרים, מהמתחרים ומהחוק, ומקריבים את הטווח הארוך.</li><li><b>מקסום נתח שוק</b>: מתוך אמונה שנפח גדול יוריד עלויות.</li><li><b>מקסום גריפת שוק</b>.</li><li><b>הובלה באיכות</b>: ״מותרות בהישג יד״.</li></ul><div class="tw"><table><tr><th>המחרת חדירה לשוק</th><th>המחרת גריפת שוק</th></tr><tr><td>מחיר <b>נמוך</b> כבר מההתחלה. מתאים כש:<br>השוק רגיש מאוד למחיר, והמחיר הנמוך מצמיח אותו<br>העלויות יורדות עם הניסיון<br>המחיר הנמוך מרתיע מתחרים</td><td>מחיר <b>גבוה</b> שיורד בהדרגה, בטכנולוגיה חדשה. מתאים כש:<br>יש ביקוש גבוה אצל מספיק קונים<br>עלות ייצור של כמות קטנה לא מבטלת את היתרון<br>המחיר הגבוה לא מושך מתחרים<br>המחיר הגבוה משדר מוצר עדיף</td></tr></table></div><p><b>מלכ״רים</b>: אוניברסיטה שואפת להחזר עלויות חלקי, בית חולים להחזר מלא, ותיאטרון למילוי מקסימלי של מושבים.</p>${ex("״קליק״ משיקה אוזניות עם טכנולוגיה חדשה ומחיר גבוה, ומורידה אותו כל כמה חודשים. זו גריפת שוק.")}`,q:"e3"},
  {h:"רגישות למחיר והערכת הביקוש",html:`<p><b>עקומת ביקוש</b>: בדרך כלל, ככל שהמחיר גבוה, הביקוש נמוך. במוצרי יוקרה העקומה יכולה לעלות, כי מחיר גבוה מאותת על איכות. אבל אם הוא גבוה מדי, הביקוש צונח.</p><p>לקוחות <b>פחות רגישים למחיר</b> כש: הפריט זול או נקנה לעתים רחוקות; אין כמעט תחליפים; הם לא שמים לב למחיר הגבוה; הם משנים הרגלים לאט; הם חושבים שהמחיר מוצדק; המחיר הוא חלק קטן מהעלות הכוללת לאורך חיי המוצר.</p>${def("מושג מפתח",`<mark>עלות הבעלות הכוללת</mark> ${E("Total cost of ownership, TCO")}: אם המוכר משכנע שהעלות הכוללת אצלו הכי נמוכה, הוא יכול לגבות יותר. לפי <b>טום נייגל</b>, הטעות הנפוצה היא להציע שירותים לבידול <b>בלי לגבות עליהם</b>.`)}<p><b>איך מעריכים עקומת ביקוש</b>: סקרים (אבל הצרכנים ממעיטים בכוונה בקנייה במחיר גבוה, ומגזימים במוכנות לשלם על חדש); ניסויי מחיר בחנויות או באזורים; וניתוח סטטיסטי של נתוני עבר. צריך לבודד גורמים אחרים, כמו תגובות מתחרים.</p>${def("מושג מפתח",`<mark>גמישות מחיר</mark> ${E("Price elasticity")}: כמה הביקוש מגיב לשינוי במחיר. כמעט בלי שינוי: <b>קשיח</b>. שינוי ניכר: <b>גמיש</b>.`)}<ul><li>תלויה בגודל ובכיוון השינוי. יכול להיות <b>טווח אדישות</b>.</li><li>בטווח הארוך שונה מהקצר: קונים יכולים להישאר עכשיו, ולעבור אחר כך.</li><li>לפי סקירה של 40 שנות מחקר: הגמישות גבוהה יותר במוצרים <b>בני קיימא</b>, ובשלב <b>ההצגה והצמיחה</b>. במבצעים הגמישות גבוהה מהגמישות למחיר הרגיל בטווח הקצר (וההפך בארוך).</li></ul>`,q:"e4"}
 ]},
 {id:"t3",icon:"factory",title:"שלבים 3–4: עלויות ומתחרים",blocks:[
  {h:"עלויות ועקומת הניסיון",html:`${def("על מה הנושא",`הביקוש קובע את <b>התקרה</b> של המחיר, והעלויות קובעות את <b>הרצפה</b>.<br><b>מה נלמד כאן:</b> עלויות קבועות, משתנות, כוללות וממוצעות · ABC · עקומת הניסיון · תמחיר מטרה · המתחרים`)}<div class="tw"><table><tr><th>עלות</th><th>מה זה</th></tr><tr><td><b>קבועה</b> (תקורה)</td><td>לא משתנה עם הייצור: שכר דירה, משכורות</td></tr><tr><td><b>משתנה</b></td><td>קבועה ליחידה, אבל הסכום הכולל משתנה עם מספר היחידות: פלסטיק, שבבים</td></tr><tr><td><b>כוללת</b></td><td>קבועות + משתנות</td></tr><tr><td><b>ממוצעת</b></td><td>העלות הכוללת חלקי מספר היחידות</td></tr></table></div><p>כשהייצור עולה, העלות הממוצעת יורדת, כי הקבועות מתפזרות. אבל מעבר לנקודה מסוימת היא עולה, כי המפעל מאבד יעילות. כדי לדעת את הרווחיות האמיתית של כל לקוח, משתמשים ב<b>חשבונאות עלות מבוססת פעילות</b> (ABC).</p>${def("מושג מפתח",`<mark>עקומת ניסיון</mark> ${E("Experience curve, learning curve")}: הירידה בעלות הממוצעת ככל שהניסיון בייצור מצטבר. העובדים לומדים, החומרים זורמים, והרכש מוזל.`)}<p><b>הדוגמה</b>: אצל סמסונג, 100 דולר ליחידה אחרי 100,000 טאבלטים, 90 אחרי 200,000, 80 אחרי 400,000. אם כולם מוכרים ב־100, סמסונג מרוויחה 20, א מרוויחה 10, ו־ב מאוזנת. הורדת המחיר ל־90 תוציא את ב מהשוק, ואולי גם את א.</p>${rem("<b>הסיכונים</b>: תדמית זולה; הנחה שהמתחרים נגררים חלשים; והקמת מפעלים, בזמן שמתחרה עלול לעבור לטכנולוגיה זולה חדשה, והמוביל נשאר עם הישנה.")}`,q:"e5"},
  {h:"תמחיר מטרה וניתוח המתחרים",html:`${def("מושג מפתח",`<mark>תמחיר מטרה</mark> ${E("Target costing")}: מתחילים מהמחיר. מחקר שוק קובע את התפקודים ואת המחיר שבו המוצר יימכר. <b>המחיר פחות הרווח הרצוי = עלות המטרה</b>. אחר כך בוחנים כל מרכיב, תכנון, הנדסה, ייצור ומכירות, ומקצצים עד שמגיעים לעלות הזו.`)}${rem("הקיצוץ לא יכול להיות עמוק עד שיפגע בהבטחת המותג ובערך.")}${ex("שני יודעת שהלקוחות ישלמו 200 ש״ח, והיא רוצה 50 ש״ח רווח. עלות המטרה היא 150 ש״ח, והמהנדסים צריכים להגיע אליה.")}<p><b>שלב 4: המתחרים</b>. בתוך הטווח שהביקוש והעלויות מאפשרים, בודקים את העלויות, המחירים והתגובות של המתחרים:</p><ul><li>יש לנו תכונה שאין למתחרה? מחשבים כמה היא שווה ללקוח, ו<b>מוסיפים</b> למחיר שלו.</li><li>יש לו תכונה שאין לנו? <b>מחסירים</b> את ערכה.</li></ul><p>ואז מחליטים: מחיר גבוה, שווה או נמוך מהמתחרה.</p>`,q:"e6"}
 ]},
 {id:"t4",icon:"gear",title:"שלב 5: שיטות ההמחרה",blocks:[
  {h:"שלושת השיקולים, מרווח ותשואת־מטרה",html:`${def("על מה הנושא",`יש כמה דרכים לחשב מחיר בפועל. הנושא מציג שבע שיטות, עם החישובים.<br><b>מה נלמד כאן:</b> מודל שלושת השיקולים · מרווח · תשואת־מטרה ונקודת איזון · ערך נתפס · המחרת ערך · EDLP · מחיר מקובל · מכירה פומבית`)}<p><b>שלושה שיקולים</b> (איור 11.2): <b>העלויות</b> קובעות את הרצפה; <b>מחירי המתחרים והתחליפים</b> הם נקודת התמצאות; <b>הערכת הלקוחות</b> את התכונות הייחודיות קובעת את התקרה.</p><p><b>1. המחרת מרווח</b>: מוסיפים שיעור קבוע לעלות. הדוגמה של יצרן המצנמים:</p><div class="tw"><table><tr><th>חישוב</th><th>תוצאה</th></tr><tr><td>עלות יחידה = משתנה + (קבועה ÷ יחידות) = 10 + (300,000 ÷ 50,000)</td><td><b>16 דולר</b></td></tr><tr><td>מחיר מרווח = עלות ÷ (1 − תשואה רצויה) = 16 ÷ (1 − 0.2)</td><td><b>20 דולר</b></td></tr></table></div><p>אם המפיצים רוצים 50% על מחיר המכירה שלהם, הם יגבו 40 דולר. <b>החיסרון</b>: מתעלם מהביקוש, מהערך הנתפס ומהתחרות. <b>למה בכל זאת פופולרית</b>: קל לחשב עלויות; כשכולם משתמשים בה, תחרות המחירים קטנה; ונתפסת כהוגנת.</p><p><b>2. המחרת תשואת־מטרה</b>: המחיר שיניב את התשואה הרצויה על ההשקעה. נפוצה בחברות חשמל ומים. היצרן השקיע מיליון דולר ורוצה 20%, כלומר 200,000 דולר.</p>${def("נוסחה",`<mark>נפח בנקודת האיזון</mark> = עלות קבועה ÷ (מחיר − עלות משתנה) = 300,000 ÷ (20 − 10) = <b>30,000 יחידות</b>. ב<b>תרשים האיזון</b> (איור 11.3), זו הנקודה שבה ההכנסה הכוללת חוצה את העלות הכוללת.`)}${rem("החיסרון של תשואת־מטרה: היא נוטה להתעלם מגמישות המחיר וממחירי המתחרים. עלויות נמוכות יותר מורידות את נקודת האיזון.")}`,q:"e7"},
  {h:"ערך נתפס, המחרת ערך ו־EDLP",html:`${tiles([["brain","3. המחרת ערך נתפס","מבוססת על הערך בעיני הלקוח","<b>ערך נתפס</b> כולל ביצועים, יתרונות הערוץ, איכות האחריות, תמיכה ומוניטין. העסק צריך לספק את הערך שהבטיח, והלקוח צריך לתפוס אותו. המפתח: ערך ייחודי גדול משל המתחרים, ו<b>הוכחה</b> שלו. חלק מהלקוחות מתעניינים רק במחיר, אבל לרוב יש גם פלח שמתעניין באיכות.",""],["check","4. המחרת ערך","מחיר נמוך למדי, תמורת איכות גבוהה","מהנדסים מחדש את התפעול כדי להיות יצרן זול, בלי להקריב איכות, ומושכים הרבה לקוחות עם תודעת ערך.",""]])}<div class="tw"><table><tr><th>5. המחרה נמוכה קבועה (EDLP)</th><th>המחרת גבוה־נמוך</th></tr><tr><td>מחיר נמוך קבוע, מעט מבצעים</td><td>מחירים גבוהים בדרך כלל, והרבה מבצעים זמניים</td></tr><tr><td><b>למה</b>: מבצעים עולים כסף ושוחקים אמון במחיר הרגיל, ולצרכנים אין זמן לקופונים</td><td><b>למה</b>: מבצעים מעוררים התרגשות ומושכים קונים</td></tr></table></div>${rem("לפי הספר, EDLP לא מבטיחה הצלחה ולא מתאימה לכולם.")}`,q:"e8"},
  {h:"מחיר מקובל ומכירה פומבית",html:`<p><b>6. המחרת מחיר מקובל</b>: המחיר מבוסס בעיקר על מחירי המתחרים. עסקים קטנים ״הולכים אחרי המוביל״, ושומרים על אותו הפרש. נפוצה מאוד, כי כשקשה למדוד עלויות או לצפות תגובות, היא נראית כמו ״הדעה המקובלת בענף״.</p><p><b>7. המחרת מכירה פומבית</b>, שצומחת עם השווקים האלקטרוניים:</p><div class="tw"><table><tr><th>סוג</th><th>איך זה עובד</th></tr><tr><td><b>אנגלית</b> (עולה)</td><td>מוכר אחד וקונים רבים. מעלים הצעות, והגבוה זוכה</td></tr><tr><td><b>הולנדית</b> (יורדת)</td><td>הכרוז מתחיל גבוה ומוריד עד שמישהו מסכים. או: הקונה מכריז מה הוא רוצה, והמוכרים מתחרים בהצעה הנמוכה</td></tr><tr><td><b>מכרז סגור</b></td><td>כל ספק מגיש הצעה אחת, בלי לדעת מה האחרים הציעו (ממשל ארה״ב)</td></tr></table></div>${rem("במכרז סגור יש שני כוחות מנוגדים: לא מציעים מתחת לעלות, אבל גם לא גבוה מדי, כדי לא להפסיד. האיזון ביניהם קובע את הרווח הצפוי.")}${ex("״קליק״ ניגשת למכרז של משרד ממשלתי לאוזניות לעובדים. היא מגישה הצעה אחת סגורה.")}`,q:"e9"}
 ]},
 {id:"t5",icon:"scales",title:"שלב 6 והתאמת המחיר",blocks:[
  {h:"בחירת המחיר הסופי",html:`${def("על מה הנושא",`השיטות מצמצמות את הטווח. עכשיו בוחרים מחיר אחד, ומתאימים אותו למצבים שונים.<br><b>מה נלמד כאן:</b> ארבעה שיקולים למחיר הסופי · המחרה גיאוגרפית ורכש גומלין · הנחות · המחרת קידום מכירות · אפליית מחירים`)}<p>במחיר הסופי מביאים בחשבון <b>ארבעה דברים</b>:</p><ol><li><b>פעילויות שיווק אחרות</b>: פאריס ורייבסטיין בדקו 227 עסקים. מותגים באיכות ממוצעת עם הרבה פרסום גבו מחיר גבוה. איכות גבוהה והרבה פרסום: המחירים הגבוהים ביותר. איכות נמוכה ומעט פרסום: הנמוכים ביותר.</li><li><b>מדיניות ההמחרה של החברה</b>: הרבה חברות מקימות מחלקת המחרה. קנסות כדאי להטיל בתבונה.</li><li><b>השתתפות בהנאות ובסיכונים</b>: כשהקנייה נתפסת כמסוכנת, המוכר יכול לספוג חלק מהסיכון, ולהשתתף ברווח אם החיסכון גדול מהצפוי.</li><li><b>השפעה על אחרים</b>: מפיצים, אנשי מכירות, מתחרים, ספקים והממשלה. למשל, אסור לקבוע ״מחיר רגיל״ גבוה באופן מלאכותי ואז להכריז על ״מבצע״.</li></ol>`,q:"e10"},
  {h:"המחרה גיאוגרפית והנחות",html:`<p>ברוב המקרים קובעים <b>מבנה המחרה</b>, ולא מחיר אחד. <b>המחרה גיאוגרפית</b>: האם לגבות יותר מלקוחות רחוקים (משלוח) או פחות (כדי לזכות בעסקה)? ומה עם שערי חליפין? כשלקונה אין מטבע קשה, יש <b>רכש גומלין</b> (Countertrade):</p><div class="tw"><table><tr><th>צורה</th><th>מה זה</th></tr><tr><td><b>עסקת חליפין</b></td><td>החלפה ישירה של סחורות, בלי כסף</td></tr><tr><td><b>עסקת פיצוי</b></td><td>חלק במזומן, והשאר במוצרים</td></tr><tr><td><b>רכש עתידי</b></td><td>מוכרים מפעל או ציוד, ומקבלים חלק מהתשלום במוצרים שייוצרו בו</td></tr><tr><td><b>קיזוז</b></td><td>תשלום מלא במזומן, אבל מתחייבים להוציא חלק ניכר ממנו באותה מדינה</td></tr></table></div><p><b>הנחות והוזלות</b> (טבלה 11.2):</p><div class="tw"><table><tr><th>סוג</th><th>מה זה</th></tr><tr><td><b>הנחת מזומן</b></td><td>למי שמשלם מהר. ״2/10, תוך 30״: 2% הנחה אם משלמים תוך 10 ימים, ואחרת תוך 30</td></tr><tr><td><b>הנחת כמות</b></td><td>למי שקונה הרבה. שווה לכולם, ולא יותר מהחיסכון של המוכר</td></tr><tr><td><b>הנחה תפקודית</b> (מסחרית)</td><td>לגורמים בערוץ שמבצעים תפקידים, כמו מכירה ואחסון. זהה לכל הערוץ</td></tr><tr><td><b>הוזלה עונתית</b></td><td>מחוץ לעונת השיא (מלונות, תעופה)</td></tr><tr><td><b>הנחה אחרת</b></td><td>הנחת החלפה (מחזירים ישן), הנחת קידום מכירות (לסוכנים שמשתתפים בפרסום)</td></tr></table></div>${rem("הנחות צריך לתת בזהירות, אחרת הרווחים נשחקים. יש קטגוריות ש״מחסלות את עצמן״ כי הן תמיד במבצע. ההנהלה צריכה <b>ניתוח מחיר נטו</b> כדי לדעת את המחיר האמיתי.")}`,q:"e11"},
  {h:"המחרת קידום מכירות ואפליית מחירים",html:`<p><b>המחרת קידום מכירות</b> נועדה לעודד קנייה מוקדמת:</p><ul><li><b>מוביל בהפסד</b>: הורדת מחיר של מותג ידוע כדי להביא קונים. היצרנים לרוב מתנגדים, כי זה פוגע בתדמית ומרגיז קמעונאים אחרים.</li><li><b>אירוע מיוחד</b>: מבצעי חזרה לבית הספר.</li><li><b>לקוחות מיוחדים</b>: למשל חברי מועדון.</li><li><b>זיכוי במזומן</b>: להיפטר ממלאי בלי להוריד את מחיר המחירון.</li><li><b>מימון בריבית נמוכה</b>, במקום הוזלה.</li><li><b>פריסת תשלומים</b>: לצרכנים חשוב יותר אם יעמדו בתשלום החודשי מאשר הריבית.</li><li><b>אחריות וחוזי שירות</b> בלי תוספת.</li><li><b>הנחה פסיכולוגית</b>: מחיר מנופח באופן מלאכותי, ואז ״חיסכון״ גדול. הרשויות נאבקות בטקטיקות לא חוקיות.</li></ul>${rem("לפי הספר, אלה לרוב <b>״משחק סכום אפס״</b>: אם עובד, המתחרים מעתיקים. אם לא, בזבזו כסף שיכול היה ללכת לאיכות או לפרסום.")}${def("מושג מפתח",`<mark>אפליית מחירים</mark> ${E("Price discrimination")}: מכירה בשני מחירים או יותר, ש<b>לא משקפים הבדל מידתי בעלויות</b>. <b>דרגה ראשונה</b>: מחיר שונה לכל לקוח לפי חוזק הביקוש. <b>שנייה</b>: פחות למי שקונה כמויות. <b>שלישית</b>: מחירים שונים לקבוצות: סטודנטים ופנסיונרים, גרסאות, תדמית, ערוצים, מקומות, ועונה, יום או שעה.`)}<p><b>המחרת תפוקה</b> (Yield pricing): בתעופה ובאירוח. הנחה מוגבלת לקנייה מוקדמת, מחיר גבוה למאחרים, והכי זול למלאי שלא נמכר רגע לפני שהוא ״פג״. גם <b>התאמת מחירים דינמית</b> מתפשטת: סוחרים באמזון משנים מחיר כל שעה, וקבוצות ספורט לפי היריבה והמועד.</p>`,q:"e12"}
 ]},
 {id:"t6",icon:"people",title:"ביקוש יתר ותגובה למתחרים",blocks:[
  {h:"העלאות מחיר, ותגובות של מתחרים",html:`${def("על מה הנושא",`עמ' 265: מתי מעלים מחיר, ואיך מגיבים כשהמתחרה משנה מחיר.<br><b>מה נלמד כאן:</b> המחרה מצפה · ביקוש יתר · ציפייה לתגובת המתחרה · תגובה בשוק הומוגני ולא הומוגני`)}<p>העמוד מתחיל בסוף ההסבר על <b>המחרה מצפה</b> (Anticipatory pricing): העלאה מראש, מחשש שהאינפלציה תימשך או שיוטל פיקוח מחירים.</p><p><b>ביקוש יתר</b>: כשאי אפשר לספק לכולם, אפשר להעלות מחיר, לקצוב את האספקה, או שניהם. לפעמים לקוחות רואים בהעלאה סימן ל״להיט״, אבל בדרך כלל הם <b>שונאים</b> העלאות. לכן: להודיע מראש, ולהסביר עלייה חדה במונחים מובנים.</p><p><b>איך לצפות את תגובת המתחרה?</b> להניח שיגיב כמו תמיד, או שיגיב לפי האינטרס שלו באותו רגע. לשם כך חוקרים את מצבו הפיננסי, המכירות, נאמנות הלקוחות והיעדים:</p><div class="tw"><table><tr><th>אם היעד של המתחרה...</th><th>סביר שיגיב ב...</th></tr><tr><td><b>נתח שוק</b></td><td>התאמת המחירים שלו</td></tr><tr><td><b>מקסום רווחים</b></td><td>יותר פרסום, או שיפור איכות</td></tr></table></div><p><b>תגובה לקיצוץ של מתחרה</b>: שוקלים את שלב המוצר במחזור החיים, חשיבותו בתיק, הכוונות והמשאבים של המתחרה, הרגישות למחיר ולאיכות, התנהגות העלויות, וההזדמנויות האחרות.</p><div class="tw"><table><tr><th>שוק הומוגני</th><th>שוק לא הומוגני</th></tr><tr><td>בקיצוץ: להשביח את המוצר המועשר, או להצטרף להוזלה. בהעלאה: אחרים יכולים לא להצטרף, והמוביל ייאלץ לסגת</td><td>לשאול למה: ״לגנוב שוק״? עודף כושר ייצור? שינוי עלות? זמני או קבוע? מה יקרה אם לא נגיב? ואיך יגיבו האחרים?</td></tr></table></div>${ex("מתחרה מוריד ב־20% את מחיר האוזניות. שני בודקת קודם: האם זה מבצע זמני לחיסול מלאי, או מהלך קבוע לכבוש נתח?")}`,q:"e13"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין חלקי הפרק, כולל חישובים.`)}${rem("טיפ לחישובים: מחיר מרווח = עלות ÷ (1 − תשואה). נקודת איזון = קבועות ÷ (מחיר − משתנה).")}`,q:"ex"}

<li><b>לשדרג, לשנמך ולהחליף</b>: ״מותרות חדשים״ (סופר־פרמיום נגיש, הרחבות קו של מותרות ישנים, יוקרה להמונים).</li>
</ul>
<h3>2. ששת השלבים (טבלה 11.1)</h3>
<ol>
<li><b>יעד</b>: הישרדות, מקסום רווח שוטף, מקסום נתח, מקסום גריפה, הובלה באיכות. <b>חדירה</b> (נמוך: שוק רגיש, עלויות יורדות, מרתיע מתחרים) מול <b>גריפה</b> (גבוה ויורד: ביקוש גבוה, לא מושך מתחרים, משדר עדיפות). מלכ״רים: החזר חלקי או מלא, מילוי מושבים.</li>
<li><b>ביקוש</b>: עקומת ביקוש (ביוקרה יכולה לעלות). פחות רגישים כשאין תחליפים, כשהמחיר מוצדק או חלק קטן מהעלות. <b>TCO</b>. נייגל: לא לתת שירותים בחינם. הערכה: סקרים, ניסויים, סטטיסטיקה. <b>גמישות</b>: קשיח מול גמיש, טווח אדישות, קצר מול ארוך; גבוהה יותר בבני קיימא ובהצגה וצמיחה.</li>
<li><b>עלויות</b> (הרצפה; הביקוש הוא התקרה): קבועות, משתנות, כוללות, ממוצעות. ABC. <b>עקומת ניסיון</b> (100 ← 90 ← 80) וסיכוניה. <b>תמחיר מטרה</b>: מחיר פחות רווח.</li>
<li><b>מתחרים</b>: מוסיפים ערך של תכונה שרק לנו יש, מחסירים ערך של תכונה שרק להם יש.</li>
<li><b>שיטה</b>: שלושה שיקולים (עלויות רצפה, מתחרים התמצאות, ערך ללקוח תקרה). שבע שיטות:
<ul><li><b>מרווח</b>: עלות 16 ÷ 0.8 = 20 דולר. מתעלמת מביקוש, אבל קלה ונתפסת הוגנת.</li>
<li><b>תשואת־מטרה</b>: נקודת איזון = 300,000 ÷ (20 − 10) = 30,000 יחידות.</li>
<li><b>ערך נתפס</b>: ערך ייחודי גדול, והוכחה שלו.</li>
<li><b>המחרת ערך</b>: מחיר נמוך למדי, איכות גבוהה.</li>
<li><b>EDLP</b> מול <b>גבוה־נמוך</b>.</li>
<li><b>מחיר מקובל</b>: לפי המוביל.</li>
<li><b>מכירה פומבית</b>: אנגלית (עולה), הולנדית (יורדת), מכרז סגור.</li></ul></li>
<li><b>מחיר סופי</b>: פעילויות שיווק אחרות (פאריס ורייבסטיין: איכות ופרסום), מדיניות ההמחרה, השתתפות בהנאות ובסיכונים, והשפעה על מפיצים, מתחרים, ספקים וממשלה.</li>
</ol>
<h3>3. התאמת המחיר</h3>
<ul>
<li><b>גיאוגרפית</b>, ו<b>רכש גומלין</b>: חליפין, פיצוי, רכש עתידי, קיזוז.</li>
<li><b>הנחות</b> (טבלה 11.2): מזומן (2/10, תוך 30), כמות, תפקודית, עונתית, אחרת (החלפה, קידום). <b>ניתוח מחיר נטו</b>.</li>
<li><b>קידום מכירות</b>: מוביל בהפסד, אירוע מיוחד, לקוחות מיוחדים, זיכוי במזומן, ריבית נמוכה, פריסת תשלומים, אחריות, הנחה פסיכולוגית. לרוב ״משחק סכום אפס״.</li>
<li><b>אפליית מחירים</b>: מחירים שלא משקפים הבדל בעלויות. דרגה ראשונה (לכל לקוח), שנייה (לפי כמות), שלישית (לפי קבוצה, גרסה, ערוץ, מקום, זמן). <b>המחרת תפוקה</b> והמחרה דינמית.</li>
</ul>
<h3>4. ביקוש יתר ותגובה למתחרים (עמ' 265)</h3>
<ul>
<li><b>המחרה מצפה</b>. <b>ביקוש יתר</b>: להעלות מחיר, לקצוב, או שניהם. להודיע מראש ולהסביר.</li>
<li><b>ציפייה לתגובה</b>: יעד נתח שוק ← התאמת מחיר; יעד רווח ← פרסום או איכות.</li>
<li><b>תגובה</b>: בשוק הומוגני, להשביח או להצטרף להוזלה, ואפשר לא להצטרף להעלאה. בשוק לא הומוגני, לשאול למה, אם זמני, ומה יקרה אם לא נגיב.</li>
</ul>
<div class="key"><b>השורה התחתונה: מה רוצים ממך</b><br>לזהות מנגנון בתפיסת מחירים; לסדר את ששת השלבים; להבחין בין חדירה לגריפה ומתי כל אחת מתאימה; להסביר גמישות ומה משפיע על רגישות למחיר; לחשב מחיר מרווח ונקודת איזון; לזהות שיטת המחרה, סוג הנחה, סוג רכש גומלין ודרגת אפליית מחירים; ולהסביר איך מגיבים לשינוי מחיר של מתחרה.</div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">

      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
      ${CONFIG.podcast?`<button class="review-btn" id="pod"><span aria-hidden="true">🎧</span><span>פודקאסט${CONFIG.podcast.min?` · ${CONFIG.podcast.min} דק׳`:""}</span></button>`:""}
     </div>
     ${CONFIG.podcast?`<div id="podbox" class="podbox" hidden><p class="muted">פודקאסט שנוצר ב־Gemini Notebook מקריאת החובה. כמו כל סיכום אוטומטי, הוא עלול לטעות, והקריאה עצמה קובעת.</p><div class="podframe"></div></div>`:""}
    </div>
   </section>

  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
</html>
