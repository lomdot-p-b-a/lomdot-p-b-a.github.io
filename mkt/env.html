const ACR_RE=new RegExp("(?<![A-Za-z0-9])(?<![A-Za-z0-9]-)("+Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?![A-Za-z0-9])(?!-[A-Za-z0-9])","g");
const acrText=k=>{const [en,he]=ACR[k];return en?`${he}; <bdi dir="ltr">${en}</bdi>`:he};
function acrExpand(html){
  const plain=html.replace(/<[^>]+>/g," ");const seen=new Set();
  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"pyramid",title:"תכנון אסטרטגי בתאגיד",blocks:[
  {h:"רמות התכנון והתוכנית השיווקית",html:`${def("על מה הנושא",`לפני שמחליטים על פרסום או מחיר, צריך לדעת לאן העסק הולך. הנושא מסביר איך חברות מתכננות אסטרטגיה, מרמת התאגיד ועד רמת המוצר.<br><b>מה נלמד כאן:</b> ארבע רמות תכנון · תוכנית שיווקית אסטרטגית וטקטית · משימה · יחידות עסקיות · הזדמנויות צמיחה`)}${ex("בלומדה נלווה את <b>יוסי</b>, מנהל רשת ״גלגל״ לאופניים חשמליים, שמחליט לאן הרשת תתפתח.")}<p>לפי הספר, משווקים צריכים לתעדף תכנון אסטרטגי בשלושה תחומים: ניהול העסקים כ<b>תיק השקעות</b>, הערכת קצב הצמיחה של השוק, ובניית אסטרטגיה. ברוב החברות הגדולות יש <b>ארבע רמות</b>: תאגיד, חטיבה, יחידה עסקית ומוצר. התאגיד מחליט כמה משאבים לתת לכל חטיבה ואילו עסקים לפתוח או לסגור, וכל רמה בונה תוכנית משלה.</p>${def("מושג מפתח",`<mark>תוכנית שיווקית</mark> ${E("Marketing plan")}: הכלי המרכזי לניהול ולתיאום המאמץ השיווקי. ה<b>תוכנית האסטרטגית</b> מתווה את שוקי המטרה ואת הצעת הערך. ה<b>תוכנית הטקטית</b> מפרטת את הטקטיקות: תכונות מוצר, קידום, המחרה, ערוצים ושירות.`)}<p>התהליך המלא (איור 2.1) הוא <b>תכנון ← ביצוע ← בקרה</b>: מודדים תוצאות, מאבחנים אותן, ונוקטים פעולה מתקנת.</p>`,q:"e1"},
  {h:"משימת התאגיד ויחידות עסקיות",html:`<p>מטה התאגיד מבצע <b>ארבע פעילויות תכנון</b>: מגדיר את המשימה, מקים יחידות עסקיות אסטרטגיות, מקצה להן משאבים, ומעריך הזדמנויות צמיחה.</p>${def("מושג מפתח",`<mark>הצהרת משימה</mark> ${E("Mission statement")}: הצהרה שעונה על השאלות של דרוקר: במה אנחנו עוסקים? מי הלקוח? מה ערך בעיני הלקוח? במה נעסוק בעתיד, ובמה עלינו לעסוק? הצהרה טובה מתמקדת במעט יעדים, מדגישה את הערכים, מגדירה את תחומי התחרות, וחושבת לטווח ארוך. רצוי שתהיה קצרה וזכירה.`)}${ex(`״אמזון״ שינתה את המשימה שלה, מחנות הספרים המקוונת הגדולה בעולם לחנות המקוונת הגדולה בעולם.`)}<p>ההצהרה מגדירה את גבולות התחרות לפי כמה ממדים (טבלה 2.1): <b>ענף</b>, <b>מוצרים ויישומים</b>, <b>כשירות</b> (יכולות טכנולוגיות), <b>פלח שוק</b>, <b>תחום אנכי</b> (כמה רמות בערוץ, מחומר הגלם ועד ההפצה) ו<b>תחום גיאוגרפי</b>.</p>${def("מושג מפתח",`<mark>יחידה עסקית אסטרטגית</mark> ${E("SBU")}: יש לה שלושה מאפיינים: (1) עסק או קבוצת עסקים קשורים שאפשר לתכנן בנפרד; (2) מערך מתחרים משלה; (3) מנהל שאחראי לתכנון ולרווחיות. המטרה: אסטרטגיה נפרדת והקצאת משאבים לכל יחידה. את המשאבים מקצים היום לפי <b>ערך לבעלי המניות</b>: האם החברה שווה יותר עם היחידה או בלעדיה.`)}`,q:"e2"},
  {h:"הזדמנויות צמיחה, תרבות ותרחישים",html:`<p>אם יש פער בין המכירות הרצויות למכירות הצפויות, צריך לחפש צמיחה בשלוש דרכים:</p>${def("מושג מפתח",`<mark>צמיחה מוגברת</mark> ${E("Intensive")}: צמיחה בתוך העסקים הקיימים, לפי <b>טבלת הרחבת מוצר או שוק</b>.`)}<div class="tw"><table><tr><th></th><th>מוצר קיים</th><th>מוצר חדש</th></tr><tr><td><b>שוק קיים</b></td><td><b>חדירה לשוק</b>: נתח גדול יותר בשוק הקיים</td><td><b>פיתוח מוצר</b>: מוצרים חדשים ללקוחות הקיימים</td></tr><tr><td><b>שוק חדש</b></td><td><b>פיתוח שוק</b>: שווקים חדשים למוצר הקיים</td><td><b>הגוונה</b>: מוצר חדש בשוק חדש</td></tr></table></div>${ex(`״גלגל״ יכולה למכור יותר אופניים ללקוחות הנוכחיים (חדירה), לפתוח סניף בעיר חדשה (פיתוח שוק), להוסיף קורקינטים חשמליים (פיתוח מוצר), או לפתוח עסק של סיורי אופניים לתיירים (הגוונה).`)}${tiles([["link","צמיחה משלבת","Integrative: רכישה של עסק שקשור לעסק הקיים","שילוב <b>לאחור</b> (רכישת ספק), שילוב <b>לפנים</b> (רכישת מפיץ), או שילוב <b>אופקי</b> (רכישת מתחרה). בריתות ומיזוגים אופקיים לא תמיד מצליחים.","״גלגל״ קונה את היבואן שממנו היא קונה אופניים: שילוב לאחור."],["split","צמיחה בהגוונה","Diversification: עסקים חדשים מחוץ לעסק הקיים","הגיונית כשיש הזדמנויות טובות בחוץ. אפשר לחפש מוצרים עם סינרגיה טכנולוגית או שיווקית, מוצרים לא קשורים שימשכו את הלקוחות הקיימים, או עסקים שלא קשורים בכלל (קונגלומרט).","״גלגל״ מוכרת קסדות ומעילי גשם ללקוחות שלה."]])}<p>במקביל צריך לצמצם או לסגור עסקים דועכים, כדי לשחרר משאבים.</p>${def("מושג מפתח",`<mark>תרבות תאגידית</mark> ${E("Corporate culture")}: ״החוויות, הסיפורים, האמונות והנורמות המשותפים שמאפיינים את הארגון״. קל יחסית לשנות מבנה ומדיניות, וקשה מאוד לשנות תרבות. אבל לעתים קרובות שינוי התרבות הוא המפתח ליישום אסטרטגיה חדשה.`)}${tiles([["cycle","ניתוח תרחישים","Scenario analysis: תיאורים סבירים של עתידים אפשריים","Shell הייתה חלוצה בזה. המנהלים שואלים ״מה נעשה אם זה יקרה?״, בוחרים את התרחיש הסביר ביותר, ומחפשים סימנים שיאששו או יפריכו אותו.","יוסי מתכנן מה יעשה אם המדינה תגביל אופניים חשמליים, ומה אם תסבסד אותם."]])}`,q:"e3"}
 ]},
 {id:"t2",icon:"target",title:"תכנון יחידה עסקית: SWOT ואסטרטגיה",blocks:[
  {h:"ניתוח SWOT",html:`${def("על מה הנושא",`כל יחידה עסקית עוברת תהליך תכנון (איור 2.2): משימה ← ניתוח SWOT ← מטרות ויעדים ← אסטרטגיה ← תוכנית ← יישום ← משוב ובקרה.<br><b>מה נלמד כאן:</b> SWOT · הזדמנות שיווקית · איום סביבתי · מטרות · אסטרטגיות של פורטר · 7S`)}${def("מושג מפתח",`<mark>ניתוח SWOT</mark>: הערכה כוללת של <b>החוזקות</b> (Strengths), <b>החולשות</b> (Weaknesses), <b>ההזדמנויות</b> (Opportunities) ו<b>האיומים</b> (Threats). הזדמנויות ואיומים הם <b>הסביבה החיצונית</b>, חוזקות וחולשות הם <b>הסביבה הפנימית</b>.`)}<div class="tw"><table><tr><th></th><th>חיובי</th><th>שלילי</th></tr><tr><td><b>פנימי</b> (העסק)</td><td>חוזקות</td><td>חולשות</td></tr><tr><td><b>חיצוני</b> (הסביבה)</td><td>הזדמנויות</td><td>איומים</td></tr></table></div>${def("מושג מפתח",`<mark>הזדמנות שיווקית</mark>: צורך ועניין של קונים, שהחברה יכולה לספק ולהרוויח ממנו בסבירות גבוהה. שלושה מקורות: (1) להציע משהו שקשה להשיג; (2) לספק מוצר קיים בדרך חדשה או טובה יותר, למשל בשיטת <b>איתור בעיות</b>, <b>האידיאל</b> או <b>שרשרת הצריכה</b>; (3) מוצר חדש לגמרי.`)}<p>הזדמנויות נוצרות למשל כש: משלבים מגמות (טלפון עם GPS), מציעים קנייה נוחה יותר, נותנים מידע וייעוץ, מתאימים אישית, מציגים יכולת חדשה, מספקים מהר יותר, או מציעים מחיר נמוך בהרבה (תרופות גנריות).</p>${tiles([["check","ניתוח הזדמנויות שוק","MOA: חמש שאלות לבדיקת הזדמנות","האם אפשר להסביר את התועלות לשוק המטרה? האם אפשר להגיע אליו ביעילות? האם יש לנו את היכולות? האם נעשה זאת טוב מהמתחרים? האם התשואה תעבור את סף ההשקעה?","לפני שיוסי פותח שירות תיקונים עד הבית, הוא בודק את חמש השאלות."],["x","איום סביבתי","מגמה שלילית, שבלי פעולה תוריד מכירות או רווחים","לאיומים גדולים וסבירים מכינים תוכנית מגירה. גם באיומים קטנים כדאי לעקוב, שמא יגדלו.","חוק שיגביל רכיבה על אופניים חשמליים במדרכות."]])}${rem("בניתוח הפנימי, לא חייבים לתקן כל חולשה. השאלה החשובה היא אם להתמקד בהזדמנויות שיש לנו בשבילן חוזקות, או לשקול גם הזדמנויות שיחייבו לפתח חוזקות חדשות.")}`,q:"e4"},
  {h:"מטרות ויעדים",html:`<p>אחרי ה־SWOT, היחידה מגבשת <b>מטרות</b>, ו<b>יעדים</b> שהם מטרות ספציפיות בגודל ובזמן. לרוב יש תמהיל: רווחיות, צמיחה במכירות, נתח שוק, צמצום סיכונים וחדשנות. מנהלים לפיהם את הפעילות: <b>ניהול לפי יעדים</b> (MBO).</p>${tiles([["pyramid","מדורגים","מהחשוב לפחות חשוב","",""],["chart","כמותיים","מוגדרים במספרים, ככל האפשר","",""],["check","מציאותיים","אפשר להשיג אותם באמת","",""],["link","עקביים","לא סותרים זה את זה","",""]])}<p>יש גם <b>שיקולי פשרה</b>: רווח לטווח קצר מול צמיחה לטווח ארוך; חדירה לשווקים קיימים מול פיתוח שווקים חדשים; מטרות רווח מול מטרות ללא כוונת רווח; צמיחה מהירה מול סיכון נמוך. כל בחירה מכתיבה אסטרטגיה אחרת.</p>${ex(`״להגדיל את מכירות האופניים ב־15% עד סוף השנה״ הוא יעד כמותי וספציפי בזמן.`)}`,q:"e5"},
  {h:"אסטרטגיה ויישום",html:`${def("מושג מפתח",`<mark>אסטרטגיה</mark>: תוכנית הפעולה להשגת המטרות. מייקל פורטר הציע <b>שלוש אסטרטגיות גנריות</b>:`)}${tiles([["pie","הובלה כוללת בעלות","Overall cost leadership: העלויות הנמוכות ביותר, ולכן מחיר נמוך מהמתחרים","צריך פחות מיומנויות שיווק. הבעיה: בדרך כלל יופיע מישהו עם עלות נמוכה עוד יותר.","רשת שקונה בכמויות עצומות ומוכרת אופניים בסיסיים בזול."],["target","בידול","Differentiation: ביצועים עדיפים בתועלת שרוב השוק מעריך","מתמקדים בתועלת מרכזית אחת שבה העסק הכי טוב.","״גלגל״ מתמקדת בשירות התיקונים הכי מהיר בעיר."],["copies","מיקוד","Focus: פלח שוק צר אחד או יותר","מכירים את הפלח לעומק, ומובילים בו בעלות נמוכה או בבידול.","חנות שמוכרת רק אופני שליחויות לשליחים."]])}<p><b>קבוצה אסטרטגית</b>: חברות שמתחרות באותה אסטרטגיה על אותו שוק מטרה. מי שמבצע הכי טוב, מרוויח הכי הרבה. פורטר מבחין בין <b>יעילות תפעולית</b>, שקל להעתיק, לבין <b>אסטרטגיה</b>, שהיא מיצוב ייחודי שמבוסס על פעילויות שונות מהמתחרים. גם חברות ענק צריכות לעתים <b>בריתות</b> (מוצר, קידום, לוגיסטיקה, המחרה), ולכן ניהול שותפויות (PRM) הוא מיומנות ליבה.</p>${def("מושג מפתח",`<mark>מודל 7S</mark> (מקנזי): האסטרטגיה היא רק אחד משבעה גורמים להצלחה. ה״חומרה״: <b>אסטרטגיה</b>, <b>מבנה</b>, <b>מערכות</b>. ה״תוכנה״: <b>סגנון</b>, <b>מיומנויות</b>, <b>סגל</b> ו<b>ערכים משותפים</b>. האסטרטגיה היא ה״מה״ וה״למה״; היישום הוא ה״מי״, ״איפה״, ״מתי״ ו״איך״.`)}${rem("לפי דרוקר, חשוב יותר ״לעשות את הדבר הנכון״ (אפקטיביות) מאשר ״לעשות נכון את הדברים״ (יעילות). חברה יכולה להישאר יעילה ולאבד אפקטיביות, כי השוק משתנה מהר יותר מה־7S שלה.")}`,q:"e6"}
 ]},
 {id:"t3",icon:"data",title:"חיזוי וסביבת המקרו",blocks:[
  {h:"חיזוי ביקוש, מגמות ואופנות",html:`${def("על מה הנושא",`כדי לזהות הזדמנויות, צריך לחזות ביקוש ולעקוב אחרי הכוחות הגדולים בסביבה. זה החלק של ״ניתוח PEST״ בשיעור.<br><b>מה נלמד כאן:</b> שיטות חיזוי · מגמה מול אופנה חולפת · שישה כוחות בסביבת המקרו`)}${def("מושג מפתח",`<mark>חיזוי</mark> ${E("Forecasting")}: האמנות של ניבוי מה הקונים יעשו בתנאים מסוימים. עסקים מכינים תחזית מקרו־כלכלית (אינפלציה, ריבית, תל״ג), ממנה תחזית לענף, וממנה תחזית מכירות לעסק לפי נתח שוק משוער.`)}<div class="tw"><table><tr><th>שיטה (טבלה 3.3)</th><th>מה עושים</th></tr><tr><td><b>סקר כוונות קונים</b></td><td>שואלים לקוחות כמה סביר שיקנו</td></tr><tr><td><b>מצרף דעות סגל המכירות</b></td><td>אנשי המכירות מעריכים את המכירות שלהם</td></tr><tr><td><b>דעת מומחים</b></td><td>תחזיות של מפיצים, יועצים, מכוני חיזוי</td></tr><tr><td><b>ניתוח מכירות עבר</b></td><td>סדרות עתיות וניתוח סטטיסטי של העבר</td></tr><tr><td><b>מבחני שוק</b></td><td>מבחן ישיר, בעיקר למוצר חדש או לערוץ ואזור חדשים</td></tr></table></div>${tiles([["chart","מגמה","Trend: כיוון או רצף אירועים עם תנופה ועמידות","מגמה מגלה את צורת העתיד, ועליה כדאי לבנות.","המעבר לתחבורה ירוקה בערים."],["clock","אופנה חולפת","Fad: שיגעון זמני, קצר ובלתי צפוי","אפשר להרוויח ממנה, אבל צריך מזל ותזמון.","צעצוע שכולם קונים בקיץ אחד, ונשכח בחורף."]])}`,q:"e7"},
  {h:"ששת הכוחות בסביבת המקרו",html:`<p>כל עסק צריך לעקוב אחרי <b>ששה כוחות</b> (טבלה 3.4). הם קשורים זה לזה: למשל, גידול אוכלוסייה מגדיל זיהום, זה מוביל לחקיקה, החקיקה מעודדת טכנולוגיה חדשה, ואם היא זולה, היא משנה התנהגות.</p>${tiles([["people","דמוגרפי","גודל וגידול האוכלוסייה, גיל, גיוון אתני, השכלה ודפוסי משפחה","האוכלוסייה מזדקנת. משווקים מחלקים לקבוצות גיל, או ל<b>קבוצות דוריות</b> (Cohorts) שחוו יחד רגעים מכוננים בגיל 17 עד 24. דפוסי המשפחה משתנים: פחות ״בית אב מסורתי״, יותר יחידים, זוגות בלי ילדים ומשפחות חד־הוריות.","״גלגל״ מגלה שיותר אנשים גרים לבד בעיר, ומפרסמת אופניים מתקפלים לדירות קטנות."],["pie","כלכלי","כוח קנייה: הכנסות, חסכונות, חובות ואשראי","גם הפסיכולוגיה של הצרכנים: אחרי משבר, צרכנים חוסכים יותר ונזהרים. יש ארבעה סוגי מבנה משקי: <b>כלכלת קיום</b>, <b>מייצאת חומרי גלם</b>, <b>בתהליך תיעוש</b> ו<b>מתועשת</b>.","אחרי עליית ריבית, לקוחות מעדיפים לקנות אופניים בתשלומים."],["sprout","חברתי־תרבותי","השקפות עולם, ערכי יסוד ותרבויות משנה","<b>אמונות יסוד</b> (כמו נישואין) עוברות מדור לדור וכמעט לא משתנות. <b>אמונות משנה</b> (כמו להתחתן צעיר) פתוחות לשינוי, ושם למשווקים יש סיכוי. בני נוער הם תרבות משנה שמובילה מגמות.","עמותה לא מנסה לעצור מכירת אלכוהול (יסוד), אלא להוריד את הרמה המותרת לנהגים (משני)."],["leaf","טבעי","מחסור בחומרי גלם, עלויות אנרגיה, זיהום ותפקיד הממשלות","<b>אחריות סביבתית תאגידית</b> משלבת סוגיות סביבה בתוכנית האסטרטגית. משאבים: אינסופיים, סופיים מתחדשים, וסופיים לא מתחדשים (נפט, פחם).","עליית מחירי הדלק מגדילה את הביקוש לאופניים חשמליים."],["phone","טכנולוגי","קצב שינוי מואץ, הזדמנויות לחדשנות, תקציבי מו״פ ופיקוח","הזמן בין רעיון ליישום מתקצר. גם הממשלה מפקחת יותר על בטיחות מוצרים.","סוללה חדשה שמכפילה את טווח הנסיעה."],["building","פוליטי־משפטי","חוקים, גופים ממשלתיים וקבוצות לחץ","שתי מגמות: <b>הגברת החקיקה העסקית</b> (הגנה על עסקים, צרכנים וחברה) ו<b>צמיחת קבוצות עניין</b> (ועדי פעולה פוליטיים, התנועה למען הצרכן). החקיקה יכולה גם ליצור הזדמנויות, כמו חוקי מחזור.","חוק שמחייב קסדה יוצר הזדמנות למכור קסדות."]])}${rem("לזכור: ״PEST״ מהשיעור מתאים לכוחות האלה: פוליטי, כלכלי (Economic), חברתי (Social) וטכנולוגי. הספר מוסיף את הדמוגרפי ואת הטבעי.")}`,q:"e8"}
 ]},
 {id:"t4",icon:"split",title:"אסטרטגיות תחרותיות",blocks:[
  {h:"מבנה השוק והמוביל",html:`${def("על מה הנושא",`לא כל עסק נמצא באותו מקום בשוק. הספר מתאר שוק היפותטי (איור 7.2) עם ארבעה תפקידים, ולכל אחד אסטרטגיה מתאימה.<br><b>מה נלמד כאן:</b> מוביל · מאתגר · נגרר · גומחאי`)}<div class="tw"><table><tr><th>תפקיד</th><th>נתח</th><th>מה מאפיין אותו</th></tr><tr><td><b>מוביל שוק</b></td><td>40%</td><td>הנתח הגדול ביותר, מוביל במחירים, מוצרים חדשים והפצה</td></tr><tr><td><b>מאתגר</b></td><td>30%</td><td>תוקף כדי לכבוש נתח</td></tr><tr><td><b>נגרר</b></td><td>20%</td><td>שומר על הנתח שלו, ״לא מטלטל את הסירה״</td></tr><tr><td><b>גומחאים</b></td><td>10%</td><td>פלחים קטנים שהגדולים לא מגיעים אליהם</td></tr></table></div><p>כדי להישאר ראשון, המוביל צריך לעשות שלושה דברים:</p>${tiles([["chart","להרחיב את הביקוש הכולל","כשהשוק גדל, המוביל מרוויח הכי הרבה","מחפשים לקוחות חדשים: מי שלא משתמש אבל יכול (חדירה לשוק), מי שמעולם לא השתמש (פלח חדש), או מי שגר במקום אחר (הרחבה גיאוגרפית). או מגדילים את כמות ותכיפות השימוש, למשל באריזה.","״היינץ״ מוכרת כמעט שני שלישים מהקטשופ בארה״ב, ולכן כל שימוש נוסף בקטשופ טוב לה."],["lock","להגן על הנתח","התגובה הטובה ביותר היא חדשנות מתמדת","המוביל צריך להוביל את הענף במוצרים, בהפצה ובחיסכון בעלויות.","״בואינג״ מול ״איירבוס״, ״גוגל״ מול ״מיקרוסופט״."],["target","להגדיל את הנתח","אבל רק אחרי ששוקלים ארבעה גורמים","חשש מפעולה אנטי־מונופוליסטית; העלות הכלכלית, כי מעבר לנתח מיטבי הרווחיות יורדת (איור 7.3); פעילות שיווקית שגויה, כמו רק הורדת מחיר; והפגיעה באיכות כשיש יותר מדי לקוחות.","לפי האיור, נתח השוק המיטבי הוא בערך 50%."]])}`,q:"e9"},
  {h:"שיווק יוזם ושש אסטרטגיות הגנה",html:`<p>יש שלוש דרכים לספק צורכי לקוחות: <b>שיווק מגיב</b> (מוצאים צורך מוצהר וממלאים אותו), <b>שיווק נערך</b> (צופים צרכים בעתיד הקרוב) ו<b>שיווק יצירתי</b> (פתרונות שהלקוחות לא ביקשו, והם מתלהבים מהם). חברות כאלה <b>מניעות את השוק</b>, ולא רק מונעות על ידיו. כל עסק צריך <b>היערכות מגיבה</b> (לראות את ״הכתובת על הקיר״ לפני השינוי) ו<b>היערכות יצירתית</b>.</p><p>גם בלי לתקוף, המוביל לא משאיר אגף חשוף. <b>שש אסטרטגיות הגנה</b>:</p>${tiles([["lock","מגננת עמדה","תופסים את העמדה הנחשקת בתודעה","המותג נעשה כמעט חסין.","״פמפרס״ היא ״בעלת״ השמירה על יובש."],["copies","מגננה אגפית","עמדות קדמיות להגנה על חזית חלשה","מותגים משניים מגנים על המותג הראשי.","מותגי כביסה נוספים של P&G שומרים על Tide."],["bulb","מגננת מנע","תוקפים ראשונים","פעולות גרילה בכל השוק, מעטפת שוק רחבה, או הכרזה מראש על מוצרים חדשים.","הכרזה על דגם חדש לפני שהמתחרה משיק."],["x","מגננת מתקפת נגד","מתנגשים חזיתית עם התוקף","או משתמשים בכוח כלכלי ופוליטי, למשל מימון הוזלה ממוצרים רווחיים.","הורדת מחיר בדיוק במוצר שהמתחרה תקף."],["cycle","מגננה ניידת","מרחיבים לשטחים חדשים","<b>הרחבת שוק</b> (מהמוצר לצורך הגנרי, כמו ״נפט״ ← ״אנרגיה״) או <b>הגוונת שוק</b> (ענפים לא קשורים).","חברת נפט שנעשית ״חברת אנרגיה״."],["split","הגנת התכווצות","נסיגה אסטרטגית משווקים חלשים","מוותרים על שווקים חלשים ומעבירים משאבים לחזקים.","P&G מכרה את Pringles כדי להתמקד בקווי הליבה."]])}`,q:"e10"},
  {h:"מאתגר, נגרר וגומחאי",html:`<p><b>המאתגר</b> קובע יעד ואז בוחר את מי לתקוף: את המוביל (מסוכן, אבל משתלם אם המוביל לא משרת טוב), עסקים בגודל דומה שחלשים, או עסקים קטנים. חמש אסטרטגיות תקיפה:</p><div class="tw"><table><tr><th>מתקפה</th><th>מה עושים</th></tr><tr><td><b>חזיתית</b></td><td>משתווים ליריב במוצר, פרסום, מחיר והפצה</td></tr><tr><td><b>איגוף</b></td><td>ממלאים פערים בשוק, אזורים חלשים או צרכים בלי מענה. טוב למאתגר עם מעט משאבים</td></tr><tr><td><b>כיתור</b></td><td>מתקפה בכמה חזיתות. הגיוני כשיש משאבים עדיפים</td></tr><tr><td><b>מעקף</b></td><td>תוקפים שווקים קלים: הגוונה, שווקים חדשים, או <b>זינוק טכנולוגי</b></td></tr><tr><td><b>גרילה</b></td><td>התקפות קטנות לסירוגין: הנחות בררניות, מבצעים, פעולות משפטיות</td></tr></table></div>${tiles([["copies","הנגרר","מעדיף לחקות ולא לאתגר","לפי לוויט, <b>חיקוי מוצר</b> יכול להיות רווחי כמו <b>חדשנות</b>, כי הנגרר לא נושא בעלויות הפיתוח. נפוץ בענפים הומוגניים כמו פלדה. סוגים: <b>מעתיק</b> (כמעט הכול), <b>חקיין</b> (חלק, עם בידול), <b>מתאים</b> (משפר ומוכר לשווקים אחרים). זייפנות היא דבר אחר: לא חוקית.","רשת קטנה מעתיקה את מבנה החנות של ״גלגל״, אבל בצבעים שלה."],["target","הגומחאי","מוביל בשוק קטן, במקום נגרר בשוק גדול","פונה לשווקים שלא מעניינים את הגדולים, עם שולי רווח גבוהים. מתמחה למשל במשתמש קצה, ברמה אנכית, בגודל לקוח, בלקוחות ספציפיים, באזור, בקו מוצרים, בתכונה, בעבודות מיוחדות, באיכות או מחיר, בשירות או בערוץ.","חנות שמתמחה רק באופניים מותאמים לאנשים עם מוגבלות."]])}`,q:"e11"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין חלקי השיעור: תכנון, SWOT, סביבה ותחרות.`)}${rem("טיפ: ב־SWOT, שאלו קודם אם הגורם בתוך העסק (חוזקה או חולשה) או מחוצה לו (הזדמנות או איום).")}`,q:"ex"}
 ]}

const Q={"e1": {"t": "t1", "v": [{"q": "מה ההבדל בין תוכנית שיווקית אסטרטגית לטקטית?", "a": "האסטרטגית: שוק וערך; הטקטית: הכלים", "w": ["האסטרטגית לטווח קצר, הטקטית לטווח ארוך", "האסטרטגית בתאגיד, הטקטית רק בחטיבה", "אין הבדל, אלה שני שמות לאותה תוכנית"], "e": "התוכנית האסטרטגית מתווה שוקי מטרה והצעת ערך. הטקטית מפרטת מוצר, קידום, המחרה, ערוצים ושירות."}, {"q": "מה שלושת השלבים בתהליך שבאיור 2.1?", "a": "תכנון, ביצוע ובקרה", "w": ["פילוח, בחירה ומיצוב", "מחקר, ניתוח ודיווח", "מוצר, מחיר והפצה"], "e": "התהליך: תכנון, ביצוע ובקרה, כולל מדידה, אבחון ופעולה מתקנת."}]}, "e2": {"t": "t1", "v": [{"q": "איזו מהשאלות הבאות היא אחת משאלות דרוקר להגדרת המשימה?", "a": "מה ערך בעיני הלקוח?", "w": ["כמה נשקיע בפרסום?", "מי המתחרה הכי חלש?", "מה המחיר הנכון?"], "e": "השאלות של דרוקר: במה אנחנו עוסקים? מי הלקוח? מה ערך בעיניו? במה נעסוק בעתיד? במה עלינו לעסוק?"}, {"q": "מה לא נכלל במאפיינים של יחידה עסקית אסטרטגית?", "a": "תקציב פרסום משותף לכל החברה", "w": ["אפשר לתכנן אותה בנפרד", "יש לה מתחרים משלה", "יש לה מנהל אחראי לרווחיות"], "e": "ל־SBU יש תכנון נפרד, מתחרים משלה ומנהל שאחראי לתכנון ולרווחיות."}]}, "e3": {"t": "t1", "v": [{"q": "רשת אופניים פותחת סניף בעיר חדשה, עם אותם מוצרים. איזו אסטרטגיית צמיחה זו?", "a": "פיתוח שוק", "w": ["חדירה לשוק", "פיתוח מוצר", "הגוונה"], "e": "מוצר קיים בשוק חדש הוא פיתוח שוק."}, {"q": "חברה קונה את הספק שממנו היא קונה חומרים. איזה סוג צמיחה זה?", "a": "שילוב לאחור", "w": ["שילוב לפנים", "שילוב אופקי", "חדירה לשוק"], "e": "שילוב לאחור: רכישת ספק. לפנים: רכישת מפיץ. אופקי: רכישת מתחרה."}]}, "e4": {"t": "t2", "v": [{"q": "חוק חדש שעלול להגביל את המוצר של החברה. באיזה חלק של ה־SWOT הוא נמצא?", "a": "איום", "w": ["חולשה", "הזדמנות", "חוזקה"], "e": "איומים והזדמנויות הם בסביבה החיצונית. חולשות וחוזקות הן פנימיות."}, {"q": "מבקשים מצרכנים לפרט את כל השלבים שהם עוברים בקנייה ובשימוש. באיזו שיטה מדובר?", "a": "שיטת שרשרת הצריכה", "w": ["שיטת האידיאל", "שיטת איתור בעיות", "ניתוח תרחישים"], "e": "בשיטת שרשרת הצריכה מפרטים את השלבים, וזה מוביל לעתים קרובות <ul>

      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="ck"></div><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  checkBox(t,bi);
  scrollTo(0,0);
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;
  const show=i=>{const v=list[i],opts=shuffle([v.a,...v.w]);
    host.innerHTML=`<div class="q ckq fade"><span class="eyebrow">בדיקת הבנה · שאלה ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="muted cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? עלו לטקסט וקראו שוב לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");
        const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
        fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}${ok?"":" <b>כדאי לחזור לטקסט למעלה ולקרוא שוב.</b>"}</div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.textContent=`לשאלה ${i+2} ←`;nx.style.alignSelf="flex-start";
          nx.onclick=()=>{const y=scrollY;show(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="muted";d.style.margin="0";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע (${r} מתוך ${list.length} נכון).`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };show(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));

  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
