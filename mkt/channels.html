  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"link",title:"רשתות ערך וערוצי שיווק",blocks:[
  {h:"רשת ערך ומהפכת הערוצים הדיגיטליים",html:`${def("על מה הנושא",`מוצר טוב לא שווה הרבה אם הוא לא מגיע ללקוח. הנושא מסביר את הרשת שמובילה אותו לשם.<br><b>מה נלמד כאן:</b> תכנון שרשרת ביקוש · רשת ערך · ערוצים משולבים · תפקידי הערוץ · תזרימים · רמות ערוץ`)}${ex("בלומדה נלווה את <b>רון</b>, בעלים של ״בית הגינה״, רשת משתלות שמוכרת צמחים וכלי גינון.")}<p><b>תכנון שרשרת ביקוש</b>: מתחילים משוק המטרה, ומתכננים את שרשרת האספקה <b>לאחור</b> מאותה נקודה.</p>${def("מושג מפתח",`<mark>רשת ערך</mark> ${E("Value network")}: מערכת של שותפויות ובריתות שהעסק בונה כדי להבטיח מקורות לייצור, העשרה ואספקה. כוללת ספקים, הספקים שלהם, לקוחות מיידיים ולקוחות הקצה שלהם, וגם חוקרים באוניברסיטאות וגופי תקינה.`)}<p><b>שלוש תובנות</b> מתכנון שרשרת ביקוש: (א) אם מרוויחים יותר <b>במעלה הזרם</b> או <b>במורדו</b>, למקרה שרוצים שילוב לאחור או לפנים; (ב) מודעות לשיבושים בכל נקודה; (ג) אפשר לעבוד באתר מקוון עם שותפים, כדי לזרז ולהוזיל.</p><p><b>המהפכה הדיגיטלית</b>: הלקוחות רוצים את היתרונות של חנות דיגיטלית (מבחר, מידע, ביקורות) וגם של פיזית (שירות אישי, בדיקה, חוויה). הם מצפים ל<b>שילוב בין ערוצים</b>, למשל:</p><ul><li>לבדוק באתר אם יש מלאי בחנות הקרובה.</li><li>להזמין באתר ולאסוף בחנות.</li><li>להחזיר לחנות מוצר שנקנה באתר.</li><li>לקבל הנחות לפי סך הקניות באתר ובחנויות.</li></ul>`,q:"e1"},
  {h:"תפקידי הערוץ, תזרימים ורמות",html:`<p><b>למה יצרן מוותר על שליטה ומשתמש במתווכים?</b> בזכות הקשרים, הניסיון, ההתמחות והיקף הפעילות שלהם, הם יעילים יותר. ליצרני מסטיק כמו Wrigley לא משתלם להקים חנויות, ואפילו פורד מסתמכת על אלפי סוכנויות.</p><p>הערוץ מתגבר על <b>פערי זמן, מקום ובעלות</b>. התפקידים (טבלה 12.1): איסוף מידע, תקשורת משכנעת, משא ומתן על מחיר ותנאים, העברת הזמנות, מימון מלאי, נטילת סיכונים, אחסון ושינוע, תשלומים, ופיקוח על העברת הבעלות.</p><div class="tw"><table><tr><th>תזרים לפנים</th><th>תזרים לאחור</th><th>בשני הכיוונים</th></tr><tr><td>מהעסק ללקוח: אחסון ושינוע, חזקה, תקשורת</td><td>מהלקוח לעסק: הזמנה ותשלום</td><td>מידע, משא ומתן, מימון וסיכון</td></tr></table></div><p>באיור 12.1 יש <b>חמישה תזרימים</b> בשיווק מלגזות: פיזי, קניין, תשלום, מידע וקידום.</p><p>יצרן של מוצר ושירות עשוי להזדקק ל<b>שלושה ערוצים</b>: מכירות, אספקה ושירות.</p>${rem("השאלה היא לא <b>אם</b> לבצע תפקיד, כי חייבים, אלא <b>מי</b> יבצע אותו. העברה למתווך מוזילה ליצרן, אבל המתווך מוסיף את העלות שלו. אם הוא יעיל יותר, המחיר לצרכן יורד. ואם הצרכן עושה חלק בעצמו, הוא משלם עוד פחות.")}<p><b>רמות ערוץ</b>: מספר המתווכים בין היצרן ללקוח קובע את <b>אורך הערוץ</b>. <b>ערוץ אפס רמות</b>, או <b>ערוץ שיווק ישיר</b>: היצרן מוכר ישירות ללקוח. (הקריאה נגמרת כאן.)</p>`,q:"e2"}
 ]},
 {id:"t2",icon:"phone",title:"מערכות אופקיות ומסחר מקוון",blocks:[
  {h:"מערכת שיווק אופקית, מסחר אלקטרוני וניידים",html:`${def("מושג מפתח",`<mark>מערכת שיווק אופקית</mark> ${E("Horizontal marketing system")}: שתי חברות או יותר, <b>בלי קשר ביניהן</b>, משלבות משאבים כדי לנצל הזדמנות. לכל אחת לבד אין מספיק הון, ידע או יכולת, או שהיא חוששת מהסיכון. למשל, רשתות מרכולים עם סניפי בנק בתוכן.`)}<p><b>מסחר אלקטרוני</b> (e-commerce) משתמש באתרים לעסקאות. <b>מסחר בניידים</b> (m-commerce) מוכר דרך טלפונים וטאבלטים. בזכות החיסכון בשכירות, עובדים ומלאי, אפשר להרוויח גם מנפח קטן בשוקי גומחה. קמעונאי רשת מתחרים ב<b>שלושה היבטים</b>: ההידוד עם האתר, האספקה, והטיפול בבעיות.</p><div class="tw"><table><tr><th>על טהרת הקליק</th><th>קירות ומלט</th></tr><tr><td>עסקים שהקימו אתר בלי נוכחות קודמת: מנועי חיפוש, ספקי אינטרנט, אתרי מסחר, עסקאות ותוכן. חשובים: שירות, אתר מהיר ופשוט, מדיניות החזרות, בטיחות ופרטיות</td><td>עסקים קיימים עם מבנה פיזי, שהוסיפו אתר. רבים היססו מחשש לעימות עם שותפי הערוץ</td></tr></table></div><p><b>אתרים בין עסקים</b>: אתרי ספקים, <b>מתווכי־מידע</b> (אוספים מידע על חלופות), <b>בוני־שוק</b> (מקשרים קונים ומוכרים), ו<b>קהילות לקוחות</b>. התוצאה: מחירים שקופים יותר.</p><p><b>״קירות וקליקים״</b>: כדי לשמור על תמיכת המתווכים, משווקים (א) מציעים מותגים או מוצרים שונים באתר ובחנות; (ב) נותנים לשותפים הלא מקוונים עמלות גבוהות יותר; (ג) מקבלים הזמנות באתר, אבל הקמעונאים מספקים וגובים.</p>${ex("״בית הגינה״ מוכרת באתר רק ערכות שתילה שלא נמכרות בחנויות, כדי לא להתחרות בזכיינים שלה.")}<p><b>ניידים</b>: עד אמצע 2013, יותר ממחצית הקניות המקוונות בארה״ב בוצעו בנייד. התחזית שהטאבלטים יעקפו את הטלפונים התבדתה. באסיה הנייד הוא כבר המחשב העיקרי.</p>`,q:"e3"}
 ]},
 {id:"t3",icon:"cart",title:"קמעונות: סוגי קמעונאים",blocks:[
  {h:"רמות שירות וסוגי חנויות",html:`${def("על מה הנושא",`מי מוכר לצרכן הסופי, ובאילו צורות.<br><b>מה נלמד כאן:</b> קמעונות וקמעונאי · ארבע רמות שירות · סוגי חנויות · קמעונות ללא חנות · קמעונות תאגידית`)}<p>הפתיחה של הפרק: Warby Parker, משקפיים במכירה מקוונת בלי מתווכים, ב־95 דולר, עם משלוח והחזרה חינם, וזוג לצדקה על כל זוג שנמכר.</p>${def("מושג מפתח",`<mark>קמעונות</mark> ${E("Retailing")}: כל הפעילויות של מכירה ישירה <b>לצרכנים לשימוש פרטי</b>. <b>קמעונאי</b> הוא עסק שרוב המכירות שלו קמעוניות. לא משנה איך (אדם, דואר, מכונה, אינטרנט) ולא איפה (חנות, רחוב, בית).`)}<div class="tw"><table><tr><th>רמת שירות</th><th>מה זה</th></tr><tr><td><b>1. שירות עצמי</b></td><td>הלקוח מאתר, משווה ובוחר לבד, כדי לחסוך. הבסיס של החנויות הזולות</td></tr><tr><td><b>2. בחירה עצמית</b></td><td>בוחרים לבד, אבל אפשר לבקש עזרה</td></tr><tr><td><b>3. שירות מוגבל</b></td><td>יותר סחורה, אשראי והחזרות</td></tr><tr><td><b>4. שירות מלא</b></td><td>מוכרנים בכל שלב. יקר, עם הרבה סחורות מיוחדות</td></tr></table></div><p><b>סוגי חנויות</b> (טבלה 13.1), לפי רוחב המבחר והמחיר:</p><ul><li><b>מתמחה</b> (קו צר), <b>כלבו</b> (כמה קווים), <b>מרכול</b> (שירות עצמי, מרווח נמוך, נפח גבוה), <b>חנות נוחות</b> (קטנה, 24/7), <b>פארם</b>.</li><li><b>רשת הוזלה</b> (מחיר נמוך, נפח גבוה), <b>הנחות ענק</b> (מבחר מוגבל, עוד יותר זול), <b>חנות מבצעים</b> (עודפים ופגומים, כמו TJ Maxx ו־Costco).</li><li><b>חנות־על</b>: כולל ״<b>מחסלת קטגוריה</b>״ (מבחר עצום בקטגוריה אחת, Staples) ו<b>היפרשוק</b> (Carrefour). <b>אולם תצוגה מקטלוגים</b>.</li></ul>`,q:"e4"},
  {h:"קמעונות ללא חנות וקמעונות תאגידית",html:`<p><b>קמעונות ללא חנות</b> צומחת מהר יותר מהקמעונות בחנויות. <b>ארבע קטגוריות</b>:</p>${tiles([["phone","שיווק ישיר","טלפוני, דיוור, קטלוגים וקנייה מקוונת","",""],["people","מכירה ישירה","מכירה רב־שכבתית, או שיווק רשת","מדלת לדלת, או באירועי מכירה בבתים.",""],["gear","מכונות מכירה אוטומטיות","למוצרי דחף","משקאות קלים, תמרוקים.",""],["id","שירות קניינות","רק לחברי חוג מוגדר","בדרך כלל עובדי ארגונים גדולים, שזכאים להנחות.",""]])}<p><b>קמעונות תאגידית</b>: יתרונות של גודל, כוח קנייה, מותג מוכר ועובדים מיומנים. הסוגים (טבלה 13.2):</p><div class="tw"><table><tr><th>סוג</th><th>מה זה</th></tr><tr><td><b>רשת תאגידית</b></td><td>שתי חנויות או יותר בבעלות משותפת, עם רכש מרכזי (Gap)</td></tr><tr><td><b>רשת מרצון</b></td><td>קמעונאים עצמאים <b>בחסות סיטונאי</b> (IGA)</td></tr><tr><td><b>אגודה קמעונית שיתופית</b></td><td>קואופרטיב של קמעונאים עצמאים, עם קנייה וקידום משותפים (ACE)</td></tr><tr><td><b>אגודה צרכנית שיתופית</b></td><td>חנות <b>בבעלות הלקוחות</b>. מצביעים ומקבלים דיבידנד</td></tr><tr><td><b>זכיינות</b></td><td>חוזה בין מעניק הזיכיון לזכיינים (Dunkin' Donuts)</td></tr><tr><td><b>תשלובת מסחור</b></td><td>כמה צורות קמעונות בבעלות מרכזית (Macy's)</td></tr></table></div>${rem("ההבדל שקל להתבלבל בו: ב<b>רשת מרצון</b> מי שמארגן הוא <b>סיטונאי</b>. ב<b>אגודה קמעונית</b> הקמעונאים עצמם מתארגנים.")}`,q:"e5"}
 ]},
 {id:"t4",icon:"building",title:"סביבת הקמעונות והחלטות הקמעונאי",blocks:[
  {h:"הסביבה החדשה ושיווק לקונים בחנות",html:`${def("על מה הנושא",`איך משתנה עולם הקמעונות, ואילו החלטות הקמעונאי מקבל.<br><b>מה נלמד כאן:</b> חנויות זמניות · קמעונות מהירה · שיווק לקונים בחנות · עשר החלטות · DPP · מיקום`)}<ul><li><b>חנויות זמניות</b> (Pop-up): לכמה שבועות באזורים הומים, כדי ליצור <b>באזז</b> וחוויה.</li><li>ענקיות כמו וולמרט משתמשות במידע, בלוגיסטיקה ובכוח קנייה. <b>הקמעונאים של שוק הביניים בדעיכה</b>, כי רשתות ההוזלה משתפרות.</li><li><b>קמעונות מהירה</b> (Zara, Uniqlo): מבחר שמשתנה כל הזמן. ״אופנה מהירה״ זוכה לביקורת על התיישנות מתוכננת, איכות ירודה ובזבוז.</li><li><b>טכנולוגיה</b>: תחזיות, בקרת מלאי והזמנות, וגם מסכים ויישומים בחנות. ו<b>רשתות חברתיות</b>, במיוחד בחגים.</li></ul>${def("מושג מפתח",`<mark>שיווק לקונים בחנות</mark> ${E("Shopper marketing")}: יצרנים וקמעונאים משתמשים במלאי, בתצוגה ובמבצעים כדי להשפיע על הצרכן <b>בזמן הקנייה</b>. לפי מחקרים, יותר ממחצית ההחלטות מתקבלות בחנות.`)}${ex("P&G הקימה בוולמרט ״מרכז תינוקות״, שבו כל מוצרי התינוקות במעבר אחד. ההורים שהו יותר, הוציאו יותר, ומכירות Pampers עלו.")}<p>לפי המחקר, יש יותר <b>קניות לא מתוכננות</b> ככל שנוגעים במוצר, שוקלים יותר זמן, עומדים קרוב למדף, יש פחות תצוגות בקו הראייה, וקל להגיע למידע. אפילו נגיעה במוצר על מסך טאבלט מגבירה כוונת רכישה.</p>`,q:"e6"},
  {h:"ההחלטות השיווקיות של הקמעונאי",html:`<p>הקמעונאי מחליט בעשרה תחומים: <b>שוק מטרה, ערוצים, מבחר, רכש, מחירים, שירותים, אווירה, חוויות, תקשורת ומיקום</b>.</p><ul><li><b>שוק מטרה</b>: בלי הגדרה, אין החלטות עקביות. פלחים דקים יותר וקווי חנויות חדשים (Janie and Jack של Gymboree).</li><li><b>ערוצים</b>: לרוב ריבוי ערוצים. הקטלוגים דווקא צמחו, ככלי מיתוג.</li><li><b>מבחר</b>: לפי רוחב ועומק. מסעדה: צר ופשוט (דלפק), צר ועשיר (מעדנייה), רחב ופשוט (קפטריה), רחב ועשיר (מסעדה גדולה). <b>קטגוריות יעד</b>, כמו פירות וירקות, קובעות איפה המשפחה תקנה.</li><li><b>רכש</b>: <b>רווחיות מוצר ישירה</b> (DPP) מודדת את עלויות הטיפול, מהמחסן עד הקונה. מוצרים בנפח גבוה יכולים להיות פחות רווחיים, ולהגיע להם <b>פחות</b> מקום על המדף.</li><li><b>מחירים</b>: מרווח גבוה ונפח נמוך (מתמחות), או מרווח נמוך ונפח גבוה (הוזלה). פריטים מגבירי תנועה.</li><li><b>שירותים</b>: טרום קנייה (הזמנה, תאי מדידה, שעות), אחרי (משלוח, החזרות, התקנה), ונלווים (חניה, אשראי, מסעדה).</li><li><b>אווירה</b>: המתווה של Kohl's הוא לולאה, עם שדרה מרכזית לממהרים. ללקוחות ממוקדי משימה מתאימה אווירה פשוטה. אחרים מחפשים בידור.</li><li><b>תקשורת</b>: פרסום, קופונים, מועדונים, טעימות ורשתות.</li></ul>${tiles([["target","מיקום","״מיקום, מיקום ומיקום״: שש אפשרויות","1. <b>אזור עסקים מרכזי</b> (מרכז העיר). 2. <b>מרכז קניות אזורי</b>: 40 עד 200 חנויות ואחת או שתיים ״עוגן״. 3. <b>מרכז קניות קהילתי</b>: עוגן אחד ו־20 עד 40 חנויות. 4. <b>רצועת קניות</b> לשכונה. 5. <b>מקום בתוך חנות גדולה</b> (״חנות בתוך חנות״). 6. <b>חנות עצמאית</b>.",""]])}${ex("רון מגלה בבדיקת DPP שהאדמה בשקים, שנמכרת הכי הרבה, תופסת מקום ועולה הרבה לשנע. הוא מקטין לה את שטח התצוגה.")}`,q:"e7"}
 ]},
 {id:"t5",icon:"id",title:"מותגים פרטיים",blocks:[
  {h:"מותג פרטי, מוצרים גנריים ומה עושים היצרנים",html:`${def("מושג מפתח",`<mark>מותג פרטי</mark> ${E("Private-label brand")}, או מותג החנות או מותג הבית: מותג שמפתחים קמעונאים וסיטונאים.`)}<p><b>נתונים</b>: באירופה ובקנדה כ־40% מהפריטים ברשתות המכולת. בבריטניה, כמחצית ממכירות סיינסברי וטסקו. בארה״ב, פריט אחד מכל חמישה. בשפל המכירות שלהם עולות, ולא כולם חוזרים. יש מומחים שרואים ב־50% גבול עליון טבעי.</p><p><b>למה מתווכים רוצים מותג משלהם?</b></p><ul><li><b>רווחיות</b>: יצרנים עם עודף כושר ייצור מייצרים בזול, והוצאות המחקר, הפרסום וההפצה נמוכות.</li><li><b>בידול</b>: מותגים בלעדיים שאין אצל המתחרים.</li></ul>${def("מושג מפתח",`<mark>מוצרים גנריים</mark> ${E("Generics")}: גרסאות זולות, לא ממותגות, באריזה פשוטה (פסטה, נייר טואלט). איכות סטנדרטית או נמוכה, וזולים ב־20%–40% ממותגים ארציים וב־10%–20% ממותגים פרטיים.`)}<p><b>למה המותגים הפרטיים מצליחים?</b></p><ul><li>לקמעונאים יש כוח: <b>דמי שיבוץ</b> (Slotting fee) על כניסת מותג חדש, תשלום על תצוגה, ותצוגה בולטת למותגי הבית.</li><li>המותגים הידועים <b>נחלשו</b>: קופונים ומבצעים הרגילו לקנות לפי מחיר, המתחרים מחקים ומצמצמים את הבידול, והרבה הרחבות טשטשו את הזהות.</li></ul><p><b>תגובת היצרנים</b>: מחקר ופיתוח, הרחבות ושיפורים, ופרסום <b>״משיכה״</b> חזק. המומחים ממליצים: לחימה בררנית, שותפויות, חדשנות והצעות ערך מנצחות.</p>${ex("״בית הגינה״ משיקה דשן בשם ״בית הגינה״, שמיוצר אצל יצרן עם עודף כושר ייצור. הרווח שלה עליו גבוה יותר מאשר על המותגים הידועים.")}`,q:"e8"}
 ]},
 {id:"t6",icon:"factory",title:"סיטונות",blocks:[
  {h:"סוגי סיטונאים ותפקידיהם",html:`${def("על מה הנושא",`מי מוכר למי שמוכר הלאה, ולמה צריך אותו.<br><b>מה נלמד כאן:</b> הגדרה · סוגי סיטונאים · ההבדל מקמעונאים · תשעה תפקידים · מגמות`)}${def("מושג מפתח",`<mark>סיטונות</mark> ${E("Wholesaling")}: מכירה למי שקונה כדי <b>למכור מחדש</b> או <b>לשימוש עסקי</b>. לא כולל יצרנים, חקלאים וקמעונאים.`)}<div class="tw"><table><tr><th>סוג (טבלה 13.3)</th><th>מה מאפיין</th></tr><tr><td><b>סיטונאים סוחרים</b></td><td>בבעלות עצמית, <b>נוטלים חזקה</b> על הסחורה. שירות מלא (מלאי, מכירות, אשראי, משלוחים, ייעוץ) או מוגבל: שלם־וקח, משאית, הזמנות, <b>קבלני מתקנים</b> (מסדרים תצוגה, וגובים רק על מה שנמכר), אגודות שיתופיות, הזמנה בדואר</td></tr><tr><td><b>סוכנים ועמילים</b></td><td>עמלה של 2%–6%. מפגישים קונים ומוכרים. בדרך כלל <b>לא נוטלים בעלות</b></td></tr><tr><td><b>סניפים ומשרדים</b> של יצרנים וקמעונאים</td><td>הקונים או המוכרים עושים את הסיטונות בעצמם</td></tr><tr><td><b>מתמחים</b></td><td>רכזים חקלאיים, מסופי נפט וגז, חברות מכירה פומבית</td></tr></table></div><p><b>במה סיטונאים שונים מקמעונאים</b>: פחות קידום, אווירה ומיקום (הלקוחות עסקיים); עסקאות גדולות ואזור רחב יותר; וחוקים ומיסוי שונים.</p><p><b>תשעה תפקידים</b>: מכירה וקידום; קניינות ובניית מבחר; <b>פירוק צובר</b>; אחסון; שינוע; מימון; נשיאת סיכון; מידע שוק; ניהול וייעוץ.</p>${rem("<b>תלונות היצרנים</b>: לא מקדמים באגרסיביות, לא מחזיקים מספיק מלאי, לא נותנים מידע, לא מושכים מנהלים טובים, וגובים יותר מדי. סיטונאים נבונים מתאימים שירותים, מנהלים מלאי ותקבולים, ומשקיעים בטכנולוגיה. ועדיין, הם פגיעים להתנגדות להעלאות מחיר.")}`,q:"e9"}
 ]},
 {id:"t7",icon:"cycle",title:"לוגיסטיקה שיווקית",blocks:[
  {h:"שרשרת אספקה, יעדים והחלטות",html:`${def("על מה הנושא",`איך הסחורה זזה פיזית, ומה זה עולה.<br><b>מה נלמד כאן:</b> ניהול שרשרת אספקה · לוגיסטיקה שיווקית וארבעה שלבים · ILS · היעדים והפשרות · ארבע החלטות`)}<p>ההפצה הפיזית מתחילה בבית החרושת. היום היא חלק מ<b>ניהול שרשרת אספקה</b> (SCM), שמתחיל עוד <b>לפני</b>: ברכישת התשומות. יש עסקים שנעזרים ב<b>צד שלישי</b> מומחה לוגיסטיקה.</p>${def("מושג מפתח",`<mark>לוגיסטיקה שיווקית</mark> ${E("Market logistics")}: תכנון התשתית לביקוש, ומימוש ובקרה של התזרימים הפיזיים, מנקודת המוצא לנקודת השימוש, כך שיענו על דרישות הלקוח ויניבו רווח.`)}<p><b>ארבעה שלבים</b>: 1. הצעת הערך ללקוח (תקן אספקה, דיוק). 2. תכנון הערוץ והרשת (ישירות או דרך מתווכים, כמה מחסנים ואיפה). 3. מצוינות תפעולית (חיזוי, מחסנים, שינוע, חומרים). 4. מימוש במערכות, ציוד ונהלים.</p><p><b>מערכות לוגיסטיקה משולבות</b> (ILS): ניהול חומרים, תזרים חומרים והפצה, בעזרת טכנולוגיית מידע. הכול מתחיל ב<b>חיזוי מכירות</b>. מלאי המוצרים המוגמרים מחבר בין ההזמנות לייצור.</p>${rem("הלוגיסטיקה יכולה להגיע ל<b>30%–40% מעלות המוצר</b>, ומומחים רואים בה ״אזור הספר האחרון״ לחיסכון.")}<p><b>היעד</b>: ״הסחורות הנכונות, במקום הנכון, בזמן הנכון, בעלות הנמוכה ביותר״. אבל אי אפשר גם למקסם שירות וגם למזער עלות: שירות מרבי דורש מלאי גדול, שינוע יקר והרבה מחסנים. לכן מחליטים <b>מערכתית</b>, לפי מה שהלקוחות רוצים ומה שהמתחרים מציעים. היעד הוא <b>מקסום רווחים</b>, לא מכירות.</p><div class="tw"><table><tr><th>החלטה</th><th>מה בעיקר שואלים</th></tr><tr><td><b>עיבוד הזמנה</b></td><td>איך לקצר את מחזור הזמנה־תשלום? מחזור ארוך מוריד שביעות רצון ורווחים</td></tr><tr><td><b>אחסון</b></td><td>יותר מחסנים: אספקה מהירה, אבל עלויות גבוהות. או מלאי מרוכז ושינוע מהיר</td></tr><tr><td><b>מלאי</b></td><td>כמה מלאי להחזיק</td></tr><tr><td><b>שינוע</b></td><td>איך לשלוח</td></tr></table></div>${ex("רון מחליט על מחסן אחד מרכזי ומשלוח מהיר, במקום מחסן בכל סניף. האספקה קצת איטית, אבל עלות המלאי יורדת.")}`,q:"e10"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין ערוצים, קמעונות, סיטונות ולוגיסטיקה.`)}${rem("טיפ: קמעונאי מוכר <b>לצרכן לשימוש פרטי</b>. סיטונאי מוכר <b>למי שמוכר הלאה או לעסק</b>.")}`,q:"ex"}

const SUM=`<h2>סיכום: ערוצי שיווק, קמעונות ולוגיסטיקה</h2>
<div class="key"><b>על מה הקריאה?</b> פרק 12 עמ' 274–276 ו־285–286, ופרק 13 עמ' 294–306, לפי הסילבוס של שיעור 11: רשתות ערך ותפקידי הערוץ, מסחר מקוון, קמעונות ומותגים פרטיים, סיטונות ולוגיסטיקה שיווקית.</div>
<h3>1. רשתות ערך וערוצים (פרק 12)</h3>
<ul>
<li><b>תכנון שרשרת ביקוש</b>: משוק המטרה לאחור. <b>רשת ערך</b>: ספקים, לקוחות ולקוחות הקצה, ועוד שותפים. תובנות: איפה מרוויחים (מעלה או מורד הזרם), שיבושים, עבודה מקוונת עם שותפים.</li>
<li><b>מהפכה דיגיטלית</b>: הלקוחות רוצים שילוב בין ערוצים (מלאי באתר, הזמנה ואיסוף, החזרה בחנות).</li>
<li><b>למה מתווכים</b>: קשרים, ניסיון, התמחות והיקף. הערוץ מגשר על פערי <b>זמן, מקום ובעלות</b>.</li>
<li><b>תפקידים</b> (טבלה 12.1). <b>תזרים לפנים</b> (אחסון, שינוע, חזקה, תקשורת), <b>לאחור</b> (הזמנה, תשלום), <b>בשני הכיוונים</b> (מידע, משא ומתן, מימון, סיכון). חמישה תזרימים: פיזי, קניין, תשלום, מידע, קידום.</li>
<li>שלושה ערוצים: מכירות, אספקה, שירות. השאלה היא <b>מי</b> יבצע כל תפקיד.</li>
<li><b>רמות ערוץ</b>: ערוץ אפס רמות (ישיר).</li>
<li><b>מערכת שיווק אופקית</b>: חברות לא קשורות משלבות משאבים.</li>
<li><b>מסחר אלקטרוני ובניידים</b>. על טהרת הקליק מול קירות ומלט. B2B: מתווכי־מידע, בוני־שוק, קהילות. ״קירות וקליקים״: מוצרים שונים, עמלות גבוהות, הזמנות דרך הקמעונאים.</li>
</ul>
<h3>2. קמעונות (פרק 13)</h3>
<ul>
<li><b>קמעונות</b>: מכירה לצרכנים לשימוש פרטי. דוגמת הפתיחה: Warby Parker.</li>
<li><b>רמות שירות</b>: עצמי, בחירה עצמית, מוגבל, מלא.</li>
<li><b>סוגי חנויות</b> (טבלה 13.1): מתמחה, כלבו, מרכול, נוחות, פארם, הוזלה, הנחות ענק, מבצעים, חנות־על (מחסלת קטגוריה, היפרשוק), אולם קטלוגים.</li>
<li><b>ללא חנות</b>: שיווק ישיר, מכירה ישירה (שיווק רשת), מכונות, שירות קניינות.</li>
<li><b>תאגידית</b> (טבלה 13.2): רשת תאגידית, רשת מרצון (בחסות סיטונאי), אגודה קמעונית, אגודה צרכנית (בבעלות הלקוחות), זכיינות, תשלובת מסחור.</li>
<li><b>הסביבה</b>: חנויות זמניות, דעיכת שוק הביניים, קמעונות מהירה, טכנולוגיה, <b>שיווק לקונים בחנות</b> (מרכז התינוקות של P&G).</li>
<li><b>החלטות</b>: שוק מטרה, ערוצים, מבחר (רוחב ועומק, קטגוריות יעד), רכש (DPP), מחירים, שירותים (לפני, אחרי, נלווים), אווירה, חוויות, תקשורת, <b>מיקום</b> (מרכז עסקים, אזורי, קהילתי, רצועה, בתוך חנות, עצמאי).</li>
</ul>
<h3>3. מותגים פרטיים</h3>
<ul>
<li>מותג של קמעונאי או סיטונאי. רווחי (יצרן עם עודף כושר, פחות הוצאות) ומבדל.</li>
<li><b>גנריים</b>: לא ממותגים וזולים ב־20%–40%.</li>
<li>הצלחה: כוח הקמעונאים (<b>דמי שיבוץ</b>, תצוגה) והיחלשות המותגים (מבצעים, חיקוי, הרחבות). תגובת היצרנים: חדשנות ופרסום ״משיכה״.</li>
</ul>
<h3>4. סיטונות</h3>

<li>מכירה למי שמוכר הלאה או לעסק. סוגים (טבלה 13.3): <b>סוחרים</b> (נוטלים חזקה; שירות מלא או מוגבל, כמו קבלני מתקנים), <b>סוכנים ועמילים</b> (עמלה 2%–6%), סניפי יצרנים וקמעונאים, מתמחים.</li>

<li><b>תפקידים</b>: מכירה, בניית מבחר, פירוק צובר, אחסון, שינוע, מימון, סיכון, מידע, ייעוץ. תלונות היצרנים, ותגובת הסיטונאים הנבונים.</li>
</ul>
<h3>5. לוגיסטיקה שיווקית</h3>
<ul>
<li><b>ניהול שרשרת אספקה</b> מתחיל ברכישת התשומות. <b>לוגיסטיקה שיווקית</b>: תכנון, מימוש ובקרה של התזרים הפיזי. ארבעה שלבים: הצעת ערך, ערוץ ורשת, מצוינות תפעולית, מימוש.</li>
<li><b>ILS</b>, מתחיל בחיזוי מכירות. עלות של 30%–40% ממחיר המוצר.</li>
<li>אי אפשר גם שירות מרבי וגם עלות מזערית. היעד: מקסום רווח.</li>
<li><b>ארבע החלטות</b>: עיבוד הזמנה (לקצר את מחזור הזמנה־תשלום), אחסון, מלאי, שינוע.</li>
</ul>
<div class="key"><b>השורה התחתונה: מה רוצים ממך</b><br>להסביר רשת ערך ולמה משתמשים במתווכים; למיין תזרימים לפנים ולאחור; לזהות סוג קמעונאי, רמת שירות, ארגון תאגידי ומיקום; להסביר מותגים פרטיים וגנריים; לזהות סוג סיטונאי ותפקיד; ולמנות את ארבע החלטות הלוגיסטיקה ואת הפשרה בין שירות לעלות.</div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
      ${CONFIG.podcast?`<button class="review-btn" id="pod"><span aria-hidden="true">🎧</span><span>פודקאסט${CONFIG.podcast.min?` · ${CONFIG.podcast.min} דק׳`:""}</span></button>`:""}
     </div>
     ${CONFIG.podcast?`<div id="podbox" class="podbox" hidden><p class="muted">פודקאסט שנוצר ב־Gemini Notebook מקריאת החובה. כמו כל סיכום אוטומטי, הוא עלול לטעות, והקריאה עצמה קובעת.</p><div class="podframe"></div></div>`:""}
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mkt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}{const pb=app.querySelector("#pod");if(pb)pb.onclick=()=>{const bx=app.querySelector("#podbox");bx.hidden=!bx.hidden;const f=bx.querySelector(".podframe");if(!bx.hidden&&!f.firstChild)f.innerHTML=`<iframe src="https://drive.google.com/file/d/${CONFIG.podcast.id}/preview" allow="autoplay" title="פודקאסט" loading="lazy"></iframe>`}}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};
  scrollTo(0,0);
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="ck"></div><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  checkBox(t,bi);
  scrollTo(0,0);
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;
  const show=i=>{const v=list[i],opts=shuffle([v.a,...v.w]);
    host.innerHTML=`<div class="q ckq fade"><span class="eyebrow">בדיקת הבנה · שאלה ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="muted cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? עלו לטקסט וקראו שוב לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");
        const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
        fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}${ok?"":" <b>כדאי לחזור לטקסט למעלה ולקרוא שוב.</b>"}</div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.textContent=`לשאלה ${i+2} ←`;nx.style.alignSelf="flex-start";
          nx.onclick=()=>{const y=scrollY;show(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="muted";d.style.margin="0";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע (${r} מתוך ${list.length} נכון).`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };show(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb){pb.click();const bx=document.querySelector("#podbox");if(bx)bx.scrollIntoView({block:"center"})}}else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
</html>
