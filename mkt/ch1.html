  for(const k of Object.keys(ACR)){const [en,he]=ACR[k];if((he&&plain.includes(he))||(en&&plain.toLowerCase().includes(en.toLowerCase())))seen.add(k)}
  let inSvg=0;
  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;
    return p.replace(ACR_RE,(m,k,off,str)=>{if(seen.has(k))return m;seen.add(k);
      const before=str.slice(0,off),inP=before.lastIndexOf("(")>before.lastIndexOf(")");
      return inP?`<bdi class="ak">${m}</bdi>: ${acrText(k)}`:`<bdi class="ak">${m}</bdi> <span class="acr">(${acrText(k)})</span>`})}).join("");
}
function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);
  return f.size?`<div class="acrnote"><b>ראשי תיבות:</b> ${[...f].map(k=>`<bdi class="ak">${k}</bdi> = ${acrText(k)}`).join(" · ")}</div>`:""}
const T=[
 {id:"t1",icon:"bulb",title:"מהו שיווק ומה משווקים",blocks:[
  {h:"למה השיווק חשוב, ומהו שיווק",html:`${def("על מה הנושא",`הפרק הראשון מניח את היסודות: למה שיווק חשוב, מה הוא בדיוק, מה אפשר לשווק ומי משווק.<br><b>מה נלמד כאן:</b> חשיבות השיווק · הגדרת השיווק · ניהול השיווק · מכירה מול שיווק`)}${ex("בלומדה נלווה את <b>דנה</b>, שפותחת בית קפה קטן ליד הקמפוס, ומנסה להבין איך משווקים אותו.")}<p>בלי ביקוש למוצרים, אין משמעות לשאר הפונקציות בעסק, כמו מימון או תפעול. במילים של הספר: כדי שתהיה ״שורה תחתונה״ (רווח), צריכה להיות ״שורה עליונה״ (הכנסות). לכן עסקים רבים ממנים <b>מנהל שיווק ראשי</b> (CMO), באותה רמה של מנהל הכספים ומנהל מערכות המידע.</p>${def("מושג מפתח",`<mark>שיווק</mark> ${E("Marketing")}: זיהוי צרכים אנושיים וחברתיים ומתן מענה להם. ההגדרה הקצרה: <b>״מענה רווחי לצרכים״</b>. לפי האגודה האמריקנית לשיווק: פעילות, מוסדות ותהליכים ליצירה, תקשור, אספקה וחליפין של הצעות בעלות ערך ללקוחות, לשותפים ולחברה כולה.`)}${def("מושג מפתח",`<mark>ניהול השיווק</mark> ${E("Marketing management")}: האמנות והמדע של בחירת שוקי מטרה, והשגה, שמירה והצמחה של לקוחות, באמצעות יצירה, אספקה ותקשור של ערך עדיף ללקוח.`)}${ex(`״גוגל״ זיהתה שאנשים צריכים דרך יעילה למצוא מידע, ויצרה מנוע חיפוש. ״איקאה״ זיהתה רצון לרהיטים איכותיים וזולים, ויצרה ריהוט להרכבה עצמית. שתיהן הפכו צורך להזדמנות עסקית רווחית.`)}${rem("לפי פיטר דרוקר, מכירה היא <b>לא</b> החלק החשוב בשיווק. המטרה היא להכיר את הלקוח כל כך טוב, שהמוצר ״ימכור את עצמו״, וכל מה שנשאר הוא לדאוג שיהיה זמין.")}`,q:"a1"},
  {h:"מה משווקים, מי משווק ומהו שוק",html:`<p>משווקים עוסקים ב<b>עשרה סוגי ישויות</b>:</p>${tiles([["cart","סחורות ושירותים","מוצרים מוחשיים, ושירותים כמו תעופה, בנקאות ותיקונים","ככל שכלכלה מתפתחת, יותר מהפעילות שלה היא שירותים. הרבה הצעות משלבות את שניהם, כמו ארוחה במסעדה.","דנה מוכרת קפה (סחורה) עם שירות ליד השולחן."],["clock","אירועים וחוויות","אירועים מבוססי זמן, וחוויות שמשלבות מוצרים ושירותים","אירועי ספורט ותערוכות הם אירועים. ״הממלכה הקסומה״ של דיסני היא חוויה.","דנה מארגנת ערב טעימות קפה."],["people","אנשים ומקומות","אמנים ומנהלים, וערים, אזורים ומדינות","טום פיטרס ממליץ לכל אדם להפוך ל״מותג״. מקומות מתחרים על תיירים, תושבים ומפעלים.","עירייה מפרסמת את העיר כיעד תיירותי."],["chart","נכסים וארגונים","זכויות בעלות (נדל״ן, מניות), ומוסדות שמשפרים את התדמית שלהם","גם מוזיאונים, אוניברסיטאות ומלכ״רים משתמשים בשיווק כדי להתחרות על קהל ועל תקציבים.","אוניברסיטה ממנה מנהל שיווק כדי לשפר את התדמית שלה."],["doc","מידע ורעיונות","מה שספרים ומוסדות לימוד מייצרים, ורעיון בסיסי שכל הצעה נושאת","״בבית החרושת אנחנו מייצרים קוסמטיקה; בחנות אנחנו מוכרים תקווה.״ משווקים חברתיים מקדמים רעיונות.","קמפיין ״חברים לא נותנים לחברים לנהוג שיכורים״."]])}${def("מושג מפתח",`<mark>משווק</mark> ${E("Marketer")}: אדם שרוצה לקבל תגובה (קשב, קנייה, הצבעה, תרומה) מצד אחר, ה<b>לקוח הפוטנציאלי</b>. אם שני הצדדים רוצים למכור זה לזה, שניהם משווקים.`)}<p>השיווק לא נעשה רק במחלקת השיווק. צריך לנהל את כל <b>נקודות המגע</b> ${E("Touch points")} של הלקוח עם החברה: עיצוב החנות, האריזה, הכשרת העובדים, המשלוחים.</p><p>לכלכלנים, <b>שוק</b> הוא אוסף של קונים ומוכרים. משווקים משתמשים במילה לתיאור <b>קבוצות לקוחות</b>: שוקי צורך, מוצר, דמוגרפיים או גיאוגרפיים. ארבעת השווקים העיקריים: <b>צרכנים, עסקים, גלובליים ומלכ״רים</b>. באיור 1.1, המוכרים שולחים לשוק מוצרים ותקשורת, ומקבלים כסף ומידע.</p>`,q:"a2"}
 ]},
 {id:"t2",icon:"id",title:"מושגי יסוד בשיווק",blocks:[
  {h:"צרכים, רצונות וביקושים",html:`${def("על מה הנושא",`כדי להבין את השיווק, צריך להכיר את המושגים שעליהם הוא בנוי.<br><b>מה נלמד כאן:</b> צורך · רצון · ביקוש · חמשת סוגי הצרכים`)}${tiles([["sprout","צרכים","Needs: הדרישות הבסיסיות של בני אדם","אוויר, מזון, מים, ביגוד ומחסה, וגם פנאי, השכלה ובידור.","סטודנט צריך לאכול."],["target","רצונות","Wants: צורך שמופנה לאובייקט מסוים","החברה שבה חיים מעצבת את הרצונות. אמריקאי רוצה פיצה, ואדם מאפגניסטן ירצה אורז ובשר טלה.","הסטודנט רוצה דווקא כריך מבית הקפה של דנה."],["cart","ביקושים","Demands: רצון למוצר מסוים, עם יכולת לשלם עליו","רבים רוצים ״מרצדס״, אבל רק מעטים יכולים לקנות. לכן צריך למדוד כמה אנשים רוצים, וגם כמה מוכנים ומסוגלים לקנות.","הסטודנט רוצה את הכריך, ויש לו כסף לקנות אותו."]])}${rem("משווקים <b>לא יוצרים</b> צרכים. הצרכים קיימים תמיד. הם יכולים לקדם את הרעיון שמוצר מסוים מספק צורך, למשל שמרצדס מספקת צורך במעמד, אבל הם לא יצרו את הצורך במעמד.")}<p>ללקוחות יש גם צרכים שהם לא מודעים להם או לא יודעים לבטא. הספר מבחין בין <b>חמישה סוגי צרכים</b>:</p><div class="tw"><table><tr><th>סוג</th><th>דוגמה (קונה רכב)</th></tr><tr><td><b>מוצהר</b></td><td>״אני רוצה רכב לא יקר״</td></tr><tr><td><b>אמיתי</b></td><td>רכב שעלות התפעול שלו נמוכה, לא רק המחיר ההתחלתי</td></tr><tr><td><b>לא מוצהר</b></td><td>מצפה לשירות טוב מהסוכן</td></tr><tr><td><b>הנאה</b></td><td>היה שמח אם תיכלל מערכת ניווט</td></tr><tr><td><b>סודי</b></td><td>רוצה להיראות קונה פיקח בעיני החברים</td></tr></table></div><p>מענה רק לצורך המוצהר עלול לקפח את הלקוח. לכן חברות צריכות לעזור ללקוחות ללמוד מה הם רוצים.</p>`,q:"a3"},
  {h:"שוק מטרה, הצעה, מותג וערוצים",html:`<p>לא כולם אוהבים אותו דבר. לכן משווקים מזהים <b>פלחים</b> של קונים לפי הבדלים דמוגרפיים, פסיכוגרפיים והתנהגותיים, ובוחרים <b>שוקי מטרה</b>. לכל שוק מטרה מפתחים <b>הצעה שיווקית</b>, ו<b>ממצבים</b> אותה בתודעת הקונים כמספקת יתרון מרכזי.</p>${ex(`״פורשה״ פונה לקונים שמחפשים הנאה וריגוש בנהיגה, ורוצים לומר משהו דרך הרכב שלהם.`)}${tiles([["check","הצעת ערך","Value proposition: מערך התועלות שהחברה מציעה כדי לספק צרכים","הצעת הערך היא לא מוחשית. היא הופכת לממשית דרך ה<b>הצעה</b> (Offering): צירוף של מוצרים, שירותים, מידע וחוויות.","דנה מבטיחה ״מקום שקט ללמוד, עם קפה טוב״. ההצעה הממשית: קפה, שקעים ושקט."],["target","מותג","Brand: הצעה ממקור ידוע","שם מותג נושא איתו אסוציאציות שיוצרות תדמית. כל חברה רוצה אסוציאציות חזקות, חיוביות וייחודיות.","״אפל״ מעוררת אסוציאציות של יצירתיות, חדשנות וקלות שימוש."]])}<p>כדי להגיע לשוק המטרה משתמשים ב<b>שלושה סוגי ערוצים</b>:</p><div class="tw"><table><tr><th>ערוץ</th><th>מה הוא עושה</th><th>דוגמאות</th></tr><tr><td><b>ערוצי תקשורת</b></td><td>מעבירים ומקבלים מסרים מהקהל</td><td>טלוויזיה, אינטרנט, דוא״ל, בלוגים</td></tr><tr><td><b>ערוצי הפצה</b></td><td>מציגים, מוכרים ומספקים את המוצר</td><td>ישירים (אינטרנט, טלפון) או עקיפים (סיטונאים, קמעונאים)</td></tr><tr><td><b>ערוצי שירות</b></td><td>עוזרים לבצע את העסקה</td><td>מחסנים, חברות תובלה, בנקים, ביטוח</td></tr></table></div>`,q:"a4"},
  {h:"סוגי מדיה, ערך ושביעות רצון",html:`${tiles([["chart","מדיה בתשלום","Paid media: משלמים כדי להציג את המודעה","פרסומות בטלוויזיה ובעיתונים, חיפוש ממומן וחסויות.","דנה משלמת על מודעה ממומנת באינסטגרם."],["building","מדיה בבעלות","Owned media: ערוצים שהמשווק הוא הבעלים שלהם","חוברת של החברה, אתר, בלוג, עמוד פייסבוק או חשבון טוויטר.","עמוד האינסטגרם של בית הקפה."],["people","מדיה שיתופית","Earned media: אחרים מספרים על המותג מרצונם","פה לאוזן, ״באזז״ ופרסום ויראלי. היא אפשרה לחברות מסוימות לחסוך בהוצאות על מדיה.","סטודנטית מעלה סטורי ״המקום הכי טוב ללמוד בו״."]])}<p><b>רשמים</b> ${E("Impressions")} נוצרים כשצרכנים נחשפים לתקשורת, ומודדים את רוחב ההגעה. אבל הם לא אומרים מה קרה אחרי. <b>מעורבות</b> ${E("Engagement")} מודדת את הקשב והחיבור של הלקוח, למשל לייקים, תגובות ושיתופים.</p>${def("מושג מפתח",`<mark>ערך</mark>: סך התועלות והעלויות, המוחשיות והלא מוחשיות, שהקונה תופס. הוא צירוף של איכות, שירות ומחיר, שנקרא <b>משולש הערך ללקוח</b>. הערך הנתפס עולה עם האיכות והשירות, ויורד עם המחיר.`)}${def("מושג מפתח",`<mark>שביעות רצון</mark> ${E("Satisfaction")}: השיפוט של ביצועי המוצר ביחס לציפיות. מתחת לציפיות: הלקוח מאוכזב. כמו הציפיות: שבע רצון. מעל הציפיות: מרוצה מאוד.`)}`,q:"a5"},
  {h:"שרשרת אספקה, תחרות וסביבה",html:`${tiles([["link","שרשרת אספקה","ערוץ ארוך מחומרי הגלם ועד המוצר אצל הקונה","כל עסק בשרשרת לוכד רק חלק מהערך. כשחברה רוכשת מתחרים, או מתרחבת במעלה או במורד הערוץ, היא רוצה ללכוד חלק גדול יותר.","שרשרת הקפה: חקלאים, סיטונאים, מעבדים, רשתות, ובסוף בית הקפה של דנה."],["split","תחרות","כל ההצעות היריבות והתחליפים, הקיימים והאפשריים","מי שמסתכל רק על המתחרים בענף שלו מגדיר את התחרות צר מדי. תחליפים יכולים להזיק יותר.","יצרן פלדה מתחרה לא רק ביצרני פלדה, אלא גם באלומיניום ובפלסטיק שמחליפים פלדה ברכב."]])}${def("מושג מפתח",`<mark>סביבת השיווק</mark> כוללת שתי שכבות. <b>סביבת המטלה</b> ${E("Task environment")}: השחקנים שמעורבים בייצור, בהפצה ובקידום של ההצעה, כלומר העסק, הספקים, המפיצים, הסוכנים ולקוחות המטרה. <b>הסביבה הרחבה</b> ${E("Broad environment")}: שישה מרכיבים, דמוגרפי, כלכלי, חברתי־תרבותי, טבעי, טכנולוגי ופוליטי־משפטי.`)}${ex(`סביבת המטלה של דנה: ספק פולי הקפה, הקונדיטוריה ששולחת מאפים, והסטודנטים. הסביבה הרחבה: עליית מחירים במשק (כלכלית) או אפליקציות משלוחים חדשות (טכנולוגית).`)}`,q:"a6"}
 ]},
 {id:"t3",icon:"cycle",title:"מציאות השיווק החדשה",blocks:[
  {h:"שלושת כוחות השינוי",html:`${def("על מה הנושא",`השוק היום שונה מאוד ממה שהיה לפני עשור. הספר מתמקד בשלושה כוחות שמשנים אותו, וביכולות החדשות שהם נותנים לצרכנים ולעסקים.<br><b>מה נלמד כאן:</b> טכנולוגיה · גלובליזציה · אחריות חברתית · שיווק 3.0 · שינויים בשוק`)}${tiles([["phone","טכנולוגיה","מסחר מקוון, אינטרנט נייד וכמות עצומה של מידע","״ידע הוא כוח״ מפנה מקום ל״שיתוף מידע הוא כוח״. הטכנולוגיה משנה גם פעילויות מסורתיות.","חברת תרופות נותנת לאנשי המכירות טאבלטים, והם מזינים נתונים בזמן אמת."],["building","גלובליזציה","קל יותר לנסוע, לקנות ולמכור בכל מקום","השווקים המתעוררים צפויים לתרום חלק גדול מהצמיחה. מדינות נעשות רב־תרבותיות, וחברות לוקחות לקח משוק אחד ומיישמות אותו באחר.","GE פיתחה בסין סורק אולטרסאונד נייד וזול, ואחר כך מכרה אותו בעולם המפותח."],["hand","אחריות חברתית","עוני, זיהום, שינוי אקלים ועוד דורשים תשומת לב","השיווק משפיע על החברה כולה, ולכן המשווקים צריכים לקחת בחשבון את ההקשר האתי, הסביבתי, המשפטי והחברתי.","חברה מצמצמת את טביעת הרגל האקולוגית שלה כחלק מהמשימה של המותג."]])}${def("מושג מפתח",`<mark>שיווק 3.0</mark> (קוטלר ועמיתיו): גל חשיבה שלישי, מונע ערכים. הלקוחות רוצים שיתייחסו אליהם כבני אדם, ולכן שיווק מוצלח כולל מרכיב אנושי או רגשי. שלוש מגמות: יותר השתתפות של צרכנים ושיווק שיתופי, גלובליזציה, ועליית החברה היצירתית. לפי המחברים, עתיד השיווק הוא ״מצרכן לצרכן״.`)}`,q:"a7"},
  {h:"שינויים דרמטיים בשוק",html:`<p>שלושת הכוחות יצרו <b>יכולות חדשות</b> לשני הצדדים (טבלה 1.1):</p><div class="tw"><table><tr><th>צרכנים יכולים...</th><th>עסקים יכולים...</th></tr><tr><td>להשתמש באינטרנט למידע ולקנייה</td><td>להשתמש באינטרנט כערוץ למידע ולמכירה, גם בהתאמה אישית</td></tr><tr><td>לחפש ולקנות תוך כדי תנועה</td><td>לאסוף מידע עשיר על שווקים, לקוחות ומתחרים</td></tr><tr><td>לשתף דעות ברשתות חברתיות</td><td>להגיע מהר ללקוחות ברשתות ובנייד</td></tr><tr><td>לנהל אינטראקציה פעילה עם עסקים</td><td>לשפר רכש, גיוס, הדרכה ותקשורת</td></tr><tr><td>לדחות שיווק שנראה להם לא הולם</td><td>לשפר את יחסי העלות־תועלת</td></tr></table></div>${tiles([["x","ביטול תיווך","Disintermediation: עקיפת המתווכים המסורתיים","חלוצות הדוט.קום, כמו ״אמזון״, הגיעו ללקוחות בלי המתווכים הרגילים.","חנות ספרים מקוונת מוכרת ישירות ללקוח, בלי חנות פיזית."],["cycle","החזרת התיווך","Reintermediation: חברות מסורתיות מוסיפות שירות מקוון","כך נוצרות חברות ״קירות וקליקים״, עם חנות פיזית וגם אתר.","רשת חנויות פותחת אתר עם איסוף מהסניף."]])}<p>גם התחרות גדלה: מותגים מקומיים מול זרים, <b>מותגים פרטיים</b> של רשתות, מותגי־על, וגם <b>ביטול פיקוח</b> ו<b>הפרטה</b>. בנוסף, משווקים נדרשים יותר להצדיק את ההשקעה, ולכן מודדים ערך מותג, ערך טווח חיי לקוח ותשואה על השקעה בשיווק.</p>`,q:"a8"}
 ]},
 {id:"t4",icon:"target",title:"מכוונות החברה כלפי השוק",blocks:[
  {h:"חמש התפיסות",html:`${def("על מה הנושא",`איזו ״תורה״ צריכה לכוון את העסק? הספר סוקר חמש תפיסות, מהוותיקה עד העדכנית.<br><b>מה נלמד כאן:</b> ייצור · מוצר · מכירה · שיווק · שיווק הוליסטי`)}<div class="tw"><table><tr><th>תפיסה</th><th>ההנחה</th><th>המיקוד</th></tr><tr><td><b>ייצור</b></td><td>צרכנים רוצים מוצרים זמינים וזולים</td><td>יעילות ייצור, עלות נמוכה, הפצה המונית</td></tr><tr><td><b>מוצר</b></td><td>צרכנים רוצים את האיכות והחדשנות הגבוהות ביותר</td><td>שיפור המוצר</td></tr><tr><td><b>מכירה</b></td><td>בלי דחיפה, אנשים לא יקנו מספיק</td><td>מאמץ מכירה אגרסיבי</td></tr><tr><td><b>שיווק</b></td><td>המפתח הוא ערך עדיף ללקוח, טוב יותר מהמתחרים</td><td>״חישה ותגובה״: הלקוח במרכז</td></tr><tr><td><b>שיווק הוליסטי</b></td><td>״הכול חשוב״, וכל הפעילויות קשורות זו בזו</td><td>ראייה רחבה ומשולבת</td></tr></table></div>${tiles([["gear","תפיסת הייצור","הגיונית במדינות מתפתחות, או כשרוצים להרחיב שוק","Lenovo ניצלה עובדים רבים וזולים בסין כדי לשלוט בשוק.","דנה מתמקדת בלהגיש קפה זול ומהר."],["bulb","מלכודת העכברים המשופרת","הטעות של תפיסת המוצר: האמונה שמוצר טוב יותר ימכור את עצמו","מנהלים ״מתאהבים״ במוצר. בלי תמחור, הפצה, פרסום ומכירה נכונים, מוצר חדש לא בהכרח יצליח.","סטארט־אפ עם מוצר מעולה שאף אחד לא שמע עליו."],["x","תפיסת המכירה","נפוצה בסחורות ״חסרות ביקוש״ כמו ביטוח, ובעודף ייצור","מוכרים את מה שמייצרים, ולא מייצרים את מה שהשוק רוצה. המכירה האגרסיבית מסוכנת, כי היא מניחה שהלקוח לא יתלונן ואפילו יקנה שוב.","סוכן ביטוח שמתקשר שוב ושוב עד שמסכימים."]])}${rem("לפי תיאודור לוויט: המכירה מתמקדת בצרכים של <b>המוכר</b>, להפוך מוצר לכסף. השיווק מתמקד בצרכים של <b>הקונה</b>, לספק אותם דרך המוצר וכל מה שסביבו. במילים אחרות: לא למצוא לקוחות למוצרים שלך, אלא מוצרים ללקוחות שלך.")}`,q:"a9"},
  {h:"ארבעת מרכיבי השיווק ההוליסטי",html:`${def("מושג מפתח",`<mark>תפיסת השיווק ההוליסטי</mark> ${E("Holistic marketing")}: פיתוח ויישום של תוכניות ופעילויות שיווק בראייה רחבה, שמביאה בחשבון את הקשרים ואת התלות ביניהן. יש לה ארבעה מרכיבים (איור 1.2).`)}${tiles([["people","שיווק יחסים","Relationship marketing: יחסים הדדיים ארוכי טווח עם גורמי מפתח","ארבע קבוצות: לקוחות, עובדים, שותפי שיווק (ספקים, מפיצים) והקהילה הפיננסית. התוצאה היא <b>רשת שיווק</b>: החברה וכל בעלי העניין שתומכים בה. גם מתאימים הצעות ללקוחות יחידים, לפי ערך טווח החיים שלהם.","דנה מכירה את הלקוחות הקבועים בשמם, ושומרת על קשר טוב עם הספקים."],["copies","שיווק משולב","Integrated marketing: פעילויות שתוכננו יחד, כך ש״השלם גדול מסך חלקיו״","כל פעילות מתוכננת מתוך מחשבה על כל האחרות, וכל ערוצי התקשורת מעבירים מסר אחיד ומשלימים זה את זה.","בית חולים שקונה מכשיר MRI מצפה גם להתקנה, תחזוקה והדרכה."],["building","שיווק פנימי","Internal marketing: גיוס, הדרכה והנעה של עובדים שרוצים לשרת היטב","פעילות השיווק בתוך החברה יכולה להיות חשובה לא פחות, ואולי יותר, מהשיווק החוצה.","דנה מדריכה את הבריסטות איך לקבל כל לקוח בחיוך."],["chart","שיווק ביצועים","Performance marketing: הבנת התשואות הכספיות והלא כספיות של השיווק","לא רק מכירות, אלא גם נתח שוק, שביעות רצון, והשפעות משפטיות, אתיות, חברתיות וסביבתיות.","Ben & Jerry's מדדה ״שורה תחתונה כפולה״, ואחר כך משולשת: רווח, סביבה וחברה."]])}`,q:"a10"}
 ]},
 {id:"t5",icon:"pie",title:"תמהיל השיווק ומטלות הניהול",blocks:[
  {h:"ארבעת ה־P, הישנים והחדשים",html:`${def("מושג מפתח",`<mark>תמהיל השיווק</mark> ${E("Marketing mix")}: מק׳קארתי מיין את כלי השיווק ל<b>ארבעת ה־P</b>: מוצר (Product), מחיר (Price), מקום, כלומר הפצה (Place), וקידום (Promotion).`)}${tiles([["cart","מוצר","מגוון, איכות, עיצוב, תכונות, שם מותג, אריזה, גדלים, שירותים, אחריות והחזרות","",""],["pie","מחיר","מחירון, הנחות, הוזלות, תקופת תשלום ותנאי אשראי","",""],["link","מקום (הפצה)","ערוצים, טווח, מבחר, מיקומים, מלאי ושינוע","",""],["bulb","קידום","קידום מכירות, פרסום, סגל מכירות, יחסי ציבור ושיווק ישיר","",""]])}<p>בגלל ההיקף והמורכבות של השיווק ההוליסטי, ארבעת ה־P הישנים כבר לא מספיקים. הספר מציע <b>ארבעה P חדשים</b> לניהול השיווק המודרני (טבלה 1.2):</p>${tiles([["people","אנשים","People: העובדים, והצרכנים כבני אדם","משקף את השיווק הפנימי: איכות השיווק טובה כמו האנשים בארגון. וגם: לראות בצרכנים בני אדם, לא רק קונים.","דנה בוחרת עובדים שאוהבים לדבר עם סטודנטים."],["gear","תהליכים","Processes: היצירתיות, המשמעת והמבנה בניהול השיווק","לוודא שהרעיונות השיווקיים המתקדמים נמצאים בכל מה שעושים, כולל יחסים ארוכי טווח ותובנות מעמיקות.","בית הקפה בודק כל חודש מה הלקוחות אהבו ומה לא."],["copies","תוכניות","Programs: כל הפעילויות שפונות לצרכן","כולל ארבעת ה־P הישנים ופעילויות נוספות, מקוונות ולא מקוונות, שמשולבות כך שהשלם גדול מסך חלקיו.","מבצע ״כרטיסיית קפה״ שמשולב עם פוסטים באינסטגרם ושלט בכניסה."],["chart","ביצועים","Performance: מדדים לתוצאות, כספיות ולא כספיות","רווחיות, ערך מותג וערך לקוח, וגם השלכות מעבר לעסק: אחריות חברתית, משפט, אתיקה וקהילה.","דנה בודקת גם רווח, וגם כמה כוסות רב־פעמיות לקוחות מביאים."]])}`,q:"a11"},
  {h:"מטלות ניהול השיווק",html:`<p>איור 1.4 מסכם את מציאות השיווק החדשה: <b>שלושה כוחות</b> (טכנולוגיה, גלובליזציה, אחריות חברתית), <b>שתי תוצאות</b> (יכולות חדשות לצרכנים ולעסקים), ו<b>ארבעת עמודי התווך</b> של השיווק ההוליסטי. מזה נגזרות המטלות של ניהול שיווק מוצלח:</p><div class="tw"><table><tr><th>מטלה</th><th>מה היא כוללת</th></tr><tr><td><b>פיתוח אסטרטגיות ותוכניות</b></td><td>זיהוי הזדמנויות לטווח ארוך, לפי הניסיון ויכולות הליבה</td></tr><tr><td><b>תפיסת תובנות שיווקיות</b></td><td>מעקב אחרי הסביבה, הערכת פוטנציאל השוק וחיזוי ביקוש</td></tr><tr><td><b>התחברות ללקוחות</b></td><td>יצירת ערך לשוקי המטרה, ויחסים רווחיים לטווח ארוך</td></tr><tr><td><b>בניית מותגים חזקים</b></td><td>פילוח, בחירת שוקי מטרה, מיצוב ותכנון צמיחה</td></tr><tr><td><b>יצירת ערך</b></td><td>המוצר בלב התוכנית: איכות, עיצוב, תכונות, אריזה, שירותים ותמחור</td></tr><tr><td><b>אספקת ערך</b></td><td>ערוצים שמביאים את המוצר ללקוח, קמעונאות וסיטונאות</td></tr><tr><td><b>תקשור ערך</b></td><td>תוכנית תקשורת משולבת: פרסום, קידום, יחסי ציבור, דיגיטל, מכירה אישית</td></tr><tr><td><b>ניהול ארגון השיווק</b></td><td>הצלחה לטווח ארוך, הזדמנויות גלובליות, אתיקה ואחריות חברתית</td></tr></table></div>${rem("המטלות האלה הן גם ״מפת הדרכים״ של הקורס: כל אחת מהן היא נושא של פרק בהמשך.")}`,q:"a12"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין חלקי הפרק. נסו לזהות לאיזה מושג שייך כל מקרה.`)}${rem("טיפ: בשאלות על התפיסות, חפשו על מה העסק מסתכל: על הייצור, על המוצר, על המכירה, או על הלקוח.")}`,q:"ax"}

<ul>
<li><b>חשיבות</b>: בלי ביקוש, אין משמעות למימון או לתפעול. כדי שתהיה ״שורה תחתונה״ צריכה להיות ״שורה עליונה״. לכן עסקים ממנים <b>מנהל שיווק ראשי</b> (CMO).</li>
<li><b>שיווק</b>: זיהוי צרכים אנושיים וחברתיים ומתן מענה להם, ״מענה רווחי לצרכים״. דוגמאות: ״גוגל״ ומנוע החיפוש, ״איקאה״ והריהוט הזול להרכבה עצמית.</li>
<li><b>ניהול השיווק</b>: האמנות והמדע של בחירת שוקי מטרה, והשגה, שמירה והצמחה של לקוחות, דרך יצירה, אספקה ותקשור של ערך עדיף.</li>
<li><b>דרוקר</b>: מכירה היא לא החלק החשוב. המטרה היא להכיר את הלקוח כך שהמוצר ימכור את עצמו.</li>
<li><b>מה משווקים</b> (עשר ישויות): סחורות, שירותים, אירועים, חוויות, אנשים, מקומות, נכסים, ארגונים, מידע ורעיונות.</li>
<li><b>משווק</b>: מי שרוצה תגובה מ<b>לקוח פוטנציאלי</b>. השיווק לא רק במחלקת השיווק, אלא בכל <b>נקודות המגע</b>.</li>
<li><b>שוק</b>: למשווקים, קבוצת לקוחות. ארבעה שווקים עיקריים: צרכנים, עסקים, גלובליים ומלכ״רים. באיור 1.1: מוצרים ותקשורת עוברים לשוק, כסף ומידע חוזרים.</li>
</ul>
<h3>2. מושגי יסוד</h3>
<ul>
<li><b>צורך</b> (דרישה בסיסית) ← <b>רצון</b> (צורך שמופנה למוצר מסוים, ומעוצב על ידי החברה שבה חיים) ← <b>ביקוש</b> (רצון עם יכולת לשלם). משווקים לא יוצרים צרכים.</li>
<li><b>חמישה סוגי צרכים</b>: מוצהר, אמיתי, לא מוצהר, הנאה וסודי. מענה רק למוצהר עלול לקפח את הלקוח.</li>
<li><b>פילוח, שוק מטרה ומיצוב</b>: מזהים פלחים לפי הבדלים דמוגרפיים, פסיכוגרפיים והתנהגותיים, בוחרים שוקי מטרה, וממצבים את ההצעה בתודעה.</li>
<li><b>הצעת ערך</b> (תועלות, לא מוחשית) ← <b>הצעה</b> (מוצרים, שירותים, מידע וחוויות) ← <b>מותג</b> (הצעה ממקור ידוע, עם אסוציאציות).</li>
<li><b>שלושה ערוצים</b>: תקשורת (מסרים), הפצה (ישירה או עקיפה), ושירות (מחסנים, תובלה, בנקים).</li>
<li><b>מדיה</b>: בתשלום (פרסומות, חסויות), בבעלות (אתר, עמוד פייסבוק), שיתופית (פה לאוזן, באזז). <b>רשמים</b> מודדים חשיפה. <b>מעורבות</b> מודדת קשב וחיבור.</li>
<li><b>ערך</b>: משולש הערך ללקוח, איכות, שירות ומחיר. עולה עם האיכות והשירות, יורד עם המחיר. <b>שביעות רצון</b>: ביצועים ביחס לציפיות (מאוכזב, שבע רצון, מרוצה מאוד).</li>
<li><b>שרשרת אספקה</b>: מחומר הגלם ועד הקונה. כל עסק לוכד רק חלק מהערך. <b>תחרות</b>: כוללת גם תחליפים, אחרת מגדירים אותה צר מדי.</li>
<li><b>סביבת השיווק</b>: <b>סביבת המטלה</b> (העסק, הספקים, המפיצים, הסוכנים ולקוחות המטרה) ו<b>הסביבה הרחבה</b> (דמוגרפית, כלכלית, חברתית־תרבותית, טבעית, טכנולוגית, פוליטית־משפטית).</li>
</ul>
<h3>3. מציאות השיווק החדשה</h3>
<ul>
<li><b>שלושה כוחות</b>: <b>טכנולוגיה</b> (״שיתוף מידע הוא כוח״), <b>גלובליזציה</b> (שווקים מתעוררים, רב־תרבותיות, למשל הסורק הזול של GE), <b>אחריות חברתית</b>.</li>
<li><b>שיווק 3.0</b>: גל חשיבה מונע ערכים, עם מרכיב אנושי ורגשי. עתיד השיווק הוא ״מצרכן לצרכן״.</li>
<li><b>יכולות חדשות</b> לצרכנים ולעסקים (טבלה 1.1). <b>ביטול תיווך</b> (עקיפת מתווכים, כמו ״אמזון״) ו<b>החזרת תיווך</b> (חברות ״קירות וקליקים״).</li>
<li><b>יותר תחרות</b>: מותגים זרים, מותגים פרטיים, ביטול פיקוח והפרטה. ונדרש להצדיק את השקעת השיווק במדדים.</li>
</ul>
<h3>4. מכוונות החברה כלפי השוק</h3>
<ol>
<li><b>תפיסת הייצור</b>: צרכנים רוצים זמין וזול. יעילות ועלות נמוכה (Lenovo בסין).</li>
<li><b>תפיסת המוצר</b>: צרכנים רוצים את המוצר הטוב ביותר. הסכנה היא <b>״מלכודת העכברים המשופרת״</b>.</li>
<li><b>תפיסת המכירה</b>: בלי דחיפה לא יקנו. נפוצה בסחורות חסרות ביקוש ובעודף ייצור. מכירה אגרסיבית מסוכנת.</li>
<li><b>תפיסת השיווק</b>: הלקוח במרכז, ״חישה ותגובה״. לפי לוויט: מכירה מתמקדת במוכר, שיווק בקונה.</li>
<li><b>תפיסת השיווק ההוליסטי</b>: ״הכול חשוב״. ארבעה מרכיבים:
<ul><li><b>שיווק יחסים</b>: יחסים ארוכי טווח עם לקוחות, עובדים, שותפים וקהילה פיננסית. התוצאה: <b>רשת שיווק</b>.</li>
<li><b>שיווק משולב</b>: פעילויות שהשלם שלהן גדול מסך חלקיהן, ומסר אחיד בכל נקודת מגע.</li>
<li><b>שיווק פנימי</b>: גיוס, הדרכה והנעה של עובדים.</li>
<li><b>שיווק ביצועים</b>: תשואות כספיות ולא כספיות, כמו ה״שורה התחתונה המשולשת״ של Ben & Jerry's.</li></ul></li>
</ol>
<h3>5. תמהיל השיווק ומטלות הניהול</h3>
<ul>
<li><b>ארבעת ה־P</b> (מק׳קארתי): <b>מוצר</b> (מגוון, איכות, עיצוב, מותג, אריזה, אחריות), <b>מחיר</b> (מחירון, הנחות, אשראי), <b>מקום</b> (ערוצים, מיקומים, מלאי, שינוע), <b>קידום</b> (פרסום, קידום מכירות, יחסי ציבור, מכירה אישית, שיווק ישיר).</li>
<li><b>ארבעת ה־P החדשים</b>: <b>אנשים</b> (עובדים, וצרכנים כבני אדם), <b>תהליכים</b>, <b>תוכניות</b> (כל הפעילויות שפונות לצרכן), <b>ביצועים</b> (מדדים כספיים ולא כספיים).</li>
<li><b>מטלות ניהול השיווק</b>: פיתוח אסטרטגיות ותוכניות; תפיסת תובנות; התחברות ללקוחות; בניית מותגים חזקים; יצירת ערך; אספקת ערך; תקשור ערך; וניהול ארגון השיווק לטווח ארוך.</li>
</ul>
<div class="key"><b>השורה התחתונה: מה רוצים ממך</b><br>להגדיר שיווק וניהול שיווק; להבחין בין צורך, רצון וביקוש ובין חמשת סוגי הצרכים; לזהות סוג ערוץ ומדיה; לזהות במקרה איזו מחמש התפיסות פועלת; לזהות את ארבעת מרכיבי השיווק ההוליסטי; ולשייך כלים לארבעת ה־P.</div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
