 {id:"t1",icon:"people",title:"מה משפיע על התנהגות צרכנים",blocks:[
  {h:"מהי התנהגות צרכנים, וגורמים תרבותיים",html:`${def("על מה הנושא",`למה אדם אחד קונה מותג מסוים, ואדם אחר לא? הנושא מציג את שלוש קבוצות הגורמים שמשפיעות על הקנייה: תרבותיים, חברתיים ואישיים.<br><b>מה נלמד כאן:</b> התנהגות צרכנים · תרבות · תרבות משנה · מעמד חברתי`)}${def("מושג מפתח",`<mark>התנהגות צרכנים</mark> ${E("Consumer behavior")}: תחום מחקר שעוסק באופן שבו יחידים, קבוצות וארגונים בוחרים, קונים, משתמשים ומפסיקים להשתמש במוצרים, בשירותים ובחוויות, כדי לספק את הצרכים והרצונות שלהם.`)}${ex("בלומדה נלווה את <b>שירה</b>, סטודנטית שמחפשת מחשב נייד חדש, ואת <b>חברת ״אור״</b>, מפעל קטן שקונה חלקים מספקים.")}<p>לפי הספר, ל<b>גורמים התרבותיים</b> יש ההשפעה הרחבה והעמוקה ביותר.</p>${tiles([["building","תרבות","Culture: הגורם הבסיסי ביותר שקובע רצונות והתנהגות","ילד לומד מהמשפחה וממוסדות נוספים ערכי יסוד, כמו הישגיות, יעילות או אינדיבידואליזם. ילד שגדל בארץ אחרת יגדל עם ערכים ומנהגים אחרים.","שירה גדלה בבית שבו ״חוסכים לפני שקונים״, ולכן היא משווה מחירים הרבה לפני קנייה גדולה."],["copies","תרבות משנה","לאומים, דתות, קבוצות אתניות ואזורים גיאוגרפיים","כל תרבות מורכבת מתרבויות משנה קטנות יותר, שנותנות לחברים בהן זהות ספציפית יותר. כשתרבות משנה גדלה ומתעשרת, עסקים בונים לה תוכניות שיווק ייעודיות.","חברת מזון מפתחת קו מוצרים כשרים במיוחד לקהל דתי."],["pyramid","מעמד חברתי","קבוצות היררכיות שחבריהן חולקים ערכים, תחומי עניין והתנהגות","החלוקה הקלאסית בארצות הברית כוללת שבעה מעמדות, מהנמוך התחתון ועד הגבוה העליון. לבני מעמדות שונים יש העדפות שונות למוצרים ולמותגים.","בני מעמדות שונים יעדיפו לרוב רשתות ביגוד שונות."]])}`,q:"c1"},
  {h:"גורמים חברתיים",html:`<p>מעבר לתרבות, גם הסביבה החברתית הקרובה משפיעה: <b>קבוצות התייחסות</b>, <b>משפחה</b>, ו<b>תפקידים ומעמד</b>.</p>${def("מושג מפתח",`<mark>קבוצות התייחסות</mark> ${E("Reference groups")}: כל הקבוצות שמשפיעות על העמדות או על ההתנהגות של אדם, באופן ישיר (פנים אל פנים) או עקיף.`)}<div class="tw"><table><tr><th>סוג קבוצה</th><th>מה זה</th><th>דוגמה</th></tr><tr><td><b>ראשונית</b></td><td>קבוצת חברוּת עם קשר רצוף ולא רשמי</td><td>משפחה, חברים, שכנים, עמיתים</td></tr><tr><td><b>משנית</b></td><td>קבוצת חברוּת רשמית יותר, עם פחות קשר רצוף</td><td>איגוד מקצועי, קהילה דתית</td></tr><tr><td><b>שאיפה</b></td><td>קבוצה שהאדם מקווה להצטרף אליה</td><td>״אנשי הייטק מצליחים״</td></tr><tr><td><b>מנותקת</b></td><td>קבוצה שהאדם דוחה ורוצה להתרחק ממנה</td><td>סגנון שהאדם לא רוצה שיזהו אותו איתו</td></tr></table></div>${tiles([["bulb","מנהיג דעה","Opinion leader: נותן עצות ומידע לא רשמי על מוצר או קטגוריה","משווקים מנסים לזהות אותו לפי מאפיינים דמוגרפיים ופסיכוגרפיים, ולהגיע אליו דרך ערוצי התקשורת שלו.","החבר של שירה ״שמבין במחשבים״, שכולם שואלים אותו איזה מחשב לקנות."],["people","משפחה","קבוצת ההתייחסות הראשונית המשפיעה ביותר","משפחת המוצא (הורים ואחים) מעצבת עמדות כלפי דת, פוליטיקה וכסף. משפחת ההקמה (בן או בת זוג וילדים) משפיעה ישירות על הקנייה היומיומית. בקניות יקרות, רוב בני הזוג מחליטים יחד, וגם לילדים ולבני נוער יש השפעה גדלה.","בני זוג מחליטים יחד על רכב חדש, והילדים משפיעים על בחירת יעד החופשה."],["id","תפקיד ומעמד","תפקיד הוא מה שמצפים מאדם לעשות, ולכל תפקיד יש מעמד","אנשים בוחרים מוצרים שמשדרים את התפקיד ואת המעמד שלהם, האמיתי או הרצוי. לכן מוצר יכול להפוך ל״סמל סטטוס״.","מנהלת בכירה בוחרת תיק עור יוקרתי שמתאים לתפקיד שלה."]])}`,q:"c2"},
  {h:"גורמים אישיים",html:`<p>גם מאפיינים של האדם עצמו משפיעים על ההחלטה: גיל ושלב בחיים, עיסוק ומצב כלכלי, אישיות ותפיסת עצמי, וסגנון חיים וערכים.</p>${tiles([["clock","גיל ושלב במחזור החיים","הטעם משתנה עם הגיל, ומחזור חיי המשפחה משפיע על הצריכה","מעבר לגיל, חשוב גם מי גר בבית ובאיזה שלב. משווקים מתייחסים גם לאירועי חיים קריטיים, כמו נישואים, לידה, מעבר דירה או פרישה, שמעוררים צרכים חדשים.","זוג שנולד לו תינוק מתחיל פתאום לחפש רכב גדול ועגלה."],["chart","עיסוק ומצב כלכלי","המקצוע וההכנסה משפיעים על מה שקונים","עסקים מזהים קבוצות עיסוק עם עניין גבוה במוצר שלהם, ולפעמים מתאימים להן מוצר. מצב כלכלי כולל הכנסה פנויה, חסכונות, חובות ועמדות כלפי חיסכון והוצאה.","חברת תוכנה מפתחת גרסה מיוחדת לעורכי דין וגרסה אחרת לרופאים."],["target","אישיות מותג","Brand personality: תכונות אנושיות שאפשר לייחס למותג","החוקרת ג׳ניפר אקר זיהתה חמש תכונות: כנות, ריגוש, כשירות, תחכום וחספוס. צרכנים נוטים לבחור מותגים שהאישיות שלהם מתאימה לשלהם.","מותג רכב שטח ״מחוספס״ מושך מי שרואה את עצמו הרפתקן."],["id","תפיסת עצמי","בפועל, אידיאלית, או בעיני אחרים","ההתאמה בין המותג לאדם יכולה להיות לפי איך שהוא רואה את עצמו, איך שהוא רוצה לראות את עצמו, או איך שהוא חושב שאחרים רואים אותו. במוצרים שצורכים בפומבי, ההשפעה חזקה יותר.","שירה קונה מחשב שמתאים ל״סטודנטית מקצועית״ שהיא רוצה להיות."],["sprout","סגנון חיים","Lifestyle: דפוס החיים של אדם, כפי שהוא מתבטא בפעילויות, בתחומי עניין ובדעות","אנשים מאותו מעמד ועיסוק יכולים לחיות בסגנון שונה לגמרי. סגנון החיים מושפע גם ממגבלות של כסף ושל זמן.","יצרן מחשבים מגלה שרוב הקונים שלו ״הישגיים״, ומכוון את המותג לסגנון חיים כזה."],["check","ערכי יסוד","Core values: האמונות העמוקות שמנחות בחירות לטווח ארוך","הם עמוקים יותר מעמדות ומהתנהגות. משווקים מאמינים שאם פונים ל״עצמי הפנימי״, משפיעים גם על התנהגות הקנייה.","מותג שמדגיש קיימות פונה לצרכנים שאיכות הסביבה היא ערך חשוב בשבילם."]])}`,q:"c3"}

 {id:"t2",icon:"brain",title:"תהליכים פסיכולוגיים",blocks:[
  {h:"מודל הגירוי־תגובה והנעה",html:`${def("על מה הנושא",`מה קורה בראש של הצרכן בין הרגע שהוא נחשף לפרסומת לבין הרגע שהוא קונה? הספר מציג ארבעה תהליכים פסיכולוגיים: הנעה, תפיסה, למידה וזיכרון.<br><b>מה נלמד כאן:</b> מודל הגירוי־תגובה · הנעה · פרויד · מאסלו · הרצברג`)}<p>לפי <mark>מודל הגירוי־תגובה</mark> (איור 5.1), <b>גירויים שיווקיים</b> (מוצר, מחיר, הפצה, תקשורת) ו<b>גירויים סביבתיים</b> (כלכליים, טכנולוגיים, פוליטיים, תרבותיים) נכנסים לתודעת הצרכן. שם הם פוגשים את הפסיכולוגיה שלו ואת המאפיינים שלו, והתוצאה היא תהליך החלטה והחלטת קנייה. התפקיד של המשווק הוא להבין מה קורה ״בתוך הקופסה״.</p>${def("מושג מפתח",`<mark>מניע</mark> ${E("Motive")}: צורך שהתעורר בעוצמה מספיקה כדי לגרום לנו לפעול. צרכים יכולים להיות <b>ביוגניים</b> (רעב, צמא) או <b>פסיכוגניים</b> (הכרה, הערכה, שייכות). להנעה יש כיוון (לאיזה יעד) ועצימות (כמה מתאמצים).`)}${tiles([["brain","פרויד","הכוחות שמעצבים התנהגות הם ברובם לא מודעים","לכן אדם מגיב לא רק לתכונות המוצהרות של מותג, אלא גם לאותות פחות מודעים, כמו צורה, צבע, משקל ושם. טכניקת ה<b>סילום</b> (Laddering) עוקבת אחרי המניעים, מהמעשיים ועד הרגשיים.","קונה רכב אומר ״הוא חסכוני בדלק״, אבל בסילום מתגלה שהוא רוצה להרגיש אחראי ובוגר."],["pyramid","מאסלו","הצרכים מסודרים בהיררכיה, מהדחוף ביותר לפחות דחוף","פיזיולוגיים, ביטחון, חברתיים, הערכה ומימוש עצמי. אדם מנסה לספק קודם את הצרכים החשובים ביותר, ורק אחר כך את הבאים.","מי שבקושי מסתדר עם שכר דירה לא יחשוב עכשיו על קורס צילום להעשרה."],["scales","הרצברג","מבחין בין גורמים שאינם משביעי רצון לבין גורמים משביעי רצון","היעדר של גורם מתסכל לא מספיק כדי שאדם יקנה. צריך גם גורם משביע רצון אמיתי. לכן צריך להימנע מגורמים מתסכלים, וגם לספק גורמים מניעים.","מחשב בלי תעודת אחריות מתסכל, אבל אחריות לבד לא תגרום לשירה לקנות. קלות השימוש היא מה שימשוך אותה."]])}`,q:"c4"},
  {h:"תפיסה",html:`${def("מושג מפתח",`<mark>תפיסה</mark> ${E("Perception")}: התהליך שבו אנחנו בוחרים, מארגנים ומפרשים מידע כדי ליצור תמונת עולם עם משמעות. בשיווק, התפיסה חשובה יותר מהמציאות, כי היא זו שמשפיעה על ההתנהגות.`)}<p><b>שיווק חישתי</b> הוא שיווק שמפעיל את החושים, ומשפיע על התפיסה, השיפוט וההתנהגות. אפשר להשתמש בו כדי לעצב תפיסה של איכויות מופשטות, כמו אישיות המותג, או של תכונות ספציפיות, כמו צבע או טעם.</p><p>אנשים שונים תופסים אותו דבר בצורה שונה בגלל שלושה תהליכים:</p>${tiles([["target","קשב בררני","Selective attention: מסננים החוצה את רוב הגירויים","שמים לב בעיקר לגירויים שקשורים לצורך קיים, לגירויים שמצפים להם, ולגירויים חריגים בגודלם. לכן משווקים מתאמצים מאוד למשוך תשומת לב.","מאז ששירה מחפשת מחשב, היא פתאום שמה לב לכל פרסומת למחשבים."],["cycle","סילוף בררני","Selective distortion: מפרשים מידע כך שיתאים למה שכבר חושבים","זה עוזר למותגים חזקים: מידע ניטרלי או עמום מתפרש לטובתם.","אותו קפה נראה לצרכן טעים יותר כשהוא יודע שזה המותג האהוב עליו."],["lock","זכירה בררנית","Selective retention: זוכרים את היתרונות של מה שאוהבים, ושוכחים את של המתחרים","גם זה יתרון למותגים חזקים. זו גם הסיבה שמשווקים חוזרים על המסר שוב ושוב.","שירה זוכרת את כל היתרונות של המותג שהיא אוהבת, ושוכחת שהמחשב המתחרה קל יותר."]])}`,q:"c5"},
  {h:"למידה, רגשות וזיכרון",html:`${def("מושג מפתח",`<mark>למידה</mark> ${E("Learning")}: שינוי בהתנהגות שנובע מניסיון. לפי תיאוריות הלמידה, היא נוצרת ממשחק בין <b>דחפים</b> (גירוי פנימי חזק שדוחף לפעולה), <b>איתותים</b> (גירויים שקובעים מתי, איפה ואיך מגיבים), תגובות וחיזוקים.`)}${tiles([["copies","הכללה","Generalization: מגיבים לגירוי דומה כמו לגירוי המקורי","חוויה טובה עם מוצר אחד של מותג גורמת להניח שגם מוצרים אחרים שלו טובים.","שירה מרוצה מהמחשב, ולכן מניחה שגם המדפסת של אותה חברה טובה."],["split","הבחנה","Discrimination: לומדים לזהות הבדלים בין גירויים דומים","זו הנטייה ההפוכה להכללה: מתאימים את התגובה לכל גירוי בנפרד.","אחרי שהמדפסת אכזבה, שירה לומדת שהחברה טובה במחשבים, אבל לא במדפסות."]])}<p><b>רגשות:</b> התגובה של צרכנים היא לא רק רציונלית. מותג יכול לגרום להרגיש גאווה או ביטחון, ופרסומת יכולה לעורר שעשוע או פליאה. סיפור מותג רגשי גורם לאנשים לספר עליו הלאה, ולכן עסקים מוסיפים פנייה רגשית לתקשורת שלהם.</p>${def("מושג מפתח",`<mark>מודל רשת אסוציאטיבית של זיכרון</mark>: הזיכרון לטווח ארוך הוא רשת של <b>צמתים</b> (מידע שמור) ו<b>קישורים</b> ביניהם. כשצומת אחד מופעל, ההפעלה מתפשטת לצמתים שקשורים אליו חזק מספיק. ההבדל בין <b>זיכרון לטווח קצר</b> (זמני ומוגבל) לבין <b>זיכרון לטווח ארוך</b> (קבוע יותר וכמעט בלתי מוגבל).`)}${tiles([["brain","אסוציאציות למותג","כל המחשבות, הרגשות, החוויות והדימויים שמחוברים למותג בזיכרון","משווקים בונים ״מפות מנטליות״ שמראות את האסוציאציות העיקריות ואת העוצמה שלהן (איור 5.2).","״אמינה״, ״ותיקה״, ״שירות אישי״: אסוציאציות של חברת ביטוח."],["doc","קידוד","איך ומתי המידע נכנס לזיכרון","ככל שחושבים יותר על משמעות המידע בזמן הקידוד, הקשרים בזיכרון חזקים יותר.","פרסומת שגורמת לחשוב על המשמעות של המוצר תיזכר טוב יותר."],["cycle","אחזור","איך שולפים את המידע מהזיכרון","מידע יכול להיות שמור אבל לא נגיש בלי תזכורת. לכן השיווק בחנות, באריזה ובתצוגה, חשוב כל כך. וכשזוכרים מותג היטב, גם מדברים עליו.","האריזה על המדף מזכירה לשירה פרסומת שראתה לפני שבוע."]])}`,q:"c6"}
 ]},
 {id:"t3",icon:"cycle",title:"תהליך החלטת הקנייה",blocks:[
  {h:"חמשת השלבים, זיהוי בעיה וחיפוש מידע",html:`${def("על מה הנושא",`איך צרכן מגיע להחלטה לקנות? הספר מציג מודל של חמישה שלבים. צרכנים לא תמיד עוברים את כולם, לפעמים מדלגים או חוזרים, אבל המודל מתאים במיוחד לקנייה עם <b>מעורבות גבוהה</b>.<br><b>מה נלמד כאן:</b> חמשת השלבים · חיפוש מידע · קבוצות המותגים`)}<div class="tw"><table><tr><th>שלב</th><th>מה קורה</th></tr><tr><td><b>1. זיהוי בעיה</b></td><td>הקונה מזהה צורך, מגירוי פנימי (רעב) או חיצוני (פרסומת)</td></tr><tr><td><b>2. חיפוש מידע</b></td><td>אוספים מידע על המוצרים והמותגים</td></tr><tr><td><b>3. הערכת חלופות</b></td><td>משווים בין המותגים לפי התכונות</td></tr><tr><td><b>4. החלטת קנייה</b></td><td>בוחרים, אבל גורמים שונים עוד יכולים להתערב</td></tr><tr><td><b>5. התנהגות אחרי הקנייה</b></td><td>שביעות רצון, שימוש, והיפטרות מהמוצר</td></tr></table></div><p><b>חיפוש מידע</b> יכול להיות ברמה מתונה, <b>קשב מוגבר</b> (פתוחים יותר לקלוט מידע), או ברמה גבוהה, <b>חיפוש מידע פעיל</b> (קוראים, שואלים, מחפשים ברשת, מבקרים בחנויות).</p>${tiles([["people","מקורות אישיים","משפחה וחברים","לרוב הם, יחד עם המקורות החווייתיים, המקורות היעילים ביותר.","שירה שואלת את אחיה איזה מחשב יש לו."],["cart","מקורות מסחריים","פרסומות, אתרים, אנשי מכירות, אריזות ותצוגות","מכאן מגיע רוב המידע, והוא בשליטת המשווק.","מוכר בחנות מסביר לשירה על המפרט."],["data","מקורות ציבוריים","תקשורת המונים ורשתות חברתיות","מקור ציבורי עצמאי נחשב לסמכותי.","כתבה עם השוואת מחשבים באתר חדשות."],["hand","מקורות חווייתיים","אחיזה, מישוש ושימוש במוצר","יחד עם המקורות האישיים, הם בדרך כלל היעילים ביותר.","שירה מקלידה על המחשב בחנות כדי לבדוק את המקלדת."]])}<p>המידע מצמצם את המותגים בהדרגה (איור 5.4): <b>הקבוצה הכוללת</b> (כל המותגים הזמינים) ← <b>קבוצת המודעות</b> (מה שהצרכן מכיר) ← <b>קבוצת השיקול</b> (מה שעומד בדרישות הראשונות) ← <b>קבוצת הבחירה</b> (המתמודדים החזקים) ← החלטה. העסק צריך להכניס את המותג שלו לכל הקבוצות האלה.</p>`,q:"c7"},
  {h:"הערכת חלופות",html:`<p>רוב המודלים רואים בצרכן מי שמעריך מוצרים <b>באופן מודע ורציונלי</b>: הוא מנסה לספק צורך, מחפש תועלות מסוימות, ורואה בכל מוצר <b>חבילת תכונות</b>.</p>${tiles([["doc","אמונה","Belief: מחשבה תיאורית שיש לאדם על משהו","למשל, ״המחשב הזה קל״.","שירה מאמינה שמחשב א׳ הוא בעל הזיכרון הגדול ביותר."],["scales","עמדה","Attitude: הערכה יציבה, חיובית או שלילית, עם רגשות ונטייה לפעולה","עמדות חוסכות מאמץ ולכן קשה לשנות אותן. עדיף לעסק להתאים את המוצר לעמדות קיימות מאשר לנסות לשנות אותן.","שירה ״לא סובלת״ מותג מסוים, ולא תשקול אותו גם אם הוא זול."]])}${def("מושג מפתח",`<mark>מודל תוחלת הערך</mark> ${E("Value-expectancy model")}: הצרכן מעריך כל מותג על ידי שקלול האמונות שלו לגבי כל תכונה, לפי החשיבות של התכונה. מכפילים את המשקל של כל תכונה בציון של המותג בה, ומחברים.`)}${ex(`הדוגמה מהספר: גל נותנת משקל של 40% לזיכרון, 30% ליכולת גרפית, 20% לגודל ומשקל ו־10% למחיר. מחשב א׳ קיבל ממנה 8, 9, 6 ו־9. החישוב: 0.4×8 + 0.3×9 + 0.2×6 + 0.1×9 = <b>8.0</b>. המחשב עם הציון הגבוה ביותר הוא הבחירה הצפויה.`)}<p>כשמשווק יודע איך הקונים מעריכים, הוא יכול להשפיע:</p>${tiles([["gear","מיצוב מחדש אמיתי","לשנות את המוצר עצמו","מעצבים מחדש את המחשב.","מוסיפים זיכרון למחשב."],["brain","מיצוב מחדש פסיכולוגי","לשנות את האמונות לגבי המותג","בלי לשנות את המוצר, משנים איך רואים אותו.","פרסומת שמראה שהמחשב קל יותר ממה שחושבים."],["split","מיצוב מחדש תחרותי","לשנות את האמונות לגבי המתחרים","מראים שהמתחרים פחות טובים ממה שנדמה.","השוואה שמראה שהמחשב המתחרה כבד יותר."],["scales","שינוי משקלים או אידיאלים","לשכנע שתכונה מסוימת חשובה יותר, או לשנות את הרמה האידיאלית","מעודדים את הקונה לתת משקל גבוה לתכונה שבה המותג מצטיין.","״במחשב לסטודנטים, הכי חשוב זה חיי סוללה.״"]])}`,q:"c8"},
  {h:"החלטת רכישה והתנהגות אחרי הקנייה",html:`<p>גם אחרי שיש כוונה לקנות, שני גורמים יכולים להפריד בין <b>כוונת הרכישה</b> לבין <b>החלטת הרכישה</b>:</p>${tiles([["people","עמדות של אחרים","כמה האחר שלילי כלפי הבחירה, וכמה הצרכן מוכן להתחשב בו","ככל שעמדת האחר שלילית יותר והוא קרוב יותר לצרכן, הצרכן ישנה את הכוונה שלו יותר.","החבר של שירה אומר ״המחשב הזה נתקע כל הזמן״, והיא מתחילה להסס."],["x","נסיבות בלא צפויות","אירועים שמשנים את כוונת הרכישה","בגלל זה, העדפות ואפילו כוונות לא מנבאות היטב קנייה בפועל.","שירה מאבדת את העבודה, והקנייה נדחית."]])}${def("מושג מפתח",`<mark>סיכון נתפס</mark> ${E("Perceived risk")}: החשש שהקנייה לא תצליח. הוא יכול להיות <b>תפקודי</b> (המוצר לא עונה על הציפיות) או <b>חברתי</b> (המוצר מביך מול אחרים). הסיכון גדל עם הסכום, עם אי־הוודאות לגבי התכונות, ועם חוסר ביטחון עצמי. המשווק צריך לספק מידע ותמיכה שמקטינים אותו.`)}<p><b>אחרי הקנייה</b> הצרכן יכול לחוות <b>דיסוננס</b>: הוא מבחין בחסרונות, או שומע דברים טובים על מותגים אחרים, ומחפש מידע שיתמוך בהחלטה שלו. צרכן מרוצה יקנה שוב וימליץ. צרכן לא מרוצה עלול להחזיר את המוצר, להתלונן בפומבי או להזהיר חברים.</p>${rem("לכן המשווק צריך לעקוב גם אחרי מה שקורה אחרי הקנייה: שביעות רצון, שימוש, קצב צריכה ואיך נפטרים מהמוצר. תקשורת עם הקונה אחרי הקנייה מפחיתה החזרות וביטולים.")}`,q:"c9"}
 ]},
 {id:"t4",icon:"question",title:"החלטות לא רציונליות",blocks:[
  {h:"היוריסטיקות ומסגור",html:`${def("על מה הנושא",`צרכנים לא תמיד מחליטים בצורה שקולה ורציונלית. <b>תיאוריית ההחלטה ההתנהגותית</b> (BDT) מצאה מצבים רבים של בחירה ״לא רציונלית לכאורה״, והובילה לתחום ה<b>כלכלה ההתנהגותית</b>. ההקשר שבו מחליטים משנה מאוד את ההחלטה.<br><b>מה נלמד כאן:</b> היוריסטיקות · מסגור · חשבונאות מנטלית · תורת הערך`)}${def("מושג מפתח",`<mark>היוריסטיקה</mark> ${E("Heuristic")}: קיצור דרך מנטלי או ״כלל אצבע״ שבו משתמשים כשמעריכים כמה סביר שמשהו יקרה.`)}${tiles([["clock","היוריסטיקת זמינות","מעריכים לפי כמה מהר דוגמה עולה לראש","אם דוגמה עולה בקלות רבה מדי, מגזימים בהערכת הסבירות שלה.","אחרי שהמחשב הקודם התקלקל, שירה בטוחה שגם החדש יתקלקל, וקונה אחריות מורחבת."],["copies","היוריסטיקת ייצוגיות","מעריכים לפי כמה משהו דומה לדוגמה מוכרת","זו אחת הסיבות שאריזות של מותגים באותה קטגוריה דומות זו לזו: כדי להיתפס כמייצגות את הקטגוריה.","מותג פרטי של רשת מעצב אריזה שדומה למותג המוביל."],["target","היוריסטיקת עיגון והתאמה","מגבשים רושם ראשוני ואז מתקנים אותו, לפעמים בקושי","לכן לרושם ראשוני חזק יש חשיבות גדולה, במיוחד בשירותים: הוא יוצר עוגן, וכל מה שבא אחריו מתפרש לאורו.","קבלת פנים חמה בבית מלון גורמת לאורחים לסלוח על תקלה קטנה אחר כך."]])}${def("מושג מפתח",`<mark>מסגור החלטות</mark> ${E("Decision framing")}: האופן שבו מוצגות האפשרויות משנה את ההחלטה.`)}${ex(`טלפון ב־200 דולר לא ייראה יקר ליד טלפונים ב־400 דולר, אבל ייראה יקר מאוד ליד טלפונים ב־50 דולר.`)}${tiles([["pie","חשבונאות מנטלית","Mental accounting: מחלקים את הכסף ל״חשבונות״ בראש","כך צרכנים מקודדים, מסווגים ומעריכים את התוצאות הכספיות של הבחירות שלהם.","כסף ״מתנה״ מוציאים בקלות, וכסף ״משכורת״ שומרים."],["scales","תורת הערך","Prospect theory: מסגרים בחירות כרווח או הפסד","צרכנים נרתעים מהפסדים, נותנים משקל יתר להסתברויות נמוכות מאוד, ומעט מדי משקל להסתברויות גבוהות מאוד.","הפסד של 100 ש״ח מכאיב יותר משמשמח רווח של 100 ש״ח."]])}`,q:"c10"}
 ]},
 {id:"t5",icon:"factory",title:"השוק העסקי",blocks:[
  {h:"קנייה מוסדית ומה מיוחד בשוק העסקי",html:`${def("על מה הנושא",`לא כל המשווקים מוכרים לצרכנים פרטיים. רבים מוכרים לארגונים. הנושא מסביר מה זו קנייה מוסדית ובמה השוק העסקי שונה משוק הצרכנים.<br><b>מה נלמד כאן:</b> קנייה מוסדית · שוק עסקי · שוק מוסדי וממשלתי`)}${def("מושג מפתח",`<mark>קנייה מוסדית</mark> ${E("Organizational buying")}: לפי וובסטר ווינד, תהליך קבלת ההחלטות שבו ארגונים רשמיים קובעים שיש צורך לרכוש מוצרים ושירותים, ומזהים, מעריכים ובוחרים בין מותגים וספקים.`)}<p>ה<mark>שוק העסקי</mark> ${E("Business market")} כולל את כל הארגונים שקונים מוצרים ושירותים כדי לייצר מוצרים או שירותים אחרים, שנמכרים, מושכרים או מסופקים לאחרים. לדוגמה, בייצור זוג נעליים: סוחר עורות מוכר למפעל עיבוד, שמוכר ליצרן נעליים, שמוכר לסיטונאי, שמוכר לקמעונאי, שמוכר לצרכן.</p><div class="tw"><table><tr><th>מאפיין (טבלה 5.1)</th><th>מה זה אומר</th></tr><tr><td><b>פחות קונים, וגדולים יותר</b></td><td>הרבה פחות לקוחות, אבל כל אחד קונה הרבה</td></tr><tr><td><b>יחסי ספק־לקוח הדוקים</b></td><td>מצפים מהספק להתאים את ההצעה לכל לקוח</td></tr><tr><td><b>קניינות מקצועית</b></td><td>עובדי רכש מוכשרים, מדיניות רכש, הצעות מחיר וחוזים</td></tr><tr><td><b>יותר גורמים משפיעים</b></td><td>הרבה אנשים מעורבים בהחלטה</td></tr><tr><td><b>פגישות מכירה רבות</b></td><td>מחזור מכירה שנמדד לפעמים בשנים</td></tr><tr><td><b>ביקוש נגזר</b></td><td>הביקוש נובע בסוף מהביקוש של צרכני הקצה</td></tr><tr><td><b>ביקוש קשיח</b></td><td>כמעט לא מושפע משינויי מחיר בטווח הקצר</td></tr><tr><td><b>ביקוש תנודתי</b></td><td>שינוי קטן אצל הצרכנים יוצר שינוי גדול בביקוש לציוד</td></tr><tr><td><b>ריכוז גיאוגרפי</b></td><td>הקונים מרוכזים באזורים מסוימים</td></tr><tr><td><b>רכש ישיר</b></td><td>קונים ישירות מהיצרן, במיוחד פריטים מורכבים או יקרים</td></tr></table></div>${tiles([["building","שוק מוסדי","Institutional market: בתי ספר, בתי חולים ומוסדות שמספקים שירות לאנשים שבטיפולם","לרוב יש להם תקציב נמוך ולקוחות ״שבויים״. המטרה היא לא רווח, אבל גם לא רק לחסוך: צריך איכות מינימלית במחיר נמוך.","בית חולים בוחר ספק מזון שעומד ברמת איכות מינימלית, אבל זול."],["pyramid","שוק ממשלתי","גופים ממשלתיים קונים הרבה מאוד מוצרים ושירותים","לרוב דורשים מכרזים ובוחרים בהצעה הזולה, אבל לפעמים מתחשבים באיכות או במוניטין. בפרויקטים מורכבים ומסוכנים, קונים לפי חוזה שנקבע במשא ומתן.","משרד ממשלתי מפרסם מכרז לאספקת מחשבים."]])}`,q:"c11"},
  {h:"מצבי קנייה עסקיים",html:`<p>מספר ההחלטות שהקונה העסקי צריך לקבל תלוי במורכבות הבעיה, בכמה הקנייה חדשה, במספר המעורבים ובזמן. יש שלושה מצבי קנייה עיקריים:</p>${tiles([["cycle","קנייה חוזרת פשוטה","Straight rebuy: הזמנה שגרתית מספק ברשימת הספקים המורשים","הספקים הקיימים שומרים על איכות ומציעים הזמנה אוטומטית. ספקים מבחוץ מנסים להציע משהו חדש, להתחיל בהזמנה קטנה ולגדול.","חברת ״אור״ מזמינה נייר למשרד מאותו ספק כל חודש."],["gear","קנייה חוזרת בשינויים","Modified rebuy: רוצים לשנות מפרט, מחיר, אספקה או תנאים","יותר משתתפים מעורבים. הספקים הקיימים חוששים לאבד את הלקוח, וספקים מבחוץ רואים הזדמנות.","״אור״ רוצה את אותם חלקים, אבל באספקה מהירה יותר ובמחיר נמוך יותר."],["bulb","מטלה חדשה","New task: קונים מוצר או שירות בפעם הראשונה","ככל שהעלות והסיכון גדולים יותר, יש יותר משתתפים, יותר מידע, וההחלטה לוקחת יותר זמן. זה המצב עם הכי הרבה החלטות.","״אור״ קונה בפעם הראשונה מערכת אבטחה למפעל."]])}<p>עם הזמן, מטלה חדשה הופכת לקנייה חוזרת שגרתית. הקנייה עוברת שלבים: מודעות, עניין, הערכה, ניסוי ואימוץ. תקשורת המונים חשובה בשלב המודעות, אנשי מכירות בשלב העניין, ומקורות טכניים בשלב ההערכה.</p>${def("מושג מפתח",`<mark>קניית מערכות</mark> ${E("Systems buying")}: הקונה מעדיף לקנות פתרון שלם מספק אחד. בגרסה של <b>קבלנות מערכות</b>, ספק אחד מספק את כל צורכי התחזוקה, התיקון והתפעול (MRO). זה חוסך לקונה עלויות רכש ומלאי, ונותן לספק ביקוש קבוע.`)}`,q:"c12"}
 ]},
 {id:"t6",icon:"people",title:"מרכז הקניות ותהליך הקנייה העסקי",blocks:[
  {h:"מרכז הקניות",html:`${def("מושג מפתח",`<mark>מרכז הקניות</mark> ${E("Buying center")}: לפי וובסטר ווינד, כל האנשים והקבוצות שמשתתפים בהחלטת הרכש, חולקים מטרות משותפות, וחולקים גם את הסיכונים של ההחלטה.`)}<div class="tw"><table><tr><th>תפקיד</th><th>מה הוא עושה</th></tr><tr><td><b>יוזמים</b></td><td>מבקשים שמשהו ייקנה</td></tr><tr><td><b>משתמשים</b></td><td>ישתמשו במוצר. לעתים קרובות הם גם היוזמים ועוזרים להגדיר דרישות</td></tr><tr><td><b>משפיעים</b></td><td>עוזרים להגדיר מפרט ומספקים מידע להערכת חלופות</td></tr><tr><td><b>מחליטים</b></td><td>מחליטים על הדרישות או על הספקים</td></tr><tr><td><b>מאשרים</b></td><td>מאשרים את מה שהמחליטים או הקניינים מציעים</td></tr><tr><td><b>קניינים</b></td><td>בעלי הסמכות הרשמית לבחור ספק ולנהל משא ומתן</td></tr><tr><td><b>שומרי סף</b></td><td>יכולים למנוע ממוכרים או ממידע להגיע לשאר המשתתפים</td></tr></table></div>${ex(`בחברת ״אור״ מנהל הרכש יכול להיות בבת אחת קניין, משפיע ושומר סף: הוא מחליט אילו אנשי מכירות יגיעו לאחרים, איזה תקציב יש, ומי יזכה.`)}<p>המשתתפים במרכז הקניות שונים זה מזה באינטרסים, בסמכויות ובקריטריונים: מהנדסים רוצים ביצועים, אנשי הייצור רוצים קלות שימוש ואספקה אמינה, אנשי הכספים מתמקדים בעלות. וובסטר מזכיר שבסוף <b>אנשים</b> מחליטים, לא ארגונים, ויש להם מניעים ותפיסות אישיים.</p>${rem("מוכרים קטנים מתרכזים בהגעה למשפיעים העיקריים. מוכרים גדולים משתמשים במכירה רב־שכבתית לעומק, כדי להגיע לכמה שיותר משתתפים.")}`,q:"c13"},
  {h:"שמונת שלבי הקנייה העסקית",html:`<p>לפי <mark>טבלת הקנייה</mark> ${E("Buygrid")} של רובינסון ועמיתיו, תהליך הקנייה העסקית כולל שמונה שלבים. בקנייה חוזרת, חלק מהשלבים מתקצרים או נעקפים.</p><div class="tw"><table><tr><th>שלב</th><th>מטלה חדשה</th><th>קנייה חוזרת בשינויים</th><th>קנייה חוזרת פשוטה</th></tr><tr><td>1. זיהוי בעיה</td><td>כן</td><td>אולי</td><td>לא</td></tr><tr><td>2. תיאור צורך כללי</td><td>כן</td><td>אולי</td><td>לא</td></tr><tr><td>3. מפרט מוצר</td><td>כן</td><td>כן</td><td>כן</td></tr><tr><td>4. חיפוש ספק</td><td>כן</td><td>אולי</td><td>לא</td></tr><tr><td>5. בקשת הצעות</td><td>כן</td><td>אולי</td><td>לא</td></tr><tr><td>6. בחירת ספק</td><td>כן</td><td>אולי</td><td>לא</td></tr><tr><td>7. מפרט שגרת הזמנה</td><td>כן</td><td>אולי</td><td>לא</td></tr><tr><td>8. ביקורת ביצועים</td><td>כן</td><td>כן</td><td>כן</td></tr></table></div>${tiles([["gear","ניתוח ערך מוצר","PVA: בודקים אם אפשר לעצב, לתקנן או לייצר רכיבים בזול, בלי לפגוע בביצועים","זה נעשה בשלב המפרט. ספקים יכולים להשתמש בזה כדי לזכות בלקוח.","צוות הנדסה מגלה שרכיב מסוים מחזיק יותר שנים מהמוצר עצמו, ומחליף אותו בזול."],["link","צמתי מסחר אלקטרוני","e-hubs: אנכיים (לפי ענף) ותפקודיים (לפי פונקציה)","בשלב חיפוש הספק, עסקים משתמשים בשוק האלקטרוני: קטלוגים, אתרי ענף, מכירות פומביות, בריתות קנייה ועוד (טבלה 5.3).","מפעל מחפש ספק פלסטיק באתר שמרכז ספקים מהענף."],["doc","חוזה כולל","Blanket contract: הספק מתחייב לספק לפי הצורך, במחירים קבועים, לאורך תקופה","זה נקרא גם תוכנית רכש נטול מלאי, כי המלאי נשאר אצל הספק. יחסים כאלה מקשים על ספקים חדשים להיכנס.","״אור״ חותמת על חוזה שנתי לברגים, ומקבלת משלוח בכל פעם שצריך."],["cycle","מלאי בניהול הספק","VMI: הספק רואה את רמות המלאי של הלקוח ואחראי לחדש אותו","זה נעשה דרך תוכניות חידוש מתמיד.","הספק רואה שהמלאי של ״אור״ ירד, ושולח משלוח בלי לחכות להזמנה."]])}<p><b>ביקורת ביצועים</b>: הקניין בודק את הספק בשלוש דרכים: שואל את משתמשי הקצה, מדרג לפי ציון משוקלל, או מחשב את העלות של ביצועים גרועים. התוצאה יכולה להיות המשך, שינוי או סיום של הקשר.</p>`,q:"c14"}
 ]},
 {id:"t7",icon:"link",title:"יחסים עם לקוחות עסקיים",blocks:[
  {h:"תיאום אנכי, סיכונים ואופורטוניזם",html:`${def("על מה הנושא",`ספקים ולקוחות עסקיים מחפשים דרכים לנהל את היחסים ביניהם. הנושא עוסק ביתרונות של קשר הדוק, ובסיכונים שלו.<br><b>מה נלמד כאן:</b> תיאום אנכי · שמונה סוגי יחסים · השקעות ספציפיות · אופורטוניזם`)}<p>מחקרים ממליצים על <mark>תיאום אנכי</mark> בין הקונה למוכר, כך שהיחסים יהיו יותר מעסקה בודדת ויצרו ערך לשני הצדדים. בניית <b>אמון</b> היא תנאי בסיסי. היחסים מושפעים מזמינות החלופות, מחשיבות האספקה, ממורכבות האספקה ומהדינמיקה בשוק.</p><div class="tw"><table><tr><th>סוג יחסים</th><th>במה מאופיין</th></tr><tr><td><b>קנייה ומכירה בסיסית</b></td><td>שגרתי, שיתוף פעולה ומידע ברמה מתונה</td></tr><tr><td><b>רק מה שהכרחי</b></td><td>המוכר מסתגל יותר, פחות שיתוף פעולה ומידע</td></tr><tr><td><b>עסקה חוזית</b></td><td>מוגדר בחוזה, אמון ושיתוף פעולה נמוכים</td></tr><tr><td><b>אספקה ללקוח</b></td><td>מסורתי, תחרות ולא שיתוף פעולה</td></tr><tr><td><b>מערכות שיתוף פעולה</b></td><td>מאוחדים תפעולית, בלי מחויבות מבנית</td></tr><tr><td><b>עבודת צוות</b></td><td>אמון ומחויבות הדדיים, יכול להוביל לשותפות אמיתית</td></tr><tr><td><b>סתגלנות הדדית</b></td><td>מסתגלים זה לזה בתחומים מסוימים, בלי בהכרח אמון רב</td></tr><tr><td><b>הלקוח הוא המלך</b></td><td>המוכר מתאים את עצמו ללקוח בלי לצפות לשינוי מצד הלקוח</td></tr></table></div>${tiles([["lock","השקעות ספציפיות","הוצאות שמותאמות לעסק מסוים ולשותפים שלו","למשל הדרכה ייחודית, ציוד או מערכות תפעול. הן עוזרות להגדיל רווחים ולהשיג מיצוב, אבל מגדילות את הסיכון, כי אי אפשר להשתמש בהן במקום אחר.","ספק קונה מכונה שמייצרת רק את החלק המיוחד של ״אור״."],["x","אופורטוניזם","סוג של רמאות או אספקה חסרה ביחס לחוזה","הספק מפר הסכם לטובתו, או מסרב להסתגל לנסיבות. זה מחייב את הלקוח להשקיע בבקרה. ספק עם שם טוב נוטה להימנע מזה, כדי לשמור על המוניטין.","ספק שולח חלקים באיכות נמוכה מהמוסכם, כי הוא יודע שקשה לבדוק."]])}${rem("בבניית יחסים יש מתח בין שמירה על המשמר (פתרונות צפויים) לבין הסתגלות (גמישות מול הלא צפוי). חוזה לבד לא תמיד מספיק, במיוחד כשקשה לגלות אופורטוניזם או לצפות את הנסיבות מראש.")}`,q:"c15"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין חלקי הפרק. נסו לזהות לאיזה מושג שייך כל מקרה.`)}${rem("טיפ: בשאלות מקרה, חפשו קודם באיזה חלק של הפרק מדובר: גורם שמשפיע על הצרכן, תהליך פסיכולוגי, שלב בתהליך הקנייה, או קנייה עסקית.")}`,q:"cx"}
 ]}

const Q={"c1": {"t": "t1", "v": [{"q": "לפי הספר, לאיזו קבוצת גורמים יש ההשפעה הרחבה והעמוקה ביותר על הצרכן?", "a": "הגורמים התרבותיים", "w": ["הגורמים החברתיים", "הגורמים האישיים", "הגורמים הפסיכולוגיים"], "e": "הספר קובע שלגורמים התרבותיים (תרבות, תרבות משנה ומעמד) יש ההשפעה המקיפה והעמוקה ביותר."}, {"q": "חברת מזון מפתחת קו מוצרים מיוחד לקהילה דתית שגדלה ומתעשרת. לאיזה גורם היא מתייחסת?", "a": "תרבות משנה", "w": ["מעמד חברתי", "קבוצת שאיפה", "סגנון חיים"], "e": "תרבויות משנה כוללות דתות, לאומים, קבוצות אתניות ואזורים. כשהן גדלות, עסקים בונים להן תוכניות ייעודיות."}]}, "c2": {"t": "t1", "v": [{"q": "סטודנט קונה בגדים כמו של ״אנשי ההייטק המצליחים״, שהוא מקווה להיות אחד מהם. איזו קבוצה זו?", "a": "קבוצת שאיפה", "w": ["קבוצה ראשונית", "קבוצה משנית", "קבוצה מנותקת"], "e": "קבוצת שאיפה היא קבוצה שאדם מקווה להצטרף אליה, גם אם הוא עוד לא חבר בה."}, {"q": "מהי ״משפחת ההקמה״?", "a": "בן או בת הזוג והילדים", "w": ["ההורים והאחים", "כל בני המשפחה המורחבת", "המשפחה שבה האדם גדל"], "e": "משפחת המוצא היא ההורים והאחים. משפחת ההקמה היא בן או בת הזוג והילדים, ולה השפעה ישירה יותר על הקנייה היומיומית."}]}, "c3": {"t": "t1", "v": [{"q": "לפי ג׳ניפר אקר, מה מהבאים הוא אחת מתכונות אישיות המותג?", "a": "תחכום", "w": ["נאמנות", "מחיר", "זמינות"], "e": "אקר זיהתה חמש תכונות: כנות, ריגוש, כשירות, תחכום וחספוס."}, {"q": "אדם בוחר מותג שמתאים לאיך שהוא רוצה לראות את עצמו. על איזו תפיסת עצמי מבוססת הבחירה?", "a": "תפיסת העצמי האידיאלי", "w": ["תפיסת העצמי בפועל", "תפיסת העצמי בעיני אחרים", "תפיסת העצמי המעמדי"], "e": "בפועל: איך אדם רואה את עצמו. אידיאלי: איך הוא רוצה לראות את עצמו. בעיני אחרים: איך הוא חושב שאחרים רואים אותו."}]}, "c4": {"t": "t2", "v": [{"q": "מחשב בלי תעודת אחריות מרתיע קונים, אבל אחריות לבד לא גורמת לקנות. איזו תיאוריה מסבירה את זה?", "a": "התיאוריה הדו־גורמית של הרצברג", "w": ["היררכיית הצרכים של אברהם מאסלו", "התיאוריה של פרויד על מניעים סמויים", "מודל הגירוי־תגובה של התנהגות צרכנים"], "e": "הרצברג מבחין בין גורמים שאינם משביעי רצון (היעדרם מרתיע) לבין גורמים משביעי ר <h3>1. מה משפיע על התנהגות צרכנים</h3>

<ul>
<li><b>היוריסטיקות</b>: <b>זמינות</b> (לפי כמה מהר דוגמה עולה לראש); <b>ייצוגיות</b> (לפי דמיון לדוגמה מוכרת, ולכן אריזות דומות); <b>עיגון והתאמה</b> (רושם ראשוני שמתוקן בקושי).</li>
<li><b>מסגור החלטות</b>: האופן שבו מוצגות האפשרויות משנה את הבחירה. <b>חשבונאות מנטלית</b>: ״חשבונות״ בראש. <b>תורת הערך</b>: רווח והפסד, רתיעה מהפסד, משקל יתר להסתברויות נמוכות מאוד.</li>
</ul>
<h3>5. השוק העסקי</h3>
<p><b>קנייה מוסדית</b> (וובסטר ווינד): התהליך שבו ארגונים קובעים צורך, ומזהים, מעריכים ובוחרים בין מותגים וספקים. <b>השוק העסקי</b>: ארגונים שקונים כדי לייצר ולמכור לאחרים.</p>
<p>במה הוא שונה משוק הצרכנים (טבלה 5.1): פחות קונים וגדולים יותר; יחסים הדוקים; קניינות מקצועית; יותר משפיעים; פגישות מכירה רבות; <b>ביקוש נגזר</b> (מהביקוש לצריכה); <b>ביקוש קשיח</b> (לא מגיב למחיר בטווח הקצר); <b>ביקוש תנודתי</b>; ריכוז גיאוגרפי; רכש ישיר.</p>
<p><b>השוק המוסדי</b> (בתי ספר, בתי חולים): תקציב נמוך ולקוחות ״שבויים״. <b>השוק הממשלתי</b>: מכרזים, לרוב להצעה הזולה, ובפרויקטים מורכבים חוזים במשא ומתן.</p>
<p><b>מצבי קנייה</b>: <b>קנייה חוזרת פשוטה</b> (שגרתית, הכי מעט החלטות); <b>קנייה חוזרת בשינויים</b> (שינוי במפרט, במחיר או בתנאים); <b>מטלה חדשה</b> (בפעם הראשונה, הכי הרבה החלטות). <b>קניית מערכות</b> ו<b>קבלנות מערכות</b>: פתרון שלם מספק אחד.</p>
<h3>6. מרכז הקניות ותהליך הקנייה העסקי</h3>
<p><b>מרכז הקניות</b>: כל מי שמשתתף בהחלטה וחולק את מטרותיה וסיכוניה. שבעה תפקידים: יוזמים, משתמשים, משפיעים, מחליטים, מאשרים, קניינים ושומרי סף. אדם אחד יכול למלא כמה תפקידים. בסוף אנשים מחליטים, לא ארגונים.</p>
<p><b>שמונת שלבי הקנייה</b> (טבלת הקנייה של רובינסון): זיהוי בעיה; תיאור צורך כללי; מפרט מוצר (כולל <b>ניתוח ערך מוצר</b>, PVA); חיפוש ספק (כולל צמתי מסחר אלקטרוני, אנכיים ותפקודיים); בקשת הצעות; בחירת ספק; מפרט שגרת הזמנה (<b>חוזה כולל</b>, <b>מלאי בניהול הספק</b>); ביקורת ביצועים. בקנייה חוזרת פשוטה רק מפרט המוצר וביקורת הביצועים תמיד מתקיימים.</p>
<h3>7. יחסים עם לקוחות עסקיים</h3>
<ul>
<li><b>תיאום אנכי</b>: יחסים שהם יותר מעסקה בודדת ויוצרים ערך לשני הצדדים. אמון הוא תנאי בסיסי.</li>
<li><b>שמונה סוגי יחסים</b>: קנייה ומכירה בסיסית; רק מה שהכרחי; עסקה חוזית; אספקה ללקוח; מערכות שיתוף פעולה; עבודת צוות; סתגלנות הדדית; הלקוח הוא המלך.</li>
<li><b>השקעות ספציפיות</b>: הוצאות שמותאמות לשותף מסוים. הן עוזרות לרווח ולמיצוב, אבל מגדילות סיכון.</li>
<li><b>אופורטוניזם</b>: רמאות או אספקה חסרה ביחס לחוזה. מחייב בקרה. ספק עם שם טוב נוטה להימנע ממנו.</li>
</ul>
<div class="key"><b>השורה התחתונה: מה רוצים ממך</b><br>לזהות במקרה איזה גורם משפיע (תרבותי, חברתי, אישי) ואיזה תהליך פסיכולוגי פועל; לסדר את חמשת שלבי ההחלטה ואת קבוצות המותגים; לחשב ציון לפי מודל תוחלת הערך; לזהות היוריסטיקה או מסגור; להבחין בין שלושת מצבי הקנייה העסקית; ולזהות תפקיד במרכז הקניות.</div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

  const started=T.filter(topicStarted);

  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">

    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">

      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>

    </div>

  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;

  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}{const pb=app.querySelector("#pod");if(pb)pb.onclick=()=>{const bx=app.querySelector("#podbox");bx.hidden=!bx.hidden;const f=bx.querySelector(".podframe");if(!bx.hidden&&!f.firstChild)f.innerHTML=`<iframe src="https://drive.google.com/file/d/${CONFIG.podcast.id}/preview" allow="autoplay" title="פודקאסט" loading="lazy"></iframe>`}}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="ck"></div><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  checkBox(t,bi);
  scrollTo(0,0);
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;

    host.innerHTML=`<div class="q ckq fade"><span class="eyebrow">בדיקת הבנה · שאלה ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="muted cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? עלו לטקסט וקראו שוב לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");
        const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
        fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}${ok?"":" <b>כדאי לחזור לטקסט למעלה ולקרוא שוב.</b>"}</div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.textContent=`לשאלה ${i+2} ←`;nx.style.alignSelf="flex-start";
          nx.onclick=()=>{const y=scrollY;show(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="muted";d.style.margin="0";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע (${r} מתוך ${list.length} נכון).`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };show(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb){pb.click();const bx=document.querySelector("#podbox");if(bx)bx.scrollIntoView({block:"center"})}}else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
