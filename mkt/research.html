  return html.split(/(<svg[\s\S]*?<\/svg>|<[^>]+>)/).map(p=>{if(p.startsWith("<"))return p;

function acrNote(...texts){const s=texts.join(" "),f=new Set();let m;ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s)))f.add(m[1]);

const T=[
 {id:"t1",icon:"data",title:"מערכת המידע השיווקי",blocks:[
  {h:"מערכת מידע שיווקי ורשומות פנימיות",html:`${def("על מה הנושא",`כדי לזהות שינויים בשוק, אנשי השיווק צריכים זרם קבוע של מידע. הנושא מסביר מאיפה המידע מגיע ואיך מארגנים אותו.<br><b>מה נלמד כאן:</b> מערכת מידע שיווקי · רשומות פנימיות · מסדי נתונים וכריית נתונים · ביג דאטה · מודיעין שיווקי`)}${ex("בלומדה נלווה את <b>מיכל</b>, מנהלת השיווק של ״טבעי״, חברה שמייצרת חטיפים בריאים ושוקלת להשיק סדרה חדשה.")}<p>לפי הספר, האחריות לזהות שינויים בשוק מוטלת בעיקר על אנשי השיווק. יש להם שני יתרונות: שיטות מסודרות לאיסוף מידע, והזמן שהם מבלים עם לקוחות ובמעקב אחר מתחרים.</p>${def("מושג מפתח",`<mark>מערכת מידע שיווקי</mark> ${E("Marketing information system, MIS")}: אנשים, ציוד והליכים לאיסוף, מיון, ניתוח, הערכה והפצה של מידע נחוץ, מדויק ובזמן למקבלי ההחלטות. היא נשענת על <b>שלושה מקורות</b>: רשומות פנימיות, מודיעין שיווקי ומחקר שיווקי.`)}<p><b>רשומות פנימיות</b>: דוחות על הזמנות, מכירות, מחירים, עלויות, מלאי, תקבולים ותשלומים. הליבה שלהן היא <b>מחזור הזמנה־עד־תשלום</b> ${E("Order-to-payment cycle")}: הזמנה, חשבונית, חידוש מלאי, משלוח ודרישת תשלום. לקוחות מעדיפים מי שמספק בזמן, ולכן צריך לבצע את השלבים מהר ובדיוק.</p>${rem("״וולמרט״ שומרת נתונים על כל פריט, לכל לקוח, לכל חנות ולכל יום, ומעדכנת כל שעה. ועדיין, הספר מזהיר: צריך לפרש נתוני מכירות בזהירות כדי לא להגיע למסקנות שגויות.")}`,q:"e1"},
  {h:"מסדי נתונים, כריית נתונים וביג דאטה",html:`${tiles([["data","מסד נתוני לקוחות","Customer database: אוסף מסודר ומעודכן של מידע על לקוחות","מידע מקיף על לקוחות קיימים או פוטנציאליים, שנגיש בכל עת. משמש לאיתור לקוחות, למכירות ולניהול יחסי לקוחות. <b>שיווק במסדי נתונים</b> הוא הקמה, תחזוקה וניצול של מסדי נתונים כדי ליצור קשר, לבצע עסקאות ולבנות יחסים.","מיכל שומרת את פרטי הלקוחות שנרשמו למועדון של ״טבעי״ ואת מה שהם קונים."],["building","מחסן נתונים","Data warehouse: המקום שבו מאורגן כל המידע של העסק","אנשי השיווק מחפשים בו ומנתחים אותו, כדי להעלות השערות על הצרכים של לקוחות יחידים ועל התגובות שלהם.",""],["gear","כריית נתונים","Data mining: שיטות לחילוץ תובנות מתוך הרבה נתונים","אנליסטים מחלצים מהנתונים תובנות על התנהגות לקוחות, מגמות ופלחי שוק.","הניתוח מגלה שמי שקונה חטיף חלבון קונה גם בקבוק מים."]])}${def("מושג מפתח",`<mark>ביג דאטה</mark> ${E("Big data")}: מערכי נתונים שאי אפשר לנהל ביעילות בכלים המסורתיים. יותר נתונים הם לא בהכרח נתונים טובים יותר, אלא אם מעבדים ומפרשים אותם נכון. ארבעה מאפיינים (לפי קובילוס): <b>נפח</b>, <b>מהירות</b> (עד זמן אמת), <b>מגוון</b> (מובנה, לא מובנה ומובנה למחצה) ו<b>נפיצות</b> (הרבה מקורות חדשים).`)}<p>דוגמאות מהספר: ״טסקו״ קובעת מחירים ומבצעים לפי הנתונים שהיא אוספת, ומנוע ההמלצות של ״אמזון״ מניב כ־30% מהמכירות.</p><p><b>סימון שוקי מטרה לפי התנהגות</b> ${E("Behavioral targeting")}: מעקב אחרי התנהגות מקוונת כדי לשווק בצורה מדויקת יותר. יש צרכנים שמתנגדים לזה, ויש לקוחות שלא רוצים שהנתונים שלהם יישמרו בכלל.</p>`,q:"e2"},
  {h:"מודיעין שיווקי",html:`${def("מושג מפתח",`<mark>מערכת מודיעין שיווקי</mark> ${E("Marketing intelligence system")}: הליכים ומקורות שמנהלים משתמשים בהם כדי לקבל מידע יומיומי על מה שקורה בסביבה השיווקית.`)}<div class="tw"><table><tr><th></th><th>רשומות פנימיות</th><th>מודיעין שיווקי</th></tr><tr><td><b>מה הן נותנות</b></td><td>נתוני <b>תוצאות</b></td><td>נתונים <b>שוטפים</b> על מה שקורה עכשיו</td></tr><tr><td><b>מאיפה</b></td><td>הזמנות, מכירות, מלאי</td><td>ספרים, עיתונים, שיחות עם לקוחות וספקים, רשתות חברתיות</td></tr></table></div><p><b>שמונה דרכים לשפר את המודיעין</b> (טבלה 3.1):</p><ol><li>להכשיר את צוות המכירות לזהות ולדווח על התפתחויות.</li><li>לגרום למפיצים ולקמעונאים להעביר מידע (הם קרובים יותר ללקוח).</li><li>לשכור מומחים חיצוניים, למשל <b>״קונים מדומים״</b> שחושפים בעיות בשירות.</li><li>רישות פנימי וחיצוני: לקנות מוצרים של מתחרים, ללכת לתערוכות, לקרוא את הדוחות שלהם.</li><li>להקים <b>מועצה מייעצת של לקוחות</b>.</li><li>להשתמש במקורות ממשלתיים, כמו מפקד האוכלוסין.</li><li>לקנות מידע מחברות מחקר (נילסן, NPD).</li><li>לאסוף מודיעין באינטרנט: פורומים, אתרי תלונות, בלוגים ורשתות חברתיות.</li></ol>${ex("מיכל שולחת עובדת לקנות את החטיף החדש של המתחרה ולצלם את התצוגה שלו בסופר. זה רישות חיצוני.")}${rem("<b>עוגיות</b> (Cookies) הן רשומות שמאוחסנות בדפדפן. לפי הספר, צרכנים רבים לא מוחקים אותן, ואף מצפים לפניות ולמבצעים מותאמים אישית.")}`,q:"e3"}
 ]},
 {id:"t2",icon:"flask",title:"המחקר השיווקי ותהליך המחקר",blocks:[
  {h:"מהו מחקר שיווקי",html:`${def("על מה הנושא",`לפעמים לא מספיק המידע השוטף, וצריך מחקר מסודר על שאלה ספציפית. הנושא מגדיר מחקר שיווקי ומציג את ששת השלבים שלו.<br><b>מה נלמד כאן:</b> תובנות שיווקיות · הגדרת המחקר · סוגי מכוני מחקר · ששת השלבים · מחקר גישוש, תיאורי וסיבתי`)}<p>מנהלים מזמינים מחקרים על בעיות ספציפיות: סקר שוק, מבחן העדפת מוצר, תחזית מכירות לפי אזור, או הערכת יעילות הפרסום. התפקיד של החוקר הוא להפיק <b>תובנות</b> שיעזרו למנהל להחליט.</p>${def("מושג מפתח",`<mark>תובנות שיווקיות</mark> ${E("Marketing insights")}: מידע על איך ולמה מתרחשות השפעות מסוימות בשוק, ומה המשמעות שלהן למשווקים. לפי הספר, להשגת תובנות יש חשיבות מכרעת להצלחה.`)}${ex("״פרוקטר אנד גמבל״ חקרה את הרגשות של נשים לגבי שיער, גם בסקרים וגם במדידת גלי מוח (EEG). בעקבות זה שינתה את הנוסחאות ואת האריזות של ״פנטן״, צמצמה את קו המוצר ושיפרה את הפרסום.")}${def("מושג מפתח",`<mark>מחקר שיווקי</mark> ${E("Marketing research")}, לפי איגוד השיווק האמריקני: פונקציה שמקשרת את הצרכן, הלקוח והציבור למשווק דרך מידע. המידע משמש לזיהוי הזדמנויות ובעיות, לתכנון ולהערכה של פעולות שיווקיות, לניטור ביצועים ולשיפור ההבנה של השיווק.`)}<p>מקובל להקצות למחקר <b>1%–2% מהמכירות</b>, ורוב הכסף הולך למכוני מחקר חיצוניים. יש <b>שלושה סוגים</b>:</p><div class="tw"><table><tr><th>סוג</th><th>מה עושה</th></tr><tr><td><b>שירותי מחקר מאוגדים</b></td><td>אוספים מידע צרכני ומסחרי ומוכרים אותו (נילסן)</td></tr><tr><td><b>מחקרי שוק ייעודיים</b></td><td>מתכננים ועורכים מחקר לפי הזמנה ומדווחים למזמין</td></tr><tr><td><b>מומחיות מקצועית</b></td><td>שירותים ספציפיים, כמו ראיונות שטח</td></tr></table></div>`,q:"e4"},
  {h:"ששת השלבים, ושלב 1: הגדרת הבעיה",html:`<p>משווקים טובים עובדים לפי תהליך פורמלי של <b>שישה שלבים</b> (איור 3.1):</p><ol><li>הגדרת הבעיה, החלופות ויעדי המחקר</li><li>פיתוח תוכנית המחקר</li><li>איסוף המידע</li><li>ניתוח המידע</li><li>הצגת הממצאים</li><li>קבלת ההחלטה</li></ol>${ex("הדוגמה בספר: ״אמריקן איירליינס״ שוקלת לתת לנוסעי המחלקה הראשונה Wi-Fi מהיר בטיסה, ורוצה לדעת כמה ישתמשו בו ובכמה כסף.")}<p><b>שלב 1</b>: הבעיה לא צריכה להיות מוגדרת רחב מדי וגם לא צר מדי. בדוגמה, הבעיה היא אם ה־Wi-Fi ייצור העדפה ורווחים שיצדיקו את העלות, בהשוואה לשיפורים אחרים. מזה נגזרים חמישה יעדי מחקר, למשל: אילו נוסעים ייענו, כמה ישתמשו בכל מחיר, וכמה יבחרו בחברה בזכותו.</p><p>לא כל מחקר יכול להיות ספציפי כל כך. יש שלושה סוגים:</p>${tiles([["question","מחקר גישוש","Exploratory: לזהות את הבעיה ולהציע פתרונות","כשעוד לא ברור מה בדיוק הבעיה.","מיכל רוצה להבין למה המכירות ירדו, ועוד לא יודעת מה לבדוק."],["chart","מחקר תיאורי","Descriptive: לכמת את הביקוש","למשל: כמה נוסעים יקנו Wi-Fi תמורת 25 דולר.","כמה לקוחות יקנו חטיף חדש במחיר 8 ש״ח."],["link","מחקר סיבתי","Causal: לבחון קשר בין סיבה לתוצאה","האם שינוי מסוים גורם לתוצאה מסוימת.","האם האריזה החדשה גרמה לעלייה במכירות."]])}`,q:"e5"}
 ]},
 {id:"t3",icon:"doc",title:"שלב 2: תוכנית המחקר",blocks:[
  {h:"מקורות נתונים וגישות מחקריות",html:`${def("על מה הנושא",`שלב 2 הוא הלב של המחקר: מחליטים מאיפה יבוא המידע ואיך יאספו אותו.<br><b>מה נלמד כאן:</b> נתונים משניים וראשוניים · חמש גישות מחקריות · שלושה כלי מחקר · תוכנית דגימה · ארבע שיטות התקשרות`)}<p>בתוכנית המחקר מחליטים על <b>חמישה דברים</b>: מקורות נתונים, גישות מחקריות, כלי מחקר, תוכנית דגימה ושיטות התקשרות.</p><div class="tw"><table><tr><th></th><th>נתונים משניים</th><th>נתונים ראשוניים</th></tr><tr><td><b>מה הם</b></td><td>נאספו כבר בעבר <b>למטרה אחרת</b></td><td>נאספים עכשיו <b>למטרה הספציפית</b></td></tr><tr><td><b>מתי</b></td><td>מתחילים בהם</td><td>כשהמשניים חסרים, מיושנים, לא מדויקים או לא מהימנים</td></tr></table></div><p><b>חמש גישות</b> לאיסוף נתונים ראשוניים:</p>${tiles([["id","מחקר תצפיתי","Observational: צופים בלקוחות מהצד","צופים בלקוחות כשהם משתמשים במוצר, או מראיינים אותם באופן לא פורמלי. <b>מחקר אתנוגרפי</b> משתמש בכלים מהאנתרופולוגיה כדי להבין לעומק את דרך החיים של אנשים.","חוקרי ״אמריקן״ יושבים בטרקלין ומקשיבים איך הנוסעים מדברים."],["people","קבוצת מיקוד","Focus group: 6 עד 10 אנשים בדיון מונחה","נבחרים לפי שיקולים דמוגרפיים או פסיכוגרפיים, ודנים בהרחבה בהנחיית מנחה מקצועי, תמורת תשלום צנוע. המנחה מתחיל בשאלה רחבה ומתקדם לספציפית.","שמונה הורים טועמים את החטיפים של ״טבעי״ ומדברים על מה שחשוב להם."],["check","מחקר סקר","Survey: ידע, אמונות, העדפות ושביעות רצון","מאפשר להעריך גם כמה זה נפוץ באוכלוסייה. אפשר להוסיף שאלות ל<b>סקר כללי</b> (Omnibus) של כמה עסקים, בעלות נמוכה הרבה יותר, או לשאול <b>פאנל</b> קבוע.","שאלון על הקבלה בקופה, עם הגרלה של פרס."],["cart","נתוני התנהגות","Behavioral data: העקבות שהלקוחות משאירים","נתוני סורקים בחנויות, רכישות ומסדי נתונים. הרכישות בפועל לרוב <b>מהימנות יותר</b> ממה שהצרכנים אומרים לחוקרים.","ניתוח רשומות קניית הכרטיסים."],["flask","מחקר ניסויי","Experimental: הגישה עם התוקף המדעי הגבוה ביותר","מטרתו לזהות קשר של סיבה ותוצאה, על ידי שלילת הסברים מתחרים.","Wi-Fi ב־25 דולר בשבוע אחד וב־15 בשבוע אחר. אם הכול דומה, ההבדל בשימוש נובע מהמחיר."]])}`,q:"e6"},
  {h:"כלי המחקר",html:`<p>יש <b>שלושה כלים</b> עיקריים לאיסוף נתונים ראשוניים:</p>${tiles([["doc","שאלון","Questionnaire: מערך שאלות. הכלי הנפוץ ביותר","נפוץ בזכות הגמישות. הצורה, הניסוח והסדר משפיעים על התשובות, ולכן צריך לבדוק ולתקן אותו לפני שמשתמשים. <b>שאלות סגורות</b> מפרטות את כל התשובות, וקל לפרש אותן. <b>שאלות פתוחות</b> מאפשרות לענות במילים שלך, ומועילות במיוחד במחקר גישוש.","״מה הכי חשוב לך בחטיף?״ היא שאלה פתוחה. ״דרג מ־1 עד 5״ היא סגורה."],["bulb","טכניקות מחקר איכותני","Qualitative: מדידה עקיפה ופחות מובנית","יש משווקים שמעדיפים אותן, כי מה שאנשים עושים לא תמיד מתאים למה שהם עונים בסקר. המגבלה היחידה היא היצירתיות של החוקר. המשיבים נזהרים פחות ומגלים יותר על עצמם.",""],["brain","התקנים טכנולוגיים","Technological devices: מדידת תגובות בגוף","<b>גלוונומטר</b> מודד עניין או ריגוש מפרסומת. <b>טכיטוסקופ</b> מציג מודעה בהבזקים קצרים, ואחר כך הנבדק מספר מה זכר. יש גם מעקב אחרי העיניים והפנים, חיישני עור וסורקי גלי מוח.","צמיד שמודד הזעה בזמן שהנבדק צופה בפרסומת."]])}${rem("כדאי לזכור את ההבדל: <b>גישה מחקרית</b> היא <i>איך</i> אוספים (תצפית, סקר, ניסוי...). <b>כלי מחקר</b> הוא <i>במה</i> אוספים (שאלון, התקן...).")}`,q:"e7"},
  {h:"תוכנית הדגימה ושיטות ההתקשרות",html:`<p>תוכנית דגימה דורשת <b>שלוש החלטות</b>:</p><ol><li><b>יחידת הדגימה</b>: את מי לכלול? למשל, רק נוסעי עסקים, או גם נוסעי נופש? אחר כך בונים <b>מסגרת דגימה</b>, כך שלכל אחד באוכלוסייה יש סיכוי שווה או ידוע להידגם.</li><li><b>גודל המדגם</b>: כמה אנשים? מדגם גדול מהימן יותר, אבל לא צריך לדגום את כולם. פחות מאחוז אחד מהאוכלוסייה יכול להספיק, בתהליך דגימה אמין.</li><li><b>הליך הדגימה</b>: איך בוחרים? <b>מדגם הסתברותי</b> מאפשר לחשב את מרווח הביטחון, ומייצג יותר.</li></ol><p><b>ארבע שיטות התקשרות</b> (טבלה 3.2):</p><div class="tw"><table><tr><th>שיטה</th><th>יתרון</th><th>חיסרון</th></tr><tr><td><b>דואר</b></td><td>מגיע למי שלא יתראיין, בלי הטיה של מראיין</td><td>שיעור תגובה נמוך או איטי</td></tr><tr><td><b>טלפון</b></td><td>מהיר, אפשר להבהיר שאלות, תגובה גבוהה מדואר</td><td>ראיון קצר ולא אישי מדי, עוינות כלפי משווקים בטלפון</td></tr><tr><td><b>מפגש אישי</b></td><td>הכי משוכלל: יותר שאלות, ותצפית בלבוש ובשפת גוף</td><td>הכי יקר, חשוף להטיית מראיין, דורש תכנון ופיקוח</td></tr><tr><td><b>מקוון</b></td><td>זול, מהיר, תשובות כנות ושקולות</td><td>מדגם מוטה וקטן, תקלות טכניות, תחלופה בפאנלים</td></tr></table></div>${ex("מיכל צריכה תשובות תוך יומיים, ובתקציב קטן. השיטה שהכי מתאימה לה היא סקר מקוון, אבל היא צריכה לזכור שהמדגם עלול להיות מוטה.")}`,q:"e8"}
 ]},
 {id:"t4",icon:"chart",title:"שלבים 3–6: מהנתונים להחלטה",blocks:[
  {h:"איסוף, ניתוח, הצגה והחלטה",html:`${def("על מה הנושא",`אחרי התכנון אוספים את הנתונים, מנתחים אותם ומציגים אותם למנהלים, שמחליטים.<br><b>מה נלמד כאן:</b> הבעיות באיסוף · כלי הניתוח · חישוב לדוגמה · מי מחליט`)}${tiles([["people","שלב 3: איסוף הנתונים","בדרך כלל השלב היקר ביותר, והחשוף ביותר לטעויות","יש משיבים שלא בבית או לא זמינים, וצריך לחזור אליהם או להחליף אותם. יש מי שמסרבים, או עונים בכוונה תשובות מוטות או שקריות.",""],["pie","שלב 4: ניתוח המידע","מכמתים, מצליבים בטבלאות ומחשבים מדדים מסכמים","ממוצעים ומדדי פיזור, טכניקות סטטיסטיות ומודלים. בוחנים השערות, ועושים <b>ניתוח רגישות</b> כדי לבדוק את ההנחות ואת חוזק המסקנות.",""],["chart","שלב 5: הצגת הממצאים","החוקר מתרגם את הנתונים לתובנות ולהמלצות","היום מצפים מהחוקרים לתפקיד פעיל ומייעץ, ולהציג את הנתונים בצורה מובנת ומשכנעת.",""]])}<p><b>החישוב מהדוגמה</b>: ב־25 דולר ישתמשו כ־5 מכל 10 נוסעים, וב־15 דולר כ־6.</p><div class="tw"><table><tr><th>מחיר</th><th>משתמשים</th><th>הכנסה בטיסה</th></tr><tr><td>25 דולר</td><td>5</td><td><b>125 דולר</b></td></tr><tr><td>15 דולר</td><td>6</td><td>90 דולר</td></tr></table></div><p>כלומר, המחיר הגבוה מכניס יותר. 125 × 365 ימים = <b>45,625 דולר בשנה</b>. ההשקעה היא 90,000 דולר למטוס, ולכן ההחזר לוקח <b>שנתיים</b>. השירות גם יחזק את התדמית החדשנית של החברה.</p>${def("שלב 6: קבלת ההחלטה",`המנהלים שהזמינו את המחקר שוקלים את הנתונים. הם יכולים לוותר, להשיק בכל זאת (והממצאים אולי יתמכו בזה), או להזמין מחקר נוסף. <b>המחקר נותן תובנה, וההחלטה היא של המנהלים.</b>`)}`,q:"e9"}
 ]},
 {id:"t5",icon:"target",title:"מדידת ביקוש בשוק",blocks:[
  {h:"חמש רמות של שוק",html:`${def("על מה הנושא",`אחרי שמזהים הזדמנות, צריך להעריך כמה גדולה היא. תחזית המכירות משמשת את כל החברה: כספים, ייצור, רכש ומשאבי אנוש. תחזית שגויה תגרום לעודף או לחוסר במלאי.<br><b>מה נלמד כאן:</b> סוגי שוק · פונקציית ביקוש שוק · מינימום ופוטנציאל · ביקוש ראשוני ובררני · תחזית, מכסה ותקציב מכירות`)}<p>הספר מפרק את השוק לרמות, מהרחבה לצרה:</p><div class="tw"><table><tr><th>שוק</th><th>מי בו</th></tr><tr><td><b>פוטנציאלי</b></td><td>צרכנים שמביעים <b>עניין</b> מספיק בהצעה</td></tr><tr><td><b>זמין</b></td><td>יש להם עניין, <b>הכנסה וגישה</b> להצעה</td></tr><tr><td><b>זמין כשיר</b></td><td>יש להם גם את <b>הכישורים</b> המתאימים (למשל, מעל גיל 21 לאופנוע)</td></tr><tr><td><b>מטרה</b></td><td>החלק בשוק הזמין הכשיר שהעסק <b>בוחר להתמקד</b> בו</td></tr><tr><td><b>חדירה</b></td><td>הצרכנים ש<b>כבר קונים</b> את המוצר</td></tr></table></div>${rem("עניין לבד לא מספיק כדי להגדיר שוק. צריך גם הכנסה וגישה.")}<p>אם המכירות לא מספיקות, העסק יכול: למשוך יותר קונים משוק המטרה; להוריד את דרישות הכישורים; להרחיב את השוק הזמין (ערוצי הפצה חדשים או מחיר נמוך יותר); או למצב את עצמו מחדש.</p>${ex("״טבעי״ מתחילה למכור גם בתחנות דלק, ולא רק בסופרים. כך היא מגדילה את השוק הזמין.")}`,q:"e10"},
  {h:"פונקציית ביקוש השוק",html:`${def("מושג מפתח",`<mark>ביקוש שוק</mark> ${E("Market demand")}: הכמות הכוללת שתקנה קבוצת לקוחות מוגדרת, באזור מוגדר, בתקופה מוגדרת, בסביבה שיווקית מוגדרת ובתוכנית שיווקית מוגדרת. זה לא מספר קבוע, אלא <b>פונקציה</b> של התנאים האלה, ולכן נקרא <b>פונקציית ביקוש שוק</b>.`)}<p>באיור 3.2 (א), הציר האופקי הוא ההוצאה של כל הענף על שיווק, והאנכי הוא הביקוש:</p><ul><li><b>מינימום שוק</b> (Q1): מכירות שיהיו גם בלי שום הוצאה על שיווק.</li><li>בהתחלה הביקוש עולה בקצב גובר, ואחר כך בקצב יורד.</li><li><b>פוטנציאל שוק</b> (Q2): הגבול העליון. מעבר לרמה מסוימת, עוד הוצאה כמעט לא מוסיפה ביקוש.</li></ul>${tiles([["sprout","שוק שאפשר להרחיב","Expansible: המרחק בין Q1 ל־Q2 גדול","הגודל הכולל מושפע מאוד מהוצאת הענף על שיווק.",""],["lock","שוק שאי אפשר להרחיב","Nonexpansible: המרחק בין Q1 ל־Q2 קטן","השוק כמעט לא מגיב לשיווק. העסק חייב לקבל את גודל השוק, כלומר את <b>הביקוש הראשוני</b> לקטגוריה, ולהתמקד בהגדלת <b>נתח השוק</b> שלו, כלומר <b>ביקוש בררני</b> למוצר שלו.","אם פרסום לא גורם לאנשים לאכול יותר חטיפים, ״טבעי״ תתמקד בלקיחת נתח מהמתחרים."]])}${rem("פונקציית הביקוש היא <b>לא</b> תמונה של הביקוש לאורך זמן. היא מראה מה יהיה הביקוש בכל רמת הוצאה אפשרית. בפועל יש רק רמת הוצאה אחת, והביקוש שמתאים לה נקרא <b>תחזית שוק</b>: הביקוש <b>הצפוי</b>, לא המרבי.")}<p><b>פוטנציאל השוק</b> תלוי בסביבה. למשל, פוטנציאל השוק למכוניות גבוה יותר בתקופת גאות מאשר בשפל (איור 3.2 ב). עסקים לא קובעים את צורת העקומה, אבל הם בוחרים את המקום שלהם עליה, כשהם מחליטים כמה להוציא על שיווק.</p>`,q:"e11"},
  {h:"ביקוש החברה ותחזית המכירות",html:`<p>עד עכשיו דיברנו על כל השוק. עכשיו עוברים לעסק עצמו. <b>ביקוש חברה</b> הוא הנתח של העסק מתוך ביקוש השוק, בכל רמה של מאמץ שיווקי. הוא תלוי באיך המוצרים, המחירים והמסרים של העסק נתפסים לעומת המתחרים. בוני מודלים פיתחו <b>פונקציות תגובת מכירות</b> כדי למדוד את זה.</p><div class="tw"><table><tr><th>מושג</th><th>מה זה</th><th>ביחס לתחזית</th></tr><tr><td><b>תחזית המכירות לחברה</b></td><td>המכירות הצפויות לפי תוכנית השיווק שנבחרה והסביבה הנתונה</td><td>נקודת הייחוס</td></tr><tr><td><b>מכסת מכירות</b></td><td>יעד לקו מוצר, חטיבה או נציג. כלי להנעת אנשי המכירות</td><td><b>מעט גבוהה</b> יותר</td></tr><tr><td><b>תקציב מכירות</b></td><td>אומדן שמרני, להחלטות על רכש, ייצור ותזרים מזומנים</td><td>בדרך כלל <b>נמוך</b> יותר</td></tr><tr><td><b>פוטנציאל מכירות החברה</b></td><td>הגבול שאליו מגיע ביקוש החברה כשהמאמץ השיווקי שלה גדל ביחס למתחרים</td><td>הגבול העליון של העסק</td></tr></table></div><p>פוטנציאל המכירות של החברה היה שווה לפוטנציאל השוק רק אם העסק היה יכול לקבל 100% מהשוק. ברוב המקרים הוא <b>נמוך</b> יותר, כי לכל מתחרה יש קונים נאמנים.</p>${ex("מיכל צופה למכור 100,000 חטיפים. היא קובעת לאנשי המכירות מכסה של 110,000, ובונה את תקציב הייצור על 90,000.")}`,q:"e12"}
 ]},
 {id:"t6",icon:"pie",title:"הערכת הביקוש הנוכחי",blocks:[

ות, ומודיעין נותן נתונים שוטפים על מה שקורה עכשיו בסביבה."}, {"q": "״טבעי״ שולחת ״קונה מדומה״ לחנויות שלה כדי לבדוק את השירות. לאיזו דרך לשיפור המודיעין זה שייך?", "a": "שכירת מומחים חיצוניים שחושפים בעיות בשירות", "w": ["הכשרת צוות המכירות לדווח על התפתחויות", "הקמת מועצה מייעצת של לקוחות קבועים", "שימוש במקורות ממשלתיים כמו מפקד האוכלוסין"], "e": "בטבלה 3.1, ״קונים מדומים״ הם דוגמה לשכירת מומחים חיצוניים שחושפים בעיות בשירות."}], "t2:0": [{"q": "מנהל קיבל מהחוקר טבלה עם 40 נתונים, בלי הסבר מה הם אומרים. מה חסר לפי הדף?", "a": "תובנה: איך ולמה זה קורה ומה המשמעות למשווק", "w": ["עוד נתונים, כי 40 זה מדגם קטן מדי למחקר", "מכון מחקר חיצוני במקום החוקר הפנימי", "תקציב גבוה מ־2% מהמכירות של החברה"], "e": "התפקיד של החוקר הוא להפיק תובנות שיעזרו למנהל להחליט: מידע על איך ולמה מתרחשות השפעות ומה המשמעות שלהן."}, {"q": "״טבעי״ קונה מנילסן דוח מוכן על מכירות חטיפים בכל הרשתות, דוח שנמכר גם למתחרים. איזה סוג מכון מחקר זה?", "a": "שירות מחקר מאוגד, שאוסף מידע ומוכר אותו", "w": ["מחקר שוק ייעודי, שנערך לפי הזמנה שלה בלבד", "מומחיות מקצועית, כמו ראיונות שטח בלבד", "מחקר סיבתי, שבודק קשר בין סיבה לתוצאה"], "e": "שירותי מחקר מאוגדים אוספים מידע צרכני ומסחרי ומוכרים אותו לכל מי שמשלם. מחקר ייעודי נעשה לפי הזמנה של לקוח אחד."}], "t2:1": [{"q": "מנהל מגדיר את בעיית המחקר: ״מה הלקוחות חושבים על כל מה שקשור לטיסות?״ מה הבעיה בהגדרה לפי הספר?", "a": "היא רחבה מדי ולא נגזרים ממנה יעדים", "w": ["היא צרה מדי, כי היא עוסקת רק בטיסות", "היא סיבתית, ואת זה אפשר לבדוק רק בניסוי", "היא תיאורית, ולכן צריך לבחור מחקר גישוש"], "e": "בשלב 1 הבעיה לא צריכה להיות רחבה מדי וגם לא צרה מדי. מהגדרה טובה נגזרים יעדי מחקר ממוקדים."}, {"q": "המכירות של ״טבעי״ ירדו. היא מחליפה אריזה ורוצה לדעת אם האריזה החדשה היא שהחזירה את המכירות. איזה מחקר מתאים?", "a": "מחקר סיבתי, שבוחן קשר בין סיבה לתוצאה", "w": ["מחקר גישוש, שמזהה מה בכלל הבעיה", "מחקר תיאורי, שמכמת כמה לקוחות יקנו", "מחקר מאוגד, שקונים מוכן מחברת מחקר"], "e": "מחקר סיבתי בודק אם שינוי מסוים גורם לתוצאה מסוימת. גישוש מתאים כשעוד לא ברור מה הבעיה, ות <li><b>רמות שוק</b>: פוטנציאלי (עניין) ← זמין (עניין, הכנסה וגישה) ← זמין כשיר (גם כישורים) ← מטרה (מה שהעסק בוחר) ← חדירה (כבר קונים).</li>
<li><b>ביקוש שוק</b>: כמות כוללת בתנאים מוגדרים. זו <b>פונקציה</b>, לא מספר. <b>מינימום שוק</b> (Q1) בלי שיווק, <b>פוטנציאל שוק</b> (Q2) הגבול העליון.</li>
<li><b>שוק שאפשר להרחיב</b> (פער גדול בין Q1 ל־Q2) מול <b>שוק שאי אפשר</b> (פער קטן). בשני: מקבלים את <b>הביקוש הראשוני</b> ונלחמים על <b>נתח שוק</b> (<b>ביקוש בררני</b>).</li>
<li><b>תחזית שוק</b>: הביקוש הצפוי ברמת ההוצאה בפועל, לא המרבי. פוטנציאל השוק תלוי בסביבה (גאות מול שפל).</li>
<li><b>ביקוש חברה</b>: הנתח של העסק. <b>תחזית המכירות לחברה</b>; <b>מכסת מכירות</b> (מעט גבוהה, להנעה); <b>תקציב מכירות</b> (שמרני, בדרך כלל נמוך); <b>פוטנציאל מכירות החברה</b> (בדרך כלל נמוך מפוטנציאל השוק, בגלל קונים נאמנים למתחרים).</li>
</ul>
<h3>5. הערכת ביקוש נוכחי</h3>
<ul>
<li><b>פוטנציאל כולל</b>: קונים × כמות לקונה × מחיר (100 מיליון × 3 × 20 = 6 מיליארד דולר). הקשה ביותר: מספר הקונים.</li>
<li><b>לפי אזורים</b>: <b>שוק מצטבר</b> (בעיקר עסקי, כל הקונים, NAICS) ו<b>מדד רב־גורמי</b> (בעיקר צרכני, משקלות; וירג׳יניה 2.04).</li>
<li><b>מכירות ענפיות ונתח שוק</b>: עסק שגדל ב־5% בענף שגדל ב־10% מאבד מעמד יחסי.</li>
</ul>
<div class="key"><b>השורה התחתונה: מה רוצים ממך</b><br>להבחין בין רשומות פנימיות, מודיעין ומחקר; לסדר את ששת השלבים; לזהות סוג מחקר, גישה, כלי ושיטת התקשרות במקרה; לסדר את רמות השוק; להסביר מינימום, פוטנציאל ותחזית שוק ואת ההבדל בין ביקוש ראשוני לבררני; להבחין בין מכסה, תקציב ותחזית; ולחשב פוטנציאל כולל ומדד רב־גורמי.</div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>

      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
      ${CONFIG.podcast?`<button class="review-btn" id="pod"><span aria-hidden="true">🎧</span><span>פודקאסט${CONFIG.podcast.min?` · ${CONFIG.podcast.min} דק׳`:""}</span></button>`:""}
     </div>
     ${CONFIG.podcast?`<div id="podbox" class="podbox" hidden><p class="muted">פודקאסט שנוצר ב־Gemini Notebook מקריאת החובה. כמו כל סיכום אוטומטי, הוא עלול לטעות, והקריאה עצמה קובעת.</p><div class="podframe"></div></div>`:""}
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mkt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}{const pb=app.querySelector("#pod");if(pb)pb.onclick=()=>{const bx=app.querySelector("#podbox");bx.hidden=!bx.hidden;const f=bx.querySelector(".podframe");if(!bx.hidden&&!f.firstChild)f.innerHTML=`<iframe src="https://drive.google.com/file/d/${CONFIG.podcast.id}/preview" allow="autoplay" title="פודקאסט" loading="lazy"></iframe>`}}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="ck"></div><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  checkBox(t,bi);
  scrollTo(0,0);
}

function checkBox(t,bi){
  const list=typeof K!=="undefined"&&K[t.id+":"+bi];const host=app.querySelector("#ck");if(!list||!host)return;
  S.ck=S.ck||{};const key=t.id+":"+bi;
  const show=i=>{const v=list[i],opts=shuffle([v.a,...v.w]);
    host.innerHTML=`<div class="q ckq fade"><span class="eyebrow">בדיקת הבנה · שאלה ${i+1} מתוך ${list.length}</span><div class="qtext">${esc(v.q)}</div><p class="muted cknote">${i?"שאלה אחרונה על הקטע.":"לא בטוחים? עלו לטקסט וקראו שוב לפני שעונים."}</p><div class="opts"></div></div>`;
    const box=host.firstChild,wrap=box.querySelector(".opts");
    opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{const ok=o===v.a;(S.ck[key]=S.ck[key]||[])[i]=ok?1:0;save();
        wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
        if(!ok)b.classList.add("wrong");
        const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
        fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}${ok?"":" <b>כדאי לחזור לטקסט למעלה ולקרוא שוב.</b>"}</div>`;box.appendChild(fb);
        if(i+1<list.length){const nx=document.createElement("button");nx.className="ghost";nx.textContent=`לשאלה ${i+2} ←`;nx.style.alignSelf="flex-start";
          nx.onclick=()=>{const y=scrollY;show(i+1);scrollTo(0,y)};box.appendChild(nx)}
        else{const d=document.createElement("p");d.className="muted";d.style.margin="0";const r=(S.ck[key]||[]).filter(Boolean).length;d.textContent=`סיימתם את בדיקת ההבנה של הקטע (${r} מתוך ${list.length} נכון).`;box.appendChild(d)}
      };wrap.appendChild(b)});
  };show(0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(_h==="#pod"&&CONFIG.podcast){home();const pb=document.querySelector("#pod");if(pb){pb.click();const bx=document.querySelector("#podbox");if(bx)bx.scrollIntoView({block:"center"})}}else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
