:root[data-theme="dark"]{

  {h:"שלושת השלבים, ומהו פלח שוק",html:`${def("על מה הנושא",`עסק לא יכול לפנות לכולם באותה דרך. הנושא מסביר איך מחלקים את השוק לקבוצות, ואיך בוחרים לאילו מהן לפנות.<br><b>מה נלמד כאן:</b> שיווק מטרה · פלח שוק · שתי דרכים להגדיר פלחים · ארבעת משתני הפילוח`)}${ex("בלומדה נלווה את <b>עומר</b>, מנהל השיווק של ״כושר פלוס״, רשת חדרי כושר שמחליטה לאילו קהלים לפנות.")}<p>הפתיחה של הפרק היא LinkedIn, שבחרה קהל שונה משל הרשתות החברתיות האחרות: אנשי מקצוע. יש לה הכנסות משלושה פלחים: מחפשי עבודה שקונים מינוי, מפרסמים, ומגייסים שקונים כלי חיפוש.</p>${def("מושג מפתח",`<mark>שיווק מטרה</mark> ${E("Target marketing")}: דורש שלושה שלבים: (א) <b>פילוח שוק</b>, זיהוי קבוצות קונים שנבדלות בצרכים וברצונות; (ב) <b>סימון שוק מטרה</b>, בחירת פלח אחד או יותר; (ג) <b>מיצוב בשוק</b>, ביסוס, תקשור ואספקה של התועלות לכל פלח. פרק 6 עוסק בשני הראשונים, ופרק 7 בשלישי.`)}${def("מושג מפתח",`<mark>פלח שוק</mark> ${E("Market segment")}: קבוצת לקוחות שחולקים מערך דומה של צרכים ורצונות. המשווק מזהה כמה פלחים יש ומה האופי שלהם, ומחליט לאילו לפנות.`)}<p>יש <b>שתי דרכים</b> להגדיר פלחים בשוק הצרכנים:</p><div class="tw"><table><tr><th>מתחילים מ...</th><th>ואז בודקים</th></tr><tr><td><b>מאפיינים תיאוריים</b>: גיאוגרפיים, דמוגרפיים ופסיכוגרפיים</td><td>אם לפלחים האלה יש צרכים שונים, או תגובה שונה למוצר</td></tr><tr><td><b>שיקולים התנהגותיים</b>: תגובה לתועלות, הזדמנויות שימוש, מותגים</td><td>אם יש קשר בין מאפייני הצרכנים לכל פלח</td></tr></table></div>${rem("מה שחשוב, בלי קשר לשיטה: להתאים את התוכנית השיווקית להבדלים בין הלקוחות. ארבעת משתני הפילוח העיקריים (טבלה 6.1): <b>גיאוגרפי, דמוגרפי, פסיכוגרפי והתנהגותי</b>.")}`,q:"e1"}

 {id:"t2",icon:"people",title:"פילוח גיאוגרפי ודמוגרפי",blocks:[
  {h:"פילוח גיאוגרפי",html:`${def("על מה הנושא",`שני הבסיסים הנפוצים לפילוח: איפה הלקוחות גרים, ומי הם.<br><b>מה נלמד כאן:</b> שיווק עממי · הקבצה גיאוגרפית · גיל ושלב בחיים · מגדר והכנסה · קבוצות דוריות · שיווק רב־תרבותי`)}<p><b>פילוח גיאוגרפי</b> מחלק את השוק ליחידות: ארצות, מדינות, אזורים, ערים ואפילו שכונות. העסק יכול לפעול באזור אחד, בכמה, או בכולם תוך התחשבות בהבדלים המקומיים. משתנים בטבלה 6.1: אזור, גודל יישוב, צפיפות (עירונית, פרברית, כפרית) ואקלים.</p>${tiles([["hand","שיווק עממי","Grassroots marketing: להפוך את הפעילות לרלוונטית לכל לקוח","מגמה מתפתחת: שיווק אזורי שהוא שיווק ממוקד, אפילו עד רמה של אזור מיקוד אחד.","״כושר פלוס״ מארגנת אימון פתוח בפארק השכונתי ליד כל סניף."],["building","הקבצה גיאוגרפית","Geoclustering: שילוב נתונים גיאוגרפיים ודמוגרפיים","<b>PRIZM</b> של Nielsen Claritas מסווגת יותר מחצי מיליון שכונות בארה״ב ל־14 קבוצות ו־66 פלחי סגנון חיים. היא בוחנת 39 גורמים בחמש קטגוריות: השכלה ועושר, מחזור חיי משפחה, עיור, גזע ומוצא, וניידות. התושבים בכל הקבצה נוטים לחיות חיים דומים.",""]])}<div class="tw"><table><tr><th>בעד שיווק מקומי</th><th>נגד שיווק מקומי</th></tr><tr><td>פרסום ארצי ״רחוק מדי״ ולא עונה על צרכים מקומיים. היום גם עסקים קטנים יכולים לשווק למיקרו־פלחים, כי מסדי נתונים זולים יותר</td><td>מייקר עלויות, מצמצם את היתרון לגודל, מחריף בעיות לוגיסטיות, ועלול להחליש את תדמית המותג אם המסר שונה מדי בין מקומות</td></tr></table></div>`,q:"e2"},
  {h:"פילוח דמוגרפי: גיל, שלב בחיים, מגדר והכנסה",html:`<p>למה משתנים דמוגרפיים כל כך פופולריים? <b>שתי סיבות</b>: יש להם לרוב קשר הדוק לצרכים ולרצונות, וקל למדוד אותם. גם אם מגדירים שוק מטרה במונחים אחרים (כמו אישיות), צריך לקשר אותו לדמוגרפיה כדי להעריך את הגודל ולבחור ערוצי תקשורת.</p>${tiles([["clock","גיל ושלב במחזור החיים","הרצונות והיכולות משתנים עם הגיל","Crest מציעה קווים לילדים, למבוגרים ולקשישים. Pampers מחלקת לפגים, יילודים, תינוקות, פעוטות וטרום־גן. אבל גיל יכול להיות משתנה בעייתי: לפעמים שוק המטרה הוא ״הצעירים ברוחם״.",""],["cycle","שלב בחיים","Life stage: הדאגה העיקרית שמעסיקה את האדם","גירושין, נישואים שניים, טיפול בהורה מזדקן, קניית בית. אנשים באותו שלב במחזור החיים יכולים להיות בשלבים שונים בחיים. למשל, יותר מרבע ממשקי הבית בארה״ב הם של אדם אחד.","״כושר פלוס״ מציעה מסלול למי שחזרו לא מזמן מחופשת לידה."],["people","מגדר","הבדלים בעמדות ובהתנהגות","לפי סקר, לגברים צריך לרוב להציע לגעת במוצר, ונשים אוחזות בו בלי הזמנה. גברים אוהבים לקרוא מידע, נשים מתייחסות ברמה אישית יותר. ההבדלים מצטמצמים: יותר ממחצית הגברים מזהים את עצמם כקונים הראשיים במכולת, ולכן P&G פונה גם אליהם.",""],["chart","הכנסה","שיטה ותיקה: מכוניות, ביגוד, חופשות","הכנסה לא תמיד מנבאת מי הלקוחות הטובים ביותר. יש משווקים שמתמקדים דווקא בהכנסה נמוכה, כי שם יש פחות תחרות ויותר נאמנות. השוק מקבל צורה של <b>שעון חול</b>: צרכני הביניים עוברים גם לזול וגם ליוקרתי. Levi's מציעה קו יוקרתי וגם קו זול.",""]])}`,q:"e3"},
  {h:"קבוצות דוריות ושיווק רב־תרבותי",html:`${def("מושג מפתח",`<mark>קבוצה דורית</mark> ${E("Cohort")}: בני דור שמושפעים מאוד מהתקופה שבה התבגרו: המוזיקה, הפוליטיקה והאירועים המכוננים. הם חולקים חוויות, ולעתים קרובות גם השקפות וערכים. אפשר לפנות אליהם בעזרת האיקונות והדימויים של התקופה שלהם.`)}<div class="tw"><table><tr><th>דור</th><th>שנים</th><th>מאפיינים לפי הספר</th></tr><tr><td><b>מילניום</b> (Y)</td><td>1977–1994</td><td>מחוברים מלידה, תחושת ״מגיע לי״, מודעות חברתית וסביבתית. שיווק גלוי מדי מעורר סלידה</td></tr><tr><td><b>דור ה־X</b></td><td>1964–1978</td><td>גדלו עם יותר גיוון, השכלה גבוהה, אבל קשה להם להשיג את רמת החיים של הוריהם. פרגמטיים ואינדיבידואליסטים, הטכנולוגיה מאפשרת</td></tr><tr><td><b>בייבי בומרס</b></td><td>1946–1964</td><td>מתעניינים במוצרים ״לעצירת הזמן״. רבים מוכנים להחליף מותגים ולקנות ברשת</td></tr><tr><td><b>הדור השקט</b></td><td>1925–1945</td><td>חיים פעילים, מגיבים טוב לתפקיד של סבים וסבתות. תובעניים, אבל מוכנים לשלם מחיר מלא על הצעה שהם מעריכים</td></tr></table></div>${def("מושג מפתח",`<mark>שיווק רב־תרבותי</mark> ${E("Multicultural marketing")}: גישה שמכירה בכך שלפלחים אתניים ותרבותיים יש צרכים שונים, ולכן צריך לפנות אליהם באופן ייעודי. שוק המונים לא מכיל את הגיוון. צריך להביא בחשבון נורמות, דקויות שפה, הרגלי קנייה ושיטות עבודה, וגם להתאים את המחקר השיווקי.`)}${ex("ב־McDonald's בארה״ב, כ־40% מהעסקים הם מול מיעוטים אתניים. הקמפיין I'm Loving It היה נטוע בתרבות ההיפ־הופ, אבל הצליח גם מעבר לה.")}`,q:"e4"}
 ]},
 {id:"t3",icon:"brain",title:"פילוח פסיכוגרפי והתנהגותי",blocks:[
  {h:"פילוח פסיכוגרפי ו־VALS",html:`${def("על מה הנושא",`לא רק מי הלקוחות, אלא איך הם חושבים ואיך הם מתנהגים כלפי המוצר.<br><b>מה נלמד כאן:</b> פסיכוגרפיה ו־VALS · צרכים ותועלות · חמישה תפקידי החלטה · הזדמנויות, מעמד ושיעור שימוש · שלב מוכנות ומשפך · נאמנות ועמדה`)}${def("מושג מפתח",`<mark>פסיכוגרפיה</mark> ${E("Psychographics")}: המדע שמשתמש בפסיכולוגיה ובדמוגרפיה כדי להבין טוב יותר את הצרכנים. בפילוח פסיכוגרפי מחלקים לפי תכונות פסיכולוגיות או אישיות, סגנון חיים או ערכים.`)}${rem("לאנשים מאותה קבוצה דמוגרפית יכול להיות דיוקן פסיכוגרפי שונה לגמרי.")}<p><b>VALS</b> (״ערכים וסגנונות חיים״, של SBI) היא מערכת סיווג מסחרית פופולרית:</p><ul><li>מסווגת את הבוגרים בארה״ב ל<b>שמונה קבוצות</b>, לפי שאלון של 4 שאלות דמוגרפיות ו־35 שאלות על עמדות.</li><li>שני ממדים: <b>הנעת הצרכן</b> (שלוש מוטיבציות עיקריות) ו<b>משאבי הצרכן</b>, שמחזקים או מגבילים את הביטוי של המוטיבציה.</li><li>מתעדכנת מיותר מ־80,000 סקרים בשנה.</li></ul>${ex("שני גברים בני 35 עם אותה הכנסה: אחד מתאמן כדי להתחרות, השני כדי לפגוש חברים. הדמוגרפיה זהה, הדיוקן הפסיכוגרפי שונה.")}`,q:"e5"},
  {h:"פילוח התנהגותי: צרכים, תפקידים ושימוש",html:`${def("מושג מפתח",`<mark>פילוח התנהגותי</mark> ${E("Behavioral segmentation")}: חלוקה לפי הידע על המוצר, העמדה כלפיו, השימוש בו או התגובה אליו. המשתנים: צרכים או תועלות, תפקידי החלטה, ומשתנים של משתמשים ושימושים.`)}<p><b>צרכים ותועלות</b>: לא כל הקונים מצפים לאותן תועלות. פילוח לפי צרכים מזהה פלחים עם השלכות שיווקיות ברורות.</p><p><b>חמישה תפקידי החלטה</b>: <b>יוזם, משפיע, מחליט, קונה ומשתמש</b>.</p>${ex("בדוגמת הספר: האישה מבקשת הליכון ליום ההולדת (יוזמת), חבר שיש לו הליכון ממליץ (משפיע), היא בוחרת את הדגם (מחליטה), הבעל קונה (קונה), וכל המשפחה משתמשת (משתמשים).")}<p><b>משתנים של משתמשים ושימוש</b>, שהם נקודת מוצא טובה לפילוח:</p>${tiles([["clock","הזדמנויות","Occasions: מתי מתעורר הצורך, קונים או משתמשים","זמן ביום, בשבוע או בשנה. למשל, טיסה לנסיעת עסקים, לחופשה או למשפחה. פילוח כזה יכול להרחיב את השימוש במוצר.","״כושר פלוס״ מציעה מנוי מיוחד לחודשים שלפני החתונה."],["id","מעמד המשתמש","User status: לא משתמש, לשעבר, פוטנציאלי, ראשון, קבוע","כדי למשוך לא משתמשים צריך להבין למה הם לא משתמשים: אמונות מושרשות, או חוסר ידע. <b>מובילי השוק</b> מתמקדים במשתמשים <b>פוטנציאליים</b>, כי מהם אפשר להרוויח הכי הרבה. <b>עסקים קטנים</b> מנסים למשוך את המשתמשים <b>של המוביל</b>.",""]])}`,q:"e6"},
  {h:"שיעור שימוש, שלב מוכנות, נאמנות ועמדה",html:`${tiles([["chart","שיעור השימוש","Usage rate: קלים, בינוניים וכבדים","המשתמשים הכבדים הם נתח קטן מהשוק, אבל אחראים לחלק גדול מהצריכה. משווקים מעדיפים משתמש כבד אחד על כמה קלים. הבעיה: הכבדים לרוב נאמנים מאוד למותג אחד, או לא נאמנים לאף מותג ומחפשים את הזול.",""],["target","שלב המוכנות של הקונה","Buyer-readiness: מלא מודע ועד מתכוון לקנות","משתמשים ב<b>משפך שיווק</b> כדי לחלק את השוק לפי השלב. באיור 6.2, מותג א מצליח פחות להפוך מנסים חד־פעמיים למשתמשים לאחרונה: 46% לעומת 61% במותג ב. קמפיין יכול לטפל בזה, למשל בהפרכת אמונות שגויות.",""]])}<p><b>מצב נאמנות</b>: ארבע קבוצות.</p><div class="tw"><table><tr><th>קבוצה</th><th>מי הם</th><th>מה לומדים מהם</th></tr><tr><td><b>נאמנים מושבעים</b></td><td>תמיד מותג אחד</td><td>את <b>החוזקות</b> של המוצר</td></tr><tr><td><b>נאמנות חצויה</b></td><td>נאמנים לשניים או שלושה מותגים</td><td>מי <b>המתחרים</b> החזקים</td></tr><tr><td><b>העברת נאמנות</b></td><td>עוברים ממותג למותג</td><td rowspan="2"><b>חולשות</b> שאפשר לתקן</td></tr><tr><td><b>מחליפים</b></td><td>לא נאמנים לשום מותג</td></tr></table></div>${rem("זהירות: מה שנראה כמו נאמנות יכול להיות גם הרגל, אדישות, מחיר זול, עלות מעבר גבוהה, או שאין מותג אחר זמין.")}<p><b>עמדה</b>: חמש עמדות: נלהבת, חיובית, אדישה, שלילית ועוינת. בקמפיין פוליטי מודים לנלהבים ומזכירים להם להצביע, מחזקים את החיוביים, מנסים לזכות באדישים, ולא מבזבזים זמן על השליליים והעוינים.</p>`,q:"e7"}
 ]},
 {id:"t4",icon:"factory",title:"פילוח שווקים עסקיים",blocks:[
  {h:"משתני הפילוח העסקי והצעה גמישה",html:`${def("על מה הנושא",`גם שווקים עסקיים מפלחים, עם חלק מאותם משתנים ועוד משתנים משלהם.<br><b>מה נלמד כאן:</b> חמש קבוצות משתנים · פילוח בתהליך סדרתי · פתרון עירום ואופציות`)}<p>בשווקים עסקיים משתמשים בחלק ממשתני הצרכנים (גיאוגרפיה, תועלות, קצב שימוש) ובעוד משתנים. <b>הדמוגרפיים הם החשובים ביותר</b>, ואחריהם התפעוליים. טבלה 6.2 מסדרת אותם כשאלות:</p><div class="tw"><table><tr><th>קבוצה</th><th>משתנים</th></tr><tr><td><b>דמוגרפיים</b></td><td>ענף, גודל חברה, מיקום</td></tr><tr><td><b>תפעוליים</b></td><td>טכנולוגיה, מעמד משתמש, יכולות לקוח</td></tr><tr><td><b>גישות רכש</b></td><td>ארגון הרכש, מבנה הכוח, אופי היחסים, מדיניות רכש, תבחיני רכישה</td></tr><tr><td><b>גורמים מצביים</b></td><td>דחיפות, יישום ייחודי, גודל הזמנה</td></tr><tr><td><b>מאפיינים אישיים</b></td><td>דמיון בין קונה למוכר, עמדות כלפי סיכון, נאמנות</td></tr></table></div><p><b>תהליך סדרתי</b>: יצרנית אלומיניום בחרה קודם שוק משתמשי קצה (בנייה למגורים, ולא רכב או פחיות), אחר כך יישום (רכיבים לבנייה), אחר כך גודל לקוח (גדולים), ולבסוף את הפלח שמונע בעיקר מ<b>שירות</b>, כי זה החוזק שלה.</p>${tiles([["copies","הצעה שיווקית גמישה","אנדרסון ונארוס: הצעה שמתאימה לכל הלקוחות בפלח","שני חלקים: <b>פתרון עירום</b> (Naked solution), מרכיבי המוצר והשירות שכל חברי הפלח מעריכים; ו<b>אופציות לבחירה</b> (Discretionary options), שרק חלק מהם מעריכים, וכל אחת עולה תוספת מחיר.","״כושר פלוס״ מציעה לחברות מנוי בסיס לכל העובדים, ואימון אישי בתוספת תשלום למי שרוצה."]])}`,q:"e8"}
 ]},
 {id:"t5",icon:"target",title:"סימון שוק המטרה",blocks:[
  {h:"פילוח מבוסס צרכים: שבעה שלבים",html:`${def("על מה הנושא",`אחרי שמזהים פלחים, צריך להחליט כמה ואילו מהם לבחור.<br><b>מה נלמד כאן:</b> שבעת השלבים של בסט · חמשת התבחינים לפילוח יעיל · חמשת הכוחות של פורטר · הערכה ובחירה · שיווק מבודל ולא מבודל`)}<p>היום מצרפים כמה משתנים כדי לזהות קבוצות קטנות ומוגדרות יותר. למשל, בנק לא מסתפק ב״מבוגרים עשירים שפרשו״, אלא מבחין ביניהם לפי הכנסה, נכסים, חסכונות והעדפת סיכון. מכאן <b>גישה מבוססת צרכים</b>. רוג׳ר בסט הציע שבעה שלבים (טבלה 6.3):</p><ol><li><b>פילוח מבוסס צרכים</b>: מקבצים לקוחות לפי דמיון בצרכים ובתועלות.</li><li><b>זיהוי פלח</b>: אילו נתונים דמוגרפיים, סגנון חיים והתנהגות מבדילים אותו.</li><li><b>אטרקטיביות</b>: לפי תבחינים קבועים, כמו צמיחה, עצימות תחרות וגישה לשוק.</li><li><b>רווחיות</b> הפלח.</li><li><b>מיצוב</b>: הצעת ערך ואסטרטגיית מיצוב מחיר־מוצר.</li><li><b>מבחן</b>: ״סיפורי פלח״ שבוחנים את אסטרטגיית המיצוב.</li><li><b>תמהיל השיווק</b>: הרחבה למוצר, מחיר, קידום ומקום.</li></ol>${rem("הסדר מתחיל ב<b>צרכים</b>, ורק אחר כך מזהים <b>מי</b> האנשים. ממש כמו הדרך השנייה להגדרת פלחים בנושא הראשון.")}`,q:"e9"},
  {h:"חמישה תבחינים לפילוח יעיל",html:`<p>לא כל פילוח מועיל. אפשר לחלק את קוני המלח לבלונדינים ולחומי שיער, אבל צבע שיער לא רלוונטי לקניית מלח. ואם כולם קונים אותה כמות, חושבים שכל המלח זהה ומוכנים לשלם מחיר אחד, אין כמעט מה לפלח.</p>${tiles([["chart","מדידים","Measurable","אפשר למדוד את הגודל, את כוח הקנייה ואת המאפיינים.",""],["building","גדולים מספיק","Substantial","גדולים ורווחיים מספיק כדי שכדאי לשרת אותם. הפלח צריך להיות הקבוצה ההומוגנית הגדולה ביותר שכדאי לבנות לה תוכנית.",""],["link","נגישים","Accessible","אפשר להגיע אליהם ולשרת אותם ביעילות.",""],["split","ניתנים לבידול","Differentiable","אפשר להבחין ביניהם, והם מגיבים אחרת לתמהיל השיווק. אם רווקות ונשואות מגיבות אותו דבר למבצע בושם, הן לא שני פלחים.",""],["check","מאפשרים פעולה","Actionable","אפשר לבנות תוכניות יעילות כדי למשוך ולשרת כל פלח.",""]])}${ex("עומר מגלה שמתאמנים שמאליים ומתאמנים ימניים מגיבים בדיוק אותו דבר למבצעים. לכן אין טעם לראות בהם שני פלחים: הם לא ניתנים לבידול.")}`,q:"e10"},
  {h:"האטרקטיביות של פלח: חמשת הכוחות של פורטר",html:`<p>מייקל פורטר זיהה <b>חמישה כוחות</b> שקובעים כמה פלח אטרקטיבי. כל כוח הוא איום:</p><div class="tw"><table><tr><th>כוח</th><th>מתי הפלח פחות אטרקטיבי</th></tr><tr><td><b>1. יריבות בתוך הפלח</b></td><td>הרבה מתחרים חזקים; פלח יציב או דועך; עלויות קבועות או חסמי יציאה גבוהים</td></tr><tr><td><b>2. מצטרפים פוטנציאליים</b></td><td>תלוי בחסמי הכניסה והיציאה (ראו למטה)</td></tr><tr><td><b>3. תחליפים</b></td><td>יש תחליפים ממשיים או פוטנציאליים, שמגבילים מחירים ורווחים</td></tr><tr><td><b>4. כוח מיקוח של הקונים</b></td><td>קונים מרוכזים, המוצר חלק גדול מהעלויות שלהם, לא מבודל, עלות מעבר נמוכה</td></tr><tr><td><b>5. כוח מיקוח של הספקים</b></td><td>ספקים מרוכזים, מעט תחליפים, תשומה חשובה, מעבר יקר</td></tr></table></div><p><b>חסמי כניסה ויציאה</b>:</p><div class="tw"><table><tr><th></th><th>יציאה נמוכה</th><th>יציאה גבוהה</th></tr><tr><td><b>כניסה גבוהה</b></td><td><b>הכי אטרקטיבי</b>: מעט נכנסים, והחלשים יוצאים</td><td>רווח גבוה, אבל סיכון גבוה</td></tr><tr><td><b>כניסה נמוכה</b></td><td>תשואות נמוכות אבל יציבות</td><td><b>הכי גרוע</b>: נכנסים בזמנים טובים, ונתקעים בזמנים קשים</td></tr></table></div><p><b>הגנות</b>: מול קונים חזקים, לבחור קונים חלשים יותר, או לפתח הצעה שאי אפשר לסרב לה. מול ספקים חזקים, יחסים שבהם <b>כולם מרוויחים</b> (win-win), או הרבה מקורות אספקה.</p>`,q:"e11"},
  {h:"הערכה ובחירה: שיווק מבודל ולא מבודל",html:`<p>בהערכת פלח בודקים <b>שני דברים</b>: את האטרקטיביות הכוללת שלו (גודל, צמיחה, רווחיות, יתרון לגודל, סיכון נמוך), ואת <b>היעדים והמשאבים של העסק</b>. יש פלחים אטרקטיביים שלא מתאימים ליעדים, או שאין לעסק את הכשירויות לתת בהם ערך עדיף.</p><p><b>רצף רמות הפילוח</b>: בקצה אחד <b>שוק המונים</b> (פלח אחד), בקצה השני <b>יחידים</b> (כל אדם פלח). באמצע: ריבוי פלחים ופלחים בודדים.</p><p><b>שירות שוק מלא</b>: לשרת את כל הקבוצות בכל המוצרים. רק ענקיות יכולות, כמו מיקרוסופט וקוקה־קולה. יש שתי דרכים:</p><div class="tw"><table><tr><th></th><th>שיווק לא מבודל (המונים)</th><th>שיווק מבודל</th></tr><tr><td><b>מה עושים</b></td><td>מתעלמים מההבדלים, הצעה אחת לכל השוק, הפצה ותקשורת המונים</td><td>מוצרים שונים לכל פלח</td></tr><tr><td><b>מתי מתאים</b></td><td>כשלכולם העדפות דומות, ואין פלחים טבעיים</td><td>כשיש הבדלים בין הפלחים</td></tr><tr><td><b>עלויות ומכירות</b></td><td>עלויות נמוכות (קו מוצרים מוגבל). אבל פיצול השוק מייקר את ההגעה להמונים</td><td>בדרך כלל יותר מכירות, אבל גם יותר עלויות</td></tr></table></div>${rem("לגבי הרווחיות של שיווק מבודל, לפי הספר <b>אין תוקף להכללות</b>: המכירות עולות, אבל גם העלויות.")}`,q:"e12"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין חלקי הפרק: בסיסי הפילוח, הפילוח העסקי ובחירת שוק המטרה.`)}${rem("טיפ: כדי לזהות סוג פילוח, שאלו מה המשתנה. מקום: גיאוגרפי. מי האדם: דמוגרפי. איך הוא חושב וחי: פסיכוגרפי. מה הוא עושה עם המוצר: התנהגותי.")}`,q:"ex"}
 ]}

<ul>
<li><b>גיאוגרפי</b>: ארצות עד שכונות. <b>שיווק עממי</b> (רלוונטיות אישית). <b>הקבצה גיאוגרפית</b>: PRIZM, 14 קבוצות ו־66 פלחים, 39 גורמים בחמש קטגוריות. בעד שיווק מקומי: פרסום ארצי ״רחוק מדי״. נגד: עלויות, פחות יתרון לגודל, לוגיסטיקה ותדמית.</li>
<li><b>דמוגרפי</b>: פופולרי כי קשור לצרכים וקל למדידה.
<ul><li><b>גיל ומחזור חיים</b> (Crest, Pampers; ״הצעירים ברוחם״). <b>שלב בחיים</b>: הדאגה העיקרית (גירושין, טיפול בהורה).</li>
<li><b>מגדר</b>: הבדלים בהתנהגות בקנייה, שמצטמצמים. <b>הכנסה</b>: לא תמיד מנבאת. שוק ״שעון חול״ (Levi's).</li>
<li><b>קבוצות דוריות</b>: מילניום (1977–1994), X (1964–1978), בייבי בומרס (1946–1964), הדור השקט (1925–1945).</li>
<li><b>שיווק רב־תרבותי</b>: פנייה ייעודית לפלחים אתניים ותרבותיים.</li></ul></li>
<li><b>פסיכוגרפי</b>: תכונות, סגנון חיים וערכים. אותה דמוגרפיה, דיוקן שונה. <b>VALS</b>: שמונה קבוצות, לפי הנעה (שלוש מוטיבציות) ומשאבים.</li>
<li><b>התנהגותי</b>: ידע, עמדה, שימוש ותגובה.
<ul><li><b>צרכים ותועלות</b>.</li>
<li><b>חמישה תפקידי החלטה</b>: יוזם, משפיע, מחליט, קונה, משתמש (דוגמת ההליכון).</li>
<li><b>הזדמנויות</b> (עסקים, חופשה, משפחה).</li>
<li><b>מעמד משתמש</b>: מובילים מכוונים לפוטנציאליים, קטנים מכוונים למשתמשי המוביל.</li>
<li><b>שיעור שימוש</b>: הכבדים מעטים, אבל צורכים הרבה. לרוב נאמנים מאוד, או לא נאמנים בכלל.</li>
<li><b>שלב מוכנות</b> ומשפך שיווק (46% מול 61%).</li>
<li><b>נאמנות</b>: מושבעים (חוזקות), חצויה (מתחרים), העברה ומחליפים (חולשות). זהירות: נאמנות יכולה להיות הרגל או מחיר.</li>
<li><b>עמדה</b>: נלהבת, חיובית, אדישה, שלילית, עוינת.</li></ul></li>
</ul>
<h3>3. פילוח שווקים עסקיים (טבלה 6.2)</h3>
<ul>
<li>הדמוגרפיים הכי חשובים, אחריהם התפעוליים. חמש קבוצות: דמוגרפיים, תפעוליים, גישות רכש, גורמים מצביים, מאפיינים אישיים.</li>
<li><b>תהליך סדרתי</b>: דוגמת יצרנית האלומיניום (שוק קצה ← יישום ← גודל לקוח ← פלח שמונע משירות).</li>
<li><b>הצעה גמישה</b> (אנדרסון ונארוס): <b>פתרון עירום</b> שכולם מעריכים, ו<b>אופציות לבחירה</b> בתוספת מחיר.</li>
</ul>
<h3>4. סימון שוק המטרה</h3>
<ul>
<li><b>שבעת השלבים של בסט</b> (טבלה 6.3): פילוח לפי צרכים ← זיהוי פלח ← אטרקטיביות ← רווחיות ← מיצוב ← מבחן (״סיפורי פלח״) ← תמהיל שיווק.</li>
<li><b>חמישה תבחינים לפילוח יעיל</b>: מדידים, גדולים מספיק, נגישים, ניתנים לבידול, מאפשרים פעולה. (דוגמת המלח וצבע השיער.)</li>
<li><b>חמשת הכוחות של פורטר</b> (אטרקטיביות פלח): יריבות בפלח, מצטרפים פוטנציאליים, תחליפים, כוח קונים, כוח ספקים. חסמים: כניסה גבוהה ויציאה נמוכה הכי טוב; כניסה נמוכה ויציאה גבוהה הכי גרוע. מול ספקים: win-win או הרבה מקורות.</li>
<li><b>הערכה</b>: אטרקטיביות הפלח + יעדים ומשאבים של העסק.</li>
<li><b>רצף רמות</b>: שוק המונים ← ריבוי פלחים ← פלח בודד ← יחידים.</li>
<li><b>שירות שוק מלא</b> (מיקרוסופט, קוקה־קולה): <b>לא מבודל</b> (הצעה אחת, עלויות נמוכות, מתאים כשההעדפות דומות) או <b>מבודל</b> (מוצר לכל פלח, יותר מכירות ויותר עלויות, אין הכללה על הרווחיות).</li>
</ul>
<div class="key"><b>השורה התחתונה: מה רוצים ממך</b><br>לזהות במקרה את בסיס הפילוח ואת המשתנה; לזהות תפקיד החלטה וקבוצת נאמנות ומה לומדים ממנה; למיין משתני פילוח עסקי; לסדר את שבעת שלבי בסט; לבדוק פילוח לפי חמשת התבחינים; לנתח פלח לפי חמשת הכוחות; ולהבחין בין שיווק מבודל ללא מבודל.</div>`;
if(typeof H!=="undefined")for(const k in H)Q[k]=Object.assign({},H[k],{lv:2});
const isH=id=>Q[id].lv===2;
for(const t of T){t.qids=Object.keys(Q).filter(k=>Q[k].t===t.id&&!isH(k));t.hids=Object.keys(Q).filter(k=>Q[k].t===t.id&&isH(k))}
const HAS_H=T.some(t=>t.hids.length);
const KEY=CONFIG.key;
let S={q:{},read:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.q) S=s;}catch(e){}
S.pos=S.pos||{};S.done=S.done||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.q[id]||(S.q[id]={n:0,c:0,w:0,t:0,lv:-1});
const mastered=id=>(S.q[id]?.c||0)>=2;
const topicPct=t=>Math.round(100*t.qids.filter(mastered).length/t.qids.length);
const topicStarted=t=>S.read[t.id]||S.pos[t.id]!=null||t.qids.some(id=>S.q[id]&&S.q[id].n);
const allIds=Object.keys(Q).filter(id=>!isH(id));
const rnd=t=>S.done[t.id]?(S.done[t.id].k||1)+1:1;
const hardOn=t=>rnd(t)>1&&t.hids.length>0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pickVariant=id=>{const s=st(id),n=Q[id].v.length;return n>1?(s.lv+1)%n:0};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const color=t=>`var(--${t.id})`;
const app=document.getElementById("app");
const LET=["א","ב","ג","ד"];

function qCard(id,onDone,label){
  const vi=pickVariant(id),v=Q[id].v[vi],opts=shuffle([v.a,...v.w]);
  const box=document.createElement("div");box.className="q fade";
  box.innerHTML=(label?`<span class="eyebrow">${label}</span>`:"")+`<div class="qtext">${esc(v.q)}</div>${acrNote(v.q,v.a,...v.w)}<div class="opts"></div>`;
  const wrap=box.querySelector(".opts");
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.a=o===v.a?"1":"";
    b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
    b.onclick=()=>{const ok=o===v.a,s=st(id);s.n++;s.t=Date.now();s.lv=vi;ok?s.c++:(s.c=0,s.w++);save();
      wrap.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.dataset.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=document.createElement("div");fb.className="fb fade "+(ok?"ok":"no");
      fb.innerHTML=`${ic(ok?"check":"x")}<div><strong>${ok?"נכון!":"לא בדיוק"}</strong>${esc(v.e)}</div>`;box.appendChild(fb);
      const nx=document.createElement("button");nx.className="primary";nx.textContent="המשך";nx.style.alignSelf="flex-start";
      nx.onclick=()=>onDone(ok);box.appendChild(nx);nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    };wrap.appendChild(b)});
  return box;
}

function home(){
  document.body.style.removeProperty("--c");if(S.at){delete S.at;save()}
  const started=T.filter(topicStarted);
  const total=Math.round(T.reduce((a,t)=>a+strength(t)*t.qids.length,0)/allIds.length);
  const weak=allIds.filter(id=>S.q[id]&&S.q[id].n&&!mastered(id)).length;
  app.innerHTML=`<div class="stack fade">
   <section class="cover" style="--c:var(--accent)">
    <div class="cover-art">${FIG[CONFIG.cover]()}</div>
    <div class="cover-body">
     <span class="eyebrow">${CONFIG.eyebrow}</span>
     ${CONFIG.badge?`<span class="badge">${CONFIG.badge}</span>`:""}<h1>לומדת חובת קריאה: ${CONFIG.en?`<span dir="ltr" lang="en" class="entitle">${CONFIG.title}</span>`:CONFIG.title}</h1>${CONFIG.en&&CONFIG.he?`<p class="hetitle">${CONFIG.he}</p>`:""}${CONFIG.cite?`<p class="cite" dir="ltr">${CONFIG.cite}</p>`:""}
     ${CONFIG.about?`<p class="about"><b>על מה הלומדה:</b> ${CONFIG.about}</p>`:`<p class="muted">קוראים קטע קצר, עונים על שאלה, ממשיכים. בסוף כל נושא יש מבחן קצר, ובסוף הלומדה מבחן מסכם עם ציון.${HAS_H?" מהסבב השני, המבחנים עוברים לשאלות הבנה: מקרים וסיפורים שצריך לזהות לאיזה רעיון הם שייכים.":""}</p>`}
     <div class="stats">
      <div class="ring" style="--p:${total}"><span>${total}%</span></div>
      <div class="stat-text"><b>${total===0&&!started.length?"עוד לא התחלת":total>=80?"אתה שולט בחומר":`התקדמת ב־${total}% מהשאלות`}</b><span class="muted">${weak?`${weak} שאלות מחכות לחיזוק`:"שאלות שתטעה בהן יחזרו כאן"}</span></div>
     </div>
     <div class="actions">
      <button class="primary review-btn" id="rev" ${started.length?"":"disabled"}>${ic("cycle")}<span>${started.length?"חזרה מהירה":"חזרה מהירה (אחרי נושא ראשון)"}</span></button>
      <button class="review-btn" id="exm">${ic("grad")}<span>מבחן מסכם${S.exam&&HAS_H?" · סבב "+((S.exam.k||1)+1)+": שאלות הבנה":""}${S.exam?` · ציון אחרון ${S.exam.pct}`:""}</span></button>
      <button class="review-btn" id="wk" ${started.length?"":"disabled"}>${ic("target")}<span>נושאים לחיזוק</span></button>
      ${typeof SUM!=="undefined"?`<button class="review-btn" id="sum">${ic("doc")}<span>סיכום הקריאה</span></button>`:""}
      ${CONFIG.podcast?`<button class="review-btn" id="pod"><span aria-hidden="true">🎧</span><span>פודקאסט${CONFIG.podcast.min?` · ${CONFIG.podcast.min} דק׳`:""}</span></button>`:""}
     </div>
     ${CONFIG.podcast?`<div id="podbox" class="podbox" hidden><p class="muted">פודקאסט שנוצר ב־Gemini Notebook מקריאת החובה. כמו כל סיכום אוטומטי, הוא עלול לטעות, והקריאה עצמה קובעת.</p><div class="podframe"></div></div>`:""}
    </div>
   </section>
   <div class="grid" id="list"></div>
   <div class="foot"><a href="../#mkt" style="color:var(--accent);font-weight:700;text-decoration:none">→ לקורס</a><span>${CONFIG.note}</span><button class="ghost" id="reset">איפוס התקדמות</button></div>
  </div>`;
  app.querySelectorAll(".actions svg").forEach(x=>x.style.cssText="width:20px;height:20px");
  const list=app.querySelector("#list");
  T.forEach((t,i)=>{const p=strength(t),pos=S.pos[t.id],dn=S.done[t.id],b=document.createElement("button");b.className="tcard";b.style.setProperty("--c",color(t));
    const status=dn?`✓ הושלם · מבחן ${dn.r}/${dn.n}${t.hids.length?" · הבא: סבב "+rnd(t)+" (הבנה)":""}`:pos!=null?`באמצע · קטע ${pos+1} מתוך ${t.blocks.length}`:S.read[t.id]?"✓ נקרא":topicStarted(t)?"בתהליך":"לא התחלת";
    b.innerHTML=`<div class="band"><span class="n">${i+1}</span>${ic(dn?"check":t.icon)}</div><div class="body"><span class="t">${t.title}</span><div style="flex:1"></div><div class="bar"><i style="width:${dn&&!p?100*dn.r/dn.n:p}%"></i></div><div class="meta"><span>${status}</span><span>${t.blocks.length} קטעים · ${p}%</span></div></div>`;
    if(dn)b.classList.add("done");
    b.onclick=()=>topic(i,pos!=null?pos:0);list.appendChild(b)});
  app.querySelector("#rev").onclick=review;{const sb=app.querySelector("#sum");if(sb)sb.onclick=summary}{const pb=app.querySelector("#pod");if(pb)pb.onclick=()=>{const bx=app.querySelector("#podbox");bx.hidden=!bx.hidden;const f=bx.querySelector(".podframe");if(!bx.hidden&&!f.firstChild)f.innerHTML=`<iframe src="https://drive.google.com/file/d/${CONFIG.podcast.id}/preview" allow="autoplay" title="פודקאסט" loading="lazy"></iframe>`}}app.querySelector("#exm").onclick=exam;app.querySelector("#wk").onclick=weakTopics;
  const rs=app.querySelector("#reset");rs.onclick=()=>{if(rs.dataset.sure){S={q:{},read:{},pos:{},done:{}};save();home()}else{rs.dataset.sure=1;rs.textContent="לחץ שוב כדי לאפס"}};

function bar(title,n,i,label){
  return `<div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">${label}</span></div><div class="steps">${Array.from({length:n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div></div><span class="eyebrow">${title}</span>`;
}

function topic(ti,bi){
  const t=T[ti],blk=t.blocks[bi];document.body.style.setProperty("--c",color(t));
  app.innerHTML=`<div class="stack">${bar(`נושא ${ti+1} · ${t.title}`,t.blocks.length+1,bi,`קטע ${bi+1} מתוך ${t.blocks.length}`)}
   <article class="card fade"><h3>${blk.h}</h3>${acrExpand(blk.html)}</article><div id="slot"></div></div>`;
  S.pos[t.id]=bi;S.at={ti,bi};save();
  app.querySelector("#back").onclick=home;
  const next=()=>{if(bi+1<t.blocks.length)topic(ti,bi+1);else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  if(bi>0){const pb=document.createElement("button");pb.className="ghost";pb.textContent="→ הקטע הקודם";pb.style.marginTop="6px";pb.onclick=()=>topic(ti,bi-1);setTimeout(()=>slot.appendChild(pb))}
  const slot=app.querySelector("#slot");
  {const b=document.createElement("button");b.className="primary";b.textContent=bi+1<t.blocks.length?"המשך":`למבחן הנושא (${t.qids.length} שאלות)`;b.onclick=next;slot.appendChild(b)}
  scrollTo(0,0);
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    app.innerHTML=`<div class="stack">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`;
    app.querySelector("#back").onclick=home;
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);scrollTo(0,0);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

const strength=t=>Math.round(100*t.qids.filter(id=>S.q[id]&&S.q[id].n&&S.q[id].c>0).length/t.qids.length);

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

function exam(){
  const N=Math.min(allIds.length,Math.max(15,Math.min(20,T.length*3)));
  const xh=S.exam&&HAS_H,pools=T.map(t=>xh&&t.hids.length?shuffle(t.hids).concat(shuffle(t.qids)):shuffle(t.qids)),ids=[];
  for(let k=0;ids.length<N;k++)for(const p of pools){if(ids.length>=N)break;if(k<p.length)ids.push(p[k])}
  const items=shuffle(ids).map(id=>{const vi=pickVariant(id),v=Q[id].v[vi];return{id,vi,v,opts:shuffle([v.a,...v.w]),pick:null}});
  document.body.style.setProperty("--c","var(--accent)");
  let i=0;
  const step=()=>{
    const it=items[i],from=T.find(t=>t.id===Q[it.id].t),last=i===items.length-1;
    app.innerHTML=`<div class="stack">${bar(xh?`מבחן מסכם · סבב ${(S.exam.k||1)+1} · שאלות הבנה`:"מבחן מסכם",items.length,i,`שאלה ${i+1} מתוך ${items.length}`)}
     <div class="q fade"><span class="eyebrow">${esc(from.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,...it.v.w)}<div class="opts"></div>
     <div class="row"><button class="primary" id="nx" ${it.pick==null?"disabled":""}>${last?"הגשה ובדיקה":"הבא"}</button>${i?`<button class="ghost" id="pv">הקודם</button>`:""}</div></div></div>`;
    {const bk=app.querySelector("#back");bk.onclick=()=>{if(bk.dataset.sure)home();else{bk.dataset.sure=1;bk.textContent="לחץ שוב כדי לצאת (התשובות לא יישמרו)"}}}
    const wrap=app.querySelector(".opts"),nx=app.querySelector("#nx");
    it.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt"+(it.pick===o?" sel":"");
      b.innerHTML=`<span class="k">${LET[k]}</span><span>${esc(o)}</span>`;
      b.onclick=()=>{it.pick=o;wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");nx.disabled=false};
      wrap.appendChild(b)});
    nx.onclick=()=>{if(last)grade(items);else{i++;step()}};
    const pv=app.querySelector("#pv");if(pv)pv.onclick=()=>{i--;step()};
    scrollTo(0,0);
  };step();
}

function grade(items){
  const now=Date.now();let r=0;const per={};
  items.forEach(it=>{const ok=it.pick===it.v.a,s=st(it.id),tid=Q[it.id].t;s.n++;s.t=now;s.lv=it.vi;ok?(s.c++,r++):(s.c=0,s.w++);
    it.ok=ok;(per[tid]=per[tid]||{r:0,n:0}).n++;if(ok)per[tid].r++});
  const n=items.length,pct=Math.round(100*r/n);S.exam={pct,t:now,k:S.exam?(S.exam.k||1)+1:1};save();
  const rows=T.filter(t=>per[t.id]).map(t=>{const p=per[t.id],q=Math.round(100*p.r/p.n);
    return `<div class="trow" style="--c:${color(t)}"><span class="tt">${esc(t.title)}</span><div class="bar"><i style="width:${q}%"></i></div><span class="sc">${p.r}/${p.n}</span></div>`}).join("");
  const wrong=items.filter(it=>!it.ok);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">ציון המבחן המסכם</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct}"><span>${pct}</span></div><div class="big">${r}/${n}</div></div>
    <p>${pct>=90?"מצוין, אתה שולט בחומר.":pct>=70?"טוב. עבור על הטעויות למטה וחזור על הנושאים החלשים.":"כדאי לחזור על החומר. למטה תמצא את הטעויות, ולכל אחת כפתור לחזרה על הנושא."}</p>
    <h3>לפי נושא</h3><div class="trows">${rows}</div>
    <div class="row"><button class="primary" id="again">מבחן מסכם חדש</button><button id="hm">לכל הנושאים</button></div>
   </article>
   ${wrong.length?`<h3>הטעויות שלך (${wrong.length})</h3>`:`<p class="muted">לא היו טעויות.</p>`}
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  wrong.forEach(it=>{const ti=T.findIndex(t=>t.id===Q[it.id].t),t=T[ti],c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(t));
    c.innerHTML=`<span class="eyebrow">${esc(t.title)}</span><div class="qtext">${esc(it.v.q)}</div>${acrNote(it.v.q,it.v.a,it.pick,it.v.e)}
     <div class="opt wrong" aria-disabled="true"><span class="k">${ic("x")}</span><span><b>התשובה שלך:</b> ${esc(it.pick)}</span></div>
     <div class="opt right" aria-disabled="true"><span class="k">${ic("check")}</span><span><b>התשובה הנכונה:</b> ${esc(it.v.a)}</span></div>
     <div class="fb no">${ic("bulb")}<div><strong>למה?</strong>${esc(it.v.e)}</div></div>
     <div class="row"><button class="primary go">חזרה על הנושא: ${esc(t.title)}</button></div>`;
    c.querySelector(".go").onclick=()=>topic(ti,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#again").onclick=exam;
  scrollTo(0,0);
}

function weakTopics(){
  document.body.style.setProperty("--c","var(--accent)");
  const list=T.map((t,i)=>({t,i,s:strength(t),started:topicStarted(t)})).sort((a,b)=>(a.started-b.started)||(a.s-b.s));
  const lab=x=>!x.started?"עוד לא תרגלת":x.s>=80?"חזק":x.s>=50?"בינוני":"צריך חיזוק";
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <span class="eyebrow">נושאים לחיזוק</span><p class="muted">הנושאים מסודרים מהחלש לחזק, לפי התשובות האחרונות שלך בכל שאלה.</p>
   <div class="stack" id="wl"></div></div>`;
  const wl=app.querySelector("#wl");
  list.forEach(x=>{const c=document.createElement("article");c.className="card rev";c.style.setProperty("--c",color(x.t));
    c.innerHTML=`<div class="trow"><span class="tt">${x.i+1}. ${esc(x.t.title)}</span><div class="bar"><i style="width:${x.s}%"></i></div><span class="sc">${x.started?x.s+"%":"—"}</span></div>
     <span class="tag ${!x.started?"":x.s>=80?"good":x.s>=50?"mid":"low"}">${lab(x)}</span>
     <div class="row"><button class="primary pr">תרגול שאלות הנושא</button><button class="rd">קריאה חוזרת</button></div>`;
    c.querySelector(".pr").onclick=()=>practice(x.i);c.querySelector(".rd").onclick=()=>topic(x.i,0);wl.appendChild(c)});
  app.querySelector("#back").onclick=home;scrollTo(0,0);
}

function done(r,n,ti){
  if(ti!=null){const o=S.done[T[ti].id];S.done[T[ti].id]={r,n,k:o?(o.k||1)+1:1};}if(S.at){delete S.at}save();
  const nextT=ti!=null&&ti+1<T.length?ti+1:null,pct=Math.round(100*r/n);
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button></div></div>
   <article class="card" style="align-items:flex-start">
    <span class="eyebrow">${ti!=null?`סיום נושא ${ti+1} · ${T[ti].title}`:"סיום חזרה מהירה"}</span>
    <div class="row" style="gap:18px"><div class="ring" style="--p:${pct};--accent:var(--c)"><span>${pct}%</span></div><div class="big">${r}/${n}</div></div>
    <p>${r===n?"מצוין, הכל נכון.":r>=n*0.7?"טוב מאוד. מה שטעית בו יחזור בחזרה המהירה, בניסוח אחר.":"כדאי לעבור שוב על הנושא. השאלות שטעית בהן יחזרו בחזרה המהירה."}</p>
    <div class="row">${nextT!=null?`<button class="primary" id="nx" style="--c:${color(T[nextT])}">לנושא הבא: ${T[nextT].title}</button>`:""}<button id="hm">לכל הנושאים</button></div>
   </article></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;
  const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>topic(nextT,0);
  scrollTo(0,0);
}
function summary(sec){
  document.body.style.setProperty("--c","var(--accent)");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">סיכום הקריאה</span></div></div>
   <article class="card sum">${acrExpand(SUM)}</article>
   <div class="row"><button class="primary" id="hm">חזרה לכל הנושאים</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;scrollTo(0,0);if(sec){const h=[...app.querySelectorAll(".sum h3")].find(x=>x.textContent.trim().startsWith(sec+"."));if(h)h.scrollIntoView()}
}
function absView(){
  document.body.style.setProperty("--c","var(--accent)");
  const tmp=document.createElement("div");tmp.innerHTML=SUM;const a=tmp.querySelector("#abs");
  app.innerHTML=`<div class="stack fade"><div class="topbar"><div class="topline"><button class="ghost" id="back">→ כל הנושאים</button><span class="prog">כותרת ותקציר</span></div></div>
   <article class="card sum"><h2>${CONFIG.title}: כותרת ותקציר</h2><div class="key">לתרגול הזה קוראים <b>רק את הכותרת והתקציר</b>. זה מה שיש בעמוד הזה. הסיכום המלא של המאמר נמצא בכפתור ״סיכום הקריאה״ בלומדה.</div>${a?acrExpand(a.innerHTML):""}</article>
   <div class="row"><button class="primary" id="hm">ללומדה</button><button id="full">לסיכום המלא</button></div></div>`;
  app.querySelector("#back").onclick=home;app.querySelector("#hm").onclick=home;app.querySelector("#full").onclick=()=>summary();scrollTo(0,0);
}
const _h=location.hash;if(_h)history.replaceState(null,"",location.pathname+location.search);if(_h==="#abs"&&typeof SUM!=="undefined"&&SUM.includes('id="abs"'))absView();else if(_h.startsWith("#sum")&&typeof SUM!=="undefined")summary(+_h.slice(5)||0);else if(_h.startsWith("#topic-")&&T[+_h.slice(7)-1])topic(+_h.slice(7)-1,0);else if(_h==="#quiz")exam();else if(S.at&&T[S.at.ti]){const a=S.at;if(a.quiz)quiz(a.ti);else topic(a.ti,Math.min(a.bi||0,T[a.ti].blocks.length-1))}else home();
</script>
<script src="../_engine/ai-config.js"></script><script src="../_engine/ai.js"></script>
</body>
