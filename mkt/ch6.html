<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>לומדת חובת קריאה: זיהוי פלחי שוק ושוקי מטרה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Structure and motion shared by every style. Skins set tokens and surface treatment. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs,18px);font-weight:400;line-height:1.75;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:var(--hw,700)}
p{margin:0}
a{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
mark{background:linear-gradient(transparent 40%,var(--mark) 40%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 2px;font-weight:600}
svg{flex:none}
button{font:inherit;cursor:pointer;border-radius:var(--r-btn);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
button svg{width:18px;height:18px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
button:not([disabled]):active{transform:scale(.98)}
.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff);font-weight:600}
.primary:not([disabled]):hover{filter:brightness(1.08)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 4px}
.ghost:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);color:var(--c,var(--muted))}
.badge{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.entitle{display:block;unicode-bidi:isolate;text-align:right;font-family:var(--latin,var(--body))}
.hetitle{font-weight:600;font-size:1.08rem;color:var(--muted)}
.cite{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent)}

/* crumbs */
.crumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--accent)}
.crumbs span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}

/* module home */
.mod-home{display:flex;flex-direction:column;gap:20px}
.mhero{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.mhero-art{background:var(--art-bg,var(--raised));border-bottom:var(--bw) solid var(--line);padding:10px 10px 0}
.mhero-art svg{display:block;width:100%;height:auto;max-height:200px}
.mhero-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.mhero h1{font-size:clamp(1.7rem,5vw,2.3rem)}
.h1pre{display:block;font-family:var(--body);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:var(--track,.02em);margin-bottom:6px}
.about{line-height:1.7}
.progress-panel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 20px}
.pp-text{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.pp-text b{font-size:1.05rem}.pp-text span{font-size:.9rem;color:var(--muted)}
.big-cta{padding:13px 20px}
@media (max-width:560px){.progress-panel{grid-template-columns:auto 1fr}.big-cta{grid-column:1/-1}}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--track-bg,var(--line)) 0);display:grid;place-items:center;flex:none;transition:--p 1s cubic-bezier(.2,.7,.2,1)}
.ring>span{width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center}
.ring b{font-weight:700;font-size:.95rem}.ring small{font-size:.62rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{justify-content:flex-start;text-align:right;gap:12px;padding:14px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s);align-items:center}
.tool .ti,.pod-head .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));color:var(--accent);flex:none}
.tool .ti svg,.pod-head .ti svg{width:21px;height:21px}
.tool .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tool b{font-size:.98rem;font-weight:600}.tool small{font-size:.8rem;color:var(--muted)}
.tool:not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.podbox{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.podbox:not([hidden]){animation:drop var(--dur-l) var(--ease) both}
.pod-head{display:flex;gap:12px;align-items:flex-start}
.pod-head div{display:flex;flex-direction:column;line-height:1.45}
.pod-head small{font-size:.8rem;color:var(--muted)}
.podframe iframe{width:100%;height:96px;border:0;border-radius:var(--r-btn);display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:1.35rem}.sec-h span{font-size:.85rem;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--list-gap,8px)}
.trow-btn{width:100%;display:grid;grid-template-columns:auto 1fr minmax(90px,26%);gap:14px;align-items:center;text-align:right;padding:14px 16px;border-radius:var(--r-card-s);background:var(--surface);box-shadow:var(--shadow-s)}
.trow-btn:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.tn{width:34px;height:34px;border-radius:var(--r-icon);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c)}
.tn svg{width:20px;height:20px}
.trow-btn.done .tn{background:var(--c);color:var(--on-accent,#fff)}
.tb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.tb b{font-weight:600}.tb small{font-size:.8rem;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:.75rem;color:var(--muted);text-align:left}
@media (max-width:520px){.trow-btn{grid-template-columns:auto 1fr}.tm{grid-column:2}}
.bar{display:block;height:6px;background:var(--track-bg,var(--line));border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:inherit}
.trow .bar i{width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.trow .bar i.go{width:var(--w)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);border-top:var(--bw) solid var(--line);padding-top:14px}
.foot a{font-weight:600;text-decoration:none}

/* reading */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:8px 10px;margin-inline:-6px;padding-inline:6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--r-pill);background:var(--track-bg,var(--line));position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform var(--dur-l) var(--ease)}
.steps i.on::after{transform:none}
.steps i.now::after{animation:fill var(--dur-l) var(--ease) both}
.prog{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin-top:-6px}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:14px}
.page .ph{font-size:1.45rem;color:var(--c)}
.card h3{font-size:1.2rem;color:var(--c)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager .primary{padding:13px 22px}
.fig{background:var(--raised);border-radius:var(--r-card-s);padding:10px;margin-inline:-4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px}
figure{margin:0}
.def{border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-inline-start:3px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface));border-radius:var(--r-card-s);padding:14px 16px}
.lbl{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:var(--track,.02em);color:var(--c);margin-bottom:4px}
.who{display:flex;gap:12px;align-items:flex-start}
.who .av{flex:none;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.who .yr{font-size:.8rem;color:var(--muted)}
.lec{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r-pill);padding:2px 10px;margin:0 0 8px}.lec svg{width:14px;height:14px}
.cpt{border:var(--bw) solid var(--line);border-inline-start:3px solid var(--c,var(--accent));border-radius:var(--r-card-s);padding:14px 16px;margin:12px 0;background:var(--surface)}
.cpt-h{display:flex;gap:10px;align-items:center;font-size:1.05rem}.cpt-h svg{width:24px;height:24px;color:var(--c,var(--accent))}
.cpt p{margin:.5rem 0 .7rem;line-height:1.75}.cpt p.cpt-d{font-weight:600;margin-bottom:.3rem}
.cpt-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 12px;line-height:1.7;font-size:.96rem}.cpt-ex b{color:var(--c,var(--accent))}
.tiles>.cpt{grid-column:1/-1;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--raised);border-radius:var(--r-card-s);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:28px;height:28px;color:var(--c)}
.tile b{font-size:.98rem;font-weight:600}
.tile span{font-size:.88rem;color:var(--muted);line-height:1.5}
.ex{background:var(--raised);border-radius:var(--r-card-s);padding:12px 14px;font-size:.96rem}
.ex .lbl{color:var(--muted)}
.yesno{display:flex;flex-wrap:wrap;gap:8px}
.yn{padding:5px 12px;border-radius:var(--r-pill);font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--bad-soft);color:var(--bad)}
.spectrum{display:flex;flex-direction:column;gap:6px}
.spectrum .track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));position:relative}
.spectrum .dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.spectrum .ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:10px}
.remember{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;border-top:1px dashed var(--line);padding-top:12px}
.remember svg{width:22px;height:22px;color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card-s);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl th{background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--c);font-weight:700;font-size:.85rem}
.tbl .in{color:var(--c);font-weight:700}.tbl .out{color:var(--muted);font-weight:700}
.tblwrap,.tw{overflow-x:auto}
.card table:not(.tbl){border-collapse:collapse;width:100%;font-size:.93rem}
.card table:not(.tbl) th,.card table:not(.tbl) td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.card table:not(.tbl) th{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.en{font-size:.82em;color:var(--muted);font-weight:500;direction:ltr;unicode-bidi:isolate}
.ak{white-space:nowrap}
.acr{font-size:.82em;color:var(--muted)}
.acrnote{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));border-radius:var(--r-btn);padding:8px 12px;line-height:1.6}

/* term cards: name only, tap for the explanation */
.terms{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.terms-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.terms-count{font-variant-numeric:tabular-nums;background:var(--raised);border-radius:var(--r-pill);padding:1px 10px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.term-grid[data-n="1"]{grid-template-columns:1fr}
.term-grid[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.term-grid[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.term-grid[data-n="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.term-grid[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.term-grid[data-n="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:right;gap:10px;min-height:104px;padding:14px 14px 16px;border-radius:var(--r-card-s);background:var(--term-bg,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 22%,var(--line));box-shadow:var(--shadow-s)}
.term-grid[data-n="1"] .term{flex-direction:row;align-items:center;min-height:0}
.term:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.term-ic{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);flex:none;transition:inherit}
.term-ic svg{width:22px;height:22px}
.term-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline-end:22px}
.term-name{font-weight:700;font-size:1.02rem;line-height:1.3}
.term-en{font-size:.76rem;color:var(--muted);font-weight:500;text-align:right;unicode-bidi:isolate}
.term-go{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--c);display:grid;place-items:center;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.term-go::before{content:"+";font-weight:700;font-size:15px;line-height:1}
.term.seen .term-go{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.term.seen .term-go::before{content:"✓";font-size:12px}
.term[aria-expanded="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.term[aria-expanded="true"] .term-ic{background:rgba(255,255,255,.18);color:#fff}
.term[aria-expanded="true"] .term-en{color:rgba(255,255,255,.8)}
.term[aria-expanded="true"] .term-go{background:rgba(255,255,255,.22);color:#fff;transform:rotate(45deg)}
.term[aria-expanded="true"] .term-go::before{content:"+";font-size:15px}
.term-panel{display:grid;grid-template-rows:1fr}
.tp-in{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--c) 5%,var(--surface));border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:3px solid var(--c);border-radius:var(--r-card-s);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tp-head{display:flex;gap:12px;align-items:center}
.tp-title{flex:1;display:flex;flex-direction:column;min-width:0}
.tp-title h4{font-size:1.2rem;color:var(--c);font-family:var(--display)}
.tp-x{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--muted);background:var(--surface)}
.tp-body{display:flex;flex-direction:column;gap:10px;line-height:1.8}
.tp-body p{margin:0}
.td-lead,.tp-body .cpt-d{font-weight:600}
.tp-body .cpt-ex{background:var(--surface)}
.tp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:.84rem;color:var(--muted)}
.tp-next{padding:8px 14px;font-size:.9rem;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tp-next:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tp-done{color:var(--good);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .enter .term{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + 200ms)}
  .term-panel.show{animation:open var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*{animation:rise var(--dur-l) var(--ease) both}
  .term-panel.show .tp-body>*:nth-child(2){animation-delay:60ms}
  .term-panel.show .tp-body>*:nth-child(3){animation-delay:120ms}
}

/* mind map */
.mm-cta{justify-content:flex-start;text-align:right;gap:12px;padding:14px 16px;border-radius:var(--r-card-s);border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.mm-cta .ti{width:40px;height:40px;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mm-cta .ti svg{width:22px;height:22px}
.mm-cta .tt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.mm-cta small{font-size:.8rem;color:var(--muted)}
.mm-cta>svg{color:var(--c)}
.mm-cta:hover{border-style:solid;border-color:var(--c)}
.mm-head h2{font-size:1.7rem;margin:2px 0 4px}
.mm-head p{font-size:.9rem}
.mm-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-height:28px}
.mm-crumbs button{padding:3px 12px;border-radius:var(--r-pill);font-size:.85rem;font-weight:600}
.mm-crumbs b{color:var(--ink)}
.mm{position:relative;height:clamp(460px,62vw,560px);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:22px 22px}
.mm-lines{position:absolute;inset:0;width:100%;height:100%}

@keyframes mmIn{from{left:50%;top:50%;opacity:0;transform:translate(-50%,-50%) scale(.4)}}

/* flashcards */
.fc-stage{perspective:1400px}
.fc{display:grid;width:100%;padding:0;border:none;background:none;box-shadow:none;border-radius:var(--r-card);transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.2,.4,1)}
.fc:not([disabled]):active{transform:scale(.99)}

.fc-face{grid-area:1/1;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:32px 28px;border-radius:var(--r-card);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow)}
.fc-front{background:var(--c);color:#fff}
.fc-back{background:var(--surface);border:var(--bw) solid color-mix(in srgb,var(--c) 30%,var(--line));border-top:4px solid var(--c);transform:rotateY(180deg);align-items:stretch;text-align:right;justify-content:flex-start}
.fc-topic{font-size:.8rem;font-weight:600;letter-spacing:var(--track,.02em);opacity:.85}
.fc-back .fc-topic{color:var(--c);opacity:1;font-size:1.1rem;font-family:var(--display);font-weight:700}
.fc-term{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.2;text-wrap:balance}
.fc-q{font-size:1.02rem;opacity:.9}
.fc-hint{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:.82rem;background:rgba(255,255,255,.16);border-radius:var(--r-pill);padding:5px 12px}
.fc-hint svg{width:15px;height:15px}
.fc-ans{font-size:1.05rem;line-height:1.85}
.fc-ex{background:var(--raised);border-radius:var(--r-btn);padding:10px 14px;font-size:.95rem;line-height:1.7}
.fc-ex b{color:var(--c)}
.fc-actions{min-height:56px;display:flex;justify-content:center;align-items:center}
.fc-tip{font-size:.88rem;color:var(--muted);text-align:center}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.fc-btns button{padding:14px;font-weight:600}
.fc-no{background:var(--surface);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.fc-no:hover{background:var(--bad-soft)}
.fc-yes{--c:var(--good)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
@media (prefers-reduced-motion:no-preference){.fc-btns{animation:rise var(--dur-l) var(--ease) both}}

/* questions */
.q{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}

.opt{justify-content:flex-start;text-align:right;line-height:1.5;gap:12px;align-items:flex-start;padding:13px 14px;background:var(--opt-bg,var(--raised));border:var(--bw-opt,1.5px) solid var(--opt-line,transparent);border-radius:var(--r-opt)}
.opt .k{flex:none;width:28px;height:28px;border-radius:var(--r-k);background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c,var(--accent));transition:inherit}

.opt.sel{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--surface))}
.opt.sel .k{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-accent,#fff)}
.answered .opt:not(.right):not(.wrong){opacity:.55}
.opt[disabled]{opacity:1}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[aria-disabled]{cursor:default}
.fb{display:grid;grid-template-rows:1fr;border-radius:var(--r-card-s);border-inline-start:3px solid;font-size:.96rem}

.fb.ok{background:var(--good-soft);border-color:var(--good)}.fb.ok strong{color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}.fb.no strong{color:var(--bad)}
.next{align-self:flex-start}
.ckq{border-style:dashed;border-color:color-mix(in srgb,var(--c,var(--accent)) 45%,var(--line));box-shadow:none}
.cknote{font-size:.86rem;color:var(--muted)}

/* results */
.score{align-items:stretch}
.score-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score .ring{width:112px;height:112px}
.score .ring b{font-size:1.9rem;font-family:var(--display)}
.big{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:6px}

/* summary */
.card.sum{gap:6px;align-items:stretch}

.card.sum p,.card.sum li{line-height:1.8}
.card.sum ul,.card.sum ol{margin:4px 0;padding-inline-start:22px}
.card.sum .key{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-inline-start:3px solid var(--accent);border-radius:var(--r-btn);padding:10px 14px;margin:8px 0}
.card.sum .trap{background:var(--bad-soft);border-inline-start:3px solid var(--bad);border-radius:var(--r-btn);padding:10px 14px;margin:8px 0}

/* svg figure classes */
.s-line{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-c{stroke:var(--c);stroke-width:2;fill:none}
.f-c{fill:var(--c)}
.f-soft{fill:color-mix(in srgb,var(--c) 16%,var(--surface))}
.f-surf{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)}
.f-inv{fill:var(--surface)}
svg text{font-family:var(--body)}
.ai-fab{font-family:var(--body)!important;background:var(--fab-bg,var(--ink))!important;border-radius:var(--r-pill)!important}

/* motion */
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(var(--dist))}to{opacity:1;transform:none}}
@keyframes inFwd{from{opacity:0;transform:translateX(calc(var(--dist) * -2))}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(calc(var(--dist) * 2))}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes open{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
@keyframes check{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
  .enter.up>*{animation:rise var(--dur-l) var(--ease) both}
  .enter.up>*:nth-child(2){animation-delay:40ms}.enter.up>*:nth-child(3){animation-delay:80ms}.enter.up>*:nth-child(4){animation-delay:120ms}.enter.up>*:nth-child(5){animation-delay:160ms}.enter.up>*:nth-child(n+6){animation-delay:200ms}
  .enter.fwd .card,.enter.fwd .q,.enter.fwd #slot{animation:inFwd var(--dur-l) var(--ease) both}
  .enter.back .card,.enter.back .q,.enter.back #slot{animation:inBack var(--dur-l) var(--ease) both}
  .enter.back.mod-home>*{animation:rise var(--dur-l) var(--ease) both}
  .enter .tool,.enter .tlist li,.card.rev{animation:rise var(--dur-l) var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + 120ms)}
  .enter .opt:not([aria-disabled]){animation:rise var(--dur) var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 140ms)}
  .answered .opt.right{animation:pop .4s var(--ease)}
  .answered .opt.wrong{animation:shake .38s ease-out}
  .answered .opt.right .k path:last-child{stroke-dasharray:24;animation:check .35s .1s ease-out both}
  .fb{animation:open var(--dur-l) var(--ease) both}
  .next{animation:rise var(--dur) var(--ease) .12s both}
}

function acrExpand(html){

}

 {id:"t3",icon:"brain",title:"פילוח פסיכוגרפי והתנהגותי",blocks:[
  {h:"פילוח פסיכוגרפי ו־VALS",html:`${def("על מה הנושא",`לא רק מי הלקוחות, אלא איך הם חושבים ואיך הם מתנהגים כלפי המוצר.<br><b>מה נלמד כאן:</b> פסיכוגרפיה ו־VALS · צרכים ותועלות · חמישה תפקידי החלטה · הזדמנויות, מעמד ושיעור שימוש · שלב מוכנות ומשפך · נאמנות ועמדה`)}${def("מושג מפתח",`<mark>פסיכוגרפיה</mark> ${E("Psychographics")}: המדע שמשתמש בפסיכולוגיה ובדמוגרפיה כדי להבין טוב יותר את הצרכנים. בפילוח פסיכוגרפי מחלקים לפי תכונות פסיכולוגיות או אישיות, סגנון חיים או ערכים.`)}${rem("לאנשים מאותה קבוצה דמוגרפית יכול להיות דיוקן פסיכוגרפי שונה לגמרי.")}<p><b>VALS</b> (״ערכים וסגנונות חיים״, של SBI) היא מערכת סיווג מסחרית פופולרית:</p><ul><li>מסווגת את הבוגרים בארה״ב ל<b>שמונה קבוצות</b>, לפי שאלון של 4 שאלות דמוגרפיות ו־35 שאלות על עמדות.</li><li>שני ממדים: <b>הנעת הצרכן</b> (שלוש מוטיבציות עיקריות) ו<b>משאבי הצרכן</b>, שמחזקים או מגבילים את הביטוי של המוטיבציה.</li><li>מתעדכנת מיותר מ־80,000 סקרים בשנה.</li></ul>${ex("שני גברים בני 35 עם אותה הכנסה: אחד מתאמן כדי להתחרות, השני כדי לפגוש חברים. הדמוגרפיה זהה, הדיוקן הפסיכוגרפי שונה.")}`,q:"e5"},
  {h:"פילוח התנהגותי: צרכים, תפקידים ושימוש",html:`${def("מושג מפתח",`<mark>פילוח התנהגותי</mark> ${E("Behavioral segmentation")}: חלוקה לפי הידע על המוצר, העמדה כלפיו, השימוש בו או התגובה אליו. המשתנים: צרכים או תועלות, תפקידי החלטה, ומשתנים של משתמשים ושימושים.`)}<p><b>צרכים ותועלות</b>: לא כל הקונים מצפים לאותן תועלות. פילוח לפי צרכים מזהה פלחים עם השלכות שיווקיות ברורות.</p><p><b>חמישה תפקידי החלטה</b>: <b>יוזם, משפיע, מחליט, קונה ומשתמש</b>.</p>${ex("בדוגמת הספר: האישה מבקשת הליכון ליום ההולדת (יוזמת), חבר שיש לו הליכון ממליץ (משפיע), היא בוחרת את הדגם (מחליטה), הבעל קונה (קונה), וכל המשפחה משתמשת (משתמשים).")}<p><b>משתנים של משתמשים ושימוש</b>, שהם נקודת מוצא טובה לפילוח:</p>${tiles([["clock","הזדמנויות","Occasions: מתי מתעורר הצורך, קונים או משתמשים","זמן ביום, בשבוע או בשנה. למשל, טיסה לנסיעת עסקים, לחופשה או למשפחה. פילוח כזה יכול להרחיב את השימוש במוצר.","״כושר פלוס״ מציעה מנוי מיוחד לחודשים שלפני החתונה."],["id","מעמד המשתמש","User status: לא משתמש, לשעבר, פוטנציאלי, ראשון, קבוע","כדי למשוך לא משתמשים צריך להבין למה הם לא משתמשים: אמונות מושרשות, או חוסר ידע. <b>מובילי השוק</b> מתמקדים במשתמשים <b>פוטנציאליים</b>, כי מהם אפשר להרוויח הכי הרבה. <b>עסקים קטנים</b> מנסים למשוך את המשתמשים <b>של המוביל</b>.",""]])}`,q:"e6"},
  {h:"שיעור שימוש, שלב מוכנות, נאמנות ועמדה",html:`${tiles([["chart","שיעור השימוש","Usage rate: קלים, בינוניים וכבדים","המשתמשים הכבדים הם נתח קטן מהשוק, אבל אחראים לחלק גדול מהצריכה. משווקים מעדיפים משתמש כבד אחד על כמה קלים. הבעיה: הכבדים לרוב נאמנים מאוד למותג אחד, או לא נאמנים לאף מותג ומחפשים את הזול.",""],["target","שלב המוכנות של הקונה","Buyer-readiness: מלא מודע ועד מתכוון לקנות","משתמשים ב<b>משפך שיווק</b> כדי לחלק את השוק לפי השלב. באיור 6.2, מותג א מצליח פחות להפוך מנסים חד־פעמיים למשתמשים לאחרונה: 46% לעומת 61% במותג ב. קמפיין יכול לטפל בזה, למשל בהפרכת אמונות שגויות.",""]])}<p><b>מצב נאמנות</b>: ארבע קבוצות.</p><div class="tw"><table><tr><th>קבוצה</th><th>מי הם</th><th>מה לומדים מהם</th></tr><tr><td><b>נאמנים מושבעים</b></td><td>תמיד מותג אחד</td><td>את <b>החוזקות</b> של המוצר</td></tr><tr><td><b>נאמנות חצויה</b></td><td>נאמנים לשניים או שלושה מותגים</td><td>מי <b>המתחרים</b> החזקים</td></tr><tr><td><b>העברת נאמנות</b></td><td>עוברים ממותג למותג</td><td rowspan="2"><b>חולשות</b> שאפשר לתקן</td></tr><tr><td><b>מחליפים</b></td><td>לא נאמנים לשום מותג</td></tr></table></div>${rem("זהירות: מה שנראה כמו נאמנות יכול להיות גם הרגל, אדישות, מחיר זול, עלות מעבר גבוהה, או שאין מותג אחר זמין.")}<p><b>עמדה</b>: חמש עמדות: נלהבת, חיובית, אדישה, שלילית ועוינת. בקמפיין פוליטי מודים לנלהבים ומזכירים להם להצביע, מחזקים את החיוביים, מנסים לזכות באדישים, ולא מבזבזים זמן על השליליים והעוינים.</p>`,q:"e7"}
 ]},
 {id:"t4",icon:"factory",title:"פילוח שווקים עסקיים",blocks:[
  {h:"משתני הפילוח העסקי והצעה גמישה",html:`${def("על מה הנושא",`גם שווקים עסקיים מפלחים, עם חלק מאותם משתנים ועוד משתנים משלהם.<br><b>מה נלמד כאן:</b> חמש קבוצות משתנים · פילוח בתהליך סדרתי · פתרון עירום ואופציות`)}<p>בשווקים עסקיים משתמשים בחלק ממשתני הצרכנים (גיאוגרפיה, תועלות, קצב שימוש) ובעוד משתנים. <b>הדמוגרפיים הם החשובים ביותר</b>, ואחריהם התפעוליים. טבלה 6.2 מסדרת אותם כשאלות:</p><div class="tw"><table><tr><th>קבוצה</th><th>משתנים</th></tr><tr><td><b>דמוגרפיים</b></td><td>ענף, גודל חברה, מיקום</td></tr><tr><td><b>תפעוליים</b></td><td>טכנולוגיה, מעמד משתמש, יכולות לקוח</td></tr><tr><td><b>גישות רכש</b></td><td>ארגון הרכש, מבנה הכוח, אופי היחסים, מדיניות רכש, תבחיני רכישה</td></tr><tr><td><b>גורמים מצביים</b></td><td>דחיפות, יישום ייחודי, גודל הזמנה</td></tr><tr><td><b>מאפיינים אישיים</b></td><td>דמיון בין קונה למוכר, עמדות כלפי סיכון, נאמנות</td></tr></table></div><p><b>תהליך סדרתי</b>: יצרנית אלומיניום בחרה קודם שוק משתמשי קצה (בנייה למגורים, ולא רכב או פחיות), אחר כך יישום (רכיבים לבנייה), אחר כך גודל לקוח (גדולים), ולבסוף את הפלח שמונע בעיקר מ<b>שירות</b>, כי זה החוזק שלה.</p>${tiles([["copies","הצעה שיווקית גמישה","אנדרסון ונארוס: הצעה שמתאימה לכל הלקוחות בפלח","שני חלקים: <b>פתרון עירום</b> (Naked solution), מרכיבי המוצר והשירות שכל חברי הפלח מעריכים; ו<b>אופציות לבחירה</b> (Discretionary options), שרק חלק מהם מעריכים, וכל אחת עולה תוספת מחיר.","״כושר פלוס״ מציעה לחברות מנוי בסיס לכל העובדים, ואימון אישי בתוספת תשלום למי שרוצה."]])}`,q:"e8"}
 ]},
 {id:"t5",icon:"target",title:"סימון שוק המטרה",blocks:[
  {h:"פילוח מבוסס צרכים: שבעה שלבים",html:`${def("על מה הנושא",`אחרי שמזהים פלחים, צריך להחליט כמה ואילו מהם לבחור.<br><b>מה נלמד כאן:</b> שבעת השלבים של בסט · חמשת התבחינים לפילוח יעיל · חמשת הכוחות של פורטר · הערכה ובחירה · שיווק מבודל ולא מבודל`)}<p>היום מצרפים כמה משתנים כדי לזהות קבוצות קטנות ומוגדרות יותר. למשל, בנק לא מסתפק ב״מבוגרים עשירים שפרשו״, אלא מבחין ביניהם לפי הכנסה, נכסים, חסכונות והעדפת סיכון. מכאן <b>גישה מבוססת צרכים</b>. רוג׳ר בסט הציע שבעה שלבים (טבלה 6.3):</p><ol><li><b>פילוח מבוסס צרכים</b>: מקבצים לקוחות לפי דמיון בצרכים ובתועלות.</li><li><b>זיהוי פלח</b>: אילו נתונים דמוגרפיים, סגנון חיים והתנהגות מבדילים אותו.</li><li><b>אטרקטיביות</b>: לפי תבחינים קבועים, כמו צמיחה, עצימות תחרות וגישה לשוק.</li><li><b>רווחיות</b> הפלח.</li><li><b>מיצוב</b>: הצעת ערך ואסטרטגיית מיצוב מחיר־מוצר.</li><li><b>מבחן</b>: ״סיפורי פלח״ שבוחנים את אסטרטגיית המיצוב.</li><li><b>תמהיל השיווק</b>: הרחבה למוצר, מחיר, קידום ומקום.</li></ol>${rem("הסדר מתחיל ב<b>צרכים</b>, ורק אחר כך מזהים <b>מי</b> האנשים. ממש כמו הדרך השנייה להגדרת פלחים בנושא הראשון.")}`,q:"e9"},
  {h:"חמישה תבחינים לפילוח יעיל",html:`<p>לא כל פילוח מועיל. אפשר לחלק את קוני המלח לבלונדינים ולחומי שיער, אבל צבע שיער לא רלוונטי לקניית מלח. ואם כולם קונים אותה כמות, חושבים שכל המלח זהה ומוכנים לשלם מחיר אחד, אין כמעט מה לפלח.</p>${tiles([["chart","מדידים","Measurable","אפשר למדוד את הגודל, את כוח הקנייה ואת המאפיינים.",""],["building","גדולים מספיק","Substantial","גדולים ורווחיים מספיק כדי שכדאי לשרת אותם. הפלח צריך להיות הקבוצה ההומוגנית הגדולה ביותר שכדאי לבנות לה תוכנית.",""],["link","נגישים","Accessible","אפשר להגיע אליהם ולשרת אותם ביעילות.",""],["split","ניתנים לבידול","Differentiable","אפשר להבחין ביניהם, והם מגיבים אחרת לתמהיל השיווק. אם רווקות ונשואות מגיבות אותו דבר למבצע בושם, הן לא שני פלחים.",""],["check","מאפשרים פעולה","Actionable","אפשר לבנות תוכניות יעילות כדי למשוך ולשרת כל פלח.",""]])}${ex("עומר מגלה שמתאמנים שמאליים ומתאמנים ימניים מגיבים בדיוק אותו דבר למבצעים. לכן אין טעם לראות בהם שני פלחים: הם לא ניתנים לבידול.")}`,q:"e10"},
  {h:"האטרקטיביות של פלח: חמשת הכוחות של פורטר",html:`<p>מייקל פורטר זיהה <b>חמישה כוחות</b> שקובעים כמה פלח אטרקטיבי. כל כוח הוא איום:</p><div class="tw"><table><tr><th>כוח</th><th>מתי הפלח פחות אטרקטיבי</th></tr><tr><td><b>1. יריבות בתוך הפלח</b></td><td>הרבה מתחרים חזקים; פלח יציב או דועך; עלויות קבועות או חסמי יציאה גבוהים</td></tr><tr><td><b>2. מצטרפים פוטנציאליים</b></td><td>תלוי בחסמי הכניסה והיציאה (ראו למטה)</td></tr><tr><td><b>3. תחליפים</b></td><td>יש תחליפים ממשיים או פוטנציאליים, שמגבילים מחירים ורווחים</td></tr><tr><td><b>4. כוח מיקוח של הקונים</b></td><td>קונים מרוכזים, המוצר חלק גדול מהעלויות שלהם, לא מבודל, עלות מעבר נמוכה</td></tr><tr><td><b>5. כוח מיקוח של הספקים</b></td><td>ספקים מרוכזים, מעט תחליפים, תשומה חשובה, מעבר יקר</td></tr></table></div><p><b>חסמי כניסה ויציאה</b>:</p><div class="tw"><table><tr><th></th><th>יציאה נמוכה</th><th>יציאה גבוהה</th></tr><tr><td><b>כניסה גבוהה</b></td><td><b>הכי אטרקטיבי</b>: מעט נכנסים, והחלשים יוצאים</td><td>רווח גבוה, אבל סיכון גבוה</td></tr><tr><td><b>כניסה נמוכה</b></td><td>תשואות נמוכות אבל יציבות</td><td><b>הכי גרוע</b>: נכנסים בזמנים טובים, ונתקעים בזמנים קשים</td></tr></table></div><p><b>הגנות</b>: מול קונים חזקים, לבחור קונים חלשים יותר, או לפתח הצעה שאי אפשר לסרב לה. מול ספקים חזקים, יחסים שבהם <b>כולם מרוויחים</b> (win-win), או הרבה מקורות אספקה.</p>`,q:"e11"},
  {h:"הערכה ובחירה: שיווק מבודל ולא מבודל",html:`<p>בהערכת פלח בודקים <b>שני דברים</b>: את האטרקטיביות הכוללת שלו (גודל, צמיחה, רווחיות, יתרון לגודל, סיכון נמוך), ואת <b>היעדים והמשאבים של העסק</b>. יש פלחים אטרקטיביים שלא מתאימים ליעדים, או שאין לעסק את הכשירויות לתת בהם ערך עדיף.</p><p><b>רצף רמות הפילוח</b>: בקצה אחד <b>שוק המונים</b> (פלח אחד), בקצה השני <b>יחידים</b> (כל אדם פלח). באמצע: ריבוי פלחים ופלחים בודדים.</p><p><b>שירות שוק מלא</b>: לשרת את כל הקבוצות בכל המוצרים. רק ענקיות יכולות, כמו מיקרוסופט וקוקה־קולה. יש שתי דרכים:</p><div class="tw"><table><tr><th></th><th>שיווק לא מבודל (המונים)</th><th>שיווק מבודל</th></tr><tr><td><b>מה עושים</b></td><td>מתעלמים מההבדלים, הצעה אחת לכל השוק, הפצה ותקשורת המונים</td><td>מוצרים שונים לכל פלח</td></tr><tr><td><b>מתי מתאים</b></td><td>כשלכולם העדפות דומות, ואין פלחים טבעיים</td><td>כשיש הבדלים בין הפלחים</td></tr><tr><td><b>עלויות ומכירות</b></td><td>עלויות נמוכות (קו מוצרים מוגבל). אבל פיצול השוק מייקר את ההגעה להמונים</td><td>בדרך כלל יותר מכירות, אבל גם יותר עלויות</td></tr></table></div>${rem("לגבי הרווחיות של שיווק מבודל, לפי הספר <b>אין תוקף להכללות</b>: המכירות עולות, אבל גם העלויות.")}`,q:"e12"}
 ]},
 {id:"tx",icon:"grad",title:"תרגול בסגנון המבחן",blocks:[
  {h:"שאלות מסכמות",html:`${def("על מה הנושא",`שאלות שמחברות בין חלקי הפרק: בסיסי הפילוח, הפילוח העסקי ובחירת שוק המטרה.`)}${rem("טיפ: כדי לזהות סוג פילוח, שאלו מה המשתנה. מקום: גיאוגרפי. מי האדם: דמוגרפי. איך הוא חושב וחי: פסיכוגרפי. מה הוא עושה עם המוצר: התנהגותי.")}`,q:"ex"}

<li><b>דמוגרפי</b>: פופולרי כי קשור לצרכים וקל למדידה.
<ul><li><b>גיל ומחזור חיים</b> (Crest, Pampers; ״הצעירים ברוחם״). <b>שלב בחיים</b>: הדאגה העיקרית (גירושין, טיפול בהורה).</li>
<li><b>מגדר</b>: הבדלים בהתנהגות בקנייה, שמצטמצמים. <b>הכנסה</b>: לא תמיד מנבאת. שוק ״שעון חול״ (Levi's).</li>
<li><b>קבוצות דוריות</b>: מילניום (1977–1994), X (1964–1978), בייבי בומרס (1946–1964), הדור השקט (1925–1945).</li>
<li><b>שיווק רב־תרבותי</b>: פנייה ייעודית לפלחים אתניים ותרבותיים.</li></ul></li>
<li><b>פסיכוגרפי</b>: תכונות, סגנון חיים וערכים. אותה דמוגרפיה, דיוקן שונה. <b>VALS</b>: שמונה קבוצות, לפי הנעה (שלוש מוטיבציות) ומשאבים.</li>
<li><b>התנהגותי</b>: ידע, עמדה, שימוש ותגובה.
<ul><li><b>צרכים ותועלות</b>.</li>
<li><b>חמישה תפקידי החלטה</b>: יוזם, משפיע, מחליט, קונה, משתמש (דוגמת ההליכון).</li>
<li><b>הזדמנויות</b> (עסקים, חופשה, משפחה).</li>
<li><b>מעמד משתמש</b>: מובילים מכוונים לפוטנציאליים, קטנים מכוונים למשתמשי המוביל.</li>
<li><b>שיעור שימוש</b>: הכבדים מעטים, אבל צורכים הרבה. לרוב נאמנים מאוד, או לא נאמנים בכלל.</li>
<li><b>שלב מוכנות</b> ומשפך שיווק (46% מול 61%).</li>
<li><b>נאמנות</b>: מושבעים (חוזקות), חצויה (מתחרים), העברה ומחליפים (חולשות). זהירות: נאמנות יכולה להיות הרגל או מחיר.</li>
<li><b>עמדה</b>: נלהבת, חיובית, אדישה, שלילית, עוינת.</li></ul></li>
</ul>
<h3>3. פילוח שווקים עסקיים (טבלה 6.2)</h3>
<ul>
<li>הדמוגרפיים הכי חשובים, אחריהם התפעוליים. חמש קבוצות: דמוגרפיים, תפעוליים, גישות רכש, גורמים מצביים, מאפיינים אישיים.</li>
<li><b>תהליך סדרתי</b>: דוגמת יצרנית האלומיניום (שוק קצה ← יישום ← גודל לקוח ← פלח שמונע משירות).</li>
<li><b>הצעה גמישה</b> (אנדרסון ונארוס): <b>פתרון עירום</b> שכולם מעריכים, ו<b>אופציות לבחירה</b> בתוספת מחיר.</li>
</ul>
<h3>4. סימון שוק המטרה</h3>
<ul>
<li><b>שבעת השלבים של בסט</b> (טבלה 6.3): פילוח לפי צרכים ← זיהוי פלח ← אטרקטיביות ← רווחיות ← מיצוב ← מבחן (״סיפורי פלח״) ← תמהיל שיווק.</li>
<li><b>חמישה תבחינים לפילוח יעיל</b>: מדידים, גדולים מספיק, נגישים, ניתנים לבידול, מאפשרים פעולה. (דוגמת המלח וצבע השיער.)</li>
<li><b>חמשת הכוחות של פורטר</b> (אטרקטיביות פלח): יריבות בפלח, מצטרפים פוטנציאליים, תחליפים, כוח קונים, כוח ספקים. חסמים: כניסה גבוהה ויציאה נמוכה הכי טוב; כניסה נמוכה ויציאה גבוהה הכי גרוע. מול ספקים: win-win או הרבה מקורות.</li>
<li><b>הערכה</b>: אטרקטיביות הפלח + יעדים ומשאבים של העסק.</li>
<li><b>רצף רמות</b>: שוק המונים ← ריבוי פלחים ← פלח בודד ← יחידים.</li>
<li><b>שירות שוק מלא</b> (מיקרוסופט, קוקה־קולה): <b>לא מבודל</b> (הצעה אחת, עלויות נמוכות, מתאים כשההעדפות דומות) או <b>מבודל</b> (מוצר לכל פלח, יותר מכירות ויותר עלויות, אין הכללה על הרווחיות).</li>
</ul>

function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const to=+el.dataset.count,suf=el.dataset.suffix||"",tot=el.dataset.total;
    if(REDUCED){el.textContent=to+suf;return}
    const t0=performance.now(),d=900;
    const f=now=>{const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e)+suf+(tot?"/"+tot:"");if(k<1)requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
  root.querySelectorAll(".ring[data-p]").forEach(r=>{requestAnimationFrame(()=>requestAnimationFrame(()=>r.style.setProperty("--p",r.dataset.p)))});
}

  app.querySelector("#next").onclick=()=>{if(!last)topic(ti,bi+1,"fwd");else{S.read[t.id]=1;delete S.pos[t.id];S.at={ti,quiz:1};save();quiz(ti)}};
  const pv=app.querySelector("#prev");if(pv)pv.onclick=()=>topic(ti,bi-1,"back");
  app.querySelectorAll(".mm-cta").forEach(b=>b.onclick=()=>mindmap(+b.dataset.map,()=>topic(ti,bi,"back")));
  checkBox(t,bi);
}

/* Definitions become term cards: only the name shows, a tap opens the full explanation underneath.
   Source blocks: tiles() squares (.tile), tiles() long cards (.cpt) and def() boxes, except the topic intro. */
const INTRO_LBL="על מה הנושא";
const isTerm=el=>el.matches(".tiles,.cpt")||(el.matches(".def")&&el.querySelector(".lbl")?.textContent.trim()!==INTRO_LBL);
function termItem(el){
  if(el.matches(".tile"))return{icon:el.querySelector("svg")?.outerHTML||"",name:el.querySelector("b").innerHTML,en:"",body:`<p class="td-lead">${el.querySelector("span").innerHTML}</p>`};
  if(el.matches(".cpt")){const h=el.querySelector(".cpt-h");return{icon:h.querySelector("svg")?.outerHTML||"",name:h.querySelector("b").innerHTML,en:"",body:[...el.children].filter(c=>c!==h).map(c=>c.outerHTML).join("")}}
  const lbl=el.querySelector(".lbl").textContent.trim(),p=el.querySelector("p").cloneNode(true),enEl=p.querySelector(".en");
  const en=enEl?enEl.textContent.replace(/[()]/g,"").trim():"";
  const name=lbl==="מושג מפתח"&&p.querySelector("mark")?p.querySelector("mark").textContent:lbl;
  if(enEl)enEl.remove();
  return{icon:ic(lbl==="מושג מפתח"?"bulb":"doc"),name,en,body:`<p class="td-lead">${p.innerHTML.replace(/^\s*:?\s*/,"")}</p>`};
}
let termSeq=0;
function enhanceTerms(root){
  if(!root)return;
  const kids=[...root.children],groups=[];let cur=null;
  for(const el of kids){if(isTerm(el)){if(!cur){cur=[];groups.push(cur)}cur.push(el)}else cur=null}
  for(const g of groups){
    const items=g.flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem);
    const id="tp"+(++termSeq),wrap=document.createElement("div");wrap.className="terms";
    wrap.innerHTML=`<div class="terms-head"><span>${items.length>1?`${items.length} מושגים · לחצו על מושג להסבר`:"מושג מפתח · לחצו להסבר"}</span>${items.length>1?`<span class="terms-count">0/${items.length}</span>`:""}</div>
     <div class="term-grid" data-n="${Math.min(items.length,4)}">${items.map((it,k)=>`<button class="term" style="--i:${k}" aria-expanded="false" aria-controls="${id}"><span class="term-ic">${it.icon}</span><span class="term-t"><span class="term-name">${it.name}</span>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</span><span class="term-go" aria-hidden="true"></span></button>`).join("")}</div>
     <div class="term-panel" id="${id}" role="region" hidden></div>`;
    g[0].before(wrap);g.forEach(el=>el.remove());
    const btns=[...wrap.querySelectorAll(".term")],panel=wrap.querySelector(".term-panel"),seen=new Set();let open=-1;
    const count=wrap.querySelector(".terms-count");
    const openAt=k=>{
      if(k===open){close();return}
      open=k;seen.add(k);const it=items[k];
      btns.forEach((b,j)=>{b.setAttribute("aria-expanded",j===k);b.classList.toggle("seen",seen.has(j))});
      if(count)count.textContent=`${seen.size}/${items.length}`;
      panel.innerHTML=`<div class="tp-in"><div class="tp-head"><span class="term-ic">${it.icon}</span><div class="tp-title"><h4>${it.name}</h4>${it.en?`<span class="term-en" dir="ltr" lang="en">${it.en}</span>`:""}</div><button class="tp-x" aria-label="סגירה">×</button></div>
       <div class="tp-body">${it.body}</div>
       ${items.length>1?`<div class="tp-foot"><span>${k+1} מתוך ${items.length}</span>${k+1<items.length?`<button class="tp-next"><span>המושג הבא: ${items[k+1].name}</span>${ic("arrowL")}</button>`:`<span class="tp-done">${seen.size===items.length?"עברתם על כל המושגים":"זה המושג האחרון בקבוצה"}</span>`}</div>`:""}</div>`;
      panel.hidden=false;panel.classList.remove("show");void panel.offsetWidth;panel.classList.add("show");
      panel.querySelector(".tp-x").onclick=close;
      const nx=panel.querySelector(".tp-next");if(nx)nx.onclick=()=>openAt(k+1);
      const r=panel.getBoundingClientRect();if(r.bottom>innerHeight||r.top<80)panel.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    };
    const close=()=>{open=-1;panel.hidden=true;btns.forEach(b=>b.setAttribute("aria-expanded","false"))};
    btns.forEach((b,k)=>b.onclick=()=>openAt(k));
  }
}

function runSet(title,ids,c,onEnd){
  let i=0,right=0;document.body.style.setProperty("--c",c);
  const step=()=>{
    if(i>=ids.length)return onEnd(right,ids.length);
    const id=ids[i],from=T.find(t=>t.id===Q[id].t);
    show(`<div class="stack quiz">${bar(title,ids.length,i,`שאלה ${i+1} מתוך ${ids.length}`)}<div id="slot"></div></div>`,i?"fwd":"up");
    app.querySelector("#back").onclick=()=>home("back");
    const card=qCard(id,ok=>{if(ok)right++;i++;step()},from.title);card.style.setProperty("--c",color(from));
    app.querySelector("#slot").appendChild(card);
  };step();
}

function quiz(ti){
  const t=T[ti];
  if(hardOn(t)){const weak=shuffle(t.qids.filter(id=>!mastered(id))).slice(0,2);
    return runSet(`מבחן הנושא · סבב ${rnd(t)} · שאלות הבנה`,shuffle(shuffle(t.hids).slice(0,Math.max(8,t.qids.length)).concat(weak)),color(t),(r,n)=>done(r,n,ti))}
  const prev=T.slice(0,ti).filter(topicStarted).flatMap(x=>x.qids);
  const extra=shuffle(prev).sort((a,b)=>st(a).c-st(b).c).slice(0,2);
  runSet(`מבחן סיום · ${t.title}`,shuffle(t.qids).concat(extra),color(t),(r,n)=>done(r,n,ti));
}

function review(){
  const pool=T.filter(topicStarted).flatMap(t=>S.done[t.id]?t.qids.concat(t.hids):t.qids),now=Date.now();
  const tw={};T.forEach(t=>tw[t.id]=(100-strength(t))/20);
  const score=id=>{const s=S.q[id]||{n:0,c:0,w:0,t:0};return (s.n?0:2)+s.w*2+(s.c<2?3:0)+Math.min(3,(now-s.t)/864e5)+tw[Q[id].t]+Math.random()*2};
  const ids=pool.map(id=>[id,score(id)]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  runSet("חזרה מהירה",shuffle(ids),"var(--accent)",(r,n)=>done(r,n,null));
}

function practice(ti){const t=T[ti];if(hardOn(t))return quiz(ti);runSet(`תרגול · ${t.title}`,shuffle(t.qids),color(t),(r,n)=>done(r,n,ti))}

/* Flashcards: front = the term and a prompt, back = the answer and an example.
   "יודע" removes the card from this round, "עוד לא" sends it to the end of the deck. */
function flashcards(only){
  S.cards=S.cards||{};
  let deck=shuffle((only||DECK.map((_,k)=>k)));const total=deck.length,known=new Set(),missed=new Set();let flipped=false;
  const topicOf=c=>T.find(t=>t.id===c.t);
  const step=dir=>{
    if(!deck.length)return cardsDone(total,known,missed);
    const k=deck[0],c=DECK[k],t=topicOf(c),pos=total-deck.length;flipped=false;
    document.body.style.setProperty("--c",t?color(t):"var(--accent)");
    show(`<div class="stack fc-view">${bar("כרטיסיות לימוד",total,pos,`נשארו ${deck.length} · ידעת ${known.size}`)}
     <div class="fc-stage"><button class="fc" id="fc" aria-label="הפיכת הכרטיס" aria-pressed="false">
      <span class="fc-face fc-front"><span class="fc-topic">${t?`נושא ${T.indexOf(t)+1} · ${t.title}`:""}</span><span class="fc-term">${c.f}</span><span class="fc-q">${c.q}</span><span class="fc-hint">${ic("flip")}<span>לחצו כדי להפוך</span></span></span>
      <span class="fc-face fc-back"><span class="fc-topic">${c.f}</span><span class="fc-ans">${c.b}</span>${c.ex?`<span class="fc-ex"><b>דוגמה:</b> ${c.ex}</span>`:""}</span>
     </button></div>
     <div class="fc-actions" aria-live="polite"><p class="fc-tip">נסו לענות בראש, ורק אז הפכו את הכרטיס.</p></div></div>`,dir);
    app.querySelector("#back").onclick=()=>home("back");
    const card=app.querySelector("#fc"),acts=app.querySelector(".fc-actions");
    const flip=()=>{flipped=!flipped;card.classList.toggle("flipped",flipped);card.setAttribute("aria-pressed",flipped);
      if(flipped&&!acts.querySelector(".fc-btns")){acts.innerHTML=`<div class="fc-btns"><button class="fc-no" id="no">${ic("cycle")}<span>עוד לא</span></button><button class="primary fc-yes" id="yes">${ic("check")}<span>ידעתי</span></button></div>`;
        acts.querySelector("#yes").onclick=()=>{known.add(k);S.cards[k]=1;save();deck.shift();step("fwd")};
        acts.querySelector("#no").onclick=()=>{missed.add(k);S.cards[k]=0;save();deck.push(deck.shift());step("fwd")};}};
    card.onclick=flip;
    document.onkeydown=e=>{if(!document.body.contains(card))return document.onkeydown=null;if(e.key===" "||e.key==="Enter"){if(document.activeElement===card||document.activeElement===document.body){e.preventDefault();flip()}}};
  };
  step("up");
}
/* Mind map: one level at a time. The current node sits in the middle, its children around it.
   A branch opens into its own ring; a leaf opens its explanation under the map. */

function mindmap(mi,onBack){
  const M=MAPSET[mi],seen=new Set();
  const tint=(n,c)=>{n._c=c;(n.c||[]).forEach(x=>tint(x,c))};
  M.root._c="var(--accent)";M.root.c.forEach((b,k)=>tint(b,`var(--t${k%8+1})`));
  const leaves=n=>n.c?n.c.flatMap(leaves):[n],total=leaves(M.root).length;
  let path=[M.root],sel=null;
  document.body.style.setProperty("--c","var(--accent)");
  show(`<div class="stack mm-view"><div class="topbar"><div class="topline"><button class="ghost back" id="back">${ic("arrowR")}<span>${onBack?"חזרה לנושא":"כל הנושאים"}</span></button><span class="prog" id="mmc">0 מתוך ${total} מושגים</span></div></div>
   <div class="mm-head"><span class="eyebrow">מפת חשיבה</span><h2>${M.title}</h2><p class="muted">לחצו על ענף כדי לפתוח אותו, ועל מושג כדי לקרוא עליו. לחיצה על המרכז חוזרת רמה אחת אחורה.</p></div>
   <nav class="mm-crumbs" id="mmb" aria-label="מיקום במפה"></nav>
   <div class="mm" id="mm"><svg class="mm-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
   <div class="mm-detail" id="mmd" aria-live="polite"></div></div>`,"up");
  app.querySelector("#back").onclick=onBack||(()=>home("back"));
  const box=app.querySelector("#mm"),svg=box.querySelector("svg"),det=app.querySelector("#mmd"),crumbs=app.querySelector("#mmb");
  const enLine=n=>n.en?`<span class="mm-en" dir="ltr" lang="en">${n.en}</span>`:"";
  const detail=(n,isBranch)=>{
    const sib=path[path.length-1].c||[],k=sib.indexOf(n),next=!isBranch?sib.slice(k+1).find(x=>!x.c):null;
    det.style.setProperty("--c",n._c);
    det.innerHTML=`<div class="mmd-in"><div class="mmd-h"><span class="mmd-dot"></span><div><h3>${n.n}</h3>${enLine(n)}</div></div><div class="mmd-body">${n.d}</div>${n.ex?`<div class="mmd-ex"><b>דוגמה:</b> ${n.ex}</div>`:""}
     ${isBranch?`<p class="mmd-note">${n.c.some(x=>x.c)?`${n.c.length} ענפים. לחצו על ענף כדי לפתוח אותו.`:`${n.c.length} מושגים בענף הזה. לחצו על מושג כדי לקרוא עליו.`}</p>`:next?`<button class="mmd-next">${ic("arrowL")}<span>המושג הבא: ${next.n}</span></button>`:""}</div>`;
    det.classList.remove("show");void det.offsetWidth;det.classList.add("show");
    const nb=det.querySelector(".mmd-next");if(nb)nb.onclick=()=>pick(next);
  };
  const pick=n=>{if(n.c){path.push(n);sel=null;render();detail(n,true);return}
    sel=n;seen.add(n);app.querySelector("#mmc").textContent=`${seen.size} מתוך ${total} מושגים`;
    box.querySelectorAll(".mm-node.kid").forEach(b=>{const on=b._n===n;b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);if(seen.has(b._n))b.classList.add("seen")});
    detail(n,false);if(det.getBoundingClientRect().top>innerHeight-120)det.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"})};
  const render=()=>{
    const cur=path[path.length-1],kids=cur.c||[],n=kids.length;
    crumbs.innerHTML=path.map((p,k)=>k<path.length-1?`<button data-k="${k}">${p.n}</button><span aria-hidden="true">‹</span>`:`<b>${p.n}</b>`).join("");
    crumbs.querySelectorAll("button").forEach(b=>b.onclick=()=>{path=path.slice(0,+b.dataset.k+1);sel=null;render();det.innerHTML=""});
    box.querySelectorAll(".mm-node").forEach(e=>e.remove());
    const wide=box.clientWidth>620,rx=wide?36:34,ry=wide?37:39;
    const pos=kids.map((_,k)=>{const a=(-90+360*k/n)*Math.PI/180;return[50+rx*Math.cos(a),50+ry*Math.sin(a)]});
    svg.innerHTML=pos.map(([x,y],k)=>{const mx=(50+x)/2+(y-50)*.12,my=(50+y)/2-(x-50)*.12;return `<path d="M50 50Q${mx.toFixed(2)} ${my.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)}" pathLength="1" style="--c:${kids[k]._c};--i:${k}"/>`}).join("");
    const ctr=document.createElement("button");ctr.className="mm-node center";ctr.style.setProperty("--c",cur._c);
    ctr.innerHTML=`<span class="mm-n">${cur.n}</span>${enLine(cur)}${path.length>1?`<span class="mm-up">${ic("arrowR")} חזרה</span>`:""}`;
    ctr.setAttribute("aria-label",path.length>1?`${cur.n}, חזרה רמה אחת`:cur.n);
    ctr.onclick=()=>{if(path.length>1){path.pop();sel=null;render();det.innerHTML=""}else detail(cur,true)};
    box.appendChild(ctr);
    kids.forEach((k2,k)=>{const b=document.createElement("button");b._n=k2;
      b.className="mm-node kid "+(k2.c?"branch":"leaf")+(seen.has(k2)?" seen":"");b.style.cssText=`--c:${k2._c};--x:${pos[k][0]}%;--y:${pos[k][1]}%;--i:${k}`;
      b.innerHTML=`<span class="mm-n">${k2.n}</span>${k2.c?`<span class="mm-cnt">${k2.c.length} מושגים</span>`:enLine(k2)}`;
      if(!k2.c)b.setAttribute("aria-pressed","false");
      b.onclick=()=>pick(k2);box.appendChild(b)});
    box.classList.remove("mm-go");void box.offsetWidth;box.classList.add("mm-go");
  };
  render();detail(M.root,true);
}
function cardsDone(total,known,missed){

  const miss=[...missed],n=total-miss.length,pct=Math.round(100*n/total);

   <article class="card score">
    <span class="eyebrow">סיום כרטיסיות</span>
    <div class="score-row">${ring(pct,`<b data-count="${pct}" data-suffix="%">${REDUCED?pct+"%":"0%"}</b>`)}<div><div class="big"><span data-count="${n}">${REDUCED?n:0}</span><small>/${total} ידעת בסיבוב הראשון</small></div>
    <p>${miss.length?"כרטיסים שסימנת ״עוד לא״ חזרו לסוף החפיסה עד שידעת אותם. אפשר לעבור עליהם שוב בנפרד.":"מצוין, ידעת את כל הכרטיסים."}</p></div></div>
    <div class="row">${miss.length?`<button class="primary" id="again-miss">${ic("cycle")}<span>שוב רק את ${miss.length} שהתקשיתי בהם</span></button>`:""}<button id="again-all">${ic("cards")}<span>כל הכרטיסים מחדש</span></button><button id="hm">לכל הנושאים</button></div>
   </article></div>`,"up");
  app.querySelector("#back").onclick=()=>home("back");app.querySelector("#hm").onclick=()=>home("back");
  app.querySelector("#again-all").onclick=()=>flashcards();
  const am=app.querySelector("#again-miss");if(am)am.onclick=()=>flashcards(miss);
  countUp(app);
}

/* Every module gets flashcards and a mind map. A hand-written CARDS or MAPS file wins;
   otherwise both are built from the module's own definitions (tiles, long concept cards, def boxes). */
const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim()};
function deriveTerms(){
  return T.flatMap((t,ti)=>t.blocks.map((blk,bi)=>{const d=document.createElement("div");d.innerHTML=blk.html;
    const items=[...d.children].filter(isTerm).flatMap(el=>el.matches(".tiles")?[...el.children]:[el]).map(termItem).filter(x=>strip(x.name));
    return{t,ti,bi,h:blk.h,items}}).filter(b=>b.items.length));
}
function autoCards(blocks){
  const byTopic=T.map(t=>blocks.filter(b=>b.t===t).flatMap(b=>b.items.map(it=>({it,t})))
    .sort((a,b)=>strip(b.it.body).length-strip(a.it.body).length));
  const out=[],used=new Set();
  for(let r=0;out.length<12&&byTopic.some(x=>x.length>r);r++)for(const list of byTopic){if(out.length>=12)break;const x=list[r];if(!x)continue;const key=strip(x.it.name);if(used.has(key))continue;used.add(key);
    const hasEx=/cpt-ex/.test(x.it.body);out.push({t:x.t.id,f:x.it.name,q:hasEx?"מה זה? נסו גם לחשוב על דוגמה":"מה ההגדרה?",b:x.it.body,ex:""})}
  return out;
}
function autoMap(blocks){
  const chunk=(name,items)=>{const leaves=items.map(it=>({n:it.name,en:it.en,d:it.body}));if(leaves.length<=8)return[{n:name,c:leaves}];
    const parts=Math.ceil(leaves.length/7);return Array.from({length:parts},(_,k)=>({n:`${name} (${k+1}/${parts})`,c:leaves.slice(k*7,k*7+7)}))};
  const kids=T.map(t=>{const bs=blocks.filter(b=>b.t===t);if(!bs.length)return null;
    const sub=bs.flatMap(b=>chunk(b.h,b.items));
    const c=sub.length===1?sub[0].c:sub.map(s=>({n:s.n,d:`${s.c.length} מושגים מהקטע ״${s.n}״.`,c:s.c}));
    return{n:t.title,d:`נושא ${T.indexOf(t)+1} בלומדה. ${c.length} ${sub.length===1?"מושגים":"קטעים"} בענף.`,c}}).filter(Boolean);
  if(kids.length<2)return null;
  return{id:"module",title:"מפת הלומדה",sub:"כל הנושאים והמושגים במבט אחד",root:{n:CONFIG.he||CONFIG.title,d:CONFIG.about||"כל הנושאים של הלומדה. לחצו על נושא כדי לפתוח את המושגים שלו.",c:kids}};
}
const TERM_BLOCKS=deriveTerms();
const DECK=typeof CARDS!=="undefined"&&CARDS.length?CARDS:autoCards(TERM_BLOCKS);
const MAPSET=(typeof MAPS!=="undefined"?MAPS:[]).concat([autoMap(TERM_BLOCKS)].filter(Boolean));
